name: Temporary Issue 1153 oracle / Ruff probe
on:
  push:
    branches:
      - test/issue1153-file-store-gap-parity-oracle-20261109
permissions:
  contents: read
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  oracle:
    name: Scoped Ruff diff and file/store gap oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Print the exact Ruff formatting difference without changing source
        run: uv run ruff format --diff tests/integrations/market_store/test_checksum_and_parse.py
      - name: Execute the scoped source-clock parity oracle
        run: uv run pytest -q tests/integrations/market_store/test_checksum_and_parse.py -k file_backed_gap_policies
