name: A4 Orchestrator Format

on:
  push:
    branches:
      - agent/stage-a4-triplet-stage-orchestrator

permissions:
  contents: write

concurrency:
  group: a4-orchestrator-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: agent/stage-a4-triplet-stage-orchestrator
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Format and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/workflows/symbol_triplet_stage_orchestrator.py
          rm .github/workflows/a4-orchestrator-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/symbol_triplet_stage_orchestrator.py .github/workflows/a4-orchestrator-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format symbol-triplet stage orchestrator"
          git push origin HEAD:agent/stage-a4-triplet-stage-orchestrator
