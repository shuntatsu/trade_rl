name: Apply A6b Evaluator Bundle

on:
  push:
    branches: [agent/stage-a6b-production-evaluator]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-a6b-production-evaluator
          fetch-depth: 0
      - name: Verify and extract bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .a6b-bundle/part-* > /tmp/a6b-bundle.b64
          base64 --decode /tmp/a6b-bundle.b64 > /tmp/a6b-bundle.tgz
          echo "a8c61d4744bce3bc06456bde107a2b3d1ac78337a3857424ef5631a620b51f4e  /tmp/a6b-bundle.tgz" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          import tarfile

          allowed = {
              'docs/operations/stage-a-production-evaluator-design.md',
              'docs/operations/stage-a-production-evaluator-plan.md',
              'docs/operations/stage-a-zero-shot-evaluation-plan.md',
              'trade_rl/workflows/stage_a_execution_replay.py',
              'trade_rl/workflows/stage_a_execution_store.py',
              'trade_rl/workflows/stage_a_production_evaluator.py',
              'tests/workflows/test_stage_a_execution_replay.py',
              'tests/workflows/test_stage_a_execution_store.py',
              'tests/workflows/test_stage_a_production_evaluator.py',
              'tests/workflows/test_stage_a_production_orchestration.py',
          }
          with tarfile.open('/tmp/a6b-bundle.tgz', 'r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(allowed) or set(names) != allowed:
                  raise SystemExit(f'unexpected bundle paths: {names!r}')
              for member in members:
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe bundle member: {member.name}')
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'unsafe bundle path: {member.name}')
                  source = handle.extractfile(member)
                  if source is None:
                      raise SystemExit(f'bundle member has no bytes: {member.name}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY
          rm -rf .a6b-bundle
          git diff --check
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: feat: connect Stage A to verified execution artifacts
          branch: agent/stage-a6b-production-evaluator
          file_pattern: docs/operations trade_rl/workflows tests/workflows .a6b-bundle
