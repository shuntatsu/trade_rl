name: A6b2 Task4 Format

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/stage-a6b2-policy-producer-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-policy-producer-v2
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install development tools
        run: uv sync --extra dev
      - name: Format Task 4 test
        run: uv run ruff format tests/workflows/test_stage_a_policy_producer_orchestration.py
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workflows/test_stage_a_policy_producer_orchestration.py
          git diff --cached --check
          git commit -m 'style: format Stage A Task 4 tests'
          git push origin HEAD:agent/stage-a6b2-policy-producer-v2
