name: A6b2 Verified Bundle Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-bundle:
    if: github.event.pull_request.head.ref == 'agent/stage-a6b2-policy-producer'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-policy-producer
          persist-credentials: true
          fetch-depth: 0
      - name: Reconstruct and apply verified implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .a6b2.bundle.mid0 ]]; then
            echo "No implementation bundle chunks on this head"
            exit 0
          fi
          python - <<'PY'
          import base64
          import hashlib
          import subprocess
          import tarfile
          from pathlib import Path

          expected_prefix_digest = (
              'baacec40f1eeecde22bbf9b6d0182353853ff7bd4f706b83d80db6cb81df440f'
          )

          def revisions_for(path: str) -> list[str]:
              return subprocess.check_output(
                  ['git', 'rev-list', '--all', '--', path], text=True
              ).splitlines()

          def file_at(commit: str, path: str) -> bytes | None:
              try:
                  return subprocess.check_output(
                      ['git', 'show', f'{commit}:{path}'], stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  return None

          recovered_prefix = None
          recovered_source = None
          prefix_path = '.a6b2.bundle.prefix'
          for commit in revisions_for(prefix_path):
              candidate = file_at(commit, prefix_path)
              if candidate is None:
                  continue
              if hashlib.sha256(candidate).hexdigest() == expected_prefix_digest:
                  recovered_prefix = candidate
                  recovered_source = f'{commit}:{prefix_path}'
                  break

          full_path = '.a6b2-implementation.bundle.b64'
          if recovered_prefix is None:
              for commit in revisions_for(full_path):
                  candidate = file_at(commit, full_path)
                  if candidate is None or len(candidate) < 10000:
                      continue
                  prefix = candidate[:10000]
                  if hashlib.sha256(prefix).hexdigest() == expected_prefix_digest:
                      recovered_prefix = prefix
                      recovered_source = f'{commit}:{full_path}[0:10000]'
                      break

          if recovered_prefix is None or recovered_source is None:
              diagnostics: list[str] = []
              for path in (prefix_path, full_path):
                  for commit in revisions_for(path)[:20]:
                      candidate = file_at(commit, path)
                      if candidate is None:
                          continue
                      sample = candidate if path == prefix_path else candidate[:10000]
                      diagnostics.append(
                          f'{commit}:{path} len={len(candidate)} '
                          f'prefix_sha256={hashlib.sha256(sample).hexdigest()}'
                      )
              raise SystemExit(
                  'Verified historical prefix was not found in any fetched ref; '
                  + '; '.join(diagnostics)
              )
          print(f'recovered verified prefix from {recovered_source}')

          paths = (
              Path('.a6b2.bundle.mid0'),
              Path('.a6b2.bundle.mid1'),
              Path('.a6b2.bundle.mid2'),
              Path('.a6b2.bundle.suffix'),
          )
          expected_lengths = (9252, 9252, 9252, 10000)
          expected_digests = (
              'af54beb3d4f2f39646f0f91e66d8d32b070bc88c7892866d93775065438b1f8a',
              'baa4e46cd52c3c36c2f17d2ac3baf045c65588a35c18119986ca4e85d2d88ab7',
              'd97a674d08feb18478479b968ef1c2fee23d65a0dcf164c95e1c9e8efba0996c',
              '1346646617219f7f77ce61c5b4152bd2ed2799b991423d9c08f4ff1e82540aa1',
          )
          segments = tuple(path.read_bytes() for path in paths)
          for index, (segment, length, expected) in enumerate(
              zip(segments, expected_lengths, expected_digests, strict=True), start=1
          ):
              if len(segment) != length:
                  raise SystemExit(f'segment {index} length mismatch: {len(segment)}')
              actual = hashlib.sha256(segment).hexdigest()
              if actual != expected:
                  raise SystemExit(f'segment {index} digest mismatch: {actual}')

          encoded = b''.join((recovered_prefix, *segments))
          encoded_digest = hashlib.sha256(encoded).hexdigest()
          if encoded_digest != '3a7786186937ec4df96fbbd5b405ee49edcbb227387afcb68e78b311feea4cdf':
              raise SystemExit(f'encoded bundle digest mismatch: {encoded_digest}')
          archive_bytes = base64.b64decode(encoded, validate=True)
          archive_digest = hashlib.sha256(archive_bytes).hexdigest()
          if archive_digest != '9bc62d7c7c2dd039f4b32678eb95a7f3a230eccd5c207bc404cf417bd3d6f829':
              raise SystemExit(f'archive digest mismatch: {archive_digest}')
          archive_path = Path('/tmp/a6b2-files.tar.gz')
          archive_path.write_bytes(archive_bytes)
          expected_paths = {
              'docs/operations/stage-a-production-evaluator-design.md',
              'docs/operations/stage-a-zero-shot-evaluation-plan.md',
              'docs/superpowers/specs/2026-07-31-stage-a-policy-producer-design.md',
              'docs/superpowers/plans/2026-07-31-stage-a-policy-producer.md',
              'tests/workflows/test_stage_a_execution_replay.py',
              'tests/workflows/test_stage_a_execution_store.py',
              'tests/workflows/test_stage_a_production_evaluator.py',
              'tests/workflows/test_stage_a_production_orchestration.py',
              'tests/workflows/test_stage_a_policy_source.py',
              'tests/workflows/test_stage_a_execution_producer.py',
              'tests/workflows/test_stage_a_policy_producer_orchestration.py',
              'trade_rl/workflows/stage_a_execution_replay.py',
              'trade_rl/workflows/stage_a_execution_store.py',
              'trade_rl/workflows/stage_a_production_evaluator.py',
              'trade_rl/workflows/stage_a_policy_source.py',
              'trade_rl/workflows/stage_a_execution_producer.py',
          }
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected_paths:
                  raise SystemExit(f'Bundle path closure mismatch: {sorted(names ^ expected_paths)}')
              if len(members) != len(expected_paths):
                  raise SystemExit('Bundle contains duplicate paths')
              if any(not member.isfile() for member in members):
                  raise SystemExit('Bundle contains a non-file member')
              archive.extractall('.', filter='data')
          PY
          rm -f .a6b2-implementation.bundle.b64 .a6b2.bundle.prefix .a6b2.bundle.mid0 .a6b2.bundle.mid1 .a6b2.bundle.mid2 .a6b2.bundle.suffix .a6b2-source-export-trigger .github/workflows/a6b2-source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bind Stage A executions to retained checkpoints'
          git push origin HEAD:agent/stage-a6b2-policy-producer
