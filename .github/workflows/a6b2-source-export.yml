name: A6b2 Bundle Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect-bundle:
    if: github.event.pull_request.head.ref == 'agent/stage-a6b2-policy-producer'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Inspect staged bundle
        shell: bash
        run: |
          set -euo pipefail
          wc -c .a6b2-implementation.bundle.b64
          sha256sum .a6b2-implementation.bundle.b64
          tail -c 64 .a6b2-implementation.bundle.b64 | od -An -tx1
