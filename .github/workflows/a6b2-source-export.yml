name: A6b2 Verified Bundle Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-bundle:
    if: github.event.pull_request.head.ref == 'agent/stage-a6b2-policy-producer'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-policy-producer
          persist-credentials: true
      - name: Reconstruct and apply verified implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .a6b2-implementation.bundle.b64 ]]; then
            echo "No implementation bundle on this head"
            exit 0
          fi
          python - <<'PY'
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          encoded_path = Path('.a6b2-implementation.bundle.b64')
          if encoded_path.is_symlink() or not encoded_path.is_file():
              raise SystemExit('Implementation bundle must be a regular file')
          wrapped = encoded_path.read_bytes()
          encoded = b''.join(wrapped.split())
          removed = len(wrapped) - len(encoded)
          print(
              'encoded bundle '
              f'wrapped_bytes={len(wrapped)} canonical_bytes={len(encoded)} '
              f'whitespace_removed={removed} sha256={hashlib.sha256(encoded).hexdigest()}'
          )
          archive_bytes = base64.b64decode(encoded, validate=True)
          print(
              'decoded archive '
              f'bytes={len(archive_bytes)} sha256={hashlib.sha256(archive_bytes).hexdigest()}'
          )
          archive_path = Path('/tmp/a6b2-files.tar.gz')
          archive_path.write_bytes(archive_bytes)
          expected_paths = {
              'docs/operations/stage-a-production-evaluator-design.md',
              'docs/operations/stage-a-zero-shot-evaluation-plan.md',
              'docs/superpowers/specs/2026-07-31-stage-a-policy-producer-design.md',
              'docs/superpowers/plans/2026-07-31-stage-a-policy-producer.md',
              'tests/workflows/test_stage_a_execution_replay.py',
              'tests/workflows/test_stage_a_execution_store.py',
              'tests/workflows/test_stage_a_production_evaluator.py',
              'tests/workflows/test_stage_a_production_orchestration.py',
              'tests/workflows/test_stage_a_policy_source.py',
              'tests/workflows/test_stage_a_execution_producer.py',
              'tests/workflows/test_stage_a_policy_producer_orchestration.py',
              'trade_rl/workflows/stage_a_execution_replay.py',
              'trade_rl/workflows/stage_a_execution_store.py',
              'trade_rl/workflows/stage_a_production_evaluator.py',
              'trade_rl/workflows/stage_a_policy_source.py',
              'trade_rl/workflows/stage_a_execution_producer.py',
          }
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected_paths:
                  raise SystemExit(f'Bundle path closure mismatch: {sorted(names ^ expected_paths)}')
              if len(members) != len(expected_paths):
                  raise SystemExit('Bundle contains duplicate paths')
              if any(not member.isfile() for member in members):
                  raise SystemExit('Bundle contains a non-file member')
              archive.extractall('.', filter='data')
          PY
          rm -f .a6b2-implementation.bundle.b64 .a6b2.bundle.prefix .a6b2.bundle.mid0 .a6b2.bundle.mid1 .a6b2.bundle.mid2 .a6b2.bundle.suffix .a6b2-source-export-trigger .github/workflows/a6b2-source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bind Stage A executions to retained checkpoints'
          git push origin HEAD:agent/stage-a6b2-policy-producer
