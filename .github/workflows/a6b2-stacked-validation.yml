name: A6b2 Stacked Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: a6b2-stacked-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-contracts:
    if: github.event.pull_request.head.ref == 'agent/stage-a6b2-policy-producer-v2'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout combined merge ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install Python environments
        run: uv sync --extra dev --extra export --extra train-sb3
      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .
      - name: Ruff
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: MyPy
        run: uv run mypy trade_rl tests
      - name: Import boundaries
        run: uv run lint-imports
      - name: Dead code
        run: uv run vulture trade_rl scripts --min-confidence 100
      - name: Focused A6b2 contracts
        run: |
          uv run pytest -q \
            tests/workflows/test_stage_a_policy_source.py \
            tests/workflows/test_stage_a_policy_source_serving.py \
            tests/workflows/test_stage_a_execution_producer.py \
            tests/workflows/test_stage_a_policy_producer_orchestration.py
      - name: Full Python suite
        run: uv run pytest -q
