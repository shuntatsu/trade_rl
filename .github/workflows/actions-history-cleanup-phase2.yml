name: Actions history cleanup phase 2

on:
  pull_request:
    branches:
      - ops/actions-history-cleanup-phase2-base-20260912
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/actions-history-cleanup-phase2.yml
      - tools/maintenance/cleanup_actions_history_phase2.py

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: actions-history-cleanup-phase2
  cancel-in-progress: true

env:
  DRY_RUN: "false"
  MAX_DELETE: "1500"
  RECENT_HOURS: "168"
  CLEANUP_HEAD_BRANCH: ops/actions-history-cleanup-phase2-20260912
  CLEANUP_BASE_BRANCH: ops/actions-history-cleanup-phase2-base-20260912

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact cleanup PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify phase-2 classification contracts
        run: python tools/maintenance/cleanup_actions_history_phase2.py --self-test

      - name: Delete strictly safe phase-2 workflow-run history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maintenance/cleanup_actions_history_phase2.py

      - name: Close temporary cleanup PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/dev/null

      - name: Remove temporary cleanup head branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ops/actions-history-cleanup-phase2-20260912
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"

      - name: Remove temporary cleanup base branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ops/actions-history-cleanup-phase2-base-20260912
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
