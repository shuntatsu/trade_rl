name: Actions history cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/actions-history-cleanup.yml
      - tools/maintenance/cleanup_actions_history.py

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: actions-history-cleanup
  cancel-in-progress: true

env:
  DRY_RUN: "true"
  MAX_DELETE: "3000"
  RECENT_HOURS: "72"
  CURRENT_WORKFLOW_PATH: .github/workflows/actions-history-cleanup.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact cleanup PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify cleanup classification contracts
        run: python tools/maintenance/cleanup_actions_history.py --self-test

      - name: Classify workflow-run history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maintenance/cleanup_actions_history.py
