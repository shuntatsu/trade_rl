name: Actions history cleanup

on:
  push:
    branches:
      - ops/actions-history-cleanup-20260912
    paths:
      - .github/workflows/actions-history-cleanup.yml
      - tools/maintenance/cleanup_actions_history.py

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: actions-history-cleanup
  cancel-in-progress: false

env:
  DRY_RUN: "true"
  MAX_DELETE: "3000"
  RECENT_HOURS: "72"
  CURRENT_WORKFLOW_PATH: .github/workflows/actions-history-cleanup.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify cleanup classification contracts
        run: python tools/maintenance/cleanup_actions_history.py --self-test

      - name: Classify and clean workflow-run history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maintenance/cleanup_actions_history.py

      - name: Remove temporary cleanup branch after execute
        if: ${{ success() && env.DRY_RUN == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ops/actions-history-cleanup-20260912
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
