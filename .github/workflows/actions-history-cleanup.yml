name: Actions history cleanup

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/actions-history-cleanup.yml
      - tools/maintenance/cleanup_actions_history.py

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: actions-history-cleanup
  cancel-in-progress: true

env:
  DRY_RUN: "false"
  MAX_DELETE: "3000"
  RECENT_HOURS: "72"
  CURRENT_WORKFLOW_PATH: .github/workflows/actions-history-cleanup.yml
  CLEANUP_BRANCH: ops/actions-history-cleanup-20260912

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact cleanup PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify cleanup classification contracts
        run: python tools/maintenance/cleanup_actions_history.py --self-test

      - name: Delete strictly safe workflow-run history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/maintenance/cleanup_actions_history.py

      - name: Close temporary cleanup PR
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"state":"closed"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/dev/null

      - name: Remove temporary cleanup branch
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ops/actions-history-cleanup-20260912
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
