name: Add accumulator state version

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: add-accumulator-state-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add public state-version boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/lagrangian_statistics.py")
          content = path.read_text()
          old = '''        self._episode_elapsed_hours = np.zeros(n_envs, dtype=np.float64)\n        self._episode_step_counts = np.zeros(n_envs, dtype=np.int64)\n\n    def _validated_rollout('''
          new = '''        self._episode_elapsed_hours = np.zeros(n_envs, dtype=np.float64)\n        self._episode_step_counts = np.zeros(n_envs, dtype=np.int64)\n\n    @property\n    def state_version(self) -> str:\n        """Return the checkpoint schema version for unfinished episodes."""\n\n        return self._STATE_VERSION\n\n    def _validated_rollout('''
          if content.count(old) != 1:
              raise SystemExit("accumulator insertion point mismatch")
          path.write_text(content.replace(old, new))
          PY
          rm .github/workflows/add-accumulator-state-version.yml
          git add -A
          git diff --cached --check

      - name: Commit state-version boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: expose accumulator state version"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
