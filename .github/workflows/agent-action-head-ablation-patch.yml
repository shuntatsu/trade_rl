name: Agent action-head ablation patch

on:
  push:
    branches:
      - agent/action-head-ablation-v1
    paths:
      - .github/workflows/agent-action-head-ablation-patch.yml
      - tools/apply_action_head_ablation_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact patch
        run: python tools/apply_action_head_ablation_patch.py
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl tests examples docs
          if git diff --cached --quiet; then
            echo "No implementation changes were generated"
            exit 0
          fi
          git commit -m "feat: implement controlled action-head ablation"
          git push origin HEAD:agent/action-head-ablation-v1
