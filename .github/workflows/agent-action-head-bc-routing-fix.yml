name: Agent action-head BC routing fix

on:
  push:
    branches:
      - agent/action-head-ablation-v1
    paths:
      - .github/workflows/agent-action-head-bc-routing-fix.yml

permissions:
  contents: write

concurrency:
  group: agent-action-head-bc-routing-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - name: Apply reviewed BC routing fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _hierarchical_teacher_labels(")
          end = text.index("def _hierarchical_behavior_cloning_config(", start)
          helper = '''def _uses_hierarchical_actor_head(policy: object) -> bool:
              return (
                  getattr(policy, "shared_actor_head", None)
                  == "hierarchical_gate_target_v1"
                  and callable(getattr(policy, "hierarchical_actor_outputs", None))
              )


          '''
          text = text[:start] + helper + text[end:]
          old = (
              "if callable(\n"
              + " " * 28
              + 'getattr(model.policy, "hierarchical_actor_outputs", None)\n'
              + " " * 24
              + ")"
          )
          new = "if _uses_hierarchical_actor_head(model.policy)"
          if text.count(old) != 1:
              raise SystemExit("direct BC routing expression did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          design = Path("docs/superpowers/specs/2026-07-30-action-head-ablation-design.md")
          text = design.read_text(encoding="utf-8")
          old = "6. v2/v3 identities fail with migration errors;"
          new = "6. v2 identities fail and existing hierarchical v3 identities remain readable for migration;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("identity migration statement is missing")
          design.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/agent-action-head-bc-routing-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py \
            tests/integrations/test_action_head_bc_routing.py \
            docs/superpowers/specs/2026-07-30-action-head-ablation-design.md \
            .github/workflows/agent-action-head-bc-routing-fix.yml
          git commit -m "fix: route direct BC by actor-head identity"
          git push origin HEAD:agent/action-head-ablation-v1
