name: Agent action-head final format

on:
  push:
    branches:
      - agent/action-head-ablation-v1
    paths:
      - .github/workflows/agent-action-head-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _uses_hierarchical_actor_head(policy: object) -> bool:
              return (
                  getattr(policy, "shared_actor_head", None)
                  == "hierarchical_gate_target_v1"
                  and callable(getattr(policy, "hierarchical_actor_outputs", None))
              )
          '''
          new = '''def _uses_hierarchical_actor_head(policy: object) -> bool:
              return getattr(
                  policy, "shared_actor_head", None
              ) == "hierarchical_gate_target_v1" and callable(
                  getattr(policy, "hierarchical_actor_outputs", None)
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("format target did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/agent-action-head-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py \
            .github/workflows/agent-action-head-final-format.yml
          git commit -m "style: apply final action-head formatting"
          git push origin HEAD:agent/action-head-ablation-v1
