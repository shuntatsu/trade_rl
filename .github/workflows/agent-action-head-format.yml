name: Agent action-head format

on:
  push:
    branches:
      - agent/action-head-ablation-v1
    paths:
      - .github/workflows/agent-action-head-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply canonical Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix .
          uv run ruff format .
          rm .github/workflows/agent-action-head-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:agent/action-head-ablation-v1
