name: Agent action-head test contract fix

on:
  push:
    branches:
      - agent/action-head-ablation-v1
    paths:
      - .github/workflows/agent-action-head-test-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - name: Restore compatible hierarchical label helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _uses_hierarchical_actor_head(")
          end = text.index("def _hierarchical_behavior_cloning_config(", start)
          replacement = '''def _uses_hierarchical_actor_head(policy: object) -> bool:
              actor_head = getattr(policy, "shared_actor_head", None)
              return (
                  actor_head in {None, "hierarchical_gate_target_v1"}
                  and callable(getattr(policy, "hierarchical_actor_outputs", None))
              )


          def _hierarchical_teacher_labels(
              *,
              policy: object,
              teacher_dataset: SupervisedPolicyDataset,
              config: object,
          ) -> HierarchicalTeacherLabels | None:
              if not _uses_hierarchical_actor_head(policy):
                  return None
              labels = _teacher_change_labels(
                  teacher_dataset=teacher_dataset,
                  config=config,
              )
              if labels is None:
                  raise ValueError(
                      "hierarchical BC requires structured teacher observations"
                  )
              return labels


          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          rm .github/workflows/agent-action-head-test-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py \
            .github/workflows/agent-action-head-test-contract-fix.yml
          git commit -m "fix: preserve hierarchical teacher-label compatibility"
          git push origin HEAD:agent/action-head-ablation-v1
