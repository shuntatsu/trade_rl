name: Agent action-head verification

on:
  push:
    branches:
      - agent/action-head-ablation-v1

permissions:
  contents: write

concurrency:
  group: agent-action-head-verification
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Verify Studio
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix studio --no-audit --no-fund
          npm test --prefix studio -- --run
          npm run typecheck --prefix studio
          npm run build --prefix studio
          npm run check:layout --prefix studio
      - name: Ruff
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check --diff .
      - name: Mypy
        run: uv run mypy .
      - name: Import architecture
        run: uv run lint-imports
      - name: Dead-code report
        run: uv run vulture trade_rl tests --min-confidence 100
      - name: Recovery and structured serving smoke
        run: >-
          uv run pytest -q
          tests/integrations/test_sb3_training.py::test_backend_resumes_ppo_checkpoint_to_requested_total
          tests/serving/test_sb3_loader.py::test_structured_sb3_loader_rebuilds_native_sequence_observation
      - name: Tests and coverage
        run: >-
          uv run pytest -q --cov=trade_rl --cov-branch
          --cov-report=term-missing --cov-report=json:coverage.json
      - name: Critical branch coverage
        run: uv run python .github/check_critical_coverage.py coverage.json pyproject.toml
      - name: CLI smoke
        run: uv run trade-rl --version

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Compatibility tests
        shell: bash
        run: uv run pytest -q tests/data tests/simulation tests/evaluation tests/serving

  training-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build complete training image
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$commit" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$source_digest" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$lock_digest" \
            --file Dockerfile.training \
            --tag trade-rl-training:action-head-verification \
            .
          docker run --rm --user 999:999 trade-rl-training:action-head-verification trade-rl --version

  finalize:
    needs: [quality, compatibility, training-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for evidence commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/action-head-ablation-v1
          fetch-depth: 0
      - name: Record GREEN evidence and remove temporary workflow
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "Branch moved during verification" >&2
            exit 1
          fi
          cat > docs/superpowers/evidence/2026-07-30-action-head-ablation-green.md <<EOF
          # Action-Head Ablation GREEN Evidence

          Exact tested commit: \`$TESTED_SHA\`
          GitHub Actions run: \`$RUN_ID\`

          Successful jobs:

          - Ubuntu full quality: Studio tests/typecheck/build/layout, Ruff, Ruff format, MyPy, import-linter, vulture, recovery/serving smoke, full pytest with branch coverage, critical coverage, and CLI smoke.
          - Compatibility suite on Ubuntu and Windows.
          - Complete training-image build and packaged non-root CLI probe.

          The final evidence commit changes only this evidence document and removes the temporary verification workflow; production and test code are identical to the tested commit.
          EOF
          rm .github/workflows/agent-action-head-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/evidence/2026-07-30-action-head-ablation-green.md \
            .github/workflows/agent-action-head-verify.yml
          git commit -m "test: record GREEN action-head verification"
          git push origin HEAD:agent/action-head-ablation-v1
