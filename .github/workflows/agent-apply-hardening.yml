name: Agent Apply Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .agent/hardening.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/hardening/chunk-{00,01,02,03,04,05,06,07} > /tmp/hardening.b64
          cat > /tmp/chunks.sha256 <<'EOF'
          99f4c7326984708a054c1c76255b8f586fc5968698b08a22f254a6b767b38a76  .agent/hardening/chunk-00
          b95408556bfe0a9b526ee8fdce9988aa5f6732eed0d498aa121ad16bff4ee616  .agent/hardening/chunk-01
          ed2274d2d21d24255b268b0b1245f0109c2047dd8be5e555850447461320d8b4  .agent/hardening/chunk-02
          b34427cb6c967fc388ad14a7e91bcdfb5294646c2612e126ec6ce3cc2a70911f  .agent/hardening/chunk-03
          5348485330adce1e5fe1e24d474ebd410792962ae0305334cf2e5c0cba8e7073  .agent/hardening/chunk-04
          3f7026ff72b8d54e84cca5ea03e2078e30a424a10ca8f4cbedd725671115b359  .agent/hardening/chunk-05
          94bce264028c5b5ff0330e84e23c099181cea5ac9c2f483cb67175f1035230aa  .agent/hardening/chunk-06
          9e4b531bddf313dedf7302d7039ed9426d18f2724cbf4b374c5cd87b9237def8  .agent/hardening/chunk-07
          EOF
          sha256sum -c /tmp/chunks.sha256
          base64 --decode /tmp/hardening.b64 > /tmp/hardening.patch.gz
          printf '%s  %s\n' '857b1cca10f0171e61b4cdc2f81a367f09b8c851a2e6fd308b9dc6b202c07795' /tmp/hardening.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/hardening.patch.gz > /tmp/hardening.patch
          printf '%s  %s\n' '68bc41312bcef31170944553a732ed1c269a159f64d0f0b8bab972a02a0fad83' /tmp/hardening.patch | sha256sum -c -
          git apply --check /tmp/hardening.patch
          git apply /tmp/hardening.patch
          rm -rf .agent/hardening .agent/hardening.ready .github/workflows/agent-apply-hardening.yml
          git config user.name 'trade-rl-agent'
          git config user.email 'trade-rl-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Harden execution evidence and stage transactions'
          git push origin HEAD:agent/harden-evidence-stage-transaction
