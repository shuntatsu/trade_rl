name: Agent audit render

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen --extra dev --extra train-sb3

      - name: Record RED regression evidence
        shell: bash
        run: |
          set +e
          uv run pytest \
            tests/simulation/test_execution_audit_hardening.py \
            tests/evaluation/test_execution_promotion_audit_hardening.py \
            tests/artifacts/test_store_audit_hardening.py \
            tests/rl/test_checkpoint_trust_boundary.py \
            -q > /tmp/audit-red.log 2>&1
          status=$?
          set -e
          cat /tmp/audit-red.log
          if [ "$status" -eq 0 ]; then
            echo "Regression tests unexpectedly passed before the fix"
            exit 1
          fi

      - name: Apply audited fixes
        run: uv run python scripts/agent_apply_audit_hardening.py 2>&1 | tee /tmp/audit-apply.log

      - name: Verify targeted GREEN suite
        run: |
          uv run pytest \
            tests/simulation/test_execution_audit_hardening.py \
            tests/evaluation/test_execution_promotion_audit_hardening.py \
            tests/artifacts/test_store_audit_hardening.py \
            tests/rl/test_checkpoint_trust_boundary.py \
            tests/evaluation/test_execution_promotion.py \
            tests/simulation/test_critical_branch_coverage.py \
            tests/artifacts/test_codec_store_critical_coverage.py \
            tests/rl/test_checkpointing.py \
            tests/rl/test_training_resume.py \
            tests/integrations/test_sb3_checkpoint_assembly.py \
            tests/integrations/test_sb3_checkpoint_transfer.py \
            -q 2>&1 | tee /tmp/audit-green.log

      - name: Verify static contracts
        run: |
          uv run ruff check \
            trade_rl/simulation/execution.py \
            trade_rl/simulation/execution_promotion.py \
            trade_rl/artifacts/store.py \
            trade_rl/rl/checkpointing.py \
            trade_rl/rl/replay.py \
            trade_rl/integrations/sb3_checkpoint_assembly.py \
            trade_rl/integrations/sb3_training.py \
            trade_rl/workflows/training_run.py \
            tests/simulation/test_execution_audit_hardening.py \
            tests/evaluation/test_execution_promotion_audit_hardening.py \
            tests/artifacts/test_store_audit_hardening.py \
            tests/rl/test_checkpoint_trust_boundary.py \
            2>&1 | tee /tmp/audit-ruff.log
          uv run mypy \
            trade_rl/simulation/execution.py \
            trade_rl/simulation/execution_promotion.py \
            trade_rl/artifacts/store.py \
            trade_rl/rl/checkpointing.py \
            trade_rl/rl/replay.py \
            trade_rl/integrations/sb3_checkpoint_assembly.py \
            2>&1 | tee /tmp/audit-mypy.log

      - name: Package verified files and diagnostics
        if: always()
        shell: bash
        run: |
          git diff --binary > /tmp/audit-hardening.patch
          tar -czf /tmp/audit-hardening-output.tar.gz \
            /tmp/audit-hardening.patch \
            /tmp/audit-red.log \
            /tmp/audit-apply.log \
            /tmp/audit-green.log \
            /tmp/audit-ruff.log \
            /tmp/audit-mypy.log \
            trade_rl/simulation/execution.py \
            trade_rl/simulation/execution_promotion.py \
            trade_rl/artifacts/store.py \
            trade_rl/rl/checkpointing.py \
            trade_rl/rl/replay.py \
            trade_rl/integrations/sb3_checkpoint_assembly.py \
            trade_rl/integrations/sb3_training.py \
            trade_rl/workflows/training_run.py \
            tests/evaluation/test_execution_promotion.py \
            tests/simulation/test_critical_branch_coverage.py \
            docs/superpowers/specs/2026-07-30-audit-hardening-design.md

      - name: Upload audited output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-hardening-output
          path: /tmp/audit-hardening-output.tar.gz
          if-no-files-found: error
