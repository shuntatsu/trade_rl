name: Agent final reward format

on:
  push:
    branches:
      - agent/reward-objective-contract
    paths:
      - .github/workflows/agent-final-reward-format.yml

permissions:
  contents: write

concurrency:
  group: agent-final-reward-format
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.ref == 'refs/heads/agent/reward-objective-contract' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Format exact source and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("trade_rl/rl/environment_observation_contract.py")
          text = source.read_text(encoding="utf-8")
          old = (
              "            observation_contract_digest = "
              "observation_builder.schema_digest(self.dataset)\n"
          )
          new = (
              "            observation_contract_digest = "
              "observation_builder.schema_digest(\n"
              "                self.dataset\n"
              "            )\n"
          )
          if text.count(old) != 1:
              raise SystemExit("format anchor is not unique")
          source.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/agent-final-reward-format.yml").unlink()
          PY

          python -m compileall -q trade_rl/rl/environment_observation_contract.py
          git diff --check

      - name: Commit and push self-deleting format patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/environment_observation_contract.py \
            .github/workflows/agent-final-reward-format.yml
          git diff --cached --check
          git commit -m "style: format observation contract identity"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/agent/reward-objective-contract
