name: Agent Fix Training Config Positional Compatibility

on:
  push:
    branches:
      - agent/training-observability-diagnostics

permissions:
  contents: write

concurrency:
  group: agent-fix-training-config-positional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, 'fix: preserve positional training config compatibility') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/training-observability-diagnostics
          fetch-depth: 0

      - name: Preserve existing positional field order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/rl/training.py')
          text = path.read_text(encoding='utf-8')
          old = '''    learning_rate: float = 3e-4
    learning_rate_schedule: str = "constant"
    learning_rate_final_ratio: float = 0.1
    tensorboard_enabled: bool = False
    tensorboard_log_interval: int = 1
    n_steps: int = 2_048
'''
          new = '''    learning_rate: float = 3e-4
    n_steps: int = 2_048
'''
          if text.count(old) != 1:
              raise SystemExit('expected training field prefix was not found exactly once')
          text = text.replace(old, new, 1)
          anchor = '''    behavior_cloning_teacher: str = "oracle"
    behavior_cloning_required_relative_improvement: float = 0.0
'''
          replacement = '''    behavior_cloning_teacher: str = "oracle"
    behavior_cloning_required_relative_improvement: float = 0.0
    learning_rate_schedule: str = "constant"
    learning_rate_final_ratio: float = 0.1
    tensorboard_enabled: bool = False
    tensorboard_log_interval: int = 1
'''
          if text.count(anchor) != 1:
              raise SystemExit('expected training field suffix was not found exactly once')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Verify positional compatibility and new fields
        run: >-
          uv run pytest -q
          tests/rl/test_algorithm_configs.py::test_vector_environment_width_preserves_existing_positional_arguments
          tests/rl/test_training_config_active_fields.py
          tests/rl/test_schedules.py

      - name: Verify format and types
        run: |
          uv run ruff check trade_rl/rl/training.py tests/rl/test_algorithm_configs.py
          uv run ruff format --check trade_rl/rl/training.py tests/rl/test_algorithm_configs.py
          uv run mypy trade_rl/rl/training.py

      - name: Commit verified fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/rl/training.py
          git commit -m 'fix: preserve positional training config compatibility'
          git push origin HEAD:agent/training-observability-diagnostics
