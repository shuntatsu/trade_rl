name: Agent Format Core Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .agent/format-core-hardening.ready

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Apply exact CI formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            tests/evaluation/test_execution_promotion_replay_binding.py \
            tests/simulation/test_execution_replay_strict_contract.py \
            trade_rl/evaluation/execution_promotion_artifacts.py \
            trade_rl/simulation/execution_promotion.py \
            trade_rl/simulation/execution_replay.py \
            trade_rl/simulation/orders.py \
            trade_rl/workflows/symbol_triplet_stage_state.py
          rm -f .agent/format-core-hardening.ready .github/workflows/agent-format-core-hardening.yml
          rmdir .agent 2>/dev/null || true
          git config user.name 'trade-rl-agent'
          git config user.email 'trade-rl-agent@users.noreply.github.com'
          git add -A
          git commit -m 'style: format hardened evidence core'
          git push origin HEAD:agent/harden-evidence-stage-transaction
