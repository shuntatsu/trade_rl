name: Agent Format Repair

on:
  push:
    branches:
      - agent/lgpl-nautilus-migration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lgpl-nautilus-migration
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Format exact failing file
        run: uvx ruff format trade_rl/integrations/nautilus/historical_streaming.py
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/agent-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/nautilus/historical_streaming.py .github/workflows/agent-format-fix.yml
          git diff --cached --check
          git commit -m "style: format Nautilus streaming runtime"
          git push origin HEAD:agent/lgpl-nautilus-migration
