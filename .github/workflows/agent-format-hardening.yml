name: Agent Format Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .agent/format-hardening.ready

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix \
            tests/e2e/test_research_to_serving_v2.py \
            tests/evaluation/test_execution_promotion.py \
            tests/evaluation/test_execution_promotion_artifact_workflow.py \
            tests/evaluation/test_execution_promotion_audit_hardening.py \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            tests/serving/conftest.py \
            trade_rl/evaluation/stage_a_zero_shot_contracts.py \
            trade_rl/workflows/training_run.py
          uv run ruff format \
            tests/e2e/test_research_to_serving_v2.py \
            tests/evaluation/test_execution_promotion.py \
            tests/evaluation/test_execution_promotion_artifact_workflow.py \
            tests/evaluation/test_execution_promotion_audit_hardening.py \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            tests/serving/conftest.py \
            trade_rl/evaluation/stage_a_zero_shot_contracts.py \
            trade_rl/workflows/training_run.py
          rm -f .agent/format-hardening.ready .github/workflows/agent-format-hardening.yml
          rmdir .agent 2>/dev/null || true
          git config user.name 'trade-rl-agent'
          git config user.email 'trade-rl-agent@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply canonical hardening formatting'
          git push origin HEAD:agent/harden-evidence-stage-transaction
