name: Agent Nautilus Evidence Semantics TDD

on:
  push:
    branches:
      - agent/lgpl-nautilus-migration
    paths:
      - .github/workflows/agent-nautilus-evidence-semantics-tdd.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/lgpl-nautilus-migration
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Verify evidence semantics RED
        run: uv run pytest -q tests/test_nautilus_training_throughput_benchmark.py
