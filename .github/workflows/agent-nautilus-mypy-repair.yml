name: Agent Nautilus Mypy Repair

on:
  push:
    branches:
      - agent/lgpl-nautilus-migration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/lgpl-nautilus-migration
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install project tooling
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Reproduce mypy regression
        run: |
          set +e
          uv run mypy tools/nautilus_training_throughput_benchmark.py > /tmp/mypy-before.log 2>&1
          status=$?
          set -e
          cat /tmp/mypy-before.log
          test "$status" -ne 0
          grep -F 'Argument 1 to "tuple" has incompatible type "bool | Sequence[int]"' /tmp/mypy-before.log
      - name: Apply bool-safe timestep normalization and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('tools/nautilus_training_throughput_benchmark.py')
          text = source.read_text(encoding='utf-8')
          old = '''def _normalize_timesteps(value: int | Sequence[int]) -> tuple[int, ...]:
              raw = (
                  (value,)
                  if isinstance(value, int) and not isinstance(value, bool)
                  else tuple(value)
              )
          '''
          new = '''def _normalize_timesteps(value: int | Sequence[int]) -> tuple[int, ...]:
              if isinstance(value, bool):
                  raise TypeError("timesteps must contain integers")
              if isinstance(value, int):
                  raw = (value,)
              else:
                  raw = tuple(value)
          '''
          if old not in text:
              raise SystemExit('expected _normalize_timesteps block not found')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_nautilus_training_throughput_benchmark.py')
          test_path.write_text(
              '''from __future__ import annotations

import pytest

from tools.nautilus_training_throughput_benchmark import _normalize_timesteps


def test_normalize_timesteps_accepts_scalar_and_canonicalizes_sequence() -> None:
    assert _normalize_timesteps(8) == (8,)
    assert _normalize_timesteps([32, 8, 32]) == (8, 32)


def test_normalize_timesteps_rejects_bool_values_explicitly() -> None:
    with pytest.raises(TypeError, match="timesteps must contain integers"):
        _normalize_timesteps(True)
    with pytest.raises(TypeError, match="timesteps must contain integers"):
        _normalize_timesteps([8, True])
''',
              encoding='utf-8',
          )
          PY
      - name: Verify focused repair
        run: |
          uv run pytest -q tests/test_nautilus_training_throughput_benchmark.py tests/simulation/test_runtime_performance.py
          uv run mypy tools/nautilus_training_throughput_benchmark.py
          uv run ruff check tools/nautilus_training_throughput_benchmark.py tests/test_nautilus_training_throughput_benchmark.py
          uv run ruff format --check --diff tools/nautilus_training_throughput_benchmark.py tests/test_nautilus_training_throughput_benchmark.py
      - name: Verify whole-project mypy
        run: uv run mypy .
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/agent-nautilus-mypy-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/nautilus_training_throughput_benchmark.py tests/test_nautilus_training_throughput_benchmark.py .github/workflows/agent-nautilus-mypy-repair.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: validate Nautilus benchmark timesteps"
          git push origin HEAD:agent/lgpl-nautilus-migration
