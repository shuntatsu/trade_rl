name: Agent Nautilus Persisted Resolver

on:
  push:
    branches:
      - agent/lgpl-nautilus-migration
    paths:
      - .github/workflows/agent-nautilus-persisted-resolver.yml
      - tools/nautilus_training_throughput_benchmark.py
      - tests/test_nautilus_training_throughput_benchmark.py

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/lgpl-nautilus-migration
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Focused persisted benchmark tests
        run: uv run pytest -q tests/test_nautilus_training_throughput_benchmark.py tests/data/test_market_artifact.py
      - name: Targeted mypy
        run: uv run mypy tools/nautilus_training_throughput_benchmark.py
      - name: Targeted Ruff
        run: uv run ruff check tools/nautilus_training_throughput_benchmark.py tests/test_nautilus_training_throughput_benchmark.py
      - name: Targeted format
        run: uv run ruff format --check --diff tools/nautilus_training_throughput_benchmark.py tests/test_nautilus_training_throughput_benchmark.py
