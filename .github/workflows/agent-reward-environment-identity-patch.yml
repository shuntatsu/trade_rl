name: Agent reward environment identity patch

on:
  push:
    branches:
      - agent/reward-objective-contract
    paths:
      - .github/workflows/agent-reward-environment-identity-patch.yml

permissions:
  contents: write

concurrency:
  group: agent-reward-environment-identity-patch
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.ref == 'refs/heads/agent/reward-objective-contract' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Apply exact environment identity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("trade_rl/rl/environment.py")
          text = source.read_text(encoding="utf-8")

          old_import = '''from trade_rl.rl.environment_config import (
              ResidualMarketEnvConfig,
          )
          '''
          new_import = '''from trade_rl.rl.environment_config import (
              EpisodeBoundaryMode,
              ResidualMarketEnvConfig,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit("environment config import anchor is not unique")
          text = text.replace(old_import, new_import, 1)

          anchor = '                "episode_hours": self.config.episode_hours,\n'
          insertion = anchor + '''                **(
                      {
                          "episode_boundary_mode": EpisodeBoundaryMode(
                              self.config.episode_boundary_mode
                          ).value
                      }
                      if self.config.time_limit_terminates
                      else {}
                  ),
          '''
          if text.count(anchor) != 1:
              raise SystemExit("environment identity anchor is not unique")
          text = text.replace(anchor, insertion, 1)
          source.write_text(text, encoding="utf-8")

          workflow = Path(
              ".github/workflows/agent-reward-environment-identity-patch.yml"
          )
          workflow.unlink()
          PY

          python -m compileall -q trade_rl/rl/environment.py
          git diff --check

      - name: Commit and push self-deleting patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/environment.py \
            .github/workflows/agent-reward-environment-identity-patch.yml
          git diff --cached --check
          git commit -m "fix: bind finite horizon to environment identity"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/agent/reward-objective-contract
