name: Agent Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/trade-rl-source.tgz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/trade-rl-source.tgz
          if-no-files-found: error
