name: Apply Terminal Contract Repair

on:
  push:
    branches:
      - agent/fix-terminal-contract-first

permissions:
  contents: write

concurrency:
  group: apply-terminal-contract-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-terminal-contract-first
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed production patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-terminal-contract.patch
          git apply .github/agent-terminal-contract.patch
          rm .github/agent-terminal-contract.patch
          rm .github/workflows/agent-source-snapshot.yml
          rm docs/superpowers/plans/2026-07-30-training-terminal-contract.md
          rmdir docs/superpowers/plans docs/superpowers
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve mark-to-market training truncation"
          git push origin HEAD:agent/fix-terminal-contract-first
