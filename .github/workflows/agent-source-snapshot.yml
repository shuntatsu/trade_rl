name: Agent Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'agent/fix-terminal-contract-first'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/trade-rl-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-source-snapshot
          path: /tmp/trade-rl-source.tgz
          if-no-files-found: error
          retention-days: 1
