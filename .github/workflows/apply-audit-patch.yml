name: Apply Audit Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-audit-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Merge reviewed audit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-commit fc92ed07638c085300ca4c98ac6252e15ecce771
          rm -rf .automation
          rm -f .github/workflows/apply-audit-patch.yml
          rm -f .github/workflows/source-export.yml
          git add -A
          git commit -m "Reapply audit execution and artifact hardening"
          git push origin HEAD:agent/harden-audit-contracts-v2
