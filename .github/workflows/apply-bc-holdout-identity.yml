name: Apply BC Holdout Identity Fix

on:
  push:
    branches:
      - agent/require-explicit-bc-holdout-statistics

permissions:
  contents: write

concurrency:
  group: apply-bc-holdout-identity-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/require-explicit-bc-holdout-statistics
          fetch-depth: 0
          persist-credentials: true

      - name: Bind holdout statistics into training identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          training_path = Path("trade_rl/rl/training.py")
          training = training_path.read_text(encoding="utf-8")

          inactive_old = '''                    (
                                  "behavior_cloning_max_causal_holdout_regret",
                                  self.behavior_cloning_max_causal_holdout_regret,
                                  0.0,
                              ),
                          ),
                          context="behavior cloning disabled",
          '''
          inactive_new = '''                    (
                                  "behavior_cloning_max_causal_holdout_regret",
                                  self.behavior_cloning_max_causal_holdout_regret,
                                  0.0,
                              ),
                              (
                                  "behavior_cloning_causal_holdout_bootstrap_resamples",
                                  self.behavior_cloning_causal_holdout_bootstrap_resamples,
                                  2_000,
                              ),
                              (
                                  "behavior_cloning_causal_holdout_confidence_level",
                                  self.behavior_cloning_causal_holdout_confidence_level,
                                  0.95,
                              ),
                          ),
                          context="behavior cloning disabled",
          '''
          if inactive_old not in training:
              raise SystemExit("inactive BC holdout insertion point not found")
          training = training.replace(inactive_old, inactive_new, 1)

          digest_old = '''            "behavior_cloning_max_causal_holdout_regret": (
                          self.behavior_cloning_max_causal_holdout_regret
                      ),
                      "buffer_size": self.buffer_size,
          '''
          digest_new = '''            "behavior_cloning_max_causal_holdout_regret": (
                          self.behavior_cloning_max_causal_holdout_regret
                      ),
                      "behavior_cloning_causal_holdout_bootstrap_resamples": (
                          self.behavior_cloning_causal_holdout_bootstrap_resamples
                      ),
                      "behavior_cloning_causal_holdout_confidence_level": (
                          self.behavior_cloning_causal_holdout_confidence_level
                      ),
                      "buffer_size": self.buffer_size,
          '''
          if digest_old not in training:
              raise SystemExit("training digest insertion point not found")
          training_path.write_text(
              training.replace(digest_old, digest_new, 1), encoding="utf-8"
          )

          test_path = Path("tests/workflows/test_bc_holdout_config_explicitness.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_disabled_bc_rejects_non_default_holdout_statistics"
          if marker not in tests:
              tests += '''


          @pytest.mark.parametrize(
              ("field", "value"),
              (
                  ("behavior_cloning_causal_holdout_bootstrap_resamples", 3_000),
                  ("behavior_cloning_causal_holdout_confidence_level", 0.9),
              ),
          )
          def test_disabled_bc_rejects_non_default_holdout_statistics(
              field: str,
              value: object,
          ) -> None:
              payload = json.loads(PROFILE.read_text(encoding="utf-8"))
              training = payload["training"]
              assert isinstance(training, dict)
              training[field] = value

              with pytest.raises(ValueError, match=f"{field}.*inactive"):
                  TrainingRunConfig.from_mapping(payload)
          '''
              test_path.write_text(tests, encoding="utf-8")
          PY
          rm .github/workflows/apply-bc-holdout-identity.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: bind BC holdout statistics into identity"
          git push origin HEAD:agent/require-explicit-bc-holdout-statistics
