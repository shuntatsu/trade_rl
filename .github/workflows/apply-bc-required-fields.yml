name: Apply BC Required Fields

on:
  push:
    branches:
      - agent/require-explicit-bc-holdout-statistics

permissions:
  contents: write

concurrency:
  group: apply-bc-required-fields
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/require-explicit-bc-holdout-statistics
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed parser patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-bc-required-fields.patch
          git apply .github/agent-bc-required-fields.patch
          rm .github/agent-bc-required-fields.patch
          rm .github/workflows/apply-bc-required-fields.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: require explicit BC holdout statistics"
          git push origin HEAD:agent/require-explicit-bc-holdout-statistics
