name: Apply BC Test Fixture Updates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-bc-test-fixtures
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/require-explicit-bc-holdout-statistics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/require-explicit-bc-holdout-statistics
          fetch-depth: 0
          persist-credentials: true

      - name: Add explicit statistics to v3 test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          paths = (
              Path("tests/e2e/test_research_to_serving_v2.py"),
              Path("tests/workflows/test_explicit_sealed_ledger_mode.py"),
              Path("tests/workflows/test_market_walk_forward.py"),
              Path("tests/workflows/test_pure_growth_training_contract.py"),
              Path("tests/workflows/test_signal_digest.py"),
              Path("tests/workflows/test_training_run.py"),
              Path("tests/workflows/test_training_run_config.py"),
              Path("tests/workflows/test_walk_forward_manifest_provenance.py"),
          )
          pattern = re.compile(
              r'^(?P<indent>\s*)"behavior_cloning_max_causal_holdout_regret":'
          )
          changed = []
          for path in paths:
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              output = []
              insertions = 0
              for index, line in enumerate(lines):
                  output.append(line)
                  match = pattern.match(line)
                  if match is None:
                      continue
                  nearby = "".join(lines[index + 1 : index + 5])
                  if "behavior_cloning_causal_holdout_bootstrap_resamples" in nearby:
                      continue
                  indent = match.group("indent")
                  output.append(
                      f'{indent}"behavior_cloning_causal_holdout_bootstrap_resamples": 2_000,\n'
                  )
                  output.append(
                      f'{indent}"behavior_cloning_causal_holdout_confidence_level": 0.95,\n'
                  )
                  insertions += 1
              if insertions == 0:
                  raise RuntimeError(f"no fixture insertion made in {path}")
              path.write_text("".join(output), encoding="utf-8")
              changed.append(f"{path}:{insertions}")
          print("updated", *changed, sep="\n")
          PY
          rm .github/workflows/apply-bc-test-fixtures.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: make BC holdout statistics explicit"
          git push origin HEAD:agent/require-explicit-bc-holdout-statistics
