name: Apply Binance Exchange Info Fallback Patch

on:
  push:
    branches:
      - fix/binance-usdm-exchange-info-fallback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/binance-usdm-exchange-info-fallback
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Apply exact transport patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/binance/transport.py")
          text = path.read_text(encoding="utf-8")
          old = '''        url = (
              f"{_REST_BASE[resolved_market.value]}"
              f"{_REST_EXCHANGE_INFO[resolved_market.value]}"
          )
          raw_payload = self._request_bytes(url)
          try:
              payload = json.loads(raw_payload)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise BinanceTransportError(
                  f"Binance returned invalid JSON for {url}"
              ) from error
          '''
          new = '''        primary_url = (
              f"{_REST_BASE[resolved_market.value]}"
              f"{_REST_EXCHANGE_INFO[resolved_market.value]}"
          )
          urls = (primary_url,)
          if resolved_market is BinanceMarket.USDS_M:
              urls = (
                  primary_url,
                  "https://www.binance.com/fapi/v1/exchangeInfo",
              )

          last_error: BinanceTransportError | None = None
          raw_payload: bytes | None = None
          url = primary_url
          for candidate_url in urls:
              url = candidate_url
              try:
                  raw_payload = self._request_bytes(candidate_url)
              except BinanceTransportError as error:
                  last_error = error
                  continue
              break
          if raw_payload is None:
              assert last_error is not None
              raise last_error

          try:
              payload = json.loads(raw_payload)
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise BinanceTransportError(
                  f"Binance returned invalid JSON for {url}"
              ) from error
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one exchange-info snippet, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format trade_rl/integrations/binance/transport.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/integrations/test_binance_exchange_info_fallback.py tests/integrations/test_binance.py
          uv run pytest -q tests
          uv build

      - name: Commit verified patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-binance-exchange-info-fallback.yml
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add trade_rl/integrations/binance/transport.py
          git diff --cached --check
          git commit -m "fix: fall back to official USD-M exchange-info host"
          git push origin HEAD:fix/binance-usdm-exchange-info-fallback
