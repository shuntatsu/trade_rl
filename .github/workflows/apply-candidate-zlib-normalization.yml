name: Apply candidate zlib normalization

on:
  push:
    branches: [fix/candidate-returns-zlib-normalization]
    paths: [.github/workflows/apply-candidate-zlib-normalization.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply minimal production fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/runs/artifact.py")
          text = path.read_text(encoding="utf-8")
          old_import = "import zipfile\n"
          new_import = "import zipfile\nimport zlib\n"
          old_catch = "except (OSError, EOFError, zipfile.BadZipFile) as error:\n"
          new_catch = "except (OSError, EOFError, zipfile.BadZipFile, zlib.error) as error:\n"
          if text.count(old_import) != 1 or text.count(old_catch) != 1:
              raise SystemExit("expected artifact.py patch anchors were not unique")
          text = text.replace(old_import, new_import, 1).replace(old_catch, new_catch, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Targeted GREEN
        run: |
          uv run pytest -q tests/evaluation/test_candidate_run_malformed_archive_errors.py tests/evaluation/test_candidate_run_artifact_identity.py tests/evaluation/experiments/test_freeze_tamper.py
          uv run ruff check trade_rl/evaluation/runs/artifact.py tests/evaluation/test_candidate_run_malformed_archive_errors.py
          uv run ruff format --check trade_rl/evaluation/runs/artifact.py tests/evaluation/test_candidate_run_malformed_archive_errors.py
          uv run mypy trade_rl/evaluation/runs/artifact.py
      - name: Retire helper and commit durable tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-candidate-zlib-normalization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/runs/artifact.py tests/evaluation/test_candidate_run_malformed_archive_errors.py
          git commit -m "fix: normalize candidate NPZ decompression errors"
          git push origin HEAD:refs/heads/fix/candidate-returns-zlib-normalization
