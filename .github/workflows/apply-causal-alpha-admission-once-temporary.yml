name: Apply causal alpha admission once temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply exactly-once admission
        run: python tools/_temporary_apply_causal_admission_once.py
      - name: Verify exactly-once admission
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/workflows/universal_causal_alpha_contracts.py
            trade_rl/workflows/universal_causal_alpha_teacher.py
            trade_rl/integrations/universal_pretraining.py
            trade_rl/workflows/universal_teacher_runtime.py
            tests/workflows/test_universal_causal_alpha_admission_once.py
            tests/integrations/test_universal_causal_teacher_admission_reuse.py
            tests/integrations/test_universal_causal_teacher_admission.py
            tests/workflows/test_universal_causal_alpha_package.py
            tests/workflows/test_universal_teacher_bundle_runtime.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy \
            trade_rl/workflows/universal_causal_alpha_contracts.py \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/integrations/universal_pretraining.py \
            trade_rl/workflows/universal_teacher_runtime.py
          uv run lint-imports
          uv run pytest \
            tests/workflows/test_universal_causal_alpha_admission_once.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/integrations/test_universal_causal_teacher_admission.py \
            tests/integrations/test_universal_pretraining_bundle.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py \
            tests/workflows/test_universal_causal_alpha_assembly.py \
            tests/workflows/test_universal_causal_alpha_shared_training.py \
            tests/workflows/test_universal_stage_a_training_orchestrator.py \
            tests/workflows/test_universal_full_research_training.py \
            -q
      - name: Commit verified exactly-once admission and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_apply_causal_admission_once.py \
            .github/workflows/apply-causal-alpha-admission-once-temporary.yml \
            .github/workflows/causal-alpha-admission-once-red-temporary.yml
          git add \
            trade_rl/workflows/universal_causal_alpha_contracts.py \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/integrations/universal_pretraining.py \
            trade_rl/workflows/universal_teacher_runtime.py \
            tests/workflows/test_universal_causal_alpha_admission_once.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/integrations/test_universal_causal_teacher_admission.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py
          git commit -m 'fix: freeze causal teacher admission per package'
          git push origin HEAD:feature/universal-causal-alpha-teacher
