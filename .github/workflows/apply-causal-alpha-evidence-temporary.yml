name: Apply causal alpha evidence temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply evidence completion
        run: python tools/_temporary_apply_causal_evidence_wrapper.py
      - name: Verify evidence completion
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/workflows/universal_causal_alpha_contracts.py
            trade_rl/workflows/universal_causal_alpha_fitting.py
            trade_rl/workflows/universal_causal_alpha_teacher.py
            trade_rl/workflows/universal_teacher_runtime.py
            trade_rl/integrations/universal_pretraining.py
            tests/workflows/test_universal_causal_alpha_evidence.py
            tests/workflows/test_universal_causal_alpha_fitting.py
            tests/workflows/test_universal_causal_alpha_package.py
            tests/integrations/test_universal_causal_teacher_admission.py
            tests/integrations/test_universal_causal_teacher_admission_reuse.py
            tests/workflows/test_universal_teacher_bundle_runtime.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy \
            trade_rl/workflows/universal_causal_alpha_contracts.py \
            trade_rl/workflows/universal_causal_alpha_fitting.py \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/workflows/universal_teacher_runtime.py \
            trade_rl/integrations/universal_pretraining.py
          uv run lint-imports
          uv run pytest \
            tests/workflows/test_universal_causal_alpha_evidence.py \
            tests/workflows/test_universal_causal_alpha_fitting.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_causal_alpha_assembly.py \
            tests/workflows/test_universal_causal_alpha_shared_training.py \
            tests/integrations/test_universal_causal_teacher_admission.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/integrations/test_universal_pretraining_bundle.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py \
            -q
      - name: Commit verified evidence and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_apply_causal_evidence.py \
            tools/_temporary_apply_causal_evidence_wrapper.py \
            .github/workflows/apply-causal-alpha-evidence-temporary.yml \
            .github/workflows/causal-alpha-evidence-red-temporary.yml
          git add \
            trade_rl/workflows/universal_causal_alpha_contracts.py \
            trade_rl/workflows/universal_causal_alpha_fitting.py \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/workflows/universal_teacher_runtime.py \
            trade_rl/integrations/universal_pretraining.py \
            tests/workflows/test_universal_causal_alpha_evidence.py \
            tests/integrations/test_universal_causal_teacher_admission.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py \
            docs/implementation-plans/specs/2026-08-13-universal-causal-alpha-teacher-design.md \
            docs/implementation-plans/plans/2026-08-13-universal-causal-alpha-teacher.md
          git commit -m 'feat: persist causal teacher fit and prediction evidence'
          git push origin HEAD:feature/universal-causal-alpha-teacher
