name: Apply causal alpha selection temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/_temporary_apply_causal_alpha_selection.py
      - name: Verify train-only selection
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff check --fix --select I trade_rl/workflows/universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_selection.py
          uv run ruff format trade_rl/workflows/universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_selection.py
          uv run ruff check trade_rl/learning/causal_alpha_teacher.py trade_rl/workflows/universal_causal_alpha_teacher.py tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py tests/workflows/test_universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_samples.py tests/workflows/test_universal_causal_alpha_selection.py
          uv run ruff format --check trade_rl/learning/causal_alpha_teacher.py trade_rl/workflows/universal_causal_alpha_teacher.py tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py tests/workflows/test_universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_samples.py tests/workflows/test_universal_causal_alpha_selection.py
          uv run mypy trade_rl/learning/causal_alpha_teacher.py trade_rl/workflows/universal_causal_alpha_teacher.py
          uv run pytest tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py tests/workflows/test_universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_samples.py tests/workflows/test_universal_causal_alpha_selection.py -q
      - name: Commit verified selection and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/_temporary_apply_causal_alpha_selection.py .github/workflows/apply-causal-alpha-selection-temporary.yml
          git add trade_rl/workflows/universal_causal_alpha_teacher.py tests/workflows/test_universal_causal_alpha_selection.py
          git commit -m 'feat: add train-only causal alpha selection'
          git push origin HEAD:feature/universal-causal-alpha-teacher
