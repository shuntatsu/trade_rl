name: Apply causal task8 temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply canonical config update
        run: python tools/_temporary_apply_causal_task8.py
      - name: Verify Task 8
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check tests/workflows/test_universal_u6_example_configs.py
          uv run ruff format --check tests/workflows/test_universal_u6_example_configs.py
          uv run pytest tests/workflows/test_universal_u6_example_configs.py tests/rl/test_algorithm_configs.py -q
      - name: Commit verified Task 8 and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_apply_causal_task8.py \
            .github/workflows/apply-causal-task8-temporary.yml \
            .github/workflows/causal-alpha-task8-temporary.yml
          git add \
            examples/binance-multitimeframe/universal-u6-ppo.json \
            examples/binance-multitimeframe/universal-u6-lagrangian.json \
            examples/binance-multitimeframe/universal-u6-discounted.json \
            docs/CONFIGURATION.md \
            tests/workflows/test_universal_u6_example_configs.py
          git commit -m 'feat: make causal alpha the canonical U6 teacher'
          git push origin HEAD:feature/universal-causal-alpha-teacher
