name: Apply causal teacher admission temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply admission patch with typing repair
        run: python tools/_temporary_fix_and_apply_causal_teacher_admission.py
      - name: Verify admission gate
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/learning/causal_alpha_teacher.py
            trade_rl/integrations/universal_pretraining.py
            trade_rl/workflows/universal_causal_alpha_teacher.py
            trade_rl/workflows/universal_teacher_runtime.py
            tests/learning/test_causal_alpha_teacher_admission.py
            tests/integrations/test_universal_causal_teacher_admission.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy trade_rl/learning/causal_alpha_teacher.py trade_rl/integrations/universal_pretraining.py trade_rl/workflows/universal_causal_alpha_teacher.py trade_rl/workflows/universal_teacher_runtime.py
          uv run pytest \
            tests/learning/test_causal_alpha_teacher.py \
            tests/learning/test_causal_alpha_teacher_admission.py \
            tests/rl/test_causal_alpha_teacher_config.py \
            tests/integrations/test_universal_causal_teacher_admission.py \
            tests/integrations/test_universal_pretraining_bundle.py \
            tests/workflows/test_universal_causal_alpha_teacher.py \
            tests/workflows/test_universal_causal_alpha_fitting.py \
            tests/workflows/test_universal_causal_alpha_samples.py \
            tests/workflows/test_universal_causal_alpha_selection.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_causal_alpha_assembly.py \
            tests/workflows/test_universal_causal_alpha_shared_training.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py \
            -q
      - name: Commit verified admission gate and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_apply_causal_teacher_admission.py \
            tools/_temporary_fix_and_apply_causal_teacher_admission.py \
            .github/workflows/apply-causal-teacher-admission-temporary.yml \
            .github/workflows/causal-alpha-teacher-focused-temporary.yml
          git add \
            trade_rl/learning/causal_alpha_teacher.py \
            trade_rl/integrations/universal_pretraining.py \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/workflows/universal_teacher_runtime.py \
            tests/learning/test_causal_alpha_teacher_admission.py \
            tests/integrations/test_universal_causal_teacher_admission.py
          git commit -m 'feat: gate causal teacher before Universal BC'
          git push origin HEAD:feature/universal-causal-alpha-teacher
