name: Apply Continuing Profile Contract

on:
  push:
    branches:
      - agent/target-weight-constrained-growth-design

permissions:
  contents: write

jobs:
  apply-profile-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/target-weight-constrained-growth-design
          persist-credentials: true

      - name: Remove artificial horizon signal
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("examples/binance-multitimeframe")
          names = (
              "training-target-weight-growth-ppo.json",
              "training-target-weight-constrained-growth.json",
              "training-target-weight-constrained-growth-discounted.json",
          )
          for name in names:
              path = root / name
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["environment"]["finite_horizon_observation"] = False
              path.write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

      - name: Commit profile contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/binance-multitimeframe/training-target-weight-*.json
          git commit -m "fix: hide artificial horizon from continuing policies"
          git push origin HEAD:agent/target-weight-constrained-growth-design
