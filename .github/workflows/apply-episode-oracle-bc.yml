name: Apply Episode Oracle BC Patch

on:
  push:
    branches:
      - agent/episode-aligned-oracle-teacher

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/episode-aligned-oracle-teacher
      - name: Apply deterministic patch
        run: python .github/apply_episode_oracle_bc.py
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: connect episode Oracle teacher to SB3"
          git push origin HEAD:agent/episode-aligned-oracle-teacher
