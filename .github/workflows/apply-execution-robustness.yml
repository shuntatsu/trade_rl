name: Apply execution robustness patch

on:
  push:
    branches:
      - agent/consolidate-open-work-2026-08-10
    paths:
      - .github/workflows/apply-execution-robustness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/consolidate-open-work-2026-08-10
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Enable deterministic Ruff import repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_execution_robustness.py')
          text = path.read_text()
          marker = '    run("uv", "run", "ruff", "format", *modified)\n'
          replacement = (
              '    run("uv", "run", "ruff", "check", "--fix", *modified)\n'
              + marker
          )
          if text.count(marker) != 1:
              raise SystemExit('execution patch format marker changed')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Run RED-GREEN patch and verification
        run: uv run python scripts/apply_execution_robustness.py

      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(execution): add report-only environment robustness'
          git push origin HEAD:refs/heads/agent/consolidate-open-work-2026-08-10
