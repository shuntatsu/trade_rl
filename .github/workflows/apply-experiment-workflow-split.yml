name: Apply experiment workflow boundary split

on:
  push:
    branches:
      - refactor/experiment-workflow-boundaries

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5ffa6df75c62c5da872917071afdaf69d218f669"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-experiment-workflow-split.yml"

      - name: Split workflow by AST ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          source_path = Path("trade_rl/evaluation/experiments/workflow.py")
          source = source_path.read_text(encoding="utf-8")
          lines = source.splitlines(keepends=True)
          tree = ast.parse(source, filename=str(source_path))
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
          }

          codec_names = [
              "_AnalysisBinding",
              "_expect_keys",
              "_as_dict",
              "_as_list",
              "_as_string",
              "_as_optional_string",
              "_as_int",
              "_as_float",
              "_as_string_tuple",
              "_as_int_tuple",
              "_as_datetime",
              "_resolved_from_payload",
              "_study_plan_from_payload",
              "_candidate_config_payload",
              "_candidate_config_from_resolved",
              "_definition_from_payload",
              "_verification_from_payload",
              "_comparison_from_payload",
              "_decision_from_payload",
              "_failure_from_payload",
              "_freeze_from_payload",
              "_resolved_contract",
              "_semantic_without_seed",
              "_semantic_payload_without_seed",
              "_baseline_context_digest",
              "_analysis_binding",
              "_analysis_binding_from_payload",
          ]
          inspection_names = [
              "StudySnapshot",
              "_ExperimentState",
              "_StudyState",
              "_load_evidence_node",
              "_experiment_dir",
              "_find_evidence",
              "_read_plan",
              "_reconstruct",
              "_experiment_state",
              "inspect_study",
          ]
          workflow_names = [
              "_validate_fixed_fields",
              "_validate_dataset_root",
              "_build_evidence_node",
              "_assert_mutable",
              "create_study",
              "run_baseline",
              "define_experiment",
              "run_experiment",
              "verify_experiment",
              "compare_experiment",
              "decide_experiment",
              "record_experiment_failure",
              "freeze_study",
          ]
          expected = set(codec_names) | set(inspection_names) | set(workflow_names)
          if set(nodes) != expected:
              raise RuntimeError(
                  f"workflow top-level definitions changed: missing={sorted(expected - set(nodes))}, extra={sorted(set(nodes) - expected)}"
              )

          def block(name: str) -> str:
              node = nodes[name]
              starts = [node.lineno]
              starts.extend(item.lineno for item in node.decorator_list)
              start = min(starts)
              end = node.end_lineno
              if end is None:
                  raise RuntimeError(f"missing end line for {name}")
              return "".join(lines[start - 1 : end]).rstrip() + "\n\n"

          def module_header(parts: list[str]) -> str:
              return "\n".join(parts).rstrip() + "\n\n"

          codec_header = module_header(
              [
                  '"""Persisted Study payload codecs and stable semantic identity helpers."""',
                  "",
                  "from __future__ import annotations",
                  "",
                  "from collections.abc import Mapping",
                  "from dataclasses import dataclass",
                  "from datetime import datetime",
                  "from typing import cast",
                  "",
                  "import numpy as np",
                  "",
                  "from trade_rl.artifacts.hashing import content_digest",
                  "from trade_rl.evaluation.experiments.contracts import (",
                  "    CANDIDATE_STRATEGY_NAMES,",
                  "    CONTROL_STRATEGY_NAMES,",
                  "    ControlledFactor,",
                  "    ExperimentComparison,",
                  "    ExperimentDecision,",
                  "    ExperimentDecisionKind,",
                  "    ExperimentDefinition,",
                  "    ExperimentFailure,",
                  "    ResolvedRunConfig,",
                  "    StudyFreeze,",
                  "    StudyOutcome,",
                  "    StudyPlan,",
                  ")",
                  "from trade_rl.evaluation.experiments.delta import (",
                  "    ControlledVerification,",
                  "    ControlledVerificationStatus,",
                  ")",
                  "from trade_rl.evaluation.experiments.errors import (",
                  "    ArtifactIntegrityError,",
                  "    ContractViolationError,",
                  ")",
                  "from trade_rl.evaluation.runs.config import (",
                  "    CandidateRunConfig,",
                  "    ResolvedCandidateRunSpec,",
                  ")",
              ]
          )
          codec_constants = (
              '_ANALYSIS_BINDING_SCHEMA = "controlled_evidence_analysis_binding_v1"\n'
              '_WITHIN_ANALYSIS_SCHEMA = "controlled_evidence_analysis_v1"\n\n'
          )
          codec_source = codec_header + codec_constants + "".join(
              block(name) for name in codec_names
          )
          Path("trade_rl/evaluation/experiments/codec.py").write_text(
              codec_source, encoding="utf-8"
          )

          inspection_header = module_header(
              [
                  '"""Read-only reconstruction and tamper validation for controlled Studies."""',
                  "",
                  "from __future__ import annotations",
                  "",
                  "from dataclasses import dataclass",
                  "from pathlib import Path",
                  "",
                  "from trade_rl.evaluation.experiments.analysis import compare_evidence_sets",
                  "from trade_rl.evaluation.experiments.codec import (",
                  "    _AnalysisBinding,",
                  "    _analysis_binding_from_payload,",
                  "    _as_string,",
                  "    _baseline_context_digest,",
                  "    _comparison_from_payload,",
                  "    _decision_from_payload,",
                  "    _definition_from_payload,",
                  "    _failure_from_payload,",
                  "    _freeze_from_payload,",
                  "    _semantic_payload_without_seed,",
                  "    _semantic_without_seed,",
                  "    _study_plan_from_payload,",
                  "    _verification_from_payload,",
                  ")",
                  "from trade_rl.evaluation.experiments.contracts import (",
                  "    ExperimentComparison,",
                  "    ExperimentDecision,",
                  "    ExperimentDecisionKind,",
                  "    ExperimentDefinition,",
                  "    ExperimentFailure,",
                  "    StudyFreeze,",
                  "    StudyOutcome,",
                  "    StudyPlan,",
                  ")",
                  "from trade_rl.evaluation.experiments.delta import (",
                  "    ControlledVerification,",
                  "    ControlledVerificationStatus,",
                  "    verify_controlled_delta,",
                  ")",
                  "from trade_rl.evaluation.experiments.errors import (",
                  "    ArtifactIntegrityError,",
                  "    InvalidExperimentStateError,",
                  ")",
                  "from trade_rl.evaluation.experiments.evidence import (",
                  "    EvidenceSet,",
                  "    LoadedEvidenceSet,",
                  "    load_evidence_set,",
                  ")",
                  "from trade_rl.evaluation.experiments.store import StudyStore",
              ]
          )
          inspection_source = inspection_header + "".join(
              block(name) for name in inspection_names
          )
          inspection_source += '__all__ = ["StudySnapshot", "inspect_study"]\n'
          Path("trade_rl/evaluation/experiments/inspection.py").write_text(
              inspection_source, encoding="utf-8"
          )

          workflow_header = module_header(
              [
                  '"""Append-only mutation orchestration for controlled development research."""',
                  "",
                  "from __future__ import annotations",
                  "",
                  "from datetime import datetime",
                  "from pathlib import Path",
                  "",
                  "import numpy as np",
                  "",
                  "from trade_rl.artifacts.hashing import content_digest",
                  "from trade_rl.data import (",
                  "    MarketDataset,",
                  "    PublishedDatasetArtifact,",
                  "    inspect_published_market_dataset_artifact,",
                  "    load_market_dataset_artifact,",
                  ")",
                  "from trade_rl.evaluation.experiments.analysis import (",
                  "    analyze_evidence_set,",
                  "    compare_evidence_sets,",
                  ")",
                  "from trade_rl.evaluation.experiments.codec import (",
                  "    _analysis_binding,",
                  "    _as_string,",
                  "    _baseline_context_digest,",
                  "    _candidate_config_from_resolved,",
                  "    _candidate_config_payload,",
                  "    _resolved_contract,",
                  "    _semantic_payload_without_seed,",
                  "    _semantic_without_seed,",
                  ")",
                  "from trade_rl.evaluation.experiments.contracts import (",
                  "    ControlledFactor,",
                  "    ExperimentComparison,",
                  "    ExperimentDecision,",
                  "    ExperimentDecisionKind,",
                  "    ExperimentDefinition,",
                  "    ExperimentFailure,",
                  "    ResolvedRunConfig,",
                  "    StudyFreeze,",
                  "    StudyOutcome,",
                  "    StudyPlan,",
                  ")",
                  "from trade_rl.evaluation.experiments.delta import (",
                  "    ControlledVerification,",
                  "    ControlledVerificationStatus,",
                  "    verify_controlled_delta,",
                  ")",
                  "from trade_rl.evaluation.experiments.errors import (",
                  "    ArtifactIntegrityError,",
                  "    ContractViolationError,",
                  "    ExperimentBudgetExceededError,",
                  "    InvalidExperimentStateError,",
                  "    StudyFrozenError,",
                  ")",
                  "from trade_rl.evaluation.experiments.evidence import (",
                  "    EvidenceSet,",
                  "    execute_evidence_set,",
                  "    load_evidence_set,",
                  ")",
                  "from trade_rl.evaluation.experiments.inspection import (",
                  "    StudySnapshot,",
                  "    _StudyState,",
                  "    _experiment_dir,",
                  "    _experiment_state,",
                  "    _find_evidence,",
                  "    _reconstruct,",
                  "    inspect_study,",
                  ")",
                  "from trade_rl.evaluation.experiments.store import StudyStore",
                  "from trade_rl.evaluation.runs.config import (",
                  "    CandidateRunConfig,",
                  "    resolve_candidate_run_spec,",
                  ")",
                  "from trade_rl.evaluation.runs.provenance import build_candidate_run_provenance",
              ]
          )
          workflow_constants = (
              '_FACTOR_EFFECT_SCHEMA = "controlled_evidence_comparison_v1"\n'
              '_STUDY_FIXED_FIELDS = (\n'
              '    "fit_cutoff",\n'
              '    "evaluation_start",\n'
              '    "evaluation_stop_exclusive",\n'
              '    "initial_capital",\n'
              '    "execution_overlay",\n'
              ')\n\n'
          )
          workflow_source = workflow_header + workflow_constants + "".join(
              block(name) for name in workflow_names
          )
          workflow_source += (
              '__all__ = [\n'
              '    "StudySnapshot",\n'
              '    "compare_experiment",\n'
              '    "create_study",\n'
              '    "decide_experiment",\n'
              '    "define_experiment",\n'
              '    "freeze_study",\n'
              '    "inspect_study",\n'
              '    "record_experiment_failure",\n'
              '    "run_baseline",\n'
              '    "run_experiment",\n'
              '    "verify_experiment",\n'
              ']\n'
          )
          source_path.write_text(workflow_source, encoding="utf-8")

          layout = Path("tests/architecture/test_lean_evaluation_layout.py")
          text = layout.read_text(encoding="utf-8")
          anchor = '        "experiments/errors.py",\n        "experiments/store.py",\n'
          replacement = (
              '        "experiments/errors.py",\n'
              '        "experiments/codec.py",\n'
              '        "experiments/inspection.py",\n'
              '        "experiments/store.py",\n'
          )
          if text.count(anchor) != 1:
              raise RuntimeError("evaluation layout anchor changed")
          layout.write_text(text.replace(anchor, replacement), encoding="utf-8")

          package_doc = Path("docs/architecture/package-boundaries.md")
          text = package_doc.read_text(encoding="utf-8")
          tree_anchor = (
              "        ├── errors.py\n"
              "        ├── store.py\n"
          )
          tree_replacement = (
              "        ├── errors.py\n"
              "        ├── codec.py\n"
              "        ├── inspection.py\n"
              "        ├── store.py\n"
          )
          if text.count(tree_anchor) != 1:
              raise RuntimeError("package tree anchor changed")
          text = text.replace(tree_anchor, tree_replacement)
          owner_anchor = "`runs` はhigher-level experiment lifecycleを知らない。`evaluation/experiments/` はStudy/Experiment contract、append-only store、multi-seed EvidenceSet、analysis、controlled delta、lineage/budget/freeze workflowを所有する。"
          owner_replacement = owner_anchor + " `codec.py` はpersisted JSONから既存contractへのfail-closed decodeとstable payload/identity変換を所有し、`inspection.py` はdisk graphからのread-only state reconstruction・tamper validation・`inspect_study`を所有する。`workflow.py` はmutation lock下のcommand orchestrationだけを所有し、各mutation前のdisk再構築と既存failure-injection seamを維持する。"
          if text.count(owner_anchor) != 1:
              raise RuntimeError("experiment ownership paragraph changed")
          package_doc.write_text(text.replace(owner_anchor, owner_replacement), encoding="utf-8")

          controlled_doc = Path("docs/architecture/controlled-experiment-loop.md")
          text = controlled_doc.read_text(encoding="utf-8")
          boundary_anchor = "`evaluation/runs -> evaluation/experiments` の逆依存は禁止する。`evaluation/experiments` からsealed final-test authorizationへ依存してはならない。"
          boundary_replacement = boundary_anchor + "\n\n`evaluation/experiments` 内部では、`codec.py` がpersisted payloadのdecode/semantic identity、`inspection.py` がread-only filesystem reconstructionとtamper validation、`workflow.py` がmutation commandを所有する。read sideからmutation workflowへの逆依存は作らない。既存の `workflow.StudySnapshot` / `workflow.inspect_study` は明示export契約としてinspection ownerの同一objectをre-exportする。"
          if text.count(boundary_anchor) != 1:
              raise RuntimeError("controlled-loop boundary anchor changed")
          text = text.replace(boundary_anchor, boundary_replacement)
          state_anchor = "Study mutationは`StudyStore.mutation_lock()`でprocess間serializeし、各mutation前にdisk artifactからstateを再構築する。別DBやin-memory pointerをstateの正本にしない。"
          state_replacement = state_anchor + " read-only `inspect_study` も同じmutation lock内でdisk graphを再構築するため、inspectionとmutationが別moduleでもstate authorityはfilesystemのままである。"
          if text.count(state_anchor) != 1:
              raise RuntimeError("controlled-loop state anchor changed")
          controlled_doc.write_text(text.replace(state_anchor, state_replacement), encoding="utf-8")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Normalize generated Python only
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/codec.py \
            trade_rl/evaluation/experiments/inspection.py \
            trade_rl/evaluation/experiments/workflow.py \
            tests/architecture/test_lean_evaluation_layout.py
          uv run ruff format \
            trade_rl/evaluation/experiments/codec.py \
            trade_rl/evaluation/experiments/inspection.py \
            trade_rl/evaluation/experiments/workflow.py \
            tests/architecture/test_lean_evaluation_layout.py

      - name: Targeted GREEN and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/architecture tests/evaluation/experiments
          uv run ruff check trade_rl/evaluation/experiments tests/architecture/test_experiment_workflow_boundaries.py tests/architecture/test_lean_evaluation_layout.py
          uv run ruff format --check trade_rl/evaluation/experiments tests/architecture/test_experiment_workflow_boundaries.py tests/architecture/test_lean_evaluation_layout.py
          uv run mypy \
            trade_rl/evaluation/experiments/codec.py \
            trade_rl/evaluation/experiments/inspection.py \
            trade_rl/evaluation/experiments/workflow.py
          git diff --check

      - name: Commit split and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-experiment-workflow-split.yml
          expected=$(printf '%s\n' ".github/workflows/apply-experiment-workflow-split.yml" "docs/architecture/controlled-experiment-loop.md" "docs/architecture/package-boundaries.md" "tests/architecture/test_lean_evaluation_layout.py" "trade_rl/evaluation/experiments/codec.py" "trade_rl/evaluation/experiments/inspection.py" "trade_rl/evaluation/experiments/workflow.py")
          observed=$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          test "$observed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/apply-experiment-workflow-split.yml \
            docs/architecture/controlled-experiment-loop.md \
            docs/architecture/package-boundaries.md \
            tests/architecture/test_lean_evaluation_layout.py \
            trade_rl/evaluation/experiments/codec.py \
            trade_rl/evaluation/experiments/inspection.py \
            trade_rl/evaluation/experiments/workflow.py
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "refactor: split experiment codec and inspection boundaries"
          git push origin HEAD:refactor/experiment-workflow-boundaries
