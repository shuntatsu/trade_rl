name: Apply final branch contracts

on:
  push:
    branches:
      - agent/consolidate-open-work-2026-08-10

permissions:
  contents: write

concurrency:
  group: finalize-consolidation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Merge verified tips and repair final contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact consolidation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/consolidate-open-work-2026-08-10
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused test dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Confirm the BC regressions are RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/integrations/test_sb3_training.py::test_backend_runs_oracle_behavior_cloning_before_ppo \
            > bc-split-red.log 2>&1
          split_status=$?
          uv run pytest -q \
            tests/learning/test_hierarchical_behavior_cloning_evaluation.py::test_hierarchical_evaluation_losses_are_batch_size_invariant \
            > bc-evaluation-red.log 2>&1
          evaluation_status=$?
          set -e
          cat bc-split-red.log
          cat bc-evaluation-red.log
          test "$split_status" -ne 0
          test "$evaluation_status" -ne 0
          grep -q "explicit behavior-cloning split disagrees with validation_fraction" \
            bc-split-red.log
          grep -q "test_hierarchical_evaluation_losses_are_batch_size_invariant" \
            bc-evaluation-red.log

      - name: Merge the exact verified execution branch tip
        shell: bash
        env:
          EXECUTION_TIP: e2c9e11d4d5509c7ea8fe6b18f799f0007bdf819
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/execution-robustness-environment
          git merge-base --is-ancestor "$EXECUTION_TIP" \
            origin/agent/execution-robustness-environment

          set +e
          git merge --no-commit --no-ff "$EXECUTION_TIP"
          merge_status=$?
          set -e

          allowed_conflicts=(
            docs/EXECUTION_ROBUSTNESS.md
            docs/implementation/execution-robustness-environment-plan.md
            examples/binance-multitimeframe/walk-forward-target-weight-execution-robustness.json
            tests/examples/test_execution_robustness_profile.py
            tests/workflows/test_execution_robustness_config.py
            trade_rl/rl/environment_reward_execution_resources.py
            trade_rl/simulation/execution_stress.py
            trade_rl/workflows/market_walk_forward_config.py
          )

          if test "$merge_status" -ne 0; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for conflict in "${conflicts[@]}"; do
              allowed=false
              for path in "${allowed_conflicts[@]}"; do
                if test "$conflict" = "$path"; then
                  allowed=true
                  break
                fi
              done
              if test "$allowed" != true; then
                echo "unexpected merge conflict: $conflict" >&2
                exit 1
              fi
            done
          fi

          git checkout "$EXECUTION_TIP" -- "${allowed_conflicts[@]}"
          git add "${allowed_conflicts[@]}"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Confirm neutral execution identity is RED after merge
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/simulation/test_execution_environment_stress.py::test_neutral_environment_stress_preserves_cost_identity \
            > execution-identity-red.log 2>&1
          status=$?
          set -e
          cat execution-identity-red.log
          test "$status" -ne 0
          grep -q "test_neutral_environment_stress_preserves_cost_identity" \
            execution-identity-red.log

      - name: Apply the final BC and execution contracts
        run: uv run python scripts/apply_final_branch_contracts.py

      - name: Verify focused BC and execution contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            trade_rl/integrations/behavior_cloning.py \
            trade_rl/rl/environment_reward_execution_resources.py \
            trade_rl/simulation/execution_stress.py \
            trade_rl/workflows/market_walk_forward_config.py \
            tests/learning/test_hierarchical_behavior_cloning_evaluation.py \
            tests/workflows/test_execution_robustness_config.py \
            tests/rl/test_environment_reward_execution_resources.py \
            tests/examples/test_execution_robustness_profile.py
          uv run ruff format --check \
            trade_rl/integrations/behavior_cloning.py \
            trade_rl/rl/environment_reward_execution_resources.py \
            trade_rl/simulation/execution_stress.py \
            trade_rl/workflows/market_walk_forward_config.py \
            tests/learning/test_hierarchical_behavior_cloning_evaluation.py \
            tests/workflows/test_execution_robustness_config.py \
            tests/rl/test_environment_reward_execution_resources.py \
            tests/examples/test_execution_robustness_profile.py
          uv run mypy \
            trade_rl/integrations/behavior_cloning.py \
            trade_rl/rl/environment_reward_execution_resources.py \
            trade_rl/simulation/execution_stress.py \
            trade_rl/workflows/market_walk_forward_config.py
          uv run pytest -q \
            tests/learning/test_hierarchical_behavior_cloning_evaluation.py \
            tests/learning/test_behavior_cloning.py \
            tests/learning/test_behavior_cloning_episode_training.py \
            tests/learning/test_behavior_cloning_temporal_split.py \
            tests/integrations/test_sb3_training.py \
            tests/workflows/test_execution_robustness_config.py \
            tests/simulation/test_execution_environment_stress.py \
            tests/rl/test_environment_reward_execution_resources.py \
            tests/examples/test_execution_robustness_profile.py \
            tests/simulation/test_execution_sensitivity.py \
            tests/evaluation/test_execution_sensitivity_matrix.py

      - name: Commit the verified merge and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-branch-contracts.yml
          rm -f scripts/apply_final_branch_contracts.py
          rm -f bc-split-red.log bc-evaluation-red.log execution-identity-red.log
          git add -A
          git diff --cached --check
          git commit -m 'merge: consolidate BC and execution robustness'
          git push origin HEAD:refs/heads/agent/consolidate-open-work-2026-08-10
