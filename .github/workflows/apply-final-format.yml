name: Apply Final Ruff Format

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/final-format-ready

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Apply canonical formatter
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format \
            tests/e2e/test_research_to_serving_v2.py \
            tests/workflows/test_symbol_triplet_stage_orchestrator.py \
            trade_rl/artifacts/atomic_pointer.py \
            trade_rl/artifacts/verified_file.py \
            trade_rl/serving/structured_policy.py \
            trade_rl/workflows/full_research_state.py \
            trade_rl/workflows/symbol_triplet_stage_orchestrator.py \
            trade_rl/workflows/symbol_triplet_training_cursor.py
          uv run ruff format --check .
          rm -rf .automation
          rm -f .github/workflows/apply-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:agent/harden-audit-contracts-v2
