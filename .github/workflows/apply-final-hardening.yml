name: Apply Final Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/rebased/ready

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Verify and apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cd .automation/rebased
          sha256sum -c checksums.txt
          cat chunk.* | base64 --decode > /tmp/rebased-hardening.patch.gz
          echo "791b5c92022f6d3b72e653b1f2816384cdef097ac4ce1bfb366b165a8755f131  /tmp/rebased-hardening.patch.gz" | sha256sum -c -
          gzip -dc /tmp/rebased-hardening.patch.gz > /tmp/rebased-hardening.patch
          echo "3572e36f6bdbdc7c5e171259e5238ccbebf66628f1714c13a0f11f597a40346a  /tmp/rebased-hardening.patch" | sha256sum -c -
          cd ../..
          git apply --check /tmp/rebased-hardening.patch
          git apply /tmp/rebased-hardening.patch
          rm -rf .automation
          rm -f .github/workflows/apply-final-hardening.yml
          rm -f .github/workflows/source-export-current.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bind execution evidence and serialize stage promotion"
          git push origin HEAD:agent/harden-audit-contracts-v2
