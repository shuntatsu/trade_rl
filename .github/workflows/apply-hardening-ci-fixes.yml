name: Apply hardening CI fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/harden-data-bc-serving-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Remove duplicated PostgreSQL economic arrays
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/integrations/postgres_market_dataset.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          result = []
          skip_legacy_arrays = False
          in_constructor = False
          economics_expanded = False
          duplicate_arguments = {
              'minimum_notional=minimum_notional,',
              'lot_size=lot_size,',
              'tick_size=tick_size,',
              'funding_due=funding_counts > 0,',
              'asset_active=active,',
              'symbol_active=active,',
              'information_available=active,',
              'available_at=available_at,',
          }
          removed_arguments = []
          for line in lines:
              stripped = line.strip()
              if stripped == 'tick_size = np.broadcast_to(':
                  skip_legacy_arrays = True
              if skip_legacy_arrays:
                  if stripped.startswith('normalization_digest ='):
                      skip_legacy_arrays = False
                  else:
                      continue
              if stripped == 'dataset = MarketDataset(':
                  in_constructor = True
              if in_constructor and stripped == '**economics.market_dataset_kwargs(),':
                  economics_expanded = True
              if in_constructor and economics_expanded and stripped in duplicate_arguments:
                  removed_arguments.append(stripped)
                  continue
              result.append(line)
              if in_constructor and stripped == ')':
                  in_constructor = False
          if removed_arguments and set(removed_arguments) != duplicate_arguments:
              raise RuntimeError(f'unexpected duplicate removal set: {removed_arguments}')
          path.write_text(''.join(result), encoding='utf-8')
          PY
      - name: Verify PostgreSQL regression
        run: |
          uv sync --extra dev --extra postgres
          uv run ruff check --fix trade_rl/integrations/postgres_market_dataset.py
          uv run ruff format trade_rl/integrations/postgres_market_dataset.py
          uv run pytest tests/integrations/test_postgres_market_dataset.py tests/data/test_economic_semantics.py -q
          uv run ruff check trade_rl/integrations/postgres_market_dataset.py
          uv run ruff format --check trade_rl/integrations/postgres_market_dataset.py
      - name: Commit fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/integrations/postgres_market_dataset.py
          git commit -m 'fix: remove duplicate PostgreSQL economic arrays'
          git push origin "HEAD:${HEAD_BRANCH}"
