name: Apply hardening CI fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/harden-data-bc-serving-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Apply compatibility-safe contract updates
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import shutil
          from pathlib import Path

          root = Path('.')
          training_run = root / 'trade_rl/workflows/training_run.py'
          source = training_run.read_text(encoding='utf-8')
          for line in (
              '        "behavior_cloning_causal_holdout_bootstrap_resamples",\n',
              '        "behavior_cloning_causal_holdout_confidence_level",\n',
          ):
              if line not in source:
                  raise RuntimeError(f'missing required-field line: {line.strip()}')
              source = source.replace(line, '', 1)
          training_run.write_text(source, encoding='utf-8')

          def add_defaults(value: object) -> None:
              if isinstance(value, dict):
                  if value.get('schema_version') == 'training_run_config_v3':
                      training = value.get('training')
                      if isinstance(training, dict):
                          training.setdefault(
                              'behavior_cloning_causal_holdout_bootstrap_resamples',
                              2_000,
                          )
                          training.setdefault(
                              'behavior_cloning_causal_holdout_confidence_level',
                              0.95,
                          )
                  for child in value.values():
                      add_defaults(child)
              elif isinstance(value, list):
                  for child in value:
                      add_defaults(child)

          for path in sorted((root / 'examples').rglob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              add_defaults(payload)
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )

          info_test = root / 'tests/rl/test_environment_info_service.py'
          source = info_test.read_text(encoding='utf-8')
          anchor = '        "executed_target",\n'
          addition = (
              anchor
              + '        "sampled_policy_action",\n'
              + '        "effective_filled_weights",\n'
              + '        "sampled_policy_to_filled_l1",\n'
          )
          if addition not in source:
              if anchor not in source:
                  raise RuntimeError('environment info key anchor not found')
              source = source.replace(anchor, addition, 1)
          info_test.write_text(source, encoding='utf-8')

          docs_test = root / 'tests/test_current_documentation_contract.py'
          source = docs_test.read_text(encoding='utf-8')
          source = source.replace(
              '        "training_run_config_v2",\n',
              '        "training_run_config_v3",\n',
              1,
          )
          source = source.replace(
              '        "structured_policy_export_v1",\n',
              '        "structured_policy_export_v2",\n',
              1,
          )
          docs_test.write_text(source, encoding='utf-8')

          historical = root / 'docs/superpowers'
          if historical.exists():
              shutil.rmtree(historical)
          PY
      - name: Verify compatibility regressions
        run: |
          uv sync --extra dev --extra train-sb3 --extra postgres
          uv run ruff check --fix \
            trade_rl/workflows/training_run.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/rl/test_environment_info_service.py \
            tests/test_current_documentation_contract.py
          uv run ruff format \
            trade_rl/workflows/training_run.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/rl/test_environment_info_service.py \
            tests/test_current_documentation_contract.py
          uv run mypy trade_rl
          uv run pytest \
            tests/e2e/test_research_to_serving_v2.py \
            tests/examples/test_binance_multitimeframe_full_assets.py \
            tests/examples/test_binance_smoke_assets.py \
            tests/examples/test_constrained_growth_profiles.py \
            tests/examples/test_growth_optimal_reward_profiles.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/rl/test_environment_info_service.py \
            tests/test_current_documentation_contract.py \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py \
            tests/workflows/test_pure_growth_training_contract.py \
            tests/workflows/test_training_run_config.py -q
          uv run ruff check .
          uv run ruff format --check .
      - name: Commit compatibility fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: preserve config and telemetry compatibility'
          git push origin "HEAD:${HEAD_BRANCH}"
