name: Apply Lock Protocol Vulture Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/lock-protocol-vulture-ready

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Apply positional protocol naming
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/symbol_triplet_stage_orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old = "        self, file_descriptor: int, mode: int, byte_count: int, /\n"
          new = "        self, _file_descriptor: int, _mode: int, _byte_count: int, /\n"
          if text.count(old) != 1:
              raise SystemExit("lock protocol signature changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv sync --extra dev --extra train-sb3
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy trade_rl
          uv run vulture trade_rl tests --min-confidence 100
          rm -rf .automation
          rm -f .github/workflows/apply-lock-protocol-vulture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Mark lock protocol parameters positional-only"
          git push origin HEAD:agent/harden-audit-contracts-v2
