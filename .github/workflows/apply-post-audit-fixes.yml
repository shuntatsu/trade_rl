name: Apply Post Audit Fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-post-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fix-post-audit-residuals'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-post-audit-residuals
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Apply vectorization and fail-closed config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          builder_path = Path('trade_rl/data/builder.py')
          builder = builder_path.read_text(encoding='utf-8')
          anchor = '''def _contiguous_window(mask: np.ndarray, start: int, stop: int) -> bool:
              return bool(np.all(mask[start:stop]))


          '''
          helper = '''def _contiguous_window(mask: np.ndarray, start: int, stop: int) -> bool:
              return bool(np.all(mask[start:stop]))


          def _calculate_one_bar_returns(
              *,
              close: np.ndarray,
              causal_row_present: np.ndarray,
              symbol_active: np.ndarray,
          ) -> tuple[np.ndarray, np.ndarray]:
              """Calculate contiguous one-bar returns without per-bar mask rebuilding."""

              close_values = np.asarray(close, dtype=np.float64)
              row_present = np.asarray(causal_row_present, dtype=np.bool_)
              active = np.asarray(symbol_active, dtype=np.bool_)
              if (
                  close_values.ndim != 2
                  or row_present.shape != close_values.shape
                  or active.shape != close_values.shape
              ):
                  raise ValueError(
                      "one-bar return inputs must share a two-dimensional shape"
                  )
              valid = row_present & active
              available = np.zeros_like(valid)
              available[1:] = valid[1:] & valid[:-1]
              returns = np.zeros_like(close_values)
              ratios = np.ones_like(close_values[1:])
              np.divide(
                  close_values[1:],
                  close_values[:-1],
                  out=ratios,
                  where=available[1:],
              )
              returns[1:] = np.where(available[1:], np.log(ratios), 0.0)
              return returns, available


          '''
          if builder.count(anchor) != 1:
              raise SystemExit('builder helper insertion point is not unique')
          builder = builder.replace(anchor, helper, 1)
          loop_start_marker = (
              '        one_bar_returns = np.zeros((n_bars, n_symbols), dtype=np.float64)'
          )
          loop_end_marker = '\n\n        global_features = np.zeros('
          loop_start = builder.find(loop_start_marker)
          loop_end = builder.find(loop_end_marker, loop_start)
          if loop_start < 0 or loop_end < 0:
              raise SystemExit('one-bar return loop boundaries were not found')
          new_loop = '''        one_bar_returns, one_bar_available = _calculate_one_bar_returns(
              close=close,
              causal_row_present=causal_row_present,
              symbol_active=symbol_active,
          )'''
          builder = builder[:loop_start] + new_loop + builder[loop_end:]
          builder_path.write_text(builder, encoding='utf-8')

          training_path = Path('trade_rl/workflows/training_run.py')
          training = training_path.read_text(encoding='utf-8')
          preroll_start_marker = (
              '        if not self.environment.require_full_reward_preroll:'
          )
          preroll_end_marker = (
              '\n        if self.environment.resolved_reward_config() != self.reward:'
          )
          preroll_start = training.find(preroll_start_marker)
          preroll_end = training.find(preroll_end_marker, preroll_start)
          if preroll_start < 0 or preroll_end < 0:
              raise SystemExit('training preroll boundaries were not found')
          new_preroll = '''        if not self.environment.require_full_reward_preroll:
              raise ValueError(
                  "training requires require_full_reward_preroll=true; "
                  "configuration is not rewritten implicitly"
              )'''
          training = training[:preroll_start] + new_preroll + training[preroll_end:]
          training_path.write_text(training, encoding='utf-8')
          PY
          rm .github/workflows/apply-post-audit-fixes.yml
          uvx ruff format \
            trade_rl/data/builder.py \
            trade_rl/workflows/training_run.py \
            tests/data/test_one_bar_returns.py \
            tests/workflows/test_training_preroll_contract.py
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden remaining audit contracts'
          git push origin HEAD:agent/fix-post-audit-residuals
