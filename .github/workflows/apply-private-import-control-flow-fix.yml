name: Apply private import control-flow fix

on:
  push:
    branches:
      - agent/private-import-control-flow-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/private-import-control-flow-hardening
          persist-credentials: true
          fetch-depth: 1

      - name: Apply minimal scanner fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64; exec(base64.b64decode(''))"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/architecture/import_references.py .github/workflows
          git commit -m 'fix: preserve private import aliases across control flow'
          git push origin HEAD:agent/private-import-control-flow-hardening
