name: Apply realized diagnostics temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - run: python tools/_temporary_fix_realized_diagnostics.py
      - name: Verify realized diagnostics
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/workflows/universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_evidence.py
          uv run ruff check trade_rl/workflows/universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_evidence.py
          uv run ruff format --check trade_rl/workflows/universal_causal_alpha_fitting.py tests/workflows/test_universal_causal_alpha_evidence.py
          uv run mypy trade_rl/workflows/universal_causal_alpha_fitting.py
          uv run pytest \
            tests/workflows/test_universal_causal_alpha_evidence.py \
            tests/workflows/test_universal_causal_alpha_fitting.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_causal_alpha_assembly.py \
            -q
      - name: Commit verified fix and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_fix_realized_diagnostics.py \
            .github/workflows/apply-realized-diagnostics-temporary.yml \
            .github/workflows/causal-alpha-realized-diagnostics-red-temporary.yml
          git add \
            trade_rl/workflows/universal_causal_alpha_fitting.py \
            tests/workflows/test_universal_causal_alpha_evidence.py
          git commit -m 'fix: evaluate causal diagnostics on realized labels'
          git push origin HEAD:feature/universal-causal-alpha-teacher
