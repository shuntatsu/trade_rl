name: Apply research contract hardening

on:
  push:
    branches:
      - agent/harden-data-bc-serving-contracts

permissions:
  contents: write

concurrency:
  group: apply-research-contract-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Apply deterministic transformation
        run: python tools/apply_research_contract_hardening.py
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test: add research hardening contract tests"
          git push origin HEAD:${GITHUB_REF_NAME}
