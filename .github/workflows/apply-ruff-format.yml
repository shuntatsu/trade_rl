name: Apply Ruff Format

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/ruff-format.patch
      - .github/workflows/apply-ruff-format.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Apply Ruff formatter diff
        shell: bash
        run: |
          set -euo pipefail
          git apply -p0 --check .automation/ruff-format.patch
          git apply -p0 .automation/ruff-format.patch
          rm .automation/ruff-format.patch
          rmdir .automation 2>/dev/null || true
          rm .github/workflows/apply-ruff-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply Ruff formatting to audit hardening"
          git push origin HEAD:agent/harden-audit-contracts-v2
