name: Apply selection persistence temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - run: python tools/_temporary_apply_selection_persistence.py
      - name: Verify selection persistence
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/workflows/universal_causal_alpha_teacher.py
            trade_rl/workflows/universal_stage_a_training.py
            trade_rl/workflows/universal_full_research_training.py
            trade_rl/workflows/universal_training_runner.py
            tests/workflows/test_universal_causal_alpha_package.py
            tests/workflows/test_universal_causal_alpha_shared_training.py
            tests/workflows/test_universal_sb3_training_assembly.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/workflows/universal_stage_a_training.py \
            trade_rl/workflows/universal_full_research_training.py \
            trade_rl/workflows/universal_training_runner.py
          uv run lint-imports
          uv run pytest \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_causal_alpha_shared_training.py \
            tests/workflows/test_universal_sb3_training_assembly.py \
            tests/workflows/test_universal_stage_a_training_orchestrator.py \
            tests/workflows/test_universal_full_research_training.py \
            -q
      - name: Commit verified persistence and remove temporary assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            tools/_temporary_apply_selection_persistence.py \
            .github/workflows/apply-selection-persistence-temporary.yml \
            .github/workflows/causal-alpha-selection-persist-red-temporary.yml
          git add \
            trade_rl/workflows/universal_causal_alpha_teacher.py \
            trade_rl/workflows/universal_stage_a_training.py \
            trade_rl/workflows/universal_full_research_training.py \
            trade_rl/workflows/universal_training_runner.py \
            tests/workflows/test_universal_causal_alpha_package.py \
            tests/workflows/test_universal_causal_alpha_shared_training.py \
            tests/workflows/test_universal_sb3_training_assembly.py
          git commit -m 'fix: persist causal selection before holdout replay'
          git push origin HEAD:feature/universal-causal-alpha-teacher
