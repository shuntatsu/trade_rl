name: Apply Stage A4 Symbol-Disjoint Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/stage-a4-symbol-disjoint.retry

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a4-symbol-disjoint-training-fix
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Apply and verify symbol-disjoint training patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/stage-a4-symbol-disjoint.patch.gz.b64 > /tmp/stage-a4.patch.gz
          test "$(sha256sum .automation/stage-a4-symbol-disjoint.patch.gz.b64 | cut -d' ' -f1)" = "cb1caf1d1fbaa5a6e733eb6fa9fc0ebc9346619fde278a6efc0ce051bd01ad40"
          gzip --decompress --stdout /tmp/stage-a4.patch.gz > /tmp/stage-a4.patch
          test "$(sha256sum /tmp/stage-a4.patch | cut -d' ' -f1)" = "e4189fe6aa856765039bda4c5ed743abee6574f5c671165221c388d7b7a2503d"
          git apply --check --exclude=trade_rl/workflows/symbol_triplet_training_cursor.py /tmp/stage-a4.patch
          git apply --exclude=trade_rl/workflows/symbol_triplet_training_cursor.py /tmp/stage-a4.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/symbol_triplet_training_cursor.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "from typing import Final, cast\n",
                  "from typing import Final, Protocol, cast\n",
              ),
              (
                  "    SYMBOL_TRIPLET_SIZE,\n"
                  "    SYMBOL_TRIPLET_SPLIT_COUNTS,\n"
                  "    SymbolTripletManifest,\n"
                  "    SymbolTripletSlot,\n",
                  "    SYMBOL_TRIPLET_SIZE,\n"
                  "    SymbolTripletSlot,\n"
                  "    TripletSplit,\n",
              ),
              (
                  "_TRAIN_CYCLE_SCHEMA: Final = \"symbol_triplet_train_cycle_v1\"\n\n\n",
                  "_TRAIN_CYCLE_SCHEMA: Final = \"symbol_triplet_train_cycle_v1\"\n\n\n"
                  "class TrainingTripletManifest(Protocol):\n"
                  "    @property\n"
                  "    def digest(self) -> str: ...\n\n"
                  "    @property\n"
                  "    def schedule_identity(self) -> str: ...\n\n"
                  "    def slots_for(\n"
                  "        self, split: TripletSplit\n"
                  "    ) -> tuple[SymbolTripletSlot, ...]: ...\n\n\n",
              ),
              (
                  "        train_count = SYMBOL_TRIPLET_SPLIT_COUNTS[\"train\"]\n"
                  "        expected_stage_count = cycles * train_count\n"
                  "        if len(self.stages) != expected_stage_count:\n"
                  "            raise ValueError(\"symbol-triplet training plan stage count mismatch\")\n",
                  "        if not self.stages or len(self.stages) % cycles != 0:\n"
                  "            raise ValueError(\"symbol-triplet training plan stage count mismatch\")\n"
                  "        train_count = len(self.stages) // cycles\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"cursor patch anchor changed: {old[:40]!r}")
              text = text.replace(old, new, 1)
          if text.count("manifest: SymbolTripletManifest") != 3:
              raise SystemExit("cursor manifest annotation count changed")
          text = text.replace(
              "manifest: SymbolTripletManifest",
              "manifest: TrainingTripletManifest",
          )
          path.write_text(text, encoding="utf-8")
          PY
          uv sync --extra dev --extra train-sb3
          uv run pytest -q \
            tests/workflows/test_symbol_disjoint_triplet_manifest.py \
            tests/workflows/test_symbol_triplet_training_cursor.py \
            tests/workflows/test_binance_symbol_triplet_stage_command.py \
            tests/examples/test_identity_free_runner_contract.py
          uv run ruff format .
          uv run ruff check .
          uv run mypy trade_rl
          uv run vulture trade_rl tests --min-confidence 100
          rm -rf .automation
          rm -f .github/workflows/apply-stage-a4-symbol-disjoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Stage A triplet training symbol-disjoint"
          git push origin HEAD:agent/stage-a4-symbol-disjoint-training-fix
