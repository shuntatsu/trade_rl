name: Apply Stale Reduce-Only Projection

on:
  push:
    branches:
      - codex/v10-execution-lifecycle-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'stale-reduce-only-green-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - run: python .github/patch_reduce_only_satisfied.py
      - run: |
          uv run ruff format trade_rl/risk/pretrade.py
          uv run ruff check trade_rl/risk/pretrade.py tests/risk/test_pretrade_reduce_only.py
          uv run pytest -q tests/risk/test_pretrade.py tests/risk/test_pretrade_reduce_only.py tests/rl/test_environment_reduce_only_integration.py tests/learning/test_causal_alpha_v10_reduce_only.py
      - name: Commit verified projection
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/risk/pretrade.py
          git commit -m 'fix: make delayed reduce-only intent idempotent'
          git push origin HEAD:codex/v10-execution-lifecycle-hardening
