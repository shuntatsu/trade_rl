name: Apply strategy dataset scope refactor

on:
  push:
    branches:
      - refactor/strategy-dataset-scope-validator

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5

      - name: Guard exact RED/contracts parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0c1db7a46b1b6133e258d08aa1dff6a1d2398d10"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-strategy-dataset-scope-refactor.yml"

      - name: Apply responsibility move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          supervised = Path("trade_rl/strategies/forecasts/supervised.py")
          text = supervised.read_text()
          old = '''from trade_rl.data.market import MarketDataset


def validated_feature_indices(
    dataset: MarketDataset,
    feature_indices: tuple[int, ...],
) -> tuple[int, ...]:
    indices = tuple(feature_indices)
    if not indices or len(set(indices)) != len(indices):
        raise ValueError("feature_indices must be non-empty and unique")
    if any(
        isinstance(index, bool) or not isinstance(index, int) or index < 0
        for index in indices
    ):
        raise ValueError("feature_indices must contain non-negative integers")
    if max(indices) >= dataset.n_features:
        raise ValueError("feature index is outside dataset features")
    return indices


def validated_symbol_indices(
    dataset: MarketDataset,
    symbol_indices: tuple[int, ...] | None,
) -> tuple[int, ...]:
    """Resolve an optional fit scope while rejecting ambiguous symbol indices."""

    if symbol_indices is None:
        return tuple(range(dataset.n_symbols))
    indices = tuple(symbol_indices)
    if not indices or len(set(indices)) != len(indices):
        raise ValueError("symbol_indices must be non-empty and unique")
    if any(
        isinstance(index, bool) or not isinstance(index, int) or index < 0
        for index in indices
    ):
        raise ValueError("symbol_indices must contain non-negative integers")
    if max(indices) >= dataset.n_symbols:
        raise ValueError("symbol index is outside dataset symbols")
    return indices


'''
          new = '''from trade_rl.data.market import MarketDataset
from trade_rl.strategies.dataset_scope import (
    validated_feature_indices,
    validated_symbol_indices,
)


'''
          if text.count(old) != 1:
              raise RuntimeError("supervised validator block differs from expected RED parent")
          supervised.write_text(text.replace(old, new))

          ppo = Path("trade_rl/strategies/rl/ppo.py")
          text = ppo.read_text()
          old = '''from trade_rl.strategies.forecasts.supervised import (
    validated_feature_indices,
    validated_symbol_indices,
)
'''
          new = '''from trade_rl.strategies.dataset_scope import (
    validated_feature_indices,
    validated_symbol_indices,
)
'''
          if text.count(old) != 1:
              raise RuntimeError("PPO validator import differs from expected RED parent")
          ppo.write_text(text.replace(old, new))

          docs = Path("docs/architecture/package-boundaries.md")
          text = docs.read_text()
          replacements = (
              (
                  '''├── strategies/
│   ├── interface.py
''',
                  '''├── strategies/
│   ├── dataset_scope.py
│   ├── interface.py
''',
              ),
              (
                  '''### `strategies`

small strategy interfaceとlogical intent、controls、rule、forecast、teacher-free RLを持つ。evaluationを知らない。
''',
                  '''### `strategies`

small strategy interfaceとlogical intent、controls、rule、forecast、teacher-free RLを持つ。evaluationを知らない。`dataset_scope.py` はdatasetに束縛されたfeature/symbol selection validationの単一ownerであり、forecastとRLのsibling familyが互いの内部実装へ依存せず共有する。model自身やcandidate config自身の不変条件validationは各ownerに残す。
''',
              ),
              (
                  '''strategies  -X-> evaluation
''',
                  '''strategies  -X-> evaluation
strategies/rl -X-> strategies/forecasts
''',
              ),
              (
                  '''`evaluation` はlower core packagesを利用してよい。ただしlower layerからbootstrapへ逆依存しない。依存方向を逆転させる必要が出た場合、循環依存や責務漏れを先に疑う。
''',
                  '''`evaluation` はlower core packagesを利用してよい。ただしlower layerからbootstrapへ逆依存しない。strategy family間で共有するdataset-bound selectionはroot `strategies/dataset_scope.py` を経由し、RLからforecast内部へ依存させない。依存方向を逆転させる必要が出た場合、循環依存や責務漏れを先に疑う。
''',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f"package-boundaries anchor differs: {old[:40]!r}")
              text = text.replace(old, new)
          docs.write_text(text)
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Targeted GREEN and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pytest -q \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py \
            tests/strategies/test_supervised_forecast_dataset.py \
            tests/strategies/test_ppo_intent.py
          uv run ruff check \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py
          uv run ruff format --check \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py
          uv run mypy \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py
          ! grep -R "trade_rl.strategies.forecasts" trade_rl/strategies/rl --include='*.py'

      - name: Commit refactor and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-strategy-dataset-scope-refactor.yml
          expected=$(printf '%s\n' ".github/workflows/apply-strategy-dataset-scope-refactor.yml" "docs/architecture/package-boundaries.md" "trade_rl/strategies/forecasts/supervised.py" "trade_rl/strategies/rl/ppo.py")
          observed=$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          test "$observed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/apply-strategy-dataset-scope-refactor.yml docs/architecture/package-boundaries.md trade_rl/strategies/forecasts/supervised.py trade_rl/strategies/rl/ppo.py
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "refactor: share dataset-bound strategy selection validation"
          git push origin HEAD:refactor/strategy-dataset-scope-validator
