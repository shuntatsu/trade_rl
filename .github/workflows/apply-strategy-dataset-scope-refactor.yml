name: Apply strategy dataset scope refactor

on:
  push:
    branches:
      - refactor/strategy-dataset-scope-validator

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6

      - name: Guard exact helper-fix parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8b0a2e59a7d4f21d5bb4b7601bef1f0b95ab1e6c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-strategy-dataset-scope-refactor.yml"

      - name: Apply responsibility move
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          supervised = Path("trade_rl/strategies/forecasts/supervised.py")
          text = supervised.read_text()
          start = text.index("\ndef validated_feature_indices(")
          end = text.index("\n\n@dataclass", start)
          shared_import = "\nfrom trade_rl.strategies.dataset_scope import (\n    validated_feature_indices,\n    validated_symbol_indices,\n)\n"
          supervised.write_text(text[:start] + shared_import + text[end:])

          ppo = Path("trade_rl/strategies/rl/ppo.py")
          text = ppo.read_text()
          old = "from trade_rl.strategies.forecasts.supervised import (\n    validated_feature_indices,\n    validated_symbol_indices,\n)\n"
          new = "from trade_rl.strategies.dataset_scope import (\n    validated_feature_indices,\n    validated_symbol_indices,\n)\n"
          if text.count(old) != 1:
              raise RuntimeError("PPO validator import differs from expected RED parent")
          ppo.write_text(text.replace(old, new))

          docs = Path("docs/architecture/package-boundaries.md")
          text = docs.read_text()
          replacements = [
              ("├── strategies/\n│   ├── interface.py\n", "├── strategies/\n│   ├── dataset_scope.py\n│   ├── interface.py\n"),
              ("small strategy interfaceとlogical intent、controls、rule、forecast、teacher-free RLを持つ。evaluationを知らない。", "small strategy interfaceとlogical intent、controls、rule、forecast、teacher-free RLを持つ。evaluationを知らない。`dataset_scope.py` はdatasetに束縛されたfeature/symbol selection validationの単一ownerであり、forecastとRLのsibling familyが互いの内部実装へ依存せず共有する。model自身やcandidate config自身の不変条件validationは各ownerに残す。"),
              ("strategies  -X-> evaluation\n", "strategies  -X-> evaluation\nstrategies/rl -X-> strategies/forecasts\n"),
              ("`evaluation` はlower core packagesを利用してよい。ただしlower layerからbootstrapへ逆依存しない。依存方向を逆転させる必要が出た場合、循環依存や責務漏れを先に疑う。", "`evaluation` はlower core packagesを利用してよい。ただしlower layerからbootstrapへ逆依存しない。strategy family間で共有するdataset-bound selectionはroot `strategies/dataset_scope.py` を経由し、RLからforecast内部へ依存させない。依存方向を逆転させる必要が出た場合、循環依存や責務漏れを先に疑う。"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f"package-boundaries anchor differs: {old[:40]!r}")
              text = text.replace(old, new)
          docs.write_text(text)
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Targeted GREEN and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pytest -q \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py \
            tests/strategies/test_supervised_forecast_dataset.py \
            tests/strategies/test_ppo_intent.py
          uv run ruff check \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py
          uv run ruff format --check \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py \
            tests/architecture/test_lean_dependency_boundaries.py \
            tests/architecture/test_lean_strategy_layout.py \
            tests/strategies/test_dataset_scope_contract.py
          uv run mypy \
            trade_rl/strategies/dataset_scope.py \
            trade_rl/strategies/forecasts/supervised.py \
            trade_rl/strategies/rl/ppo.py
          ! grep -R "trade_rl.strategies.forecasts" trade_rl/strategies/rl --include='*.py'

      - name: Commit refactor and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-strategy-dataset-scope-refactor.yml
          expected=$(printf '%s\n' ".github/workflows/apply-strategy-dataset-scope-refactor.yml" "docs/architecture/package-boundaries.md" "trade_rl/strategies/forecasts/supervised.py" "trade_rl/strategies/rl/ppo.py")
          observed=$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          test "$observed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/apply-strategy-dataset-scope-refactor.yml docs/architecture/package-boundaries.md trade_rl/strategies/forecasts/supervised.py trade_rl/strategies/rl/ppo.py
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "refactor: share dataset-bound strategy selection validation"
          git push origin HEAD:refactor/strategy-dataset-scope-validator
