name: Apply structured export compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-export-tracer-warnings'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3 --extra export
      - name: Add direct-action preference with predict fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/rl/structured_export.py')
          source = path.read_text(encoding='utf-8')
          old_init = '''        self.policy = policy
          self.keys = keys
          self.synthesize_decision_index = synthesize_decision_index
          '''
          new_init = '''        self.policy = policy
          self.keys = keys
          self.synthesize_decision_index = synthesize_decision_index
          self.use_direct_actions = callable(
              getattr(policy, "deterministic_actions", None)
          )
          '''
          old_forward = '''        return self.policy.deterministic_actions(observation)
          '''
          new_forward = '''        if self.use_direct_actions:
              return self.policy.deterministic_actions(observation)
          return self.policy._predict(observation, deterministic=True)
          '''
          old_validation = '''    if not callable(getattr(policy, "deterministic_actions", None)):
              raise TypeError("structured export policy must expose deterministic_actions")
          '''
          new_validation = '''    has_direct_actions = callable(
              getattr(policy, "deterministic_actions", None)
          )
          has_predict = callable(getattr(policy, "_predict", None))
          if not has_direct_actions and not has_predict:
              raise TypeError(
                  "structured export policy must expose deterministic_actions or _predict"
              )
          '''

          def normalized(value: str) -> str:
              return (
                  '\n'.join(
                      line[10:] if line.startswith('          ') else line
                      for line in value.splitlines()
                  )
                  + '\n'
              )

          replacements = (
              (normalized(old_init), normalized(new_init)),
              (normalized(old_forward), normalized(new_forward)),
              (normalized(old_validation), normalized(new_validation)),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f'structured compatibility anchor missing: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          uv run ruff check --fix trade_rl/rl/structured_export.py
          uv run ruff format trade_rl/rl/structured_export.py
      - name: Verify compatibility and tracer contracts
        run: |
          uv run lint-imports
          uv run pytest \
            tests/rl/test_structured_export.py \
            tests/rl/test_policy_export.py \
            tests/rl/test_export_tracer_safety.py \
            tests/workflows/test_market_walk_forward.py::test_structured_walk_forward_trains_three_seed_ensemble_end_to_end \
            -q
          uv run mypy trade_rl
          uv run ruff check .
          uv run ruff format --check .
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/rl/structured_export.py
          git commit -m 'fix: preserve structured export compatibility'
          git push origin "HEAD:${HEAD_BRANCH}"
