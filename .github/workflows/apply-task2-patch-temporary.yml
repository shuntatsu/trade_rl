name: Apply Task 2 patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-task2-patch-temporary.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Apply patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/task2-oracle-teacher.patch
          rm .github/task2-oracle-teacher.patch
          rm .github/workflows/apply-task2-patch-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/learning/oracle_teacher.py .github
          git commit -m "feat: expose Oracle Bellman parameters"
          git push origin HEAD:agent/oracle-bellman-batched-solver
