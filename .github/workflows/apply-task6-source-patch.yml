name: Apply Task 6 source patch

on:
  push:
    branches:
      - agent/pr191-stability-correction-v2

permissions:
  contents: write

concurrency:
  group: apply-task6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/task6-apply.patch
          git apply .github/task6-apply.patch
          rm .github/task6-apply.patch
          rm .github/workflows/apply-task6-source-patch.yml
          git add -A
          git diff --cached --check

      - name: Commit exact source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: wire Lagrangian PPO training backend"
          git push origin "HEAD:${GITHUB_REF_NAME}"
