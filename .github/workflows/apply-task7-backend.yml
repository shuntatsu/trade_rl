name: Apply Task 7 backend wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-task7-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply staged backend transform
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_task7_backend.py
          rm .github/scripts/apply_task7_backend.py
          rm .github/workflows/apply-task7-backend.yml
          git add -A
          git diff --cached --check

      - name: Commit probe backend wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: wire canonical probe into Lagrangian backend"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
