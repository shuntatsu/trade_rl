name: Apply Task 7 checkpoint probe test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-task7-checkpoint-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact checkpoint test patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/task7-checkpoint-probe.patch
          git apply .github/task7-checkpoint-probe.patch
          rm .github/task7-checkpoint-probe.patch
          rm .github/workflows/apply-task7-checkpoint-probe.yml
          git add -A
          git diff --cached --check

      - name: Commit probe checkpoint test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: preserve canonical probe checkpoint identity"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
