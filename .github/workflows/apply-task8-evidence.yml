name: Apply Task 8 evidence GREEN

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-task8-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply evidence wiring
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_task8_evidence.py
          rm .github/scripts/apply_task8_evidence.py
          rm .github/workflows/apply-task8-evidence.yml
          rm -f .github/workflows/task8-evidence-red.yml
          rm -f .github/workflows/task8-red.yml

      - name: Normalize changed sources
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix \
            trade_rl/integrations/lagrangian_ppo.py \
            trade_rl/rl/lagrangian_diagnostics.py \
            trade_rl/rl/lagrangian_evidence.py \
            tests/rl/test_lagrangian_diagnostics.py \
            tests/rl/test_lagrangian_evidence.py \
            tests/integrations/test_lagrangian_evidence_integration.py
          uv run ruff format \
            trade_rl/integrations/lagrangian_ppo.py \
            trade_rl/rl/lagrangian_diagnostics.py \
            trade_rl/rl/lagrangian_evidence.py \
            tests/rl/test_lagrangian_diagnostics.py \
            tests/rl/test_lagrangian_evidence.py \
            tests/integrations/test_lagrangian_evidence_integration.py

      - name: Run Task 8 tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/rl/test_lagrangian_diagnostics.py \
            tests/rl/test_lagrangian_evidence.py \
            tests/integrations/test_lagrangian_evidence_integration.py \
            tests/integrations/test_lagrangian_checkpoint_roundtrip.py
          uv run mypy \
            trade_rl/integrations/lagrangian_ppo.py \
            trade_rl/rl/lagrangian_diagnostics.py \
            trade_rl/rl/lagrangian_evidence.py

      - name: Commit Task 8 GREEN
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: record raw Lagrangian stability evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
