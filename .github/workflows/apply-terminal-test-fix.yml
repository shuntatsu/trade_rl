name: Apply Terminal Test Expectations

on:
  push:
    branches:
      - agent/fix-terminal-contract-first

permissions:
  contents: write

concurrency:
  group: apply-terminal-test-expectations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-terminal-contract-first
          fetch-depth: 0
          persist-credentials: true

      - name: Update obsolete terminal expectations
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/agent-terminal-test-fix.patch
          git apply .github/agent-terminal-test-fix.patch
          rm .github/agent-terminal-test-fix.patch
          rm .github/workflows/apply-terminal-test-fix.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align terminal expectations with truncation"
          git push origin HEAD:agent/fix-terminal-contract-first
