name: Apply Training Preroll Boundary

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fix-post-audit-residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-post-audit-residuals
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Bind preroll default at training JSON boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/workflows/training_run.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '        environment_data = _tuple_fields(\n'
          end_marker = '        emergency_risk_data = require_dataclass_fields(\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('training environment parser boundaries were not found')
          replacement = '''        environment_mapping = _mapping(
              payload["environment"], field="environment"
          )
          environment_data = _tuple_fields(
              require_dataclass_fields(
                  environment_mapping,
                  ResidualMarketEnvConfig,
                  field="environment",
                  excluded={"reward_config", "reward", "execution_cost"},
              ),
              "episode_hour_choices",
              "initial_state_modes",
              "sequence_windows",
          )
          if "require_full_reward_preroll" not in environment_mapping:
              environment_data["require_full_reward_preroll"] = True
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          rm .github/workflows/apply-training-preroll-boundary.yml
          uvx ruff format trade_rl/workflows/training_run.py
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind reward preroll at training config boundary'
          git push origin HEAD:agent/fix-post-audit-residuals
