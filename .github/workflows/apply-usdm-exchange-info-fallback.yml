name: Apply USD-M exchange-info fallback

on:
  push:
    branches:
      - fix/binance-usdm-exchange-info-fallback-hardened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "81be00ed6c2e2b6e0c3bc31c2ea8892b61afe9ec"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-usdm-exchange-info-fallback.yml"

      - name: Apply minimal transport-only fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/binance/transport.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '        url = (\n'
              '            f"{_REST_BASE[resolved_market.value]}"\n'
              '            f"{_REST_EXCHANGE_INFO[resolved_market.value]}"\n'
              '        )\n'
              '        raw_payload = self._request_bytes(url)\n'
          )
          new = (
              '        primary_url = (\n'
              '            f"{_REST_BASE[resolved_market.value]}"\n'
              '            f"{_REST_EXCHANGE_INFO[resolved_market.value]}"\n'
              '        )\n'
              '        url = primary_url\n'
              '        try:\n'
              '            raw_payload = self._request_bytes(primary_url)\n'
              '        except BinanceTransportError:\n'
              '            if resolved_market is not BinanceMarket.USDS_M or not self.allow_network:\n'
              '                raise\n'
              '            url = "https://www.binance.com/fapi/v1/exchangeInfo"\n'
              '            raw_payload = self._request_bytes(url)\n'
          )
          if text.count(old) != 1:
              raise RuntimeError("exchange-info acquisition block differs from RED parent")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Retire helper before repository checks
        shell: bash
        run: rm .github/workflows/apply-usdm-exchange-info-fallback.yml

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify GREEN before commit
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pytest -q \
            tests/integrations/test_binance_exchange_info_fallback.py \
            tests/integrations/test_binance.py \
            tests/integrations/test_binance_cache_only.py
          uv run ruff check \
            trade_rl/integrations/binance/transport.py \
            tests/integrations/test_binance_exchange_info_fallback.py
          uv run ruff format --check \
            trade_rl/integrations/binance/transport.py \
            tests/integrations/test_binance_exchange_info_fallback.py
          uv run mypy trade_rl/integrations/binance/transport.py
          git diff --check

      - name: Commit minimal fix
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' ".github/workflows/apply-usdm-exchange-info-fallback.yml" "trade_rl/integrations/binance/transport.py")
          observed=$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          test "$observed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/apply-usdm-exchange-info-fallback.yml trade_rl/integrations/binance/transport.py
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "fix: add bounded USD-M exchange-info fallback"
          git push origin HEAD:fix/binance-usdm-exchange-info-fallback-hardened
