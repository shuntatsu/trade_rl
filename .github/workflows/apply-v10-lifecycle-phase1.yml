name: Apply V10 Lifecycle Phase 1

on:
  push:
    branches:
      - codex/v10-execution-lifecycle-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'phase1-green-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply phase 1 implementation
        run: python .github/patch_v10_lifecycle_phase1_wrapper.py
      - name: Format affected files
        run: |
          uv run ruff format \
            trade_rl/risk/pretrade.py \
            trade_rl/rl/environment_decision.py \
            trade_rl/rl/environment_risk.py \
            trade_rl/learning/causal_alpha_v10_hierarchy.py \
            tests/learning/test_causal_alpha_v10_closed_loop.py
          uv run ruff check \
            trade_rl/risk/pretrade.py \
            trade_rl/rl/environment_decision.py \
            trade_rl/rl/environment_risk.py \
            trade_rl/learning/causal_alpha_v10_hierarchy.py \
            tests/risk/test_pretrade_reduce_only.py \
            tests/rl/test_environment_decision_reduce_only.py \
            tests/learning/test_causal_alpha_v10_reduce_only.py \
            tests/learning/test_causal_alpha_v10_closed_loop.py
      - name: Phase 1 targeted tests
        run: |
          uv run pytest -q \
            tests/risk/test_pretrade.py \
            tests/risk/test_pretrade_reduce_only.py \
            tests/rl/test_environment_decision_reduce_only.py \
            tests/learning/test_causal_alpha_v10_reduce_only.py \
            tests/learning/test_causal_alpha_v10_closed_loop.py \
            tests/simulation/test_causal_alpha_v10_execution_contract.py
      - name: Commit verified phase 1 implementation
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trade_rl/risk/pretrade.py \
            trade_rl/rl/environment_decision.py \
            trade_rl/rl/environment_risk.py \
            trade_rl/learning/causal_alpha_v10_hierarchy.py \
            tests/learning/test_causal_alpha_v10_closed_loop.py
          git commit -m 'fix: add explicit reduce-only risk intent'
          git push origin HEAD:codex/v10-execution-lifecycle-hardening
