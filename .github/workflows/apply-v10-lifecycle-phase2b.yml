name: Apply V10 Lifecycle Phase 2B

on:
  push:
    branches:
      - codex/v10-execution-lifecycle-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: contains(github.event.head_commit.message, 'phase2b-green-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply phase 2B implementation
        run: python .github/patch_v10_lifecycle_phase2b.py
      - name: Format and lint
        run: |
          uv run ruff format \
            trade_rl/learning/rollout_evaluation.py \
            trade_rl/workflows/universal_causal_alpha_v8_replay.py \
            trade_rl/workflows/universal_causal_alpha_v10_stage_entry.py \
            tests/learning/test_rollout_execution_lifecycle.py
          uv run ruff check \
            trade_rl/learning/rollout_evaluation.py \
            trade_rl/workflows/universal_causal_alpha_v8_replay.py \
            trade_rl/workflows/universal_causal_alpha_v10_stage_entry.py \
            tests/learning/test_rollout_execution_lifecycle.py
      - name: Phase 2B targeted tests
        run: |
          uv run pytest -q \
            tests/learning/test_rollout_evaluation.py \
            tests/learning/test_rollout_execution_lifecycle.py \
            tests/risk/test_pretrade_reduce_only.py \
            tests/rl/test_environment_decision_reduce_only.py \
            tests/rl/test_environment_reduce_only_integration.py \
            tests/learning/test_causal_alpha_v10_reduce_only.py \
            tests/learning/test_causal_alpha_v10_closed_loop.py \
            tests/workflows/test_universal_causal_alpha_v8_replay.py \
            tests/workflows/test_universal_causal_alpha_v10_reduce_only_environment.py \
            tests/workflows/test_universal_causal_alpha_v10_stage_entry.py \
            tests/simulation/test_causal_alpha_v10_execution_contract.py
      - name: Commit verified phase 2B
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trade_rl/learning/rollout_evaluation.py \
            trade_rl/workflows/universal_causal_alpha_v8_replay.py \
            trade_rl/workflows/universal_causal_alpha_v10_stage_entry.py
          git commit -m 'fix: persist authoritative v10 execution lifecycle evidence'
          git push origin HEAD:codex/v10-execution-lifecycle-hardening
