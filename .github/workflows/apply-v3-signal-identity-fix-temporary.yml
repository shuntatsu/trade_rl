name: Apply V3 signal identity fix temporary

on:
  push:
    branches:
      - codex/fix-causal-alpha-v3-signal-scope-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Require unchanged branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/fix-causal-alpha-v3-signal-scope-contract
          test "$(git rev-parse origin/codex/fix-causal-alpha-v3-signal-scope-contract)" = "$GITHUB_SHA"
      - name: Apply signal identity closure fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          signal = Path("trade_rl/workflows/universal_causal_alpha_v3_signal_v2.py")
          text = signal.read_text(encoding="utf-8")
          old_run = '''    run_digests = {item.run_manifest_digest for item in values}\n    if len(run_digests) != 1:\n        raise ValueError("V3 signal gate run manifest identity drifted")\n    run_manifest_digest = next(iter(run_digests))\n'''
          new_run = '''    run_digests = {item.run_manifest_digest for item in values}\n    if len(run_digests) != 1:\n        raise ValueError("V3 signal gate run manifest identity drifted")\n    fit_config_digests = {item.fit_config_digest for item in values}\n    if len(fit_config_digests) != 1:\n        raise ValueError("V3 signal gate fit config identity drifted")\n    run_manifest_digest = next(iter(run_digests))\n'''
          if text.count(old_run) != 1:
              raise SystemExit("signal gate run identity marker drifted")
          text = text.replace(old_run, new_run, 1)

          old_cluster = '''        symbols = tuple(item.symbol for item in cluster)\n        if len(set(symbols)) != len(symbols):\n            raise ValueError("V3 signal episode cluster contains duplicate symbols")\n        ranks.append(float(fmean(_required_rank(item) for item in cluster)))\n'''
          new_cluster = '''        symbols = tuple(item.symbol for item in cluster)\n        if len(set(symbols)) != len(symbols):\n            raise ValueError("V3 signal episode cluster contains duplicate symbols")\n        if len({item.fit_digest for item in cluster}) != 1:\n            raise ValueError("V3 signal episode cluster fit digest drifted")\n        ranks.append(float(fmean(_required_rank(item) for item in cluster)))\n'''
          if text.count(old_cluster) != 1:
              raise SystemExit("signal gate cluster identity marker drifted")
          signal.write_text(text.replace(old_cluster, new_cluster, 1), encoding="utf-8")

          plan = Path("docs/implementation-plans/plans/2026-08-16-causal-teacher-admission-hardening.md")
          plan_text = plan.read_text(encoding="utf-8")
          marker = "## Full CI signal-identity follow-up"
          if marker not in plan_text:
              plan_text += '''\n\n## Full CI signal-identity follow-up\n\nExact-head verification of `c2d5882c77e6d4e80ce1d786a0f6d64857e20976` surfaced two PR-local Signal Gate contract regressions that were outside the teacher-admission implementation but prevented the PR quality gate from closing:\n\n- `test_signal_gate_rejects_mixed_fit_config_evidence` did not raise;\n- `test_signal_gate_rejects_cluster_fit_digest_drift` did not raise.\n\nThe failure oracle was taken from the uploaded exact-head `pytest-diagnostics` artifact. The root cause was missing identity closure in the clustered evaluator: aggregate metrics could mix multiple fit configurations, and metrics inside one chronological episode cluster could carry different pooled-fit digests before being averaged. The repair adds fail-closed validation for one common `fit_config_digest` across the aggregate and one common `fit_digest` inside each `(contract_start, contract_stop)` cluster. It does not change fitted-model formulas, cluster aggregation numerics for valid evidence, bootstrap thresholds, selection, admission, reward, risk, execution, BC, or PPO.\n\nThe two existing failing tests provide RED evidence before this production fix. Targeted Signal Gate and teacher-admission verification is required before committing the repair, followed by fresh full exact-head CI.\n'''
              plan.write_text(plan_text, encoding="utf-8")
          PY
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check trade_rl/workflows/universal_causal_alpha_v3_signal_v2.py
          uv run ruff format --check trade_rl/workflows/universal_causal_alpha_v3_signal_v2.py
          uv run mypy trade_rl/workflows/universal_causal_alpha_v3_signal_v2.py
          uv run lint-imports --config pyproject.toml
      - name: Targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_causal_alpha_v3_runner_signal.py \
            tests/workflows/test_universal_causal_alpha_v3_architecture_hardening.py \
            tests/workflows/test_universal_causal_alpha_v3_falsification.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_orchestration.py \
            tests/learning/test_causal_alpha_teacher_admission.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/workflows/test_universal_causal_alpha_v3_common_admission.py \
            tests/architecture/test_causal_alpha_v3_dead_contract_cleanup.py
      - name: Dead-code check
        run: uv run vulture trade_rl tests --min-confidence 100
      - name: Commit verified fix and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/fix-causal-alpha-v3-signal-scope-contract
          test "$(git rev-parse origin/codex/fix-causal-alpha-v3-signal-scope-contract)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/apply-v3-signal-identity-fix-temporary.yml \
            .github/workflows/diagnose-teacher-admission-pytest-temporary.yml
          git add -A
          git status --short
          git commit -m 'fix: close V3 signal fit identity'
          git push origin HEAD:codex/fix-causal-alpha-v3-signal-scope-contract
