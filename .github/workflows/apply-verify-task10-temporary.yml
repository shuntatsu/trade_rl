name: Apply and verify Task 10 benchmark evidence

on:
  pull_request:
    paths:
      - .github/workflows/apply-verify-task10-temporary.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Apply benchmark tests and prove RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/task10_apply_patch.py tests
          if uv run pytest -q tests/operations/test_oracle_teacher_benchmark.py; then
            echo 'Expected benchmark v2 tests to fail before implementation' >&2
            exit 1
          fi
      - name: Apply benchmark implementation
        shell: bash
        run: |
          set -euo pipefail
          python .github/task10_apply_patch.py implementation
          sha256sum -c <<'EOF'
          fb93785456bf1d0c8c2508e5fe8cbb67bc240cc4330b3590842d97ebb825db8d  trade_rl/operations/oracle_teacher_benchmark.py
          3b93434110d36b69b97842d447ae6e6bce82dc5e62976ed5d80ba391f163c959  tests/operations/test_oracle_teacher_benchmark.py
          EOF
      - name: Normalize and verify benchmark implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/operations/oracle_teacher_benchmark.py
            tests/operations/test_oracle_teacher_benchmark.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/operations/test_oracle_teacher_benchmark.py \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_bellman_numpy.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_episode_teacher_integration.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy trade_rl/operations/oracle_teacher_benchmark.py
          uv run lint-imports
          uv run python -m trade_rl.operations.oracle_teacher_benchmark \
            --backend numpy_batched \
            --episode-count 4 \
            --episode-bars 32 \
            --repetitions 2 \
            --episode-batch-size 2 \
            --target-state-block-size 2 \
            --output /tmp/oracle-benchmark-numpy.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/oracle-benchmark-numpy.json').read_text())
          assert payload['backend'] == 'numpy_batched'
          assert len(payload['output_digest']) == 64
          assert payload['steady_summary']['minimum_seconds'] >= 0.0
          assert payload['peak_device_allocated_bytes'] is None
          assert payload['peak_device_reserved_bytes'] is None
          PY
      - name: Commit verified benchmark implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/task10_tests.patch.b85 \
            .github/task10_impl.patch.b85 \
            .github/task10_apply_patch.py \
            .github/workflows/apply-verify-task10-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/operations/oracle_teacher_benchmark.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            .github
          git diff --cached --check
          git commit -m "perf: add Oracle Bellman backend benchmark evidence"
          git push origin HEAD:agent/oracle-bellman-batched-solver
