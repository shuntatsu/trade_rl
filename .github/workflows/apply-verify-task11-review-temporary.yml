name: Apply and verify Oracle CUDA review fixes

on:
  pull_request:
    paths:
      - .github/workflows/apply-verify-task11-review-temporary.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Apply review tests and prove RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/task11_review_tests.py
          if uv run pytest -q tests/learning/test_oracle_bellman_torch.py \
              -k 'compile_setup_failure or real_reduce_overhead_compile_path'; then
            echo 'Expected compile-setup regression tests to fail before implementation' >&2
            exit 1
          fi
          if uv run pytest -q tests/learning/test_oracle_solver.py \
              -k aggregates_variable_cuda_runtime_provenance; then
            echo 'Expected provenance aggregation regression test to fail before implementation' >&2
            exit 1
          fi
      - name: Apply review implementation
        run: |
          set -euo pipefail
          python .github/task11_review_fix.py
      - name: Verify review fixes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/learning/oracle_bellman_torch.py
            trade_rl/learning/oracle_solver.py
            tests/learning/test_oracle_bellman_torch.py
            tests/learning/test_oracle_solver.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            tests/learning/test_oracle_bellman_numpy.py \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_integration.py \
            tests/integrations/test_sb3_training.py \
            tests/test_training_compose_contract.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy \
            trade_rl/learning/oracle_bellman_torch.py \
            trade_rl/learning/oracle_solver.py
          uv run lint-imports
          test ! -e .github/workflows/verify-task10-gpu-temporary.yml
      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/task11_review_tests.py \
            .github/task11_review_fix.py \
            .github/workflows/apply-verify-task11-review-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_bellman_torch.py \
            trade_rl/learning/oracle_solver.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            .github
          git diff --cached --check
          git commit -m "fix: harden Oracle CUDA fallback provenance"
          git push origin HEAD:agent/oracle-bellman-batched-solver
