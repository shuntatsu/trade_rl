name: Apply and verify Task 6 Oracle orchestration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-verify-task6-temporary.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Route public APIs through orchestrator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/learning/oracle_teacher.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from trade_rl.learning.oracle_bellman_contracts import OracleBellmanParameters"
          new_import = """from trade_rl.learning.oracle_bellman_contracts import (
              OracleBellmanParameters,
              OracleEpisodeInputs,
              OracleSolverConfig,
          )"""
          if text.count(old_import) != 1:
              raise SystemExit("oracle_teacher Bellman import changed unexpectedly")
          text = text.replace(old_import, new_import)
          market_import = """from trade_rl.learning.oracle_market_tape import (
              build_oracle_market_tape,
              oracle_open_market_factors,
          )
          """
          if text.count(market_import) != 1:
              raise SystemExit("oracle_teacher market import changed unexpectedly")
          text = text.replace(
              market_import,
              market_import + "from trade_rl.learning.oracle_solver import solve_oracle_episodes\n",
          )
          function_start = text.index("def oracle_target_path(")
          function_end = text.index("\n\n__all__ =", function_start)
          replacement = '''def oracle_target_path(
              dataset: MarketDataset,
              train_range: tuple[int, int],
              config: OracleTeacherConfig,
              *,
              solver_config: OracleSolverConfig | None = None,
          ) -> np.ndarray:
              """Return bounded approximate submitted target labels inside train range."""

              if config.execution_cost.margin_mode != "cross":
                  raise ValueError("oracle currently supports cross margin only")
              start, stop = _validate_train_range(dataset, train_range)
              result = solve_oracle_episodes(
                  dataset,
                  states=_portfolio_states(dataset, config),
                  episode_inputs=OracleEpisodeInputs(
                      episode_indices=np.array([0], dtype=np.int64),
                      starts=np.array([start], dtype=np.int64),
                      stops=np.array([stop], dtype=np.int64),
                      initial_weights=np.zeros((1, dataset.n_symbols), dtype=np.float64),
                  ),
                  parameters=config.bellman_parameters,
                  solver_config=solver_config or OracleSolverConfig(),
              )
              return result.targets[0]
          '''
          text = text[:function_start] + replacement + text[function_end:]
          path.write_text(text, encoding="utf-8")

          path = Path("trade_rl/learning/episode_oracle_teacher.py")
          text = path.read_text(encoding="utf-8")
          for obsolete in (
              "import math\n",
              "import multiprocessing as mp\n",
              "from concurrent.futures import ThreadPoolExecutor\n",
          ):
              if text.count(obsolete) != 1:
                  raise SystemExit(f"episode Oracle import changed unexpectedly: {obsolete!r}")
              text = text.replace(obsolete, "")
          old_teacher_import = '''from trade_rl.learning.oracle_teacher import (
              OracleTeacherConfig,
              _open_state_matrix,
              _portfolio_states,
              _transition_matrices,
              _validate_train_range,
              oracle_target_path,
          )'''
          new_teacher_import = '''from trade_rl.learning.oracle_bellman_contracts import (
              OracleEpisodeInputs,
              OracleSolverConfig,
          )
          from trade_rl.learning.oracle_solver import solve_oracle_episodes
          from trade_rl.learning.oracle_teacher import (
              OracleTeacherConfig,
              _portfolio_states,
              _validate_train_range,
          )'''
          if text.count(old_teacher_import) != 1:
              raise SystemExit("episode Oracle teacher import changed unexpectedly")
          text = text.replace(old_teacher_import, new_teacher_import)
          globals_block = '''_FORK_ORACLE_CONFIG: OracleTeacherConfig | None = None
          _FORK_ORACLE_DATASET: MarketDataset | None = None
          '''
          if text.count(globals_block) != 1:
              raise SystemExit("episode Oracle fork globals changed unexpectedly")
          text = text.replace(globals_block, "")
          function_start = text.index("def episode_oracle_target_path(")
          function_end = text.index(
              "\n\n@dataclass(frozen=True, slots=True)\nclass OracleEpisodeSamplingConfig",
              function_start,
          )
          replacement = '''def episode_oracle_target_path(
              dataset: MarketDataset,
              train_range: tuple[int, int],
              config: OracleTeacherConfig,
              *,
              initial_weights: np.ndarray,
              solver_config: OracleSolverConfig | None = None,
          ) -> np.ndarray:
              """Return an Oracle path seeded from one explicit episode initial state."""

              if config.execution_cost.margin_mode != "cross":
                  raise ValueError("oracle currently supports cross margin only")
              start, stop = _validate_train_range(dataset, train_range)
              initial = _validated_oracle_initial_weights(dataset, config, initial_weights)
              result = solve_oracle_episodes(
                  dataset,
                  states=_portfolio_states(dataset, config),
                  episode_inputs=OracleEpisodeInputs(
                      episode_indices=np.array([0], dtype=np.int64),
                      starts=np.array([start], dtype=np.int64),
                      stops=np.array([stop], dtype=np.int64),
                      initial_weights=initial[None, :],
                  ),
                  parameters=config.bellman_parameters,
                  solver_config=solver_config or OracleSolverConfig(),
              )
              return result.targets[0]
          '''
          text = text[:function_start] + replacement + text[function_end:]
          function_start = text.index("def build_episode_oracle_batch(")
          function_end = text.index("\n\n__all__ =", function_start)
          replacement = '''def build_episode_oracle_batch(
              dataset: MarketDataset,
              *,
              minimum_start_index: int,
              sampling_config: OracleEpisodeSamplingConfig,
              teacher_config: OracleTeacherConfig,
              initial_weight_provider: InitialWeightProvider | None = None,
              max_workers: int = 1,
              solver_config: OracleSolverConfig | None = None,
          ) -> EpisodeOracleBatch:
              """Build bounded Oracle targets for independently sampled PPO-like episodes."""

              if isinstance(max_workers, bool) or not isinstance(max_workers, int):
                  raise ValueError("Oracle episode worker count must be an integer")
              if max_workers <= 0:
                  raise ValueError("Oracle episode worker count must be positive")
              contracts = sample_oracle_episode_contracts(
                  dataset,
                  minimum_start_index=minimum_start_index,
                  config=sampling_config,
                  initial_weight_provider=initial_weight_provider,
              )
              result = solve_oracle_episodes(
                  dataset,
                  states=_portfolio_states(dataset, teacher_config),
                  episode_inputs=OracleEpisodeInputs(
                      episode_indices=np.asarray(
                          [contract.episode_index for contract in contracts],
                          dtype=np.int64,
                      ),
                      starts=np.asarray(
                          [contract.start for contract in contracts],
                          dtype=np.int64,
                      ),
                      stops=np.asarray(
                          [contract.stop for contract in contracts],
                          dtype=np.int64,
                      ),
                      initial_weights=np.stack(
                          [contract.initial_weights for contract in contracts],
                          axis=0,
                      ),
                  ),
                  parameters=teacher_config.bellman_parameters,
                  solver_config=solver_config or OracleSolverConfig(),
              )
              return EpisodeOracleBatch(
                  dataset_id=dataset.dataset_id,
                  teacher_config_digest=teacher_config.digest,
                  sampling_config_digest=sampling_config.digest,
                  contracts=contracts,
                  targets=result.targets,
              )
          '''
          text = text[:function_start] + replacement + text[function_end:]
          path.write_text(text, encoding="utf-8")

          path = Path("tests/learning/test_episode_teacher_integration.py")
          text = path.read_text(encoding="utf-8")
          old_episode_import = '''from trade_rl.learning.episode_oracle_teacher import (
              EpisodeOracleBatch,
              OracleEpisodeContract,
              episode_oracle_target_path,
          )'''
          new_episode_import = '''from trade_rl.learning.episode_oracle_teacher import (
              EpisodeOracleBatch,
              OracleEpisodeContract,
              OracleEpisodeSamplingConfig,
              build_episode_oracle_batch,
              episode_oracle_target_path,
          )'''
          if text.count(old_episode_import) != 1:
              raise SystemExit("episode integration import changed unexpectedly")
          text = text.replace(old_episode_import, new_episode_import)
          teacher_import = "from trade_rl.learning.oracle_teacher import OracleTeacherConfig"
          if text.count(teacher_import) != 1:
              raise SystemExit("episode integration teacher import changed unexpectedly")
          text = text.replace(
              teacher_import,
              "from trade_rl.learning.oracle_bellman_contracts import OracleSolverConfig\n"
              + teacher_import,
          )
          test_name = "test_episode_oracle_batch_explicit_numpy_solver_ignores_legacy_worker_count"
          if test_name in text:
              raise SystemExit("Task 6 integration test already exists")
          text += '''

          def test_episode_oracle_batch_explicit_numpy_solver_ignores_legacy_worker_count() -> None:
              market = _market(64)
              sampling = OracleEpisodeSamplingConfig(
                  episode_bars=6,
                  episode_count=4,
                  initial_state_modes=("cash", "baseline"),
                  seed=17,
              )
              teacher = OracleTeacherConfig(
                  execution_cost=ExecutionCostConfig.zero(),
                  reference_portfolio_value=100_000.0,
              )
              solver = OracleSolverConfig(
                  selection="numpy",
                  episode_batch_size=2,
                  target_state_block_size=1,
              )

              def provider(mode: str, start: int) -> np.ndarray:
                  return np.array([0.25], dtype=np.float64)

              serial = build_episode_oracle_batch(
                  market,
                  minimum_start_index=4,
                  sampling_config=sampling,
                  teacher_config=teacher,
                  initial_weight_provider=provider,
                  max_workers=1,
                  solver_config=solver,
              )
              compatibility = build_episode_oracle_batch(
                  market,
                  minimum_start_index=4,
                  sampling_config=sampling,
                  teacher_config=teacher,
                  initial_weight_provider=provider,
                  max_workers=4,
                  solver_config=solver,
              )

              assert compatibility.digest == serial.digest
          '''
          path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize and verify Task 6
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/learning/oracle_solver.py
            trade_rl/learning/oracle_teacher.py
            trade_rl/learning/episode_oracle_teacher.py
            tests/learning/test_oracle_solver.py
            tests/learning/test_episode_teacher_integration.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_integration.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy \
            trade_rl/learning/oracle_solver.py \
            trade_rl/learning/oracle_teacher.py \
            trade_rl/learning/episode_oracle_teacher.py
      - name: Commit verified Task 6 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-verify-task6-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_solver.py \
            trade_rl/learning/oracle_teacher.py \
            trade_rl/learning/episode_oracle_teacher.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_episode_teacher_integration.py \
            .github/workflows
          git commit -m "refactor: route Oracle teachers through batched solver"
          git push origin HEAD:agent/oracle-bellman-batched-solver
