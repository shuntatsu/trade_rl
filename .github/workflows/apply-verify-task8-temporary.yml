name: Apply and verify Task 8 Torch backend

on:
  pull_request:
    paths:
      - .github/workflows/apply-verify-task8-temporary.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Materialize Task 8 sources
        run: |
          set -euo pipefail
          python .github/task8_transition.py
          python .github/task8_apply.py
          python .github/task8_type_fix.py
          sha256sum -c <<'EOF'
          c53efb8a9267afc4f53db4da718cceaf38aac52ce70251b39426c8b0a7b4af71  trade_rl/learning/oracle_transition_torch.py
          b2d713d0f4d95863064722a7b0c2de42806eb06a0bf44d1e661b6d5b80d3c453  trade_rl/learning/oracle_bellman_torch.py
          1477b91fc669ea167739f9beb33816a9abfccba395a08d59e48731fb2305fda5  trade_rl/learning/oracle_solver.py
          a85a52f2c8e7dcdcbb8b650532cb5a25412045fc5b8bbb0e15f9eb7e8ed8fa9f  tests/learning/test_oracle_bellman_torch.py
          2af9a044296993b19ddbbc2d1a427a77f75ff9937e43bcfa25bd9c86b4e184ee  tests/learning/test_oracle_solver.py
          EOF
      - name: Normalize and verify Task 8
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/learning/oracle_transition_torch.py
            trade_rl/learning/oracle_bellman_torch.py
            trade_rl/learning/oracle_solver.py
            tests/learning/test_oracle_bellman_torch.py
            tests/learning/test_oracle_solver.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_bellman_numpy.py \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_integration.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy \
            trade_rl/learning/oracle_transition_torch.py \
            trade_rl/learning/oracle_bellman_torch.py \
            trade_rl/learning/oracle_solver.py
          uv run lint-imports
      - name: Commit verified Task 8
        run: |
          set -euo pipefail
          rm -f \
            .github/task8_transition.py \
            .github/task8_apply.py \
            .github/task8_type_fix.py \
            .github/task8_payload_bellman.txt \
            .github/task8_payload_solver.txt \
            .github/task8_payload_test_bellman.txt \
            .github/task8_payload_test_solver.txt \
            .github/workflows/apply-verify-task8-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_transition_torch.py \
            trade_rl/learning/oracle_bellman_torch.py \
            trade_rl/learning/oracle_solver.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            .github
          git diff --cached --check
          git commit -m "feat: add batched float64 CUDA Bellman solver"
          git push origin HEAD:agent/oracle-bellman-batched-solver
