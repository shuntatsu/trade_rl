name: Apply and verify Task 9 Oracle runtime selection

on:
  pull_request:
    paths:
      - .github/workflows/apply-verify-task9-temporary.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Apply Task 9 tests and prove RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/task9_apply_patch.py tests
          if uv run pytest -q tests/learning/test_oracle_solver.py \
              -k 'cuda_or_numpy or explicit_cuda_does_not'; then
            echo 'Expected solver fallback tests to fail before implementation' >&2
            exit 1
          fi
          if uv run pytest -q tests/test_training_compose_contract.py; then
            echo 'Expected compose runtime contract test to fail before implementation' >&2
            exit 1
          fi
          if uv run pytest -q tests/integrations/test_sb3_training.py \
              -k 'oracle_solver_environment or cuda_oracle_solver_requires or numpy_oracle_solver_defaults or oracle_episode_batch_cache'; then
            echo 'Expected Oracle environment tests to fail before implementation' >&2
            exit 1
          fi
      - name: Apply Task 9 implementation
        run: |
          set -euo pipefail
          python .github/task9_apply_patch.py implementation
          sha256sum -c <<'EOF'
          2a5037d7738366ad84f981a7232b2ca6daa963cda412849dac6b1ca8eae08322  trade_rl/integrations/sb3_training.py
          965f3555711ce64f1f24ca58f8851e553fb0285be75c809188d8d79ccb8fd39f  trade_rl/learning/oracle_solver.py
          06a80eaead839814548f09c7b280f2196565974779742de39460b80ae267a4e3  tests/integrations/test_sb3_training.py
          e0b5185b85effb55bf547d9e4668e92a0441a3a86a4a8db837f49cae41bb8ff5  tests/learning/test_oracle_solver.py
          bcaa07aa76052d648e4d119cc5a3ab93c196c5f5262dfc423ef6c36de8595665  tests/test_training_compose_contract.py
          22317888e305156f41fa23ac75f3119e20f3d80e737617890c07fab8b377b5e0  compose.training.yaml
          9e6984321406dc14eabd648eac0df0aa376a44b577a4f8f1df08ec46f389d31a  docs/operations/docker-gpu-full-training.md
          EOF
      - name: Normalize and verify Task 9
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/integrations/sb3_training.py
            trade_rl/learning/oracle_solver.py
            tests/integrations/test_sb3_training.py
            tests/learning/test_oracle_solver.py
            tests/test_training_compose_contract.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/integrations/test_sb3_training.py \
            tests/test_training_compose_contract.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_integration.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy trade_rl/learning/oracle_solver.py
          uv run mypy --follow-imports=skip trade_rl/integrations/sb3_training.py
          uv run lint-imports
          uv run python - <<'PY'
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path('compose.training.yaml').read_text())
          assert isinstance(payload, dict)
          trainer = payload['services']['trainer']['environment']
          assert trainer['TRADE_RL_TEACHER_WORKERS'] == '1'
          PY
      - name: Commit verified Task 9
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/task9_tests.patch.b85 \
            .github/task9_implementation.patch.b85 \
            .github/task9_apply_patch.py \
            .github/workflows/apply-verify-task9-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/integrations/sb3_training.py \
            trade_rl/learning/oracle_solver.py \
            tests/integrations/test_sb3_training.py \
            tests/learning/test_oracle_solver.py \
            tests/test_training_compose_contract.py \
            compose.training.yaml \
            docs/operations/docker-gpu-full-training.md \
            .github
          git diff --cached --check
          git commit -m "feat: configure Oracle solver backend and fallback"
          git push origin HEAD:agent/oracle-bellman-batched-solver
