name: Apply walk-forward manifest fix

on:
  push:
    branches:
      - agent/walk-forward-manifest-provenance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/walk-forward-manifest-provenance
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply exact production patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("trade_rl/workflows/market_walk_forward.py")
          source = path.read_text(encoding="utf-8")

          old_imports = '''from trade_rl.artifacts.hashing import content_digest
          from trade_rl.artifacts.run_manifest import (
              TrainingRunManifest,
              validate_training_run_directory,
              write_training_run_manifest,
          )
          '''
          new_imports = '''from trade_rl.artifacts.hashing import content_digest
          from trade_rl.artifacts.provenance import capture_runtime_provenance
          from trade_rl.artifacts.run_manifest import (
              WalkForwardRunManifest,
              validate_walk_forward_run_directory,
              write_walk_forward_run_manifest,
          )
          '''
          if source.count(old_imports) != 1:
              raise SystemExit("walk-forward manifest import seam changed")
          source = source.replace(old_imports, new_imports)

          old_validator = '''def _validate_for_store(path: Path) -> bool:
              validate_training_run_directory(path)
              return True
          '''
          new_validator = '''def _validate_for_store(path: Path) -> bool:
              validate_walk_forward_run_directory(path)
              return True
          '''
          if source.count(old_validator) != 1:
              raise SystemExit("walk-forward store validator seam changed")
          source = source.replace(old_validator, new_validator)

          old_setup = '''    config = replace(config, signal_digest=resolved_signal)
              experiment_plan_digest = _experiment_plan_digest(
                  config,
                  dataset_id=dataset.dataset_id,
              )
              store = ArtifactStore(store_root)
              stage = store.stage_run(resolved_run_id)
          '''
          new_setup = '''    config = replace(config, signal_digest=resolved_signal)
              config_digest = content_digest(config.digest_payload())
              provenance = capture_runtime_provenance(
                  Path(__file__).resolve().parents[2],
                  deterministic_seed_config={
                      "candidate_seeds": tuple(
                          {
                              "name": item.name,
                              "seeds": item.run.training.seeds,
                          }
                          for item in config.candidates
                      ),
                      "workflow_config_digest": config_digest,
                  },
              )
              experiment_plan_digest = _experiment_plan_digest(
                  config,
                  dataset_id=dataset.dataset_id,
              )
              store = ArtifactStore(store_root)
              stage = store.stage_run(resolved_run_id)
              _write_json(stage / "provenance.json", asdict(provenance))
          '''
          if source.count(old_setup) != 1:
              raise SystemExit("walk-forward setup seam changed")
          source = source.replace(old_setup, new_setup)

          old_manifest = '''        config_digest = content_digest(config.digest_payload())
              run_manifest = TrainingRunManifest.build(
                  root=stage,
                  run_id=resolved_run_id,
                  dataset_id=dataset.dataset_id,
                  environment_digest=environment_digest,
                  ensemble_digest=policy_digest,
                  training_config_digest=config_digest,
                  provenance_digest=config_digest,
                  artifact_paths=_artifact_paths(stage),
                  created_at=resolved_created_at,
              )
              write_training_run_manifest(stage, run_manifest)
              validate_training_run_directory(stage)
          '''
          new_manifest = '''        run_manifest = WalkForwardRunManifest.build(
                  root=stage,
                  run_id=resolved_run_id,
                  dataset_id=dataset.dataset_id,
                  environment_digest=environment_digest,
                  evaluation_digest=result.evaluation_digest,
                  workflow_config_digest=config_digest,
                  policy_set_digest=policy_digest,
                  provenance_digest=provenance.digest,
                  fold_count=len(result.folds),
                  artifact_paths=_artifact_paths(stage),
                  created_at=resolved_created_at,
              )
              write_walk_forward_run_manifest(stage, run_manifest)
              validate_walk_forward_run_directory(stage)
          '''
          if source.count(old_manifest) != 1:
              raise SystemExit("walk-forward manifest construction seam changed")
          source = source.replace(old_manifest, new_manifest)

          path.write_text(source, encoding="utf-8")

      - name: Verify focused behavior
        run: >-
          uv run pytest
          tests/workflows/test_walk_forward_manifest_provenance.py
          tests/workflows/test_market_walk_forward.py
          tests/artifacts/test_run_manifests_v2.py
          -q

      - name: Verify static gates
        run: |
          uv run ruff check trade_rl/workflows/market_walk_forward.py tests/workflows/test_walk_forward_manifest_provenance.py
          uv run ruff format --check trade_rl/workflows/market_walk_forward.py tests/workflows/test_walk_forward_manifest_provenance.py
          uv run mypy trade_rl/workflows/market_walk_forward.py

      - name: Commit verified implementation
        run: |
          rm .github/workflows/apply-walk-forward-manifest-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/market_walk_forward.py .github/workflows/apply-walk-forward-manifest-fix.yml
          git commit -m "fix: publish walk-forward provenance manifest"
          git push origin HEAD:agent/walk-forward-manifest-provenance
