name: Apply Windows Lock Typing

on:
  pull_request:
    branches:
      - main
    paths:
      - .automation/windows-lock-typing-ready

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/harden-audit-contracts-v2
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Apply typed platform boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/symbol_triplet_stage_orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from typing import Any, Final, Iterator\n"
          new_import = "from typing import Any, Final, Iterator, Protocol, cast\n"
          if text.count(old_import) != 1:
              raise SystemExit("typing import boundary changed")
          text = text.replace(old_import, new_import, 1)

          anchor = 'SYMBOL_TRIPLET_STAGE_COMPLETION_SCHEMA: Final = "symbol_triplet_stage_completion_v1"\n\n\n'
          protocol = '''SYMBOL_TRIPLET_STAGE_COMPLETION_SCHEMA: Final = "symbol_triplet_stage_completion_v1"\n\n\nclass _WindowsFileLockApi(Protocol):\n    LK_LOCK: int\n    LK_UNLCK: int\n\n    def locking(\n        self, file_descriptor: int, mode: int, byte_count: int, /\n    ) -> None: ...\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("schema anchor changed")
          text = text.replace(anchor, protocol, 1)

          old_block = '''        if os.name == "nt":\n            import msvcrt\n\n            if handle.seek(0, os.SEEK_END) == 0:\n                handle.write(b"\\0")\n                handle.flush()\n            handle.seek(0)\n            msvcrt.locking(handle.fileno(), msvcrt.LK_LOCK, 1)\n            try:\n                yield\n            finally:\n                handle.seek(0)\n                msvcrt.locking(handle.fileno(), msvcrt.LK_UNLCK, 1)\n'''
          new_block = '''        if os.name == "nt":\n            import msvcrt\n\n            lock_api = cast(_WindowsFileLockApi, msvcrt)\n            if handle.seek(0, os.SEEK_END) == 0:\n                handle.write(b"\\0")\n                handle.flush()\n            handle.seek(0)\n            lock_api.locking(handle.fileno(), lock_api.LK_LOCK, 1)\n            try:\n                yield\n            finally:\n                handle.seek(0)\n                lock_api.locking(handle.fileno(), lock_api.LK_UNLCK, 1)\n'''
          if text.count(old_block) != 1:
              raise SystemExit("Windows lock block changed")
          path.write_text(text.replace(old_block, new_block, 1), encoding="utf-8")
          PY
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/workflows/symbol_triplet_stage_orchestrator.py
          uv run ruff check trade_rl/workflows/symbol_triplet_stage_orchestrator.py
          uv run mypy trade_rl
          rm -rf .automation
          rm -f .github/workflows/apply-windows-lock-typing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Type the Windows cursor lock boundary"
          git push origin HEAD:agent/harden-audit-contracts-v2
