name: Apply architecture hardening

on:
  push:
    branches:
      - bootstrap/architecture-hardening-source-snapshot-20260821

permissions:
  contents: write

concurrency:
  group: architecture-hardening-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify RED contract commit is present
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/architecture/test_architecture_hardening_contract.py
          test -f tests/workflows/test_universal_training_manifest_contract.py
          test -f tests/studio/test_jobs_windows_recovery_contract.py
          test -f tests/operations/test_causal_alpha_v3_generation_recovery.py
          test ! -f .github/workflows/source-snapshot-bootstrap.yml
          test ! -f .github/workflows/architecture-hardening-red-bootstrap.yml

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Reconfirm committed RED behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/architecture-hardening
          set +e
          uv run pytest -q \
            tests/architecture/test_architecture_hardening_contract.py \
            tests/workflows/test_universal_training_manifest_contract.py \
            tests/studio/test_jobs_windows_recovery_contract.py \
            tests/operations/test_causal_alpha_v3_generation_recovery.py \
            > var/architecture-hardening/red-before-implementation.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0

      - name: Add runtime-factory RED contract
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/workflows/test_runtime_factory_evidence_contract.py <<'PY'
          from __future__ import annotations

          import importlib
          from pathlib import Path


          def test_runtime_factory_descriptor_binds_implementation_source_bytes(
              monkeypatch,
              tmp_path: Path,
          ) -> None:
              from trade_rl.integrations.runtime_factory import (
                  describe_runtime_factory,
                  load_runtime_factory,
              )

              module_path = tmp_path / "runtime_fixture.py"
              module_path.write_text(
                  "def build_runtime(**kwargs):\n    return kwargs\n",
                  encoding="utf-8",
              )
              monkeypatch.syspath_prepend(str(tmp_path))
              importlib.invalidate_caches()
              factory = load_runtime_factory("runtime_fixture:build_runtime")
              first = describe_runtime_factory(
                  "runtime_fixture:build_runtime",
                  factory=factory,
              )

              module_path.write_text(
                  "def build_runtime(**kwargs):\n    return dict(kwargs)\n",
                  encoding="utf-8",
              )
              second = describe_runtime_factory(
                  "runtime_fixture:build_runtime",
                  factory=factory,
              )

              assert first.spec == "runtime_fixture:build_runtime"
              assert first.module == "runtime_fixture"
              assert first.callable_name == "build_runtime"
              assert first.implementation_digest != second.implementation_digest
              assert first.digest != second.digest


          def test_full_research_cli_passes_runtime_factory_evidence() -> None:
              source = Path("scripts/run_universal_full_research.py").read_text(
                  encoding="utf-8"
              )

              assert "describe_runtime_factory" in source
              assert "runtime_factory_descriptor=" in source
          PY
          set +e
          uv run pytest -q tests/workflows/test_runtime_factory_evidence_contract.py \
            > var/architecture-hardening/runtime-factory-red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0

      - name: Implement minimal architecture hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import shutil
          from pathlib import Path

          ROOT = Path.cwd()


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def write(path: str, content: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")


          def replace_once(path: str, old: str, new: str) -> None:
              source = read(path)
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement, found {count}: {old[:80]!r}"
                  )
              write(path, source.replace(old, new, 1))


          # 1. Exhaustive dependency-layer ownership, including reporting.
          replace_once(
              "pyproject.toml",
              '    "trade_rl.studio",\n    "trade_rl.workflows",',
              '    "trade_rl.studio",\n    "trade_rl.reporting",\n    "trade_rl.workflows",',
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "  studio/        Local research read modelとJob control\n"
              "  operations/    Maintained GPU・運用検証entry point",
              "  studio/        Local research read modelとJob control\n"
              "  reporting/     Persisted evidenceの決定論的read model\n"
              "  operations/    Maintained GPU・運用検証entry point",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "operations\nstudio\nworkflows",
              "operations\nstudio\nreporting\nworkflows",
          )

          # 2. Runtime-factory implementation belongs to integrations and exposes
          #    immutable source evidence while preserving the old import facade.
          write(
              "trade_rl/integrations/runtime_factory.py",
              '''"""Dynamic runtime-factory loading with source-bound evidence."""

          from __future__ import annotations

          import hashlib
          import importlib
          import inspect
          from collections.abc import Callable
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Any

          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.domain.common import require_sha256

          RuntimeFactory = Callable[..., Any]
          _DESCRIPTOR_SCHEMA = "runtime_factory_descriptor_v1"


          def _factory_parts(spec: str) -> tuple[str, str]:
              if not isinstance(spec, str) or spec.count(":") != 1:
                  raise ValueError("runtime factory must use module:function syntax")
              module_name, function_name = (
                  part.strip() for part in spec.split(":", 1)
              )
              if not module_name or not function_name:
                  raise ValueError("runtime factory must use module:function syntax")
              return module_name, function_name


          @dataclass(frozen=True, slots=True)
          class RuntimeFactoryDescriptor:
              spec: str
              module: str
              callable_name: str
              implementation_digest: str
              schema_version: str = _DESCRIPTOR_SCHEMA

              def __post_init__(self) -> None:
                  module_name, callable_name = _factory_parts(self.spec)
                  if self.module != module_name or self.callable_name != callable_name:
                      raise ValueError("runtime factory descriptor spec mismatch")
                  require_sha256(
                      self.implementation_digest,
                      field="runtime factory implementation_digest",
                  )
                  if self.schema_version != _DESCRIPTOR_SCHEMA:
                      raise ValueError("runtime factory descriptor schema mismatch")

              def digest_payload(self) -> dict[str, object]:
                  return {
                      "callable_name": self.callable_name,
                      "implementation_digest": self.implementation_digest,
                      "module": self.module,
                      "schema_version": self.schema_version,
                      "spec": self.spec,
                  }

              @property
              def digest(self) -> str:
                  return content_digest(self.digest_payload())

              def to_payload(self) -> dict[str, object]:
                  return {**self.digest_payload(), "descriptor_digest": self.digest}


          def load_runtime_factory(spec: str) -> RuntimeFactory:
              """Load one explicit ``module:function`` runtime factory."""

              module_name, function_name = _factory_parts(spec)
              module = importlib.import_module(module_name)
              factory = getattr(module, function_name, None)
              if not callable(factory):
                  raise TypeError("runtime factory target must be callable")
              return factory


          def describe_runtime_factory(
              spec: str,
              *,
              factory: RuntimeFactory | None = None,
          ) -> RuntimeFactoryDescriptor:
              """Bind one runtime factory to the exact source file that implements it."""

              module_name, function_name = _factory_parts(spec)
              resolved = factory or load_runtime_factory(spec)
              source_name = inspect.getsourcefile(resolved) or inspect.getfile(resolved)
              source_path = Path(source_name)
              if not source_path.is_file():
                  raise ValueError("runtime factory implementation source is unavailable")
              implementation_digest = hashlib.sha256(source_path.read_bytes()).hexdigest()
              return RuntimeFactoryDescriptor(
                  spec=f"{module_name}:{function_name}",
                  module=module_name,
                  callable_name=function_name,
                  implementation_digest=implementation_digest,
              )


          __all__ = [
              "RuntimeFactory",
              "RuntimeFactoryDescriptor",
              "describe_runtime_factory",
              "load_runtime_factory",
          ]
          '''.replace("          ", ""),
          )
          write(
              "trade_rl/runtime_factory.py",
              '''"""Compatibility facade for the integrations-owned runtime factory."""

          from trade_rl.integrations.runtime_factory import (
              RuntimeFactory,
              RuntimeFactoryDescriptor,
              describe_runtime_factory,
              load_runtime_factory,
          )

          __all__ = [
              "RuntimeFactory",
              "RuntimeFactoryDescriptor",
              "describe_runtime_factory",
              "load_runtime_factory",
          ]
          '''.replace("          ", ""),
          )
          replace_once(
              "trade_rl/workflows/universal_full_research_entrypoint.py",
              "from trade_rl.runtime_factory import load_runtime_factory\n",
              "from trade_rl.integrations.runtime_factory import (\n"
              "    RuntimeFactoryDescriptor,\n"
              "    load_runtime_factory,\n"
              ")\n",
          )
          replace_once(
              "trade_rl/workflows/universal_full_research_entrypoint.py",
              "    runtime_factory: UniversalEntrypointRuntimeFactory,\n"
              "    fold_train_range: tuple[int, int],",
              "    runtime_factory: UniversalEntrypointRuntimeFactory,\n"
              "    runtime_factory_descriptor: RuntimeFactoryDescriptor | None = None,\n"
              "    fold_train_range: tuple[int, int],",
          )
          replace_once(
              "trade_rl/workflows/universal_full_research_entrypoint.py",
              "    if not callable(runtime_factory):\n"
              "        raise TypeError(\"runtime_factory must be callable\")\n",
              "    if not callable(runtime_factory):\n"
              "        raise TypeError(\"runtime_factory must be callable\")\n"
              "    if runtime_factory_descriptor is not None and not isinstance(\n"
              "        runtime_factory_descriptor, RuntimeFactoryDescriptor\n"
              "    ):\n"
              "        raise TypeError(\n"
              "            \"runtime_factory_descriptor must be RuntimeFactoryDescriptor or null\"\n"
              "        )\n",
          )
          replace_once(
              "trade_rl/workflows/universal_full_research_entrypoint.py",
              "    }\n"
              "    manifest_digest = content_digest(payload)\n",
              "    }\n"
              "    if runtime_factory_descriptor is not None:\n"
              "        payload[\"runtime_factory\"] = runtime_factory_descriptor.to_payload()\n"
              "        payload[\"schema_version\"] = (\n"
              "            \"universal_full_research_training_entrypoint_v2\"\n"
              "        )\n"
              "    manifest_digest = content_digest(payload)\n",
          )
          replace_once(
              "scripts/run_universal_full_research.py",
              "from pathlib import Path\n\n"
              "from trade_rl.rl.training_run_config import TrainingRunConfig\n",
              "from pathlib import Path\n\n"
              "from trade_rl.integrations.runtime_factory import describe_runtime_factory\n"
              "from trade_rl.rl.training_run_config import TrainingRunConfig\n",
          )
          replace_once(
              "scripts/run_universal_full_research.py",
              "    raw_runtime_factory = load_universal_runtime_factory(args.runtime_factory)\n",
              "    raw_runtime_factory = load_universal_runtime_factory(args.runtime_factory)\n"
              "    runtime_factory_descriptor = describe_runtime_factory(\n"
              "        args.runtime_factory,\n"
              "        factory=raw_runtime_factory,\n"
              "    )\n",
          )
          replace_once(
              "scripts/run_universal_full_research.py",
              "        runtime_factory=runtime_factory,\n"
              "        fold_train_range=context.manifest.fold_train_range,",
              "        runtime_factory=runtime_factory,\n"
              "        runtime_factory_descriptor=runtime_factory_descriptor,\n"
              "        fold_train_range=context.manifest.fold_train_range,",
          )

          # 3. Close Universal backend-result identity before final-manifest publish.
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "from typing import Any\n",
              "from typing import Any, Protocol\n",
          )
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "from trade_rl.rl.actions import (\n",
              "from trade_rl.rl.training import ResidualTrainingConfig\n"
              "from trade_rl.rl.actions import (\n",
          )
          marker = "\ndef train_universal_seeds(\n"
          source = read("trade_rl/workflows/universal_training_runner.py")
          if source.count(marker) != 1:
              raise RuntimeError("Universal training function marker drifted")
          protocols = '''

          class UniversalTrainingResult(Protocol):
              checkpoint_path: Path
              environment_digest: str
              architecture_digest: str
              actual_timesteps: int


          class UniversalTrainingBackend(Protocol):
              def train(
                  self,
                  *,
                  seed: int,
                  config: ResidualTrainingConfig,
                  output_path: Path,
              ) -> UniversalTrainingResult: ...
          '''.replace("          ", "")
          source = source.replace(marker, protocols + marker, 1)
          write("trade_rl/workflows/universal_training_runner.py", source)
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "    runtime: Any,\n"
              "    training: Any,\n"
              "    backend: Any,",
              "    runtime: UniversalTrainingRuntime,\n"
              "    training: ResidualTrainingConfig,\n"
              "    backend: UniversalTrainingBackend,",
          )
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "    members: list[dict[str, object]] = []\n"
              "    for seed in seeds:\n",
              "    members: list[dict[str, object]] = []\n"
              "    expected_environment_digest: str | None = None\n"
              "    expected_architecture_digest: str | None = None\n"
              "    for seed in seeds:\n",
          )
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "        environment_digest = getattr(result, \"environment_digest\", None)\n"
              "        if not isinstance(environment_digest, str):\n"
              "            raise ValueError(\n"
              "                \"Universal backend environment digest is unavailable\"\n"
              "            )\n"
              "        architecture_digest = getattr(result, \"architecture_digest\", None)\n"
              "        actual_timesteps = getattr(result, \"actual_timesteps\", None)\n"
              "        if isinstance(actual_timesteps, bool) or not isinstance(actual_timesteps, int):\n"
              "            raise ValueError(\n"
              "                \"Universal backend actual_timesteps is unavailable\"\n"
              "            )\n",
              "        environment_digest = getattr(result, \"environment_digest\", None)\n"
              "        if not isinstance(environment_digest, str):\n"
              "            raise ValueError(\n"
              "                \"Universal backend environment digest is unavailable\"\n"
              "            )\n"
              "        require_sha256(\n"
              "            environment_digest,\n"
              "            field=\"Universal backend environment_digest\",\n"
              "        )\n"
              "        architecture_digest = getattr(result, \"architecture_digest\", None)\n"
              "        if not isinstance(architecture_digest, str):\n"
              "            raise ValueError(\n"
              "                \"Universal backend architecture digest is unavailable\"\n"
              "            )\n"
              "        require_sha256(\n"
              "            architecture_digest,\n"
              "            field=\"Universal backend architecture_digest\",\n"
              "        )\n"
              "        actual_timesteps = getattr(result, \"actual_timesteps\", None)\n"
              "        if (\n"
              "            isinstance(actual_timesteps, bool)\n"
              "            or not isinstance(actual_timesteps, int)\n"
              "            or actual_timesteps <= 0\n"
              "        ):\n"
              "            raise ValueError(\n"
              "                \"Universal backend actual_timesteps must be a positive integer\"\n"
              "            )\n"
              "        if expected_environment_digest is None:\n"
              "            expected_environment_digest = environment_digest\n"
              "        elif environment_digest != expected_environment_digest:\n"
              "            raise ValueError(\n"
              "                \"Universal backend environment identity drifted across seeds\"\n"
              "            )\n"
              "        if expected_architecture_digest is None:\n"
              "            expected_architecture_digest = architecture_digest\n"
              "        elif architecture_digest != expected_architecture_digest:\n"
              "            raise ValueError(\n"
              "                \"Universal backend architecture identity drifted across seeds\"\n"
              "            )\n",
          )
          replace_once(
              "trade_rl/workflows/universal_training_runner.py",
              "    \"UniversalTrainingRuntime\",\n",
              "    \"UniversalTrainingRuntime\",\n"
              "    \"UniversalTrainingBackend\",\n"
              "    \"UniversalTrainingResult\",\n",
          )
          replace_once(
              "tests/workflows/test_universal_training_execution.py",
              "architecture_digest=_digest(f\"architecture:{seed}\"),",
              "architecture_digest=_digest(\"architecture\"),",
          )

          # 4. Recover a stable process creation identity on Windows.
          replace_once(
              "trade_rl/studio/jobs.py",
              "from __future__ import annotations\n\nimport os\n",
              "from __future__ import annotations\n\nimport ctypes\nimport os\n",
          )
          old_pid = '''def _pid_start_token(pid: int) -> str | None:
              path = Path(f"/proc/{pid}/stat")
              try:
                  fields = path.read_text(encoding="utf-8").split()
              except OSError:
                  return None
              return fields[21] if len(fields) > 21 else None
          '''.replace("          ", "")
          new_pid = '''def _windows_process_start_token(pid: int) -> str | None:
              loader = getattr(ctypes, "WinDLL", None)
              if loader is None:
                  return None

              class FileTime(ctypes.Structure):
                  _fields_ = (
                      ("low", ctypes.c_uint32),
                      ("high", ctypes.c_uint32),
                  )

              kernel32 = loader("kernel32", use_last_error=True)
              open_process = kernel32.OpenProcess
              open_process.argtypes = (ctypes.c_uint32, ctypes.c_int, ctypes.c_uint32)
              open_process.restype = ctypes.c_void_p
              get_process_times = kernel32.GetProcessTimes
              get_process_times.argtypes = (
                  ctypes.c_void_p,
                  ctypes.POINTER(FileTime),
                  ctypes.POINTER(FileTime),
                  ctypes.POINTER(FileTime),
                  ctypes.POINTER(FileTime),
              )
              get_process_times.restype = ctypes.c_int
              close_handle = kernel32.CloseHandle
              close_handle.argtypes = (ctypes.c_void_p,)
              close_handle.restype = ctypes.c_int

              handle = open_process(0x1000, 0, pid)
              if not handle:
                  return None
              try:
                  creation = FileTime()
                  exit_time = FileTime()
                  kernel_time = FileTime()
                  user_time = FileTime()
                  if not get_process_times(
                      handle,
                      ctypes.byref(creation),
                      ctypes.byref(exit_time),
                      ctypes.byref(kernel_time),
                      ctypes.byref(user_time),
                  ):
                      return None
                  return f"{creation.high:08x}{creation.low:08x}"
              finally:
                  close_handle(handle)


          def _pid_start_token(
              pid: int,
              *,
              platform_name: str | None = None,
          ) -> str | None:
              platform = os.name if platform_name is None else platform_name
              if platform == "nt":
                  return _windows_process_start_token(pid)
              if platform != "posix":
                  return None
              path = Path(f"/proc/{pid}/stat")
              try:
                  fields = path.read_text(encoding="utf-8").split()
              except OSError:
                  return None
              return fields[21] if len(fields) > 21 else None
          '''.replace("          ", "")
          replace_once("trade_rl/studio/jobs.py", old_pid, new_pid)

          # 5. Move V3 application behavior into operations and make retry/retention
          #    idempotent for one exact generation identity.
          script = ROOT / "scripts/control_causal_alpha_v3_research_generation.py"
          operation = ROOT / "trade_rl/operations/causal_alpha_v3_generation.py"
          operation.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(script, operation)
          operation_source = operation.read_text(encoding="utf-8")
          operation_source = operation_source.replace(
              "import re\nimport subprocess\n",
              "import re\nimport shutil\nimport subprocess\nimport uuid\n",
              1,
          )
          old_state = '''    state_directory = _state_directory(Path(state_root), name)
              if state_directory.exists():
                  raise FileExistsError(f"generation state already exists: {state_directory}")

              commit = _require_git_commit(_git(root, "rev-parse", "HEAD"), field="Git HEAD")
          '''.replace("          ", "")
          new_state = '''    state_directory = _state_directory(Path(state_root), name)
              existing_launch: CausalAlphaV3Launch | None = None
              if state_directory.exists():
                  existing_launch = _load_launch(
                      state_root=Path(state_root),
                      generation=name,
                  )
                  if _container_exists(existing_launch.container_name):
                      existing_state = _inspect_container(existing_launch)
                      if existing_state.running:
                          return existing_launch
                      raise RuntimeError(
                          "generation container is terminal; use collect to retain its outcome"
                      )

              commit = _require_git_commit(_git(root, "rev-parse", "HEAD"), field="Git HEAD")
          '''.replace("          ", "")
          if operation_source.count(old_state) != 1:
              raise RuntimeError("V3 start state block drifted")
          operation_source = operation_source.replace(old_state, new_state, 1)
          old_image = '''    image = f"trade-rl-causal-alpha-v3:{commit[:12]}-{runtime_manifest_digest[:12]}"
              environment = _start_environment(
                  commit=commit,
                  source_digest=source_digest,
                  lock_digest=lock_digest,
                  runtime_manifest_digest=runtime_manifest_digest,
                  generation=name,
                  image=image,
                  runtime_artifact_root=artifact_root,
              )
              build_command = [
                  "docker",
                  "build",
                  "--target",
                  "training-runtime",
                  "-f",
                  "docker/Dockerfile.training",
                  "-t",
                  image,
              ]
              for key in (
                  "TRADE_RL_GIT_COMMIT",
                  "TRADE_RL_GIT_DIRTY",
                  "TRADE_RL_SOURCE_TREE_DIGEST",
                  "TRADE_RL_LOCKFILE_DIGEST",
                  "TRADE_RL_RUNTIME_MANIFEST_DIGEST",
              ):
                  build_command.extend(("--build-arg", f"{key}={environment[key]}"))
              build_command.append(".")
              _run(build_command, cwd=root, env=environment)

              image_id, labels = _inspect_image(image)
          '''.replace("          ", "")
          new_image = '''    image = f"trade-rl-causal-alpha-v3:{commit[:12]}-{runtime_manifest_digest[:12]}"
              output_path = (_CONTAINER_OUTPUT_PREFIX / name).as_posix()
              if existing_launch is not None:
                  expected_static_identity = {
                      "container_name": container_name,
                      "generation": name,
                      "git_commit": commit,
                      "image": image,
                      "lockfile_digest": lock_digest,
                      "output_path": output_path,
                      "research_config_digest": research_config_digest,
                      "run_config_digest": run_config_digest,
                      "runtime_manifest_digest": runtime_manifest_digest,
                      "source_tree_digest": source_digest,
                  }
                  actual_static_identity = {
                      key: value
                      for key, value in existing_launch.to_payload().items()
                      if key in expected_static_identity
                  }
                  if actual_static_identity != expected_static_identity:
                      raise RuntimeError(
                          "persisted launch identity does not match current launch inputs"
                      )
              environment = _start_environment(
                  commit=commit,
                  source_digest=source_digest,
                  lock_digest=lock_digest,
                  runtime_manifest_digest=runtime_manifest_digest,
                  generation=name,
                  image=image,
                  runtime_artifact_root=artifact_root,
              )
              if existing_launch is None:
                  build_command = [
                      "docker",
                      "build",
                      "--target",
                      "training-runtime",
                      "-f",
                      "docker/Dockerfile.training",
                      "-t",
                      image,
                  ]
                  for key in (
                      "TRADE_RL_GIT_COMMIT",
                      "TRADE_RL_GIT_DIRTY",
                      "TRADE_RL_SOURCE_TREE_DIGEST",
                      "TRADE_RL_LOCKFILE_DIGEST",
                      "TRADE_RL_RUNTIME_MANIFEST_DIGEST",
                  ):
                      build_command.extend(
                          ("--build-arg", f"{key}={environment[key]}")
                      )
                  build_command.append(".")
                  _run(build_command, cwd=root, env=environment)

              image_id, labels = _inspect_image(image)
          '''.replace("          ", "")
          if operation_source.count(old_image) != 1:
              raise RuntimeError("V3 image block drifted")
          operation_source = operation_source.replace(old_image, new_image, 1)
          operation_source = operation_source.replace(
              "    output_path = (_CONTAINER_OUTPUT_PREFIX / name).as_posix()\n"
              "    preflight_code = (\n",
              "    preflight_code = (\n",
              1,
          )
          old_persist = '''    state_directory.mkdir(parents=True)
              atomic_write_bytes(
                  state_directory / "launch-manifest.json",
                  canonical_json_bytes(launch.to_payload()) + b"\\n",
              )
              _run(
          '''.replace("          ", "")
          new_persist = '''    if existing_launch is None:
                  state_directory.mkdir(parents=True)
                  atomic_write_bytes(
                      state_directory / "launch-manifest.json",
                      canonical_json_bytes(launch.to_payload()) + b"\\n",
                  )
              elif existing_launch != launch:
                  raise RuntimeError(
                      "persisted launch image identity does not match current image"
                  )
              _run(
          '''.replace("          ", "")
          if operation_source.count(old_persist) != 1:
              raise RuntimeError("V3 launch persistence block drifted")
          operation_source = operation_source.replace(old_persist, new_persist, 1)

          retained_start = operation_source.index("def _retained_directory(")
          retained_end = operation_source.index("\ndef collect_generation(", retained_start)
          retained_region = '''def _retained_directory(retained_root: Path, generation: str) -> Path:
              root = Path(retained_root).expanduser().resolve()
              directory = root / validate_generation(generation)
              if directory.exists():
                  if not directory.is_dir():
                      raise FileExistsError(
                          f"retained generation is not a directory: {directory}"
                      )
                  return directory
              directory.mkdir(parents=True)
              return directory


          def _retained_mapping(path: Path, *, field: str) -> dict[str, object]:
              try:
                  raw = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise ValueError(f"{field} JSON is invalid") from error
              if not isinstance(raw, Mapping):
                  raise ValueError(f"{field} must be an object")
              return {str(key): value for key, value in raw.items()}


          def _load_retained_result(
              *,
              retained: Path,
              launch: CausalAlphaV3Launch,
              state: ContainerState,
              operator_stopped: bool,
          ) -> dict[str, object] | None:
              launch_path = retained / "launch-manifest.json"
              result_path = retained / "research-result.json"
              if not launch_path.exists() and not result_path.exists():
                  return None
              if not launch_path.is_file() or not result_path.is_file():
                  raise ValueError("retained generation evidence is incomplete")
              persisted_launch = CausalAlphaV3Launch.from_payload(
                  _retained_mapping(launch_path, field="retained launch manifest")
              )
              if persisted_launch != launch:
                  raise RuntimeError("retained launch identity does not match source state")
              result = _retained_mapping(result_path, field="retained research result")
              expected_fields = {
                  "container_exit_code",
                  "execution_status",
                  "generation",
                  "launch",
                  "oom_killed",
                  "research_outcome",
                  "run_output_retained",
                  "schema_version",
              }
              if set(result) != expected_fields:
                  raise ValueError("retained research result fields are invalid")
              if result["schema_version"] != _RESULT_SCHEMA:
                  raise ValueError("retained research result schema is unsupported")
              if result["generation"] != launch.generation:
                  raise RuntimeError("retained research result generation drifted")
              if result["launch"] != launch.to_payload():
                  raise RuntimeError("retained research result launch identity drifted")
              if result["container_exit_code"] != state.exit_code:
                  raise RuntimeError("retained container exit code drifted")
              if result["oom_killed"] is not state.oom_killed:
                  raise RuntimeError("retained OOM state drifted")
              retained_flag = result["run_output_retained"]
              if not isinstance(retained_flag, bool):
                  raise ValueError("retained run_output_retained must be a boolean")
              expected_status, expected_outcome = classify_research_outcome(
                  state.exit_code,
                  operator_stopped=operator_stopped,
              )
              if state.oom_killed and not operator_stopped:
                  expected_status, expected_outcome = "failed", "unavailable"
              if (
                  result["execution_status"] != expected_status
                  or result["research_outcome"] != expected_outcome
              ):
                  raise RuntimeError("retained terminal outcome drifted")
              run_copy = retained / "run"
              if retained_flag and not run_copy.is_dir():
                  raise ValueError("retained result claims a missing run directory")
              return result


          def _retain_terminal_evidence(
              *,
              launch: CausalAlphaV3Launch,
              state: ContainerState,
              retained_root: Path,
              operator_stopped: bool,
          ) -> dict[str, object]:
              retained = _retained_directory(retained_root, launch.generation)
              result = _load_retained_result(
                  retained=retained,
                  launch=launch,
                  state=state,
                  operator_stopped=operator_stopped,
              )
              if result is not None and result["run_output_retained"] is True:
                  return result
              if result is None:
                  logs = _container_logs(launch)
                  (retained / "container.log").write_text(logs, encoding="utf-8")
                  atomic_write_bytes(
                      retained / "launch-manifest.json",
                      canonical_json_bytes(launch.to_payload()) + b"\\n",
                  )
                  execution_status, research_outcome = classify_research_outcome(
                      state.exit_code,
                      operator_stopped=operator_stopped,
                  )
                  if state.oom_killed and not operator_stopped:
                      execution_status, research_outcome = "failed", "unavailable"
                  result = {
                      "container_exit_code": state.exit_code,
                      "execution_status": execution_status,
                      "generation": launch.generation,
                      "launch": launch.to_payload(),
                      "oom_killed": state.oom_killed,
                      "research_outcome": research_outcome,
                      "run_output_retained": False,
                      "schema_version": _RESULT_SCHEMA,
                  }
                  atomic_write_bytes(
                      retained / "research-result.json",
                      canonical_json_bytes(result) + b"\\n",
                  )

              run_copy = retained / "run"
              if run_copy.exists():
                  if run_copy.is_dir():
                      shutil.rmtree(run_copy)
                  else:
                      run_copy.unlink()
              staging = retained / f".run-{uuid.uuid4().hex}.staging"
              staging.mkdir()
              try:
                  _run(
                      (
                          "docker",
                          "cp",
                          f"{launch.container_name}:{launch.output_path}/.",
                          str(staging),
                      )
                  )
                  staging.replace(run_copy)
              except BaseException:
                  shutil.rmtree(staging, ignore_errors=True)
                  raise
              result["run_output_retained"] = True
              atomic_write_bytes(
                  retained / "research-result.json",
                  canonical_json_bytes(result) + b"\\n",
              )
              return result
          '''.replace("          ", "")
          operation_source = (
              operation_source[:retained_start]
              + retained_region
              + operation_source[retained_end:]
          )
          operation.write_text(operation_source, encoding="utf-8")
          write(
              "scripts/control_causal_alpha_v3_research_generation.py",
              '''from __future__ import annotations

          from trade_rl.operations.causal_alpha_v3_generation import main


          if __name__ == "__main__":
              raise SystemExit(main())
          '''.replace("          ", ""),
          )
          for path in (
              "tests/scripts/test_control_causal_alpha_v3_research_generation.py",
              "tests/scripts/test_control_causal_alpha_v3_research_generation_falsification.py",
          ):
              replace_once(
                  path,
                  "from scripts import control_causal_alpha_v3_research_generation as module",
                  "from trade_rl.operations import causal_alpha_v3_generation as module",
              )
          replace_once(
              "tests/scripts/test_control_causal_alpha_v3_research_generation.py",
              "with pytest.raises(FileExistsError, match=\"state\"):",
              "with pytest.raises(FileNotFoundError, match=\"launch manifest\"):",
          )
          PY

