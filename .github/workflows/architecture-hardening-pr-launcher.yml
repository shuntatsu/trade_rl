name: Launch architecture hardening implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: architecture-hardening-pr-launcher-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.pull_request.number == 420 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify immutable PR checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install complete verification dependencies
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Execute reviewed RED to GREEN implementation steps
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          import yaml

          runner = Path("trade_rl/workflows/universal_training_runner.py")
          source = runner.read_text(encoding="utf-8")
          source = source.replace(
              '        if not isinstance(environment_digest, str):\n'
              '            raise ValueError("Universal backend environment digest is unavailable")\n',
              '        if not isinstance(environment_digest, str):\n'
              '            raise ValueError(\n'
              '                "Universal backend environment digest is unavailable"\n'
              '            )\n',
              1,
          )
          source = source.replace(
              '        if isinstance(actual_timesteps, bool) or not isinstance(actual_timesteps, int):\n'
              '            raise ValueError("Universal backend actual_timesteps is unavailable")\n',
              '        if isinstance(actual_timesteps, bool) or not isinstance(actual_timesteps, int):\n'
              '            raise ValueError(\n'
              '                "Universal backend actual_timesteps is unavailable"\n'
              '            )\n',
              1,
          )
          runner.write_text(source, encoding="utf-8")

          workflow_path = Path(
              ".github/workflows/architecture-hardening-apply.yml"
          )
          payload = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
          steps = payload["jobs"]["apply"]["steps"]
          selected = (
              "Verify RED contract commit is present",
              "Reconfirm committed RED behavior",
              "Add runtime-factory RED contract",
              "Implement minimal architecture hardening",
              "Format changed Python",
              "Targeted GREEN tests",
              "Static and architecture checks",
          )
          by_name = {
              step.get("name"): step.get("run")
              for step in steps
              if isinstance(step, dict)
          }
          missing = [name for name in selected if not isinstance(by_name.get(name), str)]
          if missing:
              raise RuntimeError(f"architecture hardening steps are missing: {missing}")
          for name in selected:
              script = by_name[name]
              if name == "Implement minimal architecture hardening":
                  helper = (
                      "ROOT = Path.cwd()\n\n\n"
                      "def _dedent10(value: str) -> str:\n"
                      "    return \"\".join(\n"
                      "        line[10:] if line.startswith(\" \" * 10) else line\n"
                      "        for line in value.splitlines(keepends=True)\n"
                      "    )\n\n\n"
                  )
                  if "ROOT = Path.cwd()\n\n\n" not in script:
                      raise RuntimeError("implementation root marker drifted")
                  script = script.replace(
                      "ROOT = Path.cwd()\n\n\n",
                      helper,
                      1,
                  )
                  script, replacements = re.subn(
                      r"'''(.*?)'''\.replace\(\" {10}\", \"\"\)",
                      lambda match: "_dedent10('''" + match.group(1) + "''')",
                      script,
                      flags=re.DOTALL,
                  )
                  if replacements < 5:
                      raise RuntimeError(
                          "implementation dedent contracts were not fully rewritten"
                      )
              print(f"::group::{name}", flush=True)
              subprocess.run(
                  ("bash", "-euo", "pipefail", "-c", script),
                  check=True,
              )
              print("::endgroup::", flush=True)
          PY

      - name: Review and commit implementation result
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/architecture-hardening-apply.yml
          rm -f .github/workflows/architecture-hardening-pr-launcher.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: harden architecture identity and recovery contracts"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-hardening-implementation-evidence
          path: var/architecture-hardening
          if-no-files-found: warn
          retention-days: 14
