name: Architecture hardening RED bootstrap

on:
  push:
    branches:
      - bootstrap/architecture-hardening-source-snapshot-20260821

permissions:
  contents: write

concurrency:
  group: architecture-hardening-red-bootstrap
  cancel-in-progress: false

jobs:
  red-contracts:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Add RED contract tests
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/architecture/test_architecture_hardening_contract.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          from tests.architecture.import_linter_config import configured_layers
          from tests.architecture.repository_paths import PYTHON_SOURCE_ROOT, REPOSITORY_ROOT


          def _top_level_packages() -> set[str]:
              return {
                  f"trade_rl.{path.name}"
                  for path in PYTHON_SOURCE_ROOT.iterdir()
                  if path.is_dir() and (path / "__init__.py").is_file()
              }


          def test_every_top_level_production_package_has_one_declared_layer() -> None:
              assert _top_level_packages() == set(configured_layers())


          def test_runtime_factory_implementation_is_owned_by_integrations() -> None:
              implementation = PYTHON_SOURCE_ROOT / "integrations/runtime_factory.py"
              facade = PYTHON_SOURCE_ROOT / "runtime_factory.py"

              assert implementation.is_file()
              source = facade.read_text(encoding="utf-8")
              assert "importlib" not in source
              assert "from trade_rl.integrations.runtime_factory import" in source


          def test_causal_alpha_generation_script_is_a_thin_operations_adapter() -> None:
              path = REPOSITORY_ROOT / "scripts/control_causal_alpha_v3_research_generation.py"
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=str(path))
              declarations = [
                  node.name
                  for node in tree.body
                  if isinstance(node, ast.ClassDef | ast.FunctionDef | ast.AsyncFunctionDef)
              ]

              assert declarations == []
              assert "subprocess" not in source
              assert "trade_rl.operations.causal_alpha_v3_generation" in source
              assert len(source.splitlines()) <= 12
          PY

          cat > tests/workflows/test_universal_training_manifest_contract.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass
          from pathlib import Path
          from types import SimpleNamespace
          from typing import Callable

          import pytest

          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.workflows.universal_training_runner import train_universal_seeds


          def _digest(label: str) -> str:
              return content_digest(label)


          @dataclass(frozen=True)
          class _TrainingResult:
              checkpoint_path: Path
              environment_digest: str
              architecture_digest: str | None
              actual_timesteps: int


          class _Backend:
              def __init__(
                  self,
                  result_identity: Callable[[int], tuple[str, str | None, int]],
              ) -> None:
                  self._result_identity = result_identity

              def train(self, *, seed: int, config: object, output_path: Path) -> object:
                  del config
                  output_path.parent.mkdir(parents=True, exist_ok=True)
                  output_path.write_bytes(f"policy:{seed}".encode())
                  environment, architecture, timesteps = self._result_identity(seed)
                  return _TrainingResult(
                      checkpoint_path=output_path,
                      environment_digest=environment,
                      architecture_digest=architecture,
                      actual_timesteps=timesteps,
                  )


          def _runtime() -> object:
              return SimpleNamespace(
                  train_symbols=("AAAUSDT", "BBBUSDT"),
                  catalog_digest=_digest("catalog"),
                  partition_digest=_digest("partition"),
                  split_manifest_digest=_digest("split"),
                  feature_schema_digest=_digest("features"),
                  statistics_digest=_digest("statistics"),
                  instrument_context_schema_digest=_digest("context"),
                  training_contract_digest=_digest("training-contract"),
                  pretraining_artifact_digest=_digest("pretraining"),
              )


          def _training() -> object:
              return SimpleNamespace(
                  seeds=(3, 5),
                  digest_payload=lambda: {"schema_version": "training-test-v1"},
              )


          def _run(tmp_path: Path, backend: object) -> None:
              train_universal_seeds(
                  runtime=_runtime(),
                  training=_training(),
                  backend=backend,
                  output_root=tmp_path,
                  architecture_name="u_medium_direct",
              )


          def test_member_environment_digest_must_be_sha256_before_manifest_publish(
              tmp_path: Path,
          ) -> None:
              backend = _Backend(lambda _seed: ("not-a-digest", _digest("arch"), 32))

              with pytest.raises(ValueError, match="environment"):
                  _run(tmp_path, backend)

              assert not (tmp_path / "universal-training.json").exists()


          def test_member_architecture_digest_is_mandatory_before_manifest_publish(
              tmp_path: Path,
          ) -> None:
              backend = _Backend(lambda _seed: (_digest("env"), None, 32))

              with pytest.raises(ValueError, match="architecture"):
                  _run(tmp_path, backend)

              assert not (tmp_path / "universal-training.json").exists()


          def test_member_identity_cannot_drift_between_seeds(tmp_path: Path) -> None:
              backend = _Backend(
                  lambda seed: (
                      _digest("env"),
                      _digest(f"architecture:{seed}"),
                      32,
                  )
              )

              with pytest.raises(ValueError, match="architecture"):
                  _run(tmp_path, backend)

              assert not (tmp_path / "universal-training.json").exists()


          def test_actual_timesteps_must_be_positive_before_manifest_publish(
              tmp_path: Path,
          ) -> None:
              backend = _Backend(lambda _seed: (_digest("env"), _digest("arch"), 0))

              with pytest.raises(ValueError, match="actual_timesteps"):
                  _run(tmp_path, backend)

              assert not (tmp_path / "universal-training.json").exists()
          PY

          cat > tests/studio/test_jobs_windows_recovery_contract.py <<'PY'
          from __future__ import annotations

          import trade_rl.studio.jobs as studio_jobs


          def test_windows_pid_start_token_uses_process_creation_time_provider(
              monkeypatch,
          ) -> None:
              monkeypatch.setattr(
                  studio_jobs,
                  "_windows_process_start_token",
                  lambda pid: f"creation:{pid}",
                  raising=False,
              )

              assert studio_jobs._pid_start_token(4321, platform_name="nt") == (
                  "creation:4321"
              )
          PY

          cat > tests/operations/test_causal_alpha_v3_generation_recovery.py <<'PY'
          from __future__ import annotations

          import importlib
          import json
          from pathlib import Path
          from types import SimpleNamespace

          import pytest


          def _module():
              return importlib.import_module(
                  "trade_rl.operations.causal_alpha_v3_generation"
              )


          def _launch(module):
              commit = "a" * 40
              runtime_digest = "d" * 64
              generation = "causal-alpha-v3-v2-r1"
              return module.CausalAlphaV3Launch(
                  generation=generation,
                  container_name=f"trade-rl-causal-alpha-v3-{generation}",
                  image=f"trade-rl-causal-alpha-v3:{commit[:12]}-{runtime_digest[:12]}",
                  image_id="1" * 64,
                  git_commit=commit,
                  source_tree_digest="b" * 64,
                  lockfile_digest="c" * 64,
                  runtime_manifest_digest=runtime_digest,
                  research_config_digest="e" * 64,
                  run_config_digest="f" * 64,
                  output_path=f"/workspace/var/runs/{generation}",
              )


          def _canonical(payload: object) -> bytes:
              return (
                  json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
                  + b"\n"
              )


          def _write_launch(path: Path, launch) -> bytes:
              payload = _canonical(launch.to_payload())
              path.parent.mkdir(parents=True)
              path.write_bytes(payload)
              return payload


          def test_start_retries_same_persisted_identity_when_detach_previously_failed(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              module = _module()
              launch = _launch(module)
              root = tmp_path / "project"
              state_root = tmp_path / "state"
              runtime_root = tmp_path / "runtime"
              compose = root / "docker/compose.causal-alpha-v3-research.yaml"
              research = root / "examples/binance/universal-causal-alpha-v3-research.json"
              run_config = root / "examples/binance-multitimeframe/universal-u6-ppo.json"
              for path in (compose, research, run_config, root / "uv.lock"):
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("fixture\n", encoding="utf-8")
              (runtime_root / "runtime-manifest.json").parent.mkdir(parents=True)
              (runtime_root / "runtime-manifest.json").write_text(
                  "{}\n", encoding="utf-8"
              )
              launch_path = state_root / launch.generation / "launch-manifest.json"
              original_bytes = _write_launch(launch_path, launch)
              commands: list[tuple[str, ...]] = []

              monkeypatch.setattr(module, "_git_status", lambda _root: "")
              monkeypatch.setattr(module, "_git", lambda *_args: launch.git_commit)
              monkeypatch.setattr(
                  module,
                  "load_universal_runtime_manifest",
                  lambda _path: SimpleNamespace(
                      manifest_digest=launch.runtime_manifest_digest
                  ),
              )
              monkeypatch.setattr(
                  module, "source_tree_digest", lambda _root: launch.source_tree_digest
              )

              def digest(path: Path) -> str:
                  values = {
                      "uv.lock": launch.lockfile_digest,
                      "universal-causal-alpha-v3-research.json": (
                          launch.research_config_digest
                      ),
                      "universal-u6-ppo.json": launch.run_config_digest,
                  }
                  return values[path.name]

              monkeypatch.setattr(module, "_sha256_file", digest)
              monkeypatch.setattr(module, "_container_exists", lambda _name: False)
              monkeypatch.setattr(
                  module,
                  "_inspect_image",
                  lambda _image: (
                      launch.image_id,
                      {
                          "org.opencontainers.image.revision": launch.git_commit,
                          "io.trade-rl.source-tree-digest": launch.source_tree_digest,
                          "io.trade-rl.lockfile-digest": launch.lockfile_digest,
                          "io.trade-rl.runtime-manifest-digest": (
                              launch.runtime_manifest_digest
                          ),
                      },
                  ),
              )
              monkeypatch.setattr(
                  module,
                  "_run",
                  lambda command, **_kwargs: commands.append(tuple(command)),
              )

              result = module.start_generation(
                  project_root=root,
                  generation=launch.generation,
                  compose_file=compose,
                  runtime_artifact_root=runtime_root,
                  state_root=state_root,
              )

              assert result == launch
              assert launch_path.read_bytes() == original_bytes
              assert sum("--detach" in command for command in commands) == 1


          def test_collect_resumes_incomplete_copy_and_then_is_idempotent(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              module = _module()
              launch = _launch(module)
              state_root = tmp_path / "state"
              retained_root = tmp_path / "retained"
              _write_launch(
                  state_root / launch.generation / "launch-manifest.json",
                  launch,
              )
              retained = retained_root / launch.generation
              retained.mkdir(parents=True)
              _write_launch(retained / "launch-manifest.json", launch)
              (retained / "container.log").write_bytes(b"first-attempt\n")
              incomplete = {
                  "container_exit_code": 1,
                  "execution_status": "failed",
                  "generation": launch.generation,
                  "launch": launch.to_payload(),
                  "oom_killed": False,
                  "research_outcome": "unavailable",
                  "run_output_retained": False,
                  "schema_version": "causal_alpha_v3_research_result_v1",
              }
              (retained / "research-result.json").write_bytes(_canonical(incomplete))
              partial = retained / "run"
              partial.mkdir()
              (partial / "partial.txt").write_text("partial", encoding="utf-8")
              copy_calls: list[tuple[str, ...]] = []

              monkeypatch.setattr(
                  module,
                  "_inspect_container",
                  lambda _launch: module.ContainerState(
                      running=False,
                      oom_killed=False,
                      exit_code=1,
                  ),
              )
              monkeypatch.setattr(
                  module,
                  "_container_logs",
                  lambda _launch: (_ for _ in ()).throw(
                      AssertionError("resume must preserve retained logs")
                  ),
              )

              def copy(command, **_kwargs) -> None:
                  call = tuple(command)
                  copy_calls.append(call)
                  assert call[:2] == ("docker", "cp")
                  destination = Path(call[-1])
                  destination.mkdir(parents=True, exist_ok=True)
                  (destination / "artifact.json").write_text(
                      "{}\n", encoding="utf-8"
                  )

              monkeypatch.setattr(module, "_run", copy)

              first = module.collect_generation(
                  generation=launch.generation,
                  state_root=state_root,
                  retained_root=retained_root,
              )
              assert first["run_output_retained"] is True
              assert (retained / "run/artifact.json").is_file()
              assert not (retained / "run/partial.txt").exists()
              assert (retained / "container.log").read_bytes() == b"first-attempt\n"

              monkeypatch.setattr(
                  module,
                  "_run",
                  lambda *_args, **_kwargs: (_ for _ in ()).throw(
                      AssertionError("completed collection must not copy twice")
                  ),
              )
              second = module.collect_generation(
                  generation=launch.generation,
                  state_root=state_root,
                  retained_root=retained_root,
              )

              assert second == first
              assert len(copy_calls) == 1
              assert not any(path.name.startswith(".run-") for path in retained.iterdir())
          PY

      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Verify contracts are RED for intended reasons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/architecture-hardening-red
          set +e
          uv run pytest -q tests/architecture/test_architecture_hardening_contract.py > var/architecture-hardening-red/architecture.log 2>&1
          architecture_status=$?
          uv run pytest -q tests/workflows/test_universal_training_manifest_contract.py > var/architecture-hardening-red/universal.log 2>&1
          universal_status=$?
          uv run pytest -q tests/studio/test_jobs_windows_recovery_contract.py > var/architecture-hardening-red/studio.log 2>&1
          studio_status=$?
          uv run pytest -q tests/operations/test_causal_alpha_v3_generation_recovery.py > var/architecture-hardening-red/operations.log 2>&1
          operations_status=$?
          set -e

          test "$architecture_status" -ne 0
          test "$universal_status" -ne 0
          test "$studio_status" -ne 0
          test "$operations_status" -ne 0
          grep -Eq "reporting|runtime_factory|thin operations adapter|AssertionError" var/architecture-hardening-red/architecture.log
          grep -Eq "FAILED|did not raise" var/architecture-hardening-red/universal.log
          grep -Eq "TypeError|FAILED" var/architecture-hardening-red/studio.log
          grep -Eq "ModuleNotFoundError|No module named" var/architecture-hardening-red/operations.log

      - name: Commit RED contracts and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/architecture-hardening-red-bootstrap.yml
          rm -f .github/workflows/source-snapshot-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: define architecture hardening contracts"
          git push origin HEAD:bootstrap/architecture-hardening-source-snapshot-20260821

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-hardening-red-evidence
          path: var/architecture-hardening-red
          if-no-files-found: error
          retention-days: 14
