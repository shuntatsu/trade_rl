name: Integrate full training capability gate

on:
  push:
    branches:
      - bootstrap/architecture-hardening-source-snapshot-20260821

permissions:
  contents: write

concurrency:
  group: architecture-hardening-training-gate
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardened head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require completed hardening implementation
        run: |
          test -f trade_rl/operations/causal_alpha_v3_generation.py
          test -f tests/architecture/test_architecture_hardening_contract.py

      - name: Add conditional full training gate to canonical CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml")
          source = workflow.read_text(encoding="utf-8")
          marker = "\n  compatibility:\n"
          job = r'''

            training-capability-gate:
              name: Full training capability gate
              runs-on: ubuntu-latest
              timeout-minutes: 60
              steps:
                - name: Checkout exact head
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
                  with:
                    ref: ${{ github.event.pull_request.head.sha || github.sha }}
                    persist-credentials: false
                    fetch-depth: 0

                - name: Resolve audit applicability
                  id: scope
                  shell: bash
                  env:
                    EVENT_NAME: ${{ github.event_name }}
                    BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  run: |
                    set -euo pipefail
                    required=false
                    if test "$EVENT_NAME" = "push"; then
                      required=true
                    else
                      git diff --name-only "$BASE_SHA" "$HEAD_SHA" > training-audit-paths.txt
                      if grep -Eq '^(trade_rl/(rl|learning|integrations|workflows|operations)/|scripts/(run_training_capability_audit|run_universal_full_research)\.py$|pyproject\.toml$|uv\.lock$|docker/Dockerfile\.training$|\.github/workflows/(ci|full-training-capability-audit)\.yml$)' training-audit-paths.txt; then
                        required=true
                      fi
                    fi
                    printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

                - name: Record non-applicable gate
                  if: steps.scope.outputs.required != 'true'
                  run: echo 'Full training capability audit is not applicable to this diff.'

                - name: Set up uv
                  if: steps.scope.outputs.required == 'true'
                  uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
                  with:
                    python-version: "3.12"
                    enable-cache: true

                - name: Install complete audit dependencies
                  if: steps.scope.outputs.required == 'true'
                  run: uv sync --extra dev --extra train-sb3 --extra export

                - name: Run real training capability matrix
                  if: steps.scope.outputs.required == 'true'
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p var
                    uv run python scripts/run_training_capability_audit.py \
                      --output var/training-capability-audit \
                      2>&1 | tee var/training-capability-audit.log

                - name: Verify audit result schema
                  if: steps.scope.outputs.required == 'true'
                  shell: bash
                  run: |
                    uv run python - <<'PY'
                    import json
                    from pathlib import Path

                    path = Path('var/training-capability-audit/audit-report.json')
                    payload = json.loads(path.read_text(encoding='utf-8'))
                    assert payload['schema_version'] == 'full_training_capability_audit_v1'
                    assert len(payload['digest']) == 64
                    for name, record in payload['algorithms'].items():
                        assert record['status'] == 'pass', (name, record)
                        assert record['actual_timesteps'] >= 16
                        assert record['checkpoint_count'] >= 1
                    for name in (
                        'behavior_cloning',
                        'exports',
                        'replay_resume',
                        'residual_controls',
                        'sequence',
                        'training_resume',
                    ):
                        assert payload[name]['status'] == 'pass', (name, payload[name])
                    PY

                - name: Upload full training capability evidence
                  if: always() && steps.scope.outputs.required == 'true'
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: full-training-capability-gate
                    path: |
                      var/training-capability-audit
                      var/training-capability-audit.log
                      training-audit-paths.txt
                    if-no-files-found: warn
                    retention-days: 14
          '''
          job = job.replace("          ", "")
          if "  training-capability-gate:\n" not in source:
              if marker not in source:
                  raise RuntimeError("canonical CI compatibility marker drifted")
              source = source.replace(marker, job + marker, 1)
          workflow.write_text(source, encoding="utf-8")

          contract = Path(
              "tests/architecture/test_architecture_hardening_contract.py"
          )
          text = contract.read_text(encoding="utf-8")
          addition = '''

          def test_full_training_capability_is_a_canonical_conditional_gate() -> None:
              workflow = (REPOSITORY_ROOT / ".github/workflows/ci.yml").read_text(
                  encoding="utf-8"
              )
              assert "training-capability-gate:" in workflow
              assert "name: Full training capability gate" in workflow
              assert "scripts/run_training_capability_audit.py" in workflow
              assert "Record non-applicable gate" in workflow
          '''.replace("          ", "")
          if "test_full_training_capability_is_a_canonical_conditional_gate" not in text:
              contract.write_text(text.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify canonical training gate structure
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff check --fix tests/architecture/test_architecture_hardening_contract.py
          uv run ruff format tests/architecture/test_architecture_hardening_contract.py
          uv run pytest -q tests/architecture/test_architecture_hardening_contract.py
          uv run python .github/check_workflow_security.py .
          python - <<'PY'
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          job = payload['jobs']['training-capability-gate']
          assert job['name'] == 'Full training capability gate'
          assert job['timeout-minutes'] == 60
          PY
          git diff --check

      - name: Commit canonical training gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/architecture-hardening-training-gate.yml
          rm -f .github/workflows/architecture-hardening-ci-integration.yml
          rm -f .github/workflows/architecture-hardening-apply.yml
          rm -f .github/workflows/architecture-hardening-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: require full training audit for relevant changes"
          git push origin HEAD:bootstrap/architecture-hardening-source-snapshot-20260821
