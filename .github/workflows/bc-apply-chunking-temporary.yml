name: Apply BC rollout chunking

on:
  push:
    branches:
      - agent/bc-temporal-correctness-stacked

permissions:
  contents: write

concurrency:
  group: apply-bc-rollout-chunking
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/bc-temporal-correctness-stacked
          fetch-depth: 0

      - name: Apply bounded worker-task chunking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/learning/episode_teacher_artifact.py")
          text = path.read_text(encoding="utf-8")

          old_globals = """_FORK_EPISODE_BATCH: EpisodeOracleBatch | None = None
          _FORK_EPISODE_ENVIRONMENT_FACTORY: Any | None = None
          _FORK_EPISODE_TEACHER_DIGEST: str | None = None
          """
          new_globals = """_MAX_EPISODES_PER_TEACHER_TASK: Final = 8
          _FORK_EPISODE_BATCH: EpisodeOracleBatch | None = None
          _FORK_EPISODE_ENVIRONMENT_FACTORY: Any | None = None
          _FORK_EPISODE_TEACHER_DIGEST: str | None = None
          """
          if text.count(old_globals) != 1:
              raise RuntimeError("episode teacher globals anchor changed")
          text = text.replace(old_globals, new_globals, 1)

          start = text.index("def _collect_isolated_episode(")
          end = text.index("\ndef collect_episode_teacher_rollout_parallel(", start)
          helpers = '''def _collect_episode_with_environment(
              environment: TeacherRolloutEnvironment,
              batch: EpisodeOracleBatch,
              teacher_config_digest: str,
              item: tuple[OracleEpisodeContract, np.ndarray],
          ) -> tuple[EpisodeSupervisedPolicyDataset, int]:
              contract, targets = item
              isolated_contract = OracleEpisodeContract(
                  dataset_id=contract.dataset_id,
                  episode_index=0,
                  start=contract.start,
                  stop=contract.stop,
                  initial_state_mode=contract.initial_state_mode,
                  initial_weights=contract.initial_weights,
              )
              episode_batch = EpisodeOracleBatch(
                  dataset_id=batch.dataset_id,
                  teacher_config_digest=batch.teacher_config_digest,
                  sampling_config_digest=batch.sampling_config_digest,
                  contracts=(isolated_contract,),
                  targets=(targets,),
                  solver_provenance=batch.solver_provenance,
              )
              episode = collect_episode_teacher_rollout(
                  environment,
                  episode_batch,
                  teacher_config_digest=teacher_config_digest,
              )
              return episode, contract.episode_index


          def _collect_isolated_episode_chunk(
              environment_factory: Any,
              batch: EpisodeOracleBatch,
              teacher_config_digest: str,
              items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
          ) -> tuple[tuple[EpisodeSupervisedPolicyDataset, int], ...]:
              if not items:
                  raise ValueError("teacher rollout episode chunk must not be empty")
              environment = environment_factory()
              try:
                  return tuple(
                      _collect_episode_with_environment(
                          environment,
                          batch,
                          teacher_config_digest,
                          item,
                      )
                      for item in items
                  )
              finally:
                  environment.close()


          def _episode_item_chunks(
              items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
              *,
              worker_count: int,
          ) -> tuple[tuple[tuple[OracleEpisodeContract, np.ndarray], ...], ...]:
              if not items:
                  return ()
              if worker_count <= 0:
                  raise ValueError("teacher rollout chunk worker count must be positive")
              balanced_size = (len(items) + worker_count - 1) // worker_count
              chunk_size = min(_MAX_EPISODES_PER_TEACHER_TASK, balanced_size)
              return tuple(
                  tuple(items[offset : offset + chunk_size])
                  for offset in range(0, len(items), chunk_size)
              )


          def _collect_forked_episode_chunk(
              items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
          ) -> tuple[tuple[EpisodeSupervisedPolicyDataset, int], ...]:
              if (
                  _FORK_EPISODE_ENVIRONMENT_FACTORY is None
                  or _FORK_EPISODE_BATCH is None
                  or _FORK_EPISODE_TEACHER_DIGEST is None
              ):
                  raise RuntimeError("forked episode teacher worker is not initialized")
              return _collect_isolated_episode_chunk(
                  _FORK_EPISODE_ENVIRONMENT_FACTORY,
                  _FORK_EPISODE_BATCH,
                  _FORK_EPISODE_TEACHER_DIGEST,
                  items,
              )


          '''
          text = text[:start] + helpers + text[end + 1 :]

          old_parallel = '''    if pending_items and "fork" in mp.get_all_start_methods():
              global _FORK_EPISODE_BATCH
              global _FORK_EPISODE_ENVIRONMENT_FACTORY
              global _FORK_EPISODE_TEACHER_DIGEST
              _FORK_EPISODE_BATCH = batch
              _FORK_EPISODE_ENVIRONMENT_FACTORY = environment_factory
              _FORK_EPISODE_TEACHER_DIGEST = teacher_config_digest
              try:
                  context = mp.get_context("fork")
                  with context.Pool(
                      processes=worker_count,
                      maxtasksperchild=1,
                  ) as pool:
                      for value in pool.imap(
                          _collect_forked_episode,
                          pending_items,
                          chunksize=1,
                      ):
                          persist(value)
              finally:
                  _FORK_EPISODE_BATCH = None
                  _FORK_EPISODE_ENVIRONMENT_FACTORY = None
                  _FORK_EPISODE_TEACHER_DIGEST = None
          elif pending_items:

              def collect_one(
                  item: tuple[OracleEpisodeContract, np.ndarray],
              ) -> tuple[EpisodeSupervisedPolicyDataset, int]:
                  return _collect_isolated_episode(
                      environment_factory,
                      batch,
                      teacher_config_digest,
                      item,
                  )

              with ThreadPoolExecutor(
                  max_workers=worker_count,
                  thread_name_prefix="teacher-rollout",
              ) as executor:
                  for value in executor.map(collect_one, pending_items):
                      persist(value)
          '''
          new_parallel = '''    if pending_items:
              pending_worker_count = min(worker_count, len(pending_items))
              pending_chunks = _episode_item_chunks(
                  tuple(pending_items),
                  worker_count=pending_worker_count,
              )
          else:
              pending_worker_count = 0
              pending_chunks = ()

          if pending_chunks and "fork" in mp.get_all_start_methods():
              global _FORK_EPISODE_BATCH
              global _FORK_EPISODE_ENVIRONMENT_FACTORY
              global _FORK_EPISODE_TEACHER_DIGEST
              _FORK_EPISODE_BATCH = batch
              _FORK_EPISODE_ENVIRONMENT_FACTORY = environment_factory
              _FORK_EPISODE_TEACHER_DIGEST = teacher_config_digest
              try:
                  context = mp.get_context("fork")
                  with context.Pool(
                      processes=pending_worker_count,
                      maxtasksperchild=1,
                  ) as pool:
                      for values in pool.imap(
                          _collect_forked_episode_chunk,
                          pending_chunks,
                          chunksize=1,
                      ):
                          for value in values:
                              persist(value)
              finally:
                  _FORK_EPISODE_BATCH = None
                  _FORK_EPISODE_ENVIRONMENT_FACTORY = None
                  _FORK_EPISODE_TEACHER_DIGEST = None
          elif pending_chunks:

              def collect_chunk(
                  items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
              ) -> tuple[tuple[EpisodeSupervisedPolicyDataset, int], ...]:
                  return _collect_isolated_episode_chunk(
                      environment_factory,
                      batch,
                      teacher_config_digest,
                      items,
                  )

              with ThreadPoolExecutor(
                  max_workers=pending_worker_count,
                  thread_name_prefix="teacher-rollout",
              ) as executor:
                  for values in executor.map(collect_chunk, pending_chunks):
                      for value in values:
                          persist(value)
          '''
          if text.count(old_parallel) != 1:
              raise RuntimeError("episode teacher parallel anchor changed")
          text = text.replace(old_parallel, new_parallel, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile trade_rl/learning/episode_teacher_artifact.py
          git diff --check

      - name: Commit source change and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bc-apply-chunking-temporary.yml
          git add trade_rl/learning/episode_teacher_artifact.py
          git commit -m "perf(bc): batch teacher episodes per worker task"
          git push origin HEAD:agent/bc-temporal-correctness-stacked
