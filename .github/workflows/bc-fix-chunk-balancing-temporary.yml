name: Fix BC rollout chunk balancing

on:
  push:
    branches:
      - agent/bc-temporal-correctness-stacked

permissions:
  contents: write

concurrency:
  group: fix-bc-rollout-chunk-balancing
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/bc-temporal-correctness-stacked
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Balance bounded teacher rollout tasks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/learning/episode_teacher_artifact.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _episode_item_chunks(
              items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
              *,
              worker_count: int,
          ) -> tuple[tuple[tuple[OracleEpisodeContract, np.ndarray], ...], ...]:
              if not items:
                  return ()
              if worker_count <= 0:
                  raise ValueError("teacher rollout chunk worker count must be positive")
              balanced_size = (len(items) + worker_count - 1) // worker_count
              chunk_size = min(_MAX_EPISODES_PER_TEACHER_TASK, balanced_size)
              return tuple(
                  tuple(items[offset : offset + chunk_size])
                  for offset in range(0, len(items), chunk_size)
              )
          '''
          new = '''def _episode_item_chunks(
              items: tuple[tuple[OracleEpisodeContract, np.ndarray], ...],
              *,
              worker_count: int,
          ) -> tuple[tuple[tuple[OracleEpisodeContract, np.ndarray], ...], ...]:
              if not items:
                  return ()
              if worker_count <= 0:
                  raise ValueError("teacher rollout chunk worker count must be positive")
              minimum_task_count = (
                  len(items) + _MAX_EPISODES_PER_TEACHER_TASK - 1
              ) // _MAX_EPISODES_PER_TEACHER_TASK
              task_count = max(min(worker_count, len(items)), minimum_task_count)
              base_size, oversized_chunk_count = divmod(len(items), task_count)
              chunks: list[tuple[tuple[OracleEpisodeContract, np.ndarray], ...]] = []
              offset = 0
              for chunk_index in range(task_count):
                  chunk_size = base_size + int(chunk_index < oversized_chunk_count)
                  chunks.append(tuple(items[offset : offset + chunk_size]))
                  offset += chunk_size
              return tuple(chunks)
          '''
          if text.count(old) != 1:
              raise RuntimeError(
                  f"episode chunking anchor count is {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          uv run ruff format \
            trade_rl/learning/episode_teacher_artifact.py \
            tests/learning/test_episode_teacher_parallel_chunking.py
          uv run ruff check \
            trade_rl/learning/episode_teacher_artifact.py \
            tests/learning/test_episode_teacher_parallel_chunking.py
          python -m py_compile trade_rl/learning/episode_teacher_artifact.py
          git diff --check

      - name: Run focused rollout regressions
        run: >-
          uv run pytest -q
          tests/learning/test_episode_teacher_parallel_chunking.py
          tests/learning/test_episode_teacher_integration.py

      - name: Commit source change and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bc-fix-chunk-balancing-temporary.yml
          git add \
            trade_rl/learning/episode_teacher_artifact.py \
            tests/learning/test_episode_teacher_parallel_chunking.py
          git commit -m "perf(bc): balance teacher rollout worker tasks"
          git push origin HEAD:agent/bc-temporal-correctness-stacked
