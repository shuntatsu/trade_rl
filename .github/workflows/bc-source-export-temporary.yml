name: Temporary BC source export

on:
  push:
    branches:
      - agent/bc-temporal-correctness-stacked

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Upload source file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bc-source-export-${{ github.sha }}
          path: trade_rl/learning/episode_teacher_artifact.py
          if-no-files-found: error
          retention-days: 1
