name: Binance Vision repair Task 4
on:
  push:
    branches: [fix/binance-vision-daily-repair-v1]
    paths: [.github/workflows/binance-vision-repair-task4.yml]
permissions:
  contents: write
jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Validate merged repair semantics during offline inspection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4255c7260cb22ea04319bcc9cde4977fadab57c4"
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/binance.py")
          text = path.read_text()
          old = '''    composite = _FrozenDatasetTransport(
              market_data=cache_transport,
              metadata=metadata_transport,
              repairs=repairs,
          )
          return FrozenBinanceSource(
          '''
          new = '''    composite = _FrozenDatasetTransport(
              market_data=cache_transport,
              metadata=metadata_transport,
              repairs=repairs,
          )
          start_ms = int(config.data_start.timestamp() * 1_000)
          end_ms = int(config.data_stop_exclusive.timestamp() * 1_000)
          for symbol in config.symbols:
              for timeframe in (config.base_timeframe, *config.feature_timeframes):
                  composite.load_klines(
                      market=config.market,
                      symbol=symbol,
                      interval=timeframe,
                      start_ms=start_ms,
                      end_ms=end_ms,
                      mode=BinanceTransportMode.VISION,
                  )
          return FrozenBinanceSource(
          '''
          if text.count(old) != 1:
              raise RuntimeError("unexpected frozen composite return shape")
          text = text.replace(old, new, 1)
          old_duplicate = '''    frozen = _inspect_frozen_binance_source(config, root)
              start_ms = int(config.data_start.timestamp() * 1_000)
              end_ms = int(config.data_stop_exclusive.timestamp() * 1_000)
              for symbol in config.symbols:
                  for timeframe in (config.base_timeframe, *config.feature_timeframes):
                      frozen.composite_transport.load_klines(
                          market=config.market,
                          symbol=symbol,
                          interval=timeframe,
                          start_ms=start_ms,
                          end_ms=end_ms,
                          mode=BinanceTransportMode.VISION,
                      )
              return frozen
          '''
          if text.count(old_duplicate) != 1:
              raise RuntimeError("unexpected freeze post-inspection validation shape")
          text = text.replace(
              old_duplicate,
              '    return _inspect_frozen_binance_source(config, root)\n',
              1,
          )
          path.write_text(text)
          PY
          git rm .github/workflows/binance-vision-repair-task4.yml
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/binance.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap tests/evaluation/experiments/bootstrap
          uv run ruff format --check trade_rl/evaluation/experiments/bootstrap tests/evaluation/experiments/bootstrap
          uv run pytest -q tests/evaluation/experiments/bootstrap
          uv run mypy trade_rl/evaluation/experiments/bootstrap
          test ! -e .github/workflows/binance-vision-repair-task4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: revalidate frozen Vision repair semantics offline"
          git push origin HEAD:refs/heads/fix/binance-vision-daily-repair-v1
