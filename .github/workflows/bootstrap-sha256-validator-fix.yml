name: Bootstrap SHA-256 validator fix

on:
  push:
    branches:
      - fix/bootstrap-sha256-validator-authority
    paths:
      - .github/workflows/bootstrap-sha256-validator-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "230fafc0e467d3f4a15f4ead15dc978b481808e9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/bootstrap-sha256-validator-fix.yml"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Apply minimal canonical-validator fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/workflow.py")
          text = path.read_text(encoding="utf-8")

          import_old = "from trade_rl.artifacts.hashing import content_digest\n"
          import_new = (
              "from trade_rl._validation import require_sha256\n"
              "from trade_rl.artifacts.hashing import content_digest\n"
          )
          if text.count(import_old) != 1:
              raise SystemExit("content_digest import block mismatch")
          text = text.replace(import_old, import_new, 1)

          constructor_old = '''        for field in (\n            "config_digest",\n            "bootstrap_digest",\n            "dataset_id",\n            "dataset_artifact_digest",\n            "study_digest",\n        ):\n            value = getattr(self, field)\n            if not isinstance(value, str) or len(value) != 64:\n                raise ValueError(f"{field} must be a SHA-256 digest")\n            try:\n                int(value, 16)\n            except ValueError as error:\n                raise ValueError(f"{field} must be a SHA-256 digest") from error\n'''
          constructor_new = '''        for field in (\n            "config_digest",\n            "bootstrap_digest",\n            "dataset_id",\n            "dataset_artifact_digest",\n            "study_digest",\n        ):\n            _require_digest(getattr(self, field), field=field)\n'''
          if text.count(constructor_old) != 1:
              raise SystemExit("bootstrap result validation block mismatch")
          text = text.replace(constructor_old, constructor_new, 1)

          digest_old = '''def _require_digest(value: object, *, field: str) -> str:\n    if not isinstance(value, str) or len(value) != 64:\n        raise ValueError(f"{field} must be a SHA-256 digest")\n    try:\n        int(value, 16)\n    except ValueError as error:\n        raise ValueError(f"{field} must be a SHA-256 digest") from error\n    return value\n'''
          digest_new = '''def _require_digest(value: object, *, field: str) -> str:\n    if not isinstance(value, str):\n        raise ValueError(f"{field} must be a SHA-256 digest")\n    return require_sha256(value, field=field)\n'''
          if text.count(digest_old) != 1:
              raise SystemExit("bootstrap digest helper mismatch")
          text = text.replace(digest_old, digest_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Targeted GREEN and static checks
        run: |
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_digest_validation.py tests/evaluation/experiments/bootstrap/test_tamper.py tests/evaluation/experiments/bootstrap/test_workflow.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap/workflow.py tests/evaluation/experiments/bootstrap/test_digest_validation.py
          uv run ruff format --check trade_rl/evaluation/experiments/bootstrap/workflow.py tests/evaluation/experiments/bootstrap/test_digest_validation.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/workflow.py

      - name: Commit fix and retire helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-sha256-validator-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/workflow.py .github/workflows/bootstrap-sha256-validator-fix.yml
          git diff --cached --check
          git diff --cached --name-only | sort | diff -u - <(printf '%s\n' '.github/workflows/bootstrap-sha256-validator-fix.yml' 'trade_rl/evaluation/experiments/bootstrap/workflow.py' | sort)
          git commit -m "fix: use canonical SHA-256 validator in bootstrap"
          git push origin HEAD:fix/bootstrap-sha256-validator-authority
