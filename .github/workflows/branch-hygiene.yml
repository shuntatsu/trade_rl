name: Branch hygiene

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      apply:
        description: Delete branches proven redundant instead of reporting only
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete only proven-redundant branches
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all current remote branch tips
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Plan and apply safe cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$APPLY_REQUESTED" == "true" ]]; then
            args+=(--apply)
          fi
          python3 -m tools.branch_hygiene "${args[@]}"
