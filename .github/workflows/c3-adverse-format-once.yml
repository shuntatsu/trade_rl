name: C3 Adverse Format Once

on:
  push:
    branches:
      - agent/causal-scenario-c3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - name: Format adverse evidence module and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.15.0
          ruff format trade_rl/evaluation/causal_scenario_c3_adverse.py
          rm -f .github/workflows/c3-adverse-format-once.yml
          rm -f .github/c3-adverse-format-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/causal_scenario_c3_adverse.py .github/workflows/c3-adverse-format-once.yml .github/c3-adverse-format-trigger.txt
          git commit -m "style: format C3 adverse evidence"
          git push origin HEAD:agent/causal-scenario-c3
