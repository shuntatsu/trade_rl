name: C3 CLI Dispatch Once

on:
  push:
    branches:
      - agent/causal-scenario-c3

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - name: Add evaluation dispatch and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('trade_rl/cli/extended.py')
          source = path.read_text(encoding='utf-8')
          old = '''    if arguments[:2] == ["causal-scenario", "gate"]:
              from trade_rl.cli.causal_scenario import run_gate

              return run_gate(arguments[2:], stdout=output, stderr=errors)
          '''
          new = '''    if arguments[:2] == ["causal-scenario", "evaluate"]:
              from trade_rl.cli.causal_scenario import run_evaluate

              return run_evaluate(arguments[2:], stdout=output, stderr=errors)
              if arguments[:2] == ["causal-scenario", "gate"]:
              from trade_rl.cli.causal_scenario import run_gate

              return run_gate(arguments[2:], stdout=output, stderr=errors)
          '''
          if old not in source:
              raise SystemExit('expected causal-scenario gate dispatch not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/c3-cli-dispatch-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/cli/extended.py .github/workflows/c3-cli-dispatch-once.yml
          git commit -m "feat: dispatch C3 published-run evaluation"
          git push origin HEAD:agent/causal-scenario-c3
