name: One-shot C3 core extractor

on:
  push:
    branches:
      - agent/causal-scenario-c3-core
    paths:
      - .github/workflows/c3-core-extractor.yml

permissions:
  contents: write

concurrency:
  group: c3-core-extractor
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[c3-core-extracted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/causal-scenario-c3-core

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fetch frozen source
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: git fetch --no-tags origin "$SOURCE"

      - name: Add RED contracts
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: |
          set -euo pipefail
          files=(
            tests/evaluation/test_causal_scenario_c3.py
            tests/evaluation/test_causal_scenario_c3_adverse.py
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py
            tests/evaluation/test_causal_scenario_c3_adverse_source.py
            tests/evaluation/test_causal_scenario_c3_identity_daily.py
            tests/evaluation/test_causal_scenario_c3_perfect_information.py
            tests/evaluation/test_causal_scenario_c3_plan_closure.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done
          git add "${files[@]}"
          git commit -m "test: define causal scenario C3 core contracts"

      - name: Install test environment
        run: uv sync --extra dev --extra train-sb3

      - name: Verify RED
        run: |
          set +e
          uv run pytest \
            tests/evaluation/test_causal_scenario_c3.py \
            tests/evaluation/test_causal_scenario_c3_adverse.py \
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py \
            tests/evaluation/test_causal_scenario_c3_adverse_source.py \
            tests/evaluation/test_causal_scenario_c3_identity_daily.py \
            tests/evaluation/test_causal_scenario_c3_perfect_information.py \
            tests/evaluation/test_causal_scenario_c3_plan_closure.py \
            -q
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "C3 RED tests unexpectedly passed before production modules existed" >&2
            exit 1
          fi
          echo "RED verified: focused tests fail before C3 production modules are added"

      - name: Add GREEN implementation
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: |
          set -euo pipefail
          files=(
            trade_rl/evaluation/bootstrap.py
            trade_rl/evaluation/__init__.py
            trade_rl/evaluation/causal_scenario_c3_contracts.py
            trade_rl/evaluation/causal_scenario_c3_prediction.py
            trade_rl/evaluation/causal_scenario_c3_decision_artifact.py
            trade_rl/evaluation/causal_scenario_c3_runner.py
            trade_rl/evaluation/causal_scenario_c3_perfect_information.py
            trade_rl/evaluation/causal_scenario_c3_adverse_source.py
            trade_rl/evaluation/causal_scenario_c3_adverse.py
            trade_rl/evaluation/causal_scenario_c3_report.py
            trade_rl/evaluation/causal_scenario_c3_adverse_report_binding.py
            trade_rl/evaluation/causal_scenario_c3_artifact.py
            trade_rl/evaluation/causal_scenario_c3_gate.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done

      - name: Verify focused GREEN
        run: |
          uv run pytest \
            tests/evaluation/test_causal_scenario_c3.py \
            tests/evaluation/test_causal_scenario_c3_adverse.py \
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py \
            tests/evaluation/test_causal_scenario_c3_adverse_source.py \
            tests/evaluation/test_causal_scenario_c3_identity_daily.py \
            tests/evaluation/test_causal_scenario_c3_perfect_information.py \
            tests/evaluation/test_causal_scenario_c3_plan_closure.py \
            -q
          uv run ruff check \
            trade_rl/evaluation/bootstrap.py \
            trade_rl/evaluation/__init__.py \
            trade_rl/evaluation/causal_scenario_c3_*.py \
            tests/evaluation/test_causal_scenario_c3*.py
          uv run ruff format --check \
            trade_rl/evaluation/bootstrap.py \
            trade_rl/evaluation/__init__.py \
            trade_rl/evaluation/causal_scenario_c3_*.py \
            tests/evaluation/test_causal_scenario_c3*.py
          uv run mypy \
            trade_rl/evaluation/bootstrap.py \
            trade_rl/evaluation/causal_scenario_c3_contracts.py \
            trade_rl/evaluation/causal_scenario_c3_prediction.py \
            trade_rl/evaluation/causal_scenario_c3_decision_artifact.py \
            trade_rl/evaluation/causal_scenario_c3_runner.py \
            trade_rl/evaluation/causal_scenario_c3_perfect_information.py \
            trade_rl/evaluation/causal_scenario_c3_adverse_source.py \
            trade_rl/evaluation/causal_scenario_c3_adverse.py \
            trade_rl/evaluation/causal_scenario_c3_report.py \
            trade_rl/evaluation/causal_scenario_c3_adverse_report_binding.py \
            trade_rl/evaluation/causal_scenario_c3_artifact.py \
            trade_rl/evaluation/causal_scenario_c3_gate.py

      - name: Commit implementation and remove extractor
        run: |
          git add trade_rl/evaluation tests/evaluation
          git rm .github/workflows/c3-core-extractor.yml
          git commit -m "feat: add causal scenario C3 evaluation core [c3-core-extracted]"
          git push origin HEAD:agent/causal-scenario-c3-core
