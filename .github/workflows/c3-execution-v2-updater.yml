name: One-shot integrated C3 execution updater

on:
  push:
    branches:
      - agent/causal-scenario-c3-execution-reporting-v2
    paths:
      - .github/workflows/c3-execution-v2-updater.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3-execution-reporting-v2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Import reviewed C3 orchestration base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/causal-scenario-c3
          mkdir -p trade_rl/workflows/causal_scenario
          git show origin/agent/causal-scenario-c3:trade_rl/workflows/causal_scenario/c3.py > trade_rl/workflows/causal_scenario/c3.py
          git show origin/agent/causal-scenario-c3:trade_rl/workflows/causal_scenario/c3_evaluation.py > trade_rl/workflows/causal_scenario/c3_evaluation.py
      - name: Adapt orchestration to authoritative core and request v2
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/adapt_c3.py <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/causal_scenario/c3.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        if not isinstance(self.report, CausalScenarioAggregateReport):\n            raise ValueError(\"report must be CausalScenarioAggregateReport\")\n        if not isinstance(self.gate, PhaseAEntryGateEvidence):\n            raise ValueError(\"gate must be PhaseAEntryGateEvidence\")\n",
              "        if not hasattr(self.report, \"digest\"):\n            raise ValueError(\"report must expose a digest\")\n        if not hasattr(self.gate, \"report_digest\") or not hasattr(self.gate, \"digest\"):\n            raise ValueError(\"gate must expose report and gate digests\")\n",
          )
          text = text.replace(
              "    if not isinstance(config, CausalScenarioC3Config):\n        raise TypeError(\"config must be CausalScenarioC3Config\")\n",
              "    for field in (\"bootstrap_resamples\", \"bootstrap_block_days\"):\n        value = getattr(config, field, None)\n        if isinstance(value, bool) or not isinstance(value, int) or value <= 0:\n            raise TypeError(f\"config.{field} must be a positive integer\")\n",
          )
          text = text.replace(
              "        item.prediction_evidence.validate_for_decision(loaded.decision)\n",
              "        validator = getattr(item.prediction_evidence, \"validate_for_decision\", None)\n        if callable(validator):\n            validator(loaded.decision)\n",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("trade_rl/workflows/causal_scenario/c3_evaluation.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import numpy as np\n",
              "import numpy as np\n\nfrom trade_rl.artifacts.codec import canonical_json_bytes\n",
              1,
          )
          marker = "from trade_rl.evaluation.causal_scenario_c3_contracts import (\n"
          text = text.replace(
              marker,
              "from trade_rl.evaluation.causal_scenario_c3_adverse_source import (\n"
              "    C3SourceAdverseEvidence,\n"
              "    load_c3_source_adverse_evidence,\n"
              ")\n" + marker,
              1,
          )
          text = text.replace(
              'C3_EVALUATION_REQUEST_SCHEMA: Final = "causal_scenario_c3_evaluation_request_v1"',
              'C3_EVALUATION_REQUEST_SCHEMA: Final = "causal_scenario_c3_evaluation_request_v2"',
          )
          text = text.replace(
              'C3_EVALUATION_RESULT_SCHEMA: Final = "causal_scenario_c3_evaluation_result_v1"',
              'C3_EVALUATION_RESULT_SCHEMA: Final = "causal_scenario_c3_evaluation_result_v2"',
          )

          start = text.index("def _relative_path(")
          stop = text.index("\n\ndef _float_vector", start)
          strict_paths = '''def _relative_path(root: Path, value: object, *, field: str) -> Path:
              raw = _string(value, field=field)
              relative = PurePosixPath(raw)
              if relative.is_absolute() or any(
                  part in {"", ".", ".."} for part in relative.parts
              ):
                  raise ValueError(f"{field} must be a safe relative path")
              candidate = root.joinpath(*relative.parts)
              current = root
              for part in relative.parts:
                  current = current / part
                  if current.is_symlink():
                      raise ValueError(f"{field} must not contain a symbolic link")
              resolved_root = root.resolve()
              resolved = candidate.resolve()
              if resolved_root != resolved and resolved_root not in resolved.parents:
                  raise ValueError(f"{field} escapes the request root")
              return resolved
          '''
          text = text[:start] + strict_paths + text[stop:]

          insertion_point = text.index("\n\ndef _source_fold_map")
          config_helper = '''

          def _walk_forward_config_payload(
              source_root: Path, manifest: WalkForwardRunManifest
          ) -> dict[str, object]:
              path = source_root / "walk-forward-config.json"
              if path.is_symlink() or not path.is_file():
                  raise FileNotFoundError(f"walk-forward config is missing: {path}")
              try:
                  raw_bytes = path.read_bytes()
                  payload = _object(json.loads(raw_bytes), field="walk-forward-config")
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise ValueError("walk-forward config is invalid") from error
              if canonical_json_bytes(payload) != raw_bytes:
                  raise ValueError("walk-forward config is not canonical JSON")
              if content_digest(payload) != manifest.workflow_config_digest:
                  raise ValueError("walk-forward config digest does not match manifest")
              return payload
          '''
          text = text[:insertion_point] + config_helper + text[insertion_point:]

          class_point = text.index("\n\n@dataclass(frozen=True, slots=True)\nclass C3EvaluationResult")
          context_code = '''

          @dataclass(frozen=True, slots=True)
          class _C3RequestContext:
              source_root: Path
              source_manifest: WalkForwardRunManifest
              walk_forward: dict[str, object]
              source_folds: dict[int, dict[str, object]]
              walk_forward_config: dict[str, object]
              adverse_evidence: C3SourceAdverseEvidence

              @property
              def required_scenario(self) -> str:
                  return self.adverse_evidence.required_scenario


          def _load_request_context(request_root: Path, source_value: object) -> _C3RequestContext:
              source_root = _relative_path(
                  request_root,
                  source_value,
                  field="source_walk_forward_run",
              )
              source_manifest = validate_walk_forward_run_directory(source_root)
              walk_forward = _walk_forward_payload(source_root, source_manifest)
              source_folds = _source_fold_map(walk_forward)
              walk_forward_config = _walk_forward_config_payload(source_root, source_manifest)
              adverse_evidence = load_c3_source_adverse_evidence(
                  source_root,
                  walk_forward_config=walk_forward_config,
                  source_folds=source_folds,
                  dataset_id=source_manifest.dataset_id,
              )
              return _C3RequestContext(
                  source_root=source_root,
                  source_manifest=source_manifest,
                  walk_forward=walk_forward,
                  source_folds=source_folds,
                  walk_forward_config=walk_forward_config,
                  adverse_evidence=adverse_evidence,
              )


          def _require_execution_scenarios(
              scenarios: set[str], *, required_scenario: str
          ) -> None:
              if "nominal" not in scenarios:
                  raise ValueError("each C3 request fold requires a nominal execution scenario")
              if required_scenario != "nominal" and required_scenario not in scenarios:
                  raise ValueError(
                      f"required adverse scenario is missing from C3 request: {required_scenario}"
                  )
          '''
          text = text[:class_point] + context_code + text[class_point:]

          text = text.replace(
              "        if not isinstance(self.batch, C3BatchResult):\n            raise ValueError(\"batch must be C3BatchResult\")\n",
              "        if not hasattr(self.batch, \"production_status\"):\n            raise ValueError(\"batch must expose production_status\")\n",
          )

          start = text.index("def execute_c3_evaluation_request(")
          stop = text.index("\n\n__all__", start)
          execute_code = '''def execute_c3_evaluation_request(
              request_path: str | Path,
              *,
              output_root: str | Path,
          ) -> C3EvaluationResult:
              """Execute C3 from verified walk-forward, C1, C2, and adverse evidence."""

              request_file = Path(request_path)
              if request_file.is_symlink() or not request_file.is_file():
                  raise FileNotFoundError(f"C3 evaluation request is missing: {request_file}")
              try:
                  request_bytes = request_file.read_bytes()
                  raw = _object(json.loads(request_bytes), field="request")
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise ValueError("C3 evaluation request is invalid") from error
              if canonical_json_bytes(raw) != request_bytes:
                  raise ValueError("C3 evaluation request is not canonical JSON")
              _fields(
                  raw,
                  {"config", "folds", "schema_version", "source_walk_forward_run"},
                  field="request",
              )
              if raw["schema_version"] != C3_EVALUATION_REQUEST_SCHEMA:
                  raise ValueError("unsupported C3 evaluation request schema")
              config = _load_config(raw["config"])
              request_root = request_file.parent
              context = _load_request_context(request_root, raw["source_walk_forward_run"])

              destination = Path(output_root)
              batch_queries: list[C3BatchQuery] = []
              fold_selection_days: dict[str, int] = {}
              required_adverse_evidence: dict[str, object] = {}
              seen_fold_indices: set[int] = set()
              seen_fold_ids: set[str] = set()
              adverse_by_fold = context.adverse_evidence.by_fold_index
              selection_days_by_fold = context.adverse_evidence.selection_days_by_fold

              for fold_position, raw_fold in enumerate(_list(raw["folds"], field="folds")):
                  field = f"folds[{fold_position}]"
                  fold = _object(raw_fold, field=field)
                  _fields(
                      fold,
                      {"fold_digest", "fold_id", "fold_index", "library", "queries"},
                      field=field,
                  )
                  fold_id = _string(fold["fold_id"], field=f"{field}.fold_id")
                  fold_index = _integer(fold["fold_index"], field=f"{field}.fold_index")
                  if fold_id in seen_fold_ids:
                      raise ValueError("C3 request fold IDs must be unique")
                  if fold_index in seen_fold_indices:
                      raise ValueError("C3 request fold indices must be unique")
                  seen_fold_ids.add(fold_id)
                  seen_fold_indices.add(fold_index)
                  source_fold = context.source_folds.get(fold_index)
                  if source_fold is None:
                      raise ValueError("C3 request fold is absent from source walk-forward run")
                  adverse = adverse_by_fold.get(fold_index)
                  selection_days = selection_days_by_fold.get(fold_index)
                  if adverse is None or selection_days is None:
                      raise ValueError("source adverse evidence does not cover C3 request fold")
                  fold_selection_days[fold_id] = selection_days
                  required_adverse_evidence[fold_id] = adverse

                  train_range = source_fold.get("train_range")
                  test_range = source_fold.get("test_range")
                  if (
                      not isinstance(train_range, list)
                      or len(train_range) != 2
                      or not isinstance(test_range, list)
                      or len(test_range) != 2
                  ):
                      raise ValueError("source walk-forward fold ranges are invalid")
                  train_start = _integer(train_range[0], field="source.train_start")
                  train_stop = _integer(train_range[1], field="source.train_stop", positive=True)
                  test_start = _integer(test_range[0], field="source.test_start")
                  test_stop = _integer(test_range[1], field="source.test_stop", positive=True)

                  library_root = _relative_path(
                      request_root, fold["library"], field=f"{field}.library"
                  )
                  library = load_causal_scenario_library_artifact(library_root)
                  if library.dataset_id != context.source_manifest.dataset_id:
                      raise ValueError("C2 library dataset does not match source run")
                  if (library.train_start, library.train_stop) != (train_start, train_stop):
                      raise ValueError("C2 library train range does not match source fold")
                  if (
                      library.config.horizon_decisions != config.horizon_decisions
                      or library.config.scenario_count != config.scenario_count
                  ):
                      raise ValueError("C2 library configuration does not match C3")
                  fold_digest = require_sha256(
                      _string(fold["fold_digest"], field=f"{field}.fold_digest"),
                      field=f"{field}.fold_digest",
                  )

                  scenarios: set[str] = set()
                  for query_position, raw_query in enumerate(
                      _list(fold["queries"], field=f"{field}.queries")
                  ):
                      query_field = f"{field}.queries[{query_position}]"
                      query = _object(raw_query, field=query_field)
                      _fields(
                          query,
                          {
                              "execution_scenario",
                              "outcomes",
                              "perfect_information",
                              "ppo_mean_action",
                              "value_artifact",
                          },
                          field=query_field,
                      )
                      value_root = _relative_path(
                          request_root,
                          query["value_artifact"],
                          field=f"{query_field}.value_artifact",
                      )
                      value_result = load_causal_scenario_value_artifact(value_root)
                      if value_result.dataset_id != context.source_manifest.dataset_id:
                          raise ValueError("C1 value dataset does not match source run")
                      if value_result.fold_digest != fold_digest:
                          raise ValueError("C1 value fold identity does not match request")
                      if (value_result.train_start, value_result.train_stop) != (
                          train_start,
                          train_stop,
                      ):
                          raise ValueError("C1 value train range does not match source fold")
                      if not test_start <= value_result.query_index < test_stop:
                          raise ValueError("C1 query lies outside the source fold test range")
                      if value_result.query_index + config.horizon_decisions > test_stop:
                          raise ValueError("C1 realized horizon exceeds the source fold test range")
                      if value_result.scenario_library_digest != library.library_digest:
                          raise ValueError("C1 value does not bind the frozen C2 library")
                      if (
                          value_result.config.scenario_count != config.scenario_count
                          or value_result.config.horizon_decisions != config.horizon_decisions
                      ):
                          raise ValueError("C1 evaluator configuration does not match C3")

                      decision = build_persisted_scenario_decision(value_result)
                      decision_root = destination / "decisions" / decision.decision_digest
                      write_c3_decision_artifact(decision_root, decision)
                      prediction = build_c3_prediction_evidence(value_result)
                      action = _float_vector(
                          query["ppo_mean_action"], field=f"{query_field}.ppo_mean_action"
                      )
                      if action.shape != (value_result.config.action_dimension,):
                          raise ValueError("PPO mean action dimension does not match C1 value")
                      scenario = _string(
                          query["execution_scenario"],
                          field=f"{query_field}.execution_scenario",
                      )
                      scenarios.add(scenario)
                      outcomes = _load_replay_outcomes(
                          query["outcomes"],
                          field=f"{query_field}.outcomes",
                          action_dimension=value_result.config.action_dimension,
                      )
                      replay = ArtifactBackedC3Replay(decision.replay_identity, outcomes)
                      batch_queries.append(
                          C3BatchQuery(
                              fold_id=fold_id,
                              decision_root=decision_root,
                              replay=replay,
                              ppo_mean_action=action,
                              prediction_evidence=prediction,
                              execution_scenario=scenario,
                              perfect_information=_load_perfect_information(
                                  query["perfect_information"],
                                  field=f"{query_field}.perfect_information",
                              ),
                          )
                      )
                  _require_execution_scenarios(
                      scenarios,
                      required_scenario=context.required_scenario,
                  )

              if not batch_queries:
                  raise ValueError("C3 evaluation request contains no queries")
              batch = execute_c3_batch(
                  tuple(batch_queries),
                  output_root=destination,
                  fold_selection_days=fold_selection_days,
                  required_adverse_evidence=required_adverse_evidence,
                  config=config,
              )
              return C3EvaluationResult(
                  source_run_digest=context.source_manifest.digest,
                  request_digest=content_digest(raw),
                  batch=batch,
              )
          '''
          text = text[:start] + execute_code + text[stop:]
          path.write_text(text, encoding="utf-8")
          PY
          uv run python /tmp/adapt_c3.py
      - name: Add Markdown read model
        shell: bash
        run: |
          set -euo pipefail
          cat > trade_rl/evaluation/causal_scenario_c3_markdown.py <<'PY'
          """Deterministic Markdown read model for verified C3 core artifacts."""

          from __future__ import annotations

          import hashlib
          import json
          import os
          from dataclasses import dataclass
          from pathlib import Path
          from typing import Final

          from trade_rl.artifacts.codec import canonical_json_bytes
          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.domain.common import require_sha256
          from trade_rl.evaluation.causal_scenario_c3_artifact import (
              load_c3_aggregate_report_artifact,
              load_phase_a_gate_artifact,
          )

          C3_MARKDOWN_ARTIFACT_SCHEMA: Final = "causal_scenario_c3_markdown_artifact_v1"
          PRODUCTION_STATUS: Final = "NO-GO"
          _FILES: Final = frozenset({"manifest.json", "report.md"})


          def _sha256(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()


          def _atomic_write(path: Path, payload: bytes) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              temporary = path.with_name(f".{path.name}.tmp")
              with temporary.open("wb") as handle:
                  handle.write(payload)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(temporary, path)


          def _verify_root(root: Path) -> tuple[Path, Path]:
              if root.is_symlink() or not root.is_dir():
                  raise FileNotFoundError(f"C3 Markdown artifact directory is missing: {root}")
              entries = tuple(root.iterdir())
              if {entry.name for entry in entries} != _FILES:
                  raise ValueError("C3 Markdown artifact file closure mismatch")
              if any(entry.is_symlink() or not entry.is_file() for entry in entries):
                  raise ValueError("C3 Markdown artifact file closure mismatch")
              return root / "manifest.json", root / "report.md"


          def render_c3_markdown(report: object, gate: object) -> str:
              report_digest = require_sha256(str(getattr(report, "digest")), field="report_digest")
              if getattr(gate, "report_digest", None) != report_digest:
                  raise ValueError("Phase A gate does not bind the C3 report")
              lines = [
                  "# Causal Scenario C3 Evaluation Report",
                  "",
                  f"Production status: **{PRODUCTION_STATUS}**",
                  f"Phase A gate: **{'PASS' if bool(getattr(gate, 'passed')) else 'BLOCKED'}**",
                  f"Report digest: `{report_digest}`",
                  f"Gate digest: `{getattr(gate, 'digest')}`",
                  "",
                  "## Support",
                  "",
                  f"- Folds: {getattr(report, 'fold_count')}",
                  f"- Selection days: {getattr(report, 'total_selection_days')}",
                  f"- Effective days: {getattr(report, 'total_effective_days')}",
                  f"- Positive uplift folds: {getattr(report, 'positive_uplift_folds')}",
                  "",
                  "## Aggregate evidence",
                  "",
                  f"- Scenario-Oracle uplift: {getattr(report, 'mean_uplift'):.12g} "
                  f"[{getattr(report, 'uplift_lower_ci'):.12g}, {getattr(report, 'uplift_upper_ci'):.12g}]",
                  f"- Uplift p-value: {getattr(report, 'uplift_p_value'):.12g}",
                  f"- Predicted/realized Spearman: {getattr(report, 'mean_spearman'):.12g} "
                  f"[{getattr(report, 'spearman_lower_ci'):.12g}, {getattr(report, 'spearman_upper_ci'):.12g}]",
                  f"- Regret margin vs random: {getattr(report, 'mean_regret_margin'):.12g} "
                  f"[{getattr(report, 'regret_margin_lower_ci'):.12g}, {getattr(report, 'regret_margin_upper_ci'):.12g}]",
                  f"- Worst Scenario-Oracle drawdown: {getattr(report, 'worst_scenario_oracle_drawdown'):.12g}",
                  f"- Worst Trend drawdown: {getattr(report, 'worst_trend_drawdown'):.12g}",
                  "",
                  "## Fold evidence",
                  "",
              ]
              for fold in getattr(report, "folds"):
                  reasons = ", ".join(getattr(fold, "failure_reasons")) or "none"
                  lines.append(
                      f"- {getattr(fold, 'fold_id')}: days={getattr(fold, 'selection_days')}, "
                      f"effective={getattr(fold, 'effective_days')}, uplift={getattr(fold, 'mean_uplift'):.12g}, "
                      f"spearman={getattr(fold, 'mean_spearman'):.12g}, "
                      f"regret_margin={getattr(fold, 'mean_regret_margin'):.12g}, failures={reasons}"
                  )
              lines.extend(["", "## Execution evidence", ""])
              for summary in getattr(report, "execution_summaries"):
                  lines.append(
                      f"- {getattr(summary, 'execution_scenario')} / {getattr(summary, 'policy_kind')}: "
                      f"n={getattr(summary, 'observation_count')}, "
                      f"log_return={getattr(summary, 'mean_gross_log_return'):.12g}, "
                      f"cost={getattr(summary, 'mean_total_economic_cost'):.12g}, "
                      f"fill_ratio={getattr(summary, 'mean_fill_ratio'):.12g}, "
                      f"max_dd={getattr(summary, 'maximum_drawdown'):.12g}"
                  )
              lines.extend(
                  [
                      "",
                      "## Diagnostics",
                      "",
                      f"- Neighbor distance p50/p90/p99: {getattr(report, 'neighbor_distance_p50'):.12g} / "
                      f"{getattr(report, 'neighbor_distance_p90'):.12g} / {getattr(report, 'neighbor_distance_p99'):.12g}",
                      f"- Unique/effective anchors: {getattr(report, 'unique_anchor_count')} / "
                      f"{getattr(report, 'effective_anchor_count'):.12g}",
                      f"- Maximum anchor share: {getattr(report, 'anchor_max_share'):.12g}",
                      f"- Historical coverage: {getattr(report, 'historical_coverage_fraction'):.12g}",
                      f"- Calibration buckets: {len(getattr(report, 'calibration_buckets'))}",
                      "",
                      "## Phase A conditions",
                      "",
                  ]
              )
              for condition in getattr(gate, "conditions"):
                  marker = "PASS" if bool(getattr(condition, "passed")) else "FAIL"
                  lines.append(
                      f"- **{marker}** `{getattr(condition, 'name')}` — {getattr(condition, 'detail')}"
                  )
              failures = tuple(getattr(gate, "failed_condition_names"))
              lines.extend(
                  [
                      "",
                      "Failed conditions: " + (", ".join(failures) if failures else "none"),
                      "",
                      "A passing Phase A gate authorizes only the next research phase and does not authorize production.",
                  ]
              )
              return "\n".join(lines) + "\n"


          @dataclass(frozen=True, slots=True)
          class LoadedC3MarkdownArtifact:
              root: Path
              artifact_digest: str
              report_artifact_digest: str
              gate_artifact_digest: str
              report_digest: str
              gate_digest: str
              passed: bool
              failed_condition_names: tuple[str, ...]
              production_status: str = PRODUCTION_STATUS

              def __post_init__(self) -> None:
                  object.__setattr__(self, "root", Path(self.root))
                  for field in (
                      "artifact_digest",
                      "report_artifact_digest",
                      "gate_artifact_digest",
                      "report_digest",
                      "gate_digest",
                  ):
                      object.__setattr__(
                          self,
                          field,
                          require_sha256(str(getattr(self, field)), field=field),
                      )
                  if self.production_status != PRODUCTION_STATUS:
                      raise ValueError("C3 Markdown production status must remain NO-GO")


          def verify_c3_core_artifacts(
              *, report_root: str | Path, gate_root: str | Path
          ) -> LoadedC3MarkdownArtifact:
              report_loaded = load_c3_aggregate_report_artifact(report_root)
              gate_loaded = load_phase_a_gate_artifact(gate_root)
              if gate_loaded.gate.report_digest != report_loaded.report.digest:
                  raise ValueError("Phase A gate does not bind the C3 report")
              return LoadedC3MarkdownArtifact(
                  root=Path("."),
                  artifact_digest=content_digest(
                      {
                          "gate_artifact_digest": gate_loaded.artifact_digest,
                          "report_artifact_digest": report_loaded.artifact_digest,
                          "schema_version": "causal_scenario_c3_core_verification_v1",
                      }
                  ),
                  report_artifact_digest=report_loaded.artifact_digest,
                  gate_artifact_digest=gate_loaded.artifact_digest,
                  report_digest=report_loaded.report.digest,
                  gate_digest=gate_loaded.gate.digest,
                  passed=gate_loaded.gate.passed,
                  failed_condition_names=gate_loaded.gate.failed_condition_names,
              )


          def _manifest_base(
              *, report_loaded: object, gate_loaded: object, markdown: bytes
          ) -> dict[str, object]:
              return {
                  "gate_artifact_digest": getattr(gate_loaded, "artifact_digest"),
                  "gate_digest": getattr(getattr(gate_loaded, "gate"), "digest"),
                  "markdown_sha256": _sha256(markdown),
                  "passed": bool(getattr(getattr(gate_loaded, "gate"), "passed")),
                  "production_status": PRODUCTION_STATUS,
                  "report_artifact_digest": getattr(report_loaded, "artifact_digest"),
                  "report_digest": getattr(getattr(report_loaded, "report"), "digest"),
                  "schema_version": C3_MARKDOWN_ARTIFACT_SCHEMA,
              }


          def write_c3_markdown_artifact(
              root: str | Path, *, report_root: str | Path, gate_root: str | Path
          ) -> LoadedC3MarkdownArtifact:
              report_loaded = load_c3_aggregate_report_artifact(report_root)
              gate_loaded = load_phase_a_gate_artifact(gate_root)
              markdown_text = render_c3_markdown(report_loaded.report, gate_loaded.gate)
              markdown = markdown_text.encode("utf-8")
              base = _manifest_base(
                  report_loaded=report_loaded,
                  gate_loaded=gate_loaded,
                  markdown=markdown,
              )
              artifact_digest = content_digest(base)
              manifest = dict(base)
              manifest["artifact_digest"] = artifact_digest
              encoded_manifest = canonical_json_bytes(manifest)
              destination = Path(root)
              if destination.exists() and any(destination.iterdir()):
                  manifest_path, markdown_path = _verify_root(destination)
                  if manifest_path.read_bytes() != encoded_manifest or markdown_path.read_bytes() != markdown:
                      raise FileExistsError(
                          f"conflicting C3 Markdown artifact already exists: {destination}"
                      )
              else:
                  destination.mkdir(parents=True, exist_ok=True)
                  _atomic_write(destination / "report.md", markdown)
                  _atomic_write(destination / "manifest.json", encoded_manifest)
              return load_c3_markdown_artifact(
                  destination,
                  report_root=report_root,
                  gate_root=gate_root,
              )


          def load_c3_markdown_artifact(
              root: str | Path, *, report_root: str | Path, gate_root: str | Path
          ) -> LoadedC3MarkdownArtifact:
              destination = Path(root)
              manifest_path, markdown_path = _verify_root(destination)
              try:
                  raw = json.loads(manifest_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise ValueError("C3 Markdown manifest is invalid") from error
              if not isinstance(raw, dict) or set(raw) != {
                  "artifact_digest",
                  "gate_artifact_digest",
                  "gate_digest",
                  "markdown_sha256",
                  "passed",
                  "production_status",
                  "report_artifact_digest",
                  "report_digest",
                  "schema_version",
              }:
                  raise ValueError("C3 Markdown manifest field closure mismatch")
              if canonical_json_bytes(raw) != manifest_path.read_bytes():
                  raise ValueError("C3 Markdown manifest is not canonical JSON")
              if raw["schema_version"] != C3_MARKDOWN_ARTIFACT_SCHEMA:
                  raise ValueError("unsupported C3 Markdown artifact schema")
              if raw["production_status"] != PRODUCTION_STATUS:
                  raise ValueError("C3 Markdown artifact must remain NO-GO")
              artifact_digest = require_sha256(str(raw["artifact_digest"]), field="artifact_digest")
              base = dict(raw)
              del base["artifact_digest"]
              if content_digest(base) != artifact_digest:
                  raise ValueError("C3 Markdown artifact digest mismatch")
              markdown = markdown_path.read_bytes()
              if _sha256(markdown) != raw["markdown_sha256"]:
                  raise ValueError("C3 Markdown content digest mismatch")
              report_loaded = load_c3_aggregate_report_artifact(report_root)
              gate_loaded = load_phase_a_gate_artifact(gate_root)
              if (
                  raw["report_artifact_digest"] != report_loaded.artifact_digest
                  or raw["gate_artifact_digest"] != gate_loaded.artifact_digest
                  or raw["report_digest"] != report_loaded.report.digest
                  or raw["gate_digest"] != gate_loaded.gate.digest
              ):
                  raise ValueError("C3 Markdown artifact core identity mismatch")
              expected = render_c3_markdown(report_loaded.report, gate_loaded.gate).encode("utf-8")
              if markdown != expected:
                  raise ValueError("C3 Markdown content does not match verified core evidence")
              return LoadedC3MarkdownArtifact(
                  root=destination,
                  artifact_digest=artifact_digest,
                  report_artifact_digest=report_loaded.artifact_digest,
                  gate_artifact_digest=gate_loaded.artifact_digest,
                  report_digest=report_loaded.report.digest,
                  gate_digest=gate_loaded.gate.digest,
                  passed=gate_loaded.gate.passed,
                  failed_condition_names=gate_loaded.gate.failed_condition_names,
              )


          __all__ = [
              "C3_MARKDOWN_ARTIFACT_SCHEMA",
              "LoadedC3MarkdownArtifact",
              "load_c3_markdown_artifact",
              "render_c3_markdown",
              "verify_c3_core_artifacts",
              "write_c3_markdown_artifact",
          ]
          PY
      - name: Add lightweight CLI
        shell: bash
        run: |
          set -euo pipefail
          cat > trade_rl/cli/causal_scenario.py <<'PY'
          """Lightweight CLI for C3 execution and verified read-model evidence."""

          from __future__ import annotations

          import argparse
          import json
          from collections.abc import Sequence
          from pathlib import Path
          from typing import TextIO


          def _write_json(stream: TextIO, payload: object) -> None:
              stream.write(json.dumps(payload, ensure_ascii=False, sort_keys=True))
              stream.write("\n")


          def _parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(prog="trade-rl causal-scenario")
              subparsers = parser.add_subparsers(dest="command", required=True)
              evaluate = subparsers.add_parser("evaluate")
              evaluate.add_argument("--request", type=Path, required=True)
              evaluate.add_argument("--output", type=Path, required=True)
              publish = subparsers.add_parser("publish")
              publish.add_argument("--report", type=Path, required=True)
              publish.add_argument("--gate", type=Path, required=True)
              publish.add_argument("--output", type=Path, required=True)
              verify = subparsers.add_parser("verify")
              verify.add_argument("--report", type=Path, required=True)
              verify.add_argument("--gate", type=Path, required=True)
              return parser


          def _execute(request: Path, *, output_root: Path):
              from trade_rl.workflows.causal_scenario.c3_evaluation import (
                  execute_c3_evaluation_request,
              )
              return execute_c3_evaluation_request(request, output_root=output_root)


          def _publish_markdown(*, report_root: Path, gate_root: Path, output_root: Path):
              from trade_rl.evaluation.causal_scenario_c3_markdown import (
                  write_c3_markdown_artifact,
              )
              return write_c3_markdown_artifact(
                  output_root,
                  report_root=report_root,
                  gate_root=gate_root,
              )


          def _verify(*, report_root: Path, gate_root: Path):
              from trade_rl.evaluation.causal_scenario_c3_markdown import (
                  verify_c3_core_artifacts,
              )
              return verify_c3_core_artifacts(report_root=report_root, gate_root=gate_root)


          def _failure(stderr: TextIO, error: Exception) -> int:
              _write_json(
                  stderr,
                  {
                      "error": str(error),
                      "error_type": type(error).__name__,
                      "production_status": "NO-GO",
                      "schema": "causal_scenario_c3_error_v1",
                      "status": "failed",
                  },
              )
              return 1


          def main(
              argv: Sequence[str], *, stdout: TextIO, stderr: TextIO
          ) -> int:
              args = _parser().parse_args(list(argv))
              try:
                  if args.command == "evaluate":
                      execution = _execute(args.request, output_root=args.output)
                      batch = execution.batch
                      markdown = _publish_markdown(
                          report_root=batch.report_artifact_root,
                          gate_root=batch.gate_artifact_root,
                          output_root=args.output / "markdown",
                      )
                      gate = batch.gate
                      _write_json(
                          stdout,
                          {
                              "comparison_count": batch.comparison_count,
                              "failed_conditions": list(gate.failed_condition_names),
                              "gate_artifact_digest": batch.gate_artifact_digest,
                              "gate_artifact_path": str(batch.gate_artifact_root),
                              "gate_digest": gate.digest,
                              "markdown_artifact_digest": markdown.artifact_digest,
                              "markdown_artifact_path": str(markdown.root),
                              "passed": gate.passed,
                              "production_status": execution.production_status,
                              "report_artifact_digest": batch.report_artifact_digest,
                              "report_artifact_path": str(batch.report_artifact_root),
                              "report_digest": batch.report.digest,
                              "request_digest": execution.request_digest,
                              "schema": execution.schema_version,
                              "source_run_digest": execution.source_run_digest,
                              "status": "phase_a_authorized" if gate.passed else "phase_a_blocked",
                          },
                      )
                      return 0
                  if args.command == "publish":
                      artifact = _publish_markdown(
                          report_root=args.report,
                          gate_root=args.gate,
                          output_root=args.output,
                      )
                      _write_json(
                          stdout,
                          {
                              "artifact_digest": artifact.artifact_digest,
                              "artifact_path": str(artifact.root),
                              "gate_artifact_digest": artifact.gate_artifact_digest,
                              "gate_digest": artifact.gate_digest,
                              "passed": artifact.passed,
                              "production_status": artifact.production_status,
                              "report_artifact_digest": artifact.report_artifact_digest,
                              "report_digest": artifact.report_digest,
                              "schema": "causal_scenario_c3_markdown_result_v1",
                              "status": "phase_a_authorized" if artifact.passed else "phase_a_blocked",
                          },
                      )
                      return 0
                  verified = _verify(report_root=args.report, gate_root=args.gate)
                  _write_json(
                      stdout,
                      {
                          "failed_conditions": list(verified.failed_condition_names),
                          "gate_artifact_digest": verified.gate_artifact_digest,
                          "gate_digest": verified.gate_digest,
                          "passed": verified.passed,
                          "production_status": verified.production_status,
                          "report_artifact_digest": verified.report_artifact_digest,
                          "report_digest": verified.report_digest,
                          "schema": "causal_scenario_c3_verification_result_v1",
                          "status": "phase_a_authorized" if verified.passed else "phase_a_blocked",
                      },
                  )
                  return 0
              except Exception as error:
                  return _failure(stderr, error)


          __all__ = ["main"]
          PY
          uv run python - <<'PY'
          from pathlib import Path
          path = Path("trade_rl/cli/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    ("confirmation", "create"),\n',
              '    ("causal-scenario", "evaluate"),\n'
              '    ("causal-scenario", "publish"),\n'
              '    ("causal-scenario", "verify"),\n'
              '    ("confirmation", "create"),\n',
              1,
          )
          old = '''    if tuple(arguments[:2]) in _ARTIFACT_COMMANDS:
              from trade_rl.cli.extended import main as artifact_main

              return artifact_main(arguments, stdout=stdout, stderr=stderr)
          '''
          new = '''    if tuple(arguments[:2]) in _ARTIFACT_COMMANDS:
              if arguments[:1] == ["causal-scenario"]:
                  from trade_rl.cli.causal_scenario import main as causal_scenario_main

                  return causal_scenario_main(
                      arguments[1:],
                      stdout=sys.stdout if stdout is None else stdout,
                      stderr=sys.stderr if stderr is None else stderr,
                  )
              from trade_rl.cli.extended import main as artifact_main

              return artifact_main(arguments, stdout=stdout, stderr=stderr)
          '''
          if old not in text:
              raise SystemExit("CLI dispatcher insertion point not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Add manual GPU workflow and runbook
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/causal-scenario-c3-gpu.yml <<'YAML'
          name: Causal Scenario C3 GPU Evidence

          on:
            workflow_dispatch:
              inputs:
                request_path:
                  description: Repository-relative canonical C3 request JSON
                  required: true
                  type: string
                output_path:
                  description: Repository-relative evidence output directory
                  required: false
                  default: var/causal-scenario-c3
                  type: string

          permissions:
            contents: read

          concurrency:
            group: causal-scenario-c3-gpu-evidence
            cancel-in-progress: false

          jobs:
            evaluate-c3:
              if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
              environment: gpu-full-training
              runs-on: [self-hosted, linux, x64, gpu, nvidia]
              timeout-minutes: 240
              steps:
                - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
                  with:
                    ref: ${{ github.sha }}
                    persist-credentials: false
                - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
                  with:
                    python-version: "3.12"
                    enable-cache: true
                - name: Verify exact source and CUDA device
                  shell: bash
                  run: |
                    set -euo pipefail
                    test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
                    nvidia-smi
                - name: Install frozen environment
                  run: uv sync --extra dev --extra train-sb3
                - name: Execute C3 evaluation
                  env:
                    REQUEST_PATH: ${{ inputs.request_path }}
                    OUTPUT_PATH: ${{ inputs.output_path }}
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f "$REQUEST_PATH"
                    uv run trade-rl causal-scenario evaluate --request "$REQUEST_PATH" --output "$OUTPUT_PATH"
                - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  if: always()
                  with:
                    name: c3-execution-evidence
                    path: ${{ inputs.output_path }}
                    if-no-files-found: error
          YAML
          mkdir -p docs/operations
          cat > docs/operations/causal-scenario-c3-execution.md <<'MD'
          # Causal Scenario C3 Execution

          C3 is an evaluation-only workflow. Every result remains `NO-GO` for production, and a passing Phase A gate does not authorize production, promotion, Serving, release, or direct exchange execution.

          ## Authoritative inputs

          The request uses schema `causal_scenario_c3_evaluation_request_v2` and references a published walk-forward run. The source run must contain verified `walk-forward.json`, `walk-forward-config.json`, and `execution-sensitivity.json` artifacts. Fold support and the required adverse scenario are derived from those source artifacts rather than accepted from the request.

          ## Evaluate

          ```bash
          uv run trade-rl causal-scenario evaluate \
            --request var/c3/request.json \
            --output var/c3/evidence
          ```

          The command persists decisions before realized replay and writes the authoritative core artifacts:

          - `report/report.json`
          - `gate/gate.json`
          - `markdown/manifest.json`
          - `markdown/report.md`

          ## Publish the Markdown read model

          ```bash
          uv run trade-rl causal-scenario publish \
            --report var/c3/evidence/report \
            --gate var/c3/evidence/gate \
            --output var/c3/evidence/markdown
          ```

          The Markdown is derivative. Its manifest binds the verified report and gate artifact digests and cannot replace the canonical JSON evidence.

          ## Verify core evidence

          ```bash
          uv run trade-rl causal-scenario verify \
            --report var/c3/evidence/report \
            --gate var/c3/evidence/gate
          ```

          Verification reloads and recomputes `report.json` and `gate.json`, checks their binding, and returns one-line machine-readable JSON.

          ## GPU evidence

          Dispatch `Causal Scenario C3 GPU Evidence` manually from `main` after the self-hosted NVIDIA runner is online. It runs the same CLI command, records `nvidia-smi`, and uploads `c3-execution-evidence`. There is no schedule or automatic production path.
          MD
