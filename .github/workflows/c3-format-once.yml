name: C3 Format Once

on:
  push:
    branches:
      - agent/causal-scenario-c3

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          uvx ruff format trade_rl/evaluation/causal_scenario_c3_report.py
          rm .github/workflows/c3-format-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/causal_scenario_c3_report.py .github/workflows/c3-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format C3 report"
          git push origin HEAD:agent/causal-scenario-c3
