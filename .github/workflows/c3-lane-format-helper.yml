name: C3 Lane Format Helper

on:
  push:
    branches:
      - agent/causal-scenario-c3-execution-reporting

permissions:
  contents: write

concurrency:
  group: c3-lane-format-helper
  cancel-in-progress: true

jobs:
  format:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Format lane files
        run: |
          uv run ruff format \
            tests/conftest.py \
            tests/workflows/test_causal_scenario_c3_execution_entrypoint.py \
            trade_rl/cli/causal_scenario.py \
            trade_rl/evaluation/causal_scenario_c3_reporting.py \
            trade_rl/workflows/causal_scenario/c3_execution.py
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tests/conftest.py \
            tests/workflows/test_causal_scenario_c3_execution_entrypoint.py \
            trade_rl/cli/causal_scenario.py \
            trade_rl/evaluation/causal_scenario_c3_reporting.py \
            trade_rl/workflows/causal_scenario/c3_execution.py
          git commit -m "style: format C3 execution reporting lane"
          git push origin HEAD:agent/causal-scenario-c3-execution-reporting
