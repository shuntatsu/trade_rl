name: C3 symlink diagnostic

on:
  push:
    branches:
      - agent/causal-scenario-c3-execution-reporting
    paths:
      - .github/workflows/c3-symlink-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3-execution-reporting
      - name: Find symlink-related test mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          {
            echo '# git grep is_symlink'
            git grep -n 'is_symlink' -- tests || true
            echo
            echo '# git grep symlink_to'
            git grep -n 'symlink_to' -- tests || true
            echo
            echo '# git grep os.path.islink'
            git grep -n 'os.path.islink' -- tests || true
            echo
            echo '# git grep monkeypatch symlink'
            git grep -n -E 'monkeypatch.*symlink|symlink.*monkeypatch|setattr.*is_symlink|is_symlink.*setattr' -- tests || true
          } > docs/verification/c3-symlink-test-search.txt
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/verification/c3-symlink-test-search.txt
          git commit -m "test: locate C3 symlink state mutation"
          git push origin HEAD:agent/causal-scenario-c3-execution-reporting
