name: C3 Test Reason Fix Once

on:
  push:
    branches:
      - agent/causal-scenario-c3

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - name: Correct comparable reason fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/workflows/test_causal_scenario_c3_walk_forward.py")
          source = path.read_text(encoding="utf-8")
          old = '        "reason": "compatible",\n'
          new = '        "reason": "dominance_conditions_verified",\n'
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy fixture, found {source.count(old)}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          rm -f .github/workflows/c3-test-reason-fix-once.yml
          rm -f .github/c3-test-reason-fix-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/workflows/test_causal_scenario_c3_walk_forward.py .github/workflows/c3-test-reason-fix-once.yml .github/c3-test-reason-fix-trigger.txt
          git commit -m "test: use canonical Perfect Information reason"
          git push origin HEAD:agent/causal-scenario-c3
