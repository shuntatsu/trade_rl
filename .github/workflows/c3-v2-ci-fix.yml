name: One-shot C3 V2 CI fix

on:
  push:
    branches:
      - agent/causal-scenario-c3-execution-reporting-v2
    paths:
      - .github/workflows/c3-v2-ci-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3-execution-reporting-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/cli/test_causal_scenario_c3_execution_cli.py")
          text = test_path.read_text(encoding="utf-8")
          old = '        gate_digest="2" * 64,\n        passed=True,\n'
          new = (
              '        gate_digest="2" * 64,\n'
              '        failed_condition_names=(),\n'
              '        passed=True,\n'
          )
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected two CLI fixture targets, found {count}")
          test_path.write_text(text.replace(old, new), encoding="utf-8")

          source_path = Path("trade_rl/workflows/causal_scenario/c3_evaluation.py")
          source = source_path.read_text(encoding="utf-8")
          marker = '''def _relative_path(root: Path, value: object, *, field: str) -> Path:\n'''
          helper = '''def _validate_request_fold_fields(value: object) -> None:\n    folds = _list(value, field="folds")\n    if not folds:\n        raise ValueError("folds must not be empty")\n    for fold_position, raw_fold in enumerate(folds):\n        field = f"folds[{fold_position}]"\n        fold = _object(raw_fold, field=field)\n        _fields(\n            fold,\n            {"fold_digest", "fold_id", "fold_index", "library", "queries"},\n            field=field,\n        )\n\n\n'''
          if helper not in source:
              if source.count(marker) != 1:
                  raise SystemExit("relative-path marker mismatch")
              source = source.replace(marker, helper + marker, 1)

          call_marker = '''    if raw["schema_version"] != C3_EVALUATION_REQUEST_SCHEMA:\n        raise ValueError("unsupported C3 evaluation request schema")\n    request_root = request_file.parent\n'''
          call_replacement = '''    if raw["schema_version"] != C3_EVALUATION_REQUEST_SCHEMA:\n        raise ValueError("unsupported C3 evaluation request schema")\n    _validate_request_fold_fields(raw["folds"])\n    request_root = request_file.parent\n'''
          if call_replacement not in source:
              if source.count(call_marker) != 1:
                  raise SystemExit("request validation marker mismatch")
              source = source.replace(call_marker, call_replacement, 1)
          source_path.write_text(source, encoding="utf-8")
          PY
      - name: Format and lint focused files
        run: |
          uv run ruff check --fix \
            tests/cli/test_causal_scenario_c3_execution_cli.py \
            trade_rl/workflows/causal_scenario/c3_evaluation.py
          uv run ruff format \
            tests/cli/test_causal_scenario_c3_execution_cli.py \
            trade_rl/workflows/causal_scenario/c3_evaluation.py
      - name: Run regression tests
        run: |
          uv run pytest -q \
            tests/cli/test_causal_scenario_c3_execution_cli.py \
            tests/workflows/test_causal_scenario_c3_execution_lane.py
      - name: Run focused type check
        run: uv run mypy trade_rl/cli/causal_scenario.py trade_rl/workflows/causal_scenario/c3_evaluation.py
      - name: Commit verified fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c3-v2-ci-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: fix integrated C3 exact-head regressions"
          git push origin HEAD:agent/causal-scenario-c3-execution-reporting-v2
