name: One-shot C3 test contract correction

on:
  push:
    branches:
      - agent/causal-scenario-c3-execution-reporting-v2
    paths:
      - .github/workflows/c3-v2-test-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3-execution-reporting-v2
          persist-credentials: true
      - name: Apply reviewed test and identity corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/workflows/test_causal_scenario_c3_execution_lane.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from trade_rl.evaluation.causal_scenario_c3_contracts import C3ReplayIdentity\n',
              'from trade_rl.evaluation.causal_scenario_c3_contracts import (\n    C3ReplayIdentity,\n    CausalScenarioC3Config,\n)\n',
              1,
          )
          text = text.replace(
              '    object.__setattr__(query, "prediction_evidence", SimpleNamespace())\n',
              '    object.__setattr__(\n        query,\n        "prediction_evidence",\n        SimpleNamespace(validate_for_decision=lambda decision: None),\n    )\n',
              1,
          )
          text = text.replace(
              '    config = SimpleNamespace(bootstrap_resamples=128, bootstrap_block_days=7)\n    monkeypatch.setattr(batch_module, "CausalScenarioC3Config", lambda: config)\n\n',
              '    config = CausalScenarioC3Config(\n        required_folds=1,\n        required_selection_days=30,\n        bootstrap_resamples=128,\n        bootstrap_block_days=7,\n    )\n    monkeypatch.setattr(\n        batch_module,\n        "C3BatchResult",\n        lambda **kwargs: SimpleNamespace(production_status="NO-GO", **kwargs),\n    )\n\n',
              1,
          )
          text = text.replace(
              '            config=SimpleNamespace(),\n',
              '            config=CausalScenarioC3Config(\n                required_folds=1, required_selection_days=30\n            ),\n',
              1,
          )
          text = text.replace(
              '    monkeypatch.setattr(\n        module,\n        "execute_c3_batch",\n        lambda queries, **kwargs: captured.update(kwargs) or batch,\n    )\n\n',
              '    monkeypatch.setattr(\n        module,\n        "execute_c3_batch",\n        lambda queries, **kwargs: captured.update(kwargs) or batch,\n    )\n    monkeypatch.setattr(\n        module,\n        "C3EvaluationResult",\n        lambda **kwargs: SimpleNamespace(production_status="NO-GO", **kwargs),\n    )\n\n',
              1,
          )
          text = text.replace(
              '    monkeypatch.setattr(\n        module,\n        "_load_request_context",\n        lambda *args, **kwargs: SimpleNamespace(required_scenario="joint_2x"),\n    )\n\n',
              '',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('trade_rl/workflows/causal_scenario/c3_evaluation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        fold_digest = _string(fold["fold_digest"], field=f"{field}.fold_digest")\n',
              '        fold_digest = require_sha256(\n            _string(fold["fold_digest"], field=f"{field}.fold_digest"),\n            field=f"{field}.fold_digest",\n        )\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/c3-v2-test-contract-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: align C3 mocks with strict contracts"
          git push origin HEAD:agent/causal-scenario-c3-execution-reporting-v2
