name: Causal alpha task8 temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: read

jobs:
  task8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run pytest tests/workflows/test_universal_u6_example_configs.py tests/rl/test_algorithm_configs.py -q
