name: Causal alpha teacher focused temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: uv sync --extra dev
      - name: Ruff focused
        run: uv run ruff check tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py
      - name: Focused tests
        run: uv run pytest tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py -q
