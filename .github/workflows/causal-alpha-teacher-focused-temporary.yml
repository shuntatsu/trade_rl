name: Causal alpha teacher focused temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Ruff focused
        run: >-
          uv run ruff check
          trade_rl/learning/causal_alpha_teacher.py
          trade_rl/workflows/universal_causal_alpha_teacher.py
          trade_rl/workflows/universal_teacher_runtime.py
          trade_rl/workflows/universal_training_runner.py
          trade_rl/workflows/universal_stage_a_training.py
          trade_rl/workflows/universal_full_research_training.py
          tests/learning/test_causal_alpha_teacher.py
          tests/rl/test_causal_alpha_teacher_config.py
          tests/workflows/test_universal_causal_alpha_teacher.py
          tests/workflows/test_universal_causal_alpha_fitting.py
          tests/workflows/test_universal_causal_alpha_samples.py
          tests/workflows/test_universal_causal_alpha_selection.py
          tests/workflows/test_universal_causal_alpha_package.py
          tests/workflows/test_universal_causal_alpha_assembly.py
          tests/workflows/test_universal_causal_alpha_shared_training.py
      - name: Mypy focused
        run: >-
          uv run mypy
          trade_rl/learning/causal_alpha_teacher.py
          trade_rl/workflows/universal_causal_alpha_teacher.py
          trade_rl/workflows/universal_teacher_runtime.py
          trade_rl/workflows/universal_training_runner.py
          trade_rl/workflows/universal_stage_a_training.py
          trade_rl/workflows/universal_full_research_training.py
      - name: Focused tests
        run: >-
          uv run pytest
          tests/learning/test_causal_alpha_teacher.py
          tests/rl/test_causal_alpha_teacher_config.py
          tests/workflows/test_universal_causal_alpha_teacher.py
          tests/workflows/test_universal_causal_alpha_fitting.py
          tests/workflows/test_universal_causal_alpha_samples.py
          tests/workflows/test_universal_causal_alpha_selection.py
          tests/workflows/test_universal_causal_alpha_package.py
          tests/workflows/test_universal_causal_alpha_assembly.py
          tests/workflows/test_universal_causal_alpha_shared_training.py
          -q
