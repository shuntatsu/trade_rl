name: Causal Alpha V3 Launcher Dev Tests

on:
  pull_request:
    paths:
      - ".github/workflows/causal-alpha-v3-launcher-dev-tests.yml"
      - ".github/workflows/causal-alpha-v3-research.yml"
      - "docker/compose.causal-alpha-v3-research.yaml"
      - "docs/UNIVERSAL_TRAINING.md"
      - "scripts/control_causal_alpha_v3_research_generation.py"
      - "tests/architecture/test_causal_alpha_v3_research_workflow.py"
      - "tests/examples/test_causal_alpha_v3_research_compose.py"
      - "tests/test_causal_alpha_v3_manual_launcher_documentation.py"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Run focused launcher contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=(tests/examples/test_causal_alpha_v3_research_compose.py)
          if test -f tests/architecture/test_causal_alpha_v3_research_workflow.py; then
            tests+=(tests/architecture/test_causal_alpha_v3_research_workflow.py)
          fi
          if test -f tests/test_causal_alpha_v3_manual_launcher_documentation.py; then
            tests+=(tests/test_causal_alpha_v3_manual_launcher_documentation.py)
          fi
          uvx --with pyyaml pytest -q "${tests[@]}"
