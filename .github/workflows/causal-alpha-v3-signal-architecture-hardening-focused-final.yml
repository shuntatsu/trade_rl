name: Causal Alpha V3 Signal Architecture Hardening Focused Final

on:
  push:
    branches:
      - agent/causal-alpha-v3-signal-architecture-hardening-focused-final

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardened tree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 413550539d9fddfd0290c208dde911ecaec78546
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync --extra dev
      - name: Focused static checks
        run: |
          uv run ruff check \
            trade_rl/workflows/universal_causal_alpha_v3_teacher.py \
            trade_rl/workflows/universal_causal_alpha_v3_pipeline.py \
            trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_architecture_hardening.py
          uv run ruff format --check \
            trade_rl/workflows/universal_causal_alpha_v3_teacher.py \
            trade_rl/workflows/universal_causal_alpha_v3_pipeline.py \
            trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_architecture_hardening.py
          uv run mypy trade_rl/workflows/universal_causal_alpha_v3_teacher.py trade_rl/workflows/universal_causal_alpha_v3_pipeline.py trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic.py
      - name: Focused Signal hardening tests
        run: |
          uv run pytest -q \
            tests/workflows/test_universal_causal_alpha_v3_signal_architecture_hardening.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_metric_oracle.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_store.py \
            tests/workflows/test_universal_causal_alpha_v3_signal_resume.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_orchestration.py
