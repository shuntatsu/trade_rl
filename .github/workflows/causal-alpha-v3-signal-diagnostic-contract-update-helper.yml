name: Causal Alpha V3 Signal Diagnostic Contract Update Helper

on:
  push:
    branches:
      - agent/causal-alpha-v3-signal-diagnostic-contract-update-helper

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-alpha-v3-signal-diagnostic-sidecar
          persist-credentials: true
          fetch-depth: 0
      - name: Refine quality contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/implementation-plans/specs/2026-08-17-causal-alpha-v3-signal-diagnostic-sidecar-design.md")
          text = path.read_text(encoding="utf-8")

          old = "The metric generated by the paired path must be byte/digest-equivalent to the metric generated by the existing path for the same inputs."
          new = "The metric generated by the paired path must be byte/digest-equivalent to the metric generated by the existing path for the same inputs **when evaluated under the same numerical execution environment** (dependency set, numerical backend, and thread configuration)."
          if old not in text:
              raise SystemExit("computation-boundary oracle anchor not found")
          text = text.replace(old, new, 1)

          marker = "## Acceptance criteria\n"
          discovery = '''## Implementation discovery: numerical-backend reproducibility boundary\n\nDuring implementation, the unchanged pre-sidecar commit was executed more than once with the same controlled synthetic inputs on separate GitHub-hosted runners. The canonical Gate observations (`sample_count`, cohort indices, rank correlation, direction accuracy, and top/bottom spread) were identical, but low-bit ridge outputs caused the existing `fit_digest`, `forecast_digest`, and therefore metric artifact digest to differ across runners. This behavior predates the sidecar change.\n\nThe quality contract is therefore refined as follows rather than silently weakening the implementation criteria:\n\n- **No-op refactor equivalence** is tested by running the pre-sidecar tree and candidate tree side-by-side on the **same runner**, using the same dependency environment and fixed numerical thread settings, and requiring the full canonical metric payload/digest to match exactly.\n- The unit regression fixes stable Gate observations and stable scope/config identities; it does not treat a cross-host floating-point digest as a portable oracle.\n- Cross-host bitwise reproducibility of the existing ridge solver is **not** introduced as a new guarantee by this diagnostic change.\n- If partial-resume recomputation occurs on a numerical backend that produces a different persisted-member digest, the pipeline must fail closed rather than overwrite or reinterpret the existing evidence.\n- Deterministic sidecar bytes are required for the same computed fit/forecast and numerical execution environment; raw cross-host BLAS reproducibility remains a separate residual risk.\n\n'''
          if marker not in text:
              raise SystemExit("acceptance criteria marker not found")
          text = text.replace(marker, discovery + marker, 1)

          old = "1. Fresh Signal scope computation produces the same canonical V2 metric/digest as the existing implementation and one deterministic diagnostic sidecar."
          new = "1. Fresh Signal scope computation produces the same canonical V2 metric/digest as the existing implementation when compared under the same numerical execution environment, and one deterministic diagnostic sidecar."
          if old not in text:
              raise SystemExit("acceptance criterion anchor not found")
          text = text.replace(old, new, 1)

          old = "- exact equality of old-vs-new canonical Signal metric payload/digest for controlled inputs;"
          new = "- exact equality of old-vs-new canonical Signal metric payload/digest for controlled inputs executed side-by-side under the same numerical execution environment;"
          if old not in text:
              raise SystemExit("test oracle anchor not found")
          text = text.replace(old, new, 1)

          old = "- byte-stable deterministic sidecar output for identical inputs;"
          new = "- byte-stable deterministic sidecar output for identical computed fit/forecast evidence under the same numerical execution environment;"
          if old not in text:
              raise SystemExit("sidecar determinism oracle anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit contract refinement only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-plans/specs/2026-08-17-causal-alpha-v3-signal-diagnostic-sidecar-design.md
          git diff --cached --check
          git commit -m "docs: refine V3 signal diagnostic numerical oracle"
          git push origin HEAD:agent/causal-alpha-v3-signal-diagnostic-sidecar
