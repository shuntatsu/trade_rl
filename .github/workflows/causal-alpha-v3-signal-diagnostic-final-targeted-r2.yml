name: Causal Alpha V3 Signal Diagnostic Final Targeted R2

on:
  push:
    branches:
      - agent/causal-alpha-v3-signal-diagnostic-final-targeted-r2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Ruff changed surfaces
        run: >-
          uv run ruff check
          trade_rl/workflows/universal_causal_alpha_v3.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic_builder.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic_codec.py
          trade_rl/workflows/universal_causal_alpha_v3_teacher.py
          trade_rl/workflows/universal_causal_alpha_v3_artifact_store.py
          trade_rl/workflows/universal_causal_alpha_v3_pipeline.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_metric_oracle.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_store.py
          tests/workflows/test_universal_causal_alpha_v3_signal_resume.py
      - name: Format check changed surfaces
        run: >-
          uv run ruff format --check
          trade_rl/workflows/universal_causal_alpha_v3.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic_builder.py
          trade_rl/workflows/universal_causal_alpha_v3_signal_diagnostic_codec.py
          trade_rl/workflows/universal_causal_alpha_v3_teacher.py
          trade_rl/workflows/universal_causal_alpha_v3_artifact_store.py
          trade_rl/workflows/universal_causal_alpha_v3_pipeline.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_metric_oracle.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_store.py
          tests/workflows/test_universal_causal_alpha_v3_signal_resume.py
      - name: Targeted regressions
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_metric_oracle.py
          tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic_store.py
          tests/workflows/test_universal_causal_alpha_v3_signal_resume.py
          tests/workflows/test_universal_causal_alpha_v3_runner_signal.py
          tests/workflows/test_universal_causal_alpha_v3.py
