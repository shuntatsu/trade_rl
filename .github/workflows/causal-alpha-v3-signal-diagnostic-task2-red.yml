name: Causal Alpha V3 Signal Diagnostic Task2 RED

on:
  push:
    branches:
      - agent/causal-alpha-v3-signal-diagnostic-task2-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Run focused RED
        run: uv run pytest -q tests/workflows/test_universal_causal_alpha_v3_signal_diagnostic.py
