name: Apply anchored residual implementation

on:
  push:
    branches:
      - codex/causal-alpha-v3-research

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Apply deterministic source edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          path = "trade_rl/rl/actions.py"
          replace_once(
              path,
              '    RESIDUAL = "residual"\n    TARGET_WEIGHT = "target_weight"\n',
              '    RESIDUAL = "residual"\n    TARGET_WEIGHT = "target_weight"\n    ANCHORED_TARGET_RESIDUAL = "anchored_target_residual"\n',
          )
          marker = '''\n\n@dataclass(frozen=True, slots=True)\nclass ActionSpec:\n'''
          anchored = '''\n\n@dataclass(frozen=True, slots=True)\nclass AnchoredTargetResidualAction:\n    """Bounded policy delta around a target-weight alpha anchor."""\n\n    residuals: np.ndarray\n    saturated_count: int = 0\n    raw_max_abs: float = 0.0\n\n    def __post_init__(self) -> None:\n        residuals = np.asarray(self.residuals, dtype=np.float64).reshape(-1).copy()\n        if residuals.size == 0:\n            raise ValueError("anchored residuals must not be empty")\n        if not np.isfinite(residuals).all():\n            raise ValueError("anchored residuals must be finite")\n        if np.any(np.abs(residuals) > 1.0):\n            raise ValueError("anchored residuals must be within [-1, 1]")\n        if self.saturated_count < 0:\n            raise ValueError("saturated_count must be non-negative")\n        if not np.isfinite(self.raw_max_abs) or self.raw_max_abs < 0.0:\n            raise ValueError("raw_max_abs must be finite and non-negative")\n        residuals.setflags(write=False)\n        object.__setattr__(self, "residuals", residuals)\n\n    def as_array(self) -> np.ndarray:\n        return self.residuals.astype(np.float32, copy=True)\n''' + marker
          replace_once(path, marker, anchored)
          replace_once(
              path,
              '''        if action_mode is ActionMode.TARGET_WEIGHT:\n            if self.alpha_enabled or self.risk_tilt_enabled or self.n_factors:\n                raise ValueError("target_weight mode does not accept residual controls")\n            if self.target_weight_count <= 0:\n                raise ValueError(\n                    "target_weight mode requires positive target_weight_count"\n                )\n        elif self.target_weight_count:\n            raise ValueError("residual mode does not accept target_weight_count")\n        if not np.isfinite(self.residual_scale) or not 0.0 < self.residual_scale <= 1.0:\n            raise ValueError("residual_scale must be within (0, 1]")\n        if action_mode is ActionMode.TARGET_WEIGHT and self.residual_scale != 1.0:\n            raise ValueError("target_weight mode does not accept residual_scale")\n''',
              '''        if action_mode is ActionMode.TARGET_WEIGHT:\n            if self.alpha_enabled or self.risk_tilt_enabled or self.n_factors:\n                raise ValueError("target_weight mode does not accept residual controls")\n            if self.target_weight_count <= 0:\n                raise ValueError(\n                    "target_weight mode requires positive target_weight_count"\n                )\n        elif action_mode is ActionMode.ANCHORED_TARGET_RESIDUAL:\n            if not self.alpha_enabled:\n                raise ValueError("anchored target residual mode requires alpha_enabled")\n            if self.risk_tilt_enabled:\n                raise ValueError("anchored target residual mode does not accept risk_tilt")\n            if self.n_factors:\n                raise ValueError("anchored target residual mode does not accept n_factors")\n            if self.target_weight_count <= 0:\n                raise ValueError(\n                    "anchored target residual mode requires positive target_weight_count"\n                )\n        elif self.target_weight_count:\n            raise ValueError("residual mode does not accept target_weight_count")\n        if not np.isfinite(self.residual_scale) or not 0.0 < self.residual_scale <= 1.0:\n            raise ValueError("residual_scale must be within (0, 1]")\n        if action_mode is ActionMode.TARGET_WEIGHT and self.residual_scale != 1.0:\n            raise ValueError("target_weight mode does not accept residual_scale")\n''',
          )
          replace_once(
              path,
              '''    @property\n    def names(self) -> tuple[str, ...]:\n        if self.mode is ActionMode.TARGET_WEIGHT:\n            return tuple(\n                f"target_weight:{index}" for index in range(self.target_weight_count)\n            )\n        names = ["fast_tilt", "slow_tilt"]\n''',
              '''    @property\n    def names(self) -> tuple[str, ...]:\n        if self.mode is ActionMode.TARGET_WEIGHT:\n            return tuple(\n                f"target_weight:{index}" for index in range(self.target_weight_count)\n            )\n        if self.mode is ActionMode.ANCHORED_TARGET_RESIDUAL:\n            return tuple(\n                f"anchored_residual:{index}"\n                for index in range(self.target_weight_count)\n            )\n        names = ["fast_tilt", "slow_tilt"]\n''',
          )
          replace_once(
              path,
              '''    def names_for_symbols(self, symbols: tuple[str, ...]) -> tuple[str, ...]:\n        if self.mode is ActionMode.TARGET_WEIGHT:\n            if len(symbols) != self.target_weight_count:\n                raise ValueError("target weight count does not match dataset symbols")\n            return tuple(f"target_weight:{symbol}" for symbol in symbols)\n        return self.names\n''',
              '''    def names_for_symbols(self, symbols: tuple[str, ...]) -> tuple[str, ...]:\n        if self.mode in {\n            ActionMode.TARGET_WEIGHT,\n            ActionMode.ANCHORED_TARGET_RESIDUAL,\n        }:\n            if len(symbols) != self.target_weight_count:\n                raise ValueError("target weight count does not match dataset symbols")\n            prefix = (\n                "target_weight"\n                if self.mode is ActionMode.TARGET_WEIGHT\n                else "anchored_residual"\n            )\n            return tuple(f"{prefix}:{symbol}" for symbol in symbols)\n        return self.names\n''',
          )
          replace_once(
              path,
              '''    ) -> ResidualActionV2 | TargetWeightAction:\n''',
              '''    ) -> ResidualActionV2 | TargetWeightAction | AnchoredTargetResidualAction:\n''',
          )
          replace_once(
              path,
              '''        if self.mode is ActionMode.TARGET_WEIGHT:\n            return TargetWeightAction(\n                weights=clipped,\n                saturated_count=int(np.count_nonzero(outside)),\n                raw_max_abs=float(np.max(np.abs(vector), initial=0.0)),\n            )\n        clipped *= self.residual_scale\n''',
              '''        if self.mode is ActionMode.TARGET_WEIGHT:\n            return TargetWeightAction(\n                weights=clipped,\n                saturated_count=int(np.count_nonzero(outside)),\n                raw_max_abs=float(np.max(np.abs(vector), initial=0.0)),\n            )\n        if self.mode is ActionMode.ANCHORED_TARGET_RESIDUAL:\n            return AnchoredTargetResidualAction(\n                residuals=clipped * self.residual_scale,\n                saturated_count=int(np.count_nonzero(outside)),\n                raw_max_abs=float(np.max(np.abs(vector), initial=0.0)),\n            )\n        clipped *= self.residual_scale\n''',
          )
          replace_once(
              path,
              '    action: ResidualAction | ResidualActionV2 | TargetWeightAction\n',
              '    action: ResidualAction | ResidualActionV2 | TargetWeightAction | AnchoredTargetResidualAction\n',
          )
          replace_once(
              path,
              '''        action: ResidualAction | ResidualActionV2 | TargetWeightAction,\n''',
              '''        action: ResidualAction | ResidualActionV2 | TargetWeightAction | AnchoredTargetResidualAction,\n''',
          )
          replace_once(
              path,
              '''        if isinstance(action, TargetWeightAction):\n            return self._compose_target(action, trends, max_gross=max_gross)\n        if isinstance(action, ResidualAction):\n''',
              '''        if isinstance(action, TargetWeightAction):\n            return self._compose_target(action, trends, max_gross=max_gross)\n        if isinstance(action, AnchoredTargetResidualAction):\n            return self._compose_anchored(\n                action,\n                trends,\n                alpha,\n                alpha_enabled=alpha_enabled,\n                max_gross=max_gross,\n            )\n        if isinstance(action, ResidualAction):\n''',
          )
          marker = '''    @staticmethod\n    def _compose_target(\n'''
          method = '''    @staticmethod\n    def _compose_anchored(\n        action: AnchoredTargetResidualAction,\n        trends: TrendTargets,\n        alpha: np.ndarray,\n        *,\n        alpha_enabled: bool,\n        max_gross: float,\n    ) -> ResidualComposition:\n        if not alpha_enabled:\n            raise ValueError("anchored target residual requires enabled alpha anchor")\n        if not np.isfinite(max_gross) or not 0.0 < max_gross <= 10.0:\n            raise ValueError("max_gross must be within (0, 10]")\n        anchor = np.asarray(alpha, dtype=np.float64).reshape(-1)\n        if anchor.shape != trends.base.shape or action.residuals.shape != anchor.shape:\n            raise ValueError("anchored target dimensions must match trend targets")\n        if not np.isfinite(anchor).all():\n            raise ValueError("anchored target alpha must be finite")\n        anchor = _normalize_gross(anchor, maximum=max_gross)\n        raw = anchor + action.residuals\n        raw_gross = float(np.abs(raw).sum())\n        proposal = _normalize_gross(raw, maximum=max_gross)\n        zeros = np.zeros_like(anchor)\n        return ResidualComposition(\n            action=action,\n            baseline=anchor.copy(),\n            trend_component=zeros.copy(),\n            alpha_component=anchor.copy(),\n            factor_component=zeros.copy(),\n            residual_component=proposal - anchor,\n            proposal=proposal,\n            raw_gross=raw_gross,\n            target_gross=float(np.abs(proposal).sum()),\n        )\n\n''' + marker
          replace_once(path, marker, method)

          path = "trade_rl/rl/environment_policy_schedule_contract.py"
          replace_once(
              path,
              '''        if (\n            action_spec.mode is ActionMode.TARGET_WEIGHT\n            and action_spec.target_weight_count != self.dataset.n_symbols\n        ):\n            raise ValueError("target weight count does not match dataset symbols")\n''',
              '''        if (\n            action_spec.mode\n            in {ActionMode.TARGET_WEIGHT, ActionMode.ANCHORED_TARGET_RESIDUAL}\n            and action_spec.target_weight_count != self.dataset.n_symbols\n        ):\n            raise ValueError("target weight count does not match dataset symbols")\n''',
          )

          path = "trade_rl/rl/environment_decision.py"
          replace_once(
              path,
              '''    ActionMode,\n    ActionSpec,\n    BaselineResidualComposer,\n''',
              '''    ActionMode,\n    ActionSpec,\n    AnchoredTargetResidualAction,\n    BaselineResidualComposer,\n''',
          )
          replace_once(
              path,
              '    parsed_action: ResidualAction | ResidualActionV2 | TargetWeightAction\n',
              '    parsed_action: ResidualAction | ResidualActionV2 | TargetWeightAction | AnchoredTargetResidualAction\n',
          )
          replace_once(
              path,
              '''        ResidualAction | ResidualActionV2 | TargetWeightAction,\n''',
              '''        ResidualAction | ResidualActionV2 | TargetWeightAction | AnchoredTargetResidualAction,\n''',
          )
          replace_once(
              path,
              '''        if isinstance(parsed, TargetWeightAction):\n            maintained = parsed.as_array()\n        else:\n''',
              '''        if isinstance(parsed, (TargetWeightAction, AnchoredTargetResidualAction)):\n            maintained = parsed.as_array()\n        else:\n''',
          )
          replace_once(
              path,
              '''        submitted_shadow = (\n            np.asarray(request.trends.base, dtype=np.float64).reshape(-1).copy()\n        )\n''',
              '''        shadow_baseline = (\n            composition.baseline\n            if self.action_spec.mode is ActionMode.ANCHORED_TARGET_RESIDUAL\n            else request.trends.base\n        )\n        submitted_shadow = (\n            np.asarray(shadow_baseline, dtype=np.float64).reshape(-1).copy()\n        )\n''',
          )

          path = "trade_rl/rl/environment.py"
          replace_once(
              path,
              '''    AlphaContract,\n    BaselineResidualComposer,\n''',
              '''    AlphaContract,\n    AlphaSignalKind,\n    BaselineResidualComposer,\n''',
          )
          replace_once(
              path,
              '''        self.config = policy_schedule.config\n        self.emergency_risk_monitor = policy_schedule.emergency_risk_monitor\n        self.action_spec = policy_schedule.action_spec\n''',
              '''        self.config = policy_schedule.config\n        self.emergency_risk_monitor = policy_schedule.emergency_risk_monitor\n        self.action_spec = policy_schedule.action_spec\n        if (\n            self.action_spec.mode is ActionMode.ANCHORED_TARGET_RESIDUAL\n            and self.alpha_contract.kind is not AlphaSignalKind.TARGET_WEIGHT\n        ):\n            raise ValueError(\n                "anchored target residual mode requires target-weight alpha semantics"\n            )\n''',
          )

          path = "trade_rl/rl/lagrangian_probe.py"
          replace_once(
              path,
              '''    TARGET_WEIGHT_CASH = "target_weight_cash"\n    RESIDUAL_BASELINE = "residual_baseline"\n''',
              '''    TARGET_WEIGHT_CASH = "target_weight_cash"\n    RESIDUAL_BASELINE = "residual_baseline"\n    ANCHORED_ALPHA = "anchored_alpha"\n''',
          )
          replace_once(
              path,
              '''    semantic = (\n        CanonicalActionSemantic.TARGET_WEIGHT_CASH\n        if action_spec.mode is ActionMode.TARGET_WEIGHT\n        else CanonicalActionSemantic.RESIDUAL_BASELINE\n    )\n''',
              '''    if action_spec.mode is ActionMode.TARGET_WEIGHT:\n        semantic = CanonicalActionSemantic.TARGET_WEIGHT_CASH\n    elif action_spec.mode is ActionMode.ANCHORED_TARGET_RESIDUAL:\n        semantic = CanonicalActionSemantic.ANCHORED_ALPHA\n    else:\n        semantic = CanonicalActionSemantic.RESIDUAL_BASELINE\n''',
          )

          Path(".github/workflows/causal-v3-anchored-apply.yml").unlink()
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/actions.py trade_rl/rl/environment_policy_schedule_contract.py trade_rl/rl/environment_decision.py trade_rl/rl/environment.py trade_rl/rl/lagrangian_probe.py .github/workflows/causal-v3-anchored-apply.yml
          git commit -m "feat: add teacher-anchored residual action mode"
          git push origin HEAD:codex/causal-alpha-v3-research
