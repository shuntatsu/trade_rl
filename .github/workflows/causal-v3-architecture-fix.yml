name: Apply anchored validation decomposition fix

on:
  push:
    branches:
      - codex/causal-alpha-v3-research

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Extract anchored alpha validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("trade_rl/rl/environment.py")
          text = path.read_text(encoding="utf-8")
          old = '''        self.action_spec = policy_schedule.action_spec\n        if (\n            self.action_spec.mode is ActionMode.ANCHORED_TARGET_RESIDUAL\n            and self.alpha_contract.kind is not AlphaSignalKind.TARGET_WEIGHT\n        ):\n            raise ValueError(\n                "anchored target residual mode requires target-weight alpha semantics"\n            )\n        self._action_names = policy_schedule.action_names\n'''
          new = '''        self.action_spec = policy_schedule.action_spec\n        self._validate_action_alpha_contract()\n        self._action_names = policy_schedule.action_names\n'''
          if text.count(old) != 1:
              raise SystemExit("anchored constructor validation marker mismatch")
          text = text.replace(old, new)
          marker = '''        self._install_initial_state(initial_state)\n\n    def _install_observation_transport(\n'''
          helper = '''        self._install_initial_state(initial_state)\n\n    def _validate_action_alpha_contract(self) -> None:\n        if (\n            self.action_spec.mode is ActionMode.ANCHORED_TARGET_RESIDUAL\n            and self.alpha_contract.kind is not AlphaSignalKind.TARGET_WEIGHT\n        ):\n            raise ValueError(\n                "anchored target residual mode requires target-weight alpha semantics"\n            )\n\n    def _install_observation_transport(\n'''
          if text.count(marker) != 1:
              raise SystemExit("environment helper insertion marker mismatch")
          path.write_text(text.replace(marker, helper), encoding="utf-8")
          Path(".github/workflows/causal-v3-architecture-fix.yml").unlink()
      - name: Commit decomposition fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: preserve environment constructor boundary"
          git push origin HEAD:codex/causal-alpha-v3-research
