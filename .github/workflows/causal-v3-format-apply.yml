name: Apply causal V3 formatting

on:
  push:
    branches:
      - codex/causal-alpha-v3-research

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Apply repository formatter
        run: >-
          uvx --from ruff==0.15.21 ruff format
          scripts/analyze_causal_alpha_checkpoint.py
          tests/learning/test_causal_alpha_v3.py
          tests/learning/test_causal_alpha_weighted_ridge.py
          tests/rl/test_anchored_target_residual.py
          trade_rl/learning/causal_alpha_teacher.py
          trade_rl/learning/causal_alpha_v3.py
          trade_rl/learning/dagger.py
          trade_rl/rl/actions.py
          trade_rl/rl/environment_decision.py
          trade_rl/workflows/causal_alpha_research_diagnostics.py
          trade_rl/workflows/universal_causal_alpha_v3.py
      - name: Remove temporary workflow
        run: rm .github/workflows/causal-v3-format-apply.yml
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize causal alpha v3 formatting"
          git push origin HEAD:codex/causal-alpha-v3-research
