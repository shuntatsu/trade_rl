name: Apply causal V3 review fixes

on:
  push:
    branches:
      - codex/causal-alpha-v3-research

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          path = "trade_rl/learning/dagger.py"
          marker = '''\n\ndef _stack_observations(\n'''
          helper = '''\n\ndef _normalize_rollout_observations(\n    observations: ObservationBatch, *, expected_count: int\n) -> ObservationBatch:\n    if isinstance(observations, Mapping):\n        if not observations:\n            raise ValueError("DAgger structured observation must not be empty")\n        normalized: dict[str, np.ndarray] = {}\n        for key in sorted(observations):\n            if not isinstance(key, str) or not key:\n                raise ValueError("DAgger observation keys must be non-empty strings")\n            array = np.asarray(observations[key]).copy(order="C")\n            if array.ndim < 2:\n                raise ValueError("DAgger structured observations must be sample-first")\n            if len(array) != expected_count:\n                raise ValueError("DAgger observation count does not match actions")\n            if (\n                not np.issubdtype(array.dtype, np.number)\n                or not np.isfinite(array).all()\n            ):\n                raise ValueError("DAgger observations must be finite numeric arrays")\n            array.setflags(write=False)\n            normalized[key] = array\n        return normalized\n    array = np.asarray(observations, dtype=np.float32).copy(order="C")\n    if array.ndim != 2:\n        raise ValueError("DAgger flat observations must be rank-two")\n    if len(array) != expected_count:\n        raise ValueError("DAgger observation count does not match actions")\n    if not np.isfinite(array).all():\n        raise ValueError("DAgger observations must be finite")\n    array.setflags(write=False)\n    return array\n''' + marker
          replace_once(path, marker, helper)
          replace_once(
              path,
              '''        observation_count = (\n            len(next(iter(self.observations.values())))\n            if isinstance(self.observations, Mapping)\n            else len(np.asarray(self.observations))\n        )\n        if observation_count != len(teacher):\n            raise ValueError("DAgger observation count does not match actions")\n        teacher.setflags(write=False)\n''',
              '''        observations = _normalize_rollout_observations(\n            self.observations, expected_count=len(teacher)\n        )\n        teacher.setflags(write=False)\n''',
          )
          replace_once(
              path,
              '''        object.__setattr__(self, "teacher_actions", teacher)\n''',
              '''        object.__setattr__(self, "observations", observations)\n        object.__setattr__(self, "teacher_actions", teacher)\n''',
          )

          spec = Path("docs/implementation-plans/specs/2026-08-14-causal-alpha-v3-research-path-design.md")
          text = spec.read_text(encoding="utf-8")
          text = text.replace(
              "- the final global weight vector has mean one, keeping numerical scale explicit.",
              "- each train symbol contributes equal total weight mass; absolute global scale is immaterial because the V3 weighted objective is normalized by total eligible weight.",
          )
          old = '''For target `w` with previous target `w_prev`:\n\n`objective = w * mu - z * abs(w) * sigma - abs(w - w_prev) * (cost_multiplier * one_way_cost + edge_margin)`\n\nThe current target is always a candidate, so an explicit HOLD/flat decision requires no ad-hoc reward shaping.'''
          new = '''For candidate target `w`, previous target `w_prev`, and incremental change `d = w - w_prev`:\n\n`objective = d * mu - z * abs(d) * sigma - abs(d) * (cost_multiplier * one_way_cost + edge_margin)`\n\nHOLD has `d = 0` and objective `0`, so already-paid execution cost is not charged again and an explicit HOLD decision requires no ad-hoc reward shaping.'''
          if old not in text:
              raise SystemExit("target compiler design formula marker missing")
          spec.write_text(text.replace(old, new), encoding="utf-8")

          universal = Path("docs/UNIVERSAL_TRAINING.md")
          text = universal.read_text(encoding="utf-8")
          universal.write_text(text.replace('\\\\"', '"'), encoding="utf-8")

          Path(".github/workflows/causal-v3-review-fix.yml").unlink()
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close causal v3 falsification gaps"
          git push origin HEAD:codex/causal-alpha-v3-research
