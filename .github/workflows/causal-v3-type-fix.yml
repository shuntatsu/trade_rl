name: Apply anchored residual type fix

on:
  push:
    branches:
      - codex/causal-alpha-v3-research

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Apply type contract fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("trade_rl/rl/environment.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''    AlphaSignalKind,\n    BaselineResidualComposer,\n'''
          new_import = '''    AlphaSignalKind,\n    AnchoredTargetResidualAction,\n    BaselineResidualComposer,\n'''
          if text.count(old_import) != 1:
              raise SystemExit("anchored residual import marker mismatch")
          text = text.replace(old_import, new_import)
          old_annotation = '''        ResidualAction | ResidualActionV2 | TargetWeightAction,\n        np.ndarray,\n'''
          new_annotation = '''        ResidualAction\n        | ResidualActionV2\n        | TargetWeightAction\n        | AnchoredTargetResidualAction,\n        np.ndarray,\n'''
          if text.count(old_annotation) != 1:
              raise SystemExit("parse-action return annotation marker mismatch")
          path.write_text(text.replace(old_annotation, new_annotation), encoding="utf-8")
          Path(".github/workflows/causal-v3-type-fix.yml").unlink()
      - name: Commit type fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind anchored action into environment type contract"
          git push origin HEAD:codex/causal-alpha-v3-research
