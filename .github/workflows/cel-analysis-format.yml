name: CEL Analysis Format

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-analysis-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff format trade_rl/evaluation/experiments/analysis.py
      - name: Commit formatter-only diff and remove helper
        run: |
          rm .github/workflows/cel-analysis-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/analysis.py .github/workflows/cel-analysis-format.yml
          git diff --cached --check
          git commit -m "style: format controlled evidence analysis"
          git push origin HEAD:feat/controlled-experiment-loop-v1
