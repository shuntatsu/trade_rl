name: CEL Analysis GREEN

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-analysis-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check trade_rl tests
      - run: uv run ruff format --check trade_rl tests
      - run: uv run mypy trade_rl
      - run: uv run pytest -q tests/evaluation/experiments/test_analysis.py tests/evaluation/experiments/test_evidence.py tests/evaluation/experiments/test_evidence_identity.py tests/evaluation/experiments/test_evidence_tamper.py
