name: CEL Analysis Typed Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-analysis-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply typed analysis and oracle-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis = Path("trade_rl/evaluation/experiments/analysis.py")
          text = analysis.read_text(encoding="utf-8")
          old = 'float(paired["excess_total_return"])'
          if text.count(old) != 2:
              raise SystemExit("expected two paired excess casts")
          text = text.replace(
              old,
              '_require_metric_number(paired, "excess_total_return")',
          )
          analysis.write_text(text, encoding="utf-8")

          test_path = Path("tests/evaluation/experiments/test_analysis.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_test = "seeds=(\n            SeedEvaluation("
          if test_text.count(old_test) != 1:
              raise SystemExit("expected one seed robustness generator oracle")
          test_text = test_text.replace(
              old_test,
              "seeds=tuple(\n            SeedEvaluation(",
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/experiments/analysis.py tests/evaluation/experiments/test_analysis.py
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_analysis.py tests/evaluation/experiments/test_evidence.py tests/evaluation/experiments/test_evidence_identity.py tests/evaluation/experiments/test_evidence_publication.py tests/evaluation/experiments/test_evidence_tamper.py
      - name: Commit fixes and remove helper
        run: |
          rm .github/workflows/cel-analysis-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/analysis.py tests/evaluation/experiments/test_analysis.py .github/workflows/cel-analysis-green.yml
          git diff --cached --check
          git commit -m "fix: validate typed controlled analysis evidence"
          git push origin HEAD:feat/controlled-experiment-loop-v1
