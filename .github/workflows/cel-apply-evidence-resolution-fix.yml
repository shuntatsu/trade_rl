name: Apply CEL Evidence Resolution Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-apply-evidence-resolution-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/controlled-experiment-loop-v1
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply and verify
        run: |
          uv run python scripts/cel_fix_evidence_resolution.py
          uv run ruff format trade_rl/evaluation/experiments/evidence.py
          uv run pytest -q tests/evaluation/experiments/test_evidence.py::test_evidence_set_executes_every_seed_through_shared_resolution tests/evaluation/experiments/test_evidence_identity.py tests/evaluation/experiments/test_evidence_tamper.py
          rm -f scripts/cel_fix_evidence_resolution.py .github/workflows/cel-apply-evidence-resolution-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/evidence.py scripts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve each EvidenceSet seed exactly once"
          git push origin HEAD:feat/controlled-experiment-loop-v1
