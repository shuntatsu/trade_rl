name: CEL Delta Contract Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-delta-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply fail-closed verification invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/delta.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if self.status is ControlledVerificationStatus.CONTROLLED and self.violations:\n            raise ArtifactIntegrityError(\n                "CONTROLLED verification cannot contain violations"\n            )\n'''
          new = '''        if self.status is ControlledVerificationStatus.CONTROLLED:\n            if not self.changed_paths:\n                raise ArtifactIntegrityError(\n                    "CONTROLLED verification requires a non-empty resolved delta"\n                )\n            if self.violations:\n                raise ArtifactIntegrityError(\n                    "CONTROLLED verification cannot contain violations"\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit("controlled verification invariant block mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run ruff check --fix trade_rl/evaluation/experiments/delta.py
          uv run ruff format trade_rl/evaluation/experiments/delta.py
          uv run pytest -q tests/evaluation/experiments/test_delta_contract.py tests/evaluation/experiments/test_delta.py tests/evaluation/experiments/test_delta_lineage.py tests/property/test_controlled_experiment_delta_properties.py
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/cel-delta-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/delta.py .github/workflows/cel-delta-contract-fix.yml
          git diff --cached --check
          git commit -m "fix: require resolved delta for controlled verification"
          git push origin HEAD:feat/controlled-experiment-loop-v1
