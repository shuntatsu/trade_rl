name: CEL Delta Lineage Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-delta-lineage-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply lineage-compatible fixed-field verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/delta.py")
          text = path.read_text(encoding="utf-8")

          marker = '_STRATEGIES = (\n'
          insert = '''_STUDY_FIXED_CONFIG_PATHS = (\n    "fit_cutoff",\n    "evaluation_start",\n    "evaluation_stop_exclusive",\n    "initial_capital",\n    "execution_overlay",\n)\n\n\n'''
          if insert not in text:
              if text.count(marker) != 1:
                  raise SystemExit("strategy marker mismatch")
              text = text.replace(marker, insert + marker, 1)

          marker = '''def _strategy_matrix(\n'''
          helper = '''def _fixed_config_violations(\n    *,\n    plan: StudyPlan,\n    evidence: LoadedEvidenceSet,\n    label: str,\n) -> list[str]:\n    plan_semantic = _without_seed(plan.baseline_config.to_payload())\n    violations: list[str] = []\n    for field in _STUDY_FIXED_CONFIG_PATHS:\n        if field not in evidence.semantic_config or (\n            _canonical_value(evidence.semantic_config[field])\n            != _canonical_value(plan_semantic[field])\n        ):\n            violations.append(\n                f"{label} fixed resolved field differs from frozen Study plan: {field}"\n            )\n    return violations\n\n\n'''
          if helper not in text:
              if text.count(marker) != 1:
                  raise SystemExit("strategy matrix marker mismatch")
              text = text.replace(marker, helper + marker, 1)

          old = '''    baseline_semantic = _without_seed(plan.baseline_config.to_payload())\n    if baseline.semantic_config != baseline_semantic:\n        violations.append("baseline evidence does not match the frozen Study baseline")\n'''
          if old in text:
              text = text.replace(old, "", 1)

          marker = '''    if candidate.semantic_config != defined_candidate:\n        violations.append("candidate evidence does not match the frozen definition")\n\n'''
          fixed_checks = '''    violations.extend(\n        _fixed_config_violations(plan=plan, evidence=baseline, label="baseline")\n    )\n    violations.extend(\n        _fixed_config_violations(plan=plan, evidence=candidate, label="candidate")\n    )\n\n'''
          if fixed_checks not in text:
              if text.count(marker) != 1:
                  raise SystemExit("candidate definition marker mismatch")
              text = text.replace(marker, marker + fixed_checks, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix trade_rl/evaluation/experiments/delta.py
          uv run ruff format trade_rl/evaluation/experiments/delta.py
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_delta.py tests/evaluation/experiments/test_delta_lineage.py tests/property/test_controlled_experiment_delta_properties.py
          uv run pytest -q tests
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/cel-delta-lineage-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/delta.py .github/workflows/cel-delta-lineage-fix.yml
          git diff --cached --check
          git commit -m "fix: enforce fixed fields across experiment lineage"
          git push origin HEAD:feat/controlled-experiment-loop-v1
