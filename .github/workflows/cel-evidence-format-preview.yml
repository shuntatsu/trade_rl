name: CEL Evidence Format Apply

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-evidence-format-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply exact formatter diff
        run: uv run ruff format trade_rl/evaluation/experiments/evidence.py
      - name: Commit formatter-only change
        run: |
          if git diff --quiet -- trade_rl/evaluation/experiments/evidence.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/evidence.py
          git commit -m "style: format study-owned evidence implementation"
          git push origin HEAD:feat/controlled-experiment-loop-v1
