name: CEL Evidence Loader Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-evidence-loader-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Reject seeded semantic manifests and verify
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/evidence.py")
          text = path.read_text(encoding="utf-8")
          marker = '''    if not isinstance(semantic_config, dict) or any(\n        not isinstance(key, str) for key in semantic_config\n    ):\n        raise ArtifactIntegrityError("EvidenceSet semantic_config is malformed")\n'''
          replacement = marker + '''    if "ppo_seed" in semantic_config:\n        raise ArtifactIntegrityError(\n            "EvidenceSet semantic config must not contain ppo_seed"\n        )\n'''
          if replacement not in text:
              if text.count(marker) != 1:
                  raise SystemExit("semantic config validation marker mismatch")
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/experiments/evidence.py
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_evidence_identity.py tests/evaluation/experiments/test_evidence.py tests/evaluation/experiments/test_workflow_seed_binding.py
          uv run pytest -q tests
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/cel-evidence-loader-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/evidence.py .github/workflows/cel-evidence-loader-fix.yml
          git diff --cached --check
          git commit -m "fix: reject seeded EvidenceSet semantic manifests"
          git push origin HEAD:feat/controlled-experiment-loop-v1
