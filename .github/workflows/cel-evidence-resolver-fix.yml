name: CEL Evidence Resolver Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-evidence-resolver-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Reuse pre-resolved first seed exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/evidence.py")
          text = path.read_text(encoding="utf-8")
          builder = text.index("    def builder(staging: Path) -> None:\n")
          start = text.index("        for seed in plan.ppo_seeds:\n", builder)
          end = text.index("            resolved = _resolved_run_config(spec)\n", start)
          original = text[start:end]
          if original.count("resolve_candidate_run_spec(") != 1:
              raise SystemExit("unexpected EvidenceSet resolver block")
          replacement = (
              "        first_seed = plan.ppo_seeds[0]\n"
              "        for seed in plan.ppo_seeds:\n"
              "            if seed == first_seed:\n"
              "                spec = normalized_spec\n"
              "            else:\n"
              "                seed_config = replace(config, ppo_seed=seed)\n"
              "                spec = resolve_candidate_run_spec(\n"
              "                    dataset,\n"
              "                    dataset_artifact_schema=artifact.schema_version,\n"
              "                    dataset_artifact_digest=artifact.artifact_digest,\n"
              "                    config=seed_config,\n"
              "                )\n"
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/experiments/evidence.py
          uv run pytest -q \
            tests/evaluation/experiments/test_evidence.py::test_evidence_set_executes_every_seed_through_shared_resolution \
            tests/evaluation/experiments/test_evidence_identity.py \
            tests/evaluation/experiments/test_evidence_tamper.py
      - name: Commit production fix and remove helper
        run: |
          rm .github/workflows/cel-evidence-resolver-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/evidence.py .github/workflows/cel-evidence-resolver-fix.yml
          git diff --cached --check
          git commit -m "fix: resolve each EvidenceSet seed exactly once"
          git push origin HEAD:feat/controlled-experiment-loop-v1
