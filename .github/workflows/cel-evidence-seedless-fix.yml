name: CEL Evidence Seedless Fix

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-evidence-seedless-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply seedless EvidenceSet identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/evidence.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if normalized_contract is None:\n            raise ArtifactIntegrityError("EvidenceSet contains no seed Runs")\n        _verify_seed_invariance(\n            loaded_runs,\n            seeds=plan.ppo_seeds,\n            symbols=plan.symbols,\n            research_context_digest=research_context_digest,\n        )\n        run_digest_tuple = tuple(run_digests)\n        fingerprint = _evidence_fingerprint(\n            semantic_config_digest=normalized_contract.digest,\n            ppo_seeds=plan.ppo_seeds,\n            run_digests=run_digest_tuple,\n            research_context_digest=research_context_digest,\n        )\n        evidence = EvidenceSet(\n            fingerprint=fingerprint,\n            semantic_config_digest=normalized_contract.digest,\n            ppo_seeds=plan.ppo_seeds,\n            run_digests=run_digest_tuple,\n            research_context_digest=research_context_digest,\n        )\n        manifest = evidence.to_payload()\n        manifest["semantic_config"] = normalized_contract.to_payload()\n'''
          new = '''        if normalized_contract is None or seedless_contract is None:\n            raise ArtifactIntegrityError("EvidenceSet contains no seed Runs")\n        _verify_seed_invariance(\n            loaded_runs,\n            seeds=plan.ppo_seeds,\n            symbols=plan.symbols,\n            research_context_digest=research_context_digest,\n        )\n        run_digest_tuple = tuple(run_digests)\n        semantic_config_digest = content_digest(seedless_contract)\n        fingerprint = _evidence_fingerprint(\n            semantic_config_digest=semantic_config_digest,\n            ppo_seeds=plan.ppo_seeds,\n            run_digests=run_digest_tuple,\n            research_context_digest=research_context_digest,\n        )\n        evidence = EvidenceSet(\n            fingerprint=fingerprint,\n            semantic_config_digest=semantic_config_digest,\n            ppo_seeds=plan.ppo_seeds,\n            run_digests=run_digest_tuple,\n            research_context_digest=research_context_digest,\n        )\n        manifest = evidence.to_payload()\n        manifest["semantic_config"] = seedless_contract\n'''
          if text.count(old) != 1:
              raise SystemExit("EvidenceSet identity block mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          docs = Path("docs/architecture/controlled-experiment-loop.md")
          text = docs.read_text(encoding="utf-8")
          marker = "EvidenceSet内で変えてよいのは `ppo_seed` だけである。"
          addition = (
              marker
              + " EvidenceSetのsemantic configとそのdigestからは `ppo_seed` を除外し、"
                "seed policyはordered `ppo_seeds`として別にidentityへbindする。"
                "各Run artifactには実際の `ppo_seed` を保持する。"
          )
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit("docs EvidenceSet marker mismatch")
              text = text.replace(marker, addition, 1)
          docs.write_text(text, encoding="utf-8")
          PY
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_evidence_identity.py tests/evaluation/experiments/test_evidence.py tests/evaluation/experiments/test_delta.py tests/evaluation/experiments/test_workflow.py tests/evaluation/experiments/test_lineage.py
          uv run pytest -q tests
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/cel-evidence-seedless-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/evidence.py tests/evaluation/experiments/test_evidence_identity.py docs/architecture/controlled-experiment-loop.md .github/workflows/cel-evidence-seedless-fix.yml
          git diff --cached --check
          git commit -m "fix: separate EvidenceSet seed policy from semantic identity"
          git push origin HEAD:feat/controlled-experiment-loop-v1
