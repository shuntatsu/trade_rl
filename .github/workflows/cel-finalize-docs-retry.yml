name: Retry Controlled Experiment Docs Finalization

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-finalize-docs-retry.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Reuse exact docs migration and remove empty ephemeral dirs
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          helper = Path(".github/workflows/cel-finalize-docs.yml").read_text(
              encoding="utf-8"
          )
          marker = "      - name: Write durable docs and remove completed plans/specs\n        run: |\n"
          start = helper.index(marker) + len(marker)
          end = helper.index("\n      - name: Commit durable docs and remove helper", start)
          script = textwrap.dedent(helper[start:end])
          needle = "\nuv run ruff check --fix tests/architecture/test_current_docs_layout.py\n"
          if script.count(needle) != 1:
              raise SystemExit("docs migration verification marker mismatch")
          script = script.replace(
              needle,
              "\nrmdir docs/specs docs/plans\n" + needle,
              1,
          )
          subprocess.run(["bash", "-e"], input=script, text=True, check=True)
          PY
      - name: Commit durable docs and remove transient helpers
        run: |
          rm .github/workflows/cel-finalize-docs-retry.yml
          rm -f .github/workflows/cel-finalize-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs tests/architecture/test_current_docs_layout.py .github/workflows
          git diff --cached --check
          git commit -m "docs: promote controlled experiment loop contract"
          git push origin HEAD:feat/controlled-experiment-loop-v1
