name: Apply CEL Contract Format

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-format-apply.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/controlled-experiment-loop-v1
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Format contracts and remove format helpers
        run: |
          uv run ruff format trade_rl/evaluation/experiments/contracts
          rm -f .github/workflows/cel-format-preview.yml
          rm -f .github/workflows/cel-format-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/contracts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "style: format controlled experiment contracts"
          git push origin HEAD:feat/controlled-experiment-loop-v1
