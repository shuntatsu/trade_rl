name: Clean Task 7 Workflow Typing

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-task7-mypy-cleanup.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply exact typing cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/workflow.py")
          text = path.read_text(encoding="utf-8")

          old_import = '''from trade_rl.data import (\n    inspect_published_market_dataset_artifact,\n    load_market_dataset_artifact,\n)\n'''
          new_import = '''from trade_rl.data import (\n    MarketDataset,\n    PublishedDatasetArtifact,\n    inspect_published_market_dataset_artifact,\n    load_market_dataset_artifact,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit("data import block mismatch")
          text = text.replace(old_import, new_import, 1)

          old_def = '''def _validate_dataset_root(\n    dataset_root: str | Path,\n    plan: StudyPlan,\n):\n'''
          new_def = '''def _validate_dataset_root(\n    dataset_root: str | Path,\n    plan: StudyPlan,\n) -> tuple[MarketDataset, PublishedDatasetArtifact]:\n'''
          if text.count(old_def) != 1:
              raise SystemExit("dataset helper signature mismatch")
          text = text.replace(old_def, new_def, 1)

          duplicate = '''def _find_evidence(\n    state: _StudyState,\n    digest: str,\n) -> tuple[LoadedEvidenceSet, _AnalysisBinding]:\n    if (\n        state.baseline is not None\n        and state.baseline_analysis is not None\n        and state.baseline.evidence.fingerprint == digest\n    ):\n        return state.baseline, state.baseline_analysis\n    for experiment in state.experiments:\n        if (\n            experiment.candidate is not None\n            and experiment.candidate_analysis is not None\n            and experiment.candidate.evidence.fingerprint == digest\n        ):\n            return experiment.candidate, experiment.candidate_analysis\n    raise ArtifactIntegrityError("referenced EvidenceSet is absent from Study")\n\n\n'''
          if text.count(duplicate) != 2:
              raise SystemExit("expected exactly two duplicate _find_evidence blocks")
          head, sep, tail = text.rpartition(duplicate)
          if not sep:
              raise SystemExit("second _find_evidence block not found")
          text = head + tail
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix trade_rl/evaluation/experiments/workflow.py
          uv run ruff format trade_rl/evaluation/experiments/workflow.py
          uv run mypy trade_rl/evaluation/experiments/workflow.py
      - name: Commit and remove helper
        run: |
          rm .github/workflows/cel-task7-mypy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/workflow.py .github/workflows/cel-task7-mypy-cleanup.yml
          git diff --cached --check
          git commit -m "fix: clean Task 7 workflow typing"
          git push origin HEAD:feat/controlled-experiment-loop-v1
