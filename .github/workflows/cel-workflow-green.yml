name: CEL Workflow Green

on:
  push:
    branches:
      - feat/controlled-experiment-loop-v1
    paths:
      - .github/workflows/cel-workflow-green.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply typed integration fixes and verify Task 6
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/workflow.py")
          text = path.read_text(encoding="utf-8")

          old_import = '''from trade_rl.data import (\n    inspect_published_market_dataset_artifact,\n    load_market_dataset_artifact,\n)\n'''
          new_import = '''from trade_rl.data import (\n    PublishedDatasetArtifact,\n    inspect_published_market_dataset_artifact,\n    load_market_dataset_artifact,\n)\nfrom trade_rl.data.market import MarketDataset\n'''
          if old_import not in text:
              raise SystemExit("dataset import block mismatch")
          text = text.replace(old_import, new_import, 1)

          old_signature = '''def _validate_dataset_root(\n    dataset_root: str | Path,\n    plan: StudyPlan,\n):\n'''
          new_signature = '''def _validate_dataset_root(\n    dataset_root: str | Path,\n    plan: StudyPlan,\n) -> tuple[MarketDataset, PublishedDatasetArtifact]:\n'''
          if old_signature not in text:
              raise SystemExit("dataset validator signature mismatch")
          text = text.replace(old_signature, new_signature, 1)

          needle = "\ndef _find_evidence("
          positions = []
          cursor = 0
          while True:
              position = text.find(needle, cursor)
              if position < 0:
                  break
              positions.append(position)
              cursor = position + len(needle)
          if len(positions) != 2:
              raise SystemExit(f"expected two _find_evidence definitions, found {len(positions)}")
          second = positions[1]
          next_public = text.find("\ndef create_study(", second)
          if next_public < 0:
              raise SystemExit("create_study marker missing after duplicate _find_evidence")
          text = text[:second] + text[next_public:]

          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/experiments/workflow.py
          uv run ruff check trade_rl tests
          uv run ruff format --check trade_rl tests
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_workflow.py tests/evaluation/experiments/test_lineage.py tests/evaluation/experiments/test_workflow_atomicity.py tests/evaluation/experiments/test_workflow_candidate_atomicity.py
          uv run pytest -q tests
      - name: Commit verified Task 6 and remove helper
        run: |
          rm .github/workflows/cel-workflow-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/workflow.py .github/workflows/cel-workflow-green.yml
          git diff --cached --check
          git commit -m "fix: normalize controlled study workflow"
          git push origin HEAD:feat/controlled-experiment-loop-v1
