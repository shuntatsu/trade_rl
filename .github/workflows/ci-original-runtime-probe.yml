name: Original CPython runtime probe (non-economic)

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci-original-runtime-probe.yml

permissions: {}

jobs:
  original-standalone:
    name: Original CPython 3.12.12 asset provenance (#1225)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download, authenticate and inspect only the historical interpreter
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          archive="$work/cpython.tar.gz"
          # GitHub release 20260203, asset 350364012; pin the published digest.
          url='https://github.com/astral-sh/python-build-standalone/releases/download/20260203/cpython-3.12.12%2B20260203-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          expected='5164e8ddfca4b0b04a160e11bf411bc453e6c2f8f111f6a9bbd152a1b1a6d7b4'
          curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --connect-timeout 15 \
            --max-time 90 --max-filesize 33892322 --output "$archive" "$url"
          [[ "$(stat -c %s "$archive")" == 33892322 ]]
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$work"
          "$work/python/bin/python3.12" -I -S -c "import platform, sys; assert sys.implementation.name == 'cpython' and sys.version_info[:3] == (3, 12, 12) and platform.system() == 'Linux' and platform.machine() == 'x86_64'; print(sys.version)"
          printf 'Verified original release 20260203 asset SHA-256: %s\n' "$expected"

  immutable-normalization-runtime:
    name: Frozen normalization runtime and receipt guards (#1225)
    needs: original-standalone
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - name: Checkout exact frozen normalization source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 72ec5a082a1e298ccfe904f06c16d423e12a76b2
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen source and locks
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 72ec5a082a1e298ccfe904f06c16d423e12a76b2 ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == 73ee39ebd561913ed8fe7ac0b8017f039bf3af3e ]]
          printf '%s  %s\n' \
            0044c6bd0e95868e092fc52eaad5b9e0e821cb2db87a5b6f4fbaefbe1b981cf8 pyproject.toml \
            6440b63c463035d0c523869a2bbc62fac6c96f9ac0585a32b77f16bf5ea176f6 uv.lock \
            | sha256sum --check --strict

      - name: Set up uv from frozen source
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          python-version: "3.12.12"
          enable-cache: false
          working-directory: target

      - name: Install locked runtime and verify original interpreter bytes
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          uv --version | grep -Eq '^uv 0\.10\.0([[:space:]]|$)'
          uv sync --locked --extra dev --extra train-sb3
          export UV_PYTHON_DOWNLOADS=never
          managed_python=$(uv python find --system --managed-python 3.12.12)
          export managed_python
          uv run --no-sync python -I - <<'PY'
          from hashlib import sha256
          from importlib import metadata
          from pathlib import Path
          import os
          import platform
          import sys

          assert sys.implementation.name == "cpython"
          assert sys.version_info[:3] == (3, 12, 12)
          assert platform.system() == "Linux" and platform.machine() == "x86_64"
          assert Path(sys._base_executable).resolve() == Path(os.environ["managed_python"]).resolve()
          assert sha256(Path(sys._base_executable).read_bytes()).hexdigest() == "20341168c41f91f4328c68d1f1a8d563f5734d515e617ff80a8dcfce323218b7"
          library = Path(sys.base_prefix) / "lib/libpython3.12.so.1.0"
          assert sha256(library.read_bytes()).hexdigest() == "2ccb92133add99f4981f0f9e6b38fb58b205bd97da6f8c0f7646c47ccf0b1461"
          print("Verified original managed Python executable and shared library:", sys.version)

          import torch
          import stable_baselines3
          assert metadata.version("torch") == "2.4.1"
          assert stable_baselines3.__version__ == "2.3.2"
          assert torch.tensor([1, 2], device="cpu").sum().item() == 3
          print("Locked runtime import and CPU tensor smoke passed")
          PY

      - name: Verify only synthetic receipt and authority guards
        working-directory: target
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          report=$(mktemp)
          trap 'rm -f -- "$report"' EXIT
          uv run --no-sync python -I -m pytest -q -rs --junitxml="$report" \
            tests/evaluation/test_ppo_normalization_execution.py::test_digest_payload_pair_resumes_digest_only_and_rejects_tamper \
            tests/evaluation/test_ppo_normalization_execution.py::test_execution_is_fail_closed_without_sealed_activation \
            tests/evaluation/test_ppo_normalization_execution.py::test_activation_rejects_result_or_unused_data_authority \
            tests/evaluation/test_ppo_normalization_execution.py::test_activation_rejects_runtime_drift \
            tests/evaluation/test_ppo_normalization_execution.py::test_activation_rejects_implementation_digest_drift \
            tests/evaluation/test_ppo_normalization_execution.py::test_verifier_runtime_ignores_kernel_release_but_not_stable_identity \
            tests/tools/test_ppo_checkpoint_actions.py::test_prior_receipt_binds_checkout_and_workflow_identity \
            tests/tools/test_ppo_checkpoint_actions.py::test_producer_run_api_binds_workflow_attempt_repo_and_head \
            tests/tools/test_ppo_checkpoint_actions.py::test_producer_api_lookup_targets_the_receipt_attempt
          uv run --no-sync python -I - "$report" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(Path(sys.argv[1])).getroot()
          suites = list(root.iter("testsuite"))
          assert len(suites) == 1
          suite = suites[0]
          assert suite.attrib["tests"] == "10"
          assert all(suite.attrib[key] == "0" for key in ("failures", "errors", "skipped"))
          assert len(list(suite.iter("testcase"))) == 10
          print("All ten selected synthetic guard cases executed without skips")
          PY
          printf '%s  %s\n' \
            0044c6bd0e95868e092fc52eaad5b9e0e821cb2db87a5b6f4fbaefbe1b981cf8 pyproject.toml \
            6440b63c463035d0c523869a2bbc62fac6c96f9ac0585a32b77f16bf5ea176f6 uv.lock \
            | sha256sum --check --strict
          [[ "$(git rev-parse HEAD)" == 72ec5a082a1e298ccfe904f06c16d423e12a76b2 ]]
          [[ -z "$(git status --porcelain)" ]]
