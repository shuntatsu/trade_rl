name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rebuilt Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Studio frontend
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Verify Studio frontend
        shell: bash
        run: |
          set -o pipefail
          {
            npm test --prefix frontend -- --run
            npm run typecheck --prefix frontend
            npm run build --prefix frontend
            npm run check:bundle --prefix frontend
          } 2>&1 | tee studio-frontend.log

      - name: Verify Studio fixed viewport layout
        env:
          STUDIO_QA_OUTPUT_DIR: frontend/qa-screenshots
        run: npm run check:layout --prefix frontend

      - name: Upload Studio layout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-layout-diagnostics
          path: |
            studio-frontend.log
            frontend/qa-screenshots
          if-no-files-found: error

      - name: Multiprocessing warning regressions
        run: >-
          uv run pytest -q
          tests/workflows/test_market_walk_forward_normalizer_multiprocessing.py
          tests/rl/test_lagrangian_probe.py::test_parallel_probe_does_not_fork_a_multithreaded_parent
          tests/learning/test_episode_teacher_parallel_chunking.py::test_parallel_teacher_rollout_does_not_fork_a_multithreaded_parent

      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .

      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check --diff . 2>&1 | tee ruff.log

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check --diff . 2>&1 | tee format.log

      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-diagnostics
          path: |
            ruff.log
            format.log
            mypy.log
          if-no-files-found: ignore

      - name: Import architecture
        shell: bash
        run: |
          set -o pipefail
          uv run lint-imports 2>&1 | tee import-linter.log

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-diagnostics
          path: import-linter.log
          if-no-files-found: error

      - name: Dead-code report
        run: uv run vulture trade_rl tests --min-confidence 100

      - name: Recovery and structured serving smoke
        run: >-
          uv run pytest -q
          tests/integrations/test_sb3_training.py::test_backend_resumes_ppo_checkpoint_to_requested_total
          tests/serving/test_sb3_loader.py::test_structured_sb3_loader_rebuilds_native_sequence_observation
          tests/workflows/test_universal_trade_rl_u2_preflight_falsification.py::test_u2_training_source_rejects_fit_grid_not_aligned_to_source_grid
          tests/workflows/test_universal_trade_rl_u2_preflight_falsification.py::test_u2_training_source_exposes_exact_fit_indices
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_routed_u1_observation_has_explicit_sb3_sequence_adapter
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_u1_sequence_adapter_constructs_and_forwards_exact_u1_observation
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_u1_policy_identity_binds_adapter_and_current_weight_location
          tests/workflows/test_universal_trade_rl_u2_training_runtime.py::test_u2_seed_training_plan_binds_contract_source_closure_and_fixed_budget
          tests/workflows/test_universal_trade_rl_u2_training_runtime.py::test_u2_selection_checkpoint_requires_exact_final_fixed_budget

      - name: Tests and coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --cov=trade_rl --cov-branch --cov-report=term-missing --cov-report=json:coverage.json 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-diagnostics
          path: |
            pytest.log
            coverage.json
          if-no-files-found: ignore

      - name: Critical branch coverage
        run: uv run python .github/check_critical_coverage.py coverage.json pyproject.toml

      - name: Package and uv identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          cli="$(uv run trade-rl --version)"
          uv_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"].removeprefix("=="))')"
          test "$module" = "$expected"
          test "$cli" = "trade-rl $expected"
          test "$(uv --version)" = "uv $uv_version"

  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Compatibility tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/architecture \
            tests/data \
            tests/simulation \
            tests/evaluation \
            tests/serving \
            tests/examples/test_docker_training_assets.py::test_provenance_validation_target_fails_fast_without_valid_arguments \
            tests/operations/test_training_capability_audit.py::test_run_training_capability_audit_preserves_report_contract \
            tests/operations/test_training_capability_audit.py::test_sequence_training_exercises_real_hierarchical_behavior_cloning \
            2>&1 | tee compatibility.log
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.os }}
          path: compatibility.log
          if-no-files-found: error

  training-image:
    name: Training image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build complete training image
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(PYTHONPATH=. python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$commit" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$source_digest" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$lock_digest" \
            --file docker/Dockerfile.training \
            --tag trade-rl-training:ci \
            .

      - name: Record training image identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(PYTHONPATH=. python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          image_id="$(docker image inspect --format '{{.Id}}' trade-rl-training:ci)"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' trade-rl-training:ci)"
          {
            printf 'commit_sha=%s\n' "$commit"
            printf 'source_tree_digest=%s\n' "$source_digest"
            printf 'lockfile_digest=%s\n' "$lock_digest"
            printf 'image_id=%s\n' "$image_id"
            printf 'repo_digests=%s\n' "$repo_digests"
          } > training-image-evidence.txt

      - name: Upload training image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-image-evidence
          path: training-image-evidence.txt
          if-no-files-found: error

      - name: Probe packaged non-root runtime
        shell: bash
        run: |
          docker run --rm --entrypoint sh trade-rl-training:ci -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /workspace/var
            python -c "import torch, trade_rl; print(torch.__version__)"
          '

  full-training-capability:
    name: Full training capability gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect training-sensitive changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if test -z "$BASE_SHA" || test "$BASE_SHA" = "0000000000000000000000000000000000000000"; then
            required=true
            changed="<full-history-unavailable>"
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            if printf '%s\n' "$changed" | grep -Eq '^(trade_rl/|tests/|scripts/|examples/|configs/|docker/|pyproject\.toml$|uv\.lock$|\.github/workflows/(ci|full-training-capability-audit)\.yml$)'; then
              required=true
            else
              required=false
            fi
          fi
          printf '%s\n' "$changed" > training-audit-paths.txt
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.changes.outputs.required == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install complete audit dependencies
        if: steps.changes.outputs.required == 'true'
        run: uv sync --extra dev --extra train-sb3 --extra export

      - name: Run full training capability audit
        if: steps.changes.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/training-capability-audit
          uv run python scripts/run_training_capability_audit.py \
            --output var/training-capability-audit \
            2>&1 | tee var/training-capability-audit.log

      - name: Verify full training capability audit
        if: steps.changes.outputs.required == 'true'
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("var/training-capability-audit/audit-report.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "full_training_capability_audit_v1"
          assert len(payload["digest"]) == 64
          for name, record in payload["algorithms"].items():
              assert record["status"] == "pass", (name, record)
              assert record["actual_timesteps"] >= 16
              assert record["checkpoint_count"] >= 1
          for name in (
              "behavior_cloning",
              "exports",
              "replay_resume",
              "residual_controls",
              "sequence",
              "training_resume",
          ):
              assert payload[name]["status"] == "pass", (name, payload[name])
          PY

      - name: Upload full training audit evidence
        if: always() && steps.changes.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-training-capability-gate
          path: |
            training-audit-paths.txt
            var/training-capability-audit
            var/training-capability-audit.log
          if-no-files-found: error
          retention-days: 14
