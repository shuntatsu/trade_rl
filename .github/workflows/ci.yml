name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rebuilt Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Studio frontend
        run: npm ci --prefix frontend --no-audit --no-fund

      - name: Verify Studio frontend
        shell: bash
        run: |
          set -o pipefail
          {
            npm test --prefix frontend -- --run
            npm run typecheck --prefix frontend
            npm run build --prefix frontend
            npm run check:bundle --prefix frontend
          } 2>&1 | tee studio-frontend.log

      - name: Verify Studio fixed viewport layout
        env:
          STUDIO_QA_OUTPUT_DIR: frontend/qa-screenshots
        run: npm run check:layout --prefix frontend

      - name: Upload Studio layout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-layout-diagnostics
          path: |
            studio-frontend.log
            frontend/qa-screenshots
          if-no-files-found: error

      - name: Multiprocessing warning regressions
        run: >-
          uv run pytest -q
          tests/workflows/test_market_walk_forward_normalizer_multiprocessing.py
          tests/rl/test_lagrangian_probe.py::test_parallel_probe_does_not_fork_a_multithreaded_parent
          tests/learning/test_episode_teacher_parallel_chunking.py::test_parallel_teacher_rollout_does_not_fork_a_multithreaded_parent

      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .

      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check --diff . 2>&1 | tee ruff.log

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check --diff . 2>&1 | tee format.log

      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-diagnostics
          path: |
            ruff.log
            format.log
            mypy.log
          if-no-files-found: ignore

      - name: Import architecture
        shell: bash
        run: |
          set -o pipefail
          uv run lint-imports 2>&1 | tee import-linter.log

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-diagnostics
          path: import-linter.log
          if-no-files-found: error

      - name: Dead-code report
        run: uv run vulture trade_rl tests --min-confidence 100

      - name: Recovery and structured serving smoke
        run: >-
          uv run pytest -q
          tests/integrations/test_sb3_training.py::test_backend_resumes_ppo_checkpoint_to_requested_total
          tests/serving/test_sb3_loader.py::test_structured_sb3_loader_rebuilds_native_sequence_observation
          tests/workflows/test_universal_trade_rl_u2_preflight_falsification.py::test_u2_training_source_rejects_fit_grid_not_aligned_to_source_grid
          tests/workflows/test_universal_trade_rl_u2_preflight_falsification.py::test_u2_training_source_exposes_exact_fit_indices
          tests/workflows/test_universal_trade_rl_u2_fit_dataset.py
          tests/rl/test_universal_trade_u2_binding_derivation.py
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_routed_u1_observation_has_explicit_sb3_sequence_adapter
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_u1_sequence_adapter_constructs_and_forwards_exact_u1_observation
          tests/workflows/test_universal_trade_rl_u2_training.py::test_u2_u1_policy_identity_binds_adapter_and_current_weight_location
          tests/workflows/test_universal_trade_rl_u2_training_runtime.py::test_u2_seed_training_plan_binds_contract_source_closure_and_fixed_budget
          tests/workflows/test_universal_trade_rl_u2_training_runtime.py::test_u2_selection_checkpoint_requires_exact_final_fixed_budget

      - name: Tests and coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --cov=trade_rl --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-diagnostics
          path: |
            pytest.log
            coverage.json
          if-no-files-found: ignore

      - name: Critical branch coverage
        run: uv run python .github/check_critical_coverage.py coverage.json pyproject.toml

      - name: Package and uv identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          cli="$(uv run trade-rl --version)"
          uv_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["uv"]["required-version"].removeprefix("=="))')"
          test "$module" = "$expected"
          test "$cli" = "trade-rl $expected"
          test "$(uv --version)" = "uv $uv_version"

  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Compatibility tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/architecture \
            tests/data \
            tests/simulation \
            tests/evaluation \
            tests/serving \
            tests/examples/test_docker_training_assets.py::test_provenance_validation_target_fails_fast_without_valid_arguments \
            tests/operations/test_training_capability_audit.py::test_run_training_capability_audit_preserves_report_contract \
            tests/operations/test_training_capability_audit.py::test_sequence_training_exercises_real_hierarchical_behavior_cloning \
            2>&1 | tee compatibility.log
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.os }}
          path: compatibility.log
          if-no-files-found: error

  training-image:
    name: Training image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build complete training image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -f docker/production.Dockerfile -t trade-rl-ci .

      - name: Record training image identity
        shell: bash
        run: |
          set -euo pipefail
          docker inspect trade-rl-ci --format='{{json .RepoDigests}}' > training-image-digests.json
          docker image inspect trade-rl-ci --format='{{.Id}}' > training-image-id.txt
          test -s training-image-id.txt

      - name: Upload training image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-image-identity
          path: |
            training-image-digests.json
            training-image-id.txt
          if-no-files-found: error

      - name: Probe packaged non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user 65532:65532 --entrypoint /bin/sh trade-rl-ci -lc '
            test -r /app/pyproject.toml
            test -r /app/uv.lock
            trade-rl --version
            python - <<"PY"
          from pathlib import Path
          import trade_rl
          import trade_rl.operations.training_capability_audit as audit
          assert Path(trade_rl.__file__).as_posix().startswith("/app/trade_rl/")
          assert Path(audit.__file__).as_posix().startswith("/app/trade_rl/")
          PY
          '

  full-training-capability:
    name: Full training capability gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Detect training-sensitive changes
        id: training_changes
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "$base" || "$base" = "0000000000000000000000000000000000000000" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base" || true
          if git diff --name-only "$base" "$head" -- \
            trade_rl/rl \
            trade_rl/integrations \
            trade_rl/learning \
            trade_rl/workflows \
            pyproject.toml \
            uv.lock \
            docker/production.Dockerfile \
            docker/training-gpu-smoke.Dockerfile \
            .github/workflows/ci.yml \
            .github/workflows/gpu-training-smoke.yml \
            .github/workflows/cuda-training-smoke.yml \
            .github/workflows/oracle-cuda-smoke.yml \
            .github/workflows/oracle-teacher-benchmark.yml \
            .github/workflows/u2-contracts.yml \
            tests/integrations/test_sb3_* \
            tests/integrations/test_universal_trade_rl_u2_* \
            tests/operations/test_*training* \
            tests/rl/test_*training* \
            tests/rl/test_universal_trade_u2_* \
            tests/workflows/test_universal_trade_rl_u2_* \
            | grep -q .; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.training_changes.outputs.run_full == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install complete audit dependencies
        if: steps.training_changes.outputs.run_full == 'true'
        run: uv sync --extra dev --extra train-sb3

      - name: Run full training capability audit
        if: steps.training_changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m trade_rl.operations.training_capability_audit \
            --mode full \
            --output-json full-training-capability.json \
            --output-junit full-training-capability.junit.xml

      - name: Verify full training capability audit
        if: steps.training_changes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("full-training-capability.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["status"] == "pass", payload
          required = {
              "episode_oracle_teacher",
              "dagger",
              "hierarchical_behavior_cloning",
              "stable_baselines3",
              "sb3_contrib",
          }
          checks = {item["name"]: item for item in payload["checks"]}
          missing = required - checks.keys()
          assert not missing, missing
          for name in required:
              check = checks[name]
              assert check["status"] == "pass", check
              assert check["executed"] is True, check
          PY

      - name: Upload full training audit evidence
        if: always() && steps.training_changes.outputs.run_full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-training-capability
          path: |
            full-training-capability.json
            full-training-capability.junit.xml
          if-no-files-found: error