name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-cursor:
    name: Correct A4 cursor indentation atomically
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head with ancestry
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Create corrected commit and restore CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          cursor_path = Path(
              "trade_rl/workflows/symbol_triplet_training_cursor.py"
          )
          lines = cursor_path.read_text(encoding="utf-8").splitlines()

          messages = (
              "symbol-triplet training stage indices must be contiguous",
              "initial training cursor cannot have a completed stage",
          )
          for message in messages:
              matches = [index for index, line in enumerate(lines) if message in line]
              if len(matches) != 1:
                  raise RuntimeError(
                      f"formatter message target drifted for {message!r}: {matches}"
                  )
              index = matches[0]
              if index == 0 or index + 1 >= len(lines):
                  raise RuntimeError(f"formatter block is incomplete for {message!r}")
              if "raise ValueError(" not in lines[index - 1] or lines[index + 1].strip() != ")":
                  raise RuntimeError(f"formatter block shape drifted for {message!r}")
              base_indent = lines[index - 1][: -len(lines[index - 1].lstrip())]
              lines[index - 1 : index + 2] = [
                  f"{base_indent}raise ValueError(",
                  f'{base_indent}    "{message}"',
                  f"{base_indent})",
              ]
          content = "\n".join(lines) + "\n"

          original_ci = subprocess.check_output(
              ["git", "show", "HEAD^^:.github/workflows/ci.yml"],
              text=True,
          )

          def api(method: str, endpoint: str, payload: object | None = None) -> object:
              url = f"https://api.github.com/repos/{repository}/{endpoint}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request) as response:
                  return json.loads(response.read())

          commit = api("GET", f"git/commits/{head_sha}")
          if not isinstance(commit, dict):
              raise RuntimeError("head commit response is invalid")
          tree = commit.get("tree")
          if not isinstance(tree, dict) or not isinstance(tree.get("sha"), str):
              raise RuntimeError("head tree SHA is missing")

          def create_blob(value: str) -> str:
              result = api(
                  "POST",
                  "git/blobs",
                  {"content": value, "encoding": "utf-8"},
              )
              if not isinstance(result, dict) or not isinstance(result.get("sha"), str):
                  raise RuntimeError("created blob SHA is missing")
              return str(result["sha"])

          new_tree = api(
              "POST",
              "git/trees",
              {
                  "base_tree": tree["sha"],
                  "tree": [
                      {
                          "path": cursor_path.as_posix(),
                          "mode": "100644",
                          "type": "blob",
                          "sha": create_blob(content),
                      },
                      {
                          "path": ".github/workflows/ci.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": create_blob(original_ci),
                      },
                  ],
              },
          )
          if not isinstance(new_tree, dict) or not isinstance(new_tree.get("sha"), str):
              raise RuntimeError("created tree SHA is missing")
          new_commit = api(
              "POST",
              "git/commits",
              {
                  "message": "style: correct symbol-triplet cursor indentation",
                  "parents": [head_sha],
                  "tree": new_tree["sha"],
              },
          )
          if not isinstance(new_commit, dict) or not isinstance(
              new_commit.get("sha"), str
          ):
              raise RuntimeError("created commit SHA is missing")
          api(
              "PATCH",
              f"git/refs/heads/{quote(head_branch, safe='/')}",
              {"force": False, "sha": new_commit["sha"]},
          )
          print(new_commit["sha"])
          PY
