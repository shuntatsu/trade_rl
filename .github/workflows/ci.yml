name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  type-cursor:
    name: Type A4 cursor JSON boundary atomically
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head with parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Create typed commit and restore CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          head_sha = os.environ["HEAD_SHA"]
          head_branch = os.environ["HEAD_BRANCH"]
          cursor_path = Path(
              "trade_rl/workflows/symbol_triplet_training_cursor.py"
          )
          content = cursor_path.read_text(encoding="utf-8")

          replacements = {
              "from typing import Final": "from typing import Final, cast",
              '        manifest_digest=payload["manifest_digest"],': '        manifest_digest=cast(str, payload["manifest_digest"]),',
              '        schedule_identity=payload["schedule_identity"],': '        schedule_identity=cast(str, payload["schedule_identity"]),',
              '        train_cycle_digest=payload["train_cycle_digest"],': '        train_cycle_digest=cast(str, payload["train_cycle_digest"]),',
              '        cycles=payload["cycles"],': '        cycles=cast(int, payload["cycles"]),',
              '        plan_identity=payload["plan_identity"],': '        plan_identity=cast(str, payload["plan_identity"]),',
              '        schema_version=payload["schema_version"],': '        schema_version=cast(str, payload["schema_version"]),',
              '        digest=payload["digest"],': '        digest=cast(str, payload["digest"]),',
              '        plan_digest=payload["plan_digest"],': '        plan_digest=cast(str, payload["plan_digest"]),',
              '        stage_count=payload["stage_count"],': '        stage_count=cast(int, payload["stage_count"]),',
              '        next_stage_index=payload["next_stage_index"],': '        next_stage_index=cast(int, payload["next_stage_index"]),',
              '        last_completed_stage_id=payload["last_completed_stage_id"],': '        last_completed_stage_id=cast(\n            str | None, payload["last_completed_stage_id"]\n        ),',
          }
          for old, new in replacements.items():
              expected = 2 if old == '        schema_version=payload["schema_version"],' or old == '        digest=payload["digest"],' else 1
              if content.count(old) != expected:
                  raise RuntimeError(
                      f"typing patch target drifted for {old!r}: {content.count(old)}"
                  )
              content = content.replace(old, new)

          original_ci = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/ci.yml"],
              text=True,
          )

          def api(method: str, endpoint: str, payload: object | None = None) -> object:
              url = f"https://api.github.com/repos/{repository}/{endpoint}"
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request) as response:
                  return json.loads(response.read())

          commit = api("GET", f"git/commits/{head_sha}")
          if not isinstance(commit, dict):
              raise RuntimeError("head commit response is invalid")
          tree = commit.get("tree")
          if not isinstance(tree, dict) or not isinstance(tree.get("sha"), str):
              raise RuntimeError("head tree SHA is missing")

          def create_blob(value: str) -> str:
              result = api(
                  "POST",
                  "git/blobs",
                  {"content": value, "encoding": "utf-8"},
              )
              if not isinstance(result, dict) or not isinstance(result.get("sha"), str):
                  raise RuntimeError("created blob SHA is missing")
              return str(result["sha"])

          new_tree = api(
              "POST",
              "git/trees",
              {
                  "base_tree": tree["sha"],
                  "tree": [
                      {
                          "path": cursor_path.as_posix(),
                          "mode": "100644",
                          "type": "blob",
                          "sha": create_blob(content),
                      },
                      {
                          "path": ".github/workflows/ci.yml",
                          "mode": "100644",
                          "type": "blob",
                          "sha": create_blob(original_ci),
                      },
                  ],
              },
          )
          if not isinstance(new_tree, dict) or not isinstance(new_tree.get("sha"), str):
              raise RuntimeError("created tree SHA is missing")
          new_commit = api(
              "POST",
              "git/commits",
              {
                  "message": "fix: type symbol-triplet cursor JSON boundary",
                  "parents": [head_sha],
                  "tree": new_tree["sha"],
              },
          )
          if not isinstance(new_commit, dict) or not isinstance(
              new_commit.get("sha"), str
          ):
              raise RuntimeError("created commit SHA is missing")
          api(
              "PATCH",
              f"git/refs/heads/{quote(head_branch, safe='/')}",
              {"force": False, "sha": new_commit["sha"]},
          )
          print(new_commit["sha"])
          PY
