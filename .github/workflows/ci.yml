name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-main:
    name: Sync A4 cursor with main
    if: github.event.pull_request.head.ref == 'agent/stage-a4-triplet-training-cursor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main and restore CI
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "branch already contains main"
            exit 0
          fi
          git merge --no-commit --no-ff origin/main
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git add .github/workflows/ci.yml
          git commit -m "Merge latest main into Stage A4 cursor"
          git push origin "HEAD:${HEAD_BRANCH}"
