name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format_stage_a_zero_shot_fix:
    name: Format Stage A repair
    if: github.head_ref == 'agent/harden-stage-a-zero-shot-evaluation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install focused test dependencies
        run: uv sync --extra dev
      - name: Apply Ruff fixes and verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check . --fix
          uv run ruff format .
          uv run pytest -q \
            tests/evaluation/test_seed_robustness.py \
            tests/evaluation/test_research_gate.py \
            tests/evaluation/test_bootstrap_v2.py \
            tests/evaluation/walk_forward/test_sealed_test.py \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            tests/evaluation/test_stage_a_zero_shot_gate.py \
            tests/evaluation/test_stage_a_zero_shot_hardening.py
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No formatting changes to commit'; exit 1; }
          git commit -m 'Format Stage A zero-shot hardening'
          git push origin HEAD:agent/harden-stage-a-zero-shot-evaluation
