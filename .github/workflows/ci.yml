name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - agent/causal-training-hardening
      - agent/causal-sequence-feature-encoder

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rebuilt Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio frontend
        run: npm ci --prefix studio --no-audit --no-fund

      - name: Verify Studio frontend
        shell: bash
        run: |
          set -o pipefail
          {
            npm test --prefix studio -- --run
            npm run typecheck --prefix studio
            npm run build --prefix studio
          } 2>&1 | tee studio-frontend.log

      - name: Verify Studio fixed viewport layout
        env:
          STUDIO_QA_OUTPUT_DIR: studio/qa-screenshots
        run: npm run check:layout --prefix studio

      - name: Upload Studio layout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-layout-diagnostics
          path: |
            studio-frontend.log
            studio/qa-screenshots
          if-no-files-found: error

      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .

      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check . 2>&1 | tee ruff.log

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check --diff . 2>&1 | tee format.log

      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-diagnostics
          path: |
            ruff.log
            format.log
            mypy.log
          if-no-files-found: ignore

      - name: Import architecture
        shell: bash
        run: |
          set -o pipefail
          uv run lint-imports 2>&1 | tee import-linter.log

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-diagnostics
          path: import-linter.log
          if-no-files-found: error

      - name: Dead-code report
        run: uv run vulture trade_rl tests --min-confidence 100

      - name: Recovery and structured serving smoke
        run: >-
          uv run pytest -q
          tests/integrations/test_sb3_training.py::test_backend_resumes_ppo_checkpoint_to_requested_total
          tests/serving/test_sb3_loader.py::test_structured_sb3_loader_rebuilds_native_sequence_observation

      - name: Tests and coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --cov=trade_rl --cov-branch --cov-report=term-missing --cov-report=json:coverage.json 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-diagnostics
          path: |
            pytest.log
            coverage.json
          if-no-files-found: ignore

      - name: Critical branch coverage
        run: uv run python .github/check_critical_coverage.py coverage.json pyproject.toml

      - name: CLI smoke test
        run: uv run trade-rl --version

  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Compatibility tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q tests/data tests/simulation tests/evaluation tests/serving 2>&1 | tee compatibility.log
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.os }}
          path: compatibility.log
          if-no-files-found: error

  training-image:
    name: Training image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build complete training image
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$commit" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$source_digest" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$lock_digest" \
            --file Dockerfile.training \
            --tag trade-rl-training:ci \
            .

      - name: Record training image identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          image_id="$(docker image inspect --format '{{.Id}}' trade-rl-training:ci)"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' trade-rl-training:ci)"
          {
            printf 'commit_sha=%s\n' "$commit"
            printf 'source_tree_digest=%s\n' "$source_digest"
            printf 'lockfile_digest=%s\n' "$lock_digest"
            printf 'image_id=%s\n' "$image_id"
            printf 'repo_digests=%s\n' "$repo_digests"
          } > training-image-evidence.txt

      - name: Upload training image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-image-evidence
          path: training-image-evidence.txt
          if-no-files-found: error

      - name: Probe packaged non-root runtime
        shell: bash
        run: |
          docker run --rm --entrypoint sh trade-rl-training:ci -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /workspace/var
            python -c "import torch, trade_rl; print(torch.__version__)"
          '

  c3-core-extract:
    name: C3 core extractor
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/causal-scenario-c3-core' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3-core
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Configure git and fetch frozen source
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin "$SOURCE"

      - name: Commit RED tests
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: |
          set -euo pipefail
          files=(
            tests/evaluation/test_causal_scenario_c3.py
            tests/evaluation/test_causal_scenario_c3_adverse.py
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py
            tests/evaluation/test_causal_scenario_c3_adverse_source.py
            tests/evaluation/test_causal_scenario_c3_identity_daily.py
            tests/evaluation/test_causal_scenario_c3_perfect_information.py
            tests/evaluation/test_causal_scenario_c3_plan_closure.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done
          git add "${files[@]}"
          git commit -m "test: define causal scenario C3 core contracts"

      - name: Install test environment
        run: uv sync --extra dev --extra train-sb3

      - name: Verify RED
        run: |
          set +e
          uv run pytest \
            tests/evaluation/test_causal_scenario_c3.py \
            tests/evaluation/test_causal_scenario_c3_adverse.py \
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py \
            tests/evaluation/test_causal_scenario_c3_adverse_source.py \
            tests/evaluation/test_causal_scenario_c3_identity_daily.py \
            tests/evaluation/test_causal_scenario_c3_perfect_information.py \
            tests/evaluation/test_causal_scenario_c3_plan_closure.py \
            -q 2>&1 | tee c3-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "C3 RED tests unexpectedly passed before production modules existed" >&2
            exit 1
          fi
          echo "RED verified"

      - name: Add GREEN implementation
        env:
          SOURCE: dca996d89d5ac08cd8c9dae7c6ad79fd98b66538
        run: |
          set -euo pipefail
          files=(
            trade_rl/evaluation/bootstrap.py
            trade_rl/evaluation/__init__.py
            trade_rl/evaluation/causal_scenario_c3_contracts.py
            trade_rl/evaluation/causal_scenario_c3_prediction.py
            trade_rl/evaluation/causal_scenario_c3_decision_artifact.py
            trade_rl/evaluation/causal_scenario_c3_runner.py
            trade_rl/evaluation/causal_scenario_c3_perfect_information.py
            trade_rl/evaluation/causal_scenario_c3_adverse_source.py
            trade_rl/evaluation/causal_scenario_c3_adverse.py
            trade_rl/evaluation/causal_scenario_c3_report.py
            trade_rl/evaluation/causal_scenario_c3_artifact.py
            trade_rl/evaluation/causal_scenario_c3_gate.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$SOURCE:$path" > "$path"
          done

      - name: Focused C3 tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/evaluation/test_causal_scenario_c3.py \
            tests/evaluation/test_causal_scenario_c3_adverse.py \
            tests/evaluation/test_causal_scenario_c3_adverse_report_binding.py \
            tests/evaluation/test_causal_scenario_c3_adverse_source.py \
            tests/evaluation/test_causal_scenario_c3_identity_daily.py \
            tests/evaluation/test_causal_scenario_c3_perfect_information.py \
            tests/evaluation/test_causal_scenario_c3_plan_closure.py \
            -q 2>&1 | tee c3-pytest.log

      - name: C3 Ruff
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check trade_rl/evaluation/bootstrap.py trade_rl/evaluation/__init__.py trade_rl/evaluation/causal_scenario_c3_*.py tests/evaluation/test_causal_scenario_c3*.py 2>&1 | tee c3-ruff.log

      - name: C3 Format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check trade_rl/evaluation/bootstrap.py trade_rl/evaluation/__init__.py trade_rl/evaluation/causal_scenario_c3_*.py tests/evaluation/test_causal_scenario_c3*.py 2>&1 | tee c3-format.log

      - name: C3 Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy trade_rl/evaluation/bootstrap.py trade_rl/evaluation/causal_scenario_c3_*.py 2>&1 | tee c3-mypy.log

      - name: Upload C3 extractor diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-core-extractor-diagnostics
          path: |
            c3-red.log
            c3-pytest.log
            c3-ruff.log
            c3-format.log
            c3-mypy.log
          if-no-files-found: ignore

      - name: Restore CI, remove temporary extractor, commit, and push
        run: |
          set -euo pipefail
          git add trade_rl/evaluation tests/evaluation
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/c3-core-extractor.yml
          git add .github/workflows/ci.yml
          git commit -m "feat: add causal scenario C3 evaluation core [c3-core-extracted]"
          git push origin HEAD:agent/causal-scenario-c3-core
