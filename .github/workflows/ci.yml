name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-cursor:
    name: Format A4 cursor and restore CI
    if: github.event.pull_request.head.ref == 'agent/stage-a4-triplet-training-cursor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head with parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Format cursor and restore workflow
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format trade_rl/workflows/symbol_triplet_training_cursor.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/symbol_triplet_training_cursor.py .github/workflows/ci.yml
          git commit -m "style: format symbol-triplet training cursor"
          git push origin "HEAD:${HEAD_BRANCH}"
