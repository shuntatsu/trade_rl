name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lean Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: >-
          uv run ruff check
          trade_rl/artifacts trade_rl/domain trade_rl/data trade_rl/risk
          trade_rl/simulation trade_rl/evaluation trade_rl/strategies
          trade_rl/integrations
          tests/artifacts tests/data tests/risk tests/simulation
          tests/evaluation tests/strategies tests/integrations

      - name: Format diff
        run: uv run ruff format --diff trade_rl/strategies/supervised.py

      - name: Format
        run: >-
          uv run ruff format --check
          trade_rl/artifacts trade_rl/domain trade_rl/data trade_rl/risk
          trade_rl/simulation trade_rl/evaluation trade_rl/strategies
          trade_rl/integrations
          tests/artifacts tests/data tests/risk tests/simulation
          tests/evaluation tests/strategies tests/integrations

      - name: Mypy
        run: >-
          uv run mypy
          trade_rl/artifacts trade_rl/domain trade_rl/data trade_rl/risk
          trade_rl/simulation trade_rl/evaluation trade_rl/strategies
          trade_rl/integrations

      - name: Core tests
        run: >-
          uv run pytest -q
          tests/artifacts
          tests/data
          tests/risk
          tests/simulation
          tests/evaluation
          tests/strategies
          tests/integrations

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"
