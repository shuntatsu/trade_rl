name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fix_stage_a_mypy:
    name: Fix Stage A MyPy boundary
    if: github.head_ref == 'agent/harden-stage-a-zero-shot-evaluation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install full CI dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Apply type-boundary fix and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/evaluation/_stage_a_zero_shot_plan.py')
          text = path.read_text(encoding='utf-8')
          loop_token = 'for field, value in normalized_finite.items():'
          assignment_token = 'object.__setattr__(self, field, value)'
          if text.count(loop_token) != 1 or text.count(assignment_token) != 1:
              raise SystemExit('MyPy variable-boundary tokens did not match exactly once')
          text = text.replace(
              loop_token,
              'for field, numeric_value in normalized_finite.items():',
          ).replace(
              assignment_token,
              'object.__setattr__(self, field, numeric_value)',
          )
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run pytest -q \
            tests/evaluation/test_seed_robustness.py \
            tests/evaluation/test_research_gate.py \
            tests/evaluation/test_bootstrap_v2.py \
            tests/evaluation/walk_forward/test_sealed_test.py \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            tests/evaluation/test_stage_a_zero_shot_gate.py \
            tests/evaluation/test_stage_a_zero_shot_hardening.py
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No type fix to commit'; exit 1; }
          git commit -m 'Fix Stage A plan threshold typing'
          git push origin HEAD:agent/harden-stage-a-zero-shot-evaluation
