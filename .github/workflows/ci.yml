name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - agent/causal-training-hardening
      - agent/causal-sequence-feature-encoder

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-contract-update:
    name: PR229 domain contract update
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/constrained-policy-report'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/constrained-policy-report
          persist-credentials: true
          fetch-depth: 0

      - name: Move constraint metadata to domain boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          environment_path = Path('trade_rl/rl/environment_constraints.py')
          environment = environment_path.read_text(encoding='utf-8')
          old_environment = '''import numpy as np

_TOLERANCE = 1e-12
CONSTRAINT_COST_NAMES = (
    "drawdown_excess",
    "drawdown_stop_event",
    "margin_deficit_fraction",
    "forced_liquidation_event",
    "gross_exposure_request_excess",
    "daily_turnover",
    "execution_cost_fraction",
)
'''
          new_environment = '''import numpy as np

from trade_rl.domain.constraint_contracts import CONSTRAINT_COST_NAMES

_TOLERANCE = 1e-12
'''
          if environment.count(old_environment) != 1:
              raise SystemExit('environment constraint block did not match exactly once')
          environment_path.write_text(
              environment.replace(old_environment, new_environment),
              encoding='utf-8',
          )

          statistics_path = Path('trade_rl/rl/lagrangian_statistics.py')
          statistics = statistics_path.read_text(encoding='utf-8')
          statistics = statistics.replace('from enum import Enum\n', '')
          old_statistics_import = (
              'from trade_rl.artifacts.hashing import content_digest\n'
              'from trade_rl.rl.environment_constraints import CONSTRAINT_COST_NAMES\n'
              'from trade_rl.rl.lagrangian_episode import EpisodeCompletionKind\n'
          )
          new_statistics_import = (
              'from trade_rl.artifacts.hashing import content_digest\n'
              'from trade_rl.domain.constraint_contracts import (\n'
              '    CONSTRAINT_COST_NAMES,\n'
              '    ConstraintAggregation,\n'
              '    canonical_constraint_aggregation,\n'
              '    canonical_constraint_unit,\n'
              '    validate_constraint_name as _validate_constraint_name,\n'
              ')\n'
              'from trade_rl.rl.lagrangian_episode import EpisodeCompletionKind\n'
          )
          if statistics.count(old_statistics_import) != 1:
              raise SystemExit('lagrangian statistics import block did not match exactly once')
          statistics = statistics.replace(old_statistics_import, new_statistics_import)
          start_marker = 'class ConstraintAggregation(str, Enum):\n'
          end_marker = '@dataclass(frozen=True, slots=True)\nclass LagrangianConstraintSpec:'
          if statistics.count(start_marker) != 1 or statistics.count(end_marker) != 1:
              raise SystemExit('lagrangian metadata block markers are not unique')
          start = statistics.index(start_marker)
          end = statistics.index(end_marker)
          statistics = statistics[:start] + statistics[end:]
          statistics_path.write_text(statistics, encoding='utf-8')

          report_path = Path('trade_rl/evaluation/constrained_policy_report.py')
          report = report_path.read_text(encoding='utf-8')
          old_report_import = '''from trade_rl.artifacts.hashing import content_digest
from trade_rl.rl.environment_constraints import CONSTRAINT_COST_NAMES
from trade_rl.rl.lagrangian_statistics import (
    canonical_constraint_aggregation,
    canonical_constraint_unit,
)
'''
          new_report_import = '''from trade_rl.artifacts.hashing import content_digest
from trade_rl.domain.constraint_contracts import (
    CONSTRAINT_COST_NAMES,
    canonical_constraint_aggregation,
    canonical_constraint_unit,
)
'''
          if report.count(old_report_import) != 1:
              raise SystemExit('report import block did not match exactly once')
          report_path.write_text(
              report.replace(old_report_import, new_report_import),
              encoding='utf-8',
          )
          PY

      - name: Restore workflows and commit migration
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/pr229-domain-contract-updater.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml \
                  .github/workflows/pr229-domain-contract-updater.yml \
                  trade_rl/rl/environment_constraints.py \
                  trade_rl/rl/lagrangian_statistics.py \
                  trade_rl/evaluation/constrained_policy_report.py
          git commit -m "refactor: move constraint metadata to domain boundary"
          git push origin HEAD:agent/constrained-policy-report

  quality:
    name: Rebuilt Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio frontend
        run: npm ci --prefix studio --no-audit --no-fund

      - name: Verify Studio frontend
        shell: bash
        run: |
          set -o pipefail
          {
            npm test --prefix studio -- --run
            npm run typecheck --prefix studio
            npm run build --prefix studio
          } 2>&1 | tee studio-frontend.log

      - name: Verify Studio fixed viewport layout
        env:
          STUDIO_QA_OUTPUT_DIR: studio/qa-screenshots
        run: npm run check:layout --prefix studio

      - name: Upload Studio layout diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-layout-diagnostics
          path: |
            studio-frontend.log
            studio/qa-screenshots
          if-no-files-found: error

      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .

      - name: Ruff
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check . 2>&1 | tee ruff.log

      - name: Format
        shell: bash
        run: |
          set -o pipefail
          uv run ruff format --check --diff . 2>&1 | tee format.log

      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-diagnostics
          path: |
            ruff.log
            format.log
            mypy.log
          if-no-files-found: ignore

      - name: Import architecture
        shell: bash
        run: |
          set -o pipefail
          uv run lint-imports 2>&1 | tee import-linter.log

      - name: Upload architecture diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-diagnostics
          path: import-linter.log
          if-no-files-found: error

      - name: Dead-code report
        run: uv run vulture trade_rl tests --min-confidence 100

      - name: Recovery and structured serving smoke
        run: >-
          uv run pytest -q
          tests/integrations/test_sb3_training.py::test_backend_resumes_ppo_checkpoint_to_requested_total
          tests/serving/test_sb3_loader.py::test_structured_sb3_loader_rebuilds_native_sequence_observation

      - name: Tests and coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --cov=trade_rl --cov-branch --cov-report=term-missing --cov-report=json:coverage.json 2>&1 | tee pytest.log

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pytest-diagnostics
          path: |
            pytest.log
            coverage.json
          if-no-files-found: ignore

      - name: Critical branch coverage
        run: uv run python .github/check_critical_coverage.py coverage.json pyproject.toml

      - name: CLI smoke test
        run: uv run trade-rl --version

  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Compatibility tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q tests/data tests/simulation tests/evaluation tests/serving 2>&1 | tee compatibility.log
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ matrix.os }}
          path: compatibility.log
          if-no-files-found: error

  training-image:
    name: Training image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build complete training image
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$commit" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$source_digest" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$lock_digest" \
            --file Dockerfile.training \
            --tag trade-rl-training:ci \
            .

      - name: Record training image identity
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          image_id="$(docker image inspect --format '{{.Id}}' trade-rl-training:ci)"
          repo_digests="$(docker image inspect --format '{{json .RepoDigests}}' trade-rl-training:ci)"
          {
            printf 'commit_sha=%s\n' "$commit"
            printf 'source_tree_digest=%s\n' "$source_digest"
            printf 'lockfile_digest=%s\n' "$lock_digest"
            printf 'image_id=%s\n' "$image_id"
            printf 'repo_digests=%s\n' "$repo_digests"
          } > training-image-evidence.txt

      - name: Upload training image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-image-evidence
          path: training-image-evidence.txt
          if-no-files-found: error

      - name: Probe packaged non-root runtime
        shell: bash
        run: |
          docker run --rm --entrypoint sh trade-rl-training:ci -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /workspace/var
            python -c "import torch, trade_rl; print(torch.__version__)"
          '
