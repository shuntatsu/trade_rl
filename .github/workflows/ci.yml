name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-cursor-integrity-order:
    name: Fix A4 cursor integrity order
    if: github.event.pull_request.head.ref == 'agent/stage-a4-triplet-training-cursor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head with parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Move cursor digest validation before semantic validation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/symbol_triplet_training_cursor.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          class_index = lines.index("class SymbolTripletTrainingCursor:")
          digest_index = lines.index(
              "        expected_digest = content_digest(self.digest_payload())",
              class_index,
          )
          expected_block = [
              "        expected_digest = content_digest(self.digest_payload())",
              "        if self.digest and self.digest != expected_digest:",
              '            raise ValueError("symbol-triplet training cursor digest mismatch")',
          ]
          if lines[digest_index : digest_index + 3] != expected_block:
              raise RuntimeError("cursor digest validation block drifted")
          del lines[digest_index : digest_index + 3]
          insert_index = lines.index(
              '        require_sha256(self.plan_digest, field="training_cursor.plan_digest")',
              class_index,
          )
          lines[insert_index:insert_index] = expected_block
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          uv run ruff format trade_rl/workflows/symbol_triplet_training_cursor.py
          uv run ruff check trade_rl/workflows/symbol_triplet_training_cursor.py tests/workflows/test_symbol_triplet_training_cursor.py
          uv run pytest -q tests/workflows/test_symbol_triplet_training_cursor.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/symbol_triplet_training_cursor.py .github/workflows/ci.yml
          git commit -m "fix: validate triplet cursor integrity before semantics"
          git push origin "HEAD:${HEAD_BRANCH}"
