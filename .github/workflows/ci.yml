name: CI

on:
  push:
    branches-ignore:
      - provenance/branch-retention
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'codex/**'
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast Push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check trade_rl tests tools

      - name: Format
        run: uv run ruff format --check trade_rl tests tools

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py tools/independent_research_review.py

      - name: Research transport types
        run: uv run mypy tools/ppo_checkpoint_actions.py tools/ppo_4h_indicator_smoke_actions.py tools/ppo_4h_gemini_review.py tools/ppo_normalization_actions.py

      - name: Install gated 4h smoke PPO runtime
        if: "github.ref == 'refs/heads/research/ppo-4h-indicator-smoke' && github.event.head_commit.message == 'run: execute 4h PPO indicator smoke'"
        run: uv sync --locked --extra train-sb3

      - name: Execute authenticated 4h PPO smoke
        if: "github.ref == 'refs/heads/research/ppo-4h-indicator-smoke' && github.event.head_commit.message == 'run: execute 4h PPO indicator smoke'"
        id: indicator-smoke
        continue-on-error: true
        env:
          SMOKE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_OUTPUT: output/smoke
        run: uv run --no-sync python -m tools.ppo_4h_indicator_smoke_actions

      - name: Upload 4h smoke evidence
        if: "always() && github.ref == 'refs/heads/research/ppo-4h-indicator-smoke' && github.event.head_commit.message == 'run: execute 4h PPO indicator smoke'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-4h-indicator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/smoke
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          overwrite: false

      - name: Propagate 4h smoke failure after evidence upload
        if: "always() && github.ref == 'refs/heads/research/ppo-4h-indicator-smoke' && github.event.head_commit.message == 'run: execute 4h PPO indicator smoke'"
        env:
          SMOKE_OUTCOME: ${{ steps.indicator-smoke.outcome }}
        run: |
          if [[ "$SMOKE_OUTCOME" != "success" ]]; then
            echo "4h PPO smoke failed; inspect the uploaded evidence."
            exit 1
          fi

  core:
    name: Lean Core${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata-only)' || '' }}
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) &&
      (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'codex/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check trade_rl tests tools

      - name: Format
        run: uv run ruff format --check trade_rl tests tools

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py tools/independent_research_review.py

      - name: Research transport types
        run: uv run mypy tools/ppo_checkpoint_actions.py tools/ppo_4h_indicator_smoke_actions.py tools/ppo_4h_gemini_review.py tools/ppo_normalization_actions.py

      - name: Core tests
        run: uv run pytest -q tests

      - name: Build
        run: uv build

      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl

      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          activation_sha="$(uv run python -c 'from hashlib import sha256; from pathlib import Path; print(sha256(Path("trade_rl/evaluation/ppo_normalization_activation.json").read_bytes()).hexdigest())')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" "$activation_sha" <<'PY'
          import json
          import sys
          from hashlib import sha256
          from importlib.metadata import version
          from importlib.resources import files
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          activation = files("trade_rl.evaluation").joinpath("ppo_normalization_activation.json")
          raw = activation.read_bytes()
          payload = json.loads(raw)
          assert sha256(raw).hexdigest() == sys.argv[2]
          assert set(payload) == {"schema", "activation_sha256"}
          assert payload["schema"] == "ppo_normalization_execution_activation_authority_v1"
          assert payload["activation_sha256"] is None
          assert json.dumps(
              payload,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=False,
              allow_nan=False,
          ).encode("utf-8") == raw
          print("clean installed core public imports, activation resource, and identity: OK")
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"


  ppo-runtime:
    name: PPO Runtime${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata-only)' || '' }}
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) &&
      (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'codex/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install PPO runtime
        run: uv sync --extra dev --extra train-sb3

      - name: Real SB3 PPO integration
        run: uv run pytest -q tests/strategies/test_ppo_*.py tests/strategies/test_a2c_*.py tests/integrations/test_ppo_sb3_runtime.py tests/integrations/test_a2c_sb3_runtime.py tests/integrations/test_allocation_ppo_runtime.py tests/integrations/test_allocation_schedule_ppo_runtime.py tests/integrations/test_allocation_policy_admission_runtime.py tests/integrations/test_allocation_sealed_policy_runtime.py

  guide:
    name: Human Guide${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata-only)' || '' }}
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) &&
      (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'codex/'))
    runs-on: ubuntu-latest
    env:
      GUIDE_SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: guide/package-lock.json

      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci

      - name: Guide source contract
        working-directory: guide
        run: npm run source-check

      - name: Guide lint
        working-directory: guide
        run: npm run lint

      - name: Guide typecheck
        working-directory: guide
        run: npm run typecheck

      - name: Guide unit tests
        working-directory: guide
        run: npm run test

      - name: Guide build
        working-directory: guide
        run: npm run build

      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium

      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e

      - name: Upload Guide browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: human-guide-browser-${{ github.run_id }}
          path: |
            guide/test-results/
            guide/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  independent-review:
    name: Generic Independent Research Review${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata-only)' || '' }}
    needs: [core, ppo-runtime, guide]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.head.ref != 'research/ppo-4h-indicator-smoke'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Require comprehensive verification
        env:
          CORE_RESULT: ${{ needs.core.result }}
          PPO_RESULT: ${{ needs.ppo-runtime.result }}
          GUIDE_RESULT: ${{ needs.guide.result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = "success"
          test "$PPO_RESULT" = "success"
          test "$GUIDE_RESULT" = "success"

      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"

      - name: Fetch pull request review evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PULL_JSON="$RUNNER_TEMP/pull-request.json"
          REVIEWS_JSON="$RUNNER_TEMP/pull-request-reviews.json"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "$PULL_JSON"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            | jq -s 'add' > "$REVIEWS_JSON"

      - name: Evaluate exact-head independent research review
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PULL_JSON="$RUNNER_TEMP/pull-request.json"
          REVIEWS_JSON="$RUNNER_TEMP/pull-request-reviews.json"
          OUTCOME=$(env -u GITHUB_TOKEN -u GH_TOKEN uv run --no-project --python 3.12 python \
            tools/independent_research_review.py \
            --pull-json "$PULL_JSON" \
            --reviews-json "$REVIEWS_JSON" \
            --expected-head "$HEAD_SHA")

          if [ "$OUTCOME" = "APPROVED" ]; then
            echo "# Independent Research Review" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**READY / APPROVED** for exact HEAD \`${HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Independent research review audit passed."
            exit 0
          elif [ "$OUTCOME" = "BLOCKED" ]; then
            echo "# Independent Research Review" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**BLOCKED** for exact HEAD \`${HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Review audit identified blocking findings. Please resolve before merge."
            exit 1
          elif [ "$OUTCOME" = "PENDING" ]; then
            echo "# Independent Research Review" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**PENDING** for exact HEAD \`${HEAD_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Independent research review audit is pending."
            exit 1
          else
            echo "Unrecognized review outcome: ${OUTCOME}" >&2
            exit 1
          fi

  ppo-4h-independent-review:
    name: Independent Research Review${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata-only)' || '' }}
    needs: [core, ppo-runtime, guide]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) &&
      github.event.pull_request.head.ref == 'research/ppo-4h-indicator-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Require comprehensive verification
        env:
          CORE_RESULT: ${{ needs.core.result }}
          PPO_RESULT: ${{ needs.ppo-runtime.result }}
          GUIDE_RESULT: ${{ needs.guide.result }}
        run: |
          set -euo pipefail
          test "$CORE_RESULT" = "success"
          test "$PPO_RESULT" = "success"
          test "$GUIDE_RESULT" = "success"

      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install review-status runtime
        run: uv sync --extra dev

      - name: Evaluate exact-head independent research review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m tools.ppo_4h_indicator_smoke_actions review-status
