name: Cleanup merged branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write

jobs:
  delete-merged-branches:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only verified merged branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches=(
            "codex/causal-alpha-v3-real-checkpoint"
            "codex/causal-alpha-v3-research"
            "codex/causal-alpha-v3-runner"
            "codex/causal-alpha-v3-runner-red"
            "codex/causal-alpha-v3-runner-tdd"
            "codex/universal-real-data-training"
            "codex/universal-real-data-training-preserve"
          )

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for branch in "${branches[@]}"; do
            http_code="$(
              curl --silent --show-error \
                --output "$response_file" \
                --write-out "%{http_code}" \
                --request DELETE \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            )"

            case "$http_code" in
              204)
                echo "Deleted ${branch}"
                ;;
              404)
                echo "Already absent: ${branch}"
                ;;
              *)
                echo "Failed to delete ${branch}; HTTP ${http_code}" >&2
                cat "$response_file" >&2
                exit 1
                ;;
            esac
          done
