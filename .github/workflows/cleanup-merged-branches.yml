name: Cleanup merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'branch-cleanup-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify containment and delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            'codex/v10-execution-lifecycle-hardening'
            'codex/replay-diagnostics-correctness-final'
          )
          for branch in "${branches[@]}"; do
            ref="refs/remotes/origin/${branch}"
            git show-ref --verify --quiet "${ref}"
            git merge-base --is-ancestor "${ref}" HEAD
          done
          git push origin --delete "${branches[@]}"
      - name: Remove cleanup helper and restore final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/merged-branch-cleanup-trigger.txt
          rm -f .github/workflows/cleanup-merged-branches.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove merged branch cleanup helper'
          git push origin HEAD:main
