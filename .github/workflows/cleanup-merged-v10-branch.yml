name: Cleanup Merged V10 Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify merge containment and delete feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAIN_BRANCH: main
          FEATURE_BRANCH: codex/v10-execution-contract
          PR_NUMBER: "423"
          EXPECTED_FEATURE_SHA: 999c547e953d319cfb04492ec4b9d075f6b06e01
        shell: bash
        run: |
          set -euo pipefail

          merged="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')"
          pr_head_ref="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref')"
          pr_head_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          feature_sha="$(gh api "repos/$REPO/branches/${FEATURE_BRANCH//\//%2F}" --jq '.commit.sha')"
          main_sha="$(gh api "repos/$REPO/branches/$MAIN_BRANCH" --jq '.commit.sha')"

          test "$merged" = "true"
          test "$pr_head_ref" = "$FEATURE_BRANCH"
          test "$pr_head_sha" = "$EXPECTED_FEATURE_SHA"
          test "$feature_sha" = "$EXPECTED_FEATURE_SHA"

          compare_json="$(gh api "repos/$REPO/compare/$feature_sha...$main_sha")"
          merge_base="$(jq -r '.merge_base_commit.sha' <<<"$compare_json")"
          behind_by="$(jq -r '.behind_by' <<<"$compare_json")"
          status="$(jq -r '.status' <<<"$compare_json")"
          echo "CONTAINMENT feature=$feature_sha main=$main_sha status=$status behind=$behind_by merge_base=$merge_base"
          test "$merge_base" = "$feature_sha"
          test "$behind_by" = "0"

          owner="${REPO%%/*}"
          open_pr_count="$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$owner:$FEATURE_BRANCH" --jq 'length')"
          test "$open_pr_count" = "0"

          encoded="${FEATURE_BRANCH//\//%2F}"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$encoded"
          echo "DELETED $FEATURE_BRANCH"

          mapfile -t remaining < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          printf 'REMAINING %s\n' "${remaining[@]}"
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = "$MAIN_BRANCH"
