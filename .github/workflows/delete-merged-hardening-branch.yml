name: Delete merged hardening branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete:
    if: github.head_ref == 'agent/fix-export-tracer-warnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Delete merged branch
        run: |
          set -euo pipefail
          git push origin --delete agent/harden-data-bc-serving-contracts
          if git ls-remote --exit-code --heads origin agent/harden-data-bc-serving-contracts; then
            echo 'merged branch still exists' >&2
            exit 1
          fi
