name: One-shot training config v4 migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply schema migration
        run: |
          python .github/scripts/apply_training_config_v4.py
          mkdir -p test_support
          printf '%s\n' '"""Repository-local helpers shared by test modules."""' > test_support/__init__.py
          mv tests/training_config_support.py test_support/training_config.py
          grep -rl 'from tests.training_config_support import' tests \
            | xargs sed -i 's/from tests\.training_config_support import/from test_support.training_config import/'
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          marker = '[tool.pytest.ini_options]\ntestpaths = ["tests"]\n'
          replacement = (
              '[tool.pytest.ini_options]\n'
              'testpaths = ["tests"]\n'
              'pythonpath = ["."]\n'
          )
          if marker not in text:
              raise SystemExit("pytest configuration marker not found")
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Install targeted test environment
        run: uv sync --extra dev --extra train-sb3
      - name: Format and lint migrated tree
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          git diff --check
      - name: Verify migrated contracts
        run: |
          uv run pytest -q \
            tests/workflows/test_training_config_explicit_semantics.py \
            tests/workflows/test_training_run_config.py \
            tests/workflows/test_training_preroll_contract.py \
            tests/workflows/test_training_run.py \
            tests/workflows/test_market_walk_forward.py \
            tests/test_current_documentation_contract.py \
            tests/test_maintained_documentation_v4_contract.py
      - name: Verify maintained JSON configs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = {
              "fee_rate", "maker_fee_rate", "taker_fee_rate", "spread_rate",
              "impact_rate", "multiplier", "max_participation_rate",
              "slippage_std", "tail_slippage_probability",
              "tail_slippage_multiplier", "random_seed", "minimum_notional",
              "lot_size", "tick_size", "allow_short", "borrow_rate_multiplier",
              "max_leverage", "maintenance_margin_rate", "collateral_haircut",
              "margin_mode", "order_latency_bars", "order_type",
              "limit_offset_rate", "path_mode", "processing_bar_volume_capacity",
              "partial_fill_carry", "trigger_volume_fractions",
          }
          seen = 0

          def visit(value, path):
              global seen
              if isinstance(value, dict):
                  if value.get("schema_version") == "training_run_config_v4":
                      assert set(value["execution"]) == required, path
                      assert value["environment"]["require_full_reward_preroll"] is True, path
                      seen += 1
                  for child in value.values():
                      visit(child, path)
              elif isinstance(value, list):
                  for child in value:
                      visit(child, path)

          for path in Path("examples").rglob("*.json"):
              visit(json.loads(path.read_text()), path)
          assert seen == 20, seen
          PY
      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require explicit training execution semantics"
          git push origin HEAD:${{ github.head_ref }}
