name: Diagnose teacher admission pytest temporary

on:
  push:
    branches:
      - codex/fix-causal-alpha-v3-signal-scope-contract

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior pytest diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31901840075 --repo shuntatsu/trade_rl --name pytest-diagnostics --dir diagnostics
      - name: Surface concise failure details
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          log = Path("diagnostics/pytest.log").read_text(encoding="utf-8", errors="replace")
          print(log[-40000:])

          def emit(title: str, message: str) -> None:
              compact = " | ".join(part.strip() for part in message.splitlines() if part.strip())
              safe = compact[:12000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title={title}::{safe}")

          summaries = re.findall(r"^(?:FAILED|ERROR)\s+.+$", log, flags=re.MULTILINE)
          if summaries:
              for line in summaries:
                  emit("Failed pytest node", line)
          else:
              emit("No pytest node summary found", log[-8000:])

          sections = re.split(r"(?m)^_{3,}\s+(.+?)\s+_{3,}\s*$", log)
          for index in range(1, len(sections), 2):
              name = sections[index]
              body = sections[index + 1]
              if "FAILED" in body or re.search(r"(?m)^E\s+", body):
                  error_lines = [
                      line for line in body.splitlines()
                      if line.startswith("E ") or line.startswith("E       ")
                  ]
                  context = "\n".join(error_lines[-20:]) if error_lines else body[-5000:]
                  emit(f"Failure detail: {name}", context)
          PY
