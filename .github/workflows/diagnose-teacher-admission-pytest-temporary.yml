name: Diagnose teacher admission pytest temporary

on:
  push:
    branches:
      - codex/fix-causal-alpha-v3-signal-scope-contract

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download prior pytest diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31901840075 --repo shuntatsu/trade_rl --name pytest-diagnostics --dir diagnostics
      - name: Surface failure details
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path("diagnostics/pytest.log").read_text(encoding="utf-8", errors="replace")
          failure = re.search(r"={3,} FAILURES ={3,}.*?(?=={3,} short test summary info ={3,}|\Z)", log, re.S | re.I)
          summary = re.search(r"={3,} short test summary info ={3,}.*\Z", log, re.S | re.I)
          text = ""
          if failure:
              text += failure.group(0)
          if summary:
              text += "\n" + summary.group(0)
          if not text:
              text = log[-20000:]
          text = text[-30000:]
          print(text)
          for raw in text.splitlines():
              line = raw.strip()
              if not line:
                  continue
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error title=Prior full pytest failure::{safe}")
          PY
