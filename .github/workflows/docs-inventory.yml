name: Documentation Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "README*.md"
      - "START.md"
      - "docs/**"
      - "studio/README.md"
      - "tests/test_current_documentation_contract.py"
      - ".github/workflows/docs-inventory.yml"

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build documentation inventory and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/docs-inventory var/docs-source
          find . -type f \( -name '*.md' -o -name '*.mdx' \) \
            -not -path './.git/*' -not -path './.venv/*' -not -path './node_modules/*' \
            -printf '%P\n' | sort > var/docs-inventory/files.txt
          while IFS= read -r file; do
            printf '%s\t%s\t%s\n' "$file" "$(wc -l < "$file")" "$(wc -c < "$file")"
          done < var/docs-inventory/files.txt > var/docs-inventory/sizes.tsv
          grep -RInE 'training_run_config_v1|sequence_encoder|asset_set_encoder|sequence_attention_heads|sequence_attention_layers|README\.ja\.md|Production status:.*GO|production[- ]ready' \
            --include='*.md' --include='*.mdx' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            > var/docs-inventory/stale-terms.txt || true
          python - <<'PY'
          from __future__ import annotations
          import pathlib, re
          root = pathlib.Path('.')
          files = [pathlib.Path(line.strip()) for line in pathlib.Path('var/docs-inventory/files.txt').read_text().splitlines() if line.strip()]
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          broken=[]
          for file in files:
              text=file.read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  target=raw.split('#',1)[0].strip()
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  path=(file.parent/target).resolve()
                  try:
                      path.relative_to(root.resolve())
                  except ValueError:
                      broken.append(f'{file}: escapes repository: {raw}')
                      continue
                  if not path.exists():
                      broken.append(f'{file}: missing: {raw}')
          pathlib.Path('var/docs-inventory/broken-links.txt').write_text('\n'.join(broken)+('\n' if broken else ''), encoding='utf-8')
          PY
          tar -czf var/docs-source/docs-source.tar.gz \
            README.md README.ja.md START.md docs studio/README.md \
            tests/test_current_documentation_contract.py .importlinter \
            trade_rl/rl/training.py trade_rl/rl/sequence_policy.py \
            trade_rl/rl/sequence_diagnostics.py trade_rl/rl/structured_export.py \
            trade_rl/rl/observations.py trade_rl/rl/policy_identity.py \
            trade_rl/serving/bundle.py trade_rl/serving/structured_policy.py \
            trade_rl/workflows/training_run.py \
            examples/quickstart/training.json \
            examples/binance-multitimeframe/training-full.json
      - name: Capture branch tree and finalizer state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/docs-readability-refresh" --jq '.object.sha')"
          tree_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${branch_sha}" --jq '.tree.sha')"
          printf '%s\n' "$branch_sha" > var/docs-inventory/branch-head-sha.txt
          printf '%s\n' "$tree_sha" > var/docs-inventory/branch-tree-sha.txt
          workflow_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
              --jq '.workflows[] | select(.path == ".github/workflows/finalize-docs-readability-refresh.yml") | .id' \
              | head -n 1
          )"
          printf '%s\n' "$workflow_id" > var/docs-inventory/finalizer-workflow-id.txt
          if [[ -z "$workflow_id" ]]; then
            printf '{"workflow_found":false}\n' > var/docs-inventory/finalizer-runs.json
            exit 0
          fi
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?branch=agent/docs-readability-refresh&per_page=20" \
            --jq '{workflow_found:true,total_count,runs:[.workflow_runs[]|{id,event,status,conclusion,head_sha,actor:.actor.login,run_number,created_at,updated_at}]}' \
            > var/docs-inventory/finalizer-runs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-inventory-${{ github.run_id }}
          path: |
            var/docs-inventory
            var/docs-source
          if-no-files-found: error
          retention-days: 1
