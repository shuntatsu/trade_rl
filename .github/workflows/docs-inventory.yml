name: Documentation Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "README*.md"
      - "START.md"
      - "docs/**"
      - "studio/README.md"
      - ".github/workflows/docs-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/docs-inventory
          find . -type f \( -name '*.md' -o -name '*.mdx' \) \
            -not -path './.git/*' -not -path './.venv/*' -not -path './node_modules/*' \
            -printf '%P\n' | sort > var/docs-inventory/files.txt
          while IFS= read -r file; do
            printf '%s\t%s\t%s\n' "$file" "$(wc -l < "$file")" "$(wc -c < "$file")"
          done < var/docs-inventory/files.txt > var/docs-inventory/sizes.tsv
          grep -RInE 'training_run_config_v1|sequence_encoder|asset_set_encoder|sequence_attention_heads|sequence_attention_layers|README\.ja\.md|Production status:.*GO|production[- ]ready' \
            --include='*.md' --include='*.mdx' . \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
            > var/docs-inventory/stale-terms.txt || true
          python - <<'PY'
          from __future__ import annotations
          import pathlib, re
          root = pathlib.Path('.')
          files = [pathlib.Path(line.strip()) for line in pathlib.Path('var/docs-inventory/files.txt').read_text().splitlines() if line.strip()]
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          broken=[]
          for file in files:
              text=file.read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  target=raw.split('#',1)[0].strip()
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  path=(file.parent/target).resolve()
                  try:
                      path.relative_to(root.resolve())
                  except ValueError:
                      broken.append(f'{file}: escapes repository: {raw}')
                      continue
                  if not path.exists():
                      broken.append(f'{file}: missing: {raw}')
          pathlib.Path('var/docs-inventory/broken-links.txt').write_text('\n'.join(broken)+('\n' if broken else ''), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-inventory-${{ github.run_id }}
          path: var/docs-inventory
          if-no-files-found: error
          retention-days: 1
