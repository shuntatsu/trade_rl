name: Normalize latest main formatting

on:
  push:
    branches:
      - docs/full-governance-site
    paths:
      - ".github/workflows/docs-main-format-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/full-governance-site
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Format exact latest-main file and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/workflows/universal_causal_alpha_teacher.py
          changed="$(git diff --name-only)"
          test "$changed" = "trade_rl/workflows/universal_causal_alpha_teacher.py"
          git diff --check
          uv run ruff format --check .
          uv run pytest -q tests/workflows/test_universal_causal_alpha_teacher.py

      - name: Commit formatter-only normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_causal_alpha_teacher.py
          git diff --cached --check
          git commit -m "style: normalize latest main causal teacher formatting"
          git push origin HEAD:docs/full-governance-site
