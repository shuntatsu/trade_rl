name: Documentation branch main sync

on:
  push:
    branches:
      - docs/full-governance-site
    paths:
      - ".github/workflows/docs-main-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/full-governance-site
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main without history rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "Merge latest main into docs/full-governance-site"
          git status --short
          git push origin HEAD:docs/full-governance-site
