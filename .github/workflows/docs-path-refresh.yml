name: Documentation path refresh

on:
  push:
    branches:
      - docs/full-governance-site
    paths:
      - ".github/workflows/docs-path-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/full-governance-site
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Replace obsolete history references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/reference/single-symbol.md"): (
                  "docs/implementation/legacy-multi-asset-inventory.md",
                  "docs/history/legacy/implementation/legacy-multi-asset-inventory.md",
              ),
              Path("docs/reference/universal-trade-rl.md"): (
                  "docs/implementation-plans/specs/2026-09-03-universal-trade-rl-u1-normalization-clip-amendment.md",
                  "docs/history/specs/2026-09-03-universal-trade-rl-u1-normalization-clip-amendment.md",
              ),
              Path("docs/reference/universal-training.md"): (
                  "docs/implementation-plans/",
                  "docs/history/",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one {old!r}, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify focused governance contract
        run: |
          uv sync --extra dev
          uv run pytest -q tests/docs/test_documentation_governance.py::test_current_docs_do_not_reference_obsolete_history_roots

      - name: Commit exact replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/single-symbol.md docs/reference/universal-trade-rl.md docs/reference/universal-training.md
          git diff --cached --check
          git commit -m "docs: update governed history references"
          git push origin HEAD:docs/full-governance-site
