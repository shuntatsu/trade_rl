name: Export Task 8 source

on:
  pull_request:
    paths:
      - .github/workflows/export-task8-source-temporary.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Package source tree
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv -czf trade-rl-task8-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: trade-rl-task8-source-${{ github.sha }}
          path: trade-rl-task8-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/export-task8-source-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/export-task8-source-temporary.yml
          git commit -m "chore: remove Task 8 source export workflow"
          git push origin HEAD:agent/oracle-bellman-batched-solver
