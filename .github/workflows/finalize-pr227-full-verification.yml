name: Finalize PR227 Full Verification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-full-verification
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.number == 227
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cross-timeframe-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install complete verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Normalize final maintained probes
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/finalize_pr227_full_verification.py
          rm -f \
            .github/workflows/finalize-pr227-full-verification.yml \
            tools/finalize_pr227_full_verification.py
          mkdir -p var/pr227-verification

      - name: Workflow security
        run: uv run python .github/check_workflow_security.py .

      - name: Ruff and formatting
        shell: bash
        run: |
          set -o pipefail
          {
            uv run ruff format --check --diff .
            uv run ruff check .
          } 2>&1 | tee var/pr227-verification/ruff.log

      - name: MyPy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee var/pr227-verification/mypy.log

      - name: Import architecture and dead code
        shell: bash
        run: |
          set -o pipefail
          {
            uv run lint-imports
            uv run vulture trade_rl tests --min-confidence 100
          } 2>&1 | tee var/pr227-verification/architecture.log

      - name: Full pytest and branch coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            --cov=trade_rl \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:var/pr227-verification/coverage.json \
            2>&1 | tee var/pr227-verification/pytest.log

      - name: Critical branch coverage
        run: >-
          uv run python .github/check_critical_coverage.py
          var/pr227-verification/coverage.json pyproject.toml

      - name: Real CPU training capability audit
        shell: bash
        run: |
          set -o pipefail
          uv run python tools/run_training_capability_audit.py \
            --output var/pr227-verification/training-capability-audit \
            2>&1 | tee var/pr227-verification/training-capability-audit.log

      - name: Verify CPU hierarchical BC to PPO evidence
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "var/pr227-verification/training-capability-audit/audit-report.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == "full_training_capability_audit_v1"
          assert len(payload["digest"]) == 64
          for name, record in payload["algorithms"].items():
              assert record["status"] == "pass", (name, record)
              assert record["actual_timesteps"] >= 16
              assert record["checkpoint_count"] >= 1
          for name in (
              "behavior_cloning",
              "exports",
              "replay_resume",
              "residual_controls",
              "sequence",
              "training_resume",
          ):
              assert payload[name]["status"] == "pass", (name, payload[name])
          sequence = payload["sequence"]
          assert sequence["observation_encoder"] == "hierarchical_sequence_v2"
          assert sequence["actual_timesteps"] >= 8
          assert sequence["behavior_cloning"]["status"] == "pass"
          assert sequence["behavior_cloning"]["sample_count"] > 0
          assert sequence["behavior_cloning"]["initial_mse"] >= 0.0
          assert sequence["behavior_cloning"]["final_mse"] >= 0.0
          PY

      - name: Build production training image
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$commit" \
            --build-arg TRADE_RL_GIT_DIRTY=true \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$source_digest" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$lock_digest" \
            --file Dockerfile.training \
            --tag trade-rl-training:pr227 \
            . 2>&1 | tee var/pr227-verification/docker-build.log
          docker run --rm --entrypoint sh trade-rl-training:pr227 -c '
            set -eu
            test "$(id -u)" -ne 0
            test -w /workspace/var
            python -c "import torch, trade_rl; print(torch.__version__)"
          ' 2>&1 | tee var/pr227-verification/docker-runtime.log

      - name: Upload full verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-full-verification-${{ github.run_id }}
          path: var/pr227-verification
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: complete hierarchical sequence v2 CPU verification'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 227 --body "Full PR227 CPU verification failed in Actions run ${GITHUB_RUN_ID}. See the pr227-full-verification artifact."
