name: Main Docker CUDA Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-docker-cuda-verification
  cancel-in-progress: true

jobs:
  docker-cuda-smoke:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner
    environment: gpu-full-training
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      REQUESTED_TIMESTEPS: "128"
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable main source
        shell: bash
        run: |
          set -euo pipefail
          tested_commit="$(git rev-parse HEAD)"
          test "$tested_commit" = "${{ github.sha }}"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          {
            printf 'TESTED_COMMIT=%s\n' "$tested_commit"
            printf 'TESTED_SOURCE_DIGEST=%s\n' "$source_digest"
            printf 'TESTED_LOCK_DIGEST=%s\n' "$lock_digest"
          } >> "$GITHUB_ENV"

      - name: Capture RTX host evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf var/main-gpu-verification
          mkdir -p var/main-gpu-verification/output
          chmod 0777 var/main-gpu-verification/output
          nvidia-smi | tee var/main-gpu-verification/nvidia-smi.txt
          nvidia-smi \
            --query-gpu=name,driver_version,memory.total,compute_cap \
            --format=csv,noheader \
            | tee var/main-gpu-verification/gpu-device.csv
          docker info > var/main-gpu-verification/docker-info.txt

      - name: Build production training image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$TESTED_COMMIT" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$TESTED_SOURCE_DIGEST" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$TESTED_LOCK_DIGEST" \
            --file Dockerfile.training \
            --tag trade-rl-training:main-gpu \
            . 2>&1 | tee var/main-gpu-verification/docker-build.log
          docker image inspect trade-rl-training:main-gpu \
            > var/main-gpu-verification/docker-image-inspect.json

      - name: Run Docker CUDA BC PPO resume smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --gpus all \
            --volume "$PWD/var/main-gpu-verification/output:/workspace/var/main-gpu-output" \
            --entrypoint python \
            trade-rl-training:main-gpu \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            --work-root /workspace/var/main-gpu-output \
            --timesteps "$REQUESTED_TIMESTEPS" \
            --runtime-profile accelerated \
            2>&1 | tee var/main-gpu-verification/docker-cuda-smoke.log

      - name: Verify CUDA evidence
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --volume "$PWD/var/main-gpu-verification/output:/workspace/var/main-gpu-output:ro" \
            --env TESTED_COMMIT \
            --env REQUESTED_TIMESTEPS \
            --entrypoint python \
            trade-rl-training:main-gpu - <<'PY'
          import os
          from pathlib import Path

          from trade_rl.operations.gpu_training_smoke import (
              validate_gpu_training_smoke_file,
          )

          validate_gpu_training_smoke_file(
              Path("/workspace/var/main-gpu-output/gpu-training-smoke.json"),
              expected_commit=os.environ["TESTED_COMMIT"],
              expected_runtime_profile="accelerated",
              minimum_timesteps=int(os.environ["REQUESTED_TIMESTEPS"]),
          )
          PY
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("var/main-gpu-verification")
          evidence = json.loads(
              (root / "output" / "gpu-training-smoke.json").read_text(
                  encoding="utf-8"
              )
          )
          resume = evidence["resume"]
          summary = {
              "actual_timesteps": evidence["actual_timesteps"],
              "cuda_runtime": evidence["cuda_runtime"],
              "git_commit": evidence["git_commit"],
              "gpu": (root / "gpu-device.csv").read_text(encoding="utf-8").strip(),
              "peak_gpu_memory_mib": evidence["performance"]["peak_gpu_memory_mib"],
              "requested_timesteps": evidence["requested_timesteps"],
              "resolved_device": evidence["resolved_device"],
              "resume_actual_timesteps": resume["actual_timesteps"],
              "source_tree_digest": os.environ["TESTED_SOURCE_DIGEST"],
              "throughput_steps_per_second": evidence["performance"]["throughput_steps_per_second"],
          }
          (root / "verified-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable CUDA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-docker-cuda-evidence-${{ github.run_id }}
          path: var/main-gpu-verification
          if-no-files-found: error
          retention-days: 30
