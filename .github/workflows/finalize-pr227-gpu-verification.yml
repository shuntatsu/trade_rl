name: Finalize PR227 GPU Verification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-gpu-verification
  cancel-in-progress: true

jobs:
  docker-cuda-smoke:
    if: >-
      github.event.pull_request.number == 227 &&
      github.actor == github.repository_owner
    environment: gpu-full-training
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      REQUESTED_TIMESTEPS: "128"
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cross-timeframe-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable PR source
        shell: bash
        run: |
          set -euo pipefail
          tested_commit="$(git rev-parse HEAD)"
          test "$tested_commit" = "${{ github.event.pull_request.head.sha }}"
          source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          lock_digest="$(sha256sum uv.lock | cut -d' ' -f1)"
          {
            printf 'TESTED_COMMIT=%s\n' "$tested_commit"
            printf 'TESTED_SOURCE_DIGEST=%s\n' "$source_digest"
            printf 'TESTED_LOCK_DIGEST=%s\n' "$lock_digest"
          } >> "$GITHUB_ENV"

      - name: Capture RTX host evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf var/pr227-gpu-verification
          mkdir -p var/pr227-gpu-verification/output
          chmod 0777 var/pr227-gpu-verification/output
          nvidia-smi | tee var/pr227-gpu-verification/nvidia-smi.txt
          nvidia-smi \
            --query-gpu=name,driver_version,memory.total,compute_cap \
            --format=csv,noheader \
            | tee var/pr227-gpu-verification/gpu-device.csv
          docker info > var/pr227-gpu-verification/docker-info.txt

      - name: Build production training image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg TRADE_RL_GIT_COMMIT="$TESTED_COMMIT" \
            --build-arg TRADE_RL_GIT_DIRTY=false \
            --build-arg TRADE_RL_SOURCE_TREE_DIGEST="$TESTED_SOURCE_DIGEST" \
            --build-arg TRADE_RL_LOCKFILE_DIGEST="$TESTED_LOCK_DIGEST" \
            --file Dockerfile.training \
            --tag trade-rl-training:pr227-gpu \
            . 2>&1 | tee var/pr227-gpu-verification/docker-build.log
          docker image inspect trade-rl-training:pr227-gpu \
            > var/pr227-gpu-verification/docker-image-inspect.json

      - name: Run Docker CUDA BC PPO resume smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --gpus all \
            --volume "$PWD/var/pr227-gpu-verification/output:/workspace/var/pr227-gpu-output" \
            --entrypoint python \
            trade-rl-training:pr227-gpu \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            --work-root /workspace/var/pr227-gpu-output \
            --timesteps "$REQUESTED_TIMESTEPS" \
            --runtime-profile accelerated \
            2>&1 | tee var/pr227-gpu-verification/docker-cuda-smoke.log

      - name: Verify CUDA evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("var/pr227-gpu-verification")
          evidence_path = root / "output" / "gpu-training-smoke.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          assert evidence["schema"] == "gpu_sequence_target_oracle_bc_training_smoke_v7"
          assert evidence["git_commit"] == os.environ["TESTED_COMMIT"]
          assert evidence["runtime_profile"] == "accelerated"
          assert evidence["resolved_device"] == "cuda"
          assert evidence["actual_timesteps"] >= int(os.environ["REQUESTED_TIMESTEPS"])
          assert evidence["behavior_cloning_epochs"] == 1
          assert evidence["serving_support"]["status"] == "supported"
          assert evidence["performance"]["peak_gpu_memory_mib"] > 0
          assert evidence["performance"]["throughput_steps_per_second"] > 0
          training = evidence["performance"]["training_artifact"]
          assert training["schema_version"] == "training_performance_evidence_v1"
          assert training["device_type"] == "cuda"
          assert training["observed_environment_steps"] > 0
          assert training["peak_cuda_allocated_bytes"] > 0
          assert training["peak_cuda_reserved_bytes"] > 0
          resume = evidence["resume"]
          assert resume["actual_timesteps"] == evidence["actual_timesteps"]
          assert resume["evidence"]["schema_version"] == "training_resume_v1"
          resumed = resume["performance"]["training_artifact"]
          assert resumed["device_type"] == "cuda"
          assert resumed["observed_environment_steps"] > 0
          assert resumed["peak_cuda_allocated_bytes"] > 0
          assert resumed["peak_cuda_reserved_bytes"] > 0
          summary = {
              "actual_timesteps": evidence["actual_timesteps"],
              "git_commit": evidence["git_commit"],
              "peak_gpu_memory_mib": evidence["performance"]["peak_gpu_memory_mib"],
              "requested_timesteps": evidence["requested_timesteps"],
              "resolved_device": evidence["resolved_device"],
              "resume_actual_timesteps": resume["actual_timesteps"],
              "source_tree_digest": os.environ["TESTED_SOURCE_DIGEST"],
              "throughput_steps_per_second": evidence["performance"]["throughput_steps_per_second"],
          }
          (root / "verified-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload CUDA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-docker-cuda-evidence-${{ github.run_id }}
          path: var/pr227-gpu-verification
          if-no-files-found: error
          retention-days: 30

      - name: Publish verification record and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("var/pr227-gpu-verification")
          summary = json.loads((root / "verified-summary.json").read_text())
          gpu = (root / "gpu-device.csv").read_text(encoding="utf-8").strip()
          destination = Path(
              "docs/verification/2026-07-28-hierarchical-sequence-v2-docker-cuda.md"
          )
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              "# Hierarchical sequence v2 Docker CUDA verification\n\n"
              f"- Tested commit: `{summary['git_commit']}`\n"
              f"- Production source digest: `{summary['source_tree_digest']}`\n"
              f"- GPU: `{gpu}`\n"
              "- Runtime: production `Dockerfile.training` with `docker run --gpus all`\n"
              "- Profile: `accelerated`\n"
              f"- Requested PPO timesteps: `{summary['requested_timesteps']}`\n"
              f"- Actual PPO timesteps: `{summary['actual_timesteps']}`\n"
              f"- Resumed total timesteps: `{summary['resume_actual_timesteps']}`\n"
              f"- Peak observed GPU memory: `{summary['peak_gpu_memory_mib']} MiB`\n"
              f"- Throughput: `{summary['throughput_steps_per_second']} steps/s`\n"
              "- Behavior cloning: enabled for one epoch before PPO\n"
              "- Checkpoint resume: passed\n"
              "- Structured serving support: passed\n",
              encoding="utf-8",
          )
          PY
          rm -f .github/workflows/finalize-pr227-gpu-verification.yml
          final_source_digest="$(python -c 'from trade_rl.artifacts.provenance import source_tree_digest; print(source_tree_digest("."))')"
          test "$final_source_digest" = "$TESTED_SOURCE_DIGEST"
          rm -rf var/pr227-gpu-verification
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: record hierarchical sequence v2 Docker CUDA verification'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 227 --body "PR227 Docker CUDA verification failed in Actions run ${GITHUB_RUN_ID}."
