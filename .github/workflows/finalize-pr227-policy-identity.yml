name: Finalize PR227 Policy Identity

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-policy-identity-v2
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.number == 227
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cross-timeframe-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Apply policy identity integration
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/finalize_pr227_policy_identity.py')
          text = path.read_text(encoding='utf-8')
          old_unwrapped = '        unwrapped: Any = getattr(probe, "unwrapped", probe)\n'
          old_dataset = '        dataset = getattr(unwrapped, "dataset", None)\n'
          if text.count(old_unwrapped) != 1 or text.count(old_dataset) != 1:
              raise RuntimeError('policy identity finalizer local-name anchors are invalid')
          text = text.replace(
              old_unwrapped,
              '        sequence_unwrapped: Any = getattr(probe, "unwrapped", probe)\n',
              1,
          )
          text = text.replace(
              old_dataset,
              '        dataset = getattr(sequence_unwrapped, "dataset", None)\n',
              1,
          )
          old_order = '''    replace_once(path, anchor, replacement)
              replace_exact(
                  path,
                  "    algorithm_identity = _model_algorithm_identity(model)\\n",
                  "    algorithm_identity = checkpoint_identity_payload_for_model(model)\\n",
                  expected_count=2,
              )
          '''
          new_order = '''    replace_exact(
                  path,
                  "    algorithm_identity = _model_algorithm_identity(model)\\n",
                  "    algorithm_identity = checkpoint_identity_payload_for_model(model)\\n",
                  expected_count=2,
              )
              replace_once(path, anchor, replacement)
          '''
          if text.count(old_order) != 1:
              raise RuntimeError('checkpoint identity replacement-order anchor is invalid')
          path.write_text(text.replace(old_order, new_order, 1), encoding='utf-8')
          PY
          uv run python tools/finalize_pr227_policy_identity.py 2>&1 | tee policy-identity-finalizer.log

      - name: Verify policy identity integration
        shell: bash
        run: |
          exec > >(tee -a policy-identity-finalizer.log) 2>&1
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest -q \
            tests/integrations/test_sb3_policy_identity_v2.py \
            tests/integrations/test_sb3_checkpoint_assembly.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/integrations/test_sb3_model_construction.py \
            tests/rl/test_cost_checkpoint_identity.py \
            tests/rl/test_lagrangian_checkpoint_identity.py

      - name: Publish verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-pr227-policy-identity.yml \
            .github/workflows/pr227-policy-identity-diagnostics.yml \
            tools/finalize_pr227_policy_identity.py \
            policy-identity-finalizer.log \
            docs/verification/.finalize-pr227-policy-identity-trigger.md \
            docs/verification/.finalize-pr227-policy-identity-trigger-2.md \
            docs/verification/.normalize-pr227-generated-expressions-trigger.md \
            docs/verification/.normalize-pr227-generated-expressions-trigger-2.md \
            docs/verification/.normalize-pr227-generated-expressions-trigger-3.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bind sequence architecture identity to SB3 checkpoints'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-policy-identity-finalizer-${{ github.run_id }}
          path: policy-identity-finalizer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            printf 'Policy identity finalization failed in Actions run %s.\n\n```text\n' "$GITHUB_RUN_ID"
            if test -f policy-identity-finalizer.log; then
              tail -n 120 policy-identity-finalizer.log
            else
              printf 'No finalizer log was produced.\n'
            fi
            printf '\n```\n'
          } > /tmp/pr227-policy-identity-failure.md
          body="$(cat /tmp/pr227-policy-identity-failure.md)"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/issues/comments/5095337009" \
            -f body="$body"
