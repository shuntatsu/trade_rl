name: Finalize PR227 Sequence Diagnostics

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-sequence-diagnostics
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.number == 227
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cross-timeframe-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Apply sequence diagnostics integration
        shell: bash
        run: |
          exec > >(tee sequence-diagnostics-finalizer.log) 2>&1
          set -euo pipefail
          uv run python tools/finalize_pr227_sequence_diagnostics.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('trade_rl/rl/sequence_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          ast.parse(text, filename=str(path))
          old_feature = '            feature_extractor = getattr(policy, "features_extractor", None)\n'
          old_call = (
              '            tensor_observation, _ = policy.obs_to_tensor(last_observation)\n'
          )
          if text.count(old_feature) != 1:
              raise RuntimeError(
                  f'generated extractor line count is {text.count(old_feature)}'
              )
          if text.count(old_call) != 1:
              raise RuntimeError(
                  f'generated obs_to_tensor call count is {text.count(old_call)}'
              )
          new_feature = ''.join(
              (
                  '            obs_to_tensor = getattr(policy, "obs_to_tensor", None)\n',
                  '            if not callable(obs_to_tensor):\n',
                  '                return\n',
                  old_feature,
              )
          )
          text = text.replace(old_feature, new_feature, 1)
          text = text.replace(
              old_call,
              '            tensor_observation, _ = obs_to_tensor(last_observation)\n',
              1,
          )
          ast.parse(text, filename=str(path))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify sequence diagnostics integration
        shell: bash
        run: |
          exec > >(tee -a sequence-diagnostics-finalizer.log) 2>&1
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run pytest -q \
            tests/rl/test_sequence_diagnostics.py \
            tests/rl/test_gated_transformer.py \
            tests/rl/test_timeframe_fusion.py \
            tests/rl/test_sequence_policy.py \
            tests/rl/test_training_telemetry.py \
            tests/rl/test_checkpointing.py

      - name: Publish verified diagnostics implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-pr227-sequence-diagnostics.yml \
            tools/finalize_pr227_sequence_diagnostics.py \
            sequence-diagnostics-finalizer.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add TensorBoard diagnostics for hierarchical sequence policy'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Upload diagnostics finalizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-sequence-diagnostics-finalizer-${{ github.run_id }}
          path: |
            sequence-diagnostics-finalizer.log
            trade_rl/rl/sequence_diagnostics.py
          if-no-files-found: warn
          retention-days: 7

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            printf 'Sequence diagnostics finalization failed in Actions run %s.\n\n```text\n' "$GITHUB_RUN_ID"
            if test -f sequence-diagnostics-finalizer.log; then
              tail -n 160 sequence-diagnostics-finalizer.log
            else
              printf 'No diagnostics finalizer log was produced.\n'
            fi
            printf '\n```\n'
          } > /tmp/pr227-sequence-diagnostics-failure.md
          gh pr comment 227 --body-file /tmp/pr227-sequence-diagnostics-failure.md
