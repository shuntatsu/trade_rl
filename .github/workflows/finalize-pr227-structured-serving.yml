name: Finalize PR227 Structured Serving

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-structured-serving
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.event.pull_request.number == 227
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cross-timeframe-attention
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Normalize structured manifest type boundaries
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('trade_rl/rl/structured_export.py')
          text = path.read_text(encoding='utf-8')

          build_start = text.index('        payload = {', text.index('    def build('))
          build_end = text.index('\n\n\nclass _StructuredDeterministicActor', build_start)
          build_body = '''        model_digest = _file_digest(model_path)
          model_size_bytes = model_path.stat().st_size
          policy_identity_digest = content_digest(policy_payload)
          payload = {
              "action_size": action_size,
              "architecture_digest": architecture_digest,
              "inputs": inputs,
              "max_abs_error": max_abs_error,
              "model_digest": model_digest,
              "model_path": STRUCTURED_EXPORT_MODEL_NAME,
              "model_size_bytes": model_size_bytes,
              "policy_identity": policy_payload,
              "policy_identity_digest": policy_identity_digest,
              "schema_version": STRUCTURED_EXPORT_SCHEMA,
              "tolerance": tolerance,
          }
          return cls(
              digest=content_digest(payload),
              model_path=STRUCTURED_EXPORT_MODEL_NAME,
              model_digest=model_digest,
              model_size_bytes=model_size_bytes,
              policy_identity=policy_payload,
              policy_identity_digest=policy_identity_digest,
              architecture_digest=architecture_digest,
              inputs=inputs,
              action_size=action_size,
              tolerance=tolerance,
              max_abs_error=max_abs_error,
              schema_version=STRUCTURED_EXPORT_SCHEMA,
          )'''
          text = text[:build_start] + build_body + text[build_end:]
          text = text.replace('  # type: ignore[attr-defined]', '', 1)

          helper_start = text.index('def _mapping(value: object, *, field: str)')
          loader_start = text.index('def load_structured_export_manifest', helper_start)
          helpers = '''def _mapping(value: object, *, field: str) -> Mapping[str, object]:
              if not isinstance(value, Mapping):
                  raise ValueError(f"{field} must be a mapping")
              return value


          def _string(value: object, *, field: str) -> str:
              if not isinstance(value, str):
                  raise ValueError(f"{field} must be a string")
              return value


          def _integer(value: object, *, field: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise ValueError(f"{field} must be an integer")
              return value


          def _number(value: object, *, field: str) -> float:
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise ValueError(f"{field} must be numeric")
              return float(value)


          '''
          text = text[:helper_start] + helpers + text[loader_start:]

          constructor_start = text.index(
              '    return StructuredExportManifest(',
              text.index('def load_structured_export_manifest'),
          )
          constructor_end = text.index('\n\n\n__all__', constructor_start)
          constructor = '''    return StructuredExportManifest(
              digest=_string(payload["digest"], field="digest"),
              model_path=_string(payload["model_path"], field="model_path"),
              model_digest=_string(payload["model_digest"], field="model_digest"),
              model_size_bytes=_integer(
                  payload["model_size_bytes"], field="model_size_bytes"
              ),
              policy_identity=dict(policy_identity),
              policy_identity_digest=_string(
                  payload["policy_identity_digest"], field="policy_identity_digest"
              ),
              architecture_digest=_string(
                  payload["architecture_digest"], field="architecture_digest"
              ),
              inputs=tuple(inputs),
              action_size=_integer(payload["action_size"], field="action_size"),
              tolerance=_number(payload["tolerance"], field="tolerance"),
              max_abs_error=_number(payload["max_abs_error"], field="max_abs_error"),
              schema_version=_string(payload["schema_version"], field="schema_version"),
          )'''
          text = text[:constructor_start] + constructor + text[constructor_end:]
          ast.parse(text, filename=str(path))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify structured export and canonical loader
        shell: bash
        run: |
          exec > >(tee structured-serving-finalizer.log) 2>&1
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run pytest -q \
            tests/rl/test_structured_export.py \
            tests/serving/test_runtime.py \
            tests/serving/test_runtime_schema_guard.py \
            tests/serving/test_observation_parity.py \
            tests/serving/test_sb3_loader.py

      - name: Publish verified structured serving implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-pr227-structured-serving.yml \
            structured-serving-finalizer.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add structured policy export and canonical serving loader'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Upload structured serving diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-structured-serving-${{ github.run_id }}
          path: structured-serving-finalizer.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report failure to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            printf 'Structured serving finalization failed in Actions run %s.\n\n```text\n' "$GITHUB_RUN_ID"
            if test -f structured-serving-finalizer.log; then
              tail -n 200 structured-serving-finalizer.log
            else
              printf 'No structured serving log was produced.\n'
            fi
            printf '\n```\n'
          } > /tmp/pr227-structured-serving-failure.md
          gh pr comment 227 --body-file /tmp/pr227-structured-serving-failure.md
