name: Finalize Task 10 benchmark metadata

on:
  pull_request:
    paths:
      - .github/workflows/finalize-task10-metadata-temporary.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Apply truthful backend metadata
        run: |
          set -euo pipefail
          python .github/task10_metadata_fix.py
      - name: Verify Task 10 metadata
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/operations/oracle_teacher_benchmark.py
            tests/operations/test_oracle_teacher_benchmark.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/operations/test_oracle_teacher_benchmark.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_oracle_bellman_torch.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy trade_rl/operations/oracle_teacher_benchmark.py
          uv run lint-imports
      - name: Commit verified metadata
        run: |
          set -euo pipefail
          rm -f \
            .github/task10_metadata_fix.py \
            .github/workflows/finalize-task10-metadata-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/operations/oracle_teacher_benchmark.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            .github
          git diff --cached --check
          git commit -m "perf: record actual Oracle benchmark backend behavior"
          git push origin HEAD:agent/oracle-bellman-batched-solver
