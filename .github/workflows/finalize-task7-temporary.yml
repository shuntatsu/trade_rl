name: Finalize Task 7 cache provenance

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-task7-temporary.yml"

permissions:
  contents: write

concurrency:
  group: finalize-task7-${{ github.repository }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Materialize verified Task 7 sources
        shell: bash
        run: |
          set -euo pipefail
          python .github/task7_a.py
          python .github/task7_b.py
          python .github/task7_c.py
          python .github/task7_d.py
          python .github/task7_e.py
          python .github/task7_f.py
          python .github/task7_g.py
          sha256sum -c <<'EOF'
          080ee094deea19ef4b8dc2f5b7c81560db19f0b39a779d91d3a9398f39a18d89  trade_rl/learning/oracle_bellman_contracts.py
          1976705270329b38699dd86069330f09feed02e2af108a5c2d605445fc6429ee  trade_rl/learning/episode_oracle_teacher.py
          53ed0f7c33d9a8de1ca9a43d297d9f203d00a7c003297b2daaf8abd20a775b87  trade_rl/catalog/reusable_artifacts.py
          d9e8de9ecd67291c4929f5314eeaa82bfbc0e7590313c1162349b32c02da9d25  trade_rl/learning/episode_teacher_artifact.py
          e0d2d1682f89695cf90a037f08822e78997927342cc83d7df6f3fe0443ff8066  trade_rl/integrations/sb3_training.py
          bf6db4bbb51eeb8b98a6e34ebed92966216b5cf0d41daaf0946f7b7f120f9866  tests/catalog/test_reusable_artifacts.py
          0ff4ff4691a60d135c0cb71f1c6905a83e3c4546d7fb966aaca65a2a3388edba  tests/learning/test_episode_teacher_provenance.py
          c36241ada8466a9e32045019e91869f429976d55befb41fa1788ecfab21b293e  tests/learning/test_oracle_bellman_contracts.py
          05358511839821040bc520318aa5eb24a4277a8cbd6231332e41b947073b37bb  tests/learning/test_episode_oracle_teacher.py
          2569a02742f249bb74928c6735b23e1abfa422a32371a5891bbdd01241bf7a21  tests/learning/test_episode_teacher_integration.py
          EOF

      - name: Verify Task 7
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            trade_rl/learning/oracle_bellman_contracts.py
            trade_rl/learning/episode_oracle_teacher.py
            trade_rl/learning/episode_teacher_artifact.py
            trade_rl/catalog/reusable_artifacts.py
            trade_rl/integrations/sb3_training.py
            tests/catalog/test_reusable_artifacts.py
            tests/learning/test_episode_teacher_provenance.py
            tests/learning/test_oracle_bellman_contracts.py
            tests/learning/test_episode_oracle_teacher.py
            tests/learning/test_episode_teacher_integration.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/learning/test_oracle_bellman_contracts.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_api_contract.py \
            tests/learning/test_episode_teacher_provenance.py \
            tests/learning/test_episode_teacher_integration.py \
            tests/catalog/test_reusable_artifacts.py \
            tests/integrations/test_sb3_training.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy \
            trade_rl/learning/oracle_bellman_contracts.py \
            trade_rl/learning/episode_oracle_teacher.py \
            trade_rl/learning/episode_teacher_artifact.py \
            trade_rl/catalog/reusable_artifacts.py
          uv run mypy --follow-imports=skip trade_rl/integrations/sb3_training.py

      - name: Commit verified Task 7
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/task7_a.py \
            .github/task7_b.py \
            .github/task7_c.py \
            .github/task7_d.py \
            .github/task7_e.py \
            .github/task7_f.py \
            .github/task7_g.py \
            .github/task7_note.txt \
            .github/workflows/task7-red-temporary.yml \
            .github/workflows/apply-verify-task7-temporary.yml \
            .github/workflows/fix-verify-task7-types-temporary.yml \
            .github/workflows/finalize-task7-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_bellman_contracts.py \
            trade_rl/learning/episode_oracle_teacher.py \
            trade_rl/learning/episode_teacher_artifact.py \
            trade_rl/catalog/reusable_artifacts.py \
            trade_rl/integrations/sb3_training.py \
            tests/catalog/test_reusable_artifacts.py \
            tests/learning/test_episode_teacher_provenance.py \
            tests/learning/test_oracle_bellman_contracts.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_episode_teacher_integration.py \
            .github
          git diff --cached --check
          git commit -m "feat: version Oracle solver provenance and cache identity"
          git push origin HEAD:agent/oracle-bellman-batched-solver
