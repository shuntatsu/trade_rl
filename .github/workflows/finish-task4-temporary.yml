name: Finish and verify Task 4

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/finish-task4-temporary.yml"

permissions:
  contents: write

jobs:
  finish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Reuse the reviewed integration script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/integrate-task4-temporary.yml")
          lines = source.read_text(encoding="utf-8").splitlines()
          marker = next(
              index
              for index, line in enumerate(lines)
              if "- name: Centralize transition equations" in line
          )
          run_index = next(
              index
              for index in range(marker + 1, len(lines))
              if lines[index].strip() == "run: |"
          )
          end = next(
              index
              for index in range(run_index + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          script_lines = [
              line[10:] if line.startswith("          ") else line
              for line in lines[run_index + 1 : end]
          ]
          Path("/tmp/task4-integrate.sh").write_text(
              "\n".join(script_lines) + "\n",
              encoding="utf-8",
          )
          PY
          bash /tmp/task4-integrate.sh
      - name: Install, normalize, and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py
          uv run ruff format \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py
          uv run pytest -q \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_oracle_market_tape.py
          uv run ruff check \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py
          uv run ruff format --check --diff \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py
          uv run mypy \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py
      - name: Commit verified integration and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/integrate-task4-temporary.yml
          rm .github/workflows/finish-task4-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_market_tape.py \
            trade_rl/learning/oracle_transition_numpy.py \
            trade_rl/learning/oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py \
            .github/workflows
          git commit -m "refactor: centralize Oracle NumPy transitions"
          git push origin HEAD:agent/oracle-bellman-batched-solver
