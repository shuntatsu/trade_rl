name: Fix architecture finalizer main fetch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == github.repository_owner && github.head_ref == 'agent/architecture-audit-remediation-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-audit-remediation-20260728
          fetch-depth: 2
      - name: Add explicit main fetch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''          rm -f tests/serving/test_architecture_snapshot_transport.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
'''
          new = '''          rm -f tests/serving/test_architecture_snapshot_transport.py
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
'''
          if text.count(old) != 1:
              raise SystemExit('finalizer anchor mismatch')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/fix-architecture-finalizer-main-fetch.yml
          git add -A
          git config user.name "Architecture Remediation Finalizer Fix"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: fetch main before restoring finalizer workflow"
          git push origin HEAD:agent/architecture-audit-remediation-20260728
