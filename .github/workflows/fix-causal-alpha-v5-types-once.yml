name: Fix Causal Alpha V5 Types Once

on:
  push:
    branches:
      - feat/causal-alpha-v5-calibrated-selective-slow

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/causal-alpha-v5-calibrated-selective-slow
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Install static dependencies
        run: uv sync --extra dev
      - name: Apply exact V5 type correction
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/learning/causal_alpha_v5.py')
          source = path.read_text(encoding='utf-8')
          if source.count('from typing import Final') != 1:
              raise SystemExit('V5 typing import preimage mismatch')
          source = source.replace(
              'from typing import Final',
              'from typing import Any, Final',
              1,
          )
          if source.count('dtype: object') != 3:
              raise SystemExit('V5 dtype annotation preimage mismatch')
          source = source.replace('dtype: object', 'dtype: Any')

          marker = '        for field_name in ("actionable_mask", "active_mask"):\n'
          next_marker = '        for field_name in (\n            "slow_uncertainty_raw",\n'
          start = source.index(marker)
          stop = source.index(next_marker, start)
          block = source[start:stop]
          if block.count('array = _readonly_vector(') != 1:
              raise SystemExit('V5 mask assignment preimage mismatch')
          block = block.replace('array = _readonly_vector(', 'mask = _readonly_vector(', 1)
          block = block.replace('if array.shape != (rows,):', 'if mask.shape != (rows,):', 1)
          block = block.replace('arrays[field_name] = array', 'arrays[field_name] = mask', 1)
          source = source[:start] + block + source[stop:]
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          uv run ruff format trade_rl/learning/causal_alpha_v5.py
          uv run mypy trade_rl/learning/causal_alpha_v5.py
      - name: Commit exact type correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/learning/causal_alpha_v5.py
          git commit -m 'fix: type causal alpha v5 array boundaries'
          git push origin HEAD:feat/causal-alpha-v5-calibrated-selective-slow
