name: Fix Episode Oracle Style

on:
  push:
    branches:
      - agent/episode-aligned-oracle-teacher

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/episode-aligned-oracle-teacher
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: uv sync --extra dev
      - name: Apply Ruff fixes
        run: |
          uv run ruff check . --fix
          uv run ruff format trade_rl/learning/episode_*.py tests/learning/test_episode_*.py trade_rl/integrations/sb3_training.py trade_rl/rl/environment.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format episode Oracle integration"
          git push origin HEAD:agent/episode-aligned-oracle-teacher
