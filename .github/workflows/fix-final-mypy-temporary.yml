name: Fix final MyPy errors

on:
  pull_request:
    paths:
      - .github/workflows/fix-final-mypy-temporary.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install full CI dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Prove seven-error MyPy RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run mypy . 2>&1 | tee /tmp/mypy-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'Found 7 errors in 3 files' /tmp/mypy-red.log
          grep -F 'trade_rl/studio/system_probe.py' /tmp/mypy-red.log
          grep -F 'trade_rl/studio/overview.py' /tmp/mypy-red.log
          grep -F 'trade_rl/integrations/cost_critic_ppo.py' /tmp/mypy-red.log

      - name: Apply minimal corrections
        run: python .github/fix_final_mypy.py

      - name: Verify full static and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/studio/system_probe.py
            trade_rl/studio/overview.py
            trade_rl/integrations/cost_critic_ppo.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff format .github/fix_final_mypy.py
          uv run mypy .
          uv run pytest -q \
            tests/studio \
            tests/integrations/test_cost_critic_ppo.py \
            tests/integrations/test_cost_critic_feature_cache.py \
            tests/integrations/test_cost_critic_checkpoint_identity.py \
            tests/integrations/test_sb3_cost_critic_backend.py
          uv run ruff check .
          uv run ruff format --check --diff .
          uv run lint-imports
          git diff --check

      - name: Commit verified corrections and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/fix_final_mypy.py \
            .github/workflows/fix-final-mypy-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/studio/system_probe.py \
            trade_rl/studio/overview.py \
            trade_rl/integrations/cost_critic_ppo.py \
            .github
          git diff --cached --check
          git commit -m "fix: satisfy full repository MyPy contracts"
          git push origin HEAD:agent/oracle-bellman-batched-solver
