name: Fix optional Oracle Torch boundary

on:
  pull_request:
    paths:
      - .github/workflows/fix-optional-oracle-torch-temporary.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Torch-free catalog environment
        run: uv sync --extra dev --extra postgres

      - name: Apply regression tests and prove RED
        shell: bash
        run: |
          set -euo pipefail
          python .github/oracle_optional_torch_test.py
          if uv run pytest -q tests/learning/test_oracle_optional_dependency.py; then
            echo "Expected optional Torch regression tests to fail before implementation" >&2
            exit 1
          fi

      - name: Apply lazy backend boundary
        run: python .github/oracle_optional_torch_fix.py

      - name: Verify Torch-free imports and catalog regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/learning/test_oracle_optional_dependency.py \
            tests/catalog/test_reusable_artifacts.py

      - name: Verify full Oracle environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra postgres --extra train-sb3
          files=(
            trade_rl/learning/oracle_solver.py
            tests/learning/test_oracle_optional_dependency.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run pytest -q \
            tests/learning/test_oracle_optional_dependency.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            tests/catalog/test_reusable_artifacts.py
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff "${files[@]}"
          uv run mypy trade_rl/learning/oracle_solver.py
          uv run lint-imports
          git diff --check

      - name: Commit verified fix and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/oracle_optional_torch_test.py \
            .github/oracle_optional_torch_fix.py \
            .github/workflows/fix-optional-oracle-torch-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/oracle_solver.py \
            tests/learning/test_oracle_optional_dependency.py \
            .github
          git diff --cached --check
          git commit -m "fix: keep Oracle Torch backend optional"
          git push origin HEAD:agent/oracle-bellman-batched-solver
