name: Fix PR227 Policy Identity Layer

on:
  push:
    branches:
      - agent/cross-timeframe-attention

permissions:
  contents: write

concurrency:
  group: fix-pr227-policy-identity-layer
  cancel-in-progress: false

jobs:
  move-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Move policy identity contract to RL layer
        run: |
          set -euo pipefail
          test -f trade_rl/integrations/sb3_policy_identity.py
          test ! -e trade_rl/rl/policy_identity.py
          mv trade_rl/integrations/sb3_policy_identity.py trade_rl/rl/policy_identity.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'trade_rl/rl/checkpointing.py': (
                  'from trade_rl.integrations.sb3_policy_identity import model_sb3_policy_identity',
                  'from trade_rl.rl.policy_identity import model_sb3_policy_identity',
              ),
              'trade_rl/integrations/sb3_model_assembly.py': (
                  'from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity',
                  'from trade_rl.rl.policy_identity import bind_sb3_policy_identity',
              ),
              'trade_rl/integrations/sb3_checkpoint_assembly.py': (
                  'from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity',
                  'from trade_rl.rl.policy_identity import bind_sb3_policy_identity',
              ),
              'tests/integrations/test_sb3_policy_identity_v2.py': (
                  'from trade_rl.integrations.sb3_policy_identity import (',
                  'from trade_rl.rl.policy_identity import (',
              ),
          }
          for raw_path, (old, new) in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{raw_path}: import anchor count is {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify corrected dependency direction
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run lint-imports
          uv run pytest -q \
            tests/integrations/test_sb3_policy_identity_v2.py \
            tests/integrations/test_sb3_checkpoint_assembly.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/integrations/test_sb3_model_construction.py \
            tests/rl/test_cost_checkpoint_identity.py \
            tests/rl/test_lagrangian_checkpoint_identity.py

      - name: Publish verified layer correction
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/fix-pr227-policy-identity-layer.yml \
            docs/verification/.fix-pr227-policy-identity-layer-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: place policy identity in the RL contract layer'
          git push origin HEAD:agent/cross-timeframe-attention
