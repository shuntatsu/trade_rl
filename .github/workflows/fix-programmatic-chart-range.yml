name: Fix programmatic chart range

on:
  pull_request:
    paths:
      - .github/workflows/fix-programmatic-chart-range.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Guard renderer-owned updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('studio/src/live/ResearchChartWorkspace.tsx')
          text = path.read_text()

          insert_guard = "    if (!series) return\n    series.candles.setData"
          guarded = "    if (!series) return\n    programmaticRange.current = true\n    series.candles.setData"
          if insert_guard not in text:
              raise SystemExit('chart data guard insertion point not found')
          text = text.replace(insert_guard, guarded, 1)

          old_filter = """    const visibleMarkers = chartData.markers.filter((marker) =>
              marker.text === 'BUY' || marker.text === 'SELL'
                ? layers.positionEvents
                : layers.riskEvents)"""
          new_filter = """    const visibleMarkers = chartData.markers.filter((marker) =>
              marker.text === 'BUY' || marker.text === 'SELL'
                ? layers.positionEvents
                : marker.text === 'RISK' ? layers.riskEvents : true)"""
          if old_filter not in text:
              raise SystemExit('marker filter not found')
          text = text.replace(old_filter, new_filter, 1)

          marker_end = "    markerRef.current?.setMarkers(visibleMarkers as SeriesMarker<Time>[])\n  }, [chartData, layers])"
          marker_guarded = "    markerRef.current?.setMarkers(visibleMarkers as SeriesMarker<Time>[])\n    queueMicrotask(() => { programmaticRange.current = false })\n  }, [chartData, layers])"
          if marker_end not in text:
              raise SystemExit('chart data guard completion point not found')
          text = text.replace(marker_end, marker_guarded, 1)

          old_cursor = "    chart.setCrosshairPosition(candle.close, time as Time, series.candles)\n    if (followLatest) chart.timeScale().scrollToRealTime()"
          new_cursor = """    chart.setCrosshairPosition(candle.close, time as Time, series.candles)
            if (followLatest) {
              programmaticRange.current = true
              chart.timeScale().scrollToRealTime()
              queueMicrotask(() => { programmaticRange.current = false })
            }"""
          if old_cursor not in text:
              raise SystemExit('chart cursor guard point not found')
          text = text.replace(old_cursor, new_cursor, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/live/ResearchChartWorkspace.tsx
          git commit -m "fix(studio): preserve latest follow during chart updates"
          git push origin HEAD:${{ github.head_ref }}
