name: Fix programmatic chart range

on:
  pull_request:
    paths:
      - .github/workflows/fix-programmatic-chart-range.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Guard renderer-owned updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('studio/src/live/ResearchChartWorkspace.tsx')
          text = path.read_text()

          old_start = """    const chart = chartRef.current
              const series = seriesRef.current
              if (!chart || !series) return
              setSeriesData(series, data)"""
          new_start = """    const chart = chartRef.current
              const series = seriesRef.current
              if (!chart || !series) return
              programmaticRange.current = true
              setSeriesData(series, data)"""
          if old_start not in text:
              raise SystemExit('chart data effect start not found')
          text = text.replace(old_start, new_start, 1)

          old_filter = """    const visibleMarkers = data.markers.filter((marker) =>
              marker.text === 'BUY' || marker.text === 'SELL'
                ? layers.positionEvents
                : layers.riskEvents)"""
          new_filter = """    const visibleMarkers = data.markers.filter((marker) =>
              marker.text === 'BUY' || marker.text === 'SELL'
                ? layers.positionEvents
                : marker.text === 'RISK' ? layers.riskEvents : true)"""
          if old_filter not in text:
              raise SystemExit('marker filter not found')
          text = text.replace(old_filter, new_filter, 1)

          old_end = """    series.baseline.applyOptions({ visible: layers.baseline })
              series.drawdown.applyOptions({ visible: layers.drawdown })
            }, [data, layers])"""
          new_end = """    series.baseline.applyOptions({ visible: layers.baseline })
              series.drawdown.applyOptions({ visible: layers.drawdown })
              queueMicrotask(() => { programmaticRange.current = false })
            }, [data, layers])"""
          if old_end not in text:
              raise SystemExit('chart data effect end not found')
          text = text.replace(old_end, new_end, 1)

          old_cursor = """    if (followLatest && time === data.candles.at(-1)?.time) {
              chart.timeScale().scrollToRealTime()
            }"""
          new_cursor = """    if (followLatest && time === data.candles.at(-1)?.time) {
              programmaticRange.current = true
              chart.timeScale().scrollToRealTime()
              queueMicrotask(() => { programmaticRange.current = false })
            }"""
          if old_cursor not in text:
              raise SystemExit('chart cursor guard point not found')
          text = text.replace(old_cursor, new_cursor, 1)

          path.write_text(text)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/live/ResearchChartWorkspace.tsx
          git commit -m "fix(studio): preserve latest follow during chart updates"
          git push origin HEAD:${{ github.head_ref }}
