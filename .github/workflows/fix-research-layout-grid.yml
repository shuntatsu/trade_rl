name: Fix research layout grid

on:
  pull_request:
    paths:
      - .github/workflows/fix-research-layout-grid.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Fix row ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('studio/src/liveTraining.css')
          text = path.read_text()
          old = '''.research-live-page {
            min-height: 0;
            height: 100%;
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            gap: 10px;
            overflow: hidden;
          }'''
          new = '''.research-live-page {
            min-height: 0;
            height: 100%;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 10px;
            overflow: hidden;
          }'''
          if old not in text:
              raise SystemExit('research live page grid block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/liveTraining.css
          git commit -m "fix(studio): let active Live Training view fill workspace"
          git push origin HEAD:${{ github.head_ref }}
