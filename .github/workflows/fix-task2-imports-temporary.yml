name: Fix Task 2 imports

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-task2-imports-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Fix imports and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix tests/learning/test_oracle_bellman_contracts.py
          rm .github/workflows/fix-task2-imports-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/learning/test_oracle_bellman_contracts.py .github
          git commit -m "style: organize Oracle contract test imports"
          git push origin HEAD:agent/oracle-bellman-batched-solver
