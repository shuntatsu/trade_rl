name: Fix and verify Task 3 typing

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-task3-mypy-temporary.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply typing fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/learning/oracle_market_tape.py")
          text = path.read_text(encoding="utf-8")
          function_start = text.index("def _readonly_array(")
          block_start = text.index("    if boolean:\n", function_start)
          block_end = text.index("\n\n\n@dataclass", block_start)
          replacement = "\n".join(
              [
                  "    if boolean:",
                  "        if not np.issubdtype(raw.dtype, np.bool_):",
                  "            raise ValueError(f\"{field} must contain booleans\")",
                  "        boolean_array = np.asarray(raw, dtype=np.bool_).copy(order=\"C\")",
                  "        boolean_array.setflags(write=False)",
                  "        return boolean_array",
                  "    if not np.issubdtype(raw.dtype, np.number) or np.issubdtype(",
                  "        raw.dtype, np.bool_",
                  "    ):",
                  "        raise ValueError(f\"{field} must contain numeric values\")",
                  "    numeric_array = np.asarray(raw, dtype=np.float64).copy(order=\"C\")",
                  "    if not np.isfinite(numeric_array).all():",
                  "        raise ValueError(f\"{field} must contain finite values\")",
                  "    if field in _NONNEGATIVE_FIELDS and np.any(numeric_array < 0.0):",
                  "        raise ValueError(f\"{field} must be non-negative\")",
                  "    numeric_array.setflags(write=False)",
                  "    return numeric_array",
              ]
          )
          path.write_text(
              text[:block_start] + replacement + text[block_end:],
              encoding="utf-8",
          )
          PY
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run pytest -q tests/learning/test_oracle_market_tape.py tests/learning/test_oracle_teacher.py
          uv run ruff check trade_rl/learning/oracle_market_tape.py tests/learning/test_oracle_market_tape.py
          uv run ruff format --check --diff trade_rl/learning/oracle_market_tape.py tests/learning/test_oracle_market_tape.py
          uv run mypy trade_rl/learning/oracle_market_tape.py
      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-task3-mypy-temporary.yml
          rm .github/workflows/oracle-market-tape-targeted-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/learning/oracle_market_tape.py .github/workflows
          git commit -m "fix: separate Oracle market tape array types"
          git push origin HEAD:agent/oracle-bellman-batched-solver
