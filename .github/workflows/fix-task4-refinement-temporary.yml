name: Fix and verify Task 4 refinement

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-task4-refinement-temporary.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Fix batch liquidity mask
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/learning/oracle_transition_numpy.py")
          text = path.read_text(encoding="utf-8")
          old = "where=positive_liquidity[r:, None, None, :],"
          new = "where=positive_liquidity[:, None, None, :],"
          if text.count(old) != 1:
              raise SystemExit("expected liquidity-mask typo was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install, normalize, and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix trade_rl/learning/oracle_transition_numpy.py tests/learning/test_oracle_transition_numpy.py
          uv run ruff format trade_rl/learning/oracle_transition_numpy.py tests/learning/test_oracle_transition_numpy.py
          uv run pytest -q tests/learning/test_oracle_transition_numpy.py tests/learning/test_oracle_teacher.py tests/learning/test_oracle_market_tape.py
          uv run ruff check trade_rl/learning/oracle_transition_numpy.py tests/learning/test_oracle_transition_numpy.py
          uv run ruff format --check --diff trade_rl/learning/oracle_transition_numpy.py tests/learning/test_oracle_transition_numpy.py
          uv run mypy trade_rl/learning/oracle_transition_numpy.py
      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-task4-refinement-temporary.yml
          rm .github/workflows/verify-task4-refinement-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/learning/oracle_transition_numpy.py tests/learning/test_oracle_transition_numpy.py .github/workflows
          git commit -m "fix: align Oracle liquidity mask with episode batch"
          git push origin HEAD:agent/oracle-bellman-batched-solver
