name: Fix Task 7 backend anchor selection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-task7-backend-anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use first matching syntax anchor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/apply-task7-backend.yml")
          content = path.read_text()
          old = '''          def exact_index(lines: list[str], needle: str, *, start: int = 0) -> int:
              matches = [i for i in range(start, len(lines)) if lines[i] == needle]
              if len(matches) != 1:
                  raise SystemExit(
                      f"anchor mismatch ({len(matches)}): {needle.rstrip()!r}"
                  )
              return matches[0]
'''
          new = '''          def exact_index(lines: list[str], needle: str, *, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == needle:
                      return index
              raise SystemExit(f"anchor missing: {needle.rstrip()!r}")
'''
          if content.count(old) != 1:
              raise SystemExit("Task 7 anchor helper mismatch")
          path.write_text(content.replace(old, new))
          PY
          rm .github/workflows/fix-task7-backend-anchor.yml
          git add -A
          git diff --cached --check

      - name: Commit anchor fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: select first Task 7 syntax anchor"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
