name: Fix Task 7 probe type

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-task7-probe-type-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Narrow canonical action before comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/lagrangian_probe.py")
          content = path.read_text()
          old = '''                elif semantic is not canonical_semantic or not np.array_equal(\n                    action,\n                    canonical_action,\n                ):'''
          new = '''                elif (\n                    semantic is not canonical_semantic\n                    or canonical_action is None\n                    or not np.array_equal(action, canonical_action)\n                ):'''
          if content.count(old) != 1:
              raise SystemExit("canonical action comparison point mismatch")
          path.write_text(content.replace(old, new))
          PY
          rm .github/workflows/fix-task7-probe-type.yml
          git add -A
          git diff --cached --check

      - name: Commit type-safe probe comparison
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: narrow canonical probe action"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
