name: Fix universal final pytest temporary

on:
  push:
    branches:
      - codex/universal-real-data-training

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-real-data-training
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply focused contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          telemetry = Path('trade_rl/studio/telemetry.py')
          text = telemetry.read_text(encoding='utf-8')
          old = '''    interval_cost: float | None = None\n    interval_return: float | None = None\n    risk_reasons: tuple[str, ...]\n'''
          new = '''    interval_cost: float | None = None\n    interval_return: float | None = None\n    filled_turnover: float | None = None\n    fill_count: int | None = Field(default=None, ge=0)\n    interval_gross_return: float | None = None\n    baseline_excess_return: float | None = None\n    target_delta_l1: float | None = None\n    sign_flip_count: int | None = Field(default=None, ge=0)\n    gross_pnl: float | None = None\n    net_pnl: float | None = None\n    risk_reasons: tuple[str, ...]\n'''
          if text.count(old) != 1:
              raise SystemExit('Studio telemetry response target drifted')
          telemetry.write_text(text.replace(old, new), encoding='utf-8')

          entrypoint = Path('tests/workflows/test_universal_full_research_entrypoint.py')
          text = entrypoint.read_text(encoding='utf-8')
          old = 'from tests.integrations.test_binance_universal_runtime import _manifest'
          new = 'from tests.workflows.test_binance_universal_runtime import _manifest'
          if text.count(old) != 1:
              raise SystemExit('runtime test import target drifted')
          entrypoint.write_text(text.replace(old, new), encoding='utf-8')

          oracle = Path('tests/workflows/test_universal_oracle_batch_runtime.py')
          text = oracle.read_text(encoding='utf-8')
          old = '''            self.binding = binding\n            self.dataset = SimpleNamespace(dataset_id=binding.source_dataset_id)\n            opened.append(binding.concrete_symbol)\n'''
          new = '''            self.binding = binding\n            self.minimum_start_index = 11\n            self.dataset = SimpleNamespace(\n                dataset_id=binding.source_dataset_id,\n                n_bars=100,\n            )\n            opened.append(binding.concrete_symbol)\n'''
          if text.count(old) != 1:
              raise SystemExit('first Oracle Child target drifted')
          text = text.replace(old, new)
          old = '''    class Child:\n        dataset = SimpleNamespace(dataset_id=binding.source_dataset_id)\n\n        def close(self) -> None:\n'''
          new = '''    class Child:\n        minimum_start_index = 5\n        dataset = SimpleNamespace(dataset_id=binding.source_dataset_id, n_bars=40)\n\n        def close(self) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit('second Oracle Child target drifted')
          oracle.write_text(text.replace(old, new), encoding='utf-8')

          bundle = Path('tests/workflows/test_universal_teacher_bundle_runtime.py')
          text = bundle.read_text(encoding='utf-8')
          old = 'from types import SimpleNamespace\n\nimport numpy as np\n'
          new = 'from dataclasses import dataclass\nfrom types import SimpleNamespace\n\nimport numpy as np\n'
          if text.count(old) != 1:
              raise SystemExit('bundle import target drifted')
          text = text.replace(old, new)
          old = '''    sentinel = object()\n\n    def combine(\n'''
          new = '''    @dataclass(frozen=True)\n    class _BundleStub:\n        episode_batches: dict[str, EpisodeOracleBatch] | None = None\n\n    sentinel = _BundleStub()\n\n    def combine(\n'''
          if text.count(old) != 1:
              raise SystemExit('bundle sentinel target drifted')
          text = text.replace(old, new)
          old = '''    assert result is sentinel\n    assert opened == [("AAAUSDT", 100), ("BBBUSDT", 101)]\n'''
          new = '''    assert isinstance(result, _BundleStub)\n    assert result is not sentinel\n    assert result.episode_batches is not None\n    assert set(result.episode_batches) == set(symbols)\n    assert opened == [("AAAUSDT", 100), ("BBBUSDT", 101)]\n'''
          if text.count(old) != 1:
              raise SystemExit('bundle result target drifted')
          bundle.write_text(text.replace(old, new), encoding='utf-8')

          identity = Path('tests/workflows/test_universal_teacher_shared_oracle_identity.py')
          text = identity.read_text(encoding='utf-8')
          old = 'with pytest.raises(ValueError, match="Oracle teacher config identity"):'
          new = 'with pytest.raises(ValueError, match="Universal teacher config identity"):'
          if text.count(old) != 1:
              raise SystemExit('teacher identity assertion target drifted')
          identity.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify focused repairs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3 --extra studio
          files=(
            trade_rl/studio/telemetry.py
            tests/workflows/test_universal_full_research_entrypoint.py
            tests/workflows/test_universal_oracle_batch_runtime.py
            tests/workflows/test_universal_teacher_bundle_runtime.py
            tests/workflows/test_universal_teacher_shared_oracle_identity.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy trade_rl/studio/telemetry.py trade_rl/workflows/universal_teacher_runtime.py
          uv run pytest \
            tests/studio/test_telemetry_api.py \
            tests/studio/test_telemetry_episode_api.py \
            tests/workflows/test_universal_full_research_entrypoint.py \
            tests/workflows/test_universal_oracle_batch_runtime.py \
            tests/workflows/test_universal_teacher_bundle_runtime.py \
            tests/workflows/test_universal_teacher_shared_oracle_identity.py \
            -q
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-universal-final-pytest-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align universal runtime and Studio telemetry contracts'
          git push origin HEAD:codex/universal-real-data-training
