name: Fix universal import order temporary

on:
  push:
    branches:
      - codex/universal-real-data-training

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-real-data-training
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Fix import order and verify
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          files=(
            scripts/materialize_universal_postgres_cache.py
            scripts/run_universal_lagrangian_mechanics.py
            tests/integrations/test_postgres_native_cache_publisher.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest tests/integrations/test_postgres_native_cache_publisher.py -q
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-universal-import-order-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: fix universal import ordering'
          git push origin HEAD:codex/universal-real-data-training
