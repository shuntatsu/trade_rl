name: Fix universal integration mypy temporary

on:
  push:
    branches:
      - codex/universal-real-data-training

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-real-data-training
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply narrow typing repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          callbacks = Path('trade_rl/integrations/sb3_training_callbacks.py')
          text = callbacks.read_text(encoding='utf-8')
          old = '''    if len(callbacks) == 1:\n        return callbacks[0]\n    from stable_baselines3.common.callbacks import CallbackList\n\n    return CallbackList(callbacks)\n'''
          new = '''    from stable_baselines3.common.callbacks import BaseCallback, CallbackList\n\n    if not all(isinstance(callback, BaseCallback) for callback in callbacks):\n        raise TypeError("training callbacks must be Stable-Baselines3 BaseCallback instances")\n    typed_callbacks = [\n        callback for callback in callbacks if isinstance(callback, BaseCallback)\n    ]\n    if len(typed_callbacks) == 1:\n        return typed_callbacks[0]\n    return CallbackList(typed_callbacks)\n'''
          if text.count(old) != 1:
              raise SystemExit('callback repair target drifted')
          callbacks.write_text(text.replace(old, new), encoding='utf-8')

          pretraining = Path('trade_rl/integrations/universal_pretraining.py')
          text = pretraining.read_text(encoding='utf-8')
          old = '''def _concatenate_observations(\n    datasets: Sequence[SupervisedPolicyDataset],\n) -> object:\n'''
          new = '''def _concatenate_observations(\n    datasets: Sequence[SupervisedPolicyDataset],\n) -> np.ndarray | Mapping[str, np.ndarray]:\n'''
          if text.count(old) != 1:
              raise SystemExit('observation typing repair target drifted')
          pretraining.write_text(text.replace(old, new), encoding='utf-8')

          runner = Path('trade_rl/workflows/universal_training_runner.py')
          text = runner.read_text(encoding='utf-8')
          old_import = 'from trade_rl.rl.actions import ACTION_SCHEMA, ActionMode, ActionSpec\n'
          new_import = '''from trade_rl.rl.actions import (\n    ACTION_SCHEMA,\n    ActionMode,\n    ActionSpec,\n    ActionValidationMode,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('action import repair target drifted')
          text = text.replace(old_import, new_import)
          old_value = '            "validation_mode": action.validation_mode.value,\n'
          new_value = '            "validation_mode": ActionValidationMode(action.validation_mode).value,\n'
          if text.count(old_value) != 1:
              raise SystemExit('validation mode repair target drifted')
          runner.write_text(text.replace(old_value, new_value), encoding='utf-8')
          PY
      - name: Verify typing repair
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/integrations/sb3_training_callbacks.py trade_rl/integrations/universal_pretraining.py trade_rl/workflows/universal_training_runner.py
          uv run ruff check trade_rl/integrations/sb3_training_callbacks.py trade_rl/integrations/universal_pretraining.py trade_rl/workflows/universal_training_runner.py
          uv run ruff format --check trade_rl/integrations/sb3_training_callbacks.py trade_rl/integrations/universal_pretraining.py trade_rl/workflows/universal_training_runner.py
          uv run mypy .
      - name: Commit repaired tree and self-delete workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-universal-integration-mypy-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/integrations/sb3_training_callbacks.py trade_rl/integrations/universal_pretraining.py trade_rl/workflows/universal_training_runner.py
          git commit -m 'fix: restore universal integration typing contracts'
          git push origin HEAD:codex/universal-real-data-training
