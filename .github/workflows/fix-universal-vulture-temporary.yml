name: Fix universal vulture temporary

on:
  push:
    branches:
      - codex/universal-real-data-training

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-real-data-training
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Fix vulture findings and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets = (
              Path('tests/workflows/test_binance_universal_runtime.py'),
              Path('tests/workflows/test_universal_runtime_preflight.py'),
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              old = 'lambda *a, **k:'
              if text.count(old) != 1:
                  raise SystemExit(f'expected one vulture target in {path}')
              path.write_text(text.replace(old, 'lambda *_args, **_kwargs:'), encoding='utf-8')
          PY
          uv sync --extra dev --extra train-sb3
          uv run ruff format tests/workflows/test_binance_universal_runtime.py tests/workflows/test_universal_runtime_preflight.py
          uv run ruff check tests/workflows/test_binance_universal_runtime.py tests/workflows/test_universal_runtime_preflight.py
          uv run vulture trade_rl tests --min-confidence 100
          uv run pytest tests/workflows/test_binance_universal_runtime.py tests/workflows/test_universal_runtime_preflight.py -q
      - name: Commit and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-universal-vulture-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: remove universal runtime dead-code findings'
          git push origin HEAD:codex/universal-real-data-training
