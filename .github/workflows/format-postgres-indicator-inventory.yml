name: Format PostgreSQL indicator inventory

on:
  push:
    branches:
      - agent/postgres-indicator-source-inventory

permissions:
  contents: write

concurrency:
  group: format-postgres-indicator-inventory
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/postgres-indicator-source-inventory
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Format and verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format trade_rl/integrations/postgres_indicator_inventory.py
          uv run ruff check \
            trade_rl/integrations/postgres_indicator_inventory.py \
            tests/integrations/test_postgres_indicator_inventory.py
          uv run ruff format --check \
            trade_rl/integrations/postgres_indicator_inventory.py \
            tests/integrations/test_postgres_indicator_inventory.py
          uv run mypy trade_rl/integrations/postgres_indicator_inventory.py
          uv run pytest -q tests/integrations/test_postgres_indicator_inventory.py

      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/format-postgres-indicator-inventory.yml
          git add -A
          git diff --cached --check
          git commit -m 'style(postgres): format indicator inventory adapter'
          git push origin HEAD:refs/heads/agent/postgres-indicator-source-inventory
