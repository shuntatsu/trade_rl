name: Format runs facade RED contract

on:
  push:
    branches:
      - refactor/runs-capability-facade
    paths:
      - .github/workflows/format-runs-facade-red.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Format contract and retire helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format tests/architecture/test_runs_capability_facade.py
          rm .github/workflows/format-runs-facade-red.yml
          uv run ruff format --check tests/architecture/test_runs_capability_facade.py
          uv run ruff check tests/architecture/test_runs_capability_facade.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture/test_runs_capability_facade.py .github/workflows/format-runs-facade-red.yml
          git diff --cached --check
          git commit -m "test: format runs facade RED contract"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
