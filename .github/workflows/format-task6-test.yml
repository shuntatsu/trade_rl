name: Normalize Task 6 test imports

on:
  push:
    branches:
      - agent/pr191-stability-correction-v2

permissions:
  contents: write

concurrency:
  group: format-task6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Normalize imports
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix tests/rl/test_lagrangian_training_config.py
          uv run ruff format tests/rl/test_lagrangian_training_config.py
          rm .github/workflows/format-task6-test.yml
          git add -A
          git diff --cached --check

      - name: Commit normalized test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: normalize Task 6 config test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
