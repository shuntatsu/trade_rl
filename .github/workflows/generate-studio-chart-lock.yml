name: Generate Studio chart lock

on:
  pull_request:
    paths:
      - .github/workflows/generate-studio-chart-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Generate package metadata
        run: npm install --prefix studio --package-lock-only --save-exact --no-audit --no-fund lightweight-charts@5.2.0
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/package.json studio/package-lock.json
          git diff --cached --quiet || git commit -m "feat(studio): add interactive chart dependency"
          git push origin HEAD:${{ github.head_ref }}
