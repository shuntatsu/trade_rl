name: GPU Structured Training Verification

on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: PPO timesteps for the CUDA smoke
        required: false
        type: number
        default: 4096

permissions:
  contents: read

concurrency:
  group: gpu-structured-training-verification
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/reusable-gpu-training-verification.yml
    with:
      timesteps: ${{ inputs.timesteps }}
      runtime_profile: accelerated
      use_docker: false
      artifact_name: gpu-structured-training-evidence
