name: Hierarchical Sequence V2 Migration

on:
  push:
    branches:
      - agent/cross-timeframe-attention
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hierarchical-sequence-v2-publish
  cancel-in-progress: true

jobs:
  migrate-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export

      - name: Apply deterministic v2 migration
        run: |
          set -euo pipefail
          cp tools/apply_hierarchical_sequence_v2.py /tmp/apply_hierarchical_sequence_v2.py
          uv run python tools/bootstrap_hierarchical_sequence_v2.py
          uv run python tools/bootstrap_hierarchical_sequence_v2_scan.py
          uv run python tools/bootstrap_hierarchical_sequence_v2_dynamic.py
          uv run python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tools/apply_hierarchical_sequence_v2.py')
          spec = importlib.util.spec_from_file_location('migration', path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load v2 migration')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module._migrate_training_config()
          module._migrate_training_run_schema()
          module._migrate_sequence_policy()
          module._migrate_policies()
          module._migrate_model_assembly()
          module._migrate_python_sources()
          module._migrate_json_configs()
          module._add_contract_tests()
          PY
          uv run python tools/apply_legacy_mapping_keys_v2.py
          uv run python tools/apply_sequence_architecture_identity_v2.py
          uv run python tools/apply_sequence_test_staleness_v2.py
          uv run python tools/apply_hierarchical_v2_nested_cleanup.py
          uv run python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tools/apply_hierarchical_sequence_v2.py')
          spec = importlib.util.spec_from_file_location('scan', path)
          if spec is None or spec.loader is None:
              raise RuntimeError('cannot load legacy scan')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module._assert_legacy_contract_removed()
          PY
          mv /tmp/apply_hierarchical_sequence_v2.py tools/apply_hierarchical_sequence_v2.py

      - name: Verify generated tree
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest -q \
            tests/rl/test_observation_encoder_v2.py \
            tests/rl/test_gated_transformer.py \
            tests/rl/test_timeframe_fusion.py \
            tests/rl/test_hierarchical_sequence_policy_v2.py \
            tests/rl/test_sequence_architecture_identity.py \
            tests/rl/test_sequence_policy_core.py \
            tests/rl/test_training_config_active_fields.py \
            tests/workflows/test_training_run_config.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/integrations/test_sb3_training_active_architecture.py
          uv run mypy trade_rl
          uv run python -m compileall trade_rl

      - name: Remove migration-only machinery
        run: |
          rm -f \
            tools/apply_hierarchical_sequence_v2.py \
            tools/bootstrap_hierarchical_sequence_v2.py \
            tools/bootstrap_hierarchical_sequence_v2_scan.py \
            tools/bootstrap_hierarchical_sequence_v2_dynamic.py \
            tools/apply_legacy_mapping_keys_v2.py \
            tools/apply_sequence_architecture_identity_v2.py \
            tools/apply_sequence_test_staleness_v2.py \
            tools/apply_hierarchical_v2_nested_cleanup.py \
            tools/apply_hierarchical_v2_contract_cleanup.py \
            .github/workflows/hierarchical-sequence-v2-test-diagnostics.yml \
            .github/workflows/hierarchical-sequence-v2-migration.yml
          rm -rf hierarchical-v2-* coverage.xml .coverage

      - name: Publish one verified commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes to publish.'
            exit 1
          fi
          git commit -m 'refactor: migrate observation encoder contract to v2'
          git push origin HEAD:agent/cross-timeframe-attention
