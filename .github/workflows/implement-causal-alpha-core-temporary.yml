name: Implement causal alpha core temporary

on:
  push:
    branches:
      - feature/universal-causal-alpha-teacher

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feature/universal-causal-alpha-teacher
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply minimal core integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          training = Path('trade_rl/rl/training.py')
          text = training.read_text(encoding='utf-8')
          old = '''        if self.behavior_cloning_teacher not in {"oracle", "trend_baseline"}:\n            raise ValueError(\n                "behavior_cloning_teacher must be oracle or trend_baseline"\n            )\n'''
          new = '''        if self.behavior_cloning_teacher not in {\n            "oracle",\n            "trend_baseline",\n            "causal_alpha_ridge",\n        }:\n            raise ValueError(\n                "behavior_cloning_teacher must be oracle, trend_baseline, or "\n                "causal_alpha_ridge"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('behavior cloning teacher validation target drifted')
          training.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('tests/learning/test_causal_alpha_teacher.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''    assert model.constant_mask.tolist() == [False, True]\n    assert model.scaled_training_features[:, 1].tolist() == [0.0, 0.0, 0.0]\n    prediction = model.predict(np.asarray([[7.0, 7.0]], dtype=np.float64))[0]\n'''
          new = '''    assert model.constant_mask.tolist() == [False, True]\n    scaled = model.transform(features[model.eligible_indices])\n    assert scaled[:, 1].tolist() == [0.0, 0.0, 0.0]\n    prediction = model.predict(np.asarray([[7.0, 7.0]], dtype=np.float64))[0]\n'''
          if text.count(old) != 1:
              raise SystemExit('scaled feature assertion target drifted')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          module = Path('trade_rl/learning/causal_alpha_teacher.py')
          text = module.read_text(encoding='utf-8')
          old = '''    @property\n    def scaled_training_features(self) -> np.ndarray:\n        """Deprecated diagnostic seam; callers should use ``transform`` explicitly."""\n\n        return np.zeros((self.sample_count, len(self.feature_names)), dtype=np.float64)\n\n'''
          if text.count(old) != 1:
              raise SystemExit('temporary scaled training seam target drifted')
          module.write_text(text.replace(old, ''), encoding='utf-8')
          PY
      - name: Verify core GREEN
        run: |
          set -euo pipefail
          uv sync --extra dev
          files=(
            trade_rl/learning/causal_alpha_teacher.py
            trade_rl/rl/training.py
            tests/learning/test_causal_alpha_teacher.py
            tests/rl/test_causal_alpha_teacher_config.py
          )
          uv run ruff check --fix --select I "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy trade_rl/learning/causal_alpha_teacher.py trade_rl/rl/training.py
          uv run pytest tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py -q
      - name: Commit verified core and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/implement-causal-alpha-core-temporary.yml
          git add trade_rl/learning/causal_alpha_teacher.py trade_rl/rl/training.py tests/learning/test_causal_alpha_teacher.py tests/rl/test_causal_alpha_teacher_config.py
          git commit -m 'feat: implement causal alpha signal core'
          git push origin HEAD:feature/universal-causal-alpha-teacher
