          new = '''from trade_rl.learning.episode_oracle_teacher import (\n    EpisodeOracleBatch,\n    OracleEpisodeContract,\n)\nfrom trade_rl.rl.universal_instrument_binding import InstrumentDatasetBinding\n'''
