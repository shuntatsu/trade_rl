name: Issue 452 one-shot reviewed branch cleanup
on:
  push:
    branches: [refactor/issue-452-guardrails]
    paths: [.github/workflows/issue-452-cleanup.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: issue-452-reviewed-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact refs and retained evidence, then atomically delete reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          """One-shot, SHA-guarded branch cleanup; no source changes or history rewriting."""
          import ast
          import copy
          import json
          import subprocess
          
          REPO = 'shuntatsu/trade_rl'
          BASE = '8ebc8eb29208d3c119d2487724859cab80db0bef'
          BRANCH = 'refactor/issue-452-guardrails'
          CANDIDATES = {
              'design/canonical-m2-study-bootstrap': '1a5d5ea5ec33e5dd5eb1b301e32c31abe9f36765',
              'design/controlled-experiment-loop-v1': 'b748da2339c7e629bfcc111dc7bd02222eb4cd18',
              'feat/canonical-m2-study-bootstrap': '10f8d4a4896f1dfda01814223887626252aaa84b',
              'feat/controlled-experiment-loop-v1': '709534fe5aa2dbd878f6e8836d17049108c31c9e',
              'refactor/candidate-run-core-v1': '08ee55037db1d373f1660f30de0f80a09c5b3d78',
              'research/m2-canonical-study-001-exec': BASE,
              'research/m2-canonical-study-001-final': BASE,
              'research/m2-canonical-study-001-live': BASE,
              'research/m2-canonical-study-001-run': BASE,
              'research/m2-canonical-study-001-work': BASE,
              'research/m2-preflight-active': BASE,
              'research/m2-source-preflight-20260910': BASE,
              'research/m2-source-preflight-run': BASE,
              'tmp/cel-delta-contract-fix-export': 'a3d9dc5052e34cac447d4118336bb90c1cabda23',
          }
          
          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout.strip()
          
          def git(*args):
              return run('git', *args)
          
          def api(path):
              return json.loads(run('gh', 'api', f'repos/{REPO}/{path}'))
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          def refs():
              return {ref.removeprefix('refs/heads/'): sha for sha, ref in
                      (line.split() for line in git('ls-remote', '--heads', 'origin').splitlines())}
          
          def ensure_no_active_reference():
              pages = json.loads(run('gh', 'api', '--paginate', '--slurp',
                                    f'repos/{REPO}/pulls?state=open&per_page=100'))
              protected = {'main', BRANCH, 'fix/binance-usdm-exchange-info-fallback',
                           'research/m2-canonical-study-001'}
              for page in pages:
                  for pr in page:
                      if pr['head']['repo'] and pr['head']['repo']['full_name'] == REPO:
                          protected.add(pr['head']['ref'])
                      protected.add(pr['base']['ref'])
              require(not (protected & CANDIDATES.keys()), 'candidate is protected by open PR')
              for status in ('in_progress', 'queued', 'waiting'):
                  pages = json.loads(run('gh', 'api', '--paginate', '--slurp',
                                        f'repos/{REPO}/actions/runs?status={status}&per_page=100'))
                  for page in pages:
                      for workflow in page['workflow_runs']:
                          require(workflow['head_branch'] not in CANDIDATES,
                                  'candidate has an active workflow')
          
          def closed_pr(number, sha):
              pr = api(f'pulls/{number}')
              require(pr['state'] == 'closed' and pr['head']['sha'] == sha,
                      'closed PR proof has changed')
              git('fetch', 'origin', f'refs/pull/{number}/head')
              require(git('rev-parse', 'FETCH_HEAD') == sha, 'retained PR ref differs')
          
          def delta_tree(sha):
              return ast.parse(git('show', f'{sha}:trade_rl/evaluation/experiments/delta.py'))
          
          def delta_method(tree):
              cls = next(n for n in tree.body if isinstance(n, ast.ClassDef)
                         and n.name == 'ControlledVerification')
              return next(n for n in cls.body if isinstance(n, ast.FunctionDef)
                          and n.name == '__post_init__')
          
          def without_delta_method(tree):
              result = copy.deepcopy(tree)
              cls = next(n for n in result.body if isinstance(n, ast.ClassDef)
                         and n.name == 'ControlledVerification')
              cls.body.remove(delta_method(result))
              return ast.dump(result, include_attributes=False)
          
          before = refs()
          require(before.get('main') == BASE, 'main moved; re-audit required')
          ensure_no_active_reference()
          proofs = {}
          for name, sha in CANDIDATES.items():
              require(before.get(name) == sha, f'{name} moved or is absent; re-audit required')
              ancestor = subprocess.run(['git', 'merge-base', '--is-ancestor', sha, BASE])
              require(ancestor.returncode in (0, 1), 'cannot establish ancestry')
              if ancestor.returncode == 0:
                  proofs[name] = 'identical-to-or-ancestor-of-main'
                  continue
              mb = git('merge-base', BASE, sha)
              changed = set(git('diff', '--name-only', mb, sha).splitlines())
              if name == 'refactor/candidate-run-core-v1':
                  closed_pr(448, sha)
                  require(git('rev-parse', f'{sha}^{{tree}}') ==
                          git('rev-parse', f'{mb}^{{tree}}'), 'Run Core has unique final changes')
                  proofs[name] = 'same-tree-as-ancestor; retained-closed-PR-448'
              elif name == 'design/controlled-experiment-loop-v1':
                  closed_pr(447, sha)
                  require(changed == {'docs/specs/2026-09-09-controlled-experiment-loop-v1-review-amendment.md'},
                          'old design has unexpected unique changes')
                  proofs[name] = 'superseded-doc-only; exact-history-retained-by-PR-447'
              elif name == 'tmp/cel-delta-contract-fix-export':
                  require(changed == {'.github/workflows/cel-delta-contract-fix.yml',
                                      'trade_rl/evaluation/experiments/delta.py'}, 'export scope differs')
                  require(without_delta_method(delta_tree(mb)) == without_delta_method(delta_tree(sha)),
                          'export changed more than the reviewed method')
                  require(ast.dump(delta_method(delta_tree(sha))) == ast.dump(delta_method(delta_tree(BASE))),
                          'exported contract fix is not present in main')
                  require(not git('ls-tree', '-r', '--name-only', BASE, '.github/workflows/cel-delta-contract-fix.yml'),
                          'retired helper still exists in main')
                  proofs[name] = 'unique-method-AST-preserved-in-main; helper-retired'
              else:
                  raise RuntimeError(f'no containment proof for {name}')
          
          require(refs() == before, 'remote branches moved during verification')
          ensure_no_active_reference()
          print(json.dumps({'before': before, 'proofs': proofs}, sort_keys=True), flush=True)
          # Explicit leases are compare-and-delete guards. No non-deletion refspec or
          # force flag is used, and main is never a push target.
          leases = [f'--force-with-lease=refs/heads/{name}:{sha}' for name, sha in CANDIDATES.items()]
          deletions = [f':refs/heads/{name}' for name in CANDIDATES]
          command = ['git', 'push', '--atomic', '--porcelain', *leases, 'origin', *deletions]
          run(*command[:2], '--dry-run', *command[2:])
          print(run(*command), flush=True)
          after = refs()
          require(after.get('main') == BASE, 'main changed during cleanup')
          require(not (after.keys() & CANDIDATES.keys()), 'some candidates remain')
          for name in before.keys() - CANDIDATES.keys():
              require(after.get(name) == before[name], f'preserved branch changed: {name}')
          print(json.dumps({'deleted': sorted(CANDIDATES), 'after': after}, sort_keys=True), flush=True)
          PY
