name: Format and verify runtime publish GREEN

on:
  push:
    branches:
      - fix/runtime-performance-publish-once

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/runtime-performance-publish-once
          fetch-depth: 2

      - name: Guard expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "73b3ebf25895f581afcd5dac560a5591e18595a3"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Format production file
        run: uv run ruff format trade_rl/simulation/diagnostics/runtime_performance_io.py

      - name: Targeted GREEN verification
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/simulation/test_runtime_performance_publish_once.py \
            tests/simulation/test_runtime_performance.py \
            tests/simulation/test_runtime_performance_artifact_identity.py \
            tests/simulation/test_runtime_performance_approval.py
          uv run ruff check \
            trade_rl/simulation/diagnostics/runtime_performance_io.py \
            tests/simulation/test_runtime_performance_publish_once.py
          uv run ruff format --check \
            trade_rl/simulation/diagnostics/runtime_performance_io.py \
            tests/simulation/test_runtime_performance_publish_once.py
          uv run mypy trade_rl/simulation/diagnostics/runtime_performance_io.py
          git diff --check

      - name: Commit formatted GREEN and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-452-runtime-publish-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/simulation/diagnostics/runtime_performance_io.py
          git commit -m "style: finalize runtime publish-once fix"
          git push origin HEAD:fix/runtime-performance-publish-once
