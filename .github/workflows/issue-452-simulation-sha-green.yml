name: Apply simulation SHA authority GREEN

on:
  push:
    branches:
      - refactor/simulation-sha256-authority

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/simulation-sha256-authority
          fetch-depth: 2

      - name: Guard expected parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "08f3c013184400c41b2a7d9d40394bfc008209b7"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev

      - name: Apply exact minimal production replacements
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("trade_rl/simulation/orders/model.py"): (
                  (
                      "import numpy as np\n\nfrom trade_rl.artifacts.canonical import canonical_json_bytes\n",
                      "import numpy as np\n\nfrom trade_rl._validation import require_sha256\nfrom trade_rl.artifacts.canonical import canonical_json_bytes\n",
                  ),
                  (
                      '''def _validate_digest(name: str, value: str) -> None:\n    if len(value) != 64 or any(\n        character not in "0123456789abcdef" for character in value\n    ):\n        raise OrderDomainError(f"{name} must be a lowercase SHA-256 digest")\n''',
                      '''def _validate_digest(name: str, value: str) -> None:\n    try:\n        require_sha256(value, field=name)\n    except ValueError as error:\n        raise OrderDomainError(str(error)) from error\n''',
                  ),
              ),
              Path("trade_rl/simulation/orders/reconciliation.py"): (
                  (
                      "import numpy as np\n\nfrom trade_rl.simulation.accounting import BookState\n",
                      "import numpy as np\n\nfrom trade_rl._validation import require_sha256\nfrom trade_rl.simulation.accounting import BookState\n",
                  ),
                  (
                      '''def _validate_digest(value: str) -> None:\n    if len(value) != 64 or any(\n        character not in "0123456789abcdef" for character in value\n    ):\n        raise OrderReconciliationError(\n            "execution_policy_digest must be a lowercase SHA-256 digest"\n        )\n''',
                      '''def _validate_digest(value: str) -> None:\n    try:\n        require_sha256(value, field="execution_policy_digest")\n    except ValueError as error:\n        raise OrderReconciliationError(str(error)) from error\n''',
                  ),
              ),
              Path("trade_rl/simulation/liquidity.py"): (
                  (
                      "from typing import Sequence\n\n_TOLERANCE = 1e-12\n",
                      "from typing import Sequence\n\nfrom trade_rl._validation import require_sha256\n\n_TOLERANCE = 1e-12\n",
                  ),
                  (
                      '''def _validate_digest(name: str, value: str) -> None:\n    if len(value) != 64 or any(\n        character not in "0123456789abcdef" for character in value\n    ):\n        raise LiquidityAllocationError(f"{name} must be a lowercase SHA-256 digest")\n''',
                      '''def _validate_digest(name: str, value: str) -> None:\n    try:\n        require_sha256(value, field=name)\n    except ValueError as error:\n        raise LiquidityAllocationError(str(error)) from error\n''',
                  ),
              ),
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one match in {path}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Targeted GREEN verification
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/architecture/test_simulation_digest_authority.py \
            tests/simulation/test_orders.py \
            tests/simulation/test_order_reconciliation.py \
            tests/simulation/test_liquidity.py \
            tests/simulation/test_liquidity_volume_units.py
          uv run ruff check \
            trade_rl/simulation/orders/model.py \
            trade_rl/simulation/orders/reconciliation.py \
            trade_rl/simulation/liquidity.py \
            tests/architecture/test_simulation_digest_authority.py
          uv run ruff format --check \
            trade_rl/simulation/orders/model.py \
            trade_rl/simulation/orders/reconciliation.py \
            trade_rl/simulation/liquidity.py \
            tests/architecture/test_simulation_digest_authority.py
          uv run mypy \
            trade_rl/simulation/orders/model.py \
            trade_rl/simulation/orders/reconciliation.py \
            trade_rl/simulation/liquidity.py
          git diff --check

      - name: Commit GREEN and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-452-simulation-sha-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/simulation/orders/model.py \
            trade_rl/simulation/orders/reconciliation.py \
            trade_rl/simulation/liquidity.py
          git commit -m "refactor: delegate simulation SHA validation"
          git push origin HEAD:refactor/simulation-sha256-authority
