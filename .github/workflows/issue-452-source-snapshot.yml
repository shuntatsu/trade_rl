name: Issue 452 isolated verification tools
on:
  push:
    branches: [refactor/issue-452-guardrails]
    paths: [.github/workflows/issue-452-source-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: issue-452-verification-tools
  cancel-in-progress: true
jobs:
  retire_previous:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Stop only this task's superseded export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=repos/shuntatsu/trade_rl/actions/runs/34512808719
          test "$(gh api "$target" --jq .head_sha)" = 22941de96543832d17707ba0ad10e3e315c8b5a7
          status="$(gh api "$target" --jq .status)"
          if test "$status" != completed; then
            gh api --method POST "$target/cancel"
          fi
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install explicit managed Python and repository dev tools
        run: |
          uv python install 3.12
          uv sync --extra dev --python "$(uv python find --managed-python 3.12)"
      - name: Export bounded public runtime directories only
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          import sysconfig
          import tarfile
          from pathlib import Path
          base = Path(sys.base_prefix)
          site = Path(sysconfig.get_paths()['purelib'])
          print(json.dumps({'python': sys.version, 'base': str(base), 'site': str(site)}), flush=True)
          if base in (Path('/'), Path('/usr'), Path('/usr/local')):
              raise RuntimeError('managed standalone Python required')
          sources = (base, site)
          size = sum(p.stat().st_size for source in sources for p in source.rglob('*') if p.is_file())
          if size > 800_000_000:
              raise RuntimeError(f'public runtime export unexpectedly large: {size}')
          root = Path('verification-tools')
          root.mkdir()
          shutil.copytree(base, root / 'python', symlinks=True,
                          ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copytree(site, root / 'site-packages', symlinks=True,
                          ignore=shutil.ignore_patterns('__pycache__'))
          shutil.copy2('.venv/bin/ruff', root / 'ruff')
          out = Path('verification-tools.tar.gz')
          with tarfile.open(out, 'w:gz', compresslevel=2) as archive:
              archive.add(root, arcname='tools')
          Path('verification-tools.sha256').write_text(hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-452-verification-tools
          path: |
            verification-tools.tar.gz
            verification-tools.sha256
          if-no-files-found: error
          retention-days: 1
