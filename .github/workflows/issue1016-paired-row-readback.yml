name: Issue1016 source-only pairing readback (temporary)

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/issue1016-paired-row-readback.yml

permissions:
  contents: read
  actions: read

jobs:
  source-only:
    if: github.event.pull_request.number == 1017
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - name: Install pre-existing Python dependencies
        run: uv sync --locked --extra dev
      - name: Download fixed immutable artifact and inspect structural-only prefix
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARCHIVE: ${{ runner.temp }}/canonical-source-artifact.zip
          REPORT_PATH: ${{ runner.temp }}/issue1016-structural.json
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10301701698/zip" > "$BASELINE_ARCHIVE"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile
          import zipfile
          import numpy as np
          
          expected_outer = "f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a"
          expected_id = "d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f"
          expected_artifact = "77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8"
          requested = ("1h__linear_regression_slope_24bar", "1h__trend_r2_24bar")
          archive_path = Path(os.environ["BASELINE_ARCHIVE"])
          report_path = Path(os.environ["REPORT_PATH"])
          h = hashlib.sha256()
          with archive_path.open("rb") as fh:
              for chunk in iter(lambda: fh.read(8 * 1024 * 1024), b""):
                  h.update(chunk)
          assert h.hexdigest() == expected_outer, "outer raw ZIP digest drift"
          assert archive_path.stat().st_size == 490015573, "outer raw ZIP size drift"
          
          def read_prefix(archive, name, rows):
              with archive.open(name + ".npy") as fh:
                  magic = np.lib.format.read_magic(fh)
                  if magic == (1, 0):
                      shape, fortran, dtype = np.lib.format.read_array_header_1_0(fh)
                  elif magic == (2, 0):
                      shape, fortran, dtype = np.lib.format.read_array_header_2_0(fh)
                  else:
                      raise ValueError("unsupported numpy array header")
                  if fortran or not shape or rows > shape[0] or dtype.hasobject:
                      raise ValueError("unsafe numpy array layout")
                  needed = rows * int(np.prod(shape[1:])) * dtype.itemsize
                  payload = fh.read(needed)
                  if len(payload) != needed:
                      raise ValueError("short npy prefix")
                  data = np.frombuffer(payload, dtype=dtype).reshape((rows, *shape[1:]))
                  return data, shape, dtype.str
          
          with zipfile.ZipFile(archive_path) as outer:
              members = outer.namelist()
              if len(set(members)) != len(members):
                  raise ValueError("duplicate outer ZIP members")
              if any(name.startswith("/") or ".." in Path(name).parts for name in members):
                  raise ValueError("unsafe ZIP pathname")
              candidates = [name for name in members if name.endswith("dataset/manifest.json")]
              if len(candidates) != 1:
                  # Structural listing only: no user/model/market numeric values.
                  print(json.dumps({"candidate_count": len(candidates), "dataset_members": [name for name in members if "dataset/" in name][:20]}, sort_keys=True))
                  raise ValueError("unique dataset/manifest.json absent")
              manifest_name = candidates[0]
              root = manifest_name.removesuffix("manifest.json")
              arrays_name = root + "arrays.npz"
              if arrays_name not in members:
                  raise ValueError("paired arrays.npz absent")
              manifest_bytes = outer.read(manifest_name)
              manifest = json.loads(manifest_bytes)
              assert manifest["dataset_id"] == expected_id, "Dataset ID drift"
              assert manifest["artifact_digest"] == expected_artifact, "Dataset digest drift"
              assert manifest["schema_version"] == "market_dataset_artifact_v3", "schema drift"
              names = tuple(manifest["dataset"]["feature_names"])
              symbols = tuple(manifest["dataset"]["symbols"])
              assert symbols == ("BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","ADAUSDT"), "symbol roster drift"
              if not all(n in names for n in requested):
                  print(json.dumps({"available": False, "nfeatures": len(names), "missing": [n for n in requested if n not in names]}, sort_keys=True))
                  raise ValueError("frozen Dataset lacks required feature names")
              indices = [names.index(n) for n in requested]
              shape = tuple(manifest["arrays"]["feature_available"]["shape"])
              assert len(shape) == 3 and shape[1] == len(symbols) and shape[2] == len(names), "mask shape drift"
              info = outer.getinfo(arrays_name)
              assert info.file_size <= 1200000000, "unexpected arrays.npz size"
          
              with tempfile.TemporaryDirectory(prefix="issue1016-structural-") as temp:
                  inner_path = Path(temp) / "arrays.npz"
                  inner_hash = hashlib.sha256()
                  with outer.open(arrays_name) as src, inner_path.open("wb") as dst:
                      while True:
                          chunk = src.read(8 * 1024 * 1024)
                          if not chunk:
                              break
                          inner_hash.update(chunk)
                          dst.write(chunk)
                  assert inner_hash.hexdigest() == manifest["arrays_digest"], "arrays SHA mismatch"
                  with zipfile.ZipFile(inner_path) as arrays:
                      limited = min(shape[0], 17550)
                      timestamp_prefix, timestamp_shape, _ = read_prefix(arrays, "timestamps", limited)
                      assert timestamp_shape[0] == shape[0], "timestamp length drift"
                      cutoff = np.datetime64("2023-01-01T00", "ns")
                      stop = int(np.searchsorted(timestamp_prefix, cutoff))
                      assert 17000 < stop < limited, "training-era cutoff not in timestamp prefix"
                      timestamps = timestamp_prefix[:stop]
                      assert (timestamps < cutoff).all(), "future time included"
                      mask, mask_shape, _ = read_prefix(arrays, "feature_available", stop)
                      age, age_shape, _ = read_prefix(arrays, "feature_staleness_hours", stop)
                      stale, stale_shape, _ = read_prefix(arrays, "feature_staleness", stop)
                      assert mask_shape == age_shape == stale_shape == shape, "mask/age schema drift"
                      actual_available = mask[:, :, indices]
                      actual_age = age[:, :, indices]
                      actual_stale = stale[:, :, indices]
                      assert actual_available.dtype == np.dtype("bool"), "mask not bool"
                      assert np.isfinite(actual_age).all() and np.isfinite(actual_stale).all(), "nonfinite staleness"
                      assert ((actual_age >= 0) & (actual_stale >= 0) & (actual_stale <= 1)).all(), "invalid staleness bounds"
                      rows = []
                      for year in (2021, 2022):
                          year_sel = timestamps.astype("datetime64[Y]").astype(int) + 1970 == year
                          for si, symbol in enumerate(symbols):
                              for fi, name in enumerate(requested):
                                  flag = actual_available[year_sel, si, fi]
                                  age_col = actual_age[year_sel, si, fi]
                                  rows.append({
                                      "year":year, "symbol":symbol, "feature":name,
                                      "rows":int(flag.size), "available":int(flag.sum()),
                                      "fresh":int((flag & (age_col == 0)).sum()),
                                      "carried":int((flag & (age_col > 0)).sum())
                                  })
                      report = {
                          "schema":"issue1016_source_only_feature_structural_v1",
                          "scope":"pre-2023 masks and clock only; no prices, labels, forecast, P&L",
                          "github_artifact_id":10301701698,
                          "raw_zip_sha256":expected_outer,
                          "dataset_id":expected_id,
                          "dataset_artifact_digest":expected_artifact,
                          "manifest_sha256":hashlib.sha256(manifest_bytes).hexdigest(),
                          "row_count_pre2023":stop,
                          "feature_count":len(names),
                          "selected_indices":indices,
                          "rows":rows,
                          "proves_external_ingestion_clock":False,
                          "proves_prediction_value":False
                      }
                      report_path.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf-8")
                      print(json.dumps({
                          "status":"STRUCTURAL_SOURCE_READBACK_SUCCESS",
                          "pre2023_rows":stop,"features":list(requested),
                          "mask_entries":len(rows),"external_ingestion_proven":False
                      },sort_keys=True))
          PY
      - name: Check baseline and candidate common-row membership (source-only)
        env:
          BASELINE_ARCHIVE: ${{ runner.temp }}/canonical-source-artifact.zip
          PAIR_REPORT: ${{ runner.temp }}/issue1016-paired-rows.json
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tempfile
          import zipfile
          import numpy as np

          BASE = (
              "1h__log_return_1bar",
              "1h__log_return_4bar",
              "1h__log_return_24bar",
              "1h__realized_volatility_24bar",
              "1h__volume_zscore_24bar",
              "1h__funding_bps",
              "1h__rsi_14bar",
              "1h__macd_histogram_12_26_9",
              "4h__log_return_4bar",
              "4h__realized_volatility_24bar",
              "1d__log_return_1bar",
              "1d__realized_volatility_24bar",
          )
          DELTA = ("1h__linear_regression_slope_24bar", "1h__trend_r2_24bar")
          SYMBOLS = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT")
          archive_path = Path(os.environ["BASELINE_ARCHIVE"])
          report_path = Path(os.environ["PAIR_REPORT"])
          outer_sha = "f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a"
          dataset_id = "d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f"
          dataset_digest = "77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8"

          def read_prefix(archive, name, rows):
              with archive.open(name + ".npy") as fh:
                  magic = np.lib.format.read_magic(fh)
                  if magic == (1, 0):
                      shape, fortran, dtype = np.lib.format.read_array_header_1_0(fh)
                  elif magic == (2, 0):
                      shape, fortran, dtype = np.lib.format.read_array_header_2_0(fh)
                  else:
                      raise ValueError("unsupported NPY version")
                  if fortran or not shape or rows > shape[0] or dtype.hasobject:
                      raise ValueError("unsafe NPY array")
                  size = rows * int(np.prod(shape[1:])) * dtype.itemsize
                  payload = fh.read(size)
                  if len(payload) != size:
                      raise ValueError("truncated NPY prefix")
                  return np.frombuffer(payload, dtype=dtype).reshape(
                      (rows, *shape[1:])
                  ), shape

          with zipfile.ZipFile(archive_path) as outer:
              members = outer.namelist()
              if len(members) != len(set(members)):
                  raise ValueError("duplicate outer ZIP member")
              if any(s.startswith("/") or ".." in Path(s).parts for s in members):
                  raise ValueError("unsafe ZIP member name")
              candidates = [s for s in members if s.endswith("dataset/manifest.json")]
              if len(candidates) != 1:
                  raise ValueError("unique source manifest missing")
              manifest_path = candidates[0]
              arrays_path = manifest_path.removesuffix("manifest.json") + "arrays.npz"
              if arrays_path not in members:
                  raise ValueError("paired array ZIP missing")
              manifest = json.loads(outer.read(manifest_path))
              if manifest["dataset_id"] != dataset_id or manifest["artifact_digest"] != dataset_digest:
                  raise ValueError("frozen source identity mismatch")
              if manifest["schema_version"] != "market_dataset_artifact_v3":
                  raise ValueError("unexpected Dataset schema")
              names = tuple(manifest["dataset"]["feature_names"])
              symbols = tuple(manifest["dataset"]["symbols"])
              if symbols != SYMBOLS or len(names) != 167:
                  raise ValueError("roster mismatch")
              roster = BASE + DELTA
              if len(roster) != len(set(roster)) or not set(roster).issubset(names):
                  raise ValueError("frozen feature roster unavailable")
              indices = tuple(names.index(n) for n in roster)
              with tempfile.TemporaryDirectory(prefix="issue1016-paired-") as td:
                  path = Path(td) / "arrays.npz"
                  h = hashlib.sha256()
                  with outer.open(arrays_path) as src, path.open("wb") as dst:
                      for chunk in iter(lambda: src.read(8 * 1024 * 1024), b""):
                          h.update(chunk)
                          dst.write(chunk)
                  if h.hexdigest() != manifest["arrays_digest"]:
                      raise ValueError("frozen NPZ SHA mismatch")
                  with zipfile.ZipFile(path) as arrays:
                      prefix, full_ts_shape = read_prefix(arrays, "timestamps", 17550)
                      if full_ts_shape[0] < 17550:
                          raise ValueError("truncated source time axis")
                      stop = int(np.searchsorted(prefix, np.datetime64("2023-01-01T00", "ns")))
                      if stop != 17519:
                          raise ValueError("pre-2023 row count mismatch")
                      ts = prefix[:stop]
                      if ts[0] != np.datetime64("2021-01-01T01", "ns"):
                          raise ValueError("prefix first-time mismatch")
                      mask, mask_shape = read_prefix(arrays, "feature_available", stop)
                      available_at, clock_shape = read_prefix(arrays, "available_at", stop)
                      information, info_shape = read_prefix(arrays, "information_available", stop)
                      if mask_shape != tuple(manifest["arrays"]["feature_available"]["shape"]):
                          raise ValueError("mask manifest shape mismatch")
                      if mask_shape[1:] != (5, 167) or clock_shape[1:] != (5,) or info_shape[1:] != (5,):
                          raise ValueError("structural array shape mismatch")
                      if mask.dtype != np.dtype("bool") or information.dtype != np.dtype("bool"):
                          raise ValueError("mask dtype mismatch")
                      if available_at.dtype != np.dtype("datetime64[ns]"):
                          raise ValueError("availability time dtype mismatch")
                      if np.isnat(available_at).any():
                          raise ValueError("NaT in declared availability")
                      nbase = len(BASE)
                      selected = mask[:, :, list(indices)]
                      source_b = np.all(selected[:, :, :nbase], axis=2)
                      source_c = np.all(selected, axis=2)
                      if np.any(source_c & ~source_b):
                          raise ValueError("candidate mask is not a subset")
                      time_ns = ts.astype("datetime64[ns]").astype(np.int64)
                      lookup = {int(v): j for j, v in enumerate(time_ns)}
                      rows = []
                      for year in (2021, 2022):
                          start = np.datetime64(f"{year}-01-01T00", "ns")
                          cutoff = np.datetime64(f"{year+1}-01-01T00", "ns")
                          for si, symbol in enumerate(symbols):
                              b, c, ab, ac = [], [], [], []
                              for t in range(stop):
                                  if not (start <= ts[t] < cutoff):
                                      continue
                                  e = lookup.get(int(time_ns[t]) + 24 * 3_600_000_000_000)
                                  if e is None or ts[e] >= cutoff:
                                      continue
                                  if available_at[t, si] > cutoff or available_at[e, si] > cutoff:
                                      continue
                                  pair = (symbol, int(t), int(e))
                                  bflag = bool(source_b[t, si])
                                  cflag = bool(source_c[t, si])
                                  if bflag:
                                      b.append(pair)
                                  if cflag:
                                      c.append(pair)
                                  asof = bool(information[t, si]) and available_at[t, si] <= ts[t]
                                  if asof and bflag:
                                      ab.append(pair)
                                  if asof and cflag:
                                      ac.append(pair)
                              def digest(pairs):
                                  h = hashlib.sha256()
                                  for sym, src, tgt in pairs:
                                      h.update(f"{sym}|{src}|{tgt}\n".encode("utf-8"))
                                  return h.hexdigest()
                              if not set(c).issubset(set(b)) or not set(ac).issubset(set(ab)):
                                  raise ValueError("unmatched feature subset")
                              rows.append({
                                  "year": year,
                                  "symbol": symbol,
                                  "baseline_count": len(b),
                                  "candidate_count": len(c),
                                  "baseline_only": len(set(b) - set(c)),
                                  "candidate_only": len(set(c) - set(b)),
                                  "identities_equal": b == c,
                                  "baseline_identity_sha256": digest(b),
                                  "candidate_identity_sha256": digest(c),
                                  "declared_asof_baseline_count": len(ab),
                                  "declared_asof_candidate_count": len(ac),
                                  "declared_asof_identical": ab == ac,
                                  "declared_asof_candidate_identity_sha256": digest(ac),
                                  "asof_censored_count": len(set(c) - set(ac)),
                              })
                      report = {
                          "schema": "issue1016_paired_train_score_membership_v1",
                          "scope": "mask/time-only 2021 fit and 2022 diagnostic; no numeric prices, targets, forecasts or P&L",
                          "source_artifact_id": 10301701698,
                          "raw_zip_sha256": outer_sha,
                          "dataset_id": dataset_id,
                          "dataset_digest": dataset_digest,
                          "manifest_sha256": hashlib.sha256(outer.read(manifest_path)).hexdigest(),
                          "all_arms_equal": all(r["identities_equal"] for r in rows),
                          "declared_asof_arms_equal": all(r["declared_asof_identical"] for r in rows),
                          "feature_roster": list(roster),
                          "feature_indices": list(indices),
                          "row_count_pre2023": stop,
                          "cells": rows,
                          "proves_real_provider_publication_time": False,
                          "proves_predictive_or_economic_value": False,
                      }
                      if len(rows) != 10:
                          raise ValueError("missing cells")
                      report_path.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
                      print(json.dumps({
                          "status": "PAIRED_SOURCE_MASK_AUDIT_COMPLETED",
                          "year_symbol_cells": len(rows),
                          "all_arms_equal": report["all_arms_equal"],
                          "declared_asof_arms_equal": report["declared_asof_arms_equal"],
                          "read_market_outcomes": False,
                      }, sort_keys=True))
          PY
      - name: Publish paired-row receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue1016-pair-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue1016-paired-rows.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: false
