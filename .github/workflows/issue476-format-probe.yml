name: Issue 476 format probe

on:
  push:
    branches:
      - fix/ppo-cross-seed-aggregation
    paths:
      - .github/workflows/issue476-format-probe.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Emit formatted test
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/evaluation/experiments/test_ppo_cross_seed_aggregation.py
          echo '=== ISSUE476_FORMATTED_BEGIN ==='
          cat tests/evaluation/experiments/test_ppo_cross_seed_aggregation.py
          echo '=== ISSUE476_FORMATTED_END ==='
