name: Issue 476 GREEN patch

on:
  push:
    branches:
      - fix/ppo-cross-seed-aggregation
    paths:
      - .github/workflows/issue476-green-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/ppo-cross-seed-aggregation
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply bounded Issue 476 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "trade_rl/evaluation/experiments/workflow.py",
              '_FACTOR_EFFECT_SCHEMA = "controlled_evidence_comparison_v1"',
              '_FACTOR_EFFECT_SCHEMA = "controlled_evidence_comparison_v2"',
          )

          replace_once(
              "trade_rl/evaluation/experiments/inspection.py",
              '''            factor_effect = compare_evidence_sets(\n                baseline_for_comparison.runs,\n                candidate.runs,\n                n_bootstrap=plan.n_bootstrap,\n                bootstrap_seed=plan.bootstrap_seed,\n            )''',
              '''            comparison_payload = comparison.to_payload()\n            persisted_factor_effect = comparison_payload.get("factor_effect")\n            if not isinstance(persisted_factor_effect, dict):\n                raise ArtifactIntegrityError("comparison factor_effect is malformed")\n            factor_effect_schema = _as_string(\n                persisted_factor_effect.get("schema_version"),\n                field="factor-effect schema_version",\n            )\n            factor_effect = compare_evidence_sets(\n                baseline_for_comparison.runs,\n                candidate.runs,\n                n_bootstrap=plan.n_bootstrap,\n                bootstrap_seed=plan.bootstrap_seed,\n                schema_version=factor_effect_schema,\n            )''',
          )

          replace_once(
              "tests/evaluation/experiments/test_workflow.py",
              '''    comparison = compare_experiment(root, 1)\n    assert comparison.verification_digest == verification.digest''',
              '''    comparison = compare_experiment(root, 1)\n    assert comparison.verification_digest == verification.digest\n    factor_effect = comparison.to_payload()["factor_effect"]\n    assert isinstance(factor_effect, dict)\n    assert factor_effect["schema_version"] == "controlled_evidence_comparison_v2"''',
          )

          replace_once(
              "docs/architecture/controlled-experiment-loop.md",
              '''- seedごとの結果を保持し、複数seedから単一の架空p-valueを合成しない。\n- symbolは同calendar shockを共有し得るため、cross-symbol significance claimを作らない。\n- symbol別結果、正負count、median、worst/best、drawdown/cost/turnover等はdescriptive evidenceとして保持する。''',
              '''- seedごとの結果を保持し、複数seedから単一の架空p-valueを合成しない。\n- PPOのcross-symbol candidate metricsは各symbol内でfrozen seedを先に集約する。total return / turnover / total costはseed中央値、maximum drawdownはseed内worstを使い、その後にsymbol間のdescriptive summaryを計算する。これによりseed数をsymbol weightへ変換しない。\n- 新規factor-effect payloadは`controlled_evidence_comparison_v2`を使う。persisted `controlled_evidence_comparison_v1`はhistorical first-seed candidate-metric semanticsでread/inspection再計算し、immutable comparisonを暗黙migrationしない。\n- symbolは同calendar shockを共有し得るため、cross-symbol significance claimを作らない。\n- symbol別結果、正負count、median、worst/best、drawdown/cost/turnover等はdescriptive evidenceとして保持する。''',
          )

          replace_once(
              "docs/research/current-status.md",
              '''PPOについては、controlled comparisonのcross-symbol candidate metricsでmulti-seed factor effectとfirst-seed-only candidate summaryが混在する既知のaggregation asymmetryがある。Baseline evidenceのcost/identity validityとは別問題だが、PPOをControlled Factorとして解釈する前に、明示的なcross-seed aggregation contractを確立するか、独立したmulti-seed oracleで補う。''',
              '''PPO controlled comparisonのcross-symbol candidate metricsは、各symbol内でfrozen seedを先に集約してからsymbol間summaryへ進む明示契約へ更新した。total return / turnover / total costはseed中央値、maximum drawdownはseed内worstを使い、factor effectは従来どおりseedごとのpaired excessの中央値をsymbol代表値とする。新規factor-effectは`controlled_evidence_comparison_v2`、persisted v1はhistorical first-seed semanticsでinspection互換を維持する。''',
          )
          PY

          uv run ruff format \
            trade_rl/evaluation/experiments/analysis.py \
            trade_rl/evaluation/experiments/inspection.py \
            trade_rl/evaluation/experiments/workflow.py \
            tests/evaluation/experiments/test_ppo_cross_seed_aggregation.py \
            tests/evaluation/experiments/test_workflow.py
          uv run ruff check trade_rl/evaluation/experiments tests/evaluation/experiments
          uv run mypy trade_rl/evaluation/experiments
          uv run pytest -q \
            tests/evaluation/experiments/test_ppo_cross_seed_aggregation.py \
            tests/evaluation/experiments/test_analysis.py \
            tests/evaluation/experiments/test_workflow.py

          rm .github/workflows/issue476-green-patch.yml
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: aggregate PPO candidate metrics across seeds"
          git push origin HEAD:fix/ppo-cross-seed-aggregation
