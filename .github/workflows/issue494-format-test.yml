name: Issue 494 format RED test

on:
  push:
    branches:
      - fix/portable-feature-numerics
    paths:
      - .github/workflows/issue494-format-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/portable-feature-numerics
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install dev environment
        run: uv sync --extra dev
      - name: Format RED test with repository Ruff
        run: uv run ruff format tests/data/test_portable_feature_numerics.py
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/data/test_portable_feature_numerics.py; then
            echo "No formatting change required"
            exit 0
          fi
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add tests/data/test_portable_feature_numerics.py
          git commit -m "style: format portable numerics RED test"
          git push origin HEAD:fix/portable-feature-numerics
