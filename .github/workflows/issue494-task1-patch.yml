name: Issue 494 Task 1 patch

on:
  push:
    branches:
      - fix/portable-feature-numerics
    paths:
      - .github/workflows/issue494-task1-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/portable-feature-numerics
          fetch-depth: 1
      - name: Apply exact MarketBuildConfig schema patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/data/contracts.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '_TIMEFRAME_HOURS = {',
                  'PORTABLE_FEATURE_NUMERICS_SCHEMA = "portable_feature_numerics_v1"\n\n_TIMEFRAME_HOURS = {',
              ),
              (
                  '    schema_version: str = "market_build_v2"',
                  '    schema_version: str = "market_build_v3"',
              ),
              (
                  '        require_non_empty(self.schema_version, field="schema_version")',
                  '        require_non_empty(self.schema_version, field="schema_version")\n        if self.schema_version != "market_build_v3":\n            raise ValueError("unsupported market build schema")',
              ),
              (
                  '            "global_feature_names": self.global_feature_names,\n            "schema_version": self.schema_version,',
                  '            "global_feature_names": self.global_feature_names,\n            "feature_numerics_schema": PORTABLE_FEATURE_NUMERICS_SCHEMA,\n            "schema_version": self.schema_version,',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected exactly one replacement target, got {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and commit Task 1
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add trade_rl/data/contracts.py
          git commit -m "feat: version portable feature numerics"
          git push origin HEAD:fix/portable-feature-numerics
