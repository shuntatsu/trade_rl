name: Issue 494 Task 4 compatibility closure

on:
  push:
    branches:
      - fix/portable-feature-numerics
    paths:
      - .github/workflows/issue494-task4-compatibility.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install research test environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Run data bootstrap integration closure
        run: uv run pytest -q tests/data tests/evaluation/experiments/bootstrap tests/integrations
      - name: Download historical pre-portable bootstrap artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-m2-study-001-bootstrap-v2
          path: /tmp/issue494-historical
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: "34604689409"
      - name: Verify current reader loads immutable market_build_v2 Dataset
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from trade_rl.data import load_market_dataset_artifact

          expected_dataset_id = "8a41ad3c26289836d756de76ce541280dbcaaf80f26e2d8ecab055d6d0e749ab"
          roots = [
              path.parent
              for path in Path("/tmp/issue494-historical").rglob("manifest.json")
              if (path.parent / "arrays.npz").is_file()
          ]
          if not roots:
              raise RuntimeError("historical artifact contains no Dataset artifact root")
          failures = []
          matched = None
          for root in roots:
              try:
                  dataset = load_market_dataset_artifact(root)
              except Exception as exc:
                  failures.append((str(root), type(exc).__name__, str(exc)))
                  continue
              if dataset.dataset_id == expected_dataset_id:
                  matched = (root, dataset)
                  break
          if matched is None:
              raise RuntimeError(
                  f"historical Dataset ID not found; roots={roots!r}; failures={failures!r}"
              )
          root, dataset = matched
          if dataset.identity_payload_json is None:
              raise RuntimeError("historical Dataset lacks identity payload")
          payload = json.loads(dataset.identity_payload_json)
          config = payload.get("config")
          if not isinstance(config, dict):
              raise RuntimeError("historical Dataset config identity is invalid")
          if config.get("schema_version") != "market_build_v2":
              raise RuntimeError(f"unexpected historical build schema: {config!r}")
          if "feature_numerics_schema" in config:
              raise RuntimeError("historical v2 identity was retrospectively given v3 numerics")
          print(json.dumps({
              "historical_dataset_root": str(root),
              "dataset_id": dataset.dataset_id,
              "build_schema": config.get("schema_version"),
              "feature_numerics_schema_present": "feature_numerics_schema" in config,
          }, sort_keys=True))
          PY
