name: Issue 494 update portable identity oracle

on:
  push:
    branches:
      - fix/portable-feature-numerics
    paths:
      - .github/workflows/issue494-update-identity-oracle.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/portable-feature-numerics
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install dev environment
        run: uv sync --extra dev
      - name: Update exact v3 portable fixture oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/data/test_market_builder.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "def test_builder_preserves_pre481_identity_without_execution_profile() -> None:",
                  "def test_builder_has_stable_portable_v3_identity_without_execution_profile() -> None:",
              ),
              (
                  "668129565e4e3b8ede5f4fa472b32008d6d7be5e6f7068a9a9945883208041a0",
                  "de8c017c050089187c5f477f9791e96998624972a5a2f1fbd795b64695bf890e",
              ),
              (
                  "3729d59af7d2a35a6e58b12c605e8b5ef31a59e543b815e7c875e8bb4de4f3d4",
                  "17557a2fa47f5b5dafc4d2c1b79088469466e2b0bc2e585e4d84258921d2cff2",
              ),
              (
                  "1a49c7408926d85dc457f379f026197c21a1dba095f40693ffb0c71b9c25a8b0",
                  "7cf1d370d5e46e53c5a4b021b7b39ac317ec6f319bd660e236309e1ee3059785",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"identity oracle target count {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify updated oracle
        run: |
          uv run ruff check tests/data/test_market_builder.py
          uv run ruff format --check tests/data/test_market_builder.py
          uv run pytest -q \
            tests/data/test_market_builder.py::test_builder_has_stable_portable_v3_identity_without_execution_profile \
            tests/data/test_market_builder.py::test_builder_binds_execution_economics_without_changing_feature_semantics \
            tests/data/test_portable_feature_numerics.py
      - name: Commit verified oracle and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/issue494-identity-diagnostic.yml
          git rm .github/workflows/issue494-update-identity-oracle.yml
          git diff --check
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add tests/data/test_market_builder.py
          git commit -m "test: bind portable Dataset identity oracle"
          git push origin HEAD:fix/portable-feature-numerics
