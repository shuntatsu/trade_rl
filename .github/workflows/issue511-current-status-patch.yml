name: Issue 511 current-status patch

on:
  push:
    branches:
      - docs/issue511-experiment-in-progress
    paths:
      - .github/workflows/issue511-current-status-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/issue511-experiment-in-progress
          fetch-depth: 0

      - name: Patch current research status and Guide copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          status_path = Path("docs/research/current-status.md")
          text = status_path.read_text(encoding="utf-8")

          replacements = {
              "一方、**Controlled Experimentはまだ開始していない**。したがって現在は次を主張しない。":
                  "一方、**Portable Controlled Experiment 0001は開始済みで、結果は未解釈**である。Issue #511では結果前preregistrationとfresh verificationを完了し、事前登録した唯一のbound 5-seed candidate runを実行中である。結果Artifactと独立post-result verificationが確定するまでstrategy効果を解釈しない。したがって現在は次を主張しない。",
              "次の研究上の本質的作業は、新しいmodel familyやbootstrap toolingを増やすことではない。現在のbaselineをimmutable inputとして、一つのControlled Factorを結果を見る前に事前登録し、最初のControlled Experimentを開始することである。":
                  "次の研究上の本質的作業は、新しいmodel familyやbootstrap toolingを増やすことではない。事前登録済みのbound candidate runを完了させ、immutable result Artifactをpre-result-frozen verifierで再取得・独立再計算し、その検証がGreenになった後だけformal decisionを解釈することである。別candidate runへの乗り換えや結果後の判定基準変更はしない。",
              "### M2 — Canonical real-data baseline verified; controlled comparison not started":
                  "### M2 — Canonical real-data baseline verified; Controlled Experiment 0001 in progress",
              "- pre-portable Study 004 Experiment 0001 (#498) はfail-closedし、result Artifactも結果解釈も存在しないため、portable lineage上のControlled Experimentは依然として未開始である。":
                  "- pre-portable Study 004 Experiment 0001 (#498) はfail-closedし、result Artifactも結果解釈も存在しないhistorical lineとして保持する。portable lineageではIssue #511のExperiment 0001を結果前preregistrationとfresh verification後に開始し、現在はbound 5-seed candidate runを実行中である。結果は未解釈である。\n- PPO cross-seed candidate-metric aggregation defect (#476) はcurrent mainで修正済みだが、Issue #511は修正前にfreeze/startしたimplementation provenanceを維持する。PPO aggregate candidate metricsはformal decisionのoracleに使わず、raw-return equality controlとしてのみ扱う。",
              "1. 最初のControlled Factorを結果を見る前に事前登録する。\n2. baseline Artifactをimmutable inputとして最初のControlled Experimentを実行する。\n3. factor isolation、unaffected-strategy raw-return invariance、multi-seed analysisを独立検証する。\n4. 5 candidates + 3 controlsのdevelopment結果を全symbolで完全報告する。\n5. winnerをfreezeするか、no-winnerと判断する。":
                  "1. 事前登録済みのbound candidate run `34707652616` だけを完了させ、別runへ乗り換えない。\n2. 完成したresult Artifactをimmutable evidenceとしてexact runへbindする。\n3. pre-result-frozen verifierでfactor isolation、unaffected-strategy raw-return invariance、deterministic metric seed invariance、cost/cash semanticsを独立再検証する。\n4. verifierがGreenになった後だけformal decisionと全strategy side effectを解釈・報告する。\n5. 以後のdevelopment Experimentを事前登録して継続し、最終的にwinnerをfreezeするかno-winnerと判断する。",
              "**Portable Canonical real-data baselineは結果前preregistrationからpost-Artifact独立検証まで完了したが、portable lineage上のControlled Experimentはまだ開始していない。** Baseline成立はresearch environmentとevidence pathの検証であり、profitabilityやwinnerの証拠ではない。":
                  "**Portable Canonical real-data baselineは結果前preregistrationからpost-Artifact独立検証まで完了し、Portable Controlled Experiment 0001は開始済みで、結果は未解釈である。** 現在の進行はpreregistered bound runとpre-result-frozen verifierに限定される。Baseline成立やExperiment開始はprofitabilityやwinnerの証拠ではない。",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"current-status marker count != 1: {old[:80]!r}")
              text = text.replace(old, new)

          anchor = "- fresh post-Artifact verifier run `34704606059` はsealed source、portable preregistration、baseline Artifactを再取得し、Dataset / StudyPlanを独立再構築したうえでraw Candidate Runsからreturn・cost・seed invarianceを再検証した。verifier Artifact IDは `10300932825`、outer digestは `sha256:77c26e8cdeecdc023a750582ec5aebe3870ca84728e580c9e27d1b2e420368a9` である。"
          addition = anchor + "\n- Portable Controlled Experiment 0001 (#511) は結果前preregistration run `34706927260` / Artifact ID `10302710124` を封印し、fresh verifier run `34707135657` でcandidate不在・definition binding・frozen baseline turnoverを独立再検証した。唯一のbound candidate run `34707652616` は5-seed実行中で、result Artifactとformal decisionはまだ解釈していない。"
          if text.count(anchor) != 1:
              raise SystemExit("portable verifier anchor count != 1")
          text = text.replace(anchor, addition)
          status_path.write_text(text, encoding="utf-8")

          overview_path = Path("guide/content/topics/overview.json")
          overview = json.loads(overview_path.read_text(encoding="utf-8"))
          body = overview["sections"][1]["body"]
          old = "Controlled Experimentはportable lineage上ではまだ開始しておらず、profitability・winner・Production authorizationは未証明です。"
          new = "Portable Controlled Experiment 0001は結果前preregistrationとfresh verificationを終えてbound 5-seed runを実行中ですが、結果は未解釈です。profitability・winner・Production authorizationは未証明です。"
          if body.count(old) != 1:
              raise SystemExit("overview current-position marker mismatch")
          body[body.index(old)] = new
          overview_path.write_text(json.dumps(overview, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          research_path = Path("guide/content/topics/research-status.json")
          research = json.loads(research_path.read_text(encoding="utf-8"))
          research["summary"] = "何が検証済みで、何が実行中・未解釈・未証明・制約として残っているかを分離して表示します。"
          for source in research["source_sections"]:
              if source["heading"] == "M2 — Canonical real-data baseline verified; controlled comparison not started":
                  source["heading"] = "M2 — Canonical real-data baseline verified; Controlled Experiment 0001 in progress"
          pending = next(group for group in research["visualization"]["groups"] if group["id"] == "pending")
          pending["items"] = [
              "事前登録済みのbound 5-seed candidate runだけを完了させる",
              "result Artifactをexact runへbindしてimmutable evidenceとして固定",
              "pre-result-frozen verifierでfactor isolation・raw-return equality・metric invariance・cost semanticsを独立再検証",
              "検証Green後だけformal decisionを解釈し、次のExperimentまたはwinner / no-winner判断へ進む",
          ]
          verified = next(group for group in research["visualization"]["groups"] if group["id"] == "verified")
          marker = "portable Experiment 0001の結果前preregistrationとfresh verifierを完了し、bound runを開始"
          if marker not in verified["items"]:
              verified["items"].append(marker)
          limitations = next(group for group in research["visualization"]["groups"] if group["id"] == "limitations")
          limitations["items"] = [
              item for item in limitations["items"]
              if "PPO controlled factorを解釈する前にcross-seed aggregation contractを明示" not in item
          ]
          limitations["items"].append(
              "PPO cross-seed aggregationはcurrent mainで修正済みだが、進行中Experiment 0001はfreeze済み旧implementationを維持しPPO aggregate metricをdecision oracleに使わない"
          )
          research_path.write_text(json.dumps(research, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python3 guide/tools/content_contract.py --refresh overview research-status
          python3 guide/tools/content_contract.py --check

      - name: Run targeted contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          pytest -q tests/architecture/test_current_docs_layout.py -k 'completed_canonical_bootstrap_docs_are_promoted_and_removed or current_docs_preserve_core_and_research_contracts'

      - name: Commit current-status correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/current-status.md guide/content/topics/overview.json guide/content/topics/research-status.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs: record portable Experiment 0001 in progress"
          git push origin HEAD:docs/issue511-experiment-in-progress
