name: Issue 511 final status commit

on:
  push:
    branches:
      - docs/issue511-final-status
    paths:
      - .github/workflows/issue511-final-status-commit.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/issue511-final-status
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev environment
        run: uv sync --extra dev

      - name: Reuse reviewed patch logic and verify
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python - <<'\''PY'\''/ {capture=1; next}
            /^          PY$/ {capture=0; exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/issue511-final-status-patch.yml > /tmp/issue511_status_patch.py
          python /tmp/issue511_status_patch.py
          uv run python guide/tools/content_contract.py --refresh overview research-status
          uv run python guide/tools/content_contract.py --check
          uv run pytest -q \
            tests/architecture/test_current_docs_layout.py \
            tests/architecture/test_human_guide.py \
            -k 'not test_only_permanent_workflows_remain'
          git diff --check

      - name: Commit verified status promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add \
            docs/research/current-status.md \
            guide/content/topics/overview.json \
            guide/content/topics/research-status.json
          git diff --cached --check
          git commit -m "docs: record verified Experiment 0001 KEEP_BASELINE outcome"
          git push origin HEAD:docs/issue511-final-status
