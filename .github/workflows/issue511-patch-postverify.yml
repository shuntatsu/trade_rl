name: Issue 511 patch recovery postverify

on:
  push:
    branches:
      - tmp/issue511-recovery
    paths:
      - .github/workflows/issue511-patch-postverify.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue511-recovery
          fetch-depth: 1
      - name: Apply narrowly scoped recovery verifier correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/issue511_portable_exp001_postverify.py)" = "3da2157c84e6930035b16edbf2c903a90da18722"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/issue511_portable_exp001_postverify.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import argparse\n",
              "import argparse\nfrom collections.abc import Mapping\n",
              1,
          )
          text = text.replace(
              "\n\ndef _sha(path: Path) -> str:\n",
              "\n\ndef _mapping(value: object, *, field: str) -> Mapping[str, object]:\n"
              "    if not isinstance(value, Mapping) or any(not isinstance(key, str) for key in value):\n"
              "        raise RuntimeError(f\"{field} malformed\")\n"
              "    return value\n"
              "\n\ndef _sha(path: Path) -> str:\n",
              1,
          )
          old = '''    factor_effect = result_experiment.comparison.factor_effect
              cross_symbol = factor_effect.get("cross_symbol")
              if not isinstance(cross_symbol, dict):
                  raise RuntimeError("persisted comparison malformed")
              persisted_mr = cross_symbol.get("mean_reversion")
              if not isinstance(persisted_mr, dict):
                  raise RuntimeError("persisted mean-reversion summary malformed")
          '''
          new = '''    factor_effect = _mapping(
                  result_experiment.comparison.factor_effect,
                  field="persisted comparison factor_effect",
              )
              cross_symbol = _mapping(
                  factor_effect.get("cross_symbol"),
                  field="persisted comparison cross_symbol",
              )
              persisted_mr = _mapping(
                  cross_symbol.get("mean_reversion"),
                  field="persisted mean-reversion summary",
              )
          '''
          if old not in text:
              raise SystemExit("factor-effect block anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              'result_index_path = result_root / "portable-exp001-result-index.json"',
              'result_index_path = result_root / "portable-exp001-recovered-result-index.json"',
              1,
          )
          text = text.replace(
              '"schema_version": "canonical_m2_portable_exp001_result_index_v1",\n        "issue_number": 511,',
              '"schema_version": "canonical_m2_portable_exp001_recovered_result_index_v1",\n'
              '        "issue_number": 511,\n'
              '        "original_execution_run_id": 34707652616,\n'
              '        "original_execution_helper_git_sha": "52e9c573fbee9ca24eac031f7dad5c6646ca76d8",\n'
              '        "source_failure_artifact_id": 10304040458,\n'
              '        "source_failure_artifact_digest": "sha256:0e67733694765a48f0ca47220cb4c5520bd2934043d5f1a4a60cf865f241735a",',
              1,
          )
          text = text.replace(
              '"study_frozen": False,\n        "profitability_claimed": False,',
              '"candidate_reexecuted_during_recovery": False,\n'
              '        "comparison_recomputed_during_recovery": False,\n'
              '        "study_frozen": False,\n'
              '        "profitability_claimed": False,',
              1,
          )
          text = text.replace(
              '"schema_version": "canonical_m2_portable_exp001_postverify_v1",',
              '"schema_version": "canonical_m2_portable_exp001_recovery_postverify_v2",',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify patch is syntax-clean
        run: |
          python -m py_compile research/issue511_portable_exp001_postverify.py
          git diff --check
      - name: Commit corrected verifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add research/issue511_portable_exp001_postverify.py
          git commit -m "fix: verify recovered Experiment comparison mappings"
          git push origin HEAD:tmp/issue511-recovery
