name: Issue 511 recovered Experiment 0001 finalize

on:
  push:
    branches:
      - tmp/issue511-recovery
    paths:
      - .github/workflows/issue511-recovery-finalize.yml

permissions:
  actions: read
  contents: read
  issues: read

env:
  FROZEN_PRODUCTION_SHA: 5605bfee8df4e38b6c9a26621a132a1e5453b9ff
  RECOVERY_HELPER_BLOB: 48904514b29aefcb6b9e2b2beeeec804705dbf77
  POSTVERIFY_BLOB: 7f8713ba2e73b32cc480a91d728bb0d079a1bf17
  SUPPLEMENTAL_COMMIT: 7807a1feadfa2f03c01e975eb024573a9cf6b833
  SUPPLEMENTAL_VERIFY_BLOB: 636c79e4fd9d51567ad250a6a2c312a6c78f6bb8
  SUPPLEMENTAL_TEST_BLOB: c43109dea573525917f3c103175d48b382b7fcc2
  FAILURE_RUN_ID: "34707652616"
  FAILURE_RUN_HEAD: 52e9c573fbee9ca24eac031f7dad5c6646ca76d8
  FAILURE_ARTIFACT: canonical-m2-portable-exp001-execution-failure-34707652616
  FAILURE_ARTIFACT_ID: "10304040458"
  FAILURE_ARTIFACT_DIGEST: sha256:0e67733694765a48f0ca47220cb4c5520bd2934043d5f1a4a60cf865f241735a
  PREREG_RUN_ID: "34706927260"
  PREREG_ARTIFACT: canonical-m2-portable-exp001-prereg-v1-34706927260
  PREREG_ARTIFACT_ID: "10302710124"
  PREREG_ARTIFACT_DIGEST: sha256:579ec0cb451c593e35ad2a7cf09abc24117670b42b5a5f4233715c662d758e91
  EXPECTED_CANDIDATE_FINGERPRINT: 5e1ee8a530097e6b1c4571efe1d3edd9e867a2e77b8346a558ce9ed385e1f672
  RESULT_ARTIFACT: canonical-m2-portable-exp001-recovered-result-v1-${{ github.run_id }}
  PREVERIFY_ARTIFACT: canonical-m2-portable-exp001-recovery-preverify-v1-${{ github.run_id }}
  FRESH_VERIFY_ARTIFACT: canonical-m2-portable-exp001-recovery-fresh-postverify-v1-${{ github.run_id }}

jobs:
  recover-and-preverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove frozen implementation and verifier bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/issue511_portable_exp001_recovery.py)" = "$RECOVERY_HELPER_BLOB"
          test "$(git hash-object research/issue511_portable_exp001_postverify.py)" = "$POSTVERIFY_BLOB"
          git fetch --no-tags --depth=1 origin "$FROZEN_PRODUCTION_SHA" "$SUPPLEMENTAL_COMMIT"
          test "$(git rev-parse HEAD:trade_rl)" = "$(git rev-parse "$FROZEN_PRODUCTION_SHA:trade_rl")"
          git show "$SUPPLEMENTAL_COMMIT:research/issue511_portable_exp001_metricverify.py" > research/issue511_portable_exp001_metricverify.py
          git show "$SUPPLEMENTAL_COMMIT:research/test_issue511_metric_invariance_verifier.py" > research/test_issue511_metric_invariance_verifier.py
          test "$(git hash-object research/issue511_portable_exp001_metricverify.py)" = "$SUPPLEMENTAL_VERIFY_BLOB"
          test "$(git hash-object research/test_issue511_metric_invariance_verifier.py)" = "$SUPPLEMENTAL_TEST_BLOB"

      - name: Verify immutable source artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failure_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILURE_RUN_ID")"
          test "$(jq -r '.status' <<<"$failure_run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$failure_run")" = "failure"
          test "$(jq -r '.head_sha' <<<"$failure_run")" = "$FAILURE_RUN_HEAD"
          failure_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILURE_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$failure_artifact")" = "$FAILURE_ARTIFACT"
          test "$(jq -r '.digest' <<<"$failure_artifact")" = "$FAILURE_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$failure_artifact")" = "$FAILURE_RUN_ID"
          test "$(jq -r '.expired' <<<"$failure_artifact")" = "false"
          prereg="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREG_ARTIFACT_ID")"
          test "$(jq -r '.name' <<<"$prereg")" = "$PREREG_ARTIFACT"
          test "$(jq -r '.digest' <<<"$prereg")" = "$PREREG_ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id' <<<"$prereg")" = "$PREREG_RUN_ID"
          test "$(jq -r '.expired' <<<"$prereg")" = "false"

      - name: Download exact failure artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.FAILURE_ARTIFACT }}
          path: /tmp/issue511-recovery-final
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.FAILURE_RUN_ID }}

      - name: Download exact preregistration artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PREREG_ARTIFACT }}
          path: /tmp/issue511-prereg-final
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.PREREG_RUN_ID }}

      - name: Set up frozen Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install exact research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Compile lint and test all recovery verifiers
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m py_compile \
            research/issue511_portable_exp001_recovery.py \
            research/issue511_portable_exp001_postverify.py \
            research/issue511_portable_exp001_metricverify.py
          uv run ruff check \
            research/issue511_portable_exp001_recovery.py \
            research/issue511_portable_exp001_postverify.py \
            research/issue511_portable_exp001_metricverify.py \
            research/test_issue511_portable_exp001_recovery.py \
            research/test_issue511_metric_invariance_verifier.py
          uv run pytest -q \
            research/test_issue511_portable_exp001_recovery.py \
            research/test_issue511_metric_invariance_verifier.py

      - name: Recover only missing decision and index
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/issue511-recovery-final/issue511-portable-exp001-result"
          candidate_before="$(find "$root/study/experiments/0001/candidate" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          verification_before="$(sha256sum "$root/study/experiments/0001/verification.json" | awk '{print $1}')"
          comparison_before="$(sha256sum "$root/study/experiments/0001/comparison.json" | awk '{print $1}')"
          test ! -e "$root/study/experiments/0001/decision.json"
          uv run python research/issue511_portable_exp001_recovery.py --root "$root" >/dev/null
          test -f "$root/study/experiments/0001/decision.json"
          test -f "$root/portable-exp001-recovered-result-index.json"
          candidate_after="$(find "$root/study/experiments/0001/candidate" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          verification_after="$(sha256sum "$root/study/experiments/0001/verification.json" | awk '{print $1}')"
          comparison_after="$(sha256sum "$root/study/experiments/0001/comparison.json" | awk '{print $1}')"
          test "$candidate_before" = "$candidate_after"
          test "$verification_before" = "$verification_after"
          test "$comparison_before" = "$comparison_after"
          jq -e --arg fp "$EXPECTED_CANDIDATE_FINGERPRINT" '
            .candidate_evidence_fingerprint == $fp and
            .candidate_reexecuted_during_recovery == false and
            .comparison_recomputed_during_recovery == false and
            .original_execution_run_id == 34707652616 and
            .source_failure_artifact_id == 10304040458 and
            .profitability_claimed == false and
            .winner_claimed == false and
            .final_test_authorized == false and
            .production_authorized == false
          ' "$root/portable-exp001-recovered-result-index.json" >/dev/null

      - name: Run corrected independent post-verifier without exposing outcomes
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/issue511-recovery-preverify/original
          mkdir -p "$report"
          sealed_stdout="$(mktemp)"
          trap 'rm -f "$sealed_stdout"' EXIT
          uv run python research/issue511_portable_exp001_postverify.py \
            --prereg-root /tmp/issue511-prereg-final \
            --result-root /tmp/issue511-recovery-final/issue511-portable-exp001-result \
            --report-root "$report" > "$sealed_stdout"
          test -f "$report/postverify.json"
          rm -f "$sealed_stdout"
          trap - EXIT

      - name: Run pre-result-frozen metric invariance verifier
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/issue511-recovery-preverify/supplemental
          mkdir -p "$report"
          sealed_stdout="$(mktemp)"
          trap 'rm -f "$sealed_stdout"' EXIT
          uv run python research/issue511_portable_exp001_metricverify.py \
            --result-root /tmp/issue511-recovery-final/issue511-portable-exp001-result \
            --report-root "$report" > "$sealed_stdout"
          test -f "$report/metric-seed-invariance-verification.json"
          rm -f "$sealed_stdout"
          trap - EXIT

      - name: Seal pre-upload verifier binding
        shell: bash
        run: |
          set -euo pipefail
          original_sha="$(sha256sum /tmp/issue511-recovery-preverify/original/postverify.json | awk '{print $1}')"
          supplemental_sha="$(sha256sum /tmp/issue511-recovery-preverify/supplemental/metric-seed-invariance-verification.json | awk '{print $1}')"
          jq -n \
            --arg recovery_run_id "$GITHUB_RUN_ID" \
            --arg recovery_head "$GITHUB_SHA" \
            --arg source_failure_artifact_id "$FAILURE_ARTIFACT_ID" \
            --arg source_failure_artifact_digest "$FAILURE_ARTIFACT_DIGEST" \
            --arg recovery_helper_blob "$RECOVERY_HELPER_BLOB" \
            --arg postverify_blob "$POSTVERIFY_BLOB" \
            --arg supplemental_verify_blob "$SUPPLEMENTAL_VERIFY_BLOB" \
            --arg original_report_sha256 "$original_sha" \
            --arg supplemental_report_sha256 "$supplemental_sha" \
            '{
              schema_version: "canonical_m2_portable_exp001_recovery_preverify_index_v1",
              recovery_run_id: $recovery_run_id,
              recovery_head: $recovery_head,
              source_failure_artifact_id: $source_failure_artifact_id,
              source_failure_artifact_digest: $source_failure_artifact_digest,
              recovery_helper_blob: $recovery_helper_blob,
              postverify_blob: $postverify_blob,
              supplemental_verify_blob: $supplemental_verify_blob,
              original_report_sha256: $original_report_sha256,
              supplemental_report_sha256: $supplemental_report_sha256,
              both_verifiers_passed: true,
              candidate_reexecuted: false,
              interpretation_authorized: false
            }' > /tmp/issue511-recovery-preverify/preverify-index.json

      - name: Upload immutable recovered result
        id: upload_result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: /tmp/issue511-recovery-final/issue511-portable-exp001-result
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

      - name: Upload pre-upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.PREVERIFY_ARTIFACT }}
          path: /tmp/issue511-recovery-preverify
          include-hidden-files: true
          compression-level: 0
          retention-days: 90

  fresh-reverify:
    needs: recover-and-preverify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove fresh verifier bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/issue511_portable_exp001_postverify.py)" = "$POSTVERIFY_BLOB"
          git fetch --no-tags --depth=1 origin "$FROZEN_PRODUCTION_SHA" "$SUPPLEMENTAL_COMMIT"
          test "$(git rev-parse HEAD:trade_rl)" = "$(git rev-parse "$FROZEN_PRODUCTION_SHA:trade_rl")"
          git show "$SUPPLEMENTAL_COMMIT:research/issue511_portable_exp001_metricverify.py" > research/issue511_portable_exp001_metricverify.py
          git show "$SUPPLEMENTAL_COMMIT:research/test_issue511_metric_invariance_verifier.py" > research/test_issue511_metric_invariance_verifier.py
          test "$(git hash-object research/issue511_portable_exp001_metricverify.py)" = "$SUPPLEMENTAL_VERIFY_BLOB"
          test "$(git hash-object research/test_issue511_metric_invariance_verifier.py)" = "$SUPPLEMENTAL_TEST_BLOB"

      - name: Verify published result artifact metadata through API
        id: binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$GITHUB_SHA"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          count="$(jq --arg name "$RESULT_ARTIFACT" '[.artifacts[] | select(.name == $name)] | length' <<<"$artifacts")"
          test "$count" = "1"
          result_id="$(jq -r --arg name "$RESULT_ARTIFACT" '.artifacts[] | select(.name == $name) | .id' <<<"$artifacts")"
          result_digest="$(jq -r --arg name "$RESULT_ARTIFACT" '.artifacts[] | select(.name == $name) | .digest' <<<"$artifacts")"
          result_expired="$(jq -r --arg name "$RESULT_ARTIFACT" '.artifacts[] | select(.name == $name) | .expired' <<<"$artifacts")"
          test "$result_id" != "null"
          test "$result_digest" != "null"
          test "$result_expired" = "false"
          prereg="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREREG_ARTIFACT_ID")"
          test "$(jq -r '.digest' <<<"$prereg")" = "$PREREG_ARTIFACT_DIGEST"
          test "$(jq -r '.expired' <<<"$prereg")" = "false"
          echo "result_artifact_id=$result_id" >> "$GITHUB_OUTPUT"
          echo "result_artifact_digest=$result_digest" >> "$GITHUB_OUTPUT"

      - name: Download published recovered result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: /tmp/issue511-fresh-result
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ github.run_id }}

      - name: Download exact preregistration artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PREREG_ARTIFACT }}
          path: /tmp/issue511-fresh-prereg
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.PREREG_RUN_ID }}

      - name: Set up frozen Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install exact research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Compile lint and test fresh verifiers
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m py_compile \
            research/issue511_portable_exp001_postverify.py \
            research/issue511_portable_exp001_metricverify.py
          uv run ruff check \
            research/issue511_portable_exp001_postverify.py \
            research/issue511_portable_exp001_metricverify.py \
            research/test_issue511_metric_invariance_verifier.py
          uv run pytest -q research/test_issue511_metric_invariance_verifier.py

      - name: Fresh independent post-verification without exposing outcomes
        shell: bash
        env:
          RESULT_ARTIFACT_ID: ${{ steps.binding.outputs.result_artifact_id }}
          RESULT_ARTIFACT_DIGEST: ${{ steps.binding.outputs.result_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue511-fresh-verify/original /tmp/issue511-fresh-verify/supplemental
          sealed_original="$(mktemp)"
          sealed_supplemental="$(mktemp)"
          trap 'rm -f "$sealed_original" "$sealed_supplemental"' EXIT
          uv run python research/issue511_portable_exp001_postverify.py \
            --prereg-root /tmp/issue511-fresh-prereg \
            --result-root /tmp/issue511-fresh-result \
            --report-root /tmp/issue511-fresh-verify/original > "$sealed_original"
          uv run python research/issue511_portable_exp001_metricverify.py \
            --result-root /tmp/issue511-fresh-result \
            --report-root /tmp/issue511-fresh-verify/supplemental > "$sealed_supplemental"
          test -f /tmp/issue511-fresh-verify/original/postverify.json
          test -f /tmp/issue511-fresh-verify/supplemental/metric-seed-invariance-verification.json
          original_sha="$(sha256sum /tmp/issue511-fresh-verify/original/postverify.json | awk '{print $1}')"
          supplemental_sha="$(sha256sum /tmp/issue511-fresh-verify/supplemental/metric-seed-invariance-verification.json | awk '{print $1}')"
          jq -n \
            --arg recovery_run_id "$GITHUB_RUN_ID" \
            --arg recovery_head "$GITHUB_SHA" \
            --arg result_artifact "$RESULT_ARTIFACT" \
            --arg result_artifact_id "$RESULT_ARTIFACT_ID" \
            --arg result_artifact_digest "$RESULT_ARTIFACT_DIGEST" \
            --arg source_failure_artifact_id "$FAILURE_ARTIFACT_ID" \
            --arg source_failure_artifact_digest "$FAILURE_ARTIFACT_DIGEST" \
            --arg recovery_helper_blob "$RECOVERY_HELPER_BLOB" \
            --arg postverify_blob "$POSTVERIFY_BLOB" \
            --arg supplemental_verify_blob "$SUPPLEMENTAL_VERIFY_BLOB" \
            --arg original_report_sha256 "$original_sha" \
            --arg supplemental_report_sha256 "$supplemental_sha" \
            '{
              schema_version: "canonical_m2_portable_exp001_recovery_fresh_postverify_index_v1",
              recovery_run_id: $recovery_run_id,
              recovery_head: $recovery_head,
              result_artifact: $result_artifact,
              result_artifact_id: $result_artifact_id,
              result_artifact_digest: $result_artifact_digest,
              source_failure_artifact_id: $source_failure_artifact_id,
              source_failure_artifact_digest: $source_failure_artifact_digest,
              recovery_helper_blob: $recovery_helper_blob,
              postverify_blob: $postverify_blob,
              supplemental_verify_blob: $supplemental_verify_blob,
              original_report_sha256: $original_report_sha256,
              supplemental_report_sha256: $supplemental_report_sha256,
              both_verifiers_passed: true,
              candidate_reexecuted: false,
              fresh_runner_reverified_published_artifact: true,
              interpretation_authorized: true
            }' > /tmp/issue511-fresh-verify/fresh-postverify-index.json
          rm -f "$sealed_original" "$sealed_supplemental"
          trap - EXIT

      - name: Upload immutable fresh verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.FRESH_VERIFY_ARTIFACT }}
          path: /tmp/issue511-fresh-verify
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
