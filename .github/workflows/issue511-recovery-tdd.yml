name: Issue 511 recovery TDD

on:
  push:
    branches:
      - tmp/issue511-recovery
    paths:
      - research/test_issue511_portable_exp001_recovery.py
      - research/issue511_portable_exp001_recovery.py
      - research/issue511_portable_exp001_postverify.py
      - .github/workflows/issue511-recovery-tdd.yml

permissions:
  contents: read

env:
  RECOVERY_HELPER_BLOB: 48904514b29aefcb6b9e2b2beeeec804705dbf77
  POSTVERIFY_BLOB: 7f8713ba2e73b32cc480a91d728bb0d079a1bf17

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact recovery implementation blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/issue511_portable_exp001_recovery.py)" = "$RECOVERY_HELPER_BLOB"
          test "$(git hash-object research/issue511_portable_exp001_postverify.py)" = "$POSTVERIFY_BLOB"

      - name: Set up frozen uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install research environment
        run: uv sync --extra dev

      - name: Compile and lint recovery implementation and oracle
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m py_compile \
            research/issue511_portable_exp001_recovery.py \
            research/issue511_portable_exp001_postverify.py
          uv run ruff check \
            research/issue511_portable_exp001_recovery.py \
            research/issue511_portable_exp001_postverify.py \
            research/test_issue511_portable_exp001_recovery.py

      - name: Run targeted recovery tests
        run: uv run pytest -q research/test_issue511_portable_exp001_recovery.py