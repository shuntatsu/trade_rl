name: Issue 519 execution helper style fix

on:
  push:
    branches:
      - tmp/issue519-exp0002-execute
    paths:
      - .github/workflows/issue519-execution-style-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: tmp/issue519-exp0002-execute

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"

      - name: Install lint environment
        run: uv sync --extra dev

      - name: Apply only Ruff-safe fixes and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix research/issue519_portable_exp002_execute.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "research/issue519_portable_exp002_execute.py" || { echo "unexpected changed files: $changed"; exit 1; }
          if git diff --quiet -- research/issue519_portable_exp002_execute.py; then
            exit 0
          fi
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add research/issue519_portable_exp002_execute.py
          git commit -m "style: normalize Experiment 0002 execution helper imports"
          git push origin HEAD:${TARGET_BRANCH}
