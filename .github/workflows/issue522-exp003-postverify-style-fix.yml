name: Issue 522 Experiment 0003 postverify style fix

on:
  push:
    branches:
      - tmp/issue522-exp0003-execute
    paths:
      - .github/workflows/issue522-exp003-postverify-style-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: tmp/issue522-exp0003-execute

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"

      - name: Install lint environment
        run: uv sync --extra dev

      - name: Apply Ruff-safe fix only and commit
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix research/issue522_portable_exp003_postverify.py
          uv run python -m py_compile research/issue522_portable_exp003_postverify.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "research/issue522_portable_exp003_postverify.py" || { echo "unexpected changed files: $changed"; exit 1; }
          if git diff --quiet -- research/issue522_portable_exp003_postverify.py; then
            exit 0
          fi
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add research/issue522_portable_exp003_postverify.py
          git commit -m "style: normalize Experiment 0003 postverifier"
          git push origin HEAD:${TARGET_BRANCH}
