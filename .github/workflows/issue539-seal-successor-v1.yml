name: Issue 539 seal calibrated causal successor v1

on:
  push:
    branches:
      - verify/issue539-exact-15bf6546
    paths:
      - .github/workflows/issue539-seal-successor-v1.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 15bf6546996dc969d4d6e946261d73e3d43336e6
  EXACT_VERIFY_RUN_ID: "34793925990"
  RECON_A_ID: "10329615102"
  RECON_A_DIGEST: sha256:6ec37db239c4d15cdf9d7fa21dc916d6667347601bd3193374bab850760f06a0
  RECON_A_NAME: issue539-reconstruction-a-34793925990
  RECON_B_ID: "10329046715"
  RECON_B_DIGEST: sha256:0796e3e71b3862160a69ad35871ce143c3b3d2b450cb6455488bcb5cb2b7fff0
  RECON_B_NAME: issue539-reconstruction-b-34793925990

  SOURCE_RUN_ID: "34702660287"
  SOURCE_ARTIFACT: canonical-m2-portable-prereg-v1-34702660287
  SOURCE_ARTIFACT_ID: "10300479733"
  SOURCE_ARTIFACT_API_DIGEST: sha256:60127cc2f24c7e8b3dcb5c6157ca49a5dd2f5b60c44f1020e4d540405e34e1f4
  SOURCE_DATASET_ID: d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f
  SOURCE_DATASET_ARTIFACT_DIGEST: 77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8
  SOURCE_STUDY_DIGEST: 3d8404061a4082a8e9b3c786d9f5fc9a4347631dff39c201e3cba70470dfeb79

  CALIBRATION_RUN_ID: "34766830666"
  CALIBRATION_ARTIFACT: issue537-aggtrades-flow-calibration-34766830666
  CALIBRATION_ARTIFACT_ID: "10320428830"
  CALIBRATION_ARTIFACT_API_DIGEST: sha256:810e792636a696a0bc11e22ab53a21f378aaa0bfaeab8c3411123e9c6d9a5c35
  CALIBRATION_RESULT_DIGEST: a5490f9209b16a8ba94f11506b83aa45ce44c7d61d13234480e2362f6df89809
  CALIBRATION_JSON_SHA256: 397004e6a1a9c3b30b32212066ac41366f7af74edc0ae23372f847e50c6c5a4e
  CALIBRATION_VERIFY_RUN_ID: "34767391268"
  CALIBRATION_VERIFY_ARTIFACT: issue537-independent-reconstruction-10320428830-v2
  CALIBRATION_VERIFY_ARTIFACT_ID: "10320394746"
  CALIBRATION_VERIFY_ARTIFACT_API_DIGEST: sha256:31702e68dddd9b4844eee6dc3b5b47ab4aa824d50200509a7bcdbf009c652bd1

  EXPECTED_DATASET_ID: 6a9d6066fe8f92d46fe57a1d8172a60092568e625b2e843dc7a0c3930d79de86
  EXPECTED_DATASET_ARTIFACT_DIGEST: 9a3f01bc4608c256b5c448e5cee123c4653fe02060040dc7909b4eb1c6c3e30f
  EXPECTED_DATASET_TREE_DIGEST: 3bd6964426f983c8726a26dd1298df785726c9b66771e445253b38a8bb3dc9af
  EXPECTED_STUDY_DIGEST: baaf25c93f37e409220d4413ddd9216c2afbf29ba1ce344310d43d7efa74e7eb
  EXPECTED_STUDY_TREE_DIGEST: a579b72e93d39b59fe1e232fd658bbc016fdecf4b5da6c683080ed2b5ea49bcc

  SEALED_ARTIFACT: issue539-calibrated-causal-successor-v1-${{ github.run_id }}
  FRESH_VERIFY_ARTIFACT: issue539-calibrated-causal-successor-fresh-verify-v1-${{ github.run_id }}

jobs:
  materialize-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sealed_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact verified durable implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15bf6546996dc969d4d6e946261d73e3d43336e6
          persist-credentials: false

      - name: Prove one-shot seal run and exact implementation head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.run_number' <<<"$run")" = "1"
          test "$(jq -r '.run_attempt' <<<"$run")" = "1"
          test "$(jq -r '.event' <<<"$run")" = "push"

      - name: API-bind source, calibration, and independent reconstruction evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_artifact() {
            local id="$1" name="$2" digest="$3" run_id="$4" payload
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.name' <<<"$payload")" = "$name"
            test "$(jq -r '.digest' <<<"$payload")" = "$digest"
            test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$run_id"
            test "$(jq -r '.expired' <<<"$payload")" = "false"
          }
          verify_artifact "$SOURCE_ARTIFACT_ID" "$SOURCE_ARTIFACT" "$SOURCE_ARTIFACT_API_DIGEST" "$SOURCE_RUN_ID"
          verify_artifact "$CALIBRATION_ARTIFACT_ID" "$CALIBRATION_ARTIFACT" "$CALIBRATION_ARTIFACT_API_DIGEST" "$CALIBRATION_RUN_ID"
          verify_artifact "$CALIBRATION_VERIFY_ARTIFACT_ID" "$CALIBRATION_VERIFY_ARTIFACT" "$CALIBRATION_VERIFY_ARTIFACT_API_DIGEST" "$CALIBRATION_VERIFY_RUN_ID"
          verify_artifact "$RECON_A_ID" "$RECON_A_NAME" "$RECON_A_DIGEST" "$EXACT_VERIFY_RUN_ID"
          verify_artifact "$RECON_B_ID" "$RECON_B_NAME" "$RECON_B_DIGEST" "$EXACT_VERIFY_RUN_ID"

      - name: Download exact source preregistration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: /tmp/issue539-source
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download sealed calibration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CALIBRATION_ARTIFACT }}
          path: /tmp/issue539-calibration
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.CALIBRATION_RUN_ID }}

      - name: Download independent calibration reconstruction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.CALIBRATION_VERIFY_ARTIFACT }}
          path: /tmp/issue539-calibration-verify
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.CALIBRATION_VERIFY_RUN_ID }}

      - name: Download exact-head reconstruction A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RECON_A_NAME }}
          path: /tmp/issue539-recon-a
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EXACT_VERIFY_RUN_ID }}

      - name: Download exact-head reconstruction B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.RECON_B_NAME }}
          path: /tmp/issue539-recon-b
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EXACT_VERIFY_RUN_ID }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install exact research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Materialize exact successor identities without PnL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue539-sealed
          mkdir -p /tmp/issue539-sealed
          uv run python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np
          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact, publish_market_dataset_artifact
          from trade_rl.evaluation.experiments import create_study, inspect_study
          from trade_rl.evaluation.experiments.bootstrap.capacity_materialization import build_aggtrades_calibrated_capacity_dataset, canonical_aggtrades_capacity_authority
          from trade_rl.evaluation.experiments.bootstrap.config import load_canonical_m2_bootstrap_config
          from trade_rl.evaluation.runs import CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY

          source = Path('/tmp/issue539-source')
          sealed = Path('/tmp/issue539-sealed')
          result_bytes = Path('/tmp/issue539-calibration/result.json').read_bytes()
          verify_bytes = Path('/tmp/issue539-calibration-verify/verified.json').read_bytes()
          if result_bytes != verify_bytes:
              raise RuntimeError('calibration independent reconstruction bytes differ')
          if hashlib.sha256(result_bytes).hexdigest() != os.environ['CALIBRATION_JSON_SHA256']:
              raise RuntimeError('calibration canonical JSON SHA drift')
          result = json.loads(result_bytes)
          payload = dict(result)
          digest = payload.pop('result_digest')
          if digest != os.environ['CALIBRATION_RESULT_DIGEST'] or content_digest(payload) != digest:
              raise RuntimeError('calibration result digest mismatch')

          for label, path in [('A', Path('/tmp/issue539-recon-a/issue539-reconstruction-a.json')), ('B', Path('/tmp/issue539-recon-b/issue539-reconstruction-b.json'))]:
              report = json.loads(path.read_text())
              expected = {
                  'dataset_id': os.environ['EXPECTED_DATASET_ID'],
                  'dataset_artifact_digest': os.environ['EXPECTED_DATASET_ARTIFACT_DIGEST'],
                  'dataset_tree_digest': os.environ['EXPECTED_DATASET_TREE_DIGEST'],
                  'study_digest': os.environ['EXPECTED_STUDY_DIGEST'],
                  'study_tree_digest': os.environ['EXPECTED_STUDY_TREE_DIGEST'],
              }
              for key, value in expected.items():
                  if report.get(key) != value:
                      raise RuntimeError(f'reconstruction {label} {key} drift')
              if report.get('baseline_present') is not False or report.get('experiment_count') != 0 or report.get('pnl_executed') is not False:
                  raise RuntimeError(f'reconstruction {label} violated PRE-P&L state')

          source_dataset_root = source / 'dataset'
          source_dataset = load_market_dataset_artifact(source_dataset_root)
          source_artifact = inspect_published_market_dataset_artifact(source_dataset_root)
          source_snapshot = inspect_study(source / 'study')
          if source_dataset.dataset_id != os.environ['SOURCE_DATASET_ID']:
              raise RuntimeError('source Dataset ID drift')
          if source_artifact.artifact_digest != os.environ['SOURCE_DATASET_ARTIFACT_DIGEST']:
              raise RuntimeError('source Dataset artifact digest drift')
          if source_snapshot.plan.digest != os.environ['SOURCE_STUDY_DIGEST']:
              raise RuntimeError('source Study digest drift')

          authority = canonical_aggtrades_capacity_authority()
          successor = build_aggtrades_calibrated_capacity_dataset(
              source_dataset,
              source_artifact_schema=source_artifact.schema_version,
              source_artifact_digest=source_artifact.artifact_digest,
              authority=authority,
          )
          expected_caps = np.broadcast_to(np.asarray(authority.symbol_caps, dtype=np.float64), (successor.n_bars, successor.n_symbols))
          if not np.array_equal(successor.resolved_array('max_participation_rate'), expected_caps):
              raise RuntimeError('successor caps differ from sealed authority')
          old_arrays = source_dataset.identity_arrays()
          new_arrays = successor.identity_arrays()
          if set(old_arrays) != set(new_arrays):
              raise RuntimeError('identity array roster drift')
          for name, old in old_arrays.items():
              new = new_arrays[name]
              if name == 'max_participation_rate':
                  if old.tobytes() == new.tobytes():
                      raise RuntimeError('capacity identity did not change')
                  continue
              if old.dtype != new.dtype or old.shape != new.shape or old.tobytes() != new.tobytes():
                  raise RuntimeError(f'non-cap identity array changed: {name}')

          dataset_root = sealed / 'dataset'
          study_root = sealed / 'study'
          published = publish_market_dataset_artifact(dataset_root, successor)
          reloaded = load_market_dataset_artifact(dataset_root)
          config = load_canonical_m2_bootstrap_config(source / 'bootstrap.json')
          created = create_study(
              study_root,
              dataset_root=dataset_root,
              research_question=source_snapshot.plan.research_question,
              baseline_config=config.baseline,
              ppo_seeds=source_snapshot.plan.ppo_seeds,
              allowed_factors=source_snapshot.plan.allowed_factors,
              max_experiments=source_snapshot.plan.max_experiments,
              n_bootstrap=source_snapshot.plan.n_bootstrap,
              bootstrap_seed=source_snapshot.plan.bootstrap_seed,
              execution_overlay=CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,
          )
          snapshot = inspect_study(study_root)
          if reloaded.dataset_id != successor.dataset_id:
              raise RuntimeError('Dataset round-trip ID mismatch')
          if created.plan.digest != snapshot.plan.digest:
              raise RuntimeError('Study round-trip digest mismatch')
          if snapshot.baseline is not None or snapshot.experiment_sequences or snapshot.terminal_sequences or snapshot.frozen:
              raise RuntimeError('successor Study must remain plan-only/baseline-free/experiment-free')
          if snapshot.plan.dataset_id != successor.dataset_id or snapshot.plan.dataset_artifact_digest != published.artifact_digest:
              raise RuntimeError('Study/Dataset binding mismatch')
          if snapshot.plan.baseline_config.execution_overlay != CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY:
              raise RuntimeError('causal capacity overlay not frozen')

          def tree_digest(root: Path) -> str:
              h = hashlib.sha256()
              files = [p for p in sorted(root.rglob('*')) if p.is_file() and p.name != '.mutation.lock']
              if not files:
                  raise RuntimeError(f'empty tree: {root}')
              for path in files:
                  rel = path.relative_to(root).as_posix().encode('utf-8')
                  h.update(len(rel).to_bytes(8, 'big'))
                  h.update(rel)
                  h.update(hashlib.sha256(path.read_bytes()).digest())
              return h.hexdigest()

          observed = {
              'dataset_id': successor.dataset_id,
              'dataset_artifact_digest': published.artifact_digest,
              'dataset_tree_digest': tree_digest(dataset_root),
              'study_digest': snapshot.plan.digest,
              'study_tree_digest': tree_digest(study_root),
          }
          expected = {
              'dataset_id': os.environ['EXPECTED_DATASET_ID'],
              'dataset_artifact_digest': os.environ['EXPECTED_DATASET_ARTIFACT_DIGEST'],
              'dataset_tree_digest': os.environ['EXPECTED_DATASET_TREE_DIGEST'],
              'study_digest': os.environ['EXPECTED_STUDY_DIGEST'],
              'study_tree_digest': os.environ['EXPECTED_STUDY_TREE_DIGEST'],
          }
          if observed != expected:
              raise RuntimeError(f'sealed successor differs from independent reconstructions: {observed!r} != {expected!r}')

          index = {
              'schema_version': 'issue539_calibrated_causal_successor_v1',
              'implementation_head': os.environ['TARGET_SHA'],
              'source': {
                  'run_id': os.environ['SOURCE_RUN_ID'],
                  'artifact_id': os.environ['SOURCE_ARTIFACT_ID'],
                  'artifact_api_digest': os.environ['SOURCE_ARTIFACT_API_DIGEST'],
                  'dataset_id': os.environ['SOURCE_DATASET_ID'],
                  'dataset_artifact_digest': os.environ['SOURCE_DATASET_ARTIFACT_DIGEST'],
                  'study_digest': os.environ['SOURCE_STUDY_DIGEST'],
              },
              'calibration': {
                  'run_id': os.environ['CALIBRATION_RUN_ID'],
                  'artifact_id': os.environ['CALIBRATION_ARTIFACT_ID'],
                  'artifact_api_digest': os.environ['CALIBRATION_ARTIFACT_API_DIGEST'],
                  'result_digest': os.environ['CALIBRATION_RESULT_DIGEST'],
                  'independent_verify_run_id': os.environ['CALIBRATION_VERIFY_RUN_ID'],
                  'independent_verify_artifact_id': os.environ['CALIBRATION_VERIFY_ARTIFACT_ID'],
                  'independent_verify_artifact_api_digest': os.environ['CALIBRATION_VERIFY_ARTIFACT_API_DIGEST'],
              },
              'successor': observed,
              'execution_overlay': CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,
              'baseline_present': False,
              'experiment_count': 0,
              'study_frozen': False,
              'pnl_executed': False,
              'returns_inspected': False,
              'final_test_authorized': False,
              'production_authorized': False,
          }
          (sealed / 'materialization-index.json').write_text(json.dumps(index, sort_keys=True, indent=2) + '\n')
          print(json.dumps(index, sort_keys=True))
          PY

      - name: Reject accidental PnL/evidence output
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /tmp/issue539-sealed/study/baseline
          test ! -e /tmp/issue539-sealed/study/experiments
          test ! -e /tmp/issue539-sealed/returns.npz
          jq -e '.baseline_present == false and .experiment_count == 0 and .pnl_executed == false and .returns_inspected == false and .final_test_authorized == false and .production_authorized == false' /tmp/issue539-sealed/materialization-index.json >/dev/null

      - name: Upload immutable successor Dataset and Study
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: /tmp/issue539-sealed
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  fresh-reverify:
    needs: materialize-and-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      verification_artifact_id: ${{ steps.upload_verify.outputs.artifact-id }}
    steps:
      - name: Checkout exact verified durable implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 15bf6546996dc969d4d6e946261d73e3d43336e6
          persist-credentials: false

      - name: Verify published successor artifact through API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEALED_ID: ${{ needs.materialize-and-seal.outputs.sealed_artifact_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEALED_ID")"
          test "$(jq -r '.name' <<<"$payload")" = "$SEALED_ARTIFACT"
          test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.expired' <<<"$payload")" = "false"
          digest="$(jq -r '.digest' <<<"$payload")"
          test "${digest#sha256:}" != "$digest"
          printf '%s\n' "$digest" > /tmp/issue539-sealed-api-digest.txt

      - name: Re-download immutable successor artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: /tmp/issue539-fresh-sealed
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ github.run_id }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install exact research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Independently verify sealed identities and PRE-PnL state
        shell: bash
        env:
          SEALED_ID: ${{ needs.materialize-and-seal.outputs.sealed_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue539-fresh-verification
          uv run python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact
          from trade_rl.evaluation.experiments import inspect_study
          from trade_rl.evaluation.experiments.bootstrap.capacity_materialization import canonical_aggtrades_capacity_authority
          from trade_rl.evaluation.runs import CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY

          root = Path('/tmp/issue539-fresh-sealed')
          dataset_root = root / 'dataset'
          study_root = root / 'study'
          dataset = load_market_dataset_artifact(dataset_root)
          artifact = inspect_published_market_dataset_artifact(dataset_root)
          snapshot = inspect_study(study_root)
          index = json.loads((root / 'materialization-index.json').read_text())

          def tree_digest(path_root: Path) -> str:
              h = hashlib.sha256()
              files = [p for p in sorted(path_root.rglob('*')) if p.is_file() and p.name != '.mutation.lock']
              if not files:
                  raise RuntimeError(f'empty tree: {path_root}')
              for path in files:
                  rel = path.relative_to(path_root).as_posix().encode('utf-8')
                  h.update(len(rel).to_bytes(8, 'big'))
                  h.update(rel)
                  h.update(hashlib.sha256(path.read_bytes()).digest())
              return h.hexdigest()

          expected = {
              'dataset_id': os.environ['EXPECTED_DATASET_ID'],
              'dataset_artifact_digest': os.environ['EXPECTED_DATASET_ARTIFACT_DIGEST'],
              'dataset_tree_digest': os.environ['EXPECTED_DATASET_TREE_DIGEST'],
              'study_digest': os.environ['EXPECTED_STUDY_DIGEST'],
              'study_tree_digest': os.environ['EXPECTED_STUDY_TREE_DIGEST'],
          }
          observed = {
              'dataset_id': dataset.dataset_id,
              'dataset_artifact_digest': artifact.artifact_digest,
              'dataset_tree_digest': tree_digest(dataset_root),
              'study_digest': snapshot.plan.digest,
              'study_tree_digest': tree_digest(study_root),
          }
          if observed != expected or index.get('successor') != expected:
              raise RuntimeError(f'fresh successor identity mismatch: {observed!r}')
          authority = canonical_aggtrades_capacity_authority()
          expected_caps = np.broadcast_to(np.asarray(authority.symbol_caps, dtype=np.float64), (dataset.n_bars, dataset.n_symbols))
          if not np.array_equal(dataset.resolved_array('max_participation_rate'), expected_caps):
              raise RuntimeError('fresh Dataset caps do not match sealed authority')
          if snapshot.baseline is not None or snapshot.experiment_sequences or snapshot.terminal_sequences or snapshot.frozen:
              raise RuntimeError('fresh Study is not plan-only')
          if snapshot.plan.dataset_id != dataset.dataset_id or snapshot.plan.dataset_artifact_digest != artifact.artifact_digest:
              raise RuntimeError('fresh Study/Dataset binding mismatch')
          if snapshot.plan.baseline_config.execution_overlay != CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY:
              raise RuntimeError('fresh Study overlay mismatch')
          if index.get('baseline_present') is not False or index.get('experiment_count') != 0 or index.get('pnl_executed') is not False or index.get('returns_inspected') is not False:
              raise RuntimeError('fresh index violates PRE-PnL state')
          api_digest = Path('/tmp/issue539-sealed-api-digest.txt').read_text().strip()
          verification = {
              'schema_version': 'issue539_calibrated_causal_successor_fresh_verify_v1',
              'seal_run_id': os.environ['GITHUB_RUN_ID'],
              'implementation_head': os.environ['TARGET_SHA'],
              'sealed_artifact_id': os.environ['SEALED_ID'],
              'sealed_artifact_api_digest': api_digest,
              'successor': observed,
              'execution_overlay': CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,
              'fresh_runner_reverified': True,
              'baseline_present': False,
              'experiment_count': 0,
              'study_frozen': False,
              'pnl_executed': False,
              'returns_inspected': False,
              'profitability_claimed': False,
              'winner_claimed': False,
              'final_test_authorized': False,
              'production_authorized': False,
          }
          Path('/tmp/issue539-fresh-verification/verification.json').write_text(json.dumps(verification, sort_keys=True, indent=2) + '\n')
          print(json.dumps(verification, sort_keys=True))
          PY

      - name: Upload fresh verification evidence
        id: upload_verify
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.FRESH_VERIFY_ARTIFACT }}
          path: /tmp/issue539-fresh-verification
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  audit:
    needs:
      - materialize-and-seal
      - fresh-reverify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: API-bind both published artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEALED_ID: ${{ needs.materialize-and-seal.outputs.sealed_artifact_id }}
          VERIFY_ID: ${{ needs.fresh-reverify.outputs.verification_artifact_id }}
        run: |
          set -euo pipefail
          for tuple in "$SEALED_ID|$SEALED_ARTIFACT" "$VERIFY_ID|$FRESH_VERIFY_ARTIFACT"; do
            id="${tuple%%|*}"
            name="${tuple#*|}"
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.name' <<<"$payload")" = "$name"
            test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.expired' <<<"$payload")" = "false"
            digest="$(jq -r '.digest' <<<"$payload")"
            test "${digest#sha256:}" != "$digest"
          done

      - name: Re-download fresh verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.FRESH_VERIFY_ARTIFACT }}
          path: /tmp/issue539-final-audit
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ github.run_id }}

      - name: Audit PRE-PnL authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .fresh_runner_reverified == true and
            .baseline_present == false and
            .experiment_count == 0 and
            .study_frozen == false and
            .pnl_executed == false and
            .returns_inspected == false and
            .profitability_claimed == false and
            .winner_claimed == false and
            .final_test_authorized == false and
            .production_authorized == false
          ' /tmp/issue539-final-audit/verification.json >/dev/null
