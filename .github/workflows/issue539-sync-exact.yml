name: Issue 539 synchronized exact verification

on:
  push:
    branches:
      - verify/issue539-sync-2e70
    paths:
      - .github/workflows/issue539-sync-exact.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 2e70d509e120684014ce7e00f7381baf157f7511
  OLD_HEAD_SHA: 3e111a59153b7353e26080bd569b9775190577be
  BASE_SHA: e8527a0471a68fe27b094a6353cf872037eb9100
  EXPECTED_TREE_SHA: f1c520036ec8ff0dac8f23f480d89fe4e85f96f4
  EXPECTED_IMPLEMENTATION_DIGEST: ae4caf7f6a397968bdc9bed2835f8ce69883be39b1c12e28d2cee706a533b8be
  SUCCESSOR_BUNDLE_RUN_ID: "34803217815"
  SUCCESSOR_BUNDLE_ARTIFACT_ID: "10331899302"
  SUCCESSOR_BUNDLE_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  SUCCESSOR_FRESH_RUN_ID: "34803432434"
  SUCCESSOR_FRESH_ARTIFACT_ID: "10332575500"
  SUCCESSOR_FRESH_DIGEST: sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589

jobs:
  core:
    name: Synchronized Exact Lean Core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact synchronized PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2e70d509e120684014ce7e00f7381baf157f7511
          fetch-depth: 0
          persist-credentials: false
      - name: Prove history-only synchronization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE_SHA"
          test "$(git rev-parse "$OLD_HEAD_SHA^{tree}")" = "$EXPECTED_TREE_SHA"
          git diff --quiet "$OLD_HEAD_SHA" "$TARGET_SHA"
          test "$(git show -s --format=%P HEAD)" = "$OLD_HEAD_SHA $BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Core tests
        run: uv run pytest -q tests
      - name: Build
        run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help
      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

  guide:
    name: Synchronized Exact Human Guide
    runs-on: ubuntu-24.04
    env:
      GUIDE_SOURCE_REV: 2e70d509e120684014ce7e00f7381baf157f7511
    steps:
      - name: Checkout exact synchronized PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2e70d509e120684014ce7e00f7381baf157f7511
          persist-credentials: false
      - name: Prove exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci
      - name: Guide source contract
        working-directory: guide
        run: npm run source-check
      - name: Guide lint
        working-directory: guide
        run: npm run lint
      - name: Guide typecheck
        working-directory: guide
        run: npm run typecheck
      - name: Guide unit tests
        working-directory: guide
        run: npm run test
      - name: Guide build
        working-directory: guide
        run: npm run build
      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e

  authority:
    name: Verify synchronized PRE-PnL authority
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact synchronized PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2e70d509e120684014ce7e00f7381baf157f7511
          persist-credentials: false
      - name: API-bind immutable successor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            local id="$1" digest="$2" run_id="$3"
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.digest' <<<"$payload")" = "$digest"
            test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$run_id"
            test "$(jq -r '.expired' <<<"$payload")" = "false"
          }
          verify "$SUCCESSOR_BUNDLE_ARTIFACT_ID" "$SUCCESSOR_BUNDLE_DIGEST" "$SUCCESSOR_BUNDLE_RUN_ID"
          verify "$SUCCESSOR_FRESH_ARTIFACT_ID" "$SUCCESSOR_FRESH_DIGEST" "$SUCCESSOR_FRESH_RUN_ID"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Prove content-addressed identity inputs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from trade_rl.evaluation.runs.provenance import build_candidate_run_provenance
          from trade_rl.evaluation.experiments.bootstrap.capacity_materialization import canonical_aggtrades_capacity_authority
          p = build_candidate_run_provenance()
          assert p['implementation_digest'] == os.environ['EXPECTED_IMPLEMENTATION_DIGEST']
          authority = canonical_aggtrades_capacity_authority()
          assert authority.result_run_id == 34766830666
          assert authority.result_artifact_id == 10320428830
          assert authority.verifier_run_id == 34767391268
          print('IMPLEMENTATION_DIGEST=' + str(p['implementation_digest']))
          print('PNL_EXECUTED=false')
          PY
