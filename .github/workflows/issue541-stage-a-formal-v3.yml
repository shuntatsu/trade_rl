name: Issue 541 Stage A one-shot v3

on:
  push:
    branches:
      - execute/issue541-stage-a
    paths:
      - .github/workflows/issue541-stage-a-formal-v3.yml

permissions:
  actions: read
  contents: read

env:
  MAIN_SHA: c5a1ce8395feaedd8833f7e596fddc9d8f3115fc
  MAIN_CI_RUN_ID: "34811335706"
  OLD_V1_RUN: "34812777802"
  OLD_V2_RUN: "34816386939"
  TDD_RUN_ID: "34816239490"
  HELPER_BLOB: a20190ab1c32ed06eb253e85fded0a66a99c129b
  TEST_BLOB: 40f8126fdc4ad1679b6063cd5c2fd842651076f7
  AUTH_RUN_ID: "34812530949"
  AUTH_NAME: issue541-post-integration-fresh-authorization-34812530949
  AUTH_ID: "10334389658"
  AUTH_DIGEST: sha256:618a457aaca208d8d09e806143bc3016db8a01053afa52780edb0a15c9cd31ca
  PREREG_RUN_ID: "34702660287"
  PREREG_NAME: canonical-m2-portable-prereg-v1-34702660287
  PREREG_ID: "10300479733"
  PREREG_DIGEST: sha256:60127cc2f24c7e8b3dcb5c6157ca49a5dd2f5b60c44f1020e4d540405e34e1f4
  BASELINE_RUN_ID: "34700123151"
  BASELINE_NAME: canonical-m2-portable-baseline-v1-34700123151
  BASELINE_ID: "10301701698"
  BASELINE_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a
  BASELINE_FINGERPRINT: 526b485d60b394739b7a8d03535e1cfa08b26fa920119c70ee53f05faa53dd29
  PROTOCOL_DIGEST: 11bf254c262aff9daef620a18b80badb40c6ffc239566b88fe70442ebaf54dc8

jobs:
  stage_a:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: One-shot guard proving no prior Stage A execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=execute/issue541-stage-a&event=push&per_page=100")"
          current_ids="$(jq -c '[.workflow_runs[] | select(.path==".github/workflows/issue541-stage-a-formal-v3.yml") | .id]' <<<"$runs")"
          test "$(jq 'length' <<<"$current_ids")" = "1"
          test "$(jq -r '.[0]' <<<"$current_ids")" = "$GITHUB_RUN_ID"
          prove_skipped() {
            local run_id="$1" step_name="$2"
            local jobs artifacts conclusion
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            conclusion="$(jq -r --arg step "$step_name" '.jobs[] | .steps[]? | select(.name==$step) | .conclusion' <<<"$jobs")"
            test "$conclusion" = "skipped"
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            test "$(jq -r '.total_count' <<<"$artifacts")" = "0"
          }
          prove_skipped "$OLD_V1_RUN" "Execute frozen source baseline exactly once under integrated implementation"
          prove_skipped "$OLD_V2_RUN" "Execute frozen source baseline exactly once"

      - name: Bind exact integrated production and verifier code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$MAIN_SHA"
          git diff --exit-code "$MAIN_SHA" -- trade_rl pyproject.toml uv.lock
          test "$(git hash-object tools/issue541_stage_a.py)" = "$HELPER_BLOB"
          test "$(git hash-object tests/research/test_issue541_stage_a.py)" = "$TEST_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$MAIN_SHA"
          ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_CI_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$ci")" = "$MAIN_SHA"
          test "$(jq -r '.conclusion' <<<"$ci")" = "success"
          tdd="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TDD_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$tdd")" = "success"

      - name: API-bind all immutable inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            local id="$1" name="$2" digest="$3" run="$4"
            local p
            p="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.name' <<<"$p")" = "$name"
            test "$(jq -r '.digest' <<<"$p")" = "$digest"
            test "$(jq -r '.workflow_run.id' <<<"$p")" = "$run"
            test "$(jq -r '.expired' <<<"$p")" = "false"
          }
          verify "$AUTH_ID" "$AUTH_NAME" "$AUTH_DIGEST" "$AUTH_RUN_ID"
          verify "$PREREG_ID" "$PREREG_NAME" "$PREREG_DIGEST" "$PREREG_RUN_ID"
          verify "$BASELINE_ID" "$BASELINE_NAME" "$BASELINE_DIGEST" "$BASELINE_RUN_ID"

      - name: Download fresh authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AUTH_NAME }}
          path: /tmp/auth
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.AUTH_RUN_ID }}

      - name: Download plan-only source preregistration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PREREG_NAME }}
          path: /tmp/prereg
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.PREREG_RUN_ID }}

      - name: Download historical source baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.BASELINE_NAME }}
          path: /tmp/original
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_RUN_ID }}

      - name: Result-blind pre-execution validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          auth=json.loads(Path('/tmp/auth/fresh-authorization.json').read_text())
          checks={'schema_version':'issue541_post_integration_fresh_authorization_v1','main_sha':os.environ['MAIN_SHA'],'protocol_digest':os.environ['PROTOCOL_DIGEST'],'integration_gate_satisfied':True,'execution_authorized':True,'stage_a_execution_authorized':True,'stage_a_executed':False,'stage_b_authorized':False,'stage_b_executed':False,'successor_pnl_inspected':False}
          for k,v in checks.items():
              if auth.get(k)!=v: raise RuntimeError(f'authorization drift: {k}')
          pp=json.loads(Path('/tmp/prereg/study/plan.json').read_text())
          op=json.loads(Path('/tmp/original/study/plan.json').read_text())
          if pp!=op: raise RuntimeError('source Study plan drift')
          if Path('/tmp/prereg/study/baseline').exists(): raise RuntimeError('prereg is not plan-only')
          om=json.loads(Path('/tmp/original/study/baseline/evidence/manifest.json').read_text())
          if om.get('fingerprint')!=os.environ['BASELINE_FINGERPRINT']: raise RuntimeError('baseline fingerprint drift')
          PY

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install frozen research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Reprove verifier tests before Stage A
        run: |
          uv run ruff check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
          uv run ruff format --check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
          uv run pytest -q tests/research/test_issue541_stage_a.py

      - name: Prepare isolated replay root
        run: |
          set -euo pipefail
          test ! -e /tmp/replay
          mkdir -p /tmp/replay
          cp -a /tmp/prereg/. /tmp/replay/
          test ! -e /tmp/replay/study/baseline

      - name: Execute frozen source baseline exactly once
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from trade_rl.evaluation.experiments import inspect_study, run_baseline
          root=Path('/tmp/replay')
          before=inspect_study(root/'study')
          if before.baseline is not None or before.experiment_sequences or before.frozen: raise RuntimeError('source is not plan-only')
          after=run_baseline(root/'study', dataset_root=root/'dataset')
          if after.baseline is None or after.experiment_sequences or after.frozen: raise RuntimeError('Stage A left baseline-only boundary')
          Path('/tmp/stage-a-meta.json').write_text(json.dumps({'schema_version':'issue541_stage_a_raw_v3','main_sha':os.environ['MAIN_SHA'],'protocol_digest':os.environ['PROTOCOL_DIGEST'],'stage_a_execution_count':1,'stage_a_executed':True,'stage_b_executed':False,'successor_pnl_inspected':False},sort_keys=True,indent=2)+'\n')
          PY

      - name: Package raw evidence before verification
        if: ${{ steps.execute.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw/study
          cp /tmp/replay/study/plan.json /tmp/raw/study/plan.json
          cp -a /tmp/replay/study/baseline /tmp/raw/study/baseline
          cp /tmp/stage-a-meta.json /tmp/raw/stage-a-meta.json
          cp /tmp/auth/fresh-authorization.json /tmp/raw/input-authorization.json

      - id: raw_meta
        if: ${{ steps.execute.outcome == 'success' }}
        run: echo "name=issue541-stage-a-raw-v3-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - id: raw_upload
        if: ${{ steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.raw_meta.outputs.name }}
          path: /tmp/raw
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Primary verifier
        if: ${{ steps.execute.outcome == 'success' }}
        run: uv run python tools/issue541_stage_a.py --original /tmp/original --replay /tmp/replay --output /tmp/primary.json

      - name: Independent raw verifier
        if: ${{ steps.execute.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          original=Path('/tmp/original/study/baseline'); replay=Path('/tmp/replay/study/baseline')
          om=json.loads((original/'evidence/manifest.json').read_text()); rm=json.loads((replay/'evidence/manifest.json').read_text())
          for k in ('schema_version','ppo_seeds','research_context_digest','semantic_config','semantic_config_digest'):
              if om[k]!=rm[k]: raise RuntimeError(f'manifest drift {k}')
          if om['ppo_seeds']!=[0,1,2,3,4]: raise RuntimeError('seed roster drift')
          arrays=0; summaries=0
          for seed in om['ppo_seeds']:
              op=original/'evidence/runs'/f'seed-{seed}'; rp=replay/'evidence/runs'/f'seed-{seed}'
              if json.loads((op/'summary.json').read_text())!=json.loads((rp/'summary.json').read_text()): raise RuntimeError(f'summary drift {seed}')
              summaries+=1
              with np.load(op/'returns.npz',allow_pickle=False) as a, np.load(rp/'returns.npz',allow_pickle=False) as b:
                  if sorted(a.files)!=sorted(b.files): raise RuntimeError('return roster drift')
                  for key in sorted(a.files):
                      if a[key].dtype!=b[key].dtype or a[key].shape!=b[key].shape or not np.array_equal(a[key],b[key],equal_nan=True): raise RuntimeError(f'raw drift {seed}:{key}')
                      arrays+=1
          if arrays!=200 or summaries!=5: raise RuntimeError(f'oracle count drift {arrays}/{summaries}')
          oa=json.loads((original/'analysis.json').read_text()); ra=json.loads((replay/'analysis.json').read_text())
          if oa['analysis']!=ra['analysis']: raise RuntimeError('analysis drift')
          Path('/tmp/independent.json').write_text(json.dumps({'schema_version':'issue541_stage_a_independent_v1','status':'PASS','raw_return_arrays_checked':arrays,'summaries_checked':summaries,'raw_returns_exact':True,'economic_summaries_exact':True,'economic_analysis_exact':True,'stage_b_executed':False,'successor_pnl_inspected':False},sort_keys=True,indent=2)+'\n')
          PY

      - name: Write preverification binding
        if: ${{ steps.execute.outcome == 'success' }}
        env:
          RAW_ID: ${{ steps.raw_upload.outputs.artifact-id }}
          RAW_DIGEST: ${{ steps.raw_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('/tmp/primary.json').read_text()); i=json.loads(Path('/tmp/independent.json').read_text())
          if p.get('status')!='PASS' or i.get('status')!='PASS': raise RuntimeError('preverify failed')
          if p.get('raw_return_arrays_checked')!=200 or p.get('summaries_checked')!=5: raise RuntimeError('primary count drift')
          out={'schema_version':'issue541_stage_a_preverify_v3','main_sha':os.environ['MAIN_SHA'],'protocol_digest':os.environ['PROTOCOL_DIGEST'],'raw_artifact_id':int(os.environ['RAW_ID']),'raw_artifact_digest':'sha256:'+os.environ['RAW_DIGEST'],'source_baseline_artifact_id':int(os.environ['BASELINE_ID']),'source_baseline_artifact_digest':os.environ['BASELINE_DIGEST'],'primary_verification':p,'independent_verification':i,'stage_a_execution_count':1,'stage_a_executed':True,'stage_a_passed':True,'primary_verifier_passed':True,'independent_verifier_passed':True,'fresh_verifier_passed':False,'stage_b_execution_authorized':False,'stage_b_executed':False,'successor_pnl_inspected':False}
          Path('/tmp/preverify.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY

      - id: pre_meta
        if: ${{ steps.execute.outcome == 'success' }}
        run: echo "name=issue541-stage-a-preverify-v3-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Publish preverification
        if: ${{ steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.pre_meta.outputs.name }}
          path: |
            /tmp/primary.json
            /tmp/independent.json
            /tmp/preverify.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve execution failure snapshot
        if: ${{ failure() && steps.execute.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue541-stage-a-v3-failure-${{ github.run_id }}
          path: |
            /tmp/replay/study
            /tmp/stage-a-meta.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90
