name: Issue 541 Stage A formal bridge

on:
  push:
    branches:
      - execute/issue541-stage-a
    paths:
      - .github/workflows/issue541-stage-a-formal.yml

permissions:
  actions: read
  contents: read

env:
  MAIN_SHA: c5a1ce8395feaedd8833f7e596fddc9d8f3115fc
  HELPER_BLOB: a20190ab1c32ed06eb253e85fded0a66a99c129b
  AUTH_RUN_ID: "34812530949"
  AUTH_NAME: issue541-post-integration-fresh-authorization-34812530949
  AUTH_ID: "10334389658"
  AUTH_DIGEST: sha256:618a457aaca208d8d09e806143bc3016db8a01053afa52780edb0a15c9cd31ca
  SOURCE_RUN_ID: "34700123151"
  SOURCE_NAME: canonical-m2-portable-baseline-v1-34700123151
  SOURCE_ID: "10301701698"
  SOURCE_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a
  SOURCE_FINGERPRINT: 526b485d60b394739b7a8d03535e1cfa08b26fa920119c70ee53f05faa53dd29
  SOURCE_DATASET_ID: d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f
  SOURCE_DATASET_ARTIFACT_DIGEST: 77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8
  PROTOCOL_DIGEST: 11bf254c262aff9daef620a18b80badb40c6ffc239566b88fe70442ebaf54dc8

jobs:
  execute_and_preverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      evidence_name: ${{ steps.evidence_meta.outputs.name }}
      evidence_id: ${{ steps.evidence_upload.outputs.artifact-id }}
      evidence_digest: ${{ steps.evidence_upload.outputs.artifact-digest }}
      preverify_name: ${{ steps.preverify_meta.outputs.name }}
      preverify_id: ${{ steps.preverify_upload.outputs.artifact-id }}
      preverify_digest: ${{ steps.preverify_upload.outputs.artifact-digest }}
    steps:
      - name: Checkout execution tooling branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: execute/issue541-stage-a
          fetch-depth: 0
          persist-credentials: false
      - name: One-shot guard and production identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" = "1"
          git fetch --no-tags origin "$MAIN_SHA"
          git diff --quiet "$MAIN_SHA" -- trade_rl
          test "$(git hash-object tools/issue541_stage_a.py)" = "$HELPER_BLOB"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$MAIN_SHA"
      - name: API-bind Stage A authorization and source baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_artifact() {
            local id="$1" name="$2" digest="$3" run_id="$4"
            payload="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id)"
            test "$(jq -r .name <<<"$payload")" = "$name"
            test "$(jq -r .digest <<<"$payload")" = "$digest"
            test "$(jq -r .workflow_run.id <<<"$payload")" = "$run_id"
            test "$(jq -r .expired <<<"$payload")" = false
          }
          verify_artifact "$AUTH_ID" "$AUTH_NAME" "$AUTH_DIGEST" "$AUTH_RUN_ID"
          verify_artifact "$SOURCE_ID" "$SOURCE_NAME" "$SOURCE_DIGEST" "$SOURCE_RUN_ID"
      - name: Download fresh Stage A authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.AUTH_NAME }}
          path: /tmp/auth
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.AUTH_RUN_ID }}
      - name: Download frozen source baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_NAME }}
          path: /tmp/original
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Validate authorization content before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          files=list(Path('/tmp/auth').glob('*.json'))
          if len(files)!=1: raise RuntimeError('unexpected authorization layout')
          a=json.loads(files[0].read_text())
          checks={
            'schema_version':'issue541_post_integration_fresh_authorization_v1',
            'main_sha':os.environ['MAIN_SHA'],
            'protocol_digest':os.environ['PROTOCOL_DIGEST'],
            'integration_gate_satisfied':True,
            'execution_authorized':True,
            'stage_a_authorized':True,
            'stage_b_authorized':False,
            'stage_a_executed':False,
            'stage_b_executed':False,
            'successor_pnl_inspected':False,
            'stage_a_execution_authorized':True,
          }
          for key,value in checks.items():
              if a.get(key)!=value: raise RuntimeError(f'authorization mismatch: {key}')
          manifest=json.loads(Path('/tmp/original/study/baseline/evidence/manifest.json').read_text())
          if manifest['fingerprint']!=os.environ['SOURCE_FINGERPRINT']:
              raise RuntimeError('source EvidenceSet fingerprint drift')
          plan=json.loads(Path('/tmp/original/study/plan.json').read_text())
          if plan['dataset_id']!=os.environ['SOURCE_DATASET_ID'] or plan['dataset_artifact_digest']!=os.environ['SOURCE_DATASET_ARTIFACT_DIGEST']:
              raise RuntimeError('source Dataset binding drift')
          PY
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install frozen research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Verify Stage A oracle tests
        run: |
          uv run ruff check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
          uv run ruff format --check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
          uv run pytest -q tests/research/test_issue541_stage_a.py
      - name: Prepare result-blind legacy replay workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/replay /tmp/stage-a-published
          cp -a /tmp/original /tmp/replay
          rm -rf /tmp/replay/study/baseline
          mkdir -p /tmp/stage-a-published
          uv run python - <<'PY'
          from trade_rl.evaluation.experiments import inspect_study
          s=inspect_study('/tmp/replay/study')
          if s.baseline is not None or s.experiment_sequences or s.frozen:
              raise RuntimeError('Stage A workspace is not clean plan-only Study')
          PY
      - name: Execute frozen source baseline exactly once under integrated implementation
        id: stage_a
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from trade_rl.evaluation.experiments import inspect_study, run_baseline
          before=inspect_study('/tmp/replay/study')
          if before.baseline is not None:
              raise RuntimeError('baseline already exists before Stage A')
          after=run_baseline('/tmp/replay/study', dataset_root='/tmp/replay/dataset')
          if after.baseline is None:
              raise RuntimeError('Stage A did not publish baseline evidence')
          meta={
              'schema_version':'issue541_stage_a_raw_evidence_v1',
              'main_sha':os.environ['MAIN_SHA'],
              'protocol_digest':os.environ['PROTOCOL_DIGEST'],
              'source_baseline_artifact_id':int(os.environ['SOURCE_ID']),
              'source_baseline_artifact_digest':os.environ['SOURCE_DIGEST'],
              'stage_a_execution_count':1,
              'stage_a_execution_completed':True,
              'primary_verifier_passed':False,
              'fresh_verifier_passed':False,
              'stage_b_execution_authorized':False,
              'successor_pnl_inspected':False,
          }
          Path('/tmp/stage-a-meta.json').write_text(json.dumps(meta,allow_nan=False,sort_keys=True,indent=2)+'\n')
          PY
      - name: Package immutable Stage A evidence before interpretation
        if: ${{ steps.stage_a.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage-a-published/study
          cp /tmp/replay/study/plan.json /tmp/stage-a-published/study/plan.json
          cp -a /tmp/replay/study/baseline /tmp/stage-a-published/study/baseline
          cp /tmp/stage-a-meta.json /tmp/stage-a-published/stage-a-meta.json
      - id: evidence_meta
        if: ${{ steps.stage_a.outcome == 'success' }}
        run: echo "name=issue541-stage-a-raw-evidence-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: evidence_upload
        if: ${{ steps.stage_a.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.evidence_meta.outputs.name }}
          path: /tmp/stage-a-published
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Primary Stage A bridge verification
        if: ${{ steps.stage_a.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python tools/issue541_stage_a.py --original /tmp/original --replay /tmp/replay --output /tmp/stage-a-primary.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('/tmp/stage-a-primary.json')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS': raise RuntimeError('Stage A primary verifier did not PASS')
          binding={
            'schema_version':'issue541_stage_a_preverify_v1',
            'main_sha':os.environ['MAIN_SHA'],
            'protocol_digest':os.environ['PROTOCOL_DIGEST'],
            'stage_a_raw_artifact_id':int(os.environ['RAW_ID']),
            'stage_a_raw_artifact_digest':'sha256:'+os.environ['RAW_DIGEST'],
            'source_baseline_artifact_id':int(os.environ['SOURCE_ID']),
            'source_baseline_artifact_digest':os.environ['SOURCE_DIGEST'],
            'primary_verification':r,
            'stage_a_execution_count':1,
            'primary_verifier_passed':True,
            'fresh_verifier_passed':False,
            'stage_b_execution_authorized':False,
            'successor_pnl_inspected':False,
          }
          Path('/tmp/stage-a-preverify.json').write_text(json.dumps(binding,allow_nan=False,sort_keys=True,indent=2)+'\n')
          PY
        env:
          RAW_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          RAW_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
      - id: preverify_meta
        if: ${{ steps.stage_a.outcome == 'success' }}
        run: echo "name=issue541-stage-a-preverify-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: preverify_upload
        if: ${{ steps.stage_a.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.preverify_meta.outputs.name }}
          path: /tmp/stage-a-preverify.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload failure recovery snapshot if execution failed
        if: ${{ failure() && steps.stage_a.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue541-stage-a-failure-${{ github.run_id }}
          path: |
            /tmp/replay/study
            /tmp/stage-a-meta.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 90

  fresh_reverify:
    needs: execute_and_preverify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      name: ${{ steps.meta.outputs.name }}
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout execution verifier tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: execute/issue541-stage-a
          fetch-depth: 0
          persist-credentials: false
      - name: Prove verifier and integrated production bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$MAIN_SHA"
          git diff --quiet "$MAIN_SHA" -- trade_rl
          test "$(git hash-object tools/issue541_stage_a.py)" = "$HELPER_BLOB"
      - name: API-bind published Stage A evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_ID: ${{ needs.execute_and_preverify.outputs.evidence_id }}
          RAW_DIGEST: ${{ needs.execute_and_preverify.outputs.evidence_digest }}
          RAW_NAME: ${{ needs.execute_and_preverify.outputs.evidence_name }}
          PRE_ID: ${{ needs.execute_and_preverify.outputs.preverify_id }}
          PRE_DIGEST: ${{ needs.execute_and_preverify.outputs.preverify_digest }}
          PRE_NAME: ${{ needs.execute_and_preverify.outputs.preverify_name }}
        run: |
          set -euo pipefail
          verify() {
            payload="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$1)"
            test "$(jq -r .name <<<"$payload")" = "$2"
            test "$(jq -r .digest <<<"$payload")" = "sha256:$3"
            test "$(jq -r .workflow_run.id <<<"$payload")" = "$GITHUB_RUN_ID"
            test "$(jq -r .expired <<<"$payload")" = false
          }
          verify "$RAW_ID" "$RAW_NAME" "$RAW_DIGEST"
          verify "$PRE_ID" "$PRE_NAME" "$PRE_DIGEST"
      - name: Download exact published Stage A evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.execute_and_preverify.outputs.evidence_name }}
          path: /tmp/replay
      - name: Download pre-upload verifier result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.execute_and_preverify.outputs.preverify_name }}
          path: /tmp/preverify
      - name: Re-download frozen source baseline independently
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_NAME }}
          path: /tmp/original
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Fresh independent Stage A reverify
        shell: bash
        env:
          RAW_ID: ${{ needs.execute_and_preverify.outputs.evidence_id }}
          RAW_DIGEST: ${{ needs.execute_and_preverify.outputs.evidence_digest }}
          PRE_ID: ${{ needs.execute_and_preverify.outputs.preverify_id }}
          PRE_DIGEST: ${{ needs.execute_and_preverify.outputs.preverify_digest }}
        run: |
          set -euo pipefail
          uv run python tools/issue541_stage_a.py --original /tmp/original --replay /tmp/replay --output /tmp/stage-a-fresh-report.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fresh=json.loads(Path('/tmp/stage-a-fresh-report.json').read_text())
          pre_files=list(Path('/tmp/preverify').glob('*.json'))
          if len(pre_files)!=1: raise RuntimeError('unexpected preverify layout')
          pre=json.loads(pre_files[0].read_text())
          if fresh!=pre.get('primary_verification'):
              raise RuntimeError('fresh Stage A report differs from primary verifier')
          if fresh.get('status')!='PASS': raise RuntimeError('fresh Stage A verifier did not PASS')
          result={
            'schema_version':'issue541_stage_a_fresh_verification_v1',
            'main_sha':os.environ['MAIN_SHA'],
            'protocol_digest':os.environ['PROTOCOL_DIGEST'],
            'source_baseline_artifact_id':int(os.environ['SOURCE_ID']),
            'source_baseline_artifact_digest':os.environ['SOURCE_DIGEST'],
            'stage_a_raw_artifact_id':int(os.environ['RAW_ID']),
            'stage_a_raw_artifact_digest':'sha256:'+os.environ['RAW_DIGEST'],
            'stage_a_preverify_artifact_id':int(os.environ['PRE_ID']),
            'stage_a_preverify_artifact_digest':'sha256:'+os.environ['PRE_DIGEST'],
            'verification':fresh,
            'stage_a_execution_count':1,
            'stage_a_executed':True,
            'stage_a_passed':True,
            'primary_verifier_passed':True,
            'fresh_verifier_passed':True,
            'stage_b_execution_authorized':True,
            'successor_pnl_inspected':False,
          }
          Path('/tmp/stage-a-fresh-verification.json').write_text(json.dumps(result,allow_nan=False,sort_keys=True,indent=2)+'\n')
          PY
      - id: meta
        run: echo "name=issue541-stage-a-fresh-verification-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.meta.outputs.name }}
          path: /tmp/stage-a-fresh-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  audit:
    needs: [execute_and_preverify, fresh_reverify]
    runs-on: ubuntu-24.04
    steps:
      - name: API audit final Stage A authorization for Stage B
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.fresh_reverify.outputs.id }}
          DIGEST_RAW: ${{ needs.fresh_reverify.outputs.digest }}
          NAME: ${{ needs.fresh_reverify.outputs.name }}
        run: |
          set -euo pipefail
          payload="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$ID)"
          test "$(jq -r .name <<<"$payload")" = "$NAME"
          test "$(jq -r .digest <<<"$payload")" = "sha256:$DIGEST_RAW"
          test "$(jq -r .workflow_run.id <<<"$payload")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$payload")" = false
