name: Issue 541 v3 exact verification

on:
  push:
    branches:
      - verify/issue541-v3-exact-06f368d
    paths:
      - .github/workflows/issue541-v3-exact-verification.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 06f368d4d8d0aafac8b80c60309b1d24dc5e32e6
  BASE_SHA: 3e111a59153b7353e26080bd569b9775190577be
  SOURCE_ELIGIBILITY_RUN_ID: "34794576828"
  SOURCE_ELIGIBILITY_ARTIFACT_ID: "10329551558"
  SOURCE_ELIGIBILITY_DIGEST: sha256:907599e2330e52fe832872b3b11a5f0ad62316fe4a170acd4453ab39ba1a0800
  SUCCESSOR_BUNDLE_RUN_ID: "34803217815"
  SUCCESSOR_BUNDLE_ARTIFACT_ID: "10331899302"
  SUCCESSOR_BUNDLE_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  SUCCESSOR_FRESH_RUN_ID: "34803432434"
  SUCCESSOR_FRESH_ARTIFACT_ID: "10332575500"
  SUCCESSOR_FRESH_DIGEST: sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589

jobs:
  core:
    name: Exact Lean Core
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06f368d4d8d0aafac8b80c60309b1d24dc5e32e6
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact head and durable diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$TARGET_SHA")"
          expected=$'tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py\ntrade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py'
          test "$changed" = "$expected"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Core tests
        run: uv run pytest -q tests
      - name: Build
        run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help
      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

  guide:
    name: Exact Human Guide
    runs-on: ubuntu-24.04
    env:
      GUIDE_SOURCE_REV: 06f368d4d8d0aafac8b80c60309b1d24dc5e32e6
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06f368d4d8d0aafac8b80c60309b1d24dc5e32e6
          persist-credentials: false
      - name: Prove exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci
      - name: Guide source contract
        working-directory: guide
        run: npm run source-check
      - name: Guide lint
        working-directory: guide
        run: npm run lint
      - name: Guide typecheck
        working-directory: guide
        run: npm run typecheck
      - name: Guide unit tests
        working-directory: guide
        run: npm run test
      - name: Guide build
        working-directory: guide
        run: npm run build
      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e

  authority:
    name: Verify frozen authority without PnL
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 06f368d4d8d0aafac8b80c60309b1d24dc5e32e6
          persist-credentials: false
      - name: API-bind external evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            local id="$1" digest="$2" run_id="$3"
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.digest' <<<"$payload")" = "$digest"
            test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$run_id"
            test "$(jq -r '.expired' <<<"$payload")" = "false"
          }
          verify "$SOURCE_ELIGIBILITY_ARTIFACT_ID" "$SOURCE_ELIGIBILITY_DIGEST" "$SOURCE_ELIGIBILITY_RUN_ID"
          verify "$SUCCESSOR_BUNDLE_ARTIFACT_ID" "$SUCCESSOR_BUNDLE_DIGEST" "$SUCCESSOR_BUNDLE_RUN_ID"
          verify "$SUCCESSOR_FRESH_ARTIFACT_ID" "$SUCCESSOR_FRESH_DIGEST" "$SUCCESSOR_FRESH_RUN_ID"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Reconstruct canonical v3 protocol
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from trade_rl.evaluation.experiments.bootstrap.capacity_robustness_prereg import canonical_capacity_robustness_protocol
          p = canonical_capacity_robustness_protocol()
          assert p.schema_version == 'calibrated_capacity_robustness_prereg_v3'
          assert p.capacity_result_run_id == 34766830666
          assert p.identity_layer_head_sha == '3e111a59153b7353e26080bd569b9775190577be'
          assert p.successor_bundle_run_id == 34803217815
          assert p.successor_bundle_artifact_id == 10331899302
          assert p.successor_fresh_verification_run_id == 34803432434
          assert p.successor_fresh_verification_artifact_id == 10332575500
          assert p.integration_gate_satisfied is False
          assert p.execution_authorized is False
          assert p.stage_a_executed is False
          assert p.stage_b_executed is False
          assert p.successor_pnl_inspected is False
          print('PROTOCOL_DIGEST=' + p.digest)
          print('PROTOCOL=' + json.dumps(p.to_payload(), allow_nan=False, sort_keys=True))
          PY
