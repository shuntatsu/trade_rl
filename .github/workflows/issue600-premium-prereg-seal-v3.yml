name: Issue 600 premium reversal preregistration seal v3

on:
  push:
    branches:
      - seal/issue600-premium-prereg-v3
    paths:
      - .github/workflows/issue600-premium-prereg-seal-v3.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 6ffc414baa10e91f34df258fe5cfabacce65fd77
  FULL_VERIFY_RUN_ID: "34959430185"
  DIGEST_VERIFY_RUN_ID: "34959536569"
  PROTOCOL_DIGEST: 18bf9625502eccbe475d157df90635f1c4645d3c4cced48ec0fc565723206731
  SOURCE_RUN_ID: "34863522941"
  SOURCE_ARTIFACT_ID: "10355913123"
  SOURCE_ARTIFACT_DIGEST: sha256:0076698414d3ac8197a676aecc0155853befc3828a2a9c62e92b76576ad2dc04
  SOURCE_FRESH_ARTIFACT_ID: "10355333076"
  SOURCE_FRESH_ARTIFACT_DIGEST: sha256:2212693404afefedc041b869a03dbe664d3b5cb1e25e28c6c3cdc04a89c1bd3f
  SOURCE_REPORT_SHA256: 059987f3692c0f249f2db5ef2e14f8cbaaefa5ca24dccf4c45bae009ca19ebe4
  SOURCE_REPORT_CONTENT_DIGEST: fc756962aa997cfb8beafdafe06e70e02602e23e09a5dce5a36d229ddb558f88
  MODULE: trade_rl/evaluation/experiments/bootstrap/premium_pressure_prereg.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_prereg.py

jobs:
  seal:
    name: Immutable premium reversal protocol publisher v3
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.meta.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact prereg authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact current head, verification, digest, and source authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/research/issue600-premium-pressure-prereg | cut -f1)" = "$TARGET_SHA"
          for run_id in "$FULL_VERIFY_RUN_ID" "$DIGEST_VERIFY_RUN_ID" "$SOURCE_RUN_ID"; do
            run="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run_id)"
            test "$(jq -r .status <<<"$run")" = completed
            test "$(jq -r .conclusion <<<"$run")" = success
          done
          full_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FULL_VERIFY_RUN_ID/jobs?per_page=100")"
          test "$(jq -r '.jobs[] | select(.name=="Lean Core exact target") | .conclusion' <<<"$full_jobs")" = success
          test "$(jq -r '.jobs[] | select(.name=="Human Guide exact target") | .conclusion' <<<"$full_jobs")" = success
          for spec in "$SOURCE_ARTIFACT_ID|$SOURCE_ARTIFACT_DIGEST" "$SOURCE_FRESH_ARTIFACT_ID|$SOURCE_FRESH_ARTIFACT_DIGEST"; do
            IFS='|' read -r id expected <<<"$spec"
            artifact="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id)"
            test "$(jq -r .workflow_run.id <<<"$artifact")" = "$SOURCE_RUN_ID"
            test "$(jq -r .expired <<<"$artifact")" = false
            test "$(jq -r .digest <<<"$artifact")" = "$expected"
          done
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Reprove exact prereg contract
        run: |
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
      - name: Materialize canonical protocol and seal index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal
          uv run python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.artifacts.canonical import canonical_json_bytes
          from trade_rl.evaluation.experiments.bootstrap.premium_pressure_prereg import (
              canonical_premium_pressure_protocol,
              canonical_premium_pressure_protocol_bytes,
              load_premium_pressure_protocol_bytes,
          )

          protocol = canonical_premium_pressure_protocol()
          raw = canonical_premium_pressure_protocol_bytes(protocol)
          expected = os.environ['PROTOCOL_DIGEST']
          if protocol.digest != expected or hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('protocol digest authority differs')
          if load_premium_pressure_protocol_bytes(raw).digest != expected:
              raise SystemExit('strict protocol reload differs')
          payload = protocol.to_dict()
          required = {
              'expected_effect_direction': 'REVERSAL',
              'feature_name': '1h__premium_index_close_bps',
              'feature_formula': '10000*premium_index_close(raw_open_time=t-1h)',
              'premium_decision_raw_open_time_offset_minutes': -60,
              'target_decision_raw_open_time_offset_minutes': -60,
              'execution_raw_open_time_offset_minutes': 0,
              'endpoint_raw_open_time_offset_minutes': 1440,
              'label_execution_offset_bars': 1,
              'label_endpoint_offset_bars': 25,
              'label_horizon_bars': 24,
              'last_candidate_decision': '2022-12-30T23:00:00Z',
              'nominal_candidate_decisions_per_symbol': 17495,
              'minimum_eligible_observations_per_symbol': 16621,
              'calibration_method': 'per_symbol_ols_intercept_fixed_order_fsum',
              'required_negative_symbol_slopes': 4,
          }
          for key, value in required.items():
              if payload.get(key) != value or type(payload.get(key)) is not type(value):
                  raise SystemExit(f'frozen prereg field differs: {key}')
          for key in (
              'source_premium_value_distribution_inspected',
              'source_target_relation_computed',
              'source_strategy_pnl_computed',
              'training_relation_executed',
              'evaluation_pnl_inspected',
              'evaluation_execution_authorized',
              'final_test_authorized',
              'shared_cash_profitability_established',
              'production_eligible',
              'live_trading_authorized',
          ):
              if payload.get(key) is not False:
                  raise SystemExit(f'forbidden boundary crossed: {key}')
          paths = [os.environ['MODULE'], os.environ['TEST_FILE']]
          blobs = {path: subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip() for path in paths}
          Path('/tmp/seal/protocol.json').write_bytes(raw)
          index = {
              'schema_version': 'issue600_premium_pressure_prereg_seal_v3',
              'issue_number': 600,
              'multiplicity_issue': 599,
              'target_sha': os.environ['TARGET_SHA'],
              'full_verify_run_id': int(os.environ['FULL_VERIFY_RUN_ID']),
              'digest_verify_run_id': int(os.environ['DIGEST_VERIFY_RUN_ID']),
              'protocol_digest': expected,
              'protocol_json_sha256': expected,
              'blob_shas': blobs,
              'source_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              'source_fresh_artifact_id': int(os.environ['SOURCE_FRESH_ARTIFACT_ID']),
              'source_fresh_artifact_digest': os.environ['SOURCE_FRESH_ARTIFACT_DIGEST'],
              'source_report_sha256': os.environ['SOURCE_REPORT_SHA256'],
              'source_report_content_digest': os.environ['SOURCE_REPORT_CONTENT_DIGEST'],
              'raw_endpoint_cutoff_contract': True,
              'selection_frozen_before_economic_inspection': True,
              'economic_values_inspected': False,
              'training_relation_executed': False,
              'evaluation_pnl_inspected': False,
              'production_eligible': False,
              'live_trading_authorized': False,
          }
          Path('/tmp/seal/seal-index.json').write_bytes(canonical_json_bytes(index))
          print('ISSUE600_PREREG_SEAL_V3_MATERIALIZED=PASS')
          print('ECONOMIC_VALUES_INSPECTED=false')
          PY
      - id: meta
        run: echo "name=issue600-premium-prereg-seal-v3-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable seal evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.meta.outputs.name }}
          path: /tmp/seal/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  fresh:
    name: Fresh independent premium prereg reconstruction v3
    needs: seal
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.meta.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: API-bind publisher artifact and current research head
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.seal.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.seal.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.seal.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/research/issue600-premium-pressure-prereg | cut -f1)" = "$TARGET_SHA"
          artifact="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID)"
          test "$(jq -r .name <<<"$artifact")" = "$ARTIFACT_NAME"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$artifact")" = false
          api_digest="$(jq -r .digest <<<"$artifact")"
          case "$ARTIFACT_DIGEST" in sha256:*) test "$api_digest" = "$ARTIFACT_DIGEST" ;; *) test "$api_digest" = "sha256:$ARTIFACT_DIGEST" ;; esac
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.seal.outputs.artifact_name }}
          path: /tmp/published
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Independently reconstruct canonical bytes and blob authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fresh
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.artifacts.canonical import canonical_json_bytes
          from trade_rl.evaluation.experiments.bootstrap.premium_pressure_prereg import (
              canonical_premium_pressure_protocol,
              canonical_premium_pressure_protocol_bytes,
              load_premium_pressure_protocol_bytes,
          )

          published = Path('/tmp/published/protocol.json').read_bytes()
          index_raw = Path('/tmp/published/seal-index.json').read_bytes()
          index = json.loads(index_raw)
          if canonical_json_bytes(index) != index_raw:
              raise SystemExit('seal index is not canonical')
          protocol = canonical_premium_pressure_protocol()
          fresh = canonical_premium_pressure_protocol_bytes(protocol)
          expected = os.environ['PROTOCOL_DIGEST']
          if fresh != published:
              raise SystemExit('fresh protocol bytes differ')
          if hashlib.sha256(fresh).hexdigest() != expected or protocol.digest != expected:
              raise SystemExit('fresh protocol digest differs')
          if load_premium_pressure_protocol_bytes(fresh).digest != expected:
              raise SystemExit('fresh strict-loader digest differs')
          paths = [os.environ['MODULE'], os.environ['TEST_FILE']]
          blobs = {path: subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip() for path in paths}
          if index.get('blob_shas') != blobs:
              raise SystemExit('source/test blob authority differs')
          if index.get('target_sha') != os.environ['TARGET_SHA'] or index.get('raw_endpoint_cutoff_contract') is not True:
              raise SystemExit('sealed current-head/raw-endpoint authority differs')
          Path('/tmp/fresh/protocol.json').write_bytes(fresh)
          Path('/tmp/fresh/seal-index.json').write_bytes(index_raw)
          verification = {
              'schema_version': 'issue600_premium_pressure_prereg_fresh_v3',
              'issue_number': 600,
              'target_sha': os.environ['TARGET_SHA'],
              'protocol_digest': expected,
              'protocol_byte_equal': True,
              'source_test_blob_equal': True,
              'fresh_reconstruction_passed': True,
              'raw_endpoint_cutoff_contract': True,
              'economic_values_inspected': False,
              'training_relation_executed': False,
              'evaluation_pnl_inspected': False,
              'production_eligible': False,
              'live_trading_authorized': False,
          }
          Path('/tmp/fresh/verification.json').write_bytes(canonical_json_bytes(verification))
          print('ISSUE600_PREREG_FRESH_V3=PASS')
          PY
      - id: meta
        run: echo "name=issue600-premium-prereg-fresh-v3-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Upload fresh reconstruction evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.meta.outputs.name }}
          path: /tmp/fresh/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  audit:
    name: Final premium prereg seal audit v3
    needs: [seal, fresh]
    runs-on: ubuntu-24.04
    steps:
      - name: API-bind seal and fresh artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SEAL_ID: ${{ needs.seal.outputs.artifact_id }}
          SEAL_NAME: ${{ needs.seal.outputs.artifact_name }}
          SEAL_DIGEST: ${{ needs.seal.outputs.artifact_digest }}
          FRESH_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_NAME: ${{ needs.fresh.outputs.artifact_name }}
          FRESH_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in "$SEAL_ID|$SEAL_NAME|$SEAL_DIGEST" "$FRESH_ID|$FRESH_NAME|$FRESH_DIGEST"; do
            IFS='|' read -r id name digest <<<"$spec"
            artifact="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id)"
            test "$(jq -r .name <<<"$artifact")" = "$name"
            test "$(jq -r .workflow_run.id <<<"$artifact")" = "$GITHUB_RUN_ID"
            test "$(jq -r .expired <<<"$artifact")" = false
            api_digest="$(jq -r .digest <<<"$artifact")"
            case "$digest" in sha256:*) test "$api_digest" = "$digest" ;; *) test "$api_digest" = "sha256:$digest" ;; esac
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.seal.outputs.artifact_name }}
          path: /tmp/seal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.fresh.outputs.artifact_name }}
          path: /tmp/fresh
      - name: Require byte identity and result-blind boundaries
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/seal/protocol.json /tmp/fresh/protocol.json
          cmp /tmp/seal/seal-index.json /tmp/fresh/seal-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('/tmp/seal/seal-index.json').read_bytes())
          verification = json.loads(Path('/tmp/fresh/verification.json').read_bytes())
          if index.get('target_sha') != '6ffc414baa10e91f34df258fe5cfabacce65fd77':
              raise SystemExit('wrong sealed head')
          if index.get('protocol_digest') != '18bf9625502eccbe475d157df90635f1c4645d3c4cced48ec0fc565723206731':
              raise SystemExit('wrong sealed digest')
          if index.get('raw_endpoint_cutoff_contract') is not True:
              raise SystemExit('raw-endpoint contract not sealed')
          if verification.get('protocol_byte_equal') is not True or verification.get('fresh_reconstruction_passed') is not True:
              raise SystemExit('fresh proof differs')
          for payload in (index, verification):
              for key in ('economic_values_inspected','training_relation_executed','evaluation_pnl_inspected','production_eligible','live_trading_authorized'):
                  if payload.get(key) is not False:
                      raise SystemExit(f'forbidden boundary crossed: {key}')
          print('ISSUE600_PREREG_SEAL_V3_AUDIT=PASS')
          print('PROTOCOL_DIGEST=18bf9625502eccbe475d157df90635f1c4645d3c4cced48ec0fc565723206731')
          print('ECONOMIC_VALUES_INSPECTED=false')
          PY
