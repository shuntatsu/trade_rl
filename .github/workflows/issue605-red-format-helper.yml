name: Issue 605 RED format helper

on:
  push:
    branches:
      - automation/issue605-red-format-helper

permissions:
  contents: read

jobs:
  format_diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Format RED oracle and print exact diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/strategies/test_ppo_global_btc_regime.py
          git diff -- tests/strategies/test_ppo_global_btc_regime.py
