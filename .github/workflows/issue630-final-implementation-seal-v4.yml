name: Issue 630 final implementation seal v4

on:
  push:
    branches:
      - seal/issue630-shared-cash-evaluator-v2
    paths:
      - .github/workflows/issue630-final-implementation-seal-v4.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  TARGET_SHA: d1bf25fd66834289ffddb36063b0d5cef649f444

jobs:
  primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce first activation
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Checkout seal harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: seal/issue630-shared-cash-evaluator-v2
          path: helper
          persist-credentials: false
      - name: Checkout exact final evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: impl
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - working-directory: impl
        run: uv sync --extra dev
      - id: build
        name: Build primary final authority
        working-directory: impl
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          uv run python ../helper/.github/scripts/issue630_final_implementation_seal.py build \
            --output-dir "$RUNNER_TEMP/issue630-final-primary"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../helper status --porcelain)"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue630-final-implementation-primary-${{ github.run_id }}
          path: ${{ runner.temp }}/issue630-final-primary/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  fresh:
    needs: primary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout seal harness independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: seal/issue630-shared-cash-evaluator-v2
          path: helper
          persist-credentials: false
      - name: Checkout exact final evaluator independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: impl
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - working-directory: impl
        run: uv sync --extra dev
      - id: build
        name: Fresh reconstruction
        working-directory: impl
        env:
          PRIMARY_IMPLEMENTATION_SHA256: ${{ needs.primary.outputs.implementation_sha256 }}
          PRIMARY_SEAL_SHA256: ${{ needs.primary.outputs.seal_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          uv run python ../helper/.github/scripts/issue630_final_implementation_seal.py build \
            --output-dir "$RUNNER_TEMP/issue630-final-fresh"
          test "$(sha256sum "$RUNNER_TEMP/issue630-final-fresh/implementation.json" | awk '{print $1}')" = "$PRIMARY_IMPLEMENTATION_SHA256"
          test "$(sha256sum "$RUNNER_TEMP/issue630-final-fresh/seal.json" | awk '{print $1}')" = "$PRIMARY_SEAL_SHA256"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../helper status --porcelain)"
          echo PRIMARY_FRESH_BYTE_EQUAL=true
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue630-final-implementation-fresh-${{ github.run_id }}
          path: ${{ runner.temp }}/issue630-final-fresh/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  audit:
    needs: [primary, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: seal/issue630-shared-cash-evaluator-v2
          path: helper
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-implementation-primary-${{ github.run_id }}
          path: primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-implementation-fresh-${{ github.run_id }}
          path: fresh
      - name: Final authority audit
        env:
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_SHA256: ${{ needs.primary.outputs.implementation_sha256 }}
          SEAL_SHA256: ${{ needs.primary.outputs.seal_sha256 }}
          PRIMARY_ARTIFACT_ID: ${{ needs.primary.outputs.artifact_id }}
          PRIMARY_UPLOAD_DIGEST: ${{ needs.primary.outputs.artifact_digest }}
          FRESH_ARTIFACT_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_UPLOAD_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          python helper/.github/scripts/issue630_final_implementation_seal.py audit \
            --primary primary \
            --fresh fresh \
            --closure closure.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue630-final-implementation-closure-${{ github.run_id }}
          path: closure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
