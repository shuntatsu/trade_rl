name: Issue 630 shared-cash evaluator implementation seal

on:
  push:
    branches:
      - seal/issue630-shared-cash-evaluator-v1
    paths:
      - .github/workflows/issue630-shared-cash-evaluator-seal.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  TARGET_SHA: e0470b4e04fc16c14391e4cc327e27e1d612edc7
  BASE_SHA: d18434799651cfc6c07e0840c40600dcf1dfa763
  VERIFICATION_RUN_ID: '35212581096'
  PR_NUMBER: '633'
  PROTOCOL_HEAD: 65eb3c90e0a5fe1cea952279c28024160838da08
  PROTOCOL_DIGEST: c4942c190e507b2d437bd00646fd7ed09e2be5cff9b30fba6d1774b6f2af9c88
  PROTOCOL_SEAL_RUN_ID: '35211715033'
  PROTOCOL_PRIMARY_ARTIFACT_ID: '10491893357'
  PROTOCOL_PRIMARY_API_DIGEST: sha256:0e3e1dc742c00d3a1625aa9ee8681aba86a676946083afd08eda783642dd6841
  PROTOCOL_FRESH_ARTIFACT_ID: '10492645772'
  PROTOCOL_FRESH_API_DIGEST: sha256:ca5fc01ed41cad6fa2f2dc2cf9ef11e4fe7cd3b5b6f7d8bc86bea1eb86842f56
  PROTOCOL_SEAL_SHA256: b76ae3ac83109c2b6349330b0b9b0e70522320ae9bcdf1dd2a794f93668bd903

jobs:
  primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - id: build
        name: Build canonical primary implementation seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          from trade_rl.evaluation.experiments.bootstrap.ridge_shared_cash_evaluation import (
              canonical_ridge_shared_cash_evaluation_spec,
          )

          def api(path: str) -> object:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          target = os.environ["TARGET_SHA"]
          base = os.environ["BASE_SHA"]
          verification = api(f"actions/runs/{os.environ['VERIFICATION_RUN_ID']}")
          if not isinstance(verification, dict) or verification.get("conclusion") != "success":
              raise SystemExit("exact-head verification run is not successful")
          protocol_run = api(f"actions/runs/{os.environ['PROTOCOL_SEAL_RUN_ID']}")
          if not isinstance(protocol_run, dict) or protocol_run.get("conclusion") != "success":
              raise SystemExit("protocol v3 seal run is not successful")
          pr = api(f"pulls/{os.environ['PR_NUMBER']}")
          if not isinstance(pr, dict):
              raise SystemExit("PR authority response is invalid")
          if pr.get("state") != "open" or pr.get("draft") is not True:
              raise SystemExit("PR 633 must remain open Draft")
          if (pr.get("head") or {}).get("sha") != target or (pr.get("base") or {}).get("sha") != base:
              raise SystemExit("PR 633 head/base authority drift")

          for prefix in ("PROTOCOL_PRIMARY", "PROTOCOL_FRESH"):
              artifact_id = int(os.environ[f"{prefix}_ARTIFACT_ID"])
              metadata = api(f"actions/artifacts/{artifact_id}")
              if not isinstance(metadata, dict):
                  raise SystemExit(f"{prefix} metadata invalid")
              if metadata.get("id") != artifact_id:
                  raise SystemExit(f"{prefix} artifact id drift")
              if metadata.get("digest") != os.environ[f"{prefix}_API_DIGEST"]:
                  raise SystemExit(f"{prefix} artifact digest drift")
              if (metadata.get("workflow_run") or {}).get("id") != int(os.environ["PROTOCOL_SEAL_RUN_ID"]):
                  raise SystemExit(f"{prefix} workflow run drift")
              if metadata.get("expired") is not False:
                  raise SystemExit(f"{prefix} artifact expired")

          spec = canonical_ridge_shared_cash_evaluation_spec()
          checks = {
              "protocol_head": os.environ["PROTOCOL_HEAD"],
              "protocol_digest": os.environ["PROTOCOL_DIGEST"],
              "protocol_seal_run_id": int(os.environ["PROTOCOL_SEAL_RUN_ID"]),
              "protocol_primary_artifact_id": int(os.environ["PROTOCOL_PRIMARY_ARTIFACT_ID"]),
              "protocol_fresh_artifact_id": int(os.environ["PROTOCOL_FRESH_ARTIFACT_ID"]),
              "protocol_seal_sha256": os.environ["PROTOCOL_SEAL_SHA256"],
              "execution_max_leverage": 1.0,
          }
          for name, expected in checks.items():
              if getattr(spec, name) != expected:
                  raise SystemExit(f"sealed evaluator authority drift: {name}")
          for name in (
              "unused_data_accessed",
              "final_test_accessed",
              "final_test_authorized",
              "operational_eligibility_established",
              "production_eligible",
              "live_trading_authorized",
              "merge_authorized",
          ):
              if getattr(spec, name) is not False:
                  raise SystemExit(f"research boundary drift: {name}")

          expected_files = [
              "tests/architecture/test_runs_capability_facade.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_evaluation.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_evaluation_falsification.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg_execution_leverage.py",
              "trade_rl/evaluation/experiments/bootstrap/ridge_shared_cash_evaluation.py",
              "trade_rl/evaluation/experiments/bootstrap/ridge_shared_cash_prereg.py",
              "trade_rl/evaluation/runs/__init__.py",
              "trade_rl/evaluation/runs/execute.py",
              "trade_rl/strategies/forecasts/ridge_economic_gate.py",
          ]
          actual = subprocess.check_output(
              ["git", "diff", "--name-only", base, target], text=True
          ).splitlines()
          if actual != expected_files:
              raise SystemExit(f"durable diff drift: {actual!r}")
          blobs = {
              path: subprocess.check_output(
                  ["git", "rev-parse", f"{target}:{path}"], text=True
              ).strip()
              for path in expected_files
          }
          tree_sha = subprocess.check_output(
              ["git", "rev-parse", f"{target}^{{tree}}"], text=True
          ).strip()
          payload = {
              "schema_version": "issue630_shared_cash_evaluator_implementation_v1",
              "issue_number": 630,
              "pull_request": 633,
              "implementation_head": target,
              "implementation_tree_sha": tree_sha,
              "carrier_base_head": base,
              "exact_verification_run_id": int(os.environ["VERIFICATION_RUN_ID"]),
              "protocol_v3": {
                  "head": os.environ["PROTOCOL_HEAD"],
                  "digest": os.environ["PROTOCOL_DIGEST"],
                  "seal_run_id": int(os.environ["PROTOCOL_SEAL_RUN_ID"]),
                  "primary_artifact_id": int(os.environ["PROTOCOL_PRIMARY_ARTIFACT_ID"]),
                  "primary_api_digest": os.environ["PROTOCOL_PRIMARY_API_DIGEST"],
                  "fresh_artifact_id": int(os.environ["PROTOCOL_FRESH_ARTIFACT_ID"]),
                  "fresh_api_digest": os.environ["PROTOCOL_FRESH_API_DIGEST"],
                  "seal_sha256": os.environ["PROTOCOL_SEAL_SHA256"],
                  "execution_max_leverage": 1.0,
              },
              "durable_files": expected_files,
              "blob_shas": blobs,
              "result_blind": True,
              "shared_cash_economic_execution_performed": False,
              "shared_cash_economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
              "merge_authorized": False,
          }
          output = Path("../primary")
          output.mkdir(exist_ok=True)
          implementation = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
          (output / "implementation.json").write_bytes(implementation)
          implementation_sha = hashlib.sha256(implementation).hexdigest()
          seal_payload = {
              "schema_version": "issue630_shared_cash_evaluator_seal_v1",
              "implementation_head": target,
              "implementation_sha256": implementation_sha,
              "exact_verification_run_id": int(os.environ["VERIFICATION_RUN_ID"]),
              "result_blind": True,
              "shared_cash_economic_execution_performed": False,
              "shared_cash_economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
              "merge_authorized": False,
          }
          seal = (json.dumps(seal_payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
          (output / "seal.json").write_bytes(seal)
          seal_sha = hashlib.sha256(seal).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"implementation_sha256={implementation_sha}\n")
              handle.write(f"seal_sha256={seal_sha}\n")
          print(f"IMPLEMENTATION_SHA256={implementation_sha}")
          print(f"SEAL_SHA256={seal_sha}")
          print("SHARED_CASH_ECONOMIC_EXECUTION_PERFORMED=false")
          print("SHARED_CASH_ECONOMIC_RESULT_INSPECTED=false")
          PY
          test -z "$(git status --porcelain)"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue630-shared-cash-evaluator-primary-${{ github.run_id }}
          path: ../primary/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  fresh:
    needs: primary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - id: build
        name: Independently reconstruct identical implementation seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          from trade_rl.evaluation.experiments.bootstrap.ridge_shared_cash_evaluation import (
              canonical_ridge_shared_cash_evaluation_spec,
          )

          def api(path: str) -> object:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          target = os.environ["TARGET_SHA"]
          base = os.environ["BASE_SHA"]
          verification = api(f"actions/runs/{os.environ['VERIFICATION_RUN_ID']}")
          if not isinstance(verification, dict) or verification.get("conclusion") != "success":
              raise SystemExit("exact-head verification run is not successful")
          protocol_run = api(f"actions/runs/{os.environ['PROTOCOL_SEAL_RUN_ID']}")
          if not isinstance(protocol_run, dict) or protocol_run.get("conclusion") != "success":
              raise SystemExit("protocol v3 seal run is not successful")
          pr = api(f"pulls/{os.environ['PR_NUMBER']}")
          if not isinstance(pr, dict) or pr.get("state") != "open" or pr.get("draft") is not True:
              raise SystemExit("PR 633 Draft authority drift")
          if (pr.get("head") or {}).get("sha") != target or (pr.get("base") or {}).get("sha") != base:
              raise SystemExit("PR 633 head/base authority drift")
          for prefix in ("PROTOCOL_PRIMARY", "PROTOCOL_FRESH"):
              artifact_id = int(os.environ[f"{prefix}_ARTIFACT_ID"])
              metadata = api(f"actions/artifacts/{artifact_id}")
              if not isinstance(metadata, dict):
                  raise SystemExit(f"{prefix} metadata invalid")
              if metadata.get("id") != artifact_id or metadata.get("digest") != os.environ[f"{prefix}_API_DIGEST"]:
                  raise SystemExit(f"{prefix} artifact authority drift")
              if (metadata.get("workflow_run") or {}).get("id") != int(os.environ["PROTOCOL_SEAL_RUN_ID"]):
                  raise SystemExit(f"{prefix} workflow run drift")
              if metadata.get("expired") is not False:
                  raise SystemExit(f"{prefix} artifact expired")

          spec = canonical_ridge_shared_cash_evaluation_spec()
          checks = {
              "protocol_head": os.environ["PROTOCOL_HEAD"],
              "protocol_digest": os.environ["PROTOCOL_DIGEST"],
              "protocol_seal_run_id": int(os.environ["PROTOCOL_SEAL_RUN_ID"]),
              "protocol_primary_artifact_id": int(os.environ["PROTOCOL_PRIMARY_ARTIFACT_ID"]),
              "protocol_fresh_artifact_id": int(os.environ["PROTOCOL_FRESH_ARTIFACT_ID"]),
              "protocol_seal_sha256": os.environ["PROTOCOL_SEAL_SHA256"],
              "execution_max_leverage": 1.0,
          }
          for name, expected in checks.items():
              if getattr(spec, name) != expected:
                  raise SystemExit(f"sealed evaluator authority drift: {name}")
          for name in (
              "unused_data_accessed",
              "final_test_accessed",
              "final_test_authorized",
              "operational_eligibility_established",
              "production_eligible",
              "live_trading_authorized",
              "merge_authorized",
          ):
              if getattr(spec, name) is not False:
                  raise SystemExit(f"research boundary drift: {name}")

          expected_files = [
              "tests/architecture/test_runs_capability_facade.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_evaluation.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_evaluation_falsification.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg.py",
              "tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg_execution_leverage.py",
              "trade_rl/evaluation/experiments/bootstrap/ridge_shared_cash_evaluation.py",
              "trade_rl/evaluation/experiments/bootstrap/ridge_shared_cash_prereg.py",
              "trade_rl/evaluation/runs/__init__.py",
              "trade_rl/evaluation/runs/execute.py",
              "trade_rl/strategies/forecasts/ridge_economic_gate.py",
          ]
          actual = subprocess.check_output(["git", "diff", "--name-only", base, target], text=True).splitlines()
          if actual != expected_files:
              raise SystemExit(f"durable diff drift: {actual!r}")
          blobs = {
              path: subprocess.check_output(["git", "rev-parse", f"{target}:{path}"], text=True).strip()
              for path in expected_files
          }
          tree_sha = subprocess.check_output(["git", "rev-parse", f"{target}^{{tree}}"], text=True).strip()
          payload = {
              "schema_version": "issue630_shared_cash_evaluator_implementation_v1",
              "issue_number": 630,
              "pull_request": 633,
              "implementation_head": target,
              "implementation_tree_sha": tree_sha,
              "carrier_base_head": base,
              "exact_verification_run_id": int(os.environ["VERIFICATION_RUN_ID"]),
              "protocol_v3": {
                  "head": os.environ["PROTOCOL_HEAD"],
                  "digest": os.environ["PROTOCOL_DIGEST"],
                  "seal_run_id": int(os.environ["PROTOCOL_SEAL_RUN_ID"]),
                  "primary_artifact_id": int(os.environ["PROTOCOL_PRIMARY_ARTIFACT_ID"]),
                  "primary_api_digest": os.environ["PROTOCOL_PRIMARY_API_DIGEST"],
                  "fresh_artifact_id": int(os.environ["PROTOCOL_FRESH_ARTIFACT_ID"]),
                  "fresh_api_digest": os.environ["PROTOCOL_FRESH_API_DIGEST"],
                  "seal_sha256": os.environ["PROTOCOL_SEAL_SHA256"],
                  "execution_max_leverage": 1.0,
              },
              "durable_files": expected_files,
              "blob_shas": blobs,
              "result_blind": True,
              "shared_cash_economic_execution_performed": False,
              "shared_cash_economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
              "merge_authorized": False,
          }
          output = Path("../fresh")
          output.mkdir(exist_ok=True)
          implementation = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
          (output / "implementation.json").write_bytes(implementation)
          implementation_sha = hashlib.sha256(implementation).hexdigest()
          seal_payload = {
              "schema_version": "issue630_shared_cash_evaluator_seal_v1",
              "implementation_head": target,
              "implementation_sha256": implementation_sha,
              "exact_verification_run_id": int(os.environ["VERIFICATION_RUN_ID"]),
              "result_blind": True,
              "shared_cash_economic_execution_performed": False,
              "shared_cash_economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
              "merge_authorized": False,
          }
          seal = (json.dumps(seal_payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
          (output / "seal.json").write_bytes(seal)
          seal_sha = hashlib.sha256(seal).hexdigest()
          if implementation_sha != os.environ["PRIMARY_IMPLEMENTATION_SHA256"]:
              raise SystemExit("fresh implementation manifest differs from primary")
          if seal_sha != os.environ["PRIMARY_SEAL_SHA256"]:
              raise SystemExit("fresh seal differs from primary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"implementation_sha256={implementation_sha}\n")
              handle.write(f"seal_sha256={seal_sha}\n")
          print("PRIMARY_FRESH_RECONSTRUCTION_EQUAL=true")
          PY
          test -z "$(git status --porcelain)"
        env:
          PRIMARY_IMPLEMENTATION_SHA256: ${{ needs.primary.outputs.implementation_sha256 }}
          PRIMARY_SEAL_SHA256: ${{ needs.primary.outputs.seal_sha256 }}
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue630-shared-cash-evaluator-fresh-${{ github.run_id }}
          path: ../fresh/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  audit:
    needs: [primary, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-shared-cash-evaluator-primary-${{ github.run_id }}
          path: primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-shared-cash-evaluator-fresh-${{ github.run_id }}
          path: fresh
      - name: Verify API digests, byte equality and research boundary
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_ARTIFACT_ID: ${{ needs.primary.outputs.artifact_id }}
          PRIMARY_UPLOAD_DIGEST: ${{ needs.primary.outputs.artifact_digest }}
          FRESH_ARTIFACT_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_UPLOAD_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
          IMPLEMENTATION_SHA256: ${{ needs.primary.outputs.implementation_sha256 }}
          SEAL_SHA256: ${{ needs.primary.outputs.seal_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cmp primary/implementation.json fresh/implementation.json
          cmp primary/seal.json fresh/seal.json
          test "$(sha256sum primary/implementation.json | awk '{print $1}')" = "$IMPLEMENTATION_SHA256"
          test "$(sha256sum primary/seal.json | awk '{print $1}')" = "$SEAL_SHA256"
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def normalized(value: str) -> str:
              return value if value.startswith("sha256:") else f"sha256:{value}"

          def api(artifact_id: int) -> dict[str, object]:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              if not isinstance(data, dict):
                  raise SystemExit("artifact metadata is invalid")
              return data

          primary_id = int(os.environ["PRIMARY_ARTIFACT_ID"])
          fresh_id = int(os.environ["FRESH_ARTIFACT_ID"])
          for name, artifact_id, upload_digest in (
              ("primary", primary_id, os.environ["PRIMARY_UPLOAD_DIGEST"]),
              ("fresh", fresh_id, os.environ["FRESH_UPLOAD_DIGEST"]),
          ):
              metadata = api(artifact_id)
              if metadata.get("id") != artifact_id:
                  raise SystemExit(f"{name} artifact id drift")
              if metadata.get("digest") != normalized(upload_digest):
                  raise SystemExit(f"{name} artifact API digest mismatch")
              if metadata.get("expired") is not False:
                  raise SystemExit(f"{name} artifact expired")
              if (metadata.get("workflow_run") or {}).get("id") != int(os.environ["GITHUB_RUN_ID"]):
                  raise SystemExit(f"{name} artifact workflow-run drift")

          implementation = json.loads(Path("primary/implementation.json").read_text())
          seal = json.loads(Path("primary/seal.json").read_text())
          if implementation["implementation_head"] != os.environ["TARGET_SHA"]:
              raise SystemExit("sealed implementation head drift")
          if seal["implementation_sha256"] != os.environ["IMPLEMENTATION_SHA256"]:
              raise SystemExit("seal implementation digest drift")
          false_fields = (
              "shared_cash_economic_execution_performed",
              "shared_cash_economic_result_inspected",
              "unused_data_accessed",
              "final_test_accessed",
              "production_eligible",
              "live_trading_authorized",
              "merge_authorized",
          )
          for field in false_fields:
              if implementation.get(field) is not False or seal.get(field) is not False:
                  raise SystemExit(f"research boundary drift: {field}")

          closure = {
              "schema_version": "issue630_shared_cash_evaluator_seal_closure_v1",
