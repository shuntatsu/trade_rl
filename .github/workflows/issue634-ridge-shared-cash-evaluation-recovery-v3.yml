name: Issue 634 sealed ridge shared-cash evaluation recovery v3

on:
  push:
    branches:
      - run/issue634-ridge-shared-cash-evaluation-v1
    paths:
      - .github/authorizations/issue634-ridge-shared-cash-evaluation-recovery-v3.authorized

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: issue634-ridge-shared-cash-evaluation-recovery-v3
  cancel-in-progress: false

env:
  RUNNER_HELPER_SHA: 65b8598e48b49ad3d9932195fdd7c5a8fa97e67f
  EVALUATOR_SHA: d1bf25fd66834289ffddb36063b0d5cef649f444
  PRIOR_RUN_V1: '35215537166'
  PRIOR_RUN_V2: '35215820350'

jobs:
  recovery-authority:
    name: Prove prior preflight failures consumed no economic slot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce first recovery-v3 activation
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout verified result-blind runner helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_HELPER_SHA }}
          path: helper
          persist-credentials: false

      - name: Checkout exact sealed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVALUATOR_SHA }}
          path: impl
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'

      - name: Install exact evaluator runtime
        working-directory: impl
        run: uv sync --extra dev

      - name: Bind runner verification and prove v1/v2 stopped before Dataset load/economic replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']

          def get(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          verification = get('actions/runs/35216549219')
          if verification.get('conclusion') != 'success':
              raise SystemExit('verified Issue 634 runner authority is not Green')
          if verification.get('head_sha') != os.environ['RUNNER_HELPER_SHA']:
              raise SystemExit('Issue 634 runner verification HEAD drift')

          for run_id in (int(os.environ['PRIOR_RUN_V1']), int(os.environ['PRIOR_RUN_V2'])):
              run = get(f'actions/runs/{run_id}')
              if run.get('conclusion') != 'failure' or run.get('run_attempt') != 1:
                  raise SystemExit(f'prior preflight run authority drift: {run_id}')
              artifacts = get(f'actions/runs/{run_id}/artifacts?per_page=100')
              if artifacts.get('total_count') != 0 or artifacts.get('artifacts') != []:
                  raise SystemExit(f'prior preflight run unexpectedly published evidence: {run_id}')
              jobs = get(f'actions/runs/{run_id}/jobs?per_page=100').get('jobs')
              if not isinstance(jobs, list) or len(jobs) != 4:
                  raise SystemExit(f'prior preflight job roster drift: {run_id}')
              preflight = [job for job in jobs if isinstance(job, dict) and str(job.get('name', '')).startswith('Result-blind authority preflight')]
              if len(preflight) != 1 or preflight[0].get('conclusion') != 'failure':
                  raise SystemExit(f'prior preflight failure evidence drift: {run_id}')
              steps = preflight[0].get('steps')
              if not isinstance(steps, list):
                  raise SystemExit(f'prior preflight step evidence unavailable: {run_id}')
              download_failures = [
                  step for step in steps
                  if isinstance(step, dict)
                  and str(step.get('name', '')).startswith('Run actions/download-artifact@')
                  and step.get('conclusion') == 'failure'
              ]
              if len(download_failures) != 1:
                  raise SystemExit(f'prior run did not fail exactly once at first Artifact download: {run_id}')
              validation = [
                  step for step in steps
                  if isinstance(step, dict)
                  and step.get('name') == 'Validate result-blind authorities and load Dataset without evaluation'
              ]
              if len(validation) != 1 or validation[0].get('conclusion') != 'skipped':
                  raise SystemExit(f'prior run reached Dataset validation unexpectedly: {run_id}')
              downstream = {
                  job.get('name'): job.get('conclusion')
                  for job in jobs
                  if isinstance(job, dict)
              }
              for name in (
                  'Exactly-once shared-cash publisher',
                  'Fresh independent shared-cash reconstruction',
                  'Final independent audit and reveal',
              ):
                  if downstream.get(name) != 'skipped':
                      raise SystemExit(f'prior economic job was not skipped: {run_id} {name}')

          print('ISSUE634_PRIOR_FAILURES_PRE_ECONOMIC=true')
          print('ISSUE634_PRIOR_ARTIFACT_COUNT=0')
          print('SHARED_CASH_ECONOMIC_EXECUTION_PERFORMED=false')
          PY

      - name: Verify current immutable authority and unconsumed result slot
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py authority-check --result-slot empty
          echo ISSUE634_RECOVERY_V3_PREFLIGHT=PASS
          echo SHARED_CASH_ECONOMIC_EXECUTION_PERFORMED=false

  publisher:
    name: Exactly-once shared-cash publisher recovery v3
    needs: recovery-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce first recovery-v3 publisher attempt
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout verified runner helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_HELPER_SHA }}
          path: helper
          persist-credentials: false

      - name: Checkout exact sealed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVALUATOR_SHA }}
          path: impl
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'

      - name: Install exact sealed runtime
        working-directory: impl
        run: uv sync --extra dev

      - name: Recheck authorities immediately before immutable input download
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py authority-check --result-slot empty

      - name: Download exact successor Dataset authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue539-calibrated-causal-successor-v3-34803217815
          path: ${{ runner.temp }}/successor
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '34803217815'

      - name: Download PRE-PnL cost authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue618-ridge-cost-authority-35200841490
          path: ${{ runner.temp }}/cost-authority
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35200841490'

      - name: Download Issue 630 primary implementation authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-authority-primary-v2
          path: ${{ runner.temp }}/evaluator-primary
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35214002467'

      - name: Download Issue 630 fresh implementation authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-authority-fresh-v2
          path: ${{ runner.temp }}/evaluator-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35214002467'

      - name: Download Issue 626 immutable trigger result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue626-ridge-economic-result-35201639813
          path: ${{ runner.temp }}/trigger-result
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35201639813'

      - name: Download Issue 626 fresh verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue626-ridge-economic-fresh-verification-35201639813
          path: ${{ runner.temp }}/trigger-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35201639813'

      - name: Execute sealed shared-cash comparison exactly once without interpretation
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py evaluate \
            --successor "$RUNNER_TEMP/successor" \
            --cost "$RUNNER_TEMP/cost-authority" \
            --evaluator-primary "$RUNNER_TEMP/evaluator-primary" \
            --evaluator-fresh "$RUNNER_TEMP/evaluator-fresh" \
            --trigger-result "$RUNNER_TEMP/trigger-result" \
            --trigger-fresh "$RUNNER_TEMP/trigger-fresh" \
            --output "$RUNNER_TEMP/issue634-publisher"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../helper status --porcelain)"

      - id: upload
        name: Publish immutable result before any interpretation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue634-ridge-shared-cash-result-v1
          path: ${{ runner.temp }}/issue634-publisher/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  fresh:
    name: Fresh independent shared-cash reconstruction recovery v3
    needs: publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Enforce first recovery-v3 fresh attempt
        run: |
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout verified runner helper independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_HELPER_SHA }}
          path: helper
          persist-credentials: false

      - name: Checkout exact sealed evaluator independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVALUATOR_SHA }}
          path: impl
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'

      - name: Install fresh sealed runtime
        working-directory: impl
        run: uv sync --extra dev

      - name: Require exactly one published result slot
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py authority-check --result-slot published

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue634-ridge-shared-cash-result-v1
          path: ${{ runner.temp }}/published
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue539-calibrated-causal-successor-v3-34803217815
          path: ${{ runner.temp }}/successor
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '34803217815'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue618-ridge-cost-authority-35200841490
          path: ${{ runner.temp }}/cost-authority
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35200841490'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-authority-primary-v2
          path: ${{ runner.temp }}/evaluator-primary
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35214002467'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue630-final-authority-fresh-v2
          path: ${{ runner.temp }}/evaluator-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35214002467'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue626-ridge-economic-result-35201639813
          path: ${{ runner.temp }}/trigger-result
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35201639813'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue626-ridge-economic-fresh-verification-35201639813
          path: ${{ runner.temp }}/trigger-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: '35201639813'

      - name: Reconstruct independently and require byte-identical result
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py reconstruct \
            --successor "$RUNNER_TEMP/successor" \
            --cost "$RUNNER_TEMP/cost-authority" \
            --evaluator-primary "$RUNNER_TEMP/evaluator-primary" \
            --evaluator-fresh "$RUNNER_TEMP/evaluator-fresh" \
            --trigger-result "$RUNNER_TEMP/trigger-result" \
            --trigger-fresh "$RUNNER_TEMP/trigger-fresh" \
            --published "$RUNNER_TEMP/published" \
            --output "$RUNNER_TEMP/issue634-fresh"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../helper status --porcelain)"

      - id: upload
        name: Publish fresh verification before reveal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue634-ridge-shared-cash-fresh-v1
          path: ${{ runner.temp }}/issue634-fresh/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  audit:
    name: Independent final audit and frozen decision reveal recovery v3
    needs: [publisher, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verified runner helper for audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RUNNER_HELPER_SHA }}
          path: helper
          persist-credentials: false

      - name: Checkout exact sealed evaluator for strict decoding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVALUATOR_SHA }}
          path: impl
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'

      - name: Install strict audit runtime
        working-directory: impl
        run: uv sync --extra dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue634-ridge-shared-cash-result-v1
          path: ${{ runner.temp }}/published
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue634-ridge-shared-cash-fresh-v1
          path: ${{ runner.temp }}/fresh

      - name: Re-audit raw evidence and reveal only frozen decision
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_ARTIFACT_ID: ${{ needs.publisher.outputs.artifact_id }}
          PUBLISHER_ARTIFACT_DIGEST: ${{ needs.publisher.outputs.artifact_digest }}
          FRESH_ARTIFACT_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_ARTIFACT_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py audit \
            --published "$RUNNER_TEMP/published" \
            --fresh "$RUNNER_TEMP/fresh" \
            --output "$RUNNER_TEMP/issue634-audit/audit.json"
          test -z "$(git status --porcelain)"
          test -z "$(git -C ../helper status --porcelain)"

      - name: Publish final audit record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue634-ridge-shared-cash-audit-v1
          path: ${{ runner.temp }}/issue634-audit/audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
