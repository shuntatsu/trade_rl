name: Issue 645 directional study v1

on:
  push:
    branches:
      - run/issue645-corrected-directional-study-v1
    paths:
      - .github/authorizations/issue645-corrected-directional-study-v1.authorized

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue645-corrected-directional-study-v1
  cancel-in-progress: false

env:
  TARGET_SHA: 928ee0886c404cdbb1383f440f731d7221c277ef
  HARDENING_VERIFY_RUN: '35286382568'
  IMPLEMENTATION_SEAL_RUN: '35286608859'
  IMPLEMENTATION_PRIMARY_ID: '10525290101'
  IMPLEMENTATION_PRIMARY_NAME: issue645-corrected-accounting-primary-v1
  IMPLEMENTATION_PRIMARY_DIGEST: sha256:69699dcb68c06fc8ba86c69cdb77cc43813adc02ff9f88f65425fbdf44bfcc82
  IMPLEMENTATION_FRESH_ID: '10525050310'
  IMPLEMENTATION_FRESH_NAME: issue645-corrected-accounting-fresh-v1
  IMPLEMENTATION_FRESH_DIGEST: sha256:792cb7c100ab3166fbdacd5177680a1add5ac30ccefe6b6906c57ae14a30bd31
  IMPLEMENTATION_AUDIT_ID: '10524726805'
  IMPLEMENTATION_AUDIT_NAME: issue645-corrected-accounting-audit-v1
  IMPLEMENTATION_AUDIT_DIGEST: sha256:9611dc12a556fe05961071692239d59ca930081ab3e2047924255361a1c51e88
  PRODUCER_RUN: '34803217815'
  PRODUCER_ARTIFACT_ID: '10331899302'
  PRODUCER_ARTIFACT_NAME: issue539-calibrated-causal-successor-v3-34803217815
  PRODUCER_ARTIFACT_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  RECOVERY_RUN: '34803432434'
  RECOVERY_ARTIFACT_ID: '10332575500'
  RECOVERY_ARTIFACT_NAME: issue539-calibrated-causal-fresh-verify-v3-34803432434
  RECOVERY_ARTIFACT_DIGEST: sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589
  ACTIVATION_NAME: issue645-corrected-directional-activation-v1
  PROTOCOL_NAME: issue645-corrected-directional-protocol-v1
  SUMMARY_NAME: issue645-corrected-directional-run-summary-v1

jobs:
  execute:
    name: Result-blind official 13-arm execution
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Enforce first exact official activation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "run/issue645-corrected-directional-study-v1"

      - name: Checkout exact official workflow lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact hardened economic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 928ee0886c404cdbb1383f440f731d7221c277ef
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: true

      - name: Install complete frozen trainer runtime before real data
        working-directory: target
        run: |
          set -euo pipefail
          uv sync --extra dev --extra forecast-gbm --extra train-sb3
          uv run python - <<'PY'
          import lightgbm
          import stable_baselines3
          import torch
          from trade_rl.evaluation.directional_study import validate_required_runtime
          runtime = validate_required_runtime()
          assert runtime['lightgbm'] == '4.7.0'
          assert runtime['stable-baselines3'] == '2.3.2'
          assert runtime['torch'] == '2.4.1'
          assert runtime['scikit-learn']
          print('ISSUE645_RUNTIME_PREFLIGHT=PASS')
          print('REAL_DATASET_LOADED=false')
          print('MODEL_FIT_PERFORMED=false')
          print('ECONOMIC_REPLAY_PERFORMED=false')
          PY

      - name: Rebind exact hardening authority and prove global slot empty
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C harness merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"
          git -C harness diff --name-only "$TARGET_SHA" "$GITHUB_SHA" | sort > "$RUNNER_TEMP/actual-harness-files"
          cat > "$RUNNER_TEMP/expected-harness-files" <<'EOF'
          .github/authorizations/issue645-corrected-directional-study-v1.authorized
          .github/scripts/issue645_directional_activation.py
          .github/scripts/issue645_official_audit.py
          .github/scripts/issue645_official_run_arm.sh
          .github/workflows/issue645-corrected-directional-study-v1.yml
          EOF
          sort -o "$RUNNER_TEMP/expected-harness-files" "$RUNNER_TEMP/expected-harness-files"
          diff -u "$RUNNER_TEMP/expected-harness-files" "$RUNNER_TEMP/actual-harness-files"

          hardening="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HARDENING_VERIFY_RUN")"
          test "$(jq -r .status <<<"$hardening")" = completed
          test "$(jq -r .conclusion <<<"$hardening")" = success
          test "$(jq -r .head_sha <<<"$hardening")" = 31029ddf466fd716d39c42c3224260cc5782a5fa

          implementation_seal="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMPLEMENTATION_SEAL_RUN")"
          test "$(jq -r .status <<<"$implementation_seal")" = completed
          test "$(jq -r .conclusion <<<"$implementation_seal")" = success
          test "$(jq -r .head_sha <<<"$implementation_seal")" = 78cfad19b2bb2eb66291aec0d6de8a7ffaa0a3f6
          for row in \
            "$IMPLEMENTATION_PRIMARY_ID|$IMPLEMENTATION_PRIMARY_NAME|$IMPLEMENTATION_PRIMARY_DIGEST" \
            "$IMPLEMENTATION_FRESH_ID|$IMPLEMENTATION_FRESH_NAME|$IMPLEMENTATION_FRESH_DIGEST" \
            "$IMPLEMENTATION_AUDIT_ID|$IMPLEMENTATION_AUDIT_NAME|$IMPLEMENTATION_AUDIT_DIGEST"
          do
            IFS="|" read -r artifact_id artifact_name artifact_digest <<<"$row"
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            test "$(jq -r .name <<<"$artifact")" = "$artifact_name"
            test "$(jq -r .workflow_run.id <<<"$artifact")" = "$IMPLEMENTATION_SEAL_RUN"
            test "$(jq -r .expired <<<"$artifact")" = false
            test "$(jq -r .digest <<<"$artifact")" = "$artifact_digest"
          done

          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$producer")" = "$PRODUCER_ARTIFACT_NAME"
          test "$(jq -r .workflow_run.id <<<"$producer")" = "$PRODUCER_RUN"
          test "$(jq -r .expired <<<"$producer")" = false
          test "$(jq -r .digest <<<"$producer")" = "$PRODUCER_ARTIFACT_DIGEST"

          recovery="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN")"
          test "$(jq -r .status <<<"$recovery")" = completed
          test "$(jq -r .conclusion <<<"$recovery")" = success
          recovery_artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT_ID")"
          test "$(jq -r .name <<<"$recovery_artifact")" = "$RECOVERY_ARTIFACT_NAME"
          test "$(jq -r .workflow_run.id <<<"$recovery_artifact")" = "$RECOVERY_RUN"
          test "$(jq -r .expired <<<"$recovery_artifact")" = false
          test "$(jq -r .digest <<<"$recovery_artifact")" = "$RECOVERY_ARTIFACT_DIGEST"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ACTIVATION_NAME&per_page=100" > "$RUNNER_TEMP/activation-slot.json"
          cd target
          SLOT="$RUNNER_TEMP/activation-slot.json" uv run python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['GITHUB_WORKSPACE']) / 'harness' / '.github' / 'scripts' / 'issue645_directional_activation.py'
          spec = importlib.util.spec_from_file_location('issue645_activation', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          payload = json.loads(Path(os.environ['SLOT']).read_text())
          module.validate_remote_slot(payload, state='empty')
          print('ISSUE645_REMOTE_ACTIVATION_SLOT=EMPTY')
          print('REAL_DATASET_LOADED=false')
          print('ECONOMIC_ARM_STARTED=false')
          PY

      - name: Download sealed implementation audit before Dataset load
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue645-corrected-accounting-audit-v1
          path: ${{ runner.temp }}/implementation-audit
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '35286608859'

      - name: Re-read implementation seal boundary before Dataset load
        shell: bash
        run: |
          set -euo pipefail
          AUDIT="$RUNNER_TEMP/implementation-audit/audit.json" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["AUDIT"]).read_text())
          assert payload["schema_version"] == "issue645_corrected_accounting_implementation_audit_v1"
          assert payload["issue_number"] == 645
          assert payload["target_head"] == "928ee0886c404cdbb1383f440f731d7221c277ef"
          assert payload["byte_identical"] is True
          assert payload["primary_sha256"] == payload["fresh_sha256"]
          assert len(payload["primary_sha256"]) == 64
          assert payload["real_dataset_loaded"] is False
          assert payload["economic_result_inspected"] is False
          assert payload["production_eligible"] is False
          assert payload["live_trading_authorized"] is False
          print("ISSUE645_IMPLEMENTATION_SEAL_BOUND=true")
          print("REAL_DATASET_LOADED=false")
          print("MODEL_FIT_PERFORMED=false")
          print("ECONOMIC_REPLAY_PERFORMED=false")
          PY

      - name: Download exact calibrated causal successor without loading Dataset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue539-calibrated-causal-successor-v3-34803217815
          path: ${{ runner.temp }}/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '34803217815'

      - name: Build pre-data protocol and activation claim without Dataset load
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protocol" "$RUNNER_TEMP/activation"
          TARGET_SHA="$TARGET_SHA" uv run python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          from trade_rl.artifacts import canonical_json_bytes, content_digest
          from trade_rl.evaluation.directional_study import expected_protocol

          source = Path(os.environ['RUNNER_TEMP']) / 'source'
          protocol = expected_protocol(source)
          protocol_root = Path(os.environ['RUNNER_TEMP']) / 'protocol'
          protocol_root.joinpath('protocol.json').write_bytes(canonical_json_bytes(protocol))
          protocol_root.joinpath('protocol.digest.json').write_bytes(
              canonical_json_bytes({'digest': content_digest(protocol)})
          )

          path = Path(os.environ['GITHUB_WORKSPACE']) / 'harness' / '.github' / 'scripts' / 'issue645_directional_activation.py'
          spec = importlib.util.spec_from_file_location('issue645_activation', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          claim = module.build_activation_claim(
              protocol,
              workflow_run_id=int(os.environ['GITHUB_RUN_ID']),
              workflow_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              implementation_head=os.environ['TARGET_SHA'],
          )
          module.validate_activation_claim(
              claim,
              protocol,
              workflow_run_id=int(os.environ['GITHUB_RUN_ID']),
              implementation_head=os.environ['TARGET_SHA'],
          )
          Path(os.environ['RUNNER_TEMP'], 'activation', 'activation.json').write_bytes(
              module.activation_claim_bytes(claim)
          )
          print('ISSUE645_PREDATA_PROTOCOL_PREPARED=true')
          print('REAL_DATASET_LOADED=false')
          print('ECONOMIC_ARM_STARTED=false')
          print('ECONOMIC_RESULT_INTERPRETED=false')
          PY

      - id: activation_upload
        name: Publish repository-global activation before Dataset load or any arm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-activation-v1
          path: ${{ runner.temp }}/activation/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind global activation Artifact before Dataset load
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.activation_upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.activation_upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$ACTIVATION_NAME"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$meta")" = false
          api_digest="$(jq -r .digest <<<"$meta")"
          case "$UPLOAD_DIGEST" in sha256:*) expected_digest="$UPLOAD_DIGEST" ;; *) expected_digest="sha256:$UPLOAD_DIGEST" ;; esac
          test "$api_digest" = "$expected_digest"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ACTIVATION_NAME&per_page=100" > "$RUNNER_TEMP/activation-claimed.json"
          SLOT="$RUNNER_TEMP/activation-claimed.json" uv run python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['GITHUB_WORKSPACE']) / 'harness' / '.github' / 'scripts' / 'issue645_directional_activation.py'
          spec = importlib.util.spec_from_file_location('issue645_activation', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          payload = json.loads(Path(os.environ['SLOT']).read_text())
          module.validate_remote_slot(
              payload,
              state='claimed',
              workflow_run_id=int(os.environ['GITHUB_RUN_ID']),
          )
          print('ISSUE645_REMOTE_ACTIVATION_SLOT=CLAIMED')
          print('REAL_DATASET_LOADED=false')
          print('ECONOMIC_ARM_STARTED=false')
          PY

      - id: protocol_upload
        name: Publish immutable protocol before Dataset load and first arm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-protocol-v1
          path: ${{ runner.temp }}/protocol/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind protocol Artifact before Dataset load and economic execution
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.protocol_upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$PROTOCOL_NAME"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$meta")" = false
          echo ISSUE645_PROTOCOL_PUBLISHED_BEFORE_DATASET_LOAD=true
          echo REAL_DATASET_LOADED=false
          echo ECONOMIC_RESULT_INTERPRETED=false

      - name: Load and validate Dataset only after remote activation and protocol binding
        working-directory: target
        run: |
          set -euo pipefail
          uv run python -m trade_rl.evaluation.directional_study prepare \
            --source "$RUNNER_TEMP/source" \
            --output "$RUNNER_TEMP/study"
          cmp "$RUNNER_TEMP/study/protocol.json" "$RUNNER_TEMP/protocol/protocol.json"
          cmp "$RUNNER_TEMP/study/protocol.digest.json" "$RUNNER_TEMP/protocol/protocol.digest.json"
          echo ISSUE645_DATASET_VALIDATED_AFTER_ACTIVATION=true
          echo MODEL_FIT_PERFORMED=false
          echo ECONOMIC_REPLAY_PERFORMED=false
          echo ECONOMIC_RESULT_INTERPRETED=false

      - name: Run cash exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh cash
      - name: Publish immutable cash attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-cash-v1
          path: ${{ runner.temp }}/publish/cash/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run constant_long exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh constant_long
      - name: Publish immutable constant_long attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-constant_long-v1
          path: ${{ runner.temp }}/publish/constant_long/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run constant_short exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh constant_short
      - name: Publish immutable constant_short attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-constant_short-v1
          path: ${{ runner.temp }}/publish/constant_short/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run trend exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh trend
      - name: Publish immutable trend attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-trend-v1
          path: ${{ runner.temp }}/publish/trend/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run mean_reversion exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh mean_reversion
      - name: Publish immutable mean_reversion attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-mean_reversion-v1
          path: ${{ runner.temp }}/publish/mean_reversion/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ridge24 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ridge24
      - name: Publish immutable ridge24 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ridge24-v1
          path: ${{ runner.temp }}/publish/ridge24/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run lightgbm24 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh lightgbm24
      - name: Publish immutable lightgbm24 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-lightgbm24-v1
          path: ${{ runner.temp }}/publish/lightgbm24/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run channel_breakout exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh channel_breakout
      - name: Publish immutable channel_breakout attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-channel_breakout-v1
          path: ${{ runner.temp }}/publish/channel_breakout/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ppo0 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ppo0
      - name: Publish immutable ppo0 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ppo0-v1
          path: ${{ runner.temp }}/publish/ppo0/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ppo1 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ppo1
      - name: Publish immutable ppo1 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ppo1-v1
          path: ${{ runner.temp }}/publish/ppo1/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ppo2 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ppo2
      - name: Publish immutable ppo2 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ppo2-v1
          path: ${{ runner.temp }}/publish/ppo2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ppo3 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ppo3
      - name: Publish immutable ppo3 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ppo3-v1
          path: ${{ runner.temp }}/publish/ppo3/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Run ppo4 exactly once
        run: TARGET_DIR="$GITHUB_WORKSPACE/target" SOURCE_DIR="$RUNNER_TEMP/source" STUDY_DIR="$RUNNER_TEMP/study" PUBLISH_ROOT="$RUNNER_TEMP/publish" STATUS_ROOT="$RUNNER_TEMP/status" bash harness/.github/scripts/issue645_official_run_arm.sh ppo4
      - name: Publish immutable ppo4 attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-arm-ppo4-v1
          path: ${{ runner.temp }}/publish/ppo4/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Finalize only a complete 13-arm roster without logging economics
        id: finalize
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/summary"
          all_ok=true
          statuses='{}'
          for arm in cash constant_long constant_short trend mean_reversion ridge24 lightgbm24 channel_breakout ppo0 ppo1 ppo2 ppo3 ppo4; do
            code="$(cat "$RUNNER_TEMP/status/$arm")"
            statuses="$(jq -c --arg arm "$arm" --argjson code "$code" '. + {($arm): $code}' <<<"$statuses")"
            if [[ "$code" != "0" ]]; then all_ok=false; fi
          done
          selection_written=false
          if [[ "$all_ok" = true ]]; then
            uv run python -m trade_rl.evaluation.directional_study finalize \
              --source "$RUNNER_TEMP/source" \
              --output "$RUNNER_TEMP/study"
            cp "$RUNNER_TEMP/study/selection.json" "$RUNNER_TEMP/summary/selection.json"
            selection_written=true
          fi
          STATUSES="$statuses" ALL_OK="$all_ok" SELECTION_WRITTEN="$selection_written" uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from trade_rl.artifacts import canonical_json_bytes
          payload = {
              'schema_version': 'issue645_corrected_directional_execution_summary_v1',
              'issue_number': 645,
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'implementation_head': os.environ['TARGET_SHA'],
              'arm_exit_codes': json.loads(os.environ['STATUSES']),
              'all_arms_succeeded': os.environ['ALL_OK'] == 'true',
              'selection_written': os.environ['SELECTION_WRITTEN'] == 'true',
              'economic_result_interpreted': False,
              'unused_data_accessed': False,
              'production_eligible': False,
              'live_trading_authorized': False,
          }
          Path(os.environ['RUNNER_TEMP'], 'summary', 'execution.json').write_bytes(
              canonical_json_bytes(payload)
          )
          print('ISSUE645_EXECUTION_SUMMARY_WRITTEN=true')
          print('ECONOMIC_RESULT_INTERPRETED=false')
          PY

      - name: Publish immutable run summary and selection bytes if complete
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-run-summary-v1
          path: ${{ runner.temp }}/summary/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  audit:
    name: Fresh publication audit without model refit
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact official workflow lineage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Checkout exact hardened economic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 928ee0886c404cdbb1383f440f731d7221c277ef
          path: target
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: true

      - name: Install no-refit audit runtime
        working-directory: target
        run: uv sync --extra dev

      - name: Download immutable activation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue645-corrected-directional-activation-v1
          path: ${{ runner.temp }}/activation

      - name: Download immutable protocol
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue645-corrected-directional-protocol-v1
          path: ${{ runner.temp }}/protocol

      - name: Download all immutable arm attempts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: issue645-corrected-directional-arm-*-v1
          path: ${{ runner.temp }}/arms
          merge-multiple: false

      - name: Download immutable run summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue645-corrected-directional-run-summary-v1
          path: ${{ runner.temp }}/summary

      - name: Independently reconstruct publication without fitting models
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python ../harness/.github/scripts/issue645_official_audit.py \
            --target . \
            --activation "$RUNNER_TEMP/activation" \
            --protocol "$RUNNER_TEMP/protocol" \
            --arms "$RUNNER_TEMP/arms" \
            --summary "$RUNNER_TEMP/summary" \
            --output "$RUNNER_TEMP/audit"
          test -s "$RUNNER_TEMP/audit/audit.json"
          echo ECONOMIC_RESULT_INTERPRETATION_ALLOWED_AFTER_PUBLICATION=true

      - id: audit_upload
        name: Publish immutable independent audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue645-corrected-directional-audit-v1
          path: ${{ runner.temp }}/audit/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Bind final audit Artifact and preserve research boundary
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.audit_upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = issue645-corrected-directional-audit-v1
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$meta")" = false
          echo UNUSED_DATA_ACCESSED=false
          echo PRODUCTION_ELIGIBLE=false
          echo LIVE_TRADING_AUTHORIZED=false
