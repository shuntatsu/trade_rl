      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PRIMARY_NAME }}
          path: ${{ runner.temp }}/primary
      - name: Require byte identity with primary
        run: |
          set -euo pipefail
          for f in implementation.json protocol.json seal.json; do
            cmp "$RUNNER_TEMP/fresh/$f" "$RUNNER_TEMP/primary/$f"
          done
      - name: Upload fresh authority
