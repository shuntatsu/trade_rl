  audit:
    needs: [primary, fresh]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PRIMARY_NAME }}
          path: ${{ runner.temp }}/primary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.FRESH_NAME }}
          path: ${{ runner.temp }}/fresh
      - name: Independently audit canonical bytes and Artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_ID: ${{ needs.primary.outputs.artifact_id }}
          PRIMARY_DIGEST: ${{ needs.primary.outputs.artifact_digest }}
          FRESH_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for f in implementation.json protocol.json seal.json; do
            cmp "$RUNNER_TEMP/primary/$f" "$RUNNER_TEMP/fresh/$f"
          done
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          for root in (Path(os.environ["RUNNER_TEMP"])/"primary", Path(os.environ["RUNNER_TEMP"])/"fresh"):
              values = {}
              for name in ("implementation.json","protocol.json","seal.json"):
                  raw=(root/name).read_bytes()
                  value=json.loads(raw)
                  assert json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()==raw
                  values[name]=(value,hashlib.sha256(raw).hexdigest())
              seal=values["seal.json"][0]
              assert seal["implementation_sha256"]==values["implementation.json"][1]
              assert seal["protocol_sha256"]==values["protocol.json"][1]
              for key in ("economic_result_inspected","real_dataset_loaded","model_fit_performed","economic_replay_performed","unused_data_accessed","final_test_accessed","production_eligible","live_trading_authorized"):
                  assert seal[key] is False
          PY
          for tuple in "PRIMARY:$PRIMARY_ID:$PRIMARY_NAME:$PRIMARY_DIGEST" "FRESH:$FRESH_ID:$FRESH_NAME:$FRESH_DIGEST"; do
            IFS=: read -r label id expected_name action_digest <<<"$tuple"
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$meta")" = "$expected_name"
            test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
            test "$(jq -r .expired <<<"$meta")" = false
            api_digest="$(jq -r .digest <<<"$meta")"
            test "${api_digest#sha256:}" = "${action_digest#sha256:}"
          done
          mkdir -p "$RUNNER_TEMP/audit"
          python - "$RUNNER_TEMP/audit/audit.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"primary"
          def h(name): return hashlib.sha256((root/name).read_bytes()).hexdigest()
          value={
            "schema":"issue663_normalization_authority_audit_v1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "target_head":"5cefa36ca3ba47cc9ed9b80df18130ec2720f86e",
            "implementation_sha256":h("implementation.json"),
            "protocol_sha256":h("protocol.json"),
            "seal_sha256":h("seal.json"),
            "primary_artifact_id":int(os.environ["PRIMARY_ID"]),
            "fresh_artifact_id":int(os.environ["FRESH_ID"]),
            "byte_identical":True,
            "real_dataset_loaded":False,
            "model_fit_performed":False,
            "economic_replay_performed":False,
            "unused_data_accessed":False,
            "final_test_accessed":False,
            "production_eligible":False,
            "live_trading_authorized":False,
          }
          Path(sys.argv[1]).write_bytes(json.dumps(value,sort_keys=True,separators=(",",":")).encode())
          PY
      - name: Upload immutable audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AUDIT_NAME }}
          path: ${{ runner.temp }}/audit/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
