                  "artifact_digest": "sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce",
                  "dataset_id": "6c0b040d317a1bb73a9273f4135879b31691634aa837f30f0eec005ac7531518",
                  "dataset_artifact_digest": "af481dd978db7d84cd3aa8ff4f5a35d8608ac44c755dd74f61e934105c02b6b7",
                  "study_digest": "bfa2fcb307773f5384d7dcb884444164d6d3b575373d8f7dc1c810a61bf4c820",
                  "recovery_run": 34803432434,
                  "recovery_artifact_id": 10332575500,
                  "recovery_artifact_digest": "sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589",
              },
              "candidate": {
                  "normalize_features": True,
                  "normalizer_schema": "ppo_feature_standardization_v1",
                  "training_layout": "sequential",
                  "seeds": [0,1,2,3,4],
                  "total_timesteps": 262144,
                  "risk_config": None,
                  "gross_training_budget": 0.1,
                  "initial_capital": 10000.0,
                  "ordinary_execution_profile": True,
                  "fit_scope_only": True,
