          fetch-depth: 0
          persist-credentials: false
      - name: Independently regenerate canonical authority
        run: |
          set -euo pipefail
          git cat-file -e "$PR642_HEAD^{commit}" || git fetch --no-tags origin "$PR642_HEAD"
          out="$RUNNER_TEMP/fresh"
          mkdir -p "$out"
          python - "$out" <<'PY'
          from __future__ import annotations
