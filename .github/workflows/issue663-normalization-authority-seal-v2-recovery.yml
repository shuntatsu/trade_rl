name: Issue 663 normalization protocol seal v2 recovery

on:
  push:
    branches:
      - seal/issue663-normalization-authority-v2
    paths:
      - .github/authorizations/issue663-normalization-authority-v2-recovery.authorized

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 5cefa36ca3ba47cc9ed9b80df18130ec2720f86e
  V1_RUN: '35352070089'
  FAILED_V2_RUN: '35368398973'
  V1_PROTOCOL_SHA: d82a78fd1dde984158909ff8bdb062dbe63da30d437118a8c85a7bb2901cab58
  PRIMARY_NAME: issue663-normalization-authority-primary-v2
  FRESH_NAME: issue663-normalization-authority-fresh-v2
  AUDIT_NAME: issue663-normalization-authority-audit-v2

jobs:
  primary:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Prove recovery eligibility and empty v2 slots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF_NAME" = "seal/issue663-normalization-authority-v2"
          failed="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_V2_RUN")"
          test "$(jq -r .conclusion <<<"$failed")" = "failure"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_V2_RUN/artifacts" --jq .total_count)" = "0"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" --jq .conclusion)" = "success"
          for name in "$PRIMARY_NAME" "$FRESH_NAME" "$AUDIT_NAME"; do
            test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq .total_count)" = "0"
          done

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue663-normalization-authority-primary-v1
          path: ${{ runner.temp }}/v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V1_RUN }}

      - name: Transform canonical v1 protocol to v2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "v1"
          output = Path(os.environ["RUNNER_TEMP"]) / "v2"

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode()

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          implementation = (source / "implementation.json").read_bytes()
          old_raw = (source / "protocol.json").read_bytes()
          old = json.loads(old_raw)
          assert canonical(old) == old_raw
          assert digest(old_raw) == os.environ["V1_PROTOCOL_SHA"]

          gate = old["absolute_gate"]
          assert gate.pop("exact_terminal_flatness") is True
          gate["terminal_flatness_semantics"] = (
              "issue645_reporting_quantity_abs_le_1e-10"
          )
          old["protocol_revision"] = {
              "candidate_results_inspected": False,
              "reason": "align_terminal_flatness_with_frozen_issue645_evaluator",
              "supersedes_protocol_sha256": os.environ["V1_PROTOCOL_SHA"],
          }

          protocol = canonical(old)
          (output / "implementation.json").write_bytes(implementation)
          (output / "protocol.json").write_bytes(protocol)
          seal = {
              "schema": "issue663_normalization_authority_seal_v2",
              "target_head": os.environ["TARGET_SHA"],
              "implementation_sha256": digest(implementation),
              "protocol_sha256": digest(protocol),
              "supersedes_protocol_sha256": os.environ["V1_PROTOCOL_SHA"],
              "candidate_results_inspected": False,
              "real_dataset_loaded": False,
              "model_fit_performed": False,
              "economic_replay_performed": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
          }
          (output / "seal.json").write_bytes(canonical(seal))
          print("V2_PROTOCOL_SHA=" + digest(protocol))
          PY

      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.PRIMARY_NAME }}
          path: ${{ runner.temp }}/v2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  fresh:
    needs: primary
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue663-normalization-authority-fresh-v1
          path: ${{ runner.temp }}/v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V1_RUN }}

      - name: Independently transform canonical v1 protocol to v2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "v1"
          output = Path(os.environ["RUNNER_TEMP"]) / "v2"

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode()

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()

          implementation = (source / "implementation.json").read_bytes()
          raw = (source / "protocol.json").read_bytes()
          value = json.loads(raw)
          assert canonical(value) == raw
          assert digest(raw) == os.environ["V1_PROTOCOL_SHA"]

          gate = value["absolute_gate"]
          assert gate.pop("exact_terminal_flatness") is True
          gate["terminal_flatness_semantics"] = (
              "issue645_reporting_quantity_abs_le_1e-10"
          )
          value["protocol_revision"] = {
              "candidate_results_inspected": False,
              "reason": "align_terminal_flatness_with_frozen_issue645_evaluator",
              "supersedes_protocol_sha256": os.environ["V1_PROTOCOL_SHA"],
          }

          protocol = canonical(value)
          (output / "implementation.json").write_bytes(implementation)
          (output / "protocol.json").write_bytes(protocol)
          seal = {
              "schema": "issue663_normalization_authority_seal_v2",
              "target_head": os.environ["TARGET_SHA"],
              "implementation_sha256": digest(implementation),
              "protocol_sha256": digest(protocol),
              "supersedes_protocol_sha256": os.environ["V1_PROTOCOL_SHA"],
              "candidate_results_inspected": False,
              "real_dataset_loaded": False,
              "model_fit_performed": False,
              "economic_replay_performed": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
          }
          (output / "seal.json").write_bytes(canonical(seal))
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PRIMARY_NAME }}
          path: ${{ runner.temp }}/primary

      - name: Require primary/fresh byte identity
        run: |
          set -euo pipefail
          for file in implementation.json protocol.json seal.json; do
            cmp "$RUNNER_TEMP/v2/$file" "$RUNNER_TEMP/primary/$file"
          done

      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.FRESH_NAME }}
          path: ${{ runner.temp }}/v2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false

  audit:
    needs: [primary, fresh]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.PRIMARY_NAME }}
          path: ${{ runner.temp }}/primary

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.FRESH_NAME }}
          path: ${{ runner.temp }}/fresh

      - name: Audit v2 semantics, bytes and Artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY_ID: ${{ needs.primary.outputs.artifact_id }}
          PRIMARY_DIGEST: ${{ needs.primary.outputs.artifact_digest }}
          FRESH_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for file in implementation.json protocol.json seal.json; do
            cmp "$RUNNER_TEMP/primary/$file" "$RUNNER_TEMP/fresh/$file"
          done
          mkdir -p "$RUNNER_TEMP/audit"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "primary"

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode()

          def read(name):
              raw = (root / name).read_bytes()
              value = json.loads(raw)
              assert canonical(value) == raw
              return raw, value

          implementation_raw, _ = read("implementation.json")
          protocol_raw, protocol = read("protocol.json")
          seal_raw, seal = read("seal.json")

          assert "exact_terminal_flatness" not in protocol["absolute_gate"]
          assert (
              protocol["absolute_gate"]["terminal_flatness_semantics"]
              == "issue645_reporting_quantity_abs_le_1e-10"
          )
          revision = protocol["protocol_revision"]
          assert revision["supersedes_protocol_sha256"] == os.environ["V1_PROTOCOL_SHA"]
          assert revision["candidate_results_inspected"] is False
          assert seal["implementation_sha256"] == hashlib.sha256(
              implementation_raw
          ).hexdigest()
          assert seal["protocol_sha256"] == hashlib.sha256(protocol_raw).hexdigest()
          for key in (
              "candidate_results_inspected",
              "real_dataset_loaded",
              "model_fit_performed",
              "economic_replay_performed",
              "unused_data_accessed",
              "final_test_accessed",
              "production_eligible",
              "live_trading_authorized",
          ):
              assert seal[key] is False

          audit = {
              "schema": "issue663_normalization_authority_audit_v2",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "target_head": os.environ["TARGET_SHA"],
              "implementation_sha256": hashlib.sha256(implementation_raw).hexdigest(),
              "protocol_sha256": hashlib.sha256(protocol_raw).hexdigest(),
              "seal_sha256": hashlib.sha256(seal_raw).hexdigest(),
              "supersedes_protocol_sha256": os.environ["V1_PROTOCOL_SHA"],
              "byte_identical": True,
              "candidate_results_inspected": False,
              "model_fit_performed": False,
              "economic_replay_performed": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
              "production_eligible": False,
              "live_trading_authorized": False,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "audit" / "audit.json").write_bytes(
              canonical(audit)
          )
          PY

          for row in             "PRIMARY|$PRIMARY_ID|$PRIMARY_NAME|$PRIMARY_DIGEST"             "FRESH|$FRESH_ID|$FRESH_NAME|$FRESH_DIGEST"
          do
            IFS='|' read -r label id expected_name action_digest <<<"$row"
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$meta")" = "$expected_name"
            test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
            test "$(jq -r .expired <<<"$meta")" = "false"
            api_digest="$(jq -r .digest <<<"$meta")"
            test "${api_digest#sha256:}" = "${action_digest#sha256:}"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.AUDIT_NAME }}
          path: ${{ runner.temp }}/audit/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
