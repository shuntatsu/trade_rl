name: One-shot Issue 810 R2 Release Byte Verification

on:
  push:
    branches:
      - codex/issue810-r2-zip-byte-auditor-20261025

permissions:
  contents: read

jobs:
  checkpoint-byte-readback:
    name: Historical ZIP only - not economic authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned audit code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch exact immutable public GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r2-readback"
          gh release download 'research/issue810-development-checkpoint-20261015' \
            --repo shuntatsu/trade_rl \
            --pattern 'issue810-development-checkpoint-20261015.zip' \
            --dir "$RUNNER_TEMP/r2-readback"
          gh release download 'research/issue810-development-checkpoint-20261015' \
            --repo shuntatsu/trade_rl \
            --pattern 'MANIFEST.json' \
            --dir "$RUNNER_TEMP/r2-readback"
          test "$(stat -c '%s' "$RUNNER_TEMP/r2-readback/issue810-development-checkpoint-20261015.zip")" = '34538439'
          test "$(stat -c '%s' "$RUNNER_TEMP/r2-readback/MANIFEST.json")" = '18512'
          echo 'Downloaded historical release ZIP and external MANIFEST; no market input loaded'

      - name: Check 87 historical archive members in streaming read-only mode
        run: |
          set -euo pipefail
          python3 --version
          python3 -m tools.issue810_r2_release_audit \
            --archive "$RUNNER_TEMP/r2-readback/issue810-development-checkpoint-20261015.zip" \
            --manifest "$RUNNER_TEMP/r2-readback/MANIFEST.json" \
            --report "$RUNNER_TEMP/r2-readback/byte-audit-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "r2-readback" / "byte-audit-report.json"
          r = json.loads(p.read_text())
          assert r["state"] == "ZIP_AND_ALL87_MEMBERS_BYTE_VERIFIED"
          assert r["member_count"] == 87
          assert r["declared_source_count"] == 8
          assert r["r2_root_member_count"] == 13
          assert r["market_result"] == "NOT_ESTABLISHED"
          assert r["economic_authority"] == "NOT_GRANTED"
          print("ARCHIVE_BYTE_AUDIT_PASS", r["zip_sha256"], r["member_count"])
          print("NO_G4_APPROVAL_OR_ORIGINAL_48_COMPLETION")
          PY

      - name: Upload byte audit report only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue810-r2-archival-byte-audit-${{ github.sha }}
          path: ${{ runner.temp }}/r2-readback/byte-audit-report.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
