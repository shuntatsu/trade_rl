name: Temporary Ruff difference diagnostic
on:
  push:
    branches:
      - codex/issue810-r2-zip-byte-auditor-20261025
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Print formatter diff
        run: uv run ruff format --diff tools/issue810_r2_release_audit.py tests/tools/test_issue810_r2_release_audit.py
