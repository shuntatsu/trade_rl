name: Issue888 Pinned Ruff Formatter Differential
on:
  push:
    branches:
      - codex/issue888-ruff-format-audit
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a348571addd88bfe1cc803c8b3020294f843bbf3
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff format differential
        run: uv run ruff format --diff tests/evaluation/test_source_envelope_digest_memo.py
