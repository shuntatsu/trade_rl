name: Issue888 Bounded Source Envelope Benchmark
on:
  push:
    branches:
      - codex/issue888-ruff-format-audit
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c846afaa1ffb1c8959dc362100779887de8485d2
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Paired source-envelope warm benchmark
        run: |
          uv run python - <<'PY'
          import platform
          import statistics
          import time
          import numpy as np
          from tests.evaluation.test_allocation_nonrl_walk_forward import global_control_fixture
          from trade_rl.evaluation.rl_allocation.global_execution_context import _source_envelope_digest
          from trade_rl.evaluation.rl_allocation._simple_stream_digest import SimpleStreamDigestMemo
          from trade_rl.evaluation.rl_allocation._source_envelope_digest import SourceEnvelopeDigestMemo
          env = global_control_fixture()
          stream_memo = SimpleStreamDigestMemo()
          memo = SourceEnvelopeDigestMemo()
          reference = lambda: _source_envelope_digest(env, stream_memo)
          optimized = lambda: _source_envelope_digest(env, stream_memo, memo)
          digest = reference()
          assert optimized() == digest
          ops = (("reference", reference), ("memo", optimized))
          for _ in range(5):
              for _, operation in ops:
                  assert operation() == digest
          results = {"reference": [], "memo": []}
          batch_calls = 10
          pairs = 12
          for index in range(pairs):
              for name, operation in (ops if index % 2 == 0 else ops[::-1]):
                  start = time.perf_counter_ns()
                  for _ in range(batch_calls):
                      if operation() != digest:
                          raise AssertionError("source-envelope digest mismatch")
                  elapsed = time.perf_counter_ns() - start
                  results[name].append(elapsed / batch_calls / 1e6)
          print("SOURCE", "c846afaa1ffb1c8959dc362100779887de8485d2")
          print("RUNTIME", platform.python_version(), np.__version__)
          print("SYNTHETIC_ROWS", env.stop_index-env.start_index)
          print("ARRAY_PINS", len(env.dataset.identity_arrays())-1)
          print("SAMPLES_PER_PATH", pairs, "CALLS_PER_SAMPLE", batch_calls)
          print("RAW_MS_PER_CALL", results)
          median_ref = statistics.median(results["reference"])
          median_memo = statistics.median(results["memo"])
          print("MEDIAN_MS_PER_CALL", {"reference":median_ref,"memo":median_memo})
          print("MEDIAN_RATIO_REF_TO_MEMO",median_ref/median_memo)
          print("SCOPE", "same-source unisolated artificial small-fixture; no market/full-arm throughput claim")
          PY
