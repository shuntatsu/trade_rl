name: Issue888 Exact Final Source Verification
on:
  push:
    branches:
      - codex/issue888-ruff-format-audit
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact final source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 500eb29e4af4ff2000e51282c54dc4505c47a2d5
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Ruff format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy Linux
        run: uv run mypy --platform linux trade_rl
      - name: Guide content contract
        run: uv run python guide/tools/content_contract.py --check
      - name: Targeted and architecture pytest
        run: |
          uv run pytest -q tests/evaluation/test_source_envelope_digest_memo.py tests/evaluation/test_allocation_source_envelope_digest_guard.py tests/evaluation/test_declared_source_digest_memo.py tests/evaluation/test_allocation_terminal_execution.py tests/architecture/test_allocation_global_execution_boundary.py tests/architecture/test_current_docs_layout.py
      - name: Build
        run: uv build
  full-core:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact final source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 500eb29e4af4ff2000e51282c54dc4505c47a2d5
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Full Core pytest
        run: uv run pytest -q tests
