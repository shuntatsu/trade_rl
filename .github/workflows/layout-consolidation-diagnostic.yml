name: Layout Consolidation Diagnostic

on:
  push:
    branches:
      - integration/layout-consolidation

permissions:
  contents: read

jobs:
  diagnose-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refactor/root-package-layout-v2
          set +e
          git merge --no-commit --no-ff origin/refactor/root-package-layout-v2
          status=$?
          set -e
          echo "merge_status=$status"
          echo "--- unmerged paths ---"
          git diff --name-only --diff-filter=U || true
          for path in .github/workflows/nautilus-capability.yml trade_rl/workflows/stage_a_execution_producer.py; do
            echo "===== $path : OURS vs THEIRS ====="
            git diff --no-index <(git show ":2:$path") <(git show ":3:$path") || true
          done
          echo "===== benchmark current-main source ====="
          git show HEAD:tools/nautilus_training_throughput_benchmark.py | sed -n '1,260p'
          echo "--- status ---"
          git status --short
          git merge --abort || true
