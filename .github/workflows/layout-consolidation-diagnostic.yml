name: Layout Consolidation Diagnostic

on:
  push:
    branches:
      - integration/layout-consolidation

permissions:
  contents: read

jobs:
  diagnose-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose merge conflicts
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refactor/root-package-layout-v2
          set +e
          git merge --no-commit --no-ff origin/refactor/root-package-layout-v2
          status=$?
          set -e
          echo "merge_status=$status"
          echo "--- unmerged paths ---"
          git diff --name-only --diff-filter=U || true
          echo "--- status ---"
          git status --short
          git merge --abort || true
