name: Layout Consolidation Integration

on:
  push:
    branches:
      - integration/layout-consolidation

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Merge layout v2 while preserving workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refactor/root-package-layout-v2

          workflows_tmp="$(mktemp -d)"
          cp -a .github/workflows/. "$workflows_tmp/"
          benchmark_tmp="$(mktemp)"
          git show HEAD:tools/nautilus_training_throughput_benchmark.py > "$benchmark_tmp"

          set +e
          git merge --no-commit --no-ff origin/refactor/root-package-layout-v2
          merge_status=$?
          set -e
          test "$merge_status" -eq 1
          expected="$(printf '%s\n' '.github/workflows/nautilus-capability.yml' 'scripts/nautilus_training_throughput_benchmark.py' 'trade_rl/workflows/stage_a_execution_producer.py')"
          actual="$(git diff --name-only --diff-filter=U | sort)"
          test "$actual" = "$expected"

          git checkout --ours trade_rl/workflows/stage_a_execution_producer.py
          cp "$benchmark_tmp" scripts/nautilus_training_throughput_benchmark.py
          git rm -f --ignore-unmatch tools/nautilus_training_throughput_benchmark.py
          git add scripts/nautilus_training_throughput_benchmark.py \
            trade_rl/workflows/stage_a_execution_producer.py

          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_nautilus_training_throughput_benchmark.py'): (
                  ('tools.nautilus_training_throughput_benchmark', 'scripts.nautilus_training_throughput_benchmark'),
              ),
              Path('docs/NAUTILUS_MIGRATION.md'): (
                  ('tools/nautilus_training_throughput_benchmark.py', 'scripts/nautilus_training_throughput_benchmark.py'),
              ),
              Path('tests/test_architecture_contract.py'): (
                  ('assert package_find["where"] == ["src"]', 'assert package_find["where"] == ["."]'),
              ),
              Path('tests/test_current_documentation_contract.py'): (
                  ('PYTHON_SOURCE_ROOT = ROOT / "src" / "trade_rl"', 'PYTHON_SOURCE_ROOT = ROOT / "trade_rl"'),
              ),
              Path('tests/test_package_toolchain_identity.py'): (
                  ('package_root = root / "src" / "trade_rl"', 'package_root = root / "trade_rl"'),
              ),
              Path('tests/workflows/test_walk_forward_manifest_provenance.py'): (
                  ('package_root = root / "src" / "trade_rl"', 'package_root = root / "trade_rl"'),
              ),
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git add tests/test_nautilus_training_throughput_benchmark.py \
            docs/NAUTILUS_MIGRATION.md \
            tests/test_architecture_contract.py \
            tests/test_current_documentation_contract.py \
            tests/test_package_toolchain_identity.py \
            tests/workflows/test_walk_forward_manifest_provenance.py

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$workflows_tmp/." .github/workflows/
          git add .github/workflows

          test -z "$(git diff --name-only --diff-filter=U)"
          test -d frontend
          test -d trade_rl
          test ! -d studio
          test ! -d src/trade_rl
      - name: Install integration dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio --extra nautilus --frozen
      - name: Run focused layout and migration verification
        shell: bash
        run: |
          set -euo pipefail
          helper_tmp="$(mktemp)"
          cp .github/workflows/layout-consolidation-diagnostic.yml "$helper_tmp"
          rm .github/workflows/layout-consolidation-diagnostic.yml
          trap 'cp "$helper_tmp" .github/workflows/layout-consolidation-diagnostic.yml' EXIT

          uv run ruff check \
            tests/test_architecture_contract.py \
            tests/test_current_documentation_contract.py \
            tests/test_package_toolchain_identity.py \
            tests/workflows/test_walk_forward_manifest_provenance.py \
            tests/test_nautilus_training_throughput_benchmark.py \
            scripts/nautilus_training_throughput_benchmark.py \
            trade_rl/workflows/stage_a_execution_producer.py
          uv run pytest -q \
            tests/architecture/test_repository_layout.py \
            tests/architecture/test_source_checkout.py \
            tests/test_architecture_contract.py \
            tests/test_current_documentation_contract.py \
            tests/test_package_toolchain_identity.py \
            tests/workflows/test_walk_forward_manifest_provenance.py \
            tests/test_nautilus_training_throughput_benchmark.py

          cp "$helper_tmp" .github/workflows/layout-consolidation-diagnostic.yml
          trap - EXIT
      - name: Commit normal-file integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --cached --name-only HEAD -- .github/workflows)"
          git commit -m "refactor: consolidate repository root layout"
          git push origin HEAD:integration/layout-consolidation
