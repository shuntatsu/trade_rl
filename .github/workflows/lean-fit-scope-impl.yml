name: Lean fit symbol scope implementation

on:
  push:
    branches:
      - fix/lean-fit-symbol-scope
    paths:
      - ".github/workflows/lean-fit-scope-impl.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/lean-fit-symbol-scope
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Apply minimal production implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Shared supervised fit scope validation and filtering.
          replace_once(
              "trade_rl/strategies/supervised.py",
              '    return indices\n\n\n@dataclass(frozen=True, slots=True)\nclass CausalForecastTrainingSet:',
              '''    return indices\n\n\ndef validated_symbol_indices(\n    dataset: MarketDataset,\n    symbol_indices: tuple[int, ...] | None,\n) -> tuple[int, ...]:\n    """Resolve an optional fit scope while rejecting ambiguous symbol indices."""\n\n    if symbol_indices is None:\n        return tuple(range(dataset.n_symbols))\n    indices = tuple(symbol_indices)\n    if not indices or len(set(indices)) != len(indices):\n        raise ValueError("symbol_indices must be non-empty and unique")\n    if any(\n        isinstance(index, bool) or not isinstance(index, int) or index < 0\n        for index in indices\n    ):\n        raise ValueError("symbol_indices must contain non-negative integers")\n    if max(indices) >= dataset.n_symbols:\n        raise ValueError("symbol index is outside dataset symbols")\n    return indices\n\n\n@dataclass(frozen=True, slots=True)\nclass CausalForecastTrainingSet:''',
          )
          replace_once(
              "trade_rl/strategies/supervised.py",
              '    feature_indices: tuple[int, ...],\n    fit_cutoff: np.datetime64,',
              '    feature_indices: tuple[int, ...],\n    fit_symbol_indices: tuple[int, ...] | None = None,\n    fit_cutoff: np.datetime64,',
          )
          replace_once(
              "trade_rl/strategies/supervised.py",
              '    indices = validated_feature_indices(dataset, feature_indices)\n    if (',
              '    indices = validated_feature_indices(dataset, feature_indices)\n    symbols = validated_symbol_indices(dataset, fit_symbol_indices)\n    if (',
          )
          replace_once(
              "trade_rl/strategies/supervised.py",
              '''    rows_by_symbol: list[list[np.ndarray]] = []\n    labels_by_symbol: list[list[float]] = []\n    ends_by_symbol: list[list[np.datetime64]] = []\n    for symbol_index in range(dataset.n_symbols):''',
              '''    rows_by_symbol: list[list[np.ndarray]] = [\n        [] for _ in range(dataset.n_symbols)\n    ]\n    labels_by_symbol: list[list[float]] = [\n        [] for _ in range(dataset.n_symbols)\n    ]\n    ends_by_symbol: list[list[np.datetime64]] = [\n        [] for _ in range(dataset.n_symbols)\n    ]\n    for symbol_index in symbols:''',
          )
          replace_once(
              "trade_rl/strategies/supervised.py",
              '''        rows_by_symbol.append(symbol_rows)\n        labels_by_symbol.append(symbol_labels)\n        ends_by_symbol.append(symbol_ends)\n\n    active_symbols = [index for index, rows in enumerate(rows_by_symbol) if rows]''',
              '''        rows_by_symbol[symbol_index] = symbol_rows\n        labels_by_symbol[symbol_index] = symbol_labels\n        ends_by_symbol[symbol_index] = symbol_ends\n\n    active_symbols = [index for index in symbols if rows_by_symbol[index]]''',
          )
          replace_once(
              "trade_rl/strategies/supervised.py",
              '    "validated_feature_indices",\n]',
              '    "validated_feature_indices",\n    "validated_symbol_indices",\n]',
          )

          # Propagate fit scope through supervised model families.
          for path in ("trade_rl/strategies/ridge.py", "trade_rl/strategies/lightgbm.py"):
              replace_once(
                  path,
                  '    feature_indices: tuple[int, ...],\n    fit_cutoff: np.datetime64,',
                  '    feature_indices: tuple[int, ...],\n    fit_symbol_indices: tuple[int, ...] | None = None,\n    fit_cutoff: np.datetime64,',
              )
              replace_once(
                  path,
                  '        feature_indices=feature_indices,\n        fit_cutoff=fit_cutoff,',
                  '        feature_indices=feature_indices,\n        fit_symbol_indices=fit_symbol_indices,\n        fit_cutoff=fit_cutoff,',
              )

          # Restrict PPO training episodes while preserving default all-symbol behavior.
          replace_once(
              "trade_rl/strategies/ppo.py",
              'from trade_rl.strategies.supervised import validated_feature_indices',
              'from trade_rl.strategies.supervised import (\n    validated_feature_indices,\n    validated_symbol_indices,\n)',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '        feature_indices: tuple[int, ...],\n        start_index: int,',
              '        feature_indices: tuple[int, ...],\n        symbol_indices: tuple[int, ...] | None = None,\n        start_index: int,',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '        self.dataset = dataset\n        self.feature_indices = validated_feature_indices(dataset, feature_indices)\n        self.start_index = start_index',
              '        self.dataset = dataset\n        self.feature_indices = validated_feature_indices(dataset, feature_indices)\n        self.symbol_indices = validated_symbol_indices(dataset, symbol_indices)\n        self.start_index = start_index',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '        self.active_symbol_index = -1\n        self.executor = MarketExecutor(self.dataset, self.execution_cost)',
              '        self.active_symbol_index = -1\n        self._active_symbol_offset = -1\n        self.executor = MarketExecutor(self.dataset, self.execution_cost)',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '''        self.active_symbol_index = (\n            self.active_symbol_index + 1\n        ) % self.dataset.n_symbols''',
              '''        self._active_symbol_offset = (\n            self._active_symbol_offset + 1\n        ) % len(self.symbol_indices)\n        self.active_symbol_index = self.symbol_indices[self._active_symbol_offset]''',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '    feature_indices: tuple[int, ...],\n    start_index: int,',
              '    feature_indices: tuple[int, ...],\n    fit_symbol_indices: tuple[int, ...] | None = None,\n    start_index: int,',
          )
          replace_once(
              "trade_rl/strategies/ppo.py",
              '        feature_indices=indices,\n        start_index=start_index,',
              '        feature_indices=indices,\n        symbol_indices=fit_symbol_indices,\n        start_index=start_index,',
          )

          # Make the candidate suite require and propagate an explicit fit scope.
          replace_once(
              "trade_rl/evaluation/candidate_suite.py",
              '    feature_indices: tuple[int, ...]\n    fit_cutoff: np.datetime64',
              '    feature_indices: tuple[int, ...]\n    fit_symbol_indices: tuple[int, ...]\n    fit_cutoff: np.datetime64',
          )
          replace_once(
              "trade_rl/evaluation/candidate_suite.py",
              '''        if any(\n            isinstance(index, bool) or not isinstance(index, int) or index < 0\n            for index in indices\n        ):\n            raise ValueError("feature_indices must contain non-negative integers")\n        for field_name, value in (''',
              '''        if any(\n            isinstance(index, bool) or not isinstance(index, int) or index < 0\n            for index in indices\n        ):\n            raise ValueError("feature_indices must contain non-negative integers")\n        fit_symbols = tuple(self.fit_symbol_indices)\n        if not fit_symbols or len(set(fit_symbols)) != len(fit_symbols):\n            raise ValueError("fit_symbol_indices must be non-empty and unique")\n        if any(\n            isinstance(index, bool) or not isinstance(index, int) or index < 0\n            for index in fit_symbols\n        ):\n            raise ValueError("fit_symbol_indices must contain non-negative integers")\n        for field_name, value in (''',
          )
          replace_once(
              "trade_rl/evaluation/candidate_suite.py",
              '        object.__setattr__(self, "feature_indices", indices)\n        object.__setattr__(self, "fit_cutoff", np.datetime64(self.fit_cutoff, "ns"))',
              '        object.__setattr__(self, "feature_indices", indices)\n        object.__setattr__(self, "fit_symbol_indices", fit_symbols)\n        object.__setattr__(self, "fit_cutoff", np.datetime64(self.fit_cutoff, "ns"))',
          )
          replace_once(
              "trade_rl/evaluation/candidate_suite.py",
              '    if max(config.feature_indices) >= dataset.n_features:\n        raise ValueError("feature index is outside dataset features")',
              '    if max(config.feature_indices) >= dataset.n_features:\n        raise ValueError("feature index is outside dataset features")\n    if max(config.fit_symbol_indices) >= dataset.n_symbols:\n        raise ValueError("fit symbol index is outside dataset symbols")',
          )
          for marker in (
              '        feature_indices=config.feature_indices,\n        fit_cutoff=config.fit_cutoff,',
          ):
              # Ridge and LightGBM each contain the same argument pair.
              path = Path("trade_rl/evaluation/candidate_suite.py")
              text = path.read_text(encoding="utf-8")
              if text.count(marker) != 2:
                  raise SystemExit(f"candidate_suite: expected two supervised fit markers, found {text.count(marker)}")
              path.write_text(
                  text.replace(
                      marker,
                      '        feature_indices=config.feature_indices,\n        fit_symbol_indices=config.fit_symbol_indices,\n        fit_cutoff=config.fit_cutoff,',
                  ),
                  encoding="utf-8",
              )
          replace_once(
              "trade_rl/evaluation/candidate_suite.py",
              '        feature_indices=config.feature_indices,\n        start_index=0,',
              '        feature_indices=config.feature_indices,\n        fit_symbol_indices=config.fit_symbol_indices,\n        start_index=0,',
          )

          # Public runner: names -> indices, immutable result identity.
          replace_once(
              "trade_rl/evaluation/candidate_run.py",
              '        "feature_names",\n        "fit_cutoff",',
              '        "feature_names",\n        "fit_symbol_names",\n        "fit_cutoff",',
          )
          replace_once(
              "trade_rl/evaluation/candidate_run.py",
              '''def _exact_timestamp_index(\n    dataset: MarketDataset,''',
              '''def _fit_symbol_index(dataset: MarketDataset, name: str) -> int:\n    try:\n        return dataset.symbols.index(name)\n    except ValueError as error:\n        raise ValueError(f"unknown fit symbol name: {name}") from error\n\n\ndef _exact_timestamp_index(\n    dataset: MarketDataset,''',
          )
          replace_once(
              "trade_rl/evaluation/candidate_run.py",
              '    feature_names = _required_string_tuple(raw, "feature_names")\n    feature_indices = tuple(_feature_index(dataset, name) for name in feature_names)\n    fit_cutoff = _timestamp(raw, "fit_cutoff")',
              '    feature_names = _required_string_tuple(raw, "feature_names")\n    feature_indices = tuple(_feature_index(dataset, name) for name in feature_names)\n    fit_symbol_names = _required_string_tuple(raw, "fit_symbol_names")\n    fit_symbol_indices = tuple(\n        _fit_symbol_index(dataset, name) for name in fit_symbol_names\n    )\n    fit_cutoff = _timestamp(raw, "fit_cutoff")',
          )
          replace_once(
              "trade_rl/evaluation/candidate_run.py",
              '        feature_indices=feature_indices,\n        fit_cutoff=fit_cutoff,',
              '        feature_indices=feature_indices,\n        fit_symbol_indices=fit_symbol_indices,\n        fit_cutoff=fit_cutoff,',
          )
          replace_once(
              "trade_rl/evaluation/candidate_run.py",
              '''            "feature_indices": list(config.feature_indices),\n            "fit_cutoff": str(config.fit_cutoff),''',
              '''            "feature_indices": list(config.feature_indices),\n            "fit_symbol_names": [\n                dataset.symbols[index] for index in config.fit_symbol_indices\n            ],\n            "fit_symbol_indices": list(config.fit_symbol_indices),\n            "fit_cutoff": str(config.fit_cutoff),''',
          )

          # Keep the lean design contract synchronized with the executable config.
          replace_once(
              "docs/trade_rl_lean_redesign_20260908.md",
              '  "feature_names": ["<feature A>", "<feature B>"],\n  "fit_cutoff":',
              '  "feature_names": ["<feature A>", "<feature B>"],\n  "fit_symbol_names": ["BTCUSDT", "ETHUSDT"],\n  "fit_cutoff":',
          )
          replace_once(
              "docs/trade_rl_lean_redesign_20260908.md",
              'supervised training rowは全銘柄からpoolする。',
              'supervised training rowは事前登録した`fit_symbol_names`の銘柄だけからpoolする。fit scope外の銘柄は学習行へ入れず、評価対象symbolはfit対象と独立に扱う。',
          )
          replace_once(
              "docs/trade_rl_lean_redesign_20260908.md",
              'training episodeはdatasetの銘柄をround-robinで巡回し、各episodeでは一つのactive symbolだけを売買する。これにより一つのpolicyを全銘柄へ共有する。',
              'training episodeは`fit_symbol_names`で指定した銘柄だけをround-robinで巡回し、各episodeでは一つのactive symbolだけを売買する。fit scope外の銘柄は学習episodeへ入れず、同じ凍結policyを評価時に全対象銘柄へ適用する。',
          )
          PY

          uv sync --extra dev
          uv run ruff format \
            trade_rl/strategies/supervised.py \
            trade_rl/strategies/ridge.py \
            trade_rl/strategies/lightgbm.py \
            trade_rl/strategies/ppo.py \
            trade_rl/evaluation/candidate_suite.py \
            trade_rl/evaluation/candidate_run.py
          uv run ruff check \
            trade_rl/strategies/supervised.py \
            trade_rl/strategies/ridge.py \
            trade_rl/strategies/lightgbm.py \
            trade_rl/strategies/ppo.py \
            trade_rl/evaluation/candidate_suite.py \
            trade_rl/evaluation/candidate_run.py \
            tests/strategies/test_supervised_forecast_dataset.py \
            tests/strategies/test_ppo_intent.py \
            tests/evaluation/test_candidate_suite.py \
            tests/evaluation/test_candidate_run_artifact.py
          uv run ruff format --check \
            trade_rl/strategies/supervised.py \
            trade_rl/strategies/ridge.py \
            trade_rl/strategies/lightgbm.py \
            trade_rl/strategies/ppo.py \
            trade_rl/evaluation/candidate_suite.py \
            trade_rl/evaluation/candidate_run.py \
            tests/strategies/test_supervised_forecast_dataset.py \
            tests/strategies/test_ppo_intent.py \
            tests/evaluation/test_candidate_suite.py \
            tests/evaluation/test_candidate_run_artifact.py
          uv run mypy \
            trade_rl/strategies/supervised.py \
            trade_rl/strategies/ridge.py \
            trade_rl/strategies/lightgbm.py \
            trade_rl/strategies/ppo.py \
            trade_rl/evaluation/candidate_suite.py \
            trade_rl/evaluation/candidate_run.py
          uv run pytest -q \
            tests/strategies/test_supervised_forecast_dataset.py \
            tests/strategies/test_ppo_intent.py \
            tests/evaluation/test_candidate_suite.py \
            tests/evaluation/test_candidate_run_artifact.py
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/strategies/supervised.py \
            trade_rl/strategies/ridge.py \
            trade_rl/strategies/lightgbm.py \
            trade_rl/strategies/ppo.py \
            trade_rl/evaluation/candidate_suite.py \
            trade_rl/evaluation/candidate_run.py \
            docs/trade_rl_lean_redesign_20260908.md
          git diff --cached --check
          git commit -m "fix: bind candidate fitting to explicit symbol scope"
          git push origin HEAD:fix/lean-fit-symbol-scope
