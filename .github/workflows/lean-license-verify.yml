name: Lean license contract verification

on:
  push:
    branches:
      - fix/lean-license-contract
    paths:
      - ".github/workflows/lean-license-verify.yml"
      - "LICENSES/**"
      - "tests/test_license_contract.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev

      - name: License contract
        run: uv run pytest -q tests/test_license_contract.py
