  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-optional-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-rl-runtime:
    name: Windows Native RL Runtime
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up runner Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.10"
          enable-cache: true

      - name: Install locked RL optional dependencies
        run: uv sync --locked --extra dev --extra train-sb3 --extra learning-lab

      - name: Verify exact source and native Windows RL imports
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:HEAD_SHA) { throw "Unexpected checkout" }
          uv run --no-sync python -I -c "import os, torch, stable_baselines3, sb3_contrib, lightgbm; assert os.name == 'nt'; assert torch.tensor([1, 2], device='cpu').sum().item() == 3; print(torch.__version__, stable_baselines3.__version__, sb3_contrib.__version__, lightgbm.__version__)"

      - name: Execute native Windows PPO and A2C runtime cases
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows-rl.xml"
          tests/integrations/test_ppo_sb3_runtime.py::test_real_sb3_accepts_environment_and_runs_sequential_rollout
          tests/integrations/test_ppo_sb3_runtime.py::test_untrained_real_sb3_v3_bundle_roundtrip_preserves_policy_and_contract
          tests/integrations/test_a2c_sb3_runtime.py::test_real_cpu_a2c_fit_records_effective_steps_and_scope
          tests/integrations/test_a2c_sb3_runtime.py::test_real_cpu_a2c_fit_bundle_load_roundtrip

      - name: Require all native RL cases without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows-rl.xml 4

  windows-job-object:
    name: Windows Native Job Object
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.10"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dev dependencies
        run: uv sync --locked --extra dev
      - name: Verify native Windows host
        run: uv run --no-sync python -c "import os; assert os.name == 'nt'"
      - name: Execute native Windows Job Object tests
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows.xml"
          tests/tools/tier_d_nonrl/test_process_containment.py::test_assignment_failure_terminates_and_reaps_suspended_process
          tests/tools/tier_d_nonrl/test_process_containment.py::test_job_contains_live_child_after_root_exits_and_cleanup_kills_it

      - name: Require both native Windows cases to execute without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows.xml 2

      - name: Execute native Windows worktree safety tests
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows-worktree.xml"
          tests/tools/test_worktree_hygiene.py::test_open_handle_blocks_removal_on_windows
          tests/tools/test_worktree_hygiene.py::test_windows_case_and_slash_variants_are_equivalent

      - name: Require native Windows worktree cases without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows-worktree.xml 2

      - name: Execute native Windows stopped-arm recovery
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows-recovery.xml"
          tests/tools/tier_d_nonrl/test_task18_recovery_native.py::test_native_stopped_nonrl_receipt_is_retained_and_only_cash_resumes

      - name: Require native stopped-arm recovery to execute without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows-recovery.xml 1

      - name: Execute full-size native Windows late-receipt stop and resume
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows-full-native-recovery.xml"
          tests/tools/tier_d_nonrl/test_task18_native_recovery.py::test_full_size_native_late_receipt_stop_recovery_and_successor

      - name: Require full-size native stopped-arm recovery without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows-full-native-recovery.xml 1

  forecast-gbm:
    name: LightGBM Forecast Optional Extra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up runner Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install locked optional forecast dependencies
        run: uv sync --locked --extra dev --extra forecast-gbm
      - name: Verify LightGBM runtime
        run: uv run --no-sync python -c "import lightgbm; assert lightgbm.__version__ == '4.7.0'"
      - name: Execute optional forecast tests
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-lightgbm.xml"
          tests/strategies/test_lightgbm_forecast.py::test_fit_uses_shared_causal_rows_and_one_shallow_configuration
          tests/strategies/test_lightgbm_forecast.py::test_lightgbm_strategy_uses_shared_forecast_controller

      - name: Require both LightGBM cases to execute without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-lightgbm.xml 2


  history-provenance:
    name: Full History M1 Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout exact full-history source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up runner Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install locked dev dependencies
        run: uv sync --locked --extra dev
      - name: Assert full git checkout
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          test -n "$(git rev-list --max-parents=0 HEAD)"
      - name: Execute all four historical provenance tests without skips
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q -rs --junitxml="$RUNNER_TEMP/m1-history.xml" \
            tests/evaluation/test_paper_code_identity.py::test_the_real_checkout_identity_matches_git_when_history_is_available \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_the_dependency_walk_covers_the_paper_code_and_excludes_the_market_store \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_launch_commit_runs_packet_bound_code \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_heads_pin_the_code_as_of_the_frozen_packet_revision
          uv run --no-sync python -m tools.ci_exact_pytest_counts m1-history.xml 4
