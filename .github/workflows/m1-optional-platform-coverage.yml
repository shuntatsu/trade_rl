name: M1 Optional Platform Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m1-optional-platform-coverage.yml
      - tests/architecture/test_ci_optional_platform_coverage.py
      - tests/tools/tier_d_nonrl/test_process_containment.py
      - tools/tier_d_nonrl/tier_d_process_containment.py
      - tests/evaluation/test_dev_realdata_phase2_trials.py
      - tests/evaluation/test_paper_attempt2_assurance_packet.py
      - tests/evaluation/test_forward_study_seal.py
      - trade_rl/evaluation/experiments/**
      - trade_rl/evaluation/dev_realdata_study/**
      - trade_rl/evaluation/forward_study/**
      - trade_rl/evaluation/paper/**
      - tools/agent_repo/research_assurance.py
      - report/issue810-carry-attempt2-research-assurance-20261105.json
      - trade_rl/data/market.py
      - tools/tier_d_nonrl/tier_d_process_tree.py
      - tools/ci_exact_pytest_counts.py
      - tests/tools/test_ci_exact_pytest_counts.py
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/m1-optional-platform-coverage.yml
      - tests/architecture/test_ci_optional_platform_coverage.py
      - tests/tools/tier_d_nonrl/test_process_containment.py
      - tools/tier_d_nonrl/tier_d_process_containment.py
      - tests/evaluation/test_dev_realdata_phase2_trials.py
      - tests/evaluation/test_paper_attempt2_assurance_packet.py
      - tests/evaluation/test_forward_study_seal.py
      - trade_rl/evaluation/experiments/**
      - trade_rl/evaluation/dev_realdata_study/**
      - trade_rl/evaluation/forward_study/**
      - trade_rl/evaluation/paper/**
      - tools/agent_repo/research_assurance.py
      - report/issue810-carry-attempt2-research-assurance-20261105.json
      - trade_rl/data/market.py
      - tools/tier_d_nonrl/tier_d_process_tree.py
      - tools/ci_exact_pytest_counts.py
      - tests/tools/test_ci_exact_pytest_counts.py
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-optional-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-job-object:
    name: Windows Native Job Object
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dev dependencies
        run: uv sync --locked --extra dev
      - name: Verify native Windows host
        run: uv run --no-sync python -c "import os; assert os.name == 'nt'"
      - name: Execute native Windows Job Object tests
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-windows.xml"
          tests/tools/tier_d_nonrl/test_process_containment.py::test_assignment_failure_terminates_and_reaps_suspended_process
          tests/tools/tier_d_nonrl/test_process_containment.py::test_job_contains_live_child_after_root_exits_and_cleanup_kills_it

      - name: Require both native Windows cases to execute without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-windows.xml 2

  forecast-gbm:
    name: LightGBM Forecast Optional Extra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked optional forecast dependencies
        run: uv sync --locked --extra dev --extra forecast-gbm
      - name: Verify LightGBM runtime
        run: uv run --no-sync python -c "import lightgbm; assert lightgbm.__version__ == '4.7.0'"
      - name: Execute optional forecast tests
        run: >-
          uv run --no-sync python -m pytest -q -rs
          --junitxml="${{ runner.temp }}/m1-lightgbm.xml"
          tests/evaluation/test_dev_realdata_phase2_trials.py::test_lightgbm_signal_ignores_the_future
          tests/evaluation/test_dev_realdata_phase2_trials.py::test_lightgbm_trial_fits_with_the_fixed_parameters

      - name: Require both LightGBM cases to execute without skips
        run: uv run --no-sync python -m tools.ci_exact_pytest_counts m1-lightgbm.xml 2


  history-provenance:
    name: Full History M1 Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact full-history source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dev dependencies
        run: uv sync --locked --extra dev
      - name: Assert full git checkout
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          test -n "$(git rev-list --max-parents=0 HEAD)"
      - name: Execute all four historical provenance tests without skips
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python -m pytest -q -rs --junitxml="$RUNNER_TEMP/m1-history.xml" \
            tests/evaluation/test_forward_study_seal.py::test_the_real_checkout_identity_matches_git_when_history_is_available \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_the_dependency_walk_covers_the_paper_code_and_excludes_the_market_store \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_launch_commit_runs_packet_bound_code \
            tests/evaluation/test_paper_attempt2_assurance_packet.py::test_heads_pin_the_code_as_of_the_frozen_packet_revision
          uv run --no-sync python -m tools.ci_exact_pytest_counts m1-history.xml 4
