name: Main Docker CUDA Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-docker-cuda-verification
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-gpu-training-verification.yml
    with:
      timesteps: 128
      runtime_profile: accelerated
      use_docker: true
      artifact_name: main-docker-cuda-evidence
