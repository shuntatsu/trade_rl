name: Manifest RED format
on:
  push:
    branches: [fix/binance-vision-daily-repair-v1]
    paths: [.github/workflows/manifest-red-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/evaluation/experiments/bootstrap/test_manifest_resolution.py
          git rm .github/workflows/manifest-red-format.yml
          uv run ruff check tests/evaluation/experiments/bootstrap/test_manifest_resolution.py
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_manifest_resolution.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format bootstrap manifest RED contract"
          git push origin HEAD:refs/heads/fix/binance-vision-daily-repair-v1
