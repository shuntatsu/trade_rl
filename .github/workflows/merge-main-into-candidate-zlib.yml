name: Merge latest main into candidate zlib fix

on:
  push:
    branches: [fix/candidate-returns-zlib-normalization]
    paths: [.github/workflows/merge-main-into-candidate-zlib.yml]

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Retire helper, merge exact main, and verify net scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "425095a276a40fd731d60128c444962f2842b359"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/merge-main-into-candidate-zlib.yml
          git commit -m "chore: retire main merge helper"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "00cc2c344d541f7b58dfe3281d5641865bfbdb66"
          git merge --no-ff --no-edit origin/main
          actual="$(git diff --name-only origin/main...HEAD)"
          expected=$'tests/evaluation/test_candidate_run_malformed_archive_errors.py\ntrade_rl/evaluation/runs/artifact.py'
          test "$actual" = "$expected"
          test ! -e .github/workflows/merge-main-into-candidate-zlib.yml
          git push origin HEAD:refs/heads/fix/candidate-returns-zlib-normalization
