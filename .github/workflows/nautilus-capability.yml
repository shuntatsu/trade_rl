name: Nautilus Capability

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "trade_rl/integrations/nautilus/**"
      - "trade_rl/simulation/execution_canonicalization.py"
      - "trade_rl/simulation/legacy_execution_probe.py"
      - "trade_rl/simulation/legacy_trace_adapter.py"
      - "tests/integrations/test_nautilus_*.py"
      - "tools/nautilus_execution_probe_digest.py"
      - ".github/workflows/nautilus-capability.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "trade_rl/integrations/nautilus/**"
      - "trade_rl/simulation/execution_canonicalization.py"
      - "trade_rl/simulation/legacy_execution_probe.py"
      - "trade_rl/simulation/legacy_trace_adapter.py"
      - "tests/integrations/test_nautilus_*.py"
      - "tools/nautilus_execution_probe_digest.py"
      - ".github/workflows/nautilus-capability.yml"

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install exact Nautilus runtime
        run: uv sync --extra dev --extra nautilus --frozen
      - name: Record runtime identity
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import platform
          import sys

          version = importlib.metadata.version("nautilus_trader")
          assert version == "1.230.0", version
          print(f"nautilus_trader={version}")
          print(f"python={platform.python_version()}")
          print(f"platform={sys.platform}-{platform.machine().lower()}")
          PY
      - name: Exercise import-safe Nautilus adapters
        run: |
          uv run pytest -q -m nautilus \
            tests/integrations/test_nautilus_instrument.py \
            tests/integrations/test_nautilus_quote_projection.py \
            tests/integrations/test_nautilus_derivative_data.py \
            tests/integrations/test_nautilus_order_adapter.py
      - name: Probe BacktestEngine in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_capability.py
      - name: Replay projected quotes in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_quote_replay.py
      - name: Exercise order lifecycle in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_order_lifecycle.py
      - name: Lock native funding limitation in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_funding_settlement.py
      - name: Record execution accounting in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_execution_probe.py
      - name: Compare legacy and Nautilus conformance in isolated process
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_dual_shadow.py
      - name: Verify deterministic execution digest across fresh processes
        shell: bash
        run: |
          set -euo pipefail
          first="$(uv run python tools/nautilus_execution_probe_digest.py | tail -n 1)"
          second="$(uv run python tools/nautilus_execution_probe_digest.py | tail -n 1)"
          third="$(uv run python tools/nautilus_execution_probe_digest.py | tail -n 1)"
          test "$first" = "$second"
          test "$second" = "$third"
          test "${#first}" -eq 64
          printf 'execution_digest=%s\n' "$first"
