name: Nautilus Capability

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "trade_rl/integrations/nautilus/**"
      - "tests/integrations/test_nautilus_*.py"
      - ".github/workflows/nautilus-capability.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "trade_rl/integrations/nautilus/**"
      - "tests/integrations/test_nautilus_*.py"
      - ".github/workflows/nautilus-capability.yml"

permissions:
  contents: read

jobs:
  capability:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install exact Nautilus runtime
        run: uv sync --extra dev --extra nautilus --frozen
      - name: Record runtime identity
        run: |
          uv run python - <<'PY'
          import importlib.metadata
          import platform
          import sys

          version = importlib.metadata.version("nautilus_trader")
          assert version == "1.230.0", version
          print(f"nautilus_trader={version}")
          print(f"python={platform.python_version()}")
          print(f"platform={sys.platform}-{platform.machine().lower()}")
          PY
      - name: Exercise Nautilus integration contract
        run: uv run pytest -q -m nautilus tests/integrations/test_nautilus_*.py
