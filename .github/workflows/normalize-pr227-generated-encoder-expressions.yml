name: Finalize PR227 Policy Identity

on:
  push:
    branches:
      - agent/cross-timeframe-attention

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-pr227-policy-identity
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Connect policy identity to assembly and checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          assembly_path = "trade_rl/integrations/sb3_model_assembly.py"
          replace_once(
              assembly_path,
              """    uses_shared_asset_actor: bool\n    rollout_buffer_class: object | None = None\n""",
              """    uses_shared_asset_actor: bool\n    observation_encoder: str\n    sequence_symbols: tuple[str, ...] | None\n    sequence_action_names: tuple[str, ...] | None\n    rollout_buffer_class: object | None = None\n""",
          )
          replace_once(
              assembly_path,
              """    uses_shared_asset_actor = False\n    rollout_buffer_class: object | None = None\n""",
              """    uses_shared_asset_actor = False\n    sequence_symbols: tuple[str, ...] | None = None\n    sequence_action_names: tuple[str, ...] | None = None\n    rollout_buffer_class: object | None = None\n""",
          )
          replace_once(
              assembly_path,
              """        ) = _sequence_policy_assembly(\n            probe=probe,\n            identity=identity,\n            config=config,\n        )\n        rollout_buffer_class = IndexBackedDictRolloutBuffer\n""",
              """        ) = _sequence_policy_assembly(\n            probe=probe,\n            identity=identity,\n            config=config,\n        )\n        unwrapped: Any = getattr(probe, \"unwrapped\", probe)\n        dataset = getattr(unwrapped, \"dataset\", None)\n        raw_symbols = getattr(dataset, \"symbols\", None)\n        if (\n            not isinstance(raw_symbols, (tuple, list))\n            or not raw_symbols\n            or any(not isinstance(item, str) or not item for item in raw_symbols)\n        ):\n            raise ValueError(\"sequence training requires ordered dataset symbols\")\n        sequence_symbols = tuple(raw_symbols)\n        sequence_action_names = _action_names(identity)\n        rollout_buffer_class = IndexBackedDictRolloutBuffer\n""",
          )
          replace_once(
              assembly_path,
              """        uses_shared_asset_actor=uses_shared_asset_actor,\n        rollout_buffer_class=rollout_buffer_class,\n""",
              """        uses_shared_asset_actor=uses_shared_asset_actor,\n        observation_encoder=config.observation_encoder,\n        sequence_symbols=sequence_symbols,\n        sequence_action_names=sequence_action_names,\n        rollout_buffer_class=rollout_buffer_class,\n""",
          )
          replace_once(
              assembly_path,
              """    common = _common_model_kwargs(\n        seed=seed,\n        config=config,\n        algorithm_config=algorithm_config,\n        policy=policy,\n        verbose=verbose,\n        output_root=output_root,\n    )\n    if isinstance(algorithm_config, PPOConfig):\n""",
              """    common = _common_model_kwargs(\n        seed=seed,\n        config=config,\n        algorithm_config=algorithm_config,\n        policy=policy,\n        verbose=verbose,\n        output_root=output_root,\n    )\n\n    from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity\n\n    def _bind_identity(model: Any) -> Any:\n        bind_sb3_policy_identity(model, policy)\n        return model\n\n    if isinstance(algorithm_config, PPOConfig):\n""",
          )
          replace_once(assembly_path, "            return model\n", "            return _bind_identity(model)\n")
          replace_once(
              assembly_path,
              """            constructor = CostCriticPPO\n            return constructor(\n                policy.policy_identifier,\n                environment,\n                cost_schema=algorithm_config.cost_schema,\n                cost_learning_rate=algorithm_config.cost_learning_rate,\n                cost_n_epochs=algorithm_config.cost_n_epochs,\n                cost_batch_size=algorithm_config.cost_batch_size,\n                cost_continuous_hidden_dims=(\n                    algorithm_config.cost_continuous_hidden_dims\n                ),\n                cost_event_hidden_dims=algorithm_config.cost_event_hidden_dims,\n                cost_max_grad_norm=algorithm_config.cost_max_grad_norm,\n                **ppo_kwargs,\n            )\n""",
              """            constructor = CostCriticPPO\n            model = constructor(\n                policy.policy_identifier,\n                environment,\n                cost_schema=algorithm_config.cost_schema,\n                cost_learning_rate=algorithm_config.cost_learning_rate,\n                cost_n_epochs=algorithm_config.cost_n_epochs,\n                cost_batch_size=algorithm_config.cost_batch_size,\n                cost_continuous_hidden_dims=(\n                    algorithm_config.cost_continuous_hidden_dims\n                ),\n                cost_event_hidden_dims=algorithm_config.cost_event_hidden_dims,\n                cost_max_grad_norm=algorithm_config.cost_max_grad_norm,\n                **ppo_kwargs,\n            )\n            return _bind_identity(model)\n""",
          )
          replace_once(
              assembly_path,
              "        return constructor(policy.policy_identifier, environment, **ppo_kwargs)\n",
              "        return _bind_identity(\n            constructor(policy.policy_identifier, environment, **ppo_kwargs)\n        )\n",
          )
          replace_once(
              assembly_path,
              "    return constructor(policy.policy_identifier, environment, **off_policy)\n",
              "    return _bind_identity(\n        constructor(policy.policy_identifier, environment, **off_policy)\n    )\n",
          )

          checkpoint_path = "trade_rl/rl/checkpointing.py"
          replace_once(
              checkpoint_path,
              """def _model_algorithm_identity(model: SavablePolicy) -> dict[str, object] | None:\n    provider = getattr(model, \"checkpoint_identity_payload\", None)\n    if provider is None:\n        return None\n    if not callable(provider):\n        raise TypeError(\"checkpoint_identity_payload must be callable\")\n    raw = provider()\n    if raw is None:\n        return None\n    if not isinstance(raw, dict) or not raw:\n        raise ValueError(\"checkpoint algorithm identity must be a non-empty object\")\n    if any(not isinstance(key, str) or not key for key in raw):\n        raise ValueError(\"checkpoint algorithm identity keys must be non-empty strings\")\n    payload = dict(raw)\n    canonical_json_bytes(payload)\n    return payload\n\n\n""",
              """def _model_algorithm_identity(model: SavablePolicy) -> dict[str, object] | None:\n    provider = getattr(model, \"checkpoint_identity_payload\", None)\n    if provider is None:\n        return None\n    if not callable(provider):\n        raise TypeError(\"checkpoint_identity_payload must be callable\")\n    raw = provider()\n    if raw is None:\n        return None\n    if not isinstance(raw, dict) or not raw:\n        raise ValueError(\"checkpoint algorithm identity must be a non-empty object\")\n    if any(not isinstance(key, str) or not key for key in raw):\n        raise ValueError(\"checkpoint algorithm identity keys must be non-empty strings\")\n    payload = dict(raw)\n    canonical_json_bytes(payload)\n    return payload\n\n\ndef checkpoint_identity_payload_for_model(\n    model: SavablePolicy,\n) -> dict[str, object] | None:\n    \"\"\"Compose the bound policy identity with any algorithm-specific identity.\"\"\"\n\n    from trade_rl.integrations.sb3_policy_identity import model_sb3_policy_identity\n\n    policy_identity = model_sb3_policy_identity(model)\n    algorithm_identity = _model_algorithm_identity(model)\n    if policy_identity is None:\n        return algorithm_identity\n    payload: dict[str, object] = {\n        \"schema_version\": \"sb3_checkpoint_identity_v2\",\n        \"policy\": policy_identity,\n        \"algorithm\": algorithm_identity,\n    }\n    canonical_json_bytes(payload)\n    return payload\n\n\n""",
          )
          replace_once(
              checkpoint_path,
              "    algorithm_identity = _model_algorithm_identity(model)\n",
              "    algorithm_identity = checkpoint_identity_payload_for_model(model)\n",
          )
          replace_once(
              checkpoint_path,
              """    \"build_checkpoint_callback\",\n    \"checkpoint_manifests\",\n""",
              """    \"build_checkpoint_callback\",\n    \"checkpoint_identity_payload_for_model\",\n    \"checkpoint_manifests\",\n""",
          )

          load_path = "trade_rl/integrations/sb3_checkpoint_assembly.py"
          replace_once(
              load_path,
              """    CheckpointManifest,\n    load_checkpoint_manifest,\n    validate_checkpoint_algorithm_identity,\n""",
              """    CheckpointManifest,\n    checkpoint_identity_payload_for_model,\n    load_checkpoint_manifest,\n    validate_checkpoint_algorithm_identity,\n""",
          )
          replace_once(
              load_path,
              """def _checkpoint_algorithm_identity(\n    model: object,\n    algorithm_config: AlgorithmConfig,\n) -> dict[str, object] | None:\n    if not isinstance(algorithm_config, CostCriticPPOConfig):\n        return None\n    provider = getattr(model, \"checkpoint_identity_payload\", None)\n    if not callable(provider):\n        raise TypeError(\"checkpoint_identity_payload must be callable\")\n    value = provider()\n    if not isinstance(value, dict) or not value:\n        raise ValueError(\"checkpoint algorithm identity must be a non-empty object\")\n    return value\n""",
              """def _checkpoint_algorithm_identity(\n    model: object,\n    algorithm_config: AlgorithmConfig,\n) -> dict[str, object] | None:\n    del algorithm_config\n    return checkpoint_identity_payload_for_model(model)\n""",
          )
          replace_once(
              load_path,
              """    if int(model.num_timesteps) != manifest.observed_timestep:\n        raise ValueError(\"checkpoint timestep identity mismatch\")\n    if isinstance(algorithm_config, CostCriticPPOConfig):\n        loaded_identity = _checkpoint_algorithm_identity(model, algorithm_config)\n        validate_checkpoint_algorithm_identity(manifest, loaded_identity)\n""",
              """    if int(model.num_timesteps) != manifest.observed_timestep:\n        raise ValueError(\"checkpoint timestep identity mismatch\")\n    from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity\n\n    bind_sb3_policy_identity(model, policy)\n    loaded_identity = _checkpoint_algorithm_identity(model, algorithm_config)\n    validate_checkpoint_algorithm_identity(manifest, loaded_identity)\n""",
          )
          PY

      - name: Verify policy identity integration
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest -q \
            tests/integrations/test_sb3_policy_identity_v2.py \
            tests/integrations/test_sb3_checkpoint_assembly.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/integrations/test_sb3_model_construction.py \
            tests/rl/test_cost_checkpoint_identity.py \
            tests/rl/test_lagrangian_checkpoint_identity.py

      - name: Publish verified identity integration and remove one-shot workflow
        run: |
          rm -f \
            .github/workflows/normalize-pr227-generated-encoder-expressions.yml \
            docs/verification/.normalize-pr227-generated-expressions-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bind sequence architecture identity to SB3 checkpoints'
          git push origin HEAD:agent/cross-timeframe-attention

      - name: Report failure details to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 227 --body "Policy identity integration failed in run ${GITHUB_RUN_ID}."
