name: One-shot align operator docs v4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Align maintained schema references
        run: |
          sed -i 's/training_run_config_v3/training_run_config_v4/g' \
            START.md \
            docs/operations/docker-gpu-full-training.md \
            tests/test_current_documentation_contract.py
          sed -i 's/必要なv3 Field/必要なv4 Field/g' START.md
          git diff --check
      - name: Verify aligned references
        run: |
          grep -q 'training_run_config_v4' START.md
          ! grep -q 'training_run_config_v3' START.md
          grep -q 'training_run_config_v4' docs/operations/docker-gpu-full-training.md
          ! grep -q 'training_run_config_v3' docs/operations/docker-gpu-full-training.md
          grep -q 'assert "training_run_config_v4" in text' tests/test_current_documentation_contract.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-align-operator-docs-v4.yml
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align operator runbooks with training config v4"
          git push origin HEAD:${{ github.head_ref }}
