name: One-shot finalize training config v4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Restore unrelated lockfile
        run: git checkout origin/main -- uv.lock
      - name: Replace pseudo execution field with valid JSON
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CONFIGURATION.md")
          text = path.read_text()
          old = '  "execution": {"all_ExecutionCostConfig_fields": "required"},'
          new = '''  "execution": {
            "fee_rate": 0.0005,
            "maker_fee_rate": 0.0,
            "taker_fee_rate": 0.0,
            "spread_rate": 0.0002,
            "impact_rate": 0.0001,
            "multiplier": 1.0,
            "max_participation_rate": 0.05,
            "slippage_std": 0.0,
            "tail_slippage_probability": 0.0,
            "tail_slippage_multiplier": 5.0,
            "random_seed": 0,
            "minimum_notional": 0.0,
            "lot_size": 0.0,
            "tick_size": 0.0,
            "allow_short": true,
            "borrow_rate_multiplier": 1.0,
            "max_leverage": 1.0,
            "maintenance_margin_rate": 0.25,
            "collateral_haircut": 1.0,
            "margin_mode": "cross",
            "order_latency_bars": 0,
            "order_type": "market",
            "limit_offset_rate": 0.0005,
            "path_mode": "conservative",
            "processing_bar_volume_capacity": true,
            "partial_fill_carry": true,
            "trigger_volume_fractions": [1.0, 0.5, 0.25, 0.0]
          },'''
          if old not in text:
              raise SystemExit("pseudo execution field not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify documentation and diff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          text = Path("docs/CONFIGURATION.md").read_text()
          assert "all_ExecutionCostConfig_fields" not in text
          start = text.index("```json\n") + len("```json\n")
          end = text.index("\n```", start)
          payload = json.loads(text[start:end])
          assert payload["schema_version"] == "training_run_config_v4"
          assert len(payload["execution"]) == 27
          assert payload["environment"]["require_full_reward_preroll"] is True
          PY
          git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-finalize-training-config-v4.yml
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize explicit training config v4 contract"
          git push origin HEAD:${{ github.head_ref }}
