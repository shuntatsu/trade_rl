name: One-shot prune PostgreSQL adapter branch 20260801

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  prune:
    if: github.event.pull_request.head.ref == 'maintenance/prune-postgres-adapter-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all non-main branches and close this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          cleanup_branch = event["pull_request"]["head"]["ref"]
          pr_number = int(event["pull_request"]["number"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trade-rl-branch-pruner",
          }

          def request(method: str, path: str, payload: dict | None = None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}{path}", data=data, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return response.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"{method} {path} failed with HTTP {exc.code}: {body}"
                  ) from exc

          _, payload = request("GET", f"/repos/{repo}/branches?per_page=100")
          branches = [item["name"] for item in payload]
          targets = sorted(
              name for name in branches if name not in {"main", cleanup_branch}
          )
          print(json.dumps({"inventory": branches, "targets": targets}))

          for name in targets:
              encoded = urllib.parse.quote(name, safe="")
              request("DELETE", f"/repos/{repo}/git/refs/heads/{encoded}")
              print(f"deleted: {name}")

          request("PATCH", f"/repos/{repo}/pulls/{pr_number}", {"state": "closed"})
          encoded_cleanup = urllib.parse.quote(cleanup_branch, safe="")
          request("DELETE", f"/repos/{repo}/git/refs/heads/{encoded_cleanup}")
          print(f"deleted cleanup branch: {cleanup_branch}")
          PY
