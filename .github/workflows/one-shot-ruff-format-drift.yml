name: One-shot Ruff Format Drift

on:
  push:
    branches:
      - chore/ruff-format-drift

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: chore/ruff-format-drift
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install formatter
        run: uv sync --extra dev

      - name: Apply and verify Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format .
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '\.py$'; then
            echo "formatter touched a non-Python file" >&2
            exit 1
          fi
          uv run ruff check --diff .
          uv run ruff format --check .

      - name: Remove one-shot workflow and commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-ruff-format-drift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: apply repository Ruff formatting"
          git push origin HEAD:chore/ruff-format-drift
