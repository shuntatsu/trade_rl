name: Oracle Bellman GPU

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/oracle-bellman-gpu.yml
      - trade_rl/learning/oracle_bellman_contracts.py
      - trade_rl/learning/oracle_bellman_numpy.py
      - trade_rl/learning/oracle_bellman_torch.py
      - trade_rl/learning/oracle_market_tape.py
      - trade_rl/learning/oracle_solver.py
      - trade_rl/learning/oracle_transition_numpy.py
      - trade_rl/learning/oracle_transition_torch.py
      - trade_rl/learning/episode_oracle_teacher.py
      - trade_rl/operations/oracle_teacher_benchmark.py
      - tests/learning/test_oracle_bellman_numpy.py
      - tests/learning/test_oracle_bellman_torch.py
      - tests/learning/test_oracle_solver.py
      - tests/learning/test_oracle_transition_numpy.py
      - tests/operations/test_oracle_teacher_benchmark.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-bellman-gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  EVIDENCE_ROOT: var/benchmarks/oracle-bellman-gpu

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner
    environment: gpu-full-training
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 360
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Capture source and GPU identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/results"
          tested_commit="$(git rev-parse HEAD)"
          expected_commit="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested_commit" = "$expected_commit"
          printf '%s\n' "$tested_commit" > "$EVIDENCE_ROOT/tested-commit.txt"
          nvidia-smi | tee "$EVIDENCE_ROOT/nvidia-smi.txt"
          nvidia-smi \
            --query-gpu=name,driver_version,memory.total,compute_cap \
            --format=csv,noheader \
            | tee "$EVIDENCE_ROOT/gpu-device.csv"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install exact dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Require CUDA
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee "$EVIDENCE_ROOT/torch-device.txt"
          import torch

          assert torch.cuda.is_available(), "maintained runner must expose CUDA"
          print(f"torch={torch.__version__}")
          print(f"cuda={torch.version.cuda}")
          print(f"device={torch.cuda.get_device_name(0)}")
          print(f"capability={torch.cuda.get_device_capability(0)}")
          PY

      - name: Run CUDA correctness corpus
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q -vv \
            tests/learning/test_oracle_bellman_torch.py \
            -k cuda_solver_matches_numpy_reference \
            | tee "$EVIDENCE_ROOT/cuda-parity.log"
          uv run pytest -q \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_bellman_numpy.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_episode_teacher_integration.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            | tee "$EVIDENCE_ROOT/correctness-corpus.log"

      - name: Run matched backend benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for horizon in 128 2880; do
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend all \
              --episode-count 8 \
              --episode-bars "$horizon" \
              --repetitions 5 \
              --episode-batch-size 8 \
              --target-state-block-size 3 \
              --compile-chunk-size 16 \
              --output "$EVIDENCE_ROOT/results/matched-h${horizon}.json"
          done

      - name: Run batch-size sweep
        shell: bash
        run: |
          set -euo pipefail
          for horizon in 128 2880; do
            if test "$horizon" = 128; then
              episode_count=32
            else
              episode_count=8
            fi
            for batch in 1 4 8 16 32; do
              for backend in numpy_batched torch_cuda_eager; do
                uv run python -m trade_rl.operations.oracle_teacher_benchmark \
                  --backend "$backend" \
                  --episode-count "$episode_count" \
                  --episode-bars "$horizon" \
                  --repetitions 3 \
                  --episode-batch-size "$batch" \
                  --target-state-block-size 3 \
                  --compile-chunk-size 16 \
                  --output "$EVIDENCE_ROOT/results/batch-h${horizon}-b${batch}-${backend}.json"
              done
            done
          done

      - name: Run compiled chunk sweep
        shell: bash
        run: |
          set -euo pipefail
          for chunk in 8 16 32 64; do
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend torch_cuda_compiled \
              --episode-count 32 \
              --episode-bars 128 \
              --repetitions 3 \
              --episode-batch-size 32 \
              --target-state-block-size 3 \
              --compile-chunk-size "$chunk" \
              --output "$EVIDENCE_ROOT/results/compiled-h128-c${chunk}.json"
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend torch_cuda_compiled \
              --episode-count 8 \
              --episode-bars 2880 \
              --repetitions 3 \
              --episode-batch-size 8 \
              --target-state-block-size 3 \
              --compile-chunk-size "$chunk" \
              --output "$EVIDENCE_ROOT/results/compiled-h2880-c${chunk}.json"
          done

      - name: Validate and summarize evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from collections import defaultdict
          from pathlib import Path

          root = Path("var/benchmarks/oracle-bellman-gpu")
          result_paths = sorted((root / "results").glob("*.json"))
          assert result_paths, "benchmark results are missing"
          records: list[dict[str, object]] = []
          for path in result_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              values = payload if isinstance(payload, list) else [payload]
              for value in values:
                  assert value["schema_version"] == "oracle_teacher_benchmark_v2"
                  assert len(value["output_digest"]) == 64
                  value["evidence_file"] = path.name
                  records.append(value)

          groups: dict[tuple[int, int, int, int], set[str]] = defaultdict(set)
          for value in records:
              case = value["case"]
              key = (
                  int(case["episode_count"]),
                  int(case["episode_bars"]),
                  int(case["state_count"]),
                  int(case["symbol_count"]),
              )
              groups[key].add(str(value["output_digest"]))
          mismatches = {key: digests for key, digests in groups.items() if len(digests) != 1}
          assert not mismatches, f"cross-backend digest mismatch: {mismatches}"

          def median(record: dict[str, object]) -> float:
              summary = record["steady_summary"]
              assert isinstance(summary, dict)
              return float(summary["median_seconds"])

          matched = [
              value for value in records if str(value["evidence_file"]).startswith("matched-")
          ]
          matched.sort(key=lambda value: (int(value["case"]["episode_bars"]), str(value["backend"])))
          lines = [
              "# Oracle Bellman GPU evidence",
              "",
              f"Tested commit: `{(root / 'tested-commit.txt').read_text().strip()}`",
              f"GPU: `{(root / 'gpu-device.csv').read_text().strip()}`",
              "",
              "| Horizon | Backend | Median steady wall (s) | Actual compile | Allocated / reserved bytes |",
              "|---:|---|---:|---|---:|",
          ]
          for value in matched:
              metadata = value["metadata"]
              allocated = value["peak_device_allocated_bytes"]
              reserved = value["peak_device_reserved_bytes"]
              memory = "—" if allocated is None else f"{int(allocated):,} / {int(reserved):,}"
              lines.append(
                  f"| {value['case']['episode_bars']} | {value['backend']} | {median(value):.6f} | "
                  f"{metadata.get('actual_compile_mode')} | {memory} |"
              )
          lines.extend(
              [
                  "",
                  "All comparable workloads produced identical target/final-score payload digests.",
                  "The removed pre-refactor implementation is not represented as measured; `legacy_numpy` is the maintained serial compatibility route.",
              ]
          )
          (root / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          digest = hashlib.sha256()
          for path in result_paths:
              digest.update(path.name.encode("utf-8"))
              digest.update(path.read_bytes())
          (root / "evidence-sha256.txt").write_text(digest.hexdigest() + "\n", encoding="utf-8")
          PY
          test -s "$EVIDENCE_ROOT/summary.md"
          cat "$EVIDENCE_ROOT/summary.md"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oracle-bellman-gpu-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
