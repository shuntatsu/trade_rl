name: Oracle benchmark TDD

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/oracle-benchmark-tdd.yml"
      - "trade_rl/operations/oracle_teacher_benchmark.py"
      - "tests/operations/test_oracle_teacher_benchmark.py"

permissions:
  contents: read

concurrency:
  group: oracle-benchmark-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install test environment
        run: uv sync --extra dev --extra train-sb3
      - name: Run Oracle benchmark contract tests
        run: uv run pytest -q tests/operations/test_oracle_teacher_benchmark.py
