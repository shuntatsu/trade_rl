name: Oracle market tape targeted check

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/oracle-market-tape-targeted-temporary.yml"
      - "trade_rl/learning/oracle_market_tape.py"
      - "tests/learning/test_oracle_market_tape.py"

permissions:
  contents: read

jobs:
  targeted-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Pytest
        run: uv run pytest -q tests/learning/test_oracle_market_tape.py tests/learning/test_oracle_teacher.py
      - name: Ruff
        run: uv run ruff check trade_rl/learning/oracle_market_tape.py tests/learning/test_oracle_market_tape.py
      - name: Format
        run: uv run ruff format --check --diff trade_rl/learning/oracle_market_tape.py tests/learning/test_oracle_market_tape.py
      - name: Mypy
        run: uv run mypy trade_rl/learning/oracle_market_tape.py
      # User-authored rerun after the formatter bot commit.
