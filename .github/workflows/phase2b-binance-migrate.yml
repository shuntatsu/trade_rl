name: Phase 2B Binance migration

on:
  push:
    branches:
      - refactor/lean-binance-adapter-boundaries
    paths:
      - ".github/workflows/phase2b-binance-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/lean-binance-adapter-boundaries
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev

      - name: Baseline Binance integration behavior
        run: uv run pytest -q tests/integrations

      - name: Apply exhaustive Binance split
        run: uv run python scripts/phase2b_binance_migrate.py

      - name: Normalize changed Python imports and formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix --select I trade_rl/integrations tests/integrations tests/architecture/test_lean_binance_layout.py
          uv run ruff format trade_rl/integrations tests/integrations tests/architecture/test_lean_binance_layout.py

      - name: Focused Binance verification
        run: >-
          uv run pytest -q
          tests/integrations
          tests/architecture/test_lean_binance_layout.py
          tests/data/test_complete_96_feature_dataset.py

      - name: Ruff
        run: uv run ruff check trade_rl tests

      - name: Format
        run: uv run ruff format --check trade_rl tests

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Full tests
        run: uv run pytest -q tests

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

      - name: Verify final migration tree before commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e trade_rl/integrations/binance.py
          test ! -e trade_rl/integrations/binance_cache.py
          test ! -e trade_rl/integrations/frozen_binance_metadata.py
          for path in __init__.py types.py vision.py cache.py metadata.py transport.py dataset.py; do
            test -f "trade_rl/integrations/binance/$path"
          done
          ! grep -R --line-number --include='*.py' \
            -e 'trade_rl.integrations.binance_cache' \
            -e 'trade_rl.integrations.frozen_binance_metadata' \
            trade_rl tests
          git diff --check

      - name: Commit verified migration and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2b-binance-migrate.yml scripts/phase2b_binance_migrate.py
          git add -A
          git diff --cached --check
          git commit -m "refactor: split lean Binance adapter boundaries"
          git push origin HEAD:refactor/lean-binance-adapter-boundaries
