name: Phase 2B Binance Migration

on:
  push:
    branches:
      - refactor/lean-binance-adapter-boundaries

permissions:
  contents: write

concurrency:
  group: phase2b-binance-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply exhaustive Binance split
        run: python scripts/phase2b_migrate_binance.py

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Normalize generated Binance package only
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix --select F401,I001 trade_rl/integrations/binance
          uv run ruff format trade_rl/integrations/binance

      - name: Fix import order for rewritten consumers only
        run: uv run ruff check --fix --select I001 trade_rl tests

      - name: Ruff
        run: uv run ruff check trade_rl tests

      - name: Format
        run: uv run ruff format --check trade_rl tests

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Focused Binance tests
        run: uv run pytest -q tests/integrations tests/data/test_binance_contract_metadata.py tests/data/test_complete_96_feature_dataset.py tests/architecture/test_lean_binance_layout.py

      - name: Full tests
        run: uv run pytest -q tests

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

      - name: Commit verified split
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "refactor: split lean Binance adapter responsibilities"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
