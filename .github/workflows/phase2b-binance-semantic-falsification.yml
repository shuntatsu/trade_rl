name: Phase 2B Binance semantic falsification

on:
  push:
    branches:
      - refactor/lean-binance-adapter-boundaries
    paths:
      - ".github/workflows/phase2b-binance-semantic-falsification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch exact Phase 2A base
        run: git fetch --no-tags --depth=1 origin 343c8af5dfcea8a472ccc44ef2b617ea7f4d0c68

      - name: Compare moved definition AST and constants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          BASE = "343c8af5dfcea8a472ccc44ef2b617ea7f4d0c68"
          ROOT = Path.cwd()

          OLD_BINANCE = "trade_rl/integrations/binance.py"
          OLD_CACHE = "trade_rl/integrations/binance_cache.py"
          OLD_FROZEN = "trade_rl/integrations/frozen_binance_metadata.py"

          mapping = {
              OLD_BINANCE: {
                  "types.py": (
                      "BinanceMarket", "BinanceTransportMode", "BinanceTransportError",
                      "BinanceUnsupportedContractError", "_market", "_mode", "_aware_utc",
                      "_finite_float",
                  ),
                  "cache.py": ("validate_cached_vision_payload",),
                  "metadata.py": (
                      "_freeze_json", "_freeze_json_object", "_mutable_json",
                      "_mutable_json_object", "BinanceInstrumentMetadata",
                      "BinanceExchangeInfoSnapshot", "_filter_value",
                      "_metadata_from_exchange_info",
                  ),
                  "vision.py": (
                      "_epoch_ms", "_normalize_epoch_ms", "_interval_ms", "_day_floor_ms",
                      "_iter_days", "_iter_months", "vision_kline_url",
                      "vision_monthly_kline_url", "_next_month", "plan_vision_kline_urls",
                      "vision_funding_url", "_csv_rows_from_zip", "_looks_like_header",
                  ),
                  "transport.py": ("BinancePublicTransport",),
                  "dataset.py": (
                      "BinanceDatasetBuildResult", "_parse_kline_rows", "_align_funding",
                      "BinanceMarketDataSource", "_optional_values", "_optional_datetimes",
                      "_extended_timeframe_feature_definitions",
                      "binance_multitimeframe_feature_specs", "_default_features",
                      "build_binance_market_dataset",
                  ),
              },
              OLD_CACHE: {
                  "cache.py": (
                      "_VisionArchiveTransport", "BinanceVisionCachePlan",
                      "BinanceVisionCacheReport", "_ordered_nonempty", "_official_urls",
                      "_next_month", "plan_binance_vision_cache", "vision_cache_path",
                      "inspect_binance_vision_urls", "inspect_binance_vision_cache",
                      "require_complete_binance_vision_cache", "sync_binance_vision_urls",
                      "sync_binance_vision_cache",
                  ),
              },
              OLD_FROZEN: {
                  "metadata.py": (
                      "_ExchangeInfoTransport", "_require_mapping", "_require_non_empty",
                      "_parse_utc", "FrozenBinanceExchangeInfoTransport",
                  ),
              },
          }

          def old_text(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{BASE}:{path}"], text=True
              )

          def definitions(text: str) -> dict[str, ast.AST]:
              tree = ast.parse(text)
              return {
                  node.name: node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
              }

          old_defs = {path: definitions(old_text(path)) for path in mapping}
          new_defs = {
              name: definitions(
                  (ROOT / "trade_rl" / "integrations" / "binance" / name).read_text(
                      encoding="utf-8"
                  )
              )
              for name in ("types.py", "vision.py", "cache.py", "metadata.py", "transport.py", "dataset.py")
          }

          expected_old = 41 + 14 + 5
          observed_old = sum(len(value) for value in old_defs.values())
          assert observed_old == expected_old, (observed_old, expected_old)

          compared = 0
          for old_path, owners in mapping.items():
              for owner, names in owners.items():
                  for name in names:
                      old_node = old_defs[old_path][name]
                      new_node = new_defs[owner][name]
                      if old_path == OLD_CACHE and name in {
                          "sync_binance_vision_urls", "sync_binance_vision_cache"
                      }:
                          # The only authorized definition-level semantic-neutral change:
                          # concrete BinancePublicTransport is removed from the transport
                          # annotation. Parameter names/defaults and executable body must match.
                          assert isinstance(old_node, (ast.FunctionDef, ast.AsyncFunctionDef))
                          assert isinstance(new_node, (ast.FunctionDef, ast.AsyncFunctionDef))
                          old_args = old_node.args
                          new_args = new_node.args
                          assert [a.arg for a in old_args.args] == [a.arg for a in new_args.args]
                          assert [a.arg for a in old_args.kwonlyargs] == [a.arg for a in new_args.kwonlyargs]
                          assert [ast.dump(v) for v in old_args.defaults] == [ast.dump(v) for v in new_args.defaults]
                          assert [None if v is None else ast.dump(v) for v in old_args.kw_defaults] == [None if v is None else ast.dump(v) for v in new_args.kw_defaults]
                          assert ast.dump(ast.Module(body=old_node.body, type_ignores=[])) == ast.dump(ast.Module(body=new_node.body, type_ignores=[]))
                      else:
                          assert ast.dump(old_node, include_attributes=False) == ast.dump(
                              new_node, include_attributes=False
                          ), f"definition changed: {old_path}:{name} -> {owner}"
                      compared += 1

          # binance_cache._aware_utc is the one explicit DELETE because it duplicates
          # the dependency-neutral helper already moved from old binance.py.
          assert ast.dump(old_defs[OLD_CACHE]["_aware_utc"], include_attributes=False) == ast.dump(
              old_defs[OLD_BINANCE]["_aware_utc"], include_attributes=False
          )
          assert compared == 59, compared

          def assignment_value(text: str, name: str) -> str:
              tree = ast.parse(text)
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == name
                      for target in node.targets
                  ):
                      return ast.dump(node.value, include_attributes=False)
              raise AssertionError(name)

          old_binance_text = old_text(OLD_BINANCE)
          constants = {
              "vision.py": ("_INTERVAL_MILLISECONDS", "_VISION_ROOT"),
              "transport.py": (
                  "_REST_BASE", "_REST_KLINES", "_REST_EXCHANGE_INFO",
                  "_REST_FUNDING", "_USER_AGENT",
              ),
          }
          for owner, names in constants.items():
              current = (ROOT / "trade_rl" / "integrations" / "binance" / owner).read_text(encoding="utf-8")
              for name in names:
                  assert assignment_value(old_binance_text, name) == assignment_value(current, name), name

          old_cache_text = old_text(OLD_CACHE)
          current_cache = (ROOT / "trade_rl" / "integrations" / "binance" / "cache.py").read_text(encoding="utf-8")
          assert assignment_value(old_cache_text, "_VISION_PREFIX") == assignment_value(current_cache, "_VISION_PREFIX")

          facade = ast.parse((ROOT / "trade_rl" / "integrations" / "binance" / "__init__.py").read_text(encoding="utf-8"))
          public = None
          for node in facade.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__all__" for t in node.targets):
                  public = tuple(ast.literal_eval(node.value))
          old_public = None
          old_tree = ast.parse(old_binance_text)
          for node in old_tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__all__" for t in node.targets):
                  old_public = tuple(ast.literal_eval(node.value))
          assert public == old_public

          print(f"AST-equivalent moved definitions: {compared}/59")
          print("Duplicate cache _aware_utc verified identical to retained types helper")
          print("Module constants and exact public facade verified")
          PY

      - name: Reject retired private paths and one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          test ! -e trade_rl/integrations/binance.py
          test ! -e trade_rl/integrations/binance_cache.py
          test ! -e trade_rl/integrations/frozen_binance_metadata.py
          test ! -e scripts/phase2b_migrate_binance.py
          test ! -e scripts/phase2b_binance_migrate.py
          test ! -e .github/workflows/phase2b-binance-migration.yml
          test ! -e .github/workflows/phase2b-binance-migrate.yml
          ! grep -R --line-number --include='*.py' \
            -e 'trade_rl.integrations.binance_cache' \
            -e 'trade_rl.integrations.frozen_binance_metadata' \
            trade_rl tests
