name: Phase 3A strategy migration

on:
  push:
    branches:
      - refactor/lean-strategy-family-boundaries
    paths:
      - ".github/workflows/phase3a-strategy-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/lean-strategy-family-boundaries
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev

      - name: Baseline strategy behavior
        run: >-
          uv run pytest -q
          tests/strategies
          tests/evaluation/test_candidate_suite.py
          tests/evaluation/test_candidate_run_artifact.py

      - name: Apply strategy family relocation
        run: uv run python scripts/phase3a_strategy_migrate.py

      - name: Normalize import ordering and formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix --select I trade_rl tests
          uv run ruff format trade_rl tests

      - name: Focused strategy verification
        run: >-
          uv run pytest -q
          tests/strategies
          tests/evaluation/test_candidate_suite.py
          tests/evaluation/test_candidate_run_artifact.py
          tests/architecture/test_lean_strategy_layout.py

      - name: Ruff
        run: uv run ruff check trade_rl tests

      - name: Format
        run: uv run ruff format --check trade_rl tests

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Full tests
        run: uv run pytest -q tests

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

      - name: Verify final strategy tree before commit
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            rules/__init__.py rules/trend.py rules/mean_reversion.py \
            forecasts/__init__.py forecasts/controller.py forecasts/supervised.py \
            forecasts/ridge.py forecasts/lightgbm.py \
            rl/__init__.py rl/ppo.py; do
            test -f "trade_rl/strategies/$path"
          done
          for path in forecast.py supervised.py ridge.py lightgbm.py trend.py mean_reversion.py ppo.py; do
            test ! -e "trade_rl/strategies/$path"
          done
          python - <<'PY'
          import ast
          from pathlib import Path

          stale = {
              "trade_rl.strategies.forecast",
              "trade_rl.strategies.supervised",
              "trade_rl.strategies.ridge",
              "trade_rl.strategies.lightgbm",
              "trade_rl.strategies.trend",
              "trade_rl.strategies.mean_reversion",
              "trade_rl.strategies.ppo",
          }
          offenders = []
          for root_name in ("trade_rl", "tests"):
              for path in Path(root_name).rglob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  modules = set()
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          modules.update(alias.name for alias in node.names)
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          modules.add(node.module)
                  found = sorted(modules & stale)
                  if found:
                      offenders.append((str(path), found))
          if offenders:
              raise SystemExit(f"stale flat strategy imports remain: {offenders}")
          PY
          git diff --check

      - name: Commit verified migration and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase3a-strategy-migrate.yml scripts/phase3a_strategy_migrate.py
          git add -A
          git diff --cached --check
          git commit -m "refactor: organize lean strategy family boundaries"
          git push origin HEAD:refactor/lean-strategy-family-boundaries
