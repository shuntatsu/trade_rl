name: Phase 3A strategy semantic falsification

on:
  push:
    branches:
      - refactor/lean-strategy-family-boundaries
    paths:
      - ".github/workflows/phase3a-strategy-semantic-falsification.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch exact Phase 2B logical base
        run: git fetch --no-tags --depth=1 origin 2c4ba3fcbe7d7d0601495eba2815eb3c1b6a036f

      - name: Compare normalized production AST
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import subprocess
          from pathlib import Path

          BASE = "2c4ba3fcbe7d7d0601495eba2815eb3c1b6a036f"
          ROOT = Path.cwd()
          REPLACEMENTS = {
              "trade_rl.strategies.trend": "trade_rl.strategies.rules.trend",
              "trade_rl.strategies.mean_reversion": "trade_rl.strategies.rules.mean_reversion",
              "trade_rl.strategies.forecast": "trade_rl.strategies.forecasts.controller",
              "trade_rl.strategies.supervised": "trade_rl.strategies.forecasts.supervised",
              "trade_rl.strategies.ridge": "trade_rl.strategies.forecasts.ridge",
              "trade_rl.strategies.lightgbm": "trade_rl.strategies.forecasts.lightgbm",
              "trade_rl.strategies.ppo": "trade_rl.strategies.rl.ppo",
          }
          MOVES = {
              "trade_rl/strategies/trend.py": "trade_rl/strategies/rules/trend.py",
              "trade_rl/strategies/mean_reversion.py": "trade_rl/strategies/rules/mean_reversion.py",
              "trade_rl/strategies/forecast.py": "trade_rl/strategies/forecasts/controller.py",
              "trade_rl/strategies/supervised.py": "trade_rl/strategies/forecasts/supervised.py",
              "trade_rl/strategies/ridge.py": "trade_rl/strategies/forecasts/ridge.py",
              "trade_rl/strategies/lightgbm.py": "trade_rl/strategies/forecasts/lightgbm.py",
              "trade_rl/strategies/ppo.py": "trade_rl/strategies/rl/ppo.py",
          }

          class NormalizeImports(ast.NodeTransformer):
              def visit_ImportFrom(self, node: ast.ImportFrom) -> ast.AST:
                  node = self.generic_visit(node)
                  assert isinstance(node, ast.ImportFrom)
                  if node.module in REPLACEMENTS:
                      node.module = REPLACEMENTS[node.module]
                  return node

              def visit_Import(self, node: ast.Import) -> ast.AST:
                  node = self.generic_visit(node)
                  assert isinstance(node, ast.Import)
                  for alias in node.names:
                      if alias.name in REPLACEMENTS:
                          alias.name = REPLACEMENTS[alias.name]
                  return node

          def old_text(path: str) -> str:
              return subprocess.check_output(["git", "show", f"{BASE}:{path}"], text=True)

          def normalized_old(path: str) -> ast.Module:
              tree = ast.parse(old_text(path), filename=path)
              normalized = NormalizeImports().visit(tree)
              ast.fix_missing_locations(normalized)
              assert isinstance(normalized, ast.Module)
              return normalized

          def current(path: str) -> ast.Module:
              return ast.parse((ROOT / path).read_text(encoding="utf-8"), filename=path)

          compared = 0
          for old_path, new_path in MOVES.items():
              assert ast.dump(normalized_old(old_path), include_attributes=False) == ast.dump(
                  current(new_path), include_attributes=False
              ), f"non-import semantic diff: {old_path} -> {new_path}"
              compared += 1

          for same_path in (
              "trade_rl/strategies/__init__.py",
              "trade_rl/evaluation/candidate_suite.py",
          ):
              assert ast.dump(normalized_old(same_path), include_attributes=False) == ast.dump(
                  current(same_path), include_attributes=False
              ), f"non-import semantic diff: {same_path}"
              compared += 1

          old_facade = ast.parse(old_text("trade_rl/strategies/__init__.py"))
          new_facade = current("trade_rl/strategies/__init__.py")

          def exported(tree: ast.Module) -> tuple[str, ...]:
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "__all__"
                      for target in node.targets
                  ):
                      return tuple(ast.literal_eval(node.value))
              raise AssertionError("missing __all__")

          assert exported(old_facade) == exported(new_facade)

          for family in ("rules", "forecasts", "rl"):
              for path in (ROOT / "trade_rl" / "strategies" / family).rglob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  modules = set()
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          modules.update(alias.name for alias in node.names)
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          modules.add(node.module)
                  assert not any(
                      module.startswith("trade_rl.evaluation") for module in modules
                  ), path

          print(f"Normalized production modules AST-equivalent: {compared}/9")
          print("Exact strategies.__all__ preserved")
          print("No strategy-family dependency on evaluation")
          PY

      - name: Reject retired strategy paths and one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          for path in forecast.py supervised.py ridge.py lightgbm.py trend.py mean_reversion.py ppo.py; do
            test ! -e "trade_rl/strategies/$path"
          done
          test ! -e scripts/phase3a_strategy_migrate.py
          test ! -e .github/workflows/phase3a-strategy-migrate.yml
