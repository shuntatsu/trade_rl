name: Phase 4A evaluation ownership migration

on:
  push:
    branches:
      - refactor/lean-evaluation-boundaries
    paths:
      - ".github/workflows/phase4a-evaluation-migrate.yml"

permissions:
  contents: write

concurrency:
  group: phase4a-evaluation-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply deterministic evaluation relocation
        run: python scripts/phase4a_evaluation_migrate.py

      - name: Rewrite package-member module imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOT = Path.cwd()
          MEMBERS = {
              "_perfect_information_lp": (
                  "trade_rl.evaluation.robustness.perfect_information",
                  "solver",
              ),
              "bootstrap": ("trade_rl.evaluation.comparison", "bootstrap"),
              "candidate_run": ("trade_rl.evaluation.runs", "candidate"),
              "candidate_suite": ("trade_rl.evaluation.runs", "candidate_suite"),
              "capacity": ("trade_rl.evaluation.robustness", "capacity"),
              "closed_trades": ("trade_rl.evaluation.robustness", "closed_trades"),
              "comparisons": ("trade_rl.evaluation.comparison", "paired"),
              "fold_metrics": ("trade_rl.evaluation.robustness", "fold_metrics"),
              "perfect_information_bound": (
                  "trade_rl.evaluation.robustness.perfect_information",
                  "bound",
              ),
              "seed_robustness": (
                  "trade_rl.evaluation.comparison",
                  "seed_robustness",
              ),
              "strategy_comparison": (
                  "trade_rl.evaluation.comparison",
                  "strategies",
              ),
              "walk_forward": ("trade_rl.evaluation.robustness", "walk_forward"),
          }

          def rewrite(path: Path) -> int:
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=str(path))
              lines = text.splitlines(keepends=True)
              edits: list[tuple[int, int, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ImportFrom):
                      continue
                  if node.level != 0 or node.module != "trade_rl.evaluation":
                      continue
                  moved = [alias for alias in node.names if alias.name in MEMBERS]
                  if not moved:
                      continue
                  if len(node.names) != 1 or len(moved) != 1:
                      raise RuntimeError(
                          f"mixed moved/public evaluation import requires manual review: {path}:{node.lineno}"
                      )
                  alias = moved[0]
                  target_module, target_name = MEMBERS[alias.name]
                  start = node.lineno - 1
                  end = (node.end_lineno or node.lineno)
                  original = "".join(lines[start:end])
                  if "#" in original:
                      raise RuntimeError(
                          f"commented moved evaluation import requires manual review: {path}:{node.lineno}"
                      )
                  first_line = lines[start]
                  indent = first_line[: len(first_line) - len(first_line.lstrip())]
                  local_name = alias.asname
                  if local_name is None and target_name != alias.name:
                      local_name = alias.name
                  replacement = f"{indent}from {target_module} import {target_name}"
                  if local_name is not None:
                      replacement += f" as {local_name}"
                  replacement += "\n"
                  edits.append((start, end, replacement))
              for start, end, replacement in sorted(edits, reverse=True):
                  lines[start:end] = [replacement]
              if edits:
                  path.write_text("".join(lines), encoding="utf-8")
              return len(edits)

          rewritten = 0
          for root_name in ("trade_rl", "tests"):
              for path in (ROOT / root_name).rglob("*.py"):
                  rewritten += rewrite(path)

          offenders: list[str] = []
          for root_name in ("trade_rl", "tests"):
              for path in (ROOT / root_name).rglob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if (
                          isinstance(node, ast.ImportFrom)
                          and node.level == 0
                          and node.module == "trade_rl.evaluation"
                          and any(alias.name in MEMBERS for alias in node.names)
                      ):
                          offenders.append(f"{path.relative_to(ROOT)}:{node.lineno}")
          if offenders:
              raise RuntimeError(f"retired evaluation package-member imports remain: {offenders}")
          print(f"Rewrote moved evaluation package-member imports: {rewritten}")
          PY

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Fix import order only
        run: uv run ruff check --fix --select I001 trade_rl tests

      - name: Format migrated Python tree
        run: uv run ruff format trade_rl tests

      - name: Ruff
        run: uv run ruff check trade_rl tests

      - name: Format
        run: uv run ruff format --check trade_rl tests

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Targeted evaluation and architecture tests
        run: uv run pytest -q tests/evaluation tests/architecture

      - name: Full tests
        run: uv run pytest -q tests

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

      - name: Verify maintained candidate CLI
        run: uv run python -m trade_rl.evaluation.runs.candidate --help >/dev/null

      - name: Remove one-shot migration infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/phase4a_evaluation_migrate.py
          rm .github/workflows/phase4a-evaluation-migrate.yml

      - name: Commit verified relocation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test ! -e scripts/phase4a_evaluation_migrate.py
          test ! -e .github/workflows/phase4a-evaluation-migrate.yml
          git commit -m "refactor: organize lean evaluation ownership boundaries"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
