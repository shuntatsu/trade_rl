name: Phase 4B format preview

on:
  push:
    branches:
      - docs/current-docs-agent-routing
    paths:
      - ".github/workflows/phase4b-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Show exact Ruff format diff
        shell: bash
        run: |
          set +e
          uv run ruff format --diff tests/architecture/test_current_docs_layout.py
          exit 0
