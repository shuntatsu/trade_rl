name: Phase 4B format RED contract

on:
  push:
    branches:
      - docs/lean-current-documentation-routing
    paths:
      - ".github/workflows/phase4b-format-red-contract.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/lean-current-documentation-routing
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev

      - name: Format exact RED contract
        run: uv run ruff format tests/architecture/test_current_documentation_contract.py

      - name: Verify formatter-only scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short tests/architecture/test_current_documentation_contract.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture/test_current_documentation_contract.py
          git rm .github/workflows/phase4b-format-red-contract.yml
          git diff --cached --check
          git commit -m "style: format Phase 4B documentation contract"
          git push origin HEAD:docs/lean-current-documentation-routing
