name: PostgreSQL Catalog

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - compose.yaml
      - .env.example
      - pyproject.toml
      - uv.lock
      - trade_rl/catalog/**
      - trade_rl/data/artifact.py
      - trade_rl/evaluation/walk_forward/**
      - trade_rl/workflows/**
      - trade_rl/cli/**
      - tests/catalog/**
      - tests/evaluation/**
      - tests/workflows/**
      - tests/ops/test_postgres_compose_contract.py
      - .automation/stage-a5-format-ready
      - .github/workflows/postgres-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-catalog:
    runs-on: ubuntu-latest
    env:
      TRADE_RL_DATABASE_URL: postgresql://trade_rl:trade_rl@localhost:5432/trade_rl
      TRADE_RL_TEST_DATABASE_URL: postgresql://trade_rl:trade_rl@localhost:5432/trade_rl
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U trade_rl -d trade_rl; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1
      - name: Install
        run: uv sync --extra dev --extra postgres
      - name: Migrate
        run: uv run trade-rl catalog migrate
      - name: Unit and integration tests
        run: >-
          uv run pytest
          tests/catalog
          tests/ops/test_postgres_compose_contract.py
          tests/data/test_market_artifact_catalog.py
          tests/cli/test_catalog_commands.py
          -q
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  stage-a5-format-apply:
    name: Apply Stage A5 Ruff formatting
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/stage-a5-zero-shot-evaluation-contract'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a5-zero-shot-evaluation-contract
          fetch-depth: 0
      - name: Verify and apply formatted files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .automation/stage-a5-format-ready ]]; then
            echo "Stage A5 format chunks are not complete yet; no-op."
            exit 0
          fi
          cat .automation/stage-a5-format.b64.* > /tmp/stage-a5-format.tgz.b64
          printf '%s  %s\n' \
            'c6a33c0b5af4642a383f951ad507aac85ca488f8b3b9804b3d5e6ed046d958dc' \
            /tmp/stage-a5-format.tgz.b64 | sha256sum --check --strict
          base64 --decode /tmp/stage-a5-format.tgz.b64 > /tmp/stage-a5-format.tgz
          printf '%s  %s\n' \
            'b78b87aa70d3d829d6177e1f36a43b02cd1b9e2b04c48618ad749d99acad947d' \
            /tmp/stage-a5-format.tgz | sha256sum --check --strict
          tar -xzf /tmp/stage-a5-format.tgz
          rm -rf .automation
          git fetch origin main
          git checkout origin/main -- .github/workflows/postgres-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            trade_rl/evaluation/stage_a_zero_shot_contracts.py \
            trade_rl/evaluation/stage_a_zero_shot_gate.py
          git add -u .automation .github/workflows/postgres-catalog.yml
          git commit -m "Format Stage A zero-shot evaluation contracts"
          git push origin HEAD:agent/stage-a5-zero-shot-evaluation-contract
