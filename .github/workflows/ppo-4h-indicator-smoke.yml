name: PPO 4h Indicator Smoke

on:
  push:
    branches:
      - research/ppo-4h-indicator-smoke

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  smoke:
    if: github.event.head_commit.message == 'run: execute 4h PPO indicator smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: false

      - name: Install frozen PPO runtime
        run: uv sync --locked --extra train-sb3

      - name: Execute authenticated one-seed smoke
        id: smoke
        continue-on-error: true
        env:
          SMOKE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_OUTPUT: output/smoke
        run: uv run --no-sync python -m tools.ppo_4h_indicator_smoke_actions

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-4h-indicator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/smoke
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          overwrite: false

      - name: Propagate smoke failure after evidence upload
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$SMOKE_OUTCOME" != "success" ]]; then
            echo "4h PPO smoke failed; inspect the uploaded protocol/result evidence."
            exit 1
          fi
