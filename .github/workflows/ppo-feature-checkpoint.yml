name: PPO Feature Checkpoint

on:
  workflow_dispatch:
    inputs:
      stage:
        description: One bounded checkpoint stage
        type: choice
        required: true
        options:
          - prepare
          - arm
          - finalize
      code_sha:
        description: Full immutable commit SHA to execute
        type: string
        required: true
      checkpoint_artifacts_json:
        description: JSON array of prior artifact id, run_id, and raw ZIP sha256 records
        type: string
        required: false
        default: "[]"
      approved_protocol_digest:
        description: Operator assertion of the exact outer protocol digest
        type: string
        required: false
        default: ""
      review_reference:
        description: Exact GitHub PR issue-comment URL for the sealed review evidence
        type: string
        required: false
        default: ""
      review_record_sha256:
        description: SHA-256 of the exact sealed review comment body
        type: string
        required: false
        default: ""
      factor:
        description: Preregistered factor for an arm stage
        type: choice
        required: false
        options:
          - baseline
          - btc_relative
      seed:
        description: Preregistered seed for an arm stage
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout immutable code SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.code_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse previous checkpoint workflow lineage
        env:
          CHECKPOINT_CODE_SHA: ${{ inputs.code_sha }}
        run: |
          if [[ ! "$CHECKPOINT_CODE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git rev-parse HEAD)" != "$CHECKPOINT_CODE_SHA" ]]; then
            echo "Checkpoint checkout does not match the immutable input."
            exit 1
          fi
          if ! grep -Fxq '          python-version: "3.12.16"' .github/workflows/ppo-feature-checkpoint.yml; then
            echo "checkout workflow does not contain 3.12.16; previous lineage is not resumable"
            exit 1
          fi
          if ! grep -Fxq '          version: "0.13.9"' .github/workflows/ppo-feature-checkpoint.yml; then
            echo "checkout workflow does not contain pinned uv 0.13.9; previous lineage is not resumable"
            exit 1
          fi

      - name: Require Python 3.12.16 in runner toolcache
        run: |
          cached_python="${RUNNER_TOOL_CACHE:?}/Python/3.12.16/x64/bin/python"
          if [[ ! -x "$cached_python" ]]; then
            echo "Pinned Python 3.12.16 is unavailable in the trusted runner toolcache."
            exit 1
          fi
          "$cached_python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'

      - name: Set up trusted runner Python 3.12.16
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
          check-latest: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.9"
          enable-cache: false

      - name: Verify exact checkpoint Python/uv environment
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          uv --version | grep -Eq '^uv 0\.13\.9([[:space:]]|$)'

      - name: Install frozen PPO runtime
        run: uv sync --locked --extra train-sb3

      - name: Verify frozen environment Python identity
        run: |
          uv run --no-sync python -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'

      - name: Run bounded checkpoint transport
        id: transport
        continue-on-error: true
        env:
          CHECKPOINT_STAGE: ${{ inputs.stage }}
          CHECKPOINT_CODE_SHA: ${{ inputs.code_sha }}
          CHECKPOINT_ARTIFACTS_JSON: ${{ inputs.checkpoint_artifacts_json }}
          CHECKPOINT_APPROVED_PROTOCOL_DIGEST: ${{ inputs.approved_protocol_digest }}
          CHECKPOINT_REVIEW_REFERENCE: ${{ inputs.review_reference }}
          CHECKPOINT_REVIEW_RECORD_SHA256: ${{ inputs.review_record_sha256 }}
          CHECKPOINT_FACTOR: ${{ inputs.factor }}
          CHECKPOINT_SEED: ${{ inputs.seed }}
          CHECKPOINT_OUTPUT: output
          CHECKPOINT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          uv run --no-sync python -m tools.ppo_checkpoint_actions

      - name: Upload checkpoint and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-feature-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/checkpoint
            output/receipt.json
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          overwrite: false

      - name: Propagate stage failure after artifact upload
        if: always()
        env:
          TRANSPORT_OUTCOME: ${{ steps.transport.outcome }}
        run: |
          if [[ "$TRANSPORT_OUTCOME" != "success" ]]; then
            echo "Checkpoint stage failed; inspect the receipt before retrying."
            exit 1
          fi
