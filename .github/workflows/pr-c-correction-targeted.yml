name: PR C Correction Targeted Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Run corrected Lagrangian suite
        shell: bash
        run: |
          set -o pipefail
          echo "HEAD_SHA=${GITHUB_SHA}" | tee pr-c-targeted.log
          uv run pytest -q \
            tests/rl/test_lagrangian_advantages.py \
            tests/rl/test_lagrangian_episode.py \
            tests/rl/test_lagrangian.py \
            tests/rl/test_lagrangian_dual.py \
            tests/rl/test_lagrangian_probe.py \
            tests/rl/test_lagrangian_probe_fail_closed.py \
            tests/rl/test_lagrangian_diagnostics.py \
            tests/rl/test_lagrangian_evidence.py \
            tests/integrations/test_cost_rollout_buffer.py \
            tests/integrations/test_cost_rollout_alignment.py \
            tests/integrations/test_lagrangian_ppo.py \
            tests/integrations/test_lagrangian_actor_advantages.py \
            tests/integrations/test_lagrangian_actor_correction.py \
            tests/integrations/test_lagrangian_checkpoint_roundtrip.py \
            tests/integrations/test_lagrangian_evidence_integration.py \
            tests/integrations/test_sb3_lagrangian_backend.py \
            tests/integrations/test_sb3_lagrangian_probe_backend.py \
            tests/rl/test_cost_diagnostics.py \
            tests/rl/test_cost_evidence.py \
            2>&1 | tee -a pr-c-targeted.log
          status=${PIPESTATUS[0]}
          echo "EXIT_CODE=${status}" | tee -a pr-c-targeted.log
          exit "${status}"

      - name: Upload targeted verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-c-correction-targeted
          path: pr-c-targeted.log
          if-no-files-found: error
