name: PR218 one-shot ensemble wrapper routing

on:
  push:
    branches:
      - agent/sb3-ensemble-aggregation-boundary

permissions:
  contents: write

jobs:
  route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/sb3-ensemble-aggregation-boundary
      - run: python tools/_pr218_route_ensemble_wrappers.py
      - run: |
          rm tools/_pr218_route_ensemble_wrappers.py
          rm .github/workflows/pr218-route-ensemble.yml
          git add -A
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: route SB3 ensemble wrappers through shared aggregation"
          git push origin HEAD:agent/sb3-ensemble-aggregation-boundary
