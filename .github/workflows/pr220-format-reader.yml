name: PR220 one-shot reader formatting

on:
  push:
    branches:
      - agent/tensorboard-incremental-reader

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/tensorboard-incremental-reader
      - run: python tools/_pr220_format_reader.py
      - run: |
          rm tools/_pr220_format_reader.py
          rm .github/workflows/pr220-format-reader.yml
          git add -A
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: format incremental TensorBoard reader"
          git push origin HEAD:agent/tensorboard-incremental-reader
