name: PR227 Capability Audit Fix Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr227-capability-audit-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-corrected-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR merge head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export

      - name: Build corrected capability audit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/run_training_capability_audit.py')
          text = path.read_text(encoding='utf-8')
          ppo = '''                "observation_encoder": "invalid_legacy_combination"
                if (False) and (True)
                else "hierarchical_sequence_v2"
                if (False)
                else "asset_set"
                if (True)
                else "flat_mlp",
'''
          off_policy = '''                "observation_encoder": "invalid_legacy_combination"
                if (False) and (False)
                else "hierarchical_sequence_v2"
                if (False)
                else "asset_set"
                if (False)
                else "flat_mlp",
'''
          flat = '''        observation_encoder=(
            "invalid_legacy_combination"
            if (False) and (False)
            else "hierarchical_sequence_v2"
            if (False)
            else "asset_set"
            if (False)
            else "flat_mlp"
        ),
'''
          if text.count(ppo) != 1 or text.count(off_policy) != 1 or text.count(flat) != 2:
              raise RuntimeError('capability audit migration anchors do not match')
          text = text.replace(ppo, '                "observation_encoder": "asset_set",\n')
          text = text.replace(
              off_policy,
              '                "observation_encoder": "flat_mlp",\n',
          )
          text = text.replace(flat, '        observation_encoder="flat_mlp",\n')
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format tools/run_training_capability_audit.py
          uv run ruff check tools/run_training_capability_audit.py
          uv run mypy tools/run_training_capability_audit.py

      - name: Upload corrected source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-corrected-capability-audit
          path: tools/run_training_capability_audit.py
          if-no-files-found: error
          retention-days: 7
