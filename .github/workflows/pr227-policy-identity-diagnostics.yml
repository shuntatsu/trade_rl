name: PR227 Policy Identity Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr227-policy-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install verification environment
        run: uv sync --extra dev --extra train-sb3 --extra export --extra studio

      - name: Generate policy identity integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          assembly_path = "trade_rl/integrations/sb3_model_assembly.py"
          replace_once(
              assembly_path,
              """    uses_shared_asset_actor: bool
    rollout_buffer_class: object | None = None
""",
              """    uses_shared_asset_actor: bool
    observation_encoder: str
    sequence_symbols: tuple[str, ...] | None
    sequence_action_names: tuple[str, ...] | None
    rollout_buffer_class: object | None = None
""",
          )
          replace_once(
              assembly_path,
              """    uses_shared_asset_actor = False
    rollout_buffer_class: object | None = None
""",
              """    uses_shared_asset_actor = False
    sequence_symbols: tuple[str, ...] | None = None
    sequence_action_names: tuple[str, ...] | None = None
    rollout_buffer_class: object | None = None
""",
          )
          replace_once(
              assembly_path,
              """        ) = _sequence_policy_assembly(
            probe=probe,
            identity=identity,
            config=config,
        )
        rollout_buffer_class = IndexBackedDictRolloutBuffer
""",
              """        ) = _sequence_policy_assembly(
            probe=probe,
            identity=identity,
            config=config,
        )
        unwrapped: Any = getattr(probe, "unwrapped", probe)
        dataset = getattr(unwrapped, "dataset", None)
        raw_symbols = getattr(dataset, "symbols", None)
        if (
            not isinstance(raw_symbols, (tuple, list))
            or not raw_symbols
            or any(not isinstance(item, str) or not item for item in raw_symbols)
        ):
            raise ValueError("sequence training requires ordered dataset symbols")
        sequence_symbols = tuple(raw_symbols)
        sequence_action_names = _action_names(identity)
        rollout_buffer_class = IndexBackedDictRolloutBuffer
""",
          )
          replace_once(
              assembly_path,
              """        uses_shared_asset_actor=uses_shared_asset_actor,
        rollout_buffer_class=rollout_buffer_class,
""",
              """        uses_shared_asset_actor=uses_shared_asset_actor,
        observation_encoder=config.observation_encoder,
        sequence_symbols=sequence_symbols,
        sequence_action_names=sequence_action_names,
        rollout_buffer_class=rollout_buffer_class,
""",
          )
          replace_once(
              assembly_path,
              """    common = _common_model_kwargs(
        seed=seed,
        config=config,
        algorithm_config=algorithm_config,
        policy=policy,
        verbose=verbose,
        output_root=output_root,
    )
    if isinstance(algorithm_config, PPOConfig):
""",
              """    common = _common_model_kwargs(
        seed=seed,
        config=config,
        algorithm_config=algorithm_config,
        policy=policy,
        verbose=verbose,
        output_root=output_root,
    )

    from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity

    def _bind_identity(model: Any) -> Any:
        bind_sb3_policy_identity(model, policy)
        return model

    if isinstance(algorithm_config, PPOConfig):
""",
          )
          replace_once(assembly_path, "            return model\n", "            return _bind_identity(model)\n")
          replace_once(
              assembly_path,
              """            constructor = CostCriticPPO
            return constructor(
                policy.policy_identifier,
                environment,
                cost_schema=algorithm_config.cost_schema,
                cost_learning_rate=algorithm_config.cost_learning_rate,
                cost_n_epochs=algorithm_config.cost_n_epochs,
                cost_batch_size=algorithm_config.cost_batch_size,
                cost_continuous_hidden_dims=(
                    algorithm_config.cost_continuous_hidden_dims
                ),
                cost_event_hidden_dims=algorithm_config.cost_event_hidden_dims,
                cost_max_grad_norm=algorithm_config.cost_max_grad_norm,
                **ppo_kwargs,
            )
""",
              """            constructor = CostCriticPPO
            model = constructor(
                policy.policy_identifier,
                environment,
                cost_schema=algorithm_config.cost_schema,
                cost_learning_rate=algorithm_config.cost_learning_rate,
                cost_n_epochs=algorithm_config.cost_n_epochs,
                cost_batch_size=algorithm_config.cost_batch_size,
                cost_continuous_hidden_dims=(
                    algorithm_config.cost_continuous_hidden_dims
                ),
                cost_event_hidden_dims=algorithm_config.cost_event_hidden_dims,
                cost_max_grad_norm=algorithm_config.cost_max_grad_norm,
                **ppo_kwargs,
            )
            return _bind_identity(model)
""",
          )
          replace_once(
              assembly_path,
              "        return constructor(policy.policy_identifier, environment, **ppo_kwargs)\n",
              "        return _bind_identity(\n            constructor(policy.policy_identifier, environment, **ppo_kwargs)\n        )\n",
          )
          replace_once(
              assembly_path,
              "    return constructor(policy.policy_identifier, environment, **off_policy)\n",
              "    return _bind_identity(\n        constructor(policy.policy_identifier, environment, **off_policy)\n    )\n",
          )

          checkpoint_path = "trade_rl/rl/checkpointing.py"
          replace_once(
              checkpoint_path,
              """def _model_algorithm_identity(model: SavablePolicy) -> dict[str, object] | None:
    provider = getattr(model, "checkpoint_identity_payload", None)
    if provider is None:
        return None
    if not callable(provider):
        raise TypeError("checkpoint_identity_payload must be callable")
    raw = provider()
    if raw is None:
        return None
    if not isinstance(raw, dict) or not raw:
        raise ValueError("checkpoint algorithm identity must be a non-empty object")
    if any(not isinstance(key, str) or not key for key in raw):
        raise ValueError("checkpoint algorithm identity keys must be non-empty strings")
    payload = dict(raw)
    canonical_json_bytes(payload)
    return payload


""",
              """def _model_algorithm_identity(model: SavablePolicy) -> dict[str, object] | None:
    provider = getattr(model, "checkpoint_identity_payload", None)
    if provider is None:
        return None
    if not callable(provider):
        raise TypeError("checkpoint_identity_payload must be callable")
    raw = provider()
    if raw is None:
        return None
    if not isinstance(raw, dict) or not raw:
        raise ValueError("checkpoint algorithm identity must be a non-empty object")
    if any(not isinstance(key, str) or not key for key in raw):
        raise ValueError("checkpoint algorithm identity keys must be non-empty strings")
    payload = dict(raw)
    canonical_json_bytes(payload)
    return payload


def checkpoint_identity_payload_for_model(
    model: SavablePolicy,
) -> dict[str, object] | None:
    """Compose the bound policy identity with any algorithm-specific identity."""

    from trade_rl.integrations.sb3_policy_identity import model_sb3_policy_identity

    policy_identity = model_sb3_policy_identity(model)
    algorithm_identity = _model_algorithm_identity(model)
    if policy_identity is None:
        return algorithm_identity
    payload: dict[str, object] = {
        "schema_version": "sb3_checkpoint_identity_v2",
        "policy": policy_identity,
        "algorithm": algorithm_identity,
    }
    canonical_json_bytes(payload)
    return payload


""",
          )
          replace_once(
              checkpoint_path,
              "    algorithm_identity = _model_algorithm_identity(model)\n",
              "    algorithm_identity = checkpoint_identity_payload_for_model(model)\n",
          )
          replace_once(
              checkpoint_path,
              """    "build_checkpoint_callback",
    "checkpoint_manifests",
""",
              """    "build_checkpoint_callback",
    "checkpoint_identity_payload_for_model",
    "checkpoint_manifests",
""",
          )

          load_path = "trade_rl/integrations/sb3_checkpoint_assembly.py"
          replace_once(
              load_path,
              """    CheckpointManifest,
    load_checkpoint_manifest,
    validate_checkpoint_algorithm_identity,
""",
              """    CheckpointManifest,
    checkpoint_identity_payload_for_model,
    load_checkpoint_manifest,
    validate_checkpoint_algorithm_identity,
""",
          )
          replace_once(
              load_path,
              """def _checkpoint_algorithm_identity(
    model: object,
    algorithm_config: AlgorithmConfig,
) -> dict[str, object] | None:
    if not isinstance(algorithm_config, CostCriticPPOConfig):
        return None
    provider = getattr(model, "checkpoint_identity_payload", None)
    if not callable(provider):
        raise TypeError("checkpoint_identity_payload must be callable")
    value = provider()
    if not isinstance(value, dict) or not value:
        raise ValueError("checkpoint algorithm identity must be a non-empty object")
    return value
""",
              """def _checkpoint_algorithm_identity(
    model: object,
    algorithm_config: AlgorithmConfig,
) -> dict[str, object] | None:
    del algorithm_config
    return checkpoint_identity_payload_for_model(model)
""",
          )
          replace_once(
              load_path,
              """    if int(model.num_timesteps) != manifest.observed_timestep:
        raise ValueError("checkpoint timestep identity mismatch")
    if isinstance(algorithm_config, CostCriticPPOConfig):
        loaded_identity = _checkpoint_algorithm_identity(model, algorithm_config)
        validate_checkpoint_algorithm_identity(manifest, loaded_identity)
""",
              """    if int(model.num_timesteps) != manifest.observed_timestep:
        raise ValueError("checkpoint timestep identity mismatch")
    from trade_rl.integrations.sb3_policy_identity import bind_sb3_policy_identity

    bind_sb3_policy_identity(model, policy)
    loaded_identity = _checkpoint_algorithm_identity(model, algorithm_config)
    validate_checkpoint_algorithm_identity(manifest, loaded_identity)
""",
          )
          PY

      - name: Verify generated integration
        run: |
          uv run ruff format .
          uv run ruff check --fix .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
          uv run pytest -q \
            tests/integrations/test_sb3_policy_identity_v2.py \
            tests/integrations/test_sb3_checkpoint_assembly.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/integrations/test_sb3_model_construction.py \
            tests/rl/test_cost_checkpoint_identity.py \
            tests/rl/test_lagrangian_checkpoint_identity.py

      - name: Package verified production files
        run: |
          mkdir -p verified/trade_rl/integrations verified/trade_rl/rl
          cp trade_rl/integrations/sb3_model_assembly.py verified/trade_rl/integrations/
          cp trade_rl/integrations/sb3_checkpoint_assembly.py verified/trade_rl/integrations/
          cp trade_rl/rl/checkpointing.py verified/trade_rl/rl/

      - name: Upload verified integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr227-policy-identity-integration
          path: verified
          if-no-files-found: error
          retention-days: 7
