name: PR229 format updater

on:
  pull_request:
    branches:
      - agent/constrained-policy-report

permissions:
  contents: write

concurrency:
  group: pr229-format-updater
  cancel-in-progress: false

jobs:
  update:
    if: github.head_ref == 'agent/trigger-pr229-format'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/constrained-policy-report
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Apply repository formatter
        shell: bash
        run: |
          uv sync --extra dev --extra train-sb3
          uv run ruff format \
            trade_rl/evaluation/constrained_policy_report.py \
            tests/evaluation/test_constrained_policy_report.py
          rm .github/workflows/pr229-format-updater.yml
          git config user.name "trade-rl formatter"
          git config user.email "actions@users.noreply.github.com"
          git add \
            trade_rl/evaluation/constrained_policy_report.py \
            tests/evaluation/test_constrained_policy_report.py \
            .github/workflows/pr229-format-updater.yml
          git commit -m "style: format constrained policy report"
          git push origin HEAD:agent/constrained-policy-report
