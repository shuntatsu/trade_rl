name: PR229 Ruff updater

on:
  pull_request:
    branches:
      - agent/constrained-policy-report
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/trigger-pr229-ruff'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/constrained-policy-report
          persist-credentials: true
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Apply Ruff fixes and formatting
        shell: bash
        run: |
          uv sync --extra dev --extra train-sb3
          uv run ruff check --fix \
            trade_rl/domain/constraint_contracts.py \
            trade_rl/evaluation/constrained_policy_report \
            trade_rl/rl/environment_constraints.py \
            trade_rl/rl/lagrangian_statistics.py \
            tests/domain/test_constraint_contracts.py \
            tests/evaluation/test_constrained_policy_report.py
          uv run ruff format \
            trade_rl/domain/constraint_contracts.py \
            trade_rl/evaluation/constrained_policy_report \
            trade_rl/rl/environment_constraints.py \
            trade_rl/rl/lagrangian_statistics.py \
            tests/domain/test_constraint_contracts.py \
            tests/evaluation/test_constrained_policy_report.py

      - name: Remove updater and commit
        shell: bash
        run: |
          rm .github/workflows/pr229-ruff-updater.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/pr229-ruff-updater.yml \
                  trade_rl/domain/constraint_contracts.py \
                  trade_rl/evaluation/constrained_policy_report \
                  trade_rl/rl/environment_constraints.py \
                  trade_rl/rl/lagrangian_statistics.py \
                  tests/domain/test_constraint_contracts.py \
                  tests/evaluation/test_constrained_policy_report.py
          git commit -m "style: normalize constrained report imports"
          git push origin HEAD:agent/constrained-policy-report
