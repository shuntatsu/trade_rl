name: PR 248 Apply CUDA Evidence Fix V2

on:
  push:
    branches:
      - agent/architecture-audit-remediation-20260728

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-audit-remediation-20260728
          fetch-depth: 1

      - name: Apply patch
        shell: bash
        run: python tools/apply_pr248_cuda_evidence_patch.py

      - name: Format and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff>=0.15.0'
          ruff format \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            tests/examples/test_run_gpu_training_smoke.py
          rm -f \
            .github/pr248-cuda-evidence-apply.trigger \
            .github/workflows/pr248-apply-cuda-evidence.yml \
            .github/workflows/pr248-apply-cuda-evidence-v2.yml \
            tools/apply_pr248_cuda_evidence_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: bind effective CUDA runtime to RTX smoke evidence"
          git push origin HEAD:agent/architecture-audit-remediation-20260728
