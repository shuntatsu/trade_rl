name: PR 248 Apply V2 Fixture Fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-audit-remediation-20260728
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Apply fixes
        shell: bash
        run: python tools/apply_pr248_v2_fixture_fixes.py

      - name: Verify focused regressions
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv sync --extra dev --extra export --extra train-sb3 --extra studio
          uv run ruff format \
            trade_rl/workflows/training_run.py \
            tests/e2e/test_research_to_serving_v2.py \
            tests/examples/test_docker_training_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py \
            tests/workflows/test_walk_forward_manifest_provenance.py
          uv run ruff check \
            trade_rl/workflows/training_run.py \
            tests/e2e/test_research_to_serving_v2.py \
            tests/examples/test_docker_training_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py \
            tests/workflows/test_walk_forward_manifest_provenance.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/e2e/test_research_to_serving_v2.py::test_research_training_to_attested_runtime_prediction \
            tests/examples/test_docker_training_assets.py::test_gpu_nightly_contract_measures_vram_throughput_and_resume \
            tests/examples/test_gpu_performance_comparison_assets.py::test_gpu_smoke_schema_records_runtime_identity \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py::test_structured_walk_forward_trains_three_seed_ensemble_end_to_end \
            tests/workflows/test_training_run.py::test_execute_training_run_trains_serializes_and_publishes \
            tests/workflows/test_training_run.py::test_execute_training_run_uses_explicit_provenance_without_git_lookup \
            tests/workflows/test_training_run_config.py::test_training_config_accepts_structured_torchscript_for_sequence_policy \
            tests/workflows/test_training_run_config.py::test_training_config_rejects_structured_torchscript_for_flat_policy \
            tests/workflows/test_walk_forward_manifest_provenance.py::test_market_walk_forward_publishes_dedicated_manifest_and_provenance \
            2>&1 | tee pr248-v2-focused.log

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr248-v2-focused
          path: pr248-v2-focused.log
          if-no-files-found: warn

      - name: Publish code and fixture fixes
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/training_run.py \
            tests/e2e/test_research_to_serving_v2.py \
            tests/examples/test_docker_training_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py \
            tests/workflows/test_walk_forward_manifest_provenance.py
          git commit -m "fix: migrate workflow fixtures to the closed v2 contract"
          git push origin HEAD:agent/architecture-audit-remediation-20260728

      - name: Fail on regression
        if: steps.verify.outcome != 'success'
        shell: bash
        run: exit 1
