name: PR625 PRE-PnL Authority Format Preview

on:
  push:
    branches:
      - agent/pr625-prepnl-authority-selfhosted-2026-09-17

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b33379998f91c610c3e7efb7909be152760f5a10
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Show formatter delta
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_execution_authority.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_execution_authority.py
          git diff -- \
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_execution_authority.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_execution_authority.py
