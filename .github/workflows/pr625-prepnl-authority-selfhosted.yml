name: PR625 Core Exact-Head Verification

on:
  push:
    branches:
      - agent/pr625-prepnl-authority-selfhosted-2026-09-17

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d3bbc416b2ac2b9051496e3ead6e8ff96170b45
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3d3bbc416b2ac2b9051496e3ead6e8ff96170b45"
          test "$(git merge-base 75999e53c70224c31a62b106e4a8d2caa4b920ac HEAD)" = "75999e53c70224c31a62b106e4a8d2caa4b920ac"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check trade_rl tests tools

      - name: Format
        run: uv run ruff format --check trade_rl tests tools

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py

      - name: Focused Issue 616 authority tests
        run: |
          uv run pytest -q \
            tests/strategies/test_ridge_economic_gate.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_artifact.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_execution_authority.py \
            tests/architecture/test_runs_capability_facade.py

      - name: Full repository tests
        run: uv run pytest -q tests

      - name: Build
        run: uv build

      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl

      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          print("clean installed core public imports and identity: OK")
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help

      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

      - name: Exact seven-file scope and hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only 75999e53c70224c31a62b106e4a8d2caa4b920ac...HEAD | sort)
          expected=(
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_artifact.py
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_execution_authority.py
            tests/strategies/test_ridge_economic_gate.py
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_execution_authority.py
            trade_rl/strategies/forecasts/ridge_economic_gate.py
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected[*]}"
          git diff --check 75999e53c70224c31a62b106e4a8d2caa4b920ac...HEAD
          test -z "$(git status --porcelain)"
