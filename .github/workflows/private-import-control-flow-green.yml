name: Private import control flow GREEN

on:
  push:
    branches:
      - agent/private-import-control-flow-hardening

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --extra dev

      - name: Run focused tests
        run: |
          uv run pytest -q \
            tests/architecture/test_private_import_control_flow.py \
            tests/architecture/test_private_import_usage.py \
            tests/architecture/test_ownership_boundaries.py

      - name: Run focused static checks
        run: |
          uv run ruff check \
            tests/architecture/import_references.py \
            tests/architecture/test_private_import_control_flow.py
          uv run ruff format --check \
            tests/architecture/import_references.py \
            tests/architecture/test_private_import_control_flow.py
