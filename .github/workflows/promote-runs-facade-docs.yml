name: Promote runs facade durable docs

on:
  push:
    branches:
      - refactor/runs-capability-facade
    paths:
      - .github/workflows/promote-runs-facade-docs.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Guard verified implementation ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "2dda5c30fcd8045cd2276a670f5a7dcb944168a7"

      - name: Promote durable architecture rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          old_runs = "\n".join([
              "- `candidate.py`: 上記を順番に呼ぶ薄いfilesystem CLI/facade。",
              "",
              "`runs` はhigher-level experiment lifecycleを知らない。",
          ])
          new_runs = "\n".join([
              "- `candidate.py`: 上記を順番に呼ぶ薄いfilesystem CLI/facade。",
              "",
              "`trade_rl.evaluation.runs` はcandidate-run contract、execution、artifact inspection/publication、provenance constructionのTier-2 public facadeである。`config.py`、`candidate_suite.py`、`execute.py`、`artifact.py`、`provenance.py` は引き続き実装ownerであり、facadeはこれらをwrapperなしでre-exportするだけとする。production codeは `evaluation/runs/` の外からRun Coreを利用するときfacadeを経由し、package内部は循環を避けるためowner moduleを直接参照してよい。Tier-1 `trade_rl.evaluation` の公開面はこの規則によって拡大しない。candidate-runのpersisted schema互換契約はPython import pathとは独立して維持する。",
              "",
              "`runs` はhigher-level experiment lifecycleを知らない。",
          ])
          replace_exact("docs/architecture/package-boundaries.md", old_runs, new_runs)

          old_gate = "このgateはstatic import ownershipの検査であり、runtime sandboxや任意のPython到達可能性の証明ではない。動的import、実行時のattribute再束縛、反射や関数実行で生じる依存は別のreview/contract testが必要である。"
          new_gate = "\n\n".join([
              "`ImportCollector.collect()` はstatic re-exportを追跡してsemantic ownerまで展開する一方、`collect_direct()` はsourceに直接綴られたmodule pathだけを解決し、facade symbolのre-export先までは追わない。semantic dependencyとdirect-import policyは異なるoracleとして使い分け、facade経由の正当な利用をowner moduleの直接依存と誤認しない。",
              old_gate,
          ])
          replace_exact("docs/architecture/package-boundaries.md", old_gate, new_gate)

          active = "現在Activeな設計は [`specs/2026-09-11-runs-capability-facade-design.md`](specs/2026-09-11-runs-capability-facade-design.md)、実装計画は [`plans/2026-09-11-runs-capability-facade-implementation.md`](plans/2026-09-11-runs-capability-facade-implementation.md) である。"
          replace_exact("docs/README.md", active, "現在Activeなspec/planはない。")
          PY
          rm docs/specs/2026-09-11-runs-capability-facade-design.md
          rm docs/plans/2026-09-11-runs-capability-facade-implementation.md
          rmdir docs/specs docs/plans

      - name: Retire helper before repository checks
        run: rm .github/workflows/promote-runs-facade-docs.yml

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify current-only docs and facade contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pytest -q \
            tests/architecture/test_current_docs_layout.py \
            tests/architecture/test_runs_capability_facade.py
          git diff --check

      - name: Commit durable docs and cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test ! -e .github/workflows/promote-runs-facade-docs.yml
          test ! -e docs/specs/2026-09-11-runs-capability-facade-design.md
          test ! -e docs/plans/2026-09-11-runs-capability-facade-implementation.md
          git diff --cached --check
          git commit -m "docs: promote runs capability boundary"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
