name: Reconcile PR C documents

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile superseded contracts
        shell: bash
        run: |
          set -o pipefail
          {
            python .github/scripts/reconcile_pr_c_docs.py
            rm .github/scripts/reconcile_pr_c_docs.py
            rm .github/workflows/reconcile-pr-c-docs.yml
            git add -A
            git diff --cached --check
          } 2>&1 | tee reconcile-pr-c.log

      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reconcile-pr-c-diagnostics
          path: reconcile-pr-c.log
          if-no-files-found: ignore

      - name: Commit reconciled documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: supersede outdated PR C semantics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
