name: Remove Builder Math Import

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fix-post-audit-residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-post-audit-residuals
          fetch-depth: 0
          persist-credentials: true
      - name: Remove obsolete import
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^import math$' trade_rl/data/builder.py)" -eq 1
          sed -i '/^import math$/d' trade_rl/data/builder.py
          rm .github/workflows/remove-builder-math.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: remove obsolete builder math import'
          git push origin HEAD:agent/fix-post-audit-residuals
