name: Branch hygiene — retire verified merged PR source refs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retire main-integrated merged PR sources (exact SHA leases)
    if: github.repository == 'shuntatsu/trade_rl' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh all current remote branch histories
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Independent read-only retirement preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "shuntatsu/trade_rl"
          python3 -m tools.branch_hygiene \
            --repository "$GITHUB_REPOSITORY" --retire-merged

      - name: Prune main ancestors after fresh PR/workflow/ref validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m tools.branch_hygiene \
            --repository "$GITHUB_REPOSITORY" \
            --retire-merged --apply --max-deletes 100 \
            --summary "$GITHUB_STEP_SUMMARY"

  archived-one-shot:
    name: Retire archived inactive branch tips (owner command only)
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'shuntatsu' &&
      github.event.issue.number == 1057 &&
      github.event.comment.body == '/retire-archived-branches-20261120 2be720a5ef837462e4132ebecf982d8929112b6c'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout protected main and complete branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branch tips and frozen recovery archive
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Independently preview archived inactive branch candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_branch_retirement

      - name: Retire exact archived inactive branch refs with SHA leases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_branch_retirement --apply

  frozen-closed-pr-retirement:
    name: One-shot exact archived closed-PR retirement (owner request only)
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.event_name == 'issue_comment' &&
      github.actor == 'shuntatsu' &&
      github.event.issue.number == 1057 &&
      github.event.comment.body == '/retire-archived-closed-prs-20261120 2be720a5ef837462e4132ebecf982d8929112b6c'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main, never untrusted PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch complete main, active refs and frozen archive histories
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Read-only exact closure and archive preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_closed_pr_retirement

      - name: Retire only exact archived closed PR source refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_closed_pr_retirement --apply

  frozen-orphan-ancestor-retirement:
    name: Retire six frozen ordinary main ancestors (owner-only)
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.actor == 'shuntatsu' &&
      github.event.issue.number == 1057 &&
      github.event.comment.body == '/retire-six-archived-main-ancestors-20261120 2be720a5ef837462e4132ebecf982d8929112b6c'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch complete remote and frozen archive
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Read-only exact six ref preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_orphan_ancestor_retirement

      - name: Delete exactly selected SHA-leased refs with readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_orphan_ancestor_retirement --apply

  superseded-sd2-ref-retirement:
    name: Retire three immutable old SD2 source refs (owner-created request)
    if: >-
      github.repository == 'shuntatsu/trade_rl' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.actor == 'shuntatsu' &&
      github.event.issue.number == 1057 &&
      github.event.comment.body == '/retire-three-superseded-sd2-refs-20261120 2be720a5ef837462e4132ebecf982d8929112b6c'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main and complete repository histories
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch complete current main, live PR refs and frozen archive
        shell: bash
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Read-only immutable predecessor and successor proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_superseded_sd2_retirement

      - name: Delete only three SHA-leased superseded names with GitHub readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.archived_superseded_sd2_retirement --apply
