name: Ruff import diagnostic

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/ruff-import-diagnostic.yml
      - trade_rl/data/universal_features.py
      - trade_rl/rl/universal_normalization.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: uv sync --extra dev
      - name: Print Ruff import fix
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            trade_rl/data/universal_features.py \
            trade_rl/rl/universal_normalization.py \
            --fix
          git diff -- \
            trade_rl/data/universal_features.py \
            trade_rl/rl/universal_normalization.py
