name: Ruff Import Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install
        run: uv sync --extra dev
      - name: Capture Ruff fix
        shell: bash
        run: |
          uv run ruff check --select I --fix --diff tests/examples/test_growth_optimal_reward_profiles.py > ruff-import.diff || true
          cat ruff-import.diff
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-import-diagnostic
          path: ruff-import.diff
          if-no-files-found: error
