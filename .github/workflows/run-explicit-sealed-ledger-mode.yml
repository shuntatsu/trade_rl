name: Run explicit sealed ledger mode implementation

on:
  push:
    branches:
      - agent/explicit-sealed-ledger-mode

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/explicit-sealed-ledger-mode
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Execute reviewed implementation patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          path = Path(".github/workflows/apply-explicit-sealed-ledger-mode.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = lines.index("      - name: Apply exact implementation patch")
          run_line = lines.index("        run: |", marker)
          end = next(
              index
              for index in range(run_line + 1, len(lines))
              if lines[index].startswith("      - name:")
          )
          script = textwrap.dedent("\n".join(lines[run_line + 1 : end]))
          exec(compile(script, str(path), "exec"), {"__name__": "__main__"})

      - name: Format changed files
        run: >-
          uv run ruff format
          trade_rl/workflows/market_walk_forward_config.py
          trade_rl/workflows/market_walk_forward.py
          tests/workflows/test_explicit_sealed_ledger_mode.py

      - name: Verify focused behavior
        run: >-
          uv run pytest
          tests/workflows/test_explicit_sealed_ledger_mode.py
          tests/workflows/test_market_walk_forward.py
          tests/workflows/test_market_walk_forward_config.py
          tests/examples/test_binance_multitimeframe_full_assets.py
          -q

      - name: Verify static gates
        run: |
          uv run ruff check trade_rl/workflows/market_walk_forward_config.py trade_rl/workflows/market_walk_forward.py tests/workflows/test_explicit_sealed_ledger_mode.py
          uv run ruff format --check trade_rl/workflows/market_walk_forward_config.py trade_rl/workflows/market_walk_forward.py tests/workflows/test_explicit_sealed_ledger_mode.py
          uv run mypy trade_rl/workflows/market_walk_forward_config.py trade_rl/workflows/market_walk_forward.py

      - name: Commit verified implementation
        run: |
          rm .github/workflows/apply-explicit-sealed-ledger-mode.yml
          rm .github/workflows/run-explicit-sealed-ledger-mode.yml
          rm -f .github/sealed-ledger-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make sealed ledger mode explicit"
          git push origin HEAD:agent/explicit-sealed-ledger-mode
