name: Run final contract review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'agent/harden-data-bc-serving-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3 --extra postgres
      - name: Verify RED
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_final_contract_review.py tests
          set +e
          uv run pytest \
            tests/integrations/test_postgres_market_dataset.py \
            tests/rl/test_environment_info_service.py -q > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -Eq 'sampled_policy_action|tick_size|symbol_active|feature_available' red.log
      - name: Apply implementation
        run: python tools/apply_final_contract_review.py implementation
      - name: Verify GREEN
        run: |
          uv run ruff check --fix \
            trade_rl/data/economic_semantics.py \
            trade_rl/integrations/postgres_market_dataset.py \
            trade_rl/rl/environment_info.py \
            tests/integrations/test_postgres_market_dataset.py \
            tests/rl/test_environment_info_service.py
          uv run ruff format \
            trade_rl/data/economic_semantics.py \
            trade_rl/integrations/postgres_market_dataset.py \
            trade_rl/rl/environment_info.py \
            tests/integrations/test_postgres_market_dataset.py \
            tests/rl/test_environment_info_service.py
          uv run pytest \
            tests/data/test_economic_semantics.py \
            tests/integrations/test_postgres_market_dataset.py \
            tests/rl/test_environment_info_service.py -q
          uv run mypy trade_rl
          uv run ruff check .
          uv run ruff format --check .
          git diff --check
      - name: Commit reviewed implementation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: complete economic and action telemetry contracts'
          git push origin "HEAD:${HEAD_BRANCH}"
