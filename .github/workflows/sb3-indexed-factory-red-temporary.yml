name: Temporary SB3 Indexed Factory RED

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/sb3-indexed-factory-red-temporary.yml]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: |
          uv run ruff check --fix tests/integrations/test_sb3_indexed_environment_factory.py
          uv run ruff format tests/integrations/test_sb3_indexed_environment_factory.py
          uv run pytest tests/integrations/test_sb3_indexed_environment_factory.py -q
