name: Signal Forensics Focused

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: signal-forensics-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Ruff
        run: uv run ruff check trade_rl/workflows/universal_causal_alpha_v3_signal_forensics.py tests/workflows/test_universal_causal_alpha_v3_signal_forensics.py

      - name: Format
        run: uv run ruff format --check trade_rl/workflows/universal_causal_alpha_v3_signal_forensics.py tests/workflows/test_universal_causal_alpha_v3_signal_forensics.py

      - name: Mypy
        run: uv run mypy trade_rl/workflows/universal_causal_alpha_v3_signal_forensics.py

      - name: Targeted tests
        run: uv run pytest -q tests/workflows/test_universal_causal_alpha_v3_signal_forensics.py

      - name: Dead-code focused scan
        run: uv run vulture trade_rl/workflows/universal_causal_alpha_v3_signal_forensics.py tests/workflows/test_universal_causal_alpha_v3_signal_forensics.py --min-confidence 100
