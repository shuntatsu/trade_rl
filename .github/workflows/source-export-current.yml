name: Current Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-export-current.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/harden-audit-contracts-v2
          persist-credentials: false
      - name: Pack source tree
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/current-source.tgz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-source
          path: /tmp/current-source.tgz
          if-no-files-found: error
          retention-days: 1
