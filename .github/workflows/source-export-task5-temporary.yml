name: Export source for Task 5

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/source-export-task5-temporary.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/oracle-bellman-batched-solver
          persist-credentials: true
          fetch-depth: 0
      - name: Package source tree
        run: tar --exclude=.git --exclude=.venv -czf /tmp/trade-rl-task5-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trade-rl-task5-source-${{ github.sha }}
          path: /tmp/trade-rl-task5-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/source-export-task5-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "chore: remove Task 5 source export workflow"
          git push origin HEAD:agent/oracle-bellman-batched-solver
