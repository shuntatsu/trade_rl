name: Source snapshot bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    name: Exact source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Archive exact source
        shell: bash
        run: git archive --format=tar.gz --output=trade-rl-source.tar.gz HEAD

      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trade-rl-source-${{ github.event.pull_request.head.sha }}
          path: trade-rl-source.tar.gz
          if-no-files-found: error
          retention-days: 1
