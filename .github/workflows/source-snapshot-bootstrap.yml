name: Source snapshot bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    name: Exact source snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify immutable checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Archive exact source
        shell: bash
        run: git archive --format=tar.gz --output=trade-rl-source.tar.gz HEAD

      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trade-rl-source-${{ github.event.pull_request.head.sha }}
          path: trade-rl-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  test-wheelhouse:
    name: Pure Python test wheelhouse
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download pure Python test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download \
            --dest wheelhouse \
            --no-deps \
            gymnasium==0.29.1 \
            farama-notifications==0.0.4 \
            stable-baselines3==2.3.2 \
            sb3-contrib==2.3.0 \
            tensorboard==2.20.0
          python - <<'PY'
          from pathlib import Path
          bad = [path.name for path in Path('wheelhouse').iterdir() if 'none-any' not in path.name]
          if bad:
              raise SystemExit(f'non-portable wheels downloaded: {bad}')
          PY

      - name: Upload wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trade-rl-pure-python-test-wheelhouse
          path: wheelhouse
          if-no-files-found: error
          retention-days: 1
