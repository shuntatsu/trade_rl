name: Stack license fix on fit scope

on:
  push:
    branches:
      - fix/lean-license-contract
    paths:
      - ".github/workflows/stack-fit-base.yml"

permissions:
  contents: write

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout license branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/lean-license-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Merge fit scope branch without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/lean-fit-symbol-scope
          git merge --no-ff origin/fix/lean-fit-symbol-scope -m "Merge fit scope base into lean license contract"
          git status --short
          git push origin HEAD:fix/lean-license-contract
