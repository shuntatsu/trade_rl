name: Task 6 Format Fix

on:
  push:
    branches:
      - integration/universal-research-u3-u6

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Format exact files and self-delete
        shell: bash
        run: |
          uv sync --extra dev
          uv run ruff format tests/workflows/test_universal_training.py tests/workflows/test_universal_training_runner.py
          rm .github/workflows/task6-format-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format Universal workflow tests"
          git push origin HEAD:integration/universal-research-u3-u6
