name: Task 6 Regression Fix

on:
  push:
    branches:
      - integration/universal-research-u3-u6

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply regression fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          training = Path("trade_rl/integrations/sb3_training.py")
          text = training.read_text(encoding="utf-8")
          old_import = '''from trade_rl.integrations.sb3_universal_pretraining import (\n    _apply_universal_pretraining_if_configured,\n    _run_behavior_cloning_critic_warm_start_if_enabled,\n)\n'''
          new_import = '''from trade_rl.integrations.sb3_universal_pretraining import (\n    _apply_universal_pretraining_if_configured,\n    _run_behavior_cloning_critic_warm_start_if_enabled as _run_critic_warm_start_helper,\n)\nfrom trade_rl.integrations.universal_critic_warm_start import (\n    run_configured_critic_warm_start,\n)\n'''
          if old_import not in text:
              raise SystemExit("expected SB3 universal pretraining import block missing")
          text = text.replace(old_import, new_import, 1)

          anchor = "\ndef _resolved_vector_environment_kind(\n"
          if anchor not in text:
              raise SystemExit("SB3 resolved vector environment anchor missing")
          wrapper = '''\ndef _run_behavior_cloning_critic_warm_start_if_enabled(**kwargs: Any) -> Any:\n    return _run_critic_warm_start_helper(\n        **kwargs, run_warm_start=run_configured_critic_warm_start\n    )\n\n'''
          text = text.replace(anchor, wrapper + anchor, 1)

          old_callback = '''            checkpoint_callback = build_checkpoint_callback(\n                checkpoint_root=output_path.parent / "checkpoints",\n                algorithm=config.algorithm,\n                seed=seed,\n                interval_steps=config.resolved_checkpoint_interval,\n                max_checkpoints=config.max_checkpoints,\n                total_timesteps=target_total_timesteps,\n'''
          new_callback = '''            checkpoint_callback = build_checkpoint_callback(\n                checkpoint_root=output_path.parent / "checkpoints",\n                algorithm=config.algorithm,\n                seed=seed,\n                interval_steps=(\n                    0\n                    if config.max_checkpoints == 1\n                    else config.resolved_checkpoint_interval\n                ),\n                max_checkpoints=max(1, config.max_checkpoints - 1),\n                total_timesteps=target_total_timesteps,\n'''
          if old_callback not in text:
              raise SystemExit("checkpoint callback block missing")
          text = text.replace(old_callback, new_callback, 1)
          training.write_text(text, encoding="utf-8")

          helper = Path("trade_rl/integrations/sb3_universal_pretraining.py")
          helper_text = helper.read_text(encoding="utf-8")
          old_signature = '''    behavior_cloning_seed: int,\n    output_root: Path,\n) -> ConfiguredCriticWarmStart | None:\n'''
          new_signature = '''    behavior_cloning_seed: int,\n    output_root: Path,\n    run_warm_start: Callable[..., ConfiguredCriticWarmStart] = run_configured_critic_warm_start,\n) -> ConfiguredCriticWarmStart | None:\n'''
          if old_signature not in helper_text:
              raise SystemExit("critic warm-start helper signature missing")
          helper_text = helper_text.replace(old_signature, new_signature, 1)
          helper_text = helper_text.replace(
              "    return run_configured_critic_warm_start(\n",
              "    return run_warm_start(\n",
              1,
          )
          helper.write_text(helper_text, encoding="utf-8")

          core = Path("trade_rl/workflows/_market_walk_forward_core.py")
          core_text = core.read_text(encoding="utf-8")
          old_candidates_end = '''                ),\n            ]\n            if any(seed != member.seed for seed, _, _ in candidates):\n'''
          new_candidates_end = '''                ),\n            ]\n            unique_candidates: dict[str, tuple[int, str, Path]] = {}\n            for candidate in candidates:\n                unique_candidates.setdefault(candidate[1], candidate)\n            candidates = list(unique_candidates.values())\n            if any(seed != member.seed for seed, _, _ in candidates):\n'''
          if old_candidates_end not in core_text:
              raise SystemExit("walk-forward candidate assembly anchor missing")
          core_text = core_text.replace(old_candidates_end, new_candidates_end, 1)
          core.write_text(core_text, encoding="utf-8")
          PY

          rm .github/workflows/task6-regression-fix.yml
          uv sync --extra dev --extra train-sb3
          uv run ruff format trade_rl/integrations/sb3_training.py trade_rl/integrations/sb3_universal_pretraining.py trade_rl/workflows/_market_walk_forward_core.py
          python - <<'PY'
          from pathlib import Path
          size = Path("trade_rl/integrations/sb3_training.py").stat().st_size
          if size >= 61_440:
              raise SystemExit(f"sb3_training.py too large after format: {size}")
          print(f"sb3_training.py size: {size}")
          PY
          uv run ruff check trade_rl/integrations/sb3_training.py trade_rl/integrations/sb3_universal_pretraining.py trade_rl/workflows/_market_walk_forward_core.py tests/integrations/test_sb3_universal_critic_warm_start.py tests/integrations/test_single_symbol_training_smoke.py tests/workflows/test_market_walk_forward.py tests/workflows/test_walk_forward_manifest_provenance.py
          uv run mypy trade_rl/integrations/sb3_training.py trade_rl/integrations/sb3_universal_pretraining.py trade_rl/workflows/_market_walk_forward_core.py
          uv run pytest -q \
            tests/integrations/test_sb3_universal_critic_warm_start.py \
            tests/integrations/test_single_symbol_training_smoke.py::test_one_action_ppo_publishes_reloadable_checkpoint \
            tests/workflows/test_market_walk_forward.py::test_market_walk_forward_trains_selects_and_evaluates_sealed_test_once \
            tests/workflows/test_market_walk_forward.py::test_structured_walk_forward_trains_three_seed_ensemble_end_to_end \
            tests/workflows/test_market_walk_forward.py::test_market_walk_forward_publishes_closed_loop_execution_sensitivity \
            tests/workflows/test_walk_forward_manifest_provenance.py::test_market_walk_forward_publishes_dedicated_manifest_and_provenance
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore checkpoint and critic warm-start contracts"
          git push origin HEAD:integration/universal-research-u3-u6
