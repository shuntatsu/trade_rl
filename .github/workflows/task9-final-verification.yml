name: Task 9 Final Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  green:
    name: GREEN event precedence fix
    if: github.head_ref == 'agent/task9-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout writable target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/hierarchical-bc-actor-design
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply minimal precedence fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/learning/hierarchical_teacher_labels.py')
          text = path.read_text(encoding='utf-8')
          old = '    reverse = changed & (current_weights * target_actions < 0.0)\n'
          new = (
              '    reverse = (\n'
              '        changed\n'
              '        & ~enter\n'
              '        & ~exit_\n'
              '        & (current_weights * target_actions < 0.0)\n'
              '    )\n'
          )
          if old not in text:
              raise RuntimeError('event reverse classification block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Verify GREEN and static contracts
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/learning/hierarchical_teacher_labels.py \
            tests/learning/test_hierarchical_teacher_labels.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run pytest -q \
            tests/learning/test_hierarchical_teacher_labels.py \
            tests/learning/test_hierarchical_bc_metrics.py
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add trade_rl/learning/hierarchical_teacher_labels.py
          git diff --cached --check
          git commit -m "fix: prioritize enter and exit teacher events"
          git pull --rebase origin agent/hierarchical-bc-actor-design
          git push origin HEAD:agent/hierarchical-bc-actor-design
