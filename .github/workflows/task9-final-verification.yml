name: Task 9 Final Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  red:
    name: RED event precedence regression
    if: github.head_ref == 'agent/task9-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test-only target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 2fcdfb14d4972b8fcbfd30bf7ede5333853acfd9
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Require expected failing regression
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/learning/test_hierarchical_teacher_labels.py::test_effectively_flat_enter_exit_take_precedence_over_reverse \
            > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -eq 1
          grep -q "FAILED" red.log
          grep -q "AssertionError" red.log
