name: Task 9 Remediate Target

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.head_ref == 'agent/task9-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout writable target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/hierarchical-bc-actor-design
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 9 remediation batch
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-task9-format.yml \
            .github/workflows/tmp-task9-sequence-gradient.yml
          rm -rf docs/superpowers

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          root = Path('.')
          required_defaults: dict[str, object] = {
              'hierarchical_gate_temperature': 1.0,
              'behavior_cloning_gate_loss_weight': 1.0,
              'behavior_cloning_target_loss_weight': 1.0,
              'behavior_cloning_composed_loss_weight': 1.0,
              'behavior_cloning_gate_change_threshold': 0.05,
              'behavior_cloning_max_positive_class_weight': 20.0,
              'behavior_cloning_min_gate_precision': 0.0,
              'behavior_cloning_min_gate_recall': 0.0,
              'behavior_cloning_max_active_target_rmse': 1.0,
              'behavior_cloning_min_activity_ratio': 0.0,
              'behavior_cloning_max_activity_ratio': 1.0,
              'behavior_cloning_min_causal_holdout_trades': 0,
              'behavior_cloning_max_causal_holdout_regret': 0.0,
          }

          def migrate(value: Any) -> bool:
              changed = False
              if isinstance(value, dict):
                  if value.get('schema_version') == 'training_run_config_v2':
                      training = value.get('training')
                      if not isinstance(training, dict):
                          raise RuntimeError('training_run_config_v2 has no training mapping')
                      value['schema_version'] = 'training_run_config_v3'
                      encoder = str(training.get('observation_encoder', 'asset_set')).strip().lower()
                      training.setdefault(
                          'policy_actor_head',
                          'hierarchical_gate_target_v1'
                          if encoder == 'hierarchical_sequence_v2'
                          else 'standard_continuous_v1',
                      )
                      for name, default in required_defaults.items():
                          training.setdefault(name, default)
                      changed = True
                  for nested in value.values():
                      changed = migrate(nested) or changed
              elif isinstance(value, list):
                  for nested in value:
                      changed = migrate(nested) or changed
              return changed

          for base in (root / 'examples', root / 'tests'):
              if not base.is_dir():
                  continue
              for path in sorted(base.rglob('*.json')):
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  if migrate(payload):
                      path.write_text(
                          json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
                          encoding='utf-8',
                      )
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/rl/sequence_policy.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def forward(
              self, value: torch.Tensor, available: torch.Tensor | None = None
          ) -> torch.Tensor:
              encoded = self.forward_sequence(value)
              if available is None:
                  return self.projection(encoded[:, -1])
              if available.shape != value.shape[:2]:
                  raise ValueError("availability mask must match batch and time dimensions")
              mask = available.to(dtype=torch.bool)
              positions = torch.arange(value.shape[1], device=value.device).expand_as(mask)
              indices = positions.masked_fill(~mask, -1).max(dim=1).values
              safe = indices.clamp_min(0)
              valid = indices >= 0
              batch_indices = torch.arange(value.shape[0], device=value.device)
              valid_batch_indices = batch_indices[valid]
              selected = encoded[valid_batch_indices, safe[valid]]
              projected = self.projection(selected)
              output = (encoded.sum(dim=(1, 2)).unsqueeze(1) * 0.0).expand(
                  -1, self.latent_dim
              )
              return output.clone().index_copy(0, valid_batch_indices, projected)
          '''
          new = '''    def forward(
              self, value: torch.Tensor, available: torch.Tensor | None = None
          ) -> torch.Tensor:
              if available is None:
                  encoded = self.forward_sequence(value)
                  return self.projection(encoded[:, -1])
              if available.shape != value.shape[:2]:
                  raise ValueError("availability mask must match batch and time dimensions")
              mask = available.to(dtype=torch.bool)
              positions = torch.arange(value.shape[1], device=value.device).expand_as(mask)
              indices = positions.masked_fill(~mask, -1).max(dim=1).values
              valid = indices >= 0
              if not torch.any(valid):
                  return (value.sum(dim=(1, 2)).unsqueeze(1) * 0.0).expand(
                      -1, self.latent_dim
                  )
              valid_values = value[valid]
              encoded = self.forward_sequence(valid_values)
              valid_indices = indices[valid]
              selected = encoded[
                  torch.arange(encoded.shape[0], device=value.device), valid_indices
              ]
              projected = self.projection(selected)
              output = projected.new_zeros((value.shape[0], self.latent_dim))
              batch_indices = torch.arange(value.shape[0], device=value.device)[valid]
              return output.index_copy(0, batch_indices, projected)
          '''
          if old not in text:
              raise RuntimeError('current sequence forward implementation was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rl/test_sequence_policy_core.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '    assert projection_input_shapes == [torch.Size((3, 8))]\n',
                  '    assert projection_input_shapes == [torch.Size((2, 8))]\n',
              ),
              (
                  '''    torch.testing.assert_close(
              case.optimized_input_gradient,
              case.legacy_input_gradient,
              rtol=1e-9,
              atol=1e-10,
          )
          ''',
                  '''    torch.testing.assert_close(
              case.optimized_input_gradient[:2],
              case.legacy_input_gradient[:2],
              rtol=1e-9,
              atol=1e-10,
          )
          ''',
              ),
              (
                  '''    _assert_gradient_semantics(
              case.optimized_input_gradient,
              case.legacy_input_gradient,
          )
          ''',
                  '''    _assert_gradient_semantics(
              case.optimized_input_gradient[:2],
              case.legacy_input_gradient[:2],
          )
          ''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'sequence test fragment was not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rl/test_sequence_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old_space = '''        "active": spaces.Box(0.0, 1.0, shape=(3,)),
          }
          '''
          new_space = '''        "active": spaces.Box(0.0, 1.0, shape=(3,)),
              "current_weights": spaces.Box(-1.0, 1.0, shape=(3,)),
          }
          '''
          if old_space not in text:
              raise RuntimeError('diagnostic observation space fragment was not found')
          text = text.replace(old_space, new_space, 1)
          old_observation = '''        "active": torch.tensor(
                  [[1.0, 1.0, 0.0], [1.0, 0.0, 1.0]],
                  dtype=torch.float32,
              ),
          }
          '''
          new_observation = '''        "active": torch.tensor(
                  [[1.0, 1.0, 0.0], [1.0, 0.0, 1.0]],
                  dtype=torch.float32,
              ),
              "current_weights": torch.zeros(2, 3, dtype=torch.float32),
          }
          '''
          if old_observation not in text:
              raise RuntimeError('diagnostic observation fragment was not found')
          path.write_text(
              text.replace(old_observation, new_observation, 1), encoding='utf-8'
          )
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integrations/test_parallel_sequence_environments.py')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('        per_symbol_width=6,\n', '        per_symbol_width=11,\n'),
              (
                  '    current = np.arange(layout.size, dtype=np.float32)\n',
                  '''    current = np.linspace(-0.5, 0.5, layout.size, dtype=np.float32)
              current[: layout.n_symbols * layout.per_symbol_width].reshape(
                  layout.n_symbols, layout.per_symbol_width
              )[:, layout.current_weight_column] = np.asarray((0.25, -0.5))
          ''',
              ),
              (
                  '    for key in ("current_snapshot", "asset_state", "global_state", "active"):\n',
                  '''    for key in (
              "current_snapshot",
              "asset_state",
              "global_state",
              "active",
              "current_weights",
          ):
          ''',
              ),
              (
                  '''            "current_snapshot": spaces.Box(
                      -np.inf, np.inf, shape=(1, 1), dtype=np.float32
                  ),
          ''',
                  '''            "current_snapshot": spaces.Box(
                      -np.inf, np.inf, shape=(1, 1), dtype=np.float32
                  ),
                  "current_weights": spaces.Box(
                      -1.0, 1.0, shape=(1,), dtype=np.float32
                  ),
          ''',
              ),
              (
                  '''    assert tuple(environment.observation_space.spaces) == (
              "current_snapshot",
              "decision_index",
          )
          ''',
                  '''    assert tuple(environment.observation_space.spaces) == (
              "current_snapshot",
              "current_weights",
              "decision_index",
          )
          ''',
              ),
              (
                  '''        "current_snapshot": np.asarray(indices, dtype=np.float32).reshape(-1, 1, 1),
              }
          ''',
                  '''        "current_snapshot": np.asarray(indices, dtype=np.float32).reshape(-1, 1, 1),
              "current_weights": np.zeros((len(indices), 1), dtype=np.float32),
          }
          ''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'parallel sequence fixture fragment was not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Format and lint remediation
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/rl/sequence_policy.py \
            tests/rl/test_sequence_policy_core.py \
            tests/rl/test_sequence_diagnostics.py \
            tests/integrations/test_parallel_sequence_environments.py
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run python .github/check_workflow_security.py .
      - name: Run previously failing groups
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/examples \
            tests/studio/test_catalog.py \
            tests/workflows/test_explicit_sealed_ledger_mode.py \
            tests/workflows/test_market_walk_forward.py \
            tests/workflows/test_walk_forward_manifest_provenance.py \
            tests/rl/test_sequence_policy_core.py \
            tests/rl/test_sequence_diagnostics.py \
            tests/integrations/test_parallel_sequence_environments.py \
            tests/test_current_documentation_contract.py
      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete hierarchical actor migration contracts"
          git push origin HEAD:agent/hierarchical-bc-actor-design
