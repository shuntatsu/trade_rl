name: Temporary architecture source export

on:
  push:
    branches:
      - agent/architecture-boundary-hardening-current
    paths:
      - .github/workflows/temp-architecture-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-current
          persist-credentials: false

      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/trade-rl-current-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-current-source
          path: /tmp/trade-rl-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
