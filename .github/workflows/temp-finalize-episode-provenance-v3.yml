name: Temporary Finalize Episode Provenance V3

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-finalize-episode-provenance-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Apply provenance v3 patch
        run: |
          awk '
            /^          python - <<'"'"'PY'"'"'$/ { capture=1; next }
            /^          PY$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/temp-episode-provenance-v3.yml > /tmp/episode-provenance-v3.py
          python /tmp/episode-provenance-v3.py
      - name: Format and verify
        run: |
          uv run ruff format trade_rl/learning/episode_teacher_artifact.py tests/learning/test_episode_teacher_provenance.py
          uv run ruff check --fix trade_rl/learning/episode_teacher_artifact.py tests/learning/test_episode_teacher_provenance.py
          uv run pytest -q \
            tests/learning/test_episode_teacher_provenance.py \
            tests/learning/test_episode_teacher_integration.py \
            tests/learning/test_oracle_bellman_contracts.py
          uv run ruff check trade_rl/learning/episode_teacher_artifact.py tests/learning/test_episode_teacher_provenance.py
          uv run ruff format --check trade_rl/learning/episode_teacher_artifact.py tests/learning/test_episode_teacher_provenance.py
          uv run mypy trade_rl/learning/episode_teacher_artifact.py
      - name: Remove temporary workflows
        run: |
          rm .github/workflows/temp-episode-provenance-v3.yml
          rm .github/workflows/temp-episode-provenance-v3-retry.yml
          rm .github/workflows/temp-episode-provenance-v3-final.yml
          rm .github/workflows/temp-finalize-episode-provenance-v3.yml
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/episode_teacher_artifact.py \
            tests/learning/test_episode_teacher_provenance.py \
            .github/workflows/temp-episode-provenance-v3.yml \
            .github/workflows/temp-episode-provenance-v3-retry.yml \
            .github/workflows/temp-episode-provenance-v3-final.yml \
            .github/workflows/temp-finalize-episode-provenance-v3.yml
          git commit -m "fix: protect Oracle runtime provenance integrity"
          git push origin HEAD:agent/oracle-bellman-batched-solver
