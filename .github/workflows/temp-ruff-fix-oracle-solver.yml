name: Temporary Tiny CUDA Smoke Format

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-ruff-fix-oracle-solver.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: uv sync --extra dev
      - name: Apply formatter
        run: uv run ruff format trade_rl/operations/cuda_training_smoke.py
      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-cuda-training-smoke
          path: trade_rl/operations/cuda_training_smoke.py
          if-no-files-found: error
