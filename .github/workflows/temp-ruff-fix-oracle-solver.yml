name: Temporary Tiny CUDA Smoke Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-ruff-fix-oracle-solver.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Verify tiny CUDA smoke
        run: |
          uv run pytest -q tests/operations/test_cuda_training_smoke.py
          uv run ruff check trade_rl/operations/cuda_training_smoke.py tests/operations/test_cuda_training_smoke.py
          uv run ruff format --check trade_rl/operations/cuda_training_smoke.py tests/operations/test_cuda_training_smoke.py
          uv run mypy trade_rl/operations/cuda_training_smoke.py
