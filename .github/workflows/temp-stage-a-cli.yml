name: Temp Stage A CLI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-cli-wiring
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - run: uv run ruff check --fix trade_rl/cli/stage_a.py trade_rl/cli/__init__.py tests/cli/test_stage_a_cli.py
      - run: uv run ruff format trade_rl/cli/stage_a.py trade_rl/cli/__init__.py tests/cli/test_stage_a_cli.py
      - run: PYTHONPATH=. uv run pytest -q tests/cli/test_stage_a_cli.py
      - run: uv run ruff check trade_rl/cli/stage_a.py trade_rl/cli/__init__.py tests/cli/test_stage_a_cli.py
      - run: uv run ruff format --check trade_rl/cli/stage_a.py trade_rl/cli/__init__.py tests/cli/test_stage_a_cli.py
      - run: uv run mypy .
      - run: uv run lint-imports
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/cli/stage_a.py trade_rl/cli/__init__.py tests/cli/test_stage_a_cli.py
          git commit -m "style: format Stage A CLI"
          git push origin HEAD:agent/stage-a6b2-cli-wiring
