name: Temporary Apply C1 CVaR Fix

on:
  push:
    branches:
      - agent/causal-scenario-oracle-c1

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/causal-scenario-oracle-c1
          fetch-depth: 0

      - name: Apply verified correction
        run: |
          set -euo pipefail
          echo "484e4a4177fd71fcbf826f02bb33c12a79a8c3e2ba375f8342fd33d3fa24e113  .github/c1-downside-cvar-fix.patch" | sha256sum --check
          git apply --check --verbose .github/c1-downside-cvar-fix.patch
          git apply --index .github/c1-downside-cvar-fix.patch

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install exact development environment
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Format corrected files
        run: |
          uv run ruff format trade_rl/evaluation/causal_scenario_values.py tests/evaluation/test_causal_scenario_evaluator.py
          uv run ruff check --fix trade_rl/evaluation/causal_scenario_values.py tests/evaluation/test_causal_scenario_evaluator.py
          git add trade_rl/evaluation/causal_scenario_values.py tests/evaluation/test_causal_scenario_evaluator.py

      - name: Static and architecture gates
        run: |
          uv run ruff check .
          uv run ruff format --check --diff .
          uv run mypy .
          uv run lint-imports
          uv run python -m compileall -q trade_rl tests

      - name: Focused tests and strict coverage
        run: |
          uv run pytest tests/evaluation/test_causal_scenario_*.py tests/architecture/test_causal_scenario_evaluator_boundary.py -q
          uv run pytest tests/evaluation/test_causal_scenario_*.py --cov=trade_rl.evaluation.causal_scenario_values --cov=trade_rl.evaluation.causal_scenario_artifact --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Complete repository tests
        run: uv run pytest -q

      - name: Commit verified correction
        run: |
          set -euo pipefail
          git rm .github/c1-downside-cvar-fix.patch
          git rm .github/workflows/temporary-apply-c1-cvar-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: compute CVaR from downside losses only"
          git push origin HEAD:agent/causal-scenario-oracle-c1
