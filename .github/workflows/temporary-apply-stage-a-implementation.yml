name: Temporary Diagnose Stage A Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-apply-stage-a-implementation.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Diagnose staged patch bytes
        shell: bash
        run: |
          set -x
          wc -c .github/stage-a-implementation.patch.gz.b64.part*
          sha256sum .github/stage-a-implementation.patch.gz.b64.part*
          cat .github/stage-a-implementation.patch.gz.b64.part* > /tmp/stage-a-implementation.patch.gz.b64
          wc -c /tmp/stage-a-implementation.patch.gz.b64
          sha256sum /tmp/stage-a-implementation.patch.gz.b64
          LC_ALL=C grep -n '[^A-Za-z0-9+/=]' /tmp/stage-a-implementation.patch.gz.b64 || true
          base64 --decode /tmp/stage-a-implementation.patch.gz.b64 > /tmp/stage-a-implementation.patch.gz
          gzip --test /tmp/stage-a-implementation.patch.gz
