name: Temporary Apply Stage A Ruff Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-apply-stage-a-ruff-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Apply canonical Ruff import ordering
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/workflows/test_stage_a_execution_observation.py
            tests/workflows/test_stage_a_policy_producer_orchestration.py
            tests/workflows/test_stage_a_policy_source_serving.py
            tests/workflows/test_stage_a_zero_shot_artifacts.py
            tests/workflows/test_stage_a_zero_shot_runner.py
            tests/workflows/test_stage_a_zero_shot_runner_contracts.py
            trade_rl/workflows/stage_a_execution_producer.py
            trade_rl/workflows/stage_a_policy_source.py
            trade_rl/workflows/stage_a_production_evaluator.py
          )
          uvx --from ruff==0.15.21 ruff check --fix "${files[@]}"
          uvx --from ruff==0.15.21 ruff check "${files[@]}"
          rm -f .github/stage-a-ruff-fix.patch.gz.b64.part*
          rm -f .github/atomic-tree-probe.txt
          rm -f .github/workflows/temporary-apply-stage-a-ruff-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: sort Stage A imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
