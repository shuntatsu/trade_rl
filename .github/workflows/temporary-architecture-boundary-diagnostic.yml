name: Temporary architecture boundary diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-architecture-boundary-diagnostic.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  diagnose-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Run RED, patch, and focused verification
        id: attempt
        shell: bash
        run: |
          set +e

          uv run pytest tests/architecture/test_config_and_export_boundaries.py -q > red.log 2>&1
          red_status=$?

          uv run python tools/apply_architecture_boundary_refactor.py > patch.log 2>&1
          patch_status=$?

          ruff_status=99
          green_status=99
          import_status=99
          mypy_status=99

          if [ "$patch_status" -eq 0 ]; then
            uv run ruff check --fix . > ruff.log 2>&1
            ruff_status=$?
            uv run ruff format . >> ruff.log 2>&1
            format_status=$?
            if [ "$ruff_status" -eq 0 ]; then
              ruff_status=$format_status
            fi
          fi

          if [ "$patch_status" -eq 0 ] && [ "$ruff_status" -eq 0 ]; then
            uv run pytest \
              tests/architecture/test_config_and_export_boundaries.py \
              tests/workflows/test_training_run_config.py \
              tests/rl/test_structured_export.py \
              tests/serving \
              tests/studio \
              -q > green.log 2>&1
            green_status=$?

            uv run lint-imports > import.log 2>&1
            import_status=$?

            uv run mypy trade_rl > mypy.log 2>&1
            mypy_status=$?
          fi

          {
            echo "## Temporary architecture refactor diagnostic"
            echo
            echo "- RED status: ${red_status} (expected non-zero)"
            echo "- Patch status: ${patch_status}"
            echo "- Ruff/format status: ${ruff_status}"
            echo "- Focused pytest status: ${green_status}"
            echo "- Import Linter status: ${import_status}"
            echo "- MyPy status: ${mypy_status}"
            for name in red patch ruff green import mypy; do
              if [ -f "${name}.log" ]; then
                echo
                echo "<details><summary>${name}.log tail</summary>"
                echo
                echo '```text'
                tail -n 120 "${name}.log"
                echo '```'
                echo "</details>"
              fi
            done
          } > diagnostic.md

          if [ "$red_status" -eq 0 ]; then
            echo "RED test unexpectedly passed" >> diagnostic.md
            final_status=1
          elif [ "$patch_status" -ne 0 ] || [ "$ruff_status" -ne 0 ] || \
               [ "$green_status" -ne 0 ] || [ "$import_status" -ne 0 ] || \
               [ "$mypy_status" -ne 0 ]; then
            final_status=1
          else
            final_status=0
          fi

          echo "final_status=${final_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit successful refactor
        if: steps.attempt.outputs.final_status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden config and export boundaries"
          git push origin HEAD:agent/architecture-boundary-hardening-20260801

      - name: Post diagnostic to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 347 --body-file diagnostic.md

      - name: Remove temporary workflow from main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/temporary-architecture-boundary-diagnostic.yml"
          workflow_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" \
            --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message='chore: remove temporary architecture diagnostic' \
            -f sha="${workflow_sha}" \
            -f branch='main'
