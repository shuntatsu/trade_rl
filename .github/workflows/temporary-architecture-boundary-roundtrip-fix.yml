name: Temporary architecture boundary roundtrip fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-architecture-boundary-roundtrip-fix.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Correct transformation script and ownership test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_architecture_boundary_refactor.py")
          source = path.read_text(encoding="utf-8")
          replacements = (
              ("import ast\nimport textwrap\n", "import ast\nimport re\nimport textwrap\n"),
              (
                  "        start = node.lineno - 1\n",
                  "        decorator_lines = [\n"
                  "            decorator.lineno\n"
                  "            for decorator in getattr(node, \"decorator_list\", ())\n"
                  "        ]\n"
                  "        start = min((node.lineno, *decorator_lines)) - 1\n",
              ),
              (
                  'source = source.replace("_TIMEFRAMES", "STRUCTURED_TIMEFRAMES")',
                  'source = re.sub(r"\\b_TIMEFRAMES\\b", "STRUCTURED_TIMEFRAMES", source)',
              ),
              (
                  '+ "    TrainingRunConfig,\\n"\n        + ")\\n",',
                  '+ "    TrainingRunConfig,\\n"\n'
                  '        + "    _signal_artifact_digest,\\n"\n'
                  '        + ")\\n",',
              ),
              (
                  "        from trade_rl.domain.common import require_sha256\n",
                  "        from trade_rl.domain.canonical_json import to_json_value\n"
                  "        from trade_rl.domain.common import require_sha256\n",
              ),
              (
                  "        def _validated_policy_identity(value: object) -> dict[str, object]:\n"
                  "            if not isinstance(value, Mapping) or not value:\n"
                  "                raise ValueError(\"structured export requires policy identity\")\n"
                  "            payload = dict(value)\n",
                  "        def _validated_policy_identity(value: object) -> dict[str, object]:\n"
                  "            normalized = to_json_value(value)\n"
                  "            if not isinstance(normalized, dict) or not normalized:\n"
                  "                raise ValueError(\"structured export requires policy identity\")\n"
                  "            payload: dict[str, object] = normalized\n",
              ),
          )
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              source = source.replace(old, new, 1)

          marker = "    studio_path.write_text(studio_source.replace(old, new, 1), encoding=\"utf-8\")\n"
          addition = marker + "\n" + '''    transfer_test_path = ROOT / "tests/workflows/test_training_run_transfer_config.py"\n    transfer_test = transfer_test_path.read_text(encoding="utf-8")\n    old_module = "import trade_rl.workflows.training_run as training_run_module"\n    new_module = "import trade_rl.rl.training_run_config as training_run_config_module"\n    if transfer_test.count(old_module) != 1 or transfer_test.count("training_run_module,") != 1:\n        raise RuntimeError("transfer identity monkeypatch markers are not unique")\n    transfer_test = transfer_test.replace(old_module, new_module, 1)\n    transfer_test = transfer_test.replace(\n        "training_run_module,", "training_run_config_module,", 1\n    )\n    transfer_test_path.write_text(transfer_test, encoding="utf-8")\n'''
          if source.count(marker) != 1:
              raise SystemExit("Studio write marker is not unique")
          source = source.replace(marker, addition, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify and capture
        id: verify
        shell: bash
        run: |
          set +e
          uv run pytest tests/architecture/test_config_and_export_boundaries.py -q > red.log 2>&1
          red_status=$?
          uv run python tools/apply_architecture_boundary_refactor.py > transform.log 2>&1
          transform_status=$?
          ruff_status=99; pytest_status=99; import_status=99; mypy_status=99
          if [ "$transform_status" -eq 0 ]; then
            { uv run ruff check --fix .; uv run ruff format .; uv run ruff check .; uv run ruff format --check .; } > ruff.log 2>&1
            ruff_status=$?
          fi
          if [ "$transform_status" -eq 0 ] && [ "$ruff_status" -eq 0 ]; then
            uv run pytest tests/architecture/test_config_and_export_boundaries.py tests/workflows/test_training_run_config.py tests/workflows/test_training_run_transfer_config.py tests/rl/test_structured_export.py tests/serving tests/studio -q > focused.log 2>&1
            pytest_status=$?
            uv run lint-imports > imports.log 2>&1; import_status=$?
            uv run mypy trade_rl > mypy.log 2>&1; mypy_status=$?
          fi
          final_status=0
          if [ "$red_status" -eq 0 ] || [ "$transform_status" -ne 0 ] || [ "$ruff_status" -ne 0 ] || [ "$pytest_status" -ne 0 ] || [ "$import_status" -ne 0 ] || [ "$mypy_status" -ne 0 ]; then final_status=1; fi
          {
            echo "## Canonical round-trip architecture result"; echo
            echo "- RED status: ${red_status} (expected non-zero)"
            echo "- Transform status: ${transform_status}"
            echo "- Ruff/format status: ${ruff_status}"
            echo "- Focused pytest status: ${pytest_status}"
            echo "- Import Linter status: ${import_status}"
            echo "- MyPy status: ${mypy_status}"
            for name in red transform ruff focused imports mypy; do
              if [ -f "${name}.log" ]; then echo; echo "<details><summary>${name}.log tail</summary>"; echo; echo '```text'; tail -n 100 "${name}.log"; echo '```'; echo "</details>"; fi
            done
          } > result.md
          echo "final_status=${final_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit verified refactor
        if: steps.verify.outputs.final_status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden config and export boundaries"
          git push origin HEAD:agent/architecture-boundary-hardening-20260801

      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 347 --body-file result.md

      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p=".github/workflows/temporary-architecture-boundary-roundtrip-fix.yml"
          s="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${p}" -f message='chore: remove temporary roundtrip fix' -f sha="${s}" -f branch='main'
