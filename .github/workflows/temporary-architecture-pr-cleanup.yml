name: Temporary architecture PR cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-architecture-pr-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Remove generated diagnostics and restore lockfile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -f result.md
          git checkout origin/main -- uv.lock
          git diff --check
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated verification artifacts"
          git push origin HEAD:agent/architecture-boundary-hardening-20260801

      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          p=".github/workflows/temporary-architecture-pr-cleanup.yml"
          s="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${p}?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${p}" -f message='chore: remove temporary PR cleanup' -f sha="${s}" -f branch='main'
