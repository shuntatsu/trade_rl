name: Temporary BC format patch

on:
  push:
    branches:
      - agent/bc-economic-admission-gate

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'style: format BC digest compatibility condition' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/bc-economic-admission-gate
          fetch-depth: 0

      - name: Apply exact Ruff format change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/training.py")
          source = path.read_text(encoding="utf-8")
          old = '''            or self.behavior_cloning_min_causal_holdout_net_return_lower_bound
                      != -1.0
          '''
          new = '''            or self.behavior_cloning_min_causal_holdout_net_return_lower_bound != -1.0
          '''
          if source.count(old) != 1:
              raise SystemExit("unexpected BC digest condition")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit exact format change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/training.py
          git diff --cached --check
          git commit -m "style: format BC digest compatibility condition"
          git push origin HEAD:agent/bc-economic-admission-gate
