name: Temporary C3 CLI Patch

on:
  push:
    branches:
      - agent/causal-scenario-c3
    paths:
      - .github/workflows/temporary-c3-cli-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - name: Patch dispatcher and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/cli/extended.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    if arguments[:2] == ["train", "run"]:\n        return _run_training(arguments[2:], stdout=output, stderr=errors)\n'''
          replacement = '''    if arguments[:2] == ["causal-scenario", "gate"]:\n        from trade_rl.cli.causal_scenario import run_gate\n\n        return run_gate(arguments[2:], stdout=output, stderr=errors)\n    if arguments[:2] == ["train", "run"]:\n        return _run_training(arguments[2:], stdout=output, stderr=errors)\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one dispatcher anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-c3-cli-patch.yml
          git add trade_rl/cli/extended.py
          git commit -m "feat: dispatch causal scenario gate CLI"
          git push origin HEAD:agent/causal-scenario-c3
