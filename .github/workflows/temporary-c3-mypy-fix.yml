name: Temporary C3 Mypy Fix

on:
  push:
    branches:
      - agent/causal-scenario-c3
    paths:
      - .github/workflows/temporary-c3-mypy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --extra dev --extra train-sb3
      - name: Patch, verify, and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/causal_scenario_c3_artifact.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from typing import Final\n\nfrom trade_rl.artifacts.codec"
          new_import = "from typing import Final\n\nimport numpy as np\n\nfrom trade_rl.artifacts.codec"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected numpy import anchor")
          text = text.replace(old_import, new_import)
          old_value = '''        realized_candidate_advantages=[
            _strict_number(value, field=f"{field}.realized_candidate_advantages")
            for value in advantages
        ],'''
          new_value = '''        realized_candidate_advantages=np.asarray(
            [
                _strict_number(
                    value, field=f"{field}.realized_candidate_advantages"
                )
                for value in advantages
            ],
            dtype=np.float64,
        ),'''
          if text.count(old_value) != 1:
              raise SystemExit("unexpected advantage loader anchor")
          path.write_text(text.replace(old_value, new_value), encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/causal_scenario_c3_artifact.py
          uv run mypy trade_rl/evaluation/causal_scenario_c3_artifact.py
          uv run pytest tests/evaluation/test_causal_scenario_c3_integration.py -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-c3-mypy-fix.yml
          git add trade_rl/evaluation/causal_scenario_c3_artifact.py
          git commit -m "fix: normalize loaded C3 advantage arrays"
          git push origin HEAD:agent/causal-scenario-c3
