name: Temporary C3 Targeted

on:
  push:
    branches:
      - agent/causal-scenario-c3

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/causal-scenario-c3
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run pytest tests/evaluation/test_causal_scenario_c3.py -q
