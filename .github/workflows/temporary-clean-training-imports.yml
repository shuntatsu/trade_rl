name: Temporary training import cleanup

on:
  push:
    branches:
      - fix/evidence-stage-transaction-v2
    paths:
      - .github/workflows/temporary-clean-training-imports.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/evidence-stage-transaction-v2
          persist-credentials: true

      - name: Clean imports exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/training_run.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''from trade_rl.simulation.execution_promotion import (
              EXECUTION_EVIDENCE_FILE_NAME,
              ExecutionPromotionError,
              execution_evidence_from_cost,
              load_execution_evidence,
              validate_execution_promotion,
              write_execution_evidence,
          )''',
                  '''from trade_rl.simulation.execution_promotion import (
              EXECUTION_EVIDENCE_FILE_NAME,
              ExecutionPromotionError,
              validate_execution_promotion,
              write_execution_evidence,
          )''',
              ),
              (
                  '''from trade_rl.workflows.execution_promotion_artifacts import (
              ExecutionPromotionArtifacts,
              load_execution_promotion_artifacts,
          )
          from trade_rl.workflows.training_execution_evidence import (
              resolve_training_execution_inputs,
          )
          from trade_rl.workflows.selection_authorization import (
              SelectionAuthorization,
              SelectionProposal,
              load_selection_authorization,
              load_selection_proposal,
          )''',
                  '''from trade_rl.workflows.execution_promotion_artifacts import (
              ExecutionPromotionArtifacts,
              load_execution_promotion_artifacts,
          )
          from trade_rl.workflows.selection_authorization import (
              SelectionAuthorization,
              SelectionProposal,
              load_selection_authorization,
              load_selection_proposal,
          )
          from trade_rl.workflows.training_execution_evidence import (
              resolve_training_execution_inputs,
          )''',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "trade-rl-automation"
          git config user.email "actions@users.noreply.github.com"
          git add trade_rl/workflows/training_run.py
          git commit -m "style: clean training evidence imports"
          git push origin HEAD:fix/evidence-stage-transaction-v2
