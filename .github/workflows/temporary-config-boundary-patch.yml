name: Temporary config boundary patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-config-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout architecture branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Apply public-boundary cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config_path = Path("trade_rl/rl/training_run_config.py")
          config = config_path.read_text(encoding="utf-8")
          old_identity = '''            "alpha_artifact_digest": _signal_artifact_digest(
              self.alpha_artifact, kind="alpha"
          ),
          "environment": asdict(self.environment),
          "factor_artifact_digest": _signal_artifact_digest(
              self.factor_artifact, kind="factor"
          ),
'''
          new_identity = '''            "alpha_artifact_digest": self.alpha_artifact_digest,
          "environment": asdict(self.environment),
          "factor_artifact_digest": self.factor_artifact_digest,
'''
          if config.count(old_identity) != 1:
              raise SystemExit("identity helper block mismatch")
          config = config.replace(old_identity, new_identity, 1)

          marker = "    def resolve_artifact_paths(self, base: Path) -> TrainingRunConfig:\n"
          properties = '''    @property
  def alpha_artifact_digest(self) -> str | None:
      """Return the validated alpha artifact identity, when configured."""

      return _signal_artifact_digest(self.alpha_artifact, kind="alpha")

  @property
  def factor_artifact_digest(self) -> str | None:
      """Return the validated factor artifact identity, when configured."""

      return _signal_artifact_digest(self.factor_artifact, kind="factor")

'''
          if config.count(marker) != 1:
              raise SystemExit("property insertion marker mismatch")
          config = config.replace(marker, properties + marker, 1)
          config_path.write_text(config, encoding="utf-8")

          workflow_path = Path("trade_rl/workflows/training_run.py")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_import = '''from trade_rl.rl.training_run_config import (
  TrainingRunConfig,
  _signal_artifact_digest,
)
'''
          new_import = '''from trade_rl.rl.training_run_config import (
  TRAINING_RUN_CONFIG_SCHEMA as TRAINING_RUN_CONFIG_SCHEMA,
  TrainingRunConfig,
)
'''
          if workflow.count(old_import) != 1:
              raise SystemExit("workflow import block mismatch")
          workflow = workflow.replace(old_import, new_import, 1)

          old_environment = '''            "alpha_artifact_digest": _signal_artifact_digest(
              config.alpha_artifact, kind="alpha"
          ),
          "environment": asdict(config.environment),
          "factor_artifact_digest": _signal_artifact_digest(
              config.factor_artifact, kind="factor"
          ),
'''
          new_environment = '''            "alpha_artifact_digest": config.alpha_artifact_digest,
          "environment": asdict(config.environment),
          "factor_artifact_digest": config.factor_artifact_digest,
'''
          if workflow.count(old_environment) != 1:
              raise SystemExit("environment helper block mismatch")
          workflow = workflow.replace(old_environment, new_environment, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          test_path = Path("tests/architecture/test_config_and_export_boundaries.py")
          test = test_path.read_text(encoding="utf-8")
          old_assertion = '    assert "from trade_rl.rl.training_run_config import" in workflow_source\n'
          new_assertion = '''    assert "from trade_rl.rl.training_run_config import" in workflow_source
  assert (
      "TRAINING_RUN_CONFIG_SCHEMA as TRAINING_RUN_CONFIG_SCHEMA"
      in workflow_source
  )
  assert "_signal_artifact_digest" not in workflow_source
'''
          if test.count(old_assertion) != 1:
              raise SystemExit("architecture assertion marker mismatch")
          test = test.replace(old_assertion, new_assertion, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

          python -m compileall -q trade_rl tests/architecture/test_config_and_export_boundaries.py
          git diff --check

      - name: Commit and push patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/training_run_config.py \
                  trade_rl/workflows/training_run.py \
                  tests/architecture/test_config_and_export_boundaries.py
          git commit -m "refactor: expose training config identities cleanly"
          git push origin HEAD:agent/architecture-boundary-hardening-20260801

      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path=".github/workflows/temporary-config-boundary-patch.yml"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='chore: remove temporary config patch' \
            -f sha="${sha}" \
            -f branch='main'
