name: Temporary branch consolidation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Delete only branches fully contained in main
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "codex/universal-real-data-training"
            "integration/cost-aware-causal-teacher-final"
            "integration/cost-aware-causal-teacher-review"
            "integration/cost-aware-causal-teacher-final2"
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              echo "refusing to operate on main" >&2
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "already absent: ${branch}"
              continue
            fi

            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ! git merge-base --is-ancestor "refs/remotes/origin/${branch}" HEAD; then
              echo "refusing to delete non-ancestor branch: ${branch}" >&2
              exit 1
            fi

            echo "deleting fully contained branch: ${branch}"
            git push origin --delete "${branch}"
          done

          echo "remaining remote branches:"
          git ls-remote --heads origin
