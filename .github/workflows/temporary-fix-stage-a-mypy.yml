name: Temporary Fix Stage A Mypy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-fix-stage-a-mypy.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Fix manifest protocol typing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helpers = Path("trade_rl/evaluation/_stage_a_zero_shot_contract_helpers.py")
          text = helpers.read_text(encoding="utf-8")
          text = text.replace(
              "from trade_rl.domain.common import require_non_empty, require_sha256\n",
              "from trade_rl.domain.common import require_non_empty, require_sha256\n"
              "from trade_rl.evaluation.walk_forward.folds import IndexRange\n",
          )
          old = '''class StageAEvaluationDatasetManifestProtocol(Protocol):
              digest: str
              feature_identity: str
              symbol_disjoint_manifest_digest: str
              symbol_disjoint_triplet_manifest_digest: str
              folds_declared: tuple[int, ...]

              def triplet_ids_for(self, split: StageAEvaluationSplit) -> tuple[str, ...]: ...

              def dataset_id_for(self, split: StageAEvaluationSplit, triplet_id: str) -> str: ...

              def range_for(self, split: StageAEvaluationSplit, fold: int): ...
          '''.replace("          ", "")
          new = '''class StageAEvaluationDatasetManifestProtocol(Protocol):
              @property
              def digest(self) -> str: ...

              @property
              def feature_identity(self) -> str: ...

              @property
              def symbol_disjoint_manifest_digest(self) -> str: ...

              @property
              def symbol_disjoint_triplet_manifest_digest(self) -> str: ...

              @property
              def folds_declared(self) -> tuple[int, ...]: ...

              def triplet_ids_for(self, split: StageAEvaluationSplit) -> tuple[str, ...]: ...

              def dataset_id_for(self, split: StageAEvaluationSplit, triplet_id: str) -> str: ...

              def range_for(self, split: StageAEvaluationSplit, fold: int) -> IndexRange: ...
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("Stage A manifest protocol block changed unexpectedly")
          helpers.write_text(text.replace(old, new), encoding="utf-8")

          postgres = Path("trade_rl/workflows/stage_a_postgres_evaluation_dataset.py")
          text = postgres.read_text(encoding="utf-8")
          text = text.replace(
              "from trade_rl.workflows.symbol_disjoint_triplet_manifest import (\n"
              "    SymbolDisjointTripletManifest,\n"
              ")\n",
              "from trade_rl.workflows.symbol_disjoint_triplet_manifest import (\n"
              "    SymbolDisjointTripletManifest,\n"
              ")\n"
              "from trade_rl.workflows.symbol_triplet_manifest import SymbolTripletSlot\n",
          )
          text = text.replace(
              "def _evaluation_slots(manifest: SymbolDisjointTripletManifest):\n",
              "def _evaluation_slots(\n"
              "    manifest: SymbolDisjointTripletManifest,\n"
              ") -> tuple[SymbolTripletSlot, ...]:\n",
          )
          postgres.write_text(text, encoding="utf-8")
          PY

          uv sync --extra dev --extra export --extra train-sb3 --extra studio
          uv run ruff format \
            trade_rl/evaluation/_stage_a_zero_shot_contract_helpers.py \
            trade_rl/workflows/stage_a_postgres_evaluation_dataset.py
          uv run ruff check \
            trade_rl/evaluation/_stage_a_zero_shot_contract_helpers.py \
            trade_rl/workflows/stage_a_postgres_evaluation_dataset.py
          uv run mypy .
          uv run pytest -q \
            tests/evaluation/test_stage_a_zero_shot_contracts.py \
            tests/evaluation/test_stage_a_zero_shot_dataset_manifest_binding.py \
            tests/workflows/test_stage_a_evaluation_dataset_manifest.py \
            tests/workflows/test_stage_a_postgres_evaluation_dataset.py \
            tests/workflows/test_stage_a_zero_shot_runner.py \
            tests/workflows/test_stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_execution_observation.py \
            tests/workflows/test_stage_a_execution_producer.py \
            tests/workflows/test_stage_a_production_evaluator.py
          rm -f .github/workflows/temporary-fix-stage-a-mypy.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: type Stage A manifest protocol as read-only"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
