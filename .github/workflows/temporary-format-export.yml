name: Temporary Format Export

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  export-formatted-files:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install development environment
        run: uv sync --extra dev --extra train-sb3

      - name: Format reported files
        run: >-
          uv run ruff format
          tests/evaluation/test_perfect_information_bound_contracts.py
          tests/evaluation/test_perfect_information_bound_fail_closed.py
          tests/evaluation/test_perfect_information_bound_solver.py
          tests/rl/test_rollout_memory.py
          tests/simulation/test_orders.py
          trade_rl/evaluation/_perfect_information_lp.py
          trade_rl/evaluation/perfect_information_bound.py
          trade_rl/rl/policies.py
          trade_rl/simulation/orders.py

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet -- \
            tests/evaluation/test_perfect_information_bound_contracts.py \
            tests/evaluation/test_perfect_information_bound_fail_closed.py \
            tests/evaluation/test_perfect_information_bound_solver.py \
            tests/rl/test_rollout_memory.py \
            tests/simulation/test_orders.py \
            trade_rl/evaluation/_perfect_information_lp.py \
            trade_rl/evaluation/perfect_information_bound.py \
            trade_rl/rl/policies.py \
            trade_rl/simulation/orders.py; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/evaluation/test_perfect_information_bound_contracts.py \
            tests/evaluation/test_perfect_information_bound_fail_closed.py \
            tests/evaluation/test_perfect_information_bound_solver.py \
            tests/rl/test_rollout_memory.py \
            tests/simulation/test_orders.py \
            trade_rl/evaluation/_perfect_information_lp.py \
            trade_rl/evaluation/perfect_information_bound.py \
            trade_rl/rl/policies.py \
            trade_rl/simulation/orders.py
          git commit -m "style: apply ruff formatting"
          git push origin HEAD:${{ github.head_ref }}
