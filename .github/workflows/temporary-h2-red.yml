name: Temporary H2 RED

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Expected RED feature-cache tests
        shell: bash
        run: |
          set +e
          uv run pytest tests/integrations/test_cost_critic_feature_cache.py -q 2>&1 | tee h2-red.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > h2-red.status
          exit 0
      - name: Upload RED evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-red-evidence
          path: |
            h2-red.log
            h2-red.status
          if-no-files-found: error
      - name: Enforce expected failure
        run: test "$(cat h2-red.status)" != 0
