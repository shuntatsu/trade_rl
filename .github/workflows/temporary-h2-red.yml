name: Temporary H2 RED

on:
  push:
    branches:
      - agent/cost-critic-shared-feature-cache

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Expected RED feature-cache tests
        run: uv run pytest tests/integrations/test_cost_critic_feature_cache.py -q
