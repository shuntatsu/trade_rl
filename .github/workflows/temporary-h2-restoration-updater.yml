name: Temporary H2 Restoration Updater

on:
  pull_request:
    branches:
      - agent/cost-critic-shared-feature-cache
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/cost-critic-shared-feature-cache
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply reviewed restoration patch
        run: uv run python .github/scripts/fix_h2_cache_failure_restoration.py
      - name: Format and verify focused behavior
        run: |
          uv run ruff check --fix trade_rl/integrations/cost_critic_ppo.py tests/integrations/test_cost_critic_feature_cache.py
          uv run ruff format trade_rl/integrations/cost_critic_ppo.py tests/integrations/test_cost_critic_feature_cache.py
          uv run pytest tests/integrations/test_cost_critic_feature_cache.py tests/integrations/test_cost_critic_ppo.py tests/integrations/test_lagrangian_ppo.py tests/integrations/test_lagrangian_checkpoint.py tests/integrations/test_lagrangian_checkpoint_roundtrip.py -q
          uv run ruff check trade_rl/integrations/cost_critic_ppo.py tests/integrations/test_cost_critic_feature_cache.py
          uv run ruff format --check trade_rl/integrations/cost_critic_ppo.py tests/integrations/test_cost_critic_feature_cache.py
          uv run mypy trade_rl/integrations/cost_critic_ppo.py
      - name: Commit verified restoration
        run: |
          rm -f .github/scripts/fix_h2_cache_failure_restoration.py
          rm -f .github/workflows/temporary-h2-restoration-red.yml
          rm -f .github/workflows/temporary-h2-restoration-updater.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore state when Cost Critic cache build fails"
          git push origin HEAD:agent/cost-critic-shared-feature-cache
