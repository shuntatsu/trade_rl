name: Temporary H3 updater

on:
  pull_request:
    branches:
      - agent/compiled-sequence-rollout-runtime
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact H3 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/compiled-sequence-rollout-runtime
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Normalize embedded patch literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_h3_sequence_runtime.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '        """Convert one reconstructed sequence tensor using the configured path."""',
              '        # Convert one reconstructed sequence tensor using the configured path.',
          )
          source = source.replace(
              '    """Apply the identity-bound sequence runtime after construction or load."""',
              '    # Apply the identity-bound sequence runtime after construction or load.',
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply reviewed H3 GREEN patch
        run: uv run python .github/scripts/apply_h3_sequence_runtime.py
      - name: Format and organize imports
        run: |
          uv run ruff check --fix \
            trade_rl/rl/training.py \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/integrations/sb3_training.py \
            tests/integrations/test_sequence_runtime_acceleration.py
          uv run ruff format \
            trade_rl/rl/training.py \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/integrations/sb3_training.py \
            tests/integrations/test_sequence_runtime_acceleration.py
      - name: Focused H3 tests
        shell: bash
        run: |
          set +e
          uv run pytest \
            tests/integrations/test_sequence_runtime_acceleration.py \
            tests/integrations/test_compact_rollout_performance.py \
            tests/integrations/test_sb3_training.py \
            tests/integrations/test_sb3_training_active_architecture.py \
            tests/rl/test_training_config_active_fields.py \
            tests/rl/test_checkpointing.py \
            tests/examples/test_binance_multitimeframe_full_assets.py \
            -q 2>&1 | tee h3-green.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > h3-green.status
          exit 0
      - name: Upload H3 focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h3-green-diagnostics
          path: |
            h3-green.log
            h3-green.status
          if-no-files-found: error
      - name: Enforce focused tests
        run: test "$(cat h3-green.status)" = 0
      - name: Static verification
        run: |
          uv run ruff check \
            trade_rl/rl/training.py \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/integrations/sb3_training.py \
            tests/integrations/test_sequence_runtime_acceleration.py
          uv run ruff format --check \
            trade_rl/rl/training.py \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/integrations/sb3_training.py \
            tests/integrations/test_sequence_runtime_acceleration.py
          uv run mypy \
            trade_rl/rl/training.py \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/integrations/sb3_training.py
      - name: Commit verified H3 implementation
        run: |
          rm -f .github/scripts/apply_h3_sequence_runtime.py
          rm -f .github/workflows/temporary-h3-red.yml
          rm -f .github/workflows/temporary-h3-updater.yml
          rm -f h3-green.log h3-green.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: compile sequence runtime and accelerate rollout transfer"
          git push origin HEAD:agent/compiled-sequence-rollout-runtime
