name: Temporary H4 constructor budget

on:
  pull_request:
    branches:
      - agent/parallel-compact-sequence-environments
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/parallel-compact-sequence-environments
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply constructor budget fix
        run: uv run python .github/scripts/fix_h4_constructor_budget.py
      - name: Verify constructor and subprocess behavior
        run: |
          uv run ruff check --fix trade_rl/rl/environment.py
          uv run ruff format trade_rl/rl/environment.py
          uv run pytest \
            tests/architecture/test_environment_reward_execution_resources_decomposition.py \
            tests/integrations/test_parallel_sequence_environments.py \
            tests/integrations/test_parallel_sequence_subprocess_smoke.py \
            tests/rl/test_environment_observation_contract.py \
            -q
          uv run ruff check trade_rl/rl/environment.py
          uv run ruff format --check trade_rl/rl/environment.py
          uv run mypy trade_rl/rl/environment.py
      - name: Commit verified constructor fix
        run: |
          rm -f .github/scripts/fix_h4_constructor_budget.py
          rm -f .github/workflows/temporary-h4-constructor-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: preserve environment constructor budget"
          git push origin HEAD:agent/parallel-compact-sequence-environments
