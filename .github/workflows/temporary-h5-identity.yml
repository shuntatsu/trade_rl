name: Temporary H5 identity updater

on:
  pull_request:
    branches:
      - agent/gpu-performance-comparison
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/gpu-performance-comparison
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply candidate identity patch
        run: uv run python .github/scripts/fix_h5_candidate_identity.py
      - name: Format implementation
        run: |
          uv run ruff check --fix \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_gpu_comparison_identity.py
          uv run ruff format \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_gpu_comparison_identity.py
      - name: Verify identity hardening
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_comparison_identity.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            > h5-identity-pytest.log 2>&1
          pytest_status=$?
          uv run ruff check \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_gpu_comparison_identity.py \
            > h5-identity-ruff.log 2>&1
          ruff_status=$?
          uv run ruff format --check \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_gpu_comparison_identity.py \
            > h5-identity-format.log 2>&1
          format_status=$?
          uv run python .github/check_workflow_security.py . \
            > h5-identity-security.log 2>&1
          security_status=$?
          printf 'pytest_status=%s\nruff_status=%s\nformat_status=%s\nsecurity_status=%s\n' \
            "$pytest_status" "$ruff_status" "$format_status" "$security_status" \
            > h5-identity.status
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h5-identity-diagnostics
          path: |
            h5-identity-pytest.log
            h5-identity-ruff.log
            h5-identity-format.log
            h5-identity-security.log
            h5-identity.status
          if-no-files-found: error
      - name: Enforce identity verification
        run: |
          grep -qx 'pytest_status=0' h5-identity.status
          grep -qx 'ruff_status=0' h5-identity.status
          grep -qx 'format_status=0' h5-identity.status
          grep -qx 'security_status=0' h5-identity.status
      - name: Commit verified identity hardening
        run: |
          rm -f .github/scripts/fix_h5_candidate_identity.py
          rm -f h5-identity-pytest.log h5-identity-ruff.log
          rm -f h5-identity-format.log h5-identity-security.log h5-identity.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden GPU comparison identity"
          git push origin HEAD:agent/gpu-performance-comparison
