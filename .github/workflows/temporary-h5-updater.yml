name: Temporary H5 updater

on:
  pull_request:
    branches:
      - agent/gpu-performance-comparison
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/gpu-performance-comparison
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply reviewed H5 patch
        run: |
          uv run python .github/scripts/apply_h5_gpu_comparison.py
          uv run python .github/scripts/fix_h5_comparison_message.py
          uv run python .github/scripts/fix_h5_docker_asset_schema.py
      - name: Format implementation
        run: |
          uv run ruff check --fix \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_run_gpu_training_smoke.py \
            tests/examples/test_gpu_runtime_profiles.py \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_training_performance_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/examples/test_docker_training_assets.py
          uv run ruff format \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_run_gpu_training_smoke.py \
            tests/examples/test_gpu_runtime_profiles.py \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_training_performance_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/examples/test_docker_training_assets.py
      - name: Focused H5 tests
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/examples/test_run_gpu_training_smoke.py \
            tests/examples/test_gpu_runtime_profiles.py \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_training_performance_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/examples/test_docker_training_assets.py \
            tests/examples/test_binance_multitimeframe_full_assets.py \
            2>&1 | tee h5-focused.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > h5-focused.status
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h5-focused-diagnostics
          path: |
            h5-focused.log
            h5-focused.status
          if-no-files-found: error
      - name: Enforce focused H5 tests
        run: test "$(cat h5-focused.status)" = 0
      - name: Static and workflow verification
        run: |
          uv run ruff check \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_run_gpu_training_smoke.py \
            tests/examples/test_gpu_runtime_profiles.py \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_training_performance_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/examples/test_docker_training_assets.py
          uv run ruff format --check \
            examples/binance-multitimeframe/run_gpu_training_smoke.py \
            examples/binance-multitimeframe/compare_gpu_training_smoke.py \
            tests/examples/test_run_gpu_training_smoke.py \
            tests/examples/test_gpu_runtime_profiles.py \
            tests/examples/test_compare_gpu_training_smoke.py \
            tests/examples/test_gpu_training_performance_assets.py \
            tests/examples/test_gpu_performance_comparison_assets.py \
            tests/examples/test_docker_training_assets.py
          uv run python .github/check_workflow_security.py .
      - name: Commit verified H5 implementation
        shell: bash
        run: |
          set +e
          rm -f .github/scripts/apply_h5_gpu_comparison.py
          rm -f .github/scripts/fix_h5_comparison_message.py
          rm -f .github/scripts/fix_h5_docker_asset_schema.py
          rm -f h5-focused.log h5-focused.status
          git restore \
            .github/workflows/gpu-nightly.yml \
            .github/workflows/gpu-performance-comparison.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "BASE=$(git rev-parse HEAD)"
            git status --short
            git add -A
            git status --short
            git commit -m "perf: add GPU performance comparison harness"
          } > h5-commit.log 2>&1
          commit_status=$?
          push_status=99
          if [ "$commit_status" -eq 0 ]; then
            git push origin HEAD:agent/gpu-performance-comparison >> h5-commit.log 2>&1
            push_status=$?
          fi
          printf 'commit_status=%s\npush_status=%s\n' "$commit_status" "$push_status" > h5-commit.status
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h5-commit-diagnostics
          path: |
            h5-commit.log
            h5-commit.status
          if-no-files-found: error
      - name: Enforce H5 commit and push
        run: |
          grep -qx 'commit_status=0' h5-commit.status
          grep -qx 'push_status=0' h5-commit.status
