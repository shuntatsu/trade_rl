name: Temporary Stage A Sealed Ledger GREEN

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-list-catalog-migrations.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Verify batch contract
        run: |
          # Verify the corrected identity-order expectation and shared contract.
          PYTHONPATH=. uv run pytest -q tests/evaluation/test_stage_a_sealed_test.py
          uv run ruff check trade_rl/evaluation/stage_a_sealed_test.py tests/evaluation/test_stage_a_sealed_test.py
          uv run ruff format --check trade_rl/evaluation/stage_a_sealed_test.py tests/evaluation/test_stage_a_sealed_test.py
          uv run mypy trade_rl/evaluation/stage_a_sealed_test.py
