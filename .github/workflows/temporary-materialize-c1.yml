name: Temporary Apply and Verify C1

on:
  push:
    branches:
      - agent/causal-scenario-oracle-c1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/causal-scenario-oracle-c1
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Reconstruct and apply hash-verified C1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/c1-v2-patch/part{00..30} > /tmp/c1.patch.gz.b64
          test "$(wc -c < /tmp/c1.patch.gz.b64)" = "30264"
          echo "34684674a80ca5f6de46fafe188dd3e61e861a351165d9dbd2746793a75335e5  /tmp/c1.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/c1.patch.gz.b64 > /tmp/c1.patch.gz
          echo "cf49cfebba5a98770e69d7036b61f9e6e7737733a4a9d25173d5bfeb42e7e50e  /tmp/c1.patch.gz" | sha256sum --check
          gzip --test /tmp/c1.patch.gz
          gzip --decompress --stdout /tmp/c1.patch.gz > /tmp/c1.patch
          echo "a7e084d482eba890cb968e503da8217eff56fde93657bdeda756571f86472d82  /tmp/c1.patch" | sha256sum --check
          git apply --check --verbose /tmp/c1.patch
          git apply --index /tmp/c1.patch
          echo "eec84b1d6ef7f43904c6c25d3c485c6ff25965ee145eb528315d3ee01f4327a0  .github/c1-validation-fix.patch" | sha256sum --check
          git apply --check --verbose .github/c1-validation-fix.patch
          git apply --index .github/c1-validation-fix.patch

      - name: Install exact development environment
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Format and safely lint-fix C1 files
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            trade_rl/evaluation/causal_scenario_values.py
            trade_rl/evaluation/causal_scenario_artifact.py
            trade_rl/evaluation/__init__.py
            tests/evaluation/test_causal_scenario_contracts.py
            tests/evaluation/test_causal_scenario_evaluator.py
            tests/evaluation/test_causal_scenario_fail_closed.py
            tests/evaluation/test_causal_scenario_validation.py
            tests/evaluation/test_causal_scenario_artifact.py
            tests/architecture/test_causal_scenario_evaluator_boundary.py
          )
          uv run ruff format "${FILES[@]}"
          uv run ruff check --fix "${FILES[@]}"
          uv run ruff format "${FILES[@]}"
          git add "${FILES[@]}"

      - name: Ruff
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check --diff .

      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy-c1.log

      - name: Import architecture
        shell: bash
        run: |
          set -o pipefail
          uv run lint-imports 2>&1 | tee import-linter-c1.log

      - name: Compile
        run: uv run python -m compileall -q trade_rl tests

      - name: Run focused C1 tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/evaluation/test_causal_scenario_*.py \
            tests/architecture/test_causal_scenario_evaluator_boundary.py \
            -vv --tb=long 2>&1 | tee focused-c1.log

      - name: Enforce C1 branch coverage
        shell: bash
        run: |
          set -o pipefail
          uv run pytest \
            tests/evaluation/test_causal_scenario_*.py \
            --cov=trade_rl.evaluation.causal_scenario_values \
            --cov=trade_rl.evaluation.causal_scenario_artifact \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100 2>&1 | tee coverage-c1.log

      - name: Run complete repository tests
        run: uv run pytest -q

      - name: Verify staged diff
        run: |
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c1-apply-verify-diagnostics
          path: |
            mypy-c1.log
            import-linter-c1.log
            focused-c1.log
            coverage-c1.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit verified C1 implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/c1-v2.patch.gz .github/c1.patch.gz.b64 .github/c1-validation-fix.patch
          git rm -r .github/c1-patch .github/c1-v2-patch
          git rm .github/workflows/temporary-materialize-c1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add causal scenario action evaluator contracts"
          git push origin HEAD:agent/causal-scenario-oracle-c1
