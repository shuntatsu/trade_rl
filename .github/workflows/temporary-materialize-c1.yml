name: Temporary Apply and Verify C1

on:
  push:
    branches:
      - agent/causal-scenario-oracle-c1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/causal-scenario-oracle-c1
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Apply hash-verified C1 patch
        run: |
          echo "cf49cfebba5a98770e69d7036b61f9e6e7737733a4a9d25173d5bfeb42e7e50e  .github/c1-v2.patch.gz" | sha256sum --check
          gzip --test .github/c1-v2.patch.gz
          gzip --decompress --stdout .github/c1-v2.patch.gz > /tmp/c1.patch
          git apply --check --verbose /tmp/c1.patch
          git apply --index /tmp/c1.patch
      - name: Install exact development environment
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Format and safely lint-fix C1 files
        run: |
          FILES="trade_rl/evaluation/causal_scenario_values.py trade_rl/evaluation/causal_scenario_artifact.py trade_rl/evaluation/__init__.py tests/evaluation/test_causal_scenario_contracts.py tests/evaluation/test_causal_scenario_evaluator.py tests/evaluation/test_causal_scenario_fail_closed.py tests/evaluation/test_causal_scenario_validation.py tests/evaluation/test_causal_scenario_artifact.py tests/architecture/test_causal_scenario_evaluator_boundary.py"
          uv run ruff format $FILES
          uv run ruff check --fix $FILES
          uv run ruff format $FILES
          git add trade_rl/evaluation tests/evaluation/test_causal_scenario_*.py tests/architecture/test_causal_scenario_evaluator_boundary.py
      - name: Ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Mypy
        shell: bash
        run: |
          set -o pipefail
          uv run mypy . 2>&1 | tee mypy-c1.log
      - name: Upload Mypy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c1-mypy-diagnostics-v2
          path: mypy-c1.log
          if-no-files-found: error
          retention-days: 1
      - name: Import architecture
        run: uv run python scripts/check_import_architecture.py
      - name: Dead-code report
        run: uv run python scripts/report_dead_code.py
      - name: Compile
        run: uv run python -m compileall -q trade_rl tests
      - name: Run focused C1 tests and strict coverage
        run: |
          uv run pytest tests/evaluation/test_causal_scenario_*.py tests/architecture/test_causal_scenario_evaluator_boundary.py -q
          uv run pytest tests/evaluation/test_causal_scenario_*.py --cov=trade_rl.evaluation.causal_scenario_values --cov=trade_rl.evaluation.causal_scenario_artifact --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Run complete repository tests
        run: uv run pytest -q
      - name: Commit verified C1 implementation
        run: |
          git rm .github/c1-v2.patch.gz
          git rm .github/c1.patch.gz.b64
          git rm -r .github/c1-patch
          git rm .github/workflows/temporary-materialize-c1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add causal scenario action evaluator contracts"
          git push origin HEAD:agent/causal-scenario-oracle-c1
