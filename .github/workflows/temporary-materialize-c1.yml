name: Temporary Apply and Verify C1

on:
  push:
    branches:
      - agent/causal-scenario-oracle-c1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/causal-scenario-oracle-c1
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Verify patch part00
        run: test "$(git hash-object .github/c1-patch/part00)" = "ed573be8b25e2843b0afe090d3f03bf04c2e3945"
      - name: Verify patch part01
        run: test "$(git hash-object .github/c1-patch/part01)" = "63d5f6154a33f1b88f3ee1fc69b425e969e7da29"
      - name: Verify patch part02-00
        run: test "$(git hash-object .github/c1-patch/part02-00)" = "834351230333e6101d3480e9dfd801b62d943172"
      - name: Verify patch part02-01
        run: test "$(git hash-object .github/c1-patch/part02-01)" = "9dacb4ca60fa3eda0f43dc7baaf6487597ca2ad6"
      - name: Verify patch part02-02
        run: test "$(git hash-object .github/c1-patch/part02-02)" = "91ddfe10266a5e779d924fae7d106597d768d47f"
      - name: Verify patch part02-03
        run: test "$(git hash-object .github/c1-patch/part02-03)" = "38280c62066a8b6b9541b3a9fe2f3c7716828158"
      - name: Verify patch part03
        run: test "$(git hash-object .github/c1-patch/part03)" = "b6c691c773af220c3988bfd8b7efe4aa8194f084"
      - name: Verify patch part04
        run: test "$(git hash-object .github/c1-patch/part04)" = "62ed15e49281b96a13ca9708f819895a0b13cb73"
      - name: Verify patch part05
        run: test "$(git hash-object .github/c1-patch/part05)" = "0c175e8eb81f43f6a84215b56ac4e9ac83c1c080"
      - name: Verify patch part06
        run: test "$(git hash-object .github/c1-patch/part06)" = "0b40bf9609eb0ab0e6a3dd45e15ec7329b86a0f7"
      - name: Verify patch part07
        run: test "$(git hash-object .github/c1-patch/part07)" = "fda031d5fe64a43d38fb7489bc90cc575389db82"
      - name: Reassemble and apply verified C1 patch
        run: |
          cat \
            .github/c1-patch/part00 \
            .github/c1-patch/part01 \
            .github/c1-patch/part02-00 \
            .github/c1-patch/part02-01 \
            .github/c1-patch/part02-02 \
            .github/c1-patch/part02-03 \
            .github/c1-patch/part03 \
            .github/c1-patch/part04 \
            .github/c1-patch/part05 \
            .github/c1-patch/part06 \
            .github/c1-patch/part07 \
            > /tmp/c1.patch.gz.b64
          echo "b52dfabbb8af16bc429770eb02d04d1490662d59b5fbd26b1795ac95e1272d46  /tmp/c1.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/c1.patch.gz.b64 > /tmp/c1.patch.gz
          gzip --test /tmp/c1.patch.gz
          gzip --decompress --stdout /tmp/c1.patch.gz > /tmp/c1.patch
          git apply --check --verbose /tmp/c1.patch
          git apply --index /tmp/c1.patch
      - name: Install exact development environment
        run: uv sync --extra dev --extra train-sb3
      - name: Format C1 files
        run: |
          uv run ruff format \
            trade_rl/evaluation/causal_scenario_values.py \
            trade_rl/evaluation/causal_scenario_artifact.py \
            trade_rl/evaluation/__init__.py \
            tests/evaluation/test_causal_scenario_contracts.py \
            tests/evaluation/test_causal_scenario_evaluator.py \
            tests/evaluation/test_causal_scenario_fail_closed.py \
            tests/evaluation/test_causal_scenario_validation.py \
            tests/evaluation/test_causal_scenario_artifact.py \
            tests/architecture/test_causal_scenario_evaluator_boundary.py
          git add \
            trade_rl/evaluation \
            tests/evaluation/test_causal_scenario_*.py \
            tests/architecture/test_causal_scenario_evaluator_boundary.py
      - name: Run static and architecture checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run python scripts/check_import_architecture.py
          uv run python scripts/report_dead_code.py
          uv run python -m compileall -q trade_rl tests
      - name: Run focused C1 tests and strict coverage
        run: |
          uv run pytest \
            tests/evaluation/test_causal_scenario_*.py \
            tests/architecture/test_causal_scenario_evaluator_boundary.py \
            -q
          uv run pytest \
            tests/evaluation/test_causal_scenario_*.py \
            --cov=trade_rl.evaluation.causal_scenario_values \
            --cov=trade_rl.evaluation.causal_scenario_artifact \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
      - name: Run complete repository tests
        run: uv run pytest -q
      - name: Commit verified C1 implementation
        run: |
          git rm .github/c1.patch.gz.b64
          git rm -r .github/c1-patch
          git rm .github/workflows/temporary-materialize-c1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add causal scenario action evaluator contracts"
          git push origin HEAD:agent/causal-scenario-oracle-c1
