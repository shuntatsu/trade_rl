name: Temporary Materialize C1 Workspace

on:
  push:
    branches:
      - agent/causal-scenario-oracle-c1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archive exact head
        run: |
          git archive \
            --format=tar.gz \
            --output=trade-rl-c1-workspace.tar.gz \
            HEAD
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: trade-rl-c1-workspace
          path: trade-rl-c1-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
