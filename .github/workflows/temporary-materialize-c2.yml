name: Temporary Apply and Verify C2

on:
  push:
    branches:
      - agent/causal-scenario-library-c2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable event head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Apply hash-verified C2 patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/c2-final-parts/part00 \
            .github/c2-final-parts/part01 \
            .github/c2-final-parts/part02 \
            .github/c2-final-parts/part03 \
            .github/c2-final-parts/part04 \
            > /tmp/c2.patch.gz.b64
          test "$(wc -c < /tmp/c2.patch.gz.b64)" = "46360"
          echo "53f6b22b2f48f02d3b24f259e609e2ca6d47742801052e542cfcc4e9dd222ae3  /tmp/c2.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/c2.patch.gz.b64 > /tmp/c2.patch.gz
          echo "bd48a0ddce0e97f3e5392a9fd758b3cbe049b26cc638a886738cd73823d7adf4  /tmp/c2.patch.gz" | sha256sum --check
          gzip --test /tmp/c2.patch.gz
          gzip --decompress --stdout /tmp/c2.patch.gz > /tmp/c2.patch
          echo "284a0c909559d65c2d205f807fa43bd1901a846febb962d50087e0a542fc7198  /tmp/c2.patch" | sha256sum --check
          git apply --check --verbose /tmp/c2.patch
          git apply /tmp/c2.patch

          cat \
            .github/c2-architecture-fix-parts/part00 \
            .github/c2-architecture-fix-parts/part01 \
            .github/c2-architecture-fix-parts/part02 \
            > /tmp/c2-architecture-fix.patch.gz.b64
          test "$(wc -c < /tmp/c2-architecture-fix.patch.gz.b64)" = "5725"
          echo "ff1672a3f5411a1f8c567623878d87425c7b9ba037b09ef821b018e972e5d708  /tmp/c2-architecture-fix.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/c2-architecture-fix.patch.gz.b64 > /tmp/c2-architecture-fix.patch.gz
          echo "89e6e960149ec29f5161405675faef4cfe9117fcdf4bd5bc367a3881849e8659  /tmp/c2-architecture-fix.patch.gz" | sha256sum --check
          gzip --test /tmp/c2-architecture-fix.patch.gz
          gzip --decompress --stdout /tmp/c2-architecture-fix.patch.gz > /tmp/c2-architecture-fix.patch
          echo "d919add5fb160f97fadd8d138f83eb6c7f3d5eafca1114b5f7a61d4d2cc3b5ef  /tmp/c2-architecture-fix.patch" | sha256sum --check
          git apply --check --verbose /tmp/c2-architecture-fix.patch
          git apply /tmp/c2-architecture-fix.patch

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install exact development environment
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Format and safely lint-fix changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACM HEAD -- '*.py')
          test "${#FILES[@]}" -gt 0
          uv run ruff format "${FILES[@]}"
          uv run ruff check --fix "${FILES[@]}"
          uv run ruff format "${FILES[@]}"

      - name: Diagnose static and architecture gates
        shell: bash
        run: |
          set +e
          status=0
          run_gate() {
            name="$1"
            shift
            echo "===== $name ====="
            "$@"
            code=$?
            echo "exit_code=$code"
            if test "$code" -ne 0; then status=1; fi
          }
          {
            run_gate ruff uv run ruff check .
            run_gate format uv run ruff format --check --diff .
            run_gate mypy uv run mypy .
            run_gate import-linter uv run lint-imports
            run_gate dead-code uv run vulture trade_rl tests --min-confidence 100
            run_gate compileall uv run python -m compileall -q trade_rl tests
            echo "status=$status"
          } > c2-static-diagnostics.log 2>&1
          test "$status" -eq 0 && touch /tmp/c2-static-ok
          exit 0

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2-static-diagnostics
          path: c2-static-diagnostics.log
          if-no-files-found: error
          retention-days: 1

      - name: Gate static and architecture checks
        run: |
          cat c2-static-diagnostics.log
          test -f /tmp/c2-static-ok

      - name: Focused causal-scenario tests
        run: |
          uv run pytest \
            tests/evaluation/test_causal_scenario_*.py \
            tests/architecture/test_causal_scenario_*_boundary.py \
            -q

      - name: Enforce C2 statement and branch coverage
        run: |
          uv run pytest \
            tests/evaluation/test_causal_scenario_conditions.py \
            tests/evaluation/test_causal_scenario_library.py \
            tests/evaluation/test_causal_scenario_library_artifact.py \
            tests/evaluation/test_causal_scenario_replay.py \
            tests/evaluation/test_causal_scenario_c2_fail_closed.py \
            --cov=trade_rl.workflows.causal_scenario.conditions \
            --cov=trade_rl.workflows.causal_scenario.library \
            --cov=trade_rl.workflows.causal_scenario.library_artifact \
            --cov=trade_rl.workflows.causal_scenario.replay \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: Complete repository tests
        run: uv run pytest -q

      - name: Verify diff
        run: |
          git diff --check
          test -n "$(git diff --name-only)"

      - name: Commit verified C2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git rm -r .github/c2-final-parts
          git rm -r .github/c2-architecture-fix-parts
          git rm .github/c2-architecture-fix.patch.gz || true
          git rm .github/c2-final.patch.gz.b64 || true
          git rm .github/workflows/temporary-materialize-c1.yml || true
          git rm .github/workflows/temporary-materialize-c2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add train-only causal scenario library"
          git push origin HEAD:agent/causal-scenario-library-c2
