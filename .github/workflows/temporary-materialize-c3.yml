name: Temporary Materialize C3

on:
  push:
    branches:
      - agent/causal-scenario-walk-forward-c3

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Archive exact tracked tree
        run: git archive --format=tar.gz --output=c3-workspace.tar.gz HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c3-workspace
          path: c3-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

# Trigger after workflow registration.
