name: Temporary mypy annotation repair

on:
  push:
    branches:
      - integration/cost-aware-causal-teacher-final2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Add exact return annotation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/normalizer_collection.py")
          text = path.read_text(encoding="utf-8")
          anchor = ")\nfrom trade_rl.workflows.training_run import TrainingRunConfig\n"
          replacement = ")\nfrom trade_rl.rl.environment import ResidualMarketEnv\nfrom trade_rl.workflows.training_run import TrainingRunConfig\n"
          old_sig = "def normalizer_environment(spec: NormalizerWorkerSpec):\n"
          new_sig = "def normalizer_environment(spec: NormalizerWorkerSpec) -> ResidualMarketEnv:\n"
          if text.count(anchor) != 1 or text.count(old_sig) != 1:
              raise SystemExit("expected annotation repair anchors not found exactly once")
          text = text.replace(anchor, replacement, 1).replace(old_sig, new_sig, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff --exit-code -- . ':(exclude)trade_rl/workflows/normalizer_collection.py' || {
            echo "unexpected files changed" >&2
            exit 1
          }

      - name: Verify targeted type error is gone
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra export --extra train-sb3 --extra studio >/dev/null
          uv run mypy trade_rl/workflows/normalizer_collection.py

      - name: Commit exact repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/normalizer_collection.py
          git diff --cached --check
          git diff --cached --quiet && {
            echo "expected one-file type annotation repair but staged diff is empty" >&2
            exit 1
          }
          git commit -m "fix: annotate normalizer environment factory"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
