name: Temporary Mypy Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Install development environment
        run: uv sync --extra dev --extra train-sb3

      - name: Apply typed scalar fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          public = Path("trade_rl/evaluation/perfect_information_bound.py")
          public_text = public.read_text(encoding="utf-8")
          old_public = "    value: float | Sequence[float],\n"
          new_public = "    value: object,\n"
          if public_text.count(old_public) != 1:
              raise SystemExit("perfect-information helper signature changed unexpectedly")
          public.write_text(public_text.replace(old_public, new_public), encoding="utf-8")

          sb3 = Path("trade_rl/integrations/sb3_training.py")
          sb3_text = sb3.read_text(encoding="utf-8")
          old_sb3 = "    denominator = max(initial_mse, np.finfo(np.float64).eps)\n"
          new_sb3 = (
              "    denominator = max(initial_mse, float(np.finfo(np.float64).eps))\n"
          )
          if sb3_text.count(old_sb3) != 1:
              raise SystemExit("behavior-cloning denominator changed unexpectedly")
          sb3.write_text(sb3_text.replace(old_sb3, new_sb3), encoding="utf-8")
          PY

      - name: Format and lint changed files
        run: |
          uv run ruff format \
            trade_rl/evaluation/perfect_information_bound.py \
            trade_rl/integrations/sb3_training.py
          uv run ruff check \
            trade_rl/evaluation/perfect_information_bound.py \
            trade_rl/integrations/sb3_training.py

      - name: Verify Mypy
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          uv run mypy 2>&1 | tee mypy-fix.log

      - name: Upload Mypy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mypy-fix-diagnostics
          path: mypy-fix.log
          if-no-files-found: error

      - name: Verify focused behavior
        if: steps.mypy.outcome == 'success'
        run: >-
          uv run pytest -q
          tests/evaluation/test_perfect_information_bound_contracts.py
          tests/evaluation/test_perfect_information_bound_solver.py
          tests/evaluation/test_perfect_information_bound_fail_closed.py
          tests/integrations/test_sb3_training.py

      - name: Commit verified fixes
        if: steps.mypy.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/evaluation/perfect_information_bound.py \
            trade_rl/integrations/sb3_training.py
          git commit -m "fix: normalize numeric scalar types"
          git push origin HEAD:${{ github.head_ref }}

      - name: Fail if Mypy failed
        if: steps.mypy.outcome != 'success'
        run: exit 1
