name: Temporary training evidence patch

on:
  push:
    branches:
      - fix/evidence-stage-transaction-v2
    paths:
      - .github/workflows/temporary-patch-training-evidence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/evidence-stage-transaction-v2
          persist-credentials: true

      - name: Apply exact training evidence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/training_run.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''from trade_rl.simulation.execution_replay import (
              EXECUTION_EVENT_ARTIFACT_FILE_NAME,
              ExecutionEventArtifact,
              load_execution_event_artifact,
              write_execution_event_artifact,
          )''',
                  '''from trade_rl.simulation.execution_replay import (
              EXECUTION_EVENT_ARTIFACT_FILE_NAME,
              ExecutionEventArtifact,
              write_execution_event_artifact,
          )''',
              ),
              (
                  '''from trade_rl.workflows.execution_promotion_artifacts import (
              ExecutionPromotionArtifacts,
              load_execution_promotion_artifacts,
          )
          from trade_rl.workflows.selection_authorization import (''',
                  '''from trade_rl.workflows.execution_promotion_artifacts import (
              ExecutionPromotionArtifacts,
              load_execution_promotion_artifacts,
          )
          from trade_rl.workflows.selection_authorization import (''',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one exact replacement, found {count}")
              text = text.replace(old, new)

          import_anchor = '''from trade_rl.workflows.symbol_triplet_stage_training import'''
          if import_anchor in text:
              raise SystemExit("unexpected symbol-triplet import anchor")
          selection_anchor = '''from trade_rl.workflows.selection_authorization import ('''
          helper_import = '''from trade_rl.workflows.training_execution_evidence import (
              resolve_training_execution_inputs,
          )
          '''
          if helper_import not in text:
              text = text.replace(selection_anchor, helper_import + selection_anchor, 1)

          old_block = '''    promotion_artifacts: ExecutionPromotionArtifacts | None = None
              execution_event_artifact: ExecutionEventArtifact | None = None
              if execution_promotion_root is not None:
                  assert execution_replay_digest is not None
                  promotion_artifacts = load_execution_promotion_artifacts(
                      root=execution_promotion_root,
                      replay_digest=execution_replay_digest,
                  )
                  execution_evidence = promotion_artifacts.evidence
                  execution_event_artifact = promotion_artifacts.artifact
              elif execution_evidence_path is None:
                  execution_evidence = execution_evidence_from_cost(
                      dataset_id=dataset.dataset_id,
                      cost=config.environment.execution_cost,
                  )
                  execution_event_artifact = (
                      None
                      if execution_event_artifact_path is None
                      else load_execution_event_artifact(execution_event_artifact_path)
                  )
              else:
                  execution_evidence = load_execution_evidence(execution_evidence_path)
                  execution_event_artifact = (
                      None
                      if execution_event_artifact_path is None
                      else load_execution_event_artifact(execution_event_artifact_path)
                  )
          '''
          new_block = '''    promotion_artifacts: ExecutionPromotionArtifacts | None = None
              execution_event_artifact: ExecutionEventArtifact | None = None
              if execution_promotion_root is not None:
                  assert execution_replay_digest is not None
                  promotion_artifacts = load_execution_promotion_artifacts(
                      root=execution_promotion_root,
                      replay_digest=execution_replay_digest,
                  )
                  execution_evidence = promotion_artifacts.evidence
                  execution_event_artifact = promotion_artifacts.artifact
              else:
                  execution_evidence, execution_event_artifact = (
                      resolve_training_execution_inputs(
                          dataset_id=dataset.dataset_id,
                          cost=config.environment.execution_cost,
                          evidence_path=execution_evidence_path,
                          event_artifact_path=execution_event_artifact_path,
                      )
                  )
          '''
          if text.count(old_block) != 1:
              raise SystemExit(
                  f"expected one training evidence block, found {text.count(old_block)}"
              )
          text = text.replace(old_block, new_block)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "trade-rl-automation"
          git config user.email "actions@users.noreply.github.com"
          git add trade_rl/workflows/training_run.py
          git commit -m "fix: bind training evidence to replay artifact"
          git push origin HEAD:fix/evidence-stage-transaction-v2
