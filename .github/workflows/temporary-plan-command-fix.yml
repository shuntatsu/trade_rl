name: Temporary Plan Command Fix

on:
  push:
    branches:
      - agent/plan-all-unfinished-work-20260727
    paths:
      - .github/workflows/temporary-plan-command-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/plan-all-unfinished-work-20260727
          fetch-depth: 0
      - name: Correct critical coverage commands
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = sorted(Path("docs/superpowers/plans").glob("2026-07-27-*.md"))
          old = "uv run python tools/check_critical_coverage.py"
          new = "uv run python .github/check_critical_coverage.py coverage.json pyproject.toml"
          changed = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed += 1
          if changed != 5:
              raise SystemExit(f"expected 5 corrected plan files, got {changed}")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  raise SystemExit(f"stale command remains in {path}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-plan-command-fix.yml
          git add docs/superpowers/plans
          git commit -m "docs: correct roadmap verification commands"
          git push origin HEAD:agent/plan-all-unfinished-work-20260727
