name: Temporary PR194 Resolver Capture

on:
  push:
    branches:
      - agent/training-observability-diagnostics

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/training-observability-diagnostics
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Execute resolver and persist failure output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/temporary-diagnose-pr194-merge.yml"
          ).read_text(encoding="utf-8")
          marker = "        run: |\n"
          if source.count(marker) != 1:
              raise RuntimeError("resolver run block is not unique")
          block = source.split(marker, 1)[1]
          lines = []
          for line in block.splitlines():
              if line and not line.startswith("          "):
                  raise RuntimeError(f"unexpected resolver indentation: {line!r}")
              lines.append(line[10:] if line else "")
          Path("/tmp/pr194-resolver.sh").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          chmod +x /tmp/pr194-resolver.sh
          set +e
          bash /tmp/pr194-resolver.sh > /tmp/pr194-resolver.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          git merge --abort >/dev/null 2>&1 || true
          git reset --hard HEAD
          mkdir -p .integration
          {
            echo "resolver_status=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse origin/main 2>/dev/null || echo unknown)"
            echo
            cat /tmp/pr194-resolver.log
          } > .integration/pr194-resolver-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .integration/pr194-resolver-failure.txt
          git commit -m "chore: record PR 194 resolver failure"
          git push origin HEAD:agent/training-observability-diagnostics
