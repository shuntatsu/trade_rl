name: Temporary PR194 Resolver V2

on:
  push:
    branches:
      - agent/training-observability-diagnostics

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/training-observability-diagnostics
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Resolve, test, and merge main
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e
            if [ "$merge_status" -eq 0 ]; then
              echo "Expected the known conflicts, but merge completed without them" >&2
              exit 1
            fi

            mapfile -t actual_conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected_conflicts=(
              "trade_rl/rl/algorithm_configs.py"
              "trade_rl/rl/checkpointing.py"
              "trade_rl/rl/training.py"
              "uv.lock"
            )
            if [ "${actual_conflicts[*]}" != "${expected_conflicts[*]}" ]; then
              printf 'Unexpected conflict set:\n' >&2
              printf '  %s\n' "${actual_conflicts[@]}" >&2
              exit 1
            fi

            git checkout --theirs -- "${expected_conflicts[@]}"
            python .github/scripts/resolve_pr194_merge.py
            uv lock
            git add "${expected_conflicts[@]}"
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved merge conflicts remain" >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi

            uv sync --extra dev --extra export --extra train-sb3 --extra studio
            uv run ruff format trade_rl/integrations/sb3_training.py \
              trade_rl/rl/algorithm_configs.py trade_rl/rl/checkpointing.py \
              trade_rl/rl/training.py
            uv run ruff check trade_rl/integrations/sb3_training.py \
              trade_rl/rl/algorithm_configs.py trade_rl/rl/checkpointing.py \
              trade_rl/rl/training.py tests/rl/test_checkpointing.py \
              tests/rl/test_schedules.py tests/rl/test_tensorboard_logging.py
            uv run mypy trade_rl/integrations/sb3_training.py \
              trade_rl/rl/algorithm_configs.py trade_rl/rl/checkpointing.py \
              trade_rl/rl/training.py
            uv run pytest -q \
              tests/rl/test_checkpointing.py \
              tests/rl/test_schedules.py \
              tests/rl/test_tensorboard_logging.py \
              tests/rl/test_training_config_active_fields.py \
              tests/integrations/test_sb3_training.py \
              tests/integrations/test_lagrangian_checkpoint_roundtrip.py \
              tests/integrations/test_sb3_lagrangian_backend.py \
              tests/rl/test_lagrangian_checkpoint_identity.py \
              tests/studio/test_training_metrics.py \
              tests/studio/test_training_metrics_api.py

            rm -f \
              .github/scripts/resolve_pr194_merge.py \
              .github/workflows/temporary-diagnose-pr194-merge.yml \
              .github/workflows/temporary-pr194-anchor-diagnose.yml \
              .github/workflows/temporary-pr194-resolver-capture.yml \
              .github/workflows/temporary-pr194-resolver-v2.yml \
              .integration/pr194-anchor-report.txt \
              .integration/pr194-conflict-report.txt \
              .integration/pr194-resolver-failure.txt
            mkdir -p .integration
            printf 'resolved_main=%s\n' "$(git rev-parse origin/main)" \
              > .integration/pr194-merge-resolved.txt
            git add -A
            git commit -m "merge: integrate main with training observability"
            git push origin HEAD:agent/training-observability-diagnostics
          ) > /tmp/pr194-v2.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          git merge --abort >/dev/null 2>&1 || true
          git reset --hard HEAD
          mkdir -p .integration
          {
            echo "resolver_status=$status"
            echo "head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse origin/main 2>/dev/null || echo unknown)"
            echo
            cat /tmp/pr194-v2.log
          } > .integration/pr194-resolver-v2-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .integration/pr194-resolver-v2-failure.txt
          git commit -m "chore: record PR 194 resolver v2 failure"
          git push origin HEAD:agent/training-observability-diagnostics
          exit 1
