name: Temporary private import review fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-private-import-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/architecture-boundary-hardening-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio

      - name: Confirm private-import RED
        shell: bash
        run: |
          set +e
          uv run pytest tests/architecture/test_config_and_export_boundaries.py -q > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -F "trade_rl.rl.training_run_config._signal_artifact_digest" red.log

      - name: Replace private import with public config properties
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path("trade_rl/rl/training_run_config.py")
          config = config_path.read_text(encoding="utf-8")

          identity_old = '''            "alpha_artifact_digest": _signal_artifact_digest(
              self.alpha_artifact, kind="alpha"
          ),
          "environment": asdict(self.environment),
          "factor_artifact_digest": _signal_artifact_digest(
              self.factor_artifact, kind="factor"
          ),
'''
          identity_new = '''            "alpha_artifact_digest": self.alpha_artifact_digest,
          "environment": asdict(self.environment),
          "factor_artifact_digest": self.factor_artifact_digest,
'''
          if config.count(identity_old) != 1:
              raise RuntimeError("training config identity block is not unique")
          config = config.replace(identity_old, identity_new, 1)

          marker = "    def resolve_artifact_paths(self, base: Path) -> TrainingRunConfig:\n"
          properties = '''    @property
  def alpha_artifact_digest(self) -> str | None:
      """Return the validated alpha artifact digest, when configured."""

      return _signal_artifact_digest(self.alpha_artifact, kind="alpha")

  @property
  def factor_artifact_digest(self) -> str | None:
      """Return the validated factor artifact digest, when configured."""

      return _signal_artifact_digest(self.factor_artifact, kind="factor")

'''
          if config.count(marker) != 1:
              raise RuntimeError("training config property marker is not unique")
          config = config.replace(marker, properties + marker, 1)
          config_path.write_text(config, encoding="utf-8")

          workflow_path = Path("trade_rl/workflows/training_run.py")
          workflow = workflow_path.read_text(encoding="utf-8")
          import_old = '''from trade_rl.rl.training_run_config import (
  TrainingRunConfig,
  _signal_artifact_digest,
)
'''
          import_new = "from trade_rl.rl.training_run_config import TrainingRunConfig\n"
          if workflow.count(import_old) != 1:
              raise RuntimeError("workflow training config import is not unique")
          workflow = workflow.replace(import_old, import_new, 1)

          environment_old = '''            "alpha_artifact_digest": _signal_artifact_digest(
              config.alpha_artifact, kind="alpha"
          ),
          "environment": asdict(config.environment),
          "factor_artifact_digest": _signal_artifact_digest(
              config.factor_artifact, kind="factor"
          ),
'''
          environment_new = '''            "alpha_artifact_digest": config.alpha_artifact_digest,
          "environment": asdict(config.environment),
          "factor_artifact_digest": config.factor_artifact_digest,
'''
          if workflow.count(environment_old) != 1:
              raise RuntimeError("workflow environment identity block is not unique")
          workflow = workflow.replace(environment_old, environment_new, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Verify focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest \
            tests/architecture/test_config_and_export_boundaries.py \
            tests/workflows/test_training_run_config.py \
            tests/workflows/test_training_run_transfer_config.py \
            tests/rl/test_structured_export.py \
            tests/serving \
            tests/studio \
            -q
          uv run lint-imports
          uv run mypy trade_rl
          git diff --check

      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/training_run_config.py trade_rl/workflows/training_run.py tests/architecture/test_config_and_export_boundaries.py
          git commit -m "refactor: remove private config import coupling"
          git push origin HEAD:agent/architecture-boundary-hardening-20260801

      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_path=".github/workflows/temporary-private-import-review-fix.yml"
          workflow_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=main" --jq '.sha')"
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}" \
            -f message='chore: remove temporary review fix workflow' \
            -f sha="${workflow_sha}" \
            -f branch='main'
