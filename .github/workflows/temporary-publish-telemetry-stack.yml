name: Temporary Publish Telemetry Stack

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oracle branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Preserve telemetry fix
        run: |
          git fetch origin fix/bc-quality-epsilon-type
          mkdir -p /tmp/telemetry-stack/trade_rl/telemetry
          mkdir -p /tmp/telemetry-stack/tests/telemetry
          mkdir -p /tmp/telemetry-stack/tests/integrations
          cp trade_rl/telemetry/_indexed_storage.py \
            /tmp/telemetry-stack/trade_rl/telemetry/_indexed_storage.py
          cp tests/telemetry/test_indexed_process_concurrency.py \
            /tmp/telemetry-stack/tests/telemetry/test_indexed_process_concurrency.py
          cp tests/telemetry/test_detached_writer_fail_closed.py \
            /tmp/telemetry-stack/tests/telemetry/test_detached_writer_fail_closed.py
          cp tests/integrations/test_training_telemetry_validation.py \
            /tmp/telemetry-stack/tests/integrations/test_training_telemetry_validation.py

      - name: Build stacked telemetry branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C fix/telemetry-detached-writer-close \
            origin/fix/bc-quality-epsilon-type
          cp /tmp/telemetry-stack/trade_rl/telemetry/_indexed_storage.py \
            trade_rl/telemetry/_indexed_storage.py
          cp /tmp/telemetry-stack/tests/telemetry/test_indexed_process_concurrency.py \
            tests/telemetry/test_indexed_process_concurrency.py
          cp /tmp/telemetry-stack/tests/telemetry/test_detached_writer_fail_closed.py \
            tests/telemetry/test_detached_writer_fail_closed.py
          cp /tmp/telemetry-stack/tests/integrations/test_training_telemetry_validation.py \
            tests/integrations/test_training_telemetry_validation.py

      - name: Verify stacked telemetry change
        env:
          PYTHONPATH: .
        run: |
          uv sync --extra dev --extra train-sb3 --extra studio
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q \
            tests/telemetry \
            tests/integrations/test_training_telemetry.py \
            tests/integrations/test_training_telemetry_terminal_snapshot.py \
            tests/integrations/test_training_telemetry_validation.py

      - name: Commit and push stacked telemetry branch
        run: |
          git add \
            trade_rl/telemetry/_indexed_storage.py \
            tests/telemetry/test_indexed_process_concurrency.py \
            tests/telemetry/test_detached_writer_fail_closed.py \
            tests/integrations/test_training_telemetry_validation.py
          git commit -m "fix: close detached telemetry writers safely"
          git push --force origin HEAD:fix/telemetry-detached-writer-close
