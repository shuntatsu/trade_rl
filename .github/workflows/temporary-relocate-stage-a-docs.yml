name: Temporary Relocate Stage A Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-relocate-stage-a-docs.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Relocate maintained Stage A documents
        shell: bash
        run: |
          set -euo pipefail
          design_source="docs/superpowers/specs/2026-08-01-stage-a-evaluation-dataset-manifest-design.md"
          plan_source="docs/superpowers/plans/2026-08-01-stage-a-evaluation-dataset-manifest-implementation.md"
          design_target="docs/operations/stage-a-evaluation-dataset-manifest-design.md"
          plan_target="docs/operations/stage-a-evaluation-dataset-manifest-implementation-plan.md"
          test -f "$design_source"
          test -f "$plan_source"
          test ! -e "$design_target"
          test ! -e "$plan_target"
          git mv "$design_source" "$design_target"
          git mv "$plan_source" "$plan_target"
          rmdir docs/superpowers/specs docs/superpowers/plans docs/superpowers
          uv sync --extra dev
          uv run pytest -q tests/test_current_documentation_contract.py
          rm -f .github/workflows/temporary-relocate-stage-a-docs.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: keep Stage A manifest docs in operations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
