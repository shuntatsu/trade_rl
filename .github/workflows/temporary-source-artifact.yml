name: Temporary focused verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Run hierarchical BC focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/learning/test_hierarchical_teacher_labels.py \
            tests/learning/test_structured_teacher_artifact.py \
            tests/rl/test_environment_observation_contract.py \
            tests/rl/test_sequence_observations.py \
            tests/serving/test_observation_parity.py \
            2>&1 | tee focused-tests.log
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-focused-tests
          path: focused-tests.log
          if-no-files-found: error
