name: Temporary Source Snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build source snapshot
        shell: bash
        run: |
          tar --exclude=.git --exclude=.venv --exclude=node_modules -czf /tmp/trade_rl-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trade-rl-source-snapshot
          path: /tmp/trade_rl-source.tar.gz
          if-no-files-found: error
