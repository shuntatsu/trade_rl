name: Temporary Clean Oracle Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove unrelated formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- \
            tests/rl/test_rollout_memory.py \
            tests/simulation/test_orders.py \
            trade_rl/rl/policies.py \
            trade_rl/simulation/orders.py
          git rm .github/workflows/temporary-split-telemetry-fix.yml
          git add \
            tests/rl/test_rollout_memory.py \
            tests/simulation/test_orders.py \
            trade_rl/rl/policies.py \
            trade_rl/simulation/orders.py
          git commit -m "chore: remove unrelated formatting changes"
          git push origin HEAD:agent/perfect-information-oracle-bound
