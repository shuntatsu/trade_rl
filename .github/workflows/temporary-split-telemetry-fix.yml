name: Temporary Split Telemetry Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Preserve telemetry delta
        run: |
          git fetch origin main
          mkdir -p /tmp/telemetry-split/trade_rl/telemetry
          mkdir -p /tmp/telemetry-split/tests/telemetry
          mkdir -p /tmp/telemetry-split/tests/integrations
          cp trade_rl/telemetry/_indexed_storage.py \
            /tmp/telemetry-split/trade_rl/telemetry/_indexed_storage.py
          cp tests/telemetry/test_indexed_process_concurrency.py \
            /tmp/telemetry-split/tests/telemetry/test_indexed_process_concurrency.py
          cp tests/telemetry/test_detached_writer_fail_closed.py \
            /tmp/telemetry-split/tests/telemetry/test_detached_writer_fail_closed.py
          cp tests/integrations/test_training_telemetry_validation.py \
            /tmp/telemetry-split/tests/integrations/test_training_telemetry_validation.py

      - name: Build isolated telemetry tree
        run: |
          git switch --detach origin/main
          cp /tmp/telemetry-split/trade_rl/telemetry/_indexed_storage.py \
            trade_rl/telemetry/_indexed_storage.py
          cp /tmp/telemetry-split/tests/telemetry/test_indexed_process_concurrency.py \
            tests/telemetry/test_indexed_process_concurrency.py
          cp /tmp/telemetry-split/tests/telemetry/test_detached_writer_fail_closed.py \
            tests/telemetry/test_detached_writer_fail_closed.py
          cp /tmp/telemetry-split/tests/integrations/test_training_telemetry_validation.py \
            tests/integrations/test_training_telemetry_validation.py

      - name: Run isolated diagnostics
        id: diagnostics
        shell: bash
        run: |
          set +e
          : > telemetry-split-diagnostics.log
          failures=0
          run_check() {
            name="$1"
            shift
            echo "=== ${name} ===" | tee -a telemetry-split-diagnostics.log
            "$@" >>telemetry-split-diagnostics.log 2>&1
            status=$?
            echo "exit=${status}" | tee -a telemetry-split-diagnostics.log
            if [ "$status" -ne 0 ]; then
              failures=1
            fi
          }
          run_check sync uv sync --extra dev --extra train-sb3 --extra studio
          run_check ruff-check uv run ruff check \
            trade_rl/telemetry/_indexed_storage.py \
            tests/telemetry/test_indexed_process_concurrency.py \
            tests/telemetry/test_detached_writer_fail_closed.py \
            tests/integrations/test_training_telemetry_validation.py
          run_check ruff-format uv run ruff format --check \
            trade_rl/telemetry/_indexed_storage.py \
            tests/telemetry/test_indexed_process_concurrency.py \
            tests/telemetry/test_detached_writer_fail_closed.py \
            tests/integrations/test_training_telemetry_validation.py
          run_check mypy uv run mypy
          run_check pytest uv run pytest -q \
            tests/telemetry \
            tests/integrations/test_training_telemetry.py \
            tests/integrations/test_training_telemetry_terminal_snapshot.py \
            tests/integrations/test_training_telemetry_validation.py
          echo "failed=${failures}" >> "$GITHUB_OUTPUT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-split-diagnostics
          path: telemetry-split-diagnostics.log
          if-no-files-found: error

      - name: Require diagnostic success
        if: steps.diagnostics.outputs.failed != '0'
        run: exit 1
