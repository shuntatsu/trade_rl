name: Temporary Stage A Event Fixture Fix

on:
  push:
    branches:
      - agent/stage-a6b2-policy-producer-v2
    paths:
      - .github/workflows/temporary-stage-a-event-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-policy-producer-v2
          fetch-depth: 1

      - name: Repair canonical order history fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/workflows/test_stage_a_policy_producer_orchestration.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _event(request: StageAEvaluationCellRequest, *, price: float = 100.0) -> OrderEvent:
    return OrderEvent(
        schema_version="order_event_v1",
        sequence=0,
        order_id="a" * 64,
        replaced_order_id=None,
        dataset_id=request.dataset_identity,
        execution_policy_digest=request.execution_identity,
        symbol_index=0,
        event_type="filled",
        processing_index=1,
        timestamp_ns=1,
        previous_status=OrderStatus.ELIGIBLE,
        new_status=OrderStatus.FILLED,
        requested_quantity=1.0,
        remaining_quantity=0.0,
        filled_quantity=1.0,
        execution_price=price,
        filled_notional=price,
        capacity_before=10.0,
        capacity_after=9.0,
        participation_rate=0.1,
        trigger_segment=None,
        available_volume_fraction=1.0,
        reason=None,
        path_mode="conservative",
        path_points=(price, price + 1.0, price - 1.0, price + 0.5),
    )
'''
          new = '''def _events(
    request: StageAEvaluationCellRequest, *, price: float = 100.0
) -> tuple[OrderEvent, ...]:
    common = {
        "schema_version": "order_event_v1",
        "order_id": "a" * 64,
        "replaced_order_id": None,
        "dataset_id": request.dataset_identity,
        "execution_policy_digest": request.execution_identity,
        "symbol_index": 0,
        "requested_quantity": 1.0,
        "trigger_segment": None,
        "available_volume_fraction": 1.0,
        "reason": None,
        "path_mode": "conservative",
    }
    return (
        OrderEvent(
            **common,
            sequence=0,
            event_type="submitted",
            processing_index=0,
            timestamp_ns=0,
            previous_status=OrderStatus.SUBMITTED,
            new_status=OrderStatus.SUBMITTED,
            remaining_quantity=1.0,
            filled_quantity=0.0,
            execution_price=None,
            filled_notional=0.0,
            capacity_before=10.0,
            capacity_after=10.0,
            participation_rate=0.0,
            path_points=(),
        ),
        OrderEvent(
            **common,
            sequence=1,
            event_type="eligible",
            processing_index=1,
            timestamp_ns=1,
            previous_status=OrderStatus.SUBMITTED,
            new_status=OrderStatus.ELIGIBLE,
            remaining_quantity=1.0,
            filled_quantity=0.0,
            execution_price=None,
            filled_notional=0.0,
            capacity_before=10.0,
            capacity_after=10.0,
            participation_rate=0.0,
            path_points=(),
        ),
        OrderEvent(
            **common,
            sequence=2,
            event_type="filled",
            processing_index=1,
            timestamp_ns=2,
            previous_status=OrderStatus.ELIGIBLE,
            new_status=OrderStatus.FILLED,
            remaining_quantity=0.0,
            filled_quantity=1.0,
            execution_price=price,
            filled_notional=price,
            capacity_before=10.0,
            capacity_after=9.0,
            participation_rate=0.1,
            path_points=(price, price + 1.0, price - 1.0, price + 0.5),
        ),
    )
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one _event helper block, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old_call = "        order_events=(_event(request),),"
          new_call = "        order_events=_events(request),"
          if text.count(old_call) != 1:
              raise SystemExit(
                  f"expected one order event fixture call, found {text.count(old_call)}"
              )
          path.write_text(text.replace(old_call, new_call, 1), encoding="utf-8")
          PY

          python -m py_compile tests/workflows/test_stage_a_policy_producer_orchestration.py
          git diff --check
          git diff -- tests/workflows/test_stage_a_policy_producer_orchestration.py

      - name: Commit exact fixture repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflows/test_stage_a_policy_producer_orchestration.py
          git commit -m "test: use canonical order event history in Stage A fixture"
          git push origin HEAD:agent/stage-a6b2-policy-producer-v2
