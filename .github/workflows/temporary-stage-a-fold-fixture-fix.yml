name: Temporary Stage A Fold Fixture Fix

on:
  push:
    branches:
      - agent/stage-a6b2-policy-producer-v2
    paths:
      - .github/workflows/temporary-stage-a-fold-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/stage-a6b2-policy-producer-v2
          fetch-depth: 1

      - name: Repair single-fold fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path("tests/workflows/test_stage_a_execution_producer.py"),
              Path("tests/workflows/test_stage_a_policy_producer_orchestration.py"),
              Path("tests/workflows/test_stage_a_policy_source_serving.py"),
          )
          old = "        folds=(0,),"
          new = "        folds=(0, 1),"
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one single-fold fixture, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          python -m py_compile \
            tests/workflows/test_stage_a_execution_producer.py \
            tests/workflows/test_stage_a_policy_producer_orchestration.py \
            tests/workflows/test_stage_a_policy_source_serving.py

          git diff --check
          git diff -- \
            tests/workflows/test_stage_a_execution_producer.py \
            tests/workflows/test_stage_a_policy_producer_orchestration.py \
            tests/workflows/test_stage_a_policy_source_serving.py

      - name: Commit exact fixture repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/workflows/test_stage_a_execution_producer.py \
            tests/workflows/test_stage_a_policy_producer_orchestration.py \
            tests/workflows/test_stage_a_policy_source_serving.py
          git commit -m "test: align Stage A fixtures with multi-fold contract"
          git push origin HEAD:agent/stage-a6b2-policy-producer-v2
