name: Temporary Stage A integration RED

on:
  push:
    branches:
      - fix/evidence-stage-transaction-v2
    paths:
      - .github/workflows/temporary-stage-a-integration-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/evidence-stage-transaction-v2
          persist-credentials: true

      - name: Patch Stage A fixtures for strict execution artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def update(path_name: str, pattern: str, replacement: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if "from tests.evaluation.replay_support import execution_episode\n" not in text:
                  marker = "import pytest\n\n" if "import pytest\n\n" in text else "import numpy as np\n\n"
                  text = text.replace(
                      marker,
                      marker + "from tests.evaluation.replay_support import execution_episode\n",
                      1,
                  )
              text = text.replace("import numpy as np\n", "")
              text = text.replace("from trade_rl.simulation.accounting import BookState\n", "")
              text = text.replace(
                  "from trade_rl.simulation.orders import OrderBookState, OrderEvent, OrderStatus",
                  "from trade_rl.simulation.orders import OrderEvent, OrderStatus",
              )
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{path_name}: fixture block replacement count={count}")
              path.write_text(text, encoding="utf-8")

          update(
              "tests/workflows/test_stage_a_execution_replay.py",
              r"    event = _event\(request\.dataset_identity, request\.execution_identity\)\n"
              r"    event_artifact = build_execution_event_artifact\(.*?\n"
              r"    \)\n    event_path = write_execution_event_artifact",
              '''    candidate_config_digest = (
                  _digest("candidate-a:config")
                  if request.candidate_id is not None
                  else _digest("baseline:config")
              )
              observations = (_digest("observation-0"), _digest("observation-1"))
              actions = ((0.4,),)
              equity = (1_000.0, terminal_equity)
              events, terminal_book, terminal_order_book = execution_episode(
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  cash=terminal_equity - 100.0,
              )
              event_artifact = build_execution_event_artifact(
                  candidate_config_digest=candidate_config_digest,
                  evaluation_run_digest=request.digest,
                  fold=request.fold,
                  seed=request.seed,
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  actions=actions,
                  observation_digests=observations,
                  equity_curve=equity,
                  order_events=events,
                  terminal_book=terminal_book,
                  terminal_order_book=terminal_order_book,
              )
              event_path = write_execution_event_artifact''',
          )
          update(
              "tests/workflows/test_stage_a_execution_store.py",
              r"    event_artifact = build_execution_event_artifact\(.*?\n"
              r"    \)\n    event_path = write_execution_event_artifact",
              '''    candidate_config_digest = plan.candidate("candidate-a").candidate_config_digest
              observations = (_digest("observation-0"), _digest("observation-1"))
              actions = ((0.4,),)
              equity = (1_000.0, terminal_equity)
              events, terminal_book, terminal_order_book = execution_episode(
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  cash=terminal_equity - 100.0,
              )
              event_artifact = build_execution_event_artifact(
                  candidate_config_digest=candidate_config_digest,
                  evaluation_run_digest=request.digest,
                  fold=request.fold,
                  seed=request.seed,
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  actions=actions,
                  observation_digests=observations,
                  equity_curve=equity,
                  order_events=events,
                  terminal_book=terminal_book,
                  terminal_order_book=terminal_order_book,
              )
              event_path = write_execution_event_artifact''',
          )
          update(
              "tests/workflows/test_stage_a_production_evaluator.py",
              r"    event_artifact = build_execution_event_artifact\(.*?\n"
              r"    \)\n    event_path = write_execution_event_artifact",
              '''    observations = (_digest("observation-0"), _digest("observation-1"))
              actions = ((0.4,),)
              equity = (1_000.0, final_equity)
              events, terminal_book, terminal_order_book = execution_episode(
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  cash=final_equity - 100.0,
              )
              event_artifact = build_execution_event_artifact(
                  candidate_config_digest=candidate_config_digest,
                  evaluation_run_digest=request.digest,
                  fold=request.fold,
                  seed=request.seed,
                  dataset_id=request.dataset_identity,
                  execution_policy_digest=request.execution_identity,
                  actions=actions,
                  observation_digests=observations,
                  equity_curve=equity,
                  order_events=events,
                  terminal_book=terminal_book,
                  terminal_order_book=terminal_order_book,
              )
              event_path = write_execution_event_artifact''',
          )

          path = Path("tests/workflows/test_stage_a_production_orchestration.py")
          text = path.read_text(encoding="utf-8")
          if "from tests.evaluation.replay_support import execution_episode\n" not in text:
              text = text.replace(
                  "import numpy as np\n\n",
                  "from tests.evaluation.replay_support import execution_episode\n\n",
                  1,
              )
          text = text.replace("import numpy as np\n", "")
          text = text.replace("from trade_rl.simulation.accounting import BookState\n", "")
          text = text.replace(
              "from trade_rl.simulation.orders import OrderBookState, OrderEvent, OrderStatus",
              "from trade_rl.simulation.orders import OrderEvent, OrderStatus",
          )
          text = text.replace(
              '''def _promotion_sources(
              root: Path,
              plan: StageAZeroShotEvaluationPlan,
              *,
              terminal_equity: float,
          ) -> tuple[Path, Path]:''',
              '''def _promotion_sources(
              root: Path,
              plan: StageAZeroShotEvaluationPlan,
              *,
              request: StageAEvaluationCellRequest,
              candidate_config_digest: str,
              terminal_equity: float,
          ) -> tuple[Path, Path]:''',
              1,
          )
          pattern = (
              r"    event_artifact = build_execution_event_artifact\(.*?\n"
              r"    \)\n    event_path = write_execution_event_artifact"
          )
          replacement = '''    observations = (
              _digest(f"observation:{request.digest}:0"),
              _digest(f"observation:{request.digest}:1"),
          )
          actions = ((0.4,),)
          equity = (1_000.0, terminal_equity)
          events, terminal_book, terminal_order_book = execution_episode(
              dataset_id=plan.dataset_identity,
              execution_policy_digest=plan.execution_identity,
              cash=terminal_equity - 100.0,
          )
          event_artifact = build_execution_event_artifact(
              candidate_config_digest=candidate_config_digest,
              evaluation_run_digest=request.digest,
              fold=request.fold,
              seed=request.seed,
              dataset_id=plan.dataset_identity,
              execution_policy_digest=plan.execution_identity,
              actions=actions,
              observation_digests=observations,
              equity_curve=equity,
              order_events=events,
              terminal_book=terminal_book,
              terminal_order_book=terminal_order_book,
          )
          event_path = write_execution_event_artifact'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f"orchestration fixture block replacement count={count}")
          old_call = '''                event_path, evidence_path = _promotion_sources(
                      root / "source" / request.digest,
                      plan,
                      terminal_equity=terminal_equity,
                  )'''
          new_call = '''                event_path, evidence_path = _promotion_sources(
                      root / "source" / request.digest,
                      plan,
                      request=request,
                      candidate_config_digest=config_digest,
                      terminal_equity=terminal_equity,
                  )'''
          if text.count(old_call) != 1:
              raise SystemExit("orchestration helper call mismatch")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fixture compatibility
        shell: bash
        run: |
          git diff --check
          git config user.name "trade-rl-automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/workflows
          git commit -m "test: adapt Stage A fixtures to strict replay artifacts"
          git push origin HEAD:fix/evidence-stage-transaction-v2
