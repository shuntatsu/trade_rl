name: Temporary Stage A SB3 RED

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-stage-a-sb3-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Verify expected RED failures
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. uv run pytest -q tests/rl/test_environment_timing.py -k baseline_action > baseline.log 2>&1
          baseline_status=$?
          PYTHONPATH=. uv run pytest -q tests/integrations/test_stage_a_sb3_evaluation.py > executor.log 2>&1
          executor_status=$?
          set -e
          cat baseline.log
          cat executor.log
          test "$baseline_status" -ne 0
          test "$executor_status" -ne 0
          grep -q "has no attribute 'baseline_action'" baseline.log
          grep -q "No module named 'trade_rl.integrations.stage_a_sb3_evaluation'" executor.log
