name: Temporary Stage A Sealed Orchestrator GREEN

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-stage-a-sealed-orchestrator-green.yml

permissions:
  contents: write

jobs:
  green:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Bind access evidence to one authorization batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/stage_a_zero_shot_runner_contracts.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '_STAGE_A_ACCESS_RECORD_SCHEMA = "stage_a_sealed_test_access_record_v1"',
                  '_STAGE_A_ACCESS_RECORD_SCHEMA = "stage_a_sealed_test_access_record_v2"',
              ),
              (
                  '_STAGE_A_SEALED_TEST_RUN_SCHEMA = "stage_a_sealed_test_run_v2"',
                  '_STAGE_A_SEALED_TEST_RUN_SCHEMA = "stage_a_sealed_test_run_v3"',
              ),
              (
                  '    evaluation_dataset_manifest_digest: str\n    triplet_id: str\n',
                  '    authorization_batch_digest: str\n    evaluation_dataset_manifest_digest: str\n    triplet_id: str\n',
              ),
              (
                  '        for field, value in (\n            (\n                "evaluation_dataset_manifest_digest",\n',
                  '        for field, value in (\n            ("authorization_batch_digest", self.authorization_batch_digest),\n            (\n                "evaluation_dataset_manifest_digest",\n',
              ),
              (
                  '        return {\n            "dataset_id": self.dataset_id,\n            "evaluation_dataset_manifest_digest": (\n',
                  '        return {\n            "authorization_batch_digest": self.authorization_batch_digest,\n            "dataset_id": self.dataset_id,\n            "evaluation_dataset_manifest_digest": (\n',
              ),
              (
                  '        if not self.access_records:\n            raise ValueError("Stage A sealed-test run requires access records")\n        keys = tuple((record.triplet_id, record.fold) for record in self.access_records)\n',
                  '        if not self.access_records:\n            raise ValueError("Stage A sealed-test run requires access records")\n        batch_digests = {\n            record.authorization_batch_digest for record in self.access_records\n        }\n        if len(batch_digests) != 1:\n            raise ValueError(\n                "Stage A sealed-test access records must share one batch"\n            )\n        keys = tuple((record.triplet_id, record.fold) for record in self.access_records)\n',
              ),
              (
                  '        object.__setattr__(self, "digest", expected)\n\n    def digest_payload(self) -> dict[str, object]:\n        return {\n            "access_digests": tuple(\n',
                  '        object.__setattr__(self, "digest", expected)\n\n    @property\n    def authorization_batch_digest(self) -> str:\n        return self.access_records[0].authorization_batch_digest\n\n    def digest_payload(self) -> dict[str, object]:\n        return {\n            "access_digests": tuple(\n',
              ),
              (
                  '            "decision_digest": self.decision.digest,\n            "evidence_digest": self.evidence.digest,\n',
                  '            "authorization_batch_digest": (\n                self.authorization_batch_digest\n            ),\n            "decision_digest": self.decision.digest,\n            "evidence_digest": self.evidence.digest,\n',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"contract replacement marker missing: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff check --fix \
            trade_rl/evaluation/stage_a_sealed_test.py \
            trade_rl/catalog/postgres_stage_a_sealed_test.py \
            trade_rl/workflows/stage_a_zero_shot_runner.py \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            trade_rl/workflows/stage_a_zero_shot_artifacts.py \
            tests/evaluation/test_stage_a_sealed_test.py \
            tests/workflows/test_stage_a_zero_shot_runner.py \
            tests/workflows/test_stage_a_zero_shot_artifacts.py
          uv run ruff format \
            trade_rl/evaluation/stage_a_sealed_test.py \
            trade_rl/catalog/postgres_stage_a_sealed_test.py \
            trade_rl/workflows/stage_a_zero_shot_runner.py \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            trade_rl/workflows/stage_a_zero_shot_artifacts.py \
            tests/evaluation/test_stage_a_sealed_test.py \
            tests/workflows/test_stage_a_zero_shot_runner.py \
            tests/workflows/test_stage_a_zero_shot_artifacts.py
          PYTHONPATH=. uv run pytest -q \
            tests/evaluation/test_stage_a_sealed_test.py \
            tests/workflows/test_stage_a_zero_shot_runner.py \
            tests/workflows/test_stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_zero_shot_run_contract_hardening.py \
            tests/workflows/test_stage_a_zero_shot_artifacts.py
          uv run ruff check \
            trade_rl/evaluation/stage_a_sealed_test.py \
            trade_rl/catalog/postgres_stage_a_sealed_test.py \
            trade_rl/workflows/stage_a_zero_shot_runner.py \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            trade_rl/workflows/stage_a_zero_shot_artifacts.py
          uv run mypy \
            trade_rl/evaluation/stage_a_sealed_test.py \
            trade_rl/catalog/postgres_stage_a_sealed_test.py \
            trade_rl/workflows/stage_a_zero_shot_runner.py \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            trade_rl/workflows/stage_a_zero_shot_artifacts.py
          uv run lint-imports
          rm -f \
            .github/workflows/temporary-stage-a-sealed-orchestrator-red.yml \
            .github/workflows/temporary-stage-a-sealed-orchestrator-green.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: authorize Stage A sealed tests atomically"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
