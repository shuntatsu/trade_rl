name: Temporary Stage A Sealed Orchestrator RED

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-stage-a-sealed-orchestrator-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Verify expected RED failure
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. uv run pytest -q tests/workflows/test_stage_a_zero_shot_runner.py > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -ne 0
          grep -Eq "unexpected keyword argument|authorization_batch_digest" red.log
