name: Temporary Stage A Sealed Self Review

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-stage-a-sealed-self-review.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Reconstruct and verify authorization batch identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          contracts = Path(
              "trade_rl/workflows/stage_a_zero_shot_runner_contracts.py"
          )
          text = contracts.read_text(encoding="utf-8")
          import_anchor = (
              "from trade_rl.evaluation.stage_a_zero_shot_contracts import (\n"
          )
          import_block = '''from trade_rl.evaluation.stage_a_sealed_test import (\n    StageASealedTestCellSpec,\n    build_stage_a_sealed_test_authorization_batch,\n)\n'''
          if import_block not in text:
              if import_anchor not in text:
                  raise SystemExit("Stage A sealed batch import anchor missing")
              text = text.replace(import_anchor, import_block + import_anchor, 1)

          old = '''        for record in self.access_records:\n            generic = record.ledger_record\n            if (\n                generic.experiment_plan_digest != self.evidence.plan_digest\n                or generic.selected_configuration != selected_id\n                or generic.selected_policy_digest is None\n            ):\n                raise ValueError("Stage A sealed-test access identity mismatch")\n        expected = content_digest(self.digest_payload())\n'''
          new = '''        expected_data: dict[tuple[str, int], tuple[str, IndexRange]] = {}\n        evidence_manifest_digests: set[str] = set()\n        evaluation_identities: set[str] = set()\n        for observation in self.evidence.observations:\n            key = (observation.triplet_id, observation.fold)\n            value = (observation.dataset_id, observation.evaluation_range)\n            previous = expected_data.setdefault(key, value)\n            if previous != value:\n                raise ValueError(\n                    "Stage A sealed-test evidence data identity mismatch"\n                )\n            evidence_manifest_digests.add(\n                observation.evaluation_dataset_manifest_digest\n            )\n            evaluation_identities.add(observation.evaluation_identity)\n        access_manifest_digests = {\n            record.evaluation_dataset_manifest_digest\n            for record in self.access_records\n        }\n        selected_policy_digests: set[str] = set()\n        for record in self.access_records:\n            generic = record.ledger_record\n            if (\n                generic.experiment_plan_digest != self.evidence.plan_digest\n                or generic.selected_configuration != selected_id\n                or generic.selected_policy_digest is None\n            ):\n                raise ValueError("Stage A sealed-test access identity mismatch")\n            expected_dataset, expected_range = expected_data[\n                (record.triplet_id, record.fold)\n            ]\n            if (\n                record.dataset_id != expected_dataset\n                or record.test_range != expected_range\n            ):\n                raise ValueError(\n                    "Stage A sealed-test access data identity mismatch"\n                )\n            selected_policy_digests.add(generic.selected_policy_digest)\n        if (\n            len(access_manifest_digests) != 1\n            or access_manifest_digests != evidence_manifest_digests\n            or len(evaluation_identities) != 1\n            or len(selected_policy_digests) != 1\n        ):\n            raise ValueError(\n                "Stage A sealed-test authorization identity closure mismatch"\n            )\n        reconstructed_batch = build_stage_a_sealed_test_authorization_batch(\n            experiment_plan_digest=self.evidence.plan_digest,\n            evaluation_dataset_manifest_digest=next(\n                iter(access_manifest_digests)\n            ),\n            evaluation_identity=next(iter(evaluation_identities)),\n            selected_configuration=selected_id,\n            selected_policy_digest=next(iter(selected_policy_digests)),\n            cells=tuple(\n                StageASealedTestCellSpec(\n                    triplet_id=record.triplet_id,\n                    dataset_id=record.dataset_id,\n                    fold_index=record.fold,\n                    test_range=record.test_range,\n                )\n                for record in self.access_records\n            ),\n        )\n        if reconstructed_batch.batch_digest != self.authorization_batch_digest:\n            raise ValueError(\n                "Stage A sealed-test authorization batch digest mismatch"\n            )\n        expected = content_digest(self.digest_payload())\n'''
          if old not in text:
              raise SystemExit("Stage A run identity block missing")
          text = text.replace(old, new, 1)
          contracts.write_text(text, encoding="utf-8")

          test_path = Path("tests/workflows/test_stage_a_zero_shot_runner.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_import = '''    StageAEvaluationCellResult,\n    StageAValidationRun,\n)\n'''
          new_import = '''    StageAEvaluationCellResult,\n    StageASealedTestRun,\n    StageAValidationRun,\n)\n'''
          if old_import not in test_text:
              raise SystemExit("Stage A run test import marker missing")
          test_text = test_text.replace(old_import, new_import, 1)
          marker = '''\ndef test_sealed_test_cannot_be_opened_twice() -> None:\n'''
          test_case = '''\ndef test_sealed_test_run_recomputes_authorization_batch_digest() -> None:\n    orchestrator, _, _, _ = _orchestrator()\n    validation_run = orchestrator.evaluate_validation()\n    sealed_run = orchestrator.evaluate_sealed_test(validation_run)\n    forged_digest = _digest("forged-authorization-batch")\n    forged_records = tuple(\n        replace(\n            record,\n            authorization_batch_digest=forged_digest,\n            digest="",\n        )\n        for record in sealed_run.access_records\n    )\n\n    with pytest.raises(ValueError, match="batch digest mismatch"):\n        StageASealedTestRun(\n            validation_run=sealed_run.validation_run,\n            access_records=forged_records,\n            evidence=sealed_run.evidence,\n            decision=sealed_run.decision,\n        )\n\n\n'''
          if marker not in test_text:
              raise SystemExit("Stage A run test insertion marker missing")
          test_text = test_text.replace(marker, test_case + marker, 1)
          test_path.write_text(test_text, encoding="utf-8")
          PY
          uv run ruff check --fix \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_zero_shot_runner.py
          uv run ruff format \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_zero_shot_runner.py
          PYTHONPATH=. uv run pytest -q \
            tests/evaluation/test_stage_a_sealed_test.py \
            tests/workflows/test_stage_a_zero_shot_runner.py \
            tests/workflows/test_stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_zero_shot_run_contract_hardening.py \
            tests/workflows/test_stage_a_zero_shot_artifacts.py
          uv run ruff check \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py \
            tests/workflows/test_stage_a_zero_shot_runner.py
          uv run mypy \
            trade_rl/evaluation/stage_a_sealed_test.py \
            trade_rl/workflows/stage_a_zero_shot_runner.py \
            trade_rl/workflows/stage_a_zero_shot_runner_contracts.py
          uv run lint-imports
          rm -f .github/workflows/temporary-stage-a-sealed-self-review.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: reconstruct Stage A authorization batch identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
