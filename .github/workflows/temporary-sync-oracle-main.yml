name: Temporary Synchronize Oracle Main

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.head_ref == 'agent/perfect-information-oracle-bound'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oracle branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Merge exact main and verify focused scope
        env:
          PYTHONPATH: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/temporary-sync-oracle-main.yml
          uv sync --extra dev --extra export --extra train-sb3 --extra studio --extra oracle
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q tests/evaluation/test_perfect_information_bound_*.py
          git commit -m "merge: synchronize perfect-information bound with main"
          git push origin HEAD:agent/perfect-information-oracle-bound
