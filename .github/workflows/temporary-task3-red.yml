name: Temporary Task 3 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    if: github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 3 tests only
        env:
          TASK_PATCH_GZ_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TASK_PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/task3-tests.patch
          git apply --check /tmp/task3-tests.patch
          git apply /tmp/task3-tests.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Run Task 3 tests expecting RED
        run: uv run pytest -q tests/integrations/test_compact_rollout_buffer.py tests/rl/test_rollout_memory.py
