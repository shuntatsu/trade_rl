name: Temporary Task 4 GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  green:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 4 implementation
        env:
          TASK_PATCH_GZ_HEX: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path

          Path('/tmp/task4.patch').write_bytes(
              gzip.decompress(bytes.fromhex(os.environ['TASK_PATCH_GZ_HEX']))
          )
          PY
          git apply --check /tmp/task4.patch
          git apply /tmp/task4.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Format and lint Task 4 files
        shell: bash
        run: |
          set -euo pipefail
          files=(trade_rl/rl/policies.py tests/rl/test_sequence_policy_core.py)
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Run Task 4 focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/rl/test_sequence_policy_core.py \
            tests/integrations/test_sb3_model_assembly.py \
            2>&1 | tee task4-tests.log
      - name: Commit verified Task 4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add trade_rl/rl/policies.py tests/rl/test_sequence_policy_core.py
          git diff --cached --check
          git commit -m "feat: add hierarchical gate-target actor"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task4-diagnostics
          path: task4-tests.log
          if-no-files-found: ignore
