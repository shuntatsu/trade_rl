name: Temporary Task 6 FIX

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 6 and MyPy fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-task6.yml').read_text(encoding='utf-8')
          parts = {
              int(index): value
              for index, value in re.findall(r'TASK_PATCH_GZ_HEX_(\d+): ([0-9a-f]+)', workflow)
          }
          if tuple(sorted(parts)) != (1, 2, 3, 4):
              raise RuntimeError(f'unexpected Task 6 payload parts: {sorted(parts)}')
          payload = ''.join(parts[index] for index in range(1, 5))
          Path('/tmp/task6.patch').write_bytes(gzip.decompress(bytes.fromhex(payload)))
          PY
          git apply --check /tmp/task6.patch
          git apply /tmp/task6.patch
          python - <<'PY'
          from pathlib import Path

          compact = Path('trade_rl/integrations/compact_rollout_buffer.py')
          compact_text = compact.read_text(encoding='utf-8')
          compact_old = '''            expected_shape = (self.buffer_size * self.n_envs, self.action_dim)\n'''
          compact_new = '''            expected_shape: tuple[int, ...] = (\n                self.buffer_size * self.n_envs, self.action_dim\n            )\n'''
          if compact_old not in compact_text:
              raise RuntimeError('compact rollout expected-shape assignment was not found')
          compact.write_text(
              compact_text.replace(compact_old, compact_new, 1),
              encoding='utf-8',
          )

          training = Path('trade_rl/integrations/sb3_training.py')
          training_text = training.read_text(encoding='utf-8')
          training_old = '''def _required_hierarchical_config(config: object, name: str) -> object:\n    value = getattr(config, name, None)\n    if value is None:\n        raise ValueError(\n            f"hierarchical BC requires explicit training_run_config_v3 field {name}"\n        )\n    return value\n'''
          training_new = '''def _required_hierarchical_config(config: object, name: str) -> int | float:\n    value = getattr(config, name, None)\n    if value is None:\n        raise ValueError(\n            f"hierarchical BC requires explicit training_run_config_v3 field {name}"\n        )\n    if isinstance(value, bool) or not isinstance(value, int | float):\n        raise ValueError(\n            f"hierarchical BC training_run_config_v3 field {name} must be numeric"\n        )\n    if not np.isfinite(float(value)):\n        raise ValueError(\n            f"hierarchical BC training_run_config_v3 field {name} must be finite"\n        )\n    return value\n'''
          if training_old not in training_text:
              raise RuntimeError('hierarchical config helper was not found')
          training.write_text(
              training_text.replace(training_old, training_new, 1),
              encoding='utf-8',
          )
          PY
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Format and lint Task 6 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/integrations/compact_rollout_buffer.py
            trade_rl/learning/evaluation.py
            trade_rl/learning/rollout_evaluation.py
            trade_rl/learning/__init__.py
            trade_rl/integrations/sb3_training.py
            tests/learning/test_learning_evaluation.py
            tests/learning/test_rollout_evaluation.py
            tests/integrations/test_sb3_training.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Type-check Task 6 production files
        run: >-
          uv run mypy
          trade_rl/integrations/compact_rollout_buffer.py
          trade_rl/learning/evaluation.py
          trade_rl/learning/rollout_evaluation.py
          trade_rl/learning/__init__.py
          trade_rl/integrations/sb3_training.py
      - name: Run Task 6 focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/integrations/test_compact_rollout_buffer.py \
            tests/learning/test_learning_evaluation.py \
            tests/learning/test_rollout_evaluation.py \
            tests/learning/test_behavior_cloning.py \
            tests/learning/test_hierarchical_bc_metrics.py \
            tests/integrations/test_sb3_training.py \
            2>&1 | tee task6-tests.log
      - name: Commit verified Task 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            trade_rl/integrations/compact_rollout_buffer.py \
            trade_rl/learning/evaluation.py \
            trade_rl/learning/rollout_evaluation.py \
            trade_rl/learning/__init__.py \
            trade_rl/integrations/sb3_training.py \
            tests/learning/test_learning_evaluation.py \
            tests/learning/test_rollout_evaluation.py \
            tests/integrations/test_sb3_training.py
          git diff --cached --check
          git commit -m "feat: require BC reconstruction and non-collapse gates"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task6-fix-diagnostics
          path: task6-tests.log
          if-no-files-found: ignore
