name: Temporary Task 6 GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  green:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 6 implementation
        env:
          TASK_PATCH_GZ_HEX_1: 
          TASK_PATCH_GZ_HEX_2: 
          TASK_PATCH_GZ_HEX_3: 
          TASK_PATCH_GZ_HEX_4: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path

          hex_payload = ''.join(
              os.environ[f'TASK_PATCH_GZ_HEX_{index}'] for index in range(1, 5)
          )
          Path('/tmp/task6.patch').write_bytes(gzip.decompress(bytes.fromhex(hex_payload)))
          PY
          git apply --check /tmp/task6.patch
          git apply /tmp/task6.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Format and lint Task 6 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/learning/evaluation.py
            trade_rl/learning/rollout_evaluation.py
            trade_rl/learning/__init__.py
            trade_rl/integrations/sb3_training.py
            tests/learning/test_learning_evaluation.py
            tests/learning/test_rollout_evaluation.py
            tests/integrations/test_sb3_training.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Type-check Task 6 production files
        run: >-
          uv run mypy
          trade_rl/learning/evaluation.py
          trade_rl/learning/rollout_evaluation.py
          trade_rl/learning/__init__.py
          trade_rl/integrations/sb3_training.py
      - name: Run Task 6 focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/learning/test_learning_evaluation.py \
            tests/learning/test_rollout_evaluation.py \
            tests/learning/test_behavior_cloning.py \
            tests/learning/test_hierarchical_bc_metrics.py \
            tests/integrations/test_sb3_training.py \
            2>&1 | tee task6-tests.log
      - name: Commit verified Task 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            trade_rl/learning/evaluation.py \
            trade_rl/learning/rollout_evaluation.py \
            trade_rl/learning/__init__.py \
            trade_rl/integrations/sb3_training.py \
            tests/learning/test_learning_evaluation.py \
            tests/learning/test_rollout_evaluation.py \
            tests/integrations/test_sb3_training.py
          git diff --cached --check
          git commit -m "feat: require BC reconstruction and non-collapse gates"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task6-diagnostics
          path: task6-tests.log
          if-no-files-found: ignore
