name: Temporary Task 6 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    if: github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 6 tests only
        env:
          TASK_PATCH_GZ_HEX: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path

          Path('/tmp/task6-tests.patch').write_bytes(
              gzip.decompress(bytes.fromhex(os.environ['TASK_PATCH_GZ_HEX']))
          )
          PY
          git apply --check /tmp/task6-tests.patch
          git apply /tmp/task6-tests.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Verify expected RED
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/learning/test_learning_evaluation.py \
            tests/learning/test_rollout_evaluation.py \
            tests/integrations/test_sb3_training.py \
            > task6-red.log 2>&1
          status=$?
          set -e
          cat task6-red.log
          test "$status" -ne 0
          grep -E 'BehaviorCloningGate|ActionPathCollapseEvidence|_hierarchical_teacher_labels' task6-red.log
      - name: Upload RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task6-red
          path: task6-red.log
          if-no-files-found: error
