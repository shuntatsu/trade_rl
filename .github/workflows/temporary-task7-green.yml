name: Temporary Task 7 GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  green:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 7 implementation
        env:
          TASK7_PATCH_GZ_HEX: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path
          Path('/tmp/task7.patch').write_bytes(
              gzip.decompress(bytes.fromhex(os.environ['TASK7_PATCH_GZ_HEX']))
          )
          PY
          git apply --check /tmp/task7.patch
          git apply /tmp/task7.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Format and lint Task 7 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            trade_rl/rl/training.py
            trade_rl/workflows/training_run.py
            trade_rl/integrations/sb3_model_assembly.py
            tests/workflows/test_training_run.py
            tests/integrations/test_sb3_model_assembly.py
            tests/workflows/test_signal_digest.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check --fix "${files[@]}"
          uv run ruff check "${files[@]}"
      - name: Type-check Task 7 production files
        run: >-
          uv run mypy
          trade_rl/rl/training.py
          trade_rl/workflows/training_run.py
          trade_rl/integrations/sb3_model_assembly.py
      - name: Run Task 7 focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/workflows/test_training_run.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/workflows/test_signal_digest.py \
            2>&1 | tee task7-tests.log
      - name: Commit verified Task 7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            trade_rl/rl/training.py \
            trade_rl/workflows/training_run.py \
            trade_rl/integrations/sb3_model_assembly.py \
            tests/workflows/test_training_run.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/workflows/test_signal_digest.py \
            examples/binance-multitimeframe/walk-forward-full.json
          git diff --cached --check
          git commit -m "feat: bind hierarchical actor to training config v3"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task7-diagnostics
          path: task7-tests.log
          if-no-files-found: ignore
