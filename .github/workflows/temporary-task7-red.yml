name: Temporary Task 7 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    if: github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 7 tests only
        env:
          TASK7_TESTS_GZ_HEX: 
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import os
          from pathlib import Path
          Path('/tmp/task7-tests.patch').write_bytes(
              gzip.decompress(bytes.fromhex(os.environ['TASK7_TESTS_GZ_HEX']))
          )
          PY
          git apply --check /tmp/task7-tests.patch
          git apply /tmp/task7-tests.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Verify expected RED
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/workflows/test_training_run.py \
            tests/integrations/test_sb3_model_assembly.py \
            tests/workflows/test_signal_digest.py \
            2>&1 | tee task7-red.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'Task 7 tests unexpectedly passed before implementation' >&2
            exit 1
          fi
          grep -Eq 'training_run_config_v3|policy_actor_head|unexpected keyword argument' task7-red.log
      - name: Upload RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task7-red
          path: task7-red.log
          if-no-files-found: ignore
