name: Temporary Task 8 Inspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Upload Task 8 sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task8-sources
          path: |
            trade_rl/integrations/sb3_serving.py
            trade_rl/serving/package.py
            trade_rl/rl/policy_identity.py
            trade_rl/rl/structured_export.py
            trade_rl/rl/checkpointing.py
            trade_rl/integrations/sb3_checkpoint_assembly.py
            trade_rl/integrations/sb3_model_assembly.py
            tests/serving/test_sb3_loader.py
            tests/serving/test_observation_snapshot_fail_closed.py
            tests/serving/test_observation_parity.py
            tests/serving/test_structured_policy_loader.py
            tests/integrations/test_sb3_policy_identity_v2.py
            tests/rl/test_structured_export.py
