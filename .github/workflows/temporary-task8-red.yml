name: Temporary Task 8 RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red:
    if: github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply Task 8 tests only
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/tmp/task8-tests.patch.gz.b64 | gzip --decompress > /tmp/task8-tests.patch
          git apply --check /tmp/task8-tests.patch
          git apply /tmp/task8-tests.patch
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Verify expected RED
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            tests/integrations/test_sb3_policy_identity_v2.py \
            tests/rl/test_structured_export.py \
            tests/serving/test_sb3_loader.py \
            tests/serving/test_structured_policy_loader.py \
            tests/workflows/test_training_run_config.py \
            2>&1 | tee task8-red.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'Task 8 tests unexpectedly passed before implementation' >&2
            exit 1
          fi
          grep -Eq 'policy_architecture_digest|current_weights|sb3_policy_loader_v3|unexpected keyword argument|actor-head' task8-red.log
      - name: Upload RED diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchical-bc-task8-red
          path: task8-red.log
          if-no-files-found: ignore
