name: Temporary Task 9 Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/hierarchical-bc-actor-design'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3 --extra postgres
      - name: Format full-tree findings
        shell: bash
        run: |
          set -euo pipefail
          files=(
            examples/binance-multitimeframe/full_research_pipeline.py
            examples/binance-multitimeframe/training_bootstrap.py
            tests/integrations/test_postgres_market_dataset.py
            tests/integrations/test_sequence_runtime_acceleration.py
            trade_rl/integrations/postgres_indicator_artifacts.py
            trade_rl/integrations/postgres_market_dataset.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check --diff .
      - name: Run affected tests
        run: >-
          uv run pytest -q
          tests/integrations/test_postgres_market_dataset.py
          tests/integrations/test_sequence_runtime_acceleration.py
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trade-rl task executor"
          git config user.email "actions@users.noreply.github.com"
          git add \
            examples/binance-multitimeframe/full_research_pipeline.py \
            examples/binance-multitimeframe/training_bootstrap.py \
            tests/integrations/test_postgres_market_dataset.py \
            tests/integrations/test_sequence_runtime_acceleration.py \
            trade_rl/integrations/postgres_indicator_artifacts.py \
            trade_rl/integrations/postgres_market_dataset.py
          git diff --cached --check
          git commit -m "style: format PostgreSQL training pipeline"
          git push origin HEAD:${{ github.head_ref }}
