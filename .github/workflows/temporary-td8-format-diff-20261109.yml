name: Temporary TD8 format diff 20261109
on:
  push:
    branches: [fix/td8-root-key-predecode-20261109]
permissions:
  contents: read
env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          check-latest: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --extra dev
      - name: Print exact Ruff format delta
        run: uv run ruff format --diff tests/evaluation/test_decision_value_receipt_byte_ceiling.py
