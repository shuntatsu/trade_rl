name: Temporary trailing newline repair

on:
  push:
    branches:
      - integration/cost-aware-causal-teacher-final2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}

      - name: Repair only the missing EOF newline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/_market_walk_forward_core.py")
          data = path.read_bytes()
          if data.endswith(b"\n"):
              raise SystemExit("target already has a trailing newline; refusing unexpected no-op")
          path.write_bytes(data + b"\n")
          PY
          git diff --check
          git diff --exit-code -- . ':(exclude)trade_rl/workflows/_market_walk_forward_core.py' || {
            echo "unexpected files changed" >&2
            exit 1
          }

      - name: Commit exact repair
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/_market_walk_forward_core.py
          git diff --cached --check
          git diff --cached --quiet && {
            echo "expected one-file newline repair but staged diff is empty" >&2
            exit 1
          }
          git commit -m "style: restore walk-forward EOF newline"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
