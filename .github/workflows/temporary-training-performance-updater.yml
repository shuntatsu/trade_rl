name: Temporary training performance updater

on:
  push:
    branches:
      - agent/training-performance-evidence
  pull_request:
    branches:
      - agent/training-performance-evidence
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/training-performance-evidence
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply reviewed patch
        run: uv run python .github/scripts/apply_training_performance_evidence.py

      - name: Format
        run: >-
          uv run ruff format
          trade_rl/rl/training_performance.py
          trade_rl/integrations/compact_rollout_buffer.py
          trade_rl/integrations/sb3_training.py
          examples/binance-multitimeframe/run_gpu_training_smoke.py
          tests/rl/test_training_performance_evidence.py
          tests/integrations/test_compact_rollout_performance.py
          tests/integrations/test_sb3_training_performance.py
          tests/examples/test_run_gpu_training_smoke.py
          tests/examples/test_docker_training_assets.py

      - name: Focused tests
        run: >-
          uv run pytest
          tests/rl/test_training_performance_evidence.py
          tests/integrations/test_compact_rollout_performance.py
          tests/integrations/test_sb3_training_performance.py
          tests/integrations/test_sb3_training.py
          tests/integrations/test_sb3_cost_critic_backend.py
          tests/integrations/test_sb3_lagrangian_backend.py
          tests/examples/test_run_gpu_training_smoke.py
          tests/examples/test_docker_training_assets.py
          tests/examples/test_binance_multitimeframe_full_assets.py
          -q

      - name: Ruff check diagnostics
        shell: bash
        run: |
          mkdir -p static-diagnostics
          set +e
          uv run ruff check trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py examples/binance-multitimeframe/run_gpu_training_smoke.py tests/rl/test_training_performance_evidence.py tests/integrations/test_compact_rollout_performance.py tests/integrations/test_sb3_training_performance.py tests/examples/test_run_gpu_training_smoke.py tests/examples/test_docker_training_assets.py 2>&1 | tee static-diagnostics/ruff-check.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > static-diagnostics/ruff-check.status
          exit 0

      - name: Ruff format diagnostics
        shell: bash
        run: |
          set +e
          uv run ruff format --check trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py examples/binance-multitimeframe/run_gpu_training_smoke.py tests/rl/test_training_performance_evidence.py tests/integrations/test_compact_rollout_performance.py tests/integrations/test_sb3_training_performance.py tests/examples/test_run_gpu_training_smoke.py tests/examples/test_docker_training_assets.py 2>&1 | tee static-diagnostics/ruff-format.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > static-diagnostics/ruff-format.status
          exit 0

      - name: Mypy diagnostics
        shell: bash
        run: |
          set +e
          uv run mypy trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py 2>&1 | tee static-diagnostics/mypy.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > static-diagnostics/mypy.status
          exit 0

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: training-performance-static-diagnostics
          path: static-diagnostics
          if-no-files-found: error

      - name: Enforce static verification
        run: |
          test "$(cat static-diagnostics/ruff-check.status)" = 0
          test "$(cat static-diagnostics/ruff-format.status)" = 0
          test "$(cat static-diagnostics/mypy.status)" = 0

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply_training_performance_evidence.py
          rm -f .github/workflows/temporary-training-performance-updater.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add training performance evidence"
          git push origin HEAD:agent/training-performance-evidence
