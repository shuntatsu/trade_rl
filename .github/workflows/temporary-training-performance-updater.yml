name: Temporary training performance updater

on:
  push:
    branches:
      - agent/training-performance-evidence

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/training-performance-evidence
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply reviewed patch
        run: uv run python .github/scripts/apply_training_performance_evidence.py

      - name: Format
        run: >-
          uv run ruff format
          trade_rl/rl/training_performance.py
          trade_rl/integrations/compact_rollout_buffer.py
          trade_rl/integrations/sb3_training.py
          examples/binance-multitimeframe/run_gpu_training_smoke.py
          tests/rl/test_training_performance_evidence.py
          tests/integrations/test_compact_rollout_performance.py
          tests/integrations/test_sb3_training_performance.py
          tests/examples/test_run_gpu_training_smoke.py
          tests/examples/test_docker_training_assets.py

      - name: Focused tests
        run: >-
          uv run pytest
          tests/rl/test_training_performance_evidence.py
          tests/integrations/test_compact_rollout_performance.py
          tests/integrations/test_sb3_training_performance.py
          tests/integrations/test_sb3_training.py
          tests/integrations/test_sb3_cost_critic_backend.py
          tests/integrations/test_sb3_lagrangian_backend.py
          tests/examples/test_run_gpu_training_smoke.py
          tests/examples/test_docker_training_assets.py
          tests/examples/test_binance_multitimeframe_full_assets.py
          -q

      - name: Static verification
        run: |
          uv run ruff check trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py examples/binance-multitimeframe/run_gpu_training_smoke.py tests/rl/test_training_performance_evidence.py tests/integrations/test_compact_rollout_performance.py tests/integrations/test_sb3_training_performance.py tests/examples/test_run_gpu_training_smoke.py tests/examples/test_docker_training_assets.py
          uv run ruff format --check trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py examples/binance-multitimeframe/run_gpu_training_smoke.py tests/rl/test_training_performance_evidence.py tests/integrations/test_compact_rollout_performance.py tests/integrations/test_sb3_training_performance.py tests/examples/test_run_gpu_training_smoke.py tests/examples/test_docker_training_assets.py
          uv run mypy trade_rl/rl/training_performance.py trade_rl/integrations/compact_rollout_buffer.py trade_rl/integrations/sb3_training.py

      - name: Commit verified implementation
        run: |
          rm -f .github/scripts/apply_training_performance_evidence.py
          rm -f .github/workflows/temporary-training-performance-updater.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add training performance evidence"
          git push origin HEAD:agent/training-performance-evidence
