name: Cleanup Temporary Typst Validation

on:
  pull_request:
    branches:
      - temp/typst-report-base-20260804

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'temp/typst-report-compile-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary base and head refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          delete_ref() {
            local ref="$1"
            local status
            status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
              --request DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}")
            if [[ "$status" != "204" && "$status" != "422" ]]; then
              cat response.json
              echo "unexpected status ${status} while deleting ${ref}" >&2
              exit 1
            fi
          }

          delete_ref 'temp/typst-report-base-20260804'
          delete_ref 'temp/typst-report-compile-20260804'
