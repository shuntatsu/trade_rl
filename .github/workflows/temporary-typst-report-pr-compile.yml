name: Temporary Typst Report PR Compile

on:
  pull_request:
    branches:
      - temp/typst-report-base-20260804

permissions:
  contents: read

jobs:
  compile:
    if: github.head_ref == 'temp/typst-report-compile-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Reconstruct and patch Typst source
        shell: bash
        run: |
          mkdir -p report
          sed -n "/cat > report\/source.typ.gz.b64 <<'B64'/,/^[[:space:]]*B64$/p" \
            .github/workflows/temporary-typst-report-compile.yml \
            | sed '1d;$d;s/^[[:space:]]*//' \
            > report/source.typ.gz.b64
          base64 --decode report/source.typ.gz.b64 | gzip --decompress > report/information_network_report_final.typ
          test "$(wc -c < report/information_network_report_final.typ)" -eq 27543
          sed -i \
            -e 's/#header-cell/header-cell/g' \
            -e 's/out_1/"out"_1/g' \
            -e 's/out_2/"out"_2/g' \
            -e 's/out_3/"out"_3/g' \
            -e 's/@state-transitionに照合して/#ref(<state-transition>)に照合して/g' \
            -e 's/@encoding-stepsに示す/#ref(<encoding-steps>)に示す/g' \
            -e 's/@state-transitionに基づく/#ref(<state-transition>)に基づく/g' \
            -e 's/@viterbi-metricsより/#ref(<viterbi-metrics>)より/g' \
            -e 's/@rsa-squaresに示す/#ref(<rsa-squares>)に示す/g' \
            report/information_network_report_final.typ

      - name: Show Typst version
        run: docker run --rm ghcr.io/typst/typst:latest --version

      - name: Compile report
        run: |
          docker run --rm \
            -v "$PWD/report:/work" \
            -v /usr/share/fonts:/fonts:ro \
            -w /work \
            ghcr.io/typst/typst:latest \
            compile --font-path /fonts information_network_report_final.typ information_network_report_final.pdf

      - name: Inspect output
        run: |
          test -s report/information_network_report_final.pdf
          file report/information_network_report_final.pdf
          pdfinfo report/information_network_report_final.pdf | tee report/pdfinfo.txt
          ls -lh report/information_network_report_final.typ report/information_network_report_final.pdf

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: information-network-report-typst
          path: |
            report/information_network_report_final.typ
            report/information_network_report_final.pdf
            report/pdfinfo.txt
          if-no-files-found: error
          retention-days: 1
