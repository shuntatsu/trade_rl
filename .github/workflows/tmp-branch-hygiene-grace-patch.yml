name: Temporary branch hygiene observation grace patch

on:
  push:
    branches:
      - fix/branch-hygiene-observation-grace
    paths:
      - tools/tmp_branch_hygiene_grace_patch.py
      - .github/workflows/tmp-branch-hygiene-grace-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/branch-hygiene-observation-grace
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/tmp_branch_hygiene_grace_patch.py

      - name: Format and targeted verification
        shell: bash
        run: |
          set -euo pipefail
          uvx --from ruff==0.15.21 ruff check --fix tools/branch_hygiene.py tests/tools/test_branch_hygiene.py
          uvx --from ruff==0.15.21 ruff format tools/branch_hygiene.py tests/tools/test_branch_hygiene.py
          python3 -m compileall -q tools/branch_hygiene.py tests/tools/test_branch_hygiene.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/branch_hygiene.py tests/tools/test_branch_hygiene.py AGENTS.md
          git commit -m 'fix: require observation grace before branch deletion'
          git push origin HEAD:fix/branch-hygiene-observation-grace
