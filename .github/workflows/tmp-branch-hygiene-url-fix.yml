name: Temporary branch hygiene URL fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/branch-hygiene-repository-url'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply regression fix and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('tools/branch_hygiene.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''        url = f"{self._api_url}/repos/{owner}/{name}/{suffix.lstrip('/')}"\n        if query:\n'''
          new = '''        base_url = f"{self._api_url}/repos/{owner}/{name}"\n        path = suffix.lstrip("/")\n        url = f"{base_url}/{path}" if path else base_url\n        if query:\n'''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one repository URL construction site')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          test_path = Path('tests/tools/test_branch_hygiene.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_repository_root_url_has_no_trailing_slash() -> None:'
          if marker not in tests:
              tests += '''\n\ndef test_repository_root_url_has_no_trailing_slash() -> None:\n    from tools.branch_hygiene import GitHubApi\n\n    api = GitHubApi(\n        repository="owner/repo",\n        token="token",\n        api_url="https://api.github.test/",\n    )\n\n    assert api._url("") == "https://api.github.test/repos/owner/repo"\n    assert (\n        api._url("branches", {"page": "1"})\n        == "https://api.github.test/repos/owner/repo/branches?page=1"\n    )\n'''
              test_path.write_text(tests, encoding='utf-8')
          PY
          python3 -m compileall -q tools/branch_hygiene.py tests/tools/test_branch_hygiene.py
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/branch_hygiene.py tests/tools/test_branch_hygiene.py
          git commit -m 'fix: handle repository root API URL'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
