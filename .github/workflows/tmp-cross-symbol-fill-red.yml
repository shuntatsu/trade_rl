name: tmp cross-symbol fill valuation RED

on:
  push:
    branches:
      - fix/cross-symbol-fill-valuation
    paths:
      - .github/workflows/tmp-cross-symbol-fill-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 289d0ef7be67a36a790010adbd38680b0698a09f
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove cross-symbol valuation semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_stateful_execution.py
          uv run ruff format --check tests/simulation/test_stateful_execution.py
          set +e
          uv run pytest -q             tests/simulation/test_stateful_execution.py::test_later_symbol_fill_preserves_prior_symbol_fill_mark_for_margin             > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q "test_later_symbol_fill_preserves_prior_symbol_fill_mark_for_margin" "$RUNNER_TEMP/red.log"
          grep -q "AssertionError" "$RUNNER_TEMP/red.log"
          ! grep -Eq "ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError" "$RUNNER_TEMP/red.log"
          echo ISSUE667_CROSS_SYMBOL_FILL_VALUATION_RED=PASS
