name: Temporary dataset identity diagnostics

on:
  push:
    branches:
      - fix/m2-execution-economics-protocol

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Compare raw and built price bits
        shell: bash
        run: |
          set -euo pipefail
          lscpu | grep -E 'Model name|Vendor ID|Architecture' || true
          uv run python - <<'PY'
          import hashlib
          from datetime import datetime, timezone
          import numpy as np
          from trade_rl.data.build.builder import MarketDatasetBuilder
          from trade_rl.data.contracts import FeatureKind, FeatureSpec, InstrumentContract, MarketBuildConfig, NormalizationMode, VolumeUnit
          from trade_rl.data.source import InMemoryMarketDataSource, RawMarketSeries

          def sha(value):
              return hashlib.sha256(np.ascontiguousarray(value).tobytes(order="C")).hexdigest()

          n = 40
          timestamps = np.datetime64("2026-01-01T00:00:00", "ns") + np.arange(n) * np.timedelta64(1, "h")
          close = np.exp(np.arange(n, dtype=np.float64) * 0.002)
          open_price = np.concatenate([close[:1], close[:-1]])
          high = np.maximum(open_price, close) * 1.001
          low = np.minimum(open_price, close) * 0.999
          raw = RawMarketSeries(
              timestamps=timestamps,
              open=open_price,
              high=high,
              low=low,
              close=close,
              volume=100.0 + np.arange(n, dtype=np.float64),
              funding_rate=np.where(np.arange(n) % 8 == 0, 0.0001, 0.0),
              tradable=np.ones(n, dtype=np.bool_),
          )
          before = {name: sha(getattr(raw, name)) for name in ("open", "high", "low", "close")}
          print("RAW_BEFORE", before)
          print("RAW_CLOSE_HEX", [float(v).hex() for v in raw.close[:8]])
          config = MarketBuildConfig(
              base_timeframe="1h",
              features=(
                  FeatureSpec(name="ret_1", kind=FeatureKind.LOG_RETURN, lookback=1, normalization=NormalizationMode.NONE),
                  FeatureSpec(name="vol_12", kind=FeatureKind.REALIZED_VOLATILITY, lookback=12),
              ),
          )
          contract = InstrumentContract(
              symbol="BTCUSDT",
              listed_at=datetime(2026, 1, 1, tzinfo=timezone.utc),
              volume_unit=VolumeUnit.BASE_ASSET,
              tick_size=0.1,
              lot_size=0.001,
              minimum_notional=5.0,
          )
          dataset = MarketDatasetBuilder(config).build(InMemoryMarketDataSource({"BTCUSDT": raw}), (contract,))
          after = {name: sha(getattr(raw, name)) for name in ("open", "high", "low", "close")}
          built = {name: sha(dataset.resolved_array(name)) for name in ("open", "high", "low", "close")}
          print("RAW_AFTER", after)
          print("BUILT", built)
          print("SOURCE_MUTATED", before != after)
          print("BUILT_EQUALS_RAW", {name: built[name] == before[name] for name in before})
          print("DATASET_ID", dataset.dataset_id)
          PY
