name: tmp directional year endpoint RED

on:
  push:
    branches:
      - fix/directional-year-return-endpoint
    paths:
      - .github/workflows/tmp-directional-year-endpoint-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 68220830dd76b05ecf4249e17bbf8924fd5dee69
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove year-return endpoint semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/evaluation/test_directional.py
          uv run ruff format --check tests/evaluation/test_directional.py
          set +e
          uv run pytest -q             tests/evaluation/test_directional.py::test_year_returns_use_interval_end_timestamp             > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q "test_year_returns_use_interval_end_timestamp" "$RUNNER_TEMP/red.log"
          grep -q "AssertionError" "$RUNNER_TEMP/red.log"
          ! grep -Eq "ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError" "$RUNNER_TEMP/red.log"
          echo ISSUE667_DIRECTIONAL_YEAR_ENDPOINT_RED=PASS
