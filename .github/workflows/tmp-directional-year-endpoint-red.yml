name: tmp directional year format probe

on:
  push:
    branches:
      - fix/directional-year-return-endpoint
    paths:
      - .github/workflows/tmp-directional-year-endpoint-red.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43df7c0d52fe23dfa69964ea62c337b01900240f
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/evaluation/test_directional.py
          git diff -- tests/evaluation/test_directional.py
          test -z "$(git status --short -- tests/evaluation/test_directional.py)"
