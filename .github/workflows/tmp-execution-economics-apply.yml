name: Temporary execution economics implementation

on:
  push:
    branches:
      - fix/m2-execution-economics-protocol

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply canonical execution economics v2' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Apply bounded implementation patch
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          config = Path("trade_rl/evaluation/experiments/bootstrap/config.py")
          replace_once(
              config,
              "from trade_rl.artifacts.hashing import content_digest\n",
              "from trade_rl.artifacts.hashing import content_digest\n"
              "from trade_rl.data.economics import (\n"
              "    ExecutionEconomicsConfig,\n"
              "    parse_execution_economics,\n"
              ")\n",
          )
          replace_once(
              config,
              '_SCHEMA_VERSION = "canonical_m2_bootstrap_config_v1"\n',
              '_SCHEMA_VERSION = "canonical_m2_bootstrap_config_v1"\n'
              '_SCHEMA_VERSION_V2 = "canonical_m2_bootstrap_config_v2"\n',
          )
          replace_once(
              config,
              ")\n_BASELINE_FIELDS = (\n",
              ')\n_TOP_LEVEL_KEYS_V2 = _TOP_LEVEL_KEYS | {"execution_economics"}\n'
              "_BASELINE_FIELDS = (\n",
          )
          replace_once(
              config,
              "    bootstrap_seed: int\n"
              "    schema_version: str = _SCHEMA_VERSION\n",
              "    bootstrap_seed: int\n"
              "    execution_economics: ExecutionEconomicsConfig | None = None\n"
              "    schema_version: str = _SCHEMA_VERSION\n",
          )
          replace_once(
              config,
              "        if self.schema_version != _SCHEMA_VERSION:\n"
              "            raise ValueError(\"schema_version does not match canonical M2 contract\")\n",
              "        if self.schema_version not in {_SCHEMA_VERSION, _SCHEMA_VERSION_V2}:\n"
              "            raise ValueError(\"schema_version does not match canonical M2 contract\")\n"
              "        if (\n"
              "            self.schema_version == _SCHEMA_VERSION\n"
              "            and self.execution_economics is not None\n"
              "        ):\n"
              "            raise ValueError(\"execution_economics is not valid for bootstrap config v1\")\n"
              "        if (\n"
              "            self.schema_version == _SCHEMA_VERSION_V2\n"
              "            and self.execution_economics is None\n"
              "        ):\n"
              "            raise ValueError(\"execution_economics is required for bootstrap config v2\")\n"
              "        if self.execution_economics is not None and not isinstance(\n"
              "            self.execution_economics, ExecutionEconomicsConfig\n"
              "        ):\n"
              "            raise ValueError(\"execution_economics must be an ExecutionEconomicsConfig\")\n",
          )
          old_method = (
              "    def to_payload(self) -> dict[str, object]:\n"
              "        return {\n"
              '            "schema_version": self.schema_version,\n'
              '            "research_question": self.research_question,\n'
              '            "market": self.market.value,\n'
              '            "symbols": list(self.symbols),\n'
              '            "base_timeframe": self.base_timeframe,\n'
              '            "feature_timeframes": list(self.feature_timeframes),\n'
              '            "data_start": self.data_start.astimezone(UTC).isoformat(),\n'
              '            "data_stop_exclusive": self.data_stop_exclusive.astimezone(UTC).isoformat(),\n'
              '            "baseline": _baseline_payload(self.baseline),\n'
              '            "ppo_seeds": list(self.ppo_seeds),\n'
              '            "allowed_factors": [factor.value for factor in self.allowed_factors],\n'
              '            "max_experiments": self.max_experiments,\n'
              '            "n_bootstrap": self.n_bootstrap,\n'
              '            "bootstrap_seed": self.bootstrap_seed,\n'
              "        }\n"
          )
          new_method = (
              "    def to_payload(self) -> dict[str, object]:\n"
              "        payload: dict[str, object] = {\n"
              '            "schema_version": self.schema_version,\n'
              '            "research_question": self.research_question,\n'
              '            "market": self.market.value,\n'
              '            "symbols": list(self.symbols),\n'
              '            "base_timeframe": self.base_timeframe,\n'
              '            "feature_timeframes": list(self.feature_timeframes),\n'
              '            "data_start": self.data_start.astimezone(UTC).isoformat(),\n'
              '            "data_stop_exclusive": self.data_stop_exclusive.astimezone(UTC).isoformat(),\n'
              '            "baseline": _baseline_payload(self.baseline),\n'
              '            "ppo_seeds": list(self.ppo_seeds),\n'
              '            "allowed_factors": [factor.value for factor in self.allowed_factors],\n'
              '            "max_experiments": self.max_experiments,\n'
              '            "n_bootstrap": self.n_bootstrap,\n'
              '            "bootstrap_seed": self.bootstrap_seed,\n'
              "        }\n"
              "        if self.execution_economics is not None:\n"
              '            payload["execution_economics"] = (\n'
              "                self.execution_economics.canonical_payload()\n"
              "            )\n"
              "        return payload\n"
          )
          replace_once(config, old_method, new_method)
          replace_once(
              config,
              "def _parse_config(raw: Mapping[str, object]) -> CanonicalM2BootstrapConfig:\n"
              "    _expect_exact_keys(raw, _TOP_LEVEL_KEYS, field=\"bootstrap config\")\n"
              "    if raw.get(\"schema_version\") != _SCHEMA_VERSION:\n"
              "        raise ValueError(\"schema_version does not match canonical M2 contract\")\n\n",
              "def _parse_config(raw: Mapping[str, object]) -> CanonicalM2BootstrapConfig:\n"
              "    schema_version = _require_text(\n"
              "        raw.get(\"schema_version\"), field=\"schema_version\"\n"
              "    )\n"
              "    if schema_version == _SCHEMA_VERSION:\n"
              "        _expect_exact_keys(raw, _TOP_LEVEL_KEYS, field=\"bootstrap config\")\n"
              "        execution_economics = None\n"
              "    elif schema_version == _SCHEMA_VERSION_V2:\n"
              "        _expect_exact_keys(raw, _TOP_LEVEL_KEYS_V2, field=\"bootstrap config\")\n"
              "        execution_economics = parse_execution_economics(\n"
              "            raw[\"execution_economics\"]\n"
              "        )\n"
              "    else:\n"
              "        raise ValueError(\"schema_version does not match canonical M2 contract\")\n\n",
          )
          replace_once(
              config,
              "        bootstrap_seed=_int_value(raw.get(\"bootstrap_seed\"), field=\"bootstrap_seed\"),\n"
              "    )\n",
              "        bootstrap_seed=_int_value(raw.get(\"bootstrap_seed\"), field=\"bootstrap_seed\"),\n"
              "        execution_economics=execution_economics,\n"
              "        schema_version=schema_version,\n"
              "    )\n",
          )

          binance = Path("trade_rl/integrations/binance/dataset.py")
          replace_once(
              binance,
              "from trade_rl.data.market import MarketDataset\n",
              "from trade_rl.data.economics import ExecutionEconomicsConfig\n"
              "from trade_rl.data.market import MarketDataset\n",
          )
          replace_once(
              binance,
              "    metadata_evidence: Mapping[str, object] | None = None,\n"
              ") -> BinanceDatasetBuildResult:\n",
              "    metadata_evidence: Mapping[str, object] | None = None,\n"
              "    execution_economics: ExecutionEconomicsConfig | None = None,\n"
              ") -> BinanceDatasetBuildResult:\n",
          )
          replace_once(
              binance,
              "        identity_provenance=metadata_evidence,\n"
              "    )\n",
              "        identity_provenance=metadata_evidence,\n"
              "        execution_economics=execution_economics,\n"
              "    )\n",
          )

          workflow = Path("trade_rl/evaluation/experiments/bootstrap/workflow.py")
          text = workflow.read_text(encoding="utf-8")
          marker = "\n\ndef _validate_fit_scope(\n"
          helper = (
              "\n\ndef _validate_execution_economics(\n"
              "    config: CanonicalM2BootstrapConfig,\n"
              "    dataset: MarketDataset,\n"
              ") -> None:\n"
              "    expected = config.execution_economics\n"
              "    if expected is None:\n"
              "        return\n"
              "    expected_fields: tuple[tuple[str, object], ...] = (\n"
              '        ("fee_rate", expected.fee_rate),\n'
              '        ("maker_fee_rate", expected.maker_fee_rate),\n'
              '        ("taker_fee_rate", expected.taker_fee_rate),\n'
              '        ("spread_rate", expected.spread_rate),\n'
              '        ("max_participation_rate", expected.max_participation_rate),\n'
              '        ("borrow_rate", expected.borrow_rate),\n'
              "    )\n"
              "    for name, expected_value in expected_fields:\n"
              "        observed = np.asarray(dataset.resolved_array(name))\n"
              "        if not np.all(observed == expected_value):\n"
              "            raise ValueError(\n"
              '                f"published dataset execution economics differ for {name}"\n'
              "            )\n"
              '    active = np.asarray(dataset.resolved_array("symbol_active"), dtype=np.bool_)\n'
              '    borrow_available = np.asarray(dataset.resolved_array("borrow_available"))\n'
              "    expected_borrow_available = active & expected.borrow_available\n"
              "    if not np.array_equal(borrow_available, expected_borrow_available):\n"
              "        raise ValueError(\n"
              '            "published dataset execution economics differ for borrow_available"\n'
              "        )\n"
              '    identity = json.loads(dataset.identity_payload_json or "{}")\n'
              '    if identity.get("execution_economics") != expected.canonical_payload():\n'
              "        raise ValueError(\n"
              '            "published dataset execution economics identity differs from "\n'
              '            "bootstrap config"\n'
              "        )\n"
          )
          if text.count(marker) != 1:
              raise RuntimeError("workflow helper insertion marker mismatch")
          workflow.write_text(text.replace(marker, helper + "\n\ndef _validate_fit_scope(\n", 1), encoding="utf-8")
          replace_once(
              workflow,
              "    _validate_dataset_range(config, dataset)\n"
              "    resolved = resolve_candidate_run_spec(\n",
              "    _validate_dataset_range(config, dataset)\n"
              "    _validate_execution_economics(config, dataset)\n"
              "    resolved = resolve_candidate_run_spec(\n",
          )
          replace_once(
              workflow,
              "            feature_timeframes=config.feature_timeframes,\n"
              "            metadata_evidence=frozen.metadata_evidence,\n"
              "        )\n",
              "            feature_timeframes=config.feature_timeframes,\n"
              "            metadata_evidence=frozen.metadata_evidence,\n"
              "            execution_economics=config.execution_economics,\n"
              "        )\n",
          )
          PY
      - name: Compile patched sources
        run: >-
          uv run python -m py_compile
          trade_rl/evaluation/experiments/bootstrap/config.py
          trade_rl/evaluation/experiments/bootstrap/workflow.py
          trade_rl/integrations/binance/dataset.py
      - name: Format implementation
        run: >-
          uv run ruff format
          trade_rl/evaluation/experiments/bootstrap/config.py
          trade_rl/evaluation/experiments/bootstrap/workflow.py
          trade_rl/integrations/binance/dataset.py
      - name: Ruff targeted
        run: >-
          uv run ruff check
          trade_rl/data/economics.py
          trade_rl/data/build/config.py
          trade_rl/data/build/builder.py
          trade_rl/evaluation/experiments/bootstrap/config.py
          trade_rl/evaluation/experiments/bootstrap/workflow.py
          trade_rl/integrations/binance/dataset.py
          tests/data/test_execution_economics_build.py
          tests/evaluation/experiments/bootstrap/test_execution_economics_protocol.py
      - name: Targeted and adjacent tests
        run: >-
          uv run pytest -q
          tests/data/test_execution_economics_build.py
          tests/evaluation/experiments/bootstrap/test_execution_economics_protocol.py
          tests/evaluation/experiments/bootstrap/test_config.py
          tests/evaluation/experiments/bootstrap/test_workflow.py
          tests/integrations/test_binance.py
      - name: Commit implementation if verified
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add \
            trade_rl/evaluation/experiments/bootstrap/config.py \
            trade_rl/evaluation/experiments/bootstrap/workflow.py \
            trade_rl/integrations/binance/dataset.py
          git diff --cached --check
          git commit -m "feat: bind execution economics to canonical M2 bootstrap"
          git push origin HEAD:fix/m2-execution-economics-protocol
