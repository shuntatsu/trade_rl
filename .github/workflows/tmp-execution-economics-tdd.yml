name: Temporary execution economics TDD

on:
  push:
    branches:
      - fix/m2-execution-economics-protocol

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Format check
        run: uv run ruff format --check tests/data/test_execution_economics_build.py
      - name: Ruff
        run: uv run ruff check tests/data/test_execution_economics_build.py
      - name: Targeted pytest
        run: uv run pytest -q tests/data/test_execution_economics_build.py
