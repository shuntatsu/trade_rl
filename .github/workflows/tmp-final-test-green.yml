name: Temporary Final-Test GREEN Oracle

on:
  push:
    branches:
      - feature/final-test-authorization

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/final-test-authorization
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff format --check trade_rl/evaluation/final_test/workflow.py tests/evaluation/final_test/test_authorization.py
      - name: Run adversarial authorization tests
        run: uv run pytest -q tests/evaluation/final_test/test_authorization.py -k 'inside_frozen_study or concurrent_authorization'
