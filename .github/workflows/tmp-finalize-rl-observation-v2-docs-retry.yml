name: Temporary retry Observation v2 docs cleanup

on:
  push:
    branches:
      - feat/rl-observation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/rl-observation-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply durable docs with temporary workflows absent from oracle
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-finalize-rl-observation-v2-docs.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'observation-v2-docs-patch', 'exec'))
          PY
          rm docs/specs/2026-09-12-rl-observation-v2.md
          rm docs/plans/2026-09-12-rl-observation-v2.md
          rm .github/workflows/tmp-finalize-rl-observation-v2-docs.yml
          rm .github/workflows/tmp-finalize-rl-observation-v2-docs-retry.yml
          uv run pytest -q \
            tests/architecture/test_current_docs_layout.py \
            tests/architecture/test_candidate_run_docs_contract.py
          if grep -R '2026-09-12-rl-observation-v2' docs/README.md docs/architecture docs/research; then
            echo 'stale active Observation v2 doc reference remains' >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: freeze RL Observation v2 architecture'
          git push origin HEAD:feat/rl-observation-v2
