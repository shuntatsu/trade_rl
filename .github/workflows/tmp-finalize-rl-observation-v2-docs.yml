name: Temporary finalize RL Observation v2 docs

on:
  push:
    branches:
      - feat/rl-observation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/rl-observation-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Promote durable Observation v2 docs and remove active work docs
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard mismatch: {path}: count={count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          lean = 'docs/architecture/lean-core.md'
          old = '''同じLONG→LONGまたはSHORT→SHORTなら、価格変動でweightがdriftしただけを理由に毎decisionでtarget weightへ戻さない。標準は**quantity-preserving hold**であり、intentが変わった場合かhard riskがde-riskを要求する場合にquantityを変える。\n\n## StrategyとRiskの責任分離\n'''
          new = '''同じLONG→LONGまたはSHORT→SHORTなら、価格変動でweightがdriftしただけを理由に毎decisionでtarget weightへ戻さない。標準は**quantity-preserving hold**であり、intentが変わった場合かhard riskがde-riskを要求する場合にquantityを変える。\n\n### PPO Observation v2\n\n初回canonical real-data M2で使うteacher-free PPOのpolicy observationは、fit-scope leakageを避けるため最小のcausal contractへ固定する。tensor順序は次である。\n\n1. selected local feature values\n2. selected local availability / finite mask\n3. selected normalized local feature staleness\n4. current intent\n5. current weight\n\nunavailableまたはnon-finiteなlocal valueは0へmaskする。stalenessはselected featureと同じ順序で`[0, 1]`の正規化値を渡し、unavailable featureは最大stalenessでなければならない。PPO v2はstalenessが欠けたobservationをfail-closedにする。一方、`StrategyObservation`はPPO専用型ではないため、既存のrule/forecast/control caller向けconstructor互換を維持し、generic contractではstaleness省略を許す。canonical replayとPPO environmentは実datasetのstalenessを明示的に渡す。\n\n初回M2のpolicy tensorにはsymbol IDを入れず、dataset-global featureも入れない。現行`MarketDatasetBuilder`の`active_fraction`、`tradable_fraction`、`market_return_mean`、`market_return_dispersion`はdataset全symbol universeから集計されるため、fit symbol subsetだけでPPOを学習するStudyで使うとfit-scope外symbolがtraining observationへ間接混入し得る。このためObservation v2のglobal rosterは明示的な空集合である。global regimeを将来試す場合は、fit-scope外evaluation symbolを含まないreference universeを事前固定した別Controlled Factorとして扱う。\n\nObservation contractは暗黙のimplementation detailにしない。新規Candidate Runと新規Studyのresolved configはObservation schema、staleness利用、空のglobal rosterをsemantic identityへbindする。execution economics、reward、action、risk、PPO network architectureはObservation v2のpolicy inputへ追加しない。\n\n## StrategyとRiskの責任分離\n'''
          replace_once(lean, old, new)

          controlled = 'docs/architecture/controlled-experiment-loop.md'
          old = '''Study作成時にRun Coreの共通resolverでbaseline configを事前解決する。独自のfeature/symbol/timestamp resolverをexperiments層に作らない。\n\n## Study-owned EvidenceSet\n'''
          new = '''Study作成時にRun Coreの共通resolverでbaseline configを事前解決する。独自のfeature/symbol/timestamp resolverをexperiments層に作らない。\n\n現在の新規Studyでは`ResolvedRunConfig.from_candidate_spec()`が`resolved_run_config_v2`を生成し、PPO Observation schemaとglobal policy rosterをbaseline semantic configへbindする。初回M2のglobal rosterは意図的に空である。`schema_version`、`ppo_observation_schema`、`ppo_global_feature_names`はStudy-fixed resolved fieldであり、Controlled Factorとして変更できない。同一Studyの途中でObservation contractを変えない。\n\nhistorical `resolved_run_config_v1` / Study artifactはread/inspection互換のため維持するが、current v2 Runをv1 Studyへ継ぎ足すことは許さない。EvidenceSet生成は実行前のfixed-field照合でv1/v2混在をfail-closedにする。旧Studyを新Observationへ暗黙migrationせず、新しいObservation contractで研究を続ける場合は新Studyを作る。\n\n## Study-owned EvidenceSet\n'''
          replace_once(controlled, old, new)

          research = 'docs/research/current-status.md'
          replace_once(research, '更新基準: 2026-09-10 (JST)', '更新基準: 2026-09-12 (JST)')
          old = '''### PPO\n\nPPO観測はselected feature、feature availability、current intent、current weightを中心とし、symbol IDを含めない。Training episodeはfit symbolをround-robinし、各episodeは一つのactive symbolだけを扱う。\n'''
          new = '''### PPO\n\n初回real-data M2のPPO Observation v2は、selected local feature values、availability / finite mask、normalized local staleness、current intent、current weightだけをこの順序で使う。symbol IDは含めない。Training episodeはfit symbolをround-robinし、各episodeは一つのactive symbolだけを扱う。\n\n現行datasetのglobal regimeは全dataset symbolから集計されるため、fit-symbol subset外の情報がtrainingへ混入しないよう初回M2のpolicy inputから除外した。Observation v2は空のglobal rosterをidentityへ明示bindする。global contextは、fit-scope-safeなreference universeを事前固定できる場合にだけ別Controlled Factorとして検証する。\n'''
          replace_once(research, old, new)
          old = '''- symbol-ID-free PPO\n- 全symbol独立comparison\n'''
          new = '''- symbol-ID-free PPO\n- fit-scope-safe PPO Observation v2（local values + availability/finite mask + normalized staleness + portfolio state、global policy rosterは空）\n- `lean_candidate_result_v2`によるObservation contractのRun evidence bindingとhistorical v1 reader互換\n- `resolved_run_config_v2`によるStudy identity binding、historical v1 read互換、v1 Studyへのv2 mutation拒否\n- 全symbol独立comparison\n'''
          replace_once(research, old, new)

          readme = 'docs/README.md'
          old = '''現在Activeなspec:\n\n- [`specs/2026-09-12-rl-observation-v2.md`](specs/2026-09-12-rl-observation-v2.md) — real-data M2前にfreezeするteacher-free PPO Observation v2契約\n\n現在Activeなplan:\n\n- [`plans/2026-09-12-rl-observation-v2.md`](plans/2026-09-12-rl-observation-v2.md) — Observation v2のTDD、artifact/Study identity互換、falsification、final verification計画\n'''
          new = '''現在Activeなspecはない。\n\n現在Activeなplanはない。\n'''
          replace_once(readme, old, new)
          PY
          rm docs/specs/2026-09-12-rl-observation-v2.md
          rm docs/plans/2026-09-12-rl-observation-v2.md
          uv run pytest -q \
            tests/architecture/test_current_docs_layout.py \
            tests/architecture/test_candidate_run_docs_contract.py
          if grep -R '2026-09-12-rl-observation-v2' docs/README.md docs/architecture docs/research; then
            echo 'stale active Observation v2 doc reference remains' >&2
            exit 1
          fi
          rm .github/workflows/tmp-finalize-rl-observation-v2-docs.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: freeze RL Observation v2 architecture'
          git push origin HEAD:feat/rl-observation-v2
