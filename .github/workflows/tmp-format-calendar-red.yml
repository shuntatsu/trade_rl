name: Temporary Calendar RED Formatter

on:
  push:
    branches:
      - refactor/data-calendar-kind-authority

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Format and print test
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format tests/architecture/test_data_calendar_authority.py
          echo '---BEGIN FORMATTED FILE---'
          cat tests/architecture/test_data_calendar_authority.py
          echo '---END FORMATTED FILE---'
