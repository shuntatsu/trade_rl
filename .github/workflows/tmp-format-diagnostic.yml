name: Temporary format diagnostic

on:
  push:
    branches:
      - research/issue677-ppo-normalization-prereg-current

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Show Ruff format diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/evaluation/test_ppo_normalization_replication.py
          git diff -- tests/evaluation/test_ppo_normalization_replication.py
