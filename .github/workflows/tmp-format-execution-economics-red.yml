name: Temporary format execution economics RED

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/canonical-m2-execution-economics
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Format test and retire helper
        shell: bash
        run: |
          set -euo pipefail
          base=7bf48fc60c355eac115953c446cd73e5c8d59c33
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git diff --name-only "$base"..HEAD)" = ".github/workflows/tmp-format-execution-economics-red.yml"
          uv sync --extra dev
          uv run ruff format tests/data/test_execution_economics_profile.py
          rm .github/workflows/tmp-format-execution-economics-red.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: apply repository formatter to execution economics RED"
          git push origin HEAD:fix/canonical-m2-execution-economics
