name: Temporary Final-Test Test Format

on:
  push:
    branches:
      - feature/final-test-authorization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/final-test-authorization
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff format tests/evaluation/final_test/test_authorization.py
      - name: Commit formatter output only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/evaluation/final_test/test_authorization.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format final-test adversarial test'
            git push origin HEAD:feature/final-test-authorization
          fi
