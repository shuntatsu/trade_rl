name: Temporary Final-Test Ruff Format

on:
  push:
    branches:
      - feature/final-test-authorization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/final-test-authorization
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - name: Install
        run: uv sync --extra dev
      - name: Format final-test files
        run: uv run ruff format trade_rl/evaluation/final_test/contracts.py trade_rl/evaluation/final_test/workflow.py
      - name: Commit formatter output only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/evaluation/final_test/contracts.py trade_rl/evaluation/final_test/workflow.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Ruff formatting to final-test gate'
            git push origin HEAD:feature/final-test-authorization
          fi
