name: tmp format Issue 640 official audit

on:
  push:
    branches:
      - verify/issue640-audit-format-v1
    paths:
      - .github/workflows/tmp-format-issue640-official-audit.yml

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ae095e74e92d2ac9d83de229f6e55884e6e3ac48
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format .github/scripts/issue640_official_audit.py
          git diff -- .github/scripts/issue640_official_audit.py
