name: Temporary Format Probe

on:
  push:
    branches:
      - fix/session-gap-carry-timing

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/simulation/test_session_carry.py
          git diff -- tests/simulation/test_session_carry.py
          test -z "$(git status --short -- tests/simulation/test_session_carry.py)"
