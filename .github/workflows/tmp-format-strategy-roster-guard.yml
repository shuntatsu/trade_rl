name: Temporary format strategy roster guard

on:
  push:
    branches:
      - refactor/experiment-strategy-roster-authority

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/experiment-strategy-roster-authority
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Format, verify, and retire helper
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format tests/architecture/test_experiment_strategy_roster_authority.py
          uv run ruff check tests/architecture/test_experiment_strategy_roster_authority.py
          uv run pytest -q tests/architecture/test_experiment_strategy_roster_authority.py tests/evaluation/test_candidate_suite.py
          rm .github/workflows/tmp-format-strategy-roster-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/architecture/test_experiment_strategy_roster_authority.py .github/workflows/tmp-format-strategy-roster-guard.yml
          git diff --cached --check
          git commit -m "test: format strategy roster dependency guard"
          git push origin HEAD:refactor/experiment-strategy-roster-authority
