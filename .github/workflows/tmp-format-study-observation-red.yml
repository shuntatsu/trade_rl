name: Temporary format Study Observation v2 RED

on:
  push:
    branches:
      - feat/rl-observation-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/rl-observation-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Format RED test only
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format tests/evaluation/experiments/test_observation_contract_identity.py
          uv run ruff check tests/evaluation/experiments/test_observation_contract_identity.py
          rm .github/workflows/tmp-format-study-observation-red.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: format Study Observation v2 RED"
          git push origin HEAD:feat/rl-observation-v2
