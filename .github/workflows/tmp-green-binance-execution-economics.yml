name: Temporary Binance execution economics GREEN

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: apply Binance execution economics GREEN' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-green-binance-execution-economics.yml
          test "$(git diff --name-only HEAD^ HEAD)" = "$helper"
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/binance/dataset.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one replacement, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "from trade_rl.data.build.builder import MarketDatasetBuilder\n",
              "from trade_rl.data.build.builder import MarketDatasetBuilder\n"
              "from trade_rl.data.build.economics import ExecutionEconomicsProfile\n",
          )
          replace_once(
              "    metadata_evidence: Mapping[str, object] | None = None,\n"
              ") -> BinanceDatasetBuildResult:\n",
              "    metadata_evidence: Mapping[str, object] | None = None,\n"
              "    execution_economics: ExecutionEconomicsProfile | None = None,\n"
              ") -> BinanceDatasetBuildResult:\n",
          )
          replace_once(
              "        identity_provenance=metadata_evidence,\n"
              "    )\n",
              "        identity_provenance=metadata_evidence,\n"
              "        execution_economics=execution_economics,\n"
              "    )\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm "$helper"
          uv run ruff format trade_rl/integrations/binance/dataset.py
          uv run ruff check trade_rl/integrations/binance/dataset.py tests/integrations/test_binance.py tests/integrations/test_binance_execution_economics.py tests/data/test_execution_economics_artifact_executor.py
          uv run mypy trade_rl/integrations/binance/dataset.py
          uv run pytest -q tests/integrations/test_binance.py tests/integrations/test_binance_execution_economics.py tests/data/test_execution_economics_artifact_executor.py
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$helper" trade_rl/integrations/binance/dataset.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: pass execution economics through Binance build"
          git push origin HEAD:fix/canonical-m2-execution-economics
