name: Temporary apply bootstrap economics closure GREEN

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: apply bootstrap economics closure green' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-green-bootstrap-economics-closure.yml
          test "$(git diff --name-only HEAD^ HEAD)" = "$helper"
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/workflow.py")
          text = path.read_text(encoding="utf-8")
          marker = '''\ndef _validate_fit_scope(\n    dataset: MarketDataset,\n    spec: ResolvedCandidateRunSpec,\n) -> None:\n'''
          helper_code = '''\ndef _validate_execution_economics(\n    config: CanonicalM2BootstrapConfig,\n    dataset: MarketDataset,\n) -> None:\n    profile = config.execution_economics\n    if profile is None:\n        return\n\n    shape = (dataset.n_bars, dataset.n_symbols)\n    scalar_fields = (\n        ("fee_rate", profile.fee_rate),\n        ("maker_fee_rate", profile.maker_fee_rate),\n        ("taker_fee_rate", profile.taker_fee_rate),\n        ("spread_rate", profile.spread_rate),\n        ("max_participation_rate", profile.max_participation_rate),\n        ("borrow_rate", profile.borrow_rate),\n    )\n    for field, value in scalar_fields:\n        expected = np.full(shape, value, dtype=np.float64)\n        if not np.array_equal(dataset.resolved_array(field), expected):\n            raise ValueError(f"dataset execution economics {field} differs from bootstrap config")\n\n    active = dataset.resolved_array("symbol_active")\n    expected_borrow = (\n        active\n        if profile.borrow_available\n        else np.zeros(shape, dtype=np.bool_)\n    )\n    if not np.array_equal(\n        dataset.resolved_array("borrow_available"),\n        expected_borrow,\n    ):\n        raise ValueError(\n            "dataset execution economics borrow_available differs from bootstrap config"\n        )\n\n    identity = json.loads(dataset.identity_payload_json or "{}")\n    if identity.get("execution_economics") != profile.to_payload():\n        raise ValueError(\n            "dataset execution economics identity differs from bootstrap config"\n        )\n\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper_code + marker, 1)
          old_call = '''    _validate_dataset_range(config, dataset)\n    resolved = resolve_candidate_run_spec(\n'''
          new_call = '''    _validate_dataset_range(config, dataset)\n    _validate_execution_economics(config, dataset)\n    resolved = resolve_candidate_run_spec(\n'''
          assert text.count(old_call) == 1
          path.write_text(text.replace(old_call, new_call, 1), encoding="utf-8")
          PY
          rm "$helper"
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/workflow.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap tests/evaluation/experiments/bootstrap
          uv run mypy trade_rl/evaluation/experiments/bootstrap
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_execution_economics_config.py \
            tests/evaluation/experiments/bootstrap/test_execution_economics_workflow.py \
            tests/evaluation/experiments/bootstrap
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$helper" trade_rl/evaluation/experiments/bootstrap/workflow.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: validate bootstrap dataset execution economics"
          git push origin HEAD:fix/canonical-m2-execution-economics
