name: Temporary bootstrap economics validation GREEN

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-green-bootstrap-economics-validation.yml
          test "$(git diff --name-only HEAD^ HEAD)" = "$helper"
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/workflow.py")
          text = path.read_text(encoding="utf-8")

          marker = '''def _validate_fit_scope(
              dataset: MarketDataset,
              spec: ResolvedCandidateRunSpec,
          ) -> None:
          '''
          helper = '''def _validate_execution_economics(
              config: CanonicalM2BootstrapConfig,
              dataset: MarketDataset,
          ) -> None:
              expected = config.execution_economics
              if expected is None:
                  return

              try:
                  identity = json.loads(dataset.identity_payload_json or "")
              except (TypeError, json.JSONDecodeError) as error:
                  raise ValueError(
                      "dataset execution economics identity is invalid"
                  ) from error
              if not isinstance(identity, dict) or identity.get(
                  "execution_economics"
              ) != expected.to_payload():
                  raise ValueError(
                      "dataset execution economics identity differs from bootstrap config"
                  )

              expected_arrays: tuple[tuple[str, float | bool], ...] = (
                  ("fee_rate", expected.fee_rate),
                  ("maker_fee_rate", expected.maker_fee_rate),
                  ("taker_fee_rate", expected.taker_fee_rate),
                  ("spread_rate", expected.spread_rate),
                  ("max_participation_rate", expected.max_participation_rate),
                  ("borrow_available", expected.borrow_available),
                  ("borrow_rate", expected.borrow_rate),
              )
              for field_name, expected_value in expected_arrays:
                  observed = dataset.resolved_array(field_name)
                  if not bool(np.all(observed == expected_value)):
                      raise ValueError(
                          f"dataset execution economics {field_name} differs from bootstrap config"
                      )


          def _validate_fit_scope(
              dataset: MarketDataset,
              spec: ResolvedCandidateRunSpec,
          ) -> None:
          '''
          if text.count(marker) != 1:
              raise RuntimeError("fit-scope insertion marker changed")
          text = text.replace(marker, helper, 1)

          old = '''    dataset = load_market_dataset_artifact(dataset_root)
              artifact = inspect_published_market_dataset_artifact(dataset_root)
          '''
          new = '''    dataset = load_market_dataset_artifact(dataset_root)
              _validate_execution_economics(config, dataset)
              artifact = inspect_published_market_dataset_artifact(dataset_root)
          '''
          if text.count(old) != 1:
              raise RuntimeError("study validation marker changed")
          text = text.replace(old, new, 1)

          old = '''        sources = frozenset(build.sources_used)
          '''
          new = '''        _validate_execution_economics(config, build.dataset)
              sources = frozenset(build.sources_used)
          '''
          if text.count(old) != 1:
              raise RuntimeError("build validation marker changed")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          rm "$helper"
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/workflow.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap tests/evaluation/experiments/bootstrap tests/data/test_execution_economics_artifact_executor.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/workflow.py
          uv run pytest -q tests/evaluation/experiments/bootstrap tests/data/test_execution_economics_artifact_executor.py
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$helper" trade_rl/evaluation/experiments/bootstrap/workflow.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: validate bootstrap dataset execution economics"
          git push origin HEAD:fix/canonical-m2-execution-economics
