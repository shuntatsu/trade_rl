name: Temporary apply bootstrap economics GREEN

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: apply bootstrap economics workflow green' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-green-bootstrap-economics.yml
          test "$(git diff --name-only HEAD^ HEAD)" = "$helper"
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/workflow.py")
          text = path.read_text(encoding="utf-8")
          old = '''            feature_timeframes=config.feature_timeframes,\n            metadata_evidence=frozen.metadata_evidence,\n        )\n'''
          new = '''            feature_timeframes=config.feature_timeframes,\n            metadata_evidence=frozen.metadata_evidence,\n            execution_economics=config.execution_economics,\n        )\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm "$helper"
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/workflow.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap tests/evaluation/experiments/bootstrap
          uv run mypy trade_rl/evaluation/experiments/bootstrap
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_execution_economics_config.py \
            tests/evaluation/experiments/bootstrap/test_execution_economics_workflow.py \
            tests/evaluation/experiments/bootstrap
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$helper" trade_rl/evaluation/experiments/bootstrap/workflow.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: pass bootstrap execution economics into Binance build"
          git push origin HEAD:fix/canonical-m2-execution-economics
