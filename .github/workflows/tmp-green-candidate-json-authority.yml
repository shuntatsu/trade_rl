name: Temporary Candidate JSON Authority GREEN

on:
  push:
    branches:
      - refactor/candidate-run-json-authority

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/candidate-run-json-authority
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact RED parent
        shell: bash
        run: |
          set -euo pipefail
          RED_HEAD=7ec2c72f6a59c90e00c62f13ddc328398b332b18
          test "$(git rev-parse HEAD^)" = "$RED_HEAD"
          test "$(git diff --name-only "$RED_HEAD"..HEAD)" = ".github/workflows/tmp-green-candidate-json-authority.yml"
      - name: Apply exact authority replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_config = Path("trade_rl/evaluation/runs/config.py")
          text = run_config.read_text(encoding="utf-8")

          allowed_block = '''_ALLOWED_CONFIG_KEYS = frozenset(
              {
                  "signal_name",
                  "feature_names",
                  "fit_symbol_names",
                  "fit_cutoff",
                  "evaluation_start",
                  "evaluation_stop_exclusive",
                  "rule_entry_threshold",
                  "rule_exit_threshold",
                  "forecast_entry_threshold",
                  "forecast_exit_threshold",
                  "ppo_total_timesteps",
                  "ppo_seed",
                  "gross_budget",
                  "initial_capital",
              }
          )


          '''
          replacements = [
              ("from typing import cast\n", "from typing import ClassVar, cast\n"),
              (allowed_block, ""),
              (
                  '''class CandidateRunConfig:
              """Raw semantic configuration for one candidate-suite run."""

              signal_name: str
          ''',
                  '''class CandidateRunConfig:
              """Raw semantic configuration for one candidate-suite run."""

              JSON_FIELDS: ClassVar[tuple[str, ...]] = (
                  "signal_name",
                  "feature_names",
                  "fit_symbol_names",
                  "fit_cutoff",
                  "evaluation_start",
                  "evaluation_stop_exclusive",
                  "rule_entry_threshold",
                  "rule_exit_threshold",
                  "forecast_entry_threshold",
                  "forecast_exit_threshold",
                  "ppo_total_timesteps",
                  "ppo_seed",
                  "gross_budget",
                  "initial_capital",
              )

              signal_name: str
          ''',
              ),
              (
                  '''        object.__setattr__(self, "gross_budget", gross_budget)
              object.__setattr__(self, "initial_capital", initial_capital)


          @dataclass(frozen=True, slots=True)
          class ResolvedCandidateRunSpec:
          ''',
                  '''        object.__setattr__(self, "gross_budget", gross_budget)
              object.__setattr__(self, "initial_capital", initial_capital)

              def to_json_payload(self) -> dict[str, object]:
                  """Return the normalized raw candidate-run JSON contract."""

                  payload: dict[str, object] = {}
                  for name in self.JSON_FIELDS:
                      value = getattr(self, name)
                      if isinstance(value, np.datetime64):
                          payload[name] = str(np.datetime64(value, "ns"))
                      elif isinstance(value, tuple):
                          payload[name] = list(value)
                      else:
                          payload[name] = value
                  return payload


          @dataclass(frozen=True, slots=True)
          class ResolvedCandidateRunSpec:
          ''',
              ),
              (
                  "unknown = sorted(set(raw) - _ALLOWED_CONFIG_KEYS)",
                  "unknown = sorted(set(raw) - set(CandidateRunConfig.JSON_FIELDS))",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"run config replacement count != 1 for {old!r}")
              text = text.replace(old, new)
          run_config.write_text(text, encoding="utf-8")

          bootstrap = Path("trade_rl/evaluation/experiments/bootstrap/config.py")
          text = bootstrap.read_text(encoding="utf-8")
          baseline_keys = '''_BASELINE_KEYS = frozenset(
              {
                  "signal_name",
                  "feature_names",
                  "fit_symbol_names",
                  "fit_cutoff",
                  "evaluation_start",
                  "evaluation_stop_exclusive",
                  "rule_entry_threshold",
                  "rule_exit_threshold",
                  "forecast_entry_threshold",
                  "forecast_exit_threshold",
                  "ppo_total_timesteps",
                  "gross_budget",
                  "initial_capital",
              }
          )
          '''
          baseline_fields = '''_BASELINE_FIELDS = (
              "signal_name",
              "feature_names",
              "fit_symbol_names",
              "fit_cutoff",
              "evaluation_start",
              "evaluation_stop_exclusive",
              "rule_entry_threshold",
              "rule_exit_threshold",
              "forecast_entry_threshold",
              "forecast_exit_threshold",
              "ppo_total_timesteps",
              "gross_budget",
              "initial_capital",
          )
          '''
          old_payload = '''def _baseline_payload(config: CandidateRunConfig) -> dict[str, object]:
              return {
                  "signal_name": config.signal_name,
                  "feature_names": list(config.feature_names),
                  "fit_symbol_names": list(config.fit_symbol_names),
                  "fit_cutoff": str(np.datetime64(config.fit_cutoff, "ns")),
                  "evaluation_start": str(np.datetime64(config.evaluation_start, "ns")),
                  "evaluation_stop_exclusive": str(
                      np.datetime64(config.evaluation_stop_exclusive, "ns")
                  ),
                  "rule_entry_threshold": config.rule_entry_threshold,
                  "rule_exit_threshold": config.rule_exit_threshold,
                  "forecast_entry_threshold": config.forecast_entry_threshold,
                  "forecast_exit_threshold": config.forecast_exit_threshold,
                  "ppo_total_timesteps": config.ppo_total_timesteps,
                  "gross_budget": config.gross_budget,
                  "initial_capital": config.initial_capital,
              }
          '''
          new_payload = '''def _baseline_payload(config: CandidateRunConfig) -> dict[str, object]:
              candidate_payload = config.to_json_payload()
              return {field: candidate_payload[field] for field in _BASELINE_FIELDS}
          '''
          replacements = [
              (baseline_keys, baseline_fields),
              (old_payload, new_payload),
              (
                  '_expect_exact_keys(baseline_raw, _BASELINE_KEYS, field="baseline")',
                  '_expect_exact_keys(\n        baseline_raw, frozenset(_BASELINE_FIELDS), field="baseline"\n    )',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"bootstrap replacement count != 1 for {old!r}")
              text = text.replace(old, new)
          bootstrap.write_text(text, encoding="utf-8")
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format changed production files
        run: uv run ruff format trade_rl/evaluation/runs/config.py trade_rl/evaluation/experiments/bootstrap/config.py
      - name: Focused tests
        run: >-
          uv run pytest -q
          tests/architecture/test_candidate_run_json_authority.py
          tests/evaluation/test_candidate_run_config.py
          tests/evaluation/experiments/bootstrap/test_config.py
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check trade_rl/evaluation/runs/config.py trade_rl/evaluation/experiments/bootstrap/config.py tests/architecture/test_candidate_run_json_authority.py
          uv run ruff format --check trade_rl/evaluation/runs/config.py trade_rl/evaluation/experiments/bootstrap/config.py tests/architecture/test_candidate_run_json_authority.py
          uv run mypy trade_rl/evaluation/runs/config.py trade_rl/evaluation/experiments/bootstrap/config.py
          git diff --check
      - name: Commit verified durable tree and remove helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-green-candidate-json-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/runs/config.py trade_rl/evaluation/experiments/bootstrap/config.py .github/workflows/tmp-green-candidate-json-authority.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "refactor: centralize candidate run JSON authority"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refactor/candidate-run-json-authority"
