name: Temporary apply verified execution economics builder GREEN

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: apply verified execution economics builder green' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Patch, verify, commit, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/tmp-green-execution-economics-builder-v2.yml
          test "$(git diff --name-only HEAD^ HEAD)" = "$helper"
          uv sync --extra dev
          uv run python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          config = Path("trade_rl/data/build/config.py")
          replace_once(
              config,
              "from trade_rl.data.contracts import (\n",
              "from trade_rl.data.build.economics import ExecutionEconomicsProfile\n"
              "from trade_rl.data.contracts import (\n",
          )
          replace_once(
              config,
              "        *MarketBuildConfig.JSON_FIELDS,\n"
              '        "instruments",\n'
              "    )\n\n"
              "    source_root: Path\n"
              "    config: MarketBuildConfig\n"
              "    instruments: tuple[InstrumentContract, ...]\n",
              "        *MarketBuildConfig.JSON_FIELDS,\n"
              '        "instruments",\n'
              '        "execution_economics",\n'
              "    )\n\n"
              "    source_root: Path\n"
              "    config: MarketBuildConfig\n"
              "    instruments: tuple[InstrumentContract, ...]\n"
              "    execution_economics: ExecutionEconomicsProfile | None = None\n",
          )
          replace_once(
              config,
              "    source_root = Path(\n"
              '        _string(root.get("source_root"), field="source_root")\n'
              "    ).expanduser()\n",
              '    raw_execution_economics = root.get("execution_economics")\n'
              "    execution_economics = (\n"
              "        None\n"
              "        if raw_execution_economics is None\n"
              "        else ExecutionEconomicsProfile.from_payload(\n"
              "            raw_execution_economics,\n"
              '            field="execution_economics",\n'
              "        )\n"
              "    )\n"
              "    source_root = Path(\n"
              '        _string(root.get("source_root"), field="source_root")\n'
              "    ).expanduser()\n",
          )
          replace_once(
              config,
              "        ),\n"
              "        instruments=instruments,\n"
              "    )\n",
              "        ),\n"
              "        instruments=instruments,\n"
              "        execution_economics=execution_economics,\n"
              "    )\n",
          )

          builder = Path("trade_rl/data/build/builder.py")
          replace_once(
              builder,
              "from trade_rl.artifacts.hashing import content_digest\n",
              "from trade_rl.artifacts.hashing import content_digest\n"
              "from trade_rl.data.build.economics import ExecutionEconomicsProfile\n",
          )
          replace_once(
              builder,
              "        *,\n"
              "        identity_provenance: Mapping[str, object] | None = None,\n"
              "    ) -> MarketDataset:\n",
              "        *,\n"
              "        identity_provenance: Mapping[str, object] | None = None,\n"
              "        execution_economics: ExecutionEconomicsProfile | None = None,\n"
              "    ) -> MarketDataset:\n",
          )
          old_economics = (
              "        economics = build_market_economic_semantics(\n"
              "            timestamps=timestamps,\n"
              "            instruments=instruments,\n"
              "            row_present=row_present,\n"
              "            raw_tradable=raw_tradable,\n"
              "            source_information_available=information_available,\n"
              "            available_at=available_at,\n"
              "            close=close,\n"
              "            funding_event_count=funding_event_count,\n"
              "        )\n"
          )
          new_economics = (
              "        if execution_economics is None:\n"
              "            economics = build_market_economic_semantics(\n"
              "                timestamps=timestamps,\n"
              "                instruments=instruments,\n"
              "                row_present=row_present,\n"
              "                raw_tradable=raw_tradable,\n"
              "                source_information_available=information_available,\n"
              "                available_at=available_at,\n"
              "                close=close,\n"
              "                funding_event_count=funding_event_count,\n"
              "            )\n"
              "        else:\n"
              "            economics = build_market_economic_semantics(\n"
              "                timestamps=timestamps,\n"
              "                instruments=instruments,\n"
              "                row_present=row_present,\n"
              "                raw_tradable=raw_tradable,\n"
              "                source_information_available=information_available,\n"
              "                available_at=available_at,\n"
              "                close=close,\n"
              "                funding_event_count=funding_event_count,\n"
              "                fee_rate=execution_economics.fee_rate,\n"
              "                maker_fee_rate=execution_economics.maker_fee_rate,\n"
              "                taker_fee_rate=execution_economics.taker_fee_rate,\n"
              "                spread_rate=execution_economics.spread_rate,\n"
              "                max_participation_rate=(\n"
              "                    execution_economics.max_participation_rate\n"
              "                ),\n"
              "                borrow_available=execution_economics.borrow_available,\n"
              "                borrow_rate=execution_economics.borrow_rate,\n"
              "            )\n"
          )
          replace_once(builder, old_economics, new_economics)
          replace_once(
              builder,
              "        if identity_provenance is not None:\n"
              '            metadata["metadata_evidence"] = identity_provenance\n',
              "        if identity_provenance is not None:\n"
              '            metadata["metadata_evidence"] = identity_provenance\n'
              "        if execution_economics is not None:\n"
              '            metadata["execution_economics"] = execution_economics.to_payload()\n',
          )
          PY
          rm "$helper"
          uv run ruff format trade_rl/data/build/config.py trade_rl/data/build/builder.py
          uv run ruff check trade_rl/data/build tests/data/test_execution_economics_profile.py tests/data/test_market_build_config_session.py tests/data/test_market_builder.py tests/architecture/test_market_build_json_authority.py tests/architecture/test_current_docs_layout.py
          uv run mypy trade_rl/data/build
          uv run pytest -q tests/data/test_execution_economics_profile.py tests/data/test_market_build_config_session.py tests/data/test_market_builder.py tests/architecture/test_market_build_json_authority.py tests/architecture/test_current_docs_layout.py tests/data/test_economic_semantics.py tests/data/test_market_artifact.py
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$helper" trade_rl/data/build/builder.py trade_rl/data/build/config.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: bind execution economics into market builds"
          git push origin HEAD:fix/canonical-m2-execution-economics
