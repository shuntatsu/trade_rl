name: Temporary Guide Markdown lockfile generator

on:
  push:
    branches:
      - guide/markdown-first-redesign
    paths:
      - .github/workflows/tmp-guide-markdown-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: guide/markdown-first-redesign
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0

      - name: Generate exact lockfile
        working-directory: guide
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff -- guide/package.json)"
          git add guide/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh Guide Markdown lockfile"
          git push origin HEAD:guide/markdown-first-redesign
