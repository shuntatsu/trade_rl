name: tmp hard-cap turnover RED

on:
  push:
    branches:
      - fix/hard-cap-turnover-convergence
    paths:
      - .github/workflows/tmp-hard-cap-turnover-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a17b760fcbb9f505d36c70b71edf9ee6cbf2f5b9
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove combined hard-cap turnover semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check             tests/evaluation/test_single_symbol_replay.py             tests/evaluation/test_shared_cash_replay.py             tests/strategies/test_ppo_intent.py
          uv run ruff format --check             tests/evaluation/test_single_symbol_replay.py             tests/evaluation/test_shared_cash_replay.py             tests/strategies/test_ppo_intent.py
          set +e
          uv run pytest -q             tests/evaluation/test_single_symbol_replay.py::test_reversal_keeps_short_proposal_after_hard_override             tests/evaluation/test_shared_cash_replay.py::test_shared_reversal_preserves_proposal_through_hard_turnover_override             tests/strategies/test_ppo_intent.py::test_ppo_reversal_preserves_short_proposal_through_hard_override             > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q "3 failed" "$RUNNER_TEMP/red.log"
          ! grep -Eq "ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError" "$RUNNER_TEMP/red.log"
          echo ISSUE667_HARD_CAP_TURNOVER_RED=PASS
