name: Temporary Issue 527 bookDepth structural availability

on:
  push:
    branches:
      - research/issue527-bookdepth-capacity-prereg

permissions:
  contents: read

jobs:
  structural-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Probe frozen 240 symbol-day roster without liquidity summaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue527-availability
          uv run python - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import numpy as np

          from trade_rl.evaluation.experiments.bootstrap import (
              canonical_m2_book_depth_capacity_protocol,
          )
          from trade_rl.integrations.binance import (
              parse_vision_book_depth_archive,
              vision_book_depth_url,
          )

          protocol = canonical_m2_book_depth_capacity_protocol()
          planned = [
              (symbol, day, vision_book_depth_url(protocol.market, symbol, day))
              for symbol in protocol.symbols
              for day in protocol.planned_days
          ]
          if len(planned) != 240:
              raise SystemExit(f"unexpected planned roster size: {len(planned)}")

          def download(url: str) -> bytes:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "trade-rl-issue527-structural-probe/1"},
              )
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          raise
                      last_error = error
                  except urllib.error.URLError as error:
                      last_error = error
                  if attempt < 2:
                      time.sleep(1 + attempt)
              assert last_error is not None
              raise last_error

          def probe(item):
              symbol, day, url = item
              date = day.date().isoformat()
              base = {"symbol": symbol, "date": date, "url": url}
              try:
                  payload = download(url)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return {**base, "status": "missing"}
                  return {**base, "status": "download_error", "error": f"HTTP {error.code}"}
              except Exception as error:
                  return {**base, "status": "download_error", "error": type(error).__name__}

              raw_sha = hashlib.sha256(payload).hexdigest()
              try:
                  series = parse_vision_book_depth_archive(payload, source=url)
                  if np.any(np.isnat(series.timestamps)) or np.any(np.isnat(series.available_at)):
                      raise ValueError("NaT time evidence")
                  if str(series.timestamps[0])[:10] != date or str(series.timestamps[-1])[:10] != date:
                      raise ValueError("snapshot date escapes planned UTC day")
                  cutoff = np.datetime64("2023-01-01T00:00:00", "ns")
                  if np.any(series.timestamps >= cutoff):
                      raise ValueError("post-evaluation observation in calibration archive")
                  if series.raw_payload_sha256 != raw_sha:
                      raise ValueError("parser raw digest mismatch")
                  if series.raw_payload_size_bytes != len(payload):
                      raise ValueError("parser raw size mismatch")
              except Exception as error:
                  return {
                      **base,
                      "status": "invalid",
                      "raw_sha256": raw_sha,
                      "raw_size_bytes": len(payload),
                      "error": f"{type(error).__name__}:{error}",
                  }
              return {
                  **base,
                  "status": "valid",
                  "raw_sha256": raw_sha,
                  "raw_size_bytes": len(payload),
                  "snapshot_count": int(series.timestamps.size),
                  "first_timestamp": str(series.timestamps[0]),
                  "last_timestamp": str(series.timestamps[-1]),
              }

          rows = []
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures = {executor.submit(probe, item): item for item in planned}
              for future in as_completed(futures):
                  row = future.result()
                  rows.append(row)
                  print(f"{row['symbol']} {row['date']} {row['status']}")

          rows.sort(key=lambda row: (row["symbol"], row["date"]))
          summary = {}
          failures = []
          for symbol in protocol.symbols:
              symbol_rows = [row for row in rows if row["symbol"] == symbol]
              valid = [row for row in symbol_rows if row["status"] == "valid"]
              valid_2021 = [row for row in valid if row["date"].startswith("2021-")]
              valid_2022 = [row for row in valid if row["date"].startswith("2022-")]
              statuses = {}
              for row in symbol_rows:
                  statuses[row["status"]] = statuses.get(row["status"], 0) + 1
              summary[symbol] = {
                  "planned_days": len(symbol_rows),
                  "valid_days": len(valid),
                  "valid_days_2021": len(valid_2021),
                  "valid_days_2022": len(valid_2022),
                  "status_counts": statuses,
              }
              if len(valid) < protocol.min_valid_days_per_symbol:
                  failures.append(
                      f"{symbol}: valid_days={len(valid)} < {protocol.min_valid_days_per_symbol}"
                  )
              if not valid_2021 or not valid_2022:
                  failures.append(f"{symbol}: missing a valid calibration year")

          manifest = {
              "schema_version": "book_depth_structural_availability_v1",
              "protocol_digest": protocol.digest,
              "planned_symbol_days": len(planned),
              "rows": rows,
              "summary": summary,
              "coverage_gate_passed": not failures,
              "coverage_failures": failures,
          }
          output = Path("/tmp/issue527-availability/manifest.json")
          output.write_text(
              json.dumps(manifest, allow_nan=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("STRUCTURAL_SUMMARY=" + json.dumps(summary, sort_keys=True))
          print(f"COVERAGE_GATE_PASSED={not failures}")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Upload structural manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue527-bookdepth-structural-${{ github.run_id }}
          path: /tmp/issue527-availability/manifest.json
          if-no-files-found: error
          retention-days: 30
