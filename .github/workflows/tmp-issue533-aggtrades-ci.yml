name: Temporary Issue 533 aggTrades CI

on:
  push:
    branches:
      - feat/binance-aggtrades-evidence

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Targeted aggTrades and boundary tests
        run: |
          uv run pytest -q \
            tests/integrations/test_binance_agg_trades.py \
            tests/architecture/test_lean_binance_layout.py
      - name: Existing Binance evidence/cache regressions
        run: |
          uv run pytest -q \
            tests/integrations/test_binance_book_depth.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/integrations/test_binance_cache_integrity_contract.py
      - name: Fetch frozen real aggTrades archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://data.binance.vision/data/futures/um/daily/aggTrades/XRPUSDT/XRPUSDT-aggTrades-2022-07-01.zip"
          curl --fail --location --retry 3 --output /tmp/xrp-aggtrades.zip "$url"
          curl --fail --location --retry 3 --output /tmp/xrp-aggtrades.zip.CHECKSUM "$url.CHECKSUM"
          expected="$(awk '{print $1}' /tmp/xrp-aggtrades.zip.CHECKSUM | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum /tmp/xrp-aggtrades.zip | awk '{print $1}')"
          test "$expected" = "$actual"
          test "$actual" = "3558c91d3542177161630d847b55d6a4f6b560fff07f16afa68822caa48467e1"
      - name: Parse frozen real archive with production parser
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          import numpy as np

          from trade_rl.integrations.binance import parse_vision_agg_trades_archive

          url = (
              "https://data.binance.vision/data/futures/um/daily/aggTrades/"
              "XRPUSDT/XRPUSDT-aggTrades-2022-07-01.zip"
          )
          payload = Path("/tmp/xrp-aggtrades.zip").read_bytes()
          series = parse_vision_agg_trades_archive(payload, source=url)
          assert series.aggregate_trade_ids.size == 128_458
          assert series.header_present is False
          assert series.raw_payload_sha256 == (
              "3558c91d3542177161630d847b55d6a4f6b560fff07f16afa68822caa48467e1"
          )
          assert series.raw_payload_size_bytes == 1_992_804
          assert not np.any(np.isnat(series.timestamps))
          assert np.all(series.aggregate_trade_ids[1:] > series.aggregate_trade_ids[:-1])
          assert np.all(series.timestamps[1:] >= series.timestamps[:-1])
          assert str(series.timestamps[0])[:10] == "2022-07-01"
          assert str(series.timestamps[-1])[:10] == "2022-07-01"
          print(
              "REAL_AGGTRADES_OK "
              f"rows={series.aggregate_trade_ids.size} "
              f"header_present={series.header_present} "
              f"sha256={series.raw_payload_sha256}"
          )
          PY
