name: Temporary Issue 535 authority patch v2

on:
  push:
    branches:
      - research/issue535-aggtrades-flow-prereg
    paths:
      - .github/workflows/tmp-issue535-authority-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue535-aggtrades-flow-prereg
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Apply exact authority bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement target, got {count}: {old[:100]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              '_PROVIDER_PARSER_BLOB_SHA = "15cfe8f63716451fdb8c08ae84fba66ca754c55e"\n_MARKET = "usds-m"',
              '_PROVIDER_PARSER_BLOB_SHA = "15cfe8f63716451fdb8c08ae84fba66ca754c55e"\n'
              '_SOURCE_VALIDATION_RUN_ID = 34758933034\n'
              '_SOURCE_VALIDATION_ARTIFACT_ID = 10318765553\n'
              '_SOURCE_VALIDATION_ARTIFACT_DIGEST = (\n'
              '    "3abd6592169ace3f308059fd524199d6fcf76c38862d0caec5e58192f6c7f7a3"\n'
              ')\n'
              '_SOURCE_VALIDATION_MANIFEST_SHA256 = (\n'
              '    "9ebffe78c29dbe336e5ed1323b686f41fae56ef83c50104fae3b8e965eb01f0a"\n'
              ')\n'
              '_CAUSAL_CAPACITY_HEAD_SHA = "db8193c81dd0ca334a15ffc1895d75884238f8a9"\n'
              '_PROCESSING_BAR_VOLUME_CAPACITY = False\n'
              '_MARKET = "usds-m"'
          )
          replace_once(
              '_CHECKSUM_REQUIRED = True\n_BUYER_TAKER_WHEN_BUYER_IS_MAKER = False',
              '_CHECKSUM_REQUIRED = True\n_CHECKSUM_SUFFIX = ".CHECKSUM"\n'
              '_BUYER_TAKER_WHEN_BUYER_IS_MAKER = False'
          )
          replace_once(
              '        "provider_parser_blob_sha",\n        "market",',
              '        "provider_parser_blob_sha",\n'
              '        "source_validation_run_id",\n'
              '        "source_validation_artifact_id",\n'
              '        "source_validation_artifact_digest",\n'
              '        "source_validation_manifest_sha256",\n'
              '        "causal_capacity_head_sha",\n'
              '        "processing_bar_volume_capacity",\n'
              '        "market",'
          )
          replace_once(
              '        "checksum_required",\n        "buyer_taker_when_buyer_is_maker",',
              '        "checksum_required",\n        "checksum_suffix",\n'
              '        "buyer_taker_when_buyer_is_maker",'
          )
          replace_once(
              '    provider_head_sha: str\n    provider_parser_blob_sha: str\n    market: str',
              '    provider_head_sha: str\n'
              '    provider_parser_blob_sha: str\n'
              '    source_validation_run_id: int\n'
              '    source_validation_artifact_id: int\n'
              '    source_validation_artifact_digest: str\n'
              '    source_validation_manifest_sha256: str\n'
              '    causal_capacity_head_sha: str\n'
              '    processing_bar_volume_capacity: bool\n'
              '    market: str'
          )
          replace_once(
              '    checksum_required: bool\n    buyer_taker_when_buyer_is_maker: bool',
              '    checksum_required: bool\n    checksum_suffix: str\n'
              '    buyer_taker_when_buyer_is_maker: bool'
          )
          replace_once(
              '        provider_blob = _git_sha(\n'
              '            self.provider_parser_blob_sha,\n'
              '            field="provider_parser_blob_sha",\n'
              '        )\n'
              '        market = _text(self.market, field="market")',
              '        provider_blob = _git_sha(\n'
              '            self.provider_parser_blob_sha,\n'
              '            field="provider_parser_blob_sha",\n'
              '        )\n'
              '        source_validation_run_id = _int(\n'
              '            self.source_validation_run_id,\n'
              '            field="source_validation_run_id",\n'
              '        )\n'
              '        source_validation_artifact_id = _int(\n'
              '            self.source_validation_artifact_id,\n'
              '            field="source_validation_artifact_id",\n'
              '        )\n'
              '        source_validation_artifact_digest = _sha256(\n'
              '            self.source_validation_artifact_digest,\n'
              '            field="source_validation_artifact_digest",\n'
              '        )\n'
              '        source_validation_manifest_sha256 = _sha256(\n'
              '            self.source_validation_manifest_sha256,\n'
              '            field="source_validation_manifest_sha256",\n'
              '        )\n'
              '        causal_capacity_head = _git_sha(\n'
              '            self.causal_capacity_head_sha,\n'
              '            field="causal_capacity_head_sha",\n'
              '        )\n'
              '        processing_bar_volume_capacity = _bool(\n'
              '            self.processing_bar_volume_capacity,\n'
              '            field="processing_bar_volume_capacity",\n'
              '        )\n'
              '        market = _text(self.market, field="market")'
          )
          replace_once(
              '        checksum_required = _bool(self.checksum_required, field="checksum_required")\n'
              '        buyer_taker = _bool(',
              '        checksum_required = _bool(self.checksum_required, field="checksum_required")\n'
              '        checksum_suffix = _text(self.checksum_suffix, field="checksum_suffix")\n'
              '        buyer_taker = _bool('
          )
          replace_once(
              '        if any(day < 1 or day > 28 for day in sample_days):',
              '        for identity_field, identity_value in (\n'
              '            ("source_validation_run_id", source_validation_run_id),\n'
              '            ("source_validation_artifact_id", source_validation_artifact_id),\n'
              '        ):\n'
              '            if identity_value <= 0:\n'
              '                raise ValueError(f"{identity_field} must be positive")\n'
              '        if any(day < 1 or day > 28 for day in sample_days):'
          )
          replace_once(
              '            provider_head,\n            provider_blob,\n            market,',
              '            provider_head,\n'
              '            provider_blob,\n'
              '            source_validation_run_id,\n'
              '            source_validation_artifact_id,\n'
              '            source_validation_artifact_digest,\n'
              '            source_validation_manifest_sha256,\n'
              '            causal_capacity_head,\n'
              '            processing_bar_volume_capacity,\n'
              '            market,'
          )
          replace_once(
              '            checksum_required,\n            buyer_taker,',
              '            checksum_required,\n            checksum_suffix,\n            buyer_taker,'
          )
          replace_once(
              '            _PROVIDER_HEAD_SHA,\n            _PROVIDER_PARSER_BLOB_SHA,\n            _MARKET,',
              '            _PROVIDER_HEAD_SHA,\n'
              '            _PROVIDER_PARSER_BLOB_SHA,\n'
              '            _SOURCE_VALIDATION_RUN_ID,\n'
              '            _SOURCE_VALIDATION_ARTIFACT_ID,\n'
              '            _SOURCE_VALIDATION_ARTIFACT_DIGEST,\n'
              '            _SOURCE_VALIDATION_MANIFEST_SHA256,\n'
              '            _CAUSAL_CAPACITY_HEAD_SHA,\n'
              '            _PROCESSING_BAR_VOLUME_CAPACITY,\n'
              '            _MARKET,'
          )
          replace_once(
              '            _CHECKSUM_REQUIRED,\n            _BUYER_TAKER_WHEN_BUYER_IS_MAKER,',
              '            _CHECKSUM_REQUIRED,\n            _CHECKSUM_SUFFIX,\n'
              '            _BUYER_TAKER_WHEN_BUYER_IS_MAKER,'
          )
          replace_once(
              '        object.__setattr__(self, "provider_parser_blob_sha", provider_blob)\n'
              '        object.__setattr__(self, "market", market)',
              '        object.__setattr__(self, "provider_parser_blob_sha", provider_blob)\n'
              '        object.__setattr__(\n'
              '            self, "source_validation_run_id", source_validation_run_id\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self, "source_validation_artifact_id", source_validation_artifact_id\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "source_validation_artifact_digest",\n'
              '            source_validation_artifact_digest,\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "source_validation_manifest_sha256",\n'
              '            source_validation_manifest_sha256,\n'
              '        )\n'
              '        object.__setattr__(self, "causal_capacity_head_sha", causal_capacity_head)\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "processing_bar_volume_capacity",\n'
              '            processing_bar_volume_capacity,\n'
              '        )\n'
              '        object.__setattr__(self, "market", market)'
          )
          replace_once(
              '        object.__setattr__(self, "checksum_required", checksum_required)\n'
              '        object.__setattr__(\n            self,\n            "buyer_taker_when_buyer_is_maker",',
              '        object.__setattr__(self, "checksum_required", checksum_required)\n'
              '        object.__setattr__(self, "checksum_suffix", checksum_suffix)\n'
              '        object.__setattr__(\n            self,\n            "buyer_taker_when_buyer_is_maker",'
          )
          replace_once(
              '            "provider_head_sha": self.provider_head_sha,\n'
              '            "provider_parser_blob_sha": self.provider_parser_blob_sha,\n'
              '            "market": self.market,',
              '            "provider_head_sha": self.provider_head_sha,\n'
              '            "provider_parser_blob_sha": self.provider_parser_blob_sha,\n'
              '            "source_validation_run_id": self.source_validation_run_id,\n'
              '            "source_validation_artifact_id": self.source_validation_artifact_id,\n'
              '            "source_validation_artifact_digest": (\n'
              '                self.source_validation_artifact_digest\n'
              '            ),\n'
              '            "source_validation_manifest_sha256": (\n'
              '                self.source_validation_manifest_sha256\n'
              '            ),\n'
              '            "causal_capacity_head_sha": self.causal_capacity_head_sha,\n'
              '            "processing_bar_volume_capacity": (\n'
              '                self.processing_bar_volume_capacity\n'
              '            ),\n'
              '            "market": self.market,'
          )
          replace_once(
              '            "checksum_required": self.checksum_required,\n'
              '            "buyer_taker_when_buyer_is_maker": (self.buyer_taker_when_buyer_is_maker),',
              '            "checksum_required": self.checksum_required,\n'
              '            "checksum_suffix": self.checksum_suffix,\n'
              '            "buyer_taker_when_buyer_is_maker": (self.buyer_taker_when_buyer_is_maker),'
          )
          replace_once(
              '        provider_head_sha=_PROVIDER_HEAD_SHA,\n'
              '        provider_parser_blob_sha=_PROVIDER_PARSER_BLOB_SHA,\n'
              '        market=_MARKET,',
              '        provider_head_sha=_PROVIDER_HEAD_SHA,\n'
              '        provider_parser_blob_sha=_PROVIDER_PARSER_BLOB_SHA,\n'
              '        source_validation_run_id=_SOURCE_VALIDATION_RUN_ID,\n'
              '        source_validation_artifact_id=_SOURCE_VALIDATION_ARTIFACT_ID,\n'
              '        source_validation_artifact_digest=_SOURCE_VALIDATION_ARTIFACT_DIGEST,\n'
              '        source_validation_manifest_sha256=_SOURCE_VALIDATION_MANIFEST_SHA256,\n'
              '        causal_capacity_head_sha=_CAUSAL_CAPACITY_HEAD_SHA,\n'
              '        processing_bar_volume_capacity=_PROCESSING_BAR_VOLUME_CAPACITY,\n'
              '        market=_MARKET,'
          )
          replace_once(
              '        checksum_required=_CHECKSUM_REQUIRED,\n'
              '        buyer_taker_when_buyer_is_maker=_BUYER_TAKER_WHEN_BUYER_IS_MAKER,',
              '        checksum_required=_CHECKSUM_REQUIRED,\n'
              '        checksum_suffix=_CHECKSUM_SUFFIX,\n'
              '        buyer_taker_when_buyer_is_maker=_BUYER_TAKER_WHEN_BUYER_IS_MAKER,'
          )
          replace_once(
              '        provider_parser_blob_sha=_git_sha(\n'
              '            payload["provider_parser_blob_sha"],\n'
              '            field="provider_parser_blob_sha",\n'
              '        ),\n'
              '        market=_text(payload["market"], field="market"),',
              '        provider_parser_blob_sha=_git_sha(\n'
              '            payload["provider_parser_blob_sha"],\n'
              '            field="provider_parser_blob_sha",\n'
              '        ),\n'
              '        source_validation_run_id=_int(\n'
              '            payload["source_validation_run_id"],\n'
              '            field="source_validation_run_id",\n'
              '        ),\n'
              '        source_validation_artifact_id=_int(\n'
              '            payload["source_validation_artifact_id"],\n'
              '            field="source_validation_artifact_id",\n'
              '        ),\n'
              '        source_validation_artifact_digest=_sha256(\n'
              '            payload["source_validation_artifact_digest"],\n'
              '            field="source_validation_artifact_digest",\n'
              '        ),\n'
              '        source_validation_manifest_sha256=_sha256(\n'
              '            payload["source_validation_manifest_sha256"],\n'
              '            field="source_validation_manifest_sha256",\n'
              '        ),\n'
              '        causal_capacity_head_sha=_git_sha(\n'
              '            payload["causal_capacity_head_sha"],\n'
              '            field="causal_capacity_head_sha",\n'
              '        ),\n'
              '        processing_bar_volume_capacity=_bool(\n'
              '            payload["processing_bar_volume_capacity"],\n'
              '            field="processing_bar_volume_capacity",\n'
              '        ),\n'
              '        market=_text(payload["market"], field="market"),'
          )
          replace_once(
              '        checksum_required=_bool(\n'
              '            payload["checksum_required"],\n'
              '            field="checksum_required",\n'
              '        ),\n'
              '        buyer_taker_when_buyer_is_maker=_bool(',
              '        checksum_required=_bool(\n'
              '            payload["checksum_required"],\n'
              '            field="checksum_required",\n'
              '        ),\n'
              '        checksum_suffix=_text(\n'
              '            payload["checksum_suffix"],\n'
              '            field="checksum_suffix",\n'
              '        ),\n'
              '        buyer_taker_when_buyer_is_maker=_bool('
          )

          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          git diff --cached --quiet && { echo "no source diff"; exit 1; }
          git commit -m "feat: bind preregistration source and causal authorities"
          git push origin HEAD:research/issue535-aggtrades-flow-prereg
