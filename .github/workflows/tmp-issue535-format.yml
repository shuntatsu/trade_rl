name: Temporary Issue 535 formatter

on:
  push:
    branches:
      - research/issue535-aggtrades-flow-prereg
    paths:
      - .github/workflows/tmp-issue535-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue535-aggtrades-flow-prereg
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format exact protocol file
        run: uv run ruff format trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          git commit -m "style: format aggTrades flow protocol"
          git push origin HEAD:research/issue535-aggtrades-flow-prereg
