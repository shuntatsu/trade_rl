name: Temporary Issue 535 preregistration seal

on:
  push:
    branches:
      - research/issue535-aggtrades-flow-prereg
    paths:
      - .github/workflows/tmp-issue535-prereg-seal.yml

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact sealed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f09784d456199227a49790beb3af5baf2f92da02
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Verify preregistration source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f09784d456199227a49790beb3af5baf2f92da02"
          uv run ruff check trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py
          uv run ruff format --check trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py
      - name: Build sealed protocol artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/issue535-seal
          mkdir -p /tmp/issue535-seal
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from trade_rl.evaluation.experiments.bootstrap.agg_flow_capacity import (
              canonical_m2_aggtrades_flow_capacity_protocol,
          )

          root = Path("/tmp/issue535-seal")
          source_path = Path(
              "trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py"
          )
          test_path = Path(
              "tests/evaluation/experiments/bootstrap/"
              "test_aggtrades_flow_capacity_protocol.py"
          )
          protocol = canonical_m2_aggtrades_flow_capacity_protocol()
          payload = protocol.to_payload()
          forbidden = {
              "returns",
              "pnl",
              "strategy",
              "decision",
              "experiment_result",
              "candidate_result",
              "q10",
              "symbol_cap",
          }
          if forbidden.intersection(payload):
              raise SystemExit("sealed preregistration contains result fields")
          protocol_bytes = (
              json.dumps(payload, allow_nan=False, sort_keys=True, indent=2) + "\n"
          ).encode("utf-8")
          (root / "protocol.json").write_bytes(protocol_bytes)

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          head_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tree_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if head_sha != "f09784d456199227a49790beb3af5baf2f92da02":
              raise SystemExit(f"unexpected sealed source head: {head_sha}")
          if len(protocol.planned_days) != 24 or len(protocol.planned_urls) != 120:
              raise SystemExit("unexpected frozen archive roster cardinality")
          if any("2023-" in url for url in protocol.planned_urls):
              raise SystemExit("post-evaluation URL entered preregistration roster")

          index = {
              "schema_version": "aggtrades_flow_capacity_preregistration_seal_v1",
              "issue_number": 535,
              "pull_request_number": 536,
              "workflow_trigger_sha": os.environ["GITHUB_SHA"],
              "sealed_source_sha": head_sha,
              "sealed_tree_sha": tree_sha,
              "protocol_digest": protocol.digest,
              "protocol_json_sha256": hashlib.sha256(protocol_bytes).hexdigest(),
              "protocol_source_sha256": sha256(source_path),
              "contract_test_sha256": sha256(test_path),
              "planned_day_count": len(protocol.planned_days),
              "planned_url_count": len(protocol.planned_urls),
              "provider_head_sha": protocol.provider_head_sha,
              "provider_parser_blob_sha": protocol.provider_parser_blob_sha,
              "source_validation_run_id": protocol.source_validation_run_id,
              "source_validation_artifact_id": protocol.source_validation_artifact_id,
              "source_validation_artifact_digest": (
                  protocol.source_validation_artifact_digest
              ),
              "source_validation_manifest_sha256": (
                  protocol.source_validation_manifest_sha256
              ),
              "causal_capacity_head_sha": protocol.causal_capacity_head_sha,
              "processing_bar_volume_capacity": (
                  protocol.processing_bar_volume_capacity
              ),
          }
          (root / "index.json").write_text(
              json.dumps(index, allow_nan=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"SEALED_SOURCE_SHA={head_sha}")
          print(f"SEALED_TREE_SHA={tree_sha}")
          print(f"PROTOCOL_DIGEST={protocol.digest}")
          print(f"PROTOCOL_JSON_SHA256={index['protocol_json_sha256']}")
          print(f"PROTOCOL_SOURCE_SHA256={index['protocol_source_sha256']}")
          print(f"CONTRACT_TEST_SHA256={index['contract_test_sha256']}")
          PY
      - name: Upload sealed protocol
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue535-aggtrades-flow-prereg-${{ github.run_id }}
          path: /tmp/issue535-seal
          if-no-files-found: error
          retention-days: 90

  independent-refetch-verifier:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact sealed source independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f09784d456199227a49790beb3af5baf2f92da02
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Resolve sealed artifact through GitHub API
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: issue535-aggtrades-flow-prereg-${{ github.run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > /tmp/artifacts.json
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/artifacts.json").read_text(encoding="utf-8"))
          expected = os.environ["ARTIFACT_NAME"]
          matches = [item for item in data["artifacts"] if item["name"] == expected]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one artifact {expected!r}, got {len(matches)}"
              )
          artifact = matches[0]
          if artifact.get("expired"):
              raise SystemExit("sealed preregistration artifact is expired")
          digest = artifact.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit(f"missing GitHub artifact digest: {digest!r}")
          print(f"artifact_id={artifact['id']}")
          print(f"api_digest={digest}")
          PY
      - name: Verify upload digest against API digest
        env:
          API_DIGEST: ${{ steps.artifact.outputs.api_digest }}
          UPLOAD_DIGEST: ${{ needs.publish.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          api_hex="${API_DIGEST#sha256:}"
          upload_hex="${UPLOAD_DIGEST#sha256:}"
          [[ "${api_hex}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${upload_hex}" =~ ^[0-9a-f]{64}$ ]]
          test "${api_hex}" = "${upload_hex}"
      - name: Re-fetch sealed artifact through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/issue535-refetched
          mkdir -p /tmp/issue535-refetched
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/issue535-seal.zip
          unzip -q /tmp/issue535-seal.zip -d /tmp/issue535-refetched
      - name: Independently reconstruct and verify preregistration
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from trade_rl.evaluation.experiments.bootstrap.agg_flow_capacity import (
              canonical_m2_aggtrades_flow_capacity_protocol,
              load_aggtrades_flow_capacity_protocol,
          )

          root = Path("/tmp/issue535-refetched")
          protocol_path = root / "protocol.json"
          index_path = root / "index.json"
          index = json.loads(index_path.read_text(encoding="utf-8"))
          expected_keys = {
              "schema_version",
              "issue_number",
              "pull_request_number",
              "workflow_trigger_sha",
              "sealed_source_sha",
              "sealed_tree_sha",
              "protocol_digest",
              "protocol_json_sha256",
              "protocol_source_sha256",
              "contract_test_sha256",
              "planned_day_count",
              "planned_url_count",
              "provider_head_sha",
              "provider_parser_blob_sha",
              "source_validation_run_id",
              "source_validation_artifact_id",
              "source_validation_artifact_digest",
              "source_validation_manifest_sha256",
              "causal_capacity_head_sha",
              "processing_bar_volume_capacity",
          }
          if set(index) != expected_keys:
              raise SystemExit(f"seal index keys differ: {sorted(index)}")
          if index["schema_version"] != "aggtrades_flow_capacity_preregistration_seal_v1":
              raise SystemExit("unexpected preregistration seal schema")
          if index["issue_number"] != 535 or index["pull_request_number"] != 536:
              raise SystemExit("seal points to wrong issue or PR")
          if index["workflow_trigger_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("seal trigger SHA mismatch")
          if index["sealed_source_sha"] != "f09784d456199227a49790beb3af5baf2f92da02":
              raise SystemExit("seal points to wrong source head")
          if subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip() != index["sealed_source_sha"]:
              raise SystemExit("independent checkout source SHA mismatch")
          tree_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if tree_sha != index["sealed_tree_sha"]:
              raise SystemExit("independent checkout tree SHA mismatch")

          protocol_bytes = protocol_path.read_bytes()
          if hashlib.sha256(protocol_bytes).hexdigest() != index["protocol_json_sha256"]:
              raise SystemExit("protocol JSON byte digest mismatch")
          source_path = Path(
              "trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py"
          )
          test_path = Path(
              "tests/evaluation/experiments/bootstrap/"
              "test_aggtrades_flow_capacity_protocol.py"
          )
          if hashlib.sha256(source_path.read_bytes()).hexdigest() != index[
              "protocol_source_sha256"
          ]:
              raise SystemExit("protocol source digest mismatch")
          if hashlib.sha256(test_path.read_bytes()).hexdigest() != index[
              "contract_test_sha256"
          ]:
              raise SystemExit("contract test digest mismatch")

          loaded = load_aggtrades_flow_capacity_protocol(protocol_path)
          canonical = canonical_m2_aggtrades_flow_capacity_protocol()
          if loaded != canonical:
              raise SystemExit("refetched protocol differs from canonical factory")
          if loaded.digest != index["protocol_digest"]:
              raise SystemExit("protocol content digest mismatch")
          if len(loaded.planned_days) != index["planned_day_count"] != 24:
              raise SystemExit("planned-day count mismatch")
          if len(loaded.planned_urls) != index["planned_url_count"] != 120:
              raise SystemExit("planned-URL count mismatch")
          if any("2023-" in url for url in loaded.planned_urls):
              raise SystemExit("post-evaluation URL entered sealed protocol")
          if loaded.provider_head_sha != index["provider_head_sha"]:
              raise SystemExit("provider head mismatch")
          if loaded.provider_parser_blob_sha != index["provider_parser_blob_sha"]:
              raise SystemExit("provider parser blob mismatch")
          if loaded.source_validation_run_id != index["source_validation_run_id"]:
              raise SystemExit("source-validation run mismatch")
          if loaded.source_validation_artifact_id != index[
              "source_validation_artifact_id"
          ]:
              raise SystemExit("source-validation artifact ID mismatch")
          if loaded.source_validation_artifact_digest != index[
              "source_validation_artifact_digest"
          ]:
              raise SystemExit("source-validation artifact digest mismatch")
          if loaded.source_validation_manifest_sha256 != index[
              "source_validation_manifest_sha256"
          ]:
              raise SystemExit("source-validation manifest digest mismatch")
          if loaded.causal_capacity_head_sha != index["causal_capacity_head_sha"]:
              raise SystemExit("causal-capacity source mismatch")
          if loaded.processing_bar_volume_capacity is not False:
              raise SystemExit("sealed protocol is not causal-capacity mode")
          if index["processing_bar_volume_capacity"] is not False:
              raise SystemExit("seal index is not causal-capacity mode")

          print(f"VERIFIED_PROTOCOL_DIGEST={loaded.digest}")
          print(f"VERIFIED_SOURCE_SHA={index['sealed_source_sha']}")
          print(f"VERIFIED_TREE_SHA={index['sealed_tree_sha']}")
          PY
