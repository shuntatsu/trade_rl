name: Temporary Issue 535 second independent verifier

on:
  push:
    branches:
      - research/issue535-aggtrades-flow-prereg
    paths:
      - .github/workflows/tmp-issue535-second-verifier.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact sealed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f09784d456199227a49790beb3af5baf2f92da02
          fetch-depth: 1
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Re-fetch preregistration and source-validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue535-second /tmp/issue532-second

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10319386570" \
            > /tmp/issue535-meta.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10319386570/zip" \
            --output /tmp/issue535.zip
          unzip -q /tmp/issue535.zip -d /tmp/issue535-second

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10318765553" \
            > /tmp/issue532-meta.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10318765553/zip" \
            --output /tmp/issue532.zip
          unzip -q /tmp/issue532.zip -d /tmp/issue532-second
      - name: Verify provider Git identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin dd51da97845f4d8fe69c34b1c4e4859358911daf
          test "$(git rev-parse dd51da97845f4d8fe69c34b1c4e4859358911daf:trade_rl/integrations/binance/agg_trades.py)" = "15cfe8f63716451fdb8c08ae84fba66ca754c55e"
          git fetch --no-tags --depth=1 origin db8193c81dd0ca334a15ffc1895d75884238f8a9
          git cat-file -e db8193c81dd0ca334a15ffc1895d75884238f8a9^{commit}
      - name: Verify both evidence chains and strict counts
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from trade_rl.evaluation.experiments.bootstrap.agg_flow_capacity import (
              canonical_m2_aggtrades_flow_capacity_protocol,
              load_aggtrades_flow_capacity_protocol,
          )

          EXPECTED_PREREG_ZIP = "dbc6ef286abb9e4c8530089328fb64b2cfaa5e98715a82740439470a45942e57"
          EXPECTED_PROTOCOL = "5fb013fb0a3d717846a701b23d2f4bfca8e742ebaef0e6f564a331053f2ed071"
          EXPECTED_PROTOCOL_JSON = "e0b21c51ad2ad8b866580f599b7d0eee7de138b5a4c88c0a3d05e74fedd4f67b"
          EXPECTED_SOURCE = "f8c8c5a25ea007f0864cbd0d9231675f3a4861713c3a78fbbb5fdff9ab7385bc"
          EXPECTED_TEST = "038623ac5e20a5da1c7d7b32e70d8ae376c9107e1a78f7be5feea45e57ee31e7"
          EXPECTED_SOURCE_VALIDATION_ZIP = "3abd6592169ace3f308059fd524199d6fcf76c38862d0caec5e58192f6c7f7a3"
          EXPECTED_SOURCE_VALIDATION_MANIFEST = "9ebffe78c29dbe336e5ed1323b686f41fae56ef83c50104fae3b8e965eb01f0a"
          EXPECTED_SOURCE_HEAD = "f09784d456199227a49790beb3af5baf2f92da02"
          EXPECTED_SOURCE_TREE = "7caa248f3b1f5de8c93993a5d74b63a73ee93705"

          def sha(path: str | Path) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          prereg_meta = json.loads(Path("/tmp/issue535-meta.json").read_text())
          if prereg_meta.get("expired"):
              raise SystemExit("preregistration artifact expired")
          if prereg_meta.get("id") != 10319386570:
              raise SystemExit("wrong preregistration artifact ID")
          if prereg_meta.get("name") != "issue535-aggtrades-flow-prereg-34761985041":
              raise SystemExit("wrong preregistration artifact name")
          if prereg_meta.get("digest") != f"sha256:{EXPECTED_PREREG_ZIP}":
              raise SystemExit("preregistration API digest mismatch")
          if sha("/tmp/issue535.zip") != EXPECTED_PREREG_ZIP:
              raise SystemExit("downloaded preregistration ZIP digest mismatch")

          source_meta = json.loads(Path("/tmp/issue532-meta.json").read_text())
          if source_meta.get("expired"):
              raise SystemExit("source-validation artifact expired")
          if source_meta.get("id") != 10318765553:
              raise SystemExit("wrong source-validation artifact ID")
          if source_meta.get("digest") != f"sha256:{EXPECTED_SOURCE_VALIDATION_ZIP}":
              raise SystemExit("source-validation API digest mismatch")
          if sha("/tmp/issue532.zip") != EXPECTED_SOURCE_VALIDATION_ZIP:
              raise SystemExit("downloaded source-validation ZIP digest mismatch")
          if sha("/tmp/issue532-second/manifest.json") != EXPECTED_SOURCE_VALIDATION_MANIFEST:
              raise SystemExit("source-validation manifest digest mismatch")
          source_manifest = json.loads(
              Path("/tmp/issue532-second/manifest.json").read_text(encoding="utf-8")
          )
          if source_manifest.get("pass") is not True:
              raise SystemExit("source-validation manifest did not pass")
          if source_manifest.get("planned_symbol_days") != 20:
              raise SystemExit("source-validation planned count mismatch")
          if source_manifest.get("valid_symbol_days") != 20:
              raise SystemExit("source-validation valid count mismatch")
          if source_manifest.get("economic_summaries_computed") is not False:
              raise SystemExit("source-validation artifact contains economic-summary phase")

          root = Path("/tmp/issue535-second")
          protocol_path = root / "protocol.json"
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          if index["sealed_source_sha"] != EXPECTED_SOURCE_HEAD:
              raise SystemExit("sealed source SHA mismatch")
          if index["sealed_tree_sha"] != EXPECTED_SOURCE_TREE:
              raise SystemExit("sealed source tree mismatch")
          if index["protocol_digest"] != EXPECTED_PROTOCOL:
              raise SystemExit("registered protocol digest mismatch")
          if index["protocol_json_sha256"] != EXPECTED_PROTOCOL_JSON:
              raise SystemExit("registered protocol JSON digest mismatch")
          if index["protocol_source_sha256"] != EXPECTED_SOURCE:
              raise SystemExit("registered source digest mismatch")
          if index["contract_test_sha256"] != EXPECTED_TEST:
              raise SystemExit("registered test digest mismatch")
          if sha(protocol_path) != EXPECTED_PROTOCOL_JSON:
              raise SystemExit("refetched protocol JSON bytes mismatch")
          if sha("trade_rl/evaluation/experiments/bootstrap/agg_flow_capacity.py") != EXPECTED_SOURCE:
              raise SystemExit("checked-out protocol source bytes mismatch")
          if sha("tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py") != EXPECTED_TEST:
              raise SystemExit("checked-out contract test bytes mismatch")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != EXPECTED_SOURCE_HEAD:
              raise SystemExit("checked-out sealed source head mismatch")
          if subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() != EXPECTED_SOURCE_TREE:
              raise SystemExit("checked-out sealed source tree mismatch")

          loaded = load_aggtrades_flow_capacity_protocol(protocol_path)
          canonical = canonical_m2_aggtrades_flow_capacity_protocol()
          if loaded != canonical or loaded.digest != EXPECTED_PROTOCOL:
              raise SystemExit("canonical reconstruction mismatch")
          if len(loaded.planned_days) != 24 or index["planned_day_count"] != 24:
              raise SystemExit("planned-day count must be exactly 24")
          if len(loaded.planned_urls) != 120 or index["planned_url_count"] != 120:
              raise SystemExit("planned-URL count must be exactly 120")
          if len(set(loaded.planned_urls)) != 120:
              raise SystemExit("planned URLs are not unique")
          if any("2023-" in url for url in loaded.planned_urls):
              raise SystemExit("post-evaluation URL entered sealed protocol")
          if loaded.source_validation_artifact_digest != EXPECTED_SOURCE_VALIDATION_ZIP:
              raise SystemExit("protocol source-validation artifact binding mismatch")
          if loaded.source_validation_manifest_sha256 != EXPECTED_SOURCE_VALIDATION_MANIFEST:
              raise SystemExit("protocol source-validation manifest binding mismatch")
          if loaded.processing_bar_volume_capacity is not False:
              raise SystemExit("protocol did not bind causal capacity mode")

          print("SECOND_VERIFIER=PASS")
          print(f"PROTOCOL_DIGEST={loaded.digest}")
          print(f"PREREG_ARTIFACT_SHA256={EXPECTED_PREREG_ZIP}")
          print(f"SOURCE_VALIDATION_ARTIFACT_SHA256={EXPECTED_SOURCE_VALIDATION_ZIP}")
          PY
