name: Temporary Issue 537 format and targeted GREEN

on:
  push:
    branches:
      - research/issue537-aggtrades-flow-calibration
    paths:
      - .github/workflows/tmp-issue537-format-green.yml

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue537-aggtrades-flow-calibration
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format production calibration module
        run: uv run ruff format trade_rl/evaluation/experiments/bootstrap/agg_flow_calibration.py
      - name: Static and targeted verification
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_calibration.py
      - name: Commit formatter output only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/agg_flow_calibration.py
          git diff --cached --quiet && { echo "already formatted"; exit 0; }
          git commit -m "style: format aggTrades calibration module"
          git push origin HEAD:research/issue537-aggtrades-flow-calibration
