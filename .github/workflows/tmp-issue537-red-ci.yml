name: Temporary Issue 537 RED CI

on:
  push:
    branches:
      - research/issue537-aggtrades-flow-calibration
    paths:
      - .github/workflows/tmp-issue537-red-ci.yml
      - tests/evaluation/experiments/bootstrap/test_aggtrades_flow_calibration.py
      - trade_rl/evaluation/experiments/bootstrap/agg_flow_calibration.py

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Targeted sealed protocol and calibration tests
        run: |
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_calibration.py
