name: Temporary Issue 539 compare Study plans

on:
  push:
    branches:
      - verify/issue539-exact-15bf6546
    paths:
      - .github/workflows/tmp-issue539-compare-study-plans.yml

permissions:
  actions: read
  contents: read

env:
  OFFICIAL_RUN: "34793586474"
  OFFICIAL_NAME: issue539-calibrated-causal-identities-34793586474
  OFFICIAL_ID: "10328956351"
  OFFICIAL_DIGEST: sha256:98a87c4a1da8e4f5e97362aa8d90c13e2f1291b5bc6f6dbef73dfecbb924c756
  EXACT_RUN: "34794384559"
  EXACT_NAME: issue539-calibrated-causal-successor-v1-34794384559
  EXACT_ID: "10329107309"
  EXACT_DIGEST: sha256:6e8bff792fb905bf93fbf591e2c9cf18c2b28e6a1396f4e1a88562e83a65986d

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - name: API-bind both bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tuple in "$OFFICIAL_ID|$OFFICIAL_NAME|$OFFICIAL_DIGEST|$OFFICIAL_RUN" "$EXACT_ID|$EXACT_NAME|$EXACT_DIGEST|$EXACT_RUN"; do
            IFS='|' read -r id name digest run_id <<<"$tuple"
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.name' <<<"$payload")" = "$name"
            test "$(jq -r '.digest' <<<"$payload")" = "$digest"
            test "$(jq -r '.workflow_run.id' <<<"$payload")" = "$run_id"
            test "$(jq -r '.expired' <<<"$payload")" = "false"
          done
      - name: Download official bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OFFICIAL_NAME }}
          path: /tmp/official
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.OFFICIAL_RUN }}
      - name: Download exact-head bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.EXACT_NAME }}
          path: /tmp/exact
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EXACT_RUN }}
      - name: Report Study plan differences only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/official/study/plan.json').read_text())
          b=json.loads(Path('/tmp/exact/study/plan.json').read_text())
          diffs=[]
          def walk(x,y,path=()):
              if type(x) is not type(y):
                  diffs.append((path,x,y)); return
              if isinstance(x,dict):
                  for k in sorted(set(x)|set(y)):
                      if k not in x or k not in y: diffs.append((path+(k,),x.get(k,'<MISSING>'),y.get(k,'<MISSING>')))
                      else: walk(x[k],y[k],path+(k,))
              elif isinstance(x,list):
                  if len(x)!=len(y): diffs.append((path+('length',),len(x),len(y)))
                  for i,(u,v) in enumerate(zip(x,y)): walk(u,v,path+(str(i),))
              elif x!=y: diffs.append((path,x,y))
          walk(a,b)
          print('DIFF_COUNT='+str(len(diffs)))
          for path,left,right in diffs:
              print('PATH='+'.'.join(path))
              print('OFFICIAL='+json.dumps(left,sort_keys=True))
              print('EXACT='+json.dumps(right,sort_keys=True))
          print('OFFICIAL_RESEARCH_QUESTION='+json.dumps(a.get('research_question')))
          print('EXACT_RESEARCH_QUESTION='+json.dumps(b.get('research_question')))
          PY
