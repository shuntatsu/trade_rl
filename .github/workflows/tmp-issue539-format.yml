name: Temporary Issue 539 format preview

on:
  push:
    branches:
      - research/issue539-calibrated-causal-study
    paths:
      - .github/workflows/tmp-issue539-format.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format only new tests
        run: >-
          uv run ruff format
          tests/evaluation/test_execution_overlay_authority.py
          tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
      - name: Upload formatted tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue539-formatted-tests-${{ github.run_id }}
          path: |
            tests/evaluation/test_execution_overlay_authority.py
            tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
