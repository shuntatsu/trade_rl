name: Temporary Issue 539 minimal GREEN

on:
  push:
    branches:
      - research/issue539-calibrated-causal-study
    paths:
      - .github/workflows/tmp-issue539-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Apply minimal production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Run config: execution overlay is resolved identity, not raw CandidateRunConfig.
          path = "trade_rl/evaluation/runs/config.py"
          replace_once(
              path,
              "from trade_rl.evaluation.runs.candidate_suite import LeanCandidateConfig\n\n\n@dataclass",
              "from trade_rl.evaluation.runs.candidate_suite import LeanCandidateConfig\n\n\nLEGACY_DATASET_EXECUTION_OVERLAY = \"zero_overlay_dataset_fields_authoritative\"\nCAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY = (\n    \"zero_overlay_dataset_fields_authoritative_previous_completed_bar_capacity\"\n)\n_SUPPORTED_EXECUTION_OVERLAYS = frozenset(\n    {\n        LEGACY_DATASET_EXECUTION_OVERLAY,\n        CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,\n    }\n)\n\n\ndef _validated_execution_overlay(value: object) -> str:\n    resolved = _validated_text(value, field=\"execution_overlay\")\n    if resolved not in _SUPPORTED_EXECUTION_OVERLAYS:\n        raise ValueError(f\"unsupported execution_overlay: {resolved}\")\n    return resolved\n\n\n@dataclass",
          )
          replace_once(
              path,
              "    evaluation_start_index: int\n    evaluation_stop_index: int\n\n    def __post_init__(self) -> None:\n",
              "    evaluation_start_index: int\n    evaluation_stop_index: int\n    execution_overlay: str = LEGACY_DATASET_EXECUTION_OVERLAY\n\n    def __post_init__(self) -> None:\n",
          )
          replace_once(
              path,
              "        require_sha256(\n            self.dataset_artifact_digest,\n            field=\"dataset_artifact_digest\",\n        )\n\n\ndef _validated_text",
              "        require_sha256(\n            self.dataset_artifact_digest,\n            field=\"dataset_artifact_digest\",\n        )\n        object.__setattr__(\n            self,\n            \"execution_overlay\",\n            _validated_execution_overlay(self.execution_overlay),\n        )\n\n\ndef _validated_text",
          )
          replace_once(
              path,
              "    dataset_artifact_digest: str,\n    config: CandidateRunConfig,\n) -> ResolvedCandidateRunSpec:\n",
              "    dataset_artifact_digest: str,\n    config: CandidateRunConfig,\n    execution_overlay: str = LEGACY_DATASET_EXECUTION_OVERLAY,\n) -> ResolvedCandidateRunSpec:\n",
          )
          replace_once(
              path,
              "        evaluation_start_index=start_index,\n        evaluation_stop_index=stop_index,\n    )\n\n\n__all__ = [\n",
              "        evaluation_start_index=start_index,\n        evaluation_stop_index=stop_index,\n        execution_overlay=_validated_execution_overlay(execution_overlay),\n    )\n\n\n__all__ = [\n",
          )
          replace_once(
              path,
              "__all__ = [\n    \"CandidateRunConfig\",\n    \"ResolvedCandidateRunSpec\",\n",
              "__all__ = [\n    \"CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY\",\n    \"LEGACY_DATASET_EXECUTION_OVERLAY\",\n    \"CandidateRunConfig\",\n    \"ResolvedCandidateRunSpec\",\n",
          )

          # Public runs facade exports Study-level overlay names for workflow wiring.
          path = "trade_rl/evaluation/runs/__init__.py"
          replace_once(
              path,
              "from trade_rl.evaluation.runs.config import (\n    CandidateRunConfig,\n",
              "from trade_rl.evaluation.runs.config import (\n    CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,\n    LEGACY_DATASET_EXECUTION_OVERLAY,\n    CandidateRunConfig,\n",
          )
          replace_once(
              path,
              "__all__ = [\n    \"CandidateRunArtifactIdentity\",\n",
              "__all__ = [\n    \"CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY\",\n    \"LEGACY_DATASET_EXECUTION_OVERLAY\",\n    \"CandidateRunArtifactIdentity\",\n",
          )

          # Runtime maps the resolved overlay to an actual ExecutionCostConfig.
          path = "trade_rl/evaluation/runs/execute.py"
          replace_once(
              path,
              "from dataclasses import dataclass\n\nfrom trade_rl.data.market import MarketDataset\n",
              "from dataclasses import dataclass, replace\n\nfrom trade_rl.data.market import MarketDataset\n",
          )
          replace_once(
              path,
              "from trade_rl.evaluation.runs.config import ResolvedCandidateRunSpec\n\n\n@dataclass",
              "from trade_rl.evaluation.runs.config import (\n    CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,\n    LEGACY_DATASET_EXECUTION_OVERLAY,\n    ResolvedCandidateRunSpec,\n)\nfrom trade_rl.simulation.execution import ExecutionCostConfig\n\n\ndef _execution_cost_for_overlay(execution_overlay: str) -> ExecutionCostConfig:\n    if execution_overlay == LEGACY_DATASET_EXECUTION_OVERLAY:\n        return ExecutionCostConfig.zero()\n    if execution_overlay == CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY:\n        return replace(\n            ExecutionCostConfig.zero(),\n            processing_bar_volume_capacity=False,\n        )\n    raise ValueError(f\"unsupported execution_overlay: {execution_overlay}\")\n\n\n@dataclass",
          )
          replace_once(
              path,
              "        execution_cost=None,\n        risk=None,\n",
              "        execution_cost=_execution_cost_for_overlay(spec.execution_overlay),\n        risk=None,\n",
          )

          # Controlled Run identity copies the resolved overlay instead of hard-coding legacy.
          path = "trade_rl/evaluation/experiments/contracts/run.py"
          replace_once(
              path,
              "            execution_overlay=\"zero_overlay_dataset_fields_authoritative\",\n",
              "            execution_overlay=spec.execution_overlay,\n",
          )

          # Candidate artifact reports the actual resolved execution environment.
          path = "trade_rl/evaluation/runs/artifact.py"
          replace_once(
              path,
              "            \"execution_overlay\": \"zero_overlay_dataset_fields_authoritative\",\n",
              "            \"execution_overlay\": spec.execution_overlay,\n",
          )

          # Study-owned evidence always reuses the frozen Study overlay.
          path = "trade_rl/evaluation/experiments/evidence.py"
          replace_once(
              path,
              "                dataset_artifact_digest=artifact.artifact_digest,\n                config=seed_config,\n            )\n",
              "                dataset_artifact_digest=artifact.artifact_digest,\n                config=seed_config,\n                execution_overlay=plan.baseline_config.execution_overlay,\n            )\n",
          )

          # Study creation owns the overlay; experiments cannot tune it.
          path = "trade_rl/evaluation/experiments/workflow.py"
          replace_once(
              path,
              "from trade_rl.evaluation.runs import (\n    CandidateRunConfig,\n",
              "from trade_rl.evaluation.runs import (\n    LEGACY_DATASET_EXECUTION_OVERLAY,\n    CandidateRunConfig,\n",
          )
          replace_once(
              path,
              "    n_bootstrap: int,\n    bootstrap_seed: int,\n) -> StudySnapshot:\n",
              "    n_bootstrap: int,\n    bootstrap_seed: int,\n    execution_overlay: str = LEGACY_DATASET_EXECUTION_OVERLAY,\n) -> StudySnapshot:\n",
          )
          replace_once(
              path,
              "            dataset_artifact_digest=artifact.artifact_digest,\n            config=baseline_config,\n        )\n",
              "            dataset_artifact_digest=artifact.artifact_digest,\n            config=baseline_config,\n            execution_overlay=execution_overlay,\n        )\n",
          )
          replace_once(
              path,
              "            dataset_artifact_digest=artifact.artifact_digest,\n            config=candidate_config,\n        )\n        resolved = ResolvedRunConfig.from_candidate_spec(spec)\n",
              "            dataset_artifact_digest=artifact.artifact_digest,\n            config=candidate_config,\n            execution_overlay=state.plan.baseline_config.execution_overlay,\n        )\n        resolved = ResolvedRunConfig.from_candidate_spec(spec)\n",
          )

          # Add calibrated Dataset materialization authority.
          materializer = Path(
              "trade_rl/evaluation/experiments/bootstrap/capacity_materialization.py"
          )
          materializer.write_text(
              '''"""Identity-only materialization for sealed aggTrades capacity calibration."""\n\nfrom __future__ import annotations\n\nimport hashlib\nimport json\nimport math\nfrom dataclasses import dataclass, replace\nfrom typing import cast\n\nimport numpy as np\n\nfrom trade_rl._validation import require_sha256\nfrom trade_rl.data.market import MarketDataset\n\n_AUTHORITY_SCHEMA = "aggtrades_capacity_calibration_authority_v1"\n_TRANSFORM_SCHEMA = "aggtrades_calibrated_capacity_dataset_transform_v1"\n_SYMBOLS = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT")\n_CAPS = (\n    0.0021629560553901974,\n    0.002044685341258238,\n    0.002184898995567895,\n    0.0020480213652913385,\n    0.002346308308284808,\n)\n_PROTOCOL_DIGEST = "5fb013fb0a3d717846a701b23d2f4bfca8e742ebaef0e6f564a331053f2ed071"\n_RESULT_DIGEST = "a5490f9209b16a8ba94f11506b83aa45ce44c7d61d13234480e2362f6df89809"\n_RESULT_JSON_SHA256 = "397004e6a1a9c3b30b32212066ac41366f7af74edc0ae23372f847e50c6c5a4e"\n_RESULT_ARTIFACT_ID = 10320428830\n_RESULT_ARTIFACT_API_DIGEST = "810e792636a696a0bc11e22ab53a21f378aaa0bfaeab8c3411123e9c6d9a5c35"\n_VERIFIER_RUN_ID = 34767391268\n_VERIFIER_ARTIFACT_ID = 10320394746\n_VERIFIER_ARTIFACT_API_DIGEST = "31702e68dddd9b4844eee6dc3b5b47ab4aa824d50200509a7bcdbf009c652bd1"\n\n\n@dataclass(frozen=True, slots=True)\nclass AggTradesCapacityAuthority:\n    symbols: tuple[str, ...]\n    symbol_caps: tuple[float, ...]\n    protocol_digest: str\n    result_digest: str\n    result_json_sha256: str\n    result_artifact_id: int\n    result_artifact_api_digest: str\n    verifier_run_id: int\n    verifier_artifact_id: int\n    verifier_artifact_api_digest: str\n    schema_version: str = _AUTHORITY_SCHEMA\n\n    def __post_init__(self) -> None:\n        for field, value in (\n            ("protocol_digest", self.protocol_digest),\n            ("result_digest", self.result_digest),\n            ("result_json_sha256", self.result_json_sha256),\n            ("result_artifact_api_digest", self.result_artifact_api_digest),\n            ("verifier_artifact_api_digest", self.verifier_artifact_api_digest),\n        ):\n            require_sha256(value, field=field)\n        if self.schema_version != _AUTHORITY_SCHEMA:\n            raise ValueError("unsupported calibrated capacity authority schema")\n        if self.symbols != _SYMBOLS:\n            raise ValueError("symbol roster differs from sealed capacity authority")\n        if self.symbol_caps != _CAPS:\n            raise ValueError("symbol caps differ from sealed capacity authority")\n        if len(self.symbol_caps) != len(self.symbols) or any(\n            not math.isfinite(value) or not 0.0 < value <= 0.05\n            for value in self.symbol_caps\n        ):\n            raise ValueError("sealed capacity caps are invalid")\n        frozen = (\n            (self.protocol_digest, _PROTOCOL_DIGEST),\n            (self.result_digest, _RESULT_DIGEST),\n            (self.result_json_sha256, _RESULT_JSON_SHA256),\n            (self.result_artifact_id, _RESULT_ARTIFACT_ID),\n            (self.result_artifact_api_digest, _RESULT_ARTIFACT_API_DIGEST),\n            (self.verifier_run_id, _VERIFIER_RUN_ID),\n            (self.verifier_artifact_id, _VERIFIER_ARTIFACT_ID),\n            (self.verifier_artifact_api_digest, _VERIFIER_ARTIFACT_API_DIGEST),\n        )\n        if any(actual != expected for actual, expected in frozen):\n            raise ValueError("capacity authority differs from sealed calibration evidence")\n\n    def to_payload(self) -> dict[str, object]:\n        return {\n            "schema_version": self.schema_version,\n            "symbols": list(self.symbols),\n            "symbol_caps": list(self.symbol_caps),\n            "protocol_digest": self.protocol_digest,\n            "result_digest": self.result_digest,\n            "result_json_sha256": self.result_json_sha256,\n            "result_artifact_id": self.result_artifact_id,\n            "result_artifact_api_digest": self.result_artifact_api_digest,\n            "verifier_run_id": self.verifier_run_id,\n            "verifier_artifact_id": self.verifier_artifact_id,\n            "verifier_artifact_api_digest": self.verifier_artifact_api_digest,\n        }\n\n\ndef canonical_aggtrades_capacity_authority() -> AggTradesCapacityAuthority:\n    return AggTradesCapacityAuthority(\n        symbols=_SYMBOLS,\n        symbol_caps=_CAPS,\n        protocol_digest=_PROTOCOL_DIGEST,\n        result_digest=_RESULT_DIGEST,\n        result_json_sha256=_RESULT_JSON_SHA256,\n        result_artifact_id=_RESULT_ARTIFACT_ID,\n        result_artifact_api_digest=_RESULT_ARTIFACT_API_DIGEST,\n        verifier_run_id=_VERIFIER_RUN_ID,\n        verifier_artifact_id=_VERIFIER_ARTIFACT_ID,\n        verifier_artifact_api_digest=_VERIFIER_ARTIFACT_API_DIGEST,\n    )\n\n\ndef _source_identity_payload(source: MarketDataset) -> dict[str, object]:\n    if source.identity_payload_json is None:\n        raise ValueError("source Dataset must have a verified content identity payload")\n    try:\n        decoded = cast(object, json.loads(source.identity_payload_json))\n    except json.JSONDecodeError as error:\n        raise ValueError("source Dataset identity payload is malformed") from error\n    if not isinstance(decoded, dict) or any(\n        not isinstance(key, str) for key in decoded\n    ):\n        raise ValueError("source Dataset identity payload must be a JSON object")\n    return cast(dict[str, object], decoded)\n\n\ndef build_aggtrades_calibrated_capacity_dataset(\n    source: MarketDataset,\n    *,\n    source_artifact_schema: str,\n    source_artifact_digest: str,\n    authority: AggTradesCapacityAuthority,\n) -> MarketDataset:\n    """Replace only Dataset participation-capacity authority and re-content-address."""\n\n    if tuple(source.symbols) != authority.symbols:\n        raise ValueError("source Dataset symbol roster differs from sealed capacity authority")\n    if not source_artifact_schema:\n        raise ValueError("source_artifact_schema must be non-empty")\n    require_sha256(source_artifact_digest, field="source_artifact_digest")\n    source_identity = _source_identity_payload(source)\n    source_identity_bytes = source.identity_payload_json.encode("utf-8")\n    cap_vector = np.asarray(authority.symbol_caps, dtype=np.float64)\n    cap_matrix = np.broadcast_to(cap_vector, (source.n_bars, source.n_symbols)).copy()\n    transformed = replace(\n        source,\n        max_participation_rate=cap_matrix,\n        identity_payload_json=None,\n    ).with_content_identity(\n        {\n            "source_dataset": {\n                "dataset_id": source.dataset_id,\n                "artifact_schema": source_artifact_schema,\n                "artifact_digest": source_artifact_digest,\n                "identity_payload_sha256": hashlib.sha256(\n                    source_identity_bytes\n                ).hexdigest(),\n                "identity_payload": source_identity,\n            },\n            "execution_capacity_calibration": authority.to_payload(),\n            "transformation": {\n                "schema_version": _TRANSFORM_SCHEMA,\n                "replaced_identity_array": "max_participation_rate",\n            },\n        }\n    )\n\n    source_arrays = source.identity_arrays()\n    transformed_arrays = transformed.identity_arrays()\n    if set(source_arrays) != set(transformed_arrays):\n        raise RuntimeError("Dataset identity-array roster changed during capacity transform")\n    for name, source_array in source_arrays.items():\n        candidate = transformed_arrays[name]\n        if source_array.dtype != candidate.dtype or source_array.shape != candidate.shape:\n            raise RuntimeError(f"Dataset identity-array shape/dtype drifted: {name}")\n        if name == "max_participation_rate":\n            if not np.array_equal(candidate, cap_matrix):\n                raise RuntimeError("calibrated participation array differs from sealed caps")\n        elif source_array.tobytes() != candidate.tobytes():\n            raise RuntimeError(f"non-cap Dataset identity array changed: {name}")\n    if transformed.dataset_id == source.dataset_id:\n        raise RuntimeError("calibrated Dataset identity did not change")\n    return transformed\n\n\n__all__ = [\n    "AggTradesCapacityAuthority",\n    "build_aggtrades_calibrated_capacity_dataset",\n    "canonical_aggtrades_capacity_authority",\n]\n''',
              encoding="utf-8",
          )
          PY
          uv run ruff format \
            trade_rl/evaluation/runs/config.py \
            trade_rl/evaluation/runs/__init__.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/experiments/contracts/run.py \
            trade_rl/evaluation/runs/artifact.py \
            trade_rl/evaluation/experiments/evidence.py \
            trade_rl/evaluation/experiments/workflow.py \
            trade_rl/evaluation/experiments/bootstrap/capacity_materialization.py
      - name: Static checks
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
      - name: Targeted GREEN and compatibility tests
        run: >-
          uv run pytest -q
          tests/evaluation/test_execution_overlay_authority.py
          tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
          tests/evaluation/test_candidate_run_execute.py
          tests/evaluation/test_candidate_run_config.py
          tests/evaluation/experiments/test_evidence.py
          tests/evaluation/experiments/test_workflow.py
          tests/evaluation/experiments/bootstrap/test_workflow.py
      - name: Commit production GREEN only after verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add trade_rl
          git diff --cached --check
          git commit -m "feat: bind calibrated causal execution identities"
          git push origin HEAD:research/issue539-calibrated-causal-study
