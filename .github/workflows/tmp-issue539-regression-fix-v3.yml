name: Temporary Issue 539 compatibility regression fix v3

on:
  push:
    branches:
      - research/issue539-calibrated-causal-study
    paths:
      - .github/workflows/tmp-issue539-regression-fix-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue539-calibrated-causal-study
          persist-credentials: true
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Apply minimal compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          facade = Path("trade_rl/evaluation/runs/__init__.py")
          text = facade.read_text(encoding="utf-8")
          old_import = (
              "from trade_rl.evaluation.runs.config import (\n"
              "    CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,\n"
              "    LEGACY_DATASET_EXECUTION_OVERLAY,\n"
              "    CandidateRunConfig,\n"
          )
          new_import = (
              "from trade_rl.evaluation.runs.config import (\n"
              "    CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY as CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY,\n"
              "    LEGACY_DATASET_EXECUTION_OVERLAY as LEGACY_DATASET_EXECUTION_OVERLAY,\n"
              "    CandidateRunConfig,\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit("runs facade import anchor drifted")
          text = text.replace(old_import, new_import)
          for line in (
              '    "CAUSAL_PREVIOUS_BAR_CAPACITY_EXECUTION_OVERLAY",\n',
              '    "LEGACY_DATASET_EXECUTION_OVERLAY",\n',
          ):
              if text.count(line) != 1:
                  raise SystemExit(f"expected one facade __all__ entry: {line!r}")
              text = text.replace(line, "")
          facade.write_text(text, encoding="utf-8")

          artifact = Path("trade_rl/evaluation/runs/artifact.py")
          text = artifact.read_text(encoding="utf-8")
          import_anchor = "from trade_rl.evaluation.runs.execute import CandidateRunResult\n"
          import_replacement = (
              "from trade_rl.evaluation.runs.config import "
              "LEGACY_DATASET_EXECUTION_OVERLAY\n"
              "from trade_rl.evaluation.runs.execute import CandidateRunResult\n"
          )
          if text.count(import_anchor) != 1:
              raise SystemExit("candidate-run artifact import anchor drifted")
          text = text.replace(import_anchor, import_replacement)
          old = '            "execution_overlay": spec.execution_overlay,\n'
          new = (
              '            "execution_overlay": getattr(\n'
              '                spec, "execution_overlay", LEGACY_DATASET_EXECUTION_OVERLAY\n'
              '            ),\n'
          )
          if text.count(old) != 1:
              raise SystemExit("execution_overlay summary anchor drifted")
          artifact.write_text(text.replace(old, new), encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/runs/__init__.py trade_rl/evaluation/runs/artifact.py
      - name: Verify regressions and overlay contract
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run pytest -q \
            tests/architecture/test_runs_capability_facade.py \
            tests/evaluation/test_candidate_run_observation_contract.py \
            tests/evaluation/test_execution_overlay_authority.py \
            tests/evaluation/test_candidate_run_execute.py \
            tests/evaluation/experiments/test_execution_overlay_study_freeze.py \
            tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
      - name: Commit repair only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git add trade_rl/evaluation/runs/__init__.py trade_rl/evaluation/runs/artifact.py
          git diff --cached --check
          git commit -m "fix: preserve candidate-run compatibility with execution overlays"
          git push origin HEAD:research/issue539-calibrated-causal-study
