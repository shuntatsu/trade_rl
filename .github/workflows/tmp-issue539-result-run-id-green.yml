name: Temporary Issue 539 publisher run GREEN

on:
  push:
    branches:
      - verify/issue539-result-run-id-green
    paths:
      - .github/workflows/tmp-issue539-result-run-id-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check trade_rl/evaluation/experiments/bootstrap/capacity_materialization.py tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
      - run: uv run ruff format --check trade_rl/evaluation/experiments/bootstrap/capacity_materialization.py tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
      - run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_calibrated_capacity_materialization.py
