name: Temporary Issue 541 apply corrected authority v5

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-apply-authority-v5.yml

permissions:
  contents: write

env:
  EXPECTED_CODE_BLOB: b93244ae8876d76e58282cecfc8b6838d2db70fb
  EXPECTED_TEST_BLOB: 98f481ce1b48cbfcfe8ef5559962ed4aa4cc3191

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          fetch-depth: 1
      - name: Guard exact old contract and replay corrected authority patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py)" = "$EXPECTED_CODE_BLOB"
          test "$(git hash-object tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py)" = "$EXPECTED_TEST_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/tmp-issue541-correct-authority-v3.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(textwrap.dedent(workflow[start:end]), '<issue541-authority-patch>', 'exec'))

          test_path = Path('tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py')
          text = test_path.read_text()
          stale = '        {"successor_identity_index_digest": "0" * 64},\n'
          if text.count(stale) != 1:
              raise SystemExit('stale semantic-drift mutation missing or duplicated')
          text = text.replace(stale, '')
          needle = '''    tampered = dict(payload)\n    tampered["successor_total_returns"] = {"lightgbm24": [1.0] * 5}\n    path.write_text(json.dumps(tampered), encoding="utf-8")\n    with pytest.raises(ValueError, match="keys differ"):\n        load_capacity_robustness_protocol(path)\n'''
          replacement = needle + '''\n    legacy = dict(payload)\n    legacy["successor_identity_index_digest"] = "0" * 64\n    path.write_text(json.dumps(legacy), encoding="utf-8")\n    with pytest.raises(ValueError, match="keys differ"):\n        load_capacity_robustness_protocol(path)\n'''
          if text.count(needle) != 1:
              raise SystemExit('strict payload tamper oracle drifted')
          test_path.write_text(text.replace(needle, replacement))
          PY
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Format and verify corrected contract
        shell: bash
        run: |
          set -euo pipefail
          files=(trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py)
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run mypy trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Commit only corrected production contract and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          test "$(git diff --cached --name-only | wc -l)" = "2"
          git diff --cached --check
          git commit -m 'research: bind corrected capacity successor authority'
          git push origin HEAD:research/issue541-capacity-robustness-prereg
