name: Temporary Issue 541 preregistration falsification

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-falsify.yml

permissions:
  contents: write

jobs:
  falsify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Add adversarial authority mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py")
          text = path.read_text(encoding="utf-8")
          anchor = '        {"source_eligibility_digest": "0" * 64},\n'
          insert = (
              '        {"source_eligibility_digest": "0" * 64},\n'
              '        {"source_implementation_sha": "0" * 40},\n'
              '        {"source_runtime_environment_digest": "0" * 64},\n'
              '        {"capacity_result_digest": "0" * 64},\n'
              '        {"capacity_result_artifact_id": 1},\n'
              '        {"capacity_verifier_artifact_digest": "0" * 64},\n'
              '        {"successor_bundle_artifact_id": 1},\n'
              '        {"successor_identity_index_digest": "0" * 64},\n'
              '        {\n'
              '            "successor_execution_overlay":\n'
              '                "zero_overlay_dataset_fields_authoritative"\n'
              '        },\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit("authority mutation anchor drifted")
          text = text.replace(anchor, insert)
          anchor2 = '        {"stage_a_required": False},\n'
          insert2 = (
              '        {"stage_a_required": False},\n'
              '        {"integration_gates": ("pr_531_merged",)},\n'
              '        {"stage_a_failure_status": "KEEP_GOING"},\n'
              '        {"robust_positive_requires_positive_median": False},\n'
              '        {"experiment_0004_issue": 1},\n'
              '        {\n'
              '            "source_core_total_returns": (\n'
              '                ("trend", (-0.4, -0.6, -0.6, -0.6, -0.6)),\n'
              '                *protocol.source_core_total_returns[1:],\n'
              '            )\n'
              '        },\n'
          )
          if text.count(anchor2) != 1:
              raise SystemExit("decision mutation anchor drifted")
          path.write_text(text.replace(anchor2, insert2), encoding="utf-8")
          PY
          uv run ruff format tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Run adversarial contract oracle
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Commit stronger oracle only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          git diff --cached --check
          git commit -m "test: strengthen capacity robustness preregistration falsification"
          git push origin HEAD:research/issue541-capacity-robustness-prereg
