name: Temporary Issue 541 fix authority runner guard

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-fix-authority-runner.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          fetch-depth: 1
      - name: Replace self-invalidating HEAD guard with contract blob guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/tmp-issue541-correct-authority-v2.yml')
          text=path.read_text()
          old='''env:\n  EXPECTED_HEAD: 20d5a2b9550d899f1ad07e5527050315bc8ef80e\n'''
          new='''env:\n  EXPECTED_CODE_BLOB: b93244ae8876d76e58282cecfc8b6838d2db70fb\n  EXPECTED_TEST_BLOB: 98f481ce1b48cbfcfe8ef5559962ed4aa4cc3191\n'''
          if text.count(old)!=1: raise SystemExit('env guard block drifted')
          text=text.replace(old,new)
          old='''      - name: Refuse concurrent branch drift\n        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"\n'''
          new='''      - name: Refuse concurrent contract drift\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$(git hash-object trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py)" = "$EXPECTED_CODE_BLOB"\n          test "$(git hash-object tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py)" = "$EXPECTED_TEST_BLOB"\n'''
          if text.count(old)!=1: raise SystemExit('HEAD guard step drifted')
          path.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/tmp-issue541-correct-authority-v2.yml
          git commit -m 'ci: make Issue 541 authority guard contract-specific'
          git push origin HEAD:research/issue541-capacity-robustness-prereg
