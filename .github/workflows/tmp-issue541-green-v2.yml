name: Temporary Issue 541 preregistration GREEN v2

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-green-v2.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Remove unused validator assignments without changing calls
        run: |
          uv run ruff check --fix --unsafe-fixes \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py \
            tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Static and targeted verification
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Commit production normalization only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py \
            tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no normalization changes"
            exit 0
          fi
          git commit -m "style: normalize capacity robustness preregistration"
          git push origin HEAD:research/issue541-capacity-robustness-prereg
