name: Temporary Issue 541 preregistration GREEN v4

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-green-v4.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          persist-credentials: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Apply mechanical normalization and semantic-drift classification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix --unsafe-fixes \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py")
          text = path.read_text(encoding="utf-8")
          old_bool = "        for field, value in bool_fields:\n            _boolean(value, field=field)\n"
          new_bool = "        for bool_field, bool_value in bool_fields:\n            _boolean(bool_value, field=bool_field)\n"
          old_count = "        for field, value in count_fields:\n            _positive_int(value, field=field)\n"
          new_count = "        for count_field, count_value in count_fields:\n            _positive_int(count_value, field=count_field)\n"
          if old_bool in text:
              text = text.replace(old_bool, new_bool)
          if old_count in text:
              text = text.replace(old_count, new_count)
          old_message = 'raise ValueError("source return strategy roster must match core_strategies")'
          new_message = 'raise ValueError("source return strategy roster differs from preregistered core_strategies")'
          if text.count(old_message) != 1:
              raise SystemExit("source-return roster error anchor drifted")
          text = text.replace(old_message, new_message)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py \
            tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Static and targeted verification
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Commit production normalization only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py \
            tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          git diff --cached --check
          git commit -m "fix: classify capacity preregistration semantic drift consistently"
          git push origin HEAD:research/issue541-capacity-robustness-prereg
