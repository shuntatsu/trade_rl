name: Temporary Issue 541 post-integration preflight

on:
  push:
    branches:
      - verify/issue541-postintegration-preflight

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  MAIN_SHA: c5a1ce8395feaedd8833f7e596fddc9d8f3115fc
  MAIN_TREE: 107b2f65c2ddd8ec41a4fc91939fbc96eeda7b44
  MAIN_CI_RUN: "34811335706"
  SOURCE_RUN: "34700123151"
  SOURCE_ID: "10301701698"
  SOURCE_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a
  SEAL_RUN: "34804388022"
  SEAL_ID: "10332098428"
  SEAL_DIGEST: sha256:69f3c2b30bb85591483e8a3a77e69a489affdaafa5d57a6be96dcbb24edf348e
  SEAL_FRESH_ID: "10332916765"
  SEAL_FRESH_DIGEST: sha256:7675c0dc02a58f74c1c84080dd86eb74b4b3d118662c0099675d40025ce3ca6f
  SUCCESSOR_RUN: "34803217815"
  SUCCESSOR_ID: "10331899302"
  SUCCESSOR_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  SUCCESSOR_FRESH_RUN: "34803432434"
  SUCCESSOR_FRESH_ID: "10332575500"
  SUCCESSOR_FRESH_DIGEST: sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589
  PROTOCOL_DIGEST: 11bf254c262aff9daef620a18b80badb40c6ffc239566b88fe70442ebaf54dc8

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.MAIN_SHA }}
          persist-credentials: false
      - name: Verify current main tree and merged dependency order
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MAIN_TREE"
          for pr in 531 540 542; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/$pr" > "/tmp/pr-$pr.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              531: 'fd681e72134f249df133a0c18fdd8789128c186c',
              540: 'b1062a6d738989ce4babebf49ec16e01c9984028',
              542: 'c5a1ce8395feaedd8833f7e596fddc9d8f3115fc',
          }
          times = []
          for pr in (531, 540, 542):
              x = json.loads(Path(f'/tmp/pr-{pr}.json').read_text())
              assert x['merged'] is True
              assert x['merge_commit_sha'] == expected[pr]
              assert x['merged_at']
              times.append(x['merged_at'])
          assert times == sorted(times) and len(set(times)) == 3
          PY
      - name: Verify final-main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${MAIN_CI_RUN}")"
          META="$meta" python3 - <<'PY'
          import json, os
          x = json.loads(os.environ['META'])
          assert x['name'] == 'CI'
          assert x['event'] == 'push'
          assert x['head_branch'] == 'main'
          assert x['head_sha'] == os.environ['MAIN_SHA']
          assert x['status'] == 'completed'
          assert x['conclusion'] == 'success'
          PY
      - name: Reverify sealed authorities by API digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          checks = [
              ('SOURCE_ID','SOURCE_DIGEST','SOURCE_RUN','SOURCE_NAME'),
              ('SEAL_ID','SEAL_DIGEST','SEAL_RUN','SEAL_NAME'),
              ('SEAL_FRESH_ID','SEAL_FRESH_DIGEST','SEAL_RUN','SEAL_FRESH_NAME'),
              ('SUCCESSOR_ID','SUCCESSOR_DIGEST','SUCCESSOR_RUN','SUCCESSOR_NAME'),
              ('SUCCESSOR_FRESH_ID','SUCCESSOR_FRESH_DIGEST','SUCCESSOR_FRESH_RUN','SUCCESSOR_FRESH_NAME'),
          ]
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          out = []
          for id_key, digest_key, run_key, name_key in checks:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts/{os.environ[id_key]}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  x = json.load(response)
              assert x['id'] == int(os.environ[id_key])
              assert x['digest'] == os.environ[digest_key]
              assert x['workflow_run']['id'] == int(os.environ[run_key])
              assert x['expired'] is False
              out.append((name_key, x['name']))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in out:
                  handle.write(f'{key}={value}\n')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_NAME }}
          path: /tmp/issue541-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SUCCESSOR_NAME }}
          path: /tmp/issue541-successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SUCCESSOR_RUN }}
      - name: Inspect plan/config structure only
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOURCE_PATHS_BEGIN'
          find /tmp/issue541-source -maxdepth 6 -type f -printf '%P\n' | sort | head -400
          echo 'SOURCE_PATHS_END'
          echo 'SUCCESSOR_PATHS_BEGIN'
          find /tmp/issue541-successor -maxdepth 6 -type f -printf '%P\n' | sort | head -400
          echo 'SUCCESSOR_PATHS_END'
          echo 'CONFIG_PATHS_BEGIN'
          find /tmp/issue541-source /tmp/issue541-successor -type f \( -iname '*config*.json' -o -iname 'study.json' -o -iname 'plan.json' -o -iname 'manifest.json' \) -printf '%p\n' | sort
          echo 'CONFIG_PATHS_END'
      - name: Seal post-integration authorization without PnL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue541-gate
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          body = {
              'schema_version': 'calibrated_capacity_postintegration_gate_v1',
              'protocol_digest': os.environ['PROTOCOL_DIGEST'],
              'main_sha': os.environ['MAIN_SHA'],
              'main_tree': os.environ['MAIN_TREE'],
              'main_ci_run': int(os.environ['MAIN_CI_RUN']),
              'integration_gate_satisfied': True,
              'execution_authorized': True,
              'stage_a_executed': False,
              'stage_b_executed': False,
              'successor_pnl_inspected': False,
              'source_artifact_id': int(os.environ['SOURCE_ID']),
              'successor_artifact_id': int(os.environ['SUCCESSOR_ID']),
              'v3_seal_artifact_id': int(os.environ['SEAL_ID']),
              'v3_fresh_verifier_artifact_id': int(os.environ['SEAL_FRESH_ID']),
          }
          encoded = json.dumps(body, allow_nan=False, sort_keys=True, separators=(',', ':')).encode()
          out = {**body, 'content_digest': hashlib.sha256(encoded).hexdigest()}
          Path('/tmp/issue541-gate/gate.json').write_text(json.dumps(out, sort_keys=True, indent=2) + '\n')
          print(json.dumps(out, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue541-postintegration-gate-${{ github.run_id }}
          path: /tmp/issue541-gate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
