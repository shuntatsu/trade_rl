name: Temporary Issue 541 Stage A format v2

on:
  push:
    branches:
      - tmp/issue541-stage-a-format-v2
    paths:
      - .github/workflows/tmp-issue541-stage-a-format-v2.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue541-stage-a-format-v2
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format exact Stage A verifier files
        run: |
          set -euo pipefail
          uv run ruff format tools/issue541_stage_a.py tests/research/test_issue541_stage_a_bridge_context.py
          uv run ruff check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py tests/research/test_issue541_stage_a_bridge_context.py
          uv run ruff format --check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py tests/research/test_issue541_stage_a_bridge_context.py
          changed="$(git diff --name-only)"
          test "$changed" = $'tests/research/test_issue541_stage_a_bridge_context.py\ntools/issue541_stage_a.py' || test "$changed" = $'tools/issue541_stage_a.py\ntests/research/test_issue541_stage_a_bridge_context.py'
      - name: Commit formatter output only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/issue541_stage_a.py tests/research/test_issue541_stage_a_bridge_context.py
          git commit -m 'style: format Issue 541 Stage A bridge verifier v2'
          git push origin HEAD:tmp/issue541-stage-a-format-v2
