name: Temporary Issue 541 Stage A formatter

on:
  push:
    branches:
      - tmp/issue541-stage-a-format
    paths:
      - .github/workflows/tmp-issue541-stage-a-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue541-stage-a-format
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
      - run: uv run ruff check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
      - run: uv run ruff format --check tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
      - run: uv run pytest -q tests/research/test_issue541_stage_a.py
      - name: Commit formatter-only output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/issue541_stage_a.py tests/research/test_issue541_stage_a.py
          test "$(git diff --cached --name-only | sort | paste -sd ' ' -)" = "tests/research/test_issue541_stage_a.py tools/issue541_stage_a.py"
          git commit -m 'style: format Issue 541 Stage A oracle'
          git push origin HEAD:tmp/issue541-stage-a-format
