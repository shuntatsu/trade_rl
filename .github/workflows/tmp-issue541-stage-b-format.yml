name: Temporary Issue 541 Stage B Format

on:
  push:
    branches:
      - tmp/issue541-stage-b-format
    paths:
      - .github/workflows/tmp-issue541-stage-b-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue541-stage-b-format
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format exact Stage B oracle files
        run: |
          set -euo pipefail
          uv run ruff format tests/research/test_issue541_stage_b.py tools/issue541_stage_b.py
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" = "2"
          test "${changed[0]}" = "tests/research/test_issue541_stage_b.py"
          test "${changed[1]}" = "tools/issue541_stage_b.py"
          uv run ruff check tests/research/test_issue541_stage_b.py tools/issue541_stage_b.py
          uv run ruff format --check tests/research/test_issue541_stage_b.py tools/issue541_stage_b.py
          uv run pytest -q tests/research/test_issue541_stage_b.py
      - name: Commit formatter output only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/research/test_issue541_stage_b.py tools/issue541_stage_b.py
          git diff --cached --quiet && exit 1
          git commit -m 'style: format Issue 541 Stage B oracle'
          git push origin HEAD:tmp/issue541-stage-b-format
