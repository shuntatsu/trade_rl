name: Temporary Issue 541 Stage B preflight

on:
  push:
    branches:
      - verify/issue541-stage-b-preflight
    paths:
      - .github/workflows/tmp-issue541-stage-b-preflight.yml

permissions:
  actions: read
  contents: read

env:
  MAIN_SHA: c5a1ce8395feaedd8833f7e596fddc9d8f3115fc
  MAIN_CI_RUN_ID: "34811335706"
  PROTOCOL_DIGEST: 11bf254c262aff9daef620a18b80badb40c6ffc239566b88fe70442ebaf54dc8
  STAGE_A_RUN_ID: "34822673531"
  STAGE_A_FRESH_ID: "10342318209"
  STAGE_A_FRESH_NAME: issue541-stage-a-fresh-v7-34822673531
  STAGE_A_FRESH_DIGEST: sha256:c8e4f39d10cbbfc47e8a0b44f466e055ec4a78e9001b331d270b3723a376252e
  SUCCESSOR_RUN_ID: "34803217815"
  SUCCESSOR_ID: "10331899302"
  SUCCESSOR_NAME: issue539-calibrated-causal-successor-v3-34803217815
  SUCCESSOR_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  SUCCESSOR_FRESH_RUN_ID: "34803432434"
  SUCCESSOR_FRESH_ID: "10332575500"
  SUCCESSOR_FRESH_DIGEST: sha256:2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589
  SOURCE_ELIG_RUN_ID: "34794576828"
  SOURCE_ELIG_ID: "10329551558"
  SOURCE_ELIG_DIGEST: sha256:907599e2330e52fe832872b3b11a5f0ad62316fe4a170acd4453ab39ba1a0800

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind current main and prior authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_CI_RUN_ID --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_A_RUN_ID --jq .conclusion)" = success
          git diff --exit-code "$MAIN_SHA" -- trade_rl pyproject.toml uv.lock

          verify_artifact() {
            local id="$1" digest="$2" run="$3" name="${4:-}"
            local p
            p="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .digest <<<"$p")" = "$digest"
            test "$(jq -r .workflow_run.id <<<"$p")" = "$run"
            test "$(jq -r .expired <<<"$p")" = false
            if [ -n "$name" ]; then test "$(jq -r .name <<<"$p")" = "$name"; fi
          }
          verify_artifact "$STAGE_A_FRESH_ID" "$STAGE_A_FRESH_DIGEST" "$STAGE_A_RUN_ID" "$STAGE_A_FRESH_NAME"
          verify_artifact "$SUCCESSOR_ID" "$SUCCESSOR_DIGEST" "$SUCCESSOR_RUN_ID" "$SUCCESSOR_NAME"
          verify_artifact "$SUCCESSOR_FRESH_ID" "$SUCCESSOR_FRESH_DIGEST" "$SUCCESSOR_FRESH_RUN_ID"
          verify_artifact "$SOURCE_ELIG_ID" "$SOURCE_ELIG_DIGEST" "$SOURCE_ELIG_RUN_ID"

      - name: Download Stage A fresh authorization
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.STAGE_A_FRESH_NAME }}
          path: /tmp/stage-a-auth
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.STAGE_A_RUN_ID }}

      - name: Download successor bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SUCCESSOR_NAME }}
          path: /tmp/successor
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.SUCCESSOR_RUN_ID }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true

      - name: Install frozen research environment
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3

      - name: Validate PRE-P&L Stage B boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage-b-preflight
          uv run python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import numpy as np
          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact
          from trade_rl.evaluation.experiments import inspect_study
          from trade_rl.evaluation.experiments.bootstrap.capacity_robustness_prereg import canonical_capacity_robustness_protocol
          from trade_rl.evaluation.runs import build_candidate_run_provenance, execution_cost_for_overlay

          protocol=canonical_capacity_robustness_protocol()
          assert protocol.digest==os.environ['PROTOCOL_DIGEST']
          assert protocol.source_profitable_core_strategies==()
          assert protocol.pre_successor_suite_status=='NO_PROFITABLE_CORE_BASELINE'
          assert protocol.stage_b_role=='diagnostic_only'

          auth_path=next(Path('/tmp/stage-a-auth').glob('*.json'))
          auth=json.loads(auth_path.read_text(encoding='utf-8'))
          expected={
              'main_sha':os.environ['MAIN_SHA'],
              'protocol_digest':os.environ['PROTOCOL_DIGEST'],
              'stage_a_execution_count':1,
              'stage_a_executed':True,
              'stage_a_passed':True,
              'fresh_runner_reverified_published_artifact':True,
              'stage_b_execution_authorized':True,
              'successor_pnl_inspected':False,
          }
          for key,value in expected.items():
              assert auth.get(key)==value, (key,auth.get(key),value)

          dataset_root=Path('/tmp/successor/dataset')
          study_root=Path('/tmp/successor/study')
          artifact=inspect_published_market_dataset_artifact(dataset_root)
          dataset=load_market_dataset_artifact(dataset_root)
          study=inspect_study(study_root)
          plan_payload=json.loads((study_root/'plan.json').read_text(encoding='utf-8'))

          assert dataset.dataset_id==protocol.successor_dataset_id
          assert artifact.artifact_digest==protocol.successor_dataset_artifact_digest
          assert content_digest(plan_payload)==protocol.successor_study_digest
          assert tuple(dataset.symbols)==protocol.symbols
          assert study.baseline is None
          assert not study.experiment_sequences
          assert study.frozen is False
          assert plan_payload['baseline_config']['execution_overlay']==protocol.successor_execution_overlay
          assert plan_payload['runtime_environment_digest']==protocol.successor_runtime_environment_digest

          caps=np.asarray(dataset.resolved_array('max_participation_rate'),dtype=np.float64)
          expected_caps=np.broadcast_to(np.asarray(protocol.capacity_caps,dtype=np.float64),(dataset.n_bars,len(protocol.symbols)))
          assert np.array_equal(caps,expected_caps)
          execution=execution_cost_for_overlay(protocol.successor_execution_overlay)
          assert execution.processing_bar_volume_capacity is False

          provenance=build_candidate_run_provenance(research_context_digest='0'*64)
          assert provenance['runtime_environment_digest']==protocol.successor_runtime_environment_digest
          assert provenance['implementation_digest']==plan_payload['implementation_digest']

          index_path=Path('/tmp/successor/successor-index.json')
          assert hashlib.sha256(index_path.read_bytes()).hexdigest()==protocol.successor_materialization_index_sha256

          report={
              'schema_version':'issue541_stage_b_preflight_v1',
              'main_sha':os.environ['MAIN_SHA'],
              'protocol_digest':protocol.digest,
              'stage_a_authorized':True,
              'source_profitable_core_strategies':list(protocol.source_profitable_core_strategies),
              'pre_successor_suite_status':protocol.pre_successor_suite_status,
              'stage_b_role':protocol.stage_b_role,
              'successor_dataset_id':dataset.dataset_id,
              'successor_dataset_artifact_digest':artifact.artifact_digest,
              'successor_study_digest':content_digest(plan_payload),
              'successor_execution_overlay':protocol.successor_execution_overlay,
              'processing_bar_volume_capacity':execution.processing_bar_volume_capacity,
              'capacity_caps_exact':True,
              'runtime_environment_digest':provenance['runtime_environment_digest'],
              'implementation_digest':provenance['implementation_digest'],
              'baseline_absent':True,
              'stage_b_execution_performed':False,
              'successor_pnl_inspected':False,
              'production_eligible':False,
              'live_trading_authorized':False,
          }
          report['content_digest']=content_digest(report)
          Path('/tmp/stage-b-preflight/preflight.json').write_text(json.dumps(report,sort_keys=True,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          PY

      - name: Upload preflight authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue541-stage-b-preflight-${{ github.run_id }}
          path: /tmp/stage-b-preflight/preflight.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
