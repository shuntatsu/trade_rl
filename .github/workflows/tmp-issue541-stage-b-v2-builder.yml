name: Temporary Issue 541 Stage B v2 Builder

on:
  push:
    branches:
      - tmp/issue541-stage-b-v2-builder
    paths:
      - .github/workflows/tmp-issue541-stage-b-v2-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue541-stage-b-v2-builder
      - name: Build corrected v2 from frozen v1 without touching research code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue541-stage-b-formal-v1.yml')
          target = Path('.github/workflows/issue541-stage-b-formal-v2.yml')
          text = source.read_text(encoding='utf-8')
          text = text.replace('name: Issue 541 Stage B one-shot v1', 'name: Issue 541 Stage B one-shot v2', 1)
          text = text.replace(
              '.workflow_runs[] | select(.path==".github/workflows/issue541-stage-b-formal-v1.yml") | .id',
              '.workflow_runs[] | select(.path==".github/workflows/issue541-stage-b-formal-v2.yml") | .id',
              1,
          )
          guard = '          test "$(jq -r \'.[0]\' <<<"$ids")" = "$GITHUB_RUN_ID"\n'
          proof = '''          test "$(jq -r '.[0]' <<<"$ids")" = "$GITHUB_RUN_ID"\n          prior_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34835000848/jobs?per_page=100")"\n          test "$(jq -r '.jobs[] | .steps[]? | select(.name=="Execute successor baseline exactly once with full capacity audit") | .conclusion' <<<"$prior_jobs")" = "skipped"\n          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/34835000848/artifacts" --jq .total_count)" = "0"\n'''
          if guard not in text:
              raise SystemExit('one-shot guard anchor not found')
          text = text.replace(guard, proof, 1)

          old = '''          verified=json.loads(next(Path('/tmp/successor-verify').glob('*.json')).read_text())\n          if verified.get('status') not in ('PASS','VERIFIED'):\n              raise RuntimeError('successor fresh verification status is not successful')\n'''
          new = '''          verified=json.loads(Path('/tmp/successor-verify/fresh-verification.json').read_text())\n          expected_verified={\n              'source_bundle_run_id':int(os.environ['SUCCESSOR_RUN_ID']),\n              'source_bundle_artifact_id':int(os.environ['SUCCESSOR_ID']),\n              'source_bundle_artifact_digest':os.environ['SUCCESSOR_DIGEST'],\n              'calibration_publisher_run_bound':True,\n              'fresh_runner_reconstructed_from_source':True,\n              'byte_level_tree_identity_verified':True,\n              'baseline_present':False,\n              'experiment_count':0,\n              'pnl_executed':False,\n              'returns_inspected':False,\n              'final_test_authorized':False,\n              'production_authorized':False,\n              'pre_pnl_identity_authorized':True,\n          }\n          for key,value in expected_verified.items():\n              if verified.get(key)!=value: raise RuntimeError(f'successor fresh verification drift: {key}')\n'''
          if old not in text:
              raise SystemExit('fresh-verifier validation anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('issue541-stage-b-raw-v1-${GITHUB_RUN_ID}', 'issue541-stage-b-raw-v2-${GITHUB_RUN_ID}')
          text = text.replace('issue541-stage-b-preverify-v1-${GITHUB_RUN_ID}', 'issue541-stage-b-preverify-v2-${GITHUB_RUN_ID}')
          text = text.replace('issue541-stage-b-fresh-v1-${GITHUB_RUN_ID}', 'issue541-stage-b-fresh-v2-${GITHUB_RUN_ID}')
          target.write_text(text, encoding='utf-8')
          PY
          test -f .github/workflows/issue541-stage-b-formal-v2.yml
          grep -F 'fresh_runner_reconstructed_from_source' .github/workflows/issue541-stage-b-formal-v2.yml
          ! grep -F "verified.get('status')" .github/workflows/issue541-stage-b-formal-v2.yml
          grep -F 'actions/runs/34835000848/artifacts' .github/workflows/issue541-stage-b-formal-v2.yml
          git rm .github/workflows/tmp-issue541-stage-b-v2-builder.yml
      - name: Commit only corrected v2 and remove builder
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/issue541-stage-b-formal-v2.yml .github/workflows/tmp-issue541-stage-b-v2-builder.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" = "2"
          test "${changed[0]}" = ".github/workflows/issue541-stage-b-formal-v2.yml"
          test "${changed[1]}" = ".github/workflows/tmp-issue541-stage-b-v2-builder.yml"
          git commit -m 'research: prepare Issue 541 Stage B one-shot v2'
          git push origin HEAD:tmp/issue541-stage-b-v2-builder
