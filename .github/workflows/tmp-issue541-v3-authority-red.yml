name: Temporary Issue 541 v3 authority RED

on:
  push:
    branches:
      - verify/issue541-v3-authority-red
    paths:
      - .github/workflows/tmp-issue541-v3-authority-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Expect final-authority oracle to fail on v2
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg_v3_authority.py
          rc=$?
          set -e
          test "$rc" -ne 0
