name: Temporary Issue 541 v3 finalize v2

on:
  push:
    branches:
      - research/issue541-capacity-robustness-prereg
    paths:
      - .github/workflows/tmp-issue541-v3-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue541-capacity-robustness-prereg
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current Issue 539 base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shuntatsu"
          git config user.email "148511409+shuntatsu@users.noreply.github.com"
          git fetch origin research/issue539-calibrated-causal-study
          test "$(git rev-parse origin/research/issue539-calibrated-causal-study)" = "3e111a59153b7353e26080bd569b9775190577be"
          git merge --no-edit origin/research/issue539-calibrated-causal-study
      - name: Apply exact v3 authority patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          prod = Path('trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py')
          text = prod.read_text(encoding='utf-8')
          replacements = {
              'calibrated_capacity_robustness_prereg_v2': 'calibrated_capacity_robustness_prereg_v3',
              '_CAPACITY_RESULT_ARTIFACT_ID = 10320428830': '_CAPACITY_RESULT_RUN_ID = 34766830666\n_CAPACITY_RESULT_ARTIFACT_ID = 10320428830',
              '_IDENTITY_LAYER_HEAD_SHA = "15bf6546996dc969d4d6e946261d73e3d43336e6"': '_IDENTITY_LAYER_HEAD_SHA = "3e111a59153b7353e26080bd569b9775190577be"',
              '_IDENTITY_LAYER_CI_RUN_ID = 34793925990': '_IDENTITY_LAYER_CI_RUN_ID = 34803217815',
              '_SUCCESSOR_BUNDLE_RUN_ID = 34794384559': '_SUCCESSOR_BUNDLE_RUN_ID = 34803217815',
              '_SUCCESSOR_BUNDLE_ARTIFACT_ID = 10329107309': '_SUCCESSOR_BUNDLE_ARTIFACT_ID = 10331899302',
              '"6e8bff792fb905bf93fbf591e2c9cf18c2b28e6a1396f4e1a88562e83a65986d"': '"89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce"',
              '"6a9d6066fe8f92d46fe57a1d8172a60092568e625b2e843dc7a0c3930d79de86"': '"6c0b040d317a1bb73a9273f4135879b31691634aa837f30f0eec005ac7531518"',
              '"9a3f01bc4608c256b5c448e5cee123c4653fe02060040dc7909b4eb1c6c3e30f"': '"af481dd978db7d84cd3aa8ff4f5a35d8608ac44c755dd74f61e934105c02b6b7"',
              '"baaf25c93f37e409220d4413ddd9216c2afbf29ba1ce344310d43d7efa74e7eb"': '"bfa2fcb307773f5384d7dcb884444164d6d3b575373d8f7dc1c810a61bf4c820"',
              '"3bd6964426f983c8726a26dd1298df785726c9b66771e445253b38a8bb3dc9af"': '"2dd187a2cf4634e1c902f58592a15b4942127190a9eee16e0efe004da8a470f0"',
              '"a579b72e93d39b59fe1e232fd658bbc016fdecf4b5da6c683080ed2b5ea49bcc"': '"5fda054135f90ff6b35353a145dfe488dbeb45d43f9a5d391bc7e394c2dcc151"',
              '"8fae0e0e9ae0fdcc706d63b5159d825b052592b427d483fa8cf423c8dd880efc"': '"9bddde683d4ca8d3596fb62a5612b1b4487aaa1dc11ef631923b5e51e030ba3c"',
              '_SUCCESSOR_FRESH_VERIFICATION_ARTIFACT_ID = 10329905111': '_SUCCESSOR_FRESH_VERIFICATION_RUN_ID = 34803432434\n_SUCCESSOR_FRESH_VERIFICATION_ARTIFACT_ID = 10332575500',
              '"9769715e5d776d01791c6a7b2acbdfd4a52c97030ddb57875f448f0705b36f0f"': '"2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'production replacement anchor count != 1: {old!r}: {text.count(old)}')
              text = text.replace(old, new)

          field_anchor = '    capacity_result_json_sha256: str\n    capacity_result_artifact_id: int\n'
          if text.count(field_anchor) != 1:
              raise SystemExit('capacity result field anchor drift')
          text = text.replace(field_anchor, '    capacity_result_json_sha256: str\n    capacity_result_run_id: int\n    capacity_result_artifact_id: int\n')
          fresh_field_anchor = '    successor_runtime_environment_digest: str\n    successor_fresh_verification_artifact_id: int\n'
          if text.count(fresh_field_anchor) != 1:
              raise SystemExit('fresh verification field anchor drift')
          text = text.replace(fresh_field_anchor, '    successor_runtime_environment_digest: str\n    successor_fresh_verification_run_id: int\n    successor_fresh_verification_artifact_id: int\n')

          validate_anchor = '        _positive_int(\n            self.capacity_result_artifact_id,\n            field="capacity_result_artifact_id",\n        )\n'
          if text.count(validate_anchor) != 1:
              raise SystemExit('capacity result validation anchor drift')
          text = text.replace(validate_anchor, '        _positive_int(\n            self.capacity_result_run_id,\n            field="capacity_result_run_id",\n        )\n' + validate_anchor)
          fresh_validate_anchor = '        _positive_int(\n            self.successor_fresh_verification_artifact_id,\n            field="successor_fresh_verification_artifact_id",\n        )\n'
          if text.count(fresh_validate_anchor) != 1:
              raise SystemExit('fresh verification validation anchor drift')
          text = text.replace(fresh_validate_anchor, '        _positive_int(\n            self.successor_fresh_verification_run_id,\n            field="successor_fresh_verification_run_id",\n        )\n' + fresh_validate_anchor)

          payload_anchor = '            "capacity_result_json_sha256": self.capacity_result_json_sha256,\n            "capacity_result_artifact_id": self.capacity_result_artifact_id,\n'
          if text.count(payload_anchor) != 1:
              raise SystemExit('capacity result payload anchor drift')
          text = text.replace(payload_anchor, '            "capacity_result_json_sha256": self.capacity_result_json_sha256,\n            "capacity_result_run_id": self.capacity_result_run_id,\n            "capacity_result_artifact_id": self.capacity_result_artifact_id,\n')
          fresh_payload_anchor = '            "successor_runtime_environment_digest": self.successor_runtime_environment_digest,\n            "successor_fresh_verification_artifact_id": self.successor_fresh_verification_artifact_id,\n'
          if text.count(fresh_payload_anchor) != 1:
              raise SystemExit('fresh payload anchor drift')
          text = text.replace(fresh_payload_anchor, '            "successor_runtime_environment_digest": self.successor_runtime_environment_digest,\n            "successor_fresh_verification_run_id": self.successor_fresh_verification_run_id,\n            "successor_fresh_verification_artifact_id": self.successor_fresh_verification_artifact_id,\n')

          registered_anchor = '        "capacity_result_json_sha256": _CAPACITY_RESULT_JSON_SHA256,\n        "capacity_result_artifact_id": _CAPACITY_RESULT_ARTIFACT_ID,\n'
          if text.count(registered_anchor) != 1:
              raise SystemExit('capacity registered anchor drift')
          text = text.replace(registered_anchor, '        "capacity_result_json_sha256": _CAPACITY_RESULT_JSON_SHA256,\n        "capacity_result_run_id": _CAPACITY_RESULT_RUN_ID,\n        "capacity_result_artifact_id": _CAPACITY_RESULT_ARTIFACT_ID,\n')
          fresh_registered_anchor = '        "successor_runtime_environment_digest": _SUCCESSOR_RUNTIME_ENVIRONMENT_DIGEST,\n        "successor_fresh_verification_artifact_id": _SUCCESSOR_FRESH_VERIFICATION_ARTIFACT_ID,\n'
          if text.count(fresh_registered_anchor) != 1:
              raise SystemExit('fresh registered anchor drift')
          text = text.replace(fresh_registered_anchor, '        "successor_runtime_environment_digest": _SUCCESSOR_RUNTIME_ENVIRONMENT_DIGEST,\n        "successor_fresh_verification_run_id": _SUCCESSOR_FRESH_VERIFICATION_RUN_ID,\n        "successor_fresh_verification_artifact_id": _SUCCESSOR_FRESH_VERIFICATION_ARTIFACT_ID,\n')

          parse_anchor = '        capacity_result_json_sha256=cast(str, raw.get("capacity_result_json_sha256")),\n        capacity_result_artifact_id=_positive_int(\n'
          if text.count(parse_anchor) != 1:
              raise SystemExit('capacity parse anchor drift')
          text = text.replace(parse_anchor, '        capacity_result_json_sha256=cast(str, raw.get("capacity_result_json_sha256")),\n        capacity_result_run_id=_positive_int(\n            raw.get("capacity_result_run_id"), field="capacity_result_run_id"\n        ),\n        capacity_result_artifact_id=_positive_int(\n')
          fresh_parse_anchor = '        successor_runtime_environment_digest=cast(\n            str, raw.get("successor_runtime_environment_digest")\n        ),\n        successor_fresh_verification_artifact_id=_positive_int(\n'
          if text.count(fresh_parse_anchor) != 1:
              raise SystemExit('fresh parse anchor drift')
          text = text.replace(fresh_parse_anchor, '        successor_runtime_environment_digest=cast(\n            str, raw.get("successor_runtime_environment_digest")\n        ),\n        successor_fresh_verification_run_id=_positive_int(\n            raw.get("successor_fresh_verification_run_id"),\n            field="successor_fresh_verification_run_id",\n        ),\n        successor_fresh_verification_artifact_id=_positive_int(\n')
          prod.write_text(text, encoding='utf-8')

          test = Path('tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py')
          text = test.read_text(encoding='utf-8')
          test_replacements = {
              '"15bf6546996dc969d4d6e946261d73e3d43336e6"': '"3e111a59153b7353e26080bd569b9775190577be"',
              'assert protocol.identity_layer_ci_run_id == 34793925990': 'assert protocol.identity_layer_ci_run_id == 34803217815',
              'assert protocol.successor_bundle_run_id == 34794384559': 'assert protocol.successor_bundle_run_id == 34803217815',
              'assert protocol.successor_bundle_artifact_id == 10329107309': 'assert protocol.successor_bundle_artifact_id == 10331899302',
              '"6e8bff792fb905bf93fbf591e2c9cf18c2b28e6a1396f4e1a88562e83a65986d"': '"89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce"',
              '"6a9d6066fe8f92d46fe57a1d8172a60092568e625b2e843dc7a0c3930d79de86"': '"6c0b040d317a1bb73a9273f4135879b31691634aa837f30f0eec005ac7531518"',
              '"9a3f01bc4608c256b5c448e5cee123c4653fe02060040dc7909b4eb1c6c3e30f"': '"af481dd978db7d84cd3aa8ff4f5a35d8608ac44c755dd74f61e934105c02b6b7"',
              '"baaf25c93f37e409220d4413ddd9216c2afbf29ba1ce344310d43d7efa74e7eb"': '"bfa2fcb307773f5384d7dcb884444164d6d3b575373d8f7dc1c810a61bf4c820"',
              '"3bd6964426f983c8726a26dd1298df785726c9b66771e445253b38a8bb3dc9af"': '"2dd187a2cf4634e1c902f58592a15b4942127190a9eee16e0efe004da8a470f0"',
              '"a579b72e93d39b59fe1e232fd658bbc016fdecf4b5da6c683080ed2b5ea49bcc"': '"5fda054135f90ff6b35353a145dfe488dbeb45d43f9a5d391bc7e394c2dcc151"',
              '"8fae0e0e9ae0fdcc706d63b5159d825b052592b427d483fa8cf423c8dd880efc"': '"9bddde683d4ca8d3596fb62a5612b1b4487aaa1dc11ef631923b5e51e030ba3c"',
              'assert protocol.successor_fresh_verification_artifact_id == 10329905111': 'assert protocol.successor_fresh_verification_run_id == 34803432434\n    assert protocol.successor_fresh_verification_artifact_id == 10332575500',
              '"9769715e5d776d01791c6a7b2acbdfd4a52c97030ddb57875f448f0705b36f0f"': '"2067c38da3c1f45927748e2cc7481f11268710b2b386a5bd3b9a289394937589"',
              'assert protocol.schema_version == "calibrated_capacity_robustness_prereg_v2"': 'assert protocol.schema_version == "calibrated_capacity_robustness_prereg_v3"',
          }
          for old, new in test_replacements.items():
              if text.count(old) < 1:
                  raise SystemExit(f'test replacement anchor absent: {old!r}')
              text = text.replace(old, new)

          causal_assert_anchor = '    assert protocol.causal_capacity_head_sha == (\n'
          if text.count(causal_assert_anchor) != 1:
              raise SystemExit('causal-capacity assertion anchor drift')
          text = text.replace(causal_assert_anchor, '    assert protocol.capacity_result_run_id == 34766830666\n' + causal_assert_anchor)

          mutation_anchor = '        {"capacity_result_artifact_id": 1},\n'
          if text.count(mutation_anchor) != 1:
              raise SystemExit('capacity mutation anchor drift')
          text = text.replace(mutation_anchor, '        {"capacity_result_run_id": 1},\n' + mutation_anchor)
          fresh_mut_anchor = '        {"successor_fresh_verification_artifact_id": 1},\n'
          if text.count(fresh_mut_anchor) != 1:
              raise SystemExit('fresh mutation anchor drift')
          text = text.replace(fresh_mut_anchor, '        {"successor_fresh_verification_run_id": 1},\n' + fresh_mut_anchor)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary finalizers from durable diff
        run: git rm .github/workflows/tmp-issue541-v3-finalize.yml .github/workflows/tmp-issue541-v3-finalize-v2.yml
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: GREEN checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          uv run ruff format --check trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py
      - name: Prove durable diff stays exactly two files
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse origin/research/issue539-calibrated-causal-study)"
          test "$base" = "3e111a59153b7353e26080bd569b9775190577be"
          changed="$(git diff --name-only "$base")"
          expected=$'tests/evaluation/experiments/bootstrap/test_capacity_robustness_prereg.py\ntrade_rl/evaluation/experiments/bootstrap/capacity_robustness_prereg.py'
          test "$changed" = "$expected"
      - name: Commit and push only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "research: rebind capacity robustness preregistration v3"
          git push origin HEAD:research/issue541-capacity-robustness-prereg
