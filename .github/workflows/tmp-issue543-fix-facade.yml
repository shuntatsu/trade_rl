name: Temporary Issue 543 runs facade fix

on:
  push:
    branches:
      - research/issue543-loss-attribution

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue543-loss-attribution
      - name: Route LoadedCandidateRun through public facade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trade_rl/evaluation/loss_attribution.py')
          text = path.read_text(encoding='utf-8')
          old = 'from trade_rl.evaluation.runs.artifact import LoadedCandidateRun\n'
          new = 'from trade_rl.evaluation.runs import LoadedCandidateRun\n'
          if text.count(old) != 1:
              raise SystemExit('expected direct runs.artifact import not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/loss_attribution.py
          test "$(git diff --cached --name-only)" = "trade_rl/evaluation/loss_attribution.py"
          git commit -m 'fix: respect candidate run facade boundary'
          git push origin HEAD:research/issue543-loss-attribution
