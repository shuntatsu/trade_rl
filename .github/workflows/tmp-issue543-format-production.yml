name: Temporary Issue 543 production formatter

on:
  push:
    branches:
      - research/issue543-loss-attribution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue543-loss-attribution
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format trade_rl/evaluation/loss_attribution.py
      - name: Commit formatter-only production change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- trade_rl/evaluation/loss_attribution.py; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/loss_attribution.py
          test "$(git diff --cached --name-only)" = "trade_rl/evaluation/loss_attribution.py"
          git diff --cached --check
          git commit -m 'style: format loss attribution diagnostic'
          git push origin HEAD:research/issue543-loss-attribution
