name: Temporary Issue 543 format RED oracle

on:
  push:
    branches:
      - research/issue543-loss-attribution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue543-loss-attribution
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format only the new RED test
        run: uv run ruff format tests/evaluation/test_loss_attribution.py
      - name: Commit formatter-only change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/evaluation/test_loss_attribution.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/test_loss_attribution.py
          test "$(git diff --cached --name-only)" = "tests/evaluation/test_loss_attribution.py"
          git diff --cached --check
          git commit -m 'test: format loss attribution RED oracle'
          git push origin HEAD:research/issue543-loss-attribution
