name: Temporary Issue 543 fsum fix

on:
  push:
    branches:
      - tmp/issue543-fsum-fix
    paths:
      - .github/workflows/tmp-issue543-fsum-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue543-loss-attribution
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Replace BLAS-dependent reductions with fixed-order fsum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trade_rl/evaluation/loss_attribution.py')
          text = path.read_text(encoding='utf-8')
          old = '''    strategy_centered = strategy - float(np.mean(strategy))
    market_centered = market - float(np.mean(market))
    strategy_ss = float(np.dot(strategy_centered, strategy_centered))
    market_ss = float(np.dot(market_centered, market_centered))
    if strategy_ss <= _TOLERANCE or market_ss <= _TOLERANCE:
        return None, None
    cross = float(np.dot(strategy_centered, market_centered))
    correlation = cross / math.sqrt(strategy_ss * market_ss)
    beta = cross / market_ss
    return float(correlation), float(beta)
'''
          new = '''    strategy_values = tuple(float(value) for value in strategy)
    market_values = tuple(float(value) for value in market)
    if not strategy_values:
        return None, None
    count = len(strategy_values)
    strategy_mean = math.fsum(strategy_values) / count
    market_mean = math.fsum(market_values) / count
    strategy_centered = tuple(value - strategy_mean for value in strategy_values)
    market_centered = tuple(value - market_mean for value in market_values)
    strategy_ss = math.fsum(value * value for value in strategy_centered)
    market_ss = math.fsum(value * value for value in market_centered)
    if strategy_ss <= _TOLERANCE or market_ss <= _TOLERANCE:
        return None, None
    cross = math.fsum(
        left * right
        for left, right in zip(strategy_centered, market_centered, strict=True)
    )
    correlation = cross / math.sqrt(strategy_ss * market_ss)
    beta = cross / market_ss
    return float(correlation), float(beta)
'''
          if text.count(old) != 1:
              raise SystemExit('expected BLAS-dependent block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          uv run ruff format trade_rl/evaluation/loss_attribution.py
          uv run ruff check trade_rl/evaluation/loss_attribution.py tests/evaluation/test_loss_attribution_portability.py
          uv run ruff format --check trade_rl/evaluation/loss_attribution.py tests/evaluation/test_loss_attribution_portability.py
          uv run pytest -q tests/evaluation/test_loss_attribution.py tests/evaluation/test_loss_attribution_portability.py
      - name: Commit production fix only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/loss_attribution.py
          test "$(git diff --cached --name-only)" = "trade_rl/evaluation/loss_attribution.py"
          git commit -m 'fix: make attribution sensitivity portable'
          git push origin HEAD:research/issue543-loss-attribution
