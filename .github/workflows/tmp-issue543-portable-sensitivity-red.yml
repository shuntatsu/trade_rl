name: Temporary Issue 543 portable sensitivity RED

on:
  push:
    branches:
      - research/issue543-loss-attribution
    paths:
      - .github/workflows/tmp-issue543-portable-sensitivity-red.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue543-loss-attribution
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Add exact scalar-oracle regression only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/evaluation/test_loss_attribution.py')
          text = path.read_text(encoding='utf-8')
          old = 'from trade_rl.evaluation.loss_attribution import analyze_deterministic_loss_attribution\n'
          new = '''from trade_rl.evaluation.loss_attribution import (\n    _market_sensitivity,\n    analyze_deterministic_loss_attribution,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit('loss attribution import block drifted')
          text = text.replace(old, new)
          test = r'''


def test_market_sensitivity_is_fixed_order_and_blas_independent() -> None:
    strategy = np.asarray(
        [
            -0.009891213503478508,
            -0.0036778665146788322,
            0.012879252612892488,
            0.0019397441913261322,
            0.009202308996398569,
            0.005771037912572513,
            -0.006364636463709806,
            0.005419522204102934,
            -0.003165954511658161,
            -0.0032238911615896015,
        ],
        dtype=np.float64,
    )
    market = np.asarray(
        [
            0.001943346373409144,
            -0.03051860813037903,
            0.02384332208203317,
            -0.013421793503482191,
            0.02000538839318921,
            0.00272642247706235,
            0.03064066159257593,
            -0.013199388275836416,
            -0.006235897129398351,
            0.00675538253117652,
        ],
        dtype=np.float64,
    )

    correlation, beta = _market_sensitivity(strategy, market)

    assert correlation == 0.22849169250485715
    assert beta == 0.08809694283757973
'''
          if 'test_market_sensitivity_is_fixed_order_and_blas_independent' in text:
              raise SystemExit('portable sensitivity test already exists')
          path.write_text(text + test, encoding='utf-8')
          PY
          uv run ruff format tests/evaluation/test_loss_attribution.py
          uv run ruff check tests/evaluation/test_loss_attribution.py
          uv run ruff format --check tests/evaluation/test_loss_attribution.py
      - name: Commit RED oracle only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/test_loss_attribution.py
          test "$(git diff --cached --name-only)" = "tests/evaluation/test_loss_attribution.py"
          git commit -m 'test: require portable loss-attribution sensitivity'
          git push origin HEAD:research/issue543-loss-attribution
