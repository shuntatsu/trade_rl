name: Temporary Issue 545 economic gate metadata

on:
  push:
    branches:
      - probe/issue545-economic-gate-metadata

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "34700123151"
  SOURCE_ARTIFACT_NAME: canonical-m2-portable-baseline-v1-34700123151
  SOURCE_ARTIFACT_ID: "10301701698"
  SOURCE_ARTIFACT_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5a1ce8395feaedd8833f7e596fddc9d8f3115fc
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Bind frozen baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          META="$meta" python3 -c 'import json,os; x=json.loads(os.environ["META"]); assert x["id"]==int(os.environ["SOURCE_ARTIFACT_ID"]); assert x["name"]==os.environ["SOURCE_ARTIFACT_NAME"]; assert x["workflow_run"]["id"]==int(os.environ["SOURCE_RUN_ID"]); assert x["digest"]==os.environ["SOURCE_ARTIFACT_DIGEST"]; assert x["expired"] is False'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          digest-mismatch: error
      - name: Extract metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          uv run python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          import numpy as np
          from trade_rl.data import load_market_dataset_artifact
          from trade_rl.evaluation.runs import load_candidate_run_artifact

          root = Path('/tmp/source')
          dataset = load_market_dataset_artifact(root / 'dataset')
          run = load_candidate_run_artifact(root / 'study/baseline/evidence/runs/seed-0')
          cfg = run.summary['candidate_config']
          evaluation = run.summary['evaluation']
          allowed_cfg = (
              'signal_index','feature_indices','fit_symbol_indices','fit_cutoff',
              'rule_entry_threshold','rule_exit_threshold','forecast_entry_threshold',
              'forecast_exit_threshold','ppo_total_timesteps','ppo_seed',
          )
          allowed_eval = ('start','stop_exclusive','initial_capital','gross_budget','execution_overlay')

          signal_index = int(cfg['signal_index'])
          fit_cutoff = np.datetime64(str(cfg['fit_cutoff']), 'ns')
          fit_mask = dataset.timestamps < fit_cutoff
          if not bool(np.any(fit_mask)):
              raise SystemExit('empty fit range')

          def array_summary(name: str) -> dict[str, object]:
              values = np.asarray(dataset.resolved_array(name), dtype=np.float64)[fit_mask]
              if values.ndim != 2 or not np.isfinite(values).all():
                  raise SystemExit(f'invalid {name}')
              return {
                  'min_by_symbol': [float(v) for v in np.min(values, axis=0)],
                  'max_by_symbol': [float(v) for v in np.max(values, axis=0)],
                  'first_by_symbol': [float(v) for v in values[0]],
                  'last_by_symbol': [float(v) for v in values[-1]],
              }

          payload = {
              'source_artifact_id': 10301701698,
              'dataset_id': dataset.dataset_id,
              'symbols': list(dataset.symbols),
              'feature_names': list(dataset.feature_names),
              'global_feature_names': list(dataset.global_feature_names),
              'signal_index': signal_index,
              'signal_feature_name': dataset.feature_names[signal_index],
              'candidate_config': {k: cfg[k] for k in allowed_cfg if k in cfg},
              'evaluation': {k: evaluation[k] for k in allowed_eval if k in evaluation},
              'periods_per_year': dataset.periods_per_year,
              'nominal_bar_hours': dataset.nominal_bar_hours,
              'fit_start': str(dataset.timestamps[np.flatnonzero(fit_mask)[0]]),
              'fit_last': str(dataset.timestamps[np.flatnonzero(fit_mask)[-1]]),
              'fee_rate_fit': array_summary('fee_rate'),
              'spread_rate_fit': array_summary('spread_rate'),
              'max_participation_rate_fit': array_summary('max_participation_rate'),
          }
          Path('/tmp/out/metadata.json').write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue545-economic-gate-metadata-${{ github.run_id }}
          path: /tmp/out/metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
