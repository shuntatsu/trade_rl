name: Temporary Issue 545 remove unused ignore

on:
  push:
    branches:
      - verify/issue545-prereg-green2
    paths:
      - .github/workflows/tmp-issue545-remove-ignore.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue545-economic-action-prereg
      - name: Remove only the unused mypy suppression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('trade_rl/evaluation/experiments/bootstrap/mean_reversion_economic_gate_prereg.py')
          text = path.read_text(encoding='utf-8')
          old = '    return MeanReversionEconomicGateProtocol(**converted)  # type: ignore[arg-type]\n'
          new = '    return MeanReversionEconomicGateProtocol(**converted)\n'
          if text.count(old) != 1:
              raise SystemExit('expected unused ignore not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/experiments/bootstrap/mean_reversion_economic_gate_prereg.py
          git commit -m 'fix: remove unused prereg type suppression'
          git push origin HEAD:research/issue545-economic-action-prereg
