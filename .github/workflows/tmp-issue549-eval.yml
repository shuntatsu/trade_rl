name: Temporary Issue 549 sealed evaluation

on:
  push:
    branches: [verify/issue549-eval]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: 7b352d53b037507e0f3546925bf0a8ab47275780
      PR_NUMBER: 550
      IMPL_SEAL_RUN_ID: 34834105053
      IMPL_SEAL_ARTIFACT_ID: 10342893071
      IMPL_SEAL_ARTIFACT_NAME: issue549-evaluation-implementation-seal-34834105053
      IMPL_SEAL_API_DIGEST: sha256:4be47d05c88489f7513288ddc843d4ec96306ba594d256f64a839d018548259d
      IMPL_SEAL_DIGEST: 0e05028aa7ee42a08f076caf6ddd4894c901089422a465e2ee2dd4744eaec23d
      IMPL_SPEC_DIGEST: 3610b45ebd79e5ea6fec2b729ea3f372673eb6ebde856b633f0ec8909b994e5d
      SOURCE_RUN_ID: 34803217815
      SOURCE_ARTIFACT_ID: 10331899302
      SOURCE_ARTIFACT_NAME: issue539-calibrated-causal-successor-v3-34803217815
      SOURCE_API_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Verify PR head and immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr" python3 - <<'PY'
          import json, os
          pr=json.loads(os.environ['PR_JSON'])
          assert pr['head']['sha']==os.environ['TARGET_SHA']
          assert pr['base']['ref']=='research/issue547-economic-gate-calibration'
          assert pr['state']=='open'
          PY
          for pair in "$IMPL_SEAL_ARTIFACT_ID $IMPL_SEAL_API_DIGEST $IMPL_SEAL_RUN_ID $IMPL_SEAL_ARTIFACT_NAME" "$SOURCE_ARTIFACT_ID $SOURCE_API_DIGEST $SOURCE_RUN_ID $SOURCE_ARTIFACT_NAME"; do
            set -- $pair
            artifact_id=$1; expected_digest=$2; expected_run=$3; expected_name=$4
            meta="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")"
            META="$meta" ARTIFACT_ID="$artifact_id" EXPECTED_DIGEST="$expected_digest" EXPECTED_RUN="$expected_run" EXPECTED_NAME="$expected_name" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ['META'])
          assert x['id']==int(os.environ['ARTIFACT_ID'])
          assert x['digest']==os.environ['EXPECTED_DIGEST']
          assert x['workflow_run']['id']==int(os.environ['EXPECTED_RUN'])
          assert x['name']==os.environ['EXPECTED_NAME']
          assert x['expired'] is False
          PY
          done
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.IMPL_SEAL_ARTIFACT_NAME }}
          path: /tmp/impl-seal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.IMPL_SEAL_RUN_ID }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Execute one-shot research evaluation and baseline reproduction oracle
        run: |
          mkdir -p /tmp/issue549-result
          uv run python - <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          from typing import Any
          import numpy as np
          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact
          from trade_rl.evaluation.experiments.evidence import load_evidence_set
          from trade_rl.evaluation.experiments.bootstrap.mean_reversion_economic_gate_evaluation import (
              canonical_mean_reversion_economic_gate_evaluation_spec,
              evaluate_mean_reversion_economic_gate,
              evaluation_return_sha256,
          )

          seal=json.loads(Path('/tmp/impl-seal/implementation-seal.json').read_text(encoding='utf-8'))
          seal_digest=seal.pop('seal_digest')
          assert seal_digest==os.environ['IMPL_SEAL_DIGEST']
          assert content_digest(seal)==seal_digest
          assert seal['pr_head_sha']==os.environ['TARGET_SHA']
          assert seal['evaluation_spec_digest']==os.environ['IMPL_SPEC_DIGEST']

          dataset_root=Path('/tmp/successor/dataset')
          artifact=inspect_published_market_dataset_artifact(dataset_root)
          dataset=load_market_dataset_artifact(dataset_root)
          spec=canonical_mean_reversion_economic_gate_evaluation_spec()
          assert spec.digest==os.environ['IMPL_SPEC_DIGEST']
          assert dataset.dataset_id==spec.dataset_id
          assert artifact.artifact_digest==spec.dataset_artifact_digest

          plan=json.loads(Path('/tmp/successor/study/plan.json').read_text(encoding='utf-8'))
          assert content_digest(plan)==spec.study_digest
          baseline_config=plan['baseline_config']
          assert baseline_config['signal_index']==spec.signal_index
          assert baseline_config['rule_entry_threshold']==spec.rule_entry_threshold
          assert baseline_config['rule_exit_threshold']==spec.rule_exit_threshold
          assert baseline_config['evaluation_start']==spec.evaluation_start
          assert baseline_config['evaluation_stop_exclusive']==spec.evaluation_stop_exclusive
          assert baseline_config['gross_budget']==spec.gross_budget
          assert baseline_config['initial_capital']==spec.initial_capital
          assert baseline_config['execution_overlay']==spec.execution_overlay

          # This is the single formal candidate execution. Everything before this line was identity-only.
          result=evaluate_mean_reversion_economic_gate(dataset, spec)

          baseline=load_evidence_set('/tmp/successor/study/baseline/evidence')
          assert tuple(baseline.evidence.ppo_seeds)==tuple(sorted(baseline.runs))

          def mean_reversion_entry(run: Any, symbol: str) -> tuple[dict[str, Any], np.ndarray]:
              by_symbol=run.summary.get('by_symbol')
              assert isinstance(by_symbol,list)
              symbol_entry=next(item for item in by_symbol if isinstance(item,dict) and item.get('symbol')==symbol)
              strategies=symbol_entry.get('strategies')
              assert isinstance(strategies,list)
              entry=next(item for item in strategies if isinstance(item,dict) and item.get('name')=='mean_reversion')
              key=entry.get('return_key')
              assert isinstance(key,str)
              returns=run.returns[key]
              return entry, returns

          for symbol_result in result.by_symbol:
              for seed in baseline.evidence.ppo_seeds:
                  entry, returns=mean_reversion_entry(baseline.runs[seed], symbol_result.symbol)
                  assert evaluation_return_sha256(returns)==symbol_result.baseline_return_sha256
                  metrics=entry['metrics']; diagnostics=entry['diagnostics']
                  assert metrics['total_return']==symbol_result.baseline_total_return
                  assert metrics['total_cost']==symbol_result.baseline_total_cost
                  assert metrics['turnover_total']==symbol_result.baseline_turnover_total
                  assert metrics['max_drawdown']==symbol_result.baseline_max_drawdown
                  assert metrics['termination_count']==symbol_result.baseline_termination_count
                  assert metrics['n_periods']==symbol_result.baseline_n_periods
                  assert tuple(diagnostics['termination_reasons'])==symbol_result.baseline_termination_reasons

          payload={
              'schema_version':'issue549_sealed_evaluation_result_v1',
              'issue_number':549,
              'pr_number':550,
              'pr_head_sha':os.environ['TARGET_SHA'],
              'implementation_seal_run_id':int(os.environ['IMPL_SEAL_RUN_ID']),
              'implementation_seal_artifact_id':int(os.environ['IMPL_SEAL_ARTIFACT_ID']),
              'implementation_seal_api_digest':os.environ['IMPL_SEAL_API_DIGEST'],
              'implementation_seal_digest':os.environ['IMPL_SEAL_DIGEST'],
              'successor_run_id':int(os.environ['SOURCE_RUN_ID']),
              'successor_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'successor_artifact_api_digest':os.environ['SOURCE_API_DIGEST'],
              'dataset_id':dataset.dataset_id,
              'dataset_artifact_digest':artifact.artifact_digest,
              'study_digest':spec.study_digest,
              'baseline_evidence_fingerprint':baseline.evidence.fingerprint,
              'baseline_ppo_seeds':list(baseline.evidence.ppo_seeds),
              'baseline_reproduction_passed':True,
              'formal_candidate_execution_count':1,
              'evaluation_result_digest':result.digest,
              'evaluation_result':result.to_payload(),
              'independent_verification_required':True,
              'production_eligible':False,
              'final_test_authorized':False,
              'shared_cash_profitability_established':False,
              'live_trading_authorized':False,
          }
          payload['artifact_content_digest']=content_digest(payload)
          Path('/tmp/issue549-result/evaluation.json').write_text(json.dumps(payload,sort_keys=True,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          print(json.dumps({
              'research_status':result.research_status,
              'positive_effect_symbols':result.positive_effect_symbols,
              'median_excess_total_return':result.median_excess_total_return,
              'cost_reduction_symbols':result.cost_reduction_symbols,
              'turnover_reduction_symbols':result.turnover_reduction_symbols,
              'drawdown_nonworse_symbols':result.drawdown_nonworse_symbols,
              'new_termination_symbols':result.new_termination_symbols,
              'candidate_positive_total_return_symbols':result.candidate_positive_total_return_symbols,
              'evaluation_result_digest':result.digest,
              'artifact_content_digest':payload['artifact_content_digest'],
              'by_symbol':[item.to_payload() for item in result.by_symbol],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue549-sealed-evaluation-${{ github.run_id }}
          path: /tmp/issue549-result/evaluation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  fresh_verifier:
    needs: publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: 7b352d53b037507e0f3546925bf0a8ab47275780
      PR_NUMBER: 550
      IMPL_SEAL_RUN_ID: 34834105053
      IMPL_SEAL_ARTIFACT_ID: 10342893071
      IMPL_SEAL_ARTIFACT_NAME: issue549-evaluation-implementation-seal-34834105053
      IMPL_SEAL_API_DIGEST: sha256:4be47d05c88489f7513288ddc843d4ec96306ba594d256f64a839d018548259d
      IMPL_SEAL_DIGEST: 0e05028aa7ee42a08f076caf6ddd4894c901089422a465e2ee2dd4744eaec23d
      IMPL_SPEC_DIGEST: 3610b45ebd79e5ea6fec2b729ea3f372673eb6ebde856b633f0ec8909b994e5d
      SOURCE_RUN_ID: 34803217815
      SOURCE_ARTIFACT_ID: 10331899302
      SOURCE_ARTIFACT_NAME: issue539-calibrated-causal-successor-v3-34803217815
      SOURCE_API_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Re-verify PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr" python3 - <<'PY'
          import json, os
          pr=json.loads(os.environ['PR_JSON'])
          assert pr['head']['sha']==os.environ['TARGET_SHA']
          assert pr['state']=='open'
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.IMPL_SEAL_ARTIFACT_NAME }}
          path: /tmp/impl-seal
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.IMPL_SEAL_RUN_ID }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue549-sealed-evaluation-${{ github.run_id }}
          path: /tmp/publisher-result
      - name: Fresh independent reconstruction and byte equality
        run: |
          mkdir -p /tmp/issue549-verifier
          uv run python - <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          from typing import Any
          import numpy as np
          from trade_rl.artifacts.hashing import content_digest
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact
          from trade_rl.evaluation.experiments.evidence import load_evidence_set
          from trade_rl.evaluation.experiments.bootstrap.mean_reversion_economic_gate_evaluation import canonical_mean_reversion_economic_gate_evaluation_spec, evaluate_mean_reversion_economic_gate, evaluation_return_sha256

          seal=json.loads(Path('/tmp/impl-seal/implementation-seal.json').read_text(encoding='utf-8'))
          seal_digest=seal.pop('seal_digest')
          assert seal_digest==os.environ['IMPL_SEAL_DIGEST']
          assert content_digest(seal)==seal_digest
          assert seal['pr_head_sha']==os.environ['TARGET_SHA']

          dataset_root=Path('/tmp/successor/dataset')
          artifact=inspect_published_market_dataset_artifact(dataset_root)
          dataset=load_market_dataset_artifact(dataset_root)
          spec=canonical_mean_reversion_economic_gate_evaluation_spec()
          assert spec.digest==os.environ['IMPL_SPEC_DIGEST']
          assert dataset.dataset_id==spec.dataset_id
          assert artifact.artifact_digest==spec.dataset_artifact_digest
          plan=json.loads(Path('/tmp/successor/study/plan.json').read_text(encoding='utf-8'))
          assert content_digest(plan)==spec.study_digest

          result=evaluate_mean_reversion_economic_gate(dataset,spec)
          baseline=load_evidence_set('/tmp/successor/study/baseline/evidence')

          def mean_reversion_entry(run: Any, symbol: str) -> tuple[dict[str, Any], np.ndarray]:
              by_symbol=run.summary.get('by_symbol'); assert isinstance(by_symbol,list)
              symbol_entry=next(item for item in by_symbol if isinstance(item,dict) and item.get('symbol')==symbol)
              strategies=symbol_entry.get('strategies'); assert isinstance(strategies,list)
              entry=next(item for item in strategies if isinstance(item,dict) and item.get('name')=='mean_reversion')
              key=entry.get('return_key'); assert isinstance(key,str)
              return entry, run.returns[key]

          for symbol_result in result.by_symbol:
              for seed in baseline.evidence.ppo_seeds:
                  entry, returns=mean_reversion_entry(baseline.runs[seed],symbol_result.symbol)
                  assert evaluation_return_sha256(returns)==symbol_result.baseline_return_sha256
                  metrics=entry['metrics']; diagnostics=entry['diagnostics']
                  assert metrics['total_return']==symbol_result.baseline_total_return
                  assert metrics['total_cost']==symbol_result.baseline_total_cost
                  assert metrics['turnover_total']==symbol_result.baseline_turnover_total
                  assert metrics['max_drawdown']==symbol_result.baseline_max_drawdown
                  assert metrics['termination_count']==symbol_result.baseline_termination_count
                  assert metrics['n_periods']==symbol_result.baseline_n_periods
                  assert tuple(diagnostics['termination_reasons'])==symbol_result.baseline_termination_reasons

          payload={
              'schema_version':'issue549_sealed_evaluation_result_v1',
              'issue_number':549,
              'pr_number':550,
              'pr_head_sha':os.environ['TARGET_SHA'],
              'implementation_seal_run_id':int(os.environ['IMPL_SEAL_RUN_ID']),
              'implementation_seal_artifact_id':int(os.environ['IMPL_SEAL_ARTIFACT_ID']),
              'implementation_seal_api_digest':os.environ['IMPL_SEAL_API_DIGEST'],
              'implementation_seal_digest':os.environ['IMPL_SEAL_DIGEST'],
              'successor_run_id':int(os.environ['SOURCE_RUN_ID']),
              'successor_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'successor_artifact_api_digest':os.environ['SOURCE_API_DIGEST'],
              'dataset_id':dataset.dataset_id,
              'dataset_artifact_digest':artifact.artifact_digest,
              'study_digest':spec.study_digest,
              'baseline_evidence_fingerprint':baseline.evidence.fingerprint,
              'baseline_ppo_seeds':list(baseline.evidence.ppo_seeds),
              'baseline_reproduction_passed':True,
              'formal_candidate_execution_count':1,
              'evaluation_result_digest':result.digest,
              'evaluation_result':result.to_payload(),
              'independent_verification_required':True,
              'production_eligible':False,
              'final_test_authorized':False,
              'shared_cash_profitability_established':False,
              'live_trading_authorized':False,
          }
          payload['artifact_content_digest']=content_digest(payload)
          rebuilt=(json.dumps(payload,sort_keys=True,indent=2,allow_nan=False)+'\n').encode()
          published=Path('/tmp/publisher-result/evaluation.json').read_bytes()
          assert rebuilt==published
          report={
              'schema_version':'issue549_evaluation_fresh_verification_v1',
              'pr_head_sha':os.environ['TARGET_SHA'],
              'evaluation_result_digest':result.digest,
              'publisher_artifact_content_digest':payload['artifact_content_digest'],
              'baseline_reproduction_passed':True,
              'fresh_reconstruction_byte_equal':True,
              'production_eligible':False,
              'final_test_authorized':False,
              'shared_cash_profitability_established':False,
              'live_trading_authorized':False,
          }
          report['verification_digest']=content_digest(report)
          Path('/tmp/issue549-verifier/verification.json').write_text(json.dumps(report,sort_keys=True,indent=2,allow_nan=False)+'\n',encoding='utf-8')
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue549-evaluation-fresh-verification-${{ github.run_id }}
          path: /tmp/issue549-verifier/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
