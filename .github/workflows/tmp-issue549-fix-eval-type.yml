name: Temporary Issue 549 evaluation type fix

on:
  push:
    branches:
      - verify/issue549-fix-eval-type

permissions:
  contents: write

env:
  TARGET_SHA: "ae99444449d3c71228cea325379293e4e9cb8088"
  TARGET_BRANCH: research/issue549-economic-gate-evaluation

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Apply protocol-only typing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trade_rl/evaluation/experiments/bootstrap/mean_reversion_economic_gate_evaluation.py')
          text = p.read_text(encoding='utf-8')
          needle = 'from trade_rl.evaluation.runs import execution_cost_for_overlay\n'
          repl = needle + 'from trade_rl.strategies.interface import SingleSymbolStrategy\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected execution helper import count')
          text = text.replace(needle, repl, 1)
          needle2 = '    strategies = {\n'
          repl2 = '    strategies: dict[str, SingleSymbolStrategy] = {\n'
          if text.count(needle2) != 1:
              raise SystemExit('unexpected strategies assignment count')
          text = text.replace(needle2, repl2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit type-boundary change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/mean_reversion_economic_gate_evaluation.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: type economic-gate strategy pair by protocol"
          git push origin "HEAD:${TARGET_BRANCH}"
