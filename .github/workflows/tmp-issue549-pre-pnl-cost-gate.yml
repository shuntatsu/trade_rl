name: Temporary Issue 549 PRE-P&L cost gate

on:
  push:
    branches:
      - verify/issue549-pre-pnl-cost-gate

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: "393952c927d46c8a7135f4a6311ce611f508f85e"
  SOURCE_RUN_ID: "34803217815"
  SOURCE_ARTIFACT_ID: "10331899302"
  SOURCE_ARTIFACT_NAME: issue539-calibrated-causal-successor-v3-34803217815
  SOURCE_ARTIFACT_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
  EXPECTED_DATASET_ID: "6c0b040d317a1bb73a9273f4135879b31691634aa837f30f0eec005ac7531518"
  EXPECTED_DATASET_ARTIFACT_DIGEST: "af481dd978db7d84cd3aa8ff4f5a35d8608ac44c755dd74f61e934105c02b6b7"

jobs:
  pre_pnl_cost_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Bind immutable successor bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          META="$meta" python3 -c 'import json,os; x=json.loads(os.environ["META"]); assert x["id"]==int(os.environ["SOURCE_ARTIFACT_ID"]); assert x["name"]==os.environ["SOURCE_ARTIFACT_NAME"]; assert x["workflow_run"]["id"]==int(os.environ["SOURCE_RUN_ID"]); assert x["digest"]==os.environ["SOURCE_ARTIFACT_DIGEST"]; assert x["expired"] is False'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/issue549-successor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          digest-mismatch: error
      - name: Verify evaluation-boundary costs from Dataset only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue549-out
          uv run python - <<'PY'
          from __future__ import annotations
          import json
          import math
          import os
          from pathlib import Path
          import numpy as np
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact

          root = Path('/tmp/issue549-successor/dataset')
          dataset = load_market_dataset_artifact(root)
          artifact = inspect_published_market_dataset_artifact(root)
          if dataset.dataset_id != os.environ['EXPECTED_DATASET_ID']:
              raise SystemExit('Dataset ID mismatch')
          if artifact.artifact_digest != os.environ['EXPECTED_DATASET_ARTIFACT_DIGEST']:
              raise SystemExit('Dataset artifact digest mismatch')

          start = np.datetime64('2023-01-01T00:00:00', 'ns')
          stop = np.datetime64('2025-01-01T00:00:00', 'ns')
          timestamps = np.asarray(dataset.timestamps, dtype='datetime64[ns]')
          rows = np.flatnonzero((timestamps >= start) & (timestamps <= stop))
          if rows.size < 2:
              raise SystemExit('evaluation boundary rows missing')
          if timestamps[rows[0]] != start:
              raise SystemExit('evaluation start row missing')
          # The stop boundary row is included when present because a final decision
          # before stop may execute into that boundary interval.
          if timestamps[rows[-1]] != stop:
              raise SystemExit('evaluation stop boundary row missing')

          expected = {
              'fee_rate': 0.0005,
              'taker_fee_rate': 0.0,
              'spread_rate': 0.0002,
          }
          summaries = {}
          for name, target in expected.items():
              values = np.asarray(dataset.resolved_array(name), dtype=np.float64)[rows]
              if values.shape != (rows.size, dataset.n_symbols):
                  raise SystemExit(f'{name} shape mismatch')
              if not np.isfinite(values).all() or np.any(values < 0.0):
                  raise SystemExit(f'{name} invalid values')
              if not np.all(values == target):
                  raise SystemExit('INVALID_EVALUATION_COST_DRIFT:' + name)
              summaries[name] = {
                  'expected': target,
                  'min_by_symbol': [float(v) for v in np.min(values, axis=0)],
                  'max_by_symbol': [float(v) for v in np.max(values, axis=0)],
              }

          one_way = expected['fee_rate'] + expected['taker_fee_rate'] + expected['spread_rate']
          if not math.isclose(one_way, 0.0007, rel_tol=0.0, abs_tol=0.0):
              raise SystemExit('sealed one-way cost mismatch')
          payload = {
              'schema_version': 'issue549_pre_pnl_cost_gate_v1',
              'status': 'PASS_CONSTANT_SEALED_COST',
              'dataset_id': dataset.dataset_id,
              'dataset_artifact_digest': artifact.artifact_digest,
              'symbols': list(dataset.symbols),
              'evaluation_start': str(start),
              'evaluation_stop_boundary': str(stop),
              'first_checked_timestamp': str(timestamps[rows[0]]),
              'last_checked_timestamp': str(timestamps[rows[-1]]),
              'checked_rows': int(rows.size),
              'costs': summaries,
              'sealed_one_way_explicit_cost': one_way,
              'study_files_read': False,
              'evaluation_pnl_inspected': False,
              'strategy_execution_performed': False,
          }
          Path('/tmp/issue549-out/cost-gate.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue549-pre-pnl-cost-gate-${{ github.run_id }}
          path: /tmp/issue549-out/cost-gate.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
