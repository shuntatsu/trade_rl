name: Temporary Issue 549 Wrapper Format

on:
  push:
    branches:
      - tmp/issue549-wrapper-format
    paths:
      - .github/workflows/tmp-issue549-wrapper-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/issue549-wrapper-format
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format wrapper only
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/strategies/rules/mean_reversion_economic_gate.py
          changed="$(git diff --name-only)"
          test "$changed" = "trade_rl/strategies/rules/mean_reversion_economic_gate.py"
          uv run ruff check trade_rl/strategies/rules/mean_reversion_economic_gate.py tests/strategies/test_mean_reversion_economic_gate.py
          uv run ruff format --check trade_rl/strategies/rules/mean_reversion_economic_gate.py tests/strategies/test_mean_reversion_economic_gate.py
      - name: Commit formatter output only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/strategies/rules/mean_reversion_economic_gate.py
          git diff --cached --quiet && exit 1
          git commit -m 'style: format Issue 549 economic gate wrapper'
          git push origin HEAD:tmp/issue549-wrapper-format
