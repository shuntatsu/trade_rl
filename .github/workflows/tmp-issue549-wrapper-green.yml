name: Temporary Issue 549 Wrapper Green

on:
  push:
    branches:
      - verify/issue549-wrapper-green-b621
    paths:
      - .github/workflows/tmp-issue549-wrapper-green.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b621f5828d1a38431c755f10a723bd63c28be544
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check trade_rl/strategies/rules/mean_reversion_economic_gate.py tests/strategies/test_mean_reversion_economic_gate.py
      - run: uv run ruff format --check trade_rl/strategies/rules/mean_reversion_economic_gate.py tests/strategies/test_mean_reversion_economic_gate.py
      - run: uv run mypy trade_rl/strategies/rules/mean_reversion_economic_gate.py
      - run: uv run pytest -q tests/strategies/test_mean_reversion_economic_gate.py
