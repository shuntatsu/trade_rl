name: Temporary Issue 552 metrics fresh verification

on:
  push:
    branches:
      - verify/issue552-metrics-fresh
    paths:
      - .github/workflows/tmp-issue552-metrics-fresh.yml

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_RUN_ID: "34839323607"
      SOURCE_ARTIFACT_ID: "10344824182"
      SOURCE_ARTIFACT_NAME: issue552-binance-metrics-structural-v2-34839323607
      SOURCE_API_DIGEST: sha256:ca50429b7037d7800b3e64fd29d806380efcd69c1b301941c78cff236f8accfe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: API-bind published structural artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")"
          META="$meta" python3 - <<'PY'
          import json, os
          x=json.loads(os.environ["META"])
          assert x["id"]==int(os.environ["SOURCE_ARTIFACT_ID"])
          assert x["name"]==os.environ["SOURCE_ARTIFACT_NAME"]
          assert x["digest"]==os.environ["SOURCE_API_DIGEST"]
          assert x["workflow_run"]["id"]==int(os.environ["SOURCE_RUN_ID"])
          assert x["expired"] is False
          PY

      - name: Download publisher report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: /tmp/published
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Independently re-fetch and rebuild canonical report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue552/raw /tmp/issue552/rebuilt
          python3 - <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, math, subprocess, zipfile
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SYMBOLS=("BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","ADAUSDT")
          DATES=("2021-01-01","2021-07-01","2022-01-01","2022-07-01")
          ROOT="https://data.binance.vision/data/futures/um/daily/metrics"
          H=("create_time","symbol","sum_open_interest","sum_open_interest_value","count_toptrader_long_short_ratio","sum_toptrader_long_short_ratio","count_long_short_ratio","sum_taker_long_short_vol_ratio")
          def curl(url,target):
              return subprocess.run(["curl","--fail","--silent","--show-error","--location","--retry","2","--output",str(target),url],check=False).returncode==0
          def pt(text):
              value=text.strip().replace("Z","+00:00")
              d=datetime.fromisoformat(value)
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)
          entries=[]; missing=[]; failures=[]; available=0; parseable=0
          for symbol in SYMBOLS:
              for day in DATES:
                  name=f"{symbol}-metrics-{day}.zip"; url=f"{ROOT}/{symbol}/{name}"
                  target=Path('/tmp/issue552/raw')/name; check=target.with_suffix(target.suffix+'.CHECKSUM')
                  e={"symbol":symbol,"date":day,"url":url}
                  if not curl(url,target):
                      e.update({"available":False,"reason":"http_unavailable"}); missing.append(f"{symbol}:{day}"); entries.append(e); continue
                  available+=1; payload=target.read_bytes(); sha=hashlib.sha256(payload).hexdigest()
                  e.update({"available":True,"raw_size":len(payload),"raw_sha256":sha})
                  ca=curl(url+'.CHECKSUM',check); e['checksum_available']=ca
                  if ca:
                      expected=check.read_text(encoding='utf-8').strip().split()[0]; e['checksum_verified']=expected==sha
                      if expected!=sha: failures.append(f"{symbol}:{day}:checksum_mismatch")
                  else: e['checksum_verified']=None
                  try:
                      with zipfile.ZipFile(io.BytesIO(payload)) as z:
                          members=[x for x in z.infolist() if not x.is_dir()]
                          if len(members)!=1 or not members[0].filename.lower().endswith('.csv'): raise ValueError('archive_member_contract')
                          with z.open(members[0],'r') as raw:
                              r=csv.reader(io.TextIOWrapper(raw,encoding='utf-8-sig',newline=''))
                              header=tuple(next(r))
                              if header!=H: raise ValueError(f"header_mismatch:{header!r}")
                              blanks=Counter({x:0 for x in H[2:]}); nonfinite=Counter({x:0 for x in H[2:]}); n=0; first=None; last=None; prev=None; spacings=Counter()
                              for row in r:
                                  if len(row)!=len(H): raise ValueError('field_count_mismatch')
                                  if row[1]!=symbol: raise ValueError('symbol_mismatch')
                                  t=pt(row[0]); first=t if first is None else first
                                  if prev is not None:
                                      sec=int((t-prev).total_seconds())
                                      if sec<0: raise ValueError('timestamp_decrease')
                                      spacings[sec]+=1
                                  prev=t; last=t
                                  for idx,field in enumerate(H[2:],start=2):
                                      text=row[idx].strip()
                                      if text=='': blanks[field]+=1; continue
                                      v=float(text)
                                      if not math.isfinite(v): nonfinite[field]+=1
                                  n+=1
                              if n==0 or first is None or last is None: raise ValueError('empty_data')
                              if first.date()!=datetime.strptime(day,'%Y-%m-%d').date() or last.date()!=datetime.strptime(day,'%Y-%m-%d').date(): raise ValueError('date_boundary_mismatch')
                              e.update({"csv_member":members[0].filename,"header":list(header),"row_count":n,"first_timestamp":first.isoformat(),"last_timestamp":last.isoformat(),"spacing_seconds_counts":{str(k):v for k,v in sorted(spacings.items())},"blank_counts_by_column":dict(blanks),"nonfinite_counts_by_column":dict(nonfinite),"schema_parseable_with_missingness":True}); parseable+=1
                  except Exception as exc:
                      e['schema_parseable_with_missingness']=False; e['reason']=f"{type(exc).__name__}:{exc}"; failures.append(f"{symbol}:{day}:{type(exc).__name__}:{exc}")
                  entries.append(e)
          report={"schema_version":"issue552_binance_metrics_structural_probe_v2","issue_number":552,"symbols":list(SYMBOLS),"dates":list(DATES),"expected_header":list(H),"planned_symbol_days":20,"available_symbol_days":available,"schema_parseable_symbol_days":parseable,"missing_urls":missing,"structural_failures":failures,"status":("PASS" if available==20 and parseable==20 and not failures else "PARTIAL_SOURCE" if parseable>0 and not failures else "INCOMPATIBLE_SOURCE"),"economic_values_inspected":False,"return_or_pnl_computed":False,"target_relation_computed":False,"entries":entries}
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); report['content_digest']=hashlib.sha256(canonical).hexdigest()
          rebuilt=(json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+'\n').encode()
          published=Path('/tmp/published/structural-report-v2.json').read_bytes()
          assert rebuilt==published
          Path('/tmp/issue552/rebuilt/fresh-verification.json').write_text(json.dumps({"schema_version":"issue552_metrics_fresh_verification_v1","source_run_id":34839323607,"source_artifact_id":10344824182,"source_artifact_api_digest":"sha256:ca50429b7037d7800b3e64fd29d806380efcd69c1b301941c78cff236f8accfe","structural_report_content_digest":report['content_digest'],"fresh_reconstruction_byte_equal":True,"status":report['status'],"economic_values_inspected":False,"return_or_pnl_computed":False,"target_relation_computed":False},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({"fresh_reconstruction_byte_equal":True,"status":report['status'],"structural_report_content_digest":report['content_digest']},sort_keys=True))
          PY

      - name: Upload fresh verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue552-metrics-fresh-verification-${{ github.run_id }}
          path: /tmp/issue552/rebuilt/fresh-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
