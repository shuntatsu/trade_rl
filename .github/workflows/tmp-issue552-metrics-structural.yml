name: Temporary Issue 552 metrics structural probe v2

on:
  push:
    branches:
      - verify/issue552-metrics-structural
    paths:
      - .github/workflows/tmp-issue552-metrics-structural.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Characterize frozen 20 symbol-days without economic summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue552/raw /tmp/issue552/out
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import math
          import subprocess
          import zipfile
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          SYMBOLS = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT")
          DATES = ("2021-01-01", "2021-07-01", "2022-01-01", "2022-07-01")
          ROOT = "https://data.binance.vision/data/futures/um/daily/metrics"
          EXPECTED_HEADER = (
              "create_time",
              "symbol",
              "sum_open_interest",
              "sum_open_interest_value",
              "count_toptrader_long_short_ratio",
              "sum_toptrader_long_short_ratio",
              "count_long_short_ratio",
              "sum_taker_long_short_vol_ratio",
          )

          def curl(url: str, target: Path) -> bool:
              result = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--location", "--retry", "2", "--output", str(target), url],
                  check=False,
              )
              return result.returncode == 0

          def parse_time(text: str) -> datetime:
              value = text.strip().replace("Z", "+00:00")
              parsed = datetime.fromisoformat(value)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          entries: list[dict[str, object]] = []
          missing_urls: list[str] = []
          structural_failures: list[str] = []
          available = 0
          structurally_parseable = 0

          for symbol in SYMBOLS:
              for day in DATES:
                  name = f"{symbol}-metrics-{day}.zip"
                  url = f"{ROOT}/{symbol}/{name}"
                  target = Path("/tmp/issue552/raw") / name
                  checksum_target = target.with_suffix(target.suffix + ".CHECKSUM")
                  entry: dict[str, object] = {"symbol": symbol, "date": day, "url": url}
                  if not curl(url, target):
                      entry.update({"available": False, "reason": "http_unavailable"})
                      missing_urls.append(f"{symbol}:{day}")
                      entries.append(entry)
                      continue

                  available += 1
                  payload = target.read_bytes()
                  raw_sha = hashlib.sha256(payload).hexdigest()
                  entry.update({"available": True, "raw_size": len(payload), "raw_sha256": raw_sha})
                  checksum_available = curl(url + ".CHECKSUM", checksum_target)
                  entry["checksum_available"] = checksum_available
                  if checksum_available:
                      expected = checksum_target.read_text(encoding="utf-8").strip().split()[0]
                      entry["checksum_verified"] = expected == raw_sha
                      if expected != raw_sha:
                          structural_failures.append(f"{symbol}:{day}:checksum_mismatch")
                  else:
                      entry["checksum_verified"] = None

                  try:
                      with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                          members = [x for x in archive.infolist() if not x.is_dir()]
                          if len(members) != 1 or not members[0].filename.lower().endswith(".csv"):
                              raise ValueError("archive_member_contract")
                          with archive.open(members[0], "r") as raw:
                              reader = csv.reader(io.TextIOWrapper(raw, encoding="utf-8-sig", newline=""))
                              header = tuple(next(reader))
                              if header != EXPECTED_HEADER:
                                  raise ValueError(f"header_mismatch:{header!r}")
                              blank_counts = Counter({name: 0 for name in EXPECTED_HEADER[2:]})
                              nonfinite_counts = Counter({name: 0 for name in EXPECTED_HEADER[2:]})
                              row_count = 0
                              first_ts: datetime | None = None
                              last_ts: datetime | None = None
                              previous_ts: datetime | None = None
                              spacings: Counter[int] = Counter()
                              for row in reader:
                                  if len(row) != len(EXPECTED_HEADER):
                                      raise ValueError("field_count_mismatch")
                                  if row[1] != symbol:
                                      raise ValueError("symbol_mismatch")
                                  timestamp = parse_time(row[0])
                                  if first_ts is None:
                                      first_ts = timestamp
                                  if previous_ts is not None:
                                      seconds = int((timestamp - previous_ts).total_seconds())
                                      if seconds < 0:
                                          raise ValueError("timestamp_decrease")
                                      spacings[seconds] += 1
                                  previous_ts = timestamp
                                  last_ts = timestamp
                                  for index, field in enumerate(EXPECTED_HEADER[2:], start=2):
                                      text = row[index].strip()
                                      if text == "":
                                          blank_counts[field] += 1
                                          continue
                                      value = float(text)
                                      if not math.isfinite(value):
                                          nonfinite_counts[field] += 1
                                  row_count += 1
                              if row_count == 0 or first_ts is None or last_ts is None:
                                  raise ValueError("empty_data")
                              expected_date = datetime.strptime(day, "%Y-%m-%d").date()
                              if first_ts.date() != expected_date or last_ts.date() != expected_date:
                                  raise ValueError("date_boundary_mismatch")
                              entry.update(
                                  {
                                      "csv_member": members[0].filename,
                                      "header": list(header),
                                      "row_count": row_count,
                                      "first_timestamp": first_ts.isoformat(),
                                      "last_timestamp": last_ts.isoformat(),
                                      "spacing_seconds_counts": {str(k): v for k, v in sorted(spacings.items())},
                                      "blank_counts_by_column": dict(blank_counts),
                                      "nonfinite_counts_by_column": dict(nonfinite_counts),
                                      "schema_parseable_with_missingness": True,
                                  }
                              )
                              structurally_parseable += 1
                  except Exception as exc:
                      entry["schema_parseable_with_missingness"] = False
                      entry["reason"] = f"{type(exc).__name__}:{exc}"
                      structural_failures.append(f"{symbol}:{day}:{type(exc).__name__}:{exc}")
                  entries.append(entry)

          report = {
              "schema_version": "issue552_binance_metrics_structural_probe_v2",
              "issue_number": 552,
              "symbols": list(SYMBOLS),
              "dates": list(DATES),
              "expected_header": list(EXPECTED_HEADER),
              "planned_symbol_days": len(SYMBOLS) * len(DATES),
              "available_symbol_days": available,
              "schema_parseable_symbol_days": structurally_parseable,
              "missing_urls": missing_urls,
              "structural_failures": structural_failures,
              "status": (
                  "PASS" if available == 20 and structurally_parseable == 20 and not structural_failures
                  else "PARTIAL_SOURCE" if structurally_parseable > 0 and not structural_failures
                  else "INCOMPATIBLE_SOURCE"
              ),
              "economic_values_inspected": False,
              "return_or_pnl_computed": False,
              "target_relation_computed": False,
              "entries": entries,
          }
          canonical = json.dumps(report, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          report["content_digest"] = hashlib.sha256(canonical).hexdigest()
          Path("/tmp/issue552/out/structural-report-v2.json").write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8"
          )
          print(json.dumps({
              "status": report["status"],
              "planned_symbol_days": report["planned_symbol_days"],
              "available_symbol_days": available,
              "schema_parseable_symbol_days": structurally_parseable,
              "missing_urls": missing_urls,
              "structural_failures": structural_failures,
              "entries": [
                  {
                      "symbol": x["symbol"],
                      "date": x["date"],
                      "available": x["available"],
                      "row_count": x.get("row_count"),
                      "first_timestamp": x.get("first_timestamp"),
                      "last_timestamp": x.get("last_timestamp"),
                      "spacing_seconds_counts": x.get("spacing_seconds_counts"),
                      "blank_counts_by_column": x.get("blank_counts_by_column"),
                      "checksum_verified": x.get("checksum_verified"),
                  }
                  for x in entries
              ],
              "content_digest": report["content_digest"],
          }, sort_keys=True))
          if report["status"] == "INCOMPATIBLE_SOURCE":
              raise SystemExit(2)
          PY

      - name: Upload structural-only report v2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue552-binance-metrics-structural-v2-${{ github.run_id }}
          path: /tmp/issue552/out/structural-report-v2.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
