name: Temporary Issue 553 type-spoofing RED

on:
  push:
    branches:
      - verify/issue553-prereg-3a82f8d
    paths:
      - .github/workflows/tmp-issue553-exact-head-seal.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 4a1f62ee4dfaef357739ba18efbe975eda31565c
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a1f62ee4dfaef357739ba18efbe975eda31565c
          persist-credentials: false
      - name: Assert exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Execute type-spoofing regression
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_aggtrades_predictive_flow_screen_protocol.py -k bool_int_equivalence_type_spoofing
