name: Temporary Issue 553 mypy narrow fix and targeted GREEN

on:
  push:
    branches:
      - verify/issue553-prereg-3a82f8d
    paths:
      - .github/workflows/tmp-issue553-exact-head-seal.yml

permissions:
  contents: write

jobs:
  fix-and-targeted:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 1bf1b3486eb22559d9447046738cf518ba6ca06c
    steps:
      - name: Checkout exact type-hardening head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1bf1b3486eb22559d9447046738cf518ba6ca06c
      - name: Assert exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Apply explicit datetime narrowing guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("trade_rl/evaluation/experiments/bootstrap/agg_flow_predictive_screen.py")
          text = path.read_text(encoding="utf-8")
          old = "            if isinstance(expected, datetime):\n                if actual.tzinfo is None or actual.utcoffset() is None:\n"
          new = "            if isinstance(expected, datetime):\n                if not isinstance(actual, datetime):\n                    raise ValueError(\n                        \"fields must match the preregistered predictive-flow contract\"\n                    )\n                if actual.tzinfo is None or actual.utcoffset() is None:\n"
          if text.count(old) != 1:
              raise SystemExit("expected datetime narrowing site not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format changed Python files
        run: |
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/agg_flow_predictive_screen.py \
            tests/evaluation/experiments/bootstrap/test_aggtrades_predictive_flow_screen_protocol.py
      - name: Static and targeted GREEN
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_capacity_protocol.py \
            tests/evaluation/experiments/bootstrap/test_aggtrades_flow_calibration.py \
            tests/evaluation/experiments/bootstrap/test_aggtrades_predictive_flow_screen_protocol.py
      - name: Commit verified narrowing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/agg_flow_predictive_screen.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: narrow datetime contract values explicitly"
          git push origin HEAD:research/issue553-aggtrades-predictive-flow-prereg
