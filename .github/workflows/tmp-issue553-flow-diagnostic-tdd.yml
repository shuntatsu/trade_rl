name: Temporary Issue 553 flow diagnostic TDD

on:
  push:
    branches:
      - run/issue553-flow-diagnostic
    paths:
      - tools/issue553_flow_diagnostic.py
      - tests/research/test_issue553_flow_diagnostic.py
      - .github/workflows/tmp-issue553-flow-diagnostic-tdd.yml

permissions:
  contents: read

jobs:
  diagnostic-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: |
          uv run ruff check tools/issue553_flow_diagnostic.py tests/research/test_issue553_flow_diagnostic.py
          uv run ruff format --check tools/issue553_flow_diagnostic.py tests/research/test_issue553_flow_diagnostic.py
          uv run mypy tools/issue553_flow_diagnostic.py
          uv run pytest -q tests/research/test_issue553_flow_diagnostic.py
