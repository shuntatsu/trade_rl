name: Temporary Issue 553 flow prereg TDD

on:
  push:
    branches:
      - research/issue553-aggtrades-flow-diagnostic-prereg
    paths:
      - trade_rl/evaluation/experiments/bootstrap/agg_flow_predictive_diagnostic.py
      - tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py
      - .github/workflows/tmp-issue553-flow-prereg-tdd.yml

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py
      - name: Show exact formatter diff
        run: |
          uv run ruff format tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py
          git diff -- tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py
          test -z "$(git status --short -- tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py)"
      - run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_aggtrades_flow_predictive_diagnostic_protocol.py
