name: Temporary Issue 555 premium-index structural probe

on:
  push:
    branches:
      - verify/issue555-premium-structural
    paths:
      - .github/workflows/tmp-issue555-premium-structural.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Probe frozen 20 monthly archives without premium-value summaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue555/raw /tmp/issue555/out
          python3 - <<'PY'
          from __future__ import annotations
          import calendar, csv, hashlib, io, json, math, subprocess, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          SYMBOLS=("BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","ADAUSDT")
          MONTHS=("2021-01","2021-07","2022-01","2022-07")
          ROOT="https://data.binance.vision/data/futures/um/monthly/premiumIndexKlines"

          def curl(url: str, target: Path) -> bool:
              return subprocess.run(["curl","--fail","--silent","--show-error","--location","--retry","2","--output",str(target),url],check=False).returncode==0

          def ms_to_iso(value: str) -> str:
              raw=int(value)
              if raw < 0: raise ValueError("negative timestamp")
              return datetime.fromtimestamp(raw/1000.0,tz=timezone.utc).isoformat()

          entries=[]; headers=set(); field_counts=set(); missing=[]; failures=[]; available=0; valid=0
          for symbol in SYMBOLS:
              for month in MONTHS:
                  name=f"{symbol}-1h-{month}.zip"
                  url=f"{ROOT}/{symbol}/1h/{name}"
                  target=Path('/tmp/issue555/raw')/name
                  check=target.with_suffix(target.suffix+'.CHECKSUM')
                  e={"symbol":symbol,"month":month,"url":url}
                  if not curl(url,target):
                      e.update({"available":False,"reason":"http_unavailable"}); missing.append(f"{symbol}:{month}"); entries.append(e); continue
                  available+=1; payload=target.read_bytes(); sha=hashlib.sha256(payload).hexdigest()
                  e.update({"available":True,"raw_size":len(payload),"raw_sha256":sha})
                  ca=curl(url+'.CHECKSUM',check); e['checksum_available']=ca
                  if ca:
                      expected=check.read_text(encoding='utf-8').strip().split()[0]; e['checksum_verified']=expected==sha
                      if expected!=sha: failures.append(f"{symbol}:{month}:checksum_mismatch")
                  else: e['checksum_verified']=None
                  try:
                      with zipfile.ZipFile(io.BytesIO(payload)) as z:
                          members=[x for x in z.infolist() if not x.is_dir()]
                          if len(members)!=1 or not members[0].filename.lower().endswith('.csv'): raise ValueError('archive_member_contract')
                          with z.open(members[0],'r') as raw:
                              rows=list(csv.reader(io.TextIOWrapper(raw,encoding='utf-8-sig',newline='')))
                      if not rows: raise ValueError('empty_csv')
                      first=rows[0]
                      header_present=False
                      try: int(first[0])
                      except (ValueError,IndexError): header_present=True
                      header=tuple(first) if header_present else ()
                      data=rows[1:] if header_present else rows
                      if header_present: headers.add(header)
                      if not data: raise ValueError('no_data_rows')
                      counts={len(row) for row in data}; field_counts.update(counts)
                      if len(counts)!=1: raise ValueError(f'inconsistent_field_counts:{sorted(counts)}')
                      field_count=next(iter(counts))
                      if field_count != 12: raise ValueError(f'expected_12_fields:{field_count}')
                      open_times=[]; close_times=[]
                      for row in data:
                          open_ms=int(row[0]); close_ms=int(row[6])
                          if close_ms < open_ms: raise ValueError('close_before_open')
                          open_times.append(open_ms); close_times.append(close_ms)
                          for index,text in enumerate(row):
                              if index in (0,6): continue
                              value=float(text)
                              if not math.isfinite(value): raise ValueError(f'nonfinite_field_{index}')
                      if any(b<=a for a,b in zip(open_times,open_times[1:])): raise ValueError('open_times_not_strict')
                      spacings=sorted(set(b-a for a,b in zip(open_times,open_times[1:])))
                      if spacings != [3_600_000]: raise ValueError(f'unexpected_spacing_ms:{spacings}')
                      year,mon=map(int,month.split('-')); days=calendar.monthrange(year,mon)[1]
                      expected_rows=days*24
                      expected_first=int(datetime(year,mon,1,tzinfo=timezone.utc).timestamp()*1000)
                      if mon==12: next_dt=datetime(year+1,1,1,tzinfo=timezone.utc)
                      else: next_dt=datetime(year,mon+1,1,tzinfo=timezone.utc)
                      expected_last=int((next_dt.timestamp()*1000)-3_600_000)
                      if len(data)!=expected_rows or open_times[0]!=expected_first or open_times[-1]!=expected_last:
                          raise ValueError(f'incomplete_month:rows={len(data)} expected={expected_rows}')
                      e.update({"csv_member":members[0].filename,"header_present":header_present,"header":list(header),"field_count":field_count,"row_count":len(data),"first_open_time":ms_to_iso(str(open_times[0])),"last_open_time":ms_to_iso(str(open_times[-1])),"spacing_ms":spacings,"complete_month":True,"structurally_valid":True}); valid+=1
                  except Exception as exc:
                      e['structurally_valid']=False; e['reason']=f"{type(exc).__name__}:{exc}"; failures.append(f"{symbol}:{month}:{type(exc).__name__}:{exc}")
                  entries.append(e)

          if available==20 and valid==20 and not failures and len(field_counts)==1 and len(headers)<=1: status='PASS'
          elif valid>0 and len(field_counts)<=1 and len(headers)<=1: status='PARTIAL_SOURCE'
          else: status='INCOMPATIBLE_SOURCE'
          report={"schema_version":"issue555_premium_index_structural_probe_v1","issue_number":555,"symbols":list(SYMBOLS),"months":list(MONTHS),"planned_archives":20,"available_archives":available,"valid_archives":valid,"distinct_headers":[list(x) for x in sorted(headers)],"distinct_field_counts":sorted(field_counts),"missing_archives":missing,"structural_failures":failures,"status":status,"economic_values_inspected":False,"return_or_pnl_computed":False,"target_relation_computed":False,"entries":entries}
          canonical=json.dumps(report,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); report['content_digest']=hashlib.sha256(canonical).hexdigest()
          Path('/tmp/issue555/out/structural-report.json').write_text(json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+'\n',encoding='utf-8')
          print(json.dumps({"status":status,"planned_archives":20,"available_archives":available,"valid_archives":valid,"distinct_headers":report['distinct_headers'],"distinct_field_counts":report['distinct_field_counts'],"missing_archives":missing,"structural_failures":failures,"content_digest":report['content_digest'],"entries":[{"symbol":x['symbol'],"month":x['month'],"available":x['available'],"row_count":x.get('row_count'),"first_open_time":x.get('first_open_time'),"last_open_time":x.get('last_open_time'),"spacing_ms":x.get('spacing_ms'),"checksum_verified":x.get('checksum_verified')} for x in entries]},sort_keys=True))
          if status=='INCOMPATIBLE_SOURCE': raise SystemExit(2)
          PY

      - name: Upload structural report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue555-premium-structural-${{ github.run_id }}
          path: /tmp/issue555/out/structural-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
