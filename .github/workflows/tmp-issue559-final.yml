name: Temporary Issue 559 final exact-head verification and seal

on:
  push:
    branches:
      - verify/issue559-red-8dab31c
    paths:
      - .github/workflows/tmp-issue559-final.yml

permissions:
  contents: read

jobs:
  core:
    name: Lean Core exact final head
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
    steps:
      - name: Checkout exact final head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Core tests
        run: uv run pytest -q tests
      - name: Build
        run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          print("clean installed core public imports and identity: OK")
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help
      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

  guide:
    name: Human Guide exact final head
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
      GUIDE_SOURCE_REV: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
    steps:
      - name: Checkout exact final head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci
      - name: Guide source contract
        working-directory: guide
        run: npm run source-check
      - name: Guide lint
        working-directory: guide
        run: npm run lint
      - name: Guide typecheck
        working-directory: guide
        run: npm run typecheck
      - name: Guide unit tests
        working-directory: guide
        run: npm run test
      - name: Guide build
        working-directory: guide
        run: npm run build
      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e

  seal-producer:
    name: seal-producer final head
    needs: [core, guide]
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
    steps:
      - name: Checkout exact final head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Targeted protocol verification
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py
      - name: Build immutable protocol seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seal
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.evaluation.experiments.bootstrap.signed_taker_flow_prereg import canonical_signed_taker_flow_protocol

          target = os.environ["TARGET_SHA"]
          protocol = canonical_signed_taker_flow_protocol()
          protocol_bytes = (
              json.dumps(protocol.to_payload(), allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode("utf-8")
          Path("seal/protocol.json").write_bytes(protocol_bytes)
          metadata = {
              "schema_version": "issue559_signed_taker_flow_prereg_seal_v1",
              "target_sha": target,
              "full_verification_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", f"{target}:trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py"], text=True
              ).strip(),
              "test_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", f"{target}:tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py"], text=True
              ).strip(),
              "protocol_digest": protocol.digest,
              "protocol_json_sha256": hashlib.sha256(protocol_bytes).hexdigest(),
              "training_relation_executed": False,
              "evaluation_pnl_inspected": False,
          }
          Path("seal/metadata.json").write_text(
              json.dumps(metadata, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, sort_keys=True))
          PY
          (cd seal && sha256sum metadata.json protocol.json > SHA256SUMS)
          (cd seal && sha256sum -c SHA256SUMS)
      - name: Upload protocol seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue559-prereg-seal-9c8aedb
          path: seal/
          if-no-files-found: error
          retention-days: 90

  fresh-verifier:
    name: fresh-verifier final head
    needs: seal-producer
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
    steps:
      - name: Checkout exact final head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9c8aedb2d59430758158a9f291c1b697fe0ab1b5
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Download producer seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue559-prereg-seal-9c8aedb
          path: sealed
      - name: Independently reconstruct and compare
        shell: bash
        run: |
          set -euo pipefail
          (cd sealed && sha256sum -c SHA256SUMS)
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.evaluation.experiments.bootstrap.signed_taker_flow_prereg import canonical_signed_taker_flow_protocol, load_signed_taker_flow_protocol

          target = os.environ["TARGET_SHA"]
          metadata = json.loads(Path("sealed/metadata.json").read_text(encoding="utf-8"))
          assert metadata["schema_version"] == "issue559_signed_taker_flow_prereg_seal_v1"
          assert metadata["target_sha"] == target
          assert metadata["full_verification_run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert metadata["training_relation_executed"] is False
          assert metadata["evaluation_pnl_inspected"] is False
          assert metadata["source_blob_sha"] == subprocess.check_output(
              ["git", "rev-parse", f"{target}:trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py"], text=True
          ).strip()
          assert metadata["test_blob_sha"] == subprocess.check_output(
              ["git", "rev-parse", f"{target}:tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py"], text=True
          ).strip()
          protocol = canonical_signed_taker_flow_protocol()
          fresh = (
              json.dumps(protocol.to_payload(), allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode("utf-8")
          sealed = Path("sealed/protocol.json").read_bytes()
          assert fresh == sealed
          assert hashlib.sha256(sealed).hexdigest() == metadata["protocol_json_sha256"]
          assert protocol.digest == metadata["protocol_digest"]
          loaded = load_signed_taker_flow_protocol("sealed/protocol.json")
          assert loaded == protocol
          assert loaded.digest == protocol.digest
          print(json.dumps(metadata, sort_keys=True))
          PY
