name: Temporary Issue 559 final-head seal verification

on:
  push:
    branches:
      - verify/issue559-red-8dab31c
    paths:
      - .github/workflows/tmp-issue559-final.yml

permissions:
  contents: read

jobs:
  seal-producer:
    name: seal-producer current head
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ea73d8995f9a46623a1571da80f0977c6bf05c8c
      FULL_VERIFY_RUN_ID: "34844335176"
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ea73d8995f9a46623a1571da80f0977c6bf05c8c
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Targeted protocol verification
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py
      - name: Build immutable protocol seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seal
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.evaluation.experiments.bootstrap.signed_taker_flow_prereg import canonical_signed_taker_flow_protocol

          target = os.environ["TARGET_SHA"]
          protocol = canonical_signed_taker_flow_protocol()
          protocol_bytes = (
              json.dumps(protocol.to_payload(), allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode("utf-8")
          Path("seal/protocol.json").write_bytes(protocol_bytes)
          metadata = {
              "schema_version": "issue559_signed_taker_flow_prereg_seal_v1",
              "target_sha": target,
              "full_verification_run_id": int(os.environ["FULL_VERIFY_RUN_ID"]),
              "source_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", f"{target}:trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py"], text=True
              ).strip(),
              "test_blob_sha": subprocess.check_output(
                  ["git", "rev-parse", f"{target}:tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py"], text=True
              ).strip(),
              "protocol_digest": protocol.digest,
              "protocol_json_sha256": hashlib.sha256(protocol_bytes).hexdigest(),
              "training_relation_executed": False,
              "evaluation_pnl_inspected": False,
          }
          Path("seal/metadata.json").write_text(
              json.dumps(metadata, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, sort_keys=True))
          PY
          (cd seal && sha256sum metadata.json protocol.json > SHA256SUMS)
          (cd seal && sha256sum -c SHA256SUMS)
      - name: Upload protocol seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue559-prereg-seal-ea73d89
          path: seal/
          if-no-files-found: error
          retention-days: 90

  fresh-verifier:
    name: fresh-verifier current head
    needs: seal-producer
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ea73d8995f9a46623a1571da80f0977c6bf05c8c
      FULL_VERIFY_RUN_ID: "34844335176"
    steps:
      - name: Checkout exact current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ea73d8995f9a46623a1571da80f0977c6bf05c8c
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Download producer seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue559-prereg-seal-ea73d89
          path: sealed
      - name: Independently reconstruct and compare
        shell: bash
        run: |
          set -euo pipefail
          (cd sealed && sha256sum -c SHA256SUMS)
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from trade_rl.evaluation.experiments.bootstrap.signed_taker_flow_prereg import canonical_signed_taker_flow_protocol, load_signed_taker_flow_protocol

          target = os.environ["TARGET_SHA"]
          metadata = json.loads(Path("sealed/metadata.json").read_text(encoding="utf-8"))
          assert metadata["schema_version"] == "issue559_signed_taker_flow_prereg_seal_v1"
          assert metadata["target_sha"] == target
          assert metadata["full_verification_run_id"] == int(os.environ["FULL_VERIFY_RUN_ID"])
          assert metadata["training_relation_executed"] is False
          assert metadata["evaluation_pnl_inspected"] is False
          assert metadata["source_blob_sha"] == subprocess.check_output(
              ["git", "rev-parse", f"{target}:trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py"], text=True
          ).strip()
          assert metadata["test_blob_sha"] == subprocess.check_output(
              ["git", "rev-parse", f"{target}:tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py"], text=True
          ).strip()
          protocol = canonical_signed_taker_flow_protocol()
          fresh = (
              json.dumps(protocol.to_payload(), allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n"
          ).encode("utf-8")
          sealed = Path("sealed/protocol.json").read_bytes()
          assert fresh == sealed
          assert hashlib.sha256(sealed).hexdigest() == metadata["protocol_json_sha256"]
          assert protocol.digest == metadata["protocol_digest"]
          loaded = load_signed_taker_flow_protocol("sealed/protocol.json")
          assert loaded == protocol
          assert loaded.digest == protocol.digest
          print(json.dumps(metadata, sort_keys=True))
          PY
