name: Temporary Issue 559 remove unused ignore and verify

on:
  push:
    branches:
      - verify/issue559-red-8dab31c
    paths:
      - .github/workflows/tmp-issue559-red.yml

permissions:
  contents: write

jobs:
  fix-and-targeted:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 6cd31f84498dd1e1720d39899927fefc3f3c860b
    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cd31f84498dd1e1720d39899927fefc3f3c860b
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Remove only the unused loader ignore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py")
          text = path.read_text(encoding="utf-8")
          old = '    protocol = SignedTakerFlowProtocol(**payload)  # type: ignore[arg-type]\n'
          new = '    protocol = SignedTakerFlowProtocol(**payload)\n'
          if text.count(old) != 1:
              raise SystemExit("expected unused-ignore site not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static and targeted GREEN
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_prereg.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: remove obsolete taker-flow mypy suppression"
          git push origin HEAD:research/issue558-taker-flow-prereg
