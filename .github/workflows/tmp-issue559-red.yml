name: Temporary Issue 559 current-head targeted verification

on:
  push:
    branches:
      - verify/issue559-red-8dab31c
    paths:
      - .github/workflows/tmp-issue559-red.yml

permissions:
  contents: read

jobs:
  targeted-current-head:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 6cd31f84498dd1e1720d39899927fefc3f3c860b
    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6cd31f84498dd1e1720d39899927fefc3f3c860b
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static and targeted verification
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_prereg.py
