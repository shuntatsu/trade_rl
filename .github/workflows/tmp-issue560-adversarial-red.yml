name: Temporary Issue 560 adversarial RED

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-adversarial-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 0186a3a18ff14a5529de1f8869b1e45f461c036b
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0186a3a18ff14a5529de1f8869b1e45f461c036b
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Write adversarial tests only
        shell: bash
        run: |
          cat > tests/data/test_signed_taker_flow_adversarial_tmp.py <<'PY'
          from __future__ import annotations

          import numpy as np
          import pytest

          from trade_rl.data.build import MarketDatasetBuilder
          from trade_rl.data.contracts import (
              FeatureKind,
              FeatureSpec,
              InstrumentContract,
              MarketBuildConfig,
              VolumeUnit,
          )
          from trade_rl.data.source import InMemoryMarketDataSource, RawMarketSeries


          def _series(*, tradable: np.ndarray | None = None) -> RawMarketSeries:
              n = 50
              timestamps = np.datetime64("2022-01-01T00:00:00", "ns") + np.arange(
                  n
              ) * np.timedelta64(1, "h")
              close = 100.0 + np.arange(n, dtype=np.float64)
              return RawMarketSeries(
                  timestamps=timestamps,
                  available_at=timestamps,
                  open=np.concatenate((close[:1], close[:-1])),
                  high=close + 1.0,
                  low=close - 1.0,
                  close=close,
                  volume=np.full(n, 10.0, dtype=np.float64),
                  funding_rate=np.zeros(n, dtype=np.float64),
                  tradable=(
                      np.ones(n, dtype=np.bool_)
                      if tradable is None
                      else tradable
                  ),
                  taker_buy_quote_volume=np.full(n, 6.0, dtype=np.float64),
              )


          def _builder() -> MarketDatasetBuilder:
              return MarketDatasetBuilder(
                  MarketBuildConfig(
                      base_timeframe="1h",
                      features=(
                          FeatureSpec(
                              name="1h__signed_taker_quote_flow_24bar",
                              kind=FeatureKind.SIGNED_TAKER_QUOTE_FLOW,
                              lookback=24,
                          ),
                      ),
                  )
              )


          def test_invalid_current_window_is_not_hidden_by_stale_carry() -> None:
              tradable = np.ones(50, dtype=np.bool_)
              tradable[24] = False
              dataset = _builder().build(
                  InMemoryMarketDataSource({"BTCUSDT": _series(tradable=tradable)}),
                  (
                      InstrumentContract(
                          symbol="BTCUSDT",
                          volume_unit=VolumeUnit.QUOTE_NOTIONAL,
                      ),
                  ),
              )

              assert dataset.feature_available[23, 0, 0]
              assert not dataset.feature_available[24, 0, 0]
              assert dataset.features[24, 0, 0] == 0.0


          def test_signed_taker_flow_requires_quote_notional_volume_semantics() -> None:
              with pytest.raises(ValueError, match="quote|notional"):
                  _builder().build(
                      InMemoryMarketDataSource({"BTCUSDT": _series()}),
                      (InstrumentContract(symbol="BTCUSDT"),),
                  )
          PY
      - name: Static check adversarial tests
        run: |
          uv run ruff check tests/data/test_signed_taker_flow_adversarial_tmp.py
          uv run ruff format --check tests/data/test_signed_taker_flow_adversarial_tmp.py
      - name: Expected semantic RED
        run: uv run pytest -q tests/data/test_signed_taker_flow_adversarial_tmp.py
