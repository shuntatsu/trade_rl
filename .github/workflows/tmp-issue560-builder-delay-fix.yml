name: Temporary Issue 560 builder delayed-availability fix

on:
  push:
    branches:
      - automation/issue560-builder-delay-fix
    paths:
      - .github/workflows/tmp-issue560-builder-delay-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue560-signed-taker-flow
  TARGET_SHA: 1679a89262e62bb7454ce0168773d1f3e2c982ec

jobs:
  fix_and_verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Apply signed-flow-only point-in-time availability repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected exactly one patch site")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "trade_rl/data/build/builder.py",
              '''                        row_present=causal_row_present[:, symbol_index],
                        active=symbol_active[:, symbol_index],
''',
              '''                        row_present=(
                            row_present[:, symbol_index]
                            if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW
                            else causal_row_present[:, symbol_index]
                        ),
                        active=symbol_active[:, symbol_index],
''',
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              '''                    if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:
                        values = event_values
                        available = event_valid
                        age_hours = np.full(
                            n_bars, spec.max_staleness_hours, dtype=np.float64
                        )
                        staleness = np.ones(n_bars, dtype=np.float64)
                        age_hours[event_valid] = 0.0
                        staleness[event_valid] = 0.0
''',
              '''                    if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:
                        decision_information_valid = np.zeros(n_bars, dtype=np.bool_)
                        for event_index in np.flatnonzero(event_valid):
                            start = int(event_index) - spec.lookback + 1
                            if start < 0:
                                continue
                            decision_information_valid[event_index] = bool(
                                np.all(
                                    available_at[
                                        start : int(event_index) + 1,
                                        symbol_index,
                                    ]
                                    <= timestamps[event_index]
                                )
                            )
                        event_valid = event_valid & decision_information_valid
                        event_values = event_values.copy()
                        event_values[~event_valid] = 0.0
                        values = event_values
                        available = event_valid
                        age_hours = np.full(
                            n_bars, spec.max_staleness_hours, dtype=np.float64
                        )
                        staleness = np.ones(n_bars, dtype=np.float64)
                        age_hours[event_valid] = 0.0
                        staleness[event_valid] = 0.0
''',
          )

          test_path = Path("tests/data/test_signed_taker_flow_identity_compat.py")
          text = test_path.read_text()
          marker = "def test_builder_signed_flow_respects_delayed_row_at_each_decision_time"
          if marker in text:
              raise RuntimeError("delayed builder test already exists")
          text += '''\n\ndef test_builder_signed_flow_respects_delayed_row_at_each_decision_time() -> None:\n    n = 30\n    timestamps = np.datetime64("2022-01-01T00:00:00", "ns") + np.arange(\n        n\n    ) * np.timedelta64(1, "h")\n    close = 100.0 + np.arange(n, dtype=np.float64)\n    available_at = timestamps.copy()\n    available_at[5] = timestamps[24]\n    raw = RawMarketSeries(\n        timestamps=timestamps,\n        available_at=available_at,\n        open=np.concatenate((close[:1], close[:-1])),\n        high=close + 1.0,\n        low=close - 1.0,\n        close=close,\n        volume=np.full(n, 10.0, dtype=np.float64),\n        taker_buy_quote_volume=np.full(n, 6.0, dtype=np.float64),\n        funding_rate=np.zeros(n, dtype=np.float64),\n        tradable=np.ones(n, dtype=np.bool_),\n    )\n    dataset = _signed_flow_builder().build(\n        InMemoryMarketDataSource({"BTCUSDT": raw}),\n        (\n            InstrumentContract(\n                symbol="BTCUSDT",\n                volume_unit=VolumeUnit.QUOTE_NOTIONAL,\n            ),\n        ),\n    )\n\n    assert not dataset.feature_available[23, 0, 0]\n    assert dataset.features[23, 0, 0] == 0.0\n    assert dataset.feature_available[24, 0, 0]\n    assert dataset.features[24, 0, 0] == np.float32(0.2)\n'''
          test_path.write_text(text)
          PY
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and static checks
        run: |
          uv run ruff format trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          uv run ruff check trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          uv run mypy trade_rl/data/build/builder.py
      - name: Targeted signed-flow regressions
        run: |
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_market_builder.py \
            tests/data/test_information_availability.py
      - name: Recheck target and publish only verified changes
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: respect delayed signed-flow source availability"
          git push origin HEAD:"$TARGET_BRANCH"
