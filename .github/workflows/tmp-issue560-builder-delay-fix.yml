name: Temporary Issue 560 builder delayed-availability fix

on:
  push:
    branches:
      - automation/issue560-builder-delay-fix
    paths:
      - .github/workflows/tmp-issue560-builder-delay-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue560-signed-taker-flow
  TARGET_SHA: 1679a89262e62bb7454ce0168773d1f3e2c982ec

jobs:
  fix_and_verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Apply signed-flow-only point-in-time availability repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          builder = Path("trade_rl/data/build/builder.py")
          text = builder.read_text()
          old = "                        row_present=causal_row_present[:, symbol_index],\n                        active=symbol_active[:, symbol_index],\n"
          new = "                        row_present=(\n                            row_present[:, symbol_index]\n                            if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW\n                            else causal_row_present[:, symbol_index]\n                        ),\n                        active=symbol_active[:, symbol_index],\n"
          if text.count(old) != 1:
              raise RuntimeError("builder row_present patch site is not unique")
          text = text.replace(old, new, 1)

          old = "                    if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:\n                        values = event_values\n                        available = event_valid\n                        age_hours = np.full(\n                            n_bars, spec.max_staleness_hours, dtype=np.float64\n                        )\n                        staleness = np.ones(n_bars, dtype=np.float64)\n                        age_hours[event_valid] = 0.0\n                        staleness[event_valid] = 0.0\n"
          new = "                    if spec.kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:\n                        decision_information_valid = np.zeros(n_bars, dtype=np.bool_)\n                        for event_index in np.flatnonzero(event_valid):\n                            start = int(event_index) - spec.lookback + 1\n                            if start < 0:\n                                continue\n                            decision_information_valid[event_index] = bool(\n                                np.all(\n                                    available_at[\n                                        start : int(event_index) + 1,\n                                        symbol_index,\n                                    ]\n                                    <= timestamps[event_index]\n                                )\n                            )\n                        event_valid = event_valid & decision_information_valid\n                        event_values = event_values.copy()\n                        event_values[~event_valid] = 0.0\n                        values = event_values\n                        available = event_valid\n                        age_hours = np.full(\n                            n_bars, spec.max_staleness_hours, dtype=np.float64\n                        )\n                        staleness = np.ones(n_bars, dtype=np.float64)\n                        age_hours[event_valid] = 0.0\n                        staleness[event_valid] = 0.0\n"
          if text.count(old) != 1:
              raise RuntimeError("builder signed-flow availability patch site is not unique")
          builder.write_text(text.replace(old, new, 1))

          test_path = Path("tests/data/test_signed_taker_flow_identity_compat.py")
          text = test_path.read_text()
          marker = "def test_builder_signed_flow_respects_delayed_row_at_each_decision_time"
          if marker in text:
              raise RuntimeError("delayed builder test already exists")
          addition = '''

          def test_builder_signed_flow_respects_delayed_row_at_each_decision_time() -> None:
              n = 30
              timestamps = np.datetime64("2022-01-01T00:00:00", "ns") + np.arange(
                  n
              ) * np.timedelta64(1, "h")
              close = 100.0 + np.arange(n, dtype=np.float64)
              available_at = timestamps.copy()
              available_at[5] = timestamps[24]
              raw = RawMarketSeries(
                  timestamps=timestamps,
                  available_at=available_at,
                  open=np.concatenate((close[:1], close[:-1])),
                  high=close + 1.0,
                  low=close - 1.0,
                  close=close,
                  volume=np.full(n, 10.0, dtype=np.float64),
                  taker_buy_quote_volume=np.full(n, 6.0, dtype=np.float64),
                  funding_rate=np.zeros(n, dtype=np.float64),
                  tradable=np.ones(n, dtype=np.bool_),
              )
              dataset = _signed_flow_builder().build(
                  InMemoryMarketDataSource({"BTCUSDT": raw}),
                  (
                      InstrumentContract(
                          symbol="BTCUSDT",
                          volume_unit=VolumeUnit.QUOTE_NOTIONAL,
                      ),
                  ),
              )

              assert not dataset.feature_available[23, 0, 0]
              assert dataset.features[23, 0, 0] == 0.0
              assert dataset.feature_available[24, 0, 0]
              assert dataset.features[24, 0, 0] == np.float32(0.2)
          '''
          test_path.write_text(text + addition)
          PY
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and static checks
        run: |
          uv run ruff format trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          uv run ruff check trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          uv run mypy trade_rl/data/build/builder.py
      - name: Targeted signed-flow regressions
        run: |
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_market_builder.py \
            tests/data/test_information_availability.py
      - name: Recheck target and publish only verified changes
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/data/build/builder.py tests/data/test_signed_taker_flow_identity_compat.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: respect delayed signed-flow source availability"
          git push origin HEAD:"$TARGET_BRANCH"
