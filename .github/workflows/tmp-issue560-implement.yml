name: Temporary Issue 560 implementation

on:
  push:
    branches:
      - verify/issue560-implement
    paths:
      - .github/workflows/tmp-issue560-implement.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue560-signed-taker-flow
  EXPECTED_HEAD: ffd4bf3664ae6366327b5c53747533383eac53e6

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - name: Bind exact branch head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Apply minimal production implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Raw source contract: optional, immutable taker-buy quote volume.
          replace_once(
              "trade_rl/data/source.py",
              "    funding_event_count: np.ndarray | None = None\n",
              "    funding_event_count: np.ndarray | None = None\n"
              "    taker_buy_quote_volume: np.ndarray | None = None\n",
          )
          replace_once(
              "trade_rl/data/source.py",
              "        expected = timestamps.shape\n        for field_name, array in arrays.items():\n",
              "        expected = timestamps.shape\n"
              "        taker_buy_quote_volume = (\n"
              "            None\n"
              "            if self.taker_buy_quote_volume is None\n"
              "            else _readonly(\n"
              "                self.taker_buy_quote_volume, dtype=np.dtype(np.float64)\n"
              "            )\n"
              "        )\n"
              "        if taker_buy_quote_volume is not None:\n"
              "            if taker_buy_quote_volume.shape != expected:\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume shape must match timestamps\"\n"
              "                )\n"
              "            if not np.isfinite(taker_buy_quote_volume).all():\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume must contain only finite values\"\n"
              "                )\n"
              "            if np.any(taker_buy_quote_volume < 0.0):\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume must be non-negative\"\n"
              "                )\n"
              "            if np.any(taker_buy_quote_volume > arrays[\"volume\"]):\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume cannot exceed volume\"\n"
              "                )\n"
              "        for field_name, array in arrays.items():\n",
          )
          replace_once(
              "trade_rl/data/source.py",
              "        for field_name, array in arrays.items():\n            object.__setattr__(self, field_name, array)\n",
              "        for field_name, array in arrays.items():\n"
              "            object.__setattr__(self, field_name, array)\n"
              "        object.__setattr__(\n"
              "            self, \"taker_buy_quote_volume\", taker_buy_quote_volume\n"
              "        )\n",
          )

          # Frozen feature kind.
          replace_once(
              "trade_rl/data/contracts.py",
              "    CROSS_ASSET_DISPERSION = \"cross_asset_dispersion\"\n",
              "    CROSS_ASSET_DISPERSION = \"cross_asset_dispersion\"\n"
              "    SIGNED_TAKER_QUOTE_FLOW = \"signed_taker_quote_flow\"\n",
          )

          # Feature API remains backward-compatible; signed flow alone needs extra inputs.
          replace_once(
              "trade_rl/data/features/core.py",
              "    row_present: np.ndarray,\n    active: np.ndarray,\n) -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
              "    row_present: np.ndarray,\n"
              "    active: np.ndarray,\n"
              "    taker_buy_quote_volume: np.ndarray | None = None,\n"
              "    tradable: np.ndarray | None = None,\n"
              ") -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
          )
          replace_once(
              "trade_rl/data/features/core.py",
              "    kind = FeatureKind(spec.kind)\n\n    if kind is FeatureKind.FUNDING_BPS:\n",
              "    kind = FeatureKind(spec.kind)\n"
              "    if taker_buy_quote_volume is not None and np.asarray(\n"
              "        taker_buy_quote_volume\n"
              "    ).shape != (n_bars,):\n"
              "        raise ValueError(\n"
              "            \"feature input arrays must have identical one-dimensional shape\"\n"
              "        )\n"
              "    if tradable is not None and np.asarray(tradable).shape != (n_bars,):\n"
              "        raise ValueError(\n"
              "            \"feature input arrays must have identical one-dimensional shape\"\n"
              "        )\n\n"
              "    if kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:\n"
              "        if spec.lookback != 24:\n"
              "            raise ValueError(\"signed taker quote flow requires lookback 24\")\n"
              "        if spec.normalization is not NormalizationMode.NONE:\n"
              "            raise ValueError(\n"
              "                \"signed taker quote flow does not support normalization\"\n"
              "            )\n"
              "        if spec.timeframe not in (None, \"1h\"):\n"
              "            raise ValueError(\"signed taker quote flow requires 1h timeframe\")\n"
              "        if taker_buy_quote_volume is None:\n"
              "            return values, valid, source_start\n"
              "        if tradable is None:\n"
              "            raise ValueError(\"signed taker quote flow requires tradable input\")\n"
              "        quote = np.asarray(volume, dtype=np.float64)\n"
              "        taker = np.asarray(taker_buy_quote_volume, dtype=np.float64)\n"
              "        if not np.isfinite(quote).all() or np.any(quote < 0.0):\n"
              "            raise ValueError(\"signed taker quote volume must be finite and non-negative\")\n"
              "        if not np.isfinite(taker).all():\n"
              "            raise ValueError(\n"
              "                \"taker_buy_quote_volume must contain only finite values\"\n"
              "            )\n"
              "        if np.any(taker < 0.0):\n"
              "            raise ValueError(\"taker_buy_quote_volume must be non-negative\")\n"
              "        if np.any(taker > quote):\n"
              "            raise ValueError(\"taker_buy_quote_volume cannot exceed volume\")\n"
              "        signed_usable = usable & np.asarray(tradable, dtype=np.bool_)\n"
              "        for index in range(23, n_bars):\n"
              "            start = index - 23\n"
              "            if not _window_is_valid(signed_usable, start, index + 1):\n"
              "                continue\n"
              "            quote_total = math.fsum(\n"
              "                float(item) for item in quote[start : index + 1]\n"
              "            )\n"
              "            if quote_total <= 0.0:\n"
              "                continue\n"
              "            taker_total = math.fsum(\n"
              "                float(item) for item in taker[start : index + 1]\n"
              "            )\n"
              "            value = (2.0 * taker_total - quote_total) / quote_total\n"
              "            if not math.isfinite(value) or not -1.0 <= value <= 1.0:\n"
              "                raise ValueError(\"signed taker quote flow violates [-1, 1] bounds\")\n"
              "            values[index] = value\n"
              "            valid[index] = True\n"
              "            source_start[index] = start\n"
              "    elif kind is FeatureKind.FUNDING_BPS:\n",
          )

          # Native multi-timeframe path carries the optional source field and tradability.
          replace_once(
              "trade_rl/data/features/multitimeframe.py",
              "        row_present=np.ones(raw.timestamps.shape, dtype=np.bool_),\n        active=active,\n",
              "        row_present=np.ones(raw.timestamps.shape, dtype=np.bool_),\n"
              "        active=active,\n"
              "        taker_buy_quote_volume=raw.taker_buy_quote_volume,\n"
              "        tradable=raw.tradable,\n",
          )

          # Base-clock alignment keeps the raw field intermediate-only, preserving Dataset identity.
          replace_once(
              "trade_rl/data/build/builder.py",
              "        \"volume\": np.zeros(n_bars, dtype=np.float64),\n",
              "        \"volume\": np.zeros(n_bars, dtype=np.float64),\n"
              "        \"taker_buy_quote_volume\": np.zeros(n_bars, dtype=np.float64),\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "    for field_name in (\"open\", \"high\", \"low\", \"close\", \"volume\", \"funding_rate\"):\n        result[field_name][indices] = getattr(raw, field_name)\n",
              "    for field_name in (\"open\", \"high\", \"low\", \"close\", \"volume\", \"funding_rate\"):\n"
              "        result[field_name][indices] = getattr(raw, field_name)\n"
              "    if raw.taker_buy_quote_volume is not None:\n"
              "        result[\"taker_buy_quote_volume\"][indices] = raw.taker_buy_quote_volume\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "        volume = np.zeros_like(open_price)\n        funding_rate = np.zeros_like(open_price)\n",
              "        volume = np.zeros_like(open_price)\n"
              "        taker_buy_quote_volume = np.zeros_like(open_price)\n"
              "        funding_rate = np.zeros_like(open_price)\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "            volume[:, symbol_index] = aligned[\"volume\"]\n            funding_rate[:, symbol_index] = aligned[\"funding_rate\"]\n",
              "            volume[:, symbol_index] = aligned[\"volume\"]\n"
              "            taker_buy_quote_volume[:, symbol_index] = aligned[\n"
              "                \"taker_buy_quote_volume\"\n"
              "            ]\n"
              "            funding_rate[:, symbol_index] = aligned[\"funding_rate\"]\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "                        row_present=causal_row_present[:, symbol_index],\n                        active=symbol_active[:, symbol_index],\n                    )\n",
              "                        row_present=causal_row_present[:, symbol_index],\n"
              "                        active=symbol_active[:, symbol_index],\n"
              "                        taker_buy_quote_volume=(\n"
              "                            taker_buy_quote_volume[:, symbol_index]\n"
              "                            if raw_series[symbol_index].taker_buy_quote_volume\n"
              "                            is not None\n"
              "                            else None\n"
              "                        ),\n"
              "                        tradable=tradable[:, symbol_index],\n"
              "                    )\n",
          )

          # Binance parser: preserve full-layout field 10 and reject mixed layouts.
          p = Path("trade_rl/integrations/binance/dataset.py")
          text = p.read_text()
          start = text.index("def _parse_kline_rows(")
          end = text.index("\n\ndef _align_funding", start)
          replacement = '''def _parse_kline_rows(\n    rows: Sequence[Sequence[object]],\n    *,\n    interval_ms: int,\n    start_ms: int,\n    end_ms: int,\n) -> tuple[\n    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n    np.ndarray | None,\n]:\n    parsed: list[tuple[int, float, float, float, float, float, float]] = []\n    has_taker_layout: bool | None = None\n    for row in rows:\n        if len(row) < 8:\n            raise ValueError("Binance kline row must contain at least eight fields")\n        open_ms = _normalize_epoch_ms(row[0])\n        if not start_ms <= open_ms < end_ms:\n            continue\n        close_ms = open_ms + interval_ms\n        if close_ms > end_ms:\n            continue\n        row_has_taker = len(row) >= 11\n        if has_taker_layout is None:\n            has_taker_layout = row_has_taker\n        elif has_taker_layout is not row_has_taker:\n            raise ValueError("Binance kline taker-field layout must be consistent")\n        open_price = _finite_float(row[1], field="open")\n        high = _finite_float(row[2], field="high")\n        low = _finite_float(row[3], field="low")\n        close = _finite_float(row[4], field="close")\n        quote_volume = _finite_float(row[7], field="quote volume")\n        taker_buy_quote_volume = (\n            _finite_float(row[10], field="taker buy quote volume")\n            if row_has_taker\n            else 0.0\n        )\n        parsed.append(\n            (\n                close_ms,\n                open_price,\n                high,\n                low,\n                close,\n                quote_volume,\n                taker_buy_quote_volume,\n            )\n        )\n    if len(parsed) < 2:\n        raise ValueError("Binance range must contain at least two closed bars")\n    timestamps = np.asarray([item[0] for item in parsed], dtype=np.int64)\n    if np.any(np.diff(timestamps) <= 0):\n        raise ValueError("Binance kline timestamps must be strictly increasing")\n    if np.any(np.diff(timestamps) != interval_ms):\n        raise ValueError("Binance kline range must be complete and exactly regular")\n    taker = (\n        np.asarray([item[6] for item in parsed], dtype=np.float64)\n        if has_taker_layout\n        else None\n    )\n    return (\n        timestamps.astype("datetime64[ms]").astype("datetime64[ns]"),\n        np.asarray([item[1] for item in parsed], dtype=np.float64),\n        np.asarray([item[2] for item in parsed], dtype=np.float64),\n        np.asarray([item[3] for item in parsed], dtype=np.float64),\n        np.asarray([item[4] for item in parsed], dtype=np.float64),\n        np.asarray([item[5] for item in parsed], dtype=np.float64),\n        taker,\n    )\n'''
          p.write_text(text[:start] + replacement + text[end:])
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        timestamps, open_price, high, low, close, volume = _parse_kline_rows(\n",
              "        (\n"
              "            timestamps,\n"
              "            open_price,\n"
              "            high,\n"
              "            low,\n"
              "            close,\n"
              "            volume,\n"
              "            taker_buy_quote_volume,\n"
              "        ) = _parse_kline_rows(\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "            volume=volume,\n            funding_rate=funding,\n",
              "            volume=volume,\n"
              "            funding_rate=funding,\n"
              "            taker_buy_quote_volume=taker_buy_quote_volume,\n",
          )
          PY

      - name: Format touched code/tests
        run: |
          uv run ruff format \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/features/core.py \
            trade_rl/data/features/multitimeframe.py \
            trade_rl/data/build/builder.py \
            trade_rl/integrations/binance/dataset.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
      - name: Static checks
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Targeted GREEN
        run: |
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/integrations/test_binance.py \
            tests/integrations/test_binance_multitimeframe.py
      - name: Commit and push only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl tests
          git commit -m "feat: add signed taker-flow source and feature path"
          git push origin HEAD:$TARGET_BRANCH
