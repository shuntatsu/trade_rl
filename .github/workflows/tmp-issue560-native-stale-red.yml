name: Temporary Issue 560 native stale-carry RED

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-native-stale-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 54613ea80460764327b4e9c4fa2e0464ee98d0ec
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 54613ea80460764327b4e9c4fa2e0464ee98d0ec
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Write direct-native stale-carry test
        run: |
          cat > tests/data/test_signed_taker_flow_native_stale_tmp.py <<'PY'
          from __future__ import annotations

          import numpy as np

          from trade_rl.data.contracts import FeatureKind, FeatureSpec, InstrumentContract, VolumeUnit
          from trade_rl.data.features.multitimeframe import align_native_feature
          from trade_rl.data.source import RawMarketSeries


          def test_native_alignment_does_not_carry_across_invalid_current_window() -> None:
              n = 30
              timestamps = np.datetime64("2022-01-01T00:00:00", "ns") + np.arange(n) * np.timedelta64(1, "h")
              close = 100.0 + np.arange(n, dtype=np.float64)
              tradable = np.ones(n, dtype=np.bool_)
              tradable[24] = False
              raw = RawMarketSeries(
                  timestamps=timestamps,
                  available_at=timestamps,
                  open=np.concatenate((close[:1], close[:-1])),
                  high=close + 1.0,
                  low=close - 1.0,
                  close=close,
                  volume=np.full(n, 10.0, dtype=np.float64),
                  funding_rate=np.zeros(n, dtype=np.float64),
                  tradable=tradable,
                  taker_buy_quote_volume=np.full(n, 6.0, dtype=np.float64),
              )
              spec = FeatureSpec(
                  name="1h__signed_taker_quote_flow_24bar",
                  kind=FeatureKind.SIGNED_TAKER_QUOTE_FLOW,
                  lookback=24,
                  timeframe="1h",
              )
              values, available, _, _ = align_native_feature(
                  spec,
                  raw,
                  InstrumentContract(
                      symbol="BTCUSDT",
                      volume_unit=VolumeUnit.QUOTE_NOTIONAL,
                  ),
                  timestamps,
                  np.ones(n, dtype=np.bool_),
                  timeframe="1h",
              )

              assert available[23]
              assert not available[24]
              assert values[24] == 0.0
          PY
          uv run ruff format tests/data/test_signed_taker_flow_native_stale_tmp.py
      - name: Static check
        run: |
          uv run ruff check tests/data/test_signed_taker_flow_native_stale_tmp.py
          uv run ruff format --check tests/data/test_signed_taker_flow_native_stale_tmp.py
      - name: Expected semantic RED
        run: uv run pytest -q tests/data/test_signed_taker_flow_native_stale_tmp.py
