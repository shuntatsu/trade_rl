name: Temporary Issue 560 format RED tests

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-red.yml

permissions:
  contents: write

jobs:
  format-tests:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 31de975a316c5a659a31274812cc8f1b36ca236e
    steps:
      - name: Checkout exact test-only head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 31de975a316c5a659a31274812cc8f1b36ca236e
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format RED tests only
        run: |
          uv run ruff format \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          uv run ruff check \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          uv run ruff format --check \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          git diff --cached --quiet && { echo "already formatted"; exit 0; }
          git commit -m "style: format issue560 RED tests"
          git push origin HEAD:feat/issue560-signed-taker-flow
