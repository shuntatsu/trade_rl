name: Temporary Issue 560 semantic RED

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 1e9c7d0659a775693547682d434a35cdfac47571
    steps:
      - name: Checkout exact formatted test-only head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e9c7d0659a775693547682d434a35cdfac47571
          persist-credentials: false
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static checks
        run: |
          set -euo pipefail
          uv run ruff check \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          uv run ruff format --check \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
      - name: Expected semantic RED
        run: |
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
