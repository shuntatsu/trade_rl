name: Temporary Issue 560 minimal GREEN

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-red.yml

permissions:
  contents: write

jobs:
  minimal-green:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 1e9c7d0659a775693547682d434a35cdfac47571
    steps:
      - name: Checkout exact semantic RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1e9c7d0659a775693547682d434a35cdfac47571
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Apply minimal source and feature implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected patch site not found exactly once: {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "trade_rl/data/source.py",
              "    funding_event_count: np.ndarray | None = None\n",
              "    funding_event_count: np.ndarray | None = None\n"
              "    taker_buy_quote_volume: np.ndarray | None = None\n",
          )
          replace_once(
              "trade_rl/data/source.py",
              "        expected = timestamps.shape\n"
              "        for field_name, array in arrays.items():\n"
              "            if array.shape != expected:\n"
              "                raise ValueError(f\"{field_name} shape must match timestamps\")\n",
              "        expected = timestamps.shape\n"
              "        for field_name, array in arrays.items():\n"
              "            if array.shape != expected:\n"
              "                raise ValueError(f\"{field_name} shape must match timestamps\")\n"
              "        taker_buy_quote_volume: np.ndarray | None = None\n"
              "        if self.taker_buy_quote_volume is not None:\n"
              "            taker_buy_quote_volume = _readonly(\n"
              "                self.taker_buy_quote_volume, dtype=np.dtype(np.float64)\n"
              "            )\n"
              "            if taker_buy_quote_volume.shape != expected:\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume shape must match timestamps\"\n"
              "                )\n"
              "            if not np.isfinite(taker_buy_quote_volume).all():\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume must contain only finite values\"\n"
              "                )\n"
              "            if np.any(taker_buy_quote_volume < 0.0):\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume must be non-negative\"\n"
              "                )\n"
              "            if np.any(taker_buy_quote_volume > arrays[\"volume\"]):\n"
              "                raise ValueError(\n"
              "                    \"taker_buy_quote_volume cannot exceed volume\"\n"
              "                )\n",
          )
          replace_once(
              "trade_rl/data/source.py",
              "        for field_name, array in arrays.items():\n"
              "            object.__setattr__(self, field_name, array)\n",
              "        for field_name, array in arrays.items():\n"
              "            object.__setattr__(self, field_name, array)\n"
              "        object.__setattr__(\n"
              "            self, \"taker_buy_quote_volume\", taker_buy_quote_volume\n"
              "        )\n",
          )

          replace_once(
              "trade_rl/data/contracts.py",
              "    VOLUME_ZSCORE = \"volume_zscore\"\n",
              "    VOLUME_ZSCORE = \"volume_zscore\"\n"
              "    SIGNED_TAKER_QUOTE_FLOW = \"signed_taker_quote_flow\"\n",
          )

          replace_once(
              "trade_rl/data/features/core.py",
              "    row_present: np.ndarray,\n"
              "    active: np.ndarray,\n"
              ") -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
              "    row_present: np.ndarray,\n"
              "    active: np.ndarray,\n"
              "    taker_buy_quote_volume: np.ndarray | None = None,\n"
              "    tradable: np.ndarray | None = None,\n"
              ") -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
          )
          replace_once(
              "trade_rl/data/features/core.py",
              "    kind = FeatureKind(spec.kind)\n\n"
              "    if kind is FeatureKind.FUNDING_BPS:\n",
              "    kind = FeatureKind(spec.kind)\n\n"
              "    if kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:\n"
              "        if spec.lookback != 24:\n"
              "            raise ValueError(\n"
              "                \"signed taker quote flow requires exactly 24 bars\"\n"
              "            )\n"
              "        if spec.normalization is not NormalizationMode.NONE:\n"
              "            raise ValueError(\n"
              "                \"signed taker quote flow does not allow normalization\"\n"
              "            )\n"
              "        if taker_buy_quote_volume is None or tradable is None:\n"
              "            return values, valid, source_start\n"
              "        taker_values = np.asarray(taker_buy_quote_volume, dtype=np.float64)\n"
              "        tradable_values = np.asarray(tradable, dtype=np.bool_)\n"
              "        if taker_values.shape != (n_bars,):\n"
              "            raise ValueError(\n"
              "                \"taker_buy_quote_volume shape must match feature inputs\"\n"
              "            )\n"
              "        if tradable_values.shape != (n_bars,):\n"
              "            raise ValueError(\n"
              "                \"tradable shape must match feature inputs\"\n"
              "            )\n"
              "        volume_values = np.asarray(volume, dtype=np.float64)\n"
              "        if not np.isfinite(volume_values).all() or np.any(volume_values < 0.0):\n"
              "            raise ValueError(\n"
              "                \"signed taker quote flow volume must be finite and non-negative\"\n"
              "            )\n"
              "        if not np.isfinite(taker_values).all():\n"
              "            raise ValueError(\n"
              "                \"taker_buy_quote_volume must contain only finite values\"\n"
              "            )\n"
              "        if np.any(taker_values < 0.0):\n"
              "            raise ValueError(\n"
              "                \"taker_buy_quote_volume must be non-negative\"\n"
              "            )\n"
              "        if np.any(taker_values > volume_values):\n"
              "            raise ValueError(\n"
              "                \"taker_buy_quote_volume cannot exceed volume\"\n"
              "            )\n"
              "        flow_usable = usable & tradable_values\n"
              "        for index in range(23, n_bars):\n"
              "            start = index - 23\n"
              "            if not _window_is_valid(flow_usable, start, index + 1):\n"
              "                continue\n"
              "            total_quote = math.fsum(\n"
              "                float(item) for item in volume_values[start : index + 1]\n"
              "            )\n"
              "            if total_quote <= 0.0:\n"
              "                continue\n"
              "            taker_buy_quote = math.fsum(\n"
              "                float(item) for item in taker_values[start : index + 1]\n"
              "            )\n"
              "            value = (2.0 * taker_buy_quote - total_quote) / total_quote\n"
              "            if not math.isfinite(value):\n"
              "                raise ValueError(\n"
              "                    \"signed taker quote flow must be finite\"\n"
              "                )\n"
              "            if value < -1.0 - 1e-12 or value > 1.0 + 1e-12:\n"
              "                raise ValueError(\n"
              "                    \"signed taker quote flow violates mathematical bounds\"\n"
              "                )\n"
              "            values[index] = value\n"
              "            valid[index] = True\n"
              "            source_start[index] = start\n"
              "        return values, valid, source_start\n"
              "    if kind is FeatureKind.FUNDING_BPS:\n",
          )

          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "    parsed: list[tuple[int, float, float, float, float, float]] = []\n"
              "    for row in rows:\n",
              "    parsed: list[\n"
              "        tuple[int, float, float, float, float, float, float | None]\n"
              "    ] = []\n"
              "    taker_layout: bool | None = None\n"
              "    for row in rows:\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        quote_volume = _finite_float(row[7], field=\"quote volume\")\n"
              "        parsed.append((close_ms, open_price, high, low, close, quote_volume))\n",
              "        quote_volume = _finite_float(row[7], field=\"quote volume\")\n"
              "        has_taker_quote_volume = len(row) > 10\n"
              "        if taker_layout is None:\n"
              "            taker_layout = has_taker_quote_volume\n"
              "        elif taker_layout is not has_taker_quote_volume:\n"
              "            raise ValueError(\n"
              "                \"Binance kline taker quote-volume layout must be consistent\"\n"
              "            )\n"
              "        taker_buy_quote_volume = (\n"
              "            _finite_float(row[10], field=\"taker buy quote volume\")\n"
              "            if has_taker_quote_volume\n"
              "            else None\n"
              "        )\n"
              "        parsed.append(\n"
              "            (\n"
              "                close_ms,\n"
              "                open_price,\n"
              "                high,\n"
              "                low,\n"
              "                close,\n"
              "                quote_volume,\n"
              "                taker_buy_quote_volume,\n"
              "            )\n"
              "        )\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        np.asarray([item[5] for item in parsed], dtype=np.float64),\n"
              "    )\n\n\n"
              "def _align_funding(\n",
              "        np.asarray([item[5] for item in parsed], dtype=np.float64),\n"
              "        (\n"
              "            np.asarray([item[6] for item in parsed], dtype=np.float64)\n"
              "            if taker_layout\n"
              "            else None\n"
              "        ),\n"
              "    )\n\n\n"
              "def _align_funding(\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        timestamps, open_price, high, low, close, volume = _parse_kline_rows(\n"
              "            rows,\n",
              "        (\n"
              "            timestamps,\n"
              "            open_price,\n"
              "            high,\n"
              "            low,\n"
              "            close,\n"
              "            volume,\n"
              "            taker_buy_quote_volume,\n"
              "        ) = _parse_kline_rows(\n"
              "            rows,\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "            volume=volume,\n"
              "            funding_rate=funding,\n",
              "            volume=volume,\n"
              "            taker_buy_quote_volume=taker_buy_quote_volume,\n"
              "            funding_rate=funding,\n",
          )
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format implementation
        run: |
          uv run ruff format \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/features/core.py \
            trade_rl/integrations/binance/dataset.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
      - name: Static and targeted GREEN
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_market_source.py \
            tests/integrations/test_binance.py
      - name: Commit verified minimal implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/features/core.py \
            trade_rl/integrations/binance/dataset.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: add sealed signed taker-flow source and feature core"
          git push origin HEAD:feat/issue560-signed-taker-flow
