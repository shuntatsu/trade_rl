name: Temporary Issue 560 integrated GREEN

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-red.yml

permissions:
  contents: write

jobs:
  integrated-green:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5fb1b43dccd251115a4cc92b8ed2382cce1ed75a
    steps:
      - name: Checkout exact concurrent head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fb1b43dccd251115a4cc92b8ed2382cce1ed75a
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Apply only missing implementation and integration plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected patch site not found exactly once: {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Preserve legacy RawMarketSeries positional optional-field ordering.
          replace_once(
              "trade_rl/data/source.py",
              "    tradable: np.ndarray\n    taker_buy_quote_volume: np.ndarray | None = None\n    funding_available: np.ndarray | None = None\n    available_at: np.ndarray | None = None\n    funding_event_count: np.ndarray | None = None\n",
              "    tradable: np.ndarray\n    funding_available: np.ndarray | None = None\n    available_at: np.ndarray | None = None\n    funding_event_count: np.ndarray | None = None\n    taker_buy_quote_volume: np.ndarray | None = None\n",
          )

          replace_once(
              "tests/data/test_signed_taker_flow_feature.py",
              "    row_present[5] = False\n    active[7] = False\n    tradable[9] = False\n",
              "    tradable[3] = False\n    active[4] = False\n    row_present[5] = False\n",
          )

          replace_once(
              "trade_rl/data/contracts.py",
              "    VOLUME_ZSCORE = \"volume_zscore\"\n",
              "    VOLUME_ZSCORE = \"volume_zscore\"\n    SIGNED_TAKER_QUOTE_FLOW = \"signed_taker_quote_flow\"\n",
          )

          replace_once(
              "trade_rl/data/features/core.py",
              "    row_present: np.ndarray,\n    active: np.ndarray,\n) -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
              "    row_present: np.ndarray,\n    active: np.ndarray,\n    taker_buy_quote_volume: np.ndarray | None = None,\n    tradable: np.ndarray | None = None,\n) -> tuple[np.ndarray, np.ndarray, np.ndarray]:\n",
          )
          replace_once(
              "trade_rl/data/features/core.py",
              "    kind = FeatureKind(spec.kind)\n\n    if kind is FeatureKind.FUNDING_BPS:\n",
              "    kind = FeatureKind(spec.kind)\n\n"
              "    if kind is FeatureKind.SIGNED_TAKER_QUOTE_FLOW:\n"
              "        if spec.lookback != 24:\n"
              "            raise ValueError(\"signed taker quote flow requires exactly 24 bars\")\n"
              "        if spec.timeframe != \"1h\":\n"
              "            raise ValueError(\"signed taker quote flow requires native timeframe 1h\")\n"
              "        if spec.normalization is not NormalizationMode.NONE:\n"
              "            raise ValueError(\"signed taker quote flow does not allow normalization\")\n"
              "        if taker_buy_quote_volume is None or tradable is None:\n"
              "            return values, valid, source_start\n"
              "        taker_values = np.asarray(taker_buy_quote_volume, dtype=np.float64)\n"
              "        tradable_values = np.asarray(tradable, dtype=np.bool_)\n"
              "        if taker_values.shape != (n_bars,):\n"
              "            raise ValueError(\"taker_buy_quote_volume shape must match feature inputs\")\n"
              "        if tradable_values.shape != (n_bars,):\n"
              "            raise ValueError(\"tradable shape must match feature inputs\")\n"
              "        volume_values = np.asarray(volume, dtype=np.float64)\n"
              "        if not np.isfinite(volume_values).all() or np.any(volume_values < 0.0):\n"
              "            raise ValueError(\"signed taker quote flow volume must be finite and non-negative\")\n"
              "        if not np.isfinite(taker_values).all():\n"
              "            raise ValueError(\"taker_buy_quote_volume must contain only finite values\")\n"
              "        if np.any(taker_values < 0.0):\n"
              "            raise ValueError(\"taker_buy_quote_volume must be non-negative\")\n"
              "        if np.any(taker_values > volume_values):\n"
              "            raise ValueError(\"taker_buy_quote_volume cannot exceed volume\")\n"
              "        flow_usable = usable & tradable_values\n"
              "        for index in range(23, n_bars):\n"
              "            start = index - 23\n"
              "            if not _window_is_valid(flow_usable, start, index + 1):\n"
              "                continue\n"
              "            total_quote = math.fsum(\n"
              "                float(item) for item in volume_values[start : index + 1]\n"
              "            )\n"
              "            if total_quote <= 0.0:\n"
              "                continue\n"
              "            taker_buy_quote = math.fsum(\n"
              "                float(item) for item in taker_values[start : index + 1]\n"
              "            )\n"
              "            value = (2.0 * taker_buy_quote - total_quote) / total_quote\n"
              "            if not math.isfinite(value):\n"
              "                raise ValueError(\"signed taker quote flow must be finite\")\n"
              "            if value < -1.0 - 1e-12 or value > 1.0 + 1e-12:\n"
              "                raise ValueError(\"signed taker quote flow violates mathematical bounds\")\n"
              "            values[index] = value\n"
              "            valid[index] = True\n"
              "            source_start[index] = start\n"
              "        return values, valid, source_start\n\n"
              "    if kind is FeatureKind.FUNDING_BPS:\n",
          )

          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              ") -> tuple[np.ndarray, ...]:\n",
              ") -> tuple[\n"
              "    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n    np.ndarray,\n"
              "    np.ndarray,\n    np.ndarray,\n    np.ndarray | None,\n]:\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "    parsed: list[tuple[int, float, float, float, float, float]] = []\n    for row in rows:\n",
              "    parsed: list[\n"
              "        tuple[int, float, float, float, float, float, float | None]\n"
              "    ] = []\n"
              "    taker_layout: bool | None = None\n"
              "    for row in rows:\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        quote_volume = _finite_float(row[7], field=\"quote volume\")\n        parsed.append((close_ms, open_price, high, low, close, quote_volume))\n",
              "        quote_volume = _finite_float(row[7], field=\"quote volume\")\n"
              "        has_taker_quote_volume = len(row) > 10\n"
              "        if taker_layout is None:\n"
              "            taker_layout = has_taker_quote_volume\n"
              "        elif taker_layout is not has_taker_quote_volume:\n"
              "            raise ValueError(\"Binance kline taker quote-volume layout must be consistent\")\n"
              "        taker_buy_quote_volume = (\n"
              "            _finite_float(row[10], field=\"taker buy quote volume\")\n"
              "            if has_taker_quote_volume\n"
              "            else None\n"
              "        )\n"
              "        parsed.append(\n"
              "            (close_ms, open_price, high, low, close, quote_volume, taker_buy_quote_volume)\n"
              "        )\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        np.asarray([item[5] for item in parsed], dtype=np.float64),\n    )\n\n\ndef _align_funding(\n",
              "        np.asarray([item[5] for item in parsed], dtype=np.float64),\n"
              "        (\n"
              "            np.asarray([item[6] for item in parsed], dtype=np.float64)\n"
              "            if taker_layout\n"
              "            else None\n"
              "        ),\n"
              "    )\n\n\ndef _align_funding(\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "        timestamps, open_price, high, low, close, volume = _parse_kline_rows(\n            rows,\n",
              "        (\n"
              "            timestamps,\n            open_price,\n            high,\n            low,\n"
              "            close,\n            volume,\n            taker_buy_quote_volume,\n"
              "        ) = _parse_kline_rows(\n            rows,\n",
          )
          replace_once(
              "trade_rl/integrations/binance/dataset.py",
              "            volume=volume,\n            funding_rate=funding,\n",
              "            volume=volume,\n"
              "            funding_rate=funding,\n"
              "            taker_buy_quote_volume=taker_buy_quote_volume,\n",
          )

          replace_once(
              "trade_rl/data/features/multitimeframe.py",
              "        row_present=np.ones(raw.timestamps.shape, dtype=np.bool_),\n        active=active,\n",
              "        row_present=np.ones(raw.timestamps.shape, dtype=np.bool_),\n"
              "        active=active,\n"
              "        taker_buy_quote_volume=raw.taker_buy_quote_volume,\n"
              "        tradable=raw.tradable,\n",
          )

          replace_once(
              "trade_rl/data/build/builder.py",
              "        \"volume\": np.zeros(n_bars, dtype=np.float64),\n        \"funding_rate\": np.zeros(n_bars, dtype=np.float64),\n",
              "        \"volume\": np.zeros(n_bars, dtype=np.float64),\n"
              "        \"funding_rate\": np.zeros(n_bars, dtype=np.float64),\n"
              "        \"taker_buy_quote_volume\": np.zeros(n_bars, dtype=np.float64),\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "    result[\"tradable\"][indices] = raw.tradable\n",
              "    result[\"tradable\"][indices] = raw.tradable\n"
              "    if raw.taker_buy_quote_volume is not None:\n"
              "        result[\"taker_buy_quote_volume\"][indices] = raw.taker_buy_quote_volume\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "        funding_rate = np.zeros_like(open_price)\n        row_present = np.zeros((n_bars, n_symbols), dtype=np.bool_)\n",
              "        funding_rate = np.zeros_like(open_price)\n"
              "        taker_buy_quote_volume = np.zeros_like(open_price)\n"
              "        taker_buy_quote_volume_available = np.zeros(n_symbols, dtype=np.bool_)\n"
              "        row_present = np.zeros((n_bars, n_symbols), dtype=np.bool_)\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "            funding_rate[:, symbol_index] = aligned[\"funding_rate\"]\n            row_present[:, symbol_index] = aligned[\"row_present\"]\n",
              "            funding_rate[:, symbol_index] = aligned[\"funding_rate\"]\n"
              "            if raw.taker_buy_quote_volume is not None:\n"
              "                taker_buy_quote_volume[:, symbol_index] = aligned[\n"
              "                    \"taker_buy_quote_volume\"\n"
              "                ]\n"
              "                taker_buy_quote_volume_available[symbol_index] = True\n"
              "            row_present[:, symbol_index] = aligned[\"row_present\"]\n",
          )
          replace_once(
              "trade_rl/data/build/builder.py",
              "                        row_present=causal_row_present[:, symbol_index],\n                        active=symbol_active[:, symbol_index],\n",
              "                        row_present=causal_row_present[:, symbol_index],\n"
              "                        active=symbol_active[:, symbol_index],\n"
              "                        taker_buy_quote_volume=(\n"
              "                            taker_buy_quote_volume[:, symbol_index]\n"
              "                            if taker_buy_quote_volume_available[symbol_index]\n"
              "                            else None\n"
              "                        ),\n"
              "                        tradable=tradable[:, symbol_index],\n",
          )

          identity_test = Path("tests/data/test_signed_taker_flow_identity_compat.py")
          text = identity_test.read_text(encoding="utf-8")
          if "test_builder_materializes_signed_taker_flow_only_when_raw_field_exists" not in text:
              text += '''\n\ndef test_builder_materializes_signed_taker_flow_only_when_raw_field_exists() -> None:\n    config = MarketBuildConfig(\n        base_timeframe="1h",\n        features=(\n            FeatureSpec(\n                name="1h__signed_taker_quote_flow_24bar",\n                kind=FeatureKind.SIGNED_TAKER_QUOTE_FLOW,\n                lookback=24,\n                timeframe="1h",\n            ),\n        ),\n    )\n    builder = MarketDatasetBuilder(config)\n    instruments = (InstrumentContract(symbol="BTCUSDT"),)\n\n    enriched = builder.build(\n        InMemoryMarketDataSource(\n            {"BTCUSDT": _series(taker=np.full(30, 6.0, dtype=np.float64))}\n        ),\n        instruments,\n    )\n    missing = builder.build(\n        InMemoryMarketDataSource({"BTCUSDT": _series(taker=None)}),\n        instruments,\n    )\n\n    assert enriched.feature_available[23, 0, 0]\n    assert enriched.features[23, 0, 0] == 0.2\n    assert not np.any(missing.feature_available[:, 0, 0])\n    assert not np.any(missing.features[:, 0, 0])\n'''
              identity_test.write_text(text, encoding="utf-8")
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format changed files
        run: |
          uv run ruff format \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/features/core.py \
            trade_rl/data/features/multitimeframe.py \
            trade_rl/data/build/builder.py \
            trade_rl/integrations/binance/dataset.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
      - name: Static and integrated targeted GREEN
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_market_source.py \
            tests/integrations/test_binance.py \
            tests/data/test_multitimeframe_features.py
      - name: Commit only if branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/issue560-signed-taker-flow
          remote="$(git rev-parse FETCH_HEAD)"
          test "$remote" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/features/core.py \
            trade_rl/data/features/multitimeframe.py \
            trade_rl/data/build/builder.py \
            trade_rl/integrations/binance/dataset.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: implement sealed signed taker-flow feature path"
          git push origin HEAD:feat/issue560-signed-taker-flow
