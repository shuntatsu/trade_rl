name: Temporary Issue 560 targeted final-head verification

on:
  push:
    branches:
      - verify/issue560-red-31de975
    paths:
      - .github/workflows/tmp-issue560-targeted-adf.yml

permissions:
  contents: read

env:
  TARGET_SHA: adf835cf45936dbc40bf8d4f74879825ae211ef9

jobs:
  targeted:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: adf835cf45936dbc40bf8d4f74879825ae211ef9
          persist-credentials: false
      - name: Verify exact target head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static and targeted tests
        run: |
          set -euo pipefail
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_market_source.py \
            tests/integrations/test_binance.py
