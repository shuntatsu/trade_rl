name: Temporary Issue 562 artifact publication hardening

on:
  push:
    branches:
      - automation/issue562-artifact-fix
    paths:
      - .github/workflows/tmp-issue562-artifact-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue562-signed-taker-flow-calibration
  TARGET_SHA: 817e3c96d702ffca3be74309bd68b31ef02643c5
  SOURCE_BRANCH: feat/issue560-signed-taker-flow
  SOURCE_SHA: adf835cf45936dbc40bf8d4f74879825ae211ef9

jobs:
  fix_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact calibration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and source authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$SOURCE_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
      - name: Apply publication-boundary hardening and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              source = Path(path)
              text = source.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected exactly one patch site")
              source.write_text(text.replace(old, new, 1), encoding="utf-8")

          module = "trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py"
          test = "tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py"

          replace_once(
              module,
              "from trade_rl.artifacts.hashing import content_digest\n",
              "from trade_rl.artifacts.canonical import canonical_json_bytes\nfrom trade_rl.artifacts.hashing import content_digest\n",
          )
          replace_once(
              module,
              '''    def to_artifact_payload(self) -> dict[str, object]:
        return {**self.to_payload(), "content_digest": self.digest}
''',
              '''    def _require_publication_authority(self) -> None:
        if self.calibration_head is None:
            raise ValueError("calibration_head is required for artifact publication")
        if self.source_manifest_digest is None:
            raise ValueError("source_manifest_digest is required for artifact publication")

    def to_artifact_payload(self) -> dict[str, object]:
        self._require_publication_authority()
        return {**self.to_payload(), "content_digest": self.digest}
''',
          )
          replace_once(
              module,
              '''    try:
        raw: Any = json.loads(Path(path).read_text(encoding="utf-8"))
    except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
        raise ValueError("signed taker-flow calibration result is malformed") from error
    if not isinstance(raw, dict) or any(not isinstance(key, str) for key in raw):
        raise ValueError("signed taker-flow calibration result must be a JSON object")
''',
              '''    source = Path(path)
    try:
        raw_bytes = source.read_bytes()
        raw_text = raw_bytes.decode("utf-8")
        raw: Any = json.loads(raw_text)
    except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
        raise ValueError("signed taker-flow calibration result is malformed") from error
    if not isinstance(raw, dict) or any(not isinstance(key, str) for key in raw):
        raise ValueError("signed taker-flow calibration result must be a JSON object")
    try:
        canonical_bytes = canonical_json_bytes(raw)
    except (TypeError, ValueError) as error:
        raise ValueError("signed taker-flow calibration result is malformed") from error
    if raw_bytes != canonical_bytes:
        raise ValueError("signed taker-flow calibration result must use canonical JSON bytes")
''',
          )
          replace_once(
              module,
              '''    calibration_head_raw = raw["calibration_head"]
    calibration_head = (
        None
        if calibration_head_raw is None
        else _require_hex(calibration_head_raw, length=40, field="calibration_head")
    )
    source_manifest_raw = raw["source_manifest_digest"]
    source_manifest_digest = (
        None
        if source_manifest_raw is None
        else _require_hex(
            source_manifest_raw,
            length=64,
            field="source_manifest_digest",
        )
    )
''',
              '''    calibration_head = _require_hex(
        raw["calibration_head"], length=40, field="calibration_head"
    )
    source_manifest_digest = _require_hex(
        raw["source_manifest_digest"],
        length=64,
        field="source_manifest_digest",
    )
''',
          )
          replace_once(
              test,
              '''    result = module.calibrate_signed_taker_flow(_dataset(), protocol)
    artifact = result.to_artifact_payload()

    assert artifact["protocol_digest"] == protocol.digest
''',
              '''    result = module.calibrate_signed_taker_flow(
        _dataset(),
        protocol,
        calibration_head="4" * 40,
        source_manifest_digest="5" * 64,
    )
    artifact = result.to_artifact_payload()

    assert artifact["protocol_digest"] == protocol.digest
''',
          )

          path = Path(test)
          text = path.read_text(encoding="utf-8")
          marker = "def test_artifact_publication_requires_bound_authority_and_canonical_bytes"
          if marker in text:
              raise RuntimeError("artifact publication regression test already exists")
          text += '''\n\ndef test_artifact_publication_requires_bound_authority_and_canonical_bytes(\n    tmp_path: Path,\n) -> None:\n    module = _api()\n    protocol = canonical_signed_taker_flow_protocol()\n    unbound = module.calibrate_signed_taker_flow(_dataset(), protocol)\n\n    with pytest.raises(ValueError, match="calibration_head|source_manifest|publication"):\n        unbound.to_artifact_payload()\n\n    unbound_payload = {**unbound.to_payload(), "content_digest": unbound.digest}\n    path = tmp_path / "unbound.json"\n    path.write_text(\n        json.dumps(\n            unbound_payload,\n            allow_nan=False,\n            sort_keys=True,\n            separators=(",", ":"),\n        ),\n        encoding="utf-8",\n    )\n    with pytest.raises(ValueError, match="calibration_head|source_manifest"):\n        module.load_signed_taker_flow_calibration_result(path)\n\n    bound = module.calibrate_signed_taker_flow(\n        _dataset(),\n        protocol,\n        calibration_head="6" * 40,\n        source_manifest_digest="7" * 64,\n    )\n    artifact = bound.to_artifact_payload()\n    path.write_text(json.dumps(artifact, indent=2), encoding="utf-8")\n    with pytest.raises(ValueError, match="canonical|bytes"):\n        module.load_signed_taker_flow_calibration_result(path)\n'''
          path.write_text(text, encoding="utf-8")
          PY
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format static and targeted tests
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run ruff check \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
      - name: Recheck authorities and publish only Green changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$SOURCE_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind signed-flow calibration artifact authority"
          git push origin HEAD:"$TARGET_BRANCH"
