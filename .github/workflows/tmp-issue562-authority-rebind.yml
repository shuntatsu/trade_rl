name: Temporary Issue 562 authority rebind and independent reconstruction

on:
  push:
    branches:
      - verify/issue562-authority-rebind-9268
    paths:
      - .github/workflows/tmp-issue562-authority-rebind.yml

permissions:
  contents: read
  actions: read

env:
  HELPER_HEAD: a79b957af6f1d15d32dd6afe512fbfc59304bc4b
  CALIBRATION_HEAD: 9268e31d5ec261d6463bb4e9611804e4c7184def
  IMPLEMENTATION_HEAD: 9092c8360d6625c97700de5342ba0e0cbec1d1a0
  PREFLIGHT_RUN_ID: "34860327873"
  PREFLIGHT_ARTIFACT_ID: "10354762857"
  PREFLIGHT_ARTIFACT_NAME: issue562-source-preflight-9268-34860327873
  PREFLIGHT_API_DIGEST: sha256:f2e06e2952ea695ab8522e2f59e8bb41a7d457c2f7910585bec1b99b9441725a
  PREFLIGHT_CONTENT_DIGEST: e2b7cc91289e7903853fefbac728fc334777b7bce52197bd146fc731c7d0a2ab
  OLD_PUBLISHER_RUN_ID: "34857883892"
  OLD_PUBLISHER_ARTIFACT_ID: "10353409645"
  OLD_PUBLISHER_API_DIGEST: sha256:e38c5d551de3b3b32ea1f139f5f045a43dc0698d2ad481fb63c20c085fa3c6af
  OLD_VERIFIED_ARTIFACT_ID: "10354225757"
  OLD_VERIFIED_API_DIGEST: sha256:0c11606316199eb36b5463b95371974bb762d3c6e39910ac7fd52b98b0e2b825

jobs:
  rebind:
    name: Formal authority rebind reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      rebound_artifact_id: ${{ steps.upload_rebound.outputs.artifact-id }}
      audit_artifact_id: ${{ steps.upload_audit.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout old verified helper authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a79b957af6f1d15d32dd6afe512fbfc59304bc4b
          persist-credentials: false
      - name: Preserve and rebind exact publisher helper constants only
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tmp_issue562_signed_flow_publisher.py /tmp/issue562-rebind.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/issue562-rebind.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'dd3ecb617ecd2476e20e9215eeb422d2cdc95750': '9268e31d5ec261d6463bb4e9611804e4c7184def',
              'adf835cf45936dbc40bf8d4f74879825ae211ef9': '9092c8360d6625c97700de5342ba0e0cbec1d1a0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'helper authority occurrence mismatch for {old}: {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          sha256sum /tmp/issue562-rebind.py
      - name: Checkout exact latest calibration authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9268e31d5ec261d6463bb4e9611804e4c7184def
          persist-credentials: false
      - name: Assert latest authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CALIBRATION_HEAD"
          grep -Fq "_IMPLEMENTATION_HEAD = \"$IMPLEMENTATION_HEAD\"" trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Download and verify old publisher, old verified result, and latest preflight authorities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue562-old /tmp/issue562-preflight-latest
          mkdir -p /tmp/issue562-old/publisher /tmp/issue562-old/verified /tmp/issue562-preflight-latest
          for pair in \
            "${OLD_PUBLISHER_ARTIFACT_ID}:${OLD_PUBLISHER_API_DIGEST}:/tmp/issue562-old/publisher.zip" \
            "${OLD_VERIFIED_ARTIFACT_ID}:${OLD_VERIFIED_API_DIGEST}:/tmp/issue562-old/verified.zip" \
            "${PREFLIGHT_ARTIFACT_ID}:${PREFLIGHT_API_DIGEST}:/tmp/issue562-preflight-latest/preflight.zip"
          do
            IFS=: read -r artifact_id prefix digest out <<< "$pair"
            expected="${prefix}:${digest}"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: trade-rl-issue562-authority-rebind/1" \
              "https://api.github.com/repos/shuntatsu/trade_rl/actions/artifacts/${artifact_id}" \
              --output "${out}.json"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: trade-rl-issue562-authority-rebind/1" \
              "https://api.github.com/repos/shuntatsu/trade_rl/actions/artifacts/${artifact_id}/zip" \
              --output "$out"
            EXPECTED="$expected" META="${out}.json" ZIP="$out" uv run python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          meta = json.loads(Path(os.environ['META']).read_text())
          expected = os.environ['EXPECTED']
          if meta.get('digest') != expected or meta.get('expired') is not False:
              raise SystemExit('artifact API authority mismatch')
          raw = Path(os.environ['ZIP']).read_bytes()
          if 'sha256:' + hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('downloaded artifact ZIP digest mismatch')
          PY
          done
          uv run python - <<'PY'
          import io, json, zipfile
          from pathlib import Path

          with zipfile.ZipFile('/tmp/issue562-old/publisher.zip') as z:
              names = sorted(z.namelist())
              expected = ['publisher-metadata.json', 'result.json', 'source-manifest.json']
              if names != expected:
                  raise SystemExit(f'old publisher members differ: {names!r}')
              for name in names:
                  (Path('/tmp/issue562-old/publisher') / name).write_bytes(z.read(name))
          with zipfile.ZipFile('/tmp/issue562-old/verified.zip') as z:
              names = sorted(z.namelist())
              if names != ['verification.json', 'verified-result.json']:
                  raise SystemExit(f'old verified members differ: {names!r}')
              for name in names:
                  (Path('/tmp/issue562-old/verified') / name).write_bytes(z.read(name))
          if (Path('/tmp/issue562-old/publisher/result.json').read_bytes()
                  != Path('/tmp/issue562-old/verified/verified-result.json').read_bytes()):
              raise SystemExit('old independently verified result differs from publisher bytes')
          verification = json.loads(Path('/tmp/issue562-old/verified/verification.json').read_text())
          if verification.get('byte_identical') is not True or verification.get('fresh_source_manifest_identical') is not True:
              raise SystemExit('old verification artifact does not prove byte/source identity')

          with zipfile.ZipFile('/tmp/issue562-preflight-latest/preflight.zip') as z:
              if z.namelist() != ['source-preflight.json']:
                  raise SystemExit('latest preflight artifact member mismatch')
              Path('/tmp/issue562-preflight-latest/source-preflight.json').write_bytes(z.read('source-preflight.json'))
          manifest = json.loads(Path('/tmp/issue562-preflight-latest/source-preflight.json').read_text())
          checks = {
              'schema_version': 'issue562_training_source_preflight_v4',
              'calibration_head': '9268e31d5ec261d6463bb4e9611804e4c7184def',
              'source_feature_head': '9092c8360d6625c97700de5342ba0e0cbec1d1a0',
              'content_digest': 'e2b7cc91289e7903853fefbac728fc334777b7bce52197bd146fc731c7d0a2ab',
              'planned_archives': 125,
              'feature_or_target_values_computed': False,
              'return_or_pnl_computed': False,
          }
          for key, expected in checks.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f'latest preflight field mismatch: {key}')
          if manifest.get('missing_grid_rows_by_symbol') != {
              'BTCUSDT': 0, 'ETHUSDT': 0, 'BNBUSDT': 0, 'XRPUSDT': 120, 'ADAUSDT': 0
          }:
              raise SystemExit('latest preflight missing-grid authority changed')
          print('OLD_VERIFIED_PUBLISHER_AUTHORITY_CONFIRMED=true')
          print('LATEST_PREFLIGHT_AUTHORITY_CONFIRMED=true')
          PY
      - name: Reconstruct under latest authorities without creating a second publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue562-rebound
          uv run python /tmp/issue562-rebind.py \
            --output-dir /tmp/issue562-rebound \
            --preflight-run-id "$PREFLIGHT_RUN_ID" \
            --preflight-artifact-id "$PREFLIGHT_ARTIFACT_ID" \
            --preflight-api-digest "$PREFLIGHT_API_DIGEST" \
            --preflight-content-digest "$PREFLIGHT_CONTENT_DIGEST"
      - name: Require old verified economic evidence and raw archive evidence to be unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue562-recovery-audit
          mkdir -p /tmp/issue562-recovery-audit
          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from trade_rl.artifacts.canonical import canonical_json_bytes
          from trade_rl.evaluation.experiments.bootstrap.signed_taker_flow_calibration import load_signed_taker_flow_calibration_result

          old_result_path = Path('/tmp/issue562-old/verified/verified-result.json')
          new_result_path = Path('/tmp/issue562-rebound/result.json')
          old = json.loads(old_result_path.read_text())
          new = json.loads(new_result_path.read_text())
          load_signed_taker_flow_calibration_result(new_result_path)

          economic_keys = (
              'protocol_digest', 'fit_start', 'fit_cutoff', 'symbols', 'symbol_results',
              'positive_slope_count', 'status', 'failures', 'training_relation_executed',
              'evaluation_pnl_inspected', 'evaluation_execution_authorized',
              'final_test_authorized', 'shared_cash_profitability_established',
              'production_eligible', 'live_trading_authorized',
          )
          for key in economic_keys:
              if old.get(key) != new.get(key):
                  raise SystemExit(f'economic evidence changed during authority rebind: {key}')
          if old.get('calibration_head') != 'dd3ecb617ecd2476e20e9215eeb422d2cdc95750':
              raise SystemExit('old result calibration authority is unexpected')
          if old.get('implementation_head') != 'adf835cf45936dbc40bf8d4f74879825ae211ef9':
              raise SystemExit('old result implementation authority is unexpected')
          if new.get('calibration_head') != '9268e31d5ec261d6463bb4e9611804e4c7184def':
              raise SystemExit('rebound result calibration authority is wrong')
          if new.get('implementation_head') != '9092c8360d6625c97700de5342ba0e0cbec1d1a0':
              raise SystemExit('rebound result implementation authority is wrong')

          old_manifest = json.loads(Path('/tmp/issue562-old/publisher/source-manifest.json').read_text())
          new_manifest = json.loads(Path('/tmp/issue562-rebound/source-manifest.json').read_text())
          source_keys = (
              'symbols', 'months', 'planned_archives', 'archive_root', 'interval',
              'analysis_contract_active_floor', 'source_open_start_inclusive',
              'source_open_end_exclusive', 'fit_start', 'fit_cutoff',
              'missing_grid_rows_by_symbol', 'missing_rows_are_preserved_as_row_present_false',
              'entries',
          )
          for key in source_keys:
              if old_manifest.get(key) != new_manifest.get(key):
                  raise SystemExit(f'raw source evidence changed during authority rebind: {key}')

          audit_body = {
              'schema_version': 'issue562_authority_rebind_v1',
              'issue_number': 562,
              'old_publisher_run_id': 34857883892,
              'old_publisher_artifact_id': 10353409645,
              'old_publisher_api_digest': 'sha256:e38c5d551de3b3b32ea1f139f5f045a43dc0698d2ad481fb63c20c085fa3c6af',
              'old_verified_artifact_id': 10354225757,
              'old_verified_api_digest': 'sha256:0c11606316199eb36b5463b95371974bb762d3c6e39910ac7fd52b98b0e2b825',
              'old_result_content_digest': old.get('content_digest'),
              'old_dataset_id': old.get('dataset_id'),
              'old_calibration_head': old.get('calibration_head'),
              'old_implementation_head': old.get('implementation_head'),
              'latest_calibration_head': new.get('calibration_head'),
              'latest_implementation_head': new.get('implementation_head'),
              'latest_preflight_run_id': 34860327873,
              'latest_preflight_artifact_id': 10354762857,
              'latest_preflight_api_digest': 'sha256:f2e06e2952ea695ab8522e2f59e8bb41a7d457c2f7910585bec1b99b9441725a',
              'latest_preflight_content_digest': 'e2b7cc91289e7903853fefbac728fc334777b7bce52197bd146fc731c7d0a2ab',
              'latest_result_content_digest': new.get('content_digest'),
              'latest_dataset_id': new.get('dataset_id'),
              'latest_source_manifest_digest': new.get('source_manifest_digest'),
              'economic_evidence_identical': True,
              'raw_archive_evidence_identical': True,
              'second_publisher_executed': False,
              'reconstruction_only': True,
              'evaluation_pnl_inspected': False,
              'final_test_authorized': False,
              'production_eligible': False,
              'live_trading_authorized': False,
          }
          canonical = json.dumps(audit_body, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          audit = {**audit_body, 'content_digest': hashlib.sha256(canonical).hexdigest()}
          Path('/tmp/issue562-recovery-audit/recovery.json').write_bytes(canonical_json_bytes(audit))
          print('AUTHORITY_REBIND_RECONSTRUCTION_COMPLETE=true')
          print('ECONOMIC_EVIDENCE_IDENTICAL=true')
          print('RAW_ARCHIVE_EVIDENCE_IDENTICAL=true')
          print('SECOND_PUBLISHER_EXECUTED=false')
          print('INTERPRETATION_DEFERRED_UNTIL_SECOND_VERIFIER=true')
          PY
      - name: Upload rebound canonical result package
        id: upload_rebound
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue562-authority-rebound-${{ github.run_id }}
          path: /tmp/issue562-rebound/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload authority recovery audit
        id: upload_audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue562-authority-rebind-audit-${{ github.run_id }}
          path: /tmp/issue562-recovery-audit/recovery.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verifier:
    name: Independent verification of rebound authority
    needs: rebind
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REBOUND_ARTIFACT_ID: ${{ needs.rebind.outputs.rebound_artifact_id }}
    steps:
      - name: Checkout old verified helper authority independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a79b957af6f1d15d32dd6afe512fbfc59304bc4b
          persist-credentials: false
      - name: Preserve and rebind exact verifier helper constants only
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tmp_issue562_signed_flow_verifier.py /tmp/issue562-verifier-latest.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/issue562-verifier-latest.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'dd3ecb617ecd2476e20e9215eeb422d2cdc95750': '9268e31d5ec261d6463bb4e9611804e4c7184def',
              'adf835cf45936dbc40bf8d4f74879825ae211ef9': '9092c8360d6625c97700de5342ba0e0cbec1d1a0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'verifier authority occurrence mismatch for {old}: {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          sha256sum /tmp/issue562-verifier-latest.py
      - name: Checkout exact latest calibration authority independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9268e31d5ec261d6463bb4e9611804e4c7184def
          persist-credentials: false
      - name: Assert latest authorities independently
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CALIBRATION_HEAD"
          grep -Fq "_IMPLEMENTATION_HEAD = \"$IMPLEMENTATION_HEAD\"" trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Download rebound artifact through API and verify API digest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REBOUND_ARTIFACT_ID"
          rm -rf /tmp/issue562-rebound-published /tmp/issue562-rebound-download
          mkdir -p /tmp/issue562-rebound-published /tmp/issue562-rebound-download
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: trade-rl-issue562-rebound-verifier/1" \
            "https://api.github.com/repos/shuntatsu/trade_rl/actions/artifacts/${REBOUND_ARTIFACT_ID}" \
            --output /tmp/issue562-rebound-download/meta.json
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: trade-rl-issue562-rebound-verifier/1" \
            "https://api.github.com/repos/shuntatsu/trade_rl/actions/artifacts/${REBOUND_ARTIFACT_ID}/zip" \
            --output /tmp/issue562-rebound-download/rebound.zip
          uv run python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          meta = json.loads(Path('/tmp/issue562-rebound-download/meta.json').read_text())
          digest = meta.get('digest')
          if not isinstance(digest, str) or not digest.startswith('sha256:') or meta.get('expired') is not False:
              raise SystemExit('rebound API artifact metadata invalid')
          raw = Path('/tmp/issue562-rebound-download/rebound.zip').read_bytes()
          if 'sha256:' + hashlib.sha256(raw).hexdigest() != digest:
              raise SystemExit('rebound artifact ZIP digest differs from API digest')
          with zipfile.ZipFile('/tmp/issue562-rebound-download/rebound.zip') as z:
              names = sorted(z.namelist())
              expected = ['publisher-metadata.json', 'result.json', 'source-manifest.json']
              if names != expected:
                  raise SystemExit(f'rebound artifact members differ: {names!r}')
              for name in names:
                  (Path('/tmp/issue562-rebound-published') / name).write_bytes(z.read(name))
          print(f'REBOUND_API_DIGEST={digest}')
          PY
      - name: Freshly re-fetch all 125 archives and require byte-identical latest reconstruction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue562-latest-verified
          uv run python /tmp/issue562-verifier-latest.py \
            --published-dir /tmp/issue562-rebound-published \
            --verified-dir /tmp/issue562-latest-verified \
            --preflight-run-id "$PREFLIGHT_RUN_ID" \
            --preflight-artifact-id "$PREFLIGHT_ARTIFACT_ID" \
            --preflight-api-digest "$PREFLIGHT_API_DIGEST" \
            --preflight-content-digest "$PREFLIGHT_CONTENT_DIGEST"
      - name: Upload independently verified latest-authority reconstruction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue562-authority-rebound-verified-${{ github.run_id }}
          path: /tmp/issue562-latest-verified/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
