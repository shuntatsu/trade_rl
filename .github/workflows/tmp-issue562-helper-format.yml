name: Temporary Issue 562 helper formatter

on:
  push:
    branches:
      - verify/issue562-publisher-verifier-static
    paths:
      - .github/workflows/tmp-issue562-helper-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 7f2a95e8663cfc046913934f975a1242ff156509
    steps:
      - name: Checkout exact staged helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7f2a95e8663cfc046913934f975a1242ff156509
      - name: Assert exact staged head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format helpers
        run: |
          uv run ruff format \
            tools/tmp_issue562_signed_flow_publisher.py \
            tools/tmp_issue562_signed_flow_verifier.py
          uv run ruff format --check \
            tools/tmp_issue562_signed_flow_publisher.py \
            tools/tmp_issue562_signed_flow_verifier.py
      - name: Commit only if run branch has not moved
        run: |
          set -euo pipefail
          git fetch origin run/issue562-signed-flow-training
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/tmp_issue562_signed_flow_publisher.py \
            tools/tmp_issue562_signed_flow_verifier.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "style: format Issue 562 publisher verifier helpers"
          git push origin HEAD:run/issue562-signed-flow-training
