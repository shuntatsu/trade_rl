name: Temporary Issue 562 RED format

on:
  push:
    branches:
      - automation/issue562-red-format
    paths:
      - .github/workflows/tmp-issue562-red-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue562-signed-taker-flow-calibration
  TARGET_SHA: 209c8b4f782e8ef778bbb897865516f77f795495

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and validate test only
        run: |
          uv run ruff format tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run ruff check --fix tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run ruff check tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run pytest --collect-only -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
      - name: Recheck and publish test-only formatting
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format signed taker calibration RED test"
          git push origin HEAD:"$TARGET_BRANCH"
