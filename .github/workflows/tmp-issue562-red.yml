name: Temporary Issue 562 synthetic RED

on:
  push:
    branches:
      - verify/issue562-red-209c8b4
    paths:
      - .github/workflows/tmp-issue562-red.yml

permissions:
  contents: read

env:
  TARGET_SHA: 209c8b4f782e8ef778bbb897865516f77f795495

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Validate RED test file quality
        run: |
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run ruff check tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          uv run pytest --collect-only -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
      - name: Require production-missing RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q "signed_taker_flow_calibration" /tmp/red.log
          grep -Eq "ModuleNotFoundError|No module named" /tmp/red.log
