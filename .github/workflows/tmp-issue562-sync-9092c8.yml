name: Temporary Issue 562 sync to sparse-safe source authority

on:
  push:
    branches:
      - automation/issue562-sync-9092c8
    paths:
      - .github/workflows/tmp-issue562-sync-9092c8.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue562-signed-taker-flow-calibration
  TARGET_SHA: dd3ecb617ecd2476e20e9215eeb422d2cdc95750
  SOURCE_BRANCH: feat/issue560-signed-taker-flow
  SOURCE_SHA: 9092c8360d6625c97700de5342ba0e0cbec1d1a0
  OLD_SOURCE_SHA: adf835cf45936dbc40bf8d4f74879825ae211ef9

jobs:
  sync_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact calibration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and source authorities
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$SOURCE_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
      - name: Merge source authority and update fixed result authority
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$SOURCE_SHA"
          python - <<'PY'
          from pathlib import Path
          import os

          old = os.environ["OLD_SOURCE_SHA"]
          new = os.environ["SOURCE_SHA"]
          paths = [
              Path("trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py"),
              Path("tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py"),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              total += count
              path.write_text(text.replace(old, new), encoding="utf-8")
          if total != 2:
              raise RuntimeError(f"expected exactly two source-authority replacements, got {total}")
          PY
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static and synthetic verification on merged tree
        run: |
          set -euo pipefail
          uv run ruff format --check \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            trade_rl/integrations/binance/dataset.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py \
            tests/integrations/test_binance.py
          uv run ruff check \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            trade_rl/integrations/binance/dataset.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py \
            tests/integrations/test_binance.py
          uv run mypy \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            trade_rl/integrations/binance/dataset.py
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py \
            tests/integrations/test_binance.py \
            tests/integrations/test_binance_signed_taker_flow_source.py \
            tests/data/test_signed_taker_flow_feature.py \
            tests/data/test_signed_taker_flow_identity_compat.py
      - name: Commit merge only after Green
        run: |
          set -euo pipefail
          git add \
            trade_rl/evaluation/experiments/bootstrap/signed_taker_flow_calibration.py \
            tests/evaluation/experiments/bootstrap/test_signed_taker_flow_calibration.py
          git commit -m "merge: bind calibration to sparse-safe signed-flow source"
      - name: Recheck authorities and publish
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" "$SOURCE_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
