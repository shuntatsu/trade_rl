name: Temporary Issue 569 index-price structural source gate

on:
  push:
    branches:
      - verify/issue569-index-source
    paths:
      - .github/workflows/tmp-issue569-index-source.yml

permissions:
  contents: read

jobs:
  publisher:
    name: Structural publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report_sha256: ${{ steps.fingerprint.outputs.report_sha256 }}
      content_digest: ${{ steps.fingerprint.outputs.content_digest }}
    steps:
      - name: Checkout exact probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify workflow head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run frozen 20-archive structural probe
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_issue569_index_source_probe.py \
            /tmp/issue569/publisher/structural-report.json \
            "$GITHUB_SHA"
      - name: Fingerprint canonical report
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/issue569/publisher/structural-report.json
          report_sha256="$(sha256sum "$report" | awk '{print $1}')"
          content_digest="$(python3 - "$report" <<'PY'
          import json, sys
          from pathlib import Path
          raw=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(raw['content_digest'])
          PY
          )"
          echo "report_sha256=$report_sha256" >> "$GITHUB_OUTPUT"
          echo "content_digest=$content_digest" >> "$GITHUB_OUTPUT"
          printf 'canonical report sha256=%s content_digest=%s\n' "$report_sha256" "$content_digest"
      - name: Upload immutable publisher report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue569-index-source-publisher-${{ github.run_id }}
          path: /tmp/issue569/publisher/structural-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  fresh_verify:
    name: Fresh independent re-fetch and reconstruction
    needs: publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact probe source on fresh runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify workflow head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Independently re-fetch all 20 archives and reconstruct
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_issue569_index_source_probe.py \
            /tmp/issue569/fresh/structural-report.json \
            "$GITHUB_SHA"
      - name: Require byte-identical reconstruction
        shell: bash
        env:
          EXPECTED_REPORT_SHA256: ${{ needs.publisher.outputs.report_sha256 }}
          EXPECTED_CONTENT_DIGEST: ${{ needs.publisher.outputs.content_digest }}
        run: |
          set -euo pipefail
          report=/tmp/issue569/fresh/structural-report.json
          actual_sha256="$(sha256sum "$report" | awk '{print $1}')"
          actual_content_digest="$(python3 - "$report" <<'PY'
          import json, sys
          from pathlib import Path
          raw=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(raw['content_digest'])
          PY
          )"
          test "$actual_sha256" = "$EXPECTED_REPORT_SHA256"
          test "$actual_content_digest" = "$EXPECTED_CONTENT_DIGEST"
          printf 'fresh byte-identical reconstruction: OK sha256=%s content_digest=%s\n' \
            "$actual_sha256" "$actual_content_digest"
      - name: Upload fresh reconstructed report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue569-index-source-fresh-${{ github.run_id }}
          path: /tmp/issue569/fresh/structural-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
