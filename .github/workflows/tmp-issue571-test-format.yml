name: Temporary Issue 571 test formatting

on:
  push:
    branches:
      - automation/issue571-test-format
    paths:
      - .github/workflows/tmp-issue571-test-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue571-basis-prereg
  TARGET_SHA: a2dd7ac05412d2732e52de8e88776d884510c854
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_perp_index_basis_prereg.py

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and lint test only
        run: |
          uv run ruff format "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
      - name: Guard and publish formatted test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "style: format Issue 571 preregistration tests"
          git push origin HEAD:"$TARGET_BRANCH"
