name: Temporary Issue 573 Binance index source implementation

on:
  push:
    branches:
      - automation/issue573-binance-source
    paths:
      - .github/workflows/tmp-issue573-binance-source.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue573-perp-index-basis-source
  TARGET_SHA: 043134ad82473f024648d9d0047bf66309d6dacc

jobs:
  implement_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and load patch helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" automation/issue573-binance-source --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git show origin/automation/issue573-binance-source:tools/tmp_issue573_apply_binance_source.py > /tmp/apply.py
      - name: Apply Binance source implementation
        run: python3 /tmp/apply.py
      - name: Correct transport test to the existing raw-row type boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/integrations/test_binance_index_price_source.py")
          text = path.read_text(encoding="utf-8")
          old = "    assert rows[0][0] == _ms(datetime(2022, 1, 1, tzinfo=UTC))\n"
          new = "    assert int(rows[0][0]) == _ms(datetime(2022, 1, 1, tzinfo=UTC))\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one raw-row type-boundary assertion")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/integrations/binance/vision.py \
            trade_rl/integrations/binance/transport.py \
            trade_rl/integrations/binance/dataset.py \
            trade_rl/integrations/binance/__init__.py \
            tests/integrations/test_binance_index_price_source.py
          uv run ruff check \
            trade_rl/integrations/binance/vision.py \
            trade_rl/integrations/binance/transport.py \
            trade_rl/integrations/binance/dataset.py \
            trade_rl/integrations/binance/__init__.py \
            tests/integrations/test_binance_index_price_source.py
          uv run mypy \
            trade_rl/integrations/binance/vision.py \
            trade_rl/integrations/binance/transport.py \
            trade_rl/integrations/binance/dataset.py
      - name: Targeted Binance and basis regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/integrations/test_binance_index_price_source.py \
            tests/integrations/test_binance.py \
            tests/integrations/test_binance_multitimeframe.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/integrations/test_binance_cache.py \
            tests/data/test_perp_index_basis_feature.py \
            tests/data/test_market_builder.py \
            tests/data/test_information_availability.py
      - name: Guard and publish only Green changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/integrations/binance/vision.py \
            trade_rl/integrations/binance/transport.py \
            trade_rl/integrations/binance/dataset.py \
            trade_rl/integrations/binance/__init__.py \
            tests/integrations/test_binance_index_price_source.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement strict Binance index-price source"
          git push origin HEAD:"$TARGET_BRANCH"
