name: Temporary Issue 573 data-core implementation

on:
  push:
    branches:
      - automation/issue573-data-core
    paths:
      - .github/workflows/tmp-issue573-data-core.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue573-perp-index-basis-source
  TARGET_SHA: cf723af1917b8c61e376216fb50e86f10c90c3f3

jobs:
  implement_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and load patch helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" automation/issue573-data-core --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git show origin/automation/issue573-data-core:tools/tmp_issue573_apply_data_core.py > /tmp/apply.py
      - name: Apply data-core implementation
        run: python3 /tmp/apply.py
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/build/builder.py \
            tests/data/test_perp_index_basis_feature.py
          uv run ruff check \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/build/builder.py \
            tests/data/test_perp_index_basis_feature.py
          uv run mypy \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/build/builder.py
      - name: Targeted data-core tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/data/test_perp_index_basis_feature.py \
            tests/data/test_market_builder.py \
            tests/data/test_information_availability.py \
            tests/data/test_market_dataset_identity_v2.py \
            tests/data/test_feature_availability_v2.py \
            tests/data/test_extended_prefix_causality.py
      - name: Guard and publish only Green changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/data/source.py \
            trade_rl/data/contracts.py \
            trade_rl/data/build/builder.py \
            tests/data/test_perp_index_basis_feature.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement perpetual-index basis data core"
          git push origin HEAD:"$TARGET_BRANCH"
