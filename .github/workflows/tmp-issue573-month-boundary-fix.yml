name: Temporary Issue 573 archive-month boundary fix

on:
  push:
    branches:
      - automation/issue573-month-boundary-fix
    paths:
      - .github/workflows/tmp-issue573-month-boundary-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue573-perp-index-basis-source
  TARGET_SHA: 7383acbce863a54a4439231e57eef5c3aa9748db

jobs:
  fix_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and load fix helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" automation/issue573-month-boundary-fix --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git show origin/automation/issue573-month-boundary-fix:tools/tmp_issue573_fix_month_boundary.py > /tmp/fix.py
      - name: Apply minimal month-boundary fix
        run: python3 /tmp/fix.py
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/integrations/binance/transport.py \
            tests/integrations/test_binance_index_price_source.py
          uv run ruff check \
            trade_rl/integrations/binance/transport.py \
            tests/integrations/test_binance_index_price_source.py
          uv run mypy trade_rl/integrations/binance/transport.py
      - name: Targeted and regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/integrations/test_binance_index_price_source.py \
            tests/integrations/test_binance.py \
            tests/integrations/test_binance_multitimeframe.py \
            tests/integrations/test_binance_vision_cache.py \
            tests/integrations/test_binance_cache.py \
            tests/data/test_perp_index_basis_feature.py \
            tests/data/test_market_builder.py \
            tests/data/test_information_availability.py
      - name: Guard and publish only Green changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/integrations/binance/transport.py \
            tests/integrations/test_binance_index_price_source.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce index archive month boundary"
          git push origin HEAD:"$TARGET_BRANCH"
