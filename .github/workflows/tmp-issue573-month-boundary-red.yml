name: Temporary Issue 573 archive-month boundary RED

on:
  push:
    branches:
      - automation/issue573-month-boundary-red
    paths:
      - .github/workflows/tmp-issue573-month-boundary-red.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/issue573-perp-index-basis-source
  TARGET_SHA: 413a7bb1a6760d170953fba7acecf007935c1a19
  TEST_PATH: tests/integrations/test_binance_index_price_source.py

jobs:
  red_publish_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target and load RED helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" automation/issue573-month-boundary-red --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git show origin/automation/issue573-month-boundary-red:tools/tmp_issue573_add_month_boundary_test.py > /tmp/add_test.py
      - name: Add adversarial archive-month boundary test
        run: python3 /tmp/add_test.py
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and lint RED test
        run: |
          uv run ruff format "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
      - name: Require intended RED
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            "$TEST_PATH"::test_transport_rejects_row_outside_archive_calendar_month \
            > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q 'DID NOT RAISE' /tmp/red.log
          ! grep -q 'SyntaxError' /tmp/red.log
      - name: Guard and publish failing test only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_PATH"
          git commit -m "test: reject index archive month-boundary drift"
          git push origin HEAD:"$TARGET_BRANCH"
