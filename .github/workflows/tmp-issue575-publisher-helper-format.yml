name: Temporary Issue 575 publisher helper format

on:
  push:
    branches:
      - automation/issue575-publisher-helper-format
    paths:
      - .github/workflows/tmp-issue575-publisher-helper-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: verify/issue575-publisher-helper
  TARGET_SHA: 94db87d23c5b72123e499d6e186bbd54ac73fce2

jobs:
  format_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact helper candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Apply formatting only
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            tools/tmp_issue575_basis_publisher.py \
            tools/tmp_issue575_basis_verifier.py \
            tests/evaluation/experiments/bootstrap/test_issue575_publisher_helpers.py
          uv run ruff check \
            tools/tmp_issue575_basis_publisher.py \
            tools/tmp_issue575_basis_verifier.py \
            tests/evaluation/experiments/bootstrap/test_issue575_publisher_helpers.py
      - name: Guard and publish formatting only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/tmp_issue575_basis_publisher.py \
            tools/tmp_issue575_basis_verifier.py \
            tests/evaluation/experiments/bootstrap/test_issue575_publisher_helpers.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format Issue 575 publisher helpers"
          git push origin HEAD:"$TARGET_BRANCH"
