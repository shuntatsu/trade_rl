name: Temporary Issue 575 calibration RED

on:
  push:
    branches:
      - automation/issue575-red-format
    paths:
      - .github/workflows/tmp-issue575-red.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue575-basis-calibration
  TARGET_SHA: 5bb6dbea8d91ea798f9ffa18711fbd2a99525dfb
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_perp_index_basis_calibration.py

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and lint RED test
        run: |
          uv run ruff format "$TEST_PATH"
          uv run ruff check --fix "$TEST_PATH"
          uv run ruff format "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
      - name: Require missing-production RED
        shell: bash
        run: |
          set +e
          uv run pytest -q "$TEST_PATH" > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q "No module named 'trade_rl.evaluation.experiments.bootstrap.perp_index_basis_calibration'" /tmp/red.log
          ! grep -q 'SyntaxError' /tmp/red.log
      - name: Guard and publish formatted RED test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "style: format Issue 575 calibration RED"
          git push origin HEAD:"$TARGET_BRANCH"
