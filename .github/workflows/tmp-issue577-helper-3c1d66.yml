name: Temporary Issue 577 helper verification

on:
  push:
    branches:
      - verify/issue577-helper-3c1d66
    paths:
      - .github/workflows/tmp-issue577-helper-3c1d66.yml

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact helper target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3c1d6623f20abb971f00861e749809dadb56d9dc
          persist-credentials: false
      - name: Assert exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3c1d6623f20abb971f00861e749809dadb56d9dc"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          files="tools/tmp_issue577_basis_common.py tools/tmp_issue577_basis_publisher.py tools/tmp_issue577_basis_verifier.py tests/evaluation/experiments/bootstrap/test_issue577_basis_publisher_helper.py"
          uv run ruff check $files
          uv run ruff format --check $files
          uv run mypy $files
      - name: Synthetic helper suite
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_issue577_basis_publisher_helper.py
      - name: Existing authority regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/data/test_perp_index_basis_feature.py tests/integrations/test_binance_index_price_source.py tests/evaluation/experiments/bootstrap/test_perp_index_basis_calibration.py tests/evaluation/experiments/bootstrap/test_perp_index_basis_calibration_artifact_semantics.py
      - name: Re-assert clean exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3c1d6623f20abb971f00861e749809dadb56d9dc"
          test -z "$(git status --porcelain --untracked-files=no)"
