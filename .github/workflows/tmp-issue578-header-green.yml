name: Temporary Issue 578 provider Spot header naming GREEN

on:
  push:
    branches:
      - verify/issue578-header-green

permissions:
  contents: read

env:
  TARGET_SHA: 3c728d8459b8b3b13ffc1457c987d4b4816f67b0

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact fixed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static and targeted verification
        run: |
          uv run ruff format --check \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          uv run ruff check \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
