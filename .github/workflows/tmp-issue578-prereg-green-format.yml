name: Temporary Issue 578 preregistration format and GREEN

on:
  push:
    branches:
      - automation/issue578-prereg-green-format

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue578-spot-aggtrades-source-prereg
  TARGET_SHA: 18a0d018fef14f5a55e1dd666cd41856e349a683

jobs:
  format_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format static and targeted checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          uv run ruff check \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
      - name: Guard and publish only verified files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          changed="$(git diff --name-only)"
          test -z "$(printf '%s\n' "$changed" | grep -v -E '^(trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py|tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py)$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py
          git diff --cached --quiet && exit 0
          git commit -m "style: format Spot aggTrades source preregistration"
          git push origin HEAD:"$TARGET_BRANCH"
