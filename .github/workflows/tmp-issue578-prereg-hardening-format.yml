name: Temporary Issue 578 preregistration hardening formatter

on:
  push:
    branches:
      - automation/issue578-prereg-hardening-format
    paths:
      - .github/workflows/tmp-issue578-prereg-hardening-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue578-prereg-hardening-red
          fetch-depth: 0
      - name: Assert expected starting head
        run: test "$(git rev-parse HEAD)" = "6b9e7dbbc49ea4bc2bf48779f9e99fa22e29cb99"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format only the new hardening test
        shell: bash
        run: |
          set -euo pipefail
          file=tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg_hardening.py
          uv run ruff format "$file"
          uv run ruff check "$file"
          uv run ruff format --check "$file"
          git diff --check
      - name: Guard and publish formatting-only repair
        shell: bash
        run: |
          set -euo pipefail
          expected=6b9e7dbbc49ea4bc2bf48779f9e99fa22e29cb99
          remote="$(git ls-remote origin refs/heads/automation/issue578-prereg-hardening-red | cut -f1)"
          test "$remote" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg_hardening.py
          git commit -m "style: format Spot preregistration hardening test"
          git push origin HEAD:automation/issue578-prereg-hardening-red
