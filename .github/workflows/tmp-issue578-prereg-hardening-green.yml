name: Temporary Issue 578 preregistration hardening GREEN

on:
  push:
    branches:
      - verify/issue578-prereg-hardening-green
    paths:
      - .github/workflows/tmp-issue578-prereg-hardening-green.yml

permissions:
  contents: read

env:
  TARGET_SHA: 6b9e7dbbc49ea4bc2bf48779f9e99fa22e29cb99

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact GREEN target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact GREEN target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Static and targeted GREEN
        shell: bash
        run: |
          set -euo pipefail
          files="trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg_hardening.py"
          uv run ruff check $files
          uv run ruff format --check $files
          uv run mypy trade_rl/evaluation/experiments/bootstrap/spot_aggtrades_source_prereg.py
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_aggtrades_source_prereg_hardening.py
      - name: Reassert clean exact target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
