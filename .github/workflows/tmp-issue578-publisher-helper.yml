name: Temporary Issue 578 publisher helper synthetic verification

on:
  push:
    branches:
      - verify/issue578-publisher-helper

permissions:
  contents: read

env:
  TARGET_SHA: 56b5f7dbe0907509c8cf1c7f33f813f1a5930a4d

jobs:
  verify_helper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static helper checks
        run: |
          uv run ruff format --check tools/tmp_issue578_run_spot_structural_probe.py
          uv run ruff check tools/tmp_issue578_run_spot_structural_probe.py
          uv run python -m py_compile tools/tmp_issue578_run_spot_structural_probe.py
      - name: Synthetic publisher self-test only
        run: uv run python tools/tmp_issue578_run_spot_structural_probe.py --self-test
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
