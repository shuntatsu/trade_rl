name: Temporary Issue 578 validator hardening RED

on:
  push:
    branches:
      - verify/issue578-validator-hardening-red

permissions:
  contents: read

env:
  TARGET_SHA: cf0a684e347159788a40c2e33a035d8715128ad6

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact hardening RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Normalize RED test source then lint
        run: |
          uv run ruff format tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator_hardening.py
          uv run ruff check tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator_hardening.py
      - name: Require closure-tampering RED
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator_hardening.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q 'DID NOT RAISE' /tmp/red.log
          ! grep -q 'SyntaxError' /tmp/red.log
