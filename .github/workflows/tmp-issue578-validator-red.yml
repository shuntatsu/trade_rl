name: Temporary Issue 578 structural validator RED

on:
  push:
    branches:
      - verify/issue578-spot-validator-red

permissions:
  contents: read

env:
  TARGET_SHA: 7a67a28e4b724f1436ca15254453e432569c3fdf

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Test source quality
        run: |
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator.py
          uv run ruff check tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator.py
      - name: Require missing-validator RED
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_aggtrades_structural_validator.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -Eq "ModuleNotFoundError|No module named.*spot_aggtrades_structural_validator" /tmp/red.log
          ! grep -q "SyntaxError" /tmp/red.log
