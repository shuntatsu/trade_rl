name: Temporary Issue 584 diagnostic GREEN c0f1

on:
  push:
    branches:
      - verify/issue584-diagnostic-green-c0f1
    paths:
      - .github/workflows/tmp-issue584-diagnostic-green-c0f1.yml

permissions:
  contents: read

env:
  TARGET_SHA: c0f147b42a6aad74dd88f6a5102be2bdf8cbadbb
  SOURCE_PATH: trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_diagnostic.py
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static checks
        run: |
          uv run ruff format --check "$SOURCE_PATH" "$TEST_PATH"
          uv run ruff check "$SOURCE_PATH" "$TEST_PATH"
          uv run mypy "$SOURCE_PATH"
      - name: Targeted tests
        run: uv run pytest -q "$TEST_PATH"
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
