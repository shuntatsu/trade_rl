name: Temporary Issue 584 diagnostic GREEN formatter

on:
  push:
    branches:
      - automation/issue584-diagnostic-green-format
    paths:
      - .github/workflows/tmp-issue584-diagnostic-green-format.yml

permissions:
  contents: write

env:
  TARGET_SHA: c0774c449aad8ba7f4649bfe743214293db7dfb8
  RESEARCH_BRANCH: research/issue584-spot-flow-diagnostic-impl
  SOURCE_PATH: trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_diagnostic.py

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format source only
        run: |
          uv run ruff format "$SOURCE_PATH"
          uv run ruff check "$SOURCE_PATH"
          test "$(git status --porcelain | cut -c4- | sort -u)" = "$SOURCE_PATH"
      - name: Guard and publish source-only format
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)"
          test "$remote" = "$TARGET_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SOURCE_PATH"
          git commit -m "style: format Spot flow diagnostic core"
          git push origin HEAD:"$RESEARCH_BRANCH"
