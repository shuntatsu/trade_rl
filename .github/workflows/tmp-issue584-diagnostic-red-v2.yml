name: Temporary Issue 584 diagnostic RED v2

on:
  push:
    branches:
      - verify/issue584-diagnostic-red-v2
    paths:
      - .github/workflows/tmp-issue584-diagnostic-red-v2.yml

permissions:
  contents: read

env:
  TARGET_SHA: ed4e9dbc2c6017332891302b1caabd0c8c94e8f3
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic.py

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Test source quality
        run: |
          uv run ruff format --check "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
      - name: Require missing-production RED
        shell: bash
        run: |
          set +e
          uv run pytest -q "$TEST_PATH" > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -Eq "ImportError|cannot import name.*spot_flow_continuation_diagnostic|No module named.*spot_flow_continuation_diagnostic" /tmp/red.log
          ! grep -q "SyntaxError" /tmp/red.log
