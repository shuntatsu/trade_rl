name: Temporary Issue 584 diagnostic semantic RED

on:
  push:
    branches:
      - verify/issue584-diagnostic-semantic-red
    paths:
      - .github/workflows/tmp-issue584-diagnostic-semantic-red.yml

permissions:
  contents: read

env:
  TARGET_SHA: c78c0f235771fc269ef703a5a872228a388c9e3a
  CORE_TEST: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic.py
  SEMANTIC_TEST: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic_semantics.py

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Source quality
        run: |
          uv run ruff format --check "$CORE_TEST" "$SEMANTIC_TEST"
          uv run ruff check "$CORE_TEST" "$SEMANTIC_TEST"
      - name: Require existing core GREEN
        run: uv run pytest -q "$CORE_TEST"
      - name: Require semantic-forgery RED
        shell: bash
        run: |
          set +e
          uv run pytest -q "$SEMANTIC_TEST" > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -Eq "DID NOT RAISE|Failed: DID NOT RAISE" /tmp/red.log
