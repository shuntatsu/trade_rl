name: Temporary Issue 584 diagnostic target rebind GREEN v2

on:
  push:
    branches:
      - automation/issue584-diagnostic-target-rebind-green-v2
    paths:
      - .github/workflows/tmp-issue584-diagnostic-target-rebind-green-v2.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue584-spot-flow-diagnostic-v3
  TARGET_SHA: 53b005f4dd16de4b4bfe9593714db4d77d8da07f
  RED_SHA: ce8f28a0fee30b72be82c98b43b8fa891fbdc4a9
  PATCH_SOURCE_SHA: e617d60e16e103e9ba4d8b30dc1956390b2a11a1
  PATCH_WORKFLOW: .github/workflows/tmp-issue584-diagnostic-target-rebind-green.yml
  MODULE: trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_diagnostic.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py

jobs:
  green_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact current v3 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Guard target and recover frozen RED oracle plus pre-result patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git fetch origin "$RED_SHA" "$PATCH_SOURCE_SHA" --no-tags --depth=1
          git show "$RED_SHA:$TEST_FILE" > "$TEST_FILE"
          test "$(git diff HEAD --name-only)" = "$TEST_FILE"
          git show "$PATCH_SOURCE_SHA:$PATCH_WORKFLOW" > /tmp/pre_result_patch_workflow.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/pre_result_patch_workflow.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in body.splitlines()]
          Path('/tmp/pre_result_patch.py').write_text("\n".join(lines) + "\n")
          PY
          python3 /tmp/pre_result_patch.py
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev

      - name: Targeted GREEN and static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$MODULE" "$TEST_FILE"
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic_semantics.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_streaming.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_hardening.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_target_source.py
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"

      - name: Guard and publish exactly two verified files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE" "$TEST_FILE"
          git commit -m "fix: bind hardened target-source authority into diagnostic result"
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
