name: Temporary Issue 584 diagnostic target rebind GREEN

on:
  push:
    branches:
      - automation/issue584-diagnostic-target-rebind-green
    paths:
      - .github/workflows/tmp-issue584-diagnostic-target-rebind-green.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue584-spot-flow-diagnostic-v3
  TARGET_SHA: 53b005f4dd16de4b4bfe9593714db4d77d8da07f
  RED_SHA: ce8f28a0fee30b72be82c98b43b8fa891fbdc4a9
  MODULE: trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_diagnostic.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py

jobs:
  green_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact current v3 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: true
      - name: Guard target and overlay exact RED oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git fetch origin "$RED_SHA" --no-tags --depth=1
          git checkout "$RED_SHA" -- "$TEST_FILE"
          test "$(git diff --name-only)" = "$TEST_FILE"
      - name: Add hardened Issue 586 authority without replacing legacy bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_diagnostic.py")
          text = path.read_text()
          replacements = [
              (
                  '_SCHEMA_VERSION = "spot_flow_continuation_diagnostic_v1"',
                  '_SCHEMA_VERSION = "spot_flow_continuation_diagnostic_v2"',
              ),
              (
                  '_TARGET_MANIFEST_DIGEST = (\n'
                  '    "69a4105e8839d38972a034b49c9a3d019d3bc330981fce7cb860276e9ca0b25b"\n'
                  ')\n'
                  '_QUARTER_HOUR_MS = 15 * 60 * 1_000\n',
                  '_TARGET_MANIFEST_DIGEST = (\n'
                  '    "69a4105e8839d38972a034b49c9a3d019d3bc330981fce7cb860276e9ca0b25b"\n'
                  ')\n'
                  '_TARGET_SOURCE_STATUS = "PASS_USDM_15M_TARGET_SOURCE"\n'
                  '_TARGET_SOURCE_VALIDATOR_HEAD = "12151cb014f62f603fc115b3129d14264eb93683"\n'
                  '_TARGET_SOURCE_VALIDATOR_FULL_VERIFY_RUN_ID = 34951770631\n'
                  '_TARGET_SOURCE_REBIND_RUN_ID = 34953161630\n'
                  '_TARGET_SOURCE_REBIND_ARTIFACT_ID = 10389544902\n'
                  '_TARGET_SOURCE_REBIND_ARTIFACT_API_DIGEST = (\n'
                  '    "2a1f1d7d700fc662862ebab5b41ff692d154dbfef793fb505ce7e1ea5647e2c2"\n'
                  ')\n'
                  '_TARGET_SOURCE_REBIND_FRESH_ARTIFACT_ID = 10389694422\n'
                  '_TARGET_SOURCE_REBIND_FRESH_ARTIFACT_API_DIGEST = (\n'
                  '    "8b5cbd19abb9517bf4885f3b9432b29024069f0005b8d18e89b82b2471765e3d"\n'
                  ')\n'
                  '_QUARTER_HOUR_MS = 15 * 60 * 1_000\n',
              ),
              (
                  '    target_preflight_report_content_digest: str = (\n'
                  '        _TARGET_PREFLIGHT_REPORT_CONTENT_DIGEST\n'
                  '    )\n'
                  '    prereg_head: str = _PREREG_HEAD\n',
                  '    target_preflight_report_content_digest: str = (\n'
                  '        _TARGET_PREFLIGHT_REPORT_CONTENT_DIGEST\n'
                  '    )\n'
                  '    target_source_status: str = _TARGET_SOURCE_STATUS\n'
                  '    target_source_validator_head: str = _TARGET_SOURCE_VALIDATOR_HEAD\n'
                  '    target_source_validator_full_verify_run_id: int = (\n'
                  '        _TARGET_SOURCE_VALIDATOR_FULL_VERIFY_RUN_ID\n'
                  '    )\n'
                  '    target_source_rebind_run_id: int = _TARGET_SOURCE_REBIND_RUN_ID\n'
                  '    target_source_rebind_artifact_id: int = _TARGET_SOURCE_REBIND_ARTIFACT_ID\n'
                  '    target_source_rebind_artifact_api_digest: str = (\n'
                  '        _TARGET_SOURCE_REBIND_ARTIFACT_API_DIGEST\n'
                  '    )\n'
                  '    target_source_rebind_fresh_artifact_id: int = (\n'
                  '        _TARGET_SOURCE_REBIND_FRESH_ARTIFACT_ID\n'
                  '    )\n'
                  '    target_source_rebind_fresh_artifact_api_digest: str = (\n'
                  '        _TARGET_SOURCE_REBIND_FRESH_ARTIFACT_API_DIGEST\n'
                  '    )\n'
                  '    prereg_head: str = _PREREG_HEAD\n',
              ),
              (
                  '            "target_preflight_report_content_digest": (\n'
                  '                _TARGET_PREFLIGHT_REPORT_CONTENT_DIGEST\n'
                  '            ),\n'
                  '            "prereg_head": _PREREG_HEAD,\n',
                  '            "target_preflight_report_content_digest": (\n'
                  '                _TARGET_PREFLIGHT_REPORT_CONTENT_DIGEST\n'
                  '            ),\n'
                  '            "target_source_status": _TARGET_SOURCE_STATUS,\n'
                  '            "target_source_validator_head": _TARGET_SOURCE_VALIDATOR_HEAD,\n'
                  '            "target_source_validator_full_verify_run_id": (\n'
                  '                _TARGET_SOURCE_VALIDATOR_FULL_VERIFY_RUN_ID\n'
                  '            ),\n'
                  '            "target_source_rebind_run_id": _TARGET_SOURCE_REBIND_RUN_ID,\n'
                  '            "target_source_rebind_artifact_id": (\n'
                  '                _TARGET_SOURCE_REBIND_ARTIFACT_ID\n'
                  '            ),\n'
                  '            "target_source_rebind_artifact_api_digest": (\n'
                  '                _TARGET_SOURCE_REBIND_ARTIFACT_API_DIGEST\n'
                  '            ),\n'
                  '            "target_source_rebind_fresh_artifact_id": (\n'
                  '                _TARGET_SOURCE_REBIND_FRESH_ARTIFACT_ID\n'
                  '            ),\n'
                  '            "target_source_rebind_fresh_artifact_api_digest": (\n'
                  '                _TARGET_SOURCE_REBIND_FRESH_ARTIFACT_API_DIGEST\n'
                  '            ),\n'
                  '            "prereg_head": _PREREG_HEAD,\n',
              ),
              (
                  '            "target_preflight_report_content_digest": (\n'
                  '                self.target_preflight_report_content_digest\n'
                  '            ),\n'
                  '            "execution_run_id": self.execution_run_id,\n',
                  '            "target_preflight_report_content_digest": (\n'
                  '                self.target_preflight_report_content_digest\n'
                  '            ),\n'
                  '            "target_source_status": self.target_source_status,\n'
                  '            "target_source_validator_head": self.target_source_validator_head,\n'
                  '            "target_source_validator_full_verify_run_id": (\n'
                  '                self.target_source_validator_full_verify_run_id\n'
                  '            ),\n'
                  '            "target_source_rebind_run_id": self.target_source_rebind_run_id,\n'
                  '            "target_source_rebind_artifact_id": (\n'
                  '                self.target_source_rebind_artifact_id\n'
                  '            ),\n'
                  '            "target_source_rebind_artifact_api_digest": (\n'
                  '                self.target_source_rebind_artifact_api_digest\n'
                  '            ),\n'
                  '            "target_source_rebind_fresh_artifact_id": (\n'
                  '                self.target_source_rebind_fresh_artifact_id\n'
                  '            ),\n'
                  '            "target_source_rebind_fresh_artifact_api_digest": (\n'
                  '                self.target_source_rebind_fresh_artifact_api_digest\n'
                  '            ),\n'
                  '            "execution_run_id": self.execution_run_id,\n',
              ),
              (
                  '        "target_preflight_report_content_digest",\n'
                  '        "execution_run_id",\n',
                  '        "target_preflight_report_content_digest",\n'
                  '        "target_source_status",\n'
                  '        "target_source_validator_head",\n'
                  '        "target_source_validator_full_verify_run_id",\n'
                  '        "target_source_rebind_run_id",\n'
                  '        "target_source_rebind_artifact_id",\n'
                  '        "target_source_rebind_artifact_api_digest",\n'
                  '        "target_source_rebind_fresh_artifact_id",\n'
                  '        "target_source_rebind_fresh_artifact_api_digest",\n'
                  '        "execution_run_id",\n',
              ),
              (
                  '        target_preflight_report_content_digest=_require_hex(\n'
                  '            decoded["target_preflight_report_content_digest"],\n'
                  '            length=64,\n'
                  '            field="target_preflight_report_content_digest",\n'
                  '        ),\n'
                  '        execution_run_id=_require_int(\n',
                  '        target_preflight_report_content_digest=_require_hex(\n'
                  '            decoded["target_preflight_report_content_digest"],\n'
                  '            length=64,\n'
                  '            field="target_preflight_report_content_digest",\n'
                  '        ),\n'
                  '        target_source_status=_require_string(\n'
                  '            decoded["target_source_status"], field="target_source_status"\n'
                  '        ),\n'
                  '        target_source_validator_head=_require_hex(\n'
                  '            decoded["target_source_validator_head"],\n'
                  '            length=40,\n'
                  '            field="target_source_validator_head",\n'
                  '        ),\n'
                  '        target_source_validator_full_verify_run_id=_require_int(\n'
                  '            decoded["target_source_validator_full_verify_run_id"],\n'
                  '            field="target_source_validator_full_verify_run_id",\n'
                  '            minimum=1,\n'
                  '        ),\n'
                  '        target_source_rebind_run_id=_require_int(\n'
                  '            decoded["target_source_rebind_run_id"],\n'
                  '            field="target_source_rebind_run_id",\n'
                  '            minimum=1,\n'
                  '        ),\n'
                  '        target_source_rebind_artifact_id=_require_int(\n'
                  '            decoded["target_source_rebind_artifact_id"],\n'
                  '            field="target_source_rebind_artifact_id",\n'
                  '            minimum=1,\n'
                  '        ),\n'
                  '        target_source_rebind_artifact_api_digest=_require_hex(\n'
                  '            decoded["target_source_rebind_artifact_api_digest"],\n'
                  '            length=64,\n'
                  '            field="target_source_rebind_artifact_api_digest",\n'
                  '        ),\n'
                  '        target_source_rebind_fresh_artifact_id=_require_int(\n'
                  '            decoded["target_source_rebind_fresh_artifact_id"],\n'
                  '            field="target_source_rebind_fresh_artifact_id",\n'
                  '            minimum=1,\n'
                  '        ),\n'
                  '        target_source_rebind_fresh_artifact_api_digest=_require_hex(\n'
                  '            decoded["target_source_rebind_fresh_artifact_api_digest"],\n'
                  '            length=64,\n'
                  '            field="target_source_rebind_fresh_artifact_api_digest",\n'
                  '        ),\n'
                  '        execution_run_id=_require_int(\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one production patch anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN and static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$MODULE" "$TEST_FILE"
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic_semantics.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_streaming.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_hardening.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_target_source.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
      - name: Guard and publish exactly two verified files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE" "$TEST_FILE"
          git commit -m "fix: bind hardened target-source authority into diagnostic result"
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
