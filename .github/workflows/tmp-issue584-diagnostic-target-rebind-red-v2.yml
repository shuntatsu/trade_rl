name: Temporary Issue 584 diagnostic target rebind semantic RED v2

on:
  push:
    branches:
      - verify/issue584-diagnostic-target-rebind-red-run-v2
    paths:
      - .github/workflows/tmp-issue584-diagnostic-target-rebind-red-v2.yml

permissions:
  contents: read

env:
  TARGET_SHA: ce8f28a0fee30b72be82c98b43b8fa891fbdc4a9

jobs:
  semantic_red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static gates before semantic RED
        run: |
          uv run ruff check tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py
      - name: Semantic RED oracle
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_target_authority.py
