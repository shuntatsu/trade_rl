name: Temporary Issue 584 final preregistration digest derivation

on:
  push:
    branches:
      - verify/issue584-prereg-digest-89ec
    paths:
      - .github/workflows/tmp-issue584-prereg-digest-89ec.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: 89ec1092e438d69657840567e684739ca0c4e3d5
  FULL_VERIFY_RUN_ID: "34932104475"

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Bind exact head and final full verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/research/issue584-spot-flow-prereg | cut -f1)" = "$TARGET_SHA"
          run="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$FULL_VERIFY_RUN_ID)"
          test "$(jq -r .conclusion <<<"$run")" = success
          jobs="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$FULL_VERIFY_RUN_ID/jobs?per_page=100)"
          test "$(jq -r '[.jobs[].conclusion] | all(. == "success")' <<<"$jobs")" = true
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Derive canonical digest without economic data
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import hashlib
          from trade_rl.evaluation.experiments.bootstrap.spot_flow_continuation_prereg import canonical_spot_flow_continuation_protocol, load_spot_flow_continuation_protocol_bytes

          protocol = canonical_spot_flow_continuation_protocol()
          raw = protocol.canonical_json_bytes
          sha = hashlib.sha256(raw).hexdigest()
          if protocol.digest != sha:
              raise SystemExit('content digest and canonical JSON SHA differ')
          if load_spot_flow_continuation_protocol_bytes(raw).digest != sha:
              raise SystemExit('strict reload digest differs')
          payload = protocol.to_payload()
          if payload.get('target_source_family') != 'binance_vision_contract_klines':
              raise SystemExit('target source family differs')
          if payload.get('target_transport_mode') != 'VISION':
              raise SystemExit('target transport differs')
          for key in ('target_source_fallback_allowed','target_source_replacement_allowed','economic_values_inspected','target_relation_computed','training_relation_executed','evaluation_pnl_inspected','evaluation_execution_authorized','final_test_authorized','shared_cash_profitability_established','production_eligible','live_trading_authorized'):
              if payload.get(key) is not False:
                  raise SystemExit(f'forbidden preregistration flag differs: {key}')
          for key in ('target_source_checksum_required','target_source_manifest_binding_required','target_source_structural_preflight_required'):
              if payload.get(key) is not True:
                  raise SystemExit(f'required target authority flag differs: {key}')
          print('PROTOCOL_DIGEST=' + sha)
          print('TARGET_SOURCE_FAMILY=binance_vision_contract_klines')
          print('ECONOMIC_VALUES_INSPECTED=false')
          print('TARGET_RELATION_COMPUTED=false')
          print('TRAINING_RELATION_EXECUTED=false')
          PY
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
