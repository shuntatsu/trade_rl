name: Temporary Issue 584 preregistration GREEN

on:
  push:
    branches:
      - verify/issue584-prereg-green-c023

permissions:
  contents: read

env:
  TARGET_SHA: c0238576b1f34cf8de7608af2596b75549e97beb

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static checks
        run: |
          uv run ruff format --check \
            trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg.py
          uv run ruff check \
            trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_prereg.py \
            tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/spot_flow_continuation_prereg.py
      - name: Targeted preregistration tests
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg.py
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
