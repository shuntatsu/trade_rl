name: Temporary Issue 584 semantic RED formatter

on:
  push:
    branches:
      - automation/issue584-semantic-red-format
    paths:
      - .github/workflows/tmp-issue584-semantic-red-format.yml

permissions:
  contents: write

env:
  TARGET_SHA: c78c0f235771fc269ef703a5a872228a388c9e3a
  RESEARCH_BRANCH: research/issue584-spot-flow-diagnostic-impl
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_diagnostic_semantics.py

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: |
          uv run ruff format "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
          test "$(git status --porcelain | cut -c4- | sort -u)" = "$TEST_PATH"
      - name: Guard and publish formatted test only
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)"
          test "$remote" = "$TARGET_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TEST_PATH"
          git commit -m "test: format Spot flow semantic-forgery RED"
          git push origin HEAD:"$RESEARCH_BRANCH"
