name: Temporary Issue 584 streaming RED formatter
on:
  push:
    branches: [automation/issue584-streaming-test-format]
    paths: [.github/workflows/tmp-issue584-streaming-test-format.yml]
permissions:
  contents: write
env:
  TARGET_SHA: 77c78fce810940c369d2a3110985ae91d4750edb
  RESEARCH_BRANCH: research/issue584-spot-flow-diagnostic-impl
  TEST_PATH: tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_streaming.py
jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: |
          uv run ruff format "$TEST_PATH"
          uv run ruff check "$TEST_PATH"
          test "$(git status --porcelain | cut -c4- | sort -u)" = "$TEST_PATH"
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$TEST_PATH"
          git commit -m "test: format streaming Spot aggregation RED"
          git push origin HEAD:"$RESEARCH_BRANCH"
