name: Temporary Issue 584 target preflight formatter

on:
  push:
    branches:
      - automation/issue584-target-preflight-format
    paths:
      - .github/workflows/tmp-issue584-target-preflight-format.yml

permissions:
  contents: write

env:
  TARGET_SHA: 02c1e2bc3775a4714daa95e7a85d7ce59a9ce239
  TARGET_BRANCH: preflight/issue584-target-source-v1
  HELPER: tools/tmp_issue584_target_preflight.py

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format helper only
        run: |
          uv run ruff format "$HELPER"
          uv run ruff check "$HELPER"
          uv run mypy "$HELPER"
          test "$(git status --porcelain | cut -c4- | sort -u)" = "$HELPER"
      - name: Guard and publish formatted helper
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)"
          test "$remote" = "$TARGET_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$HELPER"
          git commit -m "style: format Issue 584 target preflight helper"
          git push origin HEAD:"$TARGET_BRANCH"
