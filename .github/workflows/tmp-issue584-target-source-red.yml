name: Temporary Issue 584 target-source authority RED

on:
  push:
    branches:
      - verify/issue584-target-source-red

permissions:
  contents: read

env:
  TARGET_SHA: 69055013442fe0f344d033754b3a2b6d4fee6c78

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Test source quality
        run: |
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_target_source.py
          uv run ruff check tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_target_source.py
      - name: Require missing target-source authority RED
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_spot_flow_continuation_prereg_target_source.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q 'target_source_family' /tmp/red.log
          ! grep -q 'SyntaxError' /tmp/red.log
