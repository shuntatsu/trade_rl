name: Temporary Issue 586 hardening test format

on:
  push:
    branches:
      - automation/issue586-hardening-format
    paths:
      - .github/workflows/tmp-issue586-hardening-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue586-target-source-validator
  TARGET_SHA: 6897bbe2cfb5a446201025aeb20acf8dd09062d3

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact hardening RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard research branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format hardening test only
        shell: bash
        run: |
          set -euo pipefail
          file=tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator_hardening.py
          uv run ruff format "$file"
          uv run ruff check --fix "$file"
          uv run ruff check "$file"
      - name: Guard and publish formatted hardening test only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          changed="$(git diff --name-only)"
          test -z "$(printf '%s\n' "$changed" | grep -v -E '^tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator_hardening.py$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator_hardening.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: format Issue 586 semantic-closure RED"
          git push origin HEAD:"$TARGET_BRANCH"
