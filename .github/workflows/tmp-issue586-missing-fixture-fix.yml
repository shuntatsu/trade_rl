name: Temporary Issue 586 missing-source fixture correction

on:
  push:
    branches:
      - automation/issue586-missing-fixture-fix
    paths:
      - .github/workflows/tmp-issue586-missing-fixture-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue586-target-source-validator
  TARGET_SHA: 0ccadeb12490ad4b51d0596ab87dbc70c6762221

jobs:
  fix_verify_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout automation head and preserve patch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Preserve helper then checkout exact research target
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tmp_issue586_fix_missing_fixture.py /tmp/patch.py
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
      - name: Correct missing-source synthetic fixture
        run: python3 /tmp/patch.py
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Verify fixture quality and frozen PARTIAL oracle
        shell: bash
        run: |
          set -euo pipefail
          file=tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator.py
          uv run ruff format "$file"
          uv run ruff check --fix "$file"
          uv run ruff check "$file"
          uv run pytest -q "$file" -k status_gate_distinguishes_pass_partial_incompatible_and_missing_source
      - name: Guard and publish test-only correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          changed="$(git diff --name-only)"
          test "$changed" = "tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator.py
          git commit -m "test: model missing Issue 586 archive faithfully"
          git push origin HEAD:"$TARGET_BRANCH"
