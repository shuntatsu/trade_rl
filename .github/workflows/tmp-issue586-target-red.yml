name: Temporary Issue 586 target-source validator RED

on:
  push:
    branches:
      - verify/issue586-target-source-validator-red
    paths:
      - .github/workflows/tmp-issue586-target-red.yml

permissions:
  contents: read

env:
  TARGET_SHA: 50ed3a0e72ec9f0885d0f29268afbfd8f4fbb0b1

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact test-only RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Prove test source quality
        shell: bash
        run: |
          set -euo pipefail
          file=tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator.py
          uv run ruff format --check "$file"
          uv run ruff check "$file"
      - name: Require missing-production-module semantic RED
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_issue586_target_source_validator.py > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -Eq "ModuleNotFoundError|No module named.*issue586_target_source_validator" /tmp/red.log
          ! grep -Eq "SyntaxError|IndentationError" /tmp/red.log
      - name: Reassert clean exact target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
