name: Temporary Issue 600 premium reversal prereg targeted GREEN

on:
  push:
    branches:
      - verify/issue600-premium-prereg-green-80ee
    paths:
      - .github/workflows/tmp-issue600-premium-prereg-green-80ee.yml

permissions:
  contents: read

env:
  TARGET_SHA: 80ee09036e2553c35676b01f529001d1069ad584
  MODULE: trade_rl/evaluation/experiments/bootstrap/premium_pressure_prereg.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_prereg.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN
        run: |
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
      - name: Reassert clean exact target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
