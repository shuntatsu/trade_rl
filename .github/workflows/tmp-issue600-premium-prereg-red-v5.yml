name: Temporary Issue 600 premium reversal semantic RED v5

on:
  push:
    branches:
      - verify/issue600-premium-prereg-red-v5
    paths:
      - .github/workflows/tmp-issue600-premium-prereg-red-v5.yml

permissions:
  contents: read

env:
  TARGET_SHA: c3bb84f46719a6959e0645933c5d4fc14bf2312c
  MODULE: trade_rl/evaluation/experiments/bootstrap/premium_pressure_prereg.py
  TEST: tests/evaluation/experiments/bootstrap/test_premium_pressure_prereg.py

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrected authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact target
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static gates before semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check "$TEST"
          uv run ruff format --check "$TEST"
      - name: Require corrected-contract semantic RED
        shell: bash
        run: |
          set +e
          uv run pytest -q "$TEST" > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -Eq "feature_formula|required_calibration_x_mean_finite|required_negative_symbol_slopes|last_candidate_decision|nominal_candidate_decisions_per_symbol" /tmp/red.log
          ! grep -Eq "SyntaxError|IndentationError|ModuleNotFoundError" /tmp/red.log
          echo "SEMANTIC_RED=PASS"
      - name: Reassert clean exact target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
