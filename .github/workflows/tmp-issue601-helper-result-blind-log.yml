name: Temporary Issue 601 helper result-blind logging

on:
  push:
    branches:
      - automation/issue601-helper-result-blind-log
    paths:
      - .github/workflows/tmp-issue601-helper-result-blind-log.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: preflight/issue601-usdm1h-target-v1
  TARGET_SHA: 87b55cc49d68f336ac6e80a12b0d63017159b90c
  HELPER: tools/tmp_issue601_target_preflight.py
  HELPER_TEST: tests/evaluation/experiments/bootstrap/test_issue601_target_preflight_helper.py
  VALIDATOR_TEST: tests/evaluation/experiments/bootstrap/test_issue601_target_source_validator.py

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Guard exact preflight head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
      - name: Remove pre-audit status interpretation only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp_issue601_target_preflight.py')
          text = path.read_text()
          old = '    print(f"STATUS={report[\'status\']}")\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one status-log line, found {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
          test "$(git diff --name-only)" = "$HELPER"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Reverify helper before network
        run: |
          uv run ruff format "$HELPER"
          uv run ruff check "$HELPER" "$HELPER_TEST" "$VALIDATOR_TEST"
          uv run ruff format --check "$HELPER" "$HELPER_TEST" "$VALIDATOR_TEST"
          uv run mypy "$HELPER"
          uv run pytest -q "$VALIDATOR_TEST" "$HELPER_TEST"
          test "$(git diff --name-only)" = "$HELPER"
      - name: Guard and publish result-blind helper
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HELPER"
          git commit -m "fix: keep Issue 601 publisher result-blind before audit"
          test "$(git diff --name-only HEAD^ HEAD)" = "$HELPER"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
