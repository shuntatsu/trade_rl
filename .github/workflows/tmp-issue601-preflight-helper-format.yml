name: Temporary Issue 601 preflight helper format

on:
  push:
    branches:
      - automation/issue601-preflight-helper-format
    paths:
      - .github/workflows/tmp-issue601-preflight-helper-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: preflight/issue601-usdm1h-target-v1
  TARGET_SHA: 571ec6fe697d47a0218376261b68d1432002a011
  HELPER: tools/tmp_issue601_target_preflight.py

jobs:
  format_only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Guard exact preflight head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Apply Ruff format only
        run: |
          set -euo pipefail
          uv run ruff format "$HELPER"
          uv run ruff check "$HELPER"
          uv run ruff format --check "$HELPER"
          test "$(git diff --name-only)" = "$HELPER"
      - name: Guard and publish formatting only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$HELPER"
          git commit -m "style: format Issue 601 structural preflight helper"
          test "$(git diff --name-only HEAD^ HEAD)" = "$HELPER"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
