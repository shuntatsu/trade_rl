name: Temporary Issue 601 target-source validator targeted GREEN

on:
  push:
    branches:
      - verify/issue601-target-validator-green-f1fa
    paths:
      - .github/workflows/tmp-issue601-target-validator-green-f1fa.yml

permissions:
  contents: read

env:
  TARGET_SHA: f1fa26d120368bd623875aed5dc9d07dc801da16
  MODULE: trade_rl/evaluation/experiments/bootstrap/issue601_target_source_validator.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_issue601_target_source_validator.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN
        run: |
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
      - name: Reassert exact clean target
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
