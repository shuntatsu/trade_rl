name: Temporary Issue 601 target-source validator semantic RED

on:
  push:
    branches:
      - verify/issue601-target-validator-red
    paths:
      - .github/workflows/tmp-issue601-target-validator-red.yml

permissions:
  contents: read

env:
  TARGET_SHA: 7c3b967537aca5ad87144cbbab3fba7628ccc89d
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_issue601_target_source_validator.py

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static gates before semantic RED
        run: |
          uv run ruff check "$TEST_FILE"
          uv run ruff format --check "$TEST_FILE"
      - name: Require missing validator module semantic RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q "$TEST_FILE" > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -F "No module named 'trade_rl.evaluation.experiments.bootstrap.issue601_target_source_validator'" /tmp/red.log
          echo "ISSUE601_SEMANTIC_RED=PASS"
