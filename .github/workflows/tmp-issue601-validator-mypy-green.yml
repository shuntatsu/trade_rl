name: Temporary Issue 601 validator mypy GREEN

on:
  push:
    branches:
      - automation/issue601-validator-mypy-green
    paths:
      - .github/workflows/tmp-issue601-validator-mypy-green.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue601-premium-target-validator
  TARGET_SHA: e020e993fc3bd78fb5ca6bed5d49de14663c4ff6
  MODULE: trade_rl/evaluation/experiments/bootstrap/issue601_target_source_validator.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_issue601_target_source_validator.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Guard exact research head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
      - name: Add explicit fail-closed integer narrowing only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/evaluation/experiments/bootstrap/issue601_target_source_validator.py')
          text = path.read_text()
          old = '''    if any(
        summary["structurally_present_windows"] < _MIN_TARGET_WINDOWS
        for summary in summaries.values()
    ):
        partial = True
'''
          new = '''    for summary in summaries.values():
        present = summary["structurally_present_windows"]
        if isinstance(present, bool) or not isinstance(present, int):
            return "INCOMPATIBLE_USDM_1H_TARGET_SOURCE"
        if present < _MIN_TARGET_WINDOWS:
            partial = True
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one mypy patch anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = "$MODULE"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$MODULE"
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
          test "$(git diff --name-only)" = "$MODULE"
      - name: Guard and publish verified production fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE"
          git commit -m "fix: narrow Issue 601 structural window count type"
          test "$(git diff --name-only HEAD^ HEAD)" = "$MODULE"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
