name: Temporary Issue 603 calibration semantic RED current authority

on:
  push:
    branches:
      - verify/issue603-calibration-red-current-run
    paths:
      - .github/workflows/tmp-issue603-calibration-red-current.yml

permissions:
  contents: read

env:
  TARGET_SHA: 869001511f652c587ae0d3df55732b83f24f1cab
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py

jobs:
  semantic_red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Assert exact test-only target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test ! -e trade_rl/evaluation/experiments/bootstrap/premium_pressure_calibration.py
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static gates before semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check "$TEST_FILE"
          uv run ruff format --check "$TEST_FILE"
      - name: Require RED only because production module is absent
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q "$TEST_FILE" > /tmp/pytest.out 2>&1
          rc=$?
          set -e
          cat /tmp/pytest.out
          test "$rc" -ne 0
          grep -F 'ModuleNotFoundError' /tmp/pytest.out
          grep -F 'premium_pressure_calibration' /tmp/pytest.out
          if grep -E 'SyntaxError|IndentationError|ruff|format' /tmp/pytest.out; then
            exit 1
          fi
          echo 'ISSUE603_SEMANTIC_RED=PASS'
