name: Temporary Issue 603 current-authority implementation GREEN

on:
  push:
    branches:
      - automation/issue603-current-green-v2
    paths:
      - .github/workflows/tmp-issue603-current-green-v2.yml
      - .github/scripts/tmp_issue603_build_green.py

permissions:
  contents: write

env:
  RED_SHA: 5ba0c595a424621f4f960f16123836467b5506a5
  OLD_IMPL_SHA: 18313468e12e7b60b10e42849690fc7396160839
  TARGET_BRANCH: research/issue603-premium-pressure-calibration-v2
  MODULE: trade_rl/evaluation/experiments/bootstrap/premium_pressure_calibration.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py
  PATCH_SCRIPT: .github/scripts/tmp_issue603_build_green.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recover transformer and start from exact corrected RED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$PATCH_SCRIPT" /tmp/issue603_build_green.py
          git checkout --detach "$RED_SHA"
          test "$(git rev-parse HEAD)" = "$RED_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$RED_SHA"
          test ! -e "$MODULE"
          git fetch origin "$OLD_IMPL_SHA" --no-tags
          git checkout "$OLD_IMPL_SHA" -- "$MODULE"
          python3 /tmp/issue603_build_green.py
          changed="$(git diff HEAD --name-only)"
          test "$changed" = "$MODULE"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN and static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$MODULE" "$TEST_FILE"
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' "$MODULE" | sort)"
          test "$changed" = "$expected"
      - name: Publish current implementation only after GREEN
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$RED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE"
          git commit -m "feat: implement current sealed premium-pressure calibration"
          test "$(git diff --name-only HEAD^ HEAD)" = "$MODULE"
          git push origin HEAD:"$TARGET_BRANCH"
