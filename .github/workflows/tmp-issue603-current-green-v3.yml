name: Temporary Issue 603 current-authority implementation GREEN v3

on:
  push:
    branches:
      - automation/issue603-current-green-v3
    paths:
      - .github/workflows/tmp-issue603-current-green-v3.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue603-premium-pressure-calibration-v2
  TARGET_SHA: 5ba0c595a424621f4f960f16123836467b5506a5
  OLD_IMPL_SHA: 18313468e12e7b60b10e42849690fc7396160839
  MODULE: trade_rl/evaluation/experiments/bootstrap/premium_pressure_calibration.py
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py
  BUILDER: .github/scripts/tmp_issue603_build_green.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recover builder and exact RED target
        shell: bash
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:$BUILDER" > /tmp/build_green.py
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          test ! -e "$MODULE"
          git fetch origin "$OLD_IMPL_SHA" --no-tags
          git checkout "$OLD_IMPL_SHA" -- "$MODULE"
          python3 /tmp/build_green.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py')
          text = path.read_text()
          old_x = '    x_values = [1e16, 1.0, -1e16] + [0.0] * (n - 3)\n'
          new_x = (
              '    x_values = [\n'
              '        0.05843888312600577,\n'
              '        -7.274351982346268e-59,\n'
              '        0.07076126508662547,\n'
              '    ] + [0.0] * (n - 3)\n'
          )
          old_y = '            y=-x * 1e-16 + 3.0,\n'
          new_y = '            y=-2.0 * x + 3.0,\n'
          if text.count(old_x) != 1 or text.count(old_y) != 1:
              raise SystemExit('expected fsum fixture anchors not found exactly once')
          path.write_text(text.replace(old_x, new_x, 1).replace(old_y, new_y, 1))
          PY
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Targeted GREEN and static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$MODULE" "$TEST_FILE"
          uv run ruff check "$MODULE" "$TEST_FILE"
          uv run ruff format --check "$MODULE" "$TEST_FILE"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST_FILE"
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' "$MODULE" "$TEST_FILE" | sort)"
          test "$changed" = "$expected"
      - name: Guard and publish verified implementation and oracle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE" "$TEST_FILE"
          git commit -m "feat: implement sealed premium-pressure calibration"
          git push origin HEAD:"$TARGET_BRANCH"
