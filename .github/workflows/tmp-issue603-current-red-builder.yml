name: Temporary Issue 603 current-authority RED builder

on:
  push:
    branches:
      - automation/issue603-current-red-builder
    paths:
      - .github/workflows/tmp-issue603-current-red-builder.yml
      - .github/scripts/tmp_issue603_build_red.py

permissions:
  contents: write

env:
  BASE_SHA: c707be853480e57362f6a3d64f116e4056c3553f
  OLD_TEST_SHA: 0338e2fd4c5b8746db41cace915e1f87855dc9c5
  TARGET_BRANCH: verify/issue603-calibration-red-current
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py
  BUILD_SCRIPT: .github/scripts/tmp_issue603_build_red.py

jobs:
  build_red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recover builder then reset to exact current authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$BUILD_SCRIPT" /tmp/issue603_build_red.py
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          test ! -e trade_rl/evaluation/experiments/bootstrap/premium_pressure_calibration.py
          git fetch origin "$OLD_TEST_SHA" --no-tags
          git checkout "$OLD_TEST_SHA" -- "$TEST_FILE"
          test "$(git diff HEAD --name-only)" = "$TEST_FILE"
          python3 /tmp/issue603_build_red.py
          test "$(git diff HEAD --name-only)" = "$TEST_FILE"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format and statically validate test-only oracle
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$TEST_FILE"
          uv run ruff check "$TEST_FILE"
          uv run ruff format --check "$TEST_FILE"
          test "$(git diff HEAD --name-only)" = "$TEST_FILE"
          test ! -e trade_rl/evaluation/experiments/bootstrap/premium_pressure_calibration.py
      - name: Publish exactly one test file to current RED branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_FILE"
          git commit -m "test: freeze current Issue 603 calibration contract"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TEST_FILE"
          git push origin HEAD:"$TARGET_BRANCH"
