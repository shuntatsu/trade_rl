name: Temporary Issue 603 real helper verification

on:
  push:
    branches:
      - automation/issue603-real-helper-verify
    paths:
      - .github/workflows/tmp-issue603-real-helper-verify.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: prepare/issue603-premium-pressure-calibration
  TARGET_SHA: 33c260897ea418c938a3682bf22ed19e16207fa1
  HELPER: tools/tmp_issue603_premium_pressure_real.py

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout exact helper target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format static and synthetic verification without source network
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$HELPER"
          uv run ruff check --fix "$HELPER"
          uv run ruff check "$HELPER"
          uv run ruff format --check "$HELPER"
          uv run mypy "$HELPER"
          uv run python "$HELPER" --self-test
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py
          changed="$(git diff HEAD --name-only)"
          test -z "$changed" || test "$changed" = "$HELPER"
      - name: Guard and publish helper-only formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          if test -n "$(git diff HEAD --name-only)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HELPER"
            git commit -m "style: verify Issue 603 real helper"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
