name: Temporary Issue 603 RED clock oracle fix

on:
  push:
    branches:
      - automation/issue603-red-clock-fix
    paths:
      - .github/workflows/tmp-issue603-red-clock-fix.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: verify/issue603-calibration-red-current
  TARGET_SHA: 869001511f652c587ae0d3df55732b83f24f1cab
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py

jobs:
  fix_oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
      - name: Correct raw-open cutoff oracle only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/evaluation/experiments/bootstrap/test_premium_pressure_calibration.py')
          text = path.read_text()
          old = '    assert target[-1].dataset_time_ms == _ms(protocol.fit_cutoff)\n'
          new = '    assert target[-1].raw_open_time_ms == _ms(protocol.fit_cutoff)\n'
          if text.count(old) != 1:
              raise SystemExit('expected cutoff oracle anchor not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = "$TEST_FILE"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Static test-only verification
        run: |
          uv run ruff check "$TEST_FILE"
          uv run ruff format --check "$TEST_FILE"
      - name: Publish corrected RED oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEST_FILE"
          git commit -m "test: correct Issue 603 raw-open cutoff oracle"
          test "$(git diff --name-only HEAD^ HEAD)" = "$TEST_FILE"
          git push origin HEAD:"$TARGET_BRANCH"
