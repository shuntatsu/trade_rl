name: Temporary Issue 603 remaining full checks v2

on:
  push:
    branches:
      - verify/issue603-exact-d153ff7
    paths:
      - .github/workflows/tmp-issue603-remaining-full-v2.yml

permissions:
  contents: read

env:
  FINAL_SHA: d153ff7ee27a7628d1bdeeef6990f8496b7ed51f
  BASE_SHA: c707be853480e57362f6a3d64f116e4056c3553f
  RESEARCH_BRANCH: research/issue603-premium-pressure-calibration-v2

jobs:
  baseline_format_equivalence:
    name: Prove global format debt is pre-existing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Compare exact global format failure output on base and final
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)" = "$FINAL_SHA"
          git checkout --detach "$BASE_SHA"
          set +e
          uv run ruff format --check . >/tmp/base-format.out 2>&1
          base_code=$?
          set -e
          test "$base_code" -ne 0
          git checkout --detach "$FINAL_SHA"
          set +e
          uv run ruff format --check . >/tmp/final-format.out 2>&1
          final_code=$?
          set -e
          test "$final_code" -ne 0
          diff -u /tmp/base-format.out /tmp/final-format.out
          grep -F "Would reformat: guide/tools/bundle_budget.py" /tmp/final-format.out
          grep -F "Would reformat: guide/tools/code_symbols.py" /tmp/final-format.out
          grep -F "Would reformat: guide/tools/content_contract.py" /tmp/final-format.out
          ! grep -F "premium_pressure_calibration.py" /tmp/final-format.out
          echo "ISSUE603_GLOBAL_FORMAT_FAILURE_PREEXISTING=true"

  full_type:
    name: Exact-head full mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)" = "$FINAL_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run mypy trade_rl

  full_tests:
    name: Exact-head full pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git ls-remote origin refs/heads/$RESEARCH_BRANCH | cut -f1)" = "$FINAL_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q
