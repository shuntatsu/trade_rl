name: Temporary Issue 609 authority formatter

on:
  push:
    branches:
      - automation/issue609-authority-format
    paths:
      - .github/workflows/tmp-issue609-authority-format.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue609-ppo-global-btc-regime-eval-prereg
  TARGET_SHA: 1d8738af446c297cf88b182373f7de51deddaac2
  FILE: trade_rl/evaluation/experiments/ppo_global_btc_regime_evaluation_prereg.py

jobs:
  format_publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: true
          fetch-depth: 0
      - name: Guard target head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Format exact authority file
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format "$FILE"
          uv run ruff check "$FILE"
          changed="$(git diff --name-only)"
          test "$changed" = "$FILE"
      - name: Publish formatting-only change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$TARGET_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "style: format Issue 609 evaluation authority"
          git push origin HEAD:"$TARGET_BRANCH"
