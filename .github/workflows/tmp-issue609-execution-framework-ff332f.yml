name: Temporary Issue 609 execution-framework exact-head verification

on:
  push:
    branches: [verify/issue609-execution-framework-ff332f]
    paths: [.github/workflows/tmp-issue609-execution-framework-ff332f.yml]

permissions:
  actions: read
  contents: read

env:
  FINAL_SHA: ff332f0cc2dec46828aa1031d438f2f2f1705ba8
  BASE_SHA: 02fd08798b3f23cc3db13d96ac27778e93592019
  HARDENING_BRANCH: hardening/issue609-feature-set-workflow
  ISSUE609_SEAL_RUN: "35088018055"
  ISSUE609_SEAL_ID: "10443216354"
  ISSUE609_SEAL_NAME: issue609-evaluation-prereg-seal-v1-35088018055
  ISSUE609_SEAL_DIGEST: sha256:09c9033139b841b3e769ff1fb43fa291092f47fea5718c7ae396aebd71444986
  ISSUE609_FRESH_ID: "10443355963"
  ISSUE609_FRESH_NAME: issue609-evaluation-prereg-fresh-v1-35088018055
  ISSUE609_FRESH_DIGEST: sha256:6040f352bebb5c0da94a0c25f0a8e41665788826c980f512588089758d8ab44c

jobs:
  core:
    name: Exact Issue 609 execution-framework Lean Core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact lineage, diff, and sealed evaluation authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test "$(git ls-remote origin refs/heads/$HARDENING_BRANCH | cut -f1)" = "$FINAL_SHA"
          test "$(git merge-base "$BASE_SHA" "$FINAL_SHA")" = "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA..$FINAL_SHA" | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n%s\n' \
            docs/architecture/controlled-experiment-loop.md \
            tests/evaluation/experiments/test_issue609_feature_set_workflow.py \
            tests/evaluation/test_candidate_run_global_context_artifact.py \
            trade_rl/evaluation/experiments/workflow.py \
            trade_rl/evaluation/runs/artifact.py | sort)"
          test "$changed" = "$expected"
          run="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$ISSUE609_SEAL_RUN)"
          test "$(jq -r .conclusion <<<"$run")" = success
          for spec in \
            "$ISSUE609_SEAL_ID|$ISSUE609_SEAL_NAME|$ISSUE609_SEAL_DIGEST" \
            "$ISSUE609_FRESH_ID|$ISSUE609_FRESH_NAME|$ISSUE609_FRESH_DIGEST"; do
            IFS='|' read -r id name digest <<<"$spec"
            artifact="$(gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id)"
            test "$(jq -r .name <<<"$artifact")" = "$name"
            test "$(jq -r .workflow_run.id <<<"$artifact")" = "$ISSUE609_SEAL_RUN"
            test "$(jq -r .expired <<<"$artifact")" = false
            test "$(jq -r .digest <<<"$artifact")" = "$digest"
          done
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Exact repository quality gates
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
          uv run pytest -q tests
      - name: Build and distribution closure
        shell: bash
        run: |
          set -euo pipefail
          uv build
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed execution-framework smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.evaluation.experiments.workflow
          import trade_rl.evaluation.runs.artifact
          from trade_rl.strategies.rl.ppo import (
              PPO_GLOBAL_BTC_REGIME_CONTEXT,
              ppo_observation_contract_payload,
          )
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          payload = ppo_observation_contract_payload(
              global_context=PPO_GLOBAL_BTC_REGIME_CONTEXT,
          )
          assert payload["schema_version"] == "ppo_observation_v3_global_btc_regime"
          print("ISSUE609_EXECUTION_FRAMEWORK_CLEAN_INSTALL=PASS")
          PY
      - name: Result-blind boundaries and clean exact target
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E 'economic_execution_authorized *= *True|economic_result_inspected *= *True|final_test_access_authorized *= *True|production_eligible *= *True|live_trading_authorized *= *True|merge_authorized *= *True' "$FINAL_SHA" -- trade_rl/evaluation/experiments/ppo_global_btc_regime_evaluation_prereg.py
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo ISSUE609_EXECUTION_FRAMEWORK_CORE=PASS

  guide:
    name: Exact Issue 609 execution-framework Human Guide
    runs-on: ubuntu-24.04
    env:
      GUIDE_SOURCE_REV: ff332f0cc2dec46828aa1031d438f2f2f1705ba8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FINAL_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$FINAL_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - working-directory: guide
        run: npm ci
      - working-directory: guide
        run: npm run source-check
      - working-directory: guide
        run: npm run lint
      - working-directory: guide
        run: npm run typecheck
      - working-directory: guide
        run: npm run test
      - working-directory: guide
        run: npm run build
      - working-directory: guide
        run: npx playwright install --with-deps chromium
      - working-directory: guide
        run: npm run e2e
      - run: |
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo ISSUE609_EXECUTION_FRAMEWORK_GUIDE=PASS
