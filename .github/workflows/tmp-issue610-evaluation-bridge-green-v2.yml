name: tmp Issue 610 evaluation bridge GREEN v2

on:
  push:
    branches:
      - verify/issue610-evaluation-bridge-green-v2

permissions:
  contents: read

env:
  TARGET_HEAD: c22db85cfe2d5cf3f8de528bbe8399845ea309fd
  HELPER: tools/tmp_issue610_ppo_global_btc_regime_evaluation.py
  TEST: tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py

jobs:
  ruff-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check "$HELPER" "$TEST"

  ruff-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check "$HELPER" "$TEST"

  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run mypy "$HELPER"

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q "$TEST"
