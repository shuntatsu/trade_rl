name: tmp Issue 610 evaluation bridge GREEN v3
on:
  push:
    branches:
      - verify/issue610-evaluation-bridge-green-v3
permissions:
  contents: read
env:
  TARGET_HEAD: 35f393b3ad3f3c2332dba15bcebcfcc310573f4e
  HELPER: tools/tmp_issue610_ppo_global_btc_regime_evaluation.py
  TEST: tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check "$HELPER" "$TEST"
      - run: uv run ruff format --check "$HELPER" "$TEST"
      - run: uv run mypy "$HELPER"
  semantic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q "$TEST"
