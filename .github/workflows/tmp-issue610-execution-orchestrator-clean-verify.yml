name: tmp Issue 610 execution orchestrator clean verification

on:
  push:
    branches:
      - verify/issue610-execution-orchestrator-clean
    paths:
      - .github/workflows/tmp-issue610-execution-orchestrator-clean-verify.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: cc383340a2106b9083c1dcd2fc73f182d177b05e
  BASE_SHA: 358b4917e988561f9a5601ef25a6d53291e07585
  IMPLEMENTATION_SHA: 1ae494ce182189c5be61e8007dc956f912d8b9d5
  IMPLEMENTATION_TREE: 4f14c5a06505b8ff9811b473bf6dea296453a13b
  FRAMEWORK_SHA: ff332f0cc2dec46828aa1031d438f2f2f1705ba8
  FRAMEWORK_ARTIFACT_BLOB: 8f95053b62239d674c18ed8564ffe4fc2c1ceaf6
  ORCHESTRATOR: tools/tmp_issue610_exact_once_orchestrator.py
  ORCHESTRATOR_TEST: tests/tools/test_tmp_issue610_exact_once_orchestrator.py
  TERMINATION: tools/tmp_issue610_ppo_global_btc_regime_termination.py
  TERMINATION_TEST: tests/tools/test_tmp_issue610_ppo_global_btc_regime_termination.py

jobs:
  synthetic:
    name: Exact synthetic execution-control verification
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: code
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FRAMEWORK_SHA }}
          path: framework
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact authorities and clean diff scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test "$(git -C code rev-parse HEAD^{tree})" = "$IMPLEMENTATION_TREE"
          test "$(git -C framework rev-parse HEAD)" = "$FRAMEWORK_SHA"
          test "$(git -C framework rev-parse HEAD:trade_rl/evaluation/runs/artifact.py)" = "$FRAMEWORK_ARTIFACT_BLOB"
          test "$(git -C control rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C control rev-parse "$BASE_SHA:trade_rl")" = "$(git -C control rev-parse "$TARGET_SHA:trade_rl")"
          changed="$(git -C control diff --name-only "$BASE_SHA..$TARGET_SHA" | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n' \
            "$ORCHESTRATOR" "$ORCHESTRATOR_TEST" "$TERMINATION" "$TERMINATION_TEST" | sort)"
          test "$changed" = "$expected"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - working-directory: code
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Static checks on external execution-control code
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/control
          MYPYPATH: ${{ github.workspace }}/control
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR" \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR_TEST" \
            "$GITHUB_WORKSPACE/control/$TERMINATION" \
            "$GITHUB_WORKSPACE/control/$TERMINATION_TEST"
          uv run ruff format --check \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR" \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR_TEST" \
            "$GITHUB_WORKSPACE/control/$TERMINATION" \
            "$GITHUB_WORKSPACE/control/$TERMINATION_TEST"
          uv run mypy \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR" \
            "$GITHUB_WORKSPACE/control/$TERMINATION"
      - name: Pure fail-closed semantic regression
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            "$GITHUB_WORKSPACE/control/$ORCHESTRATOR_TEST" \
            "$GITHUB_WORKSPACE/control/$TERMINATION_TEST" \
            "$GITHUB_WORKSPACE/control/tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py" \
            "$GITHUB_WORKSPACE/control/tests/tools/test_tmp_issue610_execution_safety.py"
          uv run python "$GITHUB_WORKSPACE/control/$ORCHESTRATOR" self-check
      - name: Cross-version artifact bridge round-trip and tamper rejection
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/control
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/issue610-bridge-check
          uv run python "$GITHUB_WORKSPACE/control/$ORCHESTRATOR" \
            bridge-check \
            --artifact-module "$GITHUB_WORKSPACE/framework/trade_rl/evaluation/runs/artifact.py" \
            --output-root /tmp/issue610-bridge-check
      - name: Reconfirm no Issue 610 economic artifact exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
          echo CANDIDATE_TRAINING_PERFORMED=false
          echo ECONOMIC_VALUES_INTERPRETED=false
          echo FINAL_TEST_ACCESSED=false

  regression:
    name: Clean-head full repository regression
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Full type and test regression
        shell: bash
        run: |
          set -euo pipefail
          uv run mypy trade_rl
          uv run pytest -q
