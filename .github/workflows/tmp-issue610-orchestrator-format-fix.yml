name: tmp Issue 610 orchestrator format fix

on:
  push:
    branches:
      - verify/issue610-execution-orchestrator-v1
    paths:
      - .github/workflows/tmp-issue610-orchestrator-format-fix.yml

permissions:
  contents: write

env:
  EXPECTED_PARENT: 3f39f9f0582dba1bdc377a5b368e4213ddc1a24b
  TARGET: tools/tmp_issue610_exact_once_orchestrator.py

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verify/issue610-execution-orchestrator-v1
          fetch-depth: 0
      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only "$EXPECTED_PARENT..HEAD")" = ".github/workflows/tmp-issue610-orchestrator-format-fix.yml"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Apply mechanical Ruff fixes only
        shell: bash
        run: |
          set -euo pipefail
          uvx --from ruff==0.15.21 ruff check --fix "$TARGET"
          uvx --from ruff==0.15.21 ruff format "$TARGET"
          uvx --from ruff==0.15.21 ruff check "$TARGET"
          uvx --from ruff==0.15.21 ruff format --check "$TARGET"
          changed="$(git diff --name-only)"
          test "$changed" = "$TARGET"
      - name: Commit branch-only mechanical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'style: format Issue 610 exactly-once orchestrator'
          git push origin HEAD:verify/issue610-execution-orchestrator-v1
