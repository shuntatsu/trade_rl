name: tmp Issue 610 precompute authority v4

on:
  push:
    branches:
      - verify/issue610-precompute-authority-v4
    paths:
      - .github/workflows/tmp-issue610-precompute-authority-v4.yml
      - tools/tmp_issue610_precompute_authority_v4.py

permissions:
  actions: read
  contents: read

env:
  IMPLEMENTATION_SHA: 1ae494ce182189c5be61e8007dc956f912d8b9d5
  IMPLEMENTATION_TREE: 4f14c5a06505b8ff9811b473bf6dea296453a13b
  IMPL_INDEX_DIGEST: d5390a0025a92e4e2a1e987b7b7ac8ee6ef3974c5c8247b0256ae70c0d2d6e10
  HELPER_SHA: 358b4917e988561f9a5601ef25a6d53291e07585
  HELPER_BRANCH: prepare/issue610-ppo-global-btc-regime-evaluation
  HELPER_BASE_SHA: 02fd08798b3f23cc3db13d96ac27778e93592019
  HELPER_VERIFY_RUN: '35095863761'
  HELPER_VERIFY_CARRIER_SHA: da5ddb05aaeb2ae2ce111f11e48a639c2f7bb46b
  BASELINE_RUN: '34700123151'
  BASELINE_PUBLISH_JOB: publish
  BASELINE_NAME: canonical-m2-portable-baseline-v1-34700123151
  BASELINE_ID: '10301701698'
  BASELINE_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a
  BASELINE_FRESH_RUN: '34704606059'
  BASELINE_FRESH_NAME: canonical-m2-portable-baseline-postverify-v1-34704606059
  BASELINE_FRESH_ID: '10300932825'
  BASELINE_FRESH_DIGEST: sha256:77c26e8cdeecdc023a750582ec5aebe3870ca84728e580c9e27d1b2e420368a9
  DATASET_ID: d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f
  DATASET_ARTIFACT_DIGEST: 77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8
  STUDY_DIGEST: 3d8404061a4082a8e9b3c786d9f5fc9a4347631dff39c201e3cba70470dfeb79
  BASELINE_FP: 526b485d60b394739b7a8d03535e1cfa08b26fa920119c70ee53f05faa53dd29
  IMPL_RUN: '35084553267'
  IMPL_SEAL_ID: '10441133239'
  IMPL_SEAL_NAME: issue607-implementation-seal-v1-35084553267
  IMPL_SEAL_DIGEST: sha256:8f8a3319f9213bf999b3ce2d911882fd9276daf575a7cde99ec33de9e8208b37
  IMPL_FRESH_ID: '10441194709'
  IMPL_FRESH_NAME: issue607-implementation-fresh-v1-35084553267
  IMPL_FRESH_DIGEST: sha256:39f578321699d3deba1c1cc67ee9d5401c7a45573088d63b2c346f09721c7f52
  EVAL_RUN: '35088018055'
  EVAL_PREREG_HEAD: 02fd08798b3f23cc3db13d96ac27778e93592019
  EVAL_SEAL_ID: '10443216354'
  EVAL_SEAL_NAME: issue609-evaluation-prereg-seal-v1-35088018055
  EVAL_SEAL_DIGEST: sha256:09c9033139b841b3e769ff1fb43fa291092f47fea5718c7ae396aebd71444986
  EVAL_FRESH_ID: '10443355963'
  EVAL_FRESH_NAME: issue609-evaluation-prereg-fresh-v1-35088018055
  EVAL_FRESH_DIGEST: sha256:6040f352bebb5c0da94a0c25f0a8e41665788826c980f512588089758d8ab44c
  EVAL_PROTOCOL_DIGEST: e52a19b859500ea01e900a1ea7209bd545c03acd08435d1ff615b7539ec75d2b
  EVAL_PROTOCOL_SHA256: e52a19b859500ea01e900a1ea7209bd545c03acd08435d1ff615b7539ec75d2b
  PRECOMPUTE_SCRIPT: tools/tmp_issue610_precompute_authority_v4.py

jobs:
  producer:
    name: Produce result-blind precompute authority
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact Issue 607 economic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: code
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact verified Issue 610 bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HELPER_SHA }}
          path: helper
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact precompute verifier control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact code, bridge scope, and verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test "$(git -C code rev-parse HEAD^{tree})" = "$IMPLEMENTATION_TREE"
          test "$(git -C helper rev-parse HEAD)" = "$HELPER_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C helper rev-parse "$HELPER_SHA:trade_rl")" = "$(git -C helper rev-parse "$HELPER_BASE_SHA:trade_rl")"
          changed="$(git -C helper diff --name-only "$HELPER_BASE_SHA..$HELPER_SHA" | sort)"
          expected="$(printf '%s\n%s\n%s\n' \
            tests/tools/test_tmp_issue610_execution_safety.py \
            tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py \
            tools/tmp_issue610_ppo_global_btc_regime_evaluation.py | sort)"
          test "$changed" = "$expected"
          test "$(git -C helper ls-remote origin "refs/heads/$HELPER_BRANCH" | cut -f1)" = "$HELPER_SHA"
          git -C code fetch origin "$EVAL_PREREG_HEAD" --no-tags
          test "$(git -C code rev-parse "$EVAL_PREREG_HEAD")" = "$EVAL_PREREG_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Install exact research environment
        run: cd code && uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Static-check precompute verifier
        shell: bash
        run: |
          set -euo pipefail
          cd code
          SCRIPT="$GITHUB_WORKSPACE/control/$PRECOMPUTE_SCRIPT"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run ruff check "$SCRIPT"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run ruff format --check "$SCRIPT"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run mypy "$SCRIPT"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -m py_compile "$SCRIPT"
      - name: API-bind authorities and prove no prior Issue 610 economics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          baseline_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN")"
          test "$(jq -r .status <<<"$baseline_run")" = completed
          baseline_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN/jobs?per_page=100")"
          test "$(jq -r --arg job "$BASELINE_PUBLISH_JOB" '.jobs[] | select(.name==$job) | .conclusion' <<<"$baseline_jobs")" = success

          for run in "$BASELINE_FRESH_RUN" "$IMPL_RUN" "$EVAL_RUN" "$HELPER_VERIFY_RUN"; do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            test "$(jq -r .status <<<"$payload")" = completed
            test "$(jq -r .conclusion <<<"$payload")" = success
          done

          verify_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELPER_VERIFY_RUN")"
          test "$(jq -r .head_sha <<<"$verify_run")" = "$HELPER_VERIFY_CARRIER_SHA"
          verify_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HELPER_VERIFY_RUN/jobs?per_page=100")"
          for job in 'Exact helper semantics' 'Exact-head full mypy' 'Exact-head full pytest' 'Prove global style debt unchanged'; do
            test "$(jq -r --arg job "$job" '.jobs[] | select(.name==$job) | .conclusion' <<<"$verify_jobs")" = success
          done
          verify_source="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/tmp-issue610-combined-full.yml?ref=$HELPER_VERIFY_CARRIER_SHA" --jq .content | base64 --decode)"
          grep -F "TARGET_HEAD: $HELPER_SHA" <<<"$verify_source" >/dev/null

          check_artifact() {
            local id="$1" name="$2" digest="$3" run_id="$4"
            local payload
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$payload")" = "$name"
            test "$(jq -r .digest <<<"$payload")" = "$digest"
            test "$(jq -r .workflow_run.id <<<"$payload")" = "$run_id"
            test "$(jq -r .expired <<<"$payload")" = false
          }
          check_artifact "$BASELINE_ID" "$BASELINE_NAME" "$BASELINE_DIGEST" "$BASELINE_RUN"
          check_artifact "$BASELINE_FRESH_ID" "$BASELINE_FRESH_NAME" "$BASELINE_FRESH_DIGEST" "$BASELINE_FRESH_RUN"
          check_artifact "$IMPL_SEAL_ID" "$IMPL_SEAL_NAME" "$IMPL_SEAL_DIGEST" "$IMPL_RUN"
          check_artifact "$IMPL_FRESH_ID" "$IMPL_FRESH_NAME" "$IMPL_FRESH_DIGEST" "$IMPL_RUN"
          check_artifact "$EVAL_SEAL_ID" "$EVAL_SEAL_NAME" "$EVAL_SEAL_DIGEST" "$EVAL_RUN"
          check_artifact "$EVAL_FRESH_ID" "$EVAL_FRESH_NAME" "$EVAL_FRESH_DIGEST" "$EVAL_RUN"

          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
          echo ISSUE610_PRIOR_ECONOMIC_ARTIFACTS=0
      - name: Download frozen baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_NAME }}
          path: /tmp/baseline
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_RUN }}
      - name: Download independent baseline binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_FRESH_NAME }}
          path: /tmp/baseline-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_FRESH_RUN }}
      - name: Download Issue 607 seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_SEAL_NAME }}
          path: /tmp/impl-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - name: Download Issue 607 fresh reconstruction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_FRESH_NAME }}
          path: /tmp/impl-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - name: Download Issue 609 seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_SEAL_NAME }}
          path: /tmp/eval-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - name: Download Issue 609 fresh reconstruction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_FRESH_NAME }}
          path: /tmp/eval-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - name: Reconstruct content-addressed precompute authority
        shell: bash
        run: |
          set -euo pipefail
          cd code
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -P "$GITHUB_WORKSPACE/control/$PRECOMPUTE_SCRIPT" \
            --repo-root "$GITHUB_WORKSPACE/code" \
            --baseline-root /tmp/baseline \
            --baseline-fresh-root /tmp/baseline-fresh \
            --impl-seal-root /tmp/impl-seal \
            --impl-fresh-root /tmp/impl-fresh \
            --eval-seal-root /tmp/eval-seal \
            --eval-fresh-root /tmp/eval-fresh \
            --output-root /tmp/precompute
          test "$(find /tmp/precompute -maxdepth 1 -type f | wc -l)" -eq 4
      - id: meta
        run: echo "artifact_name=issue610-precompute-authority-v2-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Upload result-blind precompute authority
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/precompute
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  fresh:
    name: Fresh reconstruction of precompute authority
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact Issue 607 economic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: code
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact verified Issue 610 bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HELPER_SHA }}
          path: helper
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact precompute verifier control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact checkouts and fetch Issue 609 authority commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test "$(git -C code rev-parse HEAD^{tree})" = "$IMPLEMENTATION_TREE"
          test "$(git -C helper rev-parse HEAD)" = "$HELPER_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          git -C code fetch origin "$EVAL_PREREG_HEAD" --no-tags
          test "$(git -C code rev-parse "$EVAL_PREREG_HEAD")" = "$EVAL_PREREG_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Install exact research environment
        run: cd code && uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: API-bind producer artifact and recheck immutable chronology
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_ID: ${{ needs.producer.outputs.artifact_id }}
          PRODUCER_NAME: ${{ needs.producer.outputs.artifact_name }}
          PRODUCER_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ID")"
          test "$(jq -r .name <<<"$producer")" = "$PRODUCER_NAME"
          test "$(jq -r .digest <<<"$producer")" = "$PRODUCER_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$producer")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$producer")" = false

          baseline_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN")"
          test "$(jq -r .status <<<"$baseline_run")" = completed
          baseline_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN/jobs?per_page=100")"
          test "$(jq -r --arg job "$BASELINE_PUBLISH_JOB" '.jobs[] | select(.name==$job) | .conclusion' <<<"$baseline_jobs")" = success
          for run in "$BASELINE_FRESH_RUN" "$IMPL_RUN" "$EVAL_RUN" "$HELPER_VERIFY_RUN"; do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")"
            test "$(jq -r .conclusion <<<"$payload")" = success
          done

          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
      - name: Download frozen baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_NAME }}
          path: /tmp/baseline
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_RUN }}
      - name: Download independent baseline binding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_FRESH_NAME }}
          path: /tmp/baseline-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_FRESH_RUN }}
      - name: Download Issue 607 seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_SEAL_NAME }}
          path: /tmp/impl-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - name: Download Issue 607 fresh reconstruction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_FRESH_NAME }}
          path: /tmp/impl-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - name: Download Issue 609 seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_SEAL_NAME }}
          path: /tmp/eval-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - name: Download Issue 609 fresh reconstruction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_FRESH_NAME }}
          path: /tmp/eval-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - name: Download producer precompute authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.artifact_name }}
          path: /tmp/producer
      - name: Independently reconstruct and require byte equality
        shell: bash
        run: |
          set -euo pipefail
          cd code
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -P "$GITHUB_WORKSPACE/control/$PRECOMPUTE_SCRIPT" \
            --repo-root "$GITHUB_WORKSPACE/code" \
            --baseline-root /tmp/baseline \
            --baseline-fresh-root /tmp/baseline-fresh \
            --impl-seal-root /tmp/impl-seal \
            --impl-fresh-root /tmp/impl-fresh \
            --eval-seal-root /tmp/eval-seal \
            --eval-fresh-root /tmp/eval-fresh \
            --output-root /tmp/fresh
          for name in authority.json baseline-resolved.json candidate-resolved.json candidate-carrier-study.json; do
            cmp "/tmp/producer/$name" "/tmp/fresh/$name"
          done
      - id: meta
        run: echo "artifact_name=issue610-precompute-authority-fresh-v2-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Upload fresh precompute reconstruction
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/fresh
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  audit:
    name: Final result-blind precompute audit
    needs: [producer, fresh]
    runs-on: ubuntu-24.04
    steps:
      - name: API-bind both precompute artifacts and require no concurrent economics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_ID: ${{ needs.producer.outputs.artifact_id }}
          PRODUCER_NAME: ${{ needs.producer.outputs.artifact_name }}
          PRODUCER_DIGEST: ${{ needs.producer.outputs.artifact_digest }}
          FRESH_ID: ${{ needs.fresh.outputs.artifact_id }}
          FRESH_NAME: ${{ needs.fresh.outputs.artifact_name }}
          FRESH_DIGEST: ${{ needs.fresh.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for spec in "$PRODUCER_ID|$PRODUCER_NAME|$PRODUCER_DIGEST" "$FRESH_ID|$FRESH_NAME|$FRESH_DIGEST"; do
            IFS='|' read -r id name digest <<<"$spec"
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$payload")" = "$name"
            test "$(jq -r .digest <<<"$payload")" = "$digest"
            test "$(jq -r .workflow_run.id <<<"$payload")" = "$GITHUB_RUN_ID"
            test "$(jq -r .expired <<<"$payload")" = false
          done
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
      - name: Download producer authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.artifact_name }}
          path: /tmp/producer
      - name: Download fresh authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.fresh.outputs.artifact_name }}
          path: /tmp/fresh
      - name: Require byte equality and closed economic boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in authority.json baseline-resolved.json candidate-resolved.json candidate-carrier-study.json; do
            cmp "/tmp/producer/$name" "/tmp/fresh/$name"
          done
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          raw = Path('/tmp/producer/authority.json').read_bytes()
          payload = json.loads(raw)
          assert isinstance(payload, dict)
          digest = payload.pop('content_digest')
          canonical = json.dumps(payload, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == digest
          assert payload['prior_issue610_economic_artifacts'] == 0
          assert payload['baseline_retrained'] is False
          assert payload['candidate_trained'] is False
          assert payload['economic_values_interpreted'] is False
          assert payload['final_test_accessed'] is False
          assert payload['production_eligible'] is False
          assert payload['live_trading_authorized'] is False
          assert payload['merge_authorized'] is False
