name: tmp Issue 610 precompute strong postverify v2

on:
  push:
    branches:
      - verify/issue610-precompute-strong-postverify-v2
    paths:
      - .github/workflows/tmp-issue610-precompute-strong-postverify-v2.yml

permissions:
  actions: read
  contents: read

env:
  IMPLEMENTATION_SHA: 1ae494ce182189c5be61e8007dc956f912d8b9d5
  IMPLEMENTATION_TREE: 4f14c5a06505b8ff9811b473bf6dea296453a13b
  IMPL_INDEX_DIGEST: d5390a0025a92e4e2a1e987b7b7ac8ee6ef3974c5c8247b0256ae70c0d2d6e10
  HELPER_SHA: 358b4917e988561f9a5601ef25a6d53291e07585
  CONTROL_SHA: dd40cbfba130d5079c2a210a486047bdff1ed1fc
  SCRIPT: tools/tmp_issue610_precompute_authority_v4.py
  PRECOMPUTE_RUN: '35098793118'
  PRECOMPUTE_HEAD: 29b7ebfbbdd69303e9d8a2c749c4699419c2e191
  PRECOMPUTE_ID: '10447243668'
  PRECOMPUTE_NAME: issue610-precompute-authority-v1-35098793118
  PRECOMPUTE_DIGEST: sha256:d8f6198763b3b1312e5a6f74c8f9905422c0a454f8bca6b68ec6b616c99554f3
  PRECOMPUTE_FRESH_ID: '10447607272'
  PRECOMPUTE_FRESH_NAME: issue610-precompute-authority-fresh-v1-35098793118
  PRECOMPUTE_FRESH_DIGEST: sha256:8b8d909facf14e453853cfc29d64275674779172cfa84c22b0e9541007c563ec
  BASELINE_RUN: '34700123151'
  BASELINE_NAME: canonical-m2-portable-baseline-v1-34700123151
  BASELINE_ID: '10301701698'
  BASELINE_DIGEST: sha256:f814fe4e205f8714c4344238911aae16e89ce0279908265feb1fdc85069b2a0a
  BASELINE_FRESH_RUN: '34704606059'
  BASELINE_FRESH_NAME: canonical-m2-portable-baseline-postverify-v1-34704606059
  BASELINE_FRESH_ID: '10300932825'
  BASELINE_FRESH_DIGEST: sha256:77c26e8cdeecdc023a750582ec5aebe3870ca84728e580c9e27d1b2e420368a9
  DATASET_ID: d7a04ede97a1bb37b811c3e071f325fa007525a6040927e6793d8cc7c10f538f
  DATASET_ARTIFACT_DIGEST: 77362e148c713840dda64e0ef70e663cce6611407eac31fefbb9fccca73ae8f8
  STUDY_DIGEST: 3d8404061a4082a8e9b3c786d9f5fc9a4347631dff39c201e3cba70470dfeb79
  BASELINE_FP: 526b485d60b394739b7a8d03535e1cfa08b26fa920119c70ee53f05faa53dd29
  IMPL_RUN: '35084553267'
  IMPL_SEAL_ID: '10441133239'
  IMPL_SEAL_NAME: issue607-implementation-seal-v1-35084553267
  IMPL_SEAL_DIGEST: sha256:8f8a3319f9213bf999b3ce2d911882fd9276daf575a7cde99ec33de9e8208b37
  IMPL_FRESH_ID: '10441194709'
  IMPL_FRESH_NAME: issue607-implementation-fresh-v1-35084553267
  IMPL_FRESH_DIGEST: sha256:39f578321699d3deba1c1cc67ee9d5401c7a45573088d63b2c346f09721c7f52
  EVAL_RUN: '35088018055'
  EVAL_PREREG_HEAD: 02fd08798b3f23cc3db13d96ac27778e93592019
  EVAL_SEAL_ID: '10443216354'
  EVAL_SEAL_NAME: issue609-evaluation-prereg-seal-v1-35088018055
  EVAL_SEAL_DIGEST: sha256:09c9033139b841b3e769ff1fb43fa291092f47fea5718c7ae396aebd71444986
  EVAL_FRESH_ID: '10443355963'
  EVAL_FRESH_NAME: issue609-evaluation-prereg-fresh-v1-35088018055
  EVAL_FRESH_DIGEST: sha256:6040f352bebb5c0da94a0c25f0a8e41665788826c980f512588089758d8ab44c
  EVAL_PROTOCOL_DIGEST: e52a19b859500ea01e900a1ea7209bd545c03acd08435d1ff615b7539ec75d2b
  EVAL_PROTOCOL_SHA256: e52a19b859500ea01e900a1ea7209bd545c03acd08435d1ff615b7539ec75d2b

jobs:
  strong:
    name: Strong independent content verification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.IMPLEMENTATION_SHA }}
          path: code
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HELPER_SHA }}
          path: helper
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CONTROL_SHA }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C code rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          test "$(git -C code rev-parse HEAD^{tree})" = "$IMPLEMENTATION_TREE"
          test "$(git -C helper rev-parse HEAD)" = "$HELPER_SHA"
          test "$(git -C control rev-parse HEAD)" = "$CONTROL_SHA"
          git -C code fetch origin "$EVAL_PREREG_HEAD" --no-tags
          test "$(git -C code rev-parse "$EVAL_PREREG_HEAD")" = "$EVAL_PREREG_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: cd code && uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Static-check verifier
        shell: bash
        run: |
          set -euo pipefail
          cd code
          S="$GITHUB_WORKSPACE/control/$SCRIPT"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run ruff check "$S"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run ruff format --check "$S"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run mypy "$S"
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -m py_compile "$S"
      - name: API-bind all immutable artifacts and require economics still absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRECOMPUTE_RUN")"
          test "$(jq -r .conclusion <<<"$run")" = success
          test "$(jq -r .head_sha <<<"$run")" = "$PRECOMPUTE_HEAD"
          check() {
            local id="$1" name="$2" digest="$3" run_id="$4"
            local p
            p="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$p")" = "$name"
            test "$(jq -r .digest <<<"$p")" = "$digest"
            test "$(jq -r .workflow_run.id <<<"$p")" = "$run_id"
            test "$(jq -r .expired <<<"$p")" = false
          }
          check "$PRECOMPUTE_ID" "$PRECOMPUTE_NAME" "$PRECOMPUTE_DIGEST" "$PRECOMPUTE_RUN"
          check "$PRECOMPUTE_FRESH_ID" "$PRECOMPUTE_FRESH_NAME" "$PRECOMPUTE_FRESH_DIGEST" "$PRECOMPUTE_RUN"
          check "$BASELINE_ID" "$BASELINE_NAME" "$BASELINE_DIGEST" "$BASELINE_RUN"
          check "$BASELINE_FRESH_ID" "$BASELINE_FRESH_NAME" "$BASELINE_FRESH_DIGEST" "$BASELINE_FRESH_RUN"
          check "$IMPL_SEAL_ID" "$IMPL_SEAL_NAME" "$IMPL_SEAL_DIGEST" "$IMPL_RUN"
          check "$IMPL_FRESH_ID" "$IMPL_FRESH_NAME" "$IMPL_FRESH_DIGEST" "$IMPL_RUN"
          check "$EVAL_SEAL_ID" "$EVAL_SEAL_NAME" "$EVAL_SEAL_DIGEST" "$EVAL_RUN"
          check "$EVAL_FRESH_ID" "$EVAL_FRESH_NAME" "$EVAL_FRESH_DIGEST" "$EVAL_RUN"
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PRECOMPUTE_NAME }}
          path: /tmp/precompute
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.PRECOMPUTE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PRECOMPUTE_FRESH_NAME }}
          path: /tmp/precompute-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.PRECOMPUTE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_NAME }}
          path: /tmp/baseline
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BASELINE_FRESH_NAME }}
          path: /tmp/baseline-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.BASELINE_FRESH_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_SEAL_NAME }}
          path: /tmp/impl-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.IMPL_FRESH_NAME }}
          path: /tmp/impl-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.IMPL_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_SEAL_NAME }}
          path: /tmp/eval-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.EVAL_FRESH_NAME }}
          path: /tmp/eval-fresh
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: ${{ env.EVAL_RUN }}
      - name: Strongly recompute and cross-check primary authority
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/precompute/authority.json /tmp/precompute-fresh/authority.json
          cd code
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -P "$GITHUB_WORKSPACE/control/$SCRIPT" \
            --repo-root "$GITHUB_WORKSPACE/code" \
            --baseline-root /tmp/baseline \
            --baseline-fresh-root /tmp/baseline-fresh \
            --impl-seal-root /tmp/impl-seal \
            --impl-fresh-root /tmp/impl-fresh \
            --eval-seal-root /tmp/eval-seal \
            --eval-fresh-root /tmp/eval-fresh \
            --output-root /tmp/strong
          PYTHONPATH="$GITHUB_WORKSPACE/helper" uv run python -P - <<'PY'
          import json
          from pathlib import Path
          from trade_rl.artifacts.hashing import content_digest
          primary = json.loads(Path('/tmp/precompute/authority.json').read_text())
          strong = json.loads(Path('/tmp/strong/authority.json').read_text())
          unsigned = dict(primary)
          recorded = unsigned.pop('content_digest')
          assert content_digest(unsigned) == recorded
          for key in (
              'implementation_git_sha', 'implementation_tree_sha',
              'implementation_index_digest', 'helper_git_sha', 'dataset_id',
              'dataset_artifact_digest', 'source_study_digest',
              'baseline_evidence_fingerprint', 'candidate_carrier_study_digest',
              'evaluation_protocol_digest',
          ):
              assert primary[key] == strong[key], key
          assert primary['expected_semantic_changed_paths'] == strong['semantic_changed_fields']
          assert primary['prior_issue610_economic_artifacts'] == 0
          assert primary['precompute_inputs_validated'] is True
          assert primary['candidate_training_performed'] is False
          assert primary['baseline_retrained'] is False
          assert primary['economic_values_interpreted'] is False
          assert primary['final_test_accessed'] is False
          assert primary['production_eligible'] is False
          assert primary['live_trading_authorized'] is False
          assert primary['merge_authorized'] is False
          print('ISSUE610_STRONG_PRECOMPUTE_POSTVERIFY=PASS')
          PY
      - id: meta
        run: echo "artifact_name=issue610-precompute-strong-v2-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: /tmp/strong
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  audit:
    name: Audit strong postverification
    needs: strong
    runs-on: ubuntu-24.04
    steps:
      - name: API-bind strong artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.strong.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.strong.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.strong.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          p="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$p")" = "$ARTIFACT_NAME"
          test "$(jq -r .digest <<<"$p")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$p")" = "$GITHUB_RUN_ID"
          test "$(jq -r .expired <<<"$p")" = false
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name')"
          ! grep -E '^issue610-ppo-global-btc-regime-(candidate|result)-v1-' <<<"$names"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.strong.outputs.artifact_name }}
          path: /tmp/strong
      - name: Verify canonical authority remains result-blind
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          raw = Path('/tmp/strong/authority.json').read_bytes()
          payload = json.loads(raw)
          digest = payload.pop('content_digest')
          canonical = json.dumps(payload, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(canonical).hexdigest() == digest
          assert payload['prior_issue610_economic_artifacts'] == 0
          assert payload['baseline_retrained'] is False
          assert payload['candidate_trained'] is False
          assert payload['economic_values_interpreted'] is False
          assert payload['final_test_accessed'] is False
          assert payload['production_eligible'] is False
          assert payload['live_trading_authorized'] is False
          assert payload['merge_authorized'] is False
          print('ISSUE610_STRONG_POSTVERIFY_AUDIT=PASS')
          PY
