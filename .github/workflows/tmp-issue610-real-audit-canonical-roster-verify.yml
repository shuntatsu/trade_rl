# Exact-head GREEN verification after the canonical map-roster fix.
name: tmp Issue 610 real audit canonical roster verification

on:
  push:
    branches:
      - verify/issue610-real-audit-canonical-roster-v1
    paths:
      - .github/workflows/tmp-issue610-real-audit-canonical-roster-verify.yml
      - tools/tmp_issue610_real_interpretation_audit_v1.py
      - tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only b7c41a7c80c38eadce99759ac345489eb2ff9cce..HEAD | sort)"
          expected="$(printf '%s\n%s\n%s\n' \
            .github/workflows/tmp-issue610-real-audit-canonical-roster-verify.yml \
            tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py \
            tools/tmp_issue610_real_interpretation_audit_v1.py | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse b7c41a7c80c38eadce99759ac345489eb2ff9cce:trade_rl)" = "$(git rev-parse HEAD:trade_rl)"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py
          uv run ruff format --check tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py
          uv run mypy tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py
      - name: Canonical roster regression and self-check
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py
          uv run python -m tools.tmp_issue610_real_interpretation_audit_v1 self-check
