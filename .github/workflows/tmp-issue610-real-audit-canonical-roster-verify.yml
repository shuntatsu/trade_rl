name: tmp Issue 610 real audit canonical roster verification

on:
  push:
    branches:
      - verify/issue610-real-audit-canonical-roster-v1
    paths:
      - .github/workflows/tmp-issue610-real-audit-canonical-roster-verify.yml
      - tools/tmp_issue610_real_interpretation_audit_v1.py
      - tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py

permissions:
  contents: read

env:
  PRE_FIX_HELPER_BLOB: faca2ecb687082dbdc1d799f3e31ef09b7532732

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind the unchanged pre-fix audit helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/tmp_issue610_real_interpretation_audit_v1.py)" = "$PRE_FIX_HELPER_BLOB"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Reproduce canonical round-trip roster failure
        run: uv run pytest -q tests/tools/test_tmp_issue610_real_interpretation_audit_canonical_roster.py
