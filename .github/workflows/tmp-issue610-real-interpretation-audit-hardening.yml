name: tmp Issue 610 real interpretation audit hardening

on:
  push:
    branches:
      - automation/issue610-real-interpretation-audit-hardening
    paths:
      - .github/workflows/tmp-issue610-real-interpretation-audit-hardening.yml

permissions:
  contents: write

env:
  TARGET_BRANCH: run/issue610-real-interpretation-v1
  TARGET_HEAD: 901ef64f1f61e8f0b7245e32e32e348a9989f517
  TARGET_FILE: .github/workflows/issue610-real-interpretation-v1.yml

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - name: Guard exact dormant target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_HEAD"
          test ! -e .github/issue610-real-interpretation-v1.authorized
      - name: Strengthen candidate authority closure only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/issue610-real-interpretation-v1.yml')
          text = path.read_text()
          old = """          assert candidate['candidate_training_performed'] is True
          assert candidate['economic_values_interpreted'] is False
          assert candidate['final_test_accessed'] is False
          assert recovery_binding['candidate_execution_run_id'] == int(os.environ['CANDIDATE_RUN'])
          assert recovery_binding['candidate_artifact_api_digest'] if 'candidate_artifact_api_digest' in recovery_binding else True
          assert recovery_binding['economic_values_interpreted'] is False
          assert recovery_binding['final_test_accessed'] is False
          assert recovery_binding['production_eligible'] is False
          assert recovery_binding['live_trading_authorized'] is False
          assert recovery_binding['merge_authorized'] is False
"""
          new = """          assert candidate['execution_run_id'] == int(os.environ['CANDIDATE_RUN'])
          assert candidate['precompute_run_id'] == int(os.environ['PRECOMPUTE_RUN'])
          assert candidate['precompute_artifact_id'] == precompute_id
          assert candidate['precompute_artifact_api_digest'] == precompute_digest
          assert candidate['precompute_authority_content_digest'] == precompute['content_digest']
          assert candidate['ppo_seeds'] == [0, 1, 2, 3, 4]
          assert candidate['symbols'] == ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'XRPUSDT', 'ADAUSDT']
          assert candidate['baseline_retrained'] is False
          assert candidate['candidate_training_performed'] is True
          assert candidate['economic_values_interpreted'] is False
          assert candidate['final_test_accessed'] is False
          assert candidate['operational_eligibility_established'] is False
          assert candidate['production_eligible'] is False
          assert candidate['live_trading_authorized'] is False
          assert candidate['merge_authorized'] is False

          assert recovery_binding['candidate_execution_run_id'] == int(os.environ['CANDIDATE_RUN'])
          assert recovery_binding['precompute_run_id'] == int(os.environ['PRECOMPUTE_RUN'])
          assert recovery_binding['precompute_artifact_id'] == precompute_id
          assert recovery_binding['precompute_artifact_api_digest'] == precompute_digest
          assert recovery_binding['candidate_evidence_fingerprint'] == candidate['candidate_evidence_fingerprint']
          assert recovery_binding['candidate_authority_content_digest'] == candidate['content_digest']
          assert recovery_binding['failed_run_candidate_training_performed'] is False
          assert recovery_binding['recovery_candidate_training_performed'] is True
          assert recovery_binding['economic_values_interpreted'] is False
          assert recovery_binding['final_test_accessed'] is False
          assert recovery_binding['production_eligible'] is False
          assert recovery_binding['live_trading_authorized'] is False
          assert recovery_binding['merge_authorized'] is False
"""
          if text.count(old) != 1:
              raise SystemExit('expected audit block not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = "$TARGET_FILE"
          grep -F "recovery_binding['candidate_evidence_fingerprint'] == candidate['candidate_evidence_fingerprint']" "$TARGET_FILE" >/dev/null
          grep -F "recovery_binding['candidate_authority_content_digest'] == candidate['content_digest']" "$TARGET_FILE" >/dev/null
          grep -F "candidate['precompute_authority_content_digest'] == precompute['content_digest']" "$TARGET_FILE" >/dev/null
          ! grep -F "candidate_artifact_api_digest'] if" "$TARGET_FILE"
      - name: Publish non-force if target unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_FILE"
          git commit -m "ci: harden Issue 610 real interpretation audit closure"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
