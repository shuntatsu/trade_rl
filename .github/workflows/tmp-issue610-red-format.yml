name: tmp Issue 610 RED format
on:
  push:
    branches:
      - automation/issue610-red-format
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 936721991f7fff1c1b049ae2c19f82bd1823a1a5
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Format only RED oracle
        run: uv run ruff format tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py
      - name: Validate and publish only formatted test
        shell: bash
        env:
          TARGET_BRANCH: prepare/issue610-ppo-global-btc-regime-evaluation
          EXPECTED_HEAD: 936721991f7fff1c1b049ae2c19f82bd1823a1a5
        run: |
          set -euo pipefail
          uv run ruff check tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py
          uv run ruff format --check tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          changed="$(git diff --name-only)"
          test "$changed" = "tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/tools/test_tmp_issue610_ppo_global_btc_regime_evaluation.py
          git commit -m "style: format Issue 610 RED oracle"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
