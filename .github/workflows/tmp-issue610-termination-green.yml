name: tmp Issue 610 termination GREEN

on:
  push:
    branches:
      - prepare/issue610-termination-verifier
    paths:
      - .github/workflows/tmp-issue610-termination-green.yml

permissions:
  contents: read

env:
  TARGET_SHA: 3408951c36e45b51642fb7bc7c6ce08be3b5f95b
  MODULE: tools/tmp_issue610_ppo_global_btc_regime_termination.py
  TEST: tests/tools/test_tmp_issue610_ppo_global_btc_regime_termination.py

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static and semantic GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check "$MODULE" "$TEST"
          uv run ruff format --check "$MODULE" "$TEST"
          uv run mypy "$MODULE"
          uv run pytest -q "$TEST"
