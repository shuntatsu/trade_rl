name: tmp Issue 615 shared-cash GREEN

on:
  push:
    branches:
      - feat/issue615-shared-cash-replay
    paths:
      - tools/tmp_issue615_shared_cash_patch.py
      - .github/workflows/tmp-issue615-shared-cash-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue615-shared-cash-replay
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Apply implementation
        run: python3 tools/tmp_issue615_shared_cash_patch.py
      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff check --fix trade_rl/evaluation/replay.py tests/evaluation/test_shared_cash_replay.py
          uv run ruff format trade_rl/evaluation/replay.py tests/evaluation/test_shared_cash_replay.py
          uv run mypy trade_rl/evaluation/replay.py
          uv run pytest -q \
            tests/evaluation/test_shared_cash_replay.py \
            tests/evaluation/test_single_symbol_replay.py \
            tests/simulation/test_independent_accounting_oracle.py \
            tests/risk/test_pretrade_hard_only_contract.py \
            tests/simulation/test_execution_v2.py
          uv run pytest -q tests/architecture/test_runs_capability_facade.py tests/architecture/test_lean_evaluation_layout.py
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/replay.py tests/evaluation/test_shared_cash_replay.py
          git commit -m 'feat: add shared-cash multi-symbol replay oracle'
          git push origin HEAD:feat/issue615-shared-cash-replay
