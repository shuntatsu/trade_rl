name: tmp Issue 615 shared-cash RED

on:
  push:
    branches:
      - feat/issue615-shared-cash-replay
    paths:
      - tests/evaluation/test_shared_cash_replay.py
      - .github/workflows/tmp-issue615-shared-cash-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue615-shared-cash-replay
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Observe expected RED
        shell: bash
        run: uv run pytest -q tests/evaluation/test_shared_cash_replay.py
