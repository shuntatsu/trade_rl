name: tmp Issue 616 evaluator test hardening

on:
  push:
    branches:
      - automation/issue616-eval-test-hardening

permissions:
  contents: write

env:
  TARGET_BRANCH: research/issue616-ridge-economic-gate-evaluation
  EXPECTED_HEAD: f9dee19c9248c42b278f7c799a8e8345dd224c36
  TEST_WRAPPER: tests/strategies/test_ridge_economic_gate.py
  TEST_ARTIFACT: tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_artifact.py
  TEST_EVAL: tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
  MODULE: trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py
  WRAPPER: trade_rl/strategies/forecasts/ridge_economic_gate.py

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
      - name: Guard exact target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
      - name: Remove datetime warning and add nested-row tamper oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("tests/strategies/test_ridge_economic_gate.py")
          text = wrapper.read_text()
          if text.count("from datetime import UTC, datetime\n\n") != 1:
              raise SystemExit("wrapper datetime import drift")
          text = text.replace("from datetime import UTC, datetime\n\n", "")
          old = '        fit_cutoff=np.datetime64(datetime(2023, 1, 1, tzinfo=UTC)),\n'
          new = '        fit_cutoff=np.datetime64("2023-01-01T00:00:00", "ns"),\n'
          if text.count(old) != 1:
              raise SystemExit("wrapper fit_cutoff drift")
          wrapper.write_text(text.replace(old, new))

          artifact = Path("tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_artifact.py")
          text = artifact.read_text()
          marker = '''\n\ndef test_loader_rejects_resigned_aggregate_and_status_forgery(tmp_path) -> None:\n'''
          if text.count(marker) != 1:
              raise SystemExit("artifact nested test insertion point drift")
          nested = '''\n\ndef test_loader_rejects_unknown_nested_symbol_field_even_when_resigned(tmp_path) -> None:\n    document = json.loads(canonical_ridge_economic_gate_evaluation_bytes(_result()))\n    document["result"]["by_symbol"][0]["unexpected"] = 1\n    document["content_digest"] = content_digest(document["result"])\n    path = tmp_path / "result.json"\n    path.write_bytes(_canonical_document_bytes(document))\n\n    with pytest.raises(ValueError, match="by_symbol item keys differ"):\n        load_ridge_economic_gate_evaluation(path)\n'''
          artifact.write_text(text.replace(marker, nested + marker))
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$TEST_WRAPPER" "$TEST_ARTIFACT" | sort)"
          test "$changed" = "$expected"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Verify hardened focused suite
        run: |
          set -euo pipefail
          uv run ruff check --fix "$TEST_WRAPPER" "$TEST_ARTIFACT"
          uv run ruff format "$TEST_WRAPPER" "$TEST_ARTIFACT"
          uv run ruff check "$MODULE" "$WRAPPER" "$TEST_EVAL" "$TEST_ARTIFACT" "$TEST_WRAPPER"
          uv run ruff format --check "$MODULE" "$WRAPPER" "$TEST_EVAL" "$TEST_ARTIFACT" "$TEST_WRAPPER"
          uv run mypy "$MODULE" "$WRAPPER"
          uv run pytest -W error::DeprecationWarning -q "$TEST_WRAPPER" "$TEST_EVAL" "$TEST_ARTIFACT"
      - name: Publish non-force if target unchanged
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TEST_WRAPPER" "$TEST_ARTIFACT"
          git commit -m 'test: harden Issue 616 evaluator artifact oracle'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
