name: tmp Issue 618 PRE-PnL cost gate v1

on:
  push:
    branches:
      - run/issue618-ridge-cost-gate-v1
    paths:
      - .github/workflows/tmp-issue618-cost-gate-v1.yml

permissions:
  contents: read
  actions: read

jobs:
  cost-gate:
    name: Dataset-only explicit-cost constancy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMPLEMENTATION_HEAD: 222a082ee28f4f0fd35081912a33649cce27c585
      IMPLEMENTATION_SEAL_RUN_ID: '35200471721'
      IMPLEMENTATION_SEAL_ARTIFACT_ID: '10487711819'
      IMPLEMENTATION_SEAL_ARTIFACT_NAME: issue618-implementation-seal-primary-35200471721
      IMPLEMENTATION_SEAL_API_DIGEST: sha256:3a35036040f28df009daca89e73dc5b050488abfea535e7ee09b67181579c713
      IMPLEMENTATION_DOCUMENT_SHA256: 6dd761d28781099f3bd129870b1512e15c2e30e54f91c858bca8d034618bfb59
      IMPLEMENTATION_SEAL_SHA256: 1573b8e65c8fc6093adbca5f95e2b5c4fd7b8c6b4e63161021ec4c1c23768fe1
      SOURCE_RUN_ID: '34803217815'
      SOURCE_ARTIFACT_ID: '10331899302'
      SOURCE_ARTIFACT_NAME: issue539-calibrated-causal-successor-v3-34803217815
      SOURCE_API_DIGEST: sha256:89e899427f23fa46929c8be1e71fd49abe0d1d465c7a7f796a0874426b885bce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 222a082ee28f4f0fd35081912a33649cce27c585
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_HEAD"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Verify immutable Artifact metadata without reading economics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          for prefix in ('IMPLEMENTATION_SEAL','SOURCE'):
              artifact_id=int(os.environ[f'{prefix}_ARTIFACT_ID'])
              meta=get(f'https://api.github.com/repos/shuntatsu/trade_rl/actions/artifacts/{artifact_id}')
              assert meta['id']==artifact_id
              assert meta['name']==os.environ[f'{prefix}_ARTIFACT_NAME']
              assert meta['digest']==os.environ[f'{prefix}_API_DIGEST']
              assert meta['workflow_run']['id']==int(os.environ[f'{prefix}_RUN_ID'])
              assert meta['expired'] is False
          seal_run=get(f"https://api.github.com/repos/shuntatsu/trade_rl/actions/runs/{os.environ['IMPLEMENTATION_SEAL_RUN_ID']}")
          assert seal_run['conclusion']=='success'
          PY
      - name: Download sealed implementation authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue618-implementation-seal-primary-35200471721
          path: /tmp/implementation-seal
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: 35200471721
      - name: Verify implementation authority bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum /tmp/implementation-seal/implementation.json | awk '{print $1}')" = "$IMPLEMENTATION_DOCUMENT_SHA256"
          test "$(sha256sum /tmp/implementation-seal/seal.json | awk '{print $1}')" = "$IMPLEMENTATION_SEAL_SHA256"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          impl=json.loads(Path('/tmp/implementation-seal/implementation.json').read_text())
          seal=json.loads(Path('/tmp/implementation-seal/seal.json').read_text())
          assert impl['implementation_head']==os.environ['IMPLEMENTATION_HEAD']
          assert impl['evaluation_pnl_inspected'] is False
          assert impl['evaluation_execution_authorized'] is False
          assert seal['implementation_sha256']==os.environ['IMPLEMENTATION_DOCUMENT_SHA256']
          PY
      - name: Download exact successor bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: issue539-calibrated-causal-successor-v3-34803217815
          path: /tmp/successor
          github-token: ${{ github.token }}
          repository: shuntatsu/trade_rl
          run-id: 34803217815
      - name: Prove Dataset-only full-window explicit-cost constancy
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/successor/dataset/manifest.json
          test -f /tmp/successor/dataset/arrays.npz
          test -f /tmp/successor/study/plan.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import numpy as np
          from trade_rl.data import inspect_published_market_dataset_artifact, load_market_dataset_artifact
          from trade_rl.evaluation.experiments.bootstrap.ridge_economic_gate_evaluation import (
              RidgeEconomicGateCostAuthority,
              canonical_ridge_economic_gate_evaluation_spec,
          )
          spec=canonical_ridge_economic_gate_evaluation_spec()
          published=inspect_published_market_dataset_artifact('/tmp/successor/dataset')
          assert published.artifact_digest==spec.dataset_artifact_digest
          dataset=load_market_dataset_artifact('/tmp/successor/dataset')
          assert dataset.dataset_id==spec.dataset_id
          assert tuple(dataset.symbols)==spec.symbols
          ts=np.asarray(dataset.timestamps,dtype='datetime64[ns]')
          start_match=np.flatnonzero(ts==np.datetime64(spec.evaluation_start,'ns'))
          stop_match=np.flatnonzero(ts==np.datetime64(spec.evaluation_stop_exclusive,'ns'))
          assert start_match.size==1 and stop_match.size==1
          start=int(start_match[0]); stop=int(stop_match[0])
          assert 0 <= start < stop < dataset.n_bars
          sl=slice(start,stop+1)
          shape=(stop+1-start,len(spec.symbols))
          for field,expected in [('fee_rate',spec.fee_rate),('taker_fee_rate',spec.taker_fee_rate),('spread_rate',spec.spread_rate)]:
              values=np.asarray(dataset.resolved_array(field)[sl],dtype=np.float64)
              assert values.shape==shape, (field,values.shape,shape)
              assert np.isfinite(values).all(), field
              assert np.all(values>=0.0), field
              assert np.all(values==expected), field
          authority=RidgeEconomicGateCostAuthority(
              source_run_id=spec.successor_bundle_run_id,
              source_artifact_id=spec.successor_bundle_artifact_id,
              source_artifact_api_digest=spec.successor_bundle_artifact_digest,
              dataset_id=spec.dataset_id,
              dataset_artifact_digest=spec.dataset_artifact_digest,
              evaluation_start=spec.evaluation_start,
              evaluation_stop_exclusive=spec.evaluation_stop_exclusive,
              fee_rate=spec.fee_rate,
              taker_fee_rate=spec.taker_fee_rate,
              spread_rate=spec.spread_rate,
              one_way_explicit_cost=spec.one_way_explicit_cost,
              verified=True,
          )
          out=Path('cost-gate'); out.mkdir()
          authority_bytes=(json.dumps(authority.to_payload(),sort_keys=True,separators=(',',':'))+'\n').encode()
          (out/'cost-authority.json').write_bytes(authority_bytes)
          manifest=Path('/tmp/successor/dataset/manifest.json').read_bytes()
          arrays=Path('/tmp/successor/dataset/arrays.npz').read_bytes()
          gate={
              'schema_version':'issue618_ridge_cost_gate_v1',
              'gate_run_id':int(os.environ['GITHUB_RUN_ID']),
              'implementation_head':os.environ['IMPLEMENTATION_HEAD'],
              'implementation_seal_run_id':int(os.environ['IMPLEMENTATION_SEAL_RUN_ID']),
              'implementation_document_sha256':os.environ['IMPLEMENTATION_DOCUMENT_SHA256'],
              'implementation_seal_sha256':os.environ['IMPLEMENTATION_SEAL_SHA256'],
              'source_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_api_digest':os.environ['SOURCE_API_DIGEST'].removeprefix('sha256:'),
              'dataset_id':dataset.dataset_id,
              'dataset_artifact_digest':published.artifact_digest,
              'dataset_manifest_sha256':hashlib.sha256(manifest).hexdigest(),
              'dataset_arrays_sha256':hashlib.sha256(arrays).hexdigest(),
              'checked_execution_rows':shape[0],
              'checked_symbols':shape[1],
              'fee_rate':spec.fee_rate,
              'taker_fee_rate':spec.taker_fee_rate,
              'spread_rate':spec.spread_rate,
              'one_way_explicit_cost':spec.one_way_explicit_cost,
              'cost_authority_digest':authority.digest,
              'dataset_only':True,
              'study_plan_contents_read':False,
              'evaluation_pnl_inspected':False,
              'evaluation_execution_authorized':False,
              'verified':True,
          }
          gate_bytes=(json.dumps(gate,sort_keys=True,separators=(',',':'))+'\n').encode()
          (out/'gate.json').write_bytes(gate_bytes)
          print('PRE_PNL_COST_CONSTANCY_GATE=PASS')
          print(f'COST_AUTHORITY_DIGEST={authority.digest}')
          print(f'CHECKED_EXECUTION_ROWS={shape[0]}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue618-ridge-cost-authority-${{ github.run_id }}
          path: cost-gate/
          if-no-files-found: error
          retention-days: 90
