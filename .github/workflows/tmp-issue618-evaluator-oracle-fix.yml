name: tmp Issue 618 evaluator oracle fix

on:
  push:
    branches:
      - research/issue618-ridge-economic-gate-impl
    paths:
      - .github/workflows/tmp-issue618-evaluator-oracle-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue618-ridge-economic-gate-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Correct only the two test oracles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py')
          s = p.read_text()
          old = '''    bad = replace(_cost_authority(spec), dataset_artifact_digest="d" * 64)\n    with pytest.raises(ValueError, match="cost authority"):\n        evaluate_ridge_economic_gate(dataset, spec, bad)\n'''
          new = '''    with pytest.raises(ValueError, match="cost authority"):\n        replace(_cost_authority(spec), dataset_artifact_digest="d" * 64)\n'''
          if old not in s:
              raise SystemExit('cost-authority oracle marker missing')
          s = s.replace(old, new, 1)
          old2 = '        median_excess_total_return=0.15,\n'
          new2 = '        median_excess_total_return=rows[0].excess_total_return,\n'
          if old2 not in s:
              raise SystemExit('median oracle marker missing')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          uv run ruff check --fix tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          uv run ruff format tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          git diff --check
      - name: Commit corrected oracle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          git commit -m 'test: correct ridge evaluator fail-closed oracles'
          git push origin HEAD:research/issue618-ridge-economic-gate-impl
