name: tmp Issue 618 implementation seal v1

on:
  push:
    branches:
      - seal/issue618-ridge-economic-gate-impl-v1
    paths:
      - .github/workflows/tmp-issue618-implementation-seal-v1.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  primary:
    name: Primary implementation seal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 222a082ee28f4f0fd35081912a33649cce27c585
          fetch-depth: 0
          persist-credentials: false
      - id: build
        name: Independently reconstruct primary seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          git fetch origin 205c80aa59e63653f48d621bb76624029571b3a5 a111cc716c1ac44b3ff6f8b167c53930c0216396
          test "$(git show -s --format=%P 205c80aa59e63653f48d621bb76624029571b3a5)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          test "$(git show -s --format=%P a111cc716c1ac44b3ff6f8b167c53930c0216396)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          git show 205c80aa59e63653f48d621bb76624029571b3a5:.github/workflows/tmp-issue618-exact-core-v3.yml | grep -q '222a082ee28f4f0fd35081912a33649cce27c585'
          git show a111cc716c1ac44b3ff6f8b167c53930c0216396:.github/workflows/tmp-issue618-final-verification-v2.yml | grep -q '222a082ee28f4f0fd35081912a33649cce27c585'
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          def get(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          expected = {
              105015381328: (35162237268, 'exact-core'),
              105014896981: (35162080058, 'Exact Human Guide'),
              105014897168: (35162080058, 'Current Main Compatibility'),
          }
          for job_id, (run_id, name) in expected.items():
              job = get(f'https://api.github.com/repos/shuntatsu/trade_rl/actions/jobs/{job_id}')
              assert job['run_id'] == run_id, (job_id, job['run_id'])
              assert job['conclusion'] == 'success', (job_id, job['conclusion'])
              assert job['name'] == name, (job_id, job['name'])
          pr = get('https://api.github.com/repos/shuntatsu/trade_rl/pulls/619')
          assert pr['state'] == 'open'
          assert pr['draft'] is True
          assert pr['base']['ref'] == 'research/issue616-ridge-economic-gate-prereg'
          assert pr['base']['sha'] == '75999e53c70224c31a62b106e4a8d2caa4b920ac'
          assert pr['head']['ref'] == 'research/issue618-ridge-economic-gate-impl'
          assert pr['head']['sha'] == '222a082ee28f4f0fd35081912a33649cce27c585'
          PY
          mapfile -t files < <(git diff --name-only 75999e53c70224c31a62b106e4a8d2caa4b920ac...HEAD)
          test "${#files[@]}" -eq 8
          printf '%s\n' "${files[@]}" > /tmp/issue618-files.txt
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected_files = [
              'tests/architecture/test_runs_capability_facade.py',
              'tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py',
              'tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_falsification.py',
              'tests/strategies/test_ridge_economic_gate.py',
              'trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py',
              'trade_rl/evaluation/runs/__init__.py',
              'trade_rl/evaluation/runs/execute.py',
              'trade_rl/strategies/forecasts/ridge_economic_gate.py',
          ]
          actual = Path('/tmp/issue618-files.txt').read_text().splitlines()
          assert actual == expected_files, (actual, expected_files)
          blobs = {
              p: subprocess.check_output(['git','rev-parse',f'HEAD:{p}'], text=True).strip()
              for p in expected_files
          }
          payload = {
              'schema_version': 'issue618_ridge_economic_gate_implementation_v1',
              'issue_number': 618,
              'pull_request_number': 619,
              'implementation_head': '222a082ee28f4f0fd35081912a33649cce27c585',
              'prereg_head': '75999e53c70224c31a62b106e4a8d2caa4b920ac',
              'protocol_digest': '167af235eeba44b9ade780c95ef7bab11c7b211d81018b82ece5d7044f7c4eb3',
              'protocol_seal_run_id': 35126253392,
              'protocol_seal_artifact_id': 10459431804,
              'protocol_fresh_artifact_id': 10458759061,
              'final_core_verification': {
                  'workflow_commit': '205c80aa59e63653f48d621bb76624029571b3a5',
                  'run_id': 35162237268,
                  'job_id': 105015381328,
              },
              'final_guide_verification': {
                  'workflow_commit': 'a111cc716c1ac44b3ff6f8b167c53930c0216396',
                  'run_id': 35162080058,
                  'job_id': 105014896981,
              },
              'current_main_compatibility': {
                  'workflow_commit': 'a111cc716c1ac44b3ff6f8b167c53930c0216396',
                  'run_id': 35162080058,
                  'job_id': 105014897168,
              },
              'changed_files': expected_files,
              'blob_shas': blobs,
              'evaluation_pnl_inspected': False,
              'evaluation_execution_authorized': False,
              'final_test_accessed': False,
              'shared_cash_profitability_established': False,
              'operational_eligibility_established': False,
              'production_eligible': False,
              'live_trading_authorized': False,
              'merge_authorized': False,
          }
          out = Path('seal-primary'); out.mkdir()
          impl = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode() + b'\n'
          (out/'implementation.json').write_bytes(impl)
          impl_sha = hashlib.sha256(impl).hexdigest()
          seal = {
              'schema_version': 'issue618_ridge_economic_gate_implementation_seal_v1',
              'seal_run_id': int(os.environ['GITHUB_RUN_ID']),
              'implementation_sha256': impl_sha,
          }
          seal_bytes = json.dumps(seal, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode() + b'\n'
          (out/'seal.json').write_bytes(seal_bytes)
          seal_sha = hashlib.sha256(seal_bytes).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'implementation_sha256={impl_sha}\n')
              f.write(f'seal_sha256={seal_sha}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue618-implementation-seal-primary-${{ github.run_id }}
          path: seal-primary/
          if-no-files-found: error
          retention-days: 90

  fresh:
    name: Fresh implementation reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      implementation_sha256: ${{ steps.build.outputs.implementation_sha256 }}
      seal_sha256: ${{ steps.build.outputs.seal_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 222a082ee28f4f0fd35081912a33649cce27c585
          fetch-depth: 0
          persist-credentials: false
      - id: build
        name: Independently reconstruct fresh seal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          git fetch origin 205c80aa59e63653f48d621bb76624029571b3a5 a111cc716c1ac44b3ff6f8b167c53930c0216396
          test "$(git show -s --format=%P 205c80aa59e63653f48d621bb76624029571b3a5)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          test "$(git show -s --format=%P a111cc716c1ac44b3ff6f8b167c53930c0216396)" = "222a082ee28f4f0fd35081912a33649cce27c585"
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ['GH_TOKEN']
          def get(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          for job_id, run_id, name in [
              (105015381328, 35162237268, 'exact-core'),
              (105014896981, 35162080058, 'Exact Human Guide'),
              (105014897168, 35162080058, 'Current Main Compatibility'),
          ]:
              job = get(f'https://api.github.com/repos/shuntatsu/trade_rl/actions/jobs/{job_id}')
              assert (job['run_id'], job['conclusion'], job['name']) == (run_id, 'success', name)
          pr = get('https://api.github.com/repos/shuntatsu/trade_rl/pulls/619')
          assert (pr['state'], pr['draft'], pr['base']['sha'], pr['head']['sha']) == (
              'open', True,
              '75999e53c70224c31a62b106e4a8d2caa4b920ac',
              '222a082ee28f4f0fd35081912a33649cce27c585',
          )
          PY
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          expected_files = [
              'tests/architecture/test_runs_capability_facade.py',
              'tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py',
              'tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_falsification.py',
              'tests/strategies/test_ridge_economic_gate.py',
              'trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py',
              'trade_rl/evaluation/runs/__init__.py',
              'trade_rl/evaluation/runs/execute.py',
              'trade_rl/strategies/forecasts/ridge_economic_gate.py',
          ]
          actual = subprocess.check_output([
              'git','diff','--name-only','75999e53c70224c31a62b106e4a8d2caa4b920ac...HEAD'
          ], text=True).splitlines()
          assert actual == expected_files, (actual, expected_files)
          blobs = {p: subprocess.check_output(['git','rev-parse',f'HEAD:{p}'], text=True).strip() for p in expected_files}
          payload = {
              'schema_version': 'issue618_ridge_economic_gate_implementation_v1',
              'issue_number': 618,
              'pull_request_number': 619,
              'implementation_head': '222a082ee28f4f0fd35081912a33649cce27c585',
              'prereg_head': '75999e53c70224c31a62b106e4a8d2caa4b920ac',
              'protocol_digest': '167af235eeba44b9ade780c95ef7bab11c7b211d81018b82ece5d7044f7c4eb3',
              'protocol_seal_run_id': 35126253392,
              'protocol_seal_artifact_id': 10459431804,
              'protocol_fresh_artifact_id': 10458759061,
              'final_core_verification': {'workflow_commit': '205c80aa59e63653f48d621bb76624029571b3a5', 'run_id': 35162237268, 'job_id': 105015381328},
              'final_guide_verification': {'workflow_commit': 'a111cc716c1ac44b3ff6f8b167c53930c0216396', 'run_id': 35162080058, 'job_id': 105014896981},
              'current_main_compatibility': {'workflow_commit': 'a111cc716c1ac44b3ff6f8b167c53930c0216396', 'run_id': 35162080058, 'job_id': 105014897168},
              'changed_files': expected_files,
              'blob_shas': blobs,
              'evaluation_pnl_inspected': False,
              'evaluation_execution_authorized': False,
              'final_test_accessed': False,
              'shared_cash_profitability_established': False,
              'operational_eligibility_established': False,
              'production_eligible': False,
              'live_trading_authorized': False,
              'merge_authorized': False,
          }
          out = Path('seal-fresh'); out.mkdir()
          impl = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode() + b'\n'
          (out/'implementation.json').write_bytes(impl)
          impl_sha = hashlib.sha256(impl).hexdigest()
          seal = {'schema_version': 'issue618_ridge_economic_gate_implementation_seal_v1', 'seal_run_id': int(os.environ['GITHUB_RUN_ID']), 'implementation_sha256': impl_sha}
          seal_bytes = json.dumps(seal, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode() + b'\n'
          (out/'seal.json').write_bytes(seal_bytes)
          seal_sha = hashlib.sha256(seal_bytes).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'implementation_sha256={impl_sha}\n')
              f.write(f'seal_sha256={seal_sha}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue618-implementation-seal-fresh-${{ github.run_id }}
          path: seal-fresh/
          if-no-files-found: error
          retention-days: 90

  audit:
    name: Final seal audit
    needs: [primary, fresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require independent byte-identical reconstruction
        shell: bash
        env:
          PRIMARY_IMPLEMENTATION: ${{ needs.primary.outputs.implementation_sha256 }}
          FRESH_IMPLEMENTATION: ${{ needs.fresh.outputs.implementation_sha256 }}
          PRIMARY_SEAL: ${{ needs.primary.outputs.seal_sha256 }}
          FRESH_SEAL: ${{ needs.fresh.outputs.seal_sha256 }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_IMPLEMENTATION"
          test "$PRIMARY_IMPLEMENTATION" = "$FRESH_IMPLEMENTATION"
          test "$PRIMARY_SEAL" = "$FRESH_SEAL"
          echo "ISSUE618_IMPLEMENTATION_SEAL_V1=PASS"
