name: tmp Issue 618 ridge evaluator format

on:
  push:
    branches:
      - research/issue618-ridge-economic-gate-impl
    paths:
      - .github/workflows/tmp-issue618-ridge-evaluator-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue618-ridge-economic-gate-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only
        run: |
          uv run ruff check --fix tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          uv run ruff format tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          git commit -m 'style: format ridge evaluator RED test'
          git push origin HEAD:research/issue618-ridge-economic-gate-impl
