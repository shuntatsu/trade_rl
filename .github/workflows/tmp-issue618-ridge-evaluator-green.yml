name: tmp Issue 618 ridge evaluator GREEN

on:
  push:
    branches:
      - research/issue618-ridge-economic-gate-impl
    paths:
      - .github/workflows/tmp-issue618-ridge-evaluator-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue618-ridge-economic-gate-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format and targeted verification
        run: |
          set -euo pipefail
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/runs/__init__.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
            tests/architecture/test_runs_capability_facade.py
          uv run ruff format \
            trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/runs/__init__.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
            tests/architecture/test_runs_capability_facade.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
            tests/strategies/test_ridge_economic_gate.py \
            tests/architecture/test_runs_capability_facade.py \
            tests/architecture/test_lean_evaluation_layout.py \
            tests/evaluation/test_single_symbol_replay.py
          git diff --check
      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py \
              trade_rl/evaluation/runs/execute.py \
              trade_rl/evaluation/runs/__init__.py \
              tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
              tests/architecture/test_runs_capability_facade.py
            git commit -m 'style: format ridge economic gate evaluator'
            git push origin HEAD:research/issue618-ridge-economic-gate-impl
          fi
