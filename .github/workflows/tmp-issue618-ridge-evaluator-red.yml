name: tmp Issue 618 ridge evaluator RED

on:
  push:
    branches:
      - research/issue618-ridge-economic-gate-impl
    paths:
      - tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
      - .github/workflows/tmp-issue618-ridge-evaluator-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue618-ridge-economic-gate-impl
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static gates before RED
        run: |
          uv run ruff check tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          uv run ruff format --check tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
          uv run mypy trade_rl
      - name: Observe semantic RED
        run: uv run pytest -q tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py
