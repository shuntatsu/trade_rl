name: tmp Issue 618 ridge wrapper semantic RED verify

on:
  push:
    branches:
      - verify/issue618-ridge-wrapper-red
    paths:
      - .github/workflows/tmp-issue618-ridge-wrapper-red-verify.yml

permissions:
  contents: read

env:
  TARGET_SHA: d45fbba87643f4c46d27d6c0e63d458d087b3b91
  TARGET_TEST: tests/strategies/test_ridge_economic_gate.py

jobs:
  verify_red:
    name: Issue 618 ridge wrapper semantic RED oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Bind exact RED head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static gates must already be green
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check "$TARGET_TEST"
          uv run ruff format --check "$TARGET_TEST"
      - name: Require missing-wrapper semantic RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q "$TARGET_TEST" >/tmp/pytest.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "ModuleNotFoundError: No module named 'trade_rl.strategies.forecasts.ridge_economic_gate'" /tmp/pytest.out >/dev/null
          ! grep -E '^FAILED ' /tmp/pytest.out >/dev/null
          echo ISSUE618_RIDGE_WRAPPER_SEMANTIC_RED=PASS

# rerun on exact formatted RED head
