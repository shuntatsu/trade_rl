name: tmp Issue 618 validation authority fix

on:
  push:
    branches:
      - research/issue618-ridge-economic-gate-impl
    paths:
      - .github/workflows/tmp-issue618-validation-authority-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue618-ridge-economic-gate-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Replace duplicate SHA validator with repository authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py')
          s = p.read_text()
          marker = 'from trade_rl.artifacts.hashing import content_digest\n'
          replacement = marker + 'from trade_rl._validation import require_sha256\n'
          if marker not in s:
              raise SystemExit('import marker missing')
          s = s.replace(marker, replacement, 1)
          start = s.find('\ndef _require_hex(')
          end = s.find('\n\ndef _json_value', start)
          if start < 0 or end < 0:
              raise SystemExit('duplicate validator block missing')
          s = s[:start] + s[end:]
          s = s.replace('_require_hex(', 'require_sha256(')
          p.write_text(s)
          PY
          uv run ruff check --fix trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation.py \
            tests/evaluation/experiments/bootstrap/test_ridge_economic_gate_evaluation_falsification.py \
            tests/architecture/test_runs_capability_facade.py
          git diff --check
      - name: Commit authority repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/experiments/bootstrap/ridge_economic_gate_evaluation.py
          git commit -m 'refactor: reuse canonical sha256 validation authority'
          git push origin HEAD:research/issue618-ridge-economic-gate-impl
