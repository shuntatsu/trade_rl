name: tmp Issue 621 docs and Guide refresh

on:
  push:
    branches:
      - feature/issue621-ppo-interleaved-training
    paths:
      - .github/workflows/tmp-issue621-docs-guide-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/issue621-ppo-interleaved-training
          fetch-depth: 1
      - name: Apply reviewed PPO training-layout documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lean = Path('docs/architecture/lean-core.md')
          text = lean.read_text()
          needle = '''Observation contractは暗黙のimplementation detailにしない。新規Candidate Runと新規Studyのresolved configはObservation schema、staleness利用、空のglobal rosterをsemantic identityへbindする。execution economics、reward、action、risk、PPO network architectureはObservation v2のpolicy inputへ追加しない。\n\n## StrategyとRiskの責任分離'''
          replacement = '''Observation contractは暗黙のimplementation detailにしない。新規Candidate Runと新規Studyのresolved configはObservation schema、staleness利用、空のglobal rosterをsemantic identityへbindする。execution economics、reward、action、risk、PPO network architectureはObservation v2のpolicy inputへ追加しない。\n\n### PPO training layout\n\n`fit_ppo_strategy` の既定は従来どおり `sequential` であり、単一 `PPOTradingEnv` がfit symbolをfull-window episode単位でround-robinする。既存Studyやcandidateがlayoutを明示しない場合の意味は変えない。\n\n`interleaved` は明示選択する学習layout capabilityである。fit symbolごとに同じ `PPOTradingEnv` を `symbol_indices=(その1銘柄,)` で固定して1個ずつ作り、in-process `DummyVecEnv` で同一policyへ束ねる。観測、reward、execution/accounting、hard risk、network、entropy係数、総 `total_timesteps` は変更しない。callerは `rollout_steps_per_env` を結果を見る前に明示し、`rollout_steps_per_env × env数` が既存PPO minibatch size 64で割り切れることを要求する。\n\nこのlayoutは学習sampleの並び方を変える実装能力であり、性能改善・profitability・winnerを意味しない。developmentで比較する場合は、exact layoutとrollout stepsを別Controlled Factorとして結果前にpreregisterする。\n\n## StrategyとRiskの責任分離'''
          if text.count(needle) != 1:
              raise SystemExit('lean-core PPO insertion point drifted')
          lean.write_text(text.replace(needle, replacement))

          status = Path('docs/research/current-status.md')
          text = status.read_text()
          needle = '''初回real-data M2のPPO Observation v2は、selected local feature values、availability / finite mask、normalized local staleness、current intent、current weightだけをこの順序で使う。symbol IDは含めない。Training episodeはfit symbolをround-robinし、各episodeは一つのactive symbolだけを扱う。\n\n現行datasetのglobal regimeは全dataset symbolから集計されるため、fit-symbol subset外の情報がtrainingへ混入しないよう初回M2のpolicy inputから除外した。Observation v2は空のglobal rosterをsemantic identityへ明示bindする。global contextは、fit-scope-safeなreference universeを事前固定できる場合にだけ別Controlled Factorとして検証する。'''
          replacement = '''初回real-data M2のPPO Observation v2は、selected local feature values、availability / finite mask、normalized local staleness、current intent、current weightだけをこの順序で使う。symbol IDは含めない。Training episodeはfit symbolをround-robinし、各episodeは一つのactive symbolだけを扱う。\n\n現行datasetのglobal regimeは全dataset symbolから集計されるため、fit-symbol subset外の情報がtrainingへ混入しないよう初回M2のpolicy inputから除外した。Observation v2は空のglobal rosterをsemantic identityへ明示bindする。global contextは、fit-scope-safeなreference universeを事前固定できる場合にだけ別Controlled Factorとして検証する。\n\nPPO fitの既定layoutは既存互換の`sequential`である。実装上はopt-inの`interleaved`も選べ、fit symbolごとのfixed-symbol `PPOTradingEnv`を`DummyVecEnv`へ束ね、明示した`rollout_steps_per_env`ごとに全envからrolloutを集める。これは学習sample schedulingだけを変えるunevaluated capabilityであり、Observation v2、reward、execution/accounting、hard risk、network、entropy係数、総timestepsを変更しない。現時点でinterleavedがbetter performanceやprofitabilityを示した証拠はなく、development比較にはexact layout/rollout stepsを別途result-blind preregisterする必要がある。'''
          if text.count(needle) != 1:
              raise SystemExit('current-status PPO insertion point drifted')
          status.write_text(text.replace(needle, replacement))

          page = Path('guide/content/pages/implementation-ppo.md')
          text = page.read_text()
          needle = '''初回canonical M2のpolicy inputにはsymbol IDやdataset-global aggregateを入れません。\n\n## 学習stepの全体像'''
          replacement = '''初回canonical M2のpolicy inputにはsymbol IDやdataset-global aggregateを入れません。\n\n## 学習時の銘柄スケジュールは2方式\n\n`fit_ppo_strategy`の既定は従来どおり`sequential`です。1つの`PPOTradingEnv`がfit対象銘柄をfull-window episodeごとにround-robinするため、既存のStudyやcandidateの意味は変わりません。\n\n`interleaved`は明示的に選ぶ別layoutです。fit対象の各銘柄について1銘柄だけに固定した同じ`PPOTradingEnv`を1個ずつ作り、`DummyVecEnv`で同じPPO policyへ渡します。`rollout_steps_per_env`はcallerが明示し、全envを合わせたrollout sample数がminibatch size 64で割り切れなければfail closedにします。`total_timesteps`、Observation v2、reward、hard risk、約定・会計、network、entropy係数は変えません。\n\n```text\nsequential（既定）\n  1つのenv: BTC full window → ETH full window → ...\n\ninterleaved（opt-in）\n  BTC固定env ─┐\n  ETH固定env ─┼─ DummyVecEnv → 同じPPO policy update\n  ...         ─┘\n```\n\nこれは学習データの並べ方を変える**未評価の実装能力**です。interleavedの方が儲かる、seed安定性が改善する、productionに適する、という結論はまだありません。developmentで比較するときはlayoutと`rollout_steps_per_env`を結果を見る前に別実験として固定します。\n\n## 学習stepの全体像'''
          if text.count(needle) != 1:
              raise SystemExit('Guide PPO insertion point drifted')
          page.write_text(text.replace(needle, replacement))

          meta_path = Path('guide/content/meta/implementation-ppo.json')
          meta = json.loads(meta_path.read_text())
          meta['summary'] = 'PPO Observation v2の5区分、sequential/interleaved学習layout、環境step内のhard riskと約定、学習後のPPOIntentStrategyまでを実装と対応付けて追います。'
          for keyword in ('training_layout', 'sequential', 'interleaved', 'DummyVecEnv'):
              if keyword not in meta['keywords']:
                  meta['keywords'].append(keyword)
          fit = next(item for item in meta['code_references'] if item['id'] == 'fit-ppo')
          fit['description_ja'] = '既定のsequential学習を保持しつつ、明示時だけfit銘柄ごとのfixed-symbol環境をDummyVecEnvへ束ねるinterleaved学習layoutを構成し、同じObservation・reward・execution/risk契約でstable-baselines3のPPOを学習します。'
          fit['variables'] = [
              {
                  'name': 'training_layout',
                  'label_ja': '学習時の銘柄スケジュール',
                  'description_ja': '既定のsequentialか、fit銘柄を同じpolicy updateへ混ぜるinterleavedかを明示します。',
              },
              {
                  'name': 'rollout_steps_per_env',
                  'label_ja': '各固定銘柄envのrollout長',
                  'description_ja': 'interleaved時だけcallerが明示する各envのn_stepsです。結果から自動選択しません。',
              },
              {
                  'name': 'env',
                  'label_ja': 'PPOへ渡す学習環境',
                  'description_ja': 'sequentialでは単一PPOTradingEnv、interleavedではfixed-symbol環境を束ねたDummyVecEnvです。',
              },
          ]
          fit['tests'] = [
              'tests/strategies/test_ppo_intent.py',
              'tests/strategies/test_ppo_interleaved_training.py',
          ]
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n')
          PY
          python3 guide/tools/content_contract.py --refresh implementation-ppo
          python3 guide/tools/content_contract.py --refresh-code implementation-ppo
          python3 guide/tools/content_contract.py --check
      - name: Commit reviewed docs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-issue621-docs-guide-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/lean-core.md docs/research/current-status.md guide/content/pages/implementation-ppo.md guide/content/meta/implementation-ppo.json
          git diff --cached --check
          git commit -m 'docs: explain PPO interleaved training layout'
          git push origin HEAD:feature/issue621-ppo-interleaved-training
