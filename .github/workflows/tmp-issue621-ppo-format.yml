name: tmp Issue 621 PPO formatter

on:
  push:
    branches:
      - feature/issue621-ppo-interleaved-training
    paths:
      - .github/workflows/tmp-issue621-ppo-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/issue621-ppo-interleaved-training
          fetch-depth: 1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only PPO implementation and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/strategies/rl/ppo.py
          git rm .github/workflows/tmp-issue621-ppo-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/strategies/rl/ppo.py
          git diff --cached --check
          git commit -m 'style: format Issue 621 PPO implementation'
          git push origin HEAD:feature/issue621-ppo-interleaved-training
