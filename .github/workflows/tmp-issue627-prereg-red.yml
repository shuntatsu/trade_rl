name: tmp Issue 627 prereg semantic RED

on:
  push:
    branches:
      - verify/issue627-prereg-red
    paths:
      - .github/workflows/tmp-issue627-prereg-red.yml

permissions:
  contents: read

env:
  TARGET_HEAD: 0406c99108b9b2a616d7841591c52d565715e33d
  TEST_FILE: tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg.py

jobs:
  semantic-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static gates must be green
        run: |
          set -euo pipefail
          uv run ruff check "$TEST_FILE"
          uv run ruff format --check "$TEST_FILE"
      - name: Require missing-production-module semantic RED
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q "$TEST_FILE" >/tmp/red.out 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F "No module named 'trade_rl.evaluation.experiments.bootstrap.ridge_shared_cash_prereg'" /tmp/red.out >/dev/null
          echo ISSUE627_SEMANTIC_RED=PASS
