name: tmp Issue 627 prereg v2 final verification

on:
  push:
    branches:
      - verify/issue627-shared-cash-prereg-v2-final
    paths:
      - .github/workflows/tmp-issue627-prereg-v2-final.yml

permissions:
  contents: read
  pull-requests: read

env:
  TARGET: 6615e30773cd3035a3f2e67e608aef2afc4e143c
  BASE: d18434799651cfc6c07e0840c40600dcf1dfa763

jobs:
  core:
    name: Exact Lean Core v2
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact head and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET"
          git cat-file -e "$BASE^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE...$TARGET")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' \
            tests/evaluation/experiments/bootstrap/test_ridge_shared_cash_prereg.py \
            trade_rl/evaluation/experiments/bootstrap/ridge_shared_cash_prereg.py | sort > /tmp/expected
          cmp /tmp/expected /tmp/changed
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check trade_rl tests tools
      - run: uv run ruff format --check trade_rl tests tools
      - run: uv run mypy trade_rl
      - run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - run: uv run pytest -q tests
      - run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          from trade_rl.evaluation.experiments.bootstrap.ridge_shared_cash_prereg import canonical_ridge_shared_cash_protocol
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          protocol = canonical_ridge_shared_cash_protocol()
          assert protocol.execution_overlay == "zero_overlay_dataset_fields_authoritative_previous_completed_bar_capacity"
          assert protocol.schema_version == "ridge_shared_cash_prereg_v2"
          PY

  guide:
    name: Exact Human Guide v2
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GUIDE_SOURCE_REV: 6615e30773cd3035a3f2e67e608aef2afc4e143c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$TARGET"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - working-directory: guide
        run: npm ci
      - working-directory: guide
        run: npm run source-check
      - working-directory: guide
        run: npm run lint
      - working-directory: guide
        run: npm run typecheck
      - working-directory: guide
        run: npm run test
      - working-directory: guide
        run: npm run build
      - working-directory: guide
        run: npx playwright install --with-deps chromium
      - working-directory: guide
        run: npm run e2e

  pr-authority:
    name: Draft PR v2 authority
    runs-on: ubuntu-24.04
    steps:
      - name: Bind PR 628
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api repos/$GITHUB_REPOSITORY/pulls/628)"
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = true
          test "$(jq -r .head.sha <<<"$pr")" = "$TARGET"
          test "$(jq -r .base.sha <<<"$pr")" = "$BASE"
