name: tmp Issue 629 final verification

on:
  push:
    branches:
      - verify/issue629-ppo-interleaved-prereg-final
    paths:
      - .github/workflows/tmp-issue629-final-verification.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-core:
    name: Exact Lean Core
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout immutable preregistration head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1187dacae78e679a322cc53cbf03f3371f457b1
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact ancestry and durable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f1187dacae78e679a322cc53cbf03f3371f457b1"
          git fetch origin \
            d18434799651cfc6c07e0840c40600dcf1dfa763 \
            cddef3532dd582d0f1066a61006f64265f0cabbe
          test "$(git merge-base d18434799651cfc6c07e0840c40600dcf1dfa763 cddef3532dd582d0f1066a61006f64265f0cabbe)" = "d18434799651cfc6c07e0840c40600dcf1dfa763"
          test "$(git merge-base cddef3532dd582d0f1066a61006f64265f0cabbe HEAD)" = "cddef3532dd582d0f1066a61006f64265f0cabbe"
          mapfile -t files < <(git diff --name-only cddef3532dd582d0f1066a61006f64265f0cabbe...HEAD)
          test "${#files[@]}" -eq 3
          test "${files[0]}" = "tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py"
          test "${files[1]}" = "tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg_hardening.py"
          test "${files[2]}" = "trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py"
          ! printf '%s\n' "${files[@]}" | grep '^\.github/workflows/'
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check trade_rl tests tools
      - run: uv run ruff format --check trade_rl tests tools
      - run: uv run mypy trade_rl
      - run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - run: uv run pytest -q tests
      - run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help
      - name: Package identity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

  exact-guide:
    name: Exact Human Guide
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GUIDE_SOURCE_REV: f1187dacae78e679a322cc53cbf03f3371f457b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f1187dacae78e679a322cc53cbf03f3371f457b1
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "f1187dacae78e679a322cc53cbf03f3371f457b1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - working-directory: guide
        run: npm ci
      - working-directory: guide
        run: npm run source-check
      - working-directory: guide
        run: npm run lint
      - working-directory: guide
        run: npm run typecheck
      - working-directory: guide
        run: npm run test
      - working-directory: guide
        run: npm run build
      - working-directory: guide
        run: npx playwright install --with-deps chromium
      - working-directory: guide
        run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue629-prereg-guide-${{ github.run_id }}
          path: |
            guide/test-results/
            guide/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  pr-authority:
    name: Draft PR authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bind stacked Draft PR without economic evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          request=urllib.request.Request(
              'https://api.github.com/repos/shuntatsu/trade_rl/pulls/631',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              pr=json.load(response)
          assert pr['state']=='open'
          assert pr['draft'] is True
          assert pr['base']['ref']=='feature/issue621-ppo-interleaved-training'
          assert pr['base']['sha']=='cddef3532dd582d0f1066a61006f64265f0cabbe'
          assert pr['head']['ref']=='research/issue629-ppo-interleaved-prereg'
          assert pr['head']['sha']=='f1187dacae78e679a322cc53cbf03f3371f457b1'
          PY
