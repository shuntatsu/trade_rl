name: tmp Issue 629 prereg GREEN

on:
  push:
    branches:
      - research/issue629-ppo-interleaved-prereg
    paths:
      - .github/workflows/tmp-issue629-prereg-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue629-ppo-interleaved-prereg
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Focused GREEN and falsification
        run: |
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg_hardening.py
          uv run ruff format \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg_hardening.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg_hardening.py \
            tests/strategies/test_ppo_interleaved_training.py
          git diff --check
      - name: Commit formatter-only changes if needed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg_hardening.py
          git diff --cached --quiet || git commit -m 'style: format PPO interleaved preregistration hardening'
          git push origin HEAD:research/issue629-ppo-interleaved-prereg
