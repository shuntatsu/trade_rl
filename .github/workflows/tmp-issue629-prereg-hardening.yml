name: tmp Issue 629 prereg hardening

on:
  push:
    branches:
      - research/issue629-ppo-interleaved-prereg
    paths:
      - .github/workflows/tmp-issue629-prereg-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue629-ppo-interleaved-prereg
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Freeze exact StudyPlan PPO identities and adversarial boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py')
          text = module.read_text()
          constants_marker = '_SYMBOLS = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT")\n_PPO_SEEDS = (0, 1, 2, 3, 4)\n'
          constants_replacement = '''_SYMBOLS = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "ADAUSDT")
_FEATURE_NAMES = (
    "1h__log_return_1bar",
    "1h__log_return_4bar",
    "1h__log_return_24bar",
    "1h__realized_volatility_24bar",
    "1h__volume_zscore_24bar",
    "1h__funding_bps",
    "1h__rsi_14bar",
    "1h__macd_histogram_12_26_9",
    "4h__log_return_4bar",
    "4h__realized_volatility_24bar",
    "1d__log_return_1bar",
    "1d__realized_volatility_24bar",
)
_FEATURE_INDICES = (0, 1, 2, 4, 5, 6, 7, 10, 60, 63, 114, 118)
_PPO_SEEDS = (0, 1, 2, 3, 4)
'''
          if constants_marker not in text:
              raise SystemExit('constants marker missing')
          text = text.replace(constants_marker, constants_replacement, 1)
          fields_marker = '''    symbols: tuple[str, ...] = _SYMBOLS
    fit_cutoff: str = "2023-01-01T00:00:00Z"
'''
          fields_replacement = '''    symbols: tuple[str, ...] = _SYMBOLS
    feature_names: tuple[str, ...] = _FEATURE_NAMES
    feature_indices: tuple[int, ...] = _FEATURE_INDICES
    fit_symbol_names: tuple[str, ...] = _SYMBOLS
    gross_budget: float = 0.5
    initial_capital: float = 100_000.0
    slippage_std: float = 0.0
    fit_cutoff: str = "2023-01-01T00:00:00Z"
'''
          if fields_marker not in text:
              raise SystemExit('fields marker missing')
          module.write_text(text.replace(fields_marker, fields_replacement, 1))

          test = Path('tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py')
          tests = test.read_text()
          identity_marker = '    assert protocol.ppo_seeds == (0, 1, 2, 3, 4)\n    assert protocol.ppo_total_timesteps == 100_000\n'
          identity_replacement = '''    assert protocol.feature_names == (
        "1h__log_return_1bar",
        "1h__log_return_4bar",
        "1h__log_return_24bar",
        "1h__realized_volatility_24bar",
        "1h__volume_zscore_24bar",
        "1h__funding_bps",
        "1h__rsi_14bar",
        "1h__macd_histogram_12_26_9",
        "4h__log_return_4bar",
        "4h__realized_volatility_24bar",
        "1d__log_return_1bar",
        "1d__realized_volatility_24bar",
    )
    assert protocol.feature_indices == (0, 1, 2, 4, 5, 6, 7, 10, 60, 63, 114, 118)
    assert protocol.fit_symbol_names == protocol.symbols
    assert protocol.gross_budget == 0.5
    assert protocol.initial_capital == 100_000.0
    assert protocol.slippage_std == 0.0
    assert protocol.ppo_seeds == (0, 1, 2, 3, 4)
    assert protocol.ppo_total_timesteps == 100_000
'''
          if identity_marker not in tests:
              raise SystemExit('identity test marker missing')
          tests = tests.replace(identity_marker, identity_replacement, 1)
          immutability_marker = '''    with pytest.raises(ValueError, match="ppo_total_timesteps"):
        replace(protocol, ppo_total_timesteps=120_000)
'''
          immutability_replacement = '''    with pytest.raises(ValueError, match="ppo_total_timesteps"):
        replace(protocol, ppo_total_timesteps=120_000)
    with pytest.raises(ValueError, match="feature_indices"):
        replace(protocol, feature_indices=(0, 1))
    with pytest.raises(ValueError, match="gross_budget"):
        replace(protocol, gross_budget=0.6)
    with pytest.raises(ValueError, match="slippage_std"):
        replace(protocol, slippage_std=0.0001)
'''
          if immutability_marker not in tests:
              raise SystemExit('immutability marker missing')
          tests = tests.replace(immutability_marker, immutability_replacement, 1)
          loader_marker = '\n\ndef test_loader_requires_exact_canonical_protocol_bytes(tmp_path: Path) -> None:\n'
          boundary_test = '''

def test_decision_rule_uses_strict_zero_boundaries_and_no_termination() -> None:
    common = dict(
        evidence_valid=True,
        positive_factor_effect_symbols=5,
        cross_symbol_median_factor_effect=0.01,
        positive_seed_median_excess=5,
        new_termination_cells=0,
        cross_symbol_median_candidate_return=0.02,
        positive_seed_candidate_medians=5,
        drawdown_nonworse_symbols=5,
    )

    assert classify_ppo_interleaved_evaluation(
        **{**common, "cross_symbol_median_factor_effect": 0.0}
    ) == "KEEP_SEQUENTIAL_BASELINE"
    assert classify_ppo_interleaved_evaluation(
        **{**common, "new_termination_cells": 1}
    ) == "KEEP_SEQUENTIAL_BASELINE"
    assert classify_ppo_interleaved_evaluation(
        **{**common, "cross_symbol_median_candidate_return": 0.0}
    ) == "PROMOTE_RESEARCH_REFERENCE_ONLY"
    assert classify_ppo_interleaved_evaluation(
        **{**common, "positive_seed_candidate_medians": 3}
    ) == "PROMOTE_RESEARCH_REFERENCE_ONLY"
    assert classify_ppo_interleaved_evaluation(
        **{**common, "drawdown_nonworse_symbols": 3}
    ) == "PROMOTE_RESEARCH_REFERENCE_ONLY"
'''
          if loader_marker not in tests:
              raise SystemExit('loader marker missing')
          test.write_text(tests.replace(loader_marker, boundary_test + loader_marker, 1))
          PY
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
          uv run ruff format \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py \
            tests/strategies/test_ppo_interleaved_training.py
          git diff --check
      - name: Commit hardened authority
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation_prereg.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
          git commit -m 'test: harden PPO interleaved preregistration authority'
          git push origin HEAD:research/issue629-ppo-interleaved-prereg
