name: tmp Issue 629 prereg RED

on:
  push:
    branches:
      - research/issue629-ppo-interleaved-prereg
    paths:
      - .github/workflows/tmp-issue629-prereg-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue629-ppo-interleaved-prereg
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static gates before semantic RED
        run: |
          uv run ruff check tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
          uv run ruff format --check tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
          uv run mypy trade_rl
      - name: Observe missing preregistration authority
        run: uv run pytest -q tests/evaluation/experiments/test_ppo_interleaved_evaluation_prereg.py
