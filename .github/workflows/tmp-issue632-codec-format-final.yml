name: tmp Issue 632 codec format final

on:
  push:
    branches:
      - automation/issue632-codec-format-final
    paths:
      - .github/workflows/tmp-issue632-codec-format-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue632-codec-format-final
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format codec only
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/evaluation/experiments/ppo_interleaved_evidence_codec.py
          uv run ruff check trade_rl/evaluation/experiments/ppo_interleaved_evidence_codec.py
          uv run ruff format --check trade_rl/evaluation/experiments/ppo_interleaved_evidence_codec.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/evaluation/experiments/ppo_interleaved_evidence_codec.py
          git commit -m 'style: format Issue 632 evidence codec'
          git push origin HEAD:automation/issue632-codec-format-final
