name: tmp Issue 632 constructor type RED

on:
  push:
    branches:
      - verify/issue632-constructor-type-red
    paths:
      - .github/workflows/tmp-issue632-constructor-type-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verify/issue632-constructor-type-red
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static checks
        run: |
          uv run ruff check tests/evaluation/experiments/test_ppo_interleaved_direct_constructor_hardening.py
          uv run ruff format --check tests/evaluation/experiments/test_ppo_interleaved_direct_constructor_hardening.py
          uv run mypy tests/evaluation/experiments/test_ppo_interleaved_direct_constructor_hardening.py
      - name: Semantic RED
        run: uv run pytest -q tests/evaluation/experiments/test_ppo_interleaved_direct_constructor_hardening.py
