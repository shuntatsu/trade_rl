name: tmp Issue 632 evaluator GREEN

on:
  push:
    branches:
      - research/issue632-ppo-interleaved-evaluator-impl
    paths:
      - .github/workflows/tmp-issue632-evaluator-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue632-ppo-interleaved-evaluator-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/runs/__init__.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation.py \
            tests/architecture/test_runs_capability_facade.py
          uv run ruff format \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/runs/__init__.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation.py \
            tests/architecture/test_runs_capability_facade.py
          uv run mypy trade_rl
          uv run pytest -q \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation.py \
            tests/architecture/test_runs_capability_facade.py \
            tests/strategies/test_ppo_interleaved_training.py \
            tests/evaluation/test_single_symbol_replay.py
          git diff --check
      - name: Commit formatter-only changes if GREEN
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            trade_rl/evaluation/experiments/ppo_interleaved_evaluation.py \
            trade_rl/evaluation/runs/execute.py \
            trade_rl/evaluation/runs/__init__.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation.py \
            tests/architecture/test_runs_capability_facade.py
          git diff --cached --quiet || git commit -m 'style: format PPO interleaved evaluator implementation'
          git push origin HEAD:research/issue632-ppo-interleaved-evaluator-impl
