name: tmp Issue 632 evaluator test format

on:
  push:
    branches:
      - research/issue632-ppo-interleaved-evaluator-impl
    paths:
      - .github/workflows/tmp-issue632-evaluator-test-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue632-ppo-interleaved-evaluator-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: |
          uv run ruff check --fix tests/evaluation/experiments/test_ppo_interleaved_evaluation.py
          uv run ruff format tests/evaluation/experiments/test_ppo_interleaved_evaluation.py
      - name: Commit formatter-only changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/experiments/test_ppo_interleaved_evaluation.py
          git diff --cached --quiet || git commit -m 'style: format PPO interleaved evaluator RED test'
          git push origin HEAD:research/issue632-ppo-interleaved-evaluator-impl
