name: tmp Issue 632 evaluator type fix v2
on:
  push:
    branches: [research/issue632-ppo-interleaved-evaluator-impl]
    paths: [.github/workflows/tmp-issue632-evaluator-type-fix-v2.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue632-ppo-interleaved-evaluator-impl
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Apply type-only repair
        shell: bash
        run: |
          set -euo pipefail
          p=trade_rl/evaluation/experiments/ppo_interleaved_evaluation.py
          sed -i 's/from typing import Any, Literal/from typing import Any, Literal, cast/' "$p"
          sed -i '/from trade_rl.strategies.controls import ConstantIntentStrategy/a from trade_rl.strategies.interface import SingleSymbolStrategy' "$p"
          sed -i 's/for label, actual, expected in zip(/for label, actual, expected_flag in zip(/' "$p"
          sed -i 's/if actual is not expected:/if actual is not expected_flag:/' "$p"
          sed -i 's/^    strategies = {$/    strategies: dict[str, SingleSymbolStrategy] = {/' "$p"
          sed -i 's/^        arm=arm,$/        arm=cast(Arm, arm),/' "$p"
          uv run ruff check --fix "$p" trade_rl/evaluation/runs/execute.py trade_rl/evaluation/runs/__init__.py tests/evaluation/experiments/test_ppo_interleaved_evaluation.py tests/architecture/test_runs_capability_facade.py
          uv run ruff format "$p" trade_rl/evaluation/runs/execute.py trade_rl/evaluation/runs/__init__.py tests/evaluation/experiments/test_ppo_interleaved_evaluation.py tests/architecture/test_runs_capability_facade.py
          uv run mypy trade_rl
          uv run pytest -q tests/evaluation/experiments/test_ppo_interleaved_evaluation.py tests/architecture/test_runs_capability_facade.py tests/strategies/test_ppo_interleaved_training.py tests/evaluation/test_single_symbol_replay.py
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trade_rl/evaluation/experiments/ppo_interleaved_evaluation.py trade_rl/evaluation/runs/execute.py trade_rl/evaluation/runs/__init__.py tests/evaluation/experiments/test_ppo_interleaved_evaluation.py tests/architecture/test_runs_capability_facade.py
          git commit -m 'fix: type PPO interleaved evaluator boundaries'
          git push origin HEAD:research/issue632-ppo-interleaved-evaluator-impl
