name: tmp Issue 634 format helper

on:
  push:
    branches:
      - prepare/issue634-shared-cash-runner-v1
    paths:
      - .github/workflows/tmp-issue634-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: prepare/issue634-shared-cash-runner-v1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Apply repository formatter only
        run: |
          set -euo pipefail
          uv run ruff format .github/scripts/issue634_shared_cash_runner.py
          uv run ruff check .github/scripts/issue634_shared_cash_runner.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/issue634_shared_cash_runner.py
          git commit -m 'style: format Issue 634 runner helper'
          git push origin HEAD:prepare/issue634-shared-cash-runner-v1
