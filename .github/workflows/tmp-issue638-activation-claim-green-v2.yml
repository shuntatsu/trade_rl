name: tmp Issue 638 activation claim GREEN v2

on:
  push:
    branches:
      - automation/issue638-activation-claim-green-v1
    paths:
      - .github/workflows/tmp-issue638-activation-claim-green-v2.yml

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout activation RED branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue638-activation-claim-green-v1
          path: source
          fetch-depth: 0
      - name: Apply same minimal activation-claim implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/.github/scripts/issue638_ppo_baseline_runner.py')
          s=p.read_text()
          s=s.replace(
              'RESULT_PREFIX = "issue638-ppo-sequential-baseline-seed-"\nFRESH_PREFIX = "issue638-ppo-sequential-baseline-fresh-seed-"\n',
              'RESULT_PREFIX = "issue638-ppo-sequential-baseline-seed-"\nFRESH_PREFIX = "issue638-ppo-sequential-baseline-fresh-seed-"\nACTIVATION_PREFIX = "issue638-ppo-sequential-baseline-activation-seed-"\n',
          )
          anchor='''def _fresh_name(seed: int) -> str:\n    return f"{FRESH_PREFIX}{seed}-v1"\n\n\ndef authority_check(*, seed: object, slot: str) -> None:\n'''
          replacement='''def _fresh_name(seed: int) -> str:\n    return f"{FRESH_PREFIX}{seed}-v1"\n\n\ndef _activation_name(seed: int) -> str:\n    return f"{ACTIVATION_PREFIX}{seed}-v1"\n\n\ndef _validate_sha40(value: object, *, label: str) -> str:\n    if (\n        not isinstance(value, str)\n        or len(value) != 40\n        or value != value.lower()\n        or any(ch not in "0123456789abcdef" for ch in value)\n    ):\n        raise ValueError(f"{label} must be a lowercase 40-character git SHA")\n    return value\n\n\ndef activation_claim_bytes(\n    *, seed: object, run_id: object, run_attempt: object, helper_head: object, helper_blob_sha: object\n) -> bytes:\n    canonical_seed = _validate_seed(seed)\n    if isinstance(run_id, bool) or not isinstance(run_id, int) or run_id <= 0:\n        raise ValueError("run_id must be a positive integer")\n    if type(run_attempt) is not int or run_attempt != 1:\n        raise ValueError("run_attempt must be exactly 1")\n    canonical_head = _validate_sha40(helper_head, label="helper_head")\n    canonical_blob = _validate_sha40(helper_blob_sha, label="helper_blob_sha")\n    return _canonical({\n        "schema_version": "issue638_ppo_sequential_baseline_activation_v1",\n        "issue_number": ISSUE_NUMBER, "seed": canonical_seed,\n        "workflow_run_id": run_id, "workflow_run_attempt": run_attempt,\n        "helper_head": canonical_head, "helper_blob_sha": canonical_blob,\n        "arm": "baseline", "training_layout": "sequential",\n        "rollout_steps_per_env": None, "caller_total_timesteps": 100_000,\n        "evaluator_started_at_claim": False, "real_dataset_loaded_at_claim": False,\n        "result_artifact_published_at_claim": False, "candidate_training_authorized": False,\n        "economic_result_interpreted": False, "final_test_accessed": False,\n        "production_eligible": False, "live_trading_authorized": False, "merge_authorized": False,\n    })\n\n\ndef _validate_slot_state(\n    *, slot: str, activation_count: int, result_count: int, fresh_count: int\n) -> None:\n    if slot not in {"empty", "claimed", "published"}:\n        raise ValueError("slot must be empty, claimed, or published")\n    counts = (activation_count, result_count, fresh_count)\n    if any(isinstance(value, bool) or not isinstance(value, int) or value < 0 for value in counts):\n        raise SystemExit("Issue 638 Artifact slot counts are invalid")\n    expected = {"empty": (0, 0, 0), "claimed": (1, 0, 0), "published": (1, 1, 0)}[slot]\n    if counts != expected:\n        raise SystemExit(f"Issue 638 seed Artifact slot state differs from {slot}")\n\n\ndef authority_check(*, seed: object, slot: str) -> None:\n'''
          if anchor not in s: raise SystemExit('activation insertion anchor drift')
          s=s.replace(anchor,replacement)
          s=s.replace(
              '    if slot not in {"empty", "published"}:\n        raise ValueError("slot must be empty or published")\n',
              '    if slot not in {"empty", "claimed", "published"}:\n        raise ValueError("slot must be empty, claimed, or published")\n',
          )
          old='''    result_count = _artifact_count(_result_name(canonical_seed))\n    fresh_count = _artifact_count(_fresh_name(canonical_seed))\n    if slot == "empty" and (result_count != 0 or fresh_count != 0):\n        raise SystemExit("Issue 638 seed Artifact slot is already consumed")\n    if slot == "published" and (result_count != 1 or fresh_count != 0):\n        raise SystemExit(\n            "Issue 638 fresh verification requires exactly one seed result"\n        )\n'''
          new='''    activation_count = _artifact_count(_activation_name(canonical_seed))\n    result_count = _artifact_count(_result_name(canonical_seed))\n    fresh_count = _artifact_count(_fresh_name(canonical_seed))\n    _validate_slot_state(slot=slot, activation_count=activation_count, result_count=result_count, fresh_count=fresh_count)\n'''
          if old not in s: raise SystemExit('slot state anchor drift')
          s=s.replace(old,new)
          s=s.replace('    authority_check(seed=canonical_seed, slot="empty")\n    dataset = _validate_downloaded_authorities(', '    authority_check(seed=canonical_seed, slot="claimed")\n    dataset = _validate_downloaded_authorities(', 1)
          anchor2='''def verify_seed(*, seed: object, published: Path, output: Path) -> None:\n'''
          claim='''def claim_seed(\n    *, seed: object, run_id: object, run_attempt: object, helper_head: object, helper_blob_sha: object, output: Path\n) -> None:\n    canonical_seed = _validate_seed(seed)\n    authority_check(seed=canonical_seed, slot="empty")\n    raw = activation_claim_bytes(seed=canonical_seed, run_id=run_id, run_attempt=run_attempt, helper_head=helper_head, helper_blob_sha=helper_blob_sha)\n    output.parent.mkdir(parents=True, exist_ok=True)\n    if output.exists():\n        raise FileExistsError(output)\n    output.write_bytes(raw)\n    print(f"ISSUE638_BASELINE_SEED_{canonical_seed}_ACTIVATION_CLAIM_WRITTEN=true")\n    print("REAL_DATASET_LOADED=false")\n    print("PPO_TRAINING_PERFORMED=false")\n    print("CANDIDATE_TRAINING_AUTHORIZED=false")\n\n\n'''
          if anchor2 not in s: raise SystemExit('claim function anchor drift')
          s=s.replace(anchor2,claim+anchor2)
          s=s.replace('    authority.add_argument("--slot", choices=("empty", "published"), required=True)\n\n    publish = subparsers.add_parser("publish-seed")\n', '    authority.add_argument("--slot", choices=("empty", "claimed", "published"), required=True)\n\n    claim = subparsers.add_parser("claim-seed")\n    claim.add_argument("--seed", type=int, required=True)\n    claim.add_argument("--run-id", type=int, required=True)\n    claim.add_argument("--run-attempt", type=int, required=True)\n    claim.add_argument("--helper-head", required=True)\n    claim.add_argument("--helper-blob-sha", required=True)\n    claim.add_argument("--output", type=Path, required=True)\n\n    publish = subparsers.add_parser("publish-seed")\n')
          s=s.replace('    if args.command == "authority-check":\n        authority_check(seed=args.seed, slot=args.slot)\n    elif args.command == "publish-seed":\n', '    if args.command == "authority-check":\n        authority_check(seed=args.seed, slot=args.slot)\n    elif args.command == "claim-seed":\n        claim_seed(seed=args.seed, run_id=args.run_id, run_attempt=args.run_attempt, helper_head=args.helper_head, helper_blob_sha=args.helper_blob_sha, output=args.output)\n    elif args.command == "publish-seed":\n')
          p.write_text(s)
          PY
      - name: Checkout exact sealed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 97127952af3d01b71def695a4c8043eb301b2a33
          path: impl
          persist-credentials: false
      - name: Overlay patched helper and RED tests on evaluator
        run: |
          mkdir -p impl/.github/scripts impl/tests/tools
          cp source/.github/scripts/issue638_ppo_baseline_runner.py impl/.github/scripts/issue638_ppo_baseline_runner.py
          cp source/tests/tools/test_issue638_ppo_baseline_runner.py impl/tests/tools/test_issue638_ppo_baseline_runner.py
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - working-directory: impl
        run: uv sync --extra dev
      - name: Static and activation GREEN on sealed evaluator
        working-directory: impl
        run: |
          set -euo pipefail
          uv run ruff check --fix .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          uv run ruff format .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          uv run ruff check .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          uv run ruff format --check .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          uv run mypy .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          uv run pytest -q tests/tools/test_issue638_ppo_baseline_runner.py \
            tests/evaluation/experiments/test_ppo_interleaved_evaluation.py \
            tests/evaluation/experiments/test_ppo_interleaved_evidence_codec.py
      - name: Copy canonical formatted source/tests back
        run: |
          cp impl/.github/scripts/issue638_ppo_baseline_runner.py source/.github/scripts/issue638_ppo_baseline_runner.py
          cp impl/tests/tools/test_issue638_ppo_baseline_runner.py source/tests/tools/test_issue638_ppo_baseline_runner.py
      - name: Commit GREEN source and tests only
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py
          git diff --cached --name-only > "$RUNNER_TEMP/files"
          printf '%s\n' .github/scripts/issue638_ppo_baseline_runner.py tests/tools/test_issue638_ppo_baseline_runner.py > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/files"
          git commit -m 'research: add fail-closed Issue 638 activation claim'
          git push origin HEAD:automation/issue638-activation-claim-green-v1
