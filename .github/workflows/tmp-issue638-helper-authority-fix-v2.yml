name: tmp Issue 638 helper authority fix v2

on:
  push:
    branches:
      - automation/issue638-helper-authority-fix-v2
    paths:
      - .github/workflows/tmp-issue638-helper-authority-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: prepare/issue638-ppo-sequential-baseline-v1
          fetch-depth: 0
      - name: Guard exact preparation head
        run: test "$(git rev-parse HEAD)" = 698d4be662ad1dadbe35267f0fcfe44769e6d16e
      - name: Patch only non-workflow helper authority names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issue638_ppo_baseline_runner.py')
          text = path.read_text()
          replacements = {
              'issue629-ppo-interleaved-prereg-v1-primary-35205354305': 'issue629-prereg-seal-primary-35205354305',
              'issue629-ppo-interleaved-prereg-v1-fresh-35205354305': 'issue629-prereg-seal-fresh-35205354305',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'authority anchor drift: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit helper-only correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin prepare/issue638-ppo-sequential-baseline-v1
          test "$(git rev-parse FETCH_HEAD)" = 698d4be662ad1dadbe35267f0fcfe44769e6d16e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/issue638_ppo_baseline_runner.py
          git commit -m "research: correct Issue 638 protocol Artifact names"
          git push origin HEAD:prepare/issue638-ppo-sequential-baseline-v1
