name: tmp Issue 641 activation test format

on:
  push:
    branches:
      - research/issue641-directional-runtime-activation
    paths:
      - .github/workflows/tmp-issue641-activation-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: research/issue641-directional-runtime-activation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only the activation contract test
        run: |
          set -euo pipefail
          uv run ruff check --fix tests/tools/test_issue640_directional_activation.py
          uv run ruff format tests/tools/test_issue640_directional_activation.py
          uv run ruff check tests/tools/test_issue640_directional_activation.py
          uv run ruff format --check tests/tools/test_issue640_directional_activation.py
      - name: Commit test-only format change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/tools/test_issue640_directional_activation.py
          git diff --cached --name-only > "$RUNNER_TEMP/files"
          test "$(cat "$RUNNER_TEMP/files")" = tests/tools/test_issue640_directional_activation.py
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Issue 641 activation test'
            git push origin HEAD:research/issue641-directional-runtime-activation
          fi
