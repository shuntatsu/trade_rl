name: tmp Issue 641 activation RED

on:
  push:
    branches:
      - research/issue641-directional-runtime-activation
    paths:
      - .github/workflows/tmp-issue641-activation-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove activation helper absence is the semantic RED
        run: |
          set -euo pipefail
          uv run ruff check tests/tools/test_issue640_directional_activation.py
          uv run ruff format --check tests/tools/test_issue640_directional_activation.py
          set +e
          uv run pytest -q tests/tools/test_issue640_directional_activation.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'FileNotFoundError|No such file or directory' "$RUNNER_TEMP/red.log"
          echo ISSUE641_ACTIVATION_SEMANTIC_RED=PASS
