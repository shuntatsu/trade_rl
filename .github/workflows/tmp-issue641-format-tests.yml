name: tmp Issue 641 format tests

on:
  push:
    branches:
      - research/issue641-directional-runtime-activation
    paths:
      - .github/workflows/tmp-issue641-format-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only Issue 641 test
        run: |
          uv run ruff format tests/evaluation/test_directional_study.py
          uv run ruff check tests/evaluation/test_directional_study.py
          uv run ruff format --check tests/evaluation/test_directional_study.py
          test "$(git diff --name-only)" = tests/evaluation/test_directional_study.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/evaluation/test_directional_study.py
          git commit -m "style: format Issue 641 directional runtime tests"
          git push origin HEAD:research/issue641-directional-runtime-activation
