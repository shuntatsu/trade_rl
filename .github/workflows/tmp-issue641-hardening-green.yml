name: tmp Issue 641 hardening GREEN

on:
  push:
    branches:
      - research/issue641-directional-runtime-activation
    paths:
      - .github/workflows/tmp-issue641-hardening-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ea702b348382cb7b4f4c1546a2995ca3a6ddacd9
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Install complete frozen trainer runtime
        run: uv sync --extra dev --extra forecast-gbm --extra train-sb3
      - name: Static checks
        run: |
          set -euo pipefail
          uv run ruff check \
            trade_rl/evaluation/directional_study.py \
            tests/evaluation/test_directional_study.py \
            tests/tools/test_issue640_directional_activation.py \
            .github/scripts/issue640_directional_activation.py
          uv run ruff format --check \
            trade_rl/evaluation/directional_study.py \
            tests/evaluation/test_directional_study.py \
            tests/tools/test_issue640_directional_activation.py \
            .github/scripts/issue640_directional_activation.py
          uv run mypy trade_rl/evaluation/directional_study.py
          uv run python -m py_compile .github/scripts/issue640_directional_activation.py
      - name: Targeted hardening and frozen directional tests
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/evaluation/test_directional_study.py \
            tests/evaluation/test_directional.py \
            tests/evaluation/test_directional_selection.py \
            tests/data/test_price_channels.py \
            tests/strategies/test_channel_breakout.py \
            tests/tools/test_issue640_directional_activation.py
      - name: Real runtime preflight without economic data
        run: |
          uv run python - <<'PY'
          from trade_rl.evaluation.directional_study import validate_required_runtime
          runtime = validate_required_runtime()
          assert runtime['lightgbm'] == '4.7.0'
          assert runtime['stable-baselines3'] == '2.3.2'
          assert runtime['torch'] == '2.4.1'
          assert runtime['scikit-learn']
          print('ISSUE641_RUNTIME_PREFLIGHT=PASS')
          print('REAL_DATASET_LOADED=false')
          print('MODEL_FIT_PERFORMED=false')
          print('ECONOMIC_REPLAY_PERFORMED=false')
          PY
      - name: Exact clean head
        run: |
          test "$(git rev-parse HEAD)" = "ea702b348382cb7b4f4c1546a2995ca3a6ddacd9"
          test -z "$(git status --porcelain)"
