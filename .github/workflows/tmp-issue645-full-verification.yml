name: tmp Issue 645 full exact verification

on:
  push:
    branches:
      - verify/issue645-corrected-accounting-full-v1
    paths:
      - .github/workflows/tmp-issue645-full-verification.yml

permissions:
  contents: read

jobs:
  core:
    name: Exact Lean Core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b192fc8cfc52dfd9e6551021d8fea1360aac24a8
          fetch-depth: 1
          persist-credentials: false
      - name: Prove factor isolation
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/shuntatsu/trade_rl.git c80652a126780580990bf46bb206155ba469e043 95a4831bfbd5dfac2b77371b0c99d6894edc4d3a
          actual="$(git diff --name-only c80652a126780580990bf46bb206155ba469e043 HEAD | sort)"
          expected="$(printf '%s\n'             tests/simulation/test_lot_accounting.py             tests/simulation/test_stateful_execution_characterization.py             trade_rl/simulation/accounting.py             trade_rl/simulation/execution.py             trade_rl/simulation/liquidity.py             trade_rl/simulation/orders/admission.py             trade_rl/simulation/orders/model.py             trade_rl/simulation/quantities.py             trade_rl/simulation/stateful/symbol_fills.py | sort)"
          test "$actual" = "$expected"
          for p in trade_rl/simulation/accounting.py trade_rl/simulation/execution.py trade_rl/simulation/liquidity.py trade_rl/simulation/orders/admission.py trade_rl/simulation/orders/model.py trade_rl/simulation/quantities.py trade_rl/simulation/stateful/symbol_fills.py; do
            test "$(git rev-parse HEAD:"$p")" = "$(git rev-parse 95a4831bfbd5dfac2b77371b0c99d6894edc4d3a:"$p")"
          done
          for p in trade_rl/evaluation/directional_study.py trade_rl/evaluation/directional_selection.py trade_rl/evaluation/directional_candidates.py trade_rl/evaluation/directional.py; do
            test "$(git rev-parse HEAD:"$p")" = "$(git rev-parse c80652a126780580990bf46bb206155ba469e043:"$p")"
          done
          test "$(git rev-parse HEAD)" = b192fc8cfc52dfd9e6551021d8fea1360aac24a8
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Core tests
        run: uv run pytest -q tests
      - name: Build
        run: uv build
      - name: Distribution source closure and sdist rebuild
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.evaluation.experiments
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          print("clean installed core public imports and identity: OK")
          PY
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.runs.candidate --help
          "$clean/venv/bin/python" -I -m trade_rl.evaluation.experiments.bootstrap.cli --help
      - name: Package identity
        run: |
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          module="$(uv run python -c 'import trade_rl; print(trade_rl.__version__)')"
          test "$module" = "$expected"

  guide:
    name: Exact Human Guide
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GUIDE_SOURCE_REV: b192fc8cfc52dfd9e6551021d8fea1360aac24a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b192fc8cfc52dfd9e6551021d8fea1360aac24a8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci
      - name: Guide source contract
        working-directory: guide
        run: npm run source-check
      - name: Guide lint
        working-directory: guide
        run: npm run lint
      - name: Guide typecheck
        working-directory: guide
        run: npm run typecheck
      - name: Guide unit tests
        working-directory: guide
        run: npm run test
      - name: Guide build
        working-directory: guide
        run: npm run build
      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e
