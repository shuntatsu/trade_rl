name: tmp Issue 645 harness audit format
on:
  push:
    branches:
      - automation/issue645-harness-audit-format-v1
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 23eef8296e1d198c94740bb644a1db6043e1204e
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format .github/scripts/issue645_official_audit.py
          git diff -- .github/scripts/issue645_official_audit.py
