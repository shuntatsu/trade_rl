name: tmp Issue 645 seal builder formatter

on:
  push:
    branches:
      - automation/issue645-seal-builder-format
    paths:
      - .github/workflows/tmp-issue645-seal-builder-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/issue645-seal-builder-format
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only seal builder
        run: |
          set -euo pipefail
          uv run ruff check .github/scripts/issue645_build_implementation_seal.py
          uv run ruff format .github/scripts/issue645_build_implementation_seal.py
          uv run ruff check .github/scripts/issue645_build_implementation_seal.py
          uv run ruff format --check .github/scripts/issue645_build_implementation_seal.py
          changed="$(git diff --name-only)"
          test "$changed" = ".github/scripts/issue645_build_implementation_seal.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/issue645_build_implementation_seal.py
          git commit -m "style: format Issue 645 seal builder"
          git push origin HEAD:automation/issue645-seal-builder-format
