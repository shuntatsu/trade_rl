name: tmp Issue 661 final format and Guide refresh v2
on:
  push:
    branches:
      - automation/issue661-final-format-guide-v2
permissions:
  contents: read
jobs:
  derive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17dfa5b03ebb0efa2e9c1caee98a4166433520fa
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format trade_rl/simulation/execution.py trade_rl/simulation/stateful/execution.py
          cd guide
          python3 tools/content_contract.py --refresh-code implementation-replay
          python3 tools/content_contract.py --refresh-code code-map
          python3 tools/content_contract.py --check
          cd ..
          git diff -- trade_rl/simulation/execution.py trade_rl/simulation/stateful/execution.py guide/content/meta/implementation-replay.json guide/content/meta/code-map.json
