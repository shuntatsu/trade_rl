name: tmp Issue 661 ledger format

on:
  push:
    branches:
      - research/issue661-shared-cash-ledger-evidence
    paths:
      - .github/workflows/tmp-issue661-ledger-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Format only replay implementation
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/evaluation/replay.py
          uv run ruff check trade_rl/evaluation/replay.py
          uv run ruff format --check trade_rl/evaluation/replay.py
          changed="$(git diff --name-only)"
          test "$changed" = "trade_rl/evaluation/replay.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-issue661-ledger-format.yml
          git add trade_rl/evaluation/replay.py
          git commit -m "style: format Issue 661 ledger evidence"
          git push origin HEAD:research/issue661-shared-cash-ledger-evidence
