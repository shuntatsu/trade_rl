name: tmp Issue 661 profile source RED format diff
on:
  push:
    branches:
      - prepare/issue661-profile-source-v1
    paths:
      - .github/workflows/tmp-issue661-profile-source-helper-green.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0019cd074fd543f2f5cd325ad0607d85b35b00fe
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: |
          set -euo pipefail
          uv sync --extra dev
          uv run ruff format tests/tools/test_issue661_profile_source.py
          git diff -- tests/tools/test_issue661_profile_source.py
