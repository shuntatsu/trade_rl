name: tmp Issue 663 exact full verification v1

on:
  push:
    branches:
      - verify/issue663-normalization-corrected-v1
    paths:
      - .github/workflows/tmp-issue663-exact-full-v1.yml

permissions:
  contents: read

env:
  TARGET_SHA: cffef105879c79da365a1e5f9fd21a242ce490a7

jobs:
  core:
    name: Exact Lean Core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Exact scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --exit-code 928ee0886c404cdbb1383f440f731d7221c277ef "$TARGET_SHA" --             trade_rl/simulation trade_rl/risk trade_rl/evaluation/directional.py trade_rl/evaluation/directional_candidates.py
      - name: Ruff
        run: uv run ruff check trade_rl tests tools
      - name: Format
        run: uv run ruff format --check trade_rl tests tools
      - name: Mypy
        run: uv run mypy trade_rl
      - name: Repository tooling types
        run: uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Full tests
        run: uv run pytest -q tests
      - name: Build and distribution closure
        run: |
          set -euo pipefail
          uv build
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed smoke
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.strategies.rl.ppo
          import trade_rl.strategies.rl.ppo_normalization
          import trade_rl.strategies.rl.ppo_artifact
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
      - name: Tracked source remains clean
        run: git diff --exit-code

  guide:
    name: Exact Human Guide
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GUIDE_SOURCE_REV: cffef105879c79da365a1e5f9fd21a242ce490a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cffef105879c79da365a1e5f9fd21a242ce490a7
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - working-directory: guide
        run: npm ci
      - working-directory: guide
        run: npm run source-check
      - working-directory: guide
        run: npm run lint
      - working-directory: guide
        run: npm run typecheck
      - working-directory: guide
        run: npm run test
      - working-directory: guide
        run: npm run build
      - working-directory: guide
        run: npx playwright install --with-deps chromium
      - working-directory: guide
        run: npm run e2e
