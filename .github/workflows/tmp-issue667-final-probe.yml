name: tmp Issue 667 final mechanical probe

on:
  push:
    branches:
      - fix/session-gap-carry-timing
    paths:
      - .github/workflows/tmp-issue667-final-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b8ee92049ff72e80cb06e96069c56aa8c9b5de01
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Produce formatter and Guide refresh diffs
        run: |
          set -euo pipefail
          uv run ruff format tests/simulation/test_session_carry.py
          python3 guide/tools/content_contract.py --refresh-code code-map
          git diff -- tests/simulation/test_session_carry.py guide/content/meta/code-map.json
