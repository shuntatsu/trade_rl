name: tmp Issue 667 session-gap semantic RED

on:
  push:
    branches:
      - fix/session-gap-carry-timing
    paths:
      - .github/workflows/tmp-issue667-session-gap-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 518be2f0681a44b84af2d25bbc1ed7cedefc38eb
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Static test quality
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_session_carry.py
          uv run ruff format --check tests/simulation/test_session_carry.py
      - name: Prove old accounting is RED
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q tests/simulation/test_session_carry.py::test_next_open_entry_excludes_prior_gap_carry > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q 'test_next_open_entry_excludes_prior_gap_carry' "$RUNNER_TEMP/red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/red.log"
          ! grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$RUNNER_TEMP/red.log"
          echo ISSUE667_SESSION_GAP_SEMANTIC_RED=PASS
