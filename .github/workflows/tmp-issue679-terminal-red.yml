name: tmp Issue 679 terminal settlement RED

on:
  push:
    branches:
      - research/issue679-ppo-terminal-settlement
    paths:
      - .github/workflows/tmp-issue679-terminal-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e8368a043aa85e4ec866327ac697e5502a43c4be
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove terminal liquidation semantic RED
        run: |
          set -euo pipefail
          uv run ruff check tests/strategies/test_ppo_terminal_liquidation.py
          uv run ruff format --check tests/strategies/test_ppo_terminal_liquidation.py
          set +e
          uv run pytest -q tests/strategies/test_ppo_terminal_liquidation.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q 'test_terminal_settlement_is_environment_owned_and_charges_exit_cost' "$RUNNER_TEMP/red.log"
          echo ISSUE679_TERMINAL_SETTLEMENT_RED=PASS
