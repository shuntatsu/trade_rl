name: tmp Issue 687 research assurance RED

on:
  push:
    branches:
      - audit/issue687-research-assurance
    paths:
      - .github/workflows/tmp-issue687-research-assurance-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 123f244e988250a9f08673c54397fe04c7730012
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Prove assurance implementation is missing
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/agent_repo/test_research_assurance.py
          uv run ruff format --check tests/agent_repo/test_research_assurance.py
          set +e
          uv run pytest -q tests/agent_repo/test_research_assurance.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ModuleNotFoundError: No module named 'tools.agent_repo.research_assurance'" "$RUNNER_TEMP/red.log"
          echo ISSUE687_RESEARCH_ASSURANCE_RED=PASS
