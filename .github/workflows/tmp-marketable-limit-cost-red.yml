name: tmp marketable limit cost RED

on:
  push:
    branches:
      - fix/limit-maker-taker-classification
    paths:
      - .github/workflows/tmp-marketable-limit-cost-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b13ea7446a82a62e32645edbf1cf3376d29b8f2a
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove marketable LIMIT cost semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_stateful_execution.py
          uv run ruff format --check tests/simulation/test_stateful_execution.py
          set +e
          uv run pytest -q             tests/simulation/test_stateful_execution.py::test_newly_eligible_marketable_limit_uses_taker_costs             tests/simulation/test_stateful_execution.py::test_newly_eligible_resting_limit_touch_uses_maker_costs             tests/simulation/test_stateful_execution.py::test_carried_resting_limit_remains_maker_when_next_open_crosses             > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q "1 failed, 2 passed" "$RUNNER_TEMP/red.log"
          grep -q "test_newly_eligible_marketable_limit_uses_taker_costs" "$RUNNER_TEMP/red.log"
          grep -q "AssertionError" "$RUNNER_TEMP/red.log"
          ! grep -Eq "ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError" "$RUNNER_TEMP/red.log"
          echo ISSUE667_MARKETABLE_LIMIT_COST_RED=PASS
