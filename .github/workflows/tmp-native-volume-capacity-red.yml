name: tmp native volume capacity RED

on:
  push:
    branches:
      - fix/volume-unit-capacity-quantity
    paths:
      - .github/workflows/tmp-native-volume-capacity-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c1220308222e76e62f0fefcd3126c49d46b28a6b
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove native-volume capacity semantic RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_stateful_execution.py
          uv run ruff format --check tests/simulation/test_stateful_execution.py
          set +e
          uv run pytest -q             tests/simulation/test_stateful_execution.py::test_capacity_respects_native_volume_unit_when_fill_price_differs_from_open             > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q "2 failed, 1 passed" "$RUNNER_TEMP/red.log"
          ! grep -Eq "ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError" "$RUNNER_TEMP/red.log"
          echo ISSUE667_NATIVE_VOLUME_CAPACITY_RED=PASS
