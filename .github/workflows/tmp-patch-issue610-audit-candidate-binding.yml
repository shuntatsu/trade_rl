name: tmp patch Issue 610 candidate authority audit

on:
  push:
    branches:
      - prepare/issue610-real-interpretation-audit-v1
    paths:
      - tools/tmp_patch_issue610_audit_candidate_binding.py
      - .github/workflows/tmp-patch-issue610-audit-candidate-binding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: prepare/issue610-real-interpretation-audit-v1
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - name: Apply hardening patch
        run: python3 tools/tmp_patch_issue610_audit_candidate_binding.py
      - name: Verify targeted audit contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra forecast-gbm --extra train-sb3
          uv run ruff check --fix tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_symbol_roster.py
          uv run ruff format tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_symbol_roster.py
          uv run mypy tools/tmp_issue610_real_interpretation_audit_v1.py
          uv run pytest -q tests/tools/test_tmp_issue610_real_interpretation_audit_symbol_roster.py
          uv run python -m tools.tmp_issue610_real_interpretation_audit_v1 self-check
          git diff --check
      - name: Commit hardened oracle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/tmp_issue610_real_interpretation_audit_v1.py tests/tools/test_tmp_issue610_real_interpretation_audit_symbol_roster.py
          git commit -m 'fix: restore Issue 610 candidate authority audit bindings'
          git push origin HEAD:prepare/issue610-real-interpretation-audit-v1
