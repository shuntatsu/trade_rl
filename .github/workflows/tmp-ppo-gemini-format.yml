name: Temporary Gemini Reviewer Format Diagnostic

on:
  push:
    branches:
      - infra/ppo-gemini-review-authority

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Render formatted reviewer
        run: |
          set -euo pipefail
          uv run ruff format tools/ppo_4h_gemini_review.py
          echo '---FORMATTED-REVIEWER-BEGIN---'
          cat tools/ppo_4h_gemini_review.py
          echo '---FORMATTED-REVIEWER-END---'
