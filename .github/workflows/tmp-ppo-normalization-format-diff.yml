name: Temporary PPO normalization format diff

on:
  push:
    branches:
      - research/issue735-ppo-normalization-impl

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Show formatter diff
        run: |
          uv run ruff format --diff             trade_rl/evaluation/ppo_normalization_execution.py             tests/evaluation/test_ppo_normalization_execution.py || true
