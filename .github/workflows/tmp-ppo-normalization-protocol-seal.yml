name: Temporary PPO normalization protocol seal

on:
  push:
    branches:
      - research/issue677-ppo-normalization-prereg-current

permissions:
  contents: read
  actions: read

env:
  SOURCE_HEAD: f5456bf7940d7f6469436438a8879f797b0d8ff6
  FULL_CI_RUN: "35531502010"

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Verify exact source and Full PR CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['FULL_CI_RUN']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              run = json.load(response)
          assert run["head_sha"] == os.environ["SOURCE_HEAD"], run["head_sha"]
          assert run["event"] == "pull_request", run["event"]
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          PY

      - name: Verify protocol contracts and source blobs
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/evaluation/test_ppo_normalization_replication.py
          uv run python - <<'PY'
          import subprocess
          from trade_rl.evaluation.ppo_normalization_replication import (
              expected_ppo_normalization_protocol,
          )

          protocol = expected_ppo_normalization_protocol()
          for path, expected in protocol["software_authority"]["source_blobs"].items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              assert actual == expected, (path, expected, actual)
          PY

      - name: Build primary seal
        shell: bash
        run: |
          set -euo pipefail
          mkdir seal-primary
          uv run python - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          from trade_rl.artifacts import canonical_json_bytes, content_digest
          from trade_rl.evaluation.ppo_normalization_replication import (
              expected_ppo_normalization_protocol,
              ppo_normalization_protocol_bytes,
          )

          protocol = expected_ppo_normalization_protocol()
          raw = ppo_normalization_protocol_bytes()
          authority = {
              "schema": "ppo_normalization_protocol_seal_v1",
              "source_head": os.environ["SOURCE_HEAD"],
              "full_pr_ci_run": int(os.environ["FULL_CI_RUN"]),
              "protocol_blob_sha": subprocess.check_output(
                  [
                      "git",
                      "rev-parse",
                      "HEAD:trade_rl/evaluation/ppo_normalization_replication.py",
                  ],
                  text=True,
              ).strip(),
              "test_blob_sha": subprocess.check_output(
                  [
                      "git",
                      "rev-parse",
                      "HEAD:tests/evaluation/test_ppo_normalization_replication.py",
                  ],
                  text=True,
              ).strip(),
              "protocol_digest": content_digest(protocol),
              "protocol_json_sha256": hashlib.sha256(raw).hexdigest(),
              "economic_execution_authorized": False,
              "economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
          }
          Path("seal-primary/protocol.json").write_bytes(raw)
          Path("seal-primary/authority.json").write_bytes(canonical_json_bytes(authority))
          PY

      - name: Upload primary seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-normalization-protocol-primary-${{ github.run_id }}
          path: seal-primary/
          if-no-files-found: error
          retention-days: 90

  fresh:
    needs: primary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_HEAD }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Download primary seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ppo-normalization-protocol-primary-${{ github.run_id }}
          path: downloaded-primary

      - name: Independently reconstruct
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          uv run pytest -q tests/evaluation/test_ppo_normalization_replication.py
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          from trade_rl.artifacts import canonical_json_bytes, content_digest
          from trade_rl.evaluation.ppo_normalization_replication import (
              expected_ppo_normalization_protocol,
              ppo_normalization_protocol_bytes,
          )

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['FULL_CI_RUN']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              run = json.load(response)
          assert run["head_sha"] == os.environ["SOURCE_HEAD"]
          assert run["event"] == "pull_request"
          assert run["status"] == "completed"
          assert run["conclusion"] == "success"

          protocol = expected_ppo_normalization_protocol()
          for path, expected in protocol["software_authority"]["source_blobs"].items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              assert actual == expected, (path, expected, actual)

          raw = ppo_normalization_protocol_bytes()
          authority = {
              "schema": "ppo_normalization_protocol_seal_v1",
              "source_head": os.environ["SOURCE_HEAD"],
              "full_pr_ci_run": int(os.environ["FULL_CI_RUN"]),
              "protocol_blob_sha": subprocess.check_output(
                  [
                      "git",
                      "rev-parse",
                      "HEAD:trade_rl/evaluation/ppo_normalization_replication.py",
                  ],
                  text=True,
              ).strip(),
              "test_blob_sha": subprocess.check_output(
                  [
                      "git",
                      "rev-parse",
                      "HEAD:tests/evaluation/test_ppo_normalization_replication.py",
                  ],
                  text=True,
              ).strip(),
              "protocol_digest": content_digest(protocol),
              "protocol_json_sha256": hashlib.sha256(raw).hexdigest(),
              "economic_execution_authorized": False,
              "economic_result_inspected": False,
              "unused_data_accessed": False,
              "final_test_accessed": False,
          }
          fresh = Path("seal-fresh")
          fresh.mkdir()
          fresh.joinpath("protocol.json").write_bytes(raw)
          fresh.joinpath("authority.json").write_bytes(canonical_json_bytes(authority))
          assert fresh.joinpath("protocol.json").read_bytes() == Path(
              "downloaded-primary/protocol.json"
          ).read_bytes()
          assert fresh.joinpath("authority.json").read_bytes() == Path(
              "downloaded-primary/authority.json"
          ).read_bytes()
          PY

      - name: Upload fresh seal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-normalization-protocol-fresh-${{ github.run_id }}
          path: seal-fresh/
          if-no-files-found: error
          retention-days: 90

  audit:
    needs: [primary, fresh]
    runs-on: ubuntu-latest
    steps:
      - name: Download primary seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ppo-normalization-protocol-primary-${{ github.run_id }}
          path: primary

      - name: Download fresh seal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ppo-normalization-protocol-fresh-${{ github.run_id }}
          path: fresh

      - name: Audit byte identity and boundaries
        shell: bash
        run: |
          set -euo pipefail
          cmp primary/protocol.json fresh/protocol.json
          cmp primary/authority.json fresh/authority.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protocol = Path("primary/protocol.json").read_bytes()
          authority_raw = Path("primary/authority.json").read_bytes()
          authority = json.loads(authority_raw)
          assert authority["economic_execution_authorized"] is False
          assert authority["economic_result_inspected"] is False
          assert authority["unused_data_accessed"] is False
          assert authority["final_test_accessed"] is False
          protocol_payload = json.loads(protocol)
          boundaries = protocol_payload["boundaries"]
          assert boundaries["control_new_fit_required"] is True
          assert boundaries["candidate_new_fit_required"] is True
          assert boundaries["historical_models_reused"] is False
          assert boundaries["economic_execution_authorized"] is False
          assert boundaries["economic_result_inspected"] is False
          audit = {
              "schema": "ppo_normalization_protocol_seal_audit_v1",
              "byte_equal": True,
              "protocol_json_sha256": hashlib.sha256(protocol).hexdigest(),
              "authority_json_sha256": hashlib.sha256(authority_raw).hexdigest(),
              "economic_execution_authorized": False,
          }
          Path("audit").mkdir()
          Path("audit/audit.json").write_text(
              json.dumps(audit, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Upload audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ppo-normalization-protocol-audit-${{ github.run_id }}
          path: audit/
          if-no-files-found: error
          retention-days: 90
