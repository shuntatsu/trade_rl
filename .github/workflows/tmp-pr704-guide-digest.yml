name: tmp PR704 Guide digest
on:
  push:
    branches:
      - automation/pr704-guide-digest-v1
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5f4626a8c661cf620d29fb6533bf4a4cb74310b
          persist-credentials: false
      - run: |
          set -euo pipefail
          cd guide
          python3 tools/content_contract.py --refresh-code code-map
          python3 tools/content_contract.py --check
          cd ..
          git diff -- guide/content/meta/code-map.json
