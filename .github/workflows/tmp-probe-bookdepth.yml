name: Temporary Binance bookDepth probe

on:
  push:
    branches:
      - feat/binance-bookdepth-evidence

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/binance-bookdepth-evidence
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.10.0"
          python-version: "3.12"
      - name: Install core
        run: uv sync --extra dev
      - name: Fetch two public archives
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/bookdepth-2025-03-01.zip \
            https://data.binance.vision/data/futures/um/daily/bookDepth/BTCUSDT/BTCUSDT-bookDepth-2025-03-01.zip
          curl --fail --location --retry 3 \
            --output /tmp/bookdepth-2025-05-19.zip \
            https://data.binance.vision/data/futures/um/daily/bookDepth/BTCUSDT/BTCUSDT-bookDepth-2025-05-19.zip
      - name: Inspect and parse without changing evidence
        run: |
          uv run python - <<'PY'
          import csv
          import hashlib
          import io
          import zipfile
          from pathlib import Path

          from trade_rl.integrations.binance import parse_vision_book_depth_archive

          for date in ("2025-03-01", "2025-05-19"):
              path = Path(f"/tmp/bookdepth-{date}.zip")
              payload = path.read_bytes()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = archive.namelist()
                  if len(names) != 1:
                      raise SystemExit(f"{date}: unexpected members: {names}")
                  text = archive.read(names[0]).decode("utf-8-sig")
              rows = list(csv.reader(io.StringIO(text)))
              print(f"DATE={date}")
              print(f"SIZE={len(payload)}")
              print(f"SHA256={hashlib.sha256(payload).hexdigest()}")
              print(f"MEMBER={names[0]}")
              print(f"HEADER={rows[0]}")
              print(f"FIRST_ROWS={rows[1:11]}")
              try:
                  series = parse_vision_book_depth_archive(
                      payload,
                      source=f"public-probe:{date}",
                  )
              except Exception as exc:
                  print(f"PARSER_REJECT={type(exc).__name__}:{exc}")
              else:
                  print(f"SNAPSHOTS={series.timestamps.size}")
                  print(f"FIRST_TS={series.timestamps[0]}")
                  print(f"LAST_TS={series.timestamps[-1]}")
                  print(f"BANDS={series.percentage_bands}")
                  if series.timestamps.size > 1:
                      deltas = series.timestamps[1:] - series.timestamps[:-1]
                      print(f"DELTA_MIN={deltas.min()}")
                      print(f"DELTA_MAX={deltas.max()}")
          PY
