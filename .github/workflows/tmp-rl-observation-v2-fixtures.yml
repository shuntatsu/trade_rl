name: Temporary RL Observation v2 fixture propagation

on:
  push:
    branches:
      - feat/rl-observation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/rl-observation-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Propagate observation contract through maintained fixtures
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"guard mismatch: {path}: {old!r}: count={text.count(old)}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "tests/strategies/test_controls.py",
              "        feature_available=np.array([False]),\n        global_features=np.array([0.0]),\n",
              "        feature_available=np.array([False]),\n        feature_staleness=np.array([1.0]),\n        global_features=np.array([0.0]),\n",
          )
          for path in (
              "tests/strategies/test_trend_intent.py",
              "tests/strategies/test_mean_reversion_intent.py",
          ):
              replace_once(
                  path,
                  "        feature_available=np.asarray([available], dtype=np.bool_),\n        global_features=np.asarray([0.0], dtype=np.float64),\n",
                  "        feature_available=np.asarray([available], dtype=np.bool_),\n        feature_staleness=np.asarray(\n            [0.0 if available else 1.0], dtype=np.float32\n        ),\n        global_features=np.asarray([0.0], dtype=np.float64),\n",
              )
          for path in (
              "tests/strategies/test_lightgbm_forecast.py",
              "tests/strategies/test_ridge_forecast.py",
          ):
              replace_once(
                  path,
                  "        feature_available=np.asarray([available, True]),\n        global_features=np.asarray([0.0]),\n",
                  "        feature_available=np.asarray([available, True]),\n        feature_staleness=np.asarray(\n            [0.0 if available else 1.0, 0.0], dtype=np.float32\n        ),\n        global_features=np.asarray([0.0]),\n",
              )

          path = Path("tests/strategies/test_ppo_intent.py")
          text = path.read_text(encoding="utf-8")
          old = '''from trade_rl.strategies.rl.ppo import (\n    PPOIntentStrategy,\n    PPOTradingEnv,\n    fit_ppo_strategy,\n)\n'''
          new = '''from trade_rl.strategies.rl.ppo import (\n    PPO_GLOBAL_FEATURE_NAMES,\n    PPOIntentStrategy,\n    PPOTradingEnv,\n    fit_ppo_strategy,\n)\n'''
          if text.count(old) != 1:
              raise SystemExit("PPO import guard mismatch")
          text = text.replace(old, new)
          if text.count('global_features=np.zeros((4, 1), dtype=np.float32)') != 2:
              raise SystemExit("PPO global feature shape guard mismatch")
          text = text.replace(
              'global_features=np.zeros((4, 1), dtype=np.float32)',
              'global_features=np.zeros((4, 4), dtype=np.float32)',
          )
          if text.count('global_feature_names=("regime",),') != 2:
              raise SystemExit("PPO global names guard mismatch")
          text = text.replace(
              'global_feature_names=("regime",),',
              'global_feature_names=PPO_GLOBAL_FEATURE_NAMES,',
          )
          old = '''        features=np.asarray([0.5]),\n        feature_available=np.asarray([True]),\n        global_features=np.asarray([0.0]),\n        global_feature_available=np.asarray([True]),\n'''
          new = '''        features=np.asarray([0.5]),\n        feature_available=np.asarray([True]),\n        feature_staleness=np.asarray([0.0], dtype=np.float32),\n        global_features=np.zeros(4, dtype=np.float64),\n        global_feature_available=np.ones(4, dtype=np.bool_),\n'''
          if text.count(old) != 1:
              raise SystemExit("PPO direct observation guard mismatch")
          text = text.replace(old, new)
          old = 'PPOIntentStrategy(FakePolicy(0), feature_indices=(0,)).decide(observation())'
          new = 'PPOIntentStrategy(\n            FakePolicy(0),\n            feature_indices=(0,),\n            global_feature_indices=(0, 1, 2, 3),\n        ).decide(observation())'
          if text.count(old) != 1:
              raise SystemExit("PPO short constructor guard mismatch")
          text = text.replace(old, new)
          old = 'PPOIntentStrategy(FakePolicy(1), feature_indices=(0,)).decide(observation())'
          new = 'PPOIntentStrategy(\n            FakePolicy(1),\n            feature_indices=(0,),\n            global_feature_indices=(0, 1, 2, 3),\n        ).decide(observation())'
          if text.count(old) != 1:
              raise SystemExit("PPO flat constructor guard mismatch")
          text = text.replace(old, new)
          old = 'PPOIntentStrategy(FakePolicy(2), feature_indices=(0,)).decide(observation())'
          new = 'PPOIntentStrategy(\n            FakePolicy(2),\n            feature_indices=(0,),\n            global_feature_indices=(0, 1, 2, 3),\n        ).decide(observation())'
          if text.count(old) != 1:
              raise SystemExit("PPO long constructor guard mismatch")
          text = text.replace(old, new)
          if text.count('assert first_observation.shape == (4,)') != 1:
              raise SystemExit("PPO first shape guard mismatch")
          text = text.replace(
              'assert first_observation.shape == (4,)',
              'assert first_observation.shape == (13,)',
          )
          if text.count('assert second_observation.shape == (4,)') != 1:
              raise SystemExit("PPO second shape guard mismatch")
          text = text.replace(
              'assert second_observation.shape == (4,)',
              'assert second_observation.shape == (13,)',
          )
          if text.count('assert observation.shape == (4,)') != 1:
              raise SystemExit("PPO explicit-fit shape guard mismatch")
          text = text.replace(
              'assert observation.shape == (4,)',
              'assert observation.shape == (13,)',
          )
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/evaluation/replay.py trade_rl/strategies/interface.py trade_rl/strategies/rl/ppo.py tests/strategies
          uv run ruff check trade_rl/evaluation/replay.py trade_rl/strategies/interface.py trade_rl/strategies/rl/ppo.py tests/strategies
          uv run pytest -q tests/strategies tests/evaluation/test_replay.py
          rm .github/workflows/tmp-rl-observation-v2-fixtures.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: propagate RL Observation v2 state contract"
          git push origin HEAD:feat/rl-observation-v2
