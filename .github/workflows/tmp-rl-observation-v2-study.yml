name: Temporary RL Observation v2 Study contract patch

on:
  push:
    branches:
      - feat/rl-observation-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/rl-observation-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
      - name: Apply versioned resolved-run observation contract
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"guard mismatch: {path}: count={text.count(old)}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          run_path = "trade_rl/evaluation/experiments/contracts/run.py"
          replace_once(
              run_path,
              "from trade_rl.evaluation.experiments.errors import ContractViolationError\n\nif TYPE_CHECKING:\n",
              "from trade_rl.evaluation.experiments.errors import ContractViolationError\nfrom trade_rl.strategies.rl.ppo import (\n    PPO_GLOBAL_FEATURE_NAMES,\n    PPO_OBSERVATION_SCHEMA,\n)\n\n_RESOLVED_RUN_CONFIG_V1 = \"resolved_run_config_v1\"\n_RESOLVED_RUN_CONFIG_V2 = \"resolved_run_config_v2\"\n\nif TYPE_CHECKING:\n",
          )
          replace_once(
              run_path,
              '''    initial_capital: float\n    execution_overlay: str\n    schema_version: str = "resolved_run_config_v1"\n''',
              '''    initial_capital: float\n    execution_overlay: str\n    ppo_observation_schema: str | None = None\n    ppo_global_feature_names: tuple[str, ...] = ()\n    schema_version: str = _RESOLVED_RUN_CONFIG_V1\n''',
          )
          replace_once(
              run_path,
              '''        schema_version = contract_text(self.schema_version, field="schema_version")\n\n        object.__setattr__(self, "signal_name", signal_name)\n''',
              '''        schema_version = contract_text(self.schema_version, field="schema_version")\n        if schema_version == _RESOLVED_RUN_CONFIG_V1:\n            if self.ppo_observation_schema is not None or self.ppo_global_feature_names:\n                raise ContractViolationError(\n                    "resolved_run_config_v1 must not define a PPO observation contract"\n                )\n            ppo_observation_schema: str | None = None\n            ppo_global_feature_names: tuple[str, ...] = ()\n        elif schema_version == _RESOLVED_RUN_CONFIG_V2:\n            ppo_observation_schema = contract_text(\n                self.ppo_observation_schema,\n                field="ppo_observation_schema",\n            )\n            ppo_global_feature_names = contract_unique_texts(\n                self.ppo_global_feature_names,\n                field="ppo_global_feature_names",\n            )\n            if ppo_observation_schema != PPO_OBSERVATION_SCHEMA:\n                raise ContractViolationError("unsupported PPO observation schema")\n            if ppo_global_feature_names != PPO_GLOBAL_FEATURE_NAMES:\n                raise ContractViolationError(\n                    "PPO global feature names do not match the frozen observation contract"\n                )\n        else:\n            raise ContractViolationError("unsupported resolved-run config schema")\n\n        object.__setattr__(self, "signal_name", signal_name)\n''',
          )
          replace_once(
              run_path,
              '''        object.__setattr__(self, "execution_overlay", execution_overlay)\n        object.__setattr__(self, "schema_version", schema_version)\n''',
              '''        object.__setattr__(self, "execution_overlay", execution_overlay)\n        object.__setattr__(self, "ppo_observation_schema", ppo_observation_schema)\n        object.__setattr__(\n            self, "ppo_global_feature_names", ppo_global_feature_names\n        )\n        object.__setattr__(self, "schema_version", schema_version)\n''',
          )
          replace_once(
              run_path,
              '''            initial_capital=config.initial_capital,\n            execution_overlay="zero_overlay_dataset_fields_authoritative",\n        )\n''',
              '''            initial_capital=config.initial_capital,\n            execution_overlay="zero_overlay_dataset_fields_authoritative",\n            ppo_observation_schema=PPO_OBSERVATION_SCHEMA,\n            ppo_global_feature_names=PPO_GLOBAL_FEATURE_NAMES,\n            schema_version=_RESOLVED_RUN_CONFIG_V2,\n        )\n''',
          )
          replace_once(
              run_path,
              '''    def to_payload(self) -> dict[str, object]:\n        return {\n            "schema_version": self.schema_version,\n            "signal_name": self.signal_name,\n            "signal_index": self.signal_index,\n            "feature_names": list(self.feature_names),\n            "feature_indices": list(self.feature_indices),\n            "fit_symbol_names": list(self.fit_symbol_names),\n            "fit_symbol_indices": list(self.fit_symbol_indices),\n            "fit_cutoff": self.fit_cutoff,\n            "rule_entry_threshold": self.rule_entry_threshold,\n            "rule_exit_threshold": self.rule_exit_threshold,\n            "forecast_entry_threshold": self.forecast_entry_threshold,\n            "forecast_exit_threshold": self.forecast_exit_threshold,\n            "ppo_total_timesteps": self.ppo_total_timesteps,\n            "ppo_seed": self.ppo_seed,\n            "evaluation_start": self.evaluation_start,\n            "evaluation_stop_exclusive": self.evaluation_stop_exclusive,\n            "gross_budget": self.gross_budget,\n            "initial_capital": self.initial_capital,\n            "execution_overlay": self.execution_overlay,\n        }\n''',
              '''    def to_payload(self) -> dict[str, object]:\n        payload: dict[str, object] = {\n            "schema_version": self.schema_version,\n            "signal_name": self.signal_name,\n            "signal_index": self.signal_index,\n            "feature_names": list(self.feature_names),\n            "feature_indices": list(self.feature_indices),\n            "fit_symbol_names": list(self.fit_symbol_names),\n            "fit_symbol_indices": list(self.fit_symbol_indices),\n            "fit_cutoff": self.fit_cutoff,\n            "rule_entry_threshold": self.rule_entry_threshold,\n            "rule_exit_threshold": self.rule_exit_threshold,\n            "forecast_entry_threshold": self.forecast_entry_threshold,\n            "forecast_exit_threshold": self.forecast_exit_threshold,\n            "ppo_total_timesteps": self.ppo_total_timesteps,\n            "ppo_seed": self.ppo_seed,\n            "evaluation_start": self.evaluation_start,\n            "evaluation_stop_exclusive": self.evaluation_stop_exclusive,\n            "gross_budget": self.gross_budget,\n            "initial_capital": self.initial_capital,\n            "execution_overlay": self.execution_overlay,\n        }\n        if self.schema_version == _RESOLVED_RUN_CONFIG_V2:\n            payload["ppo_observation_schema"] = self.ppo_observation_schema\n            payload["ppo_global_feature_names"] = list(\n                self.ppo_global_feature_names\n            )\n        return payload\n''',
          )

          codec_path = "trade_rl/evaluation/experiments/codec.py"
          old = '''def _resolved_from_payload(payload: object, *, field: str) -> ResolvedRunConfig:\n    raw = _as_dict(payload, field=field)\n    _expect_keys(\n        raw,\n        {\n            "schema_version",\n            "signal_name",\n            "signal_index",\n            "feature_names",\n            "feature_indices",\n            "fit_symbol_names",\n            "fit_symbol_indices",\n            "fit_cutoff",\n            "rule_entry_threshold",\n            "rule_exit_threshold",\n            "forecast_entry_threshold",\n            "forecast_exit_threshold",\n            "ppo_total_timesteps",\n            "ppo_seed",\n            "evaluation_start",\n            "evaluation_stop_exclusive",\n            "gross_budget",\n            "initial_capital",\n            "execution_overlay",\n        },\n        label=field,\n    )\n    try:\n        return ResolvedRunConfig(\n'''
          new = '''def _resolved_from_payload(payload: object, *, field: str) -> ResolvedRunConfig:\n    raw = _as_dict(payload, field=field)\n    schema_version = _as_string(\n        raw.get("schema_version"), field=f"{field}.schema_version"\n    )\n    expected = {\n        "schema_version",\n        "signal_name",\n        "signal_index",\n        "feature_names",\n        "feature_indices",\n        "fit_symbol_names",\n        "fit_symbol_indices",\n        "fit_cutoff",\n        "rule_entry_threshold",\n        "rule_exit_threshold",\n        "forecast_entry_threshold",\n        "forecast_exit_threshold",\n        "ppo_total_timesteps",\n        "ppo_seed",\n        "evaluation_start",\n        "evaluation_stop_exclusive",\n        "gross_budget",\n        "initial_capital",\n        "execution_overlay",\n    }\n    if schema_version == "resolved_run_config_v2":\n        expected.update({"ppo_observation_schema", "ppo_global_feature_names"})\n    elif schema_version != "resolved_run_config_v1":\n        raise ArtifactIntegrityError("unsupported resolved-run config schema")\n    _expect_keys(raw, expected, label=field)\n    try:\n        return ResolvedRunConfig(\n'''
          replace_once(codec_path, old, new)
          replace_once(
              codec_path,
              '''            execution_overlay=_as_string(\n                raw["execution_overlay"], field=f"{field}.execution_overlay"\n            ),\n            schema_version=_as_string(\n                raw["schema_version"], field=f"{field}.schema_version"\n            ),\n''',
              '''            execution_overlay=_as_string(\n                raw["execution_overlay"], field=f"{field}.execution_overlay"\n            ),\n            ppo_observation_schema=(\n                None\n                if schema_version == "resolved_run_config_v1"\n                else _as_string(\n                    raw["ppo_observation_schema"],\n                    field=f"{field}.ppo_observation_schema",\n                )\n            ),\n            ppo_global_feature_names=(\n                ()\n                if schema_version == "resolved_run_config_v1"\n                else _as_string_tuple(\n                    raw["ppo_global_feature_names"],\n                    field=f"{field}.ppo_global_feature_names",\n                )\n            ),\n            schema_version=schema_version,\n''',
          )
          PY
          uv run ruff format trade_rl/evaluation/experiments/contracts/run.py trade_rl/evaluation/experiments/codec.py tests/architecture/test_experiment_semantic_authorities.py tests/evaluation/experiments/test_observation_contract_identity.py
          uv run ruff check trade_rl/evaluation/experiments/contracts/run.py trade_rl/evaluation/experiments/codec.py tests/architecture/test_experiment_semantic_authorities.py tests/evaluation/experiments/test_observation_contract_identity.py
          uv run pytest -q tests/architecture/test_experiment_semantic_authorities.py tests/evaluation/experiments/test_observation_contract_identity.py tests/evaluation/experiments/test_contracts.py
          rm .github/workflows/tmp-rl-observation-v2-study.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: bind Observation v2 into Study identity"
          git push origin HEAD:feat/rl-observation-v2
