name: Temporary run bootstrap v2 config patcher

on:
  push:
    branches:
      - fix/canonical-m2-execution-economics

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore: run bootstrap v2 config patcher' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/tmp-run-bootstrap-v2-config-patcher.yml
          patcher=.github/tmp_patch_bootstrap_v2_config.py
          test "$(git diff --name-only HEAD^ HEAD)" = "$workflow"
          uv sync --extra dev
          uv run python "$patcher"
          rm "$workflow" "$patcher"
          uv run ruff format trade_rl/evaluation/experiments/bootstrap/config.py
          uv run ruff check trade_rl/evaluation/experiments/bootstrap/config.py tests/evaluation/experiments/bootstrap/test_config.py tests/evaluation/experiments/bootstrap/test_execution_economics_config.py tests/architecture/test_current_docs_layout.py
          uv run mypy trade_rl/evaluation/experiments/bootstrap/config.py
          uv run pytest -q tests/evaluation/experiments/bootstrap/test_config.py tests/evaluation/experiments/bootstrap/test_execution_economics_config.py tests/architecture/test_current_docs_layout.py
          git add -A
          git diff --cached --check
          expected="$(printf '%s\n' "$workflow" "$patcher" trade_rl/evaluation/experiments/bootstrap/config.py | sort)"
          test "$(git diff --cached --name-only | sort)" = "$expected"
          remote_head="$(git ls-remote --heads origin refs/heads/fix/canonical-m2-execution-economics | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add canonical M2 bootstrap v2 economics config"
          git push origin HEAD:fix/canonical-m2-execution-economics
