name: tmp session gap drawdown RED

on:
  push:
    branches:
      - fix/session-gap-carry-timing
    paths:
      - .github/workflows/tmp-session-carry-final-format.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e51aa627e5be8993fb46201aca59ea55cbb3ed98
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove hidden gap drawdown is RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_session_carry.py
          uv run ruff format --check tests/simulation/test_session_carry.py
          set +e
          uv run pytest -q tests/simulation/test_session_carry.py::test_session_gap_carry_drawdown_is_recorded_before_open_recovery > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q 'test_session_gap_carry_drawdown_is_recorded_before_open_recovery' "$RUNNER_TEMP/red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/red.log"
          ! grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$RUNNER_TEMP/red.log"
          echo ISSUE667_SESSION_GAP_DRAWDOWN_RED=PASS
