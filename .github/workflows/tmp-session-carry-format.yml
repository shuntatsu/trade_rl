name: tmp session carry margin RED

on:
  push:
    branches:
      - fix/session-gap-carry-timing
    paths:
      - .github/workflows/tmp-session-carry-format.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0211e4c576cf52f9aa97043f08c41714c92e3a7f
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Prove previous-close liquidation is RED
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check tests/simulation/test_session_carry.py
          uv run ruff format --check tests/simulation/test_session_carry.py
          set +e
          uv run pytest -q tests/simulation/test_session_carry.py::test_gap_margin_call_flattens_at_next_open_not_previous_close > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -q 'test_gap_margin_call_flattens_at_next_open_not_previous_close' "$RUNNER_TEMP/red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/red.log"
          ! grep -Eq 'ERROR collecting|ImportError|ModuleNotFoundError|SyntaxError' "$RUNNER_TEMP/red.log"
          echo ISSUE667_SESSION_MARGIN_SEMANTIC_RED=PASS
