name: Temporary strategy roster RED

on:
  push:
    branches:
      - refactor/experiment-strategy-roster-authority

permissions:
  contents: read

concurrency:
  group: tmp-strategy-roster-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    name: Formal RED
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check trade_rl tests

      - name: Format
        run: uv run ruff format --check trade_rl tests

      - name: Mypy
        run: uv run mypy trade_rl

      - name: Architecture tooling types
        run: uv run mypy tests/architecture/imports.py tests/architecture/distribution.py

      - name: Core tests
        run: uv run pytest -q tests
