name: Temporary Candidate JSON Current Main Sync

on:
  push:
    branches:
      - refactor/candidate-run-json-authority

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/candidate-run-json-authority
          fetch-depth: 0
          persist-credentials: false
      - name: Guard durable feature tree
        shell: bash
        run: |
          set -euo pipefail
          DURABLE_HEAD=a95836108c9e56411cae5056bb73282b544451d4
          test "$(git rev-parse HEAD^)" = "$DURABLE_HEAD"
          test "$(git diff --name-only "$DURABLE_HEAD"..HEAD)" = ".github/workflows/tmp-sync-candidate-json-main.yml"
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/main -m "merge: sync current main for candidate JSON verification"
          git merge-base --is-ancestor origin/main HEAD
          git diff --check
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Focused verification on integrated tree
        run: >-
          uv run pytest -q
          tests/architecture/test_candidate_run_json_authority.py
          tests/evaluation/test_candidate_run_config.py
          tests/evaluation/experiments/bootstrap/test_config.py
          tests/evaluation/test_candidate_run_artifact.py
      - name: Remove helper and push integrated tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-sync-candidate-json-main.yml
          git add .github/workflows/tmp-sync-candidate-json-main.yml
          git diff --cached --check
          git commit -m "chore: remove candidate JSON main-sync helper"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refactor/candidate-run-json-authority"
