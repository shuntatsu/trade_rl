name: Temporary sync latest experiment semantic parent

on:
  push:
    branches:
      - refactor/experiment-strategy-roster-authority

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout child branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/experiment-strategy-roster-authority
          fetch-depth: 0

      - name: Merge exact parent head and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refactor/experiment-semantic-authorities
          parent="$(git rev-parse origin/refactor/experiment-semantic-authorities)"
          test "$parent" = "99e0b35c07d654b04e2dc19cd3e478fd2f28d84e"
          test "$(git merge-base HEAD "$parent")" = "f8217881f15ba762cc24b4db36ea7dc52dd73c73"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$parent"
          rm .github/workflows/tmp-sync-parent-474.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: sync latest experiment semantic authorities"
          git push origin HEAD:refactor/experiment-strategy-roster-authority
