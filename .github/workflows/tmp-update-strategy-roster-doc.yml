name: Temporary compress strategy roster docs

on:
  push:
    branches:
      - refactor/experiment-strategy-roster-authority

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refactor/experiment-strategy-roster-authority
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Replace duplicated roster documentation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/controlled-experiment-loop.md')
          text = path.read_text(encoding='utf-8')
          old = '''EvidenceSet内で変えてよいのは `ppo_seed` だけである。 EvidenceSetのsemantic configとそのdigestからは `ppo_seed` を除外し、seed policyはordered `ppo_seeds`として別にidentityへbindする。各Run artifactには実際の `ppo_seed` を保持する。次のdeterministic strategyはseedを変えてもraw returnsが完全一致しなければartifact integrity failureとする。\n\n- `cash`\n- `constant_long`\n- `constant_short`\n- `trend`\n- `mean_reversion`\n- `ridge24`\n- `lightgbm24`\n'''
          new = '''EvidenceSet内で変えてよいのは `ppo_seed` だけである。EvidenceSetのsemantic configとそのdigestからは `ppo_seed` を除外し、seed policyはordered `ppo_seeds`として別にidentityへbindする。各Run artifactには実際の `ppo_seed` を保持する。\n\nStudyで維持するordered strategy rosterは `StudyPlan.STRATEGY_NAMES`、そのうちPPO seedを変えてもraw returnsが完全一致しなければならないrosterは `StudyPlan.PPO_SEED_INVARIANT_STRATEGY_NAMES` をsource contractの正本とする。現行契約では `ppo` だけがPPO seed依存を許される。rosterをarchitecture docs側で別途列挙・管理しない。\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/tmp-update-strategy-roster-doc.yml
          uv run pytest -q tests/architecture/test_current_docs_layout.py
          git diff --check

      - name: Commit durable docs compression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/controlled-experiment-loop.md .github/workflows/tmp-update-strategy-roster-doc.yml
          git diff --cached --check
          git commit -m "docs: point strategy roster rules to source authority"
          git push origin HEAD:refactor/experiment-strategy-roster-authority
