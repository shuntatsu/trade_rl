name: tmp verify Issue 634 recovery v3

on:
  push:
    branches:
      - run/issue634-ridge-shared-cash-evaluation-v1
    paths:
      - .github/workflows/tmp-verify-issue634-recovery-v3.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout run branch with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: run/issue634-ridge-shared-cash-evaluation-v1
          path: runrepo
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout verified helper authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 65b8598e48b49ad3d9932195fdd7c5a8fa97e67f
          path: helper
          persist-credentials: false
      - name: Checkout exact sealed evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d1bf25fd66834289ffddb36063b0d5cef649f444
          path: impl
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - working-directory: impl
        run: uv sync --extra dev
      - name: Validate recovery-v3 YAML and static contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('runrepo/.github/workflows/issue634-ridge-shared-cash-evaluation-recovery-v3.yml'); puts 'YAML_PARSE=PASS'"
          python - <<'PY'
          from pathlib import Path

          path = Path('runrepo/.github/workflows/issue634-ridge-shared-cash-evaluation-recovery-v3.yml')
          text = path.read_text()
          required = (
              '.github/authorizations/issue634-ridge-shared-cash-evaluation-recovery-v3.authorized',
              '65b8598e48b49ad3d9932195fdd7c5a8fa97e67f',
              'd1bf25fd66834289ffddb36063b0d5cef649f444',
              "PRIOR_RUN_V1: '35215537166'",
              "PRIOR_RUN_V2: '35215820350'",
              'issue539-calibrated-causal-successor-v3-34803217815',
              'issue634-ridge-shared-cash-result-v1',
              'issue634-ridge-shared-cash-fresh-v1',
              'issue634-ridge-shared-cash-audit-v1',
              'authority-check --result-slot empty',
              'authority-check --result-slot published',
              'issue634_shared_cash_runner.py evaluate',
              'issue634_shared_cash_runner.py reconstruct',
              'issue634_shared_cash_runner.py audit',
              'Validate result-blind authorities and load Dataset without evaluation',
              'Exactly-once shared-cash publisher',
              'Fresh independent shared-cash reconstruction',
              'Final independent audit and reveal',
          )
          for item in required:
              if item not in text:
                  raise SystemExit(f'recovery-v3 contract missing: {item}')
          forbidden = (
              'issue510-sealed-calibrated-successor-v3-34803217815',
              'workflow_dispatch:',
              'schedule:',
          )
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'recovery-v3 forbidden token present: {item}')
          if Path('runrepo/.github/authorizations/issue634-ridge-shared-cash-evaluation-recovery-v3.authorized').exists():
              raise SystemExit('recovery-v3 authorization must be absent during verification')
          preflight = text.index('Prove prior preflight failures consumed no economic slot')
          publisher = text.index('Exactly-once shared-cash publisher recovery v3')
          economic = text.index('Execute sealed shared-cash comparison exactly once without interpretation')
          publication = text.index('Publish immutable result before any interpretation')
          fresh = text.index('Fresh independent shared-cash reconstruction recovery v3')
          audit = text.index('Independent final audit and frozen decision reveal recovery v3')
          if not preflight < publisher < economic < publication < fresh < audit:
              raise SystemExit('recovery-v3 phase ordering drift')
          print('ISSUE634_RECOVERY_V3_STATIC_CONTRACT=PASS')
          print('REAL_MARKET_DATA_ACCESSED=false')
          print('ECONOMIC_EVALUATOR_CALLED=false')
          PY
      - name: Reconfirm verified helper and current empty economic slot
        working-directory: impl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run ruff check ../helper/.github/scripts/issue634_shared_cash_runner.py
          uv run ruff format --check ../helper/.github/scripts/issue634_shared_cash_runner.py
          uv run mypy ../helper/.github/scripts/issue634_shared_cash_runner.py
          uv run python ../helper/.github/scripts/issue634_shared_cash_runner.py authority-check --result-slot empty
          echo ISSUE634_RECOVERY_V3_EMPTY_SLOT=PASS
          echo REAL_MARKET_DATA_ACCESSED=false
          echo ECONOMIC_EVALUATOR_CALLED=false
      - name: Verify prior failed attempts still have zero artifacts and skipped economic jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          for run_id in (35215537166,35215820350):
              if get(f'actions/runs/{run_id}').get('conclusion')!='failure': raise SystemExit(f'prior run conclusion drift: {run_id}')
              if get(f'actions/runs/{run_id}/artifacts?per_page=100').get('total_count')!=0: raise SystemExit(f'prior run artifact count drift: {run_id}')
              jobs=get(f'actions/runs/{run_id}/jobs?per_page=100').get('jobs')
              if not isinstance(jobs,list): raise SystemExit(f'prior jobs missing: {run_id}')
              states={job.get('name'):job.get('conclusion') for job in jobs if isinstance(job,dict)}
              for name in ('Exactly-once shared-cash publisher','Fresh independent shared-cash reconstruction','Final independent audit and reveal'):
                  if states.get(name)!='skipped': raise SystemExit(f'prior economic job not skipped: {run_id} {name}')
          print('ISSUE634_PRIOR_ATTEMPTS_PRE_ECONOMIC=PASS')
          print('SHARED_CASH_ECONOMIC_EXECUTION_PERFORMED=false')
          PY
