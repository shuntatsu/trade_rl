name: tmp volume capacity format probe

on:
  push:
    branches:
      - fix/volume-unit-capacity-quantity
    paths:
      - .github/workflows/tmp-volume-capacity-format.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5a691708a1a8ebf008e8f137ce7512152a220325
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format tests/simulation/test_liquidity_volume_units.py
          git diff -- tests/simulation/test_liquidity_volume_units.py
          test -z "$(git status --short -- tests/simulation/test_liquidity_volume_units.py)"
