name: tmp volume characterization probe

on:
  push:
    branches:
      - fix/volume-unit-capacity-quantity
    paths:
      - .github/workflows/tmp-volume-characterization-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dbdee16fe56347d7dc6ce2e1b8ce5b1729946b4b
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Print fill-level characterization
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          import runpy

          ns = runpy.run_path("tests/simulation/test_stateful_execution_characterization.py")
          result = ns["_baseline_result"]()
          fills = [
              {
                  "event_type": event.event_type,
                  "filled_quantity": event.filled_quantity,
                  "execution_price": event.execution_price,
                  "filled_notional": event.filled_notional,
                  "participation_rate": event.participation_rate,
                  "trigger_segment": event.trigger_segment,
                  "available_volume_fraction": event.available_volume_fraction,
                  "order_id": event.order_id,
              }
              for event in result.order_events
              if event.event_type in {"filled", "partial_fill"}
          ]
          print("CHARACTERIZATION_FILLS="+json.dumps(fills, sort_keys=True, separators=(",", ":")))
          print("COST_BY_SYMBOL="+json.dumps(result.cost_by_symbol.tolist()))
          print("INTERVAL_COST="+repr(result.interval_cost))
          PY
