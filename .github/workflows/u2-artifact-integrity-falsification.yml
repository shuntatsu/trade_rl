name: U2 Artifact Integrity Falsification

on:
  push:
    branches:
      - verify/u2-artifact-integrity-falsification

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Static falsification precheck
        run: >-
          uv run ruff format --check --diff
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          && uv run ruff check
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
      - name: Execute artifact integrity falsification
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
