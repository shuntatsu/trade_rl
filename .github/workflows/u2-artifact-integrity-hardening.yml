name: U2 Artifact Integrity Hardening

on:
  push:
    branches:
      - verify/u2-artifact-integrity-hardening

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Static verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
      - name: Artifact-integrity and Selection verification
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
