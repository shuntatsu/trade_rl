name: U2 Development Fail-Closed Coverage

on:
  push:
    branches:
      - verify/u2-development-failclosed-coverage

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore: run U2 fail-closed coverage verification'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Apply oracle correction and format
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py")
          text = path.read_text(encoding="utf-8")
          old_authority = '        args = _with_base(canonical, **{field: 1})\n'
          new_authority = (
              '        drifted_base = _mutated(canonical["base_lock"], field, 1)\n'
              '        args = {**canonical, "base_lock": drifted_base}\n'
          )
          if text.count(old_authority) != 1:
              raise SystemExit(f"authority zero-open anchor count={text.count(old_authority)}")
          text = text.replace(old_authority, new_authority, 1)

          old_lock = '        drifted_base = replace(base_lock, **{field: 1}, digest="")\n'
          new_lock = '        drifted_base = _mutated(base_lock, field, 1)\n'
          if text.count(old_lock) != 1:
              raise SystemExit(f"lock zero-open anchor count={text.count(old_lock)}")
          text = text.replace(old_lock, new_lock, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py
      - name: Static checks
        run: |
          set -euo pipefail
          uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py
          uv run ruff check tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py
          git diff --check
      - name: Targeted fail-closed coverage
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py \
            tests/workflows/test_universal_trade_rl_u2_development_authority.py \
            tests/workflows/test_universal_trade_rl_u2_development_closure.py \
            --cov=trade_rl.workflows.universal_trade_rl_u2_development_authority \
            --cov=trade_rl.workflows.universal_trade_rl_u2_development_closure \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80
      - name: Commit verified test
        run: |
          set -euo pipefail
          branch="verify/u2-development-failclosed-coverage"
          git fetch origin "$branch"
          if [ "$(git rev-parse origin/$branch)" != "${GITHUB_SHA}" ]; then
            echo "Branch moved during verification; refusing push"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workflows/test_universal_trade_rl_u2_development_boundary_falsification.py
          git diff --cached --check
          git commit -m 'test: cover U2 Development fail-closed boundaries'
          git push origin HEAD:"$branch"
