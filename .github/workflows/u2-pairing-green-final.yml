name: U2 Pairing GREEN Final

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-pairing-green-final.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply minimal pairing identity GREEN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def one(lines: list[str], target: str, *, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if line == target]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one line, found {len(matches)}"
                  )
              return matches[0]

          def one_between(
              lines: list[str],
              target: str,
              *,
              start: int,
              stop: int,
              label: str,
          ) -> int:
              matches = [
                  index
                  for index in range(start, stop)
                  if lines[index] == target
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one regional line, found {len(matches)}"
                  )
              return matches[0]

          selection_path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          lines = selection_path.read_text(encoding="utf-8").splitlines()

          timestamp_index = one(
              lines,
              '            raise ValueError("U2 paired replay timestamps must be sorted and unique")',
              label="paired replay sorted timestamp guard",
          )
          if lines[timestamp_index - 1] != "        if timestamps != tuple(sorted(set(timestamps))):":
              raise SystemExit("paired replay timestamp guard context drifted")
          if lines[timestamp_index + 1] != '        object.__setattr__(self, "decision_timestamps_ns", timestamps)':
              raise SystemExit("paired replay timestamp setter context drifted")
          lines[timestamp_index + 1:timestamp_index + 1] = [
              "        if len(timestamps) > 1 and any(",
              "            timestamps[index] - timestamps[index - 1] != U2_DECISION_STEP_NS",
              "            for index in range(1, len(timestamps))",
              "        ):",
              "            raise ValueError(",
              '                "U2 paired replay timestamps must follow the 15m decision grid"',
              "            )",
          ]

          builder_start = one(
              lines,
              "def build_universal_trade_rl_u2_paired_replay_scope_evidence(",
              label="paired replay builder",
          )
          builder_stop = one(
              lines,
              "class UniversalTradeRLU2PairedExcessPoint:",
              label="paired excess class",
          )
          seed_start = one_between(
              lines,
              "    seed = candidate_replay.evaluation_seed",
              start=builder_start,
              stop=builder_stop,
              label="evaluation-seed misuse",
          )
          seed_end = one_between(
              lines,
              '        raise ValueError("U2 paired replay candidate checkpoint identity mismatch")',
              start=seed_start,
              stop=min(seed_start + 20, builder_stop),
              label="candidate checkpoint guard",
          )
          lines[seed_start:seed_end + 1] = [
              "    candidate_checkpoint = candidate_replay.paired_candidate_checkpoint_digest",
              "    if cash_replay.paired_candidate_checkpoint_digest != candidate_checkpoint:",
              '        raise ValueError("U2 paired replay candidate checkpoint identity mismatch")',
              "    matching_seeds = tuple(",
              "        seed",
              "        for seed, digest in checkpoint_closure.checkpoint_digests",
              "        if digest == candidate_checkpoint",
              "    )",
              "    if len(matching_seeds) != 1:",
              "        raise ValueError(",
              '            "U2 paired replay candidate checkpoint is outside exact training-seed closure"',
              "        )",
              "    training_seed = matching_seeds[0]",
          ]

          builder_stop = one(
              lines,
              "class UniversalTradeRLU2PairedExcessPoint:",
              label="paired excess class after seed patch",
          )
          return_start = one_between(
              lines,
              "    return UniversalTradeRLU2PairedReplayScopeEvidence(",
              start=builder_start,
              stop=builder_stop,
              label="paired replay return",
          )
          training_seed_line = one_between(
              lines,
              "        training_seed=seed,",
              start=return_start,
              stop=builder_stop,
              label="returned training seed",
          )
          lines[training_seed_line] = "        training_seed=training_seed,"
          checkpoint_line = one_between(
              lines,
              "        paired_candidate_checkpoint_digest=expected_checkpoint,",
              start=return_start,
              stop=builder_stop,
              label="returned paired checkpoint",
          )
          lines[checkpoint_line] = (
              "        paired_candidate_checkpoint_digest=candidate_checkpoint,"
          )

          robustness_start = one(
              lines,
              "def evaluate_universal_trade_rl_u2_seed_robustness(",
              label="robustness evaluator",
          )
          final_schema = one(
              lines,
              "U2_DEVELOPMENT_SELECTION_EVIDENCE_SCHEMA: Final = (",
              label="final selection schema",
          )
          threshold_line = one_between(
              lines,
              "    thresholds = _u2_cross_seed_robustness_thresholds()",
              start=robustness_start,
              stop=final_schema,
              label="robustness threshold evaluation",
          )
          if lines[threshold_line - 3] != '    if scope == "D1+D2" and set(observed_windows) != set(expected_windows):':
              raise SystemExit("robustness aggregate scope context drifted")
          if lines[threshold_line - 2] != '        raise ValueError("U2 seed-robustness aggregate bootstrap scope is invalid")':
              raise SystemExit("robustness aggregate guard context drifted")
          pairing_guard = [
              "    paired_scope_evidence = tuple(",
              "        pair",
              "        for segment in selected_segments",
              "        for pair in segment.paired_scope_evidence",
              "    )",
              "    if paired_scope_evidence:",
              "        paired_candidate_replays = {",
              "            (",
              "                pair.training_seed,",
              "                pair.cell,",
              "                pair.concrete_symbol,",
              "                pair.scope_digest,",
              "            ): pair.candidate_replay_evidence_digest",
              "            for pair in paired_scope_evidence",
              "        }",
              "        if len(paired_candidate_replays) != len(paired_scope_evidence):",
              "            raise ValueError(",
              '                "U2 seed-robustness contains duplicate leaf pairing identity"',
              "            )",
              "        for leaf in resolved_leaves:",
              "            leaf_identity = (",
              "                leaf.training_seed,",
              "                leaf.cell,",
              "                leaf.concrete_symbol,",
              "                leaf.tile_identity,",
              "            )",
              "            if (",
              "                paired_candidate_replays.get(leaf_identity)",
              "                != leaf.replay_evidence_digest",
              "            ):",
              "                raise ValueError(",
              '                    "U2 seed-robustness leaf/candidate replay pairing provenance mismatch"',
              "                )",
              "",
          ]
          lines[threshold_line:threshold_line] = pairing_guard
          selection_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          final_path = Path("tests/workflows/test_universal_trade_rl_u2_selection_final.py")
          final_lines = final_path.read_text(encoding="utf-8").splitlines()
          import_line = one(
              final_lines,
              "from trade_rl.artifacts.hashing import content_digest",
              label="final fixture hashing import",
          )
          final_lines[import_line + 1:import_line + 1] = [
              "from trade_rl.workflows.universal_trade_rl_u2_time_partition import (",
              "    U2_DECISION_STEP_NS,",
              ")",
          ]

          candidate_fixture = one(
              final_lines,
              '                    "fixture": "u2-final-pairing-candidate",',
              label="final candidate pairing fixture",
          )
          if final_lines[candidate_fixture + 1] != '                    "seed": seed,':
              raise SystemExit("final candidate pairing seed context drifted")
          if final_lines[candidate_fixture + 2] != '                    "window": window,':
              raise SystemExit("final candidate pairing window context drifted")
          final_lines[candidate_fixture] = (
              '                    "fixture": "u2-final-selection-replay",'
          )
          final_lines[candidate_fixture + 1:candidate_fixture + 3] = [
              '                    "cell": cell,',
              '                    "seed": seed,',
          ]

          d1_timestamp = one(
              final_lines,
              '            ("development_future_1", "D1", (100, 200, 300, 400)),',
              label="final D1 paired timestamps",
          )
          if final_lines[d1_timestamp + 1] != '            ("development_future_2", "D2", (500, 600, 700, 800)),':
              raise SystemExit("final D2 paired timestamp context drifted")
          final_lines[d1_timestamp:d1_timestamp + 2] = [
              "            (",
              '                "development_future_1",',
              '                "D1",',
              "                tuple(",
              "                    100 + index * U2_DECISION_STEP_NS for index in range(4)",
              "                ),",
              "            ),",
              "            (",
              '                "development_future_2",',
              '                "D2",',
              "                tuple(",
              "                    500 + index * U2_DECISION_STEP_NS for index in range(4)",
              "                ),",
              "            ),",
          ]
          final_path.write_text("\n".join(final_lines) + "\n", encoding="utf-8")
          PY

      - name: Format GREEN changes
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py

      - name: Focused GREEN verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py
          git diff --check

      - name: Commit GREEN and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/universal-trade-rl-u2-base-ppo-implementation"
          git fetch origin "$branch"
          remote_head="$(git rev-parse "origin/$branch")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from trigger head: $GITHUB_SHA -> $remote_head" >&2
            exit 1
          fi
          rm .github/workflows/u2-pairing-green-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            .github/workflows/u2-pairing-green-final.yml
          git diff --cached --check
          git status --short
          git commit -m "fix: close U2 pairing identity chain"
          git push origin "HEAD:$branch"
