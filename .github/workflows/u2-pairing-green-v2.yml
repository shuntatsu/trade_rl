name: U2 Pairing GREEN v2

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-pairing-green-v2.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply minimal provenance integration patch
        run: uv run python .github/u2_pairing_integration_patch.py

      - name: Focused static and behavior verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            trade_rl/workflows/universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            trade_rl/workflows/universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            trade_rl/workflows/universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run mypy \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            trade_rl/workflows/universal_trade_rl_u2_selection_pairing.py
          uv run pytest -q \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py

      - name: Commit GREEN and remove temporary helpers
        shell: bash
        env:
          BRANCH: codex/universal-trade-rl-u2-base-ppo-implementation
        run: |
          set -euo pipefail
          rm .github/workflows/u2-pairing-red.yml
          rm .github/workflows/u2-pairing-green.yml
          rm .github/workflows/u2-pairing-green-v2.yml
          rm .github/u2_pairing_integration_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            trade_rl/workflows/universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            .github/workflows/u2-pairing-red.yml \
            .github/workflows/u2-pairing-green.yml \
            .github/workflows/u2-pairing-green-v2.yml \
            .github/u2_pairing_integration_patch.py
          git diff --cached --check
          git commit -m "fix: bind U2 cash pairing provenance"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git push origin "HEAD:$BRANCH"
