name: U2 Cash Pairing Provenance GREEN

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/apply_u2_pairing_provenance_v2.py"
      - ".github/workflows/u2-pairing-provenance-green.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Apply pairing provenance patch
        run: python .github/apply_u2_pairing_provenance_v2.py
      - name: Format changed code
        run: >-
          uv run ruff format
          trade_rl/workflows/universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
      - name: Verify formatting and lint
        run: >-
          uv run ruff format --check --diff
          trade_rl/workflows/universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          && uv run ruff check
          trade_rl/workflows/universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
      - name: Verify source types
        run: uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
      - name: Verify Selection and pairing contracts
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_metrics.py
          tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
      - name: Commit GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/apply_u2_pairing_provenance_v2.py
          rm .github/workflows/u2-pairing-provenance-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            .github/apply_u2_pairing_provenance_v2.py \
            .github/workflows/u2-pairing-provenance-green.yml
          git diff --cached --check
          git commit -m "feat: bind U2 robustness to exact cash pairing provenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
