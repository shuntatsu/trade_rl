name: U2 Predevelopment Documentation Closure

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-predevelopment-doc-closure-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true
      - name: Align normative documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one target, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          spec = "docs/implementation-plans/specs/2026-09-06-universal-trade-rl-u2-pre-development-closure-amendment.md"
          replace_exact(
              spec,
              '''After Development is opened, changing any field above requires a new U2 generation.\n\n---\n\n## 11. Acceptance Criteria''',
              '''After Development is opened, changing any field above requires a new U2 generation.\n\nThe only supported public U2 V1 numeric Development session entry is the lock-bound `build_authoritative_universal_trade_rl_u2_development_replay_session(...)`. The unlocked lower builder is an internal synthetic/integration-test helper, is not exported through `universal_trade_rl_u2_replay.__all__`, and is not an authorized real-Development API. The authoritative entry must validate the exact base lock, authoritative lock, scope closure, evaluation dataset mapping, source-tree digest, lockfile digest, evaluation-runtime identity, and zero prior Development/Admission opens before the first source-loader call.\n\n---\n\n## 11. Acceptance Criteria''',
          )
          replace_exact(
              spec,
              '''10. Existing U0/U1 economics, U2 PPO recipe, economic threshold values, time partition, and Admission firewall remain unchanged.\n11. Targeted, falsification, integration, static/type/architecture, full-suite/build, and exact-head CI gates pass on one final HEAD.''',
              '''10. Existing U0/U1 economics, U2 PPO recipe, economic threshold values, time partition, and Admission firewall remain unchanged.\n11. Targeted, falsification, integration, static/type/architecture, full-suite/build, and exact-head CI gates pass on one final HEAD.\n12. Actual numeric Development session construction requires the exact authoritative Development lock and rejects lock/scope/dataset/source-tree/lockfile/runtime drift before any source-loader call; no unlocked builder is part of the supported public U2 V1 API.\n13. Replay evidence stores same-path gross and net simple-return series from one U1 execution path, and both series independently reconcile to their bound wealth ratios; gross economics are never obtained by rerunning a separate cost-free environment.''',
          )

          plan = "docs/implementation-plans/plans/2026-09-03-universal-trade-rl-u2-base-ppo-selection.md"
          replace_exact(
              plan,
              '''### Step 5 — RED: exact resume lineage\n\nResume must preserve:\n\n- U2 contract digest\n- seed\n- model architecture\n- U1 digest\n- source closure\n- actual timesteps\n\nWrong lineage fails before optimizer update.''',
              '''### Step 5 — RED: interrupted-run semantics\n\nU2 V1 does **not** claim exact mid-episode / optimizer / vector-rollout resume. Intermediate checkpoints are recovery/debug evidence only and can never become Selection candidates.\n\nFor an interrupted real member:\n\n```text\nexact_mid_episode_resume_supported = false\nrestart_from_timestep_zero_required = true\nseed / U2 contract / U1 / source closure remain frozen\n```\n\nA restarted member begins again at timestep zero under the same frozen generation and seed. An economically poor completed seed is not an interruption and cannot be retried for a better result. The only Selection candidate remains the exact final `524288` checkpoint.''',
          )

          superplan = "docs/superpowers/plans/2026-09-06-universal-trade-rl-u2-pre-development-closure.md"
          replace_exact(
              superplan,
              '''- Development/Admission numeric opens can occur before lock;\n- an existing U0/U1 economic contract changed.''',
              '''- Development/Admission numeric opens can occur before lock;\n- an unlocked numeric Development builder remains in the supported public API;\n- gross economics can be generated from a different replay than net economics;\n- an existing U0/U1 economic contract changed.''',
          )
          replace_exact(
              superplan,
              '''**Files:** No production changes unless a defect is found.''',
              '''**Files:** No production changes unless a defect is found. Implementation-time falsification did find and close three additional defects before Development numeric opening: authoritative-lock enforcement at the numeric session boundary, same-path gross/net replay evidence, and removal of the unlocked Development builder from the supported public API.''',
          )
          PY
      - name: Verify documentation authority markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'only supported public U2 V1 numeric Development session entry' docs/implementation-plans/specs/2026-09-06-universal-trade-rl-u2-pre-development-closure-amendment.md
          grep -q 'restart_from_timestep_zero_required = true' docs/implementation-plans/plans/2026-09-03-universal-trade-rl-u2-base-ppo-selection.md
          grep -q 'same-path gross/net replay evidence' docs/superpowers/plans/2026-09-06-universal-trade-rl-u2-pre-development-closure.md
      - name: Commit documentation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/implementation-plans/specs/2026-09-06-universal-trade-rl-u2-pre-development-closure-amendment.md \
            docs/implementation-plans/plans/2026-09-03-universal-trade-rl-u2-base-ppo-selection.md \
            docs/superpowers/plans/2026-09-06-universal-trade-rl-u2-pre-development-closure.md
          git commit -m "docs: close U2 pre-development authority contract"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
