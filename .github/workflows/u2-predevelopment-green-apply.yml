name: U2 Predevelopment GREEN Apply

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-predevelopment-green-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Apply exact GREEN patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "trade_rl/workflows/universal_trade_rl_u2_contract.py",
              '''        "outcome_must_not_exceed_fit_end": True,\n        "deterministic_resumable": True,\n        "regime_oversampling": False,''',
              '''        "outcome_must_not_exceed_fit_end": True,\n        "exact_mid_episode_resume_supported": False,\n        "restart_from_timestep_zero_required": True,\n        "regime_oversampling": False,''',
          )

          replace_exact(
              "tests/workflows/test_universal_trade_rl_u2_development_closure.py",
              '''    altered_base = replace(\n        base_lock,\n        checkpoint_digests=tuple(reversed(base_lock.checkpoint_digests)),\n        digest="",\n    )''',
              '''    altered_base = replace(\n        base_lock,\n        checkpoint_digests=tuple(\n            (\n                seed,\n                content_digest({"fixture": "altered-checkpoint", "seed": seed}),\n            )\n            for seed, _digest in base_lock.checkpoint_digests\n        ),\n        digest="",\n    )''',
          )

          replace_exact(
              "tests/workflows/test_universal_trade_rl_u2_selection.py",
              '''                sampled_indices.extend(\n                    (start + offset) % segment_length\n                    for offset in range(block_length)\n                )''',
              '''                sampled_indices.extend(\n                    (start + offset) % segment_length for offset in range(block_length)\n                )''',
          )
          PY

      - name: Format and static checks
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_contract.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/workflows/test_universal_trade_rl_u2_development_closure.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_contract.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/workflows/test_universal_trade_rl_u2_development_closure.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py
          uv run mypy \
            trade_rl/workflows/universal_trade_rl_u2_contract.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py

      - name: Verify observed RED cases are GREEN
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_predevelopment_falsification.py::test_u2_episode_sampling_machine_contract_disables_exact_resume
          tests/workflows/test_universal_trade_rl_u2_predevelopment_falsification.py::test_u2_authoritative_replay_lock_validation_rejects_drift
          tests/workflows/test_universal_trade_rl_u2_predevelopment_falsification.py::test_u2_authoritative_session_checks_lock_before_numeric_builder
          tests/workflows/test_universal_trade_rl_u2_development_closure.py::test_u2_authoritative_development_lock_requires_validated_checkpoint_and_exposure

      - name: Commit GREEN patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/u2-predevelopment-green-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_contract.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/workflows/test_universal_trade_rl_u2_development_closure.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py
          git commit -m "fix: close U2 pre-development resume and lock gaps"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
