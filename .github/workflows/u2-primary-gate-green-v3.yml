name: U2 Task2 Contract-Bound GREEN

on:
  push:
    branches:
      - codex/u2-selection-task2-contract-integration
    paths:
      - ".github/workflows/u2-primary-gate-green-v3.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev

      - name: Add threshold-source falsification test
        run: |
          set -euo pipefail
          python .github/apply_u2_primary_gate_green.py tests
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Confirm new contract test is RED before production patch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py::test_u2_primary_cell_gate_uses_preregistered_threshold_payload \
            > /tmp/task2-threshold-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task2-threshold-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected threshold-binding RED, but the test passed before production patch" >&2
            exit 1
          fi
          grep -E "AttributeError|evaluate_universal_trade_rl_u2_primary_cell_gate" /tmp/task2-threshold-red.log

      - name: Apply contract-bound primary gate
        run: |
          set -euo pipefail
          python .github/apply_u2_primary_gate_green.py source
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Static verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Focused Selection verification
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py

      - name: Commit verified source tests and helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/apply_u2_primary_gate_green.py \
            .github/workflows/u2-primary-gate-green.yml \
            .github/workflows/u2-primary-gate-green-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          git diff --cached --check
          git commit -m "feat: bind U2 primary Selection gate to frozen contract"
          git push origin HEAD:codex/u2-selection-task2-contract-integration
