name: U2 Primary Gate GREEN v3

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation

permissions:
  contents: write

jobs:
  green:
    if: "github.event.head_commit.message == 'stage U2 primary gate GREEN v3'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply and verify GREEN
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_u2_primary_gate_green.py
          uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run ruff format --check --diff trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff check trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_gate.py tests/workflows/test_universal_trade_rl_u2_selection_metrics.py tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py tests/workflows/test_universal_trade_rl_u2_selection.py

      - name: Commit GREEN source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          test "$(git diff --cached --name-only)" = "trade_rl/workflows/universal_trade_rl_u2_selection.py"
          git commit -m 'feat: enforce U2 primary Selection cell gate'
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
