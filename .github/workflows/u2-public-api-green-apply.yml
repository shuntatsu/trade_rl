name: U2 Public API GREEN Apply

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-public-api-green-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Make unlocked Development session builder private
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          private = "_build_universal_trade_rl_u2_development_replay_session_unlocked"
          public = "build_universal_trade_rl_u2_development_replay_session"

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "trade_rl/workflows/universal_trade_rl_u2_replay.py",
              f"def {public}(\n",
              f"def {private}(\n",
          )
          replace_exact(
              "trade_rl/workflows/universal_trade_rl_u2_replay.py",
              f'    "{public}",\n',
              "",
          )
          replace_exact(
              "trade_rl/workflows/universal_trade_rl_u2_development_authority.py",
              f"    {public},\n",
              f"    {private},\n",
          )
          replace_exact(
              "trade_rl/workflows/universal_trade_rl_u2_development_authority.py",
              f"    return {public}(\n",
              f"    return {private}(\n",
          )
          replace_exact(
              "tests/integrations/test_universal_trade_rl_u2_replay.py",
              f"    {public},\n",
              f"    {private},\n",
          )
          replace_exact(
              "tests/integrations/test_universal_trade_rl_u2_replay.py",
              f"    session = {public}(\n",
              f"    session = {private}(\n",
          )
          PY
      - name: Verify GREEN
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_replay.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/integrations/test_universal_trade_rl_u2_replay.py \
            tests/workflows/test_universal_trade_rl_u2_public_api.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_replay.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/integrations/test_universal_trade_rl_u2_replay.py \
            tests/workflows/test_universal_trade_rl_u2_public_api.py
          uv run mypy \
            trade_rl/workflows/universal_trade_rl_u2_replay.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_public_api.py \
            tests/integrations/test_universal_trade_rl_u2_replay.py::test_u2_replay_resets_actual_u1_environment_on_exact_scope_boundaries
      - name: Commit GREEN and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/u2-public-api-red.yml \
            .github/workflows/u2-public-api-green-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_replay.py \
            trade_rl/workflows/universal_trade_rl_u2_development_authority.py \
            tests/integrations/test_universal_trade_rl_u2_replay.py \
            tests/workflows/test_universal_trade_rl_u2_public_api.py
          git commit -m "fix: make unlocked U2 Development builder internal"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
