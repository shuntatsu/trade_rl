name: U2 Selection Coverage Tests

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-coverage-tests.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Format and verify fail-closed tests
        run: |
          set -euo pipefail
          uv run ruff check --fix tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py
          uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py
          uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py
          uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py
          git diff --check

      - name: Commit formatted tests and remove helper
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Remote head moved from exact trigger SHA; refusing to overwrite"
            exit 1
          fi
          rm .github/workflows/u2-selection-coverage-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflows/test_universal_trade_rl_u2_selection_fail_closed_coverage.py .github/workflows/u2-selection-coverage-tests.yml
          git diff --cached --check
          git commit -m "test: harden U2 Selection fail-closed coverage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
