name: U2 Selection Failure Modes Adopt

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-failure-modes-adopt.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply verified fixture correction
        run: >-
          python -c "from pathlib import Path; p=Path('tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py'); s=p.read_text(); old='\"bootstrap\": robustness[0].bootstrap_result,'; new='\"bootstrap\": robustness[2].bootstrap_result,'; assert s.count(old)==1; p.write_text(s.replace(old,new,1))"

      - name: Verify adopted failure-mode suite
        run: |
          set -euo pipefail
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py
          uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py
          uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py
          uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py
          uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py \
            --cov=trade_rl.workflows.universal_trade_rl_u2_selection \
            --cov-branch --cov-report=term-missing --cov-fail-under=0
          git diff --check

      - name: Commit tests and remove helper
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Remote head moved from exact trigger SHA; refusing to overwrite"
            exit 1
          fi
          rm .github/workflows/u2-selection-failure-modes-adopt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflows/test_universal_trade_rl_u2_selection_failure_modes.py .github/workflows/u2-selection-failure-modes-adopt.yml
          git diff --cached --check
          git commit -m "test: cover U2 Selection failure modes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
