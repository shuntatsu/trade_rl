name: U2 Selection GREEN Apply

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-green-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Update only stale resume fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/rl/test_universal_trade_u2_environment_factory.py")
          text = path.read_text(encoding="utf-8")
          old = '''            "outcome_must_not_exceed_fit_end": True,\n            "deterministic_resumable": True,\n            "regime_oversampling": False,'''
          new = '''            "outcome_must_not_exceed_fit_end": True,\n            "exact_mid_episode_resume_supported": False,\n            "restart_from_timestep_zero_required": True,\n            "regime_oversampling": False,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one stale resume fixture, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Format and static checks
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/rl/test_universal_trade_u2_environment_factory.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/rl/test_universal_trade_u2_environment_factory.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Verify Selection RED cases are GREEN
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/rl/test_universal_trade_u2_environment_factory.py
          tests/rl/test_universal_trade_u2_factory_lineage.py

      - name: Commit GREEN patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/u2-selection-green-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/rl/test_universal_trade_u2_environment_factory.py
          git commit -m "fix: close U2 segmented bootstrap contract"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
