name: U2 Selection Input Integrity RED

on:
  push:
    branches:
      - verify/u2-selection-input-integrity-final

permissions:
  contents: read

jobs:
  red:
    if: "github.event.head_commit.message == 'chore: verify U2 Selection input integrity RED'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Normalize oracle formatting
        run: uv run ruff format tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
      - name: Static RED precheck
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run ruff check \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            trade_rl/workflows/universal_trade_rl_u2_selection.py
      - name: Execute boundary integrity RED
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
