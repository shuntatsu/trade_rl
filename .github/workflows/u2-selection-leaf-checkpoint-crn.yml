name: U2 Leaf Checkpoint CRN

on:
  push:
    branches:
      - verify/u2-selection-leaf-checkpoint-crn-final

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore: run U2 leaf checkpoint CRN GREEN'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Apply leaf checkpoint and CRN fix
        run: |
          set -euo pipefail
          python .github/apply_u2_selection_leaf_checkpoint_crn.py
          uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py
      - name: Static verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check
      - name: Focused U2 Selection verification
        run: >-
          uv run pytest -q
          tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_metrics.py
          tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/workflows/test_universal_trade_rl_u2_public_api.py
      - name: Push verified source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --cached --check
          git commit -m 'fix: bind U2 Selection leaf to checkpoint and CRN identity'
          git push origin HEAD:verify/u2-selection-leaf-checkpoint-crn-final
