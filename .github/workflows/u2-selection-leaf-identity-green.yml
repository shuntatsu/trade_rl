name: U2 Selection Leaf Identity GREEN

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-leaf-identity-green.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Apply stale-artifact fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if not isinstance(
              checkpoint_closure,
              UniversalTradeRLU2FinalCheckpointClosure,
          ):
              raise TypeError("U2 Selection leaf requires final checkpoint closure")
          if checkpoint_closure.u2_contract_digest != replay_evidence.u2_contract_digest:
          '''
          new = '''    if not isinstance(
              checkpoint_closure,
              UniversalTradeRLU2FinalCheckpointClosure,
          ):
              raise TypeError("U2 Selection leaf requires final checkpoint closure")
          _require_current_artifact_digest(
              replay_evidence,
              field="U2 Selection leaf replay evidence",
          )
          _require_current_artifact_digest(
              checkpoint_closure,
              field="U2 Selection leaf checkpoint closure",
          )
          if checkpoint_closure.u2_contract_digest != replay_evidence.u2_contract_digest:
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Selection leaf integrity anchor: expected 1, got {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format source
        run: uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Verify static quality
        run: |
          uv run ruff format --check --diff trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run ruff check trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Verify stale-artifact RED becomes GREEN
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py

      - name: Verify Selection and pairing regressions
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_metrics.py
          tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          tests/workflows/test_universal_trade_rl_u2_selection_final.py
          tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py
          tests/integrations/test_universal_trade_rl_u2_selection_pairing.py

      - name: Commit clean GREEN source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/u2-selection-leaf-identity-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py .github/workflows/u2-selection-leaf-identity-green.yml
          git diff --cached --check
          git commit -m "fix: reject stale U2 Selection leaf artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
