name: U2 Selection Leaf Digest GREEN

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-leaf-identity-green.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Apply minimal stale-digest guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          start = lines.index("def build_universal_trade_rl_u2_selection_leaf_metrics(")
          stop = lines.index("def summarize_universal_trade_rl_u2_selection_metrics(", start)
          region = lines[start:stop]
          if any("_require_current_artifact_digest(" in line for line in region):
              raise SystemExit("Selection leaf freshness guard already exists")

          target = '        raise TypeError("U2 Selection leaf requires final checkpoint closure")'
          matches = [i for i in range(start, stop) if lines[i] == target]
          if len(matches) != 1:
              raise SystemExit(f"expected one checkpoint type guard, found {len(matches)}")
          index = matches[0]
          if lines[index + 1] != "    if checkpoint_closure.u2_contract_digest != replay_evidence.u2_contract_digest:":
              raise SystemExit("Selection leaf identity context drifted")

          lines[index + 1:index + 1] = [
              "    _require_current_artifact_digest(",
              "        replay_evidence,",
              '        field="U2 Selection leaf replay evidence",',
              "    )",
              "    _require_current_artifact_digest(",
              "        checkpoint_closure,",
              '        field="U2 Selection leaf checkpoint closure",',
              "    )",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Verify focused GREEN
        run: |
          set -euo pipefail
          uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py
          git diff --check

      - name: Commit GREEN and remove helper
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Remote head moved from exact trigger SHA; refusing to overwrite"
            exit 1
          fi
          rm .github/workflows/u2-selection-leaf-identity-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py .github/workflows/u2-selection-leaf-identity-green.yml
          git diff --cached --check
          git commit -m "fix: reject stale U2 Selection leaf artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
