name: U2 Selection Leaf Integrity GREEN

on:
  push:
    branches:
      - verify/u2-selection-leaf-integrity-green

permissions:
  contents: write

jobs:
  green:
    if: "github.event.head_commit.message == 'chore: run U2 Selection leaf integrity GREEN'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply minimal stale-digest GREEN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          anchor = '        raise TypeError("U2 Selection leaf requires final checkpoint closure")'
          matches = [index for index, line in enumerate(lines) if line == anchor]
          if len(matches) != 1:
              raise SystemExit(f"Selection leaf integrity anchor count={len(matches)}")
          index = matches[0]
          expected_next = (
              "    if checkpoint_closure.u2_contract_digest "
              "!= replay_evidence.u2_contract_digest:"
          )
          if index + 1 >= len(lines) or lines[index + 1] != expected_next:
              raise SystemExit("Selection leaf integrity context drifted")
          insertion = [
              "    _require_current_artifact_digest(",
              "        replay_evidence,",
              '        field="U2 Selection leaf replay evidence",',
              "    )",
              "    _require_current_artifact_digest(",
              "        checkpoint_closure,",
              '        field="U2 Selection leaf checkpoint closure",',
              "    )",
          ]
          lines[index + 1:index + 1] = insertion
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_artifact_integrity_falsification.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py \
            tests/integrations/test_universal_trade_rl_u2_selection_pairing.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection_final.py

      - name: Falsification presence check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py").read_text(encoding="utf-8")
          function = text[text.index("def build_universal_trade_rl_u2_selection_leaf_metrics("):text.index("\ndef summarize_universal_trade_rl_u2_selection_metrics(")]
          required = (
              'field="U2 Selection leaf replay evidence"',
              'field="U2 Selection leaf checkpoint closure"',
          )
          missing = [token for token in required if token not in function]
          if missing:
              raise SystemExit(f"missing leaf integrity bindings: {missing}")
          PY

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          branch="verify/u2-selection-leaf-integrity-green"
          git fetch origin "$branch"
          if [ "$(git rev-parse origin/$branch)" != "${GITHUB_SHA}" ]; then
            echo "Branch moved during verification; refusing push"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --cached --check
          git commit -m 'fix: reject stale U2 Selection leaf inputs'
          git push origin HEAD:"$branch"
