name: U2 Selection Metrics GREEN Apply R2

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-metrics-green-apply-r2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Reuse exact Selection implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path(".github/workflows/u2-selection-metrics-green-apply.yml")
          text = path.read_text(encoding="utf-8")
          marker = "      - name: Apply Selection metric implementation\n        shell: bash\n        run: |\n"
          if text.count(marker) != 1:
              raise SystemExit("Selection patch step is not unique")
          body_start = text.index(marker) + len(marker)
          body_end = text.index("\n      - name:", body_start)
          body = text[body_start:body_end]
          lines = body.splitlines()
          if not lines or any(line and not line.startswith("          ") for line in lines):
              raise SystemExit("Selection patch indentation drifted")
          script = "\n".join(line[10:] for line in lines) + "\n"
          subprocess.run(["bash", "-c", script], check=True)
          PY

      - name: Format and static checks
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Verify workflow Selection GREEN
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_metrics.py

      - name: Verify integration Selection GREEN
        run: >-
          uv run pytest -q
          tests/integrations/test_universal_trade_rl_u2_selection_metrics.py

      - name: Commit GREEN patch and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/u2-selection-metrics-green-apply.yml \
            .github/workflows/u2-selection-metrics-green-apply-r2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          git commit -m "feat: execute frozen U2 Selection metrics"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
