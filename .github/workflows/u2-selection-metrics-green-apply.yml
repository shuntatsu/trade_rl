name: U2 Selection Metrics GREEN Apply

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-metrics-green-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Apply Selection metric implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from trade_rl.artifacts.hashing import content_digest\nfrom trade_rl.workflows.universal_trade_rl_u2_contract import U2_TRAINING_SEEDS\n"
          new_import = "from trade_rl.artifacts.hashing import content_digest\nfrom trade_rl.domain.common import require_sha256\nfrom trade_rl.workflows.universal_trade_rl_u2_contract import U2_TRAINING_SEEDS\n"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected Selection import anchor")
          text = text.replace(old_import, new_import)

          old_constants = '''U2_DEVELOPMENT_WINDOWS: Final = (\n    "development_future_1",\n    "development_future_2",\n)\n_U2_BOOTSTRAP_RESAMPLES: Final = 2_000\n'''
          new_constants = '''U2_DEVELOPMENT_WINDOWS: Final = (\n    "development_future_1",\n    "development_future_2",\n)\nU2_SELECTION_LEAF_METRICS_SCHEMA: Final = (\n    "universal_trade_rl_u2_selection_leaf_metrics_v1"\n)\nU2_SELECTION_SUMMARY_SCHEMA: Final = "universal_trade_rl_u2_selection_summary_v1"\n_U2_MEANINGFUL_EXECUTION_TURNOVER_TOLERANCE: Final = 1e-6\n_U2_BOOTSTRAP_RESAMPLES: Final = 2_000\n'''
          if text.count(old_constants) != 1:
              raise SystemExit("unexpected Selection constants anchor")
          text = text.replace(old_constants, new_constants)

          anchor = '''def _non_negative_int(value: object, *, field: str) -> int:\n    if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n        raise ValueError(f"{field} must be a non-negative integer")\n    return value\n\n\n@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2PairedExcessPoint:\n'''
          block = '''def _non_negative_int(value: object, *, field: str) -> int:\n    if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n        raise ValueError(f"{field} must be a non-negative integer")\n    return value\n\n\ndef _positive_wealth(log_growth: float, *, field: str) -> float:\n    try:\n        wealth = math.exp(log_growth)\n    except OverflowError as exc:\n        raise ValueError(f"{field} overflowed finite wealth") from exc\n    if not math.isfinite(wealth) or wealth <= 0.0:\n        raise ValueError(f"{field} must map to finite positive wealth")\n    return wealth\n\n\n@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2SelectionLeafMetrics:\n    """One candidate Selection leaf derived from one maintained U1 replay."""\n\n    training_seed: int\n    cell: str\n    concrete_symbol: str\n    tile_identity: str\n    replay_evidence_digest: str\n    leaf_net_log_growth: float\n    leaf_gross_log_growth: float\n    turnover_per_day: float\n    meaningful_execution: bool\n    schema_version: str = U2_SELECTION_LEAF_METRICS_SCHEMA\n    digest: str = ""\n\n    def __post_init__(self) -> None:\n        if self.schema_version != U2_SELECTION_LEAF_METRICS_SCHEMA:\n            raise ValueError("unsupported U2 Selection leaf metrics schema")\n        if (\n            isinstance(self.training_seed, bool)\n            or self.training_seed not in U2_TRAINING_SEEDS\n        ):\n            raise ValueError("U2 Selection leaf training seed is outside fixed closure")\n        for field_name, value in (\n            ("cell", self.cell),\n            ("concrete symbol", self.concrete_symbol),\n        ):\n            if not isinstance(value, str) or not value:\n                raise ValueError(f"U2 Selection leaf {field_name} must be non-empty")\n        require_sha256(self.tile_identity, field="U2 Selection leaf tile identity")\n        require_sha256(\n            self.replay_evidence_digest,\n            field="U2 Selection leaf replay evidence digest",\n        )\n        for field_name in ("leaf_net_log_growth", "leaf_gross_log_growth"):\n            object.__setattr__(\n                self,\n                field_name,\n                _finite(getattr(self, field_name), field=f"U2 Selection {field_name}"),\n            )\n        turnover_per_day = _finite(\n            self.turnover_per_day,\n            field="U2 Selection turnover per day",\n        )\n        if turnover_per_day < 0.0:\n            raise ValueError("U2 Selection turnover per day cannot be negative")\n        object.__setattr__(self, "turnover_per_day", turnover_per_day)\n        if not isinstance(self.meaningful_execution, bool):\n            raise TypeError("U2 Selection meaningful execution must be boolean")\n\n        expected = content_digest(self.to_payload(include_digest=False))\n        if self.digest:\n            require_sha256(self.digest, field="U2 Selection leaf metrics digest")\n            if self.digest != expected:\n                raise ValueError("U2 Selection leaf metrics digest mismatch")\n        object.__setattr__(self, "digest", expected)\n\n    @property\n    def leaf_net_wealth(self) -> float:\n        return _positive_wealth(\n            self.leaf_net_log_growth,\n            field="U2 Selection leaf net log growth",\n        )\n\n    @property\n    def leaf_gross_wealth(self) -> float:\n        return _positive_wealth(\n            self.leaf_gross_log_growth,\n            field="U2 Selection leaf gross log growth",\n        )\n\n    @property\n    def identity(self) -> tuple[int, str, str, str]:\n        return (\n            self.training_seed,\n            self.cell,\n            self.concrete_symbol,\n            self.tile_identity,\n        )\n\n    def to_payload(self, *, include_digest: bool = True) -> dict[str, object]:\n        payload: dict[str, object] = {\n            "schema_version": self.schema_version,\n            "training_seed": self.training_seed,\n            "cell": self.cell,\n            "concrete_symbol": self.concrete_symbol,\n            "tile_identity": self.tile_identity,\n            "replay_evidence_digest": self.replay_evidence_digest,\n            "leaf_net_log_growth": self.leaf_net_log_growth,\n            "leaf_gross_log_growth": self.leaf_gross_log_growth,\n            "turnover_per_day": self.turnover_per_day,\n            "meaningful_execution": self.meaningful_execution,\n        }\n        if include_digest:\n            payload["artifact_digest"] = self.digest\n        return payload\n\n\n@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2SelectionSymbolMetrics:\n    """Equal-vote symbol aggregation of Selection leaves."""\n\n    concrete_symbol: str\n    symbol_net_log_growth: float\n    symbol_gross_log_growth: float\n    meaningful_execution: bool\n\n    def __post_init__(self) -> None:\n        if not isinstance(self.concrete_symbol, str) or not self.concrete_symbol:\n            raise ValueError("U2 Selection symbol must be non-empty")\n        object.__setattr__(\n            self,\n            "symbol_net_log_growth",\n            _finite(\n                self.symbol_net_log_growth,\n                field="U2 Selection symbol net log growth",\n            ),\n        )\n        object.__setattr__(\n            self,\n            "symbol_gross_log_growth",\n            _finite(\n                self.symbol_gross_log_growth,\n                field="U2 Selection symbol gross log growth",\n            ),\n        )\n        if not isinstance(self.meaningful_execution, bool):\n            raise TypeError("U2 Selection symbol meaningful execution must be boolean")\n\n    @property\n    def symbol_net_wealth(self) -> float:\n        return _positive_wealth(\n            self.symbol_net_log_growth,\n            field="U2 Selection symbol net log growth",\n        )\n\n    @property\n    def symbol_gross_wealth(self) -> float:\n        return _positive_wealth(\n            self.symbol_gross_log_growth,\n            field="U2 Selection symbol gross log growth",\n        )\n\n    def to_payload(self) -> dict[str, object]:\n        return {\n            "concrete_symbol": self.concrete_symbol,\n            "symbol_net_log_growth": self.symbol_net_log_growth,\n            "symbol_gross_log_growth": self.symbol_gross_log_growth,\n            "symbol_net_wealth": self.symbol_net_wealth,\n            "symbol_gross_wealth": self.symbol_gross_wealth,\n            "meaningful_execution": self.meaningful_execution,\n        }\n\n\n@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2SelectionSummary:\n    """Content-addressed executable Selection metric summary."""\n\n    leaf_digests: tuple[str, ...]\n    symbol_metrics: tuple[UniversalTradeRLU2SelectionSymbolMetrics, ...]\n    leaf_count: int\n    symbol_count: int\n    symbol_balanced_net_log_growth: float\n    symbol_balanced_gross_log_growth: float\n    symbol_balanced_net_wealth: float\n    symbol_balanced_gross_wealth: float\n    median_symbol_net_wealth: float\n    minimum_symbol_net_wealth: float\n    positive_net_scope_fraction: float\n    scope_net_return_cvar10: float\n    turnover_per_day_p95: float\n    meaningful_execution_symbol_fraction: float\n    positive_gross_log_growth_retention: float | None\n    schema_version: str = U2_SELECTION_SUMMARY_SCHEMA\n    digest: str = ""\n\n    def __post_init__(self) -> None:\n        if self.schema_version != U2_SELECTION_SUMMARY_SCHEMA:\n            raise ValueError("unsupported U2 Selection summary schema")\n        if self.leaf_count <= 0 or self.leaf_count != len(self.leaf_digests):\n            raise ValueError("U2 Selection summary leaf closure is inconsistent")\n        if self.symbol_count <= 0 or self.symbol_count != len(self.symbol_metrics):\n            raise ValueError("U2 Selection summary symbol closure is inconsistent")\n        if len(set(self.leaf_digests)) != len(self.leaf_digests):\n            raise ValueError("U2 Selection summary contains duplicate leaf digests")\n        for digest in self.leaf_digests:\n            require_sha256(digest, field="U2 Selection summary leaf digest")\n        symbols = tuple(metric.concrete_symbol for metric in self.symbol_metrics)\n        if symbols != tuple(sorted(set(symbols))):\n            raise ValueError("U2 Selection summary symbols must be sorted and unique")\n\n        finite_fields = (\n            "symbol_balanced_net_log_growth",\n            "symbol_balanced_gross_log_growth",\n            "symbol_balanced_net_wealth",\n            "symbol_balanced_gross_wealth",\n            "median_symbol_net_wealth",\n            "minimum_symbol_net_wealth",\n            "positive_net_scope_fraction",\n            "scope_net_return_cvar10",\n            "turnover_per_day_p95",\n            "meaningful_execution_symbol_fraction",\n        )\n        for field_name in finite_fields:\n            object.__setattr__(\n                self,\n                field_name,\n                _finite(getattr(self, field_name), field=f"U2 Selection {field_name}"),\n            )\n        for field_name in (\n            "symbol_balanced_net_wealth",\n            "symbol_balanced_gross_wealth",\n            "median_symbol_net_wealth",\n            "minimum_symbol_net_wealth",\n        ):\n            if getattr(self, field_name) <= 0.0:\n                raise ValueError(f"U2 Selection {field_name} must be positive")\n        for field_name in (\n            "positive_net_scope_fraction",\n            "meaningful_execution_symbol_fraction",\n        ):\n            if not 0.0 <= getattr(self, field_name) <= 1.0:\n                raise ValueError(f"U2 Selection {field_name} must be within [0, 1]")\n        if self.turnover_per_day_p95 < 0.0:\n            raise ValueError("U2 Selection turnover p95 cannot be negative")\n\n        retention = self.positive_gross_log_growth_retention\n        if self.symbol_balanced_gross_log_growth > 0.0:\n            if retention is None:\n                raise ValueError("positive gross growth requires a retention value")\n            retention = _finite(retention, field="U2 Selection gross-growth retention")\n            expected_retention = (\n                self.symbol_balanced_net_log_growth\n                / self.symbol_balanced_gross_log_growth\n            )\n            if not math.isclose(\n                retention,\n                expected_retention,\n                rel_tol=0.0,\n                abs_tol=1e-15,\n            ):\n                raise ValueError("U2 Selection gross-growth retention is inconsistent")\n            object.__setattr__(self, "positive_gross_log_growth_retention", retention)\n        elif retention is not None:\n            raise ValueError("non-positive gross growth must not define retention")\n\n        expected = content_digest(self.to_payload(include_digest=False))\n        if self.digest:\n            require_sha256(self.digest, field="U2 Selection summary digest")\n            if self.digest != expected:\n                raise ValueError("U2 Selection summary digest mismatch")\n        object.__setattr__(self, "digest", expected)\n\n    def to_payload(self, *, include_digest: bool = True) -> dict[str, object]:\n        payload: dict[str, object] = {\n            "schema_version": self.schema_version,\n            "leaf_digests": self.leaf_digests,\n            "symbol_metrics": tuple(metric.to_payload() for metric in self.symbol_metrics),\n            "leaf_count": self.leaf_count,\n            "symbol_count": self.symbol_count,\n            "symbol_balanced_net_log_growth": self.symbol_balanced_net_log_growth,\n            "symbol_balanced_gross_log_growth": self.symbol_balanced_gross_log_growth,\n            "symbol_balanced_net_wealth": self.symbol_balanced_net_wealth,\n            "symbol_balanced_gross_wealth": self.symbol_balanced_gross_wealth,\n            "median_symbol_net_wealth": self.median_symbol_net_wealth,\n            "minimum_symbol_net_wealth": self.minimum_symbol_net_wealth,\n            "positive_net_scope_fraction": self.positive_net_scope_fraction,\n            "scope_net_return_cvar10": self.scope_net_return_cvar10,\n            "turnover_per_day_p95": self.turnover_per_day_p95,\n            "meaningful_execution_symbol_fraction": (\n                self.meaningful_execution_symbol_fraction\n            ),\n            "positive_gross_log_growth_retention": (\n                self.positive_gross_log_growth_retention\n            ),\n        }\n        if include_digest:\n            payload["artifact_digest"] = self.digest\n        return payload\n\n\ndef build_universal_trade_rl_u2_selection_leaf_metrics(\n    *,\n    training_seed: int,\n    replay_evidence: object,\n) -> UniversalTradeRLU2SelectionLeafMetrics:\n    """Derive one Selection leaf from one candidate replay without rerunning gross."""\n\n    from trade_rl.workflows.universal_trade_rl_u2_replay import (\n        UniversalTradeRLU2ReplayEvidence,\n        UniversalTradeRLU2ReplayVariant,\n    )\n\n    if not isinstance(replay_evidence, UniversalTradeRLU2ReplayEvidence):\n        raise TypeError("U2 Selection requires replay evidence")\n    if replay_evidence.policy_variant != UniversalTradeRLU2ReplayVariant.CANDIDATE.value:\n        raise ValueError("U2 Selection leaf requires candidate policy replay evidence")\n    if isinstance(training_seed, bool) or training_seed not in U2_TRAINING_SEEDS:\n        raise ValueError("U2 Selection leaf training seed is outside fixed closure")\n    decision_count = replay_evidence.observed_decision_count\n    if decision_count <= 0:\n        raise ValueError("U2 Selection leaf requires at least one replay decision")\n\n    net_log_growth = math.fsum(\n        math.log1p(value) for value in replay_evidence.net_simple_returns\n    )\n    gross_log_growth = math.fsum(\n        math.log1p(value) for value in replay_evidence.gross_simple_returns\n    )\n    turnover_per_day = replay_evidence.turnover_total / (decision_count * 0.25 / 24.0)\n    meaningful_execution = bool(\n        replay_evidence.executed_change_count > 0\n        or replay_evidence.turnover_total\n        > _U2_MEANINGFUL_EXECUTION_TURNOVER_TOLERANCE\n    )\n    return UniversalTradeRLU2SelectionLeafMetrics(\n        training_seed=training_seed,\n        cell=replay_evidence.cell,\n        concrete_symbol=replay_evidence.concrete_symbol,\n        tile_identity=replay_evidence.scope_digest,\n        replay_evidence_digest=replay_evidence.digest,\n        leaf_net_log_growth=net_log_growth,\n        leaf_gross_log_growth=gross_log_growth,\n        turnover_per_day=turnover_per_day,\n        meaningful_execution=meaningful_execution,\n    )\n\n\ndef summarize_universal_trade_rl_u2_selection_metrics(\n    *,\n    leaves: tuple[UniversalTradeRLU2SelectionLeafMetrics, ...],\n) -> UniversalTradeRLU2SelectionSummary:\n    """Execute the frozen symbol-balanced Selection formulas over one grouping."""\n\n    resolved = tuple(leaves)\n    if not resolved:\n        raise ValueError("U2 Selection summary requires non-empty leaves")\n    if any(not isinstance(leaf, UniversalTradeRLU2SelectionLeafMetrics) for leaf in resolved):\n        raise TypeError("U2 Selection summary contains invalid leaf metrics")\n    identities = tuple(leaf.identity for leaf in resolved)\n    if len(set(identities)) != len(identities):\n        raise ValueError("U2 Selection summary contains duplicate leaf identity")\n    if len({leaf.cell for leaf in resolved}) != 1:\n        raise ValueError("U2 Selection summary cannot mix cell groupings")\n\n    ordered = tuple(sorted(resolved, key=lambda leaf: leaf.identity))\n    by_symbol: dict[str, list[UniversalTradeRLU2SelectionLeafMetrics]] = defaultdict(list)\n    for leaf in ordered:\n        by_symbol[leaf.concrete_symbol].append(leaf)\n\n    symbol_metrics = tuple(\n        UniversalTradeRLU2SelectionSymbolMetrics(\n            concrete_symbol=symbol,\n            symbol_net_log_growth=math.fsum(\n                leaf.leaf_net_log_growth for leaf in by_symbol[symbol]\n            ),\n            symbol_gross_log_growth=math.fsum(\n                leaf.leaf_gross_log_growth for leaf in by_symbol[symbol]\n            ),\n            meaningful_execution=any(\n                leaf.meaningful_execution for leaf in by_symbol[symbol]\n            ),\n        )\n        for symbol in sorted(by_symbol)\n    )\n    balanced_net_log = float(\n        fmean(metric.symbol_net_log_growth for metric in symbol_metrics)\n    )\n    balanced_gross_log = float(\n        fmean(metric.symbol_gross_log_growth for metric in symbol_metrics)\n    )\n    symbol_net_wealth = tuple(metric.symbol_net_wealth for metric in symbol_metrics)\n    leaf_net_logs = tuple(leaf.leaf_net_log_growth for leaf in ordered)\n    cvar_count = max(1, math.ceil(0.10 * len(ordered)))\n    cvar10 = float(fmean(sorted(leaf_net_logs)[:cvar_count]))\n    turnover_p95 = float(\n        np.quantile(\n            [leaf.turnover_per_day for leaf in ordered],\n            0.95,\n            method="linear",\n        )\n    )\n    meaningful_fraction = float(\n        fmean(1.0 if metric.meaningful_execution else 0.0 for metric in symbol_metrics)\n    )\n    retention = (\n        balanced_net_log / balanced_gross_log if balanced_gross_log > 0.0 else None\n    )\n    return UniversalTradeRLU2SelectionSummary(\n        leaf_digests=tuple(leaf.digest for leaf in ordered),\n        symbol_metrics=symbol_metrics,\n        leaf_count=len(ordered),\n        symbol_count=len(symbol_metrics),\n        symbol_balanced_net_log_growth=balanced_net_log,\n        symbol_balanced_gross_log_growth=balanced_gross_log,\n        symbol_balanced_net_wealth=_positive_wealth(\n            balanced_net_log,\n            field="U2 Selection balanced net log growth",\n        ),\n        symbol_balanced_gross_wealth=_positive_wealth(\n            balanced_gross_log,\n            field="U2 Selection balanced gross log growth",\n        ),\n        median_symbol_net_wealth=float(median(symbol_net_wealth)),\n        minimum_symbol_net_wealth=min(symbol_net_wealth),\n        positive_net_scope_fraction=(\n            sum(value > 0.0 for value in leaf_net_logs) / len(leaf_net_logs)\n        ),\n        scope_net_return_cvar10=cvar10,\n        turnover_per_day_p95=turnover_p95,\n        meaningful_execution_symbol_fraction=meaningful_fraction,\n        positive_gross_log_growth_retention=retention,\n    )\n\n\n@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2PairedExcessPoint:\n'''
          if text.count(anchor) != 1:
              raise SystemExit("unexpected Selection implementation anchor")
          text = text.replace(anchor, block)

          old_all = '''__all__ = [\n    "U2_DEVELOPMENT_BOOTSTRAP_SCHEMA",\n    "U2_DEVELOPMENT_PANEL_SCHEMA",\n    "U2_DEVELOPMENT_WINDOWS",\n    "UniversalTradeRLU2DevelopmentBootstrapResult",\n    "UniversalTradeRLU2PairedExcessPoint",\n    "UniversalTradeRLU2ReducedBootstrapSegment",\n    "bootstrap_universal_trade_rl_u2_development_panel",\n    "reduce_universal_trade_rl_u2_development_panel",\n]\n'''
          new_all = '''__all__ = [\n    "U2_DEVELOPMENT_BOOTSTRAP_SCHEMA",\n    "U2_DEVELOPMENT_PANEL_SCHEMA",\n    "U2_DEVELOPMENT_WINDOWS",\n    "U2_SELECTION_LEAF_METRICS_SCHEMA",\n    "U2_SELECTION_SUMMARY_SCHEMA",\n    "UniversalTradeRLU2DevelopmentBootstrapResult",\n    "UniversalTradeRLU2PairedExcessPoint",\n    "UniversalTradeRLU2ReducedBootstrapSegment",\n    "UniversalTradeRLU2SelectionLeafMetrics",\n    "UniversalTradeRLU2SelectionSummary",\n    "UniversalTradeRLU2SelectionSymbolMetrics",\n    "bootstrap_universal_trade_rl_u2_development_panel",\n    "build_universal_trade_rl_u2_selection_leaf_metrics",\n    "reduce_universal_trade_rl_u2_development_panel",\n    "summarize_universal_trade_rl_u2_selection_metrics",\n]\n'''
          if text.count(old_all) != 1:
              raise SystemExit("unexpected Selection __all__ anchor")
          path.write_text(text.replace(old_all, new_all), encoding="utf-8")
          PY

      - name: Format static and targeted GREEN checks
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py

      - name: Commit GREEN patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/u2-selection-metrics-green-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          git commit -m "feat: execute frozen U2 Selection metrics"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
