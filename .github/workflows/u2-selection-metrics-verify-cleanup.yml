name: U2 Selection Metrics Verify Cleanup

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-metrics-verify-cleanup.yml"

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Verify Selection format and static contracts
        run: |
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py

      - name: Verify Selection unit contracts
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_trade_rl_u2_selection.py
          tests/workflows/test_universal_trade_rl_u2_selection_metrics.py

      - name: Verify Selection replay integration
        run: >-
          uv run pytest -q
          tests/integrations/test_universal_trade_rl_u2_selection_metrics.py

      - name: Remove temporary Selection workflows after GREEN
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/u2-selection-metrics-green-apply.yml \
            .github/workflows/u2-selection-metrics-green-apply-r2.yml \
            .github/workflows/u2-selection-metrics-verify-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove U2 Selection verification helpers"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
