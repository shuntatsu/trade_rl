name: U2 Selection Per-Seed Summary GREEN

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-selection-seed-summary-green.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/universal-trade-rl-u2-base-ppo-implementation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra train-sb3

      - name: Apply per-seed summary patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = source.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source patch target, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          replace_exact(
              '''    cell: str\n    leaf_digests: tuple[str, ...]\n''',
              '''    cell: str\n    training_seed: int\n    leaf_digests: tuple[str, ...]\n''',
          )
          replace_exact(
              '''        if not isinstance(self.cell, str) or not self.cell:\n            raise ValueError("U2 Selection summary cell must be non-empty")\n        leaf_digests = tuple(self.leaf_digests)\n''',
              '''        if not isinstance(self.cell, str) or not self.cell:\n            raise ValueError("U2 Selection summary cell must be non-empty")\n        if (\n            isinstance(self.training_seed, bool)\n            or not isinstance(self.training_seed, int)\n            or self.training_seed not in U2_TRAINING_SEEDS\n        ):\n            raise ValueError("U2 Selection summary training seed is not preregistered")\n        leaf_digests = tuple(self.leaf_digests)\n''',
          )
          replace_exact(
              '''            "cell": self.cell,\n            "leaf_digests": self.leaf_digests,\n''',
              '''            "cell": self.cell,\n            "training_seed": self.training_seed,\n            "leaf_digests": self.leaf_digests,\n''',
          )
          replace_exact(
              '''    cells = {leaf.cell for leaf in resolved}\n    if len(cells) != 1:\n        raise ValueError("U2 Selection summary must contain one cell grouping")\n    cell = next(iter(cells))\n\n    ordered = tuple(sorted(resolved, key=lambda leaf: leaf.identity))\n''',
              '''    cells = {leaf.cell for leaf in resolved}\n    if len(cells) != 1:\n        raise ValueError("U2 Selection summary must contain one cell grouping")\n    cell = next(iter(cells))\n    training_seeds = {leaf.training_seed for leaf in resolved}\n    if len(training_seeds) != 1:\n        raise ValueError("U2 Selection summary must contain one training seed")\n    training_seed = next(iter(training_seeds))\n\n    ordered = tuple(sorted(resolved, key=lambda leaf: leaf.identity))\n''',
          )
          replace_exact(
              '''    return UniversalTradeRLU2SelectionMetricSummary(\n        cell=cell,\n        leaf_digests=tuple(leaf.digest for leaf in ordered),\n''',
              '''    return UniversalTradeRLU2SelectionMetricSummary(\n        cell=cell,\n        training_seed=training_seed,\n        leaf_digests=tuple(leaf.digest for leaf in ordered),\n''',
          )
          source.write_text(text, encoding="utf-8")

          integrity = Path(
              "tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py"
          )
          integrity_text = integrity.read_text(encoding="utf-8")
          if integrity_text.count("training_seed=1,") != 2:
              raise SystemExit("expected exactly two mixed-seed integrity fixture rows")
          integrity.write_text(
              integrity_text.replace("training_seed=1,", "training_seed=0,"),
              encoding="utf-8",
          )
          PY

      - name: Verify GREEN
        run: |
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py

      - name: Commit source GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          git commit -m "fix: make U2 Selection summaries per-seed"
          git push origin HEAD:codex/universal-trade-rl-u2-base-ppo-implementation
