name: U2 Task2 Contract Final

on:
  push:
    branches:
      - codex/u2-selection-task2-contract-final
    paths:
      - ".github/workflows/u2-task2-contract-final.yml"

permissions:
  contents: write

concurrency:
  group: u2-task2-contract-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev

      - name: Add threshold-source falsification test
        run: |
          set -euo pipefail
          python .github/apply_u2_task2_contract_final.py tests
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Confirm hardcoded implementation fails the new contract oracle
        shell: bash
        run: |
          set -euo pipefail
          set +e
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py::test_u2_primary_cell_gate_uses_preregistered_threshold_payload \
            > /tmp/task2-contract-red.log 2>&1
          status=$?
          set -e
          cat /tmp/task2-contract-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected contract-source RED, but hardcoded implementation passed" >&2
            exit 1
          fi
          grep -E "selection_thresholds_digest|AssertionError|turnover" /tmp/task2-contract-red.log

      - name: Replace only the existing primary gate implementation
        run: |
          set -euo pipefail
          python .github/apply_u2_task2_contract_final.py source
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Static verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Focused Selection verification
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py

      - name: Reject threshold literals in the primary gate block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py").read_text()
          start = text.index("U2_PRIMARY_SELECTION_CELL_GATE_SCHEMA: Final = (")
          end = text.index(
              "@dataclass(frozen=True, slots=True)\nclass UniversalTradeRLU2PairedExcessPoint:",
              start,
          )
          block = text[start:end]
          forbidden = (
              "<= 1.0",
              "< 1.0",
              "< 0.50",
              "< -0.01",
              "> 1.0",
              "!= 1.0",
              "!= 0",
          )
          found = tuple(token for token in forbidden if token in block)
          if found:
              raise SystemExit(f"hardcoded Task2 threshold literals remain: {found}")
          if "u2_contract._selection_thresholds_payload()" not in block:
              raise SystemExit("primary gate does not load the preregistered threshold payload")
          PY

      - name: Commit verified correction and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/apply_u2_task2_contract_final.py \
            .github/workflows/u2-task2-contract-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          git diff --cached --check
          git commit -m "fix: bind U2 primary gate to preregistered thresholds"
          git push origin HEAD:codex/u2-selection-task2-contract-final
