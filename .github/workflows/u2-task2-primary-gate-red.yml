name: U2 Task2 Primary Gate RED

on:
  push:
    branches:
      - "codex/u2-selection-task2-primary-gate"

permissions:
  contents: write

concurrency:
  group: u2-task2-primary-gate-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    name: U2 Task2 RED Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/u2-selection-task2-primary-gate

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev

      - name: Normalize RED test formatting once
        id: format
        shell: bash
        run: |
          uv run ruff format tests/workflows/test_universal_trade_rl_u2_selection_gate.py
          if git diff --quiet -- tests/workflows/test_universal_trade_rl_u2_selection_gate.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/workflows/test_universal_trade_rl_u2_selection_gate.py
            git commit -m "style: format U2 Task2 gate tests"
            git push origin HEAD:codex/u2-selection-task2-primary-gate
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify RED test formatting
        if: steps.format.outputs.changed == 'false'
        run: uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Verify RED test lint
        if: steps.format.outputs.changed == 'false'
        run: uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_gate.py

      - name: Execute Task 2 RED
        if: steps.format.outputs.changed == 'false'
        run: uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_gate.py
