name: U2 Task3 Strengthened Contract GREEN

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - ".github/workflows/u2-task3-contract-green-v2.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Apply minimal contract-bound robustness fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'U2_SEED_ROBUSTNESS_SCHEMA: Final = "universal_trade_rl_u2_seed_robustness_v1"\n',
              'U2_SEED_ROBUSTNESS_SCHEMA: Final = "universal_trade_rl_u2_seed_robustness_v1"\n'
              'U2_SEED_ROBUSTNESS_BOOTSTRAP_SCHEMA: Final = (\n'
              '    "universal_trade_rl_u2_seed_robustness_bootstrap_v1"\n'
              ')\n',
              1,
          )

          start = text.index('def _bootstrap_universal_trade_rl_u2_segments(')
          end = text.index('\ndef _u2_seed_robustness_rejection_reasons(', start)
          replacement = '''@dataclass(frozen=True, slots=True)
          class UniversalTradeRLU2SeedRobustnessBootstrapResult:
              """Contract-bound bootstrap evidence used only by the cross-seed robustness gate."""

              segment_digests: tuple[str, ...]
              block_lengths: tuple[int, ...]
              observed_mean: float
              lower_ci: float
              upper_ci: float
              passed: bool
              resamples: int
              bootstrap_seed: int
              confidence_level: float
              quantile_method: str = _U2_BOOTSTRAP_QUANTILE_METHOD
              blocks_may_cross_segment_boundary: bool = False
              schema_version: str = U2_SEED_ROBUSTNESS_BOOTSTRAP_SCHEMA
              digest: str = ""

              def __post_init__(self) -> None:
                  if self.schema_version != U2_SEED_ROBUSTNESS_BOOTSTRAP_SCHEMA:
                      raise ValueError("unsupported U2 seed robustness bootstrap schema")
                  digests = tuple(self.segment_digests)
                  block_lengths = tuple(self.block_lengths)
                  if not digests or len(digests) != len(block_lengths):
                      raise ValueError("U2 seed robustness bootstrap segment evidence is incomplete")
                  for digest in digests:
                      require_sha256(digest, field="U2 seed robustness bootstrap segment digest")
                  if any(
                      isinstance(value, bool) or not isinstance(value, int) or value <= 0
                      for value in block_lengths
                  ):
                      raise ValueError("U2 seed robustness bootstrap block length is invalid")
                  object.__setattr__(self, "segment_digests", digests)
                  object.__setattr__(self, "block_lengths", block_lengths)
                  for field_name in ("observed_mean", "lower_ci", "upper_ci"):
                      object.__setattr__(
                          self,
                          field_name,
                          _finite(
                              getattr(self, field_name),
                              field=f"U2 seed robustness bootstrap {field_name}",
                          ),
                      )
                  if self.lower_ci > self.upper_ci:
                      raise ValueError("U2 seed robustness bootstrap interval is reversed")
                  if (
                      isinstance(self.resamples, bool)
                      or not isinstance(self.resamples, int)
                      or self.resamples <= 0
                  ):
                      raise ValueError("U2 seed robustness bootstrap resample count is invalid")
                  if (
                      isinstance(self.bootstrap_seed, bool)
                      or not isinstance(self.bootstrap_seed, int)
                      or self.bootstrap_seed < 0
                  ):
                      raise ValueError("U2 seed robustness bootstrap seed is invalid")
                  confidence = _finite(
                      self.confidence_level,
                      field="U2 seed robustness bootstrap confidence level",
                  )
                  if not 0.0 < confidence < 1.0:
                      raise ValueError("U2 seed robustness bootstrap confidence level is invalid")
                  object.__setattr__(self, "confidence_level", confidence)
                  if self.quantile_method != _U2_BOOTSTRAP_QUANTILE_METHOD:
                      raise ValueError("U2 seed robustness bootstrap quantile method drifted")
                  if self.blocks_may_cross_segment_boundary is not False:
                      raise ValueError("U2 seed robustness bootstrap blocks may not cross D1/D2")
                  if self.passed is not (self.lower_ci > 0.0):
                      raise ValueError("U2 seed robustness bootstrap pass state is inconsistent")

                  expected = content_digest(self.to_payload(include_digest=False))
                  if self.digest:
                      require_sha256(self.digest, field="U2 seed robustness bootstrap digest")
                      if self.digest != expected:
                          raise ValueError("U2 seed robustness bootstrap digest mismatch")
                  object.__setattr__(self, "digest", expected)

              def to_payload(self, *, include_digest: bool = True) -> dict[str, object]:
                  payload: dict[str, object] = {
                      "schema_version": self.schema_version,
                      "segment_digests": self.segment_digests,
                      "block_lengths": self.block_lengths,
                      "observed_mean": self.observed_mean,
                      "lower_ci": self.lower_ci,
                      "upper_ci": self.upper_ci,
                      "passed": self.passed,
                      "resamples": self.resamples,
                      "bootstrap_seed": self.bootstrap_seed,
                      "confidence_level": self.confidence_level,
                      "quantile_method": self.quantile_method,
                      "blocks_may_cross_segment_boundary": self.blocks_may_cross_segment_boundary,
                  }
                  if include_digest:
                      payload["artifact_digest"] = self.digest
                  return payload


          def _u2_cross_seed_robustness_thresholds() -> dict[str, object]:
              thresholds = u2_contract._selection_thresholds_payload()["cross_seed_robustness"]
              if not isinstance(thresholds, dict):
                  raise ValueError("U2 cross-seed robustness thresholds are invalid")
              return dict(thresholds)


          def _bootstrap_universal_trade_rl_u2_segments(
              *,
              segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...],
          ) -> UniversalTradeRLU2SeedRobustnessBootstrapResult:
              resolved = tuple(segments)
              if not resolved:
                  raise ValueError("U2 seed robustness bootstrap requires at least one segment")
              if any(
                  not isinstance(segment, UniversalTradeRLU2ReducedBootstrapSegment)
                  for segment in resolved
              ):
                  raise TypeError("U2 seed robustness bootstrap segment is invalid")

              settings = _u2_cross_seed_robustness_thresholds()
              if settings.get("bootstrap_method") != "moving_block_mean_test":
                  raise ValueError("U2 seed robustness bootstrap method drifted")
              if settings.get("bootstrap_block_length_rule") != "ceil_sqrt_n_capped":
                  raise ValueError("U2 seed robustness bootstrap block-length rule drifted")
              resamples = _non_negative_int(
                  settings["bootstrap_resamples"],
                  field="U2 seed robustness bootstrap resamples",
              )
              if resamples <= 0:
                  raise ValueError("U2 seed robustness bootstrap resamples must be positive")
              bootstrap_seed = _non_negative_int(
                  settings["bootstrap_seed"],
                  field="U2 seed robustness bootstrap seed",
              )
              confidence_level = _finite(
                  settings["bootstrap_confidence_level"],
                  field="U2 seed robustness bootstrap confidence level",
              )
              if not 0.0 < confidence_level < 1.0:
                  raise ValueError("U2 seed robustness bootstrap confidence level is invalid")

              block_lengths = tuple(
                  min(
                      len(segment.net_log_excess),
                      math.ceil(math.sqrt(len(segment.net_log_excess))),
                  )
                  for segment in resolved
              )
              all_values = tuple(
                  value for segment in resolved for value in segment.net_log_excess
              )
              observed_mean = float(fmean(all_values))

              rng = np.random.default_rng(bootstrap_seed)
              means = np.empty(resamples, dtype=np.float64)
              for draw in range(resamples):
                  sampled_values: list[float] = []
                  for segment, block_length in zip(resolved, block_lengths, strict=True):
                      values = segment.net_log_excess
                      segment_length = len(values)
                      sampled_indices: list[int] = []
                      while len(sampled_indices) < segment_length:
                          start_index = int(rng.integers(0, segment_length))
                          sampled_indices.extend(
                              (start_index + offset) % segment_length
                              for offset in range(block_length)
                          )
                      sampled_values.extend(
                          values[index] for index in sampled_indices[:segment_length]
                      )
                  means[draw] = float(fmean(sampled_values))

              alpha = 1.0 - confidence_level
              lower, upper = np.quantile(
                  means,
                  [alpha / 2.0, 1.0 - alpha / 2.0],
                  method=_U2_BOOTSTRAP_QUANTILE_METHOD,
              )
              lower_ci = float(lower)
              return UniversalTradeRLU2SeedRobustnessBootstrapResult(
                  segment_digests=tuple(segment.digest for segment in resolved),
                  block_lengths=block_lengths,
                  observed_mean=observed_mean,
                  lower_ci=lower_ci,
                  upper_ci=float(upper),
                  passed=lower_ci > 0.0,
                  resamples=resamples,
                  bootstrap_seed=bootstrap_seed,
                  confidence_level=confidence_level,
              )
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              '    thresholds = u2_contract._selection_thresholds_payload()["cross_seed_robustness"]\n'
              '    if not isinstance(thresholds, dict):\n'
              '        raise ValueError("U2 cross-seed robustness thresholds are invalid")\n',
              '    thresholds = _u2_cross_seed_robustness_thresholds()\n',
              1,
          )
          text = text.replace(
              '    bootstrap: UniversalTradeRLU2DevelopmentBootstrapResult\n',
              '    bootstrap: UniversalTradeRLU2SeedRobustnessBootstrapResult\n',
              1,
          )
          text = text.replace(
              '    bootstrap: UniversalTradeRLU2DevelopmentBootstrapResult = field(init=False)\n'
              '    selection_thresholds_digest: str = field(init=False)\n',
              '    bootstrap_result: UniversalTradeRLU2SeedRobustnessBootstrapResult = field(init=False)\n'
              '    robustness_thresholds_digest: str = field(init=False)\n'
              '    selection_thresholds_digest: str = field(init=False)\n',
              1,
          )
          text = text.replace(
              '        object.__setattr__(self, "bootstrap", computed.bootstrap)\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "selection_thresholds_digest",\n'
              '            content_digest(u2_contract._selection_thresholds_payload()),\n'
              '        )\n',
              '        object.__setattr__(self, "bootstrap_result", computed.bootstrap)\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "robustness_thresholds_digest",\n'
              '            content_digest(_u2_cross_seed_robustness_thresholds()),\n'
              '        )\n'
              '        object.__setattr__(\n'
              '            self,\n'
              '            "selection_thresholds_digest",\n'
              '            content_digest(u2_contract._selection_thresholds_payload()),\n'
              '        )\n',
              1,
          )
          text = text.replace(
              '    @property\n'
              '    def bootstrap_segment_digests(self) -> tuple[str, ...]:\n'
              '        return self.bootstrap.segment_digests\n\n'
              '    @property\n'
              '    def bootstrap_lower_ci(self) -> float:\n'
              '        return self.bootstrap.lower_ci\n',
              '    @property\n'
              '    def bootstrap(self) -> UniversalTradeRLU2SeedRobustnessBootstrapResult:\n'
              '        """Backward-compatible alias for the contract-bound bootstrap result."""\n'
              '        return self.bootstrap_result\n\n'
              '    @property\n'
              '    def bootstrap_segment_digests(self) -> tuple[str, ...]:\n'
              '        return self.bootstrap_result.segment_digests\n\n'
              '    @property\n'
              '    def bootstrap_lower_ci(self) -> float:\n'
              '        return self.bootstrap_result.lower_ci\n',
              1,
          )
          text = text.replace(
              '            "bootstrap_result_digest": self.bootstrap.digest,\n'
              '            "selection_thresholds_digest": self.selection_thresholds_digest,\n',
              '            "bootstrap_result_digest": self.bootstrap_result.digest,\n'
              '            "robustness_thresholds_digest": self.robustness_thresholds_digest,\n'
              '            "selection_thresholds_digest": self.selection_thresholds_digest,\n',
              1,
          )
          text = text.replace(
              '    "U2_SEED_ROBUSTNESS_SCHEMA",\n'
              '    "UniversalTradeRLU2SeedRobustnessEvidence",\n',
              '    "U2_SEED_ROBUSTNESS_BOOTSTRAP_SCHEMA",\n'
              '    "U2_SEED_ROBUSTNESS_SCHEMA",\n'
              '    "UniversalTradeRLU2SeedRobustnessBootstrapResult",\n'
              '    "UniversalTradeRLU2SeedRobustnessEvidence",\n',
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run ruff format --check --diff trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          uv run ruff check trade_rl/workflows/universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_robustness.py tests/workflows/test_universal_trade_rl_u2_selection.py tests/workflows/test_universal_trade_rl_u2_selection_gate.py tests/workflows/test_universal_trade_rl_u2_selection_metrics.py tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
      - name: Commit production source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/u2-task3-contract-green-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py .github/workflows/u2-task3-contract-green-v2.yml
          git diff --cached --check
          git commit -m "fix: bind U2 robustness bootstrap to frozen contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
