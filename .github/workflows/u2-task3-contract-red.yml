name: U2 Task3 Contract RED

on:
  push:
    branches:
      - codex/u2-selection-task3-contract-final

permissions:
  contents: read

concurrency:
  group: u2-task3-contract-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install focused dependencies
        run: uv sync --extra dev

      - name: Verify Task3 RED formatting
        run: uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_robustness.py

      - name: Verify Task3 RED lint
        run: uv run ruff check tests/workflows/test_universal_trade_rl_u2_selection_robustness.py

      - name: Execute Task3 RED
        run: uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
