name: U2 Task3 Format Patch

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - .github/workflows/u2-task3-format-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply formatter-equivalent changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = target.read_text(encoding="utf-8")
          replacements = (
              (
                  "    bootstrap = _bootstrap_universal_trade_rl_u2_segments(\n"
                  "        segments=selected_segments\n"
                  "    )\n",
                  "    bootstrap = _bootstrap_universal_trade_rl_u2_segments(segments=selected_segments)\n",
              ),
              (
                  "        symbol_log_growth = tuple(\n"
                  "            math.fsum(\n"
                  "                leaf.leaf_net_log_growth for leaf in by_symbol[concrete_symbol]\n"
                  "            )\n"
                  "            for concrete_symbol in sorted(by_symbol)\n"
                  "        )\n",
                  "        symbol_log_growth = tuple(\n"
                  "            math.fsum(leaf.leaf_net_log_growth for leaf in by_symbol[concrete_symbol])\n"
                  "            for concrete_symbol in sorted(by_symbol)\n"
                  "        )\n",
              ),
              (
                  "        hard_risk_count += sum(\n"
                  "            leaf.hard_risk_violation_count for leaf in seed_leaves\n"
                  "        )\n",
                  "        hard_risk_count += sum(leaf.hard_risk_violation_count for leaf in seed_leaves)\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("formatter target was not unique")
              text = text.replace(old, new, 1)
          target.write_text(text, encoding="utf-8")
          Path(".github/workflows/u2-task3-format-patch.yml").unlink()
          PY

          python -m py_compile trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py .github/workflows/u2-task3-format-patch.yml
          git commit -m "style: format U2 seed robustness implementation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
