name: U2 Task3 Green Patch

on:
  push:
    branches:
      - codex/universal-trade-rl-u2-base-ppo-implementation
    paths:
      - .github/workflows/u2-task3-green-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply Task 3 GREEN implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          insertion = r'''

          U2_SEED_ROBUSTNESS_SCHEMA: Final = "universal_trade_rl_u2_seed_robustness_v1"


          def _u2_seed_robustness_scope_cells(scope: str) -> tuple[str, ...]:
              if scope == "D1":
                  return ("D1",)
              if scope == "D2":
                  return ("D2",)
              if scope == "D1+D2":
                  return ("D1", "D2")
              raise ValueError("U2 seed robustness scope must be D1, D2, or D1+D2")


          def _u2_seed_robustness_scope_windows(scope: str) -> tuple[str, ...]:
              if scope == "D1":
                  return (U2_DEVELOPMENT_WINDOWS[0],)
              if scope == "D2":
                  return (U2_DEVELOPMENT_WINDOWS[1],)
              if scope == "D1+D2":
                  return U2_DEVELOPMENT_WINDOWS
              raise ValueError("U2 seed robustness scope must be D1, D2, or D1+D2")


          def _bootstrap_universal_trade_rl_u2_segments(
              *,
              segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...],
          ) -> UniversalTradeRLU2DevelopmentBootstrapResult:
              resolved = tuple(segments)
              if not resolved:
                  raise ValueError("U2 seed robustness bootstrap requires at least one segment")
              if any(
                  not isinstance(segment, UniversalTradeRLU2ReducedBootstrapSegment)
                  for segment in resolved
              ):
                  raise TypeError("U2 seed robustness bootstrap segment is invalid")

              block_lengths = tuple(
                  min(
                      len(segment.net_log_excess),
                      math.ceil(math.sqrt(len(segment.net_log_excess))),
                  )
                  for segment in resolved
              )
              all_values = tuple(
                  value for segment in resolved for value in segment.net_log_excess
              )
              observed_mean = float(fmean(all_values))

              rng = np.random.default_rng(_U2_BOOTSTRAP_SEED)
              means = np.empty(_U2_BOOTSTRAP_RESAMPLES, dtype=np.float64)
              for draw in range(_U2_BOOTSTRAP_RESAMPLES):
                  sampled_values: list[float] = []
                  for segment, block_length in zip(resolved, block_lengths, strict=True):
                      values = segment.net_log_excess
                      segment_length = len(values)
                      sampled_indices: list[int] = []
                      while len(sampled_indices) < segment_length:
                          start = int(rng.integers(0, segment_length))
                          sampled_indices.extend(
                              (start + offset) % segment_length for offset in range(block_length)
                          )
                      sampled_values.extend(
                          values[index] for index in sampled_indices[:segment_length]
                      )
                  means[draw] = float(fmean(sampled_values))

              alpha = 1.0 - _U2_BOOTSTRAP_CONFIDENCE_LEVEL
              lower, upper = np.quantile(
                  means,
                  [alpha / 2.0, 1.0 - alpha / 2.0],
                  method=_U2_BOOTSTRAP_QUANTILE_METHOD,
              )
              lower_ci = float(lower)
              return UniversalTradeRLU2DevelopmentBootstrapResult(
                  segment_digests=tuple(segment.digest for segment in resolved),
                  block_lengths=block_lengths,
                  observed_mean=observed_mean,
                  lower_ci=lower_ci,
                  upper_ci=float(upper),
                  passed=lower_ci > 0.0,
              )


          def _u2_seed_robustness_rejection_reasons(
              *,
              median_seed_net_wealth: float,
              worst_seed_net_wealth: float,
              hard_risk_violation_count: int,
              all_seed_turnover_p95_per_day: float,
              bootstrap_lower_ci: float,
          ) -> tuple[str, ...]:
              thresholds = u2_contract._selection_thresholds_payload()["cross_seed_robustness"]
              if not isinstance(thresholds, dict):
                  raise ValueError("U2 cross-seed robustness thresholds are invalid")

              median_min = _finite(
                  thresholds["median_seed_net_wealth_min_exclusive"],
                  field="U2 seed robustness median wealth threshold",
              )
              worst_min = _finite(
                  thresholds["worst_seed_net_wealth_min_inclusive"],
                  field="U2 seed robustness worst wealth threshold",
              )
              risk_required = _non_negative_int(
                  thresholds["hard_risk_violation_count_required"],
                  field="U2 seed robustness hard-risk threshold",
              )
              turnover_max = _finite(
                  thresholds["all_seed_turnover_p95_per_day_max_inclusive"],
                  field="U2 seed robustness turnover threshold",
              )
              bootstrap_min = _finite(
                  thresholds["paired_excess_vs_cash_bootstrap_lower_ci_min_exclusive"],
                  field="U2 seed robustness bootstrap threshold",
              )

              reasons: list[str] = []
              if median_seed_net_wealth <= median_min:
                  reasons.append("median_seed_symbol_balanced_net_wealth_not_above_cash")
              if worst_seed_net_wealth < worst_min:
                  reasons.append("worst_seed_symbol_balanced_net_wealth_below_cash")
              if hard_risk_violation_count != risk_required:
                  reasons.append("all_seed_hard_risk_violation_count_nonzero")
              if all_seed_turnover_p95_per_day > turnover_max:
                  reasons.append("all_seed_turnover_p95_per_day_above_1_0")
              if bootstrap_lower_ci <= bootstrap_min:
                  reasons.append("paired_excess_bootstrap_lower_ci_not_above_zero")
              return tuple(reasons)


          @dataclass(frozen=True, slots=True)
          class _UniversalTradeRLU2SeedRobustnessComputation:
              leaves: tuple[UniversalTradeRLU2SelectionLeafMetrics, ...]
              segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...]
              bootstrap: UniversalTradeRLU2DevelopmentBootstrapResult
              seed_wealth: tuple[float, ...]
              median_seed_wealth: float
              worst_seed_wealth: float
              hard_risk_count: int
              turnover_p95: float
              rejection_reasons: tuple[str, ...]


          def _compute_universal_trade_rl_u2_seed_robustness(
              *,
              scope: str,
              leaves: tuple[UniversalTradeRLU2SelectionLeafMetrics, ...],
              segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...],
          ) -> _UniversalTradeRLU2SeedRobustnessComputation:
              expected_cells = _u2_seed_robustness_scope_cells(scope)
              expected_windows = _u2_seed_robustness_scope_windows(scope)

              resolved_leaves = tuple(leaves)
              if not resolved_leaves:
                  raise ValueError("U2 seed robustness leaves cannot be empty")
              if any(
                  not isinstance(leaf, UniversalTradeRLU2SelectionLeafMetrics)
                  for leaf in resolved_leaves
              ):
                  raise TypeError("U2 seed robustness contains an invalid leaf")
              identities = tuple(leaf.identity for leaf in resolved_leaves)
              if len(set(identities)) != len(identities):
                  raise ValueError("U2 seed robustness contains duplicate leaf identity")
              if {leaf.cell for leaf in resolved_leaves} != set(expected_cells):
                  raise ValueError("U2 seed robustness cell closure does not match its scope")
              if {leaf.training_seed for leaf in resolved_leaves} != set(U2_TRAINING_SEEDS):
                  raise ValueError("U2 seed robustness seed closure is incomplete")

              ordered_leaves = tuple(sorted(resolved_leaves, key=lambda leaf: leaf.identity))
              closure_by_seed: dict[int, set[tuple[str, str, str]]] = {}
              for seed in U2_TRAINING_SEEDS:
                  closure_by_seed[seed] = {
                      (leaf.cell, leaf.concrete_symbol, leaf.tile_identity)
                      for leaf in ordered_leaves
                      if leaf.training_seed == seed
                  }
              reference_closure = closure_by_seed[U2_TRAINING_SEEDS[0]]
              if not reference_closure or any(
                  closure_by_seed[seed] != reference_closure for seed in U2_TRAINING_SEEDS
              ):
                  raise ValueError(
                      "U2 seed robustness tile/symbol closure drifted across training seeds"
                  )

              resolved_segments = tuple(segments)
              if any(
                  not isinstance(segment, UniversalTradeRLU2ReducedBootstrapSegment)
                  for segment in resolved_segments
              ):
                  raise TypeError("U2 seed robustness contains an invalid bootstrap segment")
              if tuple(segment.source_window for segment in resolved_segments) != (
                  U2_DEVELOPMENT_WINDOWS
              ):
                  raise ValueError(
                      "U2 seed robustness requires canonical D1/D2 bootstrap segments"
                  )
              selected_segments = tuple(
                  segment
                  for segment in resolved_segments
                  if segment.source_window in expected_windows
              )
              if (
                  tuple(segment.source_window for segment in selected_segments)
                  != expected_windows
              ):
                  raise ValueError("U2 seed robustness bootstrap scope is incomplete")
              bootstrap = _bootstrap_universal_trade_rl_u2_segments(
                  segments=selected_segments
              )

              seed_wealth: list[float] = []
              seed_turnover_p95: list[float] = []
              hard_risk_count = 0
              for seed in U2_TRAINING_SEEDS:
                  seed_leaves = tuple(
                      leaf for leaf in ordered_leaves if leaf.training_seed == seed
                  )
                  by_symbol: dict[str, list[UniversalTradeRLU2SelectionLeafMetrics]] = (
                      defaultdict(list)
                  )
                  for leaf in seed_leaves:
                      by_symbol[leaf.concrete_symbol].append(leaf)
                  symbol_log_growth = tuple(
                      math.fsum(
                          leaf.leaf_net_log_growth for leaf in by_symbol[concrete_symbol]
                      )
                      for concrete_symbol in sorted(by_symbol)
                  )
                  balanced_log_growth = float(fmean(symbol_log_growth))
                  seed_wealth.append(
                      _positive_wealth(
                          balanced_log_growth,
                          field="U2 seed robustness balanced net",
                      )
                  )
                  seed_turnover_p95.append(
                      float(
                          np.quantile(
                              [leaf.turnover_per_day for leaf in seed_leaves],
                              0.95,
                              method="linear",
                          )
                      )
                  )
                  hard_risk_count += sum(
                      leaf.hard_risk_violation_count for leaf in seed_leaves
                  )

              resolved_seed_wealth = tuple(seed_wealth)
              median_seed_wealth = float(median(resolved_seed_wealth))
              worst_seed_wealth = float(min(resolved_seed_wealth))
              turnover_p95 = float(max(seed_turnover_p95))
              reasons = _u2_seed_robustness_rejection_reasons(
                  median_seed_net_wealth=median_seed_wealth,
                  worst_seed_net_wealth=worst_seed_wealth,
                  hard_risk_violation_count=hard_risk_count,
                  all_seed_turnover_p95_per_day=turnover_p95,
                  bootstrap_lower_ci=bootstrap.lower_ci,
              )
              return _UniversalTradeRLU2SeedRobustnessComputation(
                  leaves=ordered_leaves,
                  segments=resolved_segments,
                  bootstrap=bootstrap,
                  seed_wealth=resolved_seed_wealth,
                  median_seed_wealth=median_seed_wealth,
                  worst_seed_wealth=worst_seed_wealth,
                  hard_risk_count=hard_risk_count,
                  turnover_p95=turnover_p95,
                  rejection_reasons=reasons,
              )


          @dataclass(frozen=True, slots=True)
          class UniversalTradeRLU2SeedRobustnessEvidence:
              """Canonical D-scope cross-seed robustness evidence over fixed seeds (0, 1, 2)."""

              scope: str
              leaves: tuple[UniversalTradeRLU2SelectionLeafMetrics, ...]
              bootstrap_segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...]
              passed: bool
              rejection_reasons: tuple[str, ...]
              training_seeds: tuple[int, ...] = field(init=False)
              seed_symbol_balanced_net_wealth: tuple[float, ...] = field(init=False)
              median_seed_symbol_balanced_net_wealth: float = field(init=False)
              worst_seed_symbol_balanced_net_wealth: float = field(init=False)
              all_seed_hard_risk_violation_count: int = field(init=False)
              all_seed_turnover_p95_per_day: float = field(init=False)
              bootstrap: UniversalTradeRLU2DevelopmentBootstrapResult = field(init=False)
              selection_thresholds_digest: str = field(init=False)
              schema_version: str = U2_SEED_ROBUSTNESS_SCHEMA
              digest: str = ""

              def __post_init__(self) -> None:
                  if self.schema_version != U2_SEED_ROBUSTNESS_SCHEMA:
                      raise ValueError("unsupported U2 seed robustness schema")
                  computed = _compute_universal_trade_rl_u2_seed_robustness(
                      scope=self.scope,
                      leaves=self.leaves,
                      segments=self.bootstrap_segments,
                  )
                  resolved_reasons = tuple(self.rejection_reasons)
                  expected_passed = not computed.rejection_reasons
                  if (
                      resolved_reasons != computed.rejection_reasons
                      or self.passed is not expected_passed
                  ):
                      raise ValueError("U2 seed robustness pass/reason state is inconsistent")

                  object.__setattr__(self, "leaves", computed.leaves)
                  object.__setattr__(self, "bootstrap_segments", computed.segments)
                  object.__setattr__(self, "training_seeds", U2_TRAINING_SEEDS)
                  object.__setattr__(
                      self,
                      "seed_symbol_balanced_net_wealth",
                      computed.seed_wealth,
                  )
                  object.__setattr__(
                      self,
                      "median_seed_symbol_balanced_net_wealth",
                      computed.median_seed_wealth,
                  )
                  object.__setattr__(
                      self,
                      "worst_seed_symbol_balanced_net_wealth",
                      computed.worst_seed_wealth,
                  )
                  object.__setattr__(
                      self,
                      "all_seed_hard_risk_violation_count",
                      computed.hard_risk_count,
                  )
                  object.__setattr__(
                      self,
                      "all_seed_turnover_p95_per_day",
                      computed.turnover_p95,
                  )
                  object.__setattr__(self, "bootstrap", computed.bootstrap)
                  object.__setattr__(
                      self,
                      "selection_thresholds_digest",
                      content_digest(u2_contract._selection_thresholds_payload()),
                  )
                  object.__setattr__(self, "rejection_reasons", resolved_reasons)

                  expected_digest = content_digest(self.to_payload(include_digest=False))
                  if self.digest:
                      require_sha256(self.digest, field="U2 seed robustness digest")
                      if self.digest != expected_digest:
                          raise ValueError("U2 seed robustness digest mismatch")
                  object.__setattr__(self, "digest", expected_digest)

              @property
              def leaf_digests(self) -> tuple[str, ...]:
                  return tuple(leaf.digest for leaf in self.leaves)

              @property
              def bootstrap_segment_digests(self) -> tuple[str, ...]:
                  return self.bootstrap.segment_digests

              @property
              def bootstrap_lower_ci(self) -> float:
                  return self.bootstrap.lower_ci

              def to_payload(self, *, include_digest: bool = True) -> dict[str, object]:
                  payload: dict[str, object] = {
                      "schema_version": self.schema_version,
                      "scope": self.scope,
                      "training_seeds": self.training_seeds,
                      "leaf_digests": self.leaf_digests,
                      "seed_symbol_balanced_net_wealth": self.seed_symbol_balanced_net_wealth,
                      "median_seed_symbol_balanced_net_wealth": (
                          self.median_seed_symbol_balanced_net_wealth
                      ),
                      "worst_seed_symbol_balanced_net_wealth": (
                          self.worst_seed_symbol_balanced_net_wealth
                      ),
                      "all_seed_hard_risk_violation_count": (
                          self.all_seed_hard_risk_violation_count
                      ),
                      "all_seed_turnover_p95_per_day": self.all_seed_turnover_p95_per_day,
                      "bootstrap_result_digest": self.bootstrap.digest,
                      "selection_thresholds_digest": self.selection_thresholds_digest,
                      "passed": self.passed,
                      "rejection_reasons": self.rejection_reasons,
                  }
                  if include_digest:
                      payload["artifact_digest"] = self.digest
                  return payload


          def evaluate_universal_trade_rl_u2_seed_robustness(
              *,
              scope: str,
              leaves: tuple[UniversalTradeRLU2SelectionLeafMetrics, ...],
              segments: tuple[UniversalTradeRLU2ReducedBootstrapSegment, ...],
          ) -> UniversalTradeRLU2SeedRobustnessEvidence:
              """Evaluate one preregistered D1/D2/D1+D2 fixed-seed robustness gate."""

              computed = _compute_universal_trade_rl_u2_seed_robustness(
                  scope=scope,
                  leaves=tuple(leaves),
                  segments=tuple(segments),
              )
              return UniversalTradeRLU2SeedRobustnessEvidence(
                  scope=scope,
                  leaves=computed.leaves,
                  bootstrap_segments=computed.segments,
                  passed=not computed.rejection_reasons,
                  rejection_reasons=computed.rejection_reasons,
              )
          '''

          target = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = target.read_text(encoding="utf-8")
          if "def evaluate_universal_trade_rl_u2_seed_robustness(" in text:
              raise SystemExit("robustness evaluator already exists; refusing duplicate patch")
          marker = "\n\n__all__ = [\n"
          if text.count(marker) != 1:
              raise SystemExit("unexpected __all__ marker count")
          text = text.replace(marker, insertion + marker, 1)
          export_anchor = '    "U2_PRIMARY_SELECTION_CELL_GATE_SCHEMA",\n'
          if text.count(export_anchor) != 1:
              raise SystemExit("unexpected export anchor count")
          exports = (
              '    "U2_SEED_ROBUSTNESS_SCHEMA",\n'
              '    "UniversalTradeRLU2SeedRobustnessEvidence",\n'
              '    "evaluate_universal_trade_rl_u2_seed_robustness",\n'
          )
          text = text.replace(export_anchor, exports + export_anchor, 1)
          target.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/u2-task3-green-patch.yml")
          workflow.unlink()
          PY

          python -m py_compile trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Commit exact patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py .github/workflows/u2-task3-green-patch.yml
          git commit -m "feat: implement U2 fixed-seed robustness gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
