name: U2 Task3 Robustness RED

on:
  push:
    branches:
      - codex/u2-selection-task3-robustness
    paths:
      - "tests/workflows/test_universal_trade_rl_u2_selection_robustness.py"
      - ".github/workflows/u2-task3-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Verify RED test formatting
        run: uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
      - name: Run Task3 RED
        run: uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_robustness.py
