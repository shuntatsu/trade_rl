name: U2 Task3 Wealth Tamper RED

on:
  push:
    branches:
      - codex/u2-selection-task3-contract-green
    paths:
      - "tests/workflows/test_universal_trade_rl_u2_selection_robustness_nonpositive.py"
      - ".github/workflows/u2-task3-wealth-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run ruff format --check --diff tests/workflows/test_universal_trade_rl_u2_selection_robustness_nonpositive.py
      - run: uv run pytest -q tests/workflows/test_universal_trade_rl_u2_selection_robustness_nonpositive.py
