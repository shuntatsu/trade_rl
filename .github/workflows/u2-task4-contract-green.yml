name: U2 Task4 Contract GREEN

on:
  push:
    branches:
      - codex/u2-selection-task4-contract-final

permissions:
  contents: write

jobs:
  green:
    if: "github.event.head_commit.message == 'chore: run U2 Task4 contract GREEN'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: Apply Task4 production and CI patch
        run: |
          set -euo pipefail
          python .github/apply_u2_task4_contract_green.py
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/workflows/universal_trade_rl_u2_selection.py")
          text = path.read_text(encoding="utf-8")
          old = '''class _DigestBoundArtifact(Protocol):
              digest: str

              def to_payload(self, *, include_digest: bool = True) -> dict[str, object]: ...
          '''
          new = '''class _DigestBoundArtifact(Protocol):
              @property
              def digest(self) -> str: ...

              def to_payload(self, *, include_digest: bool = True) -> dict[str, object]: ...
          '''
          if old not in text:
              raise SystemExit("Task4 digest protocol anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run ruff check --fix --select I \
            trade_rl/workflows/universal_trade_rl_u2_selection.py
          uv run ruff format \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_development_selection_evidence.py

      - name: Static verification
        run: |
          set -euo pipefail
          uv run ruff format --check --diff \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_development_selection_evidence.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          uv run ruff check \
            trade_rl/workflows/universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_development_selection_evidence.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py
          uv run mypy trade_rl/workflows/universal_trade_rl_u2_selection.py
          git diff --check

      - name: Focused final Selection verification
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/workflows/test_universal_trade_rl_u2_development_selection_evidence.py \
            tests/workflows/test_universal_trade_rl_u2_selection_gate.py \
            tests/workflows/test_universal_trade_rl_u2_selection_robustness.py \
            tests/workflows/test_universal_trade_rl_u2_selection.py \
            tests/workflows/test_universal_trade_rl_u2_selection_metrics.py \
            tests/workflows/test_universal_trade_rl_u2_selection_summary_integrity.py \
            tests/workflows/test_universal_trade_rl_u2_development_closure.py \
            tests/workflows/test_universal_trade_rl_u2_predevelopment.py \
            tests/integrations/test_universal_trade_rl_u2_selection_metrics_integration.py

      - name: Verify focused CI contains the final gate in candidate patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/u2-contracts.yml").read_text()
          token = "tests/workflows/test_universal_trade_rl_u2_development_selection_evidence.py"
          count = workflow.count(token)
          if count != 3:
              raise SystemExit(f"final Selection test must be in format/lint/focused pytest lists; found {count}")
          PY

      - name: Push verified production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/workflows/universal_trade_rl_u2_selection.py
          test "$(git diff --cached --name-only)" = "trade_rl/workflows/universal_trade_rl_u2_selection.py"
          git diff --cached --check
          git commit -m 'feat: bind final U2 Development Selection evidence'
          git push origin HEAD:codex/u2-selection-task4-contract-final
