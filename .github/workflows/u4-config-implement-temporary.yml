name: Temporary U4 config implementation

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u4-config-implement-temporary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Add warm-start config contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('trade_rl/rl/training.py')
          text = path.read_text()

          old = '''    behavior_cloning_required_relative_improvement: float = 0.0\n    behavior_cloning_gate_loss_weight: float = 1.0\n'''
          new = '''    behavior_cloning_required_relative_improvement: float = 0.0\n    behavior_cloning_critic_warm_start_steps: int = 0\n    behavior_cloning_joint_warm_start_steps: int = 0\n    behavior_cloning_critic_warm_start_learning_rate: float = 3e-4\n    behavior_cloning_joint_warm_start_actor_lr_scale: float = 0.1\n    behavior_cloning_gate_loss_weight: float = 1.0\n'''
          if old not in text:
              raise SystemExit('field insertion point not found')
          text = text.replace(old, new, 1)

          old = '''        if (\n            not math.isfinite(self.behavior_cloning_required_relative_improvement)\n            or not 0.0 <= self.behavior_cloning_required_relative_improvement < 1.0\n        ):\n            raise ValueError(\n                "behavior_cloning_required_relative_improvement must be within [0, 1)"\n            )\n        hierarchical_loss_weights = (\n'''
          new = '''        if (\n            not math.isfinite(self.behavior_cloning_required_relative_improvement)\n            or not 0.0 <= self.behavior_cloning_required_relative_improvement < 1.0\n        ):\n            raise ValueError(\n                "behavior_cloning_required_relative_improvement must be within [0, 1)"\n            )\n        warm_start_steps = (\n            self.behavior_cloning_critic_warm_start_steps,\n            self.behavior_cloning_joint_warm_start_steps,\n        )\n        if any(\n            isinstance(value, bool) or not isinstance(value, int) or value < 0\n            for value in warm_start_steps\n        ):\n            raise ValueError("behavior cloning warm-start steps must be non-negative integers")\n        if (warm_start_steps[0] == 0) != (warm_start_steps[1] == 0):\n            raise ValueError("behavior cloning warm-start phases must both be disabled or enabled")\n        if (\n            not math.isfinite(self.behavior_cloning_critic_warm_start_learning_rate)\n            or self.behavior_cloning_critic_warm_start_learning_rate <= 0.0\n        ):\n            raise ValueError("critic warm-start learning rate must be finite and positive")\n        if (\n            not math.isfinite(self.behavior_cloning_joint_warm_start_actor_lr_scale)\n            or not 0.0 < self.behavior_cloning_joint_warm_start_actor_lr_scale <= 1.0\n        ):\n            raise ValueError("joint actor learning-rate scale must be within (0, 1]")\n        if warm_start_steps[0] > 0:\n            if self.behavior_cloning_epochs <= 0:\n                raise ValueError("critic warm-start requires behavior cloning to be enabled")\n            if self.behavior_cloning_teacher != "oracle":\n                raise ValueError("critic warm-start requires Oracle behavior cloning")\n        hierarchical_loss_weights = (\n'''
          if old not in text:
              raise SystemExit('validation insertion point not found')
          text = text.replace(old, new, 1)

          old = '''                    (\n                        "behavior_cloning_required_relative_improvement",\n                        self.behavior_cloning_required_relative_improvement,\n                        0.0,\n                    ),\n                    (\n                        "behavior_cloning_gate_loss_weight",\n'''
          new = '''                    (\n                        "behavior_cloning_required_relative_improvement",\n                        self.behavior_cloning_required_relative_improvement,\n                        0.0,\n                    ),\n                    (\n                        "behavior_cloning_critic_warm_start_steps",\n                        self.behavior_cloning_critic_warm_start_steps,\n                        0,\n                    ),\n                    (\n                        "behavior_cloning_joint_warm_start_steps",\n                        self.behavior_cloning_joint_warm_start_steps,\n                        0,\n                    ),\n                    (\n                        "behavior_cloning_critic_warm_start_learning_rate",\n                        self.behavior_cloning_critic_warm_start_learning_rate,\n                        3e-4,\n                    ),\n                    (\n                        "behavior_cloning_joint_warm_start_actor_lr_scale",\n                        self.behavior_cloning_joint_warm_start_actor_lr_scale,\n                        0.1,\n                    ),\n                    (\n                        "behavior_cloning_gate_loss_weight",\n'''
          if old not in text:
              raise SystemExit('inactive default insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    @property\n    def rounded_timesteps(self) -> int:\n'''
          new = '''    @property\n    def behavior_cloning_critic_warm_start_enabled(self) -> bool:\n        return self.behavior_cloning_critic_warm_start_steps > 0\n\n    @property\n    def rounded_timesteps(self) -> int:\n'''
          if old not in text:
              raise SystemExit('property insertion point not found')
          text = text.replace(old, new, 1)

          old = '''            "behavior_cloning_required_relative_improvement": (\n                self.behavior_cloning_required_relative_improvement\n            ),\n            "behavior_cloning_gate_loss_weight": self.behavior_cloning_gate_loss_weight,\n'''
          new = '''            "behavior_cloning_required_relative_improvement": (\n                self.behavior_cloning_required_relative_improvement\n            ),\n            "behavior_cloning_critic_warm_start_steps": (\n                self.behavior_cloning_critic_warm_start_steps\n            ),\n            "behavior_cloning_joint_warm_start_steps": (\n                self.behavior_cloning_joint_warm_start_steps\n            ),\n            "behavior_cloning_critic_warm_start_learning_rate": (\n                self.behavior_cloning_critic_warm_start_learning_rate\n            ),\n            "behavior_cloning_joint_warm_start_actor_lr_scale": (\n                self.behavior_cloning_joint_warm_start_actor_lr_scale\n            ),\n            "behavior_cloning_gate_loss_weight": self.behavior_cloning_gate_loss_weight,\n'''
          if old not in text:
              raise SystemExit('digest insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
          uv run ruff check --fix trade_rl/rl/training.py tests/rl/test_universal_critic_warm_start_config.py
          uv run ruff format trade_rl/rl/training.py tests/rl/test_universal_critic_warm_start_config.py
          uv run pytest tests/rl/test_universal_critic_warm_start_config.py -q
          uv run mypy trade_rl/rl/training.py
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/training.py tests/rl/test_universal_critic_warm_start_config.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: configure universal critic warm start"
          git push origin HEAD:integration/universal-research-u3-u6
