name: Temporary U4 critic warm-start TDD

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u4-critic-warm-start-tdd-temporary.yml
      - tests/integrations/test_universal_critic_warm_start.py
      - trade_rl/integrations/universal_critic_warm_start.py

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Static checks
        run: |
          uv run ruff check tests/integrations/test_universal_critic_warm_start.py trade_rl/integrations/universal_critic_warm_start.py 2>/dev/null || uv run ruff check tests/integrations/test_universal_critic_warm_start.py
          uv run ruff format --check tests/integrations/test_universal_critic_warm_start.py
      - name: U4 focused test
        run: uv run pytest tests/integrations/test_universal_critic_warm_start.py -q
