name: Temporary U4 SB3 implementation

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u4-sb3-implement-temporary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Wire configured warm start into SB3
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text()
          import_anchor = "from trade_rl.integrations.behavior_cloning import pretrain_policy\n"
          import_block = '''from trade_rl.integrations.universal_critic_warm_start import (
              ConfiguredCriticWarmStart,
              run_configured_critic_warm_start,
          )
          '''
          import_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in import_block.splitlines()
          ) + "\n"
          if "run_configured_critic_warm_start," not in text:
              if import_anchor not in text:
                  raise SystemExit("U4 import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_block, 1)

          class_anchor = "\n\nclass StableBaselines3Backend(_StableBaselines3TeacherPipeline):\n"
          helper = '''

          def _run_behavior_cloning_critic_warm_start_if_enabled(
              *,
              policy: Any,
              teacher_environment: Any,
              teacher_dataset: SupervisedPolicyDataset,
              episode_batch: EpisodeOracleBatch | None,
              episode_split: BehaviorCloningSplit | None,
              config: ResidualTrainingConfig,
              observation_provider: Any | None,
              behavior_cloning_seed: int,
              output_root: Path,
          ) -> ConfiguredCriticWarmStart | None:
              if not config.behavior_cloning_critic_warm_start_enabled:
                  return None
              if episode_batch is None or episode_split is None:
                  raise RuntimeError(
                      "critic warm-start requires Oracle episode evidence and split"
                  )
              return run_configured_critic_warm_start(
                  policy=policy,
                  teacher_environment=teacher_environment,
                  teacher_dataset=teacher_dataset,
                  episode_batch=episode_batch,
                  split=episode_split,
                  config=config,
                  observation_provider=observation_provider,
                  behavior_cloning_seed=behavior_cloning_seed,
                  output_root=output_root,
              )
          '''
          helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in helper.splitlines()
          )
          if "def _run_behavior_cloning_critic_warm_start_if_enabled(" not in text:
              if class_anchor not in text:
                  raise SystemExit("U4 helper anchor not found")
              text = text.replace(class_anchor, helper + class_anchor, 1)

          gate_finally_anchor = (
              "                    if gate_evaluation is not None:\n"
              "                        _enforce_behavior_cloning_gates(gate_evaluation)\n"
              "                    elif not quality_passed:\n"
              "                        raise RuntimeError(\n"
              "                            \"behavior cloning failed the required MSE improvement gate\"\n"
              "                        )\n"
              "                finally:\n"
              "                    teacher_environment.close()\n"
          )
          replacement = (
              "                    if gate_evaluation is not None:\n"
              "                        _enforce_behavior_cloning_gates(gate_evaluation)\n"
              "                    elif not quality_passed:\n"
              "                        raise RuntimeError(\n"
              "                            \"behavior cloning failed the required MSE improvement gate\"\n"
              "                        )\n"
              "                    _run_behavior_cloning_critic_warm_start_if_enabled(\n"
              "                        policy=model.policy,\n"
              "                        teacher_environment=teacher_environment,\n"
              "                        teacher_dataset=teacher_dataset,\n"
              "                        episode_batch=episode_batch,\n"
              "                        episode_split=episode_split,\n"
              "                        config=config,\n"
              "                        observation_provider=observation_provider,\n"
              "                        behavior_cloning_seed=behavior_cloning_seed,\n"
              "                        output_root=output_path.parent,\n"
              "                    )\n"
              "                finally:\n"
              "                    teacher_environment.close()\n"
          )
          if text.count("_run_behavior_cloning_critic_warm_start_if_enabled(") == 1:
              if text.count(gate_finally_anchor) != 1:
                  raise SystemExit("U4 BC gate/finally boundary is not unique")
              text = text.replace(gate_finally_anchor, replacement, 1)
          path.write_text(text)
          PY
          uv run ruff check --fix trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_critic_warm_start.py
          uv run ruff format trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_critic_warm_start.py
          uv run ruff check trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_critic_warm_start.py
          uv run mypy trade_rl/integrations/sb3_training.py trade_rl/integrations/universal_critic_warm_start.py
          uv run pytest tests/integrations/test_sb3_universal_critic_warm_start.py tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py -q
          git diff --check
      - name: Commit U4 SB3 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_critic_warm_start.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire U4 critic warm start into SB3"
          fi
          git pull --rebase origin integration/universal-research-u3-u6
          git push origin HEAD:integration/universal-research-u3-u6
