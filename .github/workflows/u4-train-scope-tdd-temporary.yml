name: Temporary U4 train-scope TDD

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u4-train-scope-tdd-temporary.yml
      - tests/integrations/test_universal_critic_warm_start.py
      - tests/integrations/test_configured_universal_critic_warm_start.py
      - trade_rl/integrations/universal_critic_warm_start.py

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Implement configured warm start
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/universal_critic_warm_start.py")
          text = path.read_text()
          if "def run_configured_critic_warm_start(" not in text:
              text = text.replace(
                  "from dataclasses import dataclass\nfrom typing import Any\n",
                  "from dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Any\n",
                  1,
              )
              text = text.replace(
                  "from trade_rl.learning.behavior_cloning import ObservationBatchProvider\n",
                  "from trade_rl.artifacts.atomic_write import atomic_write_bytes\nfrom trade_rl.artifacts.codec import canonical_json_bytes\nfrom trade_rl.artifacts.hashing import content_digest\nfrom trade_rl.learning.behavior_cloning import ObservationBatchProvider\nfrom trade_rl.learning.episode_behavior_cloning import BehaviorCloningSplit\n",
                  1,
              )
              text = text.replace(
                  "from trade_rl.learning.universal_bc import CriticWarmStartPlan\n",
                  "from trade_rl.learning.universal_bc import CriticWarmStartPlan\nfrom trade_rl.rl.training import ResidualTrainingConfig\n",
                  1,
              )
              addition = '''

          @dataclass(frozen=True, slots=True)
          class ConfiguredCriticWarmStart:
              warm_start: CriticWarmStartResult
              artifact_path: Path
              artifact_digest: str


          def _teacher_dataset_identity(
              teacher_dataset: SupervisedPolicyDataset,
          ) -> str:
              return content_digest(
                  {
                      "schema_version": "supervised_policy_dataset_identity_v1",
                      "dataset_id": teacher_dataset.dataset_id,
                      "train_start": teacher_dataset.train_start,
                      "train_stop": teacher_dataset.train_stop,
                      "environment_digest": teacher_dataset.environment_digest,
                      "action_spec_digest": teacher_dataset.action_spec_digest,
                      "teacher_config_digest": teacher_dataset.teacher_config_digest,
                      "observation_digest": teacher_dataset.observation_digest,
                      "action_digest": teacher_dataset.action_digest,
                  }
              )


          def run_configured_critic_warm_start(
              *,
              policy: Any,
              teacher_environment: Any,
              teacher_dataset: SupervisedPolicyDataset,
              episode_batch: EpisodeOracleBatch,
              split: BehaviorCloningSplit,
              config: ResidualTrainingConfig,
              observation_provider: ObservationBatchProvider | None,
              behavior_cloning_seed: int,
              output_root: Path,
          ) -> ConfiguredCriticWarmStart:
              """Run the configured Oracle critic warm-start and bind immutable evidence."""

              if not config.behavior_cloning_critic_warm_start_enabled:
                  raise ValueError(
                      "configured critic warm-start requires the feature to be enabled"
                  )
              if episode_batch.decision_count != teacher_dataset.sample_count:
                  raise ValueError(
                      "critic warm-start Oracle batch and teacher dataset disagree"
                  )
              critic_targets = collect_episode_return_targets(
                  teacher_environment,
                  episode_batch,
                  gamma=config.gamma,
              )
              plan = CriticWarmStartPlan(
                  critic_only_steps=config.behavior_cloning_critic_warm_start_steps,
                  joint_fine_tune_steps=config.behavior_cloning_joint_warm_start_steps,
                  joint_actor_learning_rate_scale=(
                      config.behavior_cloning_joint_warm_start_actor_lr_scale
                  ),
              )
              result = warm_start_policy_actor_critic(
                  policy,
                  teacher_dataset,
                  critic_targets,
                  plan=plan,
                  sample_indices=split.train_indices,
                  observation_provider=observation_provider,
                  batch_size=config.behavior_cloning_batch_size,
                  learning_rate=config.behavior_cloning_critic_warm_start_learning_rate,
                  seed=behavior_cloning_seed,
              )
              if result.actor_max_abs_drift_critic_only != 0.0:
                  raise RuntimeError("critic-only warm-start changed actor outputs")
              train_indices = tuple(int(value) for value in split.train_indices)
              payload: dict[str, object] = {
                  "schema_version": "universal_critic_warm_start_v1",
                  "behavior_cloning_seed": behavior_cloning_seed,
                  "teacher_dataset_digest": _teacher_dataset_identity(teacher_dataset),
                  "episode_batch_digest": episode_batch.digest,
                  "training_config_digest": content_digest(config.digest_payload()),
                  "train_indices_digest": content_digest({"indices": train_indices}),
                  "train_sample_count": len(train_indices),
                  "validation_sample_count": split.validation_sample_count,
                  "purged_sample_count": split.purged_sample_count,
                  "gamma": config.gamma,
                  "batch_size": config.behavior_cloning_batch_size,
                  "learning_rate": (
                      config.behavior_cloning_critic_warm_start_learning_rate
                  ),
                  "plan": {
                      "critic_only_steps": plan.critic_only_steps,
                      "joint_fine_tune_steps": plan.joint_fine_tune_steps,
                      "joint_actor_learning_rate_scale": (
                          plan.joint_actor_learning_rate_scale
                      ),
                  },
                  "result": asdict(result),
              }
              artifact_digest = content_digest(payload)
              artifact_path = output_root / "critic-warm-start.json"
              output_root.mkdir(parents=True, exist_ok=True)
              atomic_write_bytes(
                  artifact_path,
                  canonical_json_bytes(
                      {**payload, "artifact_digest": artifact_digest}
                  ),
              )
              return ConfiguredCriticWarmStart(
                  warm_start=result,
                  artifact_path=artifact_path,
                  artifact_digest=artifact_digest,
              )
          '''
              addition = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in addition.splitlines()
              )
              path.write_text(text.rstrip() + addition + "\n")

          test_path = Path(
              "tests/integrations/test_configured_universal_critic_warm_start.py"
          )
          test_text = test_path.read_text()
          old = '    assert payload["teacher_dataset_digest"] == dataset.artifact_digest\n'
          if old in test_text:
              new = '''    assert payload["teacher_dataset_digest"] == content_digest(
              {
                  "schema_version": "supervised_policy_dataset_identity_v1",
                  "dataset_id": dataset.dataset_id,
                  "train_start": dataset.train_start,
                  "train_stop": dataset.train_stop,
                  "environment_digest": dataset.environment_digest,
                  "action_spec_digest": dataset.action_spec_digest,
                  "teacher_config_digest": dataset.teacher_config_digest,
                  "observation_digest": dataset.observation_digest,
                  "action_digest": dataset.action_digest,
              }
          )
          '''
              new = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in new.splitlines()
              ) + "\n"
              test_path.write_text(test_text.replace(old, new, 1))
          PY
      - name: Check and test focused U4 files
        run: |
          uv run ruff check --fix tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py trade_rl/integrations/universal_critic_warm_start.py
          uv run ruff format tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py trade_rl/integrations/universal_critic_warm_start.py
          uv run ruff check tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py trade_rl/integrations/universal_critic_warm_start.py
          uv run mypy trade_rl/integrations/universal_critic_warm_start.py
          uv run pytest tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py -q
          git diff --check
      - name: Commit configured implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integrations/test_universal_critic_warm_start.py tests/integrations/test_configured_universal_critic_warm_start.py trade_rl/integrations/universal_critic_warm_start.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: bind configured U4 critic warm start"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
