name: Temporary U5 Stage A TDD

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u5-stage-a-tdd-temporary.yml
      - tests/workflows/test_universal_stage_a.py
      - trade_rl/workflows/universal_stage_a.py
      - trade_rl/rl/universal_architecture.py

permissions:
  contents: read

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run ruff check tests/workflows/test_universal_stage_a.py trade_rl/workflows/universal_stage_a.py trade_rl/rl/universal_architecture.py
      - run: uv run ruff format --check tests/workflows/test_universal_stage_a.py trade_rl/workflows/universal_stage_a.py trade_rl/rl/universal_architecture.py
      - run: uv run mypy trade_rl/workflows/universal_stage_a.py trade_rl/rl/universal_architecture.py
      - run: uv run pytest tests/workflows/test_universal_stage_a.py -q
