name: Temporary U6 full research TDD

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/u6-full-research-tdd-temporary.yml
      - tests/workflows/test_universal_full_research_runtime.py
      - tests/rl/test_universal_research_u3_u6.py
      - trade_rl/workflows/universal_research.py
      - trade_rl/workflows/universal_research_runtime.py
      - scripts/run_full_research_experiment.py

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Format and verify U6
        run: |
          uv run ruff check --fix tests/workflows/test_universal_full_research_runtime.py tests/rl/test_universal_research_u3_u6.py trade_rl/workflows/universal_research.py trade_rl/workflows/universal_research_runtime.py scripts/run_full_research_experiment.py
          uv run ruff format tests/workflows/test_universal_full_research_runtime.py tests/rl/test_universal_research_u3_u6.py trade_rl/workflows/universal_research.py trade_rl/workflows/universal_research_runtime.py scripts/run_full_research_experiment.py
          uv run ruff check tests/workflows/test_universal_full_research_runtime.py tests/rl/test_universal_research_u3_u6.py trade_rl/workflows/universal_research.py trade_rl/workflows/universal_research_runtime.py scripts/run_full_research_experiment.py
          uv run mypy trade_rl/workflows/universal_research.py trade_rl/workflows/universal_research_runtime.py scripts/run_full_research_experiment.py
          uv run pytest tests/workflows/test_universal_full_research_runtime.py tests/rl/test_universal_research_u3_u6.py -q
          git diff --check
      - name: Commit U6 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflows/test_universal_full_research_runtime.py tests/rl/test_universal_research_u3_u6.py trade_rl/workflows/universal_research.py trade_rl/workflows/universal_research_runtime.py scripts/run_full_research_experiment.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: complete U6 full research integration"
          fi
          git pull --rebase origin integration/universal-research-u3-u6
          git push origin HEAD:integration/universal-research-u3-u6
