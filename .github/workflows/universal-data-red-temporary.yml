name: Temporary Universal Data RED

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/universal-data-red-temporary.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: |
          uv run ruff check --fix tests/integrations/test_universal_data_training_contract.py
          uv run ruff format tests/integrations/test_universal_data_training_contract.py
          uv run ruff check tests/integrations/test_universal_data_training_contract.py
          uv run ruff format --check tests/integrations/test_universal_data_training_contract.py
      - run: uv run pytest tests/integrations/test_universal_data_training_contract.py -q
