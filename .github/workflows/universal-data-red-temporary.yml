name: Temporary Universal Data TDD

on:
  push:
    branches:
      - integration/universal-research-u3-u6
    paths:
      - .github/workflows/universal-data-red-temporary.yml

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Implement selectable PostgreSQL feature profile
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("trade_rl/integrations/postgres_market_dataset.py")
          text = path.read_text()
          start = text.index("def _align_indicators(\n")
          end = text.index("\n\ndef build_postgres_market_dataset(\n", start)
          replacement = textwrap.dedent('''\
          def _align_indicators(
              bundle: NativeIndicatorArtifactBundle,
              *,
              timestamps_ms: np.ndarray,
              symbol_vocabulary: tuple[str, ...],
              feature_specs: Sequence[FeatureSpec] | None = None,
          ) -> tuple[
              np.ndarray,
              np.ndarray,
              np.ndarray,
              np.ndarray,
              tuple[str, ...],
              str,
          ]:
              vocabulary = _ordered_unique(symbol_vocabulary, field="symbol_vocabulary")
              if not set(bundle.symbols) <= set(vocabulary):
                  raise ValueError("indicator symbols must belong to symbol_vocabulary")
              specs = _feature_specs() if feature_specs is None else tuple(feature_specs)
              if not specs:
                  raise ValueError("feature_specs must not be empty")
              feature_names = tuple(spec.name for spec in specs)
              if any(not name for name in feature_names) or len(set(feature_names)) != len(feature_names):
                  raise ValueError("feature_specs must contain unique non-empty feature names")
              artifact_feature_names = tuple(
                  name
                  for timeframe in NATIVE_TIMEFRAMES
                  for name in bundle.get(bundle.symbols[0], timeframe).feature_names
              )
              if feature_specs is None and artifact_feature_names != feature_names:
                  raise ValueError(
                      "PostgreSQL indicator feature order differs from code contract"
                  )
              unknown = set(feature_names) - set(artifact_feature_names)
              if unknown:
                  raise ValueError(
                      "requested PostgreSQL feature profile is absent from indicator artifacts"
                  )
              spec_by_name = {spec.name: spec for spec in specs}
              target_by_name = {name: index for index, name in enumerate(feature_names)}
              shape = (len(timestamps_ms), len(bundle.symbols), len(feature_names))
              values = np.zeros(shape, dtype=np.float32)
              available = np.zeros(shape, dtype=np.bool_)
              age_hours = np.zeros(shape, dtype=np.float32)
              staleness = np.ones(shape, dtype=np.float32)

              for timeframe in NATIVE_TIMEFRAMES:
                  names = bundle.get(bundle.symbols[0], timeframe).feature_names
                  name_to_local = {name: index for index, name in enumerate(names)}
                  requested_names = tuple(
                      name for name in feature_names if name.startswith(f"{timeframe}__")
                  )
                  if not requested_names:
                      raise ValueError(
                          f"requested feature profile has no {timeframe} channels"
                      )
                  for symbol_index, symbol in enumerate(bundle.symbols):
                      artifact = bundle.get(symbol, timeframe)
                      if artifact.feature_names != names:
                          raise ValueError("indicator feature order differs between symbols")
                      for name in requested_names:
                          local_index = name_to_local.get(name)
                          if local_index is None:
                              raise ValueError(
                                  f"requested feature {name} is absent from {timeframe} artifact"
                              )
                          valid_rows = np.flatnonzero(artifact.available[:, local_index])
                          if valid_rows.size == 0:
                              continue
                          source_times = artifact.event_time_ms[valid_rows]
                          positions = np.searchsorted(
                              source_times, timestamps_ms, side="right"
                          ) - 1
                          present = positions >= 0
                          safe_positions = np.maximum(positions, 0)
                          source_indices = valid_rows[safe_positions]
                          ages = (
                              timestamps_ms.astype(np.float64)
                              - artifact.event_time_ms[source_indices].astype(np.float64)
                          ) / _MS_PER_HOUR
                          maximum = float(spec_by_name[name].max_staleness_hours)
                          present &= ages >= -1e-12
                          present &= ages <= maximum + 1e-12
                          target = target_by_name[name]
                          values[present, symbol_index, target] = artifact.values[
                              source_indices[present], local_index
                          ]
                          available[present, symbol_index, target] = True
                          age_hours[:, symbol_index, target] = maximum
                          age_hours[present, symbol_index, target] = np.asarray(
                              ages[present], dtype=np.float32
                          )
                          staleness[present, symbol_index, target] = np.asarray(
                              np.clip(ages[present] / maximum, 0.0, 1.0),
                              dtype=np.float32,
                          )

              feature_digest = content_digest(
                  {
                      "asset_identity_mode": POLICY_ASSET_IDENTITY_MODE,
                      "feature_names": feature_names,
                      "indicator_feature_config_digest": bundle.feature_config_digest,
                      "schema_version": "postgres_indicator_alignment_v2",
                  }
              )
              return values, available, age_hours, staleness, feature_names, feature_digest
          ''')
          text = text[:start] + replacement + text[end:]
          signature_anchor = (
              "    indicator_bundle: NativeIndicatorArtifactBundle | None = None,\n"
              "    slot_symbols: Sequence[str] | None = None,\n"
          )
          if "    feature_specs: Sequence[FeatureSpec] | None = None,\n" not in text[end:]:
              if signature_anchor not in text:
                  raise SystemExit("dataset builder signature anchor not found")
              text = text.replace(
                  signature_anchor,
                  "    indicator_bundle: NativeIndicatorArtifactBundle | None = None,\n"
                  "    feature_specs: Sequence[FeatureSpec] | None = None,\n"
                  "    slot_symbols: Sequence[str] | None = None,\n",
                  1,
              )
          call_anchor = (
              "        timestamps_ms=timestamps_ms,\n"
              "        symbol_vocabulary=vocabulary,\n"
              "    )\n"
          )
          if "        feature_specs=feature_specs,\n" not in text:
              if call_anchor not in text:
                  raise SystemExit("indicator alignment call anchor not found")
              text = text.replace(
                  call_anchor,
                  "        timestamps_ms=timestamps_ms,\n"
                  "        symbol_vocabulary=vocabulary,\n"
                  "        feature_specs=feature_specs,\n"
                  "    )\n",
                  1,
              )
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Verify Universal data contracts
        run: |
          uv run ruff check --fix trade_rl/integrations/postgres_market_dataset.py trade_rl/rl/universal_normalization.py tests/integrations/test_universal_data_training_contract.py
          uv run ruff format trade_rl/integrations/postgres_market_dataset.py trade_rl/rl/universal_normalization.py tests/integrations/test_universal_data_training_contract.py
          uv run ruff check trade_rl/integrations/postgres_market_dataset.py trade_rl/rl/universal_normalization.py tests/integrations/test_universal_data_training_contract.py
          uv run mypy trade_rl/integrations/postgres_market_dataset.py trade_rl/rl/universal_normalization.py
          uv run pytest tests/integrations/test_universal_data_training_contract.py tests/integrations/test_postgres_identity_free_features.py tests/rl/test_universal_research_u3_u6.py -q
          git diff --check
      - name: Commit Universal data implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/postgres_market_dataset.py trade_rl/rl/universal_normalization.py tests/integrations/test_universal_data_training_contract.py
          if ! git diff --cached --quiet; then git commit -m "feat: materialize Universal 206-feature training data"; fi
          git pull --rebase origin integration/universal-research-u3-u6
          git push origin HEAD:integration/universal-research-u3-u6
