name: Temporary Universal Pretraining Hook TDD

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-pretraining-hook-red-temporary.yml]

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Implement Universal pretraining hook boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text()
          import_anchor = "from trade_rl.catalog.reusable_artifacts import ReusableArtifactIndex\n"
          digest_import = "from trade_rl.domain.common import require_sha256\n"
          if digest_import not in text:
              if import_anchor not in text:
                  raise SystemExit("domain import anchor not found")
              text = text.replace(import_anchor, import_anchor + digest_import, 1)

          if "def _apply_universal_pretraining_if_configured(" not in text:
              pos = text.index("def _run_behavior_cloning_critic_warm_start_if_enabled(\n")
              helper = textwrap.dedent('''\
              def _apply_universal_pretraining_if_configured(
                  *,
                  hook: Callable[..., Mapping[str, object]] | None,
                  policy: Any,
                  config: ResidualTrainingConfig,
                  behavior_cloning_seed: int,
                  member_seed: int,
                  output_root: Path,
              ) -> dict[str, object] | None:
                  if hook is None:
                      return None
                  if config.behavior_cloning_epochs <= 0:
                      raise ValueError(
                          "Universal pretraining requires behavior cloning to be enabled"
                      )
                  if config.behavior_cloning_teacher != "oracle":
                      raise ValueError(
                          "Universal pretraining requires the Oracle behavior cloning teacher"
                      )
                  if not callable(hook):
                      raise TypeError("Universal pretraining hook must be callable")
                  evidence = hook(
                      policy=policy,
                      config=config,
                      behavior_cloning_seed=behavior_cloning_seed,
                      member_seed=member_seed,
                      output_root=output_root,
                  )
                  if not isinstance(evidence, Mapping):
                      raise TypeError("Universal pretraining hook must return a mapping")
                  payload = dict(evidence)
                  if payload.get("schema_version") != "universal_pretraining_evidence_v1":
                      raise ValueError("Universal pretraining evidence schema mismatch")
                  if payload.get("passed") is not True:
                      raise RuntimeError("Universal pretraining failed its admission gates")
                  for field in ("teacher_artifact_digest", "behavior_cloning_digest"):
                      value = payload.get(field)
                      if not isinstance(value, str):
                          raise ValueError(f"Universal pretraining evidence is missing {field}")
                      require_sha256(value, field=field)
                  critic_digest = payload.get("critic_warm_start_digest")
                  if config.behavior_cloning_critic_warm_start_enabled:
                      if not isinstance(critic_digest, str):
                          raise ValueError(
                              "Universal pretraining evidence is missing critic_warm_start_digest"
                          )
                      require_sha256(
                          critic_digest,
                          field="critic_warm_start_digest",
                      )
                  elif critic_digest is not None:
                      if not isinstance(critic_digest, str):
                          raise ValueError(
                              "critic_warm_start_digest must be a SHA-256 string when present"
                          )
                      require_sha256(
                          critic_digest,
                          field="critic_warm_start_digest",
                      )
                  bound_payload: dict[str, object] = {
                      **payload,
                      "behavior_cloning_seed": behavior_cloning_seed,
                      "member_seed": member_seed,
                      "training_config_digest": content_digest(config.digest_payload()),
                  }
                  artifact_digest = content_digest(bound_payload)
                  resolved = {**bound_payload, "artifact_digest": artifact_digest}
                  output_root.mkdir(parents=True, exist_ok=True)
                  atomic_write_bytes(
                      output_root / "universal-pretraining.json",
                      canonical_json_bytes(resolved),
                  )
                  return resolved


              ''')
              text = text[:pos] + helper + text[pos:]

          ctor_anchor = (
              "        transfer_checkpoint_artifacts: Mapping[int, Path] | None = None,\n"
              "        structured_export_enabled: bool = False,\n"
          )
          if "        universal_pretraining_hook:" not in text:
              if ctor_anchor not in text:
                  raise SystemExit("backend constructor anchor not found")
              text = text.replace(
                  ctor_anchor,
                  "        transfer_checkpoint_artifacts: Mapping[int, Path] | None = None,\n"
                  "        universal_pretraining_hook: (\n"
                  "            Callable[..., Mapping[str, object]] | None\n"
                  "        ) = None,\n"
                  "        structured_export_enabled: bool = False,\n",
                  1,
              )
          store_anchor = (
              "        self.transfer_checkpoint_artifacts = dict(transfer_checkpoint_artifacts or {})\n"
          )
          if "self.universal_pretraining_hook = universal_pretraining_hook" not in text:
              if store_anchor not in text:
                  raise SystemExit("backend hook storage anchor not found")
              text = text.replace(
                  store_anchor,
                  store_anchor
                  + "        if universal_pretraining_hook is not None and not callable(\n"
                  + "            universal_pretraining_hook\n"
                  + "        ):\n"
                  + "            raise TypeError(\"universal_pretraining_hook must be callable\")\n"
                  + "        self.universal_pretraining_hook = universal_pretraining_hook\n",
                  1,
              )

          prefetch_anchor = (
              "            if fresh_behavior_cloning and config.behavior_cloning_teacher == \"oracle\":\n"
          )
          if prefetch_anchor in text:
              text = text.replace(
                  prefetch_anchor,
                  "            if (\n"
                  "                fresh_behavior_cloning\n"
                  "                and self.universal_pretraining_hook is None\n"
                  "                and config.behavior_cloning_teacher == \"oracle\"\n"
                  "            ):\n",
                  1,
              )

          legacy_anchor = (
              "                environment_suspended_for_teacher = True\n"
              "            if fresh_behavior_cloning:\n"
              "                teacher_environment = self.environment_factory()\n"
          )
          if legacy_anchor in text:
              text = text.replace(
                  legacy_anchor,
                  "                environment_suspended_for_teacher = True\n"
                  "            if (\n"
                  "                fresh_behavior_cloning\n"
                  "                and self.universal_pretraining_hook is None\n"
                  "            ):\n"
                  "                teacher_environment = self.environment_factory()\n",
                  1,
              )

          train_start = text.index("    def train(\n")
          if "_apply_universal_pretraining_if_configured(" not in text[train_start:]:
              hook_anchor = (
                  "                finally:\n"
                  "                    teacher_environment.close()\n"
                  "            if environment_suspended_for_teacher:\n"
              )
              if hook_anchor not in text:
                  raise SystemExit("Universal hook insertion anchor not found")
              text = text.replace(
                  hook_anchor,
                  "                finally:\n"
                  "                    teacher_environment.close()\n"
                  "            if (\n"
                  "                fresh_behavior_cloning\n"
                  "                and self.universal_pretraining_hook is not None\n"
                  "            ):\n"
                  "                _apply_universal_pretraining_if_configured(\n"
                  "                    hook=self.universal_pretraining_hook,\n"
                  "                    policy=model.policy,\n"
                  "                    config=config,\n"
                  "                    behavior_cloning_seed=behavior_cloning_seed,\n"
                  "                    member_seed=seed,\n"
                  "                    output_root=output_path.parent,\n"
                  "                )\n"
                  "            if environment_suspended_for_teacher:\n",
                  1,
              )
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Verify Universal hook and legacy BC
        run: |
          uv run ruff format trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_pretraining_hook.py
          uv run ruff check trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_pretraining_hook.py
          uv run mypy trade_rl/integrations/sb3_training.py
          uv run pytest tests/integrations/test_sb3_universal_pretraining_hook.py tests/integrations/test_sb3_universal_critic_warm_start.py tests/integrations/test_sb3_training.py -q
          git diff --check
      - name: Commit Universal SB3 hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_universal_pretraining_hook.py
          if ! git diff --cached --quiet; then git commit -m "feat: wire Universal pretraining into SB3"; fi
          git pull --rebase origin integration/universal-research-u3-u6
          git push origin HEAD:integration/universal-research-u3-u6
