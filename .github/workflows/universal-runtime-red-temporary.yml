name: Temporary Universal Runtime TDD

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-runtime-red-temporary.yml]

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Fuse instrument context into sequence extractor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/policies.py")
          text = path.read_text()
          old_signature = "        global_width: int,\n        n_symbols: int,\n        current_weight_source: str = CURRENT_WEIGHT_SOURCE,\n"
          new_signature = "        global_width: int,\n        n_symbols: int,\n        instrument_context_width: int = 0,\n        current_weight_source: str = CURRENT_WEIGHT_SOURCE,\n"
          if "instrument_context_width: int = 0" not in text:
              if old_signature not in text:
                  raise SystemExit("sequence extractor signature anchor not found")
              text = text.replace(old_signature, new_signature, 1)

          old_shapes = '''        expected_shapes: dict[str, tuple[int, ...]] = {
              "current_snapshot": (n_symbols, snapshot_width),
              "asset_state": (n_symbols, asset_state_width),
              "global_state": (global_width,),
              "active": (n_symbols,),
              "current_weights": (n_symbols,),
          }
          for timeframe in timeframes:
          '''.replace("          ", "")
          new_shapes = '''        expected_shapes: dict[str, tuple[int, ...]] = {
              "current_snapshot": (n_symbols, snapshot_width),
              "asset_state": (n_symbols, asset_state_width),
              "global_state": (global_width,),
              "active": (n_symbols,),
              "current_weights": (n_symbols,),
          }
          if instrument_context_width < 0:
              raise ValueError("instrument_context_width must be non-negative")
          if instrument_context_width > 0:
              expected_shapes["instrument_context"] = (
                  n_symbols,
                  instrument_context_width,
              )
          for timeframe in timeframes:
          '''.replace("          ", "")
          if 'expected_shapes["instrument_context"]' not in text:
              if old_shapes not in text:
                  raise SystemExit("sequence expected-shapes anchor not found")
              text = text.replace(old_shapes, new_shapes, 1)

          old_encoder = '''        self.global_encoder = nn.Sequential(
              nn.Linear(global_width, 256),
              nn.LayerNorm(256),
              nn.SiLU(),
              nn.Linear(256, 128),
              nn.LayerNorm(128),
              nn.SiLU(),
          )
          \n    def forward(self, observations: dict[str, torch.Tensor]) -> torch.Tensor:
          '''.replace("          ", "")
          new_encoder = '''        self.global_encoder = nn.Sequential(
              nn.Linear(global_width, 256),
              nn.LayerNorm(256),
              nn.SiLU(),
              nn.Linear(256, 128),
              nn.LayerNorm(128),
              nn.SiLU(),
          )
          self.instrument_context_encoder = (
              None
              if instrument_context_width == 0
              else nn.Sequential(
                  nn.Linear(instrument_context_width, d_model),
                  nn.LayerNorm(d_model),
                  nn.SiLU(),
                  nn.Linear(d_model, d_model),
                  nn.LayerNorm(d_model),
              )
          )
          \n    def forward(self, observations: dict[str, torch.Tensor]) -> torch.Tensor:
          '''.replace("          ", "")
          if "self.instrument_context_encoder" not in text:
              if old_encoder not in text:
                  raise SystemExit("sequence global-encoder anchor not found")
              text = text.replace(old_encoder, new_encoder, 1)

          old_forward = '''            asset_tokens, pooled_assets = self.asset_encoder(
                  sequences=sequences,
                  available=available,
                  staleness=staleness_by_timeframe,
                  snapshot=reference.float(),
                  asset_state=observations["asset_state"].float(),
                  active=observations["active"].float(),
              )
              globals_ = self.global_encoder(observations["global_state"].float())
          '''.replace("          ", "")
          new_forward = '''            asset_tokens, pooled_assets = self.asset_encoder(
                  sequences=sequences,
                  available=available,
                  staleness=staleness_by_timeframe,
                  snapshot=reference.float(),
                  asset_state=observations["asset_state"].float(),
                  active=observations["active"].float(),
              )
              if self.instrument_context_encoder is not None:
                  context_tokens = self.instrument_context_encoder(
                      observations["instrument_context"].float()
                  )
                  asset_tokens = asset_tokens + context_tokens
                  active_context = observations["active"].float().unsqueeze(-1)
                  denominator = active_context.sum(dim=1).clamp_min(1.0)
                  pooled_context = (
                      (context_tokens * active_context).sum(dim=1) / denominator
                  )
                  pooled_assets = pooled_assets + pooled_context
              globals_ = self.global_encoder(observations["global_state"].float())
          '''.replace("          ", "")
          if "context_tokens = self.instrument_context_encoder" not in text:
              if old_forward not in text:
                  raise SystemExit("sequence forward anchor not found")
              text = text.replace(old_forward, new_forward, 1)
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Route Universal sequence assembly through full Dict rollout storage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_model_assembly.py")
          text = path.read_text()
          if "def _is_universal_single_instrument" not in text:
              anchor = "def _rollout_buffer_bytes(\n"
              if anchor not in text:
                  raise SystemExit("rollout helper anchor not found")
              text = text.replace(
                  anchor,
                  "def _is_universal_single_instrument(probe: object) -> bool:\n"
                  "    unwrapped = getattr(probe, \"unwrapped\", probe)\n"
                  "    return bool(getattr(unwrapped, \"is_universal_single_instrument\", False))\n\n\n"
                  + anchor,
                  1,
              )
          old_estimator = '''    estimator = (
              estimate_index_backed_ppo_rollout_buffer_bytes
              if config.observation_encoder == "hierarchical_sequence_v2"
              else estimate_ppo_rollout_buffer_bytes
          )
          '''.replace("          ", "")
          new_estimator = '''    estimator = (
              estimate_index_backed_ppo_rollout_buffer_bytes
              if (
                  config.observation_encoder == "hierarchical_sequence_v2"
                  and not _is_universal_single_instrument(probe)
              )
              else estimate_ppo_rollout_buffer_bytes
          )
          '''.replace("          ", "")
          if old_estimator in text:
              text = text.replace(old_estimator, new_estimator, 1)

          text = text.replace(
              "    SequenceRolloutReconstructor,\n    bool,\n]:\n",
              "    SequenceRolloutReconstructor | None,\n    bool,\n]:\n",
              1,
          )
          old_sequence = '''    dataset = getattr(unwrapped, "dataset", None)
          raw_symbols = getattr(dataset, "symbols", None)
          if (
              not isinstance(raw_symbols, (tuple, list))
              or not raw_symbols
              or any(not isinstance(item, str) or not item for item in raw_symbols)
          ):
              raise ValueError("sequence training requires ordered dataset symbols")
          symbols = tuple(raw_symbols)
          expected_action_names = tuple(f"target_weight:{symbol}" for symbol in symbols)
          if (
              _action_size(identity) != int(sequence_metadata["n_symbols"])
              or action_names != expected_action_names
          ):
              raise ValueError(
                  "hierarchical sequence training requires target_weight actions in exact "
                  "dataset symbol order"
              )
          uses_shared_asset_actor = True
          sequence_builder = getattr(unwrapped, "sequence_observation_builder", None)
          if dataset is None or sequence_builder is None:
              raise ValueError(
                  "sequence training requires dataset-bound reconstruction metadata"
              )
          sequence_reconstructor = SequenceRolloutReconstructor(
              dataset=dataset,
              builder=sequence_builder,
              normalizer=getattr(unwrapped, "sequence_normalizer", None),
              expected_dataset_id=dataset.dataset_id,
              expected_layout_digest=sequence_builder.layout_digest(dataset),
              policy_plane=getattr(unwrapped, "sequence_policy_plane", None),
          )
          '''.replace("          ", "")
          new_sequence = '''    universal_sequence = _is_universal_single_instrument(unwrapped)
          sequence_reconstructor: SequenceRolloutReconstructor | None = None
          if universal_sequence:
              raw_symbols = getattr(unwrapped, "policy_symbols", None)
              if raw_symbols != ("INSTRUMENT",):
                  raise ValueError(
                      "Universal sequence training requires the generic INSTRUMENT slot"
                  )
              if (
                  int(sequence_metadata["n_symbols"]) != 1
                  or _action_size(identity) != 1
                  or action_names != ("target_weight:INSTRUMENT",)
              ):
                  raise ValueError(
                      "Universal sequence training requires one generic target-weight action"
                  )
          else:
              dataset = getattr(unwrapped, "dataset", None)
              raw_symbols = getattr(dataset, "symbols", None)
              if (
                  not isinstance(raw_symbols, (tuple, list))
                  or not raw_symbols
                  or any(not isinstance(item, str) or not item for item in raw_symbols)
              ):
                  raise ValueError("sequence training requires ordered dataset symbols")
              symbols = tuple(raw_symbols)
              expected_action_names = tuple(
                  f"target_weight:{symbol}" for symbol in symbols
              )
              if (
                  _action_size(identity) != int(sequence_metadata["n_symbols"])
                  or action_names != expected_action_names
              ):
                  raise ValueError(
                      "hierarchical sequence training requires target_weight actions in exact "
                      "dataset symbol order"
                  )
              sequence_builder = getattr(unwrapped, "sequence_observation_builder", None)
              if dataset is None or sequence_builder is None:
                  raise ValueError(
                      "sequence training requires dataset-bound reconstruction metadata"
                  )
              sequence_reconstructor = SequenceRolloutReconstructor(
                  dataset=dataset,
                  builder=sequence_builder,
                  normalizer=getattr(unwrapped, "sequence_normalizer", None),
                  expected_dataset_id=dataset.dataset_id,
                  expected_layout_digest=sequence_builder.layout_digest(dataset),
                  policy_plane=getattr(unwrapped, "sequence_policy_plane", None),
              )
          uses_shared_asset_actor = True
          '''.replace("          ", "")
          if "universal_sequence = _is_universal_single_instrument" not in text:
              if old_sequence not in text:
                  raise SystemExit("sequence assembly anchor not found")
              text = text.replace(old_sequence, new_sequence, 1)

          old_resolve = '''        sequence_unwrapped: Any = getattr(probe, "unwrapped", probe)
              dataset = getattr(sequence_unwrapped, "dataset", None)
              raw_symbols = getattr(dataset, "symbols", None)
              if (
                  not isinstance(raw_symbols, (tuple, list))
                  or not raw_symbols
                  or any(not isinstance(item, str) or not item for item in raw_symbols)
              ):
                  raise ValueError("sequence training requires ordered dataset symbols")
              sequence_symbols = tuple(raw_symbols)
              sequence_action_names = _action_names(identity)
              rollout_buffer_class = IndexBackedDictRolloutBuffer
              rollout_buffer_kwargs = {
                  "sequence_reconstructor": sequence_reconstructor,
                  "sequence_transfer_mode": config.sequence_transfer_mode,
              }
          '''.replace("          ", "")
          new_resolve = '''        sequence_unwrapped: Any = getattr(probe, "unwrapped", probe)
              sequence_action_names = _action_names(identity)
              if _is_universal_single_instrument(sequence_unwrapped):
                  raw_symbols = getattr(sequence_unwrapped, "policy_symbols", None)
                  if raw_symbols != ("INSTRUMENT",):
                      raise ValueError(
                          "Universal sequence training requires generic policy symbols"
                      )
                  sequence_symbols = tuple(raw_symbols)
                  rollout_buffer_class = None
                  rollout_buffer_kwargs = None
              else:
                  dataset = getattr(sequence_unwrapped, "dataset", None)
                  raw_symbols = getattr(dataset, "symbols", None)
                  if (
                      not isinstance(raw_symbols, (tuple, list))
                      or not raw_symbols
                      or any(not isinstance(item, str) or not item for item in raw_symbols)
                  ):
                      raise ValueError("sequence training requires ordered dataset symbols")
                  sequence_symbols = tuple(raw_symbols)
                  rollout_buffer_class = IndexBackedDictRolloutBuffer
                  rollout_buffer_kwargs = {
                      "sequence_reconstructor": sequence_reconstructor,
                      "sequence_transfer_mode": config.sequence_transfer_mode,
                  }
          '''.replace("          ", "")
          if "if _is_universal_single_instrument(sequence_unwrapped):" not in text:
              if old_resolve not in text:
                  raise SystemExit("sequence resolve anchor not found")
              text = text.replace(old_resolve, new_resolve, 1)
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Verify Universal runtime contracts
        run: |
          uv run ruff check --fix trade_rl/rl/universal_instrument_context.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/policies.py trade_rl/integrations/sb3_model_assembly.py tests/rl/test_universal_training_environment.py tests/integrations/test_universal_sb3_model_assembly.py
          uv run ruff format trade_rl/rl/universal_instrument_context.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/policies.py trade_rl/integrations/sb3_model_assembly.py tests/rl/test_universal_training_environment.py tests/integrations/test_universal_sb3_model_assembly.py
          uv run ruff check trade_rl/rl/universal_instrument_context.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/policies.py trade_rl/integrations/sb3_model_assembly.py tests/rl/test_universal_training_environment.py tests/integrations/test_universal_sb3_model_assembly.py
          uv run mypy trade_rl/rl/universal_instrument_context.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/policies.py trade_rl/integrations/sb3_model_assembly.py
          uv run pytest tests/rl/test_universal_training_environment.py tests/integrations/test_universal_sb3_model_assembly.py tests/rl/test_universal_single_instrument_env.py tests/rl/test_universal_instrument_binding.py tests/rl/test_universal_episode_router.py tests/integrations/test_sb3_model_assembly.py -q
          git diff --check
      - name: Commit Universal runtime implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/universal_instrument_context.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/policies.py trade_rl/integrations/sb3_model_assembly.py tests/rl/test_universal_training_environment.py tests/integrations/test_universal_sb3_model_assembly.py
          if ! git diff --cached --quiet; then git commit -m "feat: complete Universal routed SB3 observation path"; fi
          git pull --rebase origin integration/universal-research-u3-u6
          git push origin HEAD:integration/universal-research-u3-u6
