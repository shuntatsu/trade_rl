name: Universal Task 6 Fix

on:
  push:
    branches:
      - integration/universal-research-u3-u6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
          persist-credentials: true

      - name: Apply reviewed Task 6 fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import shutil

          runtime_factory = Path("trade_rl/runtime_factory.py")
          if runtime_factory.exists():
              raise SystemExit("trade_rl/runtime_factory.py already exists unexpectedly")
          runtime_factory.write_text(
              '''"""Dynamic runtime-factory loading at the package boundary."""\n\n'
              'from __future__ import annotations\n\n'
              'import importlib\n'
              'from collections.abc import Callable\n'
              'from typing import Any\n\n'
              'RuntimeFactory = Callable[..., Any]\n\n\n'
              'def load_runtime_factory(spec: str) -> RuntimeFactory:\n'
              '    """Load one explicit ``module:function`` runtime factory."""\n\n'
              '    if not isinstance(spec, str) or spec.count(":") != 1:\n'
              '        raise ValueError("runtime factory must use module:function syntax")\n'
              '    module_name, function_name = (part.strip() for part in spec.split(":", 1))\n'
              '    if not module_name or not function_name:\n'
              '        raise ValueError("runtime factory must use module:function syntax")\n'
              '    module = importlib.import_module(module_name)\n'
              '    factory = getattr(module, function_name, None)\n'
              '    if not callable(factory):\n'
              '        raise TypeError("runtime factory target must be callable")\n'
              '    return factory\n'
              '''.replace("'''\n              '", "").replace("'\n              '", "").replace("\n'\n              '", "\n"),
              encoding="utf-8",
          )

          entrypoint = Path("trade_rl/workflows/universal_full_research_entrypoint.py")
          text = entrypoint.read_text(encoding="utf-8")
          if "import importlib\n" not in text:
              raise SystemExit("expected importlib import is missing")
          text = text.replace("import importlib\n", "", 1)
          if "from typing import Any\n" not in text:
              raise SystemExit("expected Any typing import is missing")
          text = text.replace("from typing import Any\n", "from typing import Any, cast\n", 1)
          anchor = "from trade_rl.rl.training import ResidualTrainingConfig\n"
          if anchor not in text:
              raise SystemExit("entrypoint import anchor missing")
          text = text.replace(
              anchor,
              "from trade_rl.runtime_factory import load_runtime_factory\n" + anchor,
              1,
          )
          start = text.index("def load_universal_runtime_factory(")
          end = text.index("\ndef _resolved_run_configs(", start)
          replacement = '''def load_universal_runtime_factory(spec: str) -> UniversalEntrypointRuntimeFactory:\n    """Load one explicit `module:function` Universal runtime factory."""\n\n    return cast(UniversalEntrypointRuntimeFactory, load_runtime_factory(spec))\n\n'''
          text = text[:start] + replacement + text[end + 1 :]
          entrypoint.write_text(text, encoding="utf-8")

          helper = Path("trade_rl/integrations/sb3_universal_pretraining.py")
          if helper.exists():
              raise SystemExit("sb3_universal_pretraining.py already exists unexpectedly")
          helper.write_text(
              '''"""Universal pretraining helpers for the SB3 training coordinator."""\n\n'
              'from __future__ import annotations\n\n'
              'from collections.abc import Callable, Mapping\n'
              'from pathlib import Path\n'
              'from typing import Any\n\n'
              'from trade_rl.artifacts.atomic_write import atomic_write_bytes\n'
              'from trade_rl.artifacts.codec import canonical_json_bytes\n'
              'from trade_rl.artifacts.hashing import content_digest\n'
              'from trade_rl.domain.common import require_sha256\n'
              'from trade_rl.integrations.universal_critic_warm_start import (\n'
              '    ConfiguredCriticWarmStart,\n'
              '    run_configured_critic_warm_start,\n'
              ')\n'
              'from trade_rl.learning import SupervisedPolicyDataset\n'
              'from trade_rl.learning.episode_behavior_cloning import BehaviorCloningSplit\n'
              'from trade_rl.learning.episode_oracle_teacher import EpisodeOracleBatch\n'
              'from trade_rl.rl.training import ResidualTrainingConfig\n\n\n'
              'def _apply_universal_pretraining_if_configured(\n'
              '    *,\n'
              '    hook: Callable[..., Mapping[str, object]] | None,\n'
              '    policy: Any,\n'
              '    config: ResidualTrainingConfig,\n'
              '    behavior_cloning_seed: int,\n'
              '    member_seed: int,\n'
              '    output_root: Path,\n'
              ') -> dict[str, object] | None:\n'
              '    if hook is None:\n'
              '        return None\n'
              '    if config.behavior_cloning_epochs <= 0:\n'
              '        raise ValueError(\n'
              '            "Universal pretraining requires behavior cloning to be enabled"\n'
              '        )\n'
              '    if config.behavior_cloning_teacher != "oracle":\n'
              '        raise ValueError(\n'
              '            "Universal pretraining requires the Oracle behavior cloning teacher"\n'
              '        )\n'
              '    if not callable(hook):\n'
              '        raise TypeError("Universal pretraining hook must be callable")\n'
              '    evidence = hook(\n'
              '        policy=policy,\n'
              '        config=config,\n'
              '        behavior_cloning_seed=behavior_cloning_seed,\n'
              '        member_seed=member_seed,\n'
              '        output_root=output_root,\n'
              '    )\n'
              '    if not isinstance(evidence, Mapping):\n'
              '        raise TypeError("Universal pretraining hook must return a mapping")\n'
              '    payload = dict(evidence)\n'
              '    if payload.get("schema_version") != "universal_pretraining_evidence_v1":\n'
              '        raise ValueError("Universal pretraining evidence schema mismatch")\n'
              '    if payload.get("passed") is not True:\n'
              '        raise RuntimeError("Universal pretraining failed its admission gates")\n'
              '    for field in ("teacher_artifact_digest", "behavior_cloning_digest"):\n'
              '        value = payload.get(field)\n'
              '        if not isinstance(value, str):\n'
              '            raise ValueError(f"Universal pretraining evidence is missing {field}")\n'
              '        require_sha256(value, field=field)\n'
              '    critic_digest = payload.get("critic_warm_start_digest")\n'
              '    if config.behavior_cloning_critic_warm_start_enabled:\n'
              '        if not isinstance(critic_digest, str):\n'
              '            raise ValueError(\n'
              '                "Universal pretraining evidence is missing critic_warm_start_digest"\n'
              '            )\n'
              '        require_sha256(critic_digest, field="critic_warm_start_digest")\n'
              '    elif critic_digest is not None:\n'
              '        if not isinstance(critic_digest, str):\n'
              '            raise ValueError(\n'
              '                "critic_warm_start_digest must be a SHA-256 string when present"\n'
              '            )\n'
              '        require_sha256(critic_digest, field="critic_warm_start_digest")\n'
              '    bound_payload: dict[str, object] = {\n'
              '        **payload,\n'
              '        "behavior_cloning_seed": behavior_cloning_seed,\n'
              '        "member_seed": member_seed,\n'
              '        "training_config_digest": content_digest(config.digest_payload()),\n'
              '    }\n'
              '    artifact_digest = content_digest(bound_payload)\n'
              '    resolved = {**bound_payload, "artifact_digest": artifact_digest}\n'
              '    output_root.mkdir(parents=True, exist_ok=True)\n'
              '    atomic_write_bytes(\n'
              '        output_root / "universal-pretraining.json",\n'
              '        canonical_json_bytes(resolved),\n'
              '    )\n'
              '    return resolved\n\n\n'
              'def _run_behavior_cloning_critic_warm_start_if_enabled(\n'
              '    *,\n'
              '    policy: Any,\n'
              '    teacher_environment: Any,\n'
              '    teacher_dataset: SupervisedPolicyDataset,\n'
              '    episode_batch: EpisodeOracleBatch | None,\n'
              '    episode_split: BehaviorCloningSplit | None,\n'
              '    config: ResidualTrainingConfig,\n'
              '    observation_provider: Any | None,\n'
              '    behavior_cloning_seed: int,\n'
              '    output_root: Path,\n'
              ') -> ConfiguredCriticWarmStart | None:\n'
              '    if not config.behavior_cloning_critic_warm_start_enabled:\n'
              '        return None\n'
              '    if episode_batch is None or episode_split is None:\n'
              '        raise RuntimeError(\n'
              '            "critic warm-start requires Oracle episode evidence and split"\n'
              '        )\n'
              '    return run_configured_critic_warm_start(\n'
              '        policy=policy,\n'
              '        teacher_environment=teacher_environment,\n'
              '        teacher_dataset=teacher_dataset,\n'
              '        episode_batch=episode_batch,\n'
              '        split=episode_split,\n'
              '        config=config,\n'
              '        observation_provider=observation_provider,\n'
              '        behavior_cloning_seed=behavior_cloning_seed,\n'
              '        output_root=output_root,\n'
              '    )\n'
              '''.replace("'''\n              '", "").replace("'\n              '", "").replace("\n'\n              '", "\n"),
              encoding="utf-8",
          )

          training = Path("trade_rl/integrations/sb3_training.py")
          text = training.read_text(encoding="utf-8")
          text = text.replace("from trade_rl.domain.common import require_sha256\n", "", 1)
          critic_import = '''from trade_rl.integrations.universal_critic_warm_start import (\n    ConfiguredCriticWarmStart,\n    run_configured_critic_warm_start,\n)\n'''
          if critic_import not in text:
              raise SystemExit("expected critic warm-start import block missing")
          text = text.replace(
              critic_import,
              '''from trade_rl.integrations.sb3_universal_pretraining import (\n    _apply_universal_pretraining_if_configured,\n    _run_behavior_cloning_critic_warm_start_if_enabled,\n)\n''',
              1,
          )
          start = text.index("def _apply_universal_pretraining_if_configured(")
          end = text.index("def _resolved_vector_environment_kind(", start)
          text = text[:start] + text[end:]
          training.write_text(text, encoding="utf-8")
          size = training.stat().st_size
          if size >= 61_440:
              raise SystemExit(f"sb3_training.py remains too large: {size}")

          temporary = Path(".github/temporary")
          if temporary.exists():
              shutil.rmtree(temporary)
          for path in Path(".github/workflows").glob("*temporary*.yml"):
              path.unlink()
          plan = Path("docs/superpowers/plans/2026-08-11-universal-research-u3-u6.md")
          if plan.exists():
              plan.unlink()
          for directory in (Path("docs/superpowers/plans"), Path("docs/superpowers")):
              if directory.exists() and not any(directory.iterdir()):
                  directory.rmdir()

          workflow = Path(".github/workflows/universal-task6-fix.yml")
          if not workflow.exists():
              raise SystemExit("self-deleting workflow is missing")
          workflow.unlink()
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          python -m compileall -q \
            trade_rl/runtime_factory.py \
            trade_rl/integrations/sb3_universal_pretraining.py \
            trade_rl/integrations/sb3_training.py \
            trade_rl/workflows/universal_full_research_entrypoint.py
          test "$(wc -c < trade_rl/integrations/sb3_training.py)" -lt 61440
          test ! -d .github/temporary
          test -z "$(find .github/workflows -name '*temporary*.yml' -print -quit)"
          test ! -d docs/superpowers
          git diff --check

      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: close Universal task 6 architecture findings"
          git push origin HEAD:integration/universal-research-u3-u6
