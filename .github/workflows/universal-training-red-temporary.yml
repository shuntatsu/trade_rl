name: Temporary Universal Training GREEN

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-red-temporary.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Bind Universal child identities to shared training contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/universal_single_instrument_env.py")
          text = path.read_text()
          text = text.replace(
              '    digest = getattr(value, "digest", None)\n',
              '    digest = getattr(value, "statistics_digest", None)\n'
              '    if digest is None:\n'
              '        digest = getattr(value, "digest", None)\n',
              1,
          )
          text = text.replace(
              '                "concrete_observation_contract_digest": concrete_observation_digest,\n',
              '                "concrete_observation_contract_digest": (\n'
              '                    concrete_observation_digest\n'
              '                    if training_contract_digest is None\n'
              '                    else None\n'
              '                ),\n',
              1,
          )
          text = text.replace(
              '            "observation_contract_digest": getattr(\n'
              '                environment,\n'
              '                "observation_contract_digest",\n'
              '                None,\n'
              '            ),\n',
              '            "observation_contract_digest": (\n'
              '                None\n'
              '                if self._training_identity_enabled\n'
              '                else getattr(environment, "observation_contract_digest", None)\n'
              '            ),\n',
              1,
          )
          anchor = '''    @property
          def sequence_normalizer(self) -> object | None:
              return getattr(self._reference_environment, "sequence_normalizer", None)
          '''.replace("          ", "")
          insertion = '''    @property
          def sequence_normalizer(self) -> object | None:
              return getattr(self._reference_environment, "sequence_normalizer", None)

              @property
          def normalizer_digest(self) -> str | None:
              flat = _optional_digest(getattr(self._reference_environment, "normalizer", None))
              sequence = _optional_digest(
                  getattr(self._reference_environment, "sequence_normalizer", None)
              )
              if flat is None:
                  return sequence
              if sequence is None:
                  return flat
              return content_digest(
                  {
                      "flat": flat,
                      "schema_version": "universal_policy_normalizer_bundle_v1",
                      "sequence": sequence,
                  }
              )
          '''.replace("          ", "")
          if "def normalizer_digest(self)" not in text:
              if anchor not in text:
                  raise SystemExit("normalizer property anchor not found")
              text = text.replace(anchor, insertion, 1)
          anchor = '''    @property
          def completed_episode_count(self) -> int:
              return self._completed_episode_count
          '''.replace("          ", "")
          insertion = '''    @property
          def completed_episode_count(self) -> int:
              return self._completed_episode_count

              @property
          def current_index(self) -> int:
              environment = self._active_environment
              if environment is None:
                  raise RuntimeError("environment must be reset before current_index access")
              value = getattr(environment, "current_index", None)
              return _require_non_negative_int(value, field="current_index")
          '''.replace("          ", "")
          if "def current_index(self)" not in text:
              if anchor not in text:
                  raise SystemExit("completed episode anchor not found")
              text = text.replace(anchor, insertion, 1)
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Prefer explicit Universal normalizer identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/rl/training_environment_contract.py")
          text = path.read_text()
          old = '''def _combined_normalizer_digest(unwrapped: Any) -> str | None:
              flat = getattr(getattr(unwrapped, "normalizer", None), "digest", None)
          '''.replace("              ", "    ")
          new = '''def _combined_normalizer_digest(unwrapped: Any) -> str | None:
              explicit = getattr(unwrapped, "normalizer_digest", None)
              if explicit is not None:
                  if not isinstance(explicit, str):
                      raise TypeError("explicit normalizer_digest must be a string")
                  require_sha256(explicit, field="normalizer_digest")
                  return explicit
              flat = getattr(getattr(unwrapped, "normalizer", None), "digest", None)
          '''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("combined normalizer anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Resolve Universal parallel sequence vector kind
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("trade_rl/integrations/sb3_training.py")
          text = path.read_text()
          if "def _resolved_vector_environment_kind(" not in text:
              anchor = "class StableBaselines3Backend(_StableBaselines3TeacherPipeline):\n"
              helper = '''def _resolved_vector_environment_kind(
              config: ResidualTrainingConfig,
              *,
              sequence_reconstructor: object | None,
          ) -> str:
              kind = _effective_vector_environment_kind(config)
              if kind == "subprocess_compact_sequence" and sequence_reconstructor is None:
                  return "subprocess"
              return kind


          '''.replace("          ", "")
              if anchor not in text:
                  raise SystemExit("SB3 backend anchor not found")
              text = text.replace(anchor, helper + anchor, 1)
          old = "            vector_environment_kind = _effective_vector_environment_kind(config)\n"
          new = (
              "            vector_environment_kind = _resolved_vector_environment_kind(\n"
              "                config, sequence_reconstructor=sequence_reconstructor\n"
              "            )\n"
          )
          if old not in text:
              raise SystemExit("vector environment kind anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          compile(text, str(path), "exec")
          PY
      - name: Verify Universal training contracts
        run: |
          uv run ruff format trade_rl/workflows/universal_training.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/training_environment_contract.py trade_rl/integrations/sb3_training.py tests/workflows/test_universal_training.py tests/rl/test_universal_training_contract_binding.py tests/integrations/test_universal_sb3_model_assembly.py
          uv run ruff check trade_rl/workflows/universal_training.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/training_environment_contract.py trade_rl/integrations/sb3_training.py tests/workflows/test_universal_training.py tests/rl/test_universal_training_contract_binding.py tests/integrations/test_universal_sb3_model_assembly.py
          uv run mypy trade_rl/workflows/universal_training.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/training_environment_contract.py
          uv run pytest tests/workflows/test_universal_training.py tests/rl/test_universal_training_contract_binding.py tests/integrations/test_universal_sb3_model_assembly.py tests/rl/test_universal_training_environment.py tests/integrations/test_sb3_universal_pretraining_hook.py -q
      - name: Commit verified Universal training contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_training.py trade_rl/rl/universal_single_instrument_env.py trade_rl/rl/training_environment_contract.py trade_rl/integrations/sb3_training.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: close Universal multi-dataset training contracts"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
