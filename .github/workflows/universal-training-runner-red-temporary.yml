name: Temporary Universal Training Runner RED

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runner-red-temporary.yml]

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - name: Format RED test
        run: |
          uv run ruff format tests/workflows/test_universal_training_runner.py
          uv run ruff check tests/workflows/test_universal_training_runner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/workflows/test_universal_training_runner.py
          if ! git diff --cached --quiet; then
            git commit -m "test: format Universal real-data runner contract"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
      - name: Run RED contract
        run: uv run pytest tests/workflows/test_universal_training_runner.py -q
