name: Temporary Universal Full Research Entrypoint GREEN Retry

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runtime-red-temporary.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run python .github/temporary/patch_universal_full_research_start.py
      - run: uv run python .github/temporary/fix_universal_full_research_entrypoint_types.py
      - run: |
          uv run ruff check --fix trade_rl/workflows/universal_full_research_entrypoint.py scripts/run_universal_full_research.py tests/workflows/test_universal_full_research_entrypoint.py tests/test_start_universal_full_training.py
          uv run ruff format trade_rl/workflows/universal_full_research_entrypoint.py scripts/run_universal_full_research.py tests/workflows/test_universal_full_research_entrypoint.py tests/test_start_universal_full_training.py
          uv run ruff check trade_rl/workflows/universal_full_research_entrypoint.py scripts/run_universal_full_research.py tests/workflows/test_universal_full_research_entrypoint.py tests/test_start_universal_full_training.py
          uv run mypy trade_rl/workflows/universal_full_research_entrypoint.py scripts/run_universal_full_research.py
          uv run pytest tests/workflows/test_universal_full_research_entrypoint.py tests/test_start_universal_full_training.py tests/workflows/test_universal_full_research_training.py tests/workflows/test_universal_full_research_runtime.py -q
          uv run python scripts/run_universal_full_research.py --help >/dev/null
      - name: Commit verified Universal full-research entrypoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/workflows/universal_full_research_entrypoint.py scripts/run_universal_full_research.py START.md tests/workflows/test_universal_full_research_entrypoint.py tests/test_start_universal_full_training.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: add executable Universal full-research entrypoint"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
