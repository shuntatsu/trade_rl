name: Temporary Compact Indexed Factory GREEN

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runtime-red-temporary.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run python .github/temporary/patch_compact_indexed_factory.py
      - run: |
          uv run ruff check --fix trade_rl/integrations/sb3_environment.py tests/integrations/test_sb3_compact_indexed_environment_factory.py
          uv run ruff format trade_rl/integrations/sb3_environment.py tests/integrations/test_sb3_compact_indexed_environment_factory.py
          uv run ruff check trade_rl/integrations/sb3_environment.py tests/integrations/test_sb3_compact_indexed_environment_factory.py
          uv run mypy trade_rl/integrations/sb3_environment.py
          uv run pytest tests/integrations/test_sb3_compact_indexed_environment_factory.py tests/integrations/test_sb3_indexed_environment_factory.py tests/integrations/test_parallel_sequence_environments.py tests/integrations/test_parallel_sequence_subprocess_smoke.py -q
      - name: Commit verified compact indexed environment factory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_environment.py tests/integrations/test_sb3_compact_indexed_environment_factory.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve worker indices in compact sequence environments"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
