name: Temporary Universal Bounded Cache GREEN

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runtime-red-temporary.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run python .github/temporary/patch_universal_bounded_cache.py
      - run: |
          uv run ruff check --fix trade_rl/rl/universal_single_instrument_env.py trade_rl/workflows/universal_training_runner.py tests/rl/test_universal_environment_cache.py
          uv run ruff format trade_rl/rl/universal_single_instrument_env.py trade_rl/workflows/universal_training_runner.py tests/rl/test_universal_environment_cache.py
          uv run ruff check trade_rl/rl/universal_single_instrument_env.py trade_rl/workflows/universal_training_runner.py tests/rl/test_universal_environment_cache.py
          uv run mypy trade_rl/rl/universal_single_instrument_env.py trade_rl/workflows/universal_training_runner.py
          uv run pytest tests/rl/test_universal_environment_cache.py tests/rl/test_universal_training_environment.py tests/workflows/test_universal_training_runtime.py -q
      - name: Commit verified bounded cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/rl/universal_single_instrument_env.py trade_rl/workflows/universal_training_runner.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: bound Universal child environment cache"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
