name: Temporary Universal Teacher Identity GREEN

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runtime-red-temporary.yml]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: |
          uv run ruff check --fix trade_rl/workflows/universal_teacher_runtime.py tests/workflows/test_universal_teacher_runtime.py
          uv run ruff format trade_rl/workflows/universal_teacher_runtime.py tests/workflows/test_universal_teacher_runtime.py
          uv run ruff check trade_rl/workflows/universal_teacher_runtime.py tests/workflows/test_universal_teacher_runtime.py
          uv run mypy trade_rl/workflows/universal_teacher_runtime.py
          uv run pytest tests/workflows/test_universal_teacher_runtime.py tests/workflows/test_universal_training.py -q
