name: Temporary Final SB3 Checkpoint GREEN

on:
  push:
    branches: [integration/universal-research-u3-u6]
    paths: [.github/workflows/universal-training-runtime-red-temporary.yml]

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/universal-research-u3-u6
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra train-sb3
      - run: uv run python .github/temporary/patch_sb3_final_checkpoint.py
      - run: |
          uv run ruff check --fix trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_final_checkpoint.py
          uv run ruff format trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_final_checkpoint.py
          uv run ruff check trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_final_checkpoint.py
          uv run mypy trade_rl/integrations/sb3_training.py
          uv run pytest tests/integrations/test_sb3_final_checkpoint.py tests/integrations/test_sb3_training.py tests/rl/test_checkpointing.py -q
      - name: Commit verified final SB3 checkpoint publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_rl/integrations/sb3_training.py tests/integrations/test_sb3_final_checkpoint.py
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish final SB3 training checkpoint"
            git push origin HEAD:integration/universal-research-u3-u6
          fi
