name: V3 Focused TDD

on:
  push:
    branches:
      - codex/causal-alpha-v3-runner

permissions:
  contents: read

concurrency:
  group: v3-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --extra train-sb3

      - name: V3 focused tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q \
            tests/learning/test_causal_alpha_v3.py \
            tests/learning/test_causal_alpha_v3_actionable_mask.py \
            tests/workflows/test_universal_causal_alpha_v3.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_config.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_signal.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_store.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_store_canonical.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_selection.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_failure_semantics.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_engine.py \
            tests/workflows/test_universal_causal_alpha_v3_runner_orchestration.py \
            tests/scripts/test_run_universal_causal_alpha_v3_research.py \
            tests/test_causal_alpha_v3_runner_example_contract.py \
            tests/test_causal_alpha_v3_documentation_contract.py \
            tests/test_causal_alpha_v3_canonical_config_contract.py \
            2>&1 | tee v3-focused-pytest.log

      - name: Upload V3 focused test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-focused-pytest
          path: v3-focused-pytest.log
          if-no-files-found: error

      - name: V3 lint
        run: >-
          uv run ruff check
          trade_rl/learning/causal_alpha_v3.py
          trade_rl/workflows/universal_causal_alpha_v3*.py
          scripts/run_universal_causal_alpha_v3_research.py
          tests/learning/test_causal_alpha_v3*.py
          tests/workflows/test_universal_causal_alpha_v3*.py
          tests/scripts/test_run_universal_causal_alpha_v3_research.py
          tests/test_causal_alpha_v3*.py

      - name: V3 format
        run: >-
          uv run ruff format --check
          trade_rl/learning/causal_alpha_v3.py
          trade_rl/workflows/universal_causal_alpha_v3*.py
          scripts/run_universal_causal_alpha_v3_research.py
          tests/learning/test_causal_alpha_v3*.py
          tests/workflows/test_universal_causal_alpha_v3*.py
          tests/scripts/test_run_universal_causal_alpha_v3_research.py
          tests/test_causal_alpha_v3*.py
