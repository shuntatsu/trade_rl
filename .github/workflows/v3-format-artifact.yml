name: V3 Format Artifact

on:
  push:
    branches:
      - codex/causal-alpha-v3-runner

permissions:
  contents: write

concurrency:
  group: v3-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format V3 Sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install formatter
        run: uv sync --extra dev

      - name: Apply maintained V3 documentation patch
        run: uv run python scripts/_v3_docs_patch.py

      - name: Format V3 sources
        run: >-
          uv run ruff format
          trade_rl/learning/causal_alpha_v3.py
          trade_rl/workflows/universal_causal_alpha_v3*.py
          scripts/analyze_causal_alpha_checkpoint.py
          scripts/run_universal_causal_alpha_v3_research.py
          tests/learning/test_causal_alpha_v3*.py
          tests/workflows/test_universal_causal_alpha_v3*.py
          tests/scripts/test_run_universal_causal_alpha_v3_research.py
          tests/test_causal_alpha_v3*.py

      - name: Commit V3 sources and docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            trade_rl/learning/causal_alpha_v3.py \
            trade_rl/workflows/universal_causal_alpha_v3*.py \
            scripts/analyze_causal_alpha_checkpoint.py \
            scripts/run_universal_causal_alpha_v3_research.py \
            tests/learning/test_causal_alpha_v3*.py \
            tests/workflows/test_universal_causal_alpha_v3*.py \
            tests/scripts/test_run_universal_causal_alpha_v3_research.py \
            tests/test_causal_alpha_v3*.py \
            docs/UNIVERSAL_TRAINING.md \
            docs/RESEARCH_STATUS.md
          git commit -m "docs: close causal alpha v3 research runner contract [v3-format]"
          git push origin HEAD:codex/causal-alpha-v3-runner
