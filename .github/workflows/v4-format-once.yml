name: V4 format once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

concurrency:
  group: v4-format-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install formatter
        run: uv sync --extra dev

      - name: Format V4 data files
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format \
            trade_rl/data/v4_context.py \
            trade_rl/data/v4_context_artifact.py \
            tests/data/test_v4_context.py \
            tests/data/test_v4_context_artifact.py
          if git diff --quiet -- trade_rl/data/v4_context.py trade_rl/data/v4_context_artifact.py tests/data/test_v4_context.py tests/data/test_v4_context_artifact.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_rl/data/v4_context.py trade_rl/data/v4_context_artifact.py tests/data/test_v4_context.py tests/data/test_v4_context_artifact.py
          git commit -m 'style: apply CI formatter to v4 data artifacts'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
