name: V4 format seven once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

concurrency:
  group: v4-format-seven-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Format reported V4 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/integrations/test_binance_v4_cache.py
            tests/integrations/test_binance_v4_cached_sources.py
            tests/integrations/test_binance_v4_context.py
            tests/integrations/test_binance_v4_context_assembly.py
            trade_rl/integrations/binance_v4_context.py
            trade_rl/integrations/binance_v4_context_capability.py
            trade_rl/workflows/universal_causal_alpha_v4_manifest.py
          )
          uv run ruff format "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'style: format v4 integration files'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
