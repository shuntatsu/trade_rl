name: V4 runtime patch once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Patch V4 runtime binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path_str: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'{path}: expected one match, got {count}: {old[:100]!r}'
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          patch(
              'trade_rl/workflows/universal_full_research_entrypoint.py',
              [
                  (
                      'from trade_rl.workflows.universal_full_research_training import (\n'
                      '    UniversalFullResearchTrainingComparison,\n'
                      '    train_universal_full_research_comparison,\n'
                      ')\n',
                      'from trade_rl.workflows.universal_causal_alpha_v4_manifest import (\n'
                      '    CausalAlphaV4ContextManifest,\n'
                      '    load_causal_alpha_v4_context_manifest,\n'
                      '    validate_causal_alpha_v4_context_manifest_against_base,\n'
                      ')\n'
                      'from trade_rl.workflows.universal_full_research_training import (\n'
                      '    UniversalFullResearchTrainingComparison,\n'
                      '    train_universal_full_research_comparison,\n'
                      ')\n',
                  ),
                  (
                      '    feature_schema_digest: str | None = None\n'
                      '    manifest: UniversalRuntimeManifest = field(init=False)\n'
                      '    normalizer_artifact_root: Path = field(init=False)\n',
                      '    feature_schema_digest: str | None = None\n'
                      '    v4_context_manifest_path: Path | None = None\n'
                      '    manifest: UniversalRuntimeManifest = field(init=False)\n'
                      '    normalizer_artifact_root: Path = field(init=False)\n'
                      '    v4_context_manifest: CausalAlphaV4ContextManifest | None = field(\n'
                      '        init=False, default=None\n'
                      '    )\n',
                  ),
                  (
                      '        manifest = load_universal_runtime_manifest(manifest_path)\n'
                      '        base = manifest_path.parent\n',
                      '        manifest = load_universal_runtime_manifest(manifest_path)\n'
                      '        v4_manifest_path = (\n'
                      '            None\n'
                      '            if self.v4_context_manifest_path is None\n'
                      '            else Path(self.v4_context_manifest_path)\n'
                      '        )\n'
                      '        v4_manifest: CausalAlphaV4ContextManifest | None = None\n'
                      '        if v4_manifest_path is not None:\n'
                      '            v4_manifest = load_causal_alpha_v4_context_manifest(\n'
                      '                v4_manifest_path\n'
                      '            )\n'
                      '            validate_causal_alpha_v4_context_manifest_against_base(\n'
                      '                v4_manifest, manifest\n'
                      '            )\n'
                      '        base = manifest_path.parent\n',
                  ),
                  (
                      '        object.__setattr__(self, "normalizer_artifact_root", normalizer_root)\n'
                      '        object.__setattr__(self, "fold_train_range", manifest.fold_train_range)\n',
                      '        object.__setattr__(self, "normalizer_artifact_root", normalizer_root)\n'
                      '        object.__setattr__(self, "v4_context_manifest_path", v4_manifest_path)\n'
                      '        object.__setattr__(self, "v4_context_manifest", v4_manifest)\n'
                      '        object.__setattr__(self, "fold_train_range", manifest.fold_train_range)\n',
                  ),
              ],
          )

          patch(
              'trade_rl/workflows/universal_training_runner.py',
              [
                  (
                      'from trade_rl.rl.universal_single_instrument_env import EpisodeRoutedSingleInstrumentEnv\n',
                      'from trade_rl.rl.universal_single_instrument_env import EpisodeRoutedSingleInstrumentEnv\n'
                      'from trade_rl.rl.universal_v4_context import V4ContextProvider\n',
                  ),
                  (
                      '    training_contract_digest: str\n'
                      '    run_seed: int\n'
                      '    max_cached_environments: int | None = 1\n',
                      '    training_contract_digest: str\n'
                      '    run_seed: int\n'
                      '    v4_context_provider: V4ContextProvider | None = None\n'
                      '    v4_context_manifest_digest: str | None = None\n'
                      '    max_cached_environments: int | None = 1\n',
                  ),
                  (
                      '        if not callable(self.concrete_environment_factory):\n'
                      '            raise TypeError("concrete_environment_factory must be callable")\n'
                      '        if (\n',
                      '        if not callable(self.concrete_environment_factory):\n'
                      '            raise TypeError("concrete_environment_factory must be callable")\n'
                      '        provider = self.v4_context_provider\n'
                      '        manifest_digest = self.v4_context_manifest_digest\n'
                      '        if provider is not None and not isinstance(provider, V4ContextProvider):\n'
                      '            raise TypeError("v4_context_provider must be a V4ContextProvider")\n'
                      '        if (provider is None) != (manifest_digest is None):\n'
                      '            raise ValueError(\n'
                      '                "V4 context provider and manifest digest must be supplied together"\n'
                      '            )\n'
                      '        if manifest_digest is not None:\n'
                      '            require_sha256(\n'
                      '                manifest_digest, field="Universal V4 context manifest digest"\n'
                      '            )\n'
                      '        if (\n',
                  ),
                  (
                      '                "schema_version": "universal_routed_environment_factory_v1",\n'
                      '                "training_contract_digest": self.training_contract_digest,\n'
                      '                "train_symbols": self.train_symbols,\n',
                      '                "schema_version": "universal_routed_environment_factory_v1",\n'
                      '                "training_contract_digest": self.training_contract_digest,\n'
                      '                "train_symbols": self.train_symbols,\n'
                      '                "v4_context_manifest_digest": (\n'
                      '                    self.v4_context_manifest_digest\n'
                      '                ),\n'
                      '                "v4_context_provider_digest": (\n'
                      '                    None\n'
                      '                    if self.v4_context_provider is None\n'
                      '                    else self.v4_context_provider.digest\n'
                      '                ),\n',
                  ),
                  (
                      '            instrument_context_provider=self.instrument_context_provider,\n'
                      '            training_contract_digest=self.training_contract_digest,\n',
                      '            instrument_context_provider=self.instrument_context_provider,\n'
                      '            v4_context_provider=self.v4_context_provider,\n'
                      '            training_contract_digest=self.training_contract_digest,\n',
                  ),
              ],
          )

          patch(
              'trade_rl/workflows/binance_universal_runtime.py',
              [
                  (
                      'from trade_rl.data import load_market_dataset_artifact\n',
                      'from trade_rl.data import load_market_dataset_artifact\n'
                      'from trade_rl.data.v4_context_artifact import (\n'
                      '    load_v4_target_context_artifact,\n'
                      ')\n',
                  ),
                  (
                      'from trade_rl.rl.universal_instrument_context import CausalInstrumentContextProvider\n',
                      'from trade_rl.rl.universal_instrument_context import CausalInstrumentContextProvider\n'
                      'from trade_rl.rl.universal_v4_context import V4ContextProvider\n',
                  ),
                  (
                      '\n\ndef build_runtime(\n',
                      '\n\ndef _load_v4_context_provider(\n'
                      '    context: UniversalRuntimeFactoryContext,\n'
                      ') -> tuple[V4ContextProvider | None, str | None]:\n'
                      '    manifest = context.v4_context_manifest\n'
                      '    if manifest is None:\n'
                      '        return None, None\n'
                      '    manifest_path = context.v4_context_manifest_path\n'
                      '    if manifest_path is None:\n'
                      '        raise RuntimeError("V4 context manifest path was not retained")\n'
                      '    root = Path(manifest_path).parent / manifest.context_artifact_relpath\n'
                      '    contexts = {}\n'
                      '    for symbol, expected_digest in manifest.context_digests:\n'
                      '        loaded = load_v4_target_context_artifact(root / symbol)\n'
                      '        if loaded.symbol != symbol or loaded.digest != expected_digest:\n'
                      '            raise ValueError(f"V4 context artifact identity mismatch for {symbol}")\n'
                      '        contexts[symbol] = loaded\n'
                      '    provider = V4ContextProvider(contexts=contexts)\n'
                      '    if provider.profile_name != manifest.profile_name:\n'
                      '        raise ValueError("V4 context provider profile does not match manifest")\n'
                      '    return provider, manifest.manifest_digest\n'
                      '\n\ndef build_runtime(\n',
                  ),
                  (
                      '    provider = CausalInstrumentContextProvider(contracts=contracts)\n'
                      '    normalizers = {\n',
                      '    provider = CausalInstrumentContextProvider(contracts=contracts)\n'
                      '    v4_provider, v4_manifest_digest = _load_v4_context_provider(context)\n'
                      '    normalizers = {\n',
                  ),
                  (
                      '        instrument_context_provider=provider,\n'
                      '        training_contract_digest=content_digest({"phase": "runtime-rebind"}),\n'
                      '        run_seed=min(run_config.training.seeds),\n',
                      '        instrument_context_provider=provider,\n'
                      '        training_contract_digest=content_digest({"phase": "runtime-rebind"}),\n'
                      '        run_seed=min(run_config.training.seeds),\n'
                      '        v4_context_provider=v4_provider,\n'
                      '        v4_context_manifest_digest=v4_manifest_digest,\n',
                  ),
              ],
          )
          PY
          uv run ruff check --fix \
            trade_rl/workflows/universal_full_research_entrypoint.py \
            trade_rl/workflows/universal_training_runner.py \
            trade_rl/workflows/binance_universal_runtime.py
          uv run ruff format \
            trade_rl/workflows/universal_full_research_entrypoint.py \
            trade_rl/workflows/universal_training_runner.py \
            trade_rl/workflows/binance_universal_runtime.py \
            tests/workflows/test_binance_universal_runtime.py \
            tests/rl/test_universal_v4_context.py
          git diff --check
      - name: Verify targeted V4 runtime tests
        run: |
          uv run pytest -q \
            tests/rl/test_universal_v4_context.py \
            tests/workflows/test_binance_universal_runtime.py
      - name: Verify V4 runtime typing
        run: |
          uv run mypy \
            trade_rl/rl/universal_v4_context.py \
            trade_rl/rl/universal_single_instrument_env.py \
            trade_rl/workflows/universal_full_research_entrypoint.py \
            trade_rl/workflows/universal_training_runner.py \
            trade_rl/workflows/binance_universal_runtime.py
      - name: Verify import architecture
        run: uv run lint-imports
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trade_rl/workflows/universal_full_research_entrypoint.py \
            trade_rl/workflows/universal_training_runner.py \
            trade_rl/workflows/binance_universal_runtime.py \
            tests/workflows/test_binance_universal_runtime.py \
            tests/rl/test_universal_v4_context.py
          git commit -m 'feat: bind v4 context into universal runtime'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
