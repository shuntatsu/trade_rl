name: V4 sample surface tests once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Patch Task 6 sample-surface tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/workflows/test_universal_causal_alpha_v4_runtime.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from trade_rl.data.v4_context import V4ContextBlock, V4TargetContext\n'
          addition = (
              'from trade_rl.data.universal_features import (\n'
              '    UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES,\n'
              ')\n'
          )
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('runtime test import anchor drifted')
              text = text.replace(anchor, anchor + addition, 1)

          old = '''def _base_samples(*, symbol: str = "ETHUSDT") -> CausalAlphaSymbolSamples:\n    decisions = np.arange(10, 41, dtype=np.int64)\n    rows = len(decisions)\n    features = decisions.astype(np.float64)[:, None]\n    unavailable = np.full(rows, np.nan, dtype=np.float64)\n    missing_end = np.full(rows, -1, dtype=np.int64)\n    return CausalAlphaSymbolSamples(\n        symbol=symbol,\n        dataset_id=_digest("a" if symbol == "BTCUSDT" else "b"),\n        feature_names=("target_x",),\n        feature_schema_digest=_digest("c"),\n        context_digest=_digest("d"),\n        reference_equity_mode="initial_capital",\n        reference_equity=100_000.0,\n        decision_indices=decisions,\n        features=features,\n        feature_available=np.ones(features.shape, dtype=np.bool_),\n        labels_24h=unavailable.copy(),\n        label_end_indices_24h=missing_end.copy(),\n        labels_72h=unavailable.copy(),\n        label_end_indices_72h=missing_end.copy(),\n    )\n'''
          new = '''def _base_samples(*, symbol: str = "ETHUSDT") -> CausalAlphaSymbolSamples:\n    decisions = np.arange(10, 41, dtype=np.int64)\n    rows = len(decisions)\n    market = decisions.astype(np.float64)[:, None]\n    descriptors = np.column_stack(\n        tuple(\n            decisions.astype(np.float64) + float(index + 1)\n            for index in range(len(UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES))\n        )\n    )\n    features = np.column_stack((market, descriptors))\n    unavailable = np.full(rows, np.nan, dtype=np.float64)\n    missing_end = np.full(rows, -1, dtype=np.int64)\n    return CausalAlphaSymbolSamples(\n        symbol=symbol,\n        dataset_id=_digest("a" if symbol == "BTCUSDT" else "b"),\n        feature_names=("target_x", *UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES),\n        feature_schema_digest=_digest("c"),\n        context_digest=_digest("d"),\n        reference_equity_mode="initial_capital",\n        reference_equity=100_000.0,\n        decision_indices=decisions,\n        features=features,\n        feature_available=np.ones(features.shape, dtype=np.bool_),\n        labels_24h=unavailable.copy(),\n        label_end_indices_24h=missing_end.copy(),\n        labels_72h=unavailable.copy(),\n        label_end_indices_72h=missing_end.copy(),\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('runtime base sample helper drifted')
          text = text.replace(old, new, 1)

          anchor2 = '''def test_v4_sample_builder_uses_persisted_context_beta_exactly() -> None:\n    context = _context()\n    result = build_causal_alpha_v4_symbol_samples(\n        base_samples=_base_samples(),\n        context=context,\n        dataset=_Dataset(),\n        train_stop=50,\n        signal_delay_decisions=1,\n        decision_bars=1,\n    )\n    np.testing.assert_array_equal(result.beta, context.beta)\n    np.testing.assert_array_equal(result.beta_available, context.beta_available)\n    assert result.source_context_digest == context.digest\n\n\n'''
          extra = '''def test_v4_sample_builder_separates_market_features_and_descriptors_exactly() -> None:\n    base = _base_samples()\n    result = build_causal_alpha_v4_symbol_samples(\n        base_samples=base,\n        context=_context(),\n        dataset=_Dataset(),\n        train_stop=50,\n        signal_delay_decisions=1,\n        decision_bars=1,\n    )\n    assert result.target_local_feature_names == ("target_x",)\n    assert result.instrument_descriptor_names == UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES\n    np.testing.assert_array_equal(result.target_local_features, base.features[:, :1])\n    np.testing.assert_array_equal(result.instrument_descriptors, base.features[:, 1:])\n    np.testing.assert_array_equal(\n        np.column_stack((result.target_local_features, result.instrument_descriptors)),\n        base.features,\n    )\n    np.testing.assert_array_equal(\n        np.column_stack(\n            (result.target_local_available, result.instrument_descriptor_available)\n        ),\n        base.feature_available,\n    )\n\n\ndef test_v4_sample_builder_rejects_descriptor_suffix_drift() -> None:\n    base = _base_samples()\n    names = list(base.feature_names)\n    names[-1] = "wrong_descriptor"\n    drifted = replace(base, feature_names=tuple(names), digest="")\n    with pytest.raises(ValueError, match="descriptor"):\n        build_causal_alpha_v4_symbol_samples(\n            base_samples=drifted,\n            context=_context(),\n            dataset=_Dataset(),\n            train_stop=50,\n            signal_delay_decisions=1,\n            decision_bars=1,\n        )\n\n\n'''
          if extra not in text:
              if text.count(anchor2) != 1:
                  raise SystemExit('runtime sample beta test anchor drifted')
              text = text.replace(anchor2, anchor2 + extra, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/learning/test_causal_alpha_v4_beta.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from trade_rl.data.v4_context import V4ContextBlock\n'
          addition = (
              'from trade_rl.data.universal_features import (\n'
              '    UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES,\n'
              ')\n'
          )
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('learning test import anchor drifted')
              text = text.replace(anchor, anchor + addition, 1)
          old = '''        target_local_features=target,\n        target_local_available=np.ones(target.shape, dtype=np.bool_),\n        local_context=_block(decisions=decisions, source="1", offset=10.0),\n'''
          new = '''        target_local_features=target,\n        target_local_available=np.ones(target.shape, dtype=np.bool_),\n        instrument_descriptor_names=UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES,\n        instrument_descriptors=np.ones(\n            (len(decisions), len(UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES)),\n            dtype=np.float64,\n        ),\n        instrument_descriptor_available=np.ones(\n            (len(decisions), len(UNIVERSAL_INSTRUMENT_DESCRIPTOR_NAMES)),\n            dtype=np.bool_,\n        ),\n        local_context=_block(decisions=decisions, source="1", offset=10.0),\n'''
          if text.count(old) != 1:
              raise SystemExit('learning sample constructor anchor drifted')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/learning/test_causal_alpha_v4_beta.py \
            tests/workflows/test_universal_causal_alpha_v4_runtime.py
          git commit -m 'test: separate v4 market features and descriptors'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
