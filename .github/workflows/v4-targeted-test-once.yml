name: V4 targeted verification

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install formal CI dependencies
        run: uv sync --extra dev --extra export --extra train-sb3 --extra studio
      - name: Run focused V4 runner and context tests
        run: |
          uv run pytest -q \
            tests/workflows/test_universal_causal_alpha_v4_artifact_store.py \
            tests/workflows/test_universal_causal_alpha_v4_pipeline.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_runner.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_runner_context_scope.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_helpers.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_science.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_entry.py \
            tests/workflows/test_universal_causal_alpha_v4_stage_execution.py \
            tests/scripts/test_run_universal_causal_alpha_v4_research.py \
            tests/integrations/test_binance_v4_context.py \
            tests/rl/test_universal_v4_context.py \
            tests/rl/test_universal_single_instrument_env.py
          uv run python -m py_compile scripts/run_universal_causal_alpha_v4_research.py
      - name: Run full static and architecture checks
        run: |
          uv run ruff check --diff .
          uv run ruff format --check --diff .
          uv run mypy .
          uv run lint-imports
