name: V4 targeted test once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Run V4 Task 6 through 9 tests
        run: |
          uv run pytest -q \
            tests/learning/test_causal_alpha_v4_beta.py \
            tests/learning/test_causal_alpha_v4_forecast.py \
            tests/learning/test_causal_alpha_v4_uncertainty.py \
            tests/learning/test_causal_alpha_v4_target.py \
            tests/workflows/test_universal_causal_alpha_v4_runtime.py \
            tests/workflows/test_universal_causal_alpha_v4_fitting.py \
            tests/workflows/test_universal_causal_alpha_v4_liveness.py
      - name: Ruff
        run: |
          uv run ruff check \
            trade_rl/learning/causal_alpha_v4.py \
            trade_rl/workflows/universal_causal_alpha_v4_runtime.py \
            trade_rl/workflows/universal_causal_alpha_v4_fitting.py \
            trade_rl/workflows/universal_causal_alpha_v4_signal.py \
            tests/learning/test_causal_alpha_v4_beta.py \
            tests/learning/test_causal_alpha_v4_forecast.py \
            tests/learning/test_causal_alpha_v4_uncertainty.py \
            tests/learning/test_causal_alpha_v4_target.py \
            tests/workflows/test_universal_causal_alpha_v4_runtime.py \
            tests/workflows/test_universal_causal_alpha_v4_fitting.py \
            tests/workflows/test_universal_causal_alpha_v4_liveness.py
      - name: Format check
        run: |
          uv run ruff format --check \
            trade_rl/learning/causal_alpha_v4.py \
            trade_rl/workflows/universal_causal_alpha_v4_runtime.py \
            trade_rl/workflows/universal_causal_alpha_v4_fitting.py \
            trade_rl/workflows/universal_causal_alpha_v4_signal.py \
            tests/learning/test_causal_alpha_v4_beta.py \
            tests/learning/test_causal_alpha_v4_forecast.py \
            tests/learning/test_causal_alpha_v4_uncertainty.py \
            tests/learning/test_causal_alpha_v4_target.py \
            tests/workflows/test_universal_causal_alpha_v4_runtime.py \
            tests/workflows/test_universal_causal_alpha_v4_fitting.py \
            tests/workflows/test_universal_causal_alpha_v4_liveness.py
      - name: Mypy
        run: |
          uv run mypy \
            trade_rl/learning/causal_alpha_v4.py \
            trade_rl/workflows/universal_causal_alpha_v4_runtime.py \
            trade_rl/workflows/universal_causal_alpha_v4_fitting.py \
            trade_rl/workflows/universal_causal_alpha_v4_signal.py
      - name: Import architecture
        run: uv run lint-imports
