name: V4 format remaining files once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install formatter
        run: uv sync --extra dev
      - name: Format bounded remaining files
        run: |
          files=(
            tests/workflows/test_universal_causal_alpha_v4_artifact_store.py
            tests/workflows/test_universal_causal_alpha_v4_stage_execution.py
            tests/workflows/test_universal_causal_alpha_v4_stage_runner.py
            tests/workflows/test_universal_causal_alpha_v4_stage_science.py
            trade_rl/workflows/universal_causal_alpha_v4_liveness_inputs.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_entry.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_runner.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_science.py
          )
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          git diff --check
      - name: Commit formatter output
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          files=(
            tests/workflows/test_universal_causal_alpha_v4_artifact_store.py
            tests/workflows/test_universal_causal_alpha_v4_stage_execution.py
            tests/workflows/test_universal_causal_alpha_v4_stage_runner.py
            tests/workflows/test_universal_causal_alpha_v4_stage_science.py
            trade_rl/workflows/universal_causal_alpha_v4_liveness_inputs.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_entry.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_runner.py
            trade_rl/workflows/universal_causal_alpha_v4_stage_science.py
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo 'No formatter changes were required.'
            exit 0
          fi
          git commit -m 'style: format remaining causal alpha v4 files'
          git push origin "HEAD:${BRANCH_NAME}"
