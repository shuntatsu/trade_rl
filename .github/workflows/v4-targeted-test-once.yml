name: V4 targeted test once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: read

concurrency:
  group: v4-targeted-test-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Run V4 Binance source tests
        run: uv run pytest -q tests/integrations/test_binance_v4_context.py
