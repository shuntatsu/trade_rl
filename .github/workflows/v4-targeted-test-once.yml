name: Apply bounded V4 contract compatibility fix

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact compatibility correction
        run: python .github/scripts/apply_v4_digest_fix_once.py
      - name: Format corrected files
        run: |
          uvx --from ruff==0.15.21 ruff format \
            trade_rl/rl/universal_single_instrument_env.py \
            tests/rl/test_universal_v4_context.py \
            .github/scripts/apply_v4_digest_fix_once.py
          python -m compileall -q \
            trade_rl/rl/universal_single_instrument_env.py \
            tests/rl/test_universal_v4_context.py \
            .github/scripts/apply_v4_digest_fix_once.py
      - name: Commit exact correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            trade_rl/rl/universal_single_instrument_env.py \
            tests/rl/test_universal_v4_context.py \
            .github/scripts/apply_v4_digest_fix_once.py
          git diff --cached --check
          git commit -m 'fix: preserve non-v4 observation contract identity'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
