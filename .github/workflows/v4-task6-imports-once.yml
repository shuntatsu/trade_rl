name: V4 Task6 imports once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
      - name: Fix imports
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/learning/test_causal_alpha_v4_beta.py
            tests/workflows/test_universal_causal_alpha_v4_runtime.py
          )
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          git diff --check
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'style: sort v4 Task6 test imports'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
