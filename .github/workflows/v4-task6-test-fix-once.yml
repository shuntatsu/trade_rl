name: V4 Task6 test fix once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Correct Task 6 test oracles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/workflows/test_universal_causal_alpha_v4_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_v4_sample_builder_rejects_context_decision_drift() -> None:\n    context = _context()\n    decisions = context.local.decision_indices.copy()\n    decisions[0] += 1\n    drifted_local = V4ContextBlock(\n        feature_names=context.local.feature_names,\n        decision_indices=decisions,\n        values=context.local.values,\n        available=context.local.available,\n        staleness_hours=context.local.staleness_hours,\n        source_digest=_digest("4"),\n    )\n    drifted = replace(context, local=drifted_local, digest="")\n\n    with pytest.raises(ValueError, match="decision"):\n        build_causal_alpha_v4_symbol_samples(\n            base_samples=_base_samples(),\n            context=drifted,\n            dataset=_Dataset(),\n            train_stop=50,\n            signal_delay_decisions=1,\n            decision_bars=1,\n        )\n\n\ndef test_v4_btc_samples_require_persisted_beta_exactly_one() -> None:\n    context = _context(symbol="BTCUSDT")\n    beta = context.beta.copy()\n    beta[5] = 0.9\n    drifted = replace(context, beta=beta, digest="")\n    with pytest.raises(ValueError, match="BTCUSDT.*beta|beta.*one"):\n        build_causal_alpha_v4_symbol_samples(\n            base_samples=_base_samples(symbol="BTCUSDT"),\n            context=drifted,\n            dataset=_Dataset(),\n            train_stop=50,\n            signal_delay_decisions=1,\n            decision_bars=1,\n        )\n'''
          new = '''def test_v4_sample_builder_rejects_context_decision_drift() -> None:\n    context = _context()\n    decisions = context.local.decision_indices.copy() + 1\n    drifted_local = V4ContextBlock(\n        feature_names=context.local.feature_names,\n        decision_indices=decisions,\n        values=context.local.values,\n        available=context.local.available,\n        staleness_hours=context.local.staleness_hours,\n        source_digest=_digest("4"),\n    )\n    drifted_global = V4ContextBlock(\n        feature_names=context.global_market.feature_names,\n        decision_indices=decisions,\n        values=context.global_market.values,\n        available=context.global_market.available,\n        staleness_hours=context.global_market.staleness_hours,\n        source_digest=_digest("5"),\n    )\n    drifted = replace(\n        context, local=drifted_local, global_market=drifted_global, digest=""\n    )\n\n    with pytest.raises(ValueError, match="decision"):\n        build_causal_alpha_v4_symbol_samples(\n            base_samples=_base_samples(),\n            context=drifted,\n            dataset=_Dataset(),\n            train_stop=50,\n            signal_delay_decisions=1,\n            decision_bars=1,\n        )\n\n\ndef test_v4_btc_samples_preserve_persisted_unit_beta() -> None:\n    context = _context(symbol="BTCUSDT")\n    result = build_causal_alpha_v4_symbol_samples(\n        base_samples=_base_samples(symbol="BTCUSDT"),\n        context=context,\n        dataset=_Dataset(),\n        train_stop=50,\n        signal_delay_decisions=1,\n        decision_bars=1,\n    )\n    np.testing.assert_array_equal(result.beta, np.ones(len(result.beta)))\n    np.testing.assert_array_equal(result.beta, context.beta)\n'''
          if text.count(old) != 1:
              raise SystemExit('Task 6 test oracle block drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit corrected tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/workflows/test_universal_causal_alpha_v4_runtime.py
          git commit -m 'test: correct v4 task6 runtime oracles'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
