name: V4 U6 regression once

on:
  push:
    branches:
      - design/causal-alpha-v4-hierarchical-teacher

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'shuntatsu/trade_rl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: design/causal-alpha-v4-hierarchical-teacher
          persist-credentials: true
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --extra train-sb3
      - name: Add U6 V4 auxiliary-channel regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rl/test_universal_research_u3_u6.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from trade_rl.integrations.binance_universal import binance_universal_feature_specs\n'
          import_block = (
              'from trade_rl.data.v4_context import (\n'
              '    CROSS_MARKET_CORE_NAMES,\n'
              '    CROSS_MARKET_DERIVATIVE_NAMES,\n'
              '    GLOBAL_MARKET_CORE_NAMES,\n'
              '    GLOBAL_MARKET_DERIVATIVE_NAMES,\n'
              ')\n'
          )
          if import_block not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('unexpected binance universal import anchor')
              text = text.replace(import_anchor, import_block + import_anchor, 1)
          test_anchor = '''def test_universal_binance_contract_has_206_target_local_features() -> None:\n    features = binance_universal_feature_specs(\n        base_timeframe="15m",\n        feature_timeframes=("1h", "4h", "1d"),\n    )\n    assert len(features) == 206\n    assert not any("relative_return_to_btc" in feature.name for feature in features)\n    assert not any("rolling_beta_to_btc" in feature.name for feature in features)\n\n\n'''
          new_test = '''def test_v4_context_channels_are_auxiliary_to_206_market_features() -> None:\n    features = binance_universal_feature_specs(\n        base_timeframe="15m",\n        feature_timeframes=("1h", "4h", "1d"),\n    )\n    assert len(features) == 206\n    assert len(CROSS_MARKET_CORE_NAMES) == 24\n    assert len(GLOBAL_MARKET_CORE_NAMES) == 38\n    assert len((*CROSS_MARKET_CORE_NAMES, *CROSS_MARKET_DERIVATIVE_NAMES)) == 31\n    assert len((*GLOBAL_MARKET_CORE_NAMES, *GLOBAL_MARKET_DERIVATIVE_NAMES)) == 44\n    assert not {feature.name for feature in features}.intersection(CROSS_MARKET_CORE_NAMES)\n    assert not {feature.name for feature in features}.intersection(GLOBAL_MARKET_CORE_NAMES)\n\n\n'''
          if new_test not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('unexpected U6 feature test anchor')
              text = text.replace(test_anchor, test_anchor + new_test, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff check --fix tests/rl/test_universal_research_u3_u6.py
          uv run ruff format tests/rl/test_universal_research_u3_u6.py
      - name: Verify Task 5 targeted suite
        run: |
          uv run pytest -q \
            tests/rl/test_universal_v4_context.py \
            tests/rl/test_universal_research_u3_u6.py \
            tests/workflows/test_binance_universal_runtime.py
      - name: Verify Task 5 static gates
        run: |
          uv run mypy \
            trade_rl/rl/universal_v4_context.py \
            trade_rl/rl/universal_single_instrument_env.py \
            trade_rl/workflows/universal_full_research_entrypoint.py \
            trade_rl/workflows/universal_training_runner.py \
            trade_rl/workflows/binance_universal_runtime.py
          uv run lint-imports
      - name: Commit regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/rl/test_universal_research_u3_u6.py
          git commit -m 'test: keep v4 context auxiliary to universal features'
          git push origin HEAD:design/causal-alpha-v4-hierarchical-teacher
