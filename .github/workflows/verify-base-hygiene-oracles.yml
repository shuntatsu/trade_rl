name: Verify Base Hygiene Oracles

on:
  push:
    branches:
      - verify/base-hygiene-oracles

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --extra dev

      - name: Targeted oracle tests
        run: >-
          uv run pytest -q
          tests/architecture/test_causal_alpha_v5_boundaries.py
          tests/learning/test_causal_alpha_v10_closed_loop.py
          tests/learning/test_causal_alpha_v10_reduce_only.py

      - name: Changed-file Ruff
        run: >-
          uv run ruff check
          tests/architecture/test_causal_alpha_v5_boundaries.py
          tests/learning/test_causal_alpha_v10_closed_loop.py
          tests/learning/test_causal_alpha_v10_reduce_only.py

      - name: Changed-file format
        run: >-
          uv run ruff format --check
          tests/architecture/test_causal_alpha_v5_boundaries.py
          tests/learning/test_causal_alpha_v10_closed_loop.py
          tests/learning/test_causal_alpha_v10_reduce_only.py
