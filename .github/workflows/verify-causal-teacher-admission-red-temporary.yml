name: Verify causal teacher admission RED temporary

on:
  push:
    branches:
      - codex/fix-causal-alpha-v3-signal-scope-contract

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Confirm intended RED failures
        shell: bash
        run: |
          set -uo pipefail
          set +e
          uv run pytest -q \
            tests/learning/test_causal_alpha_teacher_admission.py \
            tests/integrations/test_universal_causal_teacher_admission_reuse.py \
            tests/workflows/test_universal_causal_alpha_v3_common_admission.py \
            > causal-teacher-admission-red.log 2>&1
          status=$?
          set -e
          cat causal-teacher-admission-red.log
          test "$status" -ne 0
          grep -q "test_teacher_admission_rejects_gross_positive_after_cost_loss" causal-teacher-admission-red.log
          grep -q "test_teacher_admission_rejects_one_catastrophic_symbol_despite_positive_aggregate" causal-teacher-admission-red.log
          grep -q "test_teacher_admission_rejects_zero_total_trades" causal-teacher-admission-red.log
          grep -q "test_teacher_admission_accepts_exact_symbol_net_floor" causal-teacher-admission-red.log
          grep -q "test_teacher_admission_evidence_uses_hardened_schema" causal-teacher-admission-red.log
          grep -q "test_pretraining_bundle_rejects_legacy_teacher_admission_schema" causal-teacher-admission-red.log
          grep -q "test_v3_admission_inherits_common_zero_trade_rejection" causal-teacher-admission-red.log
          grep -q "test_v3_admission_inherits_common_symbol_net_floor" causal-teacher-admission-red.log
          grep -q "test_v3_admission_evidence_uses_hardened_schema" causal-teacher-admission-red.log
