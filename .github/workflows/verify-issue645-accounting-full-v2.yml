name: Verify Issue 645 full authority v2

on:
  push:
    branches:
      - verify/issue645-accounting-full-v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: 73049fe62318f2458a49eeb5dbcd64214d0805f2
  BASE_SHA: c80652a126780580990bf46bb206155ba469e043
  FIX_SHA: 95a4831bfbd5dfac2b77371b0c99d6894edc4d3a

jobs:
  core:
    name: Lean Core and isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove Issue 645 isolated correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          git diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > "$RUNNER_TEMP/actual"
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          guide/content/meta/code-map.json
          tests/architecture/test_lean_simulation_layout.py
          tests/simulation/test_lot_accounting.py
          tests/simulation/test_stateful_execution_characterization.py
          trade_rl/simulation/accounting.py
          trade_rl/simulation/execution.py
          trade_rl/simulation/liquidity.py
          trade_rl/simulation/orders/admission.py
          trade_rl/simulation/orders/model.py
          trade_rl/simulation/quantities.py
          trade_rl/simulation/stateful/symbol_fills.py
          EOF
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          for path in             trade_rl/simulation/accounting.py             trade_rl/simulation/execution.py             trade_rl/simulation/liquidity.py             trade_rl/simulation/orders/admission.py             trade_rl/simulation/orders/model.py             trade_rl/simulation/quantities.py             trade_rl/simulation/stateful/symbol_fills.py
          do
            test "$(git rev-parse "$TARGET_SHA:$path")" = "$(git rev-parse "$FIX_SHA:$path")"
          done
          test -z "$(git diff --name-only "$BASE_SHA" "$TARGET_SHA" -- trade_rl/strategies trade_rl/evaluation trade_rl/data trade_rl/risk)"
          test -z "$(git status --porcelain)"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
          enable-cache: true

      - name: Install
        run: uv sync --extra dev
      - name: Ruff and format
        run: |
          uv run ruff check trade_rl tests tools
          uv run ruff format --check trade_rl tests tools
      - name: Type checks
        run: |
          uv run mypy trade_rl
          uv run mypy tools/agent_repo tests/architecture/distribution.py
      - name: Focused Issue 645 correction tests
        run: |
          uv run pytest -q             tests/simulation/test_lot_accounting.py             tests/simulation/test_stateful_execution_characterization.py             tests/simulation/test_execution_v2.py             tests/simulation/test_stateful_execution_adapter.py
      - name: Full Core tests
        run: uv run pytest -q tests
      - name: Build and distribution source closure
        shell: bash
        run: |
          set -euo pipefail
          uv build
          uv run python -m tests.architecture.distribution dist/*.tar.gz dist/*.whl
          rebuilt="$(mktemp -d)"
          trap 'rm -rf "$rebuilt"' EXIT
          uv build --wheel dist/*.tar.gz --out-dir "$rebuilt"
          uv run python -m tests.architecture.distribution "$rebuilt"/*.whl
      - name: Clean installed core smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(realpath dist/*.whl)"
          expected="$(uv run python -c 'from importlib.metadata import version; print(version("trade-rl"))')"
          clean="$(mktemp -d)"
          trap 'rm -rf "$clean"' EXIT
          uv venv "$clean/venv" --python 3.12
          uv pip install --python "$clean/venv/bin/python" "$wheel"
          cd "$clean"
          "$clean/venv/bin/python" -I - "$expected" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import trade_rl
          import trade_rl.data
          import trade_rl.evaluation
          import trade_rl.risk
          import trade_rl.simulation
          import trade_rl.strategies
          assert trade_rl.__version__ == version("trade-rl") == sys.argv[1]
          assert Path(trade_rl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          print("clean installed core public imports and identity: OK")
          PY
      - name: Final exact clean head
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"

  guide:
    name: Human Guide
    runs-on: ubuntu-latest
    env:
      GUIDE_SOURCE_REV: 73049fe62318f2458a49eeb5dbcd64214d0805f2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 73049fe62318f2458a49eeb5dbcd64214d0805f2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: guide/package-lock.json
      - name: Install Guide dependencies
        working-directory: guide
        run: npm ci
      - name: Guide checks
        working-directory: guide
        run: |
          npm run source-check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Install Chromium
        working-directory: guide
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        working-directory: guide
        run: npm run e2e
