name: Verify Issue 645 preauthorization slots v1
on:
  push:
    branches:
      - verify/issue645-preauthorization-v1
permissions:
  actions: read
  contents: read
jobs:
  slots:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3116bdc533b5c1b84edcc68cd300fa37fd9e5639
          persist-credentials: false
      - name: Verify prior authorities
        shell: bash
        run: |
          set -euo pipefail
          full="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/35286382568")"
          test "$(jq -r .status <<<"$full")" = completed
          test "$(jq -r .conclusion <<<"$full")" = success
          test "$(jq -r .head_sha <<<"$full")" = 31029ddf466fd716d39c42c3224260cc5782a5fa
          harness_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/35286629388")"
          test "$(jq -r .status <<<"$harness_run")" = completed
          test "$(jq -r .conclusion <<<"$harness_run")" = success
          test "$(jq -r .head_sha <<<"$harness_run")" = 10485cf1200f5475fa1421e00342f02971991dfa
      - name: Prove all repository-global evidence slots empty
        shell: bash
        run: |
          set -euo pipefail
          names=(
            issue645-corrected-directional-activation-v1
            issue645-corrected-directional-protocol-v1
            issue645-corrected-directional-run-summary-v1
            issue645-corrected-directional-audit-v1
          )
          for arm in cash constant_long constant_short trend mean_reversion ridge24 lightgbm24 channel_breakout ppo0 ppo1 ppo2 ppo3 ppo4; do
            names+=("issue645-corrected-directional-arm-$arm-v1")
          done
          for name in "${names[@]}"; do
            listing="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100")"
            test "$(jq -r .total_count <<<"$listing")" = 0
          done
          echo ISSUE645_ALL_RESULT_SLOTS=EMPTY
      - name: Prove official ref absent
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/branches/run/issue645-corrected-directional-study-v1" >/dev/null 2>&1; then
            echo "official Issue 645 branch already exists" >&2
            exit 1
          fi
          echo ISSUE645_OFFICIAL_REF=ABSENT
          echo REAL_DATASET_LOADED=false
          echo MODEL_FIT_PERFORMED=false
          echo ECONOMIC_REPLAY_PERFORMED=false
          echo ECONOMIC_RESULT_INTERPRETED=false
