name: Verify PR700 default-risk GREEN
on:
  push:
    branches:
      - verify/pr700-default-risk-green
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 62dc0df31abd5e2af34d05d903b8f272766e3f3f
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: |
          uv run pytest -q             tests/risk/test_pretrade.py             tests/architecture/test_experiment_semantic_authorities.py
