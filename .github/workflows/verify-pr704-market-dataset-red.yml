name: Verify PR704 MarketDataset RED
on:
  push:
    branches:
      - verify/pr704-market-dataset-red
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbbde2b3c8fe17cbcb1600a710f5c4426d085c88
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Require intended RED only
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/data/test_dataset_content_identity.py > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -Fq "test_content_identified_dataset_arrays_cannot_be_reenabled_for_write" "$RUNNER_TEMP/red.log"
          grep -Eq "1 failed, [0-9]+ passed" "$RUNNER_TEMP/red.log"
