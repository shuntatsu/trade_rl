name: Verify PR704 MarketDataset GREEN v2
on:
  push:
    branches:
      - verify/pr704-market-green-v2
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c5f4626a8c661cf620d29fb6533bf4a4cb74310b
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: |
          uv run pytest -q             tests/data/test_dataset_content_identity.py             tests/data/test_market_dataset_artifact.py             tests/data/test_market_dataset_v2.py             tests/data/test_market_eligibility_cache.py
