name: Verify PR726 inference-space RED
on:
  push:
    branches:
      - verify/pr726-inference-space-red
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c65de680e4c06a64b39375831313461cefe84d67
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - name: Require intended RED
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/strategies/test_ppo_model_artifact.py -k inference_bundle_rejects_incompatible_policy_spaces_before_creation > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -Fq "test_inference_bundle_rejects_incompatible_policy_spaces_before_creation" "$RUNNER_TEMP/red.log"
          grep -Eq "3 failed" "$RUNNER_TEMP/red.log"
