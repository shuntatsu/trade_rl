name: Verify PR748 review evidence GREEN
on:
  push:
    branches:
      - verify/pr748-review-evidence-green
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: be403436d70167375b047a6f8fe59086100e19d2
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.10.0'
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: |
          uv run pytest -q             tests/tools/test_ppo_checkpoint_actions.py             tests/architecture/test_ppo_checkpoint_workflow.py
