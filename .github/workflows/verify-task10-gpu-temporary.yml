name: Verify Task 10 Oracle GPU benchmark

on:
  pull_request:
    paths:
      - .github/workflows/verify-task10-gpu-temporary.yml

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  EVIDENCE_ROOT: var/benchmarks/oracle-bellman-task10

jobs:
  benchmark:
    if: github.actor == github.repository_owner
    environment: gpu-full-training
    runs-on: [self-hosted, linux, x64, gpu, nvidia]
    timeout-minutes: 360
    steps:
      - name: Checkout exact benchmark head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Capture immutable source and GPU identity
        shell: bash
        run: |
          set -euo pipefail
          tested_commit="$(git rev-parse HEAD)"
          test "$tested_commit" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p "$EVIDENCE_ROOT/results"
          nvidia-smi | tee "$EVIDENCE_ROOT/nvidia-smi.txt"
          nvidia-smi \
            --query-gpu=name,driver_version,memory.total,compute_cap \
            --format=csv,noheader \
            | tee "$EVIDENCE_ROOT/gpu-device.csv"
          {
            printf 'TESTED_COMMIT=%s\n' "$tested_commit"
            printf 'GPU_RUN_ID=%s\n' "${{ github.run_id }}"
          } >> "$GITHUB_ENV"
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install exact dependencies
        run: uv sync --extra dev --extra train-sb3
      - name: Require maintained CUDA device
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' | tee "$EVIDENCE_ROOT/torch-device.txt"
          import torch

          assert torch.cuda.is_available(), "maintained runner must expose CUDA"
          print(f"torch={torch.__version__}")
          print(f"cuda={torch.version.cuda}")
          print(f"device={torch.cuda.get_device_name(0)}")
          print(f"capability={torch.cuda.get_device_capability(0)}")
          PY
      - name: Run CUDA correctness corpus first
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q -vv \
            tests/learning/test_oracle_bellman_torch.py \
            -k cuda_solver_matches_numpy_reference \
            | tee "$EVIDENCE_ROOT/cuda-parity.log"
          uv run pytest -q \
            tests/learning/test_oracle_teacher.py \
            tests/learning/test_episode_oracle_teacher.py \
            tests/learning/test_oracle_transition_numpy.py \
            tests/learning/test_oracle_bellman_numpy.py \
            tests/learning/test_oracle_bellman_torch.py \
            tests/learning/test_oracle_solver.py \
            tests/learning/test_episode_teacher_integration.py \
            tests/operations/test_oracle_teacher_benchmark.py \
            | tee "$EVIDENCE_ROOT/correctness-corpus.log"
      - name: Run matched CPU and CUDA benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for horizon in 128 2880; do
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend all \
              --episode-count 8 \
              --episode-bars "$horizon" \
              --repetitions 5 \
              --episode-batch-size 8 \
              --target-state-block-size 3 \
              --compile-chunk-size 16 \
              --output "$EVIDENCE_ROOT/results/matched-h${horizon}.json"
          done
      - name: Run eager CUDA and NumPy batch sweep
        shell: bash
        run: |
          set -euo pipefail
          for horizon in 128 2880; do
            for batch in 1 4 8 16 32; do
              for backend in numpy_batched torch_cuda_eager; do
                uv run python -m trade_rl.operations.oracle_teacher_benchmark \
                  --backend "$backend" \
                  --episode-count 32 \
                  --episode-bars "$horizon" \
                  --repetitions 3 \
                  --episode-batch-size "$batch" \
                  --target-state-block-size 3 \
                  --compile-chunk-size 16 \
                  --output "$EVIDENCE_ROOT/results/batch-h${horizon}-b${batch}-${backend}.json"
              done
            done
          done
      - name: Run compiled CUDA chunk sweep
        shell: bash
        run: |
          set -euo pipefail
          for chunk in 8 16 32 64; do
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend torch_cuda_compiled \
              --episode-count 32 \
              --episode-bars 128 \
              --repetitions 3 \
              --episode-batch-size 32 \
              --target-state-block-size 3 \
              --compile-chunk-size "$chunk" \
              --output "$EVIDENCE_ROOT/results/compiled-h128-c${chunk}.json"
            uv run python -m trade_rl.operations.oracle_teacher_benchmark \
              --backend torch_cuda_compiled \
              --episode-count 8 \
              --episode-bars 2880 \
              --repetitions 3 \
              --episode-batch-size 8 \
              --target-state-block-size 3 \
              --compile-chunk-size "$chunk" \
              --output "$EVIDENCE_ROOT/results/compiled-h2880-c${chunk}.json"
          done
      - name: Validate evidence and generate report
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          result_paths = sorted((root / "results").glob("*.json"))
          assert result_paths, "benchmark results are missing"
          records: list[dict[str, object]] = []
          for path in result_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              values = payload if isinstance(payload, list) else [payload]
              for value in values:
                  assert value["schema_version"] == "oracle_teacher_benchmark_v2"
                  assert len(value["output_digest"]) == 64
                  value["evidence_file"] = path.name
                  records.append(value)

          groups: dict[tuple[int, int, int, int], set[str]] = defaultdict(set)
          for value in records:
              case = value["case"]
              key = (
                  int(case["episode_count"]),
                  int(case["episode_bars"]),
                  int(case["state_count"]),
                  int(case["symbol_count"]),
              )
              groups[key].add(str(value["output_digest"]))
          mismatches = {key: values for key, values in groups.items() if len(values) != 1}
          assert not mismatches, f"cross-backend output digest mismatch: {mismatches}"

          device = (root / "gpu-device.csv").read_text(encoding="utf-8").strip()
          torch_device = (root / "torch-device.txt").read_text(encoding="utf-8").strip()
          tested_commit = os.environ["TESTED_COMMIT"]
          run_id = os.environ["GPU_RUN_ID"]

          def median(value: dict[str, object]) -> float:
              summary = value["steady_summary"]
              assert isinstance(summary, dict)
              return float(summary["median_seconds"])

          matched = [
              value for value in records if str(value["evidence_file"]).startswith("matched-")
          ]
          matched.sort(key=lambda value: (int(value["case"]["episode_bars"]), str(value["backend"])))
          by_horizon: dict[int, dict[str, dict[str, object]]] = defaultdict(dict)
          for value in matched:
              by_horizon[int(value["case"]["episode_bars"])][str(value["backend"])] = value

          decision_lines: list[str] = []
          for horizon, values in sorted(by_horizon.items()):
              numpy_value = values["numpy_batched"]
              eager_value = values["torch_cuda_eager"]
              ratio = median(numpy_value) / median(eager_value)
              decision_lines.append(
                  f"- {horizon} bars: eager CUDA / batched NumPy speed ratio = {ratio:.3f}x."
              )
          faster = all(
              median(values["torch_cuda_eager"]) < median(values["numpy_batched"])
              for values in by_horizon.values()
          )
          conclusion = (
              "Eager CUDA was faster than batched NumPy in both matched synthetic workloads. "
              "NumPy nevertheless remains the default because production-distribution evidence "
              "and final-head operational validation are still required."
              if faster
              else "A consistent CUDA speedup was not established across both matched workloads; "
              "NumPy remains the default."
          )

          lines = [
              "# Oracle Bellman Solver Benchmark",
              "",
              f"Tested commit: `{tested_commit}`  ",
              f"GitHub Actions run: `{run_id}`  ",
              f"GPU: `{device}`  ",
              "",
              "## Conclusion",
              "",
              conclusion,
              "",
              *decision_lines,
              "",
              "## Matched workload results",
              "",
              "| Horizon | Backend | Median steady wall (s) | Min–max (s) | Actual compile | Device allocated / reserved |",
              "|---:|---|---:|---:|---|---:|",
          ]
          for value in matched:
              summary = value["steady_summary"]
              metadata = value["metadata"]
              allocated = value["peak_device_allocated_bytes"]
              reserved = value["peak_device_reserved_bytes"]
              memory = "—" if allocated is None else f"{int(allocated):,} / {int(reserved):,}"
              lines.append(
                  "| {horizon} | {backend} | {median:.6f} | {minimum:.6f}–{maximum:.6f} | {compile_mode} | {memory} |".format(
                      horizon=value["case"]["episode_bars"],
                      backend=value["backend"],
                      median=float(summary["median_seconds"]),
                      minimum=float(summary["minimum_seconds"]),
                      maximum=float(summary["maximum_seconds"]),
                      compile_mode=metadata.get("actual_compile_mode"),
                      memory=memory,
                  )
              )

          lines.extend(
              [
                  "",
                  "## Matrix coverage",
                  "",
                  "- Matched backends: serial compatibility NumPy, batched NumPy, eager CUDA, compiled CUDA.",
                  "- Horizons: 128 and 2,880 decisions.",
                  "- Episode batch sizes: 1, 4, 8, 16, and 32 for batched NumPy and eager CUDA.",
                  "- Compile chunks: 8, 16, 32, and 64 for compiled CUDA.",
                  "- Every benchmark records one cold run plus repeated steady runs with CUDA synchronization before and after timing.",
                  "- All comparable workloads produced the same target/final-score payload digest.",
                  "",
                  "## Interpretation limits",
                  "",
                  "- `legacy_numpy` is a serial compatibility route through the maintained NumPy solver. The removed pre-refactor implementation is not retained and is not being represented as measured.",
                  "- These are deterministic synthetic-market workloads, not the complete production dataset distribution.",
                  "- Total wall time includes validation, market-tape construction, dispatch, transfers, solve, backtracking, host materialization, and result construction.",
                  "- Backend solver time excludes CUDA input/output transfers but includes synchronized solve, first-call compilation when used, and backtracking.",
                  "- Raw JSON, CUDA logs, and device evidence are retained as the workflow artifact rather than committed to the repository.",
                  "",
                  "## Device runtime",
                  "",
                  "```text",
                  torch_device,
                  "```",
                  "",
              ]
          )
          report = Path("docs/operations/oracle-bellman-solver-benchmark.md")
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text("\n".join(lines), encoding="utf-8")

          digest = hashlib.sha256()
          for path in result_paths:
              digest.update(path.name.encode())
              digest.update(path.read_bytes())
          (root / "evidence-sha256.txt").write_text(digest.hexdigest() + "\n", encoding="utf-8")
          PY
          test -s docs/operations/oracle-bellman-solver-benchmark.md
          git diff --check -- docs/operations/oracle-bellman-solver-benchmark.md
      - name: Upload immutable benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oracle-bellman-task10-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated report and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          rm .github/workflows/verify-task10-gpu-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/operations/oracle-bellman-solver-benchmark.md \
            .github/workflows/verify-task10-gpu-temporary.yml
          git diff --cached --check
          git commit -m "perf: publish Oracle Bellman GPU benchmark report"
          git push origin HEAD:agent/oracle-bellman-batched-solver
