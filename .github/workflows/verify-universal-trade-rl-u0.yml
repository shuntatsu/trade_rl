name: Verify Universal Trade RL U0

on:
  push:
    branches:
      - codex/universal-trade-rl-zero-shot-transfer-design

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install verification dependencies
        run: uv sync --extra dev --extra export --extra train-sb3

      - name: Verify documented U0 materialization example
        shell: bash
        run: |
          set -euo pipefail
          output="var/runs/universal-trade-rl-u0-example"
          rm -rf "$output"
          uv run trade-rl-universe \
            --config examples/binance/universal-trade-rl-universe.example.json \
            --source-catalog examples/binance/universal-trade-rl-source-catalog.example.json \
            --output-root "$output" \
            | tee example-materialization.json
          sha256sum "$output/universe.json" "$output/identity.json" > example-before.sha256
          uv run python - <<'PY'
          import json
          from pathlib import Path

          terminal = json.loads(Path("example-materialization.json").read_text(encoding="utf-8"))
          universe = json.loads(Path("var/runs/universal-trade-rl-u0-example/universe.json").read_text(encoding="utf-8"))
          identity = json.loads(Path("var/runs/universal-trade-rl-u0-example/identity.json").read_text(encoding="utf-8"))
          assert terminal["status"] == "materialized"
          assert terminal["production_status"] == "NO-GO"
          assert terminal["universe_manifest_digest"] == universe["artifact_digest"]
          assert terminal["identity_digest"] == identity["artifact_digest"]
          assert identity["universe_manifest_digest"] == universe["artifact_digest"]
          assert identity["stage"] == "universe_materialization"
          PY
          uv run trade-rl-universe \
            --config examples/binance/universal-trade-rl-universe.example.json \
            --source-catalog examples/binance/universal-trade-rl-source-catalog.example.json \
            --output-root "$output" \
            > example-materialization-rerun.json
          sha256sum -c example-before.sha256
          test -z "$(find var/runs -maxdepth 1 -name '.universal-trade-rl-u0-example.staging-*' -print -quit)"
          rm -rf "$output"

      - name: U0 boundary tests
        run: >-
          uv run pytest -q
          tests/domain/test_universal_trade_rl_universe.py
          tests/workflows/test_universal_trade_rl_universe_config.py
          tests/workflows/test_universal_trade_rl_universe_manifest.py
          tests/workflows/test_universal_trade_rl_universe_access.py
          tests/workflows/test_universal_trade_rl_data_provenance.py
          tests/workflows/test_universal_trade_rl_run_identity.py
          tests/workflows/test_universal_trade_rl_universe_runner.py
          tests/workflows/test_universal_trade_rl_universe_isolation.py

      - name: Existing Causal Alpha compatibility
        run: >-
          uv run pytest -q
          tests/workflows/test_universal_causal_alpha_v4_fitting.py
          tests/workflows/test_universal_causal_alpha_v5_calibration.py
          tests/workflows/test_universal_causal_alpha_v6_stage_entry.py
          tests/workflows/test_universal_causal_alpha_v7_stage_entry.py
          tests/learning/test_causal_alpha_v9_wave.py
          tests/workflows/test_universal_causal_alpha_v10_stage_entry.py
          tests/workflows/test_universal_causal_alpha_v11_stage_entry.py

      - name: Affected MyPy
        run: >-
          uv run mypy
          trade_rl/domain/universal_trade_rl_universe.py
          trade_rl/workflows/universal_trade_rl_universe_config.py
          trade_rl/workflows/universal_trade_rl_universe_manifest.py
          trade_rl/workflows/universal_trade_rl_universe_access.py
          trade_rl/workflows/universal_trade_rl_data_provenance.py
          trade_rl/workflows/universal_trade_rl_run_identity.py
          trade_rl/workflows/universal_trade_rl_universe_runner.py

      - name: Import architecture
        run: uv run lint-imports

      - name: Build package
        run: uv build

  exact-base-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main and require synchronized ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          feature_sha="$(git rev-parse HEAD)"
          printf 'base_sha=%s\nfeature_sha=%s\n' "$base_sha" "$feature_sha"
          if ! git merge-base --is-ancestor "$base_sha" "$feature_sha"; then
            echo "U0 feature branch is not synchronized with current origin/main" >&2
            echo "Sync current main into the Draft PR branch before comparing regressions." >&2
            exit 1
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "FEATURE_SHA=$feature_sha" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create exact-base worktree and verify lock identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BASE_SHA:-}"
          git worktree add --detach ../trade_rl-base "$BASE_SHA"
          feature_lock="$(sha256sum uv.lock | cut -d' ' -f1)"
          base_lock="$(sha256sum ../trade_rl-base/uv.lock | cut -d' ' -f1)"
          printf 'feature_lock=%s\nbase_lock=%s\n' "$feature_lock" "$base_lock"
          test "$feature_lock" = "$base_lock"

      - name: Install feature and base dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --extra dev --extra export --extra train-sb3
          (
            cd ../trade_rl-base
            uv sync --extra dev --extra export --extra train-sb3
          )

      - name: Run feature full suite with coverage
        shell: bash
        run: |
          set +e
          uv run pytest -q \
            --cov=trade_rl \
            --cov-branch \
            --cov-fail-under=0 \
            --cov-report=json:feature-coverage.json \
            > feature-full.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > feature-rc.txt
          tail -n 80 feature-full.log

      - name: Run exact-base full suite with coverage
        shell: bash
        run: |
          set +e
          (
            cd ../trade_rl-base
            uv run pytest -q \
              --cov=trade_rl \
              --cov-branch \
              --cov-fail-under=0 \
              --cov-report=json:base-coverage.json \
              > base-full.log 2>&1
          )
          rc=$?
          set -e
          printf '%s\n' "$rc" > base-rc.txt
          cp ../trade_rl-base/base-full.log base-full.log
          cp ../trade_rl-base/base-coverage.json base-coverage.json
          tail -n 80 base-full.log

      - name: Compare failure sets and coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def failures(path: str) -> set[str]:
              values: set[str] = set()
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if line.startswith("FAILED "):
                      values.add(line.removeprefix("FAILED ").split(" - ", 1)[0])
                  elif line.startswith("ERROR "):
                      values.add(line.removeprefix("ERROR ").split(" - ", 1)[0])
              return values

          def counts(path: str) -> dict[str, int]:
              text = Path(path).read_text(encoding="utf-8")
              return {
                  name: int(matches[-1]) if matches else 0
                  for name in ("passed", "failed", "skipped", "deselected")
                  if (matches := re.findall(rf"(\d+) {name}", text))
              }

          def coverage(path: str) -> float:
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              return float(payload["totals"]["percent_covered"])

          feature = failures("feature-full.log")
          base = failures("base-full.log")
          feature_rc = int(Path("feature-rc.txt").read_text(encoding="utf-8").strip())
          base_rc = int(Path("base-rc.txt").read_text(encoding="utf-8").strip())
          feature_coverage = coverage("feature-coverage.json")
          base_coverage = coverage("base-coverage.json")
          feature_only = feature - base
          payload = {
              "base_sha": os.environ["BASE_SHA"],
              "feature_sha": os.environ["FEATURE_SHA"],
              "feature_rc": feature_rc,
              "base_rc": base_rc,
              "feature_counts": counts("feature-full.log"),
              "base_counts": counts("base-full.log"),
              "feature_failures": sorted(feature),
              "base_failures": sorted(base),
              "feature_only_failures": sorted(feature_only),
              "base_only_failures": sorted(base - feature),
              "feature_coverage": feature_coverage,
              "base_coverage": base_coverage,
              "coverage_delta": feature_coverage - base_coverage,
          }
          Path("full-suite-comparator.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          errors: list[str] = []
          if feature_only:
              errors.append("feature introduced full-suite failures")
          if base_rc == 0 and feature_rc != 0:
              errors.append("feature full suite failed while current main passed")
          if feature_coverage + 1e-9 < base_coverage:
              errors.append("feature coverage regressed below current main")
          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Compare critical coverage gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f feature-coverage.json || test ! -f base-coverage.json; then
            echo "coverage reports unavailable; earlier comparator setup failed" >&2
            exit 1
          fi
          set +e
          uv run python .github/check_critical_coverage.py \
            feature-coverage.json pyproject.toml \
            > feature-critical.log 2>&1
          feature_rc=$?
          (
            cd ../trade_rl-base
            uv run python .github/check_critical_coverage.py \
              base-coverage.json pyproject.toml \
              > base-critical.log 2>&1
          )
          base_rc=$?
          set -e
          cp ../trade_rl-base/base-critical.log base-critical.log
          printf 'feature_critical_rc=%s\nbase_critical_rc=%s\n' "$feature_rc" "$base_rc"
          cat feature-critical.log
          cat base-critical.log
          if test "$base_rc" -eq 0; then
            test "$feature_rc" -eq 0
          fi

      - name: Upload comparator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: universal-trade-rl-u0-exact-base-comparator
          path: |
            feature-full.log
            base-full.log
            feature-rc.txt
            base-rc.txt
            feature-coverage.json
            base-coverage.json
            full-suite-comparator.json
            feature-critical.log
            base-critical.log
          if-no-files-found: warn
          retention-days: 14
