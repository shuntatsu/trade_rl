name: Verify V10 Lifecycle Hardening

on:
  push:
    branches:
      - codex/v10-execution-lifecycle-hardening

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --extra train-sb3
      - name: Focused lifecycle tests
        run: |
          uv run pytest -q \
            tests/risk/test_pretrade_reduce_only.py \
            tests/rl/test_environment_decision_reduce_only.py \
            tests/rl/test_environment_reduce_only_integration.py \
            tests/learning/test_rollout_execution_lifecycle.py \
            tests/learning/test_causal_alpha_v10_reduce_only.py \
            tests/workflows/test_universal_causal_alpha_v10_reduce_only_environment.py
