name: trade_rl

x-training-image: &training-image
  image: trade-rl-training:${TRADE_RL_GIT_COMMIT:-invalid}
  build:
    context: ..
    dockerfile: docker/Dockerfile.training
    target: training-runtime
    args:
      TRADE_RL_GIT_COMMIT: ${TRADE_RL_GIT_COMMIT:-}
      TRADE_RL_GIT_DIRTY: ${TRADE_RL_GIT_DIRTY:-}
      TRADE_RL_SOURCE_TREE_DIGEST: ${TRADE_RL_SOURCE_TREE_DIGEST:-}
      TRADE_RL_LOCKFILE_DIGEST: ${TRADE_RL_LOCKFILE_DIGEST:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRADE_RL_POSTGRES_DB:-trade_rl}
      POSTGRES_USER: ${TRADE_RL_POSTGRES_USER:-trade_rl}
      POSTGRES_PASSWORD: ${TRADE_RL_POSTGRES_PASSWORD:-trade_rl}
    volumes:
      - trade-rl-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  market-data-sync:
    <<: *training-image
    command:
      - python
      - examples/binance-multitimeframe/sync_market_data.py
      - --cache-root
      - /workspace/market-data/binance-vision
      - --legacy-cache-root
      - /workspace/legacy-var/cache/binance-vision
    environment:
      TRADE_RL_MARKET_DATA_CACHE_ROOT: /workspace/market-data/binance-vision
      TRADE_RL_LEGACY_MARKET_DATA_CACHE_ROOT: /workspace/legacy-var/cache/binance-vision
    volumes:
      - trade-rl-market-archives:/workspace/market-data/binance-vision
      - trade-rl-training-data:/workspace/legacy-var:ro
    restart: "no"

  trainer:
    <<: *training-image
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - examples/binance-multitimeframe/training_bootstrap.py
    gpus: all
    environment:
      TRADE_RL_RUN_GENERATION: ${TRADE_RL_RUN_GENERATION:-}
      TRADE_RL_RESEARCH_PHASE: ${TRADE_RL_RESEARCH_PHASE:-develop}
      TRADE_RL_METADATA_MODE: ${TRADE_RL_METADATA_MODE:-frozen_snapshot}
      TRADE_RL_CONSERVATIVE_STATIC_PATH: ${TRADE_RL_CONSERVATIVE_STATIC_PATH:-}
      TRADE_RL_BINANCE_RULE_HISTORY: ${TRADE_RL_BINANCE_RULE_HISTORY:-}
      TRADE_RL_METADATA_PUBLIC_KEYS: ${TRADE_RL_METADATA_PUBLIC_KEYS:-}
      TRADE_RL_SELECTION_AUTHORIZATION: ${TRADE_RL_SELECTION_AUTHORIZATION:-}
      TRADE_RL_SELECTION_PUBLIC_KEYS: ${TRADE_RL_SELECTION_PUBLIC_KEYS:-}
      TRADE_RL_CONFIRMATION_EVIDENCE: ${TRADE_RL_CONFIRMATION_EVIDENCE:-}
      TRADE_RL_CONFIRMATION_PUBLIC_KEYS: ${TRADE_RL_CONFIRMATION_PUBLIC_KEYS:-}
      TRADE_RL_TRUSTED_NOW: ${TRADE_RL_TRUSTED_NOW:-}
      TRADE_RL_IMAGE_DIGEST: ${TRADE_RL_IMAGE_DIGEST:-}
      TRADE_RL_DATABASE_URL: ${TRADE_RL_DATABASE_URL:-postgresql://${TRADE_RL_POSTGRES_USER:-trade_rl}:${TRADE_RL_POSTGRES_PASSWORD:-trade_rl}@postgres:5432/${TRADE_RL_POSTGRES_DB:-trade_rl}}
      TRADE_RL_POSTGRES_MARKET_DATA: ${TRADE_RL_POSTGRES_MARKET_DATA:-false}
      TRADE_RL_DYNAMIC_SYMBOL_TRIPLETS: ${TRADE_RL_DYNAMIC_SYMBOL_TRIPLETS:-false}
      TRADE_RL_SYMBOL_TRIPLET_SEED: ${TRADE_RL_SYMBOL_TRIPLET_SEED:-20260729}
      TRADE_RL_SYMBOL_TRIPLET_TRAIN_SLOT: ${TRADE_RL_SYMBOL_TRIPLET_TRAIN_SLOT:-0}
      TRADE_RL_FULL_TRAINING_TEMPLATE: ${TRADE_RL_FULL_TRAINING_TEMPLATE:-}
      TRADE_RL_MARKET_DATA_CACHE_ROOT: /workspace/market-data/binance-vision
      TRADE_RL_TEACHER_CACHE_ROOT: /workspace/var/cache/teacher-artifacts
      TRADE_RL_NORMALIZER_CACHE_ROOT: /workspace/var/cache/normalizers
      TRADE_RL_REUSABLE_ARTIFACT_CATALOG: "true"
      TRADE_RL_FROZEN_METADATA_CACHE_ROOT: /workspace/var/cache/frozen-metadata/usds-m
      TRADE_RL_PREPROCESS_WORKERS: "8"
      # Even two concurrent full-market probe environments exceed Docker
      # Desktop's 15.5 GiB limit. Keep this diagnostic serial; the expensive
      # normalizer, teacher, and PPO phases remain independently parallelized.
      TRADE_RL_LAGRANGIAN_PROBE_WORKERS: "1"
      # Oracle Bellman generation has one numerical owner. Episode batching is
      # controlled by the solver contract rather than multiple CUDA processes.
      TRADE_RL_TEACHER_WORKERS: "1"
      TRADE_RL_ORACLE_SOLVER: ${TRADE_RL_ORACLE_SOLVER:-numpy}
      TRADE_RL_ORACLE_EPISODE_BATCH_SIZE: ${TRADE_RL_ORACLE_EPISODE_BATCH_SIZE:-8}
      TRADE_RL_ORACLE_TARGET_STATE_BLOCK_SIZE: ${TRADE_RL_ORACLE_TARGET_STATE_BLOCK_SIZE:-}
      TRADE_RL_ORACLE_CUDA_MEMORY_FRACTION: ${TRADE_RL_ORACLE_CUDA_MEMORY_FRACTION:-0.65}
      # Compiled Oracle execution remains unavailable until fixed-chunk CUDA
      # parity and performance evidence pass on maintained hardware.
      TRADE_RL_ORACLE_COMPILE_MODE: "disabled"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      # Bound the persistent Inductor subprocess pool on memory-constrained hosts.
      TORCHINDUCTOR_COMPILE_THREADS: "4"
    volumes:
      - trade-rl-market-archives:/workspace/market-data/binance-vision:ro
      - trade-rl-training-data:/workspace/var
      - type: bind
        source: ${TRADE_RL_EVIDENCE_ROOT:-../var/evidence}
        target: /workspace/evidence
        read_only: true

  studio-api:
    <<: *training-image
    image: trade-rl-studio:${TRADE_RL_GIT_COMMIT:-invalid}
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
      target: studio-runtime
      args:
        TRADE_RL_GIT_COMMIT: ${TRADE_RL_GIT_COMMIT:-}
        TRADE_RL_GIT_DIRTY: ${TRADE_RL_GIT_DIRTY:-}
        TRADE_RL_SOURCE_TREE_DIGEST: ${TRADE_RL_SOURCE_TREE_DIGEST:-}
        TRADE_RL_LOCKFILE_DIGEST: ${TRADE_RL_LOCKFILE_DIGEST:-}
    command:
      - trade-rl
      - studio
      - start
      - --project-root
      - /workspace
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --allow-container-bind
    gpus: all
    environment:
      TRADE_RL_STUDIO_CONTAINER_BIND: "true"
      TRADE_RL_STUDIO_DATASET_ROOTS: /workspace/var/runs
      TRADE_RL_STUDIO_RUN_ROOTS: /workspace/var
      TRADE_RL_STUDIO_CONFIG_ROOTS: /workspace/examples
      TRADE_RL_STUDIO_JOB_ROOT: /workspace/var/studio/jobs
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - trade-rl-training-data:/workspace/var
    restart: unless-stopped

volumes:
  trade-rl-postgres:
  trade-rl-market-archives:
    name: trade-rl-market-archives
  trade-rl-training-data:
    name: trade-rl-training-data
