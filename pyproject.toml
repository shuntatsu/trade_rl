[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-rl"
dynamic = ["version"]
description = "Lean causal trading research core"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "gymnasium==0.29.1",
]

[project.optional-dependencies]
forecast-gbm = [
    "lightgbm[scikit-learn]==4.7.0",
]
train-sb3 = [
    "stable-baselines3==2.3.2",
    "torch==2.4.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    "hypothesis>=6.120.0",
    "scipy>=1.14,<1.18",
]

[tool.setuptools.dynamic]
version = {attr = "trade_rl._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["trade_rl*"]

[tool.uv]
required-version = "==0.10.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trade_rl", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["trade_rl"]
exclude = ["^tests/", "^examples/"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "gymnasium.*",
    "stable_baselines3.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["trade_rl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
precision = 2
