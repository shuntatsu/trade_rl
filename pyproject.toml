[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-rl"
dynamic = ["version"]
description = "Baseline-anchored residual reinforcement learning for portfolio research"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "gymnasium==0.29.1",
    "packaging<24.0",
    "cryptography==49.0.0",
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.128,<0.140",
    "uvicorn>=0.48,<0.52",
]
train-sb3 = [
    "stable-baselines3==2.3.2",
    "sb3-contrib==2.3.0",
    "torch==2.4.1",
    "tensorboard>=2.17,<3",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
oracle = [
    "scipy>=1.14,<1.18",
]
nautilus = [
    "nautilus_trader==1.230.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "mypy>=1.14.0",
    "hypothesis>=6.120.0",
    "import-linter>=2.1",
    "vulture>=2.14",
    "PyYAML==6.0.3",
    "httpx2>=2.7,<3",
    "scipy>=1.14,<1.18",
    "fastapi>=0.128,<0.140",
    "uvicorn>=0.48,<0.52",
]
export = [
    "onnx==1.16.2",
    "onnxruntime==1.18.1",
]

[project.scripts]
trade-rl = "trade_rl.cli:main"
trade-rl-causal-alpha-v5 = "trade_rl.workflows.universal_causal_alpha_v5_runner:cli_main"
trade-rl-causal-alpha-v6 = "trade_rl.workflows.universal_causal_alpha_v6_runner:cli_main"
trade-rl-causal-alpha-v7 = "trade_rl.workflows.universal_causal_alpha_v7_runner:cli_main"

[tool.setuptools.dynamic]
version = {attr = "trade_rl._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["trade_rl*"]

[tool.setuptools.package-data]
"trade_rl.catalog.sql" = ["*.sql"]

[tool.uv]
required-version = "==0.10.0"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trade_rl", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["trade_rl"]
exclude = [
    "^tests/",
    "^examples/",
    "^frontend/",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "gymnasium.*",
    "stable_baselines3.*",
    "sb3_contrib.*",
    "onnx.*",
    "onnxruntime.*",
    "torch.*",
    "tensorboard.*",
    "psycopg.*",
    "nautilus_trader.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"
markers = [
    "postgres: requires a live PostgreSQL test database",
    "nautilus: requires the exact optional NautilusTrader runtime",
]

[tool.coverage.run]
source = ["trade_rl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.trade_rl.critical_coverage]
metric = "branch"
target = 90.0

[tool.trade_rl.critical_coverage.files]
"trade_rl/simulation/accounting.py" = 93.0
"trade_rl/simulation/execution.py" = 90.0
"trade_rl/risk/pretrade.py" = 90.0
"trade_rl/rl/rewards.py" = 97.0
"trade_rl/evaluation/gates.py" = 100.0
"trade_rl/evaluation/perfect_information_bound.py" = 100.0
"trade_rl/evaluation/_perfect_information_lp.py" = 100.0
"trade_rl/telemetry/_indexed_storage.py" = 72.1
"trade_rl/rl/training_telemetry.py" = 78.5
"trade_rl/rl/environment.py" = 85.0
"trade_rl/rl/environment_observation_contract.py" = 100.0
"trade_rl/rl/environment_provider_contract.py" = 100.0
"trade_rl/rl/environment_runtime_services.py" = 100.0
"trade_rl/rl/environment_portfolio_risk_contract.py" = 100.0
"trade_rl/rl/environment_policy_schedule_contract.py" = 100.0
"trade_rl/rl/environment_initial_state.py" = 100.0
"trade_rl/rl/environment_reward_execution_resources.py" = 100.0
"trade_rl/workflows/release_packaging.py" = 90.0
"trade_rl/serving/training_environment.py" = 100.0

[tool.trade_rl.critical_coverage.groups.artifacts]
minimum = 90.0
paths = [
    "trade_rl/artifacts/codec.py",
    "trade_rl/artifacts/run_manifest.py",
    "trade_rl/artifacts/signals.py",
    "trade_rl/artifacts/store.py",
]

[tool.trade_rl.critical_coverage.groups.serving]
minimum = 90.0
paths = [
    "trade_rl/serving/bundle.py",
    "trade_rl/serving/registry.py",
    "trade_rl/serving/runtime.py",
]

[tool.trade_rl.critical_coverage.groups.environment_runtime]
minimum = 64.0
paths = [
    "trade_rl/rl/environment_episode.py",
    "trade_rl/rl/environment_execution.py",
    "trade_rl/rl/environment_observation.py",
    "trade_rl/rl/environment_transition.py",
]

[tool.trade_rl.critical_coverage.groups.environment_step_services]
minimum = 86.8
paths = [
    "trade_rl/rl/environment_decision.py",
    "trade_rl/rl/environment_risk.py",
    "trade_rl/rl/environment_reward.py",
    "trade_rl/rl/environment_info.py",
]

[tool.trade_rl.critical_coverage.groups.stateful_execution_services]
minimum = 93.0
paths = [
    "trade_rl/simulation/stateful_runtime.py",
    "trade_rl/simulation/stateful_bar_lifecycle.py",
    "trade_rl/simulation/stateful_order_transitions.py",
    "trade_rl/simulation/stateful_symbol_fills.py",
]

[tool.importlinter]
root_package = "trade_rl"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Trade RL responsibility layers"
type = "layers"
layers = [
    "trade_rl.cli",
    "trade_rl.operations",
    "trade_rl.studio",
    "trade_rl.reporting",
    "trade_rl.workflows",
    "trade_rl.integrations",
    "trade_rl.serving",
    "trade_rl.learning",
    "trade_rl.rl",
    "trade_rl.risk",
    "trade_rl.simulation",
    "trade_rl.strategies",
    "trade_rl.data",
    "trade_rl.catalog",
    "trade_rl.evaluation",
    "trade_rl.release",
    "trade_rl.artifacts",
    "trade_rl.telemetry",
    "trade_rl.domain",
]

[[tool.importlinter.contracts]]
id = "domain"
name = "Domain remains standard-library only"
type = "forbidden"
source_modules = [
    "trade_rl.domain",
]
forbidden_modules = [
    "numpy",
    "gymnasium",
    "stable_baselines3",
    "torch",
    "trade_rl.telemetry",
    "trade_rl.artifacts",
    "trade_rl.release",
    "trade_rl.evaluation",
    "trade_rl.data",
    "trade_rl.strategies",
    "trade_rl.simulation",
    "trade_rl.risk",
    "trade_rl.rl",
    "trade_rl.learning",
    "trade_rl.serving",
    "trade_rl.integrations",
    "trade_rl.workflows",
    "trade_rl.studio",
    "trade_rl.operations",
    "trade_rl.cli",
]

